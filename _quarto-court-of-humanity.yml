project:
  type: website
  output-dir: _site/court-of-humanity
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "⚖️"
  index-source: knowledge/solution/court-of-humanity.qmd
  redirect-from: https://court-of-humanity.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  netlify-site-id: ""  # TODO: create Netlify site and add ID
  netlify-cname: "court-of-humanity-warondisease-org.netlify.app"
  show-confidence-intervals: true
  concept-terms:
    - term: "Court of Humanity"
      manual-target: knowledge/solution/court-of-humanity.qmd
    - term: "Sovereign Immunity"
      manual-target: knowledge/solution/court-of-humanity.qmd
  favicon-prompt: "A scales-of-justice icon held aloft by many small human silhouettes, in stark black and white retro-academic style"

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The Court of Humanity"
  description: "A decentralized court where 8 billion humans are the jury, sovereign immunity is a choice nobody chose, and ~$104 quadrillion in unliquidated wrongful-death exposure makes the 1% Treaty the most generous settlement offer in legal history."
  site-url: https://manual.warondisease.org/knowledge/appendix/court-of-humanity-paper.html
  favicon: assets/icons/court-of-humanity-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/court-of-humanity.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

