project:
  type: website
  output-dir: _site/wishocracy
  execute-dir: project
  resources:
    - assets/
    - _redirects
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd

# Custom fields for render-quarto.py
dih-render:
  index-source: knowledge/appendix/wishocracy-paper.qmd
  target-url: https://manual.WarOnDisease.org  # For cross-site link rewriting

profiles:
  default:
    dotenv:
      allowEmptyValues: true

website:
  title: "Wishocracy: Scalable Preference Aggregation for Public Goods Allocation Using Collective Intelligence"
  description: "A mechanism for solving the democratic principal-agent problem through collective intelligence and pairwise preference aggregation"
  site-url: https://paper.wishocracy.org
  favicon: assets/icons/wishocracy-favicon.png
  page-navigation: true
  navbar:
    left:
      - text: "Paper"
        href: /
      - text: "App"
        href: https://wishocracy.org
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /wishocracy-rappa-paper.pdf
      - text: "References"
        href: /#references
      - text: "DIH"
        href: https://dih.earth
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

metadata:
  creator: "Mike P. Sinn"
  primary-author: "Mike P. Sinn, Decentralized Institutes of Health"
  byline: "Mike P. Sinn, Decentralized Institutes of Health"
  human-author: "Mike P. Sinn"
  author-email: "mike@warondisease.org"
  author-url: "https://wishocracy.org"
  author-website: "https://wishocracy.org"
  contact: "mike@warondisease.org"
  # title: Removed - each page defines its own title in frontmatter
  # description: Removed from metadata section to allow page-level descriptions to override for og:description
  # (Website-level description is already set in the 'website' section above)
  # abstract: Removed - pages can define their own abstract in frontmatter if needed
  language: "en-US"
  subject: "Mechanism Design, Collective Intelligence, Direct Democracy, Principal-Agent Problem, Public Resource Allocation"
  category: "Academic Paper, Public Policy, Political Science"
  keywords:
    - mechanism-design
    - collective-intelligence
    - direct-democracy
    - principal-agent-problem
    - preference-aggregation
    - participatory-budgeting
    - analytic-hierarchy-process
    - democratic-resource-allocation
    - wishocracy
    - RAPPA
    - democratic-innovation
  version: "0.9"
  edition: "Working Draft"
  copyright: "© 2025 Mike P. Sinn"
  copyright-year: "2025"
  license: "CC BY-NC 4.0"
  license-url: "https://creativecommons.org/licenses/by-nc/4.0/"
  rights: "Creative Commons Attribution-NonCommercial 4.0 International License"
  publisher: "Decentralized Institutes of Health"
  publisher-url: "https://dih.earth"
  publisher-name: "Mike P. Sinn"
  publisher-email: "mike@warondisease.org"
  repo-url: "https://github.com/mikepsinn/wishocracy"
  issue-url: "https://github.com/mikepsinn/wishocracy/issues"
  source-url: "https://github.com/mikepsinn/disease-eradication-plan"
  geographic-coverage: "Global"
  audience: "Researchers, Policy Makers, Democracy Innovators, Political Scientists"
  format: "Working Paper"
  type: "Academic"
  genre: "Political Science, Mechanism Design, Public Policy"
  medium: "Digital"
  twitter-site: "@thinkbynumbers"
  twitter-creator: "@thinkbynumbers"
  og-site-name: "Wishocracy"

  # Open Graph metadata (enables per-page custom OG images)
  open-graph: true
  image: "https://wishocracy.org/assets/wishocracy-og-1200x630.png"

# Remove "Appendix" prefix
language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

jupyter: dih-project-kernel

format:
  html:
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: false
    toc: true
    toc-depth: 3
    # Grid layout for proper sidebar positioning
    # See: https://quarto.org/docs/output-formats/page-layout.html#grid-customization
    grid:
      body-width: 800px
      sidebar-width: 0px
      margin-width: 250px
      gutter-width: 1.5rem
    css:
      - styles.css
      - economics-overrides.css
    include-before-body:
      - file: assets/html/page-loader.html
    include-after-body:
      - text: |
          <script>
            (function() {
              var offset = document.querySelector('meta[name="quarto:offset"]')?.getAttribute('content') || '';
              var script = document.createElement('script');
              script.src = (offset ? offset : '') + 'assets/js/site-enhancements.js';
              document.body.appendChild(script);
            })();
          </script>
    page-footer:
      left: "© 2025 [Mike P. Sinn](https://mikesinn.com) and Contributors | Working Draft v0.9"
      center: "[CC BY-NC 4.0 license](https://creativecommons.org/licenses/by-nc/4.0/)"
      right: "[Wishocracy.org](https://wishocracy.org)"
    include-in-footer:
      - text: |
          <div style="text-align: center; padding: 1rem; border-top: 1px solid #d4c5b9; margin-top: 3rem; color: #8b7355; font-size: 0.9rem;">
            <p style="margin: 0.5rem 0;">
              © 2025 <a href="https://mikesinn.com" style="color: #8b7355;">Mike P. Sinn</a> |
              <a href="https://creativecommons.org/licenses/by-nc/4.0/" style="color: #8b7355;">CC BY-NC 4.0 license</a> |
              <a href="https://wishocracy.org" style="color: #8b7355;">Wishocracy.org</a>
            </p>
            <p style="margin: 0.5rem 0; font-size: 0.85rem;">
              <a href="https://dih.earth" style="color: #8b7355;">Decentralized Institutes of Health</a>
            </p>
            <p style="margin: 0.5rem 0; font-size: 0.85rem;">
              <strong>Download:</strong> 
              <a href="/wishocracy-rappa-paper.pdf" style="color: #8b7355;">📕 PDF</a>
            </p>
          </div>
    include-in-header:
      - text: |
          <!-- Icons -->
          <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/wishocracy-favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/wishocracy-favicon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/wishocracy-apple-touch-icon.png">
          <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/wishocracy-android-chrome-192x192.png">
          <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/wishocracy-android-chrome-512x512.png">

          <!-- Google Analytics -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-8PZYCKQBTY"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-8PZYCKQBTY');
          </script>

          <!-- Hypothesis for inline comments -->
          <script src="https://hypothes.is/embed.js" async></script>

          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  pdf:
    output-file: "wishocracy-rappa-paper.pdf"
    documentclass: article
    echo: false
    toc: true
    toc-depth: 3
    number-sections: false
    colorlinks: true
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    date: ""
    variables:
      author: "Mike P. Sinn"
      affiliation: "Decentralized Institutes of Health"
