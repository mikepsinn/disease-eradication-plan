# Remove "Appendix" prefix
language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

# Bibliography: .bib generated from knowledge/references.qmd (source data)
# Regenerate: python scripts/generate-everything-parameters-variables-calculations-references.py
bibliography: references-wishocracy.bib
csl: nature-annotated.csl  # Renders 'abstract' field (quotes) in bibliography

jupyter: dih-project-kernel

format:
  html:
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: false
    toc: true
    toc-depth: 3
    # Grid layout for proper sidebar positioning
    # See: https://quarto.org/docs/output-formats/page-layout.html#grid-customization
    grid:
      body-width: 800px
      sidebar-width: 0px
      margin-width: 250px
      gutter-width: 1.5rem
    css:
      - styles.css
      - economics-overrides.css
    include-before-body:
      - file: assets/html/page-loader.html
    include-after-body:
      - text: |
          <script>
            (function() {
              var offset = document.querySelector('meta[name="quarto:offset"]')?.getAttribute('content') || '';
              var script = document.createElement('script');
              script.src = (offset ? offset : '') + 'assets/js/site-enhancements.js';
              document.body.appendChild(script);
            })();
          </script>
    page-footer:
      left: "© 2025 [Mike P. Sinn](https://mikesinn.com) and Contributors | Working Draft v0.9"
      center: "[CC BY-NC 4.0 license](https://creativecommons.org/licenses/by-nc/4.0/)"
      right: "[Wishocracy.org](https://wishocracy.org)"
    include-in-footer:
      - text: |
          <div style="text-align: center; padding: 1rem; border-top: 1px solid #d4c5b9; margin-top: 3rem; color: #8b7355; font-size: 0.9rem;">
            <p style="margin: 0.5rem 0;">
              © 2025 <a href="https://mikesinn.com" style="color: #8b7355;">Mike P. Sinn</a> |
              <a href="https://creativecommons.org/licenses/by-nc/4.0/" style="color: #8b7355;">CC BY-NC 4.0 license</a> |
              <a href="https://wishocracy.org" style="color: #8b7355;">Wishocracy.org</a>
            </p>
            <p style="margin: 0.5rem 0; font-size: 0.85rem;">
              <a href="https://dih.earth" style="color: #8b7355;">Decentralized Institutes of Health</a>
            </p>
            <p style="margin: 0.5rem 0; font-size: 0.85rem;">
              <strong>Download:</strong> 
              <a href="/wishocracy-rappa-paper.pdf" style="color: #8b7355;">📕 PDF</a>
            </p>
          </div>
    include-in-header:
      - text: |
          <!-- Icons -->
          <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/wishocracy-favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/wishocracy-favicon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/wishocracy-apple-touch-icon.png">
