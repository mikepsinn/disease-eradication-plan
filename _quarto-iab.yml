# Remove "Appendix" prefix
language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

# Bibliography: Single source of truth for all citations
bibliography: references.bib
csl: nature-annotated.csl  # Renders 'abstract' field (quotes) in bibliography

jupyter: dih-project-kernel

format:
  html:
    lightbox: auto
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: false
    toc: true
    toc-depth: 3
    css:
      - styles.css
      - economics-overrides.css
    include-before-body:
      - file: assets/html/page-loader.html
    include-after-body:
      - file: assets/html/site-enhancements-loader.html
    include-in-footer:
      - file: assets/html/generated-footer.html
    include-in-header:
      - text: |
          <!-- Icons (project-specific) -->
          <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/iab-favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/iab-favicon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/iab-apple-touch-icon.png">
          <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/iab-android-chrome-192x192.png">
          <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/iab-android-chrome-512x512.png">
      - file: assets/html/google-analytics.html
      - file: assets/html/hypothesis.html
      - file: assets/html/fonts-preload.html
    citation-hover: true
    code-fold: true
    link-citations: true
    smooth-scroll: true
    code-tools: false
    filters: [assets/filters/live-version-note.lua]
  pdf:
    output-file: "incentive-alignment-bonds-paper.pdf"
    documentclass: article
    institute: "Institute for Accelerated Medicine"
    echo: false
    toc: true
    toc-depth: 3
    number-sections: false
    colorlinks: true
    link-citations: true
    include-in-header:
      - callout-bw.tex
      - institute-header.tex
      - text: |
          \paperurl{https://manual.warondisease.org/knowledge/appendix/incentive-alignment-bonds-paper.html}
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    date: ""
    filters: [assets/filters/live-version-note.lua]
