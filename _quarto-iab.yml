project:
  type: website
  output-dir: _site/iab
  execute-dir: project
  resources:
    - assets/
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd

profiles:
  default:
    dotenv:
      allowEmptyValues: true

website:
  title: "Incentive Alignment Bonds"
  description: "A Mechanism for Aligning Political Incentives with Public Welfare Through Conditional Electoral Support"
  site-url: https://iab.dih.earth
  favicon: assets/icons/dih-icon-square.png
  page-navigation: true
  navbar:
    left:
      - text: "Paper"
        href: /
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /index.pdf
      - text: "References"
        href: /#references
      - text: "DIH"
        href: https://dih.earth
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

metadata:
