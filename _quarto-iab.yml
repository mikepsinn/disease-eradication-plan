jupyter: dih-project-kernel

format:
  html:
    lightbox: auto
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: false
    toc: true
    toc-depth: 3
    css:
      - styles.css
      - economics-overrides.css
    include-before-body:
      - file: assets/html/page-loader.html
    include-after-body:
      - file: assets/html/site-enhancements-loader.html
    include-in-footer:
