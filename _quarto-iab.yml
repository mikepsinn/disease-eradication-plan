  author-url: "https://iab.dih.earth"
  author-website: "https://iab.dih.earth"
  contact: "mike@warondisease.org"
  title: "Incentive Alignment Bonds: A Mechanism for Aligning Political Incentives with Public Welfare"
  description: "A mechanism design for inducing welfare-maximizing behavior in political agents through conditional electoral support, post-office opportunities, and legacy benefits tied to performance on public good provision"
  abstract: "Politicians systematically underinvest in public goods and overprovide concentrated benefits to organized interests. We propose Incentive Alignment Bonds (IABs): a mechanism that ties electoral support, post-office career opportunities, and legacy benefits to measurable outcomes on public good provision. By making politician utility functions depend on scores derived from their voting records on prioritized programs, IABs transform rent-seeking incentives into welfare-maximizing ones."
  language: "en-US"
  subject: "Mechanism Design, Political Economy, Public Choice, Electoral Reform"
  category: "Academic Paper, Public Policy, Political Science, Economics"
  keywords:
    - mechanism-design
    - political-economy
    - public-choice
    - electoral-reform
    - incentive-alignment
    - public-goods
    - political-incentives
    - governance
    - collective-action
    - rent-seeking
    - PAC
    - campaign-finance
