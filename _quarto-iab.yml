project:
  type: website
  output-dir: _site/iab
  execute-dir: project
  resources:
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "💰"
  index-source: knowledge/appendix/incentive-alignment-bonds-paper.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "8f7611db-1075-48a2-abd8-7f77f55538f9"
  netlify-cname: "iab-warondisease.netlify.app"
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "Letters 'IAB' inside a certificate/ribbon badge shape."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: feedback@dih.earth
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Decentralized Institutes of Health (DIH)"
        url: https://dih.earth

website:
  title: "Incentive Alignment Bonds: Making Public Goods Financially and Politically Profitable"
  description: "Government spending is optimized for lobbying intensity, not net societal value. Programs with 100:1 benefit-cost ratios get billions while programs with negative returns get hundreds of billions. Incentive Alignment Bonds flip this by creating a capital pool that rewards politicians (via campaign support and post-office opportunities) for funding high-NSV programs over low-NSV alternatives. The result: public good becomes private profit for both investors and elected officials."
  site-url: https://iab.warondisease.org
  favicon: assets/icons/iab-favicon.png
  page-navigation: true
  navbar:
    left:
      - text: "Paper"
        href: /
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /incentive-alignment-bonds-paper.pdf
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "References"
        href: /#references
      - text: "DIH"
        href: https://dih.earth
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

