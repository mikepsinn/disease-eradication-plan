  \end{aligned}

  $$'
disease_vs_war_deaths_ratio: '<a href="/knowledge/appendix/parameters-and-calculations#sec-disease_vs_war_deaths_ratio"
  class="parameter-link" data-source-ref="/knowledge/economics/economics.qmd" data-source-type="definition"
