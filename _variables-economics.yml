  (arthritis, depression, chronic pain) are also addressable through research, so
  the percentage is similar to deaths. | Unit: percentage | Core definition">92.6%
  (95% CI: 50%-98%)</span>'
eventually_avoidable_death_pct: '<span class="parameter-definition" title="Percentage
  of deaths that are eventually avoidable with sufficient biomedical research and
  technological advancement. Central estimate ~92% based on ~7.9% fundamentally unavoidable
  (primarily accidents). Wide uncertainty reflects debate over: (1) aging as addressable
  vs. fundamental, (2) asymptotic difficulty of last diseases, (3) multifactorial
  disease complexity. | Unit: percentage | Core definition">92.6% (95% CI: 50%-98%)</span>'
eventually_avoidable_death_pct_latex: '$$

