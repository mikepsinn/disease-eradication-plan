drug_cost_increase_1980s_to_current_multiplier: '<a href="/knowledge/appendix/parameters-and-calculations#sec-drug_cost_increase_1980s_to_current_multiplier"
  class="parameter-link" data-source-ref="pre-1962-drug-costs-timeline" data-source-type="calculated"
