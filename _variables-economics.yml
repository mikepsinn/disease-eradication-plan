"treaty_recurring_benefits_annual_latex": "$$\n\\begin{aligned}\nBenefit_{recur,ann}\
  \ = Benefit_{RD,ann} + Benefit_{peace,soc} = \\$58.6B + \\$114B = \\$172B\n\\\\\
  [0.5em]\n\\text{where } Benefit_{RD,ann} = Spending_{trials} \\times Reduce_{pct}\
  \ = \\$60B \\times 97.7\\% = \\$58.6B\n\\\\[0.5em]\n\\text{where } Reduce_{pct}\
  \ = 1 - \\frac{Cost_{pragmatic,pt}}{Cost_{P3,pt}} = 1 - \\frac{\\$929}{\\$41K} =\
  \ 97.7\\%\n\\\\[0.5em]\n\\text{where } Benefit_{peace,soc} = Cost_{war,total} \\\
  times Reduce_{treaty} = \\$11.4T \\times 1\\% = \\$114B\n\\\\[0.5em]\n\\text{where\
  \ } Cost_{war,total} = Cost_{war,direct} + Cost_{war,indirect} = \\$7.66T + \\$3.7T\
  \ = \\$11.4T\n\\\\[0.5em]\n\\text{where } Cost_{war,direct} = Loss_{life,conflict}\
  \ + Damage_{infra,total} + Disruption_{trade} + Spending_{mil} = \\$2.45T + \\$1.88T\
  \ + \\$616B + \\$2.72T = \\$7.66T\n\\\\[0.5em]\n\\text{where } Loss_{life,conflict}\
  \ = Cost_{combat,human} + Cost_{state,human} + Cost_{terror,human} = \\$2.34T +\
  \ \\$27B + \\$83B = \\$2.45T\n\\\\[0.5em]\n\\text{where } Cost_{combat,human} =\
  \ Deaths_{combat} \\times VSL = 234{,}000 \\times \\$10M = \\$2.34T\n\\\\[0.5em]\n\
  \\text{where } Cost_{state,human} = Deaths_{state} \\times VSL = 2{,}700 \\times\
  \ \\$10M = \\$27B\n\\\\[0.5em]\n\\text{where } Cost_{terror,human} = Deaths_{terror}\
  \ \\times VSL = 8{,}300 \\times \\$10M = \\$83B\n\\\\[0.5em]\n\\text{where } Damage_{infra,total}\
  \ = Damage_{comms} + Damage_{edu} + Damage_{energy} + Damage_{health} + Damage_{transport}\
  \ + Damage_{water} = \\$298B + \\$234B + \\$422B + \\$166B + \\$487B + \\$268B =\
  \ \\$1.88T\n\\\\[0.5em]\n\\text{where } Disruption_{trade} = Disruption_{currency}\
  \ + Disruption_{energy} + Disruption_{shipping} + Disruption_{supply} = \\$57.4B\
  \ + \\$125B + \\$247B + \\$187B = \\$616B\n\\\\[0.5em]\n\\text{where } Cost_{war,indirect}\
  \ = Damage_{env} + Loss_{growth,mil} + Loss_{capital,conflict} + Cost_{psych} +\
