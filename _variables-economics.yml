efficacy_lag_years: '<a href="/knowledge/appendix/parameters-and-calculations#sec-efficacy_lag_years"
  class="parameter-link" data-source-ref="bio-clinical-development-2021" data-source-type="external"
  data-peer-reviewed="true" data-confidence="medium" title="Regulatory delay for efficacy
  testing (Phase II/III) post-safety verification. Based on BIO 2021 industry survey.
