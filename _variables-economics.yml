  \ \\times DW_{chronic} = 416M \\times 6 \\times 0.35 = 873M\n\\\\[0.5em]\n\\text{where\
  \ } Deaths_{lag} = ANNUAL\\_DEATHS \\times EFFICACY\\_LAG\\_YEARS \\times EVENTUALLY\\\
