"medical_research_pct_of_disease_burden": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-medical_research_pct_of_disease_burden\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/economics/economics.qmd\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Medical research\
  \ spending as percentage of total disease burden | Calculated from 2 inputs | ✓\
  \ High confidence | Formula: MED_RESEARCH ÷ TOTAL_BURDEN | Unit: rate | Click to\
  \ view details, calculation & sources\">0.0525% (95% CI: 0.0474%-0.0588%)</a>"
"medical_research_pct_of_disease_burden_latex": "$$\n\\begin{aligned}\nPct_{RD:burden}\
  \ = \\frac{Spending_{RD}}{Cost_{health+war}} = \\frac{\\$67.5B}{\\$129T} = 0.0525\\\
  %\n\\\\[0.5em]\n\\text{where } Cost_{health+war} = Cost_{war,total} + Burden_{disease}\
  \ + Spending_{symptom} = \\$11.4T + \\$109T + \\$8.2T = \\$129T\n\\\\[0.5em]\n\\\
  text{where } Cost_{war,total} = Cost_{war,direct} + Cost_{war,indirect} = \\$7.66T\
  \ + \\$3.7T = \\$11.4T\n\\\\[0.5em]\n\\text{where } Cost_{war,direct} = Loss_{life,conflict}\
  \ + Damage_{infra,total} + Disruption_{trade} + Spending_{mil} = \\$2.45T + \\$1.88T\
  \ + \\$616B + \\$2.72T = \\$7.66T\n\\\\[0.5em]\n\\text{where } Loss_{life,conflict}\
  \ = Cost_{combat,human} + Cost_{state,human} + Cost_{terror,human} = \\$2.34T +\
  \ \\$27B + \\$83B = \\$2.45T\n\\\\[0.5em]\n\\text{where } Cost_{combat,human} =\
  \ Deaths_{combat} \\times VSL = 234{,}000 \\times \\$10M = \\$2.34T\n\\\\[0.5em]\n\
  \\text{where } Cost_{state,human} = Deaths_{state} \\times VSL = 2{,}700 \\times\
  \ \\$10M = \\$27B\n\\\\[0.5em]\n\\text{where } Cost_{terror,human} = Deaths_{terror}\
  \ \\times VSL = 8{,}300 \\times \\$10M = \\$83B\n\\\\[0.5em]\n\\text{where } Damage_{infra,total}\
  \ = Damage_{comms} + Damage_{edu} + Damage_{energy} + Damage_{health} + Damage_{transport}\
  \ + Damage_{water} = \\$298B + \\$234B + \\$422B + \\$166B + \\$487B + \\$268B =\
  \ \\$1.88T\n\\\\[0.5em]\n\\text{where } Disruption_{trade} = Disruption_{currency}\
  \ + Disruption_{energy} + Disruption_{shipping} + Disruption_{supply} = \\$57.4B\
  \ + \\$125B + \\$247B + \\$187B = \\$616B\n\\\\[0.5em]\n\\text{where } Cost_{war,indirect}\
  \ = Damage_{env} + Loss_{growth,mil} + Loss_{capital,conflict} + Cost_{psych} +\
  \ Cost_{refugee} + Cost_{vet} = \\$100B + \\$2.72T + \\$300B + \\$232B + \\$150B\
  \ + \\$200B = \\$3.7T\n\\\\[0.5em]\n\\text{where } Burden_{disease} = Cost_{medical,direct}\
  \ + Loss_{life,disease} + Loss_{productivity} = \\$9.9T + \\$94.2T + \\$5T = \\\
  $109T\n\\end{aligned}\n$$"
