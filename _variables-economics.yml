  &= \frac{55M}{245{,}000} \\

  &= 225

  \end{aligned}

  $$'
diseases_without_effective_treatment: '<a href="/knowledge/appendix/parameters-and-calculations#sec-diseases_without_effective_treatment"
  class="parameter-link" data-source-ref="rare-disease-only-5pct-have-treatment" data-source-type="calculated"
  data-confidence="medium" title="Number of diseases without effective treatment.
