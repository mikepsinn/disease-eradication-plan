"dih_treasury_trial_subsidies_pct_latex": "$$\n\\begin{aligned}\nPct_{subsidies} =\
  \ \\frac{Subsidies_{trial,ann}}{Funding_{treaty}} = \\frac{\\$21.7B}{\\$27.2B} =\
  \ 79.9\\%\n\\\\[0.5em]\n\\text{where } Subsidies_{trial,ann} = \\left\\lfloor \\\
  frac{Treasury_{RD,ann}}{OPEX_{dFDA}} \\right\\rfloor = \\left\\lfloor \\frac{\\\
  $21.8B}{\\$40M} \\right\\rfloor = \\$21.7B\n\\\\[0.5em]\n\\text{where } OPEX_{dFDA}\
  \ = Cost_{platform} + Cost_{staff} + Cost_{infra} + Cost_{regulatory} + Cost_{community}\
  \ = \\$15M + \\$10M + \\$8M + \\$5M + \\$2M = \\$40M\n\\\\[0.5em]\n\\text{where\
  \ } Treasury_{RD,ann} = Funding_{treaty} - Payout_{bond,ann} - Funding_{political,ann}\
  \ = \\$27.2B - \\$2.72B - \\$2.72B = \\$21.8B\n\\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ = Spending_{mil} \\times Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\
  \\[0.5em]\n\\text{where } Payout_{bond,ann} = Funding_{treaty} \\times Pct_{bond}\
  \ = \\$27.2B \\times 10\\% = \\$2.72B\n\\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ = Spending_{mil} \\times Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\
  \\[0.5em]\n\\text{where } Funding_{political,ann} = Funding_{treaty} \\times Pct_{political}\
  \ = \\$27.2B \\times 10\\% = \\$2.72B\n\\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ = Spending_{mil} \\times Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\
  \\[0.5em]\n\\text{where } Funding_{treaty} = Spending_{mil} \\times Reduce_{treaty}\
  \ = \\$2.72T \\times 1\\% = \\$27.2B\n\\end{aligned}\n$$"
"disease_vs_terrorism_deaths_ratio": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-disease_vs_terrorism_deaths_ratio\"\
