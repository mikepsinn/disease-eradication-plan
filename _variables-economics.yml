  &= Cost_{DFDA,NPV} + Cost_{NPV} \\

  &= \$40M + \$230M \\

  &= \$270M

  \end{aligned}

  $$'
dfda_opex_pct_of_treaty_funding: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_opex_pct_of_treaty_funding"
  class="parameter-link" data-source-ref="/knowledge/economics/economics.qmd#funding-allocation"
  data-source-type="definition" data-confidence="high" title="Percentage of treaty
  funding allocated to Decentralized Framework for Drug Assessment framework overhead
  | ✓ High confidence | Formula: DFDA_OPEX / TREATY_FUNDING | Unit: rate | Click to
  view details, calculation & sources">0.147% (95% CI: 0.1%-0.204%)</a>'
dfda_opex_pct_of_treaty_funding_latex: '$$

  \begin{aligned}

  OPEX_{DFDA,treaty} \\

  &= \frac{Cost_{DFDA,ann}}{Funding_{ann}} \\

  &= \frac{\$40M}{\$27.2B} \\

  &= 0.147\%

  \end{aligned}

  $$'
dfda_pragmatic_trial_cost_per_patient: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_pragmatic_trial_cost_per_patient"
  class="parameter-link" data-source-ref="pragmatic-trials-cost-advantage" data-source-type="external"
  data-confidence="medium" title="dFDA pragmatic trial cost per patient. Central estimate
  based on ADAPTABLE trial. Confidence interval spans RECOVERY floor (exceptional
  NHS/COVID conditions) to complex chronic disease trials. | ~ Medium confidence |
  95% CI: [$500, $3K] | Dist: Lognormal | Unit: USD/patient | Click to view details,
  calculation & sources">$929 (95% CI: $500-$3K)</a>'
dfda_pragmatic_trial_cost_per_patient_cite: '@pragmatic-trials-cost-advantage'
dfda_queue_clearance_years: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_queue_clearance_years"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="low"
  title="Years to treat all currently untreatable diseases with dFDA implementation.
  Queue clearance time divided by trial capacity multiplier. | Calculated from 2 inputs
  | ? Low confidence | Formula: STATUS_QUO_QUEUE_CLEARANCE_YEARS ÷ DFDA_TRIAL_CAPACITY_MULTIPLIER
  | Unit: years | Click to view details, calculation & sources">36 years (95% CI:
  22.3 years-71.4 years)</a>'
dfda_queue_clearance_years_latex: '$$

  \begin{aligned}

  Time_{DFDA} \\

  &= \frac{Time}{Multiplier_{DFDA}} \\

  &= \frac{443}{12.3} \\

  &= 36

  \end{aligned}

  $$'
dfda_roi_rd_only: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_roi_rd_only"
  class="parameter-link" data-source-ref="/knowledge/appendix/dfda-cost-benefit-analysis.qmd#roi-simple"
  data-source-type="calculated" data-confidence="high" title="ROI from Decentralized
  Framework for Drug Assessment R&D savings only (10-year NPV, most conservative estimate)
  | Calculated from 2 inputs | ✓ High confidence | Formula: NPV_BENEFIT ÷ NPV_TOTAL_COST
  | Unit: ratio | Click to view details, calculation & sources">637:1 (95% CI: 570:1-779:1)</a>'
dfda_roi_rd_only_latex: '$$

  \begin{aligned}

  Savings_{DFDA,RD} \\

  &= \frac{Benefit_{DFDA,RD}}{Cost_{DFDA,total}} \\

  &= \frac{\$389B}{\$611M} \\

  &= 637

  \end{aligned}

  $$'
dfda_trial_capacity_multiplier: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_capacity_multiplier"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="high"
  title="Trial capacity multiplier from DIH funding capacity vs. current global trial
  participation | Calculated from 2 inputs | ✓ High confidence | Formula: DIH_PATIENTS_FUNDABLE
  ÷ CURRENT_TRIAL_SLOTS | Unit: ratio | Click to view details, calculation & sources">12.3:1
  (95% CI: 4.53:1-27.5:1)</a>'
dfda_trial_capacity_multiplier_latex: '$$

  \begin{aligned}

  Multiplier_{DFDA} \\

  &= \frac{Fundable_{ann}}{Trials_{curr}} \\

  &= \frac{23.4M}{1.9M} \\

  &= 12.3

  \end{aligned}

  $$'
dfda_trial_capacity_plus_efficacy_lag_dalys: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_capacity_plus_efficacy_lag_dalys"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="low"
  title="Total DALYs averted from the combined dFDA timeline shift. Calculated as
  annual global DALY burden × eventually avoidable percentage × timeline shift years.
  Includes both fatal and non-fatal diseases (WHO GBD methodology). | Calculated from
  3 inputs | ? Low confidence | Formula: GLOBAL_ANNUAL_DALY_BURDEN × EVENTUALLY_AVOIDABLE_DALY_PCT
  × TIMELINE_SHIFT | Unit: DALYs | Click to view details, calculation & sources">565B
  DALYs (95% CI: 365B DALYs-859B DALYs)</a>'
dfda_trial_capacity_plus_efficacy_lag_dalys_latex: '$$

  DALYs_{averted} = 2.88B \times 92.1\% \times 207 = 549B

  $$'
dfda_trial_capacity_plus_efficacy_lag_economic_value: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_capacity_plus_efficacy_lag_economic_value"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="low"
  title="Total economic value from the combined dFDA timeline shift. DALYs valued
  at standard economic rate. | Calculated from 2 inputs | ? Low confidence | Formula:
  DALYS × STANDARD_QALY_VALUE | Unit: USD | Click to view details, calculation & sources">$84.8
  quadrillion (95% CI: $62.5 quadrillion-$96.9 quadrillion)</a>'
dfda_trial_capacity_plus_efficacy_lag_economic_value_latex: '$$

  \begin{aligned}

  Capacity_{DFDA} \\

  &= DALYs_{DFDA} \times QALYs_{RD} \\

  &= 565B \times \$150K \\

  &= \$84800T

  \end{aligned}

  $$'
dfda_trial_capacity_plus_efficacy_lag_lives_saved: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_capacity_plus_efficacy_lag_lives_saved"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="low"
  title="Total eventually avoidable deaths from the combined dFDA timeline shift.
  Represents deaths prevented when cures arrive earlier due to both increased trial
  capacity and eliminated efficacy lag. | Calculated from 2 inputs | ? Low confidence
  | Formula: ANNUAL_DEATHS × DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_YEARS × AVOIDABLE_PCT
  | Unit: deaths | Click to view details, calculation & sources">10.7B deaths (95%
  CI: 7.55B deaths-15.9B deaths)</a>'
dfda_trial_capacity_plus_efficacy_lag_lives_saved_latex: '$$

  \begin{aligned}

  Capacity_{DFDA} \\

  &= ANNUAL_DEATHS \times DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_YEARS \times AVOIDABLE_PCT
  \\

  &= 10.7B

  \end{aligned}

  $$'
dfda_trial_capacity_plus_efficacy_lag_suffering_hours: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_capacity_plus_efficacy_lag_suffering_hours"
  class="parameter-link" data-source-ref="/knowledge/appendix/regulatory-mortality-analysis.qmd#daly-calculation"
  data-source-type="calculated" data-confidence="low" title="Hours of suffering eliminated
  from the combined dFDA timeline shift. Calculated from YLD component of DALYs (39%
  of total DALYs × hours per year). One-time benefit, not annual recurring. | Calculated
  from 2 inputs | ? Low confidence | Formula: DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_DALYS
  × GLOBAL_YLD_PROPORTION × HOURS_PER_YEAR | Unit: hours | Click to view details,
  calculation & sources">1931T hours (95% CI: 1372T hours-2570T hours)</a>'
dfda_trial_capacity_plus_efficacy_lag_suffering_hours_latex: '$$

  \begin{aligned}

  Capacity_{DFDA} \\

  &= DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_DALYS \times GLOBAL_YLD_PROPORTION \times
  HOURS_PER_YEAR \\

  &= 1930T

  \end{aligned}

  $$'
dfda_trial_capacity_plus_efficacy_lag_years: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_capacity_plus_efficacy_lag_years"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="low"
  title="Average years earlier patients receive treatments due to dFDA. Combines treatment
  timeline acceleration from increased trial capacity with efficacy lag elimination
  for treatments already discovered. | Calculated from 2 inputs | ? Low confidence
  | Formula: DFDA_TRIAL_CAPACITY_TREATMENT_ACCELERATION_YEARS + EFFICACY_LAG_YEARS
  | Unit: years | Click to view details, calculation & sources">212 years (95% CI:
  138 years-348 years)</a>'
dfda_trial_capacity_plus_efficacy_lag_years_latex: '$$

  Capacity_{DFDA} = Ratio_{DFDA} + Delay = 204 + 8.2 = 212

  $$'
dfda_trial_capacity_treatment_acceleration_years: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_capacity_treatment_acceleration_years"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="low"
  title="Years earlier the average first treatment arrives due to dFDA''s trial capacity
  increase. Calculated as the status quo timeline reduced by the inverse of the capacity
  multiplier. Uses only trial capacity multiplier (not combined with valley of death
  rescue) because additional candidates don''t directly speed queue processing. |
  Calculated from 2 inputs | ? Low confidence | Formula: STATUS_QUO_AVG_YEARS_TO_FIRST_TREATMENT
  × (1 - 1/DFDA_TRIAL_CAPACITY_MULTIPLIER) | Unit: years | Click to view details,
  calculation & sources">204 years (95% CI: 126 years-343 years)</a>'
dfda_trial_capacity_treatment_acceleration_years_latex: '$$

  \begin{aligned}

  Ratio_{DFDA} \\

  &= STATUS_QUO_AVG_YEARS_TO_FIRST_TREATMENT \times (1 - 1/DFDA_TRIAL_CAPACITY_MULTIPLIER)
  \\

  &= 204

  \end{aligned}

  $$'
dfda_trial_cost_reduction_factor: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_cost_reduction_factor"
  class="parameter-link" data-source-ref="/knowledge/appendix/dfda-cost-benefit-analysis.qmd#cost-reduction"
  data-source-type="calculated" data-confidence="high" title="Cost reduction factor
  projected for dFDA pragmatic trials ($41K traditional / $1,200 dFDA = 34x) | Calculated
  from 2 inputs | ✓ High confidence | Formula: TRADITIONAL_PHASE3_COST / DFDA_PRAGMATIC_COST
  | Unit: multiplier | Click to view details, calculation & sources">44.1x (95% CI:
  40x-46.7x)</a>'
dfda_trial_cost_reduction_factor_latex: '$$

  \begin{aligned}

  Cost_{DFDA} \\

  &= \frac{Cost}{Cost_{DFDA}} \\

  &= \frac{\$41K}{\$929} \\

  &= 44.1

  \end{aligned}

  $$'
dfda_trial_cost_reduction_pct: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trial_cost_reduction_pct"
  class="parameter-link" data-source-ref="/knowledge/appendix/dfda-cost-benefit-analysis.qmd#cost-reduction"
  data-source-type="calculated" data-confidence="high" title="Trial cost reduction
  percentage: (traditional - dFDA) / traditional = ($41K - $1.2K) / $41K = 97% | Calculated
  from 2 inputs | ✓ High confidence | Formula: 1 - (DFDA_COST / TRADITIONAL_COST)
  | Unit: percentage | Click to view details, calculation & sources">97.7% (95% CI:
  97.5%-97.9%)</a>'
dfda_trial_cost_reduction_pct_latex: '$$

  R_{pct} = 1 - \frac{\$1{,}200}{\$41{,}000} = 97.07\%

  $$'
dfda_trials_per_year_capacity: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_trials_per_year_capacity"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="high"
  title="Maximum trials per year possible with trial capacity multiplier | Calculated
  from 2 inputs | ✓ High confidence | Formula: CURRENT_TRIALS × DFDA_TRIAL_CAPACITY_MULTIPLIER
  | Unit: trials/year | Click to view details, calculation & sources">40.6k trials/year
  (95% CI: 17.6k trials/year-76.2k trials/year)</a>'
dfda_trials_per_year_capacity_latex: '$$

  \begin{aligned}

  Capacity_{DFDA} \\

  &= Trials_{curr} \times Multiplier_{DFDA} \\

  &= 3{,}300 \times 12.3 \\

  &= 40{,}600

  \end{aligned}

  $$'
dfda_valley_of_death_rescue_multiplier: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dfda_valley_of_death_rescue_multiplier"
  class="parameter-link" data-source-ref="" data-source-type="calculated" data-confidence="medium"
  title="Factor increase in drugs entering development when dFDA eliminates Phase
  2/3 cost barrier. Valley-of-death attrition (40%) becomes new drugs, so 1 + 0.40
  = 1.4× more drugs. | Calculated from 1 input | ~ Medium confidence | Formula: 1
  + VALLEY_OF_DEATH_ATTRITION_PCT | Unit: multiplier | Click to view details, calculation
  & sources">1.4x</a>'
dfda_valley_of_death_rescue_multiplier_latex: '$$

  Multiplier_{DFDA} = Deaths + 1 = 40\% + 1 = 1.4

  $$'
dih_patients_fundable_annually: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dih_patients_fundable_annually"
  class="parameter-link" data-source-ref="/knowledge/economics/economics.qmd#funding-allocation"
  data-source-type="calculated" data-confidence="high" title="Number of patients fundable
  annually at dFDA pragmatic trial cost ($1,200/patient). Based on empirical pragmatic
  trial costs (RECOVERY to PCORnet range). | Calculated from 2 inputs | ✓ High confidence
  | Formula: TRIAL_SUBSIDIES ÷ DFDA_COST_PER_PATIENT | Unit: patients/year | Click
  to view details, calculation & sources">23.4M patients/year (95% CI: 10.2M patients/year-43.5M
  patients/year)</a>'
dih_patients_fundable_annually_latex: '$$

  \begin{aligned}

  Fundable_{ann} \\

  &= \frac{Treasury_{ann}}{Cost_{DFDA}} \\

  &= \frac{\$21.7B}{\$929} \\

  &= 23.4M

  \end{aligned}

  $$'
dih_treasury_medical_research_pct: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dih_treasury_medical_research_pct"
  class="parameter-link" data-source-ref="/knowledge/economics/economics.qmd#funding-allocation"
  data-source-type="definition" data-confidence="high" title="Percentage of treaty
  funding allocated to medical research (after bond payouts and IAB incentives) |
  ✓ High confidence | Formula: MEDICAL_RESEARCH_FUNDING / TREATY_FUNDING | Unit: rate
  | Click to view details, calculation & sources">80%</a>'
dih_treasury_medical_research_pct_latex: '$$

  \begin{aligned}

  Treasury_{RD} \\

  &= \frac{Treasury_{ann}}{Funding_{ann}} \\

  &= \frac{\$21.8B}{\$27.2B} \\

  &= 80\%

  \end{aligned}

  $$'
dih_treasury_to_medical_research_annual: '<span class="parameter-definition" title="Annual
  funding for pragmatic clinical trials (treaty funding minus VICTORY Incentive Alignment
  Bond payouts and IAB political incentive mechanism) | Unit: USD/year | Core definition">$21.8B</span>'
dih_treasury_to_medical_research_annual_latex: '$$

  ResearchFunding = \$27.2B - \$2.72B - \$2.72B = \$21.76B

  $$'
dih_treasury_trial_subsidies_annual: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dih_treasury_trial_subsidies_annual"
  class="parameter-link" data-source-ref="/knowledge/economics/economics.qmd#funding-allocation"
  data-source-type="calculated" data-confidence="high" title="Annual clinical trial
  patient subsidies (all medical research funds after Decentralized Framework for
  Drug Assessment operations) | Calculated from 2 inputs | ✓ High confidence | Formula:
  MEDICAL_RESEARCH_FUNDING - DFDA_OPEX | Unit: USD/year | Click to view details, calculation
  & sources">$21.7B (95% CI: $21.7B-$21.7B)</a>'
dih_treasury_trial_subsidies_annual_latex: '$$

  \begin{aligned}

  Treasury_{ann} \\

  &= Treasury_{ann} - Cost_{DFDA,ann} \\

  &= \$21.8B - \$40M \\

  &= \$21.7B

  \end{aligned}

  $$'
dih_treasury_trial_subsidies_pct: '<a href="/knowledge/appendix/parameters-and-calculations#sec-dih_treasury_trial_subsidies_pct"
  class="parameter-link" data-source-ref="/knowledge/economics/economics.qmd#funding-allocation"
  data-source-type="definition" data-confidence="high" title="Percentage of treaty
  funding going directly to patient trial subsidies | ✓ High confidence | Formula:
  TRIAL_SUBSIDIES / TREATY_FUNDING | Unit: rate | Click to view details, calculation
  & sources">79.9% (95% CI: 79.8%-79.9%)</a>'
dih_treasury_trial_subsidies_pct_latex: '$$

  \begin{aligned}

  Treasury \\

  &= \frac{Treasury_{ann}}{Funding_{ann}} \\

  &= \frac{\$21.7B}{\$27.2B} \\

  &= 79.9\%

  \end{aligned}

  $$'
disease_vs_terrorism_deaths_ratio: '<a href="/knowledge/appendix/parameters-and-calculations#sec-disease_vs_terrorism_deaths_ratio"
  class="parameter-link" data-source-ref="/knowledge/economics/economics.qmd" data-source-type="definition"
  data-confidence="high" title="Ratio of annual disease deaths to 9/11 terrorism deaths
  | ✓ High confidence | Formula: ANNUAL_DISEASE_DEATHS ÷ 911_DEATHS | Unit: ratio
  | Click to view details, calculation & sources">18.4k:1 (95% CI: 15.6k:1-21.1k:1)</a>'
disease_vs_terrorism_deaths_ratio_latex: '$$

  \begin{aligned}

  Deaths_{terror,dis} \\

  &= \frac{Deaths_{ann}}{Deaths_{terror}} \\

