  [0.5em]\n\\text{where } YLL_{lag} = DEATHS\\_TOTAL \\times (LIFE\\_EXPECTANCY -\
  \ MEAN\\_AGE\\_OF\\_DEATH) = 7.07B\n\\\\[0.5em]\n\\text{where } Deaths_{lag} = ANNUAL\\\
