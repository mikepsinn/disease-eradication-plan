"type_i_error_benefit_dalys": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-type_i_error_benefit_dalys\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/regulatory-mortality-analysis.qmd#risk-analysis\"\
  \ data-source-type=\"calculated\" data-confidence=\"low\" title=\"Maximum DALYs\
  \ saved by FDA preventing unsafe drugs over 62-year period 1962-2024 (extreme overestimate:\
  \ one Thalidomide-scale event per year) | Calculated from 1 input | ? Low confidence\
  \ | Formula: THALIDOMIDE_DALYS_PER_EVENT × 62 years | Unit: DALYs | Click to view\
  \ details, calculation & sources\">2.59M DALYs (95% CI: 1.54M DALYs-4.15M DALYs)</a>"
"type_i_error_benefit_dalys_latex": "$$\n\\begin{aligned}\nDALY_{TypeI} = DALY_{thal}\
  \ \\times 62 = 41{,}800 \\times 62 = 2.59M\n\\\\[0.5em]\n\\text{where } DALY_{thal}\
  \ = YLD_{thal} + YLL_{thal} = 13{,}000 + 28{,}800 = 41{,}800\n\\\\[0.5em]\n\\text{where\
  \ } YLD_{thal} = DW_{thal} \\times N_{thal,survive} \\times LE_{thal} = 0.4 \\times\
  \ 540 \\times 60 = 13{,}000\n\\\\[0.5em]\n\\text{where } N_{thal,survive} = N_{thal,US,prevent}\
  \ \\times (1 - Rate_{thal,mort}) = 900 \\times (1 - 40\\%) = 540\n\\\\[0.5em]\n\\\
  text{where } N_{thal,US,prevent} = N_{thal,global} \\times Pct_{US,1960} = 15{,}000\
  \ \\times 6\\% = 900\n\\\\[0.5em]\n\\text{where } YLL_{thal} = Deaths_{thal} \\\
  times 80 = 360 \\times 80 = 28{,}800\n\\\\[0.5em]\n\\text{where } Deaths_{thal}\
  \ = Rate_{thal,mort} \\times N_{thal,US,prevent} = 40\\% \\times 900 = 360\n\\\\\
  [0.5em]\n\\text{where } N_{thal,US,prevent} = N_{thal,global} \\times Pct_{US,1960}\
  \ = 15{,}000 \\times 6\\% = 900\n\\end{aligned}\n$$"
"type_ii_error_cost_ratio": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-type_ii_error_cost_ratio\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/regulatory-mortality-analysis.qmd#risk-analysis\"\
  \ data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Ratio of Type\
  \ II error cost to Type I error benefit (harm from delay vs. harm prevented) | Calculated\
  \ from 2 inputs | ~ Medium confidence | Formula: TYPE_II_COST ÷ TYPE_I_BENEFIT |\
  \ Unit: ratio | Click to view details, calculation & sources\">3.07k:1 (95% CI:\
  \ 2.89k:1-3.13k:1)</a>"
"type_ii_error_cost_ratio_latex": "$$\n\\begin{aligned}\nRatio_{TypeII} = \\frac{DALYs_{lag}}{DALY_{TypeI}}\
  \ = \\frac{7.94B}{2.59M} = 3{,}070\n\\\\[0.5em]\n\\text{where } DALYs_{lag} = YLL_{lag}\
  \ + YLD_{lag} = 7.07B + 873M = 7.94B\n\\\\[0.5em]\n\\text{where } YLL_{lag} = DEATHS\\\
  _TOTAL \\times (LIFE\\_EXPECTANCY - MEAN\\_AGE\\_OF\\_DEATH) = 7.07B\n\\\\[0.5em]\n\
  \\text{where } Deaths_{lag} = ANNUAL\\_DEATHS \\times EFFICACY\\_LAG\\_YEARS \\\
  times EVENTUALLY\\_AVOIDABLE\\_DEATH\\_PCT = 416M\n\\\\[0.5em]\n\\text{where } YLD_{lag}\
  \ = Deaths_{lag} \\times T_{suffering} \\times DW_{chronic} = 416M \\times 6 \\\
  times 0.35 = 873M\n\\\\[0.5em]\n\\text{where } Deaths_{lag} = ANNUAL\\_DEATHS \\\
  times EFFICACY\\_LAG\\_YEARS \\times EVENTUALLY\\_AVOIDABLE\\_DEATH\\_PCT = 416M\n\
  \\\\[0.5em]\n\\text{where } DALY_{TypeI} = DALY_{thal} \\times 62 = 41{,}800 \\\
  times 62 = 2.59M\n\\\\[0.5em]\n\\text{where } DALY_{thal} = YLD_{thal} + YLL_{thal}\
  \ = 13{,}000 + 28{,}800 = 41{,}800\n\\\\[0.5em]\n\\text{where } YLD_{thal} = DW_{thal}\
  \ \\times N_{thal,survive} \\times LE_{thal} = 0.4 \\times 540 \\times 60 = 13{,}000\n\
  \\\\[0.5em]\n\\text{where } N_{thal,survive} = N_{thal,US,prevent} \\times (1 -\
  \ Rate_{thal,mort}) = 900 \\times (1 - 40\\%) = 540\n\\\\[0.5em]\n\\text{where }\
  \ N_{thal,US,prevent} = N_{thal,global} \\times Pct_{US,1960} = 15{,}000 \\times\
  \ 6\\% = 900\n\\\\[0.5em]\n\\text{where } YLL_{thal} = Deaths_{thal} \\times 80\
  \ = 360 \\times 80 = 28{,}800\n\\\\[0.5em]\n\\text{where } Deaths_{thal} = Rate_{thal,mort}\
  \ \\times N_{thal,US,prevent} = 40\\% \\times 900 = 360\n\\\\[0.5em]\n\\text{where\
  \ } N_{thal,US,prevent} = N_{thal,global} \\times Pct_{US,1960} = 15{,}000 \\times\
  \ 6\\% = 900\n\\end{aligned}\n$$"
"unexplored_ratio": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-unexplored_ratio\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/problem/untapped-therapeutic-frontier.qmd\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Fraction of possible\
  \ drug-disease space that remains unexplored (>99%) | Calculated from 2 inputs |\
