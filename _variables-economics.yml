"dfda_efficacy_lag_elimination_dalys": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_efficacy_lag_elimination_dalys\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/regulatory-mortality-analysis.qmd#daly-calculation\"\
  \ data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Total Disability-Adjusted\
  \ Life Years lost from disease eradication delay (PRIMARY estimate) | Calculated\
  \ from 2 inputs | ~ Medium confidence | Formula: YLL + YLD | Unit: DALYs | Click\
  \ to view details, calculation & sources\">7.94B DALYs (95% CI: 4.43B DALYs-12.1B\
  \ DALYs)</a>"
"dfda_efficacy_lag_elimination_dalys_latex": "$$\n\\begin{aligned}\nDALYs_{lag} =\
  \ YLL_{lag} + YLD_{lag} = 7.07B + 873M = 7.94B\n\\\\[0.5em]\n\\text{where } YLL_{lag}\
  \ = DEATHS\\_TOTAL \\times (LIFE\\_EXPECTANCY - MEAN\\_AGE\\_OF\\_DEATH) = 7.07B\n\
  \\\\[0.5em]\n\\text{where } Deaths_{lag} = ANNUAL\\_DEATHS \\times EFFICACY\\_LAG\\\
  _YEARS \\times EVENTUALLY\\_AVOIDABLE\\_DEATH\\_PCT = 416M\n\\\\[0.5em]\n\\text{where\
  \ } YLD_{lag} = Deaths_{lag} \\times T_{suffering} \\times DW_{chronic} = 416M \\\
  times 6 \\times 0.35 = 873M\n\\\\[0.5em]\n\\text{where } Deaths_{lag} = ANNUAL\\\
  _DEATHS \\times EFFICACY\\_LAG\\_YEARS \\times EVENTUALLY\\_AVOIDABLE\\_DEATH\\\
  _PCT = 416M\n\\end{aligned}\n$$"
"dfda_efficacy_lag_elimination_deaths_averted": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_efficacy_lag_elimination_deaths_averted\"\
