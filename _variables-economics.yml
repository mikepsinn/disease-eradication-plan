  \ + \\$5M + \\$2M = \\$40M\n\\\\[0.5em]\n\\text{where } Treasury_{RD,ann} = Funding_{treaty}\
  \ - Payout_{bond,ann} - Funding_{political,ann} = \\$27.2B - \\$2.72B - \\$2.72B\
  \ = \\$21.8B\n\\\\[0.5em]\n\\text{where } Funding_{treaty} = Spending_{mil} \\times\
  \ Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\\[0.5em]\n\\text{where\
  \ } Payout_{bond,ann} = Funding_{treaty} \\times Pct_{bond} = \\$27.2B \\times 10\\\
  % = \\$2.72B\n\\\\[0.5em]\n\\text{where } Funding_{treaty} = Spending_{mil} \\times\
  \ Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\\[0.5em]\n\\text{where\
  \ } Funding_{political,ann} = Funding_{treaty} \\times Pct_{political} = \\$27.2B\
  \ \\times 10\\% = \\$2.72B\n\\\\[0.5em]\n\\text{where } Funding_{treaty} = Spending_{mil}\
  \ \\times Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\end{aligned}\n$$"
"trial_capacity_cumulative_years_20yr": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-trial_capacity_cumulative_years_20yr\"\
  \ class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\"\
  \ data-confidence=\"high\" title=\"Cumulative trial-capacity-equivalent years over\
  \ 20-year period | Calculated from 1 input | ✓ High confidence | Formula: DFDA_TRIAL_CAPACITY_MULTIPLIER\
  \ × 20 YEARS | Unit: years | Click to view details, calculation & sources\">246\
  \ years (95% CI: 83 years-1.23k years)</a>"
"trial_capacity_cumulative_years_20yr_latex": "$$\n\\begin{aligned}\nCapacity_{20yr}\
  \ = k_{capacity} \\times 20 = 12.3 \\times 20 = 246\n\\\\[0.5em]\n\\text{where }\
  \ k_{capacity} = \\frac{N_{fundable,ann}}{Slots_{curr}} = \\frac{23.4M}{1.9M} =\
  \ 12.3\n\\\\[0.5em]\n\\text{where } N_{fundable,ann} = \\frac{Subsidies_{trial,ann}}{Cost_{pragmatic,pt}}\
  \ = \\frac{\\$21.7B}{\\$929} = 23.4M\n\\\\[0.5em]\n\\text{where } Subsidies_{trial,ann}\
  \ = \\left\\lfloor \\frac{Treasury_{RD,ann}}{OPEX_{dFDA}} \\right\\rfloor = \\left\\\
  lfloor \\frac{\\$21.8B}{\\$40M} \\right\\rfloor = \\$21.7B\n\\\\[0.5em]\n\\text{where\
  \ } OPEX_{dFDA} = Cost_{platform} + Cost_{staff} + Cost_{infra} + Cost_{regulatory}\
  \ + Cost_{community} = \\$15M + \\$10M + \\$8M + \\$5M + \\$2M = \\$40M\n\\\\[0.5em]\n\
  \\text{where } Treasury_{RD,ann} = Funding_{treaty} - Payout_{bond,ann} - Funding_{political,ann}\
  \ = \\$27.2B - \\$2.72B - \\$2.72B = \\$21.8B\n\\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ = Spending_{mil} \\times Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\
  \\[0.5em]\n\\text{where } Payout_{bond,ann} = Funding_{treaty} \\times Pct_{bond}\
  \ = \\$27.2B \\times 10\\% = \\$2.72B\n\\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ = Spending_{mil} \\times Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\
  \\[0.5em]\n\\text{where } Funding_{political,ann} = Funding_{treaty} \\times Pct_{political}\
  \ = \\$27.2B \\times 10\\% = \\$2.72B\n\\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ = Spending_{mil} \\times Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\
  end{aligned}\n$$"
