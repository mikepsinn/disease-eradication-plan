"dfda_queue_clearance_years": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_queue_clearance_years\"\
  \ class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\"\
  \ data-confidence=\"low\" title=\"Years to treat all currently untreatable diseases\
  \ with dFDA implementation. Queue clearance time divided by trial capacity multiplier.\
  \ | Calculated from 2 inputs | ? Low confidence | Formula: STATUS_QUO_QUEUE_CLEARANCE_YEARS\
  \ ÷ DFDA_TRIAL_CAPACITY_MULTIPLIER | Unit: years | Click to view details, calculation\
  \ & sources\">36 years (95% CI: 11.6 years-77.2 years)</a>"
"dfda_queue_clearance_years_latex": "$$\n\\begin{aligned}\nT_{queue,dFDA} = \\frac{T_{queue,SQ}}{k_{capacity}}\
  \ = \\frac{443}{12.3} = 36\n\\\\[0.5em]\n\\text{where } T_{queue,SQ} = \\frac{N_{untreated}}{Treatments_{new,ann}}\
  \ = \\frac{6{,}650}{15} = 443\n\\\\[0.5em]\n\\text{where } N_{untreated} = N_{rare}\
  \ - 1 = 7{,}000 - 1 = 6{,}650\n\\\\[0.5em]\n\\text{where } k_{capacity} = \\frac{N_{fundable,ann}}{Slots_{curr}}\
  \ = \\frac{23.4M}{1.9M} = 12.3\n\\\\[0.5em]\n\\text{where } N_{fundable,ann} = \\\
  frac{Subsidies_{trial,ann}}{Cost_{pragmatic,pt}} = \\frac{\\$21.7B}{\\$929} = 23.4M\n\
  \\\\[0.5em]\n\\text{where } Subsidies_{trial,ann} = \\left\\lfloor \\frac{Treasury_{RD,ann}}{OPEX_{dFDA}}\
  \ \\right\\rfloor = \\left\\lfloor \\frac{\\$21.8B}{\\$40M} \\right\\rfloor = \\\
  $21.7B\n\\\\[0.5em]\n\\text{where } OPEX_{dFDA} = Cost_{platform} + Cost_{staff}\
  \ + Cost_{infra} + Cost_{regulatory} + Cost_{community} = \\$15M + \\$10M + \\$8M\
  \ + \\$5M + \\$2M = \\$40M\n\\\\[0.5em]\n\\text{where } Treasury_{RD,ann} = Funding_{treaty}\
  \ - Payout_{bond,ann} - Funding_{political,ann} = \\$27.2B - \\$2.72B - \\$2.72B\
  \ = \\$21.8B\n\\\\[0.5em]\n\\text{where } Funding_{treaty} = Spending_{mil} \\times\
  \ Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\\[0.5em]\n\\text{where\
  \ } Payout_{bond,ann} = Funding_{treaty} \\times Pct_{bond} = \\$27.2B \\times 10\\\
  % = \\$2.72B\n\\\\[0.5em]\n\\text{where } Funding_{treaty} = Spending_{mil} \\times\
  \ Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\\\[0.5em]\n\\text{where\
  \ } Funding_{political,ann} = Funding_{treaty} \\times Pct_{political} = \\$27.2B\
  \ \\times 10\\% = \\$2.72B\n\\\\[0.5em]\n\\text{where } Funding_{treaty} = Spending_{mil}\
  \ \\times Reduce_{treaty} = \\$2.72T \\times 1\\% = \\$27.2B\n\\end{aligned}\n$$"
"dfda_roi_rd_only": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_roi_rd_only\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/dfda-cost-benefit-analysis.qmd#roi-simple\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"ROI from Decentralized\
  \ Framework for Drug Assessment R&D savings only (10-year NPV, most conservative\
  \ estimate) | Calculated from 2 inputs | ✓ High confidence | Formula: NPV_BENEFIT\
  \ ÷ NPV_TOTAL_COST | Unit: ratio | Click to view details, calculation & sources\"\
  >637:1 (95% CI: 569:1-790:1)</a>"
"dfda_roi_rd_only_latex": "$$\n\\begin{aligned}\nROI_{RD} = \\frac{NPV_{RD}}{Cost_{dFDA,total}}\
  \ = \\frac{\\$389B}{\\$611M} = 637\n\\\\[0.5em]\n\\text{where } NPV_{RD} = Sum of\
  \ discounted annual net R&D savings with linear adoption ramp = \\$389B\n\\\\[0.5em]\n\
  \\text{where } Savings_{RD,ann} = Benefit_{RD,ann} - OPEX_{dFDA} = \\$58.6B - \\\
  $40M = \\$58.6B\n\\\\[0.5em]\n\\text{where } Benefit_{RD,ann} = Spending_{trials}\
  \ \\times Reduce_{pct} = \\$60B \\times 97.7\\% = \\$58.6B\n\\\\[0.5em]\n\\text{where\
  \ } Reduce_{pct} = 1 - \\frac{Cost_{pragmatic,pt}}{Cost_{P3,pt}} = 1 - \\frac{\\\
  $929}{\\$41K} = 97.7\\%\n\\\\[0.5em]\n\\text{where } OPEX_{dFDA} = Cost_{platform}\
  \ + Cost_{staff} + Cost_{infra} + Cost_{regulatory} + Cost_{community} = \\$15M\
  \ + \\$10M + \\$8M + \\$5M + \\$2M = \\$40M\n\\\\[0.5em]\n\\text{where } Cost_{dFDA,total}\
  \ = PV_{OPEX} + Cost_{upfront,total} = \\$342M + \\$270M = \\$611M\n\\\\[0.5em]\n\
  \\text{where } PV_{OPEX} = OPEX \\times [(1 - (1 + r)^-T) / r] = \\$342M\n\\\\[0.5em]\n\
  \\text{where } OPEX_{total} = OPEX_{ann} + OPEX_{DIH,ann} = \\$18.9M + \\$21.1M\
  \ = \\$40M\n\\\\[0.5em]\n\\text{where } Cost_{upfront,total} = Cost_{upfront} +\
  \ Cost_{DIH,init} = \\$40M + \\$230M = \\$270M\n\\end{aligned}\n$$"
