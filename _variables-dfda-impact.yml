"dih_patients_fundable_annually": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dih_patients_fundable_annually\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/economics/economics.qmd#funding-allocation\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Number of patients\
  \ fundable annually at dFDA pragmatic trial cost ($1,200/patient). Based on empirical\
  \ pragmatic trial costs (RECOVERY to PCORnet range). | Calculated from 2 inputs\
  \ | ✓ High confidence | Formula: TRIAL_SUBSIDIES ÷ DFDA_COST_PER_PATIENT | Unit:\
  \ patients/year | Click to view details, calculation & sources\">23.4M patients/year\
  \ (95% CI: 9.44M patients/year-96.8M patients/year)</a>"
"dih_patients_fundable_annually_latex": "$$\n\\begin{gathered}\nN_{fundable,ann} \\\
  \\\n= \\frac{Subsidies_{trial,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.7B}{\\\
  $929} \\\\\n= 23.4M \\\\[0.5em]\n\\text{where } Subsidies_{trial,ann} \\\\\n= Treasury_{RD,ann}\
  \ - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.7B \\\\[0.5em]\n\\text{where\
  \ } OPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory}\
  \ + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\\
  $40M \\\\[0.5em]\n\\text{where } Treasury_{RD,ann} \\\\\n= Funding_{treaty} - Payout_{bond,ann}\
  \ - Funding_{political,ann} \\\\\n= \\$27.2B - \\$2.72B - \\$2.72B \\\\\n= \\$21.8B\
  \ \\\\[0.5em]\n\\text{where } Funding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty}\
  \ \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B \\\\[0.5em]\n\\text{where } Payout_{bond,ann}\
  \ \\\\\n= Funding_{treaty} \\times Pct_{bond} \\\\\n= \\$27.2B \\times 10\\% \\\\\
  \n= \\$2.72B \\\\[0.5em]\n\\text{where } Funding_{treaty} \\\\\n= Spending_{mil}\
  \ \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B \\\\[0.5em]\n\
  \\text{where } Funding_{political,ann} \\\\\n= Funding_{treaty} \\times Pct_{political}\
  \ \\\\\n= \\$27.2B \\times 10\\% \\\\\n= \\$2.72B \\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\
  \\\n= \\$27.2B\n\\end{gathered}\n$$"
"dih_treasury_to_medical_research_annual": "<span class=\"parameter-definition\" title=\"\
  Annual funding for pragmatic clinical trials (treaty funding minus VICTORY Incentive\
  \ Alignment Bond payouts and IAB political incentive mechanism) | Unit: USD/year\
  \ | Core definition\">$21.8B</span>"
"dih_treasury_to_medical_research_annual_latex": "$$\n\\begin{gathered}\nTreasury_{RD,ann}\
  \ \\\\\n= Funding_{treaty} - Payout_{bond,ann} - Funding_{political,ann} \\\\\n\
  = \\$27.2B - \\$2.72B - \\$2.72B \\\\\n= \\$21.8B \\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\
  \\\n= \\$27.2B \\\\[0.5em]\n\\text{where } Payout_{bond,ann} \\\\\n= Funding_{treaty}\
  \ \\times Pct_{bond} \\\\\n= \\$27.2B \\times 10\\% \\\\\n= \\$2.72B \\\\[0.5em]\n\
  \\text{where } Funding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\
  \\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B \\\\[0.5em]\n\\text{where } Funding_{political,ann}\
  \ \\\\\n= Funding_{treaty} \\times Pct_{political} \\\\\n= \\$27.2B \\times 10\\\
  % \\\\\n= \\$2.72B \\\\[0.5em]\n\\text{where } Funding_{treaty} \\\\\n= Spending_{mil}\
  \ \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B\n\\end{gathered}\n\
  $$"
