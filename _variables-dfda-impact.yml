"dfda_npv_total_cost_latex": "$$\n\\begin{gathered}\nCost_{dFDA,total} \\\\\n= PV_{OPEX}\
  \ + Cost_{upfront,total} \\\\\n= \\$342M + \\$270M \\\\\n= \\$611M \\\\[0.5em]\n\
  \\text{where } PV_{OPEX} \\\\\n= \\frac{T_{horizon}}{OPEX_{total} \\times r_{discount}}\
  \ \\\\\n= \\frac{10}{\\$40M \\times 3\\%} \\\\\n= \\$342M \\\\[0.5em]\n\\text{where\
  \ } OPEX_{total} \\\\\n= OPEX_{ann} + OPEX_{DIH,ann} \\\\\n= \\$18.9M + \\$21.1M\
  \ \\\\\n= \\$40M \\\\[0.5em]\n\\text{where } Cost_{upfront,total} \\\\\n= Cost_{upfront}\
  \ + Cost_{DIH,init} \\\\\n= \\$40M + \\$230M \\\\\n= \\$270M\n\\end{gathered}\n\
  $$"
