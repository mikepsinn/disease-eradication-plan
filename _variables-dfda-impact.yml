"type_ii_error_cost_ratio": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-type_ii_error_cost_ratio\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/regulatory-mortality-analysis.qmd#risk-analysis\"\
  \ data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Ratio of Type\
  \ II error cost to Type I error benefit (harm from delay vs. harm prevented) | Calculated\
  \ from 2 inputs | ~ Medium confidence | Formula: TYPE_II_COST ÷ TYPE_I_BENEFIT |\
  \ Unit: ratio | Click to view details, calculation & sources\">3.07k:1 (95% CI:\
  \ 2.88k:1-3.12k:1)</a>"
"type_ii_error_cost_ratio_latex": "$$\n\\begin{gathered}\nRatio_{TypeII} = \\frac{DALYs_{lag}}{DALY_{TypeI}}\
  \ = \\frac{7.94B}{2.59M} = 3{,}070 \\\\[0.5em]\n\\text{where } DALYs_{lag} = YLL_{lag}\
  \ + YLD_{lag} = 7.07B + 873M = 7.94B \\\\[0.5em]\n\\text{where } YLL_{lag} \\\\\n\
  = Deaths_{lag} \\times (LE_{global} - Age_{death,delay}) \\\\\n= 416M \\times (79\
  \ - 62) \\\\\n= 7.07B \\\\[0.5em]\n\\text{where } Deaths_{lag} \\\\\n= T_{lag} \\\
  times Deaths_{disease,daily} \\times 338 \\\\\n= 8.2 \\times 150{,}000 \\times 338\
  \ \\\\\n= 416M \\\\[0.5em]\n\\text{where } YLD_{lag} \\\\\n= Deaths_{lag} \\times\
  \ T_{suffering} \\times DW_{chronic} \\\\\n= 416M \\times 6 \\times 0.35 \\\\\n\
  = 873M \\\\[0.5em]\n\\text{where } Deaths_{lag} \\\\\n= T_{lag} \\times Deaths_{disease,daily}\
  \ \\times 338 \\\\\n= 8.2 \\times 150{,}000 \\times 338 \\\\\n= 416M \\\\[0.5em]\n\
  \\text{where } DALY_{TypeI} = DALY_{thal} \\times 62 = 41{,}800 \\times 62 = 2.59M\
  \ \\\\[0.5em]\n\\text{where } DALY_{thal} \\\\\n= YLD_{thal} + YLL_{thal} \\\\\n\
  = 13{,}000 + 28{,}800 \\\\\n= 41{,}800 \\\\[0.5em]\n\\text{where } YLD_{thal} \\\
  \\\n= DW_{thal} \\times N_{thal,survive} \\times LE_{thal} \\\\\n= 0.4 \\times 540\
  \ \\times 60 \\\\\n= 13{,}000 \\\\[0.5em]\n\\text{where } N_{thal,survive} \\\\\n\
  = N_{thal,US,prevent} \\times (1 - Rate_{thal,mort}) \\\\\n= 900 \\times (1 - 40\\\
  %) \\\\\n= 540 \\\\[0.5em]\n\\text{where } N_{thal,US,prevent} \\\\\n= N_{thal,global}\
  \ \\times Pct_{US,1960} \\\\\n= 15{,}000 \\times 6\\% \\\\\n= 900 \\\\[0.5em]\n\\\
  text{where } YLL_{thal} = Deaths_{thal} \\times 80 = 360 \\times 80 = 28{,}800 \\\
  \\[0.5em]\n\\text{where } Deaths_{thal} \\\\\n= Rate_{thal,mort} \\times N_{thal,US,prevent}\
  \ \\\\\n= 40\\% \\times 900 \\\\\n= 360 \\\\[0.5em]\n\\text{where } N_{thal,US,prevent}\
  \ \\\\\n= N_{thal,global} \\times Pct_{US,1960} \\\\\n= 15{,}000 \\times 6\\% \\\
  \\\n= 900\n\\end{gathered}\n$$"
