  \ Unit: USD | Click to view details, calculation & sources\">$389B (95% CI: $327B-$485B)</a>"
"dfda_npv_benefit_rd_only_latex": "$$\n\\begin{gathered}\nNPV_{RD} \\\\\n= \\sum_{t=1}^{10}\
  \ \\frac{Savings_{RD,ann} \\times \\frac{\\min(t,5)}{5}}{(1+r)^t}\n\\end{gathered}\n\
