project:
  type: website
  output-dir: _site/dfda-impact
  execute-dir: project
  resources:
    - assets/
    - _redirects
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  index-source: knowledge/appendix/dfda-impact-paper.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  pdf-output-file: dfda-impact-paper.pdf
  netlify-site-id: "a314a33e-3155-4067-8624-706266899419"
  netlify-cname: "impact-dfda-earth.netlify.app"  # DNS: impact.dfda.earth -> this
  # Image generation prompts (used by scripts/images/generate-project-branding.ts)
  favicon-prompt: "A pill or capsule with an upward impact arrow. Represents the positive health and economic impact of decentralized drug assessment."
  og-image-prompt: "Economic impact visualization of decentralized drug assessment - showing billions of lives saved, DALYs averted, and cost savings. Include medical symbols transforming into positive metrics, global health improvement, and statistical confidence intervals."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

website:
  title: 'The Health and Economic Impact of a Global System for Pragmatic Clinical Trials'
  description: "Economic analysis of a decentralized framework for drug assessment (dFDA). With $21.8B/year in pragmatic trial funding, the framework could save 10.7B deaths (95% CI: 7.39B deaths-16.2B deaths) and avert 565B DALYs (95% CI: 361B DALYs-877B DALYs) at $0.841 (95% CI: $0.242-$1.75) per DALY, while generating $58.6B (95% CI: $49.2B-$73.1B) in annual R&D savings."
  site-url: https://impact.dfda.earth
  favicon: assets/icons/dfda-favicon.png
  page-navigation: true
  navbar:
    left:
      - text: "Paper"
        href: /
      - text: "dFDA Spec"
        href: https://spec.dfda.earth
      - text: "dFDA App"
        href: https://dfda.earth
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /dfda-impact-paper.pdf
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "References"
        href: /#references
      - text: "DIH"
        href: https://dih.earth
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

