project:
  type: website
  output-dir: _site/dfda-impact
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd
    - knowledge/appendix/economist-feedback-dfda.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "💊"
  index-source: knowledge/appendix/dfda-impact-paper.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  pdf-output-file: dfda-impact-paper.pdf
  netlify-site-id: "a314a33e-3155-4067-8624-706266899419"
  netlify-cname: "impact-dfda-earth.netlify.app"
  show-confidence-intervals: true  # Show 95% CI ranges for calculated values in academic papers
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A pill or capsule with an upward impact arrow."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "Ubiquitous Pragmatic Trial Impact Analysis: How to Prevent a Year of Death and Suffering for 84 Cents"
  description: 'Only 15 diseases/year get their first treatment each year. With 6.65 thousand diseases lacking effective treatments, the backlog would take 443 years to clear. Integrating pragmatic trials into standard healthcare increases trial capacity 12.3x, cutting that timeline from 443 years to 36 years. The average untreated disease gets a treatment 212 years earlier, saving 10.7 billion deaths at $0.842 per year of healthy life saved.'
  site-url: https://dfda-impact.warondisease.org
  favicon: assets/icons/dfda-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/dfda-impact-paper.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "dFDA Spec"
        href: https://dfda-spec.warondisease.org
      - text: "Prototype"
        href: https://dfda.earth
      - text: "Economist Review"
        href: knowledge/appendix/economist-feedback-dfda.qmd
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

