project:
  type: book
  output-dir: _site/drug-development-cost
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt

# Custom fields for render-quarto.py
dih-render:
  netlify-cname: "drug-cost-warondisease-org.netlify.app"
  netlify-site-id: "d739329f-a0cb-44b9-91a1-9921345a75c2"
  emoji: "💊"
  index-source: knowledge/appendix/drug-development-cost-analysis.qmd
  redirect-from: https://drug-cost.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  pdf-output-file: drug-development-cost-analysis.pdf
  show-confidence-intervals: true
  concept-terms:
    - term: "Drug Development Cost Increase Analysis"
      manual-target: knowledge/problem/fda-is-unsafe-and-ineffective.qmd
  favicon-prompt: "A pill capsule split open showing dollar signs spilling out"

profiles:
  default:
    dotenv:
      allowEmptyValues: true

book:
  title: "Drug Development Cost Increase Analysis"
  author:
    - name: Mike P. Sinn
      email: m@warondisease.org
      orcid: 0009-0006-0212-1094
      affiliations:
        - name: "Institute for Accelerated Medicine"
          url: https://acceleratedmedicine.org
  description: 'Rigorous analysis of the 105x increase in drug development costs from pre-1962 to 2024, using Baily (1972) academic study with CPI adjustments and sensitivity analysis'
  abstract: "Drug development costs have increased approximately 105x in real terms since the 1962 Kefauver-Harris Amendment. This analysis uses the Baily (1972) academic study as the primary source, adjusts for inflation via Bureau of Labor Statistics CPI data, and validates the finding against six independent real-world price comparisons: generic vs. brand-name drugs, supplements vs. prescriptions, compounding pharmacies vs. FDA-approved products, veterinary vs. human drugs, orphan drug pricing, and historical antibiotic economics. Monte Carlo sensitivity analysis confirms the estimate is robust across plausible input ranges. The magnitude is consistent with independent estimates of 100-400x from multiple research groups."
  site-url: https://manual.warondisease.org/knowledge/appendix/drug-development-cost-analysis.html
  favicon: assets/icons/economics-favicon.png
  page-navigation: true
  chapters:
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd
    - knowledge/references.qmd
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "Full Manual"
        href: https://manual.WarOnDisease.org
  sidebar:
    collapse-level: 1
    style: "floating"
    search: true
    contents:
      - section: "Analysis"
        contents:
          - href: index.html
            text: "Drug Development Cost Analysis"
          - href: knowledge/references.qmd
            text: "References & Citations"

      - section: "Appendices"
        contents:
          - href: knowledge/appendix/parameters-and-calculations.qmd
            text: "Parameters & Calculations"

      - section: "Related Materials"
        contents:
          - href: https://manual.warondisease.org
            text: "Full Manual →"
          - href: https://impact.warondisease.org
            text: "1% Treaty Economic Analysis →"
          - href: https://invisible-graveyard.warondisease.org
            text: "Invisible Graveyard Paper →"

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

