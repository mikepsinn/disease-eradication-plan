"us_dysfunction_premium_vs_switzerland": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_dysfunction_premium_vs_switzerland\" class=\"parameter-link\" data-source-ref=\"oecd-govt-spending\" data-source-type=\"definition\" data-confidence=\"high\" title=\"US 'dysfunction premium' vs Switzerland: US spends 3% more of GDP yet achieves 6.5 fewer years of life expectancy. This premium represents pure waste from governance inefficiency. Calculated as: 38% (US) - 35% (CH). | ✓ High confidence | Dist: Fixed | Formula: US_GOVT_SPENDING_PCT_GDP - SWITZERLAND_GOVT_SPENDING_PCT_GDP | Unit: percent | Click to view details, calculation & sources\">300%</a>"
"us_federal_spending_2024": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_federal_spending_2024\" class=\"parameter-link\" data-source-ref=\"cbo-long-term-budget-2024\" data-source-type=\"external\" data-confidence=\"high\" title=\"US federal government spending in FY2024. CBO reports outlays of $6.8T (23.9% of GDP). Includes mandatory spending, discretionary spending, and net interest ($888B). | ✓ High confidence | Dist: Fixed | Unit: USD | Click to view details, calculation & sources\">$6.8T</a>"
