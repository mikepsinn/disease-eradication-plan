"victory_bond_annual_payout": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-victory_bond_annual_payout\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual VICTORY Incentive Alignment Bond payout (treaty funding × bond percentage) | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_FUNDING × BOND_PCT | Unit: USD/year | Click to view details, calculation & sources\">$2.72B</a>"
"victory_bond_annual_payout_latex": "$$\n\\begin{gathered}\nPayout_{bond,ann} \\\\\n= Funding_{treaty} \\times Pct_{bond} \\\\\n= \\$27.2B \\times 10\\% \\\\\n= \\$2.72B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nFunding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B\n\\end{gathered}\n$$"
"victory_bond_annual_return_pct": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-victory_bond_annual_return_pct\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual return percentage for VICTORY Incentive Alignment Bondholders | Calculated from 2 inputs | ✓ High confidence | Formula: PAYOUT ÷ CAMPAIGN_COST | Unit: rate | Click to view details, calculation & sources\">272%</a>"
"victory_bond_annual_return_pct_latex": "$$\n\\begin{gathered}\nr_{bond} \\\\\n= \\frac{Payout_{bond,ann}}{Cost_{campaign}} \\\\\n= \\frac{\\$2.72B}{\\$1B} \\\\\n= 272\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nPayout_{bond,ann} \\\\\n= Funding_{treaty} \\times Pct_{bond} \\\\\n= \\$27.2B \\times 10\\% \\\\\n= \\$2.72B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nFunding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$"
"victory_bond_funding_pct": "<span class=\"parameter-definition\" title=\"Percentage of captured dividend funding VICTORY Incentive Alignment Bonds (10%) | Unit: rate | Core definition\">10%</span>"
"vitamin_a_cost_per_daly": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-vitamin_a_cost_per_daly\" class=\"parameter-link\" data-source-ref=\"vitamin-a-cost-per-daly\" data-source-type=\"external\" data-confidence=\"medium\" title=\"Cost per DALY for vitamin A supplementation programs (India: $23-50; Africa: $40-255; wide variation by region and baseline VAD prevalence). Using India midpoint as conservative estimate. | ~ Medium confidence | Unit: USD/DALY | Click to view details, calculation & sources\">$37</a>"
"vitamin_a_cost_per_daly_cite": "@vitamin-a-cost-per-daly"
"voter_lives_saved": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-voter_lives_saved\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Lives saved attributable to each voter if the treaty passes (total lives saved ÷ 3.5% voting bloc target) | Calculated from 2 inputs | ✓ High confidence | Formula: DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_LIVES_SAVED ÷ TREATY_CAMPAIGN_VOTING_BLOC_TARGET | Unit: lives | Click to view details, calculation & sources\">38.4 lives (95% CI: 20.6 lives-77.6 lives)</a>"
"voter_lives_saved_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-voter_lives_saved\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Lives saved attributable to each voter if the treaty passes (total lives saved ÷ 3.5% voting bloc target) | Calculated from 2 inputs | ✓ High confidence | Formula: DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_LIVES_SAVED ÷ TREATY_CAMPAIGN_VOTING_BLOC_TARGET | Unit: lives | Click to view details, calculation & sources\">38.4 (95% CI: 20.6-77.6)</a>"
"voter_lives_saved_latex": "$$\n\\begin{gathered}\nLives_{voter} \\\\\n= \\frac{Lives_{max}}{N_{voters,target}} \\\\\n= \\frac{10.7B}{280M} \\\\\n= 38.4\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nLives_{max} \\\\\n= Deaths_{disease,daily} \\times T_{accel,max} \\times 338 \\\\\n= 150{,}000 \\times 212 \\times 338 \\\\\n= 10.7B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{voters,target} \\\\\n= Pop_{global} \\times Threshold_{activism} \\\\\n= 8B \\times 3.5\\% \\\\\n= 280M\n\\end{gathered}\n$$"
"voter_suffering_hours_prevented": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-voter_suffering_hours_prevented\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Hours of suffering prevented attributable to each voter if the treaty passes (total suffering hours ÷ 3.5% voting bloc target) | Calculated from 2 inputs | ✓ High confidence | Formula: DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_SUFFERING_HOURS ÷ TREATY_CAMPAIGN_VOTING_BLOC_TARGET | Unit: hours | Click to view details, calculation & sources\">6.9 million hours (95% CI: 4.01 million hours-12.2 million hours)</a>"
"voter_suffering_hours_prevented_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-voter_suffering_hours_prevented\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Hours of suffering prevented attributable to each voter if the treaty passes (total suffering hours ÷ 3.5% voting bloc target) | Calculated from 2 inputs | ✓ High confidence | Formula: DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_SUFFERING_HOURS ÷ TREATY_CAMPAIGN_VOTING_BLOC_TARGET | Unit: hours | Click to view details, calculation & sources\">6.9 million (95% CI: 4.01 million-12.2 million)</a>"
"voter_suffering_hours_prevented_latex": "$$\n\\begin{gathered}\nHours_{suffer,voter} \\\\\n= \\frac{Hours_{suffer,max}}{N_{voters,target}} \\\\\n= \\frac{1930T}{280M} \\\\\n= 6.9M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nHours_{suffer,max} \\\\\n= DALYs_{max} \\times Pct_{YLD} \\times 8760 \\\\\n= 565B \\times 0.39 \\times 8760 \\\\\n= 1930T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALYs_{max} \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{voters,target} \\\\\n= Pop_{global} \\times Threshold_{activism} \\\\\n= 8B \\times 3.5\\% \\\\\n= 280M\n\\end{gathered}\n$$"
"war_costs_cumulative_20yr_current_trajectory": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-war_costs_cumulative_20yr_current_trajectory\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cumulative global war costs over 20 years if current spending levels continue. The price tag of the status quo trajectory. | Calculated from 1 input | ✓ High confidence | Formula: GLOBAL_ANNUAL_DIRECT_INDIRECT_WAR_COST × 20 | Unit: USD | Click to view details, calculation & sources\">$227T (95% CI: $180T-$281T)</a>"
"war_costs_cumulative_20yr_current_trajectory_latex": "$$\n\\begin{gathered}\nCost_{war,20yr} \\\\\n= Cost_{war,total} \\times 20 \\\\\n= \\$11.4T \\times 20 \\\\\n= \\$227T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,total} \\\\\n= Cost_{war,direct} + Cost_{war,indirect} \\\\\n= \\$7.66T + \\$3.7T \\\\\n= \\$11.4T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,direct} \\\\\n= Loss_{life,conflict} + Damage_{infra,total} \\\\\n+ Disruption_{trade} + Spending_{mil} \\\\\n= \\$2.45T + \\$1.88T + \\$616B + \\$2.72T \\\\\n= \\$7.66T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nLoss_{life,conflict} \\\\\n= Cost_{combat,human} + Cost_{state,human} \\\\\n+ Cost_{terror,human} \\\\\n= \\$2.34T + \\$27B + \\$83B \\\\\n= \\$2.45T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{combat,human} \\\\\n= Deaths_{combat} \\times VSL \\\\\n= 234{,}000 \\times \\$10M \\\\\n= \\$2.34T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{state,human} \\\\\n= Deaths_{state} \\times VSL \\\\\n= 2{,}700 \\times \\$10M \\\\\n= \\$27B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{terror,human} \\\\\n= Deaths_{terror} \\times VSL \\\\\n= 8{,}300 \\times \\$10M \\\\\n= \\$83B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDamage_{infra,total} \\\\\n= Damage_{comms} + Damage_{edu} + Damage_{energy} \\\\\n+ Damage_{health} + Damage_{transport} + Damage_{water} \\\\\n= \\$298B + \\$234B + \\$422B + \\$166B + \\$487B + \\$268B \\\\\n= \\$1.88T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDisruption_{trade} \\\\\n= Disruption_{currency} + Disruption_{energy} \\\\\n+ Disruption_{shipping} + Disruption_{supply} \\\\\n= \\$57.4B + \\$125B + \\$247B + \\$187B \\\\\n= \\$616B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,indirect} \\\\\n= Damage_{env} + Loss_{growth,mil} + Loss_{capital,conflict} \\\\\n+ Cost_{psych} + Cost_{refugee} + Cost_{vet} \\\\\n= \\$100B + \\$2.72T + \\$300B + \\$232B + \\$150B + \\$200B \\\\\n= \\$3.7T\n\\end{gathered}\n$$"
"war_costs_saved_peace_trajectory_20yr": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-war_costs_saved_peace_trajectory_20yr\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cumulative war costs saved over 20 years as treaty expands via IAB ratchet. Assumes war costs decline proportionally to spending cuts (e=1.0). Conservative: Pape research suggests e>1.0 due to terrorism feedback loops. | Calculated from 1 input | ✓ High confidence | Formula: GLOBAL_ANNUAL_DIRECT_INDIRECT_WAR_COST × (0.01×3 + 0.02×4 + 0.05×5 + 0.10×8) | Unit: USD | Click to view details, calculation & sources\">$13.2T (95% CI: $10.5T-$16.3T)</a>"
"war_costs_saved_peace_trajectory_20yr_latex": "$$\n\\begin{gathered}\nSavings_{war,20yr} \\\\\n= Cost_{war,total} \\times 1.16 \\\\\n= \\$11.4T \\times 1.16 \\\\\n= \\$13.2T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,total} \\\\\n= Cost_{war,direct} + Cost_{war,indirect} \\\\\n= \\$7.66T + \\$3.7T \\\\\n= \\$11.4T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,direct} \\\\\n= Loss_{life,conflict} + Damage_{infra,total} \\\\\n+ Disruption_{trade} + Spending_{mil} \\\\\n= \\$2.45T + \\$1.88T + \\$616B + \\$2.72T \\\\\n= \\$7.66T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nLoss_{life,conflict} \\\\\n= Cost_{combat,human} + Cost_{state,human} \\\\\n+ Cost_{terror,human} \\\\\n= \\$2.34T + \\$27B + \\$83B \\\\\n= \\$2.45T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{combat,human} \\\\\n= Deaths_{combat} \\times VSL \\\\\n= 234{,}000 \\times \\$10M \\\\\n= \\$2.34T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{state,human} \\\\\n= Deaths_{state} \\times VSL \\\\\n= 2{,}700 \\times \\$10M \\\\\n= \\$27B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{terror,human} \\\\\n= Deaths_{terror} \\times VSL \\\\\n= 8{,}300 \\times \\$10M \\\\\n= \\$83B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDamage_{infra,total} \\\\\n= Damage_{comms} + Damage_{edu} + Damage_{energy} \\\\\n+ Damage_{health} + Damage_{transport} + Damage_{water} \\\\\n= \\$298B + \\$234B + \\$422B + \\$166B + \\$487B + \\$268B \\\\\n= \\$1.88T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDisruption_{trade} \\\\\n= Disruption_{currency} + Disruption_{energy} \\\\\n+ Disruption_{shipping} + Disruption_{supply} \\\\\n= \\$57.4B + \\$125B + \\$247B + \\$187B \\\\\n= \\$616B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,indirect} \\\\\n= Damage_{env} + Loss_{growth,mil} + Loss_{capital,conflict} \\\\\n+ Cost_{psych} + Cost_{refugee} + Cost_{vet} \\\\\n= \\$100B + \\$2.72T + \\$300B + \\$232B + \\$150B + \\$200B \\\\\n= \\$3.7T\n\\end{gathered}\n$$"
"water_fluoridation_annual_benefit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-water_fluoridation_annual_benefit\" class=\"parameter-link\" data-source-ref=\"clean-water-sanitation-roi\" data-source-type=\"external\" data-confidence=\"high\" title=\"Estimated annual global economic benefit from water fluoridation programs | ✓ High confidence | Unit: USD/year | Click to view details, calculation & sources\">$800M</a>"
