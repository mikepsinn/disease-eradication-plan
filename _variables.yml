"dfda_combined_treatment_speedup_multiplier": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_combined_treatment_speedup_multiplier\"\
  \ class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\"\
  \ data-confidence=\"medium\" title=\"Combined speedup factor for treatment discovery\
  \ from dFDA. Trial capacity multiplier times valley of death rescue multiplier.\
  \ Diseases that would take T years to get first treatment now take T/speedup years.\
  \ | Calculated from 2 inputs | ~ Medium confidence | Formula: DFDA_TRIAL_CAPACITY_MULTIPLIER\
  \ × DFDA_VALLEY_OF_DEATH_RESCUE_MULTIPLIER | Unit: multiplier | Click to view details,\
  \ calculation & sources\">17.2x (95% CI: 5.87x-85.8x)</a>"
"dfda_combined_treatment_speedup_multiplier_latex": "$$\n\\begin{gathered}\nk_{speedup}\
  \ = k_{capacity} \\times k_{rescue} = 12.3 \\times 1.4 = 17.2 \\\\[0.5em]\n\\text{where\
