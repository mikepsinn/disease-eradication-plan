"who_qaly_threshold_cost_effective": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-who_qaly_threshold_cost_effective\" class=\"parameter-link\" data-source-ref=\"who-cost-effectiveness-threshold\" data-source-type=\"external\" data-confidence=\"high\" title=\"Cost-effectiveness threshold widely used in US health economics ($50,000/QALY, from 1980s dialysis costs) | ✓ High confidence | Unit: USD/QALY | Click to view details, calculation & sources\">$50K</a>"
"who_qaly_threshold_cost_effective_cite": "@who-cost-effectiveness-threshold"
"willing_trial_participants_global": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-willing_trial_participants_global\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Global chronic disease patients willing to participate in trials (2.4B × 44.8%) | Calculated from 2 inputs | ~ Medium confidence | Formula: CURRENT_DISEASE_PATIENTS_GLOBAL × PATIENT_WILLINGNESS_TRIAL_PARTICIPATION_PCT | Unit: people | Click to view details, calculation & sources\">1.08 billion people (95% CI: 843 million people-1.34 billion people)</a>"
"willing_trial_participants_global_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-willing_trial_participants_global\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Global chronic disease patients willing to participate in trials (2.4B × 44.8%) | Calculated from 2 inputs | ~ Medium confidence | Formula: CURRENT_DISEASE_PATIENTS_GLOBAL × PATIENT_WILLINGNESS_TRIAL_PARTICIPATION_PCT | Unit: people | Click to view details, calculation & sources\">1.08 billion (95% CI: 843 million-1.34 billion)</a>"
"willing_trial_participants_global_latex": "$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$"
"wishonia_disease_cure_fraction_20yr_full": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_disease_cure_fraction_20yr_full\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Wishonia disease-cure fraction over 20 years under full implementation. Uses full trial-capacity scaling and applies an upper bound of 100% of untreated disease classes. | Calculated from 5 inputs | ✓ High confidence | Formula: min(1.0, NEW_DISEASE_FIRST_TREATMENTS_PER_YEAR × min(DFDA_TRIAL_CAPACITY_MULTIPLIER × (WISHONIA_MILITARY_REALLOCATION_PHYSICAL_MAX_SHARE ÷ 0.01), DFDA_MAX_TRIAL_CAPACITY_MULTIPLIER_PHYSICAL) × 20 ÷ DISEASES_WITHOUT_EFFECTIVE_TREATMENT) | Unit: rate | Click to view details, calculation & sources\">100%</a>"
"wishonia_disease_cure_fraction_20yr_full_latex": "$$\n\\begin{gathered}\nf_{cure,20,wish} \\\\\n= \\min\\left(1,\\frac{Treatments_{new,ann}\\cdot k_{capacity,wish}\\cdot 20}{D_{untreated}}\\right)\n\\end{gathered}\n$$"
"wishonia_military_reallocation_physical_max_share": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_military_reallocation_physical_max_share\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Maximum physically demonstrated military reallocation share, anchored to post-WW2 US demobilization. | Calculated from 1 input | ✓ High confidence | Formula: POST_WW2_MILITARY_CUT_PCT | Unit: rate | Click to view details, calculation & sources\">87.6%</a>"
"wishonia_military_reallocation_physical_max_share_latex": "$$\ns_{mil,max} = Cut_{WW2} = 87.6\\% = 87.6\\%\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCut_{WW2} \\\\\n= 1 - \\frac{Spending_{US,1947}}{Spending_{US,1945}} \\\\\n= 1 - \\frac{\\$176B}{\\$1.42T} \\\\\n= 87.6\\%\n\\end{gathered}\n$$"
"wishonia_path_avg_income_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_path_avg_income_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Average income (GDP per capita) at year 20 under the Wishonia Path. | Calculated from 2 inputs | ✓ High confidence | Formula: WISHONIA_PATH_GDP_YEAR_20 / GLOBAL_POPULATION_2045_PROJECTED | Unit: USD | Click to view details, calculation & sources\">$1.16M (95% CI: $395K-$6.22M)</a>"
"wishonia_path_avg_income_year_20_latex": "$$\n\\bar{y}_{wish,20} = \\frac{GDP_{wish,20}}{Pop_{2045}}\n$$"
"wishonia_path_cagr_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_path_cagr_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Compound annual growth rate implied by Wishonia Path GDP trajectory over 20 years. | Calculated from 2 inputs | ✓ High confidence | Formula: (WISHONIA_PATH_GDP_YEAR_20 ÷ GLOBAL_GDP_2025)^(1/20) - 1 | Unit: rate | Click to view details, calculation & sources\">25.4% (95% CI: 18.8%-36.4%)</a>"
"wishonia_path_cagr_year_20_latex": "$$\n\\begin{gathered}\ng_{wish,CAGR} \\\\\n= \\left(\\frac{GDP_{wish,20}}{GDP_0}\\right)^{1/20} - 1\n\\end{gathered}\n$$"
"wishonia_path_cumulative_lifetime_income": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_path_cumulative_lifetime_income\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cumulative per-capita income over an average remaining lifespan under Wishonia Path. Uses implied per-capita CAGR for years 1-20, then baseline growth from the year-20 level. Conservative: assumes no further acceleration beyond year 20. | Calculated from 4 inputs | ✓ High confidence | Formula: Phase 1: y0*(1+g_pc)*((1+g_pc)^20-1)/g_pc + Phase 2: y20*(1+g_base)*((1+g_base)^(T-20)-1)/g_base | Unit: USD | Click to view details, calculation & sources\">$53.3M (95% CI: $16.3M-$317M)</a>"
"wishonia_path_cumulative_lifetime_income_latex": "$$\n\\begin{gathered}\nY_{cum,wish} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{pc,wish})((1+g_{pc,wish})^{20}-1)}{g_{pc,wish}} \\\\\n+ \\bar{y}_{wish,20} \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}-20}-1)}{g_{base}}\n\\end{gathered}\n$$"
"wishonia_path_gdp_vs_earth_multiplier_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_path_gdp_vs_earth_multiplier_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Wishonia Path GDP at year 20 as a multiple of Earth baseline GDP at year 20. | Calculated from 2 inputs | ✓ High confidence | Formula: WISHONIA_PATH_GDP_YEAR_20 ÷ EARTH_GDP_YEAR_20 | Unit: x | Click to view details, calculation & sources\">56.7x (95% CI: 19.3x-304x)</a>"
"wishonia_path_gdp_vs_earth_multiplier_year_20_latex": "$$\n\\begin{gathered}\nk_{wish:earth,20} \\\\\n= \\frac{GDP_{wish,20}}{GDP_{earth,20}} \\\\\n= \\frac{\\$10700T}{\\$188T} \\\\\n= 56.7\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{wish,20}=GDP_0(1+g_{ramp})^3(1+g_{full})^{17}\n$$\n\nwhere:\n\n$$\ns_{mil,max} = Cut_{WW2} = 87.6\\% = 87.6\\%\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCut_{WW2} \\\\\n= 1 - \\frac{Spending_{US,1947}}{Spending_{US,1945}} \\\\\n= 1 - \\frac{\\$176B}{\\$1.42T} \\\\\n= 87.6\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nf_{cure,20,wish} \\\\\n= \\min\\left(1,\\frac{Treatments_{new,ann}\\cdot k_{capacity,wish}\\cdot 20}{D_{untreated}}\\right)\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity,max} \\\\\n= \\frac{N_{willing}}{Slots_{curr}} \\\\\n= \\frac{1.08B}{1.9M} \\\\\n= 566\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{earth,20} = GDP_0(1+g_{base})^{20}\n$$"
"wishonia_path_gdp_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_path_gdp_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Projected global GDP at year 20 under the Wishonia Path. Model applies all Wishonia policy channels and redirects the full Political Dysfunction Tax non-health opportunity pool to highest-marginal-value uses. Health recovery is modeled separately through disease burden removal to avoid overlap. Military and non-health reallocation effects are ramped at 50% intensity for the first 3 years, then 100% for years 4-20, reflecting implementation lag. Military reallocation uses a physically demonstrated upper bound (post-WW2 demobilization) rather than an arbitrary policy cap. | Calculated from 12 inputs | ✓ High confidence | Formula: GLOBAL_GDP_2025 × (1 + g_ramp)^3 × (1 + g_full)^17, where years 1-3 use 50% of military and non-health reallocation intensity, and years 4-20 use 100%; both include disease-burden recovery | Unit: USD | Click to view details, calculation & sources\">$10.7 quadrillion (95% CI: $3.64 quadrillion-$57.2 quadrillion)</a>"
"wishonia_path_gdp_year_20_latex": "$$\nGDP_{wish,20}=GDP_0(1+g_{ramp})^3(1+g_{full})^{17}\n$$"
"wishonia_path_lifetime_income_gain_per_capita": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_path_lifetime_income_gain_per_capita\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Lifetime per-capita income gain from Wishonia Path vs Earth baseline. Cumulative Wishonia income minus cumulative Earth income over average remaining lifespan. | Calculated from 2 inputs | ✓ High confidence | Formula: WISHONIA_PATH_CUMULATIVE_LIFETIME_INCOME - EARTH_CUMULATIVE_LIFETIME_INCOME | Unit: USD | Click to view details, calculation & sources\">$52.1M (95% CI: $15.3M-$316M)</a>"
"wishonia_path_lifetime_income_gain_per_capita_latex": "$$\n\\begin{gathered}\n\\Delta Y_{lifetime,wish} \\\\\n= Y_{cum,wish} - Y_{cum,earth} \\\\\n= \\$53.3M - \\$1.18M \\\\\n= \\$52.1M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,wish} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{pc,wish})((1+g_{pc,wish})^{20}-1)}{g_{pc,wish}} \\\\\n+ \\bar{y}_{wish,20} \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}-20}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{0} \\\\\n= \\frac{GDP_{global}}{Pop_{global}} \\\\\n= \\frac{\\$115T}{8B} \\\\\n= \\$14.4K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\bar{y}_{wish,20} = \\frac{GDP_{wish,20}}{Pop_{2045}}\n$$\n\nwhere:\n\n$$\nGDP_{wish,20}=GDP_0(1+g_{ramp})^3(1+g_{full})^{17}\n$$\n\nwhere:\n\n$$\ns_{mil,max} = Cut_{WW2} = 87.6\\% = 87.6\\%\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCut_{WW2} \\\\\n= 1 - \\frac{Spending_{US,1947}}{Spending_{US,1945}} \\\\\n= 1 - \\frac{\\$176B}{\\$1.42T} \\\\\n= 87.6\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nf_{cure,20,wish} \\\\\n= \\min\\left(1,\\frac{Treatments_{new,ann}\\cdot k_{capacity,wish}\\cdot 20}{D_{untreated}}\\right)\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity,max} \\\\\n= \\frac{N_{willing}}{Slots_{curr}} \\\\\n= \\frac{1.08B}{1.9M} \\\\\n= 566\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{remaining} \\\\\n= LE_{global} - Age_{median} \\\\\n= 79 - 30.5 \\\\\n= 48.5\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,earth} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{earth,20} \\\\\n= \\frac{GDP_{earth,20}}{Pop_{2045}} \\\\\n= \\frac{\\$188T}{9.2B} \\\\\n= \\$20.5K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{earth,20} = GDP_0(1+g_{base})^{20}\n$$"
"wishonia_path_lifetime_income_multiplier": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-wishonia_path_lifetime_income_multiplier\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Ratio of cumulative lifetime income under Wishonia Path vs Earth baseline. Income-agnostic: applies as a multiplier to any individual's lifetime earnings. | Calculated from 2 inputs | ✓ High confidence | Formula: WISHONIA_PATH_CUMULATIVE_LIFETIME_INCOME / EARTH_CUMULATIVE_LIFETIME_INCOME | Unit: x | Click to view details, calculation & sources\">45x (95% CI: 15.3x-242x)</a>"
