"us_federal_spending_per_capita": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_federal_spending_per_capita\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"US federal spending per capita. $6.8T total federal spending divided by 335M population. | Calculated from 2 inputs | ✓ High confidence | Formula: US_FEDERAL_SPENDING_2024 / US_POPULATION_2024 | Unit: USD/person | Click to view details, calculation & sources\">$20.3K (95% CI: $20K-$20.6K)</a>"
"us_federal_spending_per_capita_latex": "$$\n\\begin{gathered}\nSpend_{fed,pc} \\\\\n= \\frac{Spending_{federal}}{Pop_{US}} \\\\\n= \\frac{\\$6.8T}{335M} \\\\\n= \\$20.3K\n\\end{gathered}\n$$"
"us_fed_discretionary_efficiency": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_fed_discretionary_efficiency\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"US federal discretionary spending efficiency. What fraction of discretionary spending avoids direct waste (Cat 1 only: military overspend, corporate welfare, drug war, fossil/ag subsidies). ~41%. Some Cat 1 items (farm subsidies, tax expenditures) are technically mandatory/off-budget but are fungible policy choices. | Calculated from 2 inputs | ~ Medium confidence | Formula: 1 - (CAT1 / DISCRETIONARY) | Unit: percent | Click to view details, calculation & sources\">40.5% (95% CI: 23.8%-53.5%)</a>"
"us_fed_discretionary_efficiency_latex": "$$\n\\begin{gathered}\nE_{US,disc} \\\\\n= 1 - \\frac{W_{cat1}}{Spending_{fed}} \\\\\n= 1 - \\frac{\\$1.01T}{\\$1.7T} \\\\\n= 40.5\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{cat1} \\\\\n= W_{military} + W_{corporate} + W_{drugs} + W_{fossil} \\\\\n+ W_{agriculture} \\\\\n= \\$615B + \\$181B + \\$90B + \\$50B + \\$75B \\\\\n= \\$1.01T\n\\end{gathered}\n$$"
"us_fed_discretionary_spending_2024": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_fed_discretionary_spending_2024\" class=\"parameter-link\" data-source-ref=\"cbo-long-term-budget-2024\" data-source-type=\"external\" data-confidence=\"high\" title=\"US federal discretionary spending in FY2024. Approximately $886B defense + ~$814B non-defense discretionary = ~$1.7T. Used as denominator for discretionary efficiency rating (Cat 1 waste items are discretionary/fungible). | ✓ High confidence | Dist: Fixed | Unit: USD | Click to view details, calculation & sources\">$1.7T</a>"
"us_fed_discretionary_spending_2024_cite": "@cbo-long-term-budget-2024"
"us_fed_discretionary_waste_pct": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_fed_discretionary_waste_pct\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Category 1 direct spending waste as percentage of federal discretionary spending. ~$1.01T Cat 1 waste / $1.7T discretionary = ~59%. Uses discretionary spending as denominator because Cat 1 items (military overspend, corporate welfare, drug war, fossil/ag subsidies) are fungible policy choices within discretionary budget. | Calculated from 2 inputs | ~ Medium confidence | Formula: US_GOV_WASTE_CATEGORY_1_DIRECT_SPENDING / US_FED_DISCRETIONARY_SPENDING_2024 | Unit: percent | Click to view details, calculation & sources\">59.5% (95% CI: 46.5%-76.2%)</a>"
"us_fed_discretionary_waste_pct_latex": "$$\n\\begin{gathered}\nW_{US,\\%disc} \\\\\n= \\frac{W_{cat1}}{Spending_{fed}} \\\\\n= \\frac{\\$1.01T}{\\$1.7T} \\\\\n= 59.5\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{cat1} \\\\\n= W_{military} + W_{corporate} + W_{drugs} + W_{fossil} \\\\\n+ W_{agriculture} \\\\\n= \\$615B + \\$181B + \\$90B + \\$50B + \\$75B \\\\\n= \\$1.01T\n\\end{gathered}\n$$"
"us_gdp_2024": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gdp_2024\" class=\"parameter-link\" data-source-ref=\"worldbank-gdp\" data-source-type=\"external\" data-confidence=\"high\" title=\"US GDP in 2024 dollars for calculating policy costs as percentage of GDP. | ✓ High confidence | Dist: Fixed | Unit: USD | Click to view details, calculation & sources\">$28.8T</a>"
"us_gdp_2024_cite": "@worldbank-gdp"
"us_governance_efficiency_gdp": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_governance_efficiency_gdp\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Total US governance efficiency: all 4 waste categories as share of GDP. 1 - ($4.9T / $28.78T) = ~83%. This broader metric captures direct spending waste, compliance burden, policy-induced GDP loss, and system inefficiency relative to total economic output. | Calculated from 2 inputs | ~ Medium confidence | Formula: 1 - (US_GOV_WASTE_TOTAL / US_GDP) | Unit: percent | Click to view details, calculation & sources\">83% (95% CI: 77.4%-87.4%)</a>"
"us_governance_efficiency_gdp_latex": "$$\n\\begin{gathered}\nE_{US,GDP} \\\\\n= 1 - \\frac{W_{total,US}}{USGDP} \\\\\n= 1 - \\frac{\\$4.9T}{\\$28.8T} \\\\\n= 83\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{total,US} \\\\\n= W_{raw,US} \\times US \\\\\n= \\$4.9T \\times 1 \\\\\n= \\$4.9T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{raw,US} \\\\\n= W_{health} + W_{housing} + W_{military} + W_{regulatory} \\\\\n+ W_{tax} + W_{corporate} + W_{tariffs} + W_{drugs} \\\\\n+ W_{fossil} + W_{agriculture} \\\\\n= \\$1.2T + \\$1.4T + \\$615B + \\$580B + \\$546B + \\$181B + \\$160B \\\\\n+ \\$90B + \\$50B + \\$75B \\\\\n= \\$4.9T\n\\end{gathered}\n$$"
"us_govt_spending_pct_gdp": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_govt_spending_pct_gdp\" class=\"parameter-link\" data-source-ref=\"oecd-govt-spending\" data-source-type=\"external\" data-confidence=\"high\" title=\"US total government spending as percentage of GDP (federal + state + local). OECD average is ~40%, but US gets worse outcomes for similar spending. | ✓ High confidence | Dist: Fixed | Unit: percent | Click to view details, calculation & sources\">3800%</a>"
"us_govt_spending_pct_gdp_cite": "@oecd-govt-spending"
"us_gov_waste_agricultural_subsidies": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_agricultural_subsidies\" class=\"parameter-link\" data-source-ref=\"ewg-farm-subsidies\" data-source-type=\"external\" data-confidence=\"high\" title=\"Deadweight loss from US agricultural subsidies. Direct subsidies ~$30B/yr but create larger distortions: overproduction, environmental damage, benefits concentrated in large farms (top 10% receive 78% of subsidies). Total welfare loss ~$75B. Textbook example of capture; very high economist consensus. [CATEGORY 1: Direct Spending] | ✓ High confidence | 95% CI: [$50B, $120B] | Dist: Lognormal (SE: $25B) | Unit: USD | Click to view details, calculation & sources\">$75B (95% CI: $50B-$120B)</a>"
"us_gov_waste_agricultural_subsidies_cite": "@ewg-farm-subsidies"
"us_gov_waste_category_1_direct_spending": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_category_1_direct_spending\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Category 1: Direct Federal Spending Waste. Actual federal budget allocations that could be redirected. Includes military overspend ($615B), corporate welfare ($181B), drug war ($90B), fossil fuel subsidies ($50B), and agricultural subsidies ($75B). Total: ~$1.01T annually. Solution: Budget reallocation. | Calculated from 5 inputs | ~ Medium confidence | Formula: Military + Corporate + Drug War + Fossil + Agriculture | Unit: USD | Click to view details, calculation & sources\">$1.01T (95% CI: $790B-$1.3T)</a>"
"us_gov_waste_category_1_direct_spending_latex": "$$\n\\begin{gathered}\nW_{cat1} \\\\\n= W_{military} + W_{corporate} + W_{drugs} + W_{fossil} \\\\\n+ W_{agriculture} \\\\\n= \\$615B + \\$181B + \\$90B + \\$50B + \\$75B \\\\\n= \\$1.01T\n\\end{gathered}\n$$"
"us_gov_waste_category_2_compliance": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_category_2_compliance\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Category 2: Compliance Burden on Private Sector. Private sector resources consumed by government-imposed compliance requirements. Includes tax compliance ($546B) and regulatory red tape ($580B). Total: ~$1.13T annually. Solution: Simplification (tax code reform, regulatory streamlining). | Calculated from 2 inputs | ~ Medium confidence | Formula: Tax Compliance + Regulatory Red Tape | Unit: USD | Click to view details, calculation & sources\">$1.13T (95% CI: $775B-$1.58T)</a>"
"us_gov_waste_category_2_compliance_latex": "$$\n\\begin{gathered}\nW_{cat2} \\\\\n= W_{tax} + W_{regulatory} \\\\\n= \\$546B + \\$580B \\\\\n= \\$1.13T\n\\end{gathered}\n$$"
"us_gov_waste_category_3_gdp_loss": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_category_3_gdp_loss\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Category 3: Policy-Induced GDP Loss. Economic output foregone due to policy constraints on markets. Includes housing/zoning restrictions ($1.4T) and tariffs ($160B). Total: ~$1.56T annually. Solution: Policy reform (zoning liberalization, trade policy). | Calculated from 2 inputs | ~ Medium confidence | Formula: Housing/Zoning + Tariffs | Unit: USD | Click to view details, calculation & sources\">$1.56T (95% CI: $1.05T-$2.18T)</a>"
"us_gov_waste_category_3_gdp_loss_latex": "$$\n\\begin{gathered}\nW_{cat3} \\\\\n= W_{housing} + W_{tariffs} \\\\\n= \\$1.4T + \\$160B \\\\\n= \\$1.56T\n\\end{gathered}\n$$"
"us_gov_waste_category_4_system": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_category_4_system\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Category 4: Total System Inefficiency. Fundamental system design failures requiring structural redesign. Currently only healthcare system inefficiency ($1.2T). Solution: System redesign using competitive market models (Singapore's catastrophic coverage + HSAs, Switzerland's regulated competition). | Calculated from 1 input | ✓ High confidence | Formula: Healthcare Inefficiency | Unit: USD | Click to view details, calculation & sources\">$1.2T (95% CI: $1T-$1.45T)</a>"
"us_gov_waste_category_4_system_latex": "$$\nW_{cat4} = W_{health} = \\$1.2T = \\$1.2T\n$$"
"us_gov_waste_corporate_welfare": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_corporate_welfare\" class=\"parameter-link\" data-source-ref=\"political-dysfunction-tax-paper-2025\" data-source-type=\"external\" data-confidence=\"high\" title=\"Direct US federal corporate welfare: subsidies to agriculture ($16.4B), green energy tax credits, semiconductor aid, aviation support. Agricultural subsidies are highly regressive (top 10% receive 63%). Cato Institute forensic tally. [CATEGORY 1: Direct Spending] | ✓ High confidence | 95% CI: [$150B, $220B] | Dist: Normal (SE: $20B) | Unit: USD | Click to view details, calculation & sources\">$181B (95% CI: $150B-$220B)</a>"
"us_gov_waste_corporate_welfare_cite": "@political-dysfunction-tax-paper-2025"
"us_gov_waste_drug_war": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_drug_war\" class=\"parameter-link\" data-source-ref=\"drugpolicyalliance2021\" data-source-type=\"external\" data-confidence=\"medium\" title=\"Annual cost of drug war: ~$41B federal drug control budget, ~$10B state/local enforcement, ~$40B incarceration and lost productivity. After 50+ years and $1T+ spent, drug use is higher than ever. [CATEGORY 1: Direct Spending] | ~ Medium confidence | 95% CI: [$60B, $150B] | Dist: Lognormal (SE: $30B) | Unit: USD | Click to view details, calculation & sources\">$90B (95% CI: $60B-$150B)</a>"
"us_gov_waste_drug_war_cite": "@drugpolicyalliance2021"
"us_gov_waste_fossil_fuel_subsidies": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_fossil_fuel_subsidies\" class=\"parameter-link\" data-source-ref=\"imf-fossilfuel2023\" data-source-type=\"external\" data-confidence=\"medium\" title=\"US explicit fossil fuel subsidies (direct payments, tax breaks). IMF estimates US total subsidies at $649B but ~92% is implicit (externalities). This figure includes only explicit subsidies (~$50B) for defensibility. [CATEGORY 1: Direct Spending] | ~ Medium confidence | 95% CI: [$30B, $80B] | Dist: Lognormal (SE: $15B) | Unit: USD | Click to view details, calculation & sources\">$50B (95% CI: $30B-$80B)</a>"
"us_gov_waste_fossil_fuel_subsidies_cite": "@imf-fossilfuel2023"
"us_gov_waste_healthcare_inefficiency": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_healthcare_inefficiency\" class=\"parameter-link\" data-source-ref=\"papanicolas2018\" data-source-type=\"external\" data-confidence=\"high\" title=\"US healthcare spending inefficiency. US spends ~$4.5T/yr (18% GDP) vs 9-11% in comparable OECD countries with similar/better outcomes. Papanicolas et al. (2018 JAMA) and multiple studies document $1-1.5T in excess spending from administrative complexity, high prices, and poor care coordination. Very high economist consensus. [CATEGORY 4: System Inefficiency] | ✓ High confidence | 95% CI: [$1T, $1.5T] | Dist: Normal (SE: $150B) | Unit: USD | Click to view details, calculation & sources\">$1.2T (95% CI: $1T-$1.5T)</a>"
"us_gov_waste_healthcare_inefficiency_cite": "@papanicolas2018"
"us_gov_waste_housing_zoning": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_housing_zoning\" class=\"parameter-link\" data-source-ref=\"hsieh-moretti2019\" data-source-type=\"external\" data-confidence=\"medium\" title=\"GDP loss from housing/zoning restrictions. Original Hsieh-Moretti (2019 AEJ:Macro) estimate of 36% GDP growth reduction was substantially revised by Greaney (2023). Current $1.4T represents a moderate estimate; revised lower bound implies ~$500B. [CATEGORY 3: GDP Loss] | ~ Medium confidence | 95% CI: [$500B, $2T] | Dist: Lognormal (SE: $300B) | Unit: USD | Click to view details, calculation & sources\">$1.4T (95% CI: $500B-$2T)</a>"
"us_gov_waste_housing_zoning_cite": "@hsieh-moretti2019"
"us_gov_waste_military_overspend": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_military_overspend\" class=\"parameter-link\" data-source-ref=\"political-dysfunction-tax-paper-2025\" data-source-type=\"external\" data-confidence=\"medium\" title=\"US military spending above 'Strict Deterrence' baseline. Current budget ~$900B supports global power projection (750+ bases). Strict Deterrence (nuclear triad $95B, Coast Guard $14B, National Guard $33B, Missile Defense $28B, Cyber $15B, defensive Navy/Air Force $100B) = ~$285B. Delta: $900B - $285B = $615B 'Hegemony Tax'. [CATEGORY 1: Direct Spending] | ~ Medium confidence | 95% CI: [$500B, $750B] | Dist: Normal (SE: $75B) | Unit: USD | Click to view details, calculation & sources\">$615B (95% CI: $500B-$750B)</a>"
"us_gov_waste_military_overspend_cite": "@political-dysfunction-tax-paper-2025"
"us_gov_waste_overlap_discount": "<span class=\"parameter-definition\" title=\"Overlap discount factor between US government waste categories. Set to 1.0 (no discount). Categories are treated as additive, recognizing that any overlap is offset by excluded categories (state/local inefficiency, implicit subsidies, behavioral effects). | Unit: ratio | Core definition\">1</span>"
"us_gov_waste_pct_gdp": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_pct_gdp\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"US government waste as percentage of GDP. ~$4.90T waste / $28.78T GDP = ~17%. This represents the 'dysfunction tax' that American citizens effectively pay through inefficient governance. | Calculated from 2 inputs | ~ Medium confidence | Formula: US_GOV_WASTE_TOTAL / US_GDP | Unit: percent | Click to view details, calculation & sources\">17% (95% CI: 12.6%-22.6%)</a>"
"us_gov_waste_pct_gdp_latex": "$$\n\\begin{gathered}\nW_{US,\\%GDP} \\\\\n= \\frac{W_{total,US}}{USGDP} \\\\\n= \\frac{\\$4.9T}{\\$28.8T} \\\\\n= 17\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{total,US} \\\\\n= W_{raw,US} \\times US \\\\\n= \\$4.9T \\times 1 \\\\\n= \\$4.9T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{raw,US} \\\\\n= W_{health} + W_{housing} + W_{military} + W_{regulatory} \\\\\n+ W_{tax} + W_{corporate} + W_{tariffs} + W_{drugs} \\\\\n+ W_{fossil} + W_{agriculture} \\\\\n= \\$1.2T + \\$1.4T + \\$615B + \\$580B + \\$546B + \\$181B + \\$160B \\\\\n+ \\$90B + \\$50B + \\$75B \\\\\n= \\$4.9T\n\\end{gathered}\n$$"
"us_gov_waste_qaly_equivalents": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_qaly_equivalents\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"US government waste expressed as QALY equivalents. This is an economic equivalent, NOT epidemiological health outcomes. Dividing by QALY threshold yields a measure of foregone welfare. | Calculated from 2 inputs | ~ Medium confidence | Formula: US_GOV_WASTE_TOTAL / QALY_THRESHOLD | Unit: QALYs | Click to view details, calculation & sources\">49 million QALYs (95% CI: 36.2 million QALYs-65 million QALYs)</a>"
"us_gov_waste_qaly_equivalents_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_qaly_equivalents\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"US government waste expressed as QALY equivalents. This is an economic equivalent, NOT epidemiological health outcomes. Dividing by QALY threshold yields a measure of foregone welfare. | Calculated from 2 inputs | ~ Medium confidence | Formula: US_GOV_WASTE_TOTAL / QALY_THRESHOLD | Unit: QALYs | Click to view details, calculation & sources\">49 million (95% CI: 36.2 million-65 million)</a>"
"us_gov_waste_qaly_equivalents_latex": "$$\n\\begin{gathered}\nW_{US,QALY} \\\\\n= \\frac{W_{total,US}}{QALY_{threshold}} \\\\\n= \\frac{\\$4.9T}{\\$100K} \\\\\n= 49M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{total,US} \\\\\n= W_{raw,US} \\times US \\\\\n= \\$4.9T \\times 1 \\\\\n= \\$4.9T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{raw,US} \\\\\n= W_{health} + W_{housing} + W_{military} + W_{regulatory} \\\\\n+ W_{tax} + W_{corporate} + W_{tariffs} + W_{drugs} \\\\\n+ W_{fossil} + W_{agriculture} \\\\\n= \\$1.2T + \\$1.4T + \\$615B + \\$580B + \\$546B + \\$181B + \\$160B \\\\\n+ \\$90B + \\$50B + \\$75B \\\\\n= \\$4.9T\n\\end{gathered}\n$$"
"us_gov_waste_raw_total": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_raw_total\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Raw sum of US government waste components before overlap discount: healthcare ($1.2T) + housing ($1.4T) + military ($615B) + regulatory ($580B) + tax ($546B) + corporate ($181B) + tariffs ($160B) + drug war ($90B) + fossil fuel ($50B) + agriculture ($75B) = ~$4.9T raw. | Calculated from 10 inputs | ~ Medium confidence | Formula: SUM(all 10 components) | Unit: USD | Click to view details, calculation & sources\">$4.9T (95% CI: $3.62T-$6.5T)</a>"
"us_gov_waste_raw_total_latex": "$$\n\\begin{gathered}\nW_{raw,US} \\\\\n= W_{health} + W_{housing} + W_{military} + W_{regulatory} \\\\\n+ W_{tax} + W_{corporate} + W_{tariffs} + W_{drugs} \\\\\n+ W_{fossil} + W_{agriculture} \\\\\n= \\$1.2T + \\$1.4T + \\$615B + \\$580B + \\$546B + \\$181B + \\$160B \\\\\n+ \\$90B + \\$50B + \\$75B \\\\\n= \\$4.9T\n\\end{gathered}\n$$"
"us_gov_waste_recoverable": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_recoverable\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"low\" title=\"Recoverable capital if US improved to OECD median efficiency. Current US efficiency ~38-48%; OECD median ~75-85%. Closing to ~80% would recover approximately half the gap. | Calculated from 1 input | ? Low confidence | Formula: US_GOV_WASTE_TOTAL x 0.50 | Unit: USD | Click to view details, calculation & sources\">$2.45T (95% CI: $1.81T-$3.25T)</a>"
"us_gov_waste_recoverable_latex": "$$\n\\begin{gathered}\nW_{US,recoverable} \\\\\n= W_{total,US} \\times 0.5 \\\\\n= \\$4.9T \\times 0.5 \\\\\n= \\$2.45T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{total,US} \\\\\n= W_{raw,US} \\times US \\\\\n= \\$4.9T \\times 1 \\\\\n= \\$4.9T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{raw,US} \\\\\n= W_{health} + W_{housing} + W_{military} + W_{regulatory} \\\\\n+ W_{tax} + W_{corporate} + W_{tariffs} + W_{drugs} \\\\\n+ W_{fossil} + W_{agriculture} \\\\\n= \\$1.2T + \\$1.4T + \\$615B + \\$580B + \\$546B + \\$181B + \\$160B \\\\\n+ \\$90B + \\$50B + \\$75B \\\\\n= \\$4.9T\n\\end{gathered}\n$$"
"us_gov_waste_regulatory_red_tape": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_regulatory_red_tape\" class=\"parameter-link\" data-source-ref=\"political-dysfunction-tax-paper-2025\" data-source-type=\"external\" data-confidence=\"medium\" title=\"Deadweight loss from US regulatory red tape (procedural friction without safety benefits). Competitive Enterprise Institute estimates total regulatory burden at $2.15T; European studies find red tape costs 0.1-4% of GDP. Conservative estimate: ~2% of US GDP = $580B. [CATEGORY 2: Compliance Burden] | ~ Medium confidence | 95% CI: [$290B, $1T] | Dist: Lognormal (SE: $200B) | Unit: USD | Click to view details, calculation & sources\">$580B (95% CI: $290B-$1T)</a>"
"us_gov_waste_regulatory_red_tape_cite": "@political-dysfunction-tax-paper-2025"
"us_gov_waste_tariffs": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_tariffs\" class=\"parameter-link\" data-source-ref=\"yalebudgetlab2025\" data-source-type=\"external\" data-confidence=\"medium\" title=\"Annual GDP reduction from US tariffs and retaliation. Yale Budget Lab estimates 0.6% smaller GDP in long run, equivalent to $160B annually. Trade barriers reduce efficiency and raise consumer prices. [CATEGORY 3: GDP Loss] | ~ Medium confidence | 95% CI: [$90B, $250B] | Dist: Normal (SE: $50B) | Unit: USD | Click to view details, calculation & sources\">$160B (95% CI: $90B-$250B)</a>"
"us_gov_waste_tariffs_cite": "@yalebudgetlab2025"
"us_gov_waste_tax_compliance": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_tax_compliance\" class=\"parameter-link\" data-source-ref=\"taxfoundation2024-compliance\" data-source-type=\"external\" data-confidence=\"high\" title=\"Annual cost of US tax code compliance: 7.9 billion hours of lost productivity ($413B) plus $133B in out-of-pocket costs. Equals nearly 2% of GDP. Could be largely eliminated with simplified tax code or return-free filing. [CATEGORY 2: Compliance Burden] | ✓ High confidence | 95% CI: [$450B, $650B] | Dist: Normal (SE: $50B) | Unit: USD | Click to view details, calculation & sources\">$546B (95% CI: $450B-$650B)</a>"
"us_gov_waste_tax_compliance_cite": "@taxfoundation2024-compliance"
"us_gov_waste_total": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_total\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Total annual US government waste (additive sum of components). Consolidates healthcare ($1.2T), housing ($1.4T), military ($615B), regulatory ($580B), tax ($546B), corporate ($181B), tariffs ($160B), drug war ($90B), fossil fuel ($50B), agriculture ($75B). Categories treated as additive; any overlap offset by excluded categories (state/local inefficiency, implicit subsidies, behavioral effects). ~$4.9T annually. | Calculated from 2 inputs | ~ Medium confidence | Formula: SUM(all components) | Unit: USD | Click to view details, calculation & sources\">$4.9T (95% CI: $3.62T-$6.5T)</a>"
"us_gov_waste_total_latex": "$$\n\\begin{gathered}\nW_{total,US} \\\\\n= W_{raw,US} \\times US \\\\\n= \\$4.9T \\times 1 \\\\\n= \\$4.9T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{raw,US} \\\\\n= W_{health} + W_{housing} + W_{military} + W_{regulatory} \\\\\n+ W_{tax} + W_{corporate} + W_{tariffs} + W_{drugs} \\\\\n+ W_{fossil} + W_{agriculture} \\\\\n= \\$1.2T + \\$1.4T + \\$615B + \\$580B + \\$546B + \\$181B + \\$160B \\\\\n+ \\$90B + \\$50B + \\$75B \\\\\n= \\$4.9T\n\\end{gathered}\n$$"
"us_gov_waste_vsl_equivalents": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_vsl_equivalents\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"US government waste expressed as VSL equivalents. This is an economic equivalent, NOT literal deaths. Dividing the efficiency gap by VSL yields a measure of foregone welfare. | Calculated from 2 inputs | ~ Medium confidence | Formula: US_GOV_WASTE_TOTAL / DOT_VSL | Unit: people | Click to view details, calculation & sources\">357 thousand people (95% CI: 264 thousand people-475 thousand people)</a>"
"us_gov_waste_vsl_equivalents_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_vsl_equivalents\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"US government waste expressed as VSL equivalents. This is an economic equivalent, NOT literal deaths. Dividing the efficiency gap by VSL yields a measure of foregone welfare. | Calculated from 2 inputs | ~ Medium confidence | Formula: US_GOV_WASTE_TOTAL / DOT_VSL | Unit: people | Click to view details, calculation & sources\">357 thousand (95% CI: 264 thousand-475 thousand)</a>"
"us_gov_waste_vsl_equivalents_latex": "$$\n\\begin{gathered}\nW_{US,VSL} \\\\\n= \\frac{W_{total,US}}{VSL_{DOT}} \\\\\n= \\frac{\\$4.9T}{\\$13.7M} \\\\\n= 357{,}000\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{total,US} \\\\\n= W_{raw,US} \\times US \\\\\n= \\$4.9T \\times 1 \\\\\n= \\$4.9T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{raw,US} \\\\\n= W_{health} + W_{housing} + W_{military} + W_{regulatory} \\\\\n+ W_{tax} + W_{corporate} + W_{tariffs} + W_{drugs} \\\\\n+ W_{fossil} + W_{agriculture} \\\\\n= \\$1.2T + \\$1.4T + \\$615B + \\$580B + \\$546B + \\$181B + \\$160B \\\\\n+ \\$90B + \\$50B + \\$75B \\\\\n= \\$4.9T\n\\end{gathered}\n$$"
"us_gov_waste_vs_treaty_multiplier": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_gov_waste_vs_treaty_multiplier\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"How many times the US government efficiency gap could fund the 1% Treaty. The efficiency gap represents capital that could fund transformative health research many times over. | Calculated from 2 inputs | ~ Medium confidence | Formula: US_GOV_WASTE_TOTAL / TREATY_ANNUAL_FUNDING | Unit: ratio | Click to view details, calculation & sources\">180 (95% CI: 133-239)</a>"
"us_gov_waste_vs_treaty_multiplier_latex": "$$\n\\begin{gathered}\nk_{waste:treaty} \\\\\n= \\frac{W_{total,US}}{Funding_{treaty}} \\\\\n= \\frac{\\$4.9T}{\\$27.2B} \\\\\n= 180\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{total,US} \\\\\n= W_{raw,US} \\times US \\\\\n= \\$4.9T \\times 1 \\\\\n= \\$4.9T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nW_{raw,US} \\\\\n= W_{health} + W_{housing} + W_{military} + W_{regulatory} \\\\\n+ W_{tax} + W_{corporate} + W_{tariffs} + W_{drugs} \\\\\n+ W_{fossil} + W_{agriculture} \\\\\n= \\$1.2T + \\$1.4T + \\$615B + \\$580B + \\$546B + \\$181B + \\$160B \\\\\n+ \\$90B + \\$50B + \\$75B \\\\\n= \\$4.9T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nFunding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B\n\\end{gathered}\n$$"
"us_heart_disease_annual_cost": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_heart_disease_annual_cost\" class=\"parameter-link\" data-source-ref=\"disease-cost-heart-disease-2100b\" data-source-type=\"external\" data-peer-reviewed=\"true\" data-confidence=\"high\" title=\"Annual US cost of heart disease and stroke (direct and indirect) | ✓ High confidence | \U0001F4CA Peer-reviewed | 95% CI: [$309B, $417B] | Dist: Lognormal | Unit: USD | Click to view details, calculation & sources\">$363B (95% CI: $309B-$417B)</a>"
