"us_vs_switzerland_life_expectancy_gap_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_vs_switzerland_life_expectancy_gap\" class=\"parameter-link\" data-source-ref=\"who-life-expectancy\" data-source-type=\"definition\" data-confidence=\"high\" title=\"Life expectancy gap: Switzerland vs US. Switzerland achieves 6.5 extra years of life while spending 3% LESS of GDP on government. | ✓ High confidence | Dist: Fixed | Formula: SWITZERLAND_LE - US_LE = 84.0 - 77.5 | Unit: years | Click to view details, calculation & sources\">6.5</a>"
