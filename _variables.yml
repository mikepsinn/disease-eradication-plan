"us_vote_expected_value": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_vote_expected_value\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Expected monetary value of a single vote in a US presidential election. Calculated as the probability of being decisive (1 in 60M) times federal spending per capita (~$20,300). Represents the expected influence over government resource allocation from casting one vote. | Calculated from 2 inputs | ✓ High confidence | Formula: US_VOTE_DECISIVE_PROBABILITY x US_FEDERAL_SPENDING_PER_CAPITA | Unit: USD | Click to view details, calculation & sources\">$0.000338 (95% CI: $0.000334-$0.000343)</a>"
"us_vote_expected_value_latex": "$$\n\\begin{gathered}\nEV_{vote} \\\\\n= P_{decisive} \\times Spend_{fed,pc} \\\\\n= 0 \\times \\$20.3K \\\\\n= \\$0.000338\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSpend_{fed,pc} \\\\\n= \\frac{Spending_{federal}}{Pop_{US}} \\\\\n= \\frac{\\$6.8T}{335M} \\\\\n= \\$20.3K\n\\end{gathered}\n$$"
"us_vs_singapore_spending_gap": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_vs_singapore_spending_gap\" class=\"parameter-link\" data-source-ref=\"oecd-govt-spending\" data-source-type=\"definition\" data-confidence=\"high\" title=\"Government spending gap: US spends 23 percentage points MORE of GDP than Singapore yet achieves 6.6 fewer years of life expectancy. | ✓ High confidence | Dist: Fixed | Formula: US_SPENDING - SINGAPORE_SPENDING = 38% - 15% | Unit: percent | Click to view details, calculation & sources\">2300%</a>"
