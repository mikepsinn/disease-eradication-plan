  \\text{where } YLD_{lag} \\\\\n= Deaths_{lag} \\times T_{suffering} \\times DW_{chronic}\
  \ \\\\\n= 416M \\times 6 \\times 0.35 \\\\\n= 873M \\\\[0.5em]\n\\text{where } Deaths_{lag}\
  \ \\\\\n= T_{lag} \\times Deaths_{disease,daily} \\times 338 \\\\\n= 8.2 \\times\
