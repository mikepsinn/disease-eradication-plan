  \ (LE_{global} - Age_{death,delay}) \\\\\n= 416M \\times (79 - 62) \\\\\n= 7.07B\
  \ \\\\[0.5em]\n\\text{where } Deaths_{lag} \\\\\n= T_{lag} \\times Deaths_{disease,daily}\
