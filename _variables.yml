"dfda_direct_funding_cost_per_daly": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_direct_funding_cost_per_daly\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/dfda-cost-benefit-analysis.qmd\"\
  \ data-source-type=\"definition\" data-confidence=\"medium\" title=\"Cost per DALY\
  \ if philanthropists/governments directly funded $21.76B/year for ~46.5 years (queue\
  \ clearance period, NPV: ~$541.9B) instead of treaty campaign ($1B). Treaty achieves\
  \ 542× leverage: $1B campaign unlocks government funding for 46.5 years (NPV: $541.9B),\
  \ avoiding direct philanthropic commitment. Both achieve same 200B DALY timeline\
  \ shift benefit. Still cost-effective vs bed nets ($89.0/DALY). | ~ Medium confidence\
  \ | Formula: NPV_DIRECT_FUNDING ÷ DALYS_TIMELINE_SHIFT | Unit: USD/DALY | Click\
  \ to view details, calculation & sources\">$2.71 (95% CI: $1.26-$4.73)</a>"
"dfda_direct_funding_cost_per_daly_latex": "$$\nCost_{direct,DFDA} = \\frac{Funding_{direct,DFDA}}{DALYs_{DFDA}}\
  \ = \\frac{\\$542B}{200B} = \\$2.71\n$$"
"dfda_direct_funding_queue_clearance_npv": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_direct_funding_queue_clearance_npv\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/dfda-cost-benefit-analysis.qmd\"\
  \ data-source-type=\"definition\" data-confidence=\"high\" title=\"NPV of direct\
  \ funding ($21.76B/year for medical research after bond/IAB allocations) for the\
  \ ~46.5-year queue clearance period. Alternative scenario: instead of $1B treaty\
  \ campaign to unlock government funding, philanthropists/NIH directly fund clinical\
  \ trials until disease queue is cleared. Funding period is queue clearance time\
  \ (46.5 years with 9.5× trial capacity), not timeline shift amount (207 years).\
  \ After queue is cleared, the timeline shift benefit (200B DALYs) is fully realized.\
  \ | ✓ High confidence | Formula: ANNUAL_FUNDING × [(1 - (1 + r)^-T) / r] where T\
  \ = queue clearance time | Unit: USD | Click to view details, calculation & sources\"\
  >$542B (95% CI: $388B-$659B)</a>"
"dfda_direct_funding_queue_clearance_npv_latex": "$$\nNPV_{direct} = \\$21.76B \\\
  times \\frac{1 - 1.03^{-46.5}}{0.03} \\approx \\$541.9B\n$$"
