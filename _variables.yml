  \ YLD | Unit: DALYs | Click to view details, calculation & sources\">41.8k DALYs\
  \ (95% CI: 24.8k DALYs-67.1k DALYs)</a>"
"thalidomide_dalys_per_event_latex": "$$\n\\begin{gathered}\nDALY_{thal} \\\\\n= YLD_{thal}\
  \ + YLL_{thal} \\\\\n= 13{,}000 + 28{,}800 \\\\\n= 41{,}800 \\\\[0.5em]\n\\text{where\
  \ } YLD_{thal} \\\\\n= DW_{thal} \\times N_{thal,survive} \\times LE_{thal} \\\\\
  \n= 0.4 \\times 540 \\times 60 \\\\\n= 13{,}000 \\\\[0.5em]\n\\text{where } N_{thal,survive}\
  \ \\\\\n= N_{thal,US,prevent} \\times (1 - Rate_{thal,mort}) \\\\\n= 900 \\times\
  \ (1 - 40\\%) \\\\\n= 540 \\\\[0.5em]\n\\text{where } N_{thal,US,prevent} \\\\\n\
  = N_{thal,global} \\times Pct_{US,1960} \\\\\n= 15{,}000 \\times 6\\% \\\\\n= 900\
  \ \\\\[0.5em]\n\\text{where } YLL_{thal} = Deaths_{thal} \\times 80 = 360 \\times\
  \ 80 = 28{,}800 \\\\[0.5em]\n\\text{where } Deaths_{thal} \\\\\n= Rate_{thal,mort}\
  \ \\times N_{thal,US,prevent} \\\\\n= 40\\% \\times 900 \\\\\n= 360 \\\\[0.5em]\n\
  \\text{where } N_{thal,US,prevent} \\\\\n= N_{thal,global} \\times Pct_{US,1960}\
  \ \\\\\n= 15{,}000 \\times 6\\% \\\\\n= 900\n\\end{gathered}\n$$"
