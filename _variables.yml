"status_quo_avg_years_to_first_treatment": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-status_quo_avg_years_to_first_treatment\"\
  \ class=\"parameter-link\" data-source-ref=\"status-quo-cure-timeline-estimate\"\
  \ data-source-type=\"calculated\" data-confidence=\"low\" title=\"Average years\
  \ until first treatment discovered for a typical disease under current system. The\
  \ average disease is in the middle of the queue, so it waits half the total queue\
  \ clearance time (~443/2 = ~222 years). | Calculated from 1 input | ? Low confidence\
  \ | Formula: STATUS_QUO_QUEUE_CLEARANCE_YEARS ÷ 2 | Unit: years | Click to view\
  \ details, calculation & sources\">222 years (95% CI: 162 years-356 years)</a>"
"status_quo_avg_years_to_first_treatment_latex": "$$\n\\begin{gathered}\nT_{first,SQ}\
  \ = T_{queue,SQ} \\times 0.5 = 443 \\times 0.5 = 222 \\\\[0.5em]\n\\text{where }\
  \ T_{queue,SQ} = \\frac{N_{untreated}}{Treatments_{new,ann}} = \\frac{6{,}650}{15}\
  \ = 443 \\\\[0.5em]\n\\text{where } N_{untreated} = N_{rare} \\times 0.95 = 7{,}000\
  \ \\times 0.95 = 6{,}650\n\\end{gathered}\n$$"
"status_quo_queue_clearance_years": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-status_quo_queue_clearance_years\"\
  \ class=\"parameter-link\" data-source-ref=\"status-quo-cure-timeline-estimate\"\
  \ data-source-type=\"calculated\" data-confidence=\"low\" title=\"Years to clear\
  \ entire queue of diseases without treatment. At current rate of ~15 diseases/year\
  \ getting first treatments, the queue of ~6,650 would take ~443 years to completely\
  \ clear. | Calculated from 2 inputs | ? Low confidence | Formula: DISEASES_WITHOUT_EFFECTIVE_TREATMENT\
  \ ÷ NEW_DISEASE_FIRST_TREATMENTS_PER_YEAR | Unit: years | Click to view details,\
  \ calculation & sources\">443 years (95% CI: 324 years-712 years)</a>"
"status_quo_queue_clearance_years_latex": "$$\n\\begin{gathered}\nT_{queue,SQ} = \\\
  frac{N_{untreated}}{Treatments_{new,ann}} = \\frac{6{,}650}{15} = 443 \\\\[0.5em]\n\
  \\text{where } N_{untreated} = N_{rare} \\times 0.95 = 7{,}000 \\times 0.95 = 6{,}650\n\
  \\end{gathered}\n$$"
