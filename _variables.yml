"launch_expected_ready_principals": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-launch_expected_ready_principals\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Expected number of ready launch principals within the model horizon | Calculated from 2 inputs | ✓ High confidence | Formula: LAUNCH_HIGH_ALIGNMENT_PRINCIPALS_COUNT x LAUNCH_P_READY_PER_HIGH_ALIGNMENT_PRINCIPAL | Unit: people | Click to view details, calculation & sources\">5.85 people (95% CI: 0.896 people-16.7 people)</a>"
"launch_expected_ready_principals_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-launch_expected_ready_principals\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Expected number of ready launch principals within the model horizon | Calculated from 2 inputs | ✓ High confidence | Formula: LAUNCH_HIGH_ALIGNMENT_PRINCIPALS_COUNT x LAUNCH_P_READY_PER_HIGH_ALIGNMENT_PRINCIPAL | Unit: people | Click to view details, calculation & sources\">5.85 (95% CI: 0.896-16.7)</a>"
