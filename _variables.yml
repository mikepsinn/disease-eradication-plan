"valley_of_death_attrition_pct": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-valley_of_death_attrition_pct\" class=\"parameter-link\" data-source-ref=\"valley-of-death-attrition\" data-source-type=\"external\" data-confidence=\"medium\" title=\"Percentage of promising Phase 1-passed compounds abandoned primarily due to Phase 2/3 cost barriers (not scientific failure). Conservative estimate: many rare disease, natural compound, and low-margin drugs never tested. | ~ Medium confidence | 95% CI: [25%, 55%] | Dist: Uniform | Unit: percentage | Click to view details, calculation & sources\">40% (95% CI: 25%-55%)</a>"
