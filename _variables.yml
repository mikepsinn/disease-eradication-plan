"sharing_upside_downside_ratio_treaty": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-sharing_upside_downside_ratio_treaty\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Raw ratio of upside (lifetime income gain if plan works) to downside (cost of sharing if plan is impossible). Not expected value; see SHARING_BREAKEVEN_PROBABILITY_TREATY for the probability threshold that makes forwarding rational. | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_PATH_LIFETIME_INCOME_GAIN_PER_CAPITA / SHARING_OPPORTUNITY_COST | Unit: x | Click to view details, calculation & sources\">248.2Mx (95% CI: 59.0Mx-1157.2Mx)</a>"
"sharing_upside_downside_ratio_treaty_latex": "$$\n\\begin{gathered}\nk_{upside:downside} \\\\\n= \\frac{\\Delta Y_{lifetime,treaty}}{C_{share}} \\\\\n= \\frac{\\$14.9M}{\\$0.0599} \\\\\n= 248M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\Delta Y_{lifetime,treaty} \\\\\n= Y_{cum,treaty} - Y_{cum,earth} \\\\\n= \\$16.1M - \\$1.18M \\\\\n= \\$14.9M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,treaty} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{pc})((1+g_{pc})^{20}-1)}{g_{pc}} \\\\\n+ \\bar{y}_{treaty,20} \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}-20}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{0} \\\\\n= \\frac{GDP_{global}}{Pop_{global}} \\\\\n= \\frac{\\$115T}{8B} \\\\\n= \\$14.4K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\bar{y}_{treaty,20} = \\frac{GDP_{treaty,20}}{Pop_{2045}}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nGDP_{treaty,20} \\\\\n= GDP_0(1+g_{treaty,ramp})^3(1+g_{treaty,full})^{17}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\ns_{mil,max} = Cut_{WW2} = 87.6\\% = 87.6\\%\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCut_{WW2} \\\\\n= 1 - \\frac{Spending_{US,1947}}{Spending_{US,1945}} \\\\\n= 1 - \\frac{\\$176B}{\\$1.42T} \\\\\n= 87.6\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nf_{cure,20,wish} \\\\\n= \\min\\left(1,\\frac{Treatments_{new,ann}\\cdot k_{capacity,wish}\\cdot 20}{D_{untreated}}\\right)\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity,max} \\\\\n= \\frac{N_{willing}}{Slots_{curr}} \\\\\n= \\frac{1.08B}{1.9M} \\\\\n= 566\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{remaining} \\\\\n= LE_{global} - Age_{median} \\\\\n= 79 - 30.5 \\\\\n= 48.5\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,earth} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{earth,20} \\\\\n= \\frac{GDP_{earth,20}}{Pop_{2045}} \\\\\n= \\frac{\\$188T}{9.2B} \\\\\n= \\$20.5K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{earth,20} = GDP_0(1+g_{base})^{20}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nC_{share} \\\\\n= t_{share} \\times \\bar{w}_{hour} \\times 0.0167 \\\\\n= 0.5 \\times \\$7.19 \\times 0.0167 \\\\\n= \\$0.0599\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{w}_{hour} \\\\\n= \\frac{\\bar{y}_{0}}{H_{work}} \\\\\n= \\frac{\\$14.4K}{2{,}000} \\\\\n= \\$7.19\n\\end{gathered}\n$$"
