"global_total_health_and_war_cost_annual": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-global_total_health_and_war_cost_annual\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/humanity-budget-overview.qmd\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total annual\
  \ cost of war and disease with all externalities (direct + indirect costs for both)\
  \ | Calculated from 3 inputs | ✓ High confidence | Formula: WAR_TOTAL_COSTS + SYMPTOMATIC_TREATMENT\
  \ + DISEASE_BURDEN | Unit: USD/year | Click to view details, calculation & sources\"\
  >$129T (95% CI: $95.8T-$168T)</a>"
"global_total_health_and_war_cost_annual_latex": "$$\n\\begin{gathered}\nCost_{health+war}\
  \ \\\\\n= Cost_{war,total} + Burden_{disease} + Spending_{symptom} \\\\\n= \\$11.4T\
  \ + \\$109T + \\$8.2T \\\\\n= \\$129T \\\\[0.5em]\n\\text{where } Cost_{war,total}\
  \ \\\\\n= Cost_{war,direct} + Cost_{war,indirect} \\\\\n= \\$7.66T + \\$3.7T \\\\\
  \n= \\$11.4T \\\\[0.5em]\n\\text{where } Cost_{war,direct} \\\\\n= Loss_{life,conflict}\
  \ + Damage_{infra,total} \\\\\n+ Disruption_{trade} + Spending_{mil} \\\\\n= \\\
  $2.45T + \\$1.88T + \\$616B + \\$2.72T \\\\\n= \\$7.66T \\\\[0.5em]\n\\text{where\
  \ } Loss_{life,conflict} \\\\\n= Cost_{combat,human} + Cost_{state,human} \\\\\n\
  + Cost_{terror,human} \\\\\n= \\$2.34T + \\$27B + \\$83B \\\\\n= \\$2.45T \\\\[0.5em]\n\
  \\text{where } Cost_{combat,human} \\\\\n= Deaths_{combat} \\times VSL \\\\\n= 234{,}000\
  \ \\times \\$10M \\\\\n= \\$2.34T \\\\[0.5em]\n\\text{where } Cost_{state,human}\
  \ \\\\\n= Deaths_{state} \\times VSL \\\\\n= 2{,}700 \\times \\$10M \\\\\n= \\$27B\
  \ \\\\[0.5em]\n\\text{where } Cost_{terror,human} \\\\\n= Deaths_{terror} \\times\
  \ VSL \\\\\n= 8{,}300 \\times \\$10M \\\\\n= \\$83B \\\\[0.5em]\n\\text{where }\
  \ Damage_{infra,total} \\\\\n= Damage_{comms} + Damage_{edu} + Damage_{energy} \\\
  \\\n+ Damage_{health} + Damage_{transport} \\\\\n+ Damage_{water} \\\\\n= \\$298B\
  \ + \\$234B + \\$422B + \\$166B + \\$487B + \\$268B \\\\\n= \\$1.88T \\\\[0.5em]\n\
  \\text{where } Disruption_{trade} \\\\\n= Disruption_{currency} + Disruption_{energy}\
  \ \\\\\n+ Disruption_{shipping} + Disruption_{supply} \\\\\n= \\$57.4B + \\$125B\
  \ + \\$247B + \\$187B \\\\\n= \\$616B \\\\[0.5em]\n\\text{where } Cost_{war,indirect}\
  \ \\\\\n= Damage_{env} + Loss_{growth,mil} \\\\\n+ Loss_{capital,conflict} + Cost_{psych}\
  \ \\\\\n+ Cost_{refugee} + Cost_{vet} \\\\\n= \\$100B + \\$2.72T + \\$300B + \\\
  $232B + \\$150B + \\$200B \\\\\n= \\$3.7T \\\\[0.5em]\n\\text{where } Burden_{disease}\
  \ \\\\\n= Cost_{medical,direct} + Loss_{life,disease} \\\\\n+ Loss_{productivity}\
  \ \\\\\n= \\$9.9T + \\$94.2T + \\$5T \\\\\n= \\$109T\n\\end{gathered}\n$$"
