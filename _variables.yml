"us_congress_full_advocacy_cost": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_congress_full_advocacy_cost\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Upper-bound advocacy cost to match career incentives for all 535 members of Congress | Calculated from 2 inputs | ~ Medium confidence | Formula: CONGRESS_MEMBERS x POST_OFFICE_VALUE | Unit: USD | Click to view details, calculation & sources\">$5.35B</a>"
