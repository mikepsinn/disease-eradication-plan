  \ | Unit: ratio | Click to view details, calculation & sources\">12.5k:1 (95% CI:\
  \ 2.26k:1-51.5k:1)</a>"
"pragmatic_vs_nih_efficiency_multiplier_latex": "$$\n\\begin{gathered}\nk_{pragmatic:NIH}\
  \ \\\\\n= \\frac{Cost_{NIH,QALY}}{Cost_{pragmatic,QALY}} \\\\\n= \\frac{\\$50K}{\\\
  $4} \\\\\n= 12{,}500 \\\\[0.5em]\n\\text{where } Cost_{pragmatic,QALY} = \\frac{Cost_{RECOVERY}}{QALY_{RECOVERY}}\
  \ = \\frac{\\$20M}{5M} = \\$4 \\\\[0.5em]\n\\text{where } QALY_{RECOVERY} \\\\\n\
  = Lives_{RECOVERY} \\times QALY_{COVID} \\\\\n= 1M \\times 5 \\\\\n= 5M\n\\end{gathered}\n\
