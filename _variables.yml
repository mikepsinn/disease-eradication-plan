"treaty_roi_trial_capacity_plus_efficacy_lag_latex": "$$\n\\begin{gathered}\nROI_{max}\
  \ = \\frac{Value_{max}}{Cost_{campaign}} = \\frac{\\$84800T}{\\$1B} = 84.8M \\\\\
