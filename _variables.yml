  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual net savings\
  \ from R&D cost reduction only (gross savings minus operational costs, excludes\
  \ regulatory delay value) | Calculated from 2 inputs | ✓ High confidence | Formula:\
  \ GROSS_SAVINGS - ANNUAL_OPEX | Unit: USD/year | Click to view details, calculation\
  \ & sources\">$58.6B (95% CI: $49.2B-$73B)</a>"
"dfda_net_savings_rd_only_annual_latex": "$$\n\\begin{gathered}\nSavings_{RD,ann}\
  \ \\\\\n= Benefit_{RD,ann} - OPEX_{dFDA} \\\\\n= \\$58.6B - \\$40M \\\\\n= \\$58.6B\
  \ \\\\[0.5em]\n\\text{where } Benefit_{RD,ann} \\\\\n= Spending_{trials} \\times\
  \ Reduce_{pct} \\\\\n= \\$60B \\times 97.7\\% \\\\\n= \\$58.6B \\\\[0.5em]\n\\text{where\
  \ } Reduce_{pct} \\\\\n= 1 - \\frac{Cost_{pragmatic,pt}}{Cost_{P3,pt}} \\\\\n= 1\
