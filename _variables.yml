"launch_principals_required": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-launch_principals_required\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Minimum number of lead principals required to finance and launch a credible treaty campaign | Calculated from 3 inputs | ✓ High confidence | Formula: ceil((TREATY_CAMPAIGN_TOTAL_COST x LAUNCH_REDUNDANCY_FACTOR) / LAUNCH_AVG_PRINCIPAL_COMMITMENT_USD) | Unit: people | Click to view details, calculation & sources\">4 people (95% CI: 4 people-5 people)</a>"
"launch_principals_required_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-launch_principals_required\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Minimum number of lead principals required to finance and launch a credible treaty campaign | Calculated from 3 inputs | ✓ High confidence | Formula: ceil((TREATY_CAMPAIGN_TOTAL_COST x LAUNCH_REDUNDANCY_FACTOR) / LAUNCH_AVG_PRINCIPAL_COMMITMENT_USD) | Unit: people | Click to view details, calculation & sources\">4 (95% CI: 4-5)</a>"
"launch_principals_required_latex": "$$\n\\begin{gathered}\nX \\\\\n= \\left\\lceil \\frac{Cost_{campaign} \\cdot R_{launch}}{C_{principal}} \\right\\rceil\n\\end{gathered}\n$$"
"launch_p_at_least_required_principals": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-launch_p_at_least_required_principals\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Probability that enough ready principals emerge to launch a credible treaty campaign within the model horizon | Calculated from 3 inputs | ✓ High confidence | Formula: Binomial tail with n = LAUNCH_HIGH_ALIGNMENT_PRINCIPALS_COUNT, p = LAUNCH_P_READY_PER_HIGH_ALIGNMENT_PRINCIPAL, threshold = LAUNCH_PRINCIPALS_REQUIRED | Unit: rate | Click to view details, calculation & sources\">86.3% (95% CI: 0.195%-100%)</a>"
"launch_p_at_least_required_principals_latex": "$$\n\\begin{gathered}\nP_{launch} \\\\\n= \\sum_{k=X}^{N_{align}} \\binom{N_{align}}{k} P_{ready|align}^{k} (1 - P_{ready|align})^{N_{align}-k}\n\\end{gathered}\n$$"
"launch_p_ready_per_high_alignment_principal": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-launch_p_ready_per_high_alignment_principal\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Probability a high-alignment principal becomes a ready launch principal within the model horizon | Calculated from 3 inputs | ✓ High confidence | Formula: LAUNCH_REACH_PROBABILITY_HIGH_ALIGNMENT x LAUNCH_PERSUADE_PROBABILITY_GIVEN_REACHED x LAUNCH_EXECUTE_PROBABILITY_GIVEN_PERSUADED | Unit: rate | Click to view details, calculation & sources\">19.5% (95% CI: 6.25%-37.7%)</a>"
"launch_p_ready_per_high_alignment_principal_latex": "$$\n\\begin{gathered}\nP_{ready|align} \\\\\n= P_{reach|align} \\times P_{persuade|reach} \\times P_{execute|persuaded}\n\\end{gathered}\n$$"
"launch_reach_probability_high_alignment": "<span class=\"parameter-definition\" title=\"Probability a high-alignment principal meaningfully encounters the launch thesis within the model horizon | Unit: rate | Core definition\">50% (95% CI: 20%-85%)</span>"
"launch_redundancy_factor": "<span class=\"parameter-definition\" title=\"Funding redundancy above bare minimum required to survive defections, delay, and ordinary political friction | Unit: multiplier | Core definition\">1.25x (95% CI: 1x-2x)</span>"
"life_expectancy_gain_1883_1962_years_per_decade": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-life_expectancy_gain_1883_1962_years_per_decade\" class=\"parameter-link\" data-source-ref=\"life-expectancy-increase-pre-1962\" data-source-type=\"calculated\" data-peer-reviewed=\"true\" data-confidence=\"high\" title=\"US life expectancy linear gain rate 1883-1962 (pre-Kefauver-Harris). | Calculated from 2 inputs | ✓ High confidence | \U0001F4CA Peer-reviewed | Formula: (life_exp_1962 - life_exp_1880) / 7.9 decades | Unit: years/decade | Click to view details, calculation & sources\">0 years/decade (95% CI: 3.85 years/decade-3.91 years/decade)</a>"
"life_expectancy_gain_1883_1962_years_per_decade_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-life_expectancy_gain_1883_1962_years_per_decade\" class=\"parameter-link\" data-source-ref=\"life-expectancy-increase-pre-1962\" data-source-type=\"calculated\" data-peer-reviewed=\"true\" data-confidence=\"high\" title=\"US life expectancy linear gain rate 1883-1962 (pre-Kefauver-Harris). | Calculated from 2 inputs | ✓ High confidence | \U0001F4CA Peer-reviewed | Formula: (life_exp_1962 - life_exp_1880) / 7.9 decades | Unit: years/decade | Click to view details, calculation & sources\">0 (95% CI: 3.85-3.91)</a>"
