"us_political_reform_investment_total": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_political_reform_investment_total\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"low\" title=\"Total upper-bound investment for US political reform: (campaign spending + 2 years lobbying) × effort multiplier + Congress career advocacy. Represents cost to achieve democratic parity with incumbent interests. | Calculated from 4 inputs | ? Low confidence | Formula: (CAMPAIGN + LOBBYING×2) × EFFORT_MULTIPLIER + CONGRESS_CAREER | Unit: USD | Click to view details, calculation & sources\">$25.5B (95% CI: $17.3B-$36.3B)</a>"
