"fda_to_oxford_recovery_trial_time_multiplier": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-fda_to_oxford_recovery_trial_time_multiplier\" class=\"parameter-link\" data-source-ref=\"recovery-trial-82x-cost-reduction\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Efficacy testing time vs Oxford RECOVERY trial (8.2 years ÷ 3 months = 32.8x slower). Compares efficacy lag only (post-safety Phase II/III) since RECOVERY was an efficacy trial. | Calculated from 2 inputs | ✓ High confidence | Formula: EFFICACY_LAG_YEARS × MONTHS_PER_YEAR ÷ OXFORD_RECOVERY_TRIAL_DURATION_MONTHS | Unit: multiplier | Click to view details, calculation & sources\">32.8x (95% CI: 19.4x-45.9x)</a>"
"fda_to_oxford_recovery_trial_time_multiplier_latex": "$$\n\\begin{gathered}\n\\text{Multiplier}_{RD} = \\frac{Y_{efficacy} \\times 12}{M_{RECOVERY}} \\\\[0.5em]\n= \\frac{8.2 \\times 12}{3} = 32.8\n\\end{gathered}\n$$"
"fundamentally_unavoidable_death_pct": "<span class=\"parameter-definition\" title=\"Percentage of deaths that are fundamentally unavoidable even with perfect biotechnology (primarily accidents). Calculated as Σ(disease_burden × (1 - max_cure_potential)) across all disease categories. | Unit: percentage | Core definition\">7.37%</span>"
"gdp_baseline_growth_rate": "<span class=\"parameter-definition\" title=\"Status-quo baseline annual global GDP growth rate. | Unit: rate | Core definition\">2.5%</span>"
"gdp_expected_value_vs_earth_multiplier_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-gdp_expected_value_vs_earth_multiplier_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Expected-value GDP at year 20 as a multiple of Earth baseline GDP. | Calculated from 2 inputs | ✓ High confidence | Formula: GDP_EXPECTED_VALUE_YEAR_20 ÷ EARTH_GDP_YEAR_20 | Unit: x | Click to view details, calculation & sources\">51x (95% CI: 16.9x-276x)</a>"
"gdp_expected_value_vs_earth_multiplier_year_20_latex": "$$\n\\begin{gathered}\nk_{EV:earth,20} \\\\\n= \\frac{E[GDP_{20}]}{GDP_{earth,20}} \\\\\n= \\frac{\\$9620T}{\\$188T} \\\\\n= 51\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nE[GDP_{20}] = p_{wish,20} \\cdot GDP_{wish,20}\n$$\n\nwhere:\n\n$$\nGDP_{wish,20}=GDP_0(1+g_{ramp})^3(1+g_{full})^{17}\n$$\n\nwhere:\n\n$$\ns_{mil,max} = Cut_{WW2} = 87.6\\% = 87.6\\%\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCut_{WW2} \\\\\n= 1 - \\frac{Spending_{US,1947}}{Spending_{US,1945}} \\\\\n= 1 - \\frac{\\$176B}{\\$1.42T} \\\\\n= 87.6\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nf_{cure,20,wish} \\\\\n= \\min\\left(1,\\frac{Treatments_{new,ann}\\cdot k_{capacity,wish}\\cdot 20}{D_{untreated}}\\right)\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity,max} \\\\\n= \\frac{N_{willing}}{Slots_{curr}} \\\\\n= \\frac{1.08B}{1.9M} \\\\\n= 566\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{earth,20} = GDP_0(1+g_{base})^{20}\n$$"
"gdp_expected_value_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-gdp_expected_value_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Probability-weighted expected global GDP at year 20 from Wishonia vs Moronia paths. Moronia contributes $0 GDP in this framing. | Calculated from 2 inputs | ✓ High confidence | Formula: WISHONIA_PATH_SUCCESS_PROBABILITY_YEAR_20 × WISHONIA_PATH_GDP_YEAR_20 | Unit: USD | Click to view details, calculation & sources\">$9.62 quadrillion (95% CI: $3.19 quadrillion-$52.1 quadrillion)</a>"
"gdp_expected_value_year_20_latex": "$$\nE[GDP_{20}] = p_{wish,20} \\cdot GDP_{wish,20}\n$$"
