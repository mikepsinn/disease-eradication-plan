  \ from 1% reduction in environmental damage | Calculated from 2 inputs | ✓ High\
  \ confidence | Formula: ENVIRONMENTAL_DAMAGE × 1% | Unit: USD/year | Click to view\
  \ details, calculation & sources\">$1B (95% CI: $732M-$1.32B)</a>"
"peace_dividend_environmental_latex": "$$\n\\begin{gathered}\nSavings_{env} \\\\\n\
