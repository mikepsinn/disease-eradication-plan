  = Rate_{thal,mort} \\times N_{thal,US,prevent} \\\\\n= 40\\% \\times 900 \\\\\n\
  = 360 \\\\[0.5em]\n\\text{where } N_{thal,US,prevent} \\\\\n= N_{thal,global} \\\
  times Pct_{US,1960} \\\\\n= 15{,}000 \\times 6\\% \\\\\n= 900\n\\end{gathered}\n\
  $$"
