  \ details, calculation & sources\">$342M (95% CI: $235M-$473M)</a>"
"dfda_npv_pv_annual_opex_latex": "$$\nPV_{OPEX} = OPEX_{ann} \\times \\frac{1 - (1+r)^{-T}}{r}\n\
  $$"
"dfda_npv_total_cost": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_npv_total_cost\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/dfda-impact-paper.qmd#npv-total-cost\"\
