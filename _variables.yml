  \ years)</a>"
"dfda_total_exploration_years_latex": "$$\n\\begin{gathered}\nT_{explore,dFDA} \\\\\
  \n= \\frac{N_{testable}}{Capacity_{trials}} \\\\\n= \\frac{51.5M}{40{,}600} \\\\\
  \n= 1{,}270 \\\\[0.5em]\n\\text{where } N_{testable} \\\\\n= N_{combos} + N_{emerging}\
  \ \\\\\n= 9.5M + 42M \\\\\n= 51.5M \\\\[0.5em]\n\\text{where } N_{combos} \\\\\n\
  = N_{safe} \\times N_{diseases,trial} \\\\\n= 9{,}500 \\times 1{,}000 \\\\\n= 9.5M\
  \ \\\\[0.5em]\n\\text{where } N_{emerging} \\\\\n= Combos_{gene} + Combos_{mRNA}\
  \ + Combos_{epi} + Combos_{cell} \\\\\n= 20M + 20M + 1.5M + 500{,}000 \\\\\n= 42M\
  \ \\\\[0.5em]\n\\text{where } Combos_{gene} \\\\\n= N_{genes} \\times N_{diseases,trial}\
  \ \\\\\n= 20{,}000 \\times 1{,}000 \\\\\n= 20M \\\\[0.5em]\n\\text{where } Combos_{mRNA}\
  \ \\\\\n= N_{genes} \\times N_{diseases,trial} \\\\\n= 20{,}000 \\times 1{,}000\
  \ \\\\\n= 20M \\\\[0.5em]\n\\text{where } Combos_{epi} \\\\\n= N_{epi} \\times N_{diseases,trial}\
  \ \\\\\n= 1{,}500 \\times 1{,}000 \\\\\n= 1.5M \\\\[0.5em]\n\\text{where } Combos_{cell}\
  \ \\\\\n= N_{cell} \\times N_{diseases,trial} \\\\\n= 500 \\times 1{,}000 \\\\\n\
  = 500{,}000 \\\\[0.5em]\n\\text{where } Capacity_{trials} \\\\\n= Trials_{ann,curr}\
  \ \\times k_{capacity} \\\\\n= 3{,}300 \\times 12.3 \\\\\n= 40{,}600 \\\\[0.5em]\n\
  \\text{where } k_{capacity} = \\frac{N_{fundable,ann}}{Slots_{curr}} = \\frac{23.4M}{1.9M}\
  \ = 12.3 \\\\[0.5em]\n\\text{where } N_{fundable,ann} \\\\\n= \\frac{Subsidies_{trial,ann}}{Cost_{pragmatic,pt}}\
  \ \\\\\n= \\frac{\\$21.7B}{\\$929} \\\\\n= 23.4M \\\\[0.5em]\n\\text{where } Subsidies_{trial,ann}\
  \ \\\\\n= Treasury_{RD,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.7B\
  \ \\\\[0.5em]\n\\text{where } OPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff}\
  \ + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\\
  $10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M \\\\[0.5em]\n\\text{where } Treasury_{RD,ann}\
  \ \\\\\n= Funding_{treaty} - Payout_{bond,ann} - Funding_{political,ann} \\\\\n\
  = \\$27.2B - \\$2.72B - \\$2.72B \\\\\n= \\$21.8B \\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\
  \\\n= \\$27.2B \\\\[0.5em]\n\\text{where } Payout_{bond,ann} \\\\\n= Funding_{treaty}\
  \ \\times Pct_{bond} \\\\\n= \\$27.2B \\times 10\\% \\\\\n= \\$2.72B \\\\[0.5em]\n\
  \\text{where } Funding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\
  \\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B \\\\[0.5em]\n\\text{where } Funding_{political,ann}\
  \ \\\\\n= Funding_{treaty} \\times Pct_{political} \\\\\n= \\$27.2B \\times 10\\\
  % \\\\\n= \\$2.72B \\\\[0.5em]\n\\text{where } Funding_{treaty} \\\\\n= Spending_{mil}\
  \ \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B\n\\end{gathered}\n\
  $$"
"dfda_trials_per_year_capacity": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_trials_per_year_capacity\"\
