"us_vote_decisive_probability": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_vote_decisive_probability\" class=\"parameter-link\" data-source-ref=\"odds-of-decisive-vote\" data-source-type=\"external\" data-confidence=\"high\" title=\"Probability of a single vote being decisive in a US presidential election. Gelman, Silver, and Edlin (2012) estimate roughly 1 in 60 million on average, varying by state from 1 in 10 million (swing states) to 1 in 1 billion (safe states). | ✓ High confidence | Dist: Fixed | Unit: probability | Click to view details, calculation & sources\">1.67e-08 probability</a>"
"us_vote_decisive_probability_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-us_vote_decisive_probability\" class=\"parameter-link\" data-source-ref=\"odds-of-decisive-vote\" data-source-type=\"external\" data-confidence=\"high\" title=\"Probability of a single vote being decisive in a US presidential election. Gelman, Silver, and Edlin (2012) estimate roughly 1 in 60 million on average, varying by state from 1 in 10 million (swing states) to 1 in 1 billion (safe states). | ✓ High confidence | Dist: Fixed | Unit: probability | Click to view details, calculation & sources\">1.67e-08</a>"
