"existing_drugs_efficacy_lag_deaths_total": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-existing_drugs_efficacy_lag_deaths_total\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/regulatory-mortality-analysis.qmd#historical-progress\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total deaths\
  \ from delaying existing drugs over 8.2-year efficacy lag. One-time impact of eliminating\
  \ Phase 2-4 testing delay for drugs already approved 1962-2024. Based on 12M deaths/year\
  \ rate × 8.2 years. Excludes innovation acceleration effects. | Calculated from\
  \ 1 input | ✓ High confidence | Formula: 12M × EFFICACY_LAG_YEARS | Unit: deaths\
  \ | Click to view details, calculation & sources\">98.4M deaths (95% CI: 58.2M deaths-138M\
  \ deaths)</a>"
"existing_drugs_efficacy_lag_deaths_total_latex": "$$\n\\begin{gathered}\nDeaths_{lag,total}\
  \ \\\\\n= T_{lag} \\times 12000000 \\\\\n= 8.2 \\times 12000000 \\\\\n= 98.4M\n\\\
  end{gathered}\n$$"
"existing_drugs_efficacy_lag_economic_loss": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-existing_drugs_efficacy_lag_economic_loss\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/regulatory-mortality-analysis.qmd#historical-progress\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total economic\
  \ loss from delaying existing drugs over 8.2-year efficacy lag. One-time benefit\
  \ of eliminating Phase 2-4 delay. Excludes innovation acceleration effects. | Calculated\
  \ from 4 inputs | ✓ High confidence | Formula: DEATHS_TOTAL × YLL × VSLY | Unit:\
  \ USD | Click to view details, calculation & sources\">$251T (95% CI: $109T-$422T)</a>"
"existing_drugs_efficacy_lag_economic_loss_latex": "$$\n\\begin{gathered}\nLoss_{lag}\
  \ \\\\\n= Deaths_{lag,total} \\times (LE_{global} - Age_{death,delay}) \\times Value_{QALY}\
  \ \\\\\n= 98.4M \\times (79 - 62) \\times \\$150K \\\\\n= \\$251T \\\\[0.5em]\n\\\
  text{where } Deaths_{lag,total} \\\\\n= T_{lag} \\times 12000000 \\\\\n= 8.2 \\\
  times 12000000 \\\\\n= 98.4M\n\\end{gathered}\n$$"
"exploration_ratio": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-exploration_ratio\"\
