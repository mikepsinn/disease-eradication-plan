"peace_dividend_human_casualties": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-peace_dividend_human_casualties\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/economics/peace-dividend.qmd\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual savings\
  \ from 1% reduction in human casualties | Calculated from 2 inputs | ✓ High confidence\
  \ | Formula: HUMAN_LIFE_LOSSES × 1% | Unit: USD/year | Click to view details, calculation\
  \ & sources\">$24.5B (95% CI: $13.1B-$37.5B)</a>"
"peace_dividend_human_casualties_latex": "$$\n\\begin{gathered}\nSavings_{casualties}\
  \ \\\\\n= Loss_{life,conflict} \\times Reduce_{treaty} \\\\\n= \\$2.45T \\times\
  \ 1\\% \\\\\n= \\$24.5B \\\\[0.5em]\n\\text{where } Loss_{life,conflict} \\\\\n\
  = Cost_{combat,human} + Cost_{state,human} \\\\\n+ Cost_{terror,human} \\\\\n= \\\
  $2.34T + \\$27B + \\$83B \\\\\n= \\$2.45T \\\\[0.5em]\n\\text{where } Cost_{combat,human}\
  \ \\\\\n= Deaths_{combat} \\times VSL \\\\\n= 234{,}000 \\times \\$10M \\\\\n= \\\
  $2.34T \\\\[0.5em]\n\\text{where } Cost_{state,human} \\\\\n= Deaths_{state} \\\
  times VSL \\\\\n= 2{,}700 \\times \\$10M \\\\\n= \\$27B \\\\[0.5em]\n\\text{where\
  \ } Cost_{terror,human} \\\\\n= Deaths_{terror} \\times VSL \\\\\n= 8{,}300 \\times\
  \ \\$10M \\\\\n= \\$83B\n\\end{gathered}\n$$"
"peace_dividend_indirect_costs": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-peace_dividend_indirect_costs\"\
