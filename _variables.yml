  % \\\\\n= \\$37B \\\\[0.5em]\n\\text{where } Cost_{war,indirect} \\\\\n= Damage_{env}\
  \ + Loss_{growth,mil} \\\\\n+ Loss_{capital,conflict} + Cost_{psych} \\\\\n+ Cost_{refugee}\
  \ + Cost_{vet} \\\\\n= \\$100B + \\$2.72T + \\$300B + \\$232B + \\$150B + \\$200B\
  \ \\\\\n= \\$3.7T\n\\end{gathered}\n$$"
"peace_dividend_infrastructure": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-peace_dividend_infrastructure\"\
