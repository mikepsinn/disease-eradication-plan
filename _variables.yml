{willing}}{Slots_{curr}} \\\\\n= \\frac{1.08B}{1.9M} \\\\\n= 566\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{remaining} \\\\\n= LE_{global} - Age_{median} \\\\\n= 79 - 30.5 \\\\\n= 48.5\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,earth} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{earth,20} \\\\\n= \\frac{GDP_{earth,20}}{Pop_{2045}} \\\\\n= \\frac{\\$188T}{9.2B} \\\\\n= \\$20.5K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{earth,20} = GDP_0(1+g_{base})^{20}\n$$"
