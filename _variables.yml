  \ class=\"parameter-link\" data-source-ref=\"/knowledge/problem/cost-of-war.qmd#direct-costs\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total annual\
  \ direct war costs (military spending + infrastructure + human life + trade disruption)\
  \ | Calculated from 4 inputs | ✓ High confidence | Formula: MILITARY + INFRASTRUCTURE\
  \ + HUMAN_LIFE + TRADE | Unit: USD/year | Click to view details, calculation & sources\"\
  >$7.66T (95% CI: $6.14T-$9.40T)</a>"
"global_annual_war_direct_costs_total_latex": "$$\n\\begin{gathered}\nCost_{war,direct}\
  \ \\\\\n= Loss_{life,conflict} + Damage_{infra,total} \\\\\n+ Disruption_{trade}\
  \ + Spending_{mil} \\\\\n= \\$2.45T + \\$1.88T + \\$616B + \\$2.72T \\\\\n= \\$7.66T\
  \ \\\\[0.5em]\n\\text{where } Loss_{life,conflict} \\\\\n= Cost_{combat,human} +\
  \ Cost_{state,human} \\\\\n+ Cost_{terror,human} \\\\\n= \\$2.34T + \\$27B + \\\
  $83B \\\\\n= \\$2.45T \\\\[0.5em]\n\\text{where } Cost_{combat,human} \\\\\n= Deaths_{combat}\
  \ \\times VSL \\\\\n= 234{,}000 \\times \\$10M \\\\\n= \\$2.34T \\\\[0.5em]\n\\\
  text{where } Cost_{state,human} \\\\\n= Deaths_{state} \\times VSL \\\\\n= 2{,}700\
  \ \\times \\$10M \\\\\n= \\$27B \\\\[0.5em]\n\\text{where } Cost_{terror,human}\
  \ \\\\\n= Deaths_{terror} \\times VSL \\\\\n= 8{,}300 \\times \\$10M \\\\\n= \\\
  $83B \\\\[0.5em]\n\\text{where } Damage_{infra,total} \\\\\n= Damage_{comms} + Damage_{edu}\
  \ + Damage_{energy} \\\\\n+ Damage_{health} + Damage_{transport} \\\\\n+ Damage_{water}\
  \ \\\\\n= \\$298B + \\$234B + \\$422B + \\$166B + \\$487B + \\$268B \\\\\n= \\$1.88T\
  \ \\\\[0.5em]\n\\text{where } Disruption_{trade} \\\\\n= Disruption_{currency} +\
  \ Disruption_{energy} \\\\\n+ Disruption_{shipping} + Disruption_{supply} \\\\\n\
  = \\$57.4B + \\$125B + \\$247B + \\$187B \\\\\n= \\$616B\n\\end{gathered}\n$$"
