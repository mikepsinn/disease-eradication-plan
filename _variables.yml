  \ data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Cost per QALY\
  \ for pragmatic platform trials, calculated from RECOVERY trial data. Uses global\
  \ impact methodology: trial cost divided by total QALYs from downstream adoption.\
  \ This measures research efficiency (discovery value), not clinical intervention\
  \ ICER. | Calculated from 2 inputs | ~ Medium confidence | Formula: TRIAL_COST ÷\
  \ TOTAL_QALYS_GENERATED | Unit: USD/QALY | Click to view details, calculation &\
  \ sources\">$4.00 (95% CI: $1.71-$10)</a>"
"pragmatic_trial_cost_per_qaly_latex": "$$\n\\begin{gathered}\nCost_{pragmatic,QALY}\
