"treaty_cost_per_daly_trial_capacity_plus_efficacy_lag": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-treaty_cost_per_daly_trial_capacity_plus_efficacy_lag\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/dfda-impact-paper.qmd\"\
  \ data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cost per DALY\
  \ averted from elimination of efficacy lag plus earlier treatment discovery from\
  \ increased trial throughput. Only counts campaign cost; ignores economic benefits\
  \ from funding and R&D savings. | Calculated from 2 inputs | ✓ High confidence |\
  \ Formula: CAMPAIGN_COST ÷ DALYS_TIMELINE_SHIFT | Unit: USD/DALY | Click to view\
  \ details, calculation & sources\">$0.0018 (95% CI: $0.0007-$0.0041)</a>"
"treaty_cost_per_daly_trial_capacity_plus_efficacy_lag_latex": "$$\n\\begin{gathered}\n\
  Cost_{treaty,DALY} = \\frac{Cost_{campaign}}{DALYs_{max}} = \\frac{\\$1B}{565B}\
  \ = \\$0.00177 \\\\[0.5em]\n\\text{where } Cost_{campaign} \\\\\n= Budget_{viral,base}\
  \ + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\\
  $100M \\\\\n= \\$1B \\\\[0.5em]\n\\text{where } DALYs_{max} \\\\\n= DALYs_{global,ann}\
  \ \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\\
  times 212 \\\\\n= 565B \\\\[0.5em]\n\\text{where } T_{accel,max} = T_{accel} + T_{lag}\
  \ = 204 + 8.2 = 212 \\\\[0.5em]\n\\text{where } T_{accel} \\\\\n= T_{first,SQ} \\\
  times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 -\
  \ \\frac{1}{12.3}\\right) \\\\\n= 204 \\\\[0.5em]\n\\text{where } T_{first,SQ} =\
  \ T_{queue,SQ} \\times 0.5 = 443 \\times 0.5 = 222 \\\\[0.5em]\n\\text{where } T_{queue,SQ}\
  \ = \\frac{N_{untreated}}{Treatments_{new,ann}} = \\frac{6{,}650}{15} = 443 \\\\\
  [0.5em]\n\\text{where } N_{untreated} = N_{rare} \\times 0.95 = 7{,}000 \\times\
  \ 0.95 = 6{,}650 \\\\[0.5em]\n\\text{where } k_{capacity} = \\frac{N_{fundable,ann}}{Slots_{curr}}\
  \ = \\frac{23.4M}{1.9M} = 12.3 \\\\[0.5em]\n\\text{where } N_{fundable,ann} \\\\\
  \n= \\frac{Subsidies_{trial,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.7B}{\\\
  $929} \\\\\n= 23.4M \\\\[0.5em]\n\\text{where } Subsidies_{trial,ann} \\\\\n= Treasury_{RD,ann}\
  \ - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.7B \\\\[0.5em]\n\\text{where\
  \ } OPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory}\
  \ + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\\
  $40M \\\\[0.5em]\n\\text{where } Treasury_{RD,ann} \\\\\n= Funding_{treaty} - Payout_{bond,ann}\
  \ - Funding_{political,ann} \\\\\n= \\$27.2B - \\$2.72B - \\$2.72B \\\\\n= \\$21.8B\
  \ \\\\[0.5em]\n\\text{where } Funding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty}\
  \ \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B \\\\[0.5em]\n\\text{where } Payout_{bond,ann}\
  \ \\\\\n= Funding_{treaty} \\times Pct_{bond} \\\\\n= \\$27.2B \\times 10\\% \\\\\
  \n= \\$2.72B \\\\[0.5em]\n\\text{where } Funding_{treaty} \\\\\n= Spending_{mil}\
  \ \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B \\\\[0.5em]\n\
  \\text{where } Funding_{political,ann} \\\\\n= Funding_{treaty} \\times Pct_{political}\
  \ \\\\\n= \\$27.2B \\times 10\\% \\\\\n= \\$2.72B \\\\[0.5em]\n\\text{where } Funding_{treaty}\
  \ \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\
  \\\n= \\$27.2B\n\\end{gathered}\n$$"
"treaty_expected_cost_per_daly": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-treaty_expected_cost_per_daly\"\
  \ class=\"parameter-link\" data-source-ref=\"/knowledge/appendix/dfda-impact-paper.qmd\"\
  \ data-source-type=\"calculated\" data-confidence=\"low\" title=\"Expected cost\
  \ per DALY accounting for political success probability uncertainty. Monte Carlo\
  \ samples from beta(0.1%, 10%) distribution. At the conservative 1% estimate, this\
  \ is still more cost-effective than bed nets ($89.0/DALY). | Calculated from 2 inputs\
  \ | ? Low confidence | Formula: CONDITIONAL_COST_PER_DALY ÷ POLITICAL_SUCCESS_PROBABILITY\
  \ | Unit: USD/DALY | Click to view details, calculation & sources\">$0.177 (95%\
  \ CI: $0.029-$3.20)</a>"
"treaty_expected_cost_per_daly_latex": "$$\n\\begin{gathered}\nE[Cost_{DALY}] = \\\
  frac{Cost_{treaty,DALY}}{P_{success}} = \\frac{\\$0.00177}{1\\%} = \\$0.177 \\\\\
  [0.5em]\n\\text{where } Cost_{treaty,DALY} = \\frac{Cost_{campaign}}{DALYs_{max}}\
  \ = \\frac{\\$1B}{565B} = \\$0.00177 \\\\[0.5em]\n\\text{where } Cost_{campaign}\
  \ \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\
  \\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B \\\\[0.5em]\n\\text{where } DALYs_{max}\
  \ \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\
  \n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B \\\\[0.5em]\n\\text{where } T_{accel,max}\
