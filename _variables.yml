"dfda_npv_net_benefit_rd_only_latex": "$$\n\\begin{gathered}\nNPV_{net,RD} \\\\\n\
  = NPV_{RD} - Cost_{dFDA,total} \\\\\n= \\$389B - \\$611M \\\\\n= \\$389B \\\\[0.5em]\n\
  \\text{where } NPV_{RD} = \\sum_{t=1}^{10} \\frac{Savings_{RD,ann} \\times \\frac{\\\
  min(t,5)}{5}}{(1+r)^t} \\\\[0.5em]\n\\text{where } Savings_{RD,ann} \\\\\n= Benefit_{RD,ann}\
  \ - OPEX_{dFDA} \\\\\n= \\$58.6B - \\$40M \\\\\n= \\$58.6B \\\\[0.5em]\n\\text{where\
  \ } Benefit_{RD,ann} \\\\\n= Spending_{trials} \\times Reduce_{pct} \\\\\n= \\$60B\
  \ \\times 97.7\\% \\\\\n= \\$58.6B \\\\[0.5em]\n\\text{where } Reduce_{pct} \\\\\
  \n= 1 - \\frac{Cost_{pragmatic,pt}}{Cost_{P3,pt}} \\\\\n= 1 - \\frac{\\$929}{\\\
  $41K} \\\\\n= 97.7\\% \\\\[0.5em]\n\\text{where } OPEX_{dFDA} \\\\\n= Cost_{platform}\
  \ + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\
  \n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M \\\\[0.5em]\n\\text{where\
  \ } Cost_{dFDA,total} \\\\\n= PV_{OPEX} + Cost_{upfront,total} \\\\\n= \\$342M +\
  \ \\$270M \\\\\n= \\$611M \\\\[0.5em]\n\\text{where } PV_{OPEX} \\\\\n= \\frac{T_{horizon}}{OPEX_{total}\
  \ \\times r_{discount}} \\\\\n= \\frac{10}{\\$40M \\times 3\\%} \\\\\n= \\$342M\
  \ \\\\[0.5em]\n\\text{where } OPEX_{total} \\\\\n= OPEX_{ann} + OPEX_{DIH,ann} \\\
  \\\n= \\$18.9M + \\$21.1M \\\\\n= \\$40M \\\\[0.5em]\n\\text{where } Cost_{upfront,total}\
  \ \\\\\n= Cost_{upfront} + Cost_{DIH,init} \\\\\n= \\$40M + \\$230M \\\\\n= \\$270M\n\
  \\end{gathered}\n$$"
"dfda_npv_pv_annual_opex": "<a href=\"/knowledge/appendix/parameters-and-calculations#sec-dfda_npv_pv_annual_opex\"\
