  \n= OPEX_{ann} + OPEX_{DIH,ann} \\\\\n= \\$18.9M + \\$21.1M \\\\\n= \\$40M \\\\\
  [0.5em]\n\\text{where } Cost_{upfront,total} \\\\\n= Cost_{upfront} + Cost_{DIH,init}\
