"thalidomide_yld_per_event": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-thalidomide_yld_per_event\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Years Lived with Disability per thalidomide event | Calculated from 3 inputs | ~ Medium confidence | Formula: SURVIVORS × LIFESPAN × DISABILITY_WEIGHT | Unit: years | Click to view details, calculation & sources\">13 thousand years (95% CI: 6.94 thousand years-22.6 thousand years)</a>"
"thalidomide_yld_per_event_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-thalidomide_yld_per_event\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Years Lived with Disability per thalidomide event | Calculated from 3 inputs | ~ Medium confidence | Formula: SURVIVORS × LIFESPAN × DISABILITY_WEIGHT | Unit: years | Click to view details, calculation & sources\">13 thousand (95% CI: 6.94 thousand-22.6 thousand)</a>"
"thalidomide_yld_per_event_latex": "$$\n\\begin{gathered}\nYLD_{thal} \\\\\n= DW_{thal} \\times N_{thal,survive} \\times LE_{thal} \\\\\n= 0.4 \\times 540 \\times 60 \\\\\n= 13{,}000\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{thal,survive} \\\\\n= N_{thal,US,prevent} \\times (1 - Rate_{thal,mort}) \\\\\n= 900 \\times (1 - 40\\%) \\\\\n= 540\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{thal,US,prevent} \\\\\n= N_{thal,global} \\times Pct_{US,1960} \\\\\n= 15{,}000 \\times 6\\% \\\\\n= 900\n\\end{gathered}\n$$"
"thalidomide_yll_per_event": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-thalidomide_yll_per_event\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Years of Life Lost per thalidomide event (infant deaths) | Calculated from 1 input | ~ Medium confidence | Formula: DEATHS × 80 years | Unit: years | Click to view details, calculation & sources\">28.8 thousand years (95% CI: 17.9 thousand years-44.5 thousand years)</a>"
"thalidomide_yll_per_event_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-thalidomide_yll_per_event\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Years of Life Lost per thalidomide event (infant deaths) | Calculated from 1 input | ~ Medium confidence | Formula: DEATHS × 80 years | Unit: years | Click to view details, calculation & sources\">28.8 thousand (95% CI: 17.9 thousand-44.5 thousand)</a>"
"thalidomide_yll_per_event_latex": "$$\n\\begin{gathered}\nYLL_{thal} \\\\\n= Deaths_{thal} \\times 80 \\\\\n= 360 \\times 80 \\\\\n= 28{,}800\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDeaths_{thal} \\\\\n= Rate_{thal,mort} \\times N_{thal,US,prevent} \\\\\n= 40\\% \\times 900 \\\\\n= 360\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{thal,US,prevent} \\\\\n= N_{thal,global} \\times Pct_{US,1960} \\\\\n= 15{,}000 \\times 6\\% \\\\\n= 900\n\\end{gathered}\n$$"
"total_research_funding_with_treaty": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-total_research_funding_with_treaty\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total global research funding (baseline + 1% treaty funding) | Calculated from 2 inputs | ✓ High confidence | Formula: GLOBAL_MED_RESEARCH_SPENDING + TREATY_ANNUAL_FUNDING | Unit: USD | Click to view details, calculation & sources\">$94.7B (95% CI: $83.8B-$107B)</a>"
"total_research_funding_with_treaty_latex": "$$\n\\begin{gathered}\nFunding_{RD,total} \\\\\n= Spending_{RD} + Funding_{treaty} \\\\\n= \\$67.5B + \\$27.2B \\\\\n= \\$94.7B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nFunding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B\n\\end{gathered}\n$$"
"total_testable_therapeutic_combinations": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-total_testable_therapeutic_combinations\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total testable therapeutic combinations (known safe compounds + emerging modalities) | Calculated from 2 inputs | ✓ High confidence | Formula: KNOWN_SAFE + EMERGING_MODALITIES | Unit: combinations | Click to view details, calculation & sources\">51.5 million combinations</a>"
"total_testable_therapeutic_combinations_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-total_testable_therapeutic_combinations\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total testable therapeutic combinations (known safe compounds + emerging modalities) | Calculated from 2 inputs | ✓ High confidence | Formula: KNOWN_SAFE + EMERGING_MODALITIES | Unit: combinations | Click to view details, calculation & sources\">51.5 million</a>"
"total_testable_therapeutic_combinations_latex": "$$\n\\begin{gathered}\nN_{testable} \\\\\n= N_{combos} + N_{emerging} \\\\\n= 9.5M + 42M \\\\\n= 51.5M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{combos} \\\\\n= N_{safe} \\times N_{diseases,trial} \\\\\n= 9{,}500 \\times 1{,}000 \\\\\n= 9.5M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{emerging} \\\\\n= Combos_{gene} + Combos_{mRNA} + Combos_{epi} + Combos_{cell} \\\\\n= 20M + 20M + 1.5M + 500{,}000 \\\\\n= 42M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCombos_{gene} \\\\\n= N_{genes} \\times N_{diseases,trial} \\\\\n= 20{,}000 \\times 1{,}000 \\\\\n= 20M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCombos_{mRNA} \\\\\n= N_{genes} \\times N_{diseases,trial} \\\\\n= 20{,}000 \\times 1{,}000 \\\\\n= 20M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCombos_{epi} \\\\\n= N_{epi} \\times N_{diseases,trial} \\\\\n= 1{,}500 \\times 1{,}000 \\\\\n= 1.5M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCombos_{cell} \\\\\n= N_{cell} \\times N_{diseases,trial} \\\\\n= 500 \\times 1{,}000 \\\\\n= 500{,}000\n\\end{gathered}\n$$"
"traditional_phase3_cost_per_patient": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-traditional_phase3_cost_per_patient\" class=\"parameter-link\" data-source-ref=\"trial-costs-fda-study\" data-source-type=\"external\" data-confidence=\"high\" title=\"Phase 3 cost per patient (median from FDA study) | ✓ High confidence | 95% CI: [$20K, $120K] | Dist: Lognormal | Unit: USD/patient | Click to view details, calculation & sources\">$41K (95% CI: $20K-$120K)</a>"
"traditional_phase3_cost_per_patient_cite": "@trial-costs-fda-study"
"treatment_disability_reduction": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treatment_disability_reduction\" class=\"parameter-link\" data-source-ref=\"gbd-disability-weights\" data-source-type=\"external\" data-peer-reviewed=\"true\" data-confidence=\"medium\" title=\"Average disability weight reduction from pharmaceutical treatment. Untreated chronic disease averages 0.35 disability weight, treated disease averages 0.10, difference is 0.25. | ~ Medium confidence | \U0001F4CA Peer-reviewed | 95% CI: [0.15 weight, 0.35 weight] | Dist: Normal | Unit: weight | Click to view details, calculation & sources\">0.25 weight (95% CI: 0.15 weight-0.35 weight)</a>"
"treatment_disability_reduction_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treatment_disability_reduction\" class=\"parameter-link\" data-source-ref=\"gbd-disability-weights\" data-source-type=\"external\" data-peer-reviewed=\"true\" data-confidence=\"medium\" title=\"Average disability weight reduction from pharmaceutical treatment. Untreated chronic disease averages 0.35 disability weight, treated disease averages 0.10, difference is 0.25. | ~ Medium confidence | \U0001F4CA Peer-reviewed | 95% CI: [0.15 weight, 0.35 weight] | Dist: Normal | Unit: weight | Click to view details, calculation & sources\">0.25 (95% CI: 0.15-0.35)</a>"
"treatment_disability_reduction_cite": "@gbd-disability-weights"
"treaty_annual_funding": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_annual_funding\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual funding from 1% of global military spending redirected to DIH | Calculated from 2 inputs | ✓ High confidence | Formula: MILITARY_SPENDING × 1% | Unit: USD/year | Click to view details, calculation & sources\">$27.2B</a>"
"treaty_annual_funding_latex": "$$\n\\begin{gathered}\nFunding_{treaty} \\\\\n= Spending_{mil} \\times Reduce_{treaty} \\\\\n= \\$2.72T \\times 1\\% \\\\\n= \\$27.2B\n\\end{gathered}\n$$"
"treaty_benefit_multiplier_vs_vaccines": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_benefit_multiplier_vs_vaccines\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Treaty system benefit multiplier vs childhood vaccination programs | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_CONSERVATIVE_BENEFIT ÷ CHILDHOOD_VACCINATION_BENEFIT | Unit: x | Click to view details, calculation & sources\">11.5x (95% CI: 9x-16.1x)</a>"
"treaty_benefit_multiplier_vs_vaccines_latex": "$$\n\\begin{gathered}\nk_{treaty:vax} \\\\\n= \\frac{Benefit_{peace+RD}}{Benefit_{vax,ann}} \\\\\n= \\frac{\\$172B}{\\$15B} \\\\\n= 11.5\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nBenefit_{peace+RD} \\\\\n= Benefit_{peace,soc} + Benefit_{RD,ann} \\\\\n= \\$114B + \\$58.6B \\\\\n= \\$172B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nBenefit_{peace,soc} \\\\\n= Cost_{war,total} \\times Reduce_{treaty} \\\\\n= \\$11.4T \\times 1\\% \\\\\n= \\$114B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,total} \\\\\n= Cost_{war,direct} + Cost_{war,indirect} \\\\\n= \\$7.66T + \\$3.7T \\\\\n= \\$11.4T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,direct} \\\\\n= Loss_{life,conflict} + Damage_{infra,total} \\\\\n+ Disruption_{trade} + Spending_{mil} \\\\\n= \\$2.45T + \\$1.88T + \\$616B + \\$2.72T \\\\\n= \\$7.66T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nLoss_{life,conflict} \\\\\n= Cost_{combat,human} + Cost_{state,human} \\\\\n+ Cost_{terror,human} \\\\\n= \\$2.34T + \\$27B + \\$83B \\\\\n= \\$2.45T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{combat,human} \\\\\n= Deaths_{combat} \\times VSL \\\\\n= 234{,}000 \\times \\$10M \\\\\n= \\$2.34T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{state,human} \\\\\n= Deaths_{state} \\times VSL \\\\\n= 2{,}700 \\times \\$10M \\\\\n= \\$27B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{terror,human} \\\\\n= Deaths_{terror} \\times VSL \\\\\n= 8{,}300 \\times \\$10M \\\\\n= \\$83B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDamage_{infra,total} \\\\\n= Damage_{comms} + Damage_{edu} + Damage_{energy} \\\\\n+ Damage_{health} + Damage_{transport} + Damage_{water} \\\\\n= \\$298B + \\$234B + \\$422B + \\$166B + \\$487B + \\$268B \\\\\n= \\$1.88T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDisruption_{trade} \\\\\n= Disruption_{currency} + Disruption_{energy} \\\\\n+ Disruption_{shipping} + Disruption_{supply} \\\\\n= \\$57.4B + \\$125B + \\$247B + \\$187B \\\\\n= \\$616B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,indirect} \\\\\n= Damage_{env} + Loss_{growth,mil} + Loss_{capital,conflict} \\\\\n+ Cost_{psych} + Cost_{refugee} + Cost_{vet} \\\\\n= \\$100B + \\$2.72T + \\$300B + \\$232B + \\$150B + \\$200B \\\\\n= \\$3.7T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nBenefit_{RD,ann} \\\\\n= Spending_{trials} \\times Reduce_{pct} \\\\\n= \\$60B \\times 97.7\\% \\\\\n= \\$58.6B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nReduce_{pct} \\\\\n= 1 - \\frac{Cost_{pragmatic,pt}}{Cost_{P3,pt}} \\\\\n= 1 - \\frac{\\$929}{\\$41K} \\\\\n= 97.7\\%\n\\end{gathered}\n$$"
"treaty_campaign_annual_cost_amortized": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_campaign_annual_cost_amortized\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Amortized annual campaign cost (total cost ÷ campaign duration) | Calculated from 2 inputs | ✓ High confidence | Formula: TOTAL_COST ÷ DURATION | Unit: USD/year | Click to view details, calculation & sources\">$250M (95% CI: $158M-$379M)</a>"
"treaty_campaign_annual_cost_amortized_latex": "$$\n\\begin{gathered}\nCost_{camp,amort} \\\\\n= \\frac{Cost_{campaign}}{T_{campaign}} \\\\\n= \\frac{\\$1B}{4} \\\\\n= \\$250M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$"
"treaty_campaign_budget_lobbying": "<span class=\"parameter-definition\" title=\"Political lobbying campaign: direct lobbying (US/EU/G20), Super PACs, opposition research, staff, legal/compliance. Budget exceeds combined pharma ($300M/year) and military-industrial complex ($150M/year) lobbying to ensure competitive positioning. Referendum relies on grassroots mobilization and earned media, while lobbying requires matching or exceeding opposition spending for political viability. | Unit: USD | Core definition\">$650M</span>"
"treaty_campaign_budget_reserve": "<span class=\"parameter-definition\" title=\"Reserve fund / contingency buffer (10% of total campaign cost). Using industry standard 10% for complex campaigns with potential for unforeseen legal challenges, opposition response, or regulatory delays. Conservative lower bound of $20M (2%) reflects transparent budget allocation and predictable referendum/lobbying costs. | Unit: USD | Core definition\">$100M</span>"
"treaty_campaign_duration_years": "<span class=\"parameter-definition\" title=\"Treaty campaign duration (3-5 year range, using midpoint) | Unit: years | Core definition\">4 years (95% CI: 3 years-5 years)</span>"
"treaty_campaign_duration_years_nounit": "<span class=\"parameter-definition\" title=\"Treaty campaign duration (3-5 year range, using midpoint) | Unit: years | Core definition\">4 (95% CI: 3-5)</span>"
"treaty_campaign_total_cost": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_campaign_total_cost\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total treaty campaign cost (100% VICTORY Incentive Alignment Bonds) | Calculated from 3 inputs | ✓ High confidence | Formula: REFERENDUM + LOBBYING + RESERVE | Unit: USD | Click to view details, calculation & sources\">$1B</a>"
"treaty_campaign_total_cost_latex": "$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$"
"treaty_campaign_viral_referendum_base_case": "<span class=\"parameter-definition\" title=\"Viral referendum budget for 280M verified votes (base: $250M realistic with $0.50/vote avg, range: $150M optimistic $0.20/vote to $410M worst-case $1.05/vote). Components: platform ($35M), verification infrastructure (280M × friction × $0.18-0.20), tiered referral payments (varies by virality and marginal cost curve per diffusion theory), marketing seed ($5-15M). Based on PayPal referral economics ($18-36 inflation-adjusted) and biometric verification pricing ($0.15-0.25 at 300M+ scale). | Unit: USD | Core definition\">$250M</span>"
"treaty_campaign_voting_bloc_target": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_campaign_voting_bloc_target\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Target voting bloc size for campaign (3.5% of global population - critical mass for social change) | Calculated from 2 inputs | ✓ High confidence | Formula: GLOBAL_POPULATION × 3.5% | Unit: of people | Click to view details, calculation & sources\">280 million of people</a>"
"treaty_campaign_voting_bloc_target_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_campaign_voting_bloc_target\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Target voting bloc size for campaign (3.5% of global population - critical mass for social change) | Calculated from 2 inputs | ✓ High confidence | Formula: GLOBAL_POPULATION × 3.5% | Unit: of people | Click to view details, calculation & sources\">280 million</a>"
"treaty_campaign_voting_bloc_target_latex": "$$\n\\begin{gathered}\nN_{voters,target} \\\\\n= Pop_{global} \\times Threshold_{activism} \\\\\n= 8B \\times 3.5\\% \\\\\n= 280M\n\\end{gathered}\n$$"
"treaty_cost_per_daly_trial_capacity_plus_efficacy_lag": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_cost_per_daly_trial_capacity_plus_efficacy_lag\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cost per DALY averted from elimination of efficacy lag plus earlier treatment discovery from increased trial throughput. Only counts campaign cost; ignores economic benefits from funding and R&D savings. | Calculated from 2 inputs | ✓ High confidence | Formula: CAMPAIGN_COST ÷ DALYS_TIMELINE_SHIFT | Unit: USD/DALY | Click to view details, calculation & sources\">$0.00177 (95% CI: $0.000715-$0.00412)</a>"
"treaty_cost_per_daly_trial_capacity_plus_efficacy_lag_latex": "$$\n\\begin{gathered}\nCost_{treaty,DALY} \\\\\n= \\frac{Cost_{campaign}}{DALYs_{max}} \\\\\n= \\frac{\\$1B}{565B} \\\\\n= \\$0.00177\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALYs_{max} \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$"
"treaty_cumulative_20yr_with_ratchet": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_cumulative_20yr_with_ratchet\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cumulative treaty funding over 20 years with IAB ratchet expansion following roadmap timeline. Expansion driven by bondholder lobbying incentives (10% of treaty inflows). | Calculated from 1 input | ✓ High confidence | Formula: GLOBAL_MILITARY × (0.01×3 + 0.02×4 + 0.05×5 + 0.10×8) | Unit: USD | Click to view details, calculation & sources\">$3.16T</a>"
"treaty_cumulative_20yr_with_ratchet_latex": "$$\n\\begin{gathered}\nFund_{20yr,ratchet} \\\\\n= Spending_{mil} \\times 1.16 \\\\\n= \\$2.72T \\times 1.16 \\\\\n= \\$3.16T\n\\end{gathered}\n$$"
"treaty_expected_cost_per_daly": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_expected_cost_per_daly\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"low\" title=\"Expected cost per DALY accounting for political success probability uncertainty. Monte Carlo samples from beta(0.1%, 10%) distribution. At the conservative 1% estimate, this is still more cost-effective than bed nets ($89.0/DALY). | Calculated from 2 inputs | ? Low confidence | Formula: CONDITIONAL_COST_PER_DALY ÷ POLITICAL_SUCCESS_PROBABILITY | Unit: USD/DALY | Click to view details, calculation & sources\">$0.177 (95% CI: $0.029-$3.2)</a>"
"treaty_expected_cost_per_daly_latex": "$$\n\\begin{gathered}\nE[Cost_{DALY}] \\\\\n= \\frac{Cost_{treaty,DALY}}{P_{success}} \\\\\n= \\frac{\\$0.00177}{1\\%} \\\\\n= \\$0.177\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{treaty,DALY} \\\\\n= \\frac{Cost_{campaign}}{DALYs_{max}} \\\\\n= \\frac{\\$1B}{565B} \\\\\n= \\$0.00177\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALYs_{max} \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$"
"treaty_expected_roi_trial_capacity_plus_efficacy_lag": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_expected_roi_trial_capacity_plus_efficacy_lag\" class=\"parameter-link\" data-source-ref=\"calculated\" data-source-type=\"calculated\" data-confidence=\"low\" title=\"Expected ROI for 1% treaty accounting for political success probability uncertainty. Monte Carlo samples POLITICAL_SUCCESS_PROBABILITY from beta(0.1%, 10%) distribution to generate full expected value distribution. Central value uses 1% probability. | Calculated from 2 inputs | ? Low confidence | Formula: TREATY_ROI_TRIAL_CAPACITY_PLUS_EFFICACY_LAG × POLITICAL_SUCCESS_PROBABILITY | Unit: ratio | Click to view details, calculation & sources\">848k (95% CI: 58.0k-4.76M)</a>"
"treaty_expected_roi_trial_capacity_plus_efficacy_lag_latex": "$$\n\\begin{gathered}\nE[ROI_{max}] \\\\\n= ROI_{max} \\times P_{success} \\\\\n= 84.8M \\times 1\\% \\\\\n= 848{,}000\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nROI_{max} \\\\\n= \\frac{Value_{max}}{Cost_{campaign}} \\\\\n= \\frac{\\$84800T}{\\$1B} \\\\\n= 84.8M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nValue_{max} \\\\\n= DALYs_{max} \\times Value_{QALY} \\\\\n= 565B \\times \\$150K \\\\\n= \\$84800T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALYs_{max} \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$"
"treaty_expected_vs_bed_nets_multiplier": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_expected_vs_bed_nets_multiplier\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"low\" title=\"Expected value multiplier vs bed nets (accounts for political uncertainty at 1% success rate) | Calculated from 2 inputs | ? Low confidence | Formula: BED_NETS_COST_PER_DALY ÷ TREATY_EXPECTED_COST_PER_DALY | Unit: x | Click to view details, calculation & sources\">503x (95% CI: 30x-3.0kx)</a>"
"treaty_expected_vs_bed_nets_multiplier_latex": "$$\n\\begin{gathered}\nE[k_{nets}] \\\\\n= \\frac{Cost_{nets}}{E[Cost_{DALY}]} \\\\\n= \\frac{\\$89}{\\$0.177} \\\\\n= 503\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nE[Cost_{DALY}] \\\\\n= \\frac{Cost_{treaty,DALY}}{P_{success}} \\\\\n= \\frac{\\$0.00177}{1\\%} \\\\\n= \\$0.177\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{treaty,DALY} \\\\\n= \\frac{Cost_{campaign}}{DALYs_{max}} \\\\\n= \\frac{\\$1B}{565B} \\\\\n= \\$0.00177\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALYs_{max} \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$"
"treaty_lives_saved_annual_global": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_lives_saved_annual_global\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual lives saved from 1% reduction in conflict deaths | Calculated from 2 inputs | ✓ High confidence | Formula: TOTAL_DEATHS × REDUCTION_PCT | Unit: lives/year | Click to view details, calculation & sources\">2.45 thousand lives/year (95% CI: 1.94 thousand lives/year-3.02 thousand lives/year)</a>"
"treaty_lives_saved_annual_global_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_lives_saved_annual_global\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual lives saved from 1% reduction in conflict deaths | Calculated from 2 inputs | ✓ High confidence | Formula: TOTAL_DEATHS × REDUCTION_PCT | Unit: lives/year | Click to view details, calculation & sources\">2.45 thousand (95% CI: 1.94 thousand-3.02 thousand)</a>"
"treaty_lives_saved_annual_global_latex": "$$\n\\begin{gathered}\nLives_{treaty,ann} \\\\\n= Deaths_{conflict} \\times Reduce_{treaty} \\\\\n= 245{,}000 \\times 1\\% \\\\\n= 2{,}450\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDeaths_{conflict} \\\\\n= Deaths_{combat} + Deaths_{state} + Deaths_{terror} \\\\\n= 234{,}000 + 2{,}700 + 8{,}300 \\\\\n= 245{,}000\n\\end{gathered}\n$$"
"treaty_path_avg_income_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_path_avg_income_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Average income (GDP per capita) at year 20 under the Treaty Path. | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_PATH_GDP_YEAR_20 / GLOBAL_POPULATION_2045_PROJECTED | Unit: USD | Click to view details, calculation & sources\">$339K (95% CI: $106K-$1.33M)</a>"
"treaty_path_avg_income_year_20_latex": "$$\n\\bar{y}_{treaty,20} = \\frac{GDP_{treaty,20}}{Pop_{2045}}\n$$"
"treaty_path_cagr_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_path_cagr_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Compound annual growth rate implied by Treaty Path GDP trajectory over 20 years. | Calculated from 2 inputs | ✓ High confidence | Formula: (TREATY_PATH_GDP_YEAR_20 ÷ GLOBAL_GDP_2025)^(1/20) - 1 | Unit: rate | Click to view details, calculation & sources\">17.9% (95% CI: 11.3%-26.3%)</a>"
"treaty_path_cagr_year_20_latex": "$$\n\\begin{gathered}\ng_{treaty,CAGR} \\\\\n= \\left(\\frac{GDP_{treaty,20}}{GDP_0}\\right)^{1/20} - 1\n\\end{gathered}\n$$"
"treaty_path_cumulative_lifetime_income": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_path_cumulative_lifetime_income\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cumulative per-capita income over an average remaining lifespan under Treaty Path. Uses implied per-capita CAGR for years 1-20 (derived from known year-0 and year-20 per-capita incomes), then baseline growth from the year-20 level. Conservative: assumes no further treaty acceleration beyond year 20. | Calculated from 4 inputs | ✓ High confidence | Formula: Phase 1: y0*(1+g_pc)*((1+g_pc)^20-1)/g_pc + Phase 2: y20*(1+g_base)*((1+g_base)^(T-20)-1)/g_base | Unit: USD | Click to view details, calculation & sources\">$16.1M (95% CI: $4.68M-$69.2M)</a>"
"treaty_path_cumulative_lifetime_income_latex": "$$\n\\begin{gathered}\nY_{cum,treaty} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{pc})((1+g_{pc})^{20}-1)}{g_{pc}} \\\\\n+ \\bar{y}_{treaty,20} \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}-20}-1)}{g_{base}}\n\\end{gathered}\n$$"
"treaty_path_gdp_vs_earth_multiplier_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_path_gdp_vs_earth_multiplier_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Treaty Path GDP at year 20 as a multiple of Earth baseline GDP at year 20. | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_PATH_GDP_YEAR_20 ÷ EARTH_GDP_YEAR_20 | Unit: x | Click to view details, calculation & sources\">16.5x (95% CI: 5.17x-64.9x)</a>"
"treaty_path_gdp_vs_earth_multiplier_year_20_latex": "$$\n\\begin{gathered}\nk_{treaty:earth,20} \\\\\n= \\frac{GDP_{treaty,20}}{GDP_{earth,20}} \\\\\n= \\frac{\\$3110T}{\\$188T} \\\\\n= 16.5\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nGDP_{treaty,20} \\\\\n= GDP_0(1+g_{treaty,ramp})^3(1+g_{treaty,full})^{17}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\ns_{mil,max} = Cut_{WW2} = 87.6\\% = 87.6\\%\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCut_{WW2} \\\\\n= 1 - \\frac{Spending_{US,1947}}{Spending_{US,1945}} \\\\\n= 1 - \\frac{\\$176B}{\\$1.42T} \\\\\n= 87.6\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nf_{cure,20,wish} \\\\\n= \\min\\left(1,\\frac{Treatments_{new,ann}\\cdot k_{capacity,wish}\\cdot 20}{D_{untreated}}\\right)\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity,max} \\\\\n= \\frac{N_{willing}}{Slots_{curr}} \\\\\n= \\frac{1.08B}{1.9M} \\\\\n= 566\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{earth,20} = GDP_0(1+g_{base})^{20}\n$$"
"treaty_path_gdp_year_20": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_path_gdp_year_20\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Projected global GDP at year 20 under the Treaty Path: military-to-science reallocation plus disease-burden recovery only. Excludes non-health dysfunction-capital reallocation to isolate the lower-political-baggage channel stack. | Calculated from 7 inputs | ✓ High confidence | Formula: GLOBAL_GDP_2025 × (1 + g_treaty_ramp)^3 × (1 + g_treaty_full)^17, where g_treaty includes baseline growth + military reallocation + disease-burden recovery only | Unit: USD | Click to view details, calculation & sources\">$3.11 quadrillion (95% CI: $974T-$12.2 quadrillion)</a>"
"treaty_path_gdp_year_20_latex": "$$\n\\begin{gathered}\nGDP_{treaty,20} \\\\\n= GDP_0(1+g_{treaty,ramp})^3(1+g_{treaty,full})^{17}\n\\end{gathered}\n$$"
"treaty_path_lifetime_income_gain_per_capita": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_path_lifetime_income_gain_per_capita\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Lifetime per-capita income gain from Treaty Path vs Earth baseline. Cumulative treaty income minus cumulative earth income over average remaining lifespan. Uses global averages; individual gain scales with starting income. | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_PATH_CUMULATIVE_LIFETIME_INCOME - EARTH_CUMULATIVE_LIFETIME_INCOME | Unit: USD | Click to view details, calculation & sources\">$14.9M (95% CI: $3.61M-$67.9M)</a>"
"treaty_path_lifetime_income_gain_per_capita_latex": "$$\n\\begin{gathered}\n\\Delta Y_{lifetime,treaty} \\\\\n= Y_{cum,treaty} - Y_{cum,earth} \\\\\n= \\$16.1M - \\$1.18M \\\\\n= \\$14.9M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,treaty} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{pc})((1+g_{pc})^{20}-1)}{g_{pc}} \\\\\n+ \\bar{y}_{treaty,20} \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}-20}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{0} \\\\\n= \\frac{GDP_{global}}{Pop_{global}} \\\\\n= \\frac{\\$115T}{8B} \\\\\n= \\$14.4K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\bar{y}_{treaty,20} = \\frac{GDP_{treaty,20}}{Pop_{2045}}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nGDP_{treaty,20} \\\\\n= GDP_0(1+g_{treaty,ramp})^3(1+g_{treaty,full})^{17}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\ns_{mil,max} = Cut_{WW2} = 87.6\\% = 87.6\\%\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCut_{WW2} \\\\\n= 1 - \\frac{Spending_{US,1947}}{Spending_{US,1945}} \\\\\n= 1 - \\frac{\\$176B}{\\$1.42T} \\\\\n= 87.6\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nf_{cure,20,wish} \\\\\n= \\min\\left(1,\\frac{Treatments_{new,ann}\\cdot k_{capacity,wish}\\cdot 20}{D_{untreated}}\\right)\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity,max} \\\\\n= \\frac{N_{willing}}{Slots_{curr}} \\\\\n= \\frac{1.08B}{1.9M} \\\\\n= 566\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{remaining} \\\\\n= LE_{global} - Age_{median} \\\\\n= 79 - 30.5 \\\\\n= 48.5\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,earth} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{earth,20} \\\\\n= \\frac{GDP_{earth,20}}{Pop_{2045}} \\\\\n= \\frac{\\$188T}{9.2B} \\\\\n= \\$20.5K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{earth,20} = GDP_0(1+g_{base})^{20}\n$$"
"treaty_path_lifetime_income_multiplier": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_path_lifetime_income_multiplier\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Ratio of cumulative lifetime income under Treaty Path vs Earth baseline. Income-agnostic: applies as a multiplier to any individual's lifetime earnings. | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_PATH_CUMULATIVE_LIFETIME_INCOME / EARTH_CUMULATIVE_LIFETIME_INCOME | Unit: x | Click to view details, calculation & sources\">13.5x (95% CI: 4.38x-52.8x)</a>"
"treaty_path_lifetime_income_multiplier_latex": "$$\n\\begin{gathered}\nk_{lifetime,treaty:earth} \\\\\n= \\frac{Y_{cum,treaty}}{Y_{cum,earth}} \\\\\n= \\frac{\\$16.1M}{\\$1.18M} \\\\\n= 13.5\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,treaty} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{pc})((1+g_{pc})^{20}-1)}{g_{pc}} \\\\\n+ \\bar{y}_{treaty,20} \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}-20}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{0} \\\\\n= \\frac{GDP_{global}}{Pop_{global}} \\\\\n= \\frac{\\$115T}{8B} \\\\\n= \\$14.4K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\bar{y}_{treaty,20} = \\frac{GDP_{treaty,20}}{Pop_{2045}}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nGDP_{treaty,20} \\\\\n= GDP_0(1+g_{treaty,ramp})^3(1+g_{treaty,full})^{17}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\ns_{mil,max} = Cut_{WW2} = 87.6\\% = 87.6\\%\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCut_{WW2} \\\\\n= 1 - \\frac{Spending_{US,1947}}{Spending_{US,1945}} \\\\\n= 1 - \\frac{\\$176B}{\\$1.42T} \\\\\n= 87.6\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nf_{cure,20,wish} \\\\\n= \\min\\left(1,\\frac{Treatments_{new,ann}\\cdot k_{capacity,wish}\\cdot 20}{D_{untreated}}\\right)\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity,max} \\\\\n= \\frac{N_{willing}}{Slots_{curr}} \\\\\n= \\frac{1.08B}{1.9M} \\\\\n= 566\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{willing} \\\\\n= N_{patients} \\times Pct_{willing} \\\\\n= 2.4B \\times 44.8\\% \\\\\n= 1.08B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{remaining} \\\\\n= LE_{global} - Age_{median} \\\\\n= 79 - 30.5 \\\\\n= 48.5\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nY_{cum,earth} \\\\\n= \\bar{y}_0 \\cdot \\frac{(1+g_{base})((1+g_{base})^{T_{remaining}}-1)}{g_{base}}\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\n\\bar{y}_{earth,20} \\\\\n= \\frac{GDP_{earth,20}}{Pop_{2045}} \\\\\n= \\frac{\\$188T}{9.2B} \\\\\n= \\$20.5K\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nGDP_{earth,20} = GDP_0(1+g_{base})^{20}\n$$"
"treaty_peace_plus_rd_annual_benefits": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_peace_plus_rd_annual_benefits\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Basic annual benefits: peace dividend + Decentralized Framework for Drug Assessment R&D savings only (2 of 8 benefit categories, excludes regulatory delay value) | Calculated from 2 inputs | ✓ High confidence | Formula: PEACE_DIVIDEND + DFDA_RD_SAVINGS | Unit: USD/year | Click to view details, calculation & sources\">$172B (95% CI: $140B-$213B)</a>"
"treaty_peace_plus_rd_annual_benefits_latex": "$$\n\\begin{gathered}\nBenefit_{peace+RD} \\\\\n= Benefit_{peace,soc} + Benefit_{RD,ann} \\\\\n= \\$114B + \\$58.6B \\\\\n= \\$172B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nBenefit_{peace,soc} \\\\\n= Cost_{war,total} \\times Reduce_{treaty} \\\\\n= \\$11.4T \\times 1\\% \\\\\n= \\$114B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,total} \\\\\n= Cost_{war,direct} + Cost_{war,indirect} \\\\\n= \\$7.66T + \\$3.7T \\\\\n= \\$11.4T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,direct} \\\\\n= Loss_{life,conflict} + Damage_{infra,total} \\\\\n+ Disruption_{trade} + Spending_{mil} \\\\\n= \\$2.45T + \\$1.88T + \\$616B + \\$2.72T \\\\\n= \\$7.66T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nLoss_{life,conflict} \\\\\n= Cost_{combat,human} + Cost_{state,human} \\\\\n+ Cost_{terror,human} \\\\\n= \\$2.34T + \\$27B + \\$83B \\\\\n= \\$2.45T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{combat,human} \\\\\n= Deaths_{combat} \\times VSL \\\\\n= 234{,}000 \\times \\$10M \\\\\n= \\$2.34T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{state,human} \\\\\n= Deaths_{state} \\times VSL \\\\\n= 2{,}700 \\times \\$10M \\\\\n= \\$27B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{terror,human} \\\\\n= Deaths_{terror} \\times VSL \\\\\n= 8{,}300 \\times \\$10M \\\\\n= \\$83B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDamage_{infra,total} \\\\\n= Damage_{comms} + Damage_{edu} + Damage_{energy} \\\\\n+ Damage_{health} + Damage_{transport} + Damage_{water} \\\\\n= \\$298B + \\$234B + \\$422B + \\$166B + \\$487B + \\$268B \\\\\n= \\$1.88T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDisruption_{trade} \\\\\n= Disruption_{currency} + Disruption_{energy} \\\\\n+ Disruption_{shipping} + Disruption_{supply} \\\\\n= \\$57.4B + \\$125B + \\$247B + \\$187B \\\\\n= \\$616B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{war,indirect} \\\\\n= Damage_{env} + Loss_{growth,mil} + Loss_{capital,conflict} \\\\\n+ Cost_{psych} + Cost_{refugee} + Cost_{vet} \\\\\n= \\$100B + \\$2.72T + \\$300B + \\$232B + \\$150B + \\$200B \\\\\n= \\$3.7T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nBenefit_{RD,ann} \\\\\n= Spending_{trials} \\times Reduce_{pct} \\\\\n= \\$60B \\times 97.7\\% \\\\\n= \\$58.6B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nReduce_{pct} \\\\\n= 1 - \\frac{Cost_{pragmatic,pt}}{Cost_{P3,pt}} \\\\\n= 1 - \\frac{\\$929}{\\$41K} \\\\\n= 97.7\\%\n\\end{gathered}\n$$"
"treaty_qalys_gained_annual_global": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_qalys_gained_annual_global\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual QALYs gained from peace dividend (lives saved × QALYs/life) | Calculated from 2 inputs | ✓ High confidence | Formula: LIVES_SAVED × QALYS_PER_LIFE | Unit: QALYs/year | Click to view details, calculation & sources\">85.6 thousand QALYs/year (95% CI: 45.1 thousand QALYs/year-141 thousand QALYs/year)</a>"
"treaty_qalys_gained_annual_global_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_qalys_gained_annual_global\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Annual QALYs gained from peace dividend (lives saved × QALYs/life) | Calculated from 2 inputs | ✓ High confidence | Formula: LIVES_SAVED × QALYS_PER_LIFE | Unit: QALYs/year | Click to view details, calculation & sources\">85.6 thousand (95% CI: 45.1 thousand-141 thousand)</a>"
"treaty_qalys_gained_annual_global_latex": "$$\n\\begin{gathered}\nQALY_{treaty,ann} \\\\\n= QALY_{life} \\times Lives_{treaty,ann} \\\\\n= 35 \\times 2{,}450 \\\\\n= 85{,}600\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nLives_{treaty,ann} \\\\\n= Deaths_{conflict} \\times Reduce_{treaty} \\\\\n= 245{,}000 \\times 1\\% \\\\\n= 2{,}450\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDeaths_{conflict} \\\\\n= Deaths_{combat} + Deaths_{state} + Deaths_{terror} \\\\\n= 234{,}000 + 2{,}700 + 8{,}300 \\\\\n= 245{,}000\n\\end{gathered}\n$$"
"treaty_ratchet_multiplier_20yr": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_ratchet_multiplier_20yr\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"How many times more cumulative funding flows with IAB ratchet vs stagnation over 20 years. | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_CUMULATIVE_20YR_WITH_RATCHET / (TREATY_ANNUAL_FUNDING × 20) | Unit: x | Click to view details, calculation & sources\">5.8x</a>"
"treaty_ratchet_multiplier_20yr_latex": "$$\n\\begin{gathered}\nk_{ratchet,20} \\\\\n= \\frac{Fund_{20yr,ratchet}}{20\\cdot Funding_{treaty,ann}}\n\\end{gathered}\n$$"
"treaty_ratchet_premium_20yr": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_ratchet_premium_20yr\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Additional cumulative funding from IAB ratchet expansion vs stagnation over 20 years. The value of the IAB mechanism: this much more funding flows to medical research because bondholder incentives drive treaty expansion. | Calculated from 2 inputs | ✓ High confidence | Formula: TREATY_CUMULATIVE_20YR_WITH_RATCHET - (TREATY_ANNUAL_FUNDING × 20) | Unit: USD | Click to view details, calculation & sources\">$2.61T</a>"
"treaty_ratchet_premium_20yr_latex": "$$\n\\begin{gathered}\n\\Delta Fund_{ratchet,20} \\\\\n= Fund_{20yr,ratchet}-20\\cdot Funding_{treaty,ann}\n\\end{gathered}\n$$"
"treaty_redirected_spending_infinite_roi": "<span class=\"parameter-definition\" title=\"ROI when redirecting existing spending (no new costs = infinite return) | Unit: ratio | Core definition\">0</span>"
"treaty_redirected_spending_infinite_roi_latex": "$$\n\\begin{gathered}\n\\text{ROI} \\\\\n= \\frac{\\text{Annual Benefits}}{\\text{New Spending}} \\\\\n= \\frac{\\$172B}{0} \\\\\n= \\infty\n\\end{gathered}\n$$"
"treaty_reduction_pct": "<span class=\"parameter-definition\" title=\"1% reduction in military spending/war costs from treaty | Unit: rate | Core definition\">1%</span>"
"treaty_roi_existing_drugs_only": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_roi_existing_drugs_only\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Treaty ROI based on historical rate of drug development (existing drugs only). Total one-time benefit from avoiding regulatory delay for drugs already in development divided by campaign cost. Excludes future innovation effects. | Calculated from 2 inputs | ✓ High confidence | Formula: HISTORICAL_PROGRESS_TOTAL ÷ CAMPAIGN_COST | Unit: ratio | Click to view details, calculation & sources\">259k (95% CI: 110k-419k)</a>"
"treaty_roi_existing_drugs_only_latex": "$$\n\\begin{gathered}\nROI_{drugs} \\\\\n= \\frac{Loss_{lag}}{Cost_{campaign}} \\\\\n= \\frac{\\$259T}{\\$1B} \\\\\n= 259{,}000\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nLoss_{lag} \\\\\n= Deaths_{lag,total} \\times (LE_{global} - Age_{death,delay}) \\times Value_{QALY} \\\\\n= 102M \\times (79 - 62) \\times \\$150K \\\\\n= \\$259T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDeaths_{lag,total} \\\\\n= Lives_{saved,annual} \\times T_{lag} \\\\\n= 12.4M \\times 8.2 \\\\\n= 102M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nLives_{saved,annual} \\\\\n= \\frac{LY_{saved,annual}}{T_{ext}} \\\\\n= \\frac{149M}{12} \\\\\n= 12.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$"
"treaty_roi_trial_capacity_plus_efficacy_lag": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_roi_trial_capacity_plus_efficacy_lag\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Treaty ROI from elimination of efficacy lag plus earlier treatment discovery from increased trial throughput. Total one-time benefit divided by campaign cost. This is the primary ROI estimate for total health benefits. | Calculated from 2 inputs | ~ Medium confidence | Formula: DFDA_TRIAL_CAPACITY_PLUS_EFFICACY_LAG_ECONOMIC_VALUE ÷ CAMPAIGN_COST | Unit: ratio | Click to view details, calculation & sources\">84.8M (95% CI: 46.6M-144M)</a>"
"treaty_roi_trial_capacity_plus_efficacy_lag_latex": "$$\n\\begin{gathered}\nROI_{max} \\\\\n= \\frac{Value_{max}}{Cost_{campaign}} \\\\\n= \\frac{\\$84800T}{\\$1B} \\\\\n= 84.8M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nValue_{max} \\\\\n= DALYs_{max} \\times Value_{QALY} \\\\\n= 565B \\times \\$150K \\\\\n= \\$84800T\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALYs_{max} \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$"
"treaty_total_annual_costs": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_total_annual_costs\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Total annual system costs (campaign + Decentralized Framework for Drug Assessment operations) | Calculated from 2 inputs | ✓ High confidence | Formula: CAMPAIGN_ANNUAL + DFDA_OPEX | Unit: USD/year | Click to view details, calculation & sources\">$290M (95% CI: $185M-$434M)</a>"
"treaty_total_annual_costs_latex": "$$\n\\begin{gathered}\nCost_{treaty,ann} \\\\\n= OPEX_{dFDA} + Cost_{camp,amort} \\\\\n= \\$40M + \\$250M \\\\\n= \\$290M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{camp,amort} \\\\\n= \\frac{Cost_{campaign}}{T_{campaign}} \\\\\n= \\frac{\\$1B}{4} \\\\\n= \\$250M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$"
"treaty_vs_bed_nets_multiplier": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_vs_bed_nets_multiplier\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"How many times more cost-effective than bed nets (using bed net cost per DALY midpoint estimate) | Calculated from 2 inputs | ✓ High confidence | Formula: BED_NETS_COST_PER_DALY ÷ TREATY_COST_PER_DALY | Unit: x | Click to view details, calculation & sources\">50.3kx (95% CI: 23.8kx-111.7kx)</a>"
"treaty_vs_bed_nets_multiplier_latex": "$$\n\\begin{gathered}\nk_{treaty:nets} \\\\\n= \\frac{Cost_{nets}}{Cost_{treaty,DALY}} \\\\\n= \\frac{\\$89}{\\$0.00177} \\\\\n= 50{,}300\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{treaty,DALY} \\\\\n= \\frac{Cost_{campaign}}{DALYs_{max}} \\\\\n= \\frac{\\$1B}{565B} \\\\\n= \\$0.00177\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALYs_{max} \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$"
"treaty_vs_direct_funding_leverage": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-treaty_vs_direct_funding_leverage\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"How many times more cost-effective the treaty campaign is vs direct funding. Treaty campaign unlocks government funding at scale, avoiding need for philanthropists/NIH to directly commit equivalent amounts. Both approaches achieve same DALY timeline shift benefit. Treaty spreads cost across governments while building sustainable public funding infrastructure. | Calculated from 2 inputs | ✓ High confidence | Formula: DFDA_DIRECT_FUNDING_COST_PER_DALY ÷ TREATY_COST_PER_DALY | Unit: x | Click to view details, calculation & sources\">476x (95% CI: 329x-462x)</a>"
"treaty_vs_direct_funding_leverage_latex": "$$\n\\begin{gathered}\nLeverage_{treaty} \\\\\n= \\frac{Cost_{direct,DALY}}{Cost_{treaty,DALY}} \\\\\n= \\frac{\\$0.842}{\\$0.00177} \\\\\n= 476\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{direct,DALY} \\\\\n= \\frac{NPV_{direct}}{DALYs_{max}} \\\\\n= \\frac{\\$476B}{565B} \\\\\n= \\$0.842\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nNPV_{direct} = Funding_{ann} \\times \\frac{1 - (1+r)^{-T}}{r}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,dFDA} \\\\\n= \\frac{T_{queue,SQ}}{k_{capacity}} \\\\\n= \\frac{443}{12.3} \\\\\n= 36\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{queue,SQ} \\\\\n= \\frac{N_{untreated}}{Treatments_{new,ann}} \\\\\n= \\frac{6{,}650}{15} \\\\\n= 443\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{untreated} \\\\\n= N_{rare} \\times 0.95 \\\\\n= 7{,}000 \\times 0.95 \\\\\n= 6{,}650\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALYs_{max} \\\\\n= DALYs_{global,ann} \\times Pct_{avoid,DALY} \\times T_{accel,max} \\\\\n= 2.88B \\times 92.6\\% \\times 212 \\\\\n= 565B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nT_{accel,max} = T_{accel} + T_{lag} = 204 + 8.2 = 212\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{accel} \\\\\n= T_{first,SQ} \\times \\left(1 - \\frac{1}{k_{capacity}}\\right) \\\\\n= 222 \\times \\left(1 - \\frac{1}{12.3}\\right) \\\\\n= 204\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nT_{first,SQ} \\\\\n= T_{queue,SQ} \\times 0.5 \\\\\n= 443 \\times 0.5 \\\\\n= 222\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{treaty,DALY} \\\\\n= \\frac{Cost_{campaign}}{DALYs_{max}} \\\\\n= \\frac{\\$1B}{565B} \\\\\n= \\$0.00177\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nCost_{campaign} \\\\\n= Budget_{viral,base} + Budget_{lobby,treaty} \\\\\n+ Budget_{reserve} \\\\\n= \\$250M + \\$650M + \\$100M \\\\\n= \\$1B\n\\end{gathered}\n$$"
"trial_capacity_cumulative_years_20yr": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-trial_capacity_cumulative_years_20yr\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cumulative trial-capacity-equivalent years over 20-year period | Calculated from 1 input | ✓ High confidence | Formula: DFDA_TRIAL_CAPACITY_MULTIPLIER × 20 YEARS | Unit: years | Click to view details, calculation & sources\">247 years (95% CI: 84 years-1.23 thousand years)</a>"
"trial_capacity_cumulative_years_20yr_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-trial_capacity_cumulative_years_20yr\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Cumulative trial-capacity-equivalent years over 20-year period | Calculated from 1 input | ✓ High confidence | Formula: DFDA_TRIAL_CAPACITY_MULTIPLIER × 20 YEARS | Unit: years | Click to view details, calculation & sources\">247 (95% CI: 84-1.23 thousand)</a>"
"trial_capacity_cumulative_years_20yr_latex": "$$\n\\begin{gathered}\nCapacity_{20yr} \\\\\n= k_{capacity} \\times 20 \\\\\n= 12.3 \\times 20 \\\\\n= 247\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nk_{capacity} \\\\\n= \\frac{N_{fundable,dFDA}}{Slots_{curr}} \\\\\n= \\frac{23.4M}{1.9M} \\\\\n= 12.3\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{fundable,dFDA} \\\\\n= \\frac{Subsidies_{dFDA,ann}}{Cost_{pragmatic,pt}} \\\\\n= \\frac{\\$21.8B}{\\$929} \\\\\n= 23.4M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nSubsidies_{dFDA,ann} \\\\\n= Funding_{dFDA,ann} - OPEX_{dFDA} \\\\\n= \\$21.8B - \\$40M \\\\\n= \\$21.8B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nOPEX_{dFDA} \\\\\n= Cost_{platform} + Cost_{staff} + Cost_{infra} \\\\\n+ Cost_{regulatory} + Cost_{community} \\\\\n= \\$15M + \\$10M + \\$8M + \\$5M + \\$2M \\\\\n= \\$40M\n\\end{gathered}\n$$"
"trial_relevant_diseases_count": "<span class=\"parameter-definition\" title=\"Consolidated count of trial-relevant diseases worth targeting (after grouping ICD-10 codes) | Unit: diseases | Core definition\">1 thousand diseases (95% CI: 800 diseases-1.2 thousand diseases)</span>"
"trial_relevant_diseases_count_nounit": "<span class=\"parameter-definition\" title=\"Consolidated count of trial-relevant diseases worth targeting (after grouping ICD-10 codes) | Unit: diseases | Core definition\">1 thousand (95% CI: 800-1.2 thousand)</span>"
"type_ii_error_cost_ratio": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-type_ii_error_cost_ratio\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"medium\" title=\"Ratio of Type II error cost to Type I error benefit (harm from delay vs. harm prevented) | Calculated from 2 inputs | ~ Medium confidence | Formula: TYPE_II_COST ÷ TYPE_I_BENEFIT | Unit: ratio | Click to view details, calculation & sources\">3.07k (95% CI: 2.88k-3.12k)</a>"
"type_ii_error_cost_ratio_latex": "$$\n\\begin{gathered}\nRatio_{TypeII} \\\\\n= \\frac{DALYs_{lag}}{DALY_{TypeI}} \\\\\n= \\frac{7.94B}{2.59M} \\\\\n= 3{,}070\n\\end{gathered}\n$$\n\nwhere:\n\n$$\nDALYs_{lag} = YLL_{lag} + YLD_{lag} = 7.07B + 873M = 7.94B\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nYLL_{lag} \\\\\n= Deaths_{lag} \\times (LE_{global} - Age_{death,delay}) \\\\\n= 416M \\times (79 - 62) \\\\\n= 7.07B\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDeaths_{lag} \\\\\n= T_{lag} \\times Deaths_{disease,daily} \\times 338 \\\\\n= 8.2 \\times 150{,}000 \\times 338 \\\\\n= 416M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nYLD_{lag} \\\\\n= Deaths_{lag} \\times T_{suffering} \\times DW_{chronic} \\\\\n= 416M \\times 6 \\times 0.35 \\\\\n= 873M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALY_{TypeI} \\\\\n= DALY_{thal} \\times 62 \\\\\n= 41{,}800 \\times 62 \\\\\n= 2.59M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALY_{thal} \\\\\n= YLD_{thal} + YLL_{thal} \\\\\n= 13{,}000 + 28{,}800 \\\\\n= 41{,}800\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nYLD_{thal} \\\\\n= DW_{thal} \\times N_{thal,survive} \\times LE_{thal} \\\\\n= 0.4 \\times 540 \\times 60 \\\\\n= 13{,}000\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{thal,survive} \\\\\n= N_{thal,US,prevent} \\times (1 - Rate_{thal,mort}) \\\\\n= 900 \\times (1 - 40\\%) \\\\\n= 540\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{thal,US,prevent} \\\\\n= N_{thal,global} \\times Pct_{US,1960} \\\\\n= 15{,}000 \\times 6\\% \\\\\n= 900\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nYLL_{thal} \\\\\n= Deaths_{thal} \\times 80 \\\\\n= 360 \\times 80 \\\\\n= 28{,}800\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDeaths_{thal} \\\\\n= Rate_{thal,mort} \\times N_{thal,US,prevent} \\\\\n= 40\\% \\times 900 \\\\\n= 360\n\\end{gathered}\n$$"
"type_i_error_benefit_dalys": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-type_i_error_benefit_dalys\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"low\" title=\"Maximum DALYs saved by FDA preventing unsafe drugs over 62-year period 1962-2024 (extreme overestimate: one Thalidomide-scale event per year) | Calculated from 1 input | ? Low confidence | Formula: THALIDOMIDE_DALYS_PER_EVENT × 62 years | Unit: DALYs | Click to view details, calculation & sources\">2.59 million DALYs (95% CI: 1.54 million DALYs-4.16 million DALYs)</a>"
"type_i_error_benefit_dalys_nounit": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-type_i_error_benefit_dalys\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"low\" title=\"Maximum DALYs saved by FDA preventing unsafe drugs over 62-year period 1962-2024 (extreme overestimate: one Thalidomide-scale event per year) | Calculated from 1 input | ? Low confidence | Formula: THALIDOMIDE_DALYS_PER_EVENT × 62 years | Unit: DALYs | Click to view details, calculation & sources\">2.59 million (95% CI: 1.54 million-4.16 million)</a>"
"type_i_error_benefit_dalys_latex": "$$\n\\begin{gathered}\nDALY_{TypeI} \\\\\n= DALY_{thal} \\times 62 \\\\\n= 41{,}800 \\times 62 \\\\\n= 2.59M\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDALY_{thal} \\\\\n= YLD_{thal} + YLL_{thal} \\\\\n= 13{,}000 + 28{,}800 \\\\\n= 41{,}800\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nYLD_{thal} \\\\\n= DW_{thal} \\times N_{thal,survive} \\times LE_{thal} \\\\\n= 0.4 \\times 540 \\times 60 \\\\\n= 13{,}000\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{thal,survive} \\\\\n= N_{thal,US,prevent} \\times (1 - Rate_{thal,mort}) \\\\\n= 900 \\times (1 - 40\\%) \\\\\n= 540\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{thal,US,prevent} \\\\\n= N_{thal,global} \\times Pct_{US,1960} \\\\\n= 15{,}000 \\times 6\\% \\\\\n= 900\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nYLL_{thal} \\\\\n= Deaths_{thal} \\times 80 \\\\\n= 360 \\times 80 \\\\\n= 28{,}800\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nDeaths_{thal} \\\\\n= Rate_{thal,mort} \\times N_{thal,US,prevent} \\\\\n= 40\\% \\times 900 \\\\\n= 360\n\\end{gathered}\n$$"
"unexplored_ratio": "<a href=\"/knowledge/appendix/parameters-and-calculations.html#sec-unexplored_ratio\" class=\"parameter-link\" data-source-ref=\"\" data-source-type=\"calculated\" data-confidence=\"high\" title=\"Fraction of possible drug-disease space that remains unexplored (>99%) | Calculated from 2 inputs | ✓ High confidence | Formula: 1 - EXPLORATION_RATIO | Unit: percentage | Click to view details, calculation & sources\">99.7% (95% CI: 99%-100%)</a>"
"unexplored_ratio_latex": "$$\n\\begin{gathered}\nRatio_{unexplored} \\\\\n= 1 - \\frac{N_{tested}}{N_{combos}} \\\\\n= 1 - \\frac{32{,}500}{9.5M} \\\\\n= 99.7\\%\n\\end{gathered}\n$$\n\nwhere:\n\n$$\n\\begin{gathered}\nN_{combos} \\\\\n= N_{safe} \\times N_{diseases,trial} \\\\\n= 9{,}500 \\times 1{,}000 \\\\\n= 9.5M\n\\end{gathered}\n$$"
