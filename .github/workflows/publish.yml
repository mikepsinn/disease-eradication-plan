          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_IAB_SITE_ID }}
        timeout-minutes: 1

  build-pdf:
    name: Build Book PDF
    runs-on: ubuntu-latest
    needs: build-main-html  # Wait for HTML to reuse freeze cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Quarto freeze from HTML build
        uses: actions/cache@v4
        with:
          path: _freeze
