on:
  workflow_dispatch:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

name: Build and Deploy to Netlify

permissions:
  contents: read

concurrency:
  group: "netlify-deploy"
  cancel-in-progress: true

jobs:

  build-1-pct-treaty-impact:
    name: "Build The 1% Treaty: Harnessing Greed to Eradicate Disea"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-1-pct-treaty-impact-${{ hashFiles('**/*.qmd', '**/*.ipynb') }}

          restore-keys: |
            quarto-freeze-1-pct-treaty-impact-
            quarto-freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache validation results
        uses: actions/cache@v4
        with:
          path: .cache
          key: validation-cache-${{ runner.os }}-${{ hashFiles('.cache/pdf-validation-cache.json') }}
          restore-keys: |
            validation-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --system -e .

      - name: Install Jupyter kernel
        run: |
          python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            tinytex-${{ runner.os }}-

      - name: Install LaTeX for PDF/EPUB
        run: |
          if [ ! -d ~/.TinyTeX ]; then
            quarto install tinytex
          fi
          ~/.TinyTeX/bin/*/tlmgr update --self || true
          ~/.TinyTeX/bin/*/tlmgr install fontspec unicode-math lualatex-math luaotfload || true

      - name: "Render Build The 1% Treaty: Harnessing Greed to Eradicate Disea"
        run: python scripts/render-quarto.py 1-pct-treaty-impact
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ (secrets.LLM_VALIDATION == 'true' || github.ref == 'refs/heads/master') && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
        timeout-minutes: 30

      - name: Upload PDFs artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-1-pct-treaty-impact
          path: _build_temp/1-pct-treaty-impact/**/*.pdf
          if-no-files-found: ignore


      - name: Upload EPUBs artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: epubs-1-pct-treaty-impact
          path: _build_temp/1-pct-treaty-impact/**/*.epub
          if-no-files-found: ignore


      - name: Upload validation checklists
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: validation-checklists-1-pct-treaty-impact
          path: pdf-validation-checklist-*.md
          if-no-files-found: ignore

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs-1-pct-treaty-impact
          path: |
            _build_temp/1-pct-treaty-impact/*.log
            _build_temp/1-pct-treaty-impact/**/*.log
            _build_temp/1-pct-treaty-impact/*.aux
            _build_temp/1-pct-treaty-impact/**/*.aux
            _build_temp/1-pct-treaty-impact/*.toc
            _build_temp/1-pct-treaty-impact/**/*.toc
            _build_temp/1-pct-treaty-impact/*.out
            _build_temp/1-pct-treaty-impact/**/*.out
          retention-days: 7


      - name: "Deploy Build The 1% Treaty: Harnessing Greed to Eradicate Disea to Netlify (immediate)"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '_build_temp/1-pct-treaty-impact/_site/1-pct-treaty-impact'
          production-deploy: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          deploy-message: "Deploy 1-pct-treaty-impact from ${{ github.ref_name }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

          NETLIFY_SITE_ID: 8cb62a4c-0a10-4a92-a9ab-088c5b2cf094

        timeout-minutes: 1



      - name: "Upload Build The 1% Treaty: Harnessing Greed to Eradicate Disea PDF to Zenodo (draft)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python scripts/upload-all-zenodo-and-save-dois.py --no-rebuild 1-pct-treaty-impact



