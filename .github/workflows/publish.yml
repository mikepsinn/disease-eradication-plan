      - name: Install Jupyter kernel
        run: |
          python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: Install LaTeX

        run: quarto install tinytex

      - name: "Render Build Wishocracy: Solving the Democratic Principal-Agent"
        run: python scripts/render-quarto.py wishocracy
        timeout-minutes: 10


      - name: "Deploy Build Wishocracy: Solving the Democratic Principal-Agent to Netlify (immediate)"
        if: github.event_name == 'push'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '_build_temp/wishocracy/_site/wishocracy'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}

          deploy-message: "Deploy wishocracy site from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_WISHOCRACY_SITE_ID }}

        timeout-minutes: 1



      - name: "Upload Build Wishocracy: Solving the Democratic Principal-Agent PDF to Zenodo (draft)"
        if: github.event_name == 'push'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

        run: python scripts/publish-zenodo.py --draft --paper wishocracy


