  deploy-redirect-worker:
    name: "Deploy legacy subdomain redirect Worker"
    # Runs after the standalone paper deploys so the target check below sees them.
    needs:
      - validate
      - build-institute-papers
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Never point a working legacy host at a site that is not serving yet. A
      # paper that just got its own site-url has a Pages project but no custom
      # domain until someone attaches it, and this keeps the previous Worker
      # (still redirecting to the manual page) in place until they do.
      - name: Check standalone redirect targets are live
        run: |
          targets="$(jq -r '[.[]] | unique[]' cloudflare/redirect-worker/redirect-map.json | grep -v '^https://manual\.warondisease\.org/' || true)"
          for attempt in 1 2 3; do
            failed=""
            for target in $targets; do
              # Follow redirects within the site (Pages 308s "page.html" to
              # "page"), but a target that ends up on another host is not live:
              # that is how a catch-all rule once hid three broken paper sites.
              result="$(curl --silent --location --output /dev/null --write-out '%{http_code} %{url_effective}' --max-time 30 "$target" || true)"
              status="${result%% *}"
              target_host="$(printf '%s' "$target" | sed -E 's#^https?://([^/]+).*#\1#' | tr '[:upper:]' '[:lower:]')"
              final_host="$(printf '%s' "${result#* }" | sed -E 's#^https?://([^/]+).*#\1#' | tr '[:upper:]' '[:lower:]')"
              if [ "$status" != "200" ] || [ "$final_host" != "$target_host" ]; then
                failed="$failed $target($status@$final_host)"
              fi
            done
            if [ -z "$failed" ]; then
              echo "All standalone redirect targets return HTTP 200."
              exit 0
            fi
            echo "Not live yet (attempt $attempt of 3):$failed"
            sleep 30
          done
          echo "::error title=Redirect target is not live::These hosts do not return HTTP 200:$failed. Attach each host as a custom domain on its Cloudflare Pages project (Workers & Pages > project > Custom domains), then re-run this workflow. The previous redirect Worker stays deployed, so legacy links keep working."
          exit 1
        timeout-minutes: 5

      - name: Deploy redirect Worker to Cloudflare
        run: npx --yes wrangler@4.126.0 deploy --config cloudflare/redirect-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        timeout-minutes: 5

  # A deploy can succeed and still serve the wrong thing (a stray _redirects
  # rule once sent every paper site to the manual for weeks). Check that each
  # canonical URL serves its own page and each legacy host lands on its target.
  verify-live-sites:
    name: "Verify live sites and redirects"
    needs:
      - deploy-redirect-worker
      - build-institute-papers
      - build-manual
    # Report on every URL even when the Worker deploy above was held back.
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Check live sites and redirects
        run: |
          for attempt in 1 2 3; do
            if pnpm monitor:uptimerobot:check; then
              exit 0
            fi
            echo "Live check failed (attempt $attempt of 3); waiting for deploys to propagate."
            sleep 60
          done
          echo "::error title=Live site check failed::A canonical URL or legacy redirect is not serving its expected page. See the [failed] lines above."
          exit 1
        timeout-minutes: 10