  release-builds:
    name: "Release PDFs & EPUBs (master only)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs:

      - build-1-pct-treaty-impact

      - build-cost-of-change

      - build-dfda-impact

      - build-dfda-spec

      - build-drug-development-cost

      - build-earth-optimization-prize

      - build-gdp-trajectories

      - build-iab

      - build-invisible-graveyard

      - build-manual

      - build-manual-paperback

      - build-obg

      - build-opg

      - build-optimocracy

      - build-political-dysfunction-tax

      - build-right-to-trial

      - build-us-efficiency-audit

      - build-wishocracy

    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create GitHub release with PDFs and EPUBs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-builds
          name: Latest Builds
          body: |
            Auto-generated PDFs and EPUBs from the latest master build.

            **Built:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}

            ## Available Formats
            - **PDFs**: Individual papers and full manual
            - **EPUBs**: E-reader formats (Kindle, Apple Books, etc.)
          files: |
            release-files/**/*.pdf
            release-files/**/*.epub
          prerelease: false
          make_latest: true