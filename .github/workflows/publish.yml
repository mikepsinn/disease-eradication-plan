      - name: Upload Economics PDF to Zenodo (draft)
        if: github.event_name == 'push'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python scripts/publish-zenodo.py --draft --paper economics

