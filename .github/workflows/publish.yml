on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: Build and Deploy Manual Site

permissions:
  contents: read

concurrency:
  group: "manual-deploy"
  cancel-in-progress: true

jobs:

  build-manual:
    name: "Build How to End War and Disease"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-manual-${{ hashFiles('**/*.qmd', '**/*.ipynb') }}
          restore-keys: |
            quarto-freeze-manual-
            quarto-freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache validation results
        uses: actions/cache@v4
        with:
          path: .cache
          key: validation-cache-${{ runner.os }}-${{ hashFiles('.cache/pdf-validation-cache.json') }}
          restore-keys: |
            validation-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --system -e .

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Jupyter kernel
        run: |
          python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: "Render Build How to End War and Disease (HTML)"
        run: python scripts/render-quarto.py manual --to html
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ (secrets.LLM_VALIDATION == 'true' || github.ref == 'refs/heads/develop') && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
        timeout-minutes: 75

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-manual
          path: |
            logs/build-manual.log
            _build_temp/manual/*.log
            _build_temp/manual/**/*.log
          retention-days: 7

      - name: "Deploy Build How to End War and Disease to Netlify"
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
        run: |
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Missing GitHub Actions secret NETLIFY_MAIN_SITE_ID"
            exit 1
          fi
          npm install -g netlify-cli
          netlify deploy \
            --dir='_build_temp/manual/_manual/warondisease' \
            --prod \
            --no-build \
            --message="Deploy manual from ${{ github.ref_name }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_MAIN_SITE_ID }}
        timeout-minutes: 5
