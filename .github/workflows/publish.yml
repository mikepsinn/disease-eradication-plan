on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: Build and Deploy Manual Site

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python and workflow code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository for validation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python type check
        run: pnpm exec pyright dih_models scripts

      - name: Test workflow generation
        run: .venv/bin/python -m pytest scripts/tests/test_workflow_generator.py


