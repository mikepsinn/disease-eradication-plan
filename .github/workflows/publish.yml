on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: Build and Deploy Manual Site

permissions:
  contents: read

concurrency:
  group: "manual-deploy"
  cancel-in-progress: true

jobs:

  build-manual:
    name: "Build How to End War and Disease"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-manual-${{ hashFiles('**/*.qmd', '**/*.ipynb') }}
          restore-keys: |
            quarto-freeze-manual-
            quarto-freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache validation results
        uses: actions/cache@v4
        with:
          path: .cache
          key: validation-cache-${{ runner.os }}-${{ hashFiles('.cache/pdf-validation-cache.json') }}
          restore-keys: |
            validation-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Run Python type check
        run: npx --yes pyright dih_models scripts

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Jupyter kernel
        run: |
          .venv/bin/python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: "Render Build How to End War and Disease (HTML)"
        run: .venv/bin/python scripts/render-quarto.py manual --to html
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ (secrets.LLM_VALIDATION == 'true' || github.ref == 'refs/heads/develop') && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
        timeout-minutes: 75

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-manual
          path: |
            logs/build-manual.log
            _build_temp/manual/*.log
            _build_temp/manual/**/*.log
          retention-days: 7

      - name: "Deploy Build How to End War and Disease to Netlify"
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error title=Missing Netlify token::GitHub Actions secret NETLIFY_AUTH_TOKEN is empty or missing."
            echo "Fix: Create a Netlify personal access token from the Netlify account or team that owns Build How to End War and Disease, then update GitHub repo secret NETLIFY_AUTH_TOKEN."
            exit 1
          fi

          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error title=Missing Netlify site ID::GitHub Actions secret NETLIFY_MAIN_SITE_ID is empty or missing."
            echo "Fix: Set GitHub repo secret NETLIFY_MAIN_SITE_ID to the Netlify site ID for Build How to End War and Disease."
            exit 1
          fi

          netlify_response="$RUNNER_TEMP/netlify-site-response.json"
          netlify_status="$(curl --silent --show-error --output "$netlify_response" --write-out "%{http_code}" --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" || true)"

          case "$netlify_status" in
            200)
              echo "Netlify preflight passed: token can retrieve the configured project."
              ;;
            401|403)
              echo "::error title=Netlify token cannot retrieve project::NETLIFY_AUTH_TOKEN is invalid, revoked, stale, or does not have access to the site ID stored in NETLIFY_MAIN_SITE_ID."
              echo "Fix: Create a new Netlify personal access token from the Netlify account or team that owns Build How to End War and Disease."
              echo "Then update GitHub repo secret NETLIFY_AUTH_TOKEN. Keep NETLIFY_MAIN_SITE_ID unless the Netlify site was recreated."
              exit 1
              ;;
            404)
              echo "::error title=Netlify site not found::The site ID stored in NETLIFY_MAIN_SITE_ID does not exist or is not visible to NETLIFY_AUTH_TOKEN."
              echo "Fix: Verify the Netlify site ID for Build How to End War and Disease and update GitHub repo secret NETLIFY_MAIN_SITE_ID. If the site exists, update NETLIFY_AUTH_TOKEN with a token from the owning account or team."
              exit 1
              ;;
            000)
              echo "::error title=Netlify API unreachable::Could not reach Netlify while checking deploy credentials."
              echo "Fix: Retry the workflow. If this repeats, check Netlify status and GitHub runner network logs."
              exit 1
              ;;
            *)
              echo "::error title=Unexpected Netlify API response::Netlify returned HTTP $netlify_status while checking deploy credentials."
              echo "Response body:"
              cat "$netlify_response"
              echo
              echo "Fix: Check NETLIFY_AUTH_TOKEN and NETLIFY_MAIN_SITE_ID in GitHub repo secrets, then inspect the Netlify API response above."
              exit 1
              ;;
          esac

          npm install -g netlify-cli
          netlify deploy \
            --dir='_build_temp/manual/_manual/warondisease' \
            --prod \
            --no-build \
            --message="Deploy manual from ${{ github.ref_name }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_MAIN_SITE_ID }}
        timeout-minutes: 5
