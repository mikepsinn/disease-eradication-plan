on:
  workflow_dispatch:
  push:
    branches: [main, master]

name: Lint, Build, and Deploy Quarto site to Netlify

permissions:
  contents: read

concurrency:
  group: "netlify-deploy"
  cancel-in-progress: true

jobs:
  # Build strategy:
  # 1. All HTML sites build in parallel (main, economics, wishocracy, iab)
  # 2. PDF and EPUB build in parallel after HTML completes (both reuse HTML's freeze cache)
  # 3. No artifacts uploaded - PDF/EPUB are deployed with website to Netlify
  # This approach:
  # - Deploys HTML ~50 min faster than waiting for all formats
  # - Reuses computations via freeze cache (saves ~10 min per format)
  # - Costs $0 in artifact storage
  build-main-html:
    name: Build Main Book (HTML)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-main-${{ hashFiles('**/*.qmd', '**/*.ipynb') }}
          restore-keys: |
            quarto-freeze-main-
            quarto-freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --system -e .

      - name: Install Jupyter kernel
        run: |
          python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: Render Main Book (HTML)
        run: python scripts/render-book-website.py
        timeout-minutes: 25

     # - name: Upload Main Site artifact
        #uses: actions/upload-artifact@v4
        #with:
          #name: main-site
          #path: _book/warondisease
          #retention-days: 1

      - name: Deploy Main Site to Netlify (immediate)
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '_book/warondisease'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy main site from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_MAIN_SITE_ID }}
        timeout-minutes: 1

  build-economics:
