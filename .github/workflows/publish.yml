     # - name: Upload Wishocracy artifact
        #uses: actions/upload-artifact@v4
        #with:
          #name: wishocracy-site
          #path: _site/wishocracy
          #retention-days: 1

      - name: Deploy Wishocracy Paper to Netlify (immediate)
        uses: nwtgck/actions-netlify@v3.0
        with:
