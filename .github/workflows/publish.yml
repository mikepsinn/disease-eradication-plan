      - name: Render Economics Website
        run: python scripts/render-economics-website.py --output-dir _site/economics
        timeout-minutes: 25

     # - name: Upload Economics artifact
        #uses: actions/upload-artifact@v4
        #with:
          #name: economics-site
          #path: _site/economics
          #retention-days: 1

      - name: Deploy Economics Site to Netlify (immediate)
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '_site/economics'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy economics site from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_ECONOMICS_SITE_ID }}
        timeout-minutes: 1

