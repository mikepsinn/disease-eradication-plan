on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: Build and Deploy Manual Site

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python and workflow code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository for validation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python type check
        run: pnpm exec pyright dih_models scripts

      - name: Test workflow generation
        run: .venv/bin/python -m pytest scripts/tests/test_workflow_generator.py


  build-institute-papers:
    name: "Build Institute for Accelerated Medicine"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: "Validate Build Institute for Accelerated Medicine Cloudflare Pages credentials"
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare token::GitHub Actions secret CLOUDFLARE_API_TOKEN is empty or missing."
            echo "Fix: Create an account-owned token with Pages Write permission, then update GitHub repo secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing Cloudflare account ID::GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is empty or missing."
            exit 1
          fi

          project_response="$RUNNER_TEMP/cloudflare-pages-project-response.json"
          project_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME"
          project_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output "$project_response" --write-out "%{http_code}" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$project_url" || true)"

          case "$project_status" in
            200)
              echo "Cloudflare preflight passed: token can retrieve $CLOUDFLARE_PROJECT_NAME."
              ;;
            401|403)
              echo "::error title=Cloudflare token cannot manage Pages::CLOUDFLARE_API_TOKEN is invalid, revoked, or lacks Pages Write permission for CLOUDFLARE_ACCOUNT_ID."
              exit 1
              ;;
            404)
              create_response="$RUNNER_TEMP/cloudflare-pages-project-create-response.json"
              create_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output "$create_response" --write-out "%{http_code}" --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" --data "{\"name\":\"$CLOUDFLARE_PROJECT_NAME\",\"production_branch\":\"develop\"}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" || true)"
              case "$create_status" in
                200|201)
                  echo "Created Cloudflare Pages project $CLOUDFLARE_PROJECT_NAME."
                  ;;
                *)
                  echo "::error title=Cloudflare Pages project creation failed::Cloudflare returned HTTP $create_status while creating $CLOUDFLARE_PROJECT_NAME."
                  cat "$create_response"
                  exit 1
                  ;;
              esac
              ;;
            000)
              echo "::error title=Cloudflare API unreachable::Could not reach Cloudflare while checking deploy credentials."
              exit 1
              ;;
            *)
              echo "::error title=Unexpected Cloudflare API response::Cloudflare returned HTTP $project_status while checking deploy credentials."
              echo "Response body:"
              cat "$project_response"
              exit 1
              ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: "institute-papers"
        timeout-minutes: 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-institute-papers-${{ hashFiles('**/*.qmd', '**/*.ipynb') }}
          restore-keys: |
            quarto-freeze-institute-papers-
            quarto-freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache validation results
        uses: actions/cache@v4
        with:
          path: .cache
          key: validation-cache-${{ runner.os }}-${{ hashFiles('.cache/pdf-validation-cache.json') }}
          restore-keys: |
            validation-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Jupyter kernel
        run: |
          .venv/bin/python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            tinytex-${{ runner.os }}-

      - name: Install LaTeX
        run: |
          if [ ! -d ~/.TinyTeX ]; then
            quarto install tinytex
          fi
          tlmgr_path="$(find ~/.TinyTeX/bin -name tlmgr -print -quit)"
          test -n "$tlmgr_path"
          "$tlmgr_path" update --self || true
          "$tlmgr_path" install fontspec unicode-math lualatex-math luaotfload || true

      - name: "Render Build Institute for Accelerated Medicine (PDF + HTML)"
        # A papers site bundles each member paper's PDF, built from that paper's own config.
        run: |
          .venv/bin/python scripts/render-quarto.py dfda-spec --to pdf
          .venv/bin/python scripts/render-quarto.py dfda-impact --to pdf
          .venv/bin/python scripts/render-quarto.py invisible-graveyard --to pdf
          .venv/bin/python scripts/render-quarto.py drug-development-cost --to pdf
          .venv/bin/python scripts/render-quarto.py right-to-trial --to pdf
          .venv/bin/python scripts/render-quarto.py right-to-trial-impact --to pdf
          .venv/bin/python scripts/render-quarto.py institute-papers --to html
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.LLM_VALIDATION == 'true' && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
        timeout-minutes: 120

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-institute-papers
          path: |
            logs/build-institute-papers.log
            _build_temp/institute-papers/*.log
            _build_temp/institute-papers/**/*.log
          retention-days: 7

      - name: "Validate Build Institute for Accelerated Medicine Cloudflare Pages limits"
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
        run: |
          file_count="$(find '_build_temp/institute-papers/_site/institute-papers' -type f | wc -l)"
          if [ "$file_count" -gt 20000 ]; then
            echo "::error title=Too many Cloudflare Pages files::$file_count files exceeds the 20,000-file limit."
            exit 1
          fi

          oversized_file="$(find '_build_temp/institute-papers/_site/institute-papers' -type f -size +26214400c -print -quit)"
          if [ -n "$oversized_file" ]; then
            echo "::error title=Cloudflare Pages file too large::$oversized_file exceeds the 25 MiB per-file limit."
            exit 1
          fi

          echo "Cloudflare Pages limits passed: $file_count files, none larger than 25 MiB."

      - name: "Deploy Build Institute for Accelerated Medicine to Cloudflare Pages"
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
        run: |
          npx --yes wrangler@4.126.0 pages deploy '_build_temp/institute-papers/_site/institute-papers' \
            --project-name='institute-papers' \
            --branch='develop' \
            --commit-hash='${{ github.sha }}' \
            --commit-message='Deploy institute-papers from GitHub Actions'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        timeout-minutes: 20

