on:
  workflow_dispatch:
  # push:
  #   branches: [test-economics]  # Uncomment to auto-run on push to test branch

name: Test Economics PDF Build

permissions:
  contents: read

jobs:
  test-economics:
    name: Test Economics Site (HTML + PDF)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-economics-test-${{ hashFiles('**/*.qmd', '**/*.ipynb') }}
          restore-keys: |
            quarto-freeze-economics-
            quarto-freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --system -e .

      - name: Install Jupyter kernel
        run: |
          python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: Install LaTeX for PDF
        run: quarto install tinytex

      - name: Render Economics Website
        run: |
          echo "Starting render at $(date)"
          python scripts/render-economics-website.py --output-dir _site/economics 2>&1 | tee economics-render.log
          echo "Render finished at $(date)"
        timeout-minutes: 25

      - name: Copy log to project root
        if: always()
        run: |
          cp economics-render.log ./economics-render-test.log || true
          echo "Log file saved to: economics-render-test.log"
          ls -lh economics-render-test.log || echo "Log file not found"

      - name: Check if PDF was generated
        run: |
          echo "==================================================================="
          echo "CHECKING PDF GENERATION"
          echo "==================================================================="
          if [ -f "_site/economics/dih-economic-models.pdf" ]; then
            echo "✅ PDF found in correct location: _site/economics/dih-economic-models.pdf"
            ls -lh "_site/economics/dih-economic-models.pdf"
            file "_site/economics/dih-economic-models.pdf"
          else
            echo "❌ PDF not found in _site/economics/dih-economic-models.pdf"
            echo ""
            echo "Searching for PDF files in project..."
            find . -name "*.pdf" -type f 2>/dev/null || echo "No PDF files found"
            exit 1
          fi

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economics-render-log
          path: |
            economics-render.log
            economics-render-test.log
          retention-days: 7

      - name: Upload Economics artifact
        uses: actions/upload-artifact@v4
        with:
          name: economics-site-test
          path: _site/economics
          retention-days: 7

      - name: Deploy Economics Site to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '_site/economics'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Test deploy economics site from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_ECONOMICS_SITE_ID }}
        timeout-minutes: 1
        if: github.event_name != 'pull_request'  # Only deploy on direct runs, not PRs
