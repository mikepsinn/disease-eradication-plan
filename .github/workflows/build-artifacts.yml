      - build-right-to-trial

      - build-right-to-trial-impact

      - build-us-efficiency-audit

      - build-wishocracy

      - build-wishonias-wager

    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create GitHub release with build artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-builds
          name: Latest Builds
          body: |
            Auto-generated downloadable artifacts from the latest master build.

            **Built:** ${{ github.event.head_commit.timestamp || github.run_id }}
            **Commit:** ${{ github.sha }}

            ## Available Formats
            - **PDFs**: Individual papers and books
            - **EPUBs**: E-reader formats
            - **DOCX**: Editable document exports
          files: |
            release-files/**/*.pdf
            release-files/**/*.epub
            release-files/**/*.docx
          prerelease: false
          make_latest: true