  build-wishonias-wager:
    name: "Build Wishonia's Wager: Any Finite Action Is Rational Wh"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-wishonias-wager-${{ hashFiles('**/*.qmd', '**/*.ipynb') }}
          restore-keys: |
            quarto-freeze-wishonias-wager-
            quarto-freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache validation results
        uses: actions/cache@v4
        with:
          path: .cache
          key: validation-cache-${{ runner.os }}-${{ hashFiles('.cache/pdf-validation-cache.json') }}
          restore-keys: |
            validation-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --system -e .

      - name: Install Jupyter kernel
        run: |
          python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('.github/workflows/build-artifacts.yml') }}
          restore-keys: |
            tinytex-${{ runner.os }}-

      - name: Install LaTeX
        run: |
          if [ ! -d ~/.TinyTeX ]; then
            quarto install tinytex
          fi
          tlmgr_path="$(find ~/.TinyTeX/bin -name tlmgr -print -quit)"
          test -n "$tlmgr_path"
          "$tlmgr_path" update --self || true
          "$tlmgr_path" install fontspec unicode-math lualatex-math luaotfload || true

      - name: "Render Build Wishonia's Wager: Any Finite Action Is Rational Wh"
        run: python scripts/render-quarto.py wishonias-wager --to pdf
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.LLM_VALIDATION == 'true' && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
        timeout-minutes: 30


      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-wishonias-wager
          path: _build_temp/wishonias-wager/**/*.pdf
          if-no-files-found: error






      - name: Upload validation checklists
        uses: actions/upload-artifact@v4
        with:
          name: validation-checklists-wishonias-wager
          path: pdf-validation-checklist-*.md
          if-no-files-found: ignore

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs-wishonias-wager
          path: |
            logs/build-wishonias-wager.log
            _build_temp/wishonias-wager/*.log
            _build_temp/wishonias-wager/**/*.log
            _build_temp/wishonias-wager/*.aux
            _build_temp/wishonias-wager/**/*.aux
            _build_temp/wishonias-wager/*.toc
            _build_temp/wishonias-wager/**/*.toc
            _build_temp/wishonias-wager/*.out
            _build_temp/wishonias-wager/**/*.out
          retention-days: 7


      - name: "Upload Build Wishonia's Wager: Any Finite Action Is Rational Wh PDF to Zenodo (draft)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python scripts/upload-all-zenodo-and-save-dois.py --no-rebuild wishonias-wager




