# AUTO-GENERATED FILE. DO NOT EDIT DIRECTLY.
# Source: scripts/templates/build-artifacts.yml.j2
# Generator: scripts/lib/workflow_generator.py
# Make changes in the source template or generator, then regenerate.

on:
  schedule:
    # Nightly from develop; the changes job ends the run when nothing changed
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      publish_zenodo:
        description: "Also upload the paper PDFs to Zenodo"
        type: boolean
        default: false
  push:
    # A version tag builds an edition and uploads the papers to Zenodo
    tags: ["v*"]
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/build-artifacts.yml

name: Build Downloadable Artifacts

permissions:
  contents: read
  actions: read

concurrency:
  group: "artifact-builds-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    name: "Check for changes since the last build"
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare with the last successful build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the nightly run skips; a manual run, a tag, or a workflow change always builds
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_sha="$(gh run list --workflow build-artifacts.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
          if [ -z "$last_sha" ]; then
            echo "No earlier successful build."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$last_sha"; then
            echo "Cannot fetch $last_sha."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff must stop the step, not read as "nothing changed"
          changed="$(git diff --name-only "$last_sha" HEAD)"
          build=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/build-artifacts.yml) build=true ;;
              # Agent, CI, hook, and guide files cannot change a build
              .claude/*|.github/*|.husky/*|GUIDES/*) ;;
              */*) build=true ;;
              # Top-level notes such as AGENTS.md and todo.md
              *.md) ;;
              "") ;;
              *) build=true ;;
            esac
          done <<< "$changed"
          echo "Last successful build: $last_sha. Build needed: $build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build-1-pct-treaty-impact:
    name: "Build The 1% Treaty: An Incentive-Compatible Approach to"
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: quarto-freeze-1-pct-treaty-impact-${{ hashFiles('**/*.qmd', '**/*.ipynb') }}
          restore-keys: |
            quarto-freeze-1-pct-treaty-impact-
            quarto-freeze-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache validation results
        uses: actions/cache@v4
        with:
          path: .cache
          key: validation-cache-${{ runner.os }}-${{ hashFiles('.cache/pdf-validation-cache.json') }}
          restore-keys: |
            validation-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install dih_models package
        run: uv pip install --system -e .

      - name: Install Jupyter kernel
        run: |
          python -m ipykernel install --user --name dih-project-kernel --display-name "DIH Project"

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('.github/workflows/build-artifacts.yml') }}
          restore-keys: |
            tinytex-${{ runner.os }}-

      - name: Install LaTeX
        run: |
          if [ ! -d ~/.TinyTeX ]; then
            quarto install tinytex
          fi
          tlmgr_path="$(find ~/.TinyTeX/bin -name tlmgr -print -quit)"
          test -n "$tlmgr_path"
          "$tlmgr_path" update --self || true
          "$tlmgr_path" install fontspec unicode-math lualatex-math luaotfload || true

      - name: "Render Build The 1% Treaty: An Incentive-Compatible Approach to"
        run: python scripts/render-quarto.py 1-pct-treaty-impact --to pdf
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.LLM_VALIDATION == 'true' && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
        timeout-minutes: 30



      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-1-pct-treaty-impact
          path: _build_temp/1-pct-treaty-impact/**/*.pdf
          if-no-files-found: error







      - name: Upload validation checklists
        uses: actions/upload-artifact@v4
        with:
          name: validation-checklists-1-pct-treaty-impact
          path: pdf-validation-checklist-*.md
          if-no-files-found: ignore

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs-1-pct-treaty-impact
          path: |
            logs/build-1-pct-treaty-impact.log
            _build_temp/1-pct-treaty-impact/*.log
            _build_temp/1-pct-treaty-impact/**/*.log
            _build_temp/1-pct-treaty-impact/*.aux
            _build_temp/1-pct-treaty-impact/**/*.aux
            _build_temp/1-pct-treaty-impact/*.toc
            _build_temp/1-pct-treaty-impact/**/*.toc
            _build_temp/1-pct-treaty-impact/*.out
            _build_temp/1-pct-treaty-impact/**/*.out
          retention-days: 7


      - name: "Upload Build The 1% Treaty: An Incentive-Compatible Approach to PDF to Zenodo"
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_zenodo)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
