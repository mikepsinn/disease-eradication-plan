project:
  type: website
  output-dir: _site/earth-optimization-prize-protocol
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "🔧"
  index-source: knowledge/appendix/earth-optimization-prize-protocol.qmd
  redirect-from: https://prize-protocol.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  pdf-output-file: earth-optimization-protocol.pdf
  netlify-site-id: ""
  netlify-cname: ""
  show-confidence-intervals: true
  concept-terms:
    - term: "Earth Optimization Prize Protocol"
      manual-target: knowledge/appendix/earth-optimization-prize-protocol.qmd
      aliases:
        - "Prize Protocol"
        - "EOP Protocol"
        - "EOPP Technical Spec"
  favicon-prompt: "Interlocking gears with a globe in the center, minimalist technical blueprint style."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "Earth Optimization Prize Protocol: Technical Specification"
  description: "Technical specification for interoperable outcome prize pools structured as a dominant assurance contract. Covers cross-pool proof-of-personhood, a permissionless pool registry, VOTE and PRIZE token mechanics, direct cross-pool claims, tamper-evident scoreboard aggregation, and a terminal metric oracle including decentralized surveys."
  site-url: https://manual.warondisease.org/knowledge/appendix/earth-optimization-prize-protocol.html
  favicon: assets/icons/earth-optimization-prize-protocol-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/earth-optimization-protocol.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Prize Paper"
        href: https://prize.warondisease.org
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

