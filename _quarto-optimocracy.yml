project:
  type: website
  output-dir: _site/optimocracy
  execute-dir: project
  resources:
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd

# Custom fields for render-quarto.py
dih-render:
  index-source: knowledge/appendix/optimocracy-paper.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "c6e535bc-4503-4db8-833a-c1b93f5e0f10"
  netlify-cname: "optimocracy-warondisease.netlify.app"  # DNS: optimocracy.warondisease.org -> this
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "Letter 'O' with an upward optimization arrow or checkmark inside."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: feedback@dih.earth
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Decentralized Institutes of Health (DIH)"
        url: https://dih.earth

website:
  title: "Optimocracy: Algorithmic Governance Through Metric-Bound Resource Allocation"
  description: "Political dysfunction (cronyism, short-termism, and misalignment between political incentives and citizen outcomes) costs society an estimated 20% of potential GDP (the \"Political Dysfunction Tax\"). Optimocracy proposes metric-bound allocation systems that optimize for pre-agreed welfare outcomes (median income growth, QALYs, composite indices), using immutable algorithmic rules and independent verification systems to align spending with citizen welfare."
  site-url: https://optimocracy.warondisease.org
  favicon: assets/icons/optimocracy-favicon.png
  page-navigation: true
  navbar:
    left:
      - text: "Paper"
        href: /
      - text: "Calculations"
        href: /knowledge/appendix/parameters-and-calculations.html
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /optimocracy-paper.pdf
      - text: "References"
        href: /#references
      - text: "DIH"
        href: https://dih.earth
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

