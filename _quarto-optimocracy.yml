project:
  type: website
  output-dir: _site/optimocracy
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "⚙️"
  index-source: knowledge/appendix/optimocracy-paper.qmd
  redirect-from: https://optimocracy.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "c6e535bc-4503-4db8-833a-c1b93f5e0f10"
  netlify-cname: "manual-warondisease-org.netlify.app"
  show-confidence-intervals: true  # Show 95% CI ranges for calculated values in academic papers
  concept-terms:
    - term: "Optimocracy"
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "Letter 'O' with an upward optimization arrow or checkmark inside."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "International Campaign to End War and Disease"
        url: https://warondisease.org

website:
  title: "Optimocracy: A Practical Evidence Scoreboard for Health and Wealth"
  description: 'Optimocracy grades policy evidence, forecasts effects on typical income and healthy life years, publishes bounded recommendations, and checks those forecasts against later outcomes. Cross-jurisdictional policy variation supports causal claims only when a suitable design passes its diagnostics.'
  site-url: https://manual.warondisease.org/knowledge/appendix/optimocracy-paper.html
  favicon: assets/icons/optimocracy-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [International Campaign to End War and Disease](https://warondisease.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/optimocracy-paper.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

