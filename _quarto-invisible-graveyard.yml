project:
  type: website
  output-dir: _site/invisible-graveyard
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/papers.qmd
    - knowledge/appendix/parameters-and-calculations-invisible-graveyard.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "⚰️"
  index-source: knowledge/appendix/invisible-graveyard.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  pdf-output-file: invisible-graveyard.pdf
  netlify-site-id: "ef37ca63-13e5-4403-bf47-173763af79ab"
  netlify-cname: "invisible-graveyard-warondisease-org.netlify.app"
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A gravestone with a pill on it."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The Invisible Graveyard: Quantifying the Mortality Cost of FDA Efficacy Lag, 1962-2024"
  description: "After proving a drug is safe, the FDA requires 8.2 years to prove it works before patients can access it. We estimate this delay cost 102M deaths among people waiting for approved drugs (1962-2024). The cost of blocking good drugs is 3.07k:1 higher than the cost of approving bad ones."
  site-url: https://invisible-graveyard.warondisease.org
  favicon: assets/icons/invisible-graveyard-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/invisible-graveyard.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "dFDA Framework"
        href: https://dfda-spec.warondisease.org
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations-invisible-graveyard.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

