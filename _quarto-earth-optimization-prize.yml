project:
  type: website
  output-dir: _site/least-bad-idea-prize
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "🏆"
  index-source: knowledge/strategy/earth-optimization-prize.qmd
  redirect-from: https://prize.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  netlify-site-id: "4b864c23-3f9e-4a83-a6dc-9a2f7690eb80"
  netlify-cname: "least-bad-idea-prize-warondisease-org.netlify.app"
  show-confidence-intervals: true
  concept-terms:
    - term: "Earth Optimization Prize"
      aliases:
        - "Least Bad Idea Prize"
        - "Least Bad Idea in the World Prize"
        - "LBIP"
        - "implementation prize"
      manual-target: knowledge/strategy/earth-optimization-prize.qmd
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A trophy with a checkmark and mathematical symbols, minimalist design."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The Earth Optimization Prize"
  description: "An outcome-based charity with two terminal metrics (median healthy life years and median after-tax income), a treasury that releases when people stop dying, and wishocratic pairwise comparison to allocate credit. The Earth Optimization Plan v1 is the terrible starting benchmark. v2 is whatever beats it."
  site-url: https://manual.warondisease.org/knowledge/strategy/earth-optimization-prize.html
  favicon: assets/icons/least-bad-idea-prize-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/least-bad-idea-prize.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

