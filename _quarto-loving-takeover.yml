project:
  type: website
  output-dir: _site/loving-takeover
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "💌"
  index-source: knowledge/appendix/loving-takeover.qmd
  redirect-from: https://takeover.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  netlify-site-id: ""  # TODO: create Netlify site and add ID
  netlify-cname: "manual-warondisease-org.netlify.app"
  show-confidence-intervals: true
  concept-terms:
    - term: "Loving Takeover"
      manual-target: knowledge/appendix/loving-takeover.qmd
    - term: "1% Treaty"
      manual-target: knowledge/solution/1-percent-treaty.qmd
  favicon-prompt: "A stock certificate folded into a paper heart, stark black and white retro-academic style"

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "International Campaign to End War and Disease"
        url: https://warondisease.org

website:
  title: "The Loving Takeover"
  description: "The companies that build the weapons are publicly traded. For roughly $110 per human, you buy all of them, replace the boards, and hand the lobbyists an optimal budget calculated to maximize median healthy lifespan and median income. The takeover is loving because existing shareholders, employees, and directors live longer and get richer. Nobody loses."
  site-url: https://manual.warondisease.org/knowledge/appendix/loving-takeover.html
  favicon: assets/icons/loving-takeover-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2026 [International Campaign to End War and Disease](https://warondisease.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/loving-takeover.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

