# Remove "Appendix" prefix
language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

# Bibliography
bibliography: references.bib
csl: nature-annotated.csl

jupyter: dih-project-kernel

format:
  html:
    lightbox: auto
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: false
    toc: true
    toc-depth: 3
    css:
      - styles.css
      - economics-overrides.css
    include-before-body:
      - file: assets/html/page-loader.html
    include-after-body:
      - file: assets/html/site-enhancements-loader.html
    include-in-footer:
      - file: assets/html/generated-footer.html
    include-in-header:
      - text: |
          <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/loving-takeover-favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/loving-takeover-favicon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/loving-takeover-apple-touch-icon.png">
          <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/loving-takeover-android-chrome-192x192.png">
          <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/loving-takeover-android-chrome-512x512.png">
      - file: assets/html/google-analytics.html
      - file: assets/html/hypothesis.html
      - file: assets/html/fonts-preload.html
    citation-hover: true
    code-fold: true
    link-citations: true
    smooth-scroll: true
    code-tools: false
    filters: [assets/filters/live-version-note.lua]
  pdf:
    output-file: "loving-takeover.pdf"
    documentclass: article
    institute: "International Campaign to End War and Disease"
    echo: false
    toc: true
    toc-depth: 3
    number-sections: false
    colorlinks: true
    link-citations: true
    include-in-header:
      - callout-bw.tex
      - institute-header.tex
      - text: |
          \paperurl{https://manual.warondisease.org/knowledge/appendix/loving-takeover.html}
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    date: ""
    filters: [assets/filters/live-version-note.lua]
