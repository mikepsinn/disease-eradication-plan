project:
  type: book
  output-dir: _site/right-to-trial-impact
  execute-dir: project
  resources:
    - knowledge/data/
    - "assets/!(scoreboard-embed.html)"
    - _redirects
    - robots.txt
    - llms.txt

dih-render:
  emoji: "📈"
  index-source: knowledge/appendix/state-right-to-trial-impact.qmd
  fallback-404-redirect-domain: ""
  pdf-output-file: state-right-to-trial-impact.pdf
  cloudflare-pages-project: "right-to-trial-impact"
  netlify-site-id: "7d9ffde4-1397-43bd-8b53-701a6be5a987"
  netlify-cname: "creative-cascaron-e94b2c.netlify.app"
  show-confidence-intervals: true
  zenodo: false
  concept-terms:
    - term: "Universal Right to Try with Evidence"
      aliases:
        - "50-State Right to Try with Evidence"
        - "Right to Trial Impact Analysis"
      manual-target: knowledge/appendix/state-right-to-trial-impact.qmd
  favicon-prompt: "A map of the United States with a medical cross and connected evidence nodes."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "International Campaign to End War and Disease"
        url: https://rtt-impact.acceleratedmedicine.org

book:
  title: "Universal Right to Try with Evidence: Potential Impact of Adoption in All 50 States"
  description: "A conditional schedule-shift model of state legislation that lets post-Phase-1 treatments finance their own evidence generation and accelerates treatments for global diseases and aging."
  site-url: https://rtt-impact.acceleratedmedicine.org
  favicon: assets/icons/dfda-favicon.png
  page-navigation: true
  chapters:
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd
  page-footer:
    left: "© 2025 Mike P. Sinn | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/state-right-to-trial-impact.pdf)"
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
  sidebar:
    collapse-level: 1
    style: floating
    search: true
    contents:
      - href: index.qmd
        text: "Impact Analysis"
      - href: knowledge/appendix/parameters-and-calculations.qmd
        text: "Parameters & Calculations"
  comments:
    giscus:
      repo: mikepsinn/disease-eradication-plan
      repo-id: R_kgDOPv1G3Q
      category: Announcements
      category-id: DIC_kwDOPv1G3c4CyE_8
      mapping: pathname
      reactions-enabled: true
      input-position: top
      loading: lazy
      theme: light

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: true
  env:
    PYTHONPATH: "."

