project:
  type: book
  output-dir: _manual/warondisease
  execute-dir: project
  resources:
    - knowledge/data/
    - knowledge/appendix/presidential-commission-print.html
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  # pre-render:
  #   - python scripts/pre-render-validation.py
  # post-render:
  #   - python scripts/post-render-validation.py

# Custom fields for render-quarto.py
dih-render:
  index-source: index-manual.qmd  # Simple copy, no path transformation needed
  # No target-url - this IS the main book site
  netlify-site-id: "4e36b0d6-9b80-49e2-bf16-eb4d2f79f062"
  netlify-cname: "manual-warondisease-org.netlify.app"
  # Strip "(95% CI: ...)" from variable display values for general-audience reading
  show-confidence-intervals: true
  # parameter-link-format defaults to html (links work in HTML, stripped by Lua filter for EPUB/PDF)
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A white SKULL with a prohibition sign (red circle with diagonal line) through it and black outlines"

website:
  site-url: https://manual.WarOnDisease.org

book:
  title: 'How to End War and Disease'
  subtitle: "The Complete Idiot's Guide to Legally Bribing Your Way to Utopia"
  author:
    - name: Mike P. Sinn
      email: m@warondisease.org
      orcid: 0009-0006-0212-1094
      affiliations:
        - name: "International Campaign to End War and Disease"
          url: https://warondisease.org
  description: "The Complete Idiot's Guide to Legally Bribing Your Way to Utopia"
  # cover-image: cover.jpg
  favicon: assets/icons/book-favicon.png
  site-url: https://manual.WarOnDisease.org
  #repo-url: https://github.com/mikepsinn/decentralized-institutes-of-health
  #issue-url: https://github.com/mikepsinn/decentralized-institutes-of-health/issues/new
  navbar:
    right:
      - icon: check2-square
        text: "VOTE"
        href: https://WarOnDisease.org
      # - icon: chat-dots
      #   text: "TALK"
      #   href: https://transmit.warondisease.org
      - icon: book
        text: "GET MANUAL"
        href: knowledge/links.qmd
      - icon: headphones
        text: "LISTEN"
        href: knowledge/podcast.qmd
  sidebar:
    collapse-level: 1
    contents:
      - section: "Key Resources"
        contents:
          - href: knowledge/papers.qmd
            text: "All Papers & Publications"
          - href: https://impact.warondisease.org
            text: "Economic Analysis"
          - href: knowledge/appendix/parameters-and-calculations.qmd
            text: "Parameters & Calculations"
          - href: https://iab.warondisease.org
            text: "Incentive Alignment Bonds"
          - href: https://wishocracy.warondisease.org
            text: "Wishocracy Paper"
          - href: https://optimocracy.warondisease.org
            text: "Optimocracy Paper"
          - href: https://opg.warondisease.org
            text: "Optimal Policy Generator"
          - href: https://obg.warondisease.org
            text: "Optimal Budget Generator"
          - href: knowledge/references.qmd
            text: "References & Citations"
  page-footer:
    left: "© 2025 [International Campaign to End War and Disease](https://warondisease.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[Get Manual](/knowledge/links.html) | [Listen](/knowledge/podcast.html) | [All Papers](/knowledge/papers.html)"
    right: "[Support](https://warondisease.org/donate) | [Vote](https://WarOnDisease.org)"
  chapters:
    - text: "Start Here"
      href: index.qmd  # ~19p
    - text: "Get the Manual"
      href: knowledge/links.qmd
    - text: "Listen"
      href: knowledge/podcast.qmd

    - part: "First Principles"
      chapters:
        - text: "Wishonia's Wager"
          href: knowledge/proof/wishonias-wager.qmd # Opening chapter / introduction: the reader's wager (act on infinite stakes), the ten-solution overview, attention-as-cost, Pascal debugged, and the "Wishonia's wager" coda (author's bet on humanity + revenue-funds-takeover flywheel + price gag). Standalone paper config: _quarto-wishonias-wager.yml
        - text: "What Matters"
          href: knowledge/proof/what-matters.qmd # Terminal values: pleasant consciousness and unpleasant consciousness; terminal general-welfare metrics: HALE and median income.

    - part: "Failure Analysis"
      chapters:
        - knowledge/problem.qmd  # ✅ Part I Intro ~8p
        - knowledge/problem/cost-of-war.qmd # ✅ Cost of War ~32p
        - knowledge/problem/cost-of-disease.qmd # ✅ Cost of Disease ~9p
        - knowledge/problem/nih-fails-2-institute-health.qmd # ✅ The NIH ~9p
        - knowledge/problem/untapped-therapeutic-frontier.qmd # ✅ The Untapped Frontier ~5p
        - knowledge/problem/fda-is-unsafe-and-ineffective.qmd # ✅ The FDA ~25p
        - knowledge/problem/unrepresentative-democracy.qmd # ✅ Democracy Is Theater & Regulatory Capture ~19p
        - knowledge/economics/central-banks.qmd # ✅ (EXCELLENT voice - "death certificate with a president's face") ~9p
        - knowledge/problem/genetic-slavery.qmd # ✅ (EXCELLENT voice) ~9p
        - knowledge/problem/i-am-retarded.qmd # The epistemic root cause: no smart/dumb binary, everyone is far below perfect rationality, so a large fraction of what you believe and voted for is wrong. Sets up willingness to consider solutions that contradict the reader's politics. TITLE/WORD PENDING MOM-REVIEW (see header comment in file).

    - part: "System Optimization"
      chapters:
        - knowledge/solution.qmd # ✅ Part II Intro ~8p
        - knowledge/solution/1-percent-treaty.qmd # ✅ A 1% treaty (includes TL;DR at top) ~12p
        - knowledge/solution/court-of-humanity.qmd # The Court of Humanity (decentralized accountability mechanism, makes the Treaty a settlement offer)
        - knowledge/solution/dih.qmd # ✅ Your DIH ~7p
        - knowledge/solution/wishocracy.qmd # ✅ Wishocracy ~4p
        - knowledge/solution/dfda.qmd # ✅ The decentralized framework for drug assessment ~20p
        # REMOVED: Merged unique content (biology fixes society) into solution.qmd
        # - knowledge/solution/war-on-disease.qmd
        - knowledge/solution/aligning-incentives.qmd # ✅ Aligning Incentives ~7p
        - knowledge/solution/incentive-alignment-bonds.qmd # VICTORY Incentive Alignment Bonds: later campaign-financing mechanism, not the main Fund product
        - knowledge/solution/earth-optimization-services.qmd # EOS: the four-component planetary optimization package (Wishonia's service brochure)
        - knowledge/solution/optimized-food-system.qmd # The optimized food system: animal-as-inefficient-middleware; a downstream OBG output (kill the ag subsidy) + buildable animal-free production; doubles as a citable benefits report for alt-protein

        - knowledge/solution/theory-of-operation.qmd # Civilization as a closed-loop control system; master schematic + parts-list mapping; the spine every module diagram links back to (repair-manual "Theory of Operation" framing)
        - knowledge/solution/special-education.qmd # Special Education: free AI-tutored "special education for everyone" product page (what it is / how it works / how you pass / what it costs); linked from the EOS brochure
        - knowledge/solution/optimocracy.qmd # ✅ The Evidence Machine ~8p
        - knowledge/appendix/open-ecosystem-and-bounty-model.qmd # ✅ (IMPROVED) ~4p

    - part: "Your Government, Debugged"
      chapters:
        - knowledge/solution/department-of-peace.qmd # Department of Defense → 0 lines of code
        - knowledge/solution/automated-revenue-service.qmd # 74,000 pages of tax code → 6 lines of Solidity
        - knowledge/solution/universal-security-administration.qmd # 80+ welfare programs → 1 for-loop
        - knowledge/solution/aligned-election-commission.qmd # PACs + dark money → 1 alignment score
        - knowledge/solution/decentralized-accountability-office.qmd # 3,400 auditors → the blockchain itself
        - knowledge/solution/decentralized-census-bureau.qmd # $14.2B census → citizenCount()
        - knowledge/solution/algorithmic-monetary-authority.qmd # Federal Reserve → 1 formula; new money enters at the bottom
        - knowledge/solution/transparent-securities-commission.qmd # SEC wealth gate → disclosure by default + competence check
        - knowledge/solution/drug-treatment-administration.qmd # DEA → DTA; one letter changes, the war ends
        - knowledge/solution/immigration-revenue-service.qmd # ICE → ticket sales; the $57T line item becomes revenue
        - knowledge/solution/decentralized-congress.qmd # 535 intermediaries → 20 questions a year with the evidence attached

    - part: "For Skeptics"
      chapters:
        - knowledge/proof.qmd # ✅ Part III Intro + Historical Precedents (merged) ~20p
        - knowledge/proof/bomb-budget-cut.qmd # The WW2 Spreadsheet Analogy: entire thesis in plain language, Register 2 (Mike's voice), most accessible entry point
        - knowledge/proof/no-bad-guys.qmd # Why the System Exists: four mechanisms of emergent misallocation (selection, concentrated benefits, discount rate trap, identity as infrastructure)
        - knowledge/proof/biotechnological-imperative.qmd # Kant's categorical imperative applied to biotech funding; three-proof structure with Wishonia's Wager (rational) and Free Market Proof (empirical)
        - knowledge/proof/body-as-repairable-machine.qmd # ✅ The Body as a Machine ~7p
        - knowledge/proof/why-hasnt-anyone-done-this.qmd # ✅ Why Hasn't Anyone Done This? ~3p
        - knowledge/proof/delusion-of-insignificance.qmd # The Grandeur Proof: you ARE the universe experiencing itself; insignificance is the delusion, not grandeur ~4p
        # MOVED to front as the opening chapter / introduction (now under the "First Principles" part). wishonias-wager.qmd is also dual-listed in Papers & Publications.
        # STANDALONE PAPER - see impact.warondisease.org
        # - knowledge/economics/1-pct-treaty-impact.qmd # ✅ Rigorous economic analysis
        # REMOVED: Sales-pitchy tone, thin content (82 lines), already covered in incentive-alignment-bonds.qmd, 1-percent-treaty.qmd, faq.qmd
        - knowledge/call-to-action/your-personal-benefits.qmd
        - knowledge/futures.qmd # ✅ Intro to Paths ~1p
        - knowledge/futures/moronia.qmd # ✅ Path A: Moronia ~10p
        - knowledge/futures/wishonia.qmd # ✅ Path B: Wishonia ~13p
        - knowledge/appendix/faq.qmd # ✅ Demolishing Objections ~15p
        - knowledge/appendix/bombs-vs-biotech-roi.qmd # Bombs vs. Biotechnology: sourced cost-benefit analysis with GDP channels, biotech margins, FAQ

    - part: "For Institutions"
      chapters:
        - knowledge/strategy/initiating-node-memo.qmd
        - knowledge/grant-proposal/earth-optimization-prize-90-day-pilot.qmd
        - knowledge/grant-proposal/voter-acquisition-grant.qmd # Coordinator-model grant proposal template (GAVI benchmarks, voter targets, ask cadence)
        - knowledge/operations/sff-application-draft.qmd # SFF application working draft (shareholder demand campaign + EOS equity); published:false working doc
        - knowledge/strategy/prize-institution-outreach-email.qmd
        - knowledge/strategy/ic2ewd-supporter-survey.qmd # IC2EWD supporter survey (A/B choice, complete case for endorsement)

    - part: "The Plan"
      chapters:
        - knowledge/strategy/questions.qmd # The 20 Questions -- viral call script for spreading the 1% Treaty
        - knowledge/strategy/declaration-of-optimization.qmd # Declaration of Optimization (grievances precede constitution)
        - knowledge/strategy/earth-optimization-protocol-v1.qmd # ✅ Complete integrated system + sequencing
        - knowledge/strategy/nonprofit-coalition-strategy.qmd # ✅ Why every nonprofit should support a 1% treaty ~4p
        - knowledge/appendix/google-ads-campaign-template.qmd # Pre-built Google Ads campaign for coalition partners (ad copy, keywords, targeting, bidding, compliance) — referenced from nonprofit-coalition-strategy.qmd
        - knowledge/legal/legal-framework.qmd # ✅ (DETAILED 4-PART LEGAL ARCHITECTURE) ~9p
        - knowledge/legal/election-law.qmd # ✅ Election Law ~6p
        # REMOVED: Merged into knowledge/solution/incentive-alignment-bonds.qmd
        # - knowledge/economics/victory-bonds.qmd
        - knowledge/strategy/legislation-package.qmd # ✅ Legislation Package ~7p
        - knowledge/strategy/global-referendum.qmd # ✅ Global Referendum (IMPROVED) ~10p
        - knowledge/solution/ai-coordination-army.qmd # ✅ (EXCELLENT voice - "goldfish organizing a space program") ~12p
        # REMOVED: Merged messaging strategy, content ladder, and meme arsenal into campaign-budget.qmd
        # - knowledge/strategy/viral-marketing.qmd
        # REMOVED: Merged into knowledge/solution/aligning-incentives.qmd defense section
        # - knowledge/strategy/co-opting-defense-contractors.qmd
        # REMOVED: Placeholder links and references to bonds that don't exist yet
        # - knowledge/call-to-action/three-actions.qmd
        - knowledge/appendix/treaty-feasibility.qmd # ✅ (detailed cost/timeline analysis; $1B campaign model, historical treaty benchmarks $25-50M)
        - knowledge/appendix/recruitment-and-propaganda-plan.qmd # ✅ (EXCELLENT voice) ~7p
        - knowledge/strategy/getting-started.qmd # Getting Started — first 90 days operator roadmap (grants, nonprofit embeds, podcasts, prize pool seed, celebrity layer)
        - knowledge/educational-film.qmd # EOS employee onboarding video: 3-minute 1950s-style orientation film (Wishonia voice, scene directions + keyframes, AI-producible at $12K-$166K)
        - knowledge/strategy/distribution-checklist.qmd # Distribution Checklist — systematic content repurposing across Medium, Substack, X, Reddit, YouTube, podcasts
        - knowledge/strategy/humanity-todo-list.qmd # The Decentralized To-Do List for Humanity — named-assignee accountability primitive with live death-counter
        - knowledge/strategy/earth-optimization-day.qmd # Earth Optimization Day — annual coordinated global action day + annual treaty ratchet (Schelling point + partner pre-commitment + 1% escalation mechanism)
        - knowledge/strategy/planetary-constitutional-convention.qmd # Constitutional convention (split from earth-optimization-prize.qmd)
        # DELETED: Consolidated into planetary-constitutional-convention.qmd
        # - knowledge/strategy/how-to-launch-your-prize.qmd
        - knowledge/appendix/conclusion.qmd # ✅ Conclusion ~1p

    - part: "Earth Optimization Commission"
      chapters:
        - knowledge/strategy/earth-optimization-commission.qmd # Commission hub: public ledger of appointed commissioners and the two-metric interview format
        - knowledge/strategy/funniest-show-in-the-universe.qmd # Video show format, recording/storage split, and publication checklist
  # appendices: Commented to get rid of the Appendix prefix in the titles
    - part: "Repair Procedures"
      chapters:
        # Operational kits the reader can execute today. Ordered cheapest-first and grouped by phase.
        # ── Direct action (any reader, today) ──
        - knowledge/appendix/handout.qmd # Single-sheet flyer tucked in the collar of vandalized shirts; recipient-facing explainer
        - knowledge/appendix/joke.qmd # The shirt; lives on the manual site; _quarto-joke.yml exists for PDF/Zenodo build only (no subdomain)
        - knowledge/appendix/president-notification-letter.qmd # 1950s HR-style notification letter for newly recognized EOS Presidents; scheduling CTA, Peace assistant, compensation upside, onboarding links; encloses the commission
        - knowledge/appendix/commission-of-the-president.qmd # The appointment document itself: formal commission in the style of a U.S. officer's commission, played dead straight, printable and frameable
        - knowledge/appendix/presidential-inauguration-ceremony.qmd # Two-minute ceremony script for commissioning a new President; two "I do" questions, one commission
        - knowledge/appendix/humanity-manager-employment-agreement.qmd # Parody employment contract + the qualifying exam + printable Certificate of Humanity Management (training completion; the appointment lives in commission-of-the-president.qmd)
        - knowledge/appendix/notice-of-termination.qmd # HR-format termination letter for all politicians with authority over military spending
        # ── Lawsuit kit ──
        - knowledge/appendix/love-letter.qmd # The warm, anyone-can-send letter to a defense contractor board ("I love you, I do not want you to suffer and die of horrible diseases"); friendly front door to the demand letter; one share upgrades it to a binding demand
        - knowledge/appendix/lawsuit.qmd # Master shareholder demand letter against defense contractor boards; Caremark 2.0 duty-of-care theory
        - knowledge/appendix/pre-filled-demand-letters.qmd # 8 per-contractor fact sheets (addresses, tickers, lobbying spend, filing forum) to plug into the master demand letter
        - knowledge/appendix/plaintiff-media-kit.qmd # Press release + journalist list + op-ed + social media kit + interview Q&A + T+60d follow-up
        - knowledge/appendix/filing-day-checklist.qmd # Single printable one-page checklist for filing day
        - knowledge/appendix/shareholder-proposal-14a-8.qmd # SEC Rule 14a-8 shareholder proposal template; escalation after the 60-day demand-letter window
        # ── Escalation ──
        - knowledge/appendix/loving-takeover.qmd # ~$90/global human to buy controlling stake in Western defense primes; redirects lobbying to championing the 1% treaty. Loving because existing shareholders, employees, and directors are intended beneficiaries of the long-term strategy

    - part: "Economics & Finance"
      chapters:
        - knowledge/economics/peace-dividend.qmd # ✅ (data presentation, appropriate) ~6p
        - knowledge/economics/eisenhower-curve.qmd # The Eisenhower Curve: Laffer curve for defense; strategic-competition case for the 1% treaty; argues current US allocation is causing strategic decline vs China by self-cannibalization of productive base. Cites Saeed 2025: +1pp mil/GDP → -1.10pp growth
