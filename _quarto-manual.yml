  pdf:
    # Using standard 'report' class instead of 'scrreprt' to avoid LaTeX \@writefile
    # corruption issues with large documents (900+ pages, 81 files, complex TOC)
    # Alternative: scrreprt with 'classoption: draft' also works but reduces PDF quality
    output-file: "How-to-End-War-and-Disease.pdf"
    documentclass: report
    institute: "Institute for Accelerated Medicine"
    echo: false
    toc: true
    toc-depth: 3
    number-sections: false
    colorlinks: true
    link-citations: true
    date: ""
    author: "WISHONIA (translated by Mike P. Sinn)"
    include-in-header:
      - callout-bw.tex
      - institute-header.tex
      - text: |
          \paperurl{https://manual.WarOnDisease.org}
      - text: |
          % Use Arabic numerals for appendix chapters instead of letters (supports >26 appendices)
          % Override the \appendix command to prevent switching to alphabetic numbering
          \usepackage{etoolbox}
          \patchcmd{\appendix}{\@Alph}{\@arabic}{}{}
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    include-before-body:
      - text: |
          \thispagestyle{empty}
          \newgeometry{margin=0pt}
          \noindent\includegraphics[width=\paperwidth,height=\paperheight]{assets/cover/book-cover-3.jpg}
          \restoregeometry
          \newpage
