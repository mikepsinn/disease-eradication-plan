project:
  type: book
  output-dir: _manual/warondisease
  execute-dir: project
  resources:
    - assets/
    - robots.txt
    - llms.txt
  # pre-render:
  #   - python scripts/pre-render-validation.py
  # post-render:
  #   - python scripts/post-render-validation.py

# Custom fields for render-quarto.py
dih-render:
  index-source: index-manual.qmd  # Simple copy, no path transformation needed
  # No target-url - this IS the main book site
  netlify-site-id: "4e36b0d6-9b80-49e2-bf16-eb4d2f79f062"
  netlify-cname: "manual-warondisease-org.netlify.app"
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A white SKULL with a prohibition sign (red circle with diagonal line) through it and black outlines"

website:
  site-url: https://manual.WarOnDisease.org

book:
  title: 'How to End War and Disease'
  author:
    - name: Mike P. Sinn
      email: m@warondisease.org
      orcid: 0009-0006-0212-1094
      affiliations:
        - name: "Institute for Accelerated Medicine"
          url: https://acceleratedmedicine.org
  # description: Removed to allow page-level descriptions to override for og:description
  # Original: "Get 500 Years of Clinical Research in 20, Make Humanity Filthy Rich, and Avoid the Apocalypse by Giving Papers"
  # cover-image: cover.jpg
  favicon: assets/icons/book-favicon.png
  site-url: https://manual.WarOnDisease.org
  #repo-url: https://github.com/mikepsinn/decentralized-institutes-of-health
  #issue-url: https://github.com/mikepsinn/decentralized-institutes-of-health/issues/new
  navbar:
    right:
      - text: "VOTE"
        href: https://WarOnDisease.org
  sidebar:
    collapse-level: 1
    contents:
      - section: "Key Resources"
        contents:
          - href: knowledge/papers.qmd
            text: "All Papers & Publications"
          - href: https://impact.warondisease.org
            text: "Economic Analysis"
          - href: knowledge/appendix/parameters-and-calculations-manual.qmd
            text: "Parameters & Calculations"
          - href: https://iab.warondisease.org
            text: "Incentive Alignment Bonds"
          - href: https://wishocracy.warondisease.org
            text: "Wishocracy Paper"
          - href: https://optimocracy.warondisease.org
            text: "Optimocracy Paper"
          - href: https://opg.warondisease.org
            text: "Optimal Policy Generator"
          - href: https://obg.warondisease.org
            text: "Optimal Budget Generator"
          - href: knowledge/references.qmd
            text: "References & Citations"
  page-footer:
    left: "© 2025 [Mike P. Sinn](https://mikesinn.com) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/How-to-End-War-and-Disease.pdf) | [EPUB](/How-to-End-War-and-Disease.epub) | [All Papers](knowledge/papers.html)"
    right: "[WarOnDisease.org](https://WarOnDisease.org) | [Vote](https://WarOnDisease.org)"
  chapters:
    - text: "Start Here"
      href: index.qmd  # ~19p

    - part: "The Problem"
      chapters:
        - knowledge/problem.qmd  # ✅ Part I Intro ~8p
        - knowledge/problem/the-daily-massacre.qmd # ✅ Daily Holocaust ~3p
        - knowledge/problem/cost-of-war.qmd # ✅ Cost of War ~32p
        - knowledge/problem/cost-of-disease.qmd # ✅ Cost of Disease ~9p
        - knowledge/problem/nih-fails-2-institute-health.qmd # ✅ The NIH ~9p
        - knowledge/problem/untapped-therapeutic-frontier.qmd # ✅ The Untapped Frontier ~5p
        - knowledge/problem/fda-is-unsafe-and-ineffective.qmd # ✅ The FDA ~25p
        - knowledge/problem/unrepresentative-democracy.qmd # ✅ Democracy Is Theater & Regulatory Capture ~19p
        - knowledge/economics/central-banks.qmd # ✅ (EXCELLENT voice - "death certificate with a president's face") ~9p
        - knowledge/problem/genetic-slavery.qmd # ✅ (EXCELLENT voice) ~9p

    - part: "The Solution"
      chapters:
        - knowledge/solution.qmd # ✅ Part II Intro ~8p
        - knowledge/solution/1-percent-treaty.qmd # ✅ A 1% treaty (includes TL;DR at top) ~12p
        - knowledge/solution/dih.qmd # ✅ The DIH ~7p
        - knowledge/solution/wishocracy.qmd # ✅ Wishocracy ~4p
        - knowledge/solution/ai-coordination-army.qmd # ✅ (EXCELLENT voice - "goldfish organizing a space program") ~12p
        - knowledge/solution/dfda.qmd # ✅ The decentralized framework for drug assessment ~20p
        - knowledge/solution/war-on-disease.qmd # ✅ The War on Disease ~5p
        - knowledge/solution/aligning-incentives.qmd # ✅ Aligning Incentives ~7p
        - knowledge/solution/incentive-alignment-bonds.qmd # ✅ Incentive Alignment Bonds ~12p

    - part: "The Evidence"
      chapters:
        - knowledge/proof.qmd # ✅ Part III Intro ~6p
        - knowledge/proof/historical-precedents.qmd # ✅ Historical Precedent ~8p
        - knowledge/proof/body-as-repairable-machine.qmd # ✅ The Body as a Machine ~7p
        # STANDALONE PAPER - see impact.warondisease.org
        # - knowledge/economics/1-pct-treaty-impact.qmd # ✅ Rigorous economic analysis
        - knowledge/call-to-action/your-personal-benefits.qmd # ✅ Your ROI ~2p
        - knowledge/futures.qmd # ✅ Intro to Paths ~1p
        - knowledge/futures/moronia.qmd # ✅ Path A: Moronia ~10p
        - knowledge/futures/wishonia.qmd # ✅ Path B: Wishonia ~13p
        - knowledge/appendix/faq.qmd # ✅ Demolishing Objections ~15p

    - part: "The Plan"
      chapters:
        - knowledge/strategy/roadmap.qmd # ✅ (DETAILED 36-MONTH EXECUTION PLAN) ~3p
        - knowledge/strategy/nonprofit-coalition-strategy.qmd # ✅ Why every nonprofit should support a 1% treaty ~4p
        - knowledge/legal/legal-framework.qmd # ✅ (DETAILED 4-PART LEGAL ARCHITECTURE) ~9p
        - knowledge/legal/election-law.qmd # ✅ Election Law ~6p
        - knowledge/economics/victory-bonds.qmd # ✅ The Investment Vehicle (formal by design) ~14p
        - knowledge/strategy/legislation-package.qmd # ✅ Legislation Package ~7p
        - knowledge/strategy/global-referendum.qmd # ✅ Global Referendum (IMPROVED) ~10p
        - knowledge/strategy/viral-marketing.qmd # ✅ PROMOTED ~5p
        - knowledge/strategy/co-opting-defense-contractors.qmd # ✅ PROMOTED ~4p
        - knowledge/call-to-action/three-actions.qmd # ✅ Getting Started ~2p
  # appendices: Commented to get rid of the Appendix prefix in the titles
    # Essential Reading
    - part: "Essential References"
      chapters:
        - knowledge/appendix/recovery-trial.qmd # ✅ (IMPROVED) ~9p
        - knowledge/appendix/real-world-evidence-historical-success.qmd # ✅ Pre-1962 system analysis (1883-1962 timeline, thalidomide, diminishing returns rebuttal) ~12p
        # historical-evidence-supporting-decentralized-efficacy-trials.qmd content merged into fda-is-unsafe-and-ineffective.qmd

    # Strategic Implementation
    - part: "Implementation Strategy"
      chapters:
        - knowledge/appendix/treaty-feasibility.qmd # ✅ (detailed cost/timeline analysis, $90M estimate)
        - knowledge/appendix/nonprofit-partnership-incentives.qmd # ✅ (IMPROVED) ~4p

    - part: "Policy & Regulatory"
      chapters:
        - knowledge/appendix/right-to-trial-fda-upgrade-act.qmd # ✅ (legislative text, appropriate) ~25p
        - knowledge/appendix/impact-securities-reform.qmd # ✅ (legal/regulatory, appropriate) ~3p
        # STANDALONE PAPERS - have their own sites, see knowledge/papers.qmd for links
        # - knowledge/appendix/incentive-alignment-bonds-paper.qmd # ✅ Working paper: formal mechanism design analysis
        # - knowledge/appendix/cost-of-change-analysis.qmd # ✅ Working paper: political economy analysis of maximum plausible incentivization costs
        # - knowledge/appendix/wishocracy-paper.qmd # ✅ Working paper: RAPPA mechanism design for democratic resource governance
        # - knowledge/appendix/optimocracy-paper.qmd # ✅ Working paper: algorithmic governance through metric-bound resource allocation
        # - knowledge/appendix/optimal-policy-generator-spec.qmd # ✅ Working paper: jurisdiction-specific policy recommendations using quasi-experimental methods
        # - knowledge/appendix/optimal-budget-generator-spec.qmd # ✅ Working paper: OBG/BIS framework for evidence-based budget allocation
        # - knowledge/appendix/dfda-spec-paper.qmd # ✅ Working paper: dFDA framework for drug assessment and precision medicine

    # Economic Analysis
    - part: "Economic Analysis"
      chapters:
        - knowledge/economics/peace-dividend.qmd # ✅ (data presentation, appropriate) ~6p
        - knowledge/economics/health-dividend.qmd # ✅ (good voice) ~3p
        - knowledge/appendix/humanity-budget-overview.qmd # ✅ (IMPROVED) ~2p
        # REMOVED: Detailed R&D spending data better suited for online resource (~8p)
        # - knowledge/appendix/global-government-medical-research-spending.qmd
        # REMOVED: Too granular; key stats already in health-dividend.qmd (~17p)
        # - knowledge/appendix/global-clinical-trial-spending-by-phase.qmd
        - knowledge/appendix/clinical-trial-participants.qmd # ✅ The 0.06% problem ~7p

    - part: "Detailed Calculations"
      chapters:
        # REMOVED: Auto-generated reference (~50p), link to online version instead
        # - knowledge/appendix/parameters-and-calculations-manual.qmd
        # STANDALONE PAPER - see graveyard.warondisease.org
        # - knowledge/appendix/invisible-graveyard.qmd # ✅ PRIMARY METHODOLOGY - Regulatory mortality quantitative analysis (184.6M deaths, 3.53B DALYs, $529T economic loss) ~50p
        - knowledge/appendix/drug-development-cost-analysis.qmd # ✅ Rigorous 217× cost increase analysis with multiple data sources, CPI adjustments, sensitivity analysis ~10p
        - knowledge/appendix/personal-lifetime-wealth-calc.qmd # ✅ Personal lifetime wealth model (recommended) ~14p
        # STANDALONE PAPER - see dfda-impact.warondisease.org
        # - knowledge/appendix/dfda-impact-paper.qmd # ✅ (comprehensive ROI analysis - merged from 5 files) ~100p
        - knowledge/appendix/economic-value-of-accelerated-treatments.qmd # ✅ (calculations, appropriate) ~2p
        - knowledge/appendix/intervention-comparison-table.qmd # ✅ (reference table, appropriate) ~5p
        # REMOVED: Technical minutiae irrelevant to persuasion (~3p)
        # - knowledge/appendix/data-storage-costs.qmd

    - part: "Financial Planning"
      chapters:
        - knowledge/economics/financial-plan.qmd # ✅ (IMPROVED - added personality to opening) ~10p
        - knowledge/economics/campaign-budget.qmd # ✅ (IMPROVED - "On How to Buy a Planet for $1B") ~7p
        - knowledge/appendix/investor-risk-analysis.qmd # ✅ (risk analysis, appropriate) ~5p
        - knowledge/appendix/fundraising-strategy.qmd # ✅ (IMPROVED - "$2.5B vending machine" analogy) ~13p

    # Organizational Resources
    - part: "Governance & Organization"
      chapters:
        # REMOVED: Just redirects to main DIH chapter - content already moved (~4p)
        # - knowledge/appendix/governance.qmd
        - knowledge/appendix/organizational-precedents.qmd # ✅ (technical analysis, appropriate) ~3p
        # REMOVED: Operational detail belongs in implementation docs, not book (~8p)
        # - knowledge/operations/careers/hiring-plan.qmd
        - knowledge/appendix/dih-integration-model.qmd # ✅ (has personality) ~4p
        - knowledge/appendix/open-ecosystem-and-bounty-model.qmd # ✅ (IMPROVED) ~4p
        - knowledge/appendix/command-and-control-systems.qmd # ✅ (EXCELLENT voice) ~8p

    - part: "Operations & Legal"
      chapters:
        - knowledge/appendix/recruitment-and-propaganda-plan.qmd # ✅ (EXCELLENT voice) ~7p

    - part: "Additional References"
      chapters:
        - knowledge/papers.qmd
        - knowledge/appendix/lives-saved-by-drug-accessibility.qmd # ✅ (reference tables, appropriate) ~6p
        # REMOVED: Tangential to core thesis; interesting but not necessary (~6p)
        # - knowledge/appendix/nuclear-weapon-cost-and-casualties.qmd
        - knowledge/appendix/pragmatic-vs-explanatory-trials.qmd # ✅ (comparison tables, appropriate) ~4p
        - knowledge/appendix/acknowledgments.qmd # ✅ (WISHONIA voice) ~3p
        # Bibliography: references.bib is the single source of truth
        # This page renders all cited references using Quarto's ::: {#refs} ::: shortcode
        - knowledge/references.qmd # CSL-rendered bibliography

# Project-level metadata (applies to all documents)
metadata:
  # Author identification
  creator: "Mike P. Sinn"
  orcid: "0009-0006-0212-1094"
  primary-author: "Mike P. Sinn"
  byline: "Mike P. Sinn"
  human-author: "Mike P. Sinn"

  # Author contact information
  author-email: "mike@warondisease.org"
  author-url: "https://mikesinn.com"
  author-website: "https://mikesinn.com"
  contact: "mike@warondisease.org"
  
  # Bibliographic metadata
  # title: Removed - each page defines its own title in frontmatter
  # description: Removed from metadata section to allow page-level descriptions to override for og:description
  # (Book-level description is already set in the 'book' section above)
  # abstract: Removed - pages can define their own abstract in frontmatter if needed
  language: "en-US"
  subject: "Public Health, Medical Research, Peace Economics, Health Economics, Policy Reform"
  category: "Non-fiction, Public Policy, Health Economics, Peace Studies"
  
  # Keywords and tags
  keywords: "war-on-disease, 1-percent-treaty, medical-research, public-health, peace-dividend, decentralized-trials, dfda, dih, victory-bonds, health-economics, cost-benefit-analysis, clinical-trials, drug-development, regulatory-reform, military-spending, peace-economics, decentralized-governance, wishocracy, blockchain-governance, impact-investing"
  

  
  # Version and edition
  version: "1.0.0"
  edition: "First Edition"
  
  # Copyright and licensing
  copyright: "© 2025 Mike P. Sinn"
  copyright-year: "2025"
  license: "CC BY-NC 4.0"
  license-url: "https://creativecommons.org/licenses/by-nc/4.0/"
  rights: "Creative Commons Attribution-NonCommercial 4.0 International License"
  
  # Publication information
  publisher: "Institute for Accelerated Medicine"
  publisher-url: "https://acceleratedmedicine.org"
  publisher-name: "Mike P. Sinn"
  publisher-email: "mike@warondisease.org"
  
  # Repository information
  repo-url: "https://github.com/mikepsinn"
  issue-url: "https://github.com/mikepsinn"
  source-url: "https://github.com/mikepsinn"
  
  # Identifiers (add when available)
  # isbn: "978-0-000000-00-0"
  # doi: "10.0000/example"
  # urn: "urn:example:book:12345"
  
  # Geographic and organizational
  geographic-coverage: "Global"
  audience: "General Public, Policy Makers, Investors, Healthcare Professionals, Researchers"
  
  # Additional metadata
  format: "Book"
  type: "Non-fiction"
  genre: "Public Policy, Health Economics, Peace Studies"
  medium: "Digital, Print"
  
  # Social media and web
  twitter-site: "https://x.com/warondisease"
  twitter-creator: "https://x.com/warondisease"
  og-site-name: "WarOnDisease.org"

  # Open Graph metadata (enables per-page custom OG images)
  open-graph: true
  image: "https://manual.WarOnDisease.org/assets/cover/book-cover-wide.png"

  # Technical metadata
  encoding: "UTF-8"
  character-set: "UTF-8"
  
  # Bibliography: Single source of truth for all citations
  # Use [@citation-key] syntax in QMD files for proper Quarto citation rendering
  bibliography:
    - references.bib
  csl: nature-annotated.csl  # Renders 'abstract' field (quotes) for any @citations

  # Publication tracking
  publishing:
    own-site:
      url: "https://manual.WarOnDisease.org"
      status: deployed
    preprints:
      - platform: zenodo
        status: pending
        url: ""
        doi: ""
      - platform: amazon-kindle
        status: pending
        url: ""
      - platform: apple-books
        status: pending
        url: ""
    publishers:
      - name: "Self-Published (Digital)"
        status: deployed
        url: "https://manual.WarOnDisease.org"
      - name: "Academic Press"
        tier: 1
        status: target
        url: ""

# Remove "Appendix" prefix from appendix chapters
# THIS DOESN'T SEEM TO WORK SO I JUST COMMENTED THE APPENDIX LINE BELOW
language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

profiles:
  default:
    dotenv:
      allowEmptyValues: true

execute:
  # Relaunch kernel for each render
  cache: false  # Disabled: incompatible with inline expressions
  freeze: auto  # Re-render only when source changes
  # Reuse kernel across files to prevent socket exhaustion (ZMQ buffer errors)
  daemon: 300
  daemon-restart: false
  # Send all generated figures to a central directory
  fig-path: "knowledge/figures/"

# Tell Quarto to use the project's virtual environment
# (QUARTO_PYTHON environment variable is set automatically by render_utils.py)
jupyter: dih-project-kernel

format:
  html:
    lightbox: auto
    theme:
      - cosmo
      #- neobrutalist.scss
    # Alternative themes: lux, flatly, sandstone, minty
    mermaid:
      theme: neutral  # Uses grayscale/minimal colors for black and white diagrams
    echo: false
    number-sections: false
    toc: true
    toc-depth: 3
    link-citations: true
    citation-hover: true
    css:
      - styles.css
      - book-overrides.css
    include-after-body:
      - file: assets/html/site-enhancements-loader.html
    include-in-header:
      - text: |
          <!-- Icons (project-specific) -->
          <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/book-favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/book-favicon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/book-apple-touch-icon.png">
          <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/book-android-chrome-192x192.png">
          <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/book-android-chrome-512x512.png">
      - file: assets/html/google-analytics.html
      - file: assets/html/hypothesis-conditional-book.html
      - file: assets/html/fonts-preload.html
    include-before-body:
      - file: assets/html/page-loader.html
  epub:
    # EPUB format optimized for e-readers (Kindle, Apple Books, etc.)
    output-file: "How-to-End-War-and-Disease.epub"
    # Author attribution for EPUB (different from HTML)
    author: "WISHONIA (translated by Mike P. Sinn)"
    # Cover image for EPUB (required for most e-book platforms)
    epub-cover-image: assets/cover/book-cover-3.jpg
    # Math rendering: Use mathml (fast) instead of webtex (slow)
    # MathML works in most modern e-readers (Apple Books, Kobo, Nook)
    # Kindle users should use the PDF version for equations
    html-math-method: mathml
    # Table of contents
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    # Chapter splitting: Use level 2 for large books (81 chapters, ~900 pages)
    # This prevents oversized chapter files that cause performance issues
    epub-chapter-level: 2
    # Display options
    echo: false
    number-sections: false
    # Keep figures in knowledge/figures/ to avoid Windows path issues
    keep-ipynb: false
    # Metadata inherited from project-level metadata above
