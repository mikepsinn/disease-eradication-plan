project:
  type: website
  output-dir: _site/opg
  execute-dir: project
  resources:
    - assets/
    - _redirects
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd

# Custom fields for render-quarto.py
dih-render:
  index-source: knowledge/appendix/optimal-policy-generator-spec.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "8b9558d9-6a2b-4581-bde7-11d79933d105"
  netlify-cname: "opg-warondisease.netlify.app"  # DNS: opg.warondisease.org -> this
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A policy document with a checkmark."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

website:
  title: "Optimal Policy Generator: Evidence-Based Policy Recommendations for Jurisdictions"
  description: 'The Optimal Policy Generator (OPG) extends Optimocracy beyond budget allocation to systematic policy recommendations for jurisdictions at any level (country, state, city), producing prioritized enact/replace/repeal/maintain recommendations based on quasi-experimental evidence from centuries of policy variation data.'
  site-url: https://opg.warondisease.org
  favicon: assets/icons/dih-favicon.png
  page-navigation: true
  navbar:
    left:
      - text: "Paper"
        href: /
      - text: "DIH"
        href: https://dih.earth
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /opg-framework-paper.pdf
      - text: "References"
        href: /#references
      - text: "Optimocracy"
        href: https://optimocracy.warondisease.org
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

metadata:
  creator: "Mike P. Sinn"
  orcid: "0009-0006-0212-1094"
  primary-author: "Mike P. Sinn"
  byline: "Mike P. Sinn"
  human-author: "Mike P. Sinn"
  author-email: "mike@warondisease.org"
  author-url: "https://mikesinn.com"
  author-website: "https://mikesinn.com"
  contact: "mike@warondisease.org"
  language: "en-US"
  subject: "Policy Evaluation, Causal Inference, Quasi-Experimental Methods, Evidence-Based Policy, Jurisdiction Analysis"
  category: "Academic Paper, Public Policy, Political Science"
  keywords:
    - policy-evaluation
    - causal-inference
    - quasi-experimental-methods
    - synthetic-control
    - difference-in-differences
    - bradford-hill-criteria
    - evidence-based-policy
    - policy-recommendations
    - jurisdiction-analysis
    - policy-impact-score
  version: "0.9"
  edition: "Working Draft"
  copyright: "© 2025 Mike P. Sinn"
  copyright-year: "2025"
  license: "CC BY-NC 4.0"
  license-url: "https://creativecommons.org/licenses/by-nc/4.0/"
  rights: "Creative Commons Attribution-NonCommercial 4.0 International License"
  publisher: "Decentralized Institutes of Health"
  publisher-url: "https://dih.earth"
  publisher-name: "Mike P. Sinn"
  publisher-email: "mike@warondisease.org"
  repo-url: "https://github.com/mikepsinn/disease-eradication-plan"
  issue-url: "https://github.com/mikepsinn/disease-eradication-plan/issues"
  source-url: "https://github.com/mikepsinn/disease-eradication-plan"
  geographic-coverage: "Global"
  audience: "Researchers, Policy Makers, Political Scientists, Econometricians"
