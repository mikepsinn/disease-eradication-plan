<!-- Site Enhancements Loader -->
<!-- Loads site-enhancements.js with correct path offset -->
<!-- Chat widget lives at transmit.warondisease.org (not loaded here) -->
<!-- promotion-bar.js is intentionally commented out below. -->
<script>
  (function() {
    var offset = document.querySelector('meta[name="quarto:offset"]')?.getAttribute('content') || '';
    if (offset && offset.charAt(offset.length - 1) !== '/') offset += '/';

    var v = '5.4.0';

    // Cache-bust styles.css
    var links = document.querySelectorAll('link[rel="stylesheet"]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href') || '';
      if (href.indexOf('styles.css') !== -1 && href.indexOf('?v=') === -1) {
        links[i].setAttribute('href', href + '?v=' + v);
      }
    }

    var scripts = [
      'assets/js/generated-subdomain-redirects.js',
      'assets/js/site-enhancements.js',
      'assets/js/mortality-counters.js',
      // 'assets/js/promotion-bar.js'
    ];
    for (var i = 0; i < scripts.length; i++) {
      var s = document.createElement('script');
      s.src = offset + scripts[i] + '?v=' + v;
      s.defer = true;
      document.body.appendChild(s);
    }
  })();
</script>
