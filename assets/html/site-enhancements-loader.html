<!-- Site Enhancements Loader -->
<!-- Loads site-enhancements.js and promotion-bar.js with correct path offset -->
<!-- Chat widget lives at transmit.warondisease.org (not loaded here) -->
<!-- To disable promotion bar on a page: <meta name="wod-promo-hide" content="true"> -->
<script>
  (function() {
    var offset = document.querySelector('meta[name="quarto:offset"]')?.getAttribute('content') || '';
    if (offset && offset.charAt(offset.length - 1) !== '/') offset += '/';

    var scripts = ['assets/js/generated-subdomain-redirects.js', 'assets/js/site-enhancements.js', 'assets/js/promotion-bar.js'];
    for (var i = 0; i < scripts.length; i++) {
      var s = document.createElement('script');
      s.src = offset + scripts[i];
      s.defer = true;
      document.body.appendChild(s);
    }
  })();
</script>
