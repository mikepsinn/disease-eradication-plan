<!-- Platform Bar: Listen / Buy / Read links under page title -->
<div id="platform-bar" class="platform-bar">
  <div class="platform-bar-inner">
    <span class="platform-group">
      <span class="platform-label">Listen</span>
      <a href="https://open.spotify.com/show/1aX8mw9MmFzyiSBq2RNnu2" target="_blank" rel="noopener" title="Spotify" class="platform-icon">
        <i class="fa-brands fa-spotify" aria-hidden="true"></i>
      </a>
      <a href="https://podcasts.apple.com/us/podcast/how-to-end-war-and-disease/id1879755497" target="_blank" rel="noopener" title="Apple Podcasts" class="platform-icon">
        <i class="fa-solid fa-podcast" aria-hidden="true"></i>
      </a>
      <a href="https://music.youtube.com/playlist?list=PLC81064vbLPFbngjHW2CRsvUtSUD2SERQ" target="_blank" rel="noopener" title="YouTube Music" class="platform-icon">
        <i class="fa-brands fa-youtube" aria-hidden="true"></i>
      </a>
      <a href="https://music.amazon.com/podcasts/e820cf41-590f-4171-be02-484e70b93d5e/how-to-end-war-and-disease" target="_blank" rel="noopener" title="Amazon Music" class="platform-icon">
        <i class="fa-brands fa-amazon" aria-hidden="true"></i>
      </a>
    </span>
    <span class="platform-divider"></span>
    <span class="platform-group">
      <span class="platform-label">Get</span>
      <a href="https://www.amazon.com/dp/B0GPLXFMMT" target="_blank" rel="noopener" title="Amazon Paperback" class="platform-icon">
        <i class="fa-solid fa-book-open" aria-hidden="true"></i>
      </a>
      <a href="https://www.amazon.com/dp/B0GPBH77XN" target="_blank" rel="noopener" title="Kindle" class="platform-icon">
        <i class="fa-solid fa-tablet-screen-button" aria-hidden="true"></i>
      </a>
      <a href="https://books2read.com/u/baegEq" target="_blank" rel="noopener" title="All Retailers" class="platform-icon">
        <i class="fa-solid fa-store" aria-hidden="true"></i>
      </a>
    </span>
  </div>
</div>

<style>
.platform-bar {
  display: flex;
  justify-content: center;
  padding: 0.4rem 0 0.6rem;
  margin: 0;
}
.platform-bar-inner {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  justify-content: center;
}
.platform-group {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
.platform-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #8b7355;
  font-weight: 600;
  margin-right: 0.15rem;
}
.platform-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  color: #8b7355;
  background: transparent;
  transition: color 0.15s ease, background 0.15s ease;
  text-decoration: none !important;
}
.platform-icon i {
  font-size: 1.1rem;
  line-height: 1;
}
.platform-icon:hover {
  color: #5a4a35;
  background: rgba(139, 115, 85, 0.1);
}
.platform-divider {
  width: 1px;
  height: 20px;
  background: #d4c5b9;
  margin: 0 0.25rem;
}
/* Hide on print */
@media print {
  .platform-bar { display: none !important; }
}
/* Dark mode support */
.dark-mode .platform-label { color: #b8a080; }
.dark-mode .platform-icon { color: #b8a080; }
.dark-mode .platform-icon:hover { color: #d4c0a0; background: rgba(180, 160, 128, 0.15); }
.dark-mode .platform-divider { background: #4a4030; }
</style>

<script>
// Position the platform bar right after the title block
(function() {
  function positionBar() {
    var bar = document.getElementById('platform-bar');
    if (!bar) return;
    // Find the title block header (Quarto standard)
    var titleBlock = document.getElementById('title-block-header');
    if (titleBlock) {
      titleBlock.parentNode.insertBefore(bar, titleBlock.nextSibling);
      bar.style.display = '';
      return;
    }
    // Fallback: insert after first h1
    var h1 = document.querySelector('main h1, .quarto-title h1');
    if (h1) {
      var parent = h1.parentNode;
      parent.insertBefore(bar, h1.nextSibling);
      bar.style.display = '';
    }
  }
  // Initially hide to prevent flash at wrong position
  var bar = document.getElementById('platform-bar');
  if (bar) bar.style.display = 'none';
  if (document.readyState === 'complete') {
    positionBar();
  } else {
    window.addEventListener('load', positionBar);
  }
})();
</script>
