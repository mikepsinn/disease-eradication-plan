<script>
// Position the platform bar right after the title block
(function() {
  function positionBar() {
    var bar = document.getElementById('platform-bar');
    if (!bar) return;
    // Find the title block header (Quarto standard)
    var titleBlock = document.getElementById('title-block-header');
    if (titleBlock) {
      titleBlock.parentNode.insertBefore(bar, titleBlock.nextSibling);
      bar.style.display = '';
      return;
    }
    // Fallback: insert after first h1
    var h1 = document.querySelector('main h1, .quarto-title h1');
    if (h1) {
      var parent = h1.parentNode;
      parent.insertBefore(bar, h1.nextSibling);
      bar.style.display = '';
    }
  }
  // Initially hide to prevent flash at wrong position
  var bar = document.getElementById('platform-bar');
  if (bar) bar.style.display = 'none';
  if (document.readyState === 'complete') {
    positionBar();
  } else {
    window.addEventListener('load', positionBar);
  }
})();
</script>
