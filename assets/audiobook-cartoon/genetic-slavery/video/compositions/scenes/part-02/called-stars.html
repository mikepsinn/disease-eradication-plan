<template id="called-stars-template">
  <!-- called-stars: a sun-faced press crushes hydrogen and scatters carbon and oxygen. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #called-stars-weave, #called-stars-shake, #called-stars-film { position: absolute; inset: 0; }
    #called-stars-svg { position: absolute; inset: 0; overflow: visible; }
    #called-stars-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="called-stars" data-width="1920" data-height="1080" data-start="0" data-duration="15.76">
    <div id="called-stars-weave">
      <div id="called-stars-shake"><svg id="called-stars-svg"><g id="called-stars-cam"></g></svg></div>
      <div id="called-stars-flash"></div>
    </div>
    <div id="called-stars-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("called-stars", 5, function (S) {
      S.cam.innerHTML = GS.calledStars("called-stars");
      S.hide("jaw");
      S.hide("cball");
      S.hide("oball");
      S.hide("crack");
      S.tl.set(S.g("hin"), { y: -240, opacity: 0 }, 0);
      S.tl.to(S.g("hin"), { y: 40, opacity: 1, duration: 0.28, ease: "power2.in" }, S.cue("hydrogen,"));
      S.tl.to(S.g("hin"), { y: 260, opacity: 0, duration: 0.22, ease: "power2.in" }, S.cue("crush"));
      S.slam("jaw", S.cue("crush"));
      S.pop("cball", S.cue("carbon"), 0.28);
      S.pop("oball", S.cue("oxygen,"), 0.28);
      S.show("crack", S.cue("explode,"));
      S.tl.to(S.g("cball"), { x: 90, y: -50, duration: 0.4, ease: "power2.out" }, S.cue("explode,"));
      S.tl.to(S.g("oball"), { x: 70, y: 40, duration: 0.4, ease: "power2.out" }, S.cue("explode,"));
    });
  </script>
</template>
