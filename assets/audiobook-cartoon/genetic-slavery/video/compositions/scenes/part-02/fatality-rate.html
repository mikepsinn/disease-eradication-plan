<template id="fatality-rate-template">
  <!-- fatality-rate: the safety board outlives the plant. 100% and 9,000,000,000 YEARS. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #fatality-rate-weave, #fatality-rate-shake, #fatality-rate-film { position: absolute; inset: 0; }
    #fatality-rate-svg { position: absolute; inset: 0; overflow: visible; }
    #fatality-rate-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="fatality-rate" data-width="1920" data-height="1080" data-start="0" data-duration="7.3">
    <div id="fatality-rate-weave">
      <div id="fatality-rate-shake"><svg id="fatality-rate-svg"><g id="fatality-rate-cam"></g></svg></div>
      <div id="fatality-rate-flash"></div>
    </div>
    <div id="fatality-rate-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("fatality-rate", 7, function (S) {
      S.cam.innerHTML = GS.fatality("fatality-rate");
      S.hide("pct");
      S.hide("years");
      S.slam("pct", S.cue("100%."));
      S.drop("years", S.cue("9"), 0.35);
    });
  </script>
</template>
