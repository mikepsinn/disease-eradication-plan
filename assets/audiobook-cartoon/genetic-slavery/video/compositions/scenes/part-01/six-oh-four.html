<template id="six-oh-four-template">
  <!-- six-oh-four: a tower of war bills, the Weapons Maker, the Scientist's one medicine bill, the plaque crossed out. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #six-oh-four-weave, #six-oh-four-shake, #six-oh-four-film { position: absolute; inset: 0; }
    #six-oh-four-svg { position: absolute; inset: 0; overflow: visible; }
    #six-oh-four-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="six-oh-four" data-width="1920" data-height="1080" data-start="0" data-duration="8.98">
    <div id="six-oh-four-weave">
      <div id="six-oh-four-shake"><svg id="six-oh-four-svg"><g id="six-oh-four-cam"></g></svg></div>
      <div id="six-oh-four-flash"></div>
    </div>
    <div id="six-oh-four-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("six-oh-four", 23, function (S) {
      S.cam.innerHTML = GS.sixOhFour("six-oh-four");
      S.grow("tower", S.cue("604"), 0.55);
      S.drop("n604", S.cue("604"), 0.4);
      S.hide("sci-show");
      S.tl.set(S.g("sci-wait"), { opacity: 0 }, S.cue("curing"));
      S.tl.set(S.g("sci-show"), { opacity: 1 }, S.cue("curing"));
      S.pop("med", S.cue("curing"), 0.35);
      S.drop("plaque", S.cue("political"), 0.32);
      S.slam("xmark", S.after("not."));
    });
  </script>
