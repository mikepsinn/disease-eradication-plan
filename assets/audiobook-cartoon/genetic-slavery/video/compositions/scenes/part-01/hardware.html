<template id="hardware-template">
  <!-- hardware: a stone computer on a hoard of rocks, a gift-ribboned red button, a charred stranger, a cloud. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #hardware-weave, #hardware-shake, #hardware-film { position: absolute; inset: 0; }
    #hardware-svg { position: absolute; inset: 0; overflow: visible; }
    #hardware-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="hardware" data-width="1920" data-height="1080" data-start="0" data-duration="10.8">
    <div id="hardware-weave">
      <div id="hardware-shake"><svg id="hardware-svg"><g id="hardware-cam"></g></svg></div>
      <div id="hardware-flash"></div>
    </div>
    <div id="hardware-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("hardware", 31, function (S) {
      S.cam.innerHTML = GS.hardware("hardware");
      S.hide("face");
      S.hide("corner");
      S.hide("button");
      S.hide("hoard");
      S.hide("trail");
      S.hide("cloud");
      S.hide("charred");
      S.pop("face", S.cue("software"), 0.3);
      S.drop("corner", S.cue("200,000-year-old"), 0.28);
      S.grow("hoard", S.cue("rocks"), 0.4);
      S.tl.set(S.g("machine"), { y: 78 }, 0);
      S.tl.to(S.g("machine"), { y: 0, duration: 0.45, ease: "power2.out" }, S.cue("rocks"));
      S.tl.set(S.g("stranger"), { x: 1200 }, 0);
      S.tl.to(S.g("stranger"), { x: 0, duration: 1.05, ease: "power2.out" }, S.cue("strangers,"));
      S.pop("button", S.cue("nuclear"), 0.26);
      var hit = S.after("weapons.");
      if (hit > S.D - 0.35) hit = Math.max(0, S.D - 0.55);
      S.tl.set(S.g("stranger"), { opacity: 0 }, hit);
      S.tl.set(S.g("charred"), { opacity: 1 }, hit);
      S.tl.fromTo(S.g("trail"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, hit);
      S.pop("cloud", hit, 0.35);
    });
  </script>
</template>
