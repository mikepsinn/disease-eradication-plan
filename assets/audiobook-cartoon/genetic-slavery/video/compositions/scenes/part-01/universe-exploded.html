<template id="universe-exploded-template">
  <!-- universe-exploded: the heading leaves, the bang, one hydrogen waits out 400,000,000 years and grows a beard. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B1A33; }
    #universe-exploded-weave, #universe-exploded-shake, #universe-exploded-film { position: absolute; inset: 0; }
    #universe-exploded-svg { position: absolute; inset: 0; overflow: visible; }
    #universe-exploded-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="universe-exploded" data-width="1920" data-height="1080" data-start="0" data-duration="16.42">
    <div id="universe-exploded-weave">
      <div id="universe-exploded-shake"><svg id="universe-exploded-svg"><g id="universe-exploded-cam"></g></svg></div>
      <div id="universe-exploded-flash"></div>
    </div>
    <div id="universe-exploded-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("universe-exploded", 47, function (S) {
      S.cam.innerHTML = GS.universe("universe-exploded");
      ["w-how", "w-h", "w-l", "w-to", "w-w", "recap", "count", "atom", "beard", "web"].forEach(function (s) { S.hide(s); });
      S.pop("w-how", S.cue("How"), 0.28);
      S.pop("w-h", S.cue("hydrogen"), 0.28);
      S.pop("w-l", S.cue("learned"), 0.26);
      S.pop("w-to", S.cue("to"), 0.22);
      S.pop("w-w", S.cue("worry?"), 0.28);
      S.tl.to(S.g("recap"), { opacity: 1, duration: 0.3 }, S.cue("recap."));
      var leave = S.before("exploded.");
      S.tl.to(S.g("head"), { opacity: 0, y: -70, duration: 0.28 }, leave);
      var bang = S.cue("exploded.");
      S.tl.set(S.q("flash"), { opacity: 0 }, 0);
      S.tl.to(S.q("flash"), { opacity: 1, duration: 0.05 }, bang);
      S.tl.to(S.q("flash"), { opacity: 0, duration: 0.45 }, bang + 0.08);
      S.pop("atom", bang + 0.18, 0.35);
      var t0 = S.cue("interesting"), t1 = S.cue("400");
      S.tl.set(S.g("count"), { opacity: 1 }, t0);
      S.grow("beard", t0, Math.max(0.5, t1 - t0));
      S.pop("web", Math.min(t1, t0 + 1.2), 0.35);
      var num = S.g("num"), sh = S.g("num-s");
      function commas(n) {
        var s = String(n), out = "", i;
        for (i = 0; i < s.length; i++) {
          if (i && (s.length - i) % 3 === 0) out += ",";
          out += s.charAt(i);
        }
        return out;
      }
      var AX = 960, AY = 560, RX = 380, RY = 120, tr = (-16 * Math.PI) / 180;
      var el = S.g("electron");
      S.on(function (t) {
        var u = t < t0 ? 0 : t >= t1 ? 1 : (t - t0) / (t1 - t0);
        var txt = commas(Math.round(u * 400000000));
        if (num.textContent !== txt) { num.textContent = txt; sh.textContent = txt; }
        if (t < bang + 0.2) return;
        var a = -0.4 + (t - bang) * 0.4;
        var x = AX + RX * Math.cos(a) * Math.cos(tr) - RY * Math.sin(a) * Math.sin(tr);
        var y = AY + RX * Math.cos(a) * Math.sin(tr) + RY * Math.sin(a) * Math.cos(tr);
        el.setAttribute("cx", x.toFixed(1));
        el.setAttribute("cy", y.toFixed(1));
      });
    });
  </script>
</template>
