<template id="owners-manual-template">
  <!-- owners-manual: a man reads OWNER'S MANUAL, YOU, while his brain sneaks up with a lit bomb. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #9B6A45; }
    #owners-manual-weave, #owners-manual-shake, #owners-manual-film { position: absolute; inset: 0; }
    #owners-manual-svg { position: absolute; inset: 0; overflow: visible; }
    #owners-manual-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="owners-manual" data-width="1920" data-height="1080" data-start="0" data-duration="4.82">
    <div id="owners-manual-weave">
      <div id="owners-manual-shake"><svg id="owners-manual-svg"><g id="owners-manual-cam"></g></svg></div>
      <div id="owners-manual-flash"></div>
    </div>
    <div id="owners-manual-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("owners-manual", 41, function (S) {
      S.cam.innerHTML = GS.ownersManual("owners-manual");
      S.hide("lid");
      S.hide("bomb");
      S.hide("cord");
      S.drop("book", S.cue("manual"), 0.32);
      S.tl.set(S.g("brain"), { x: -360, y: -200, opacity: 0 }, 0);
      S.tl.set(S.g("lid"), { opacity: 1 }, S.cue("brain"));
      S.tl.to(S.g("brain"), { opacity: 1, duration: 0.2 }, S.cue("brain"));
      S.tl.to(S.g("brain"), { x: 0, y: 0, duration: 0.65, ease: "power2.inOut" }, S.cue("kill"));
      S.tl.set(S.g("bomb"), { opacity: 1 }, S.cue("kill"));
      S.tl.to(S.g("cord"), { opacity: 1, duration: 0.25 }, S.cue("kill") + 0.4);
    });
  </script>
</template>
