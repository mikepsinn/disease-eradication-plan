<template id="looked-funny-template">
  <!-- looked-funny: a CORTISOL bucket dumped on the genius. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #E6D3A8; }
    #looked-funny-weave, #looked-funny-shake, #looked-funny-film { position: absolute; inset: 0; }
    #looked-funny-svg { position: absolute; inset: 0; overflow: visible; }
    #looked-funny-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="looked-funny" data-width="1920" data-height="1080" data-start="0" data-duration="13.68">
    <div id="looked-funny-weave">
      <div id="looked-funny-shake"><svg id="looked-funny-svg"><g id="looked-funny-cam"></g></svg></div>
      <div id="looked-funny-flash"></div>
    </div>
    <div id="looked-funny-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("looked-funny", 61, function (S) {
      S.cam.innerHTML = GS.lookedFunny("looked-funny");
      S.hide("watch");
      S.hide("splash");
      S.tl.set(S.g("bucket"), { y: -320, opacity: 0 }, 0);
      S.tl.to(S.g("bucket"), { y: 60, opacity: 1, duration: 0.26, ease: "power3.in" }, S.cue("cortisol"));
      S.show("splash", S.cue("cortisol") + 0.22);
      S.pop("watch", S.cue("looked"), 0.3);
    });
  </script>
</template>
