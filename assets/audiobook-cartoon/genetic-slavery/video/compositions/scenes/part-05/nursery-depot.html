<template id="nursery-depot-template">
  <!-- nursery-depot: a pastel house on a crate stenciled MISSILES. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #nursery-depot-weave, #nursery-depot-shake, #nursery-depot-film { position: absolute; inset: 0; }
    #nursery-depot-svg { position: absolute; inset: 0; overflow: visible; }
    #nursery-depot-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="nursery-depot" data-width="1920" data-height="1080" data-start="0" data-duration="32.58">
    <div id="nursery-depot-weave">
      <div id="nursery-depot-shake"><svg id="nursery-depot-svg"><g id="nursery-depot-cam"></g></svg></div>
      <div id="nursery-depot-flash"></div>
    </div>
    <div id="nursery-depot-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("nursery-depot", 47, function (S) {
      S.cam.innerHTML = GS.nursery("nursery-depot");
      S.hide("house");
      S.hide("sign");
      S.drop("house", S.cue("nursery"), 0.45);
      S.drop("sign", S.cue("upgrade"), 0.3);
    });
  </script>
</template>
