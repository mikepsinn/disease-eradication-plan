<template id="lizard-brain-template">
  <!-- lizard-brain: a lizard driving, the checklist already ticked on the mirror. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #lizard-brain-weave, #lizard-brain-shake, #lizard-brain-film { position: absolute; inset: 0; }
    #lizard-brain-svg { position: absolute; inset: 0; overflow: visible; }
    #lizard-brain-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="lizard-brain" data-width="1920" data-height="1080" data-start="0" data-duration="31.24">
    <div id="lizard-brain-weave">
      <div id="lizard-brain-shake"><svg id="lizard-brain-svg"><g id="lizard-brain-cam"></g></svg></div>
      <div id="lizard-brain-flash"></div>
    </div>
    <div id="lizard-brain-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("lizard-brain", 41, function (S) {
      S.cam.innerHTML = GS.lizardBrain("lizard-brain");
      S.hide("t0");
      S.hide("t1");
      S.hide("t2");
      S.hide("t3");
      S.slam("t0", S.cue("Breathe,"));
      S.slam("t1", S.cue("eat,"));
      S.slam("t2", S.cue("fight,"));
      S.slam("t3", S.cue("flee,"));
    });
  </script>
</template>
