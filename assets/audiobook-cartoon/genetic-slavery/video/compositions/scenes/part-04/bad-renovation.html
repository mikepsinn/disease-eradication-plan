<template id="bad-renovation-template">
  <!-- bad-renovation: a pipe from the old floor running straight through a new sofa. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #E6D3A8; }
    #bad-renovation-weave, #bad-renovation-shake, #bad-renovation-film { position: absolute; inset: 0; }
    #bad-renovation-svg { position: absolute; inset: 0; overflow: visible; }
    #bad-renovation-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="bad-renovation" data-width="1920" data-height="1080" data-start="0" data-duration="4.96">
    <div id="bad-renovation-weave">
      <div id="bad-renovation-shake"><svg id="bad-renovation-svg"><g id="bad-renovation-cam"></g></svg></div>
      <div id="bad-renovation-flash"></div>
    </div>
    <div id="bad-renovation-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("bad-renovation", 37, function (S) {
      S.cam.innerHTML = GS.badReno("bad-renovation");
      S.grow("pipe", S.cue("plumbing."), 0.45);
    });
  </script>
</template>
