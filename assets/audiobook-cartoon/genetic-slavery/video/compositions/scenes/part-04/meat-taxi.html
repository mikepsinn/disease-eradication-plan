<template id="meat-taxi-template">
  <!-- meat-taxi: a flask riding a person, the word MEAT on the roof sign. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #meat-taxi-weave, #meat-taxi-shake, #meat-taxi-film { position: absolute; inset: 0; }
    #meat-taxi-svg { position: absolute; inset: 0; overflow: visible; }
    #meat-taxi-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="meat-taxi" data-width="1920" data-height="1080" data-start="0" data-duration="7.06">
    <div id="meat-taxi-weave">
      <div id="meat-taxi-shake"><svg id="meat-taxi-svg"><g id="meat-taxi-cam"></g></svg></div>
      <div id="meat-taxi-flash"></div>
    </div>
    <div id="meat-taxi-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("meat-taxi", 31, function (S) {
      S.cam.innerHTML = GS.meatTaxi("meat-taxi");
      S.hide("sign");
      S.hide("flask");
      S.pop("flask", S.cue("meat"), 0.3);
      S.drop("sign", S.cue("taxi"), 0.28);
    });
  </script>
</template>
