<template id="promiscuous-carbon-template">
  <!-- promiscuous-carbon: carbon bonds with a boot, a teapot, a rubber duck, and H, O, N. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #promiscuous-carbon-weave, #promiscuous-carbon-shake, #promiscuous-carbon-film { position: absolute; inset: 0; }
    #promiscuous-carbon-svg { position: absolute; inset: 0; overflow: visible; }
    #promiscuous-carbon-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="promiscuous-carbon" data-width="1920" data-height="1080" data-start="0" data-duration="14.8">
    <div id="promiscuous-carbon-weave">
      <div id="promiscuous-carbon-shake"><svg id="promiscuous-carbon-svg"><g id="promiscuous-carbon-cam"></g></svg></div>
      <div id="promiscuous-carbon-flash"></div>
    </div>
    <div id="promiscuous-carbon-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("promiscuous-carbon", 13, function (S) {
      S.cam.innerHTML = GS.promiscuous("promiscuous-carbon");
      ["links", "boot", "pot", "duck", "hh", "oo", "nn"].forEach(function (s) { S.hide(s); });
      S.show("links", S.cue("anything."));
      S.pop("boot", S.cue("anything."), 0.28);
      S.pop("pot", S.cue("anything.") + 0.12, 0.28);
      S.pop("duck", S.cue("anything.") + 0.22, 0.28);
      S.pop("hh", S.cue("hydrogen,"), 0.26);
      S.pop("oo", S.cue("oxygen,"), 0.26);
      S.pop("nn", S.cue("nitrogen"), 0.26);
    });
  </script>
</template>
