<template id="copy-themselves-template">
  <!-- copy-themselves: a molecule on a photocopier, the banner on the machine. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #copy-themselves-weave, #copy-themselves-shake, #copy-themselves-film { position: absolute; inset: 0; }
    #copy-themselves-svg { position: absolute; inset: 0; overflow: visible; }
    #copy-themselves-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="copy-themselves" data-width="1920" data-height="1080" data-start="0" data-duration="24.44">
    <div id="copy-themselves-weave">
      <div id="copy-themselves-shake"><svg id="copy-themselves-svg"><g id="copy-themselves-cam"></g></svg></div>
      <div id="copy-themselves-flash"></div>
    </div>
    <div id="copy-themselves-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="lib/plates.js"></script>
  <script>
    GS.play("copy-themselves", 17, function (S) {
      S.cam.innerHTML = GS.copyMachine("copy-themselves");
      S.hide("banner");
      S.hide("sheet");
      S.hide("copy2");
      S.tl.set(S.g("fade"), { opacity: 0 }, 0);
      S.pop("sheet", S.cue("themselves."), 0.3);
      S.slam("banner", S.cue("wrong."));
      S.pop("copy2", S.cue("more"), 0.28);
      S.tl.to(S.g("fade"), { opacity: 0.3, duration: 0.35 }, S.cue("fewer."));
    });
  </script>
</template>
