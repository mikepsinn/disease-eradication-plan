<template id="smoke-detector-by-mail-template">
  <!-- smoke-detector-by-mail · Layer B (storyboards/part-12-fda-unsafe-and-ineffective.md). The living room of the house
       that burns in fire-department-water (the house's variant 1: the room's wall is that house's teal wall). A parade
       of medicine papers marches in along the floorboards; on "mostly" a crack opens under the front of it and the
       front three hang in the air; on "wasted," they drop through, the next two walk off the edge after them, and the
       last one stops at the edge, teeters, looks down at the fire glowing in the basement and gulps. Smoke curls up out
       of the crack; on "smoke" the camera tilts up the wall (9:16: the room stands tall, so the camera only leans in)
       to a sleeping smoke detector on the ceiling, with eyes and a tiny mailbox flag. "detector": it wakes and sniffs.
       "works": it writes a letter, RE: SMOKE, and folds it into an envelope. "by": it licks a stamp and slaps it on.
       "mail.": the flag goes up. After "mail.": flames roll along the ceiling and swallow it; the smoke clears on it
       charred black and smoking, its white eyes blinking, the singed letter still held up and the flag still raised. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #smoke-detector-by-mail-cam, #smoke-detector-by-mail-bg, #smoke-detector-by-mail-room, #smoke-detector-by-mail-pip, #smoke-detector-by-mail-grain { position: absolute; inset: 0; }
    #smoke-detector-by-mail-room { clip-path: inset(44px); }
    #smoke-detector-by-mail-world { position: absolute; left: 0; top: 0; }
  </style>
  <div id="root" data-composition-id="smoke-detector-by-mail" data-width="1920" data-height="1080" data-start="0" data-duration="8.96">
    <div id="smoke-detector-by-mail-cam">
      <div id="smoke-detector-by-mail-bg"></div>
      <div id="smoke-detector-by-mail-room"><div id="smoke-detector-by-mail-world"></div></div>
      <div id="smoke-detector-by-mail-pip"></div>
      <div id="smoke-detector-by-mail-grain"></div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "smoke-detector-by-mail";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, P = ID + "-";
      var WHITE = "#FBF6E6", SMOKE = "#8C8782";

      // ── Drawing helpers (the kit's print look: a navy pass under each fill, mitred corners) ──
      function n1(v) { var r = Math.round(v * 10) / 10; return String(r === 0 ? 0 : r); }
      function pt(x, y) { return n1(x) + "," + n1(y); }
      function polyD(pts) { return "M" + pts.map(function (p) { return pt(p[0], p[1]); }).join(" L") + " Z"; }
      function pg(pts) { return 'path d="' + polyD(pts) + '"'; }
      function ci(cx, cy, r) { return 'circle cx="' + n1(cx) + '" cy="' + n1(cy) + '" r="' + n1(r) + '"'; }
      function R(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
      function S(tags, col, w) {
        w = w || 4.4;
        return tags.map(function (t) { return "<" + t + ' fill="' + ink + '" stroke="' + ink + '" stroke-width="' + w + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }).join("") +
          tags.map(function (t) { return "<" + t + ' fill="' + col + '"/>'; }).join("");
      }
      function F(tag, col, extra) { return "<" + tag + ' fill="' + col + '"' + (extra ? " " + extra : "") + "/>"; }
      function line(d, col, w, extra) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linejoin="miter" stroke-linecap="round"' + (extra ? " " + extra : "") + "/>"; }
      function g(id, inner, attrs) { return '<g id="' + P + id + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
      function at(x, y, s, inner, rot) { return '<g transform="translate(' + n1(x) + "," + n1(y) + ")" + (rot ? " rotate(" + rot + ")" : "") + (s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; }
      function text(x, y, size, t, fill, extra) {
        return '<text x="' + n1(x) + '" y="' + n1(y) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + size + '" fill="' + (fill || ink) + '"' + (extra ? " " + extra : "") + ">" + t + "</text>";
      }
      // Points on a circle, n facets (round things stay faceted).
      function ring(cx, cy, r, n, a0) {
        var out = [];
        for (var i = 0; i < n; i++) { var a = ((a0 || 0) + (i * 360) / n) * Math.PI / 180; out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
        return out;
      }
      // Print shading: halftone dots over the part of a shape right of x0 (ids unique on the page).
      var hd = 0;
      function dots(pts, x0, op) {
        var id = P + "hd" + ++hd, ys = pts.map(function (p) { return p[1]; }), xs = pts.map(function (p) { return p[0]; });
        var y0 = Math.min.apply(null, ys) - 2, y1 = Math.max.apply(null, ys) + 2, x1 = Math.max.apply(null, xs) + 2;
        return '<defs><pattern id="' + id + 'd" width="3.6" height="3.6" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1" fill="' + ink + '"/></pattern><clipPath id="' + id + 'c"><path d="' + polyD(pts) + '"/></clipPath></defs>' +
          '<rect x="' + n1(x0) + '" y="' + n1(y0) + '" width="' + n1(Math.max(0, x1 - x0)) + '" height="' + n1(y1 - y0) + '" fill="url(#' + id + 'd)" opacity="' + (op || 0.28) + '" clip-path="url(#' + id + 'c)"/>';
      }
      // The charred look for a drawing that is not a person (as kit.js chars people, and Part 11's neighbors-house
      // chars its house): every color but the ink goes a dark brown of the same lightness.
      function charColors(markup) {
        var inkU = ink.toUpperCase();
        return markup.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g, function (m, attr, col) {
          if (col.toUpperCase() === inkU) return m;
          var n = parseInt(col.slice(1), 16), lum = (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255, v = Math.round(26 + lum * 40);
          return attr + '="rgb(' + (v + 8) + "," + v + "," + Math.max(0, v - 6) + ')"';
        });
      }
      function puff(cx, cy, r, col) {
        var cs = [[cx, cy, r], [cx - r * 0.72, cy + r * 0.3, r * 0.62], [cx + r * 0.74, cy + r * 0.34, r * 0.56]];
        return S(cs.map(function (c) { return ci(c[0], c[1], c[2]); }), col || SMOKE, 3.2) + F(ci(cx - r * 0.32, cy - r * 0.34, r * 0.3), C.cream, 'opacity="0.4"');
      }

      // ── THE SMOKE DETECTOR (Part 14 copies this: smoke-detector-live) ─────────────────────────────────────────
      // A round ceiling smoke detector with a face, drawn face-on around its disc's center (0, 0): a cream disc
      // (r 60) with a ring of grill slots, a red LED, almond eyes with heavy lids, and a tiny red mailbox flag on its
      // right side, hanging from a slate mount whose top (the ceiling) is at y -84.
      // o: { charred (dark brown, white eyes, smoke wisps), flag "up" | "down" (default down), eyes "open" | "shut" }
      // Parts (untransformed groups; data-pivot="x y" in these units, for gsap.set(el, { svgOrigin })):
      //   .sd-body (0 -84: the whole detector, to sniff or shiver), .sd-flag (57 -20: a down flag goes up with
      //   rotation -90), .sd-eyes-open / .sd-eyes-shut (swap them), .sd-led, .sd-tongue (opacity 0; show it to lick),
      //   .sd-char-eyes (charred: blink with scaleY about 0 -8), .sd-smoke (charred: the wisps).
      function smokeDetector(o) {
        o = o || {};
        var disc = ring(0, 0, 60, 28, 0), mount = [[-34, -84], [34, -84], [30, -60], [-30, -60]];
        var slots = "";
        for (var i = 0; i < 20; i++) {
          var a = (i * 18 + 9) * Math.PI / 180;
          slots += "M" + pt(49 * Math.cos(a), 49 * Math.sin(a)) + " L" + pt(55 * Math.cos(a), 55 * Math.sin(a)) + " ";
        }
        var eye = function (x, k) {
          // an almond with a pupil, under a heavy lid (the disc's color down to a third of the eye) and a lash line
          return '<path d="M' + pt(x - 12, -8) + " Q" + pt(x, -20) + " " + pt(x + 12, -8.5) + " Q" + pt(x, 2) + " " + pt(x - 12, -8) + ' Z" fill="' + WHITE + '" stroke="' + ink + '" stroke-width="1.6"/>' +
            '<circle class="pupil" cx="' + n1(x + 1.5 * k) + '" cy="-8" r="3.6" fill="' + ink + '"/>' +
            '<path d="M' + pt(x - 12.6, -8) + " Q" + pt(x, -21) + " " + pt(x + 12.6, -8.6) + " L" + pt(x + 11.5, -11.6) + " Q" + pt(x, -16.5) + " " + pt(x - 11.5, -11) + ' Z" fill="' + WHITE + '"/>' +
            line("M" + pt(x - 12.8, -7.6) + " Q" + pt(x, -12.4) + " " + pt(x + 12.8, -8.4), ink, 2.4) +
            line("M" + pt(x - 13 * k, -26 + (k > 0 ? 2 : 0)) + " L" + pt(x + 9 * k, -24 + (k > 0 ? 0 : 2)), ink, 2.2);
        };
        var shut = function (x) {
          return line("M" + pt(x - 12, -9) + " Q" + pt(x, -2.5) + " " + pt(x + 12, -9), ink, 2.4) + line("M" + pt(x - 7, -5) + " l-2,3.5 M" + pt(x, -4) + " l0,4 M" + pt(x + 7, -5) + " l2,3.5", ink, 1.6);
        };
        var flagArt = S([pg([[54, -18], [60, -18], [60, -66], [54, -66]])], C.slate, 2.4) + S([pg([[60, -66], [84, -66], [84, -50], [60, -50]])], C.war, 2.6) +
          line("M62,-63 H82", C.cream, 1.6, 'opacity="0.6"') + S([ci(57, -20, 4.5)], C.yellow, 2);
        var flag = '<g class="sd-flag" data-pivot="57 -20">' + (o.flag === "up" ? "<g>" : '<g transform="rotate(90 57 -20)">') + flagArt + "</g></g>";
        var body = S([pg(mount)], C.slate, 3.4) + line("M-28,-80 H28", C.orange, 1.6) +
          S([pg(disc)], WHITE) + dots(disc, 18, 0.25) +
          '<circle cx="0" cy="0" r="44" fill="none" stroke="' + ink + '" stroke-width="1.6" opacity="0.45"/>' +
          '<path d="' + slots + '" fill="none" stroke="' + ink + '" stroke-width="3.2" stroke-linecap="square"/>' +
          '<g class="sd-led">' + S([ci(0, -36, 4.6)], C.war, 2.2) + F(ci(-1.4, -37.4, 1.4), "#FFFFFF", 'opacity="0.8"') + "</g>" +
          '<g class="sd-eyes-open"' + (o.eyes === "shut" ? ' opacity="0"' : "") + ">" + eye(-19, 1) + eye(19, 1) + "</g>" +
          '<g class="sd-eyes-shut"' + (o.eyes === "shut" ? "" : ' opacity="0"') + ">" + shut(-19) + shut(19) + "</g>" +
          '<g class="sd-tongue" opacity="0">' + S([pg([[-6, 25], [6, 25], [7, 37], [3, 42], [-3, 42], [-7, 37]])], "#E58A97", 2.4) + line("M0,28 V37", "#B35A66", 1.4) + "</g>" +
          line("M-11,24 Q0,29 11,24", ink, 2.6) + flag;
        if (!o.charred) return '<g class="sd"><g class="sd-body" data-pivot="0 -84">' + body + "</g></g>";
        // charred: dark brown, the flag up, the eyes white and wide, smoke wisps curling off the rim
        var cbody = charColors(body.replace(/<g class="sd-eyes-open"[\s\S]*?<g class="sd-tongue"/, '<g class="sd-tongue"').replace('<g class="sd-tongue" opacity="0">', '<g class="sd-tongue" opacity="0" display="none">'));
        var white = function (x) { return S([ci(x, -8, 10)], "#FFFFFF", 2.2) + F(ci(x + 1.5, -7, 3.6), ink); };
        var smoke = '<g class="sd-smoke">' + [[-44, -40], [-6, -66], [40, -46]].map(function (p, i) {
          return line("M" + pt(p[0], p[1]) + " l-6,-10 l6,-10 l-6,-10 l6,-10", SMOKE, 3.6);
        }).join("") + "</g>";
        return '<g class="sd sd-charred"><g class="sd-body" data-pivot="0 -84">' + cbody +
          '<g class="sd-char-eyes" data-pivot="0 -8">' + white(-19) + white(19) + "</g>" + smoke + "</g></g>";
      }

      // ── THE LETTER (copied in fire-department-water: the same envelope flutters onto the burnt house) ──
      // A cream airmail envelope around (0, 0), 128 x 80, with a red-and-navy striped border, RE: SMOKE in Oswald and
      // (o.stamp) a small postage stamp top right. o.singed: browned, with burnt corners.
      function envelope(o) {
        o = o || {};
        var w = 128, h = 80, x0 = -w / 2, y0 = -h / 2, paper = o.singed ? "#C9A877" : WHITE, stripes = "";
        var id = P + "env" + ++hd;
        for (var k = -10; k < 24; k++) {
          var x = x0 - 40 + k * 10;
          stripes += F(pg([[x, y0 - 2], [x + 5, y0 - 2], [x + 5 + h, y0 + h + 2], [x + h, y0 + h + 2]]), k % 2 ? C.war : C.navy);
        }
        var inner = R(x0 + 7, y0 + 7, w - 14, h - 14);
        var out = S([pg(R(x0, y0, w, h))], paper, 3.4) +
          '<defs><clipPath id="' + id + '"><path d="' + polyD(R(x0, y0, w, h)) + '"/></clipPath></defs>' +
          '<g clip-path="url(#' + id + ')">' + stripes + "</g>" + F(pg(inner), paper) +
          text(-4, 9, 22, "RE: SMOKE", ink, 'letter-spacing="1"') + line("M-34,18 H26", ink, 1.4, 'opacity="0.45"');
        if (o.stamp) out += stampSvg(40, -20);
        if (o.singed) {
          // burnt corners and a scorched edge
          out += F(pg([[x0 - 2, y0 - 2], [x0 + 26, y0 - 2], [x0 + 18, y0 + 6], [x0 + 10, y0 + 4], [x0 + 6, y0 + 16], [x0 - 2, y0 + 22]]), "#2A211C") +
            F(pg([[w / 2 + 2, h / 2 + 2], [w / 2 - 30, h / 2 + 2], [w / 2 - 20, h / 2 - 7], [w / 2 - 10, h / 2 - 3], [w / 2 - 5, h / 2 - 18], [w / 2 + 2, h / 2 - 24]]), "#2A211C") +
            line("M" + pt(x0 + 26, y0 - 1) + " L" + pt(x0 + 18, y0 + 7) + " L" + pt(x0 + 10, y0 + 5) + " L" + pt(x0 + 6, y0 + 17) + " L" + pt(x0 - 1, y0 + 23), C.orange, 1.6) +
            F(pg(R(x0, y0, w, h)), "#3A2A1C", 'opacity="0.22"');
        }
        return out;
      }
      // A small postage stamp around (cx, cy): a perforated cream square with a teal star.
      function stampSvg(cx, cy) {
        var s = 11, perf = "";
        for (var i = -1; i <= 1; i++) perf += F(ci(cx + i * 7, cy - s, 1.6), WHITE) + F(ci(cx + i * 7, cy + s, 1.6), WHITE) + F(ci(cx - s, cy + i * 7, 1.6), WHITE) + F(ci(cx + s, cy + i * 7, 1.6), WHITE);
        return S([pg(R(cx - s, cy - s, 2 * s, 2 * s))], C.yellow, 2.2) + F(pg(R(cx - s + 4, cy - s + 4, 2 * s - 8, 2 * s - 8)), C.med) + KIT.star(cx, cy, 6, WHITE) + perf;
      }
      // The sheet the detector writes on before folding it: lined, RE: SMOKE at the top, three scribbled lines.
      function sheet() {
        var x0 = -58, y0 = -62, w = 116, h = 124;
        return S([pg(R(x0, y0, w, h))], WHITE, 3.2) + dots(R(x0, y0, w, h), 30, 0.18) +
          line("M-48,-26 H48 M-48,-6 H48 M-48,14 H48 M-48,34 H48", C.peri, 1.2, 'opacity="0.7"') +
          text(0, -36, 20, "RE: SMOKE", ink, 'letter-spacing="1"') +
          [-12, 8, 28].map(function (y, i) {
            return '<path class="sd-scribble" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M-44,' + y + " q5,-7 10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0" + (i < 2 ? " t10,0 t8,0" : "") + '" fill="none" stroke="' + ink + '" stroke-width="2" stroke-linecap="round"/>';
          }).join("");
      }

      // ── Layout, per canvas shape ──────────────────────────────────────────────────────────────────────────────
      // WH: the room's height (16:9 is two screens tall: the camera tilts from the floor up to the ceiling; 9:16 is one
      // tall frame); CEIL: the ceiling line; F: the top of the floor; FW: where feet stand; ck: the crack's two edges;
      // par: the parade (scale, spacing, speed, the front paper's x at t 0, where the last one stops); det: the
      // detector's disc center and scale; tilt: the world's y before the tilt (16:9).
      var L = V
        ? { WH: H, CEIL: 124, F: 1310, FW: 1350, ck: [400, 760], par: { s: 1.0, gap: 125, v: 312, x0: -104, stop: 380 },
            det: [400, 270, 1.65], lamp: 130, pic: [640, 660, 300, 220], win: null, push: 1.07 }
        : { WH: 1900, CEIL: 112, F: 1640, FW: 1680, ck: [760, 1200], par: { s: 1.3, gap: 165, v: 484, x0: -100, stop: 735 },
            det: [800, 280, 2.0], lamp: 190, pic: [300, 980, 330, 230], win: [1200, 250, 380, 560], tilt: -820 };
      var WH = L.WH, CEIL = L.CEIL, FL = L.F, FW = L.FW, CK = L.ck, PAR = L.par, DET = L.det;

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));
      var world = q("world");
      world.style.width = W + "px";
      world.style.height = WH + "px";

      // ── The room: the ceiling, the teal wallpaper (the house's wall), a window, a picture, a floor lamp,
      // the baseboard and the floorboards ──
      var room = F(pg(R(0, 0, W, WH)), C.cyan);
      for (var sx = 30; sx < W; sx += 64) room += F(pg(R(sx, CEIL, 22, FL - CEIL)), "#76ACA7");
      var rs = KIT.rng(12);
      for (var yy = CEIL + 90; yy < FL - 60; yy += 150) for (var xx = 60 + ((yy / 150) % 2) * 96; xx < W; xx += 192) room += KIT.star(xx + (rs() - 0.5) * 20, yy, 9, C.cream).replace("/>", ' opacity="0.55"/>');
      room += S([pg(R(-10, -10, W + 20, CEIL - 2))], "#E9E1CC", 3) + S([pg(R(-10, CEIL - 14, W + 20, 16))], C.tan, 3) + line("M0," + (CEIL - 10) + " H" + W, C.cream, 1.6, 'opacity="0.6"');
      if (L.win) {
        var wn = L.win, wx = wn[0], wy = wn[1], ww = wn[2], wh = wn[3];
        room += S([pg(R(wx - 14, wy - 14, ww + 28, wh + 28))], WHITE, 3.4) + S([pg(R(wx, wy, ww, wh))], "#CDE5E2", 3) +
          line("M" + (wx + ww / 2) + "," + wy + " V" + (wy + wh) + " M" + wx + "," + (wy + wh / 2) + " H" + (wx + ww), WHITE, 9) +
          line("M" + (wx + 30) + "," + (wy + wh - 40) + " L" + (wx + 90) + "," + (wy + 40), "#FFFFFF", 4, 'opacity="0.7"') +
          S([pg([[wx - 40, wy - 30], [wx + 70, wy - 30], [wx + 40, wy + wh + 30], [wx - 50, wy + wh + 30]]), pg([[wx + ww + 40, wy - 30], [wx + ww - 70, wy - 30], [wx + ww - 40, wy + wh + 30], [wx + ww + 50, wy + wh + 30]])], C.orange, 3.4) +
          line("M" + (wx - 10) + "," + (wy - 20) + " L" + (wx - 18) + "," + (wy + wh + 20) + " M" + (wx + 30) + "," + (wy - 20) + " L" + (wx + 14) + "," + (wy + wh + 20), C.rust, 2, 'opacity="0.6"') +
          S([pg(R(wx - 60, wy - 44, ww + 120, 12))], C.tan, 3);
      }
      // the picture: a little sailboat in a frame
      var pc = L.pic, px = pc[0], py = pc[1], pw = pc[2], ph = pc[3];
      room += S([pg(R(px, py, pw, ph))], C.rust, 3.4) + S([pg(R(px + 16, py + 16, pw - 32, ph - 32))], "#E9E1CC", 2.4) +
        F(pg([[px + 16, py + ph * 0.66], [px + pw - 16, py + ph * 0.66], [px + pw - 16, py + ph - 16], [px + 16, py + ph - 16]]), C.peri) +
        S([pg([[px + pw * 0.32, py + ph * 0.62], [px + pw * 0.7, py + ph * 0.62], [px + pw * 0.62, py + ph * 0.72], [px + pw * 0.38, py + ph * 0.72]])], C.tan, 2.4) +
        S([pg([[px + pw * 0.5, py + ph * 0.24], [px + pw * 0.5, py + ph * 0.6], [px + pw * 0.33, py + ph * 0.6]]), pg([[px + pw * 0.53, py + ph * 0.3], [px + pw * 0.53, py + ph * 0.6], [px + pw * 0.66, py + ph * 0.6]])], WHITE, 2.4) +
        KIT.star(px + pw * 0.8, py + ph * 0.3, 12, C.yellow) + line("M" + (px + pw / 2 - 40) + "," + py + " L" + (px + pw / 2) + "," + (py - 40) + " L" + (px + pw / 2 + 40) + "," + py, ink, 2.4);
      // the floor lamp: a cone shade on a pole
