<template id="murder-receipt-template">
  <!-- murder-receipt · collage (Part 12, scene 16; plate the-register). The Politician rings up at a big cash register;
       Part 10's receipt hangs out of it, its top lines WAR ... $170,000,000,000,000 and CLINICAL TRIALS ... $0.00, and
       YOU stands at its end, smiling. A line prints on each sentence: TREATMENT ... VOID, SCIENTIST ... VOID,
       INFLATION ... $$$ (ding), TAX BILL ... $$$ (ding; YOU's smile goes), HER MURDER ... PAID, and no ding. HOLD. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #E7D6AE; }
  </style>
  <div id="root" data-composition-id="murder-receipt" data-width="1920" data-height="1080" data-start="0" data-duration="8.5">
    <div id="murder-receipt-weave"></div>
    <div id="murder-receipt-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    var ID = "murder-receipt", V = KIT.V, SZ = KIT.collage.SIZES;
    var cue = function (w, n) { return KIT.cue(ID, w, n); };
    var G = V ? 1400 : 880;
    var h = function (art, px) { return px / SZ[art][1]; };
    var X = V ? { pol: 150, reg: 420, rec: 560, you: 900 } : { pol: 260, reg: 640, rec: 1180, you: 1650 };
    var RK = V ? 2.0 : 2.6, STEP = SZ["receipt"][1] * RK * 0.8, TOP0 = V ? 330 : 90;
    var line = function (i, text, hidden) {
      return { art: "receipt", x: X.rec, y: TOP0 + i * STEP, anchor: "top", pivot: "center", scale: RK, hidden: hidden,
        label: { text: text, at: [101, 26], width: 140, size: 30 } };
    };
    var LINES = ["WAR ... $170,000,000,000,000", "CLINICAL TRIALS ... $0.00", "TREATMENT ... VOID", "SCIENTIST ... VOID", "INFLATION ... $$$", "TAX BILL ... $$$", "HER MURDER ... PAID"];
    var WHEN = [null, null, cue("treatment."), cue("scientist."), cue("inflation."), cue("bill."), cue("murder.")];
    var cast = {
      pol: { art: "politician-crank", x: X.pol, y: G, anchor: "bottom", pivot: "bottom", scale: h("politician-crank", V ? 520 : 560) },
      reg: { art: "cash-register", x: X.reg, y: G, anchor: "bottom", pivot: "bottom", scale: h("cash-register", V ? 440 : 560) },
      you: { art: "you", x: X.you, y: G, anchor: "bottom", pivot: "bottom", scale: h("you", V ? 520 : 640) },
      glum: { art: "you-sick", x: X.you, y: G, anchor: "bottom", pivot: "bottom", scale: h("you-sick", V ? 520 : 640), hidden: true },
    };
    var beats = [];
    LINES.forEach(function (t, i) {
      cast["l" + i] = line(i, t, WHEN[i] !== null);
      if (WHEN[i] === null) return;
      beats.push({ at: WHEN[i] - 0.05, do: "pop", who: "l" + i, squash: true });
      beats.push({ at: WHEN[i] - 0.1, do: "nudge", who: "pol", by: [16, 8] });
      beats.push({ at: WHEN[i] - 0.1, do: "shiver", who: "reg", dur: 0.25, amp: 3, rot: 1 });
    });
    beats = beats.concat([
      // the dings: YOU likes the first, not the second
      { on: "inflation.", offset: 0.3, do: "hop", who: "reg", height: 14 },
      { on: "bill.", offset: 0.3, do: "hop", who: "reg", height: 14 },
      { on: "bill.", offset: 0.35, do: "swap", who: "you", to: "glum" },
      // her murder: paid, and no ding
      { on: "murder.", offset: 0.4, do: "shiver", who: "glum", dur: 0.5, amp: 1, rot: 1 },
    ]);
    KIT.collage({ id: ID, seed: 1216, cast: cast, beats: beats });
  </script>
</template>
