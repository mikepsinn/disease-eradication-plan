      // The cast. A Politician: young, old (white hair, a beard that grows) and his skeleton (tie and beard on the bones).

      function eyesTo(markup, mk) { var i = 0; return markup.replace(/<g class="eye">[\s\S]*?<\/g>/g, function () { return mk([-2.5, 10.8][i++ % 2]); }); }

          '<rect x="' + (HX0 + 20) + '" y="' + HTOP + '" width="' + (HX1 - HX0 - 40) + '" height="' + (FLOOR - HTOP) + '" fill="url(#' + ID + '-wp)" stroke="' + ink + '" stroke-width="5"/>' +

          '<rect x="' + (HX1 - 24) + '" y="' + HTOP + '" width="24" height="' + (FLOOR - HTOP + 10) + '" fill="' + C.tan + '" stroke="' + ink + '" stroke-width="4"/>' +

      // The whole plate. Element ids: cap0/1 and crater0/1 (each capitol, whole and burnt flat), nk0..nk7 (the tiny

      var NKS = [[CAPX[1] - 30, 0.2], [CAPX[0] + 30, 0.2], [CAPX[1] - 60, 0.13], [CAPX[0] + 50, 0.13], [CAPX[1] + 110, 0.15], [CAPX[0] - 110, 0.15], [CAPX[1] - 10, 0.12], [CAPX[0] + 5, 0.12]];

        var nks = NKS.map(function (n, i) { return '<g id="' + ID + "-nk" + i + '" opacity="0" transform="translate(' + f(n[0]) + "," + f(GI - 8) + ") scale(" + n[1] + ')">' + KIT.nuke() + "</g>"; }).join("");

      function setSwing(g, L, pose) {
        var ra = pose[0] - L.phi0, hx = L.S[0] + L.l0 * Math.cos(rad(pose[0])), hy = L.S[1] + L.l0 * Math.sin(rad(pose[0]));

      }
      function ghost(g, L, pose, i, op) {
        var gh = g.querySelectorAll(".ghost")[i], hx = L.S[0] + L.l0 * Math.cos(rad(pose[0])), hy = L.S[1] + L.l0 * Math.sin(rad(pose[0]));
        gh.setAttribute("opacity", op.toFixed(2));
        gh.setAttribute("transform", "translate(" + f(hx) + "," + f(hy) + ") rotate(" + f(pose[1]) + ")");
      }
      function setPoint(g, L, u) {
        Array.prototype.forEach.call(g.querySelectorAll(".bones .arm-r"), function (a) { a.setAttribute("transform", "rotate(" + f((L.point - L.phi2) * u) + " " + f(L.S2[0]) + " " + f(L.S2[1]) + ")"); });
      }
      // squash a head flat about its neck: k 0 is round, 1 is flat
      function setSquash(g, R, k) {
        var sx = 1 + 0.45 * k, sy = 1 - 0.6 * k, n = R.neck;
        Array.prototype.forEach.call(g.querySelectorAll(".head"), function (h) { h.setAttribute("transform", k ? "translate(" + f(n[0]) + "," + f(n[1]) + ") scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ") translate(" + f(-n[0]) + "," + f(-n[1]) + ")" : ""); });
      }
      var mixP = function (a, b, u) { return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; };
      // One bonk landing at time h: wind up over w seconds, strike in the last 0.09, hold the contact, swing back.
      function bonkPose(t, h, w, rest, hit) {
        rest = rest || REST; hit = hit || HIT;
        var a = t - (h - w);
        if (a < 0 || t > h + 0.42) return null;
        if (t < h - 0.09) return mixP(rest, WIND, KIT.smooth(a / (w - 0.09)));
        if (t < h) { var u = (t - (h - 0.09)) / 0.09; return mixP(WIND, hit, u * u); }
        if (t < h + 0.06) return hit;
        return mixP(hit, rest, KIT.smooth((t - h - 0.06) / 0.36));
      }
      // The squash a head takes from a bonk that lands at h: flat at once, then a springy rebound.
      function squashAt(t, h) { var d = t - h; return d < 0 || d > 0.6 ? 0 : Math.max(-0.25, Math.exp(-d * 7) * Math.cos(d * 26)); }
      // After the double bonk the skeletons keep at it for good: the same rhythm in both scenes, in part time.
      var LOOP0 = KIT.scene("nations-foam-bats").start + KIT.after("nations-foam-bats", "last."), LOOPP = 1.0;
      function loopHits(first, a, b) { var out = []; for (var h = LOOP0 + first; h < T0 + b + 1; h += LOOPP) if (h > T0 + a - 1) out.push(h - T0); return out; }
      // the craters' smoke (and any other .wisp), drifting up in part time so it carries across the seam
      function drift(root, t) {
        Array.prototype.forEach.call(root.querySelectorAll(".wisp"), function (w, j) {
          var tt = T0 + t, ph = (tt * 0.9 + j * 0.37) % 1;
          w.setAttribute("transform", "translate(" + f(Math.sin(tt * 2 + j) * 6) + "," + f(-ph * 30) + ")");
          w.setAttribute("opacity", (0.85 * Math.sin(Math.PI * ph)).toFixed(2));
        });
      }
      // ════ end of the plate ════

      q("plate").innerHTML = KIT.svg(W, H, '<g id="' + ID + '-cam">' + plateSvg() + "</g>");
      var cam = q("cam"), pol = [q("pol0"), q("pol1")], tod = [q("tod0"), q("tod1")], pil = q("pillow");
      var pilIn = pil.querySelector(".pil"), wings = [pil.querySelector(".wing-l"), pil.querySelector(".wing-r")];
      var zEls = [0, 1, 2, 3, 4, 5].map(function (i) { return q("z" + i); });

      // ── The islands as nations-foam-bats left them: skeletons with full beards, craters, the calendar on 10,000.
      pol.forEach(function (g) {
        g.querySelector(".alive").setAttribute("opacity", 0);
        Array.prototype.forEach.call(g.querySelectorAll(".ghost"), function (e) { e.setAttribute("opacity", 0); });
      });
      [0, 1].forEach(function (i) { q("cap" + i).setAttribute("opacity", 0); q("crater" + i).setAttribute("opacity", 1); });
      Array.prototype.forEach.call(q("cal").querySelectorAll('text[font-weight="900"]'), function (tx) {
        tx.textContent = "10,000"; tx.setAttribute("font-size", "30"); tx.setAttribute("textLength", "62"); tx.setAttribute("lengthAdjust", "spacingAndGlyphs");
      });
      // the calendar prints every page twice (the page over its under-print), so their numbers overlap on purpose
      Array.prototype.forEach.call(q("cal").querySelectorAll("text"), function (tx) { tx.setAttribute("data-layout-allow-overlap", ""); });
      // smoke over the skulls once the big cloud has gone off (in plate units, above each skeleton's head)
      var skullSmoke = POLS.map(function (p, i) {
        var hx = p.x + (i ? -1 : 1) * FK * p.R.head[0], hy = GI - 100 * FK + FK * (p.R.head[1] - 26);
        return '<g id="' + ID + "-sm" + i + '" opacity="0">' + [-14, 0, 14].map(function (dx) { return wisp(hx + dx, hy, 0.42); }).join("") + "</g>";
      }).join("");
      cam.insertAdjacentHTML("beforeend", skullSmoke);

      // ── Cues ──
      var tRes = cue("resolution"), tFour = cue("four-year-olds,"), tEvent = cue("eventually"), tTired = cue("tired"), tNap = cue("nap.");
      var tInvented = cue("invented"), tNaps = cue("naps"), tRefused = cue("refused"), tApply = cue("apply"), tGeo = cue("geopolitics.");

      // ── The camera: from the islands down and left across the water into the playroom; a close two-shot for the
      // yawns; the two asleep on the rug; then the wide view that holds the playroom in front and the islands behind.
      var VIEW = V
        ? { islands: [CALX, -660, 1.15], duel: [CALX, -700, 1.85], close: [CALX, -715, 2.3],
            mid: [-200, -400, 0.9], room: [HMID, -118, 1.9], yawn: [HMID, -83, 2.4], nap: [HMID, -137, 1.6], wide: [-360, -580, 0.64] }
        : { islands: [CALX, -585, 1.5], duel: [CALX, -585, 2.15], close: [CALX, -590, 2.6],
            mid: [-230, -420, 1.0], room: [HMID, -5, 1.85], yawn: [HMID, -18, 2.7], nap: [HMID + 10, 80, 2.0], wide: [-267, -235, 0.88] };
      var KEYS = [[0, "close", 1.04], [0.08, "close", 1.04], [0.45, "mid", 1], [0.85, "room", 1], [tTired - 0.3, "room", 1.04], [tTired + 0.1, "yawn", 1],
        [tNap - 0.25, "yawn", 1.03], [tNap + 0.1, "nap", 1], [tInvented, "nap", 1.03], [tInvented + 0.8, "wide", 1], [D, "wide", 1.02]];
      var camera = KIT.camera(VIEW, KEYS);

      // ── The toddlers: bonks in turns ("resolution", "four-year-olds,"), slower from "eventually", yawns on "tired",
      // down on "nap.". [hit time, wind-up seconds]
      var THIT = [LT.hit, LT.hit], DROOP = [70, 28], LIE = [84, 100];
      var TBONK = [[[tRes + 0.04, 0.32], [3.25, 0.34], [4.75, 0.5]], [[tFour + 0.04, 0.32], [4.0, 0.36], [tEvent + 0.32, 0.62]]];
      var tFall = tNap - 0.24, tLand = tNap + 0.04;

      // ── The skeletons keep the rhythm from nations-foam-bats; the right one's swing on "refused" bats the pillow away,
      // and the left one's on "geopolitics." sets off the bomb.
      var tSwat = tRefused + 0.03;
      function override(list, h) { return list.filter(function (x) { return Math.abs(x - h) > 0.66; }).concat([h]).sort(function (a, b) { return a - b; }); }
      var SHITS = [override(loopHits(0.8, 0, D), tGeo), override(loopHits(1.3, 0, D), tSwat)];
      // where the right skeleton's bat is half way through that swing: the pillow meets it there
      var swatPose = mixP(WIND, HIT, 0.5), RB = POLS[1].R;
      var hb = [LP.S[0] + LP.l0 * Math.cos(rad(swatPose[0])), LP.S[1] + LP.l0 * Math.sin(rad(swatPose[0]))];
      var bp = [hb[0] + LP.len * 0.55 * Math.cos(rad(swatPose[1])), hb[1] + LP.len * 0.55 * Math.sin(rad(swatPose[1]))];
      var SWAT = [XB - FK * bp[0], GI - 100 * FK + FK * bp[1]], tMeet = tSwat - 0.09 + 0.09 * Math.SQRT1_2;
      // the pillow's trip: up out of the playroom to the swat, knocked high into the sky, then down onto the rug
      var KNOCK = [-80, -760], PEND = [TXB + 128 * NK, FLOOR - 20];
      var tOut0 = tNaps + 0.12, tKnock = tMeet + 0.5, tBack0 = tApply - 0.15, tBack1 = tGeo - 0.2;
      function bez(P, u) {
        var m = 1 - u, c = [m * m * m, 3 * m * m * u, 3 * m * u * u, u * u * u];
        return [0, 1].map(function (k) { return c[0] * P[0][k] + c[1] * P[1][k] + c[2] * P[2][k] + c[3] * P[3][k]; });
      }
      var OUT = [PILLOW0, [PILLOW0[0] + 60, PILLOW0[1] - 520], [SWAT[0] - 520, SWAT[1] - 260], SWAT];
      var BACK = [KNOCK, [KNOCK[0] - 200, KNOCK[1] - 160], [PEND[0] + 260, PEND[1] - 560], PEND];

      // ── The bomb on "geopolitics.": the flash, the shake and the cloud over the islands; it thins on the skeletons.
      var bign = q("bign");
      tl.set(bign, { opacity: 1 }, tGeo);
      // (the boom runs on its own timeline, played only up to the cut, so the scene ends on time)
      var bt = gsap.timeline({ paused: true });
      KIT.boom(bt, bign, 0, { flash: q("flash"), shake: q("shake") });
      tl.add(bt.tweenFromTo(0, D - tGeo, { ease: "none" }), tGeo);
      tl.fromTo(bign, { opacity: 1 }, { opacity: 0.38, duration: 0.9, ease: "power1.inOut", immediateRender: false }, tGeo + 0.95);
      tl.set([q("sm0"), q("sm1")], { opacity: 1 }, tGeo + 0.35);

      KIT.onTime(tl, D, function (t) {
        camera.place(cam, camera.at(t));
        drift(cam, t);

        // the skeletons
        pol.forEach(function (g, i) {
          var pose = REST;
          SHITS[i].forEach(function (h) { pose = bonkPose(t, h, 0.32) || pose; });
          setSwing(g, LP, pose);
          var k = 0;
          SHITS[1 - i].forEach(function (h) { var s2 = squashAt(t, h); if (Math.abs(s2) > Math.abs(k)) k = s2; });
          setSquash(g, POLS[i].R, k);
        });

        // the toddlers
        tod.forEach(function (g, i) {
          var pose = REST, k = 0, body = g.querySelector(".tbody");
          TBONK[i].forEach(function (b) { pose = bonkPose(t, b[0], b[1], REST, THIT) || pose; });
          TBONK[1 - i].forEach(function (b) { var s2 = squashAt(t, b[0]); if (Math.abs(s2) > Math.abs(k)) k = s2; });
          if (t > tTired) pose = mixP(pose, DROOP, KIT.smooth((t - tTired - 0.05) / 0.5));
          var fall = KIT.smooth((t - tFall) / (tLand - tFall));
          if (t > tFall) pose = mixP(DROOP, LIE, fall);
          setSwing(g, LT, pose);
          setSquash(g, TODS[i].R, k);
          // yawn on "tired", asleep from the fall
          var yawn = t > tTired && t < tFall, asleep = t >= tFall;
          g.querySelector(".v-awake").setAttribute("opacity", !yawn && !asleep ? 1 : 0);
          g.querySelector(".v-yawn").setAttribute("opacity", yawn ? 1 : 0);
          g.querySelector(".v-asleep").setAttribute("opacity", asleep ? 1 : 0);
          // the flop: backwards onto the rug (a little bounce on landing), breathing; the girl snuggles into the pillow
          var bounce = t > tLand ? Math.exp(-(t - tLand) * 9) * Math.sin((t - tLand) * 28) * 4 : 0;
          var breathe = t > tLand + 0.4 ? Math.sin((t - tLand) * 2.6 + i * 1.7) * 1.2 : 0;
          var snug = i === 1 ? KIT.smooth((t - tBack1) / 0.3) : 0, wig = i === 1 && t > tBack1 + 0.25 && t < tBack1 + 1.0 ? Math.sin((t - tBack1) * 24) * 2.2 * (1 - (t - tBack1 - 0.25) / 0.75) : 0;
          var yawnLean = yawn ? -6 * Math.sin(Math.PI * Math.min(1, (t - tTired) / (tFall - tTired))) : 0;
          var rot = -90 * fall + 6 * snug + wig + yawnLean;
          body.setAttribute("transform", "translate(0," + f(-24 * fall - bounce) + ") rotate(" + f(rot) + " 0 100) translate(0," + f(breathe) + ")");
        });

        // the Z's: three rising from each sleeper, in turn
        zEls.forEach(function (z, j) {
          var i = j % 2, n = Math.floor(j / 2), age = t - (tLand + 0.35 + n * 0.55 + i * 0.27);
          if (age < 0) { z.setAttribute("opacity", 0); return; }
          var u = (age % 1.65) / 1.65, head = i ? [TXB + 112 * NK, TFEET - 100 * NK + 52 * NK] : [TXA - 112 * NK, TFEET - 100 * NK + 52 * NK];
          var x = head[0] + (i ? -1 : 1) * (10 + 70 * u) + Math.sin(u * 7) * 8, y = head[1] - 30 - 150 * u;
          z.setAttribute("opacity", (Math.sin(Math.PI * u) * 1.2 > 1 ? 1 : Math.sin(Math.PI * u) * 1.2).toFixed(2));
          z.setAttribute("transform", "translate(" + f(x) + "," + f(y) + ") scale(" + (0.6 + 0.6 * u).toFixed(2) + ")");
        });

        // the pillow
        var p = PILLOW0, rot2 = 0, sc2 = 1, wingOn = 0, flap = 0;
        if (t >= tNaps && t < tOut0) { wingOn = KIT.smooth((t - tNaps) / 0.12); flap = Math.sin(t * 40); p = [PILLOW0[0], PILLOW0[1] - 10 * wingOn]; }
        else if (t >= tOut0 && t < tMeet) { var u1 = (t - tOut0) / (tMeet - tOut0); p = bez(OUT, KIT.smooth(u1) * 0.3 + u1 * 0.7); wingOn = 1; flap = Math.sin(t * 34); rot2 = Math.sin(t * 9) * 8; sc2 = 1 - 0.25 * u1; }
        else if (t >= tMeet && t < tKnock) { var u2 = (t - tMeet) / (tKnock - tMeet), e2 = 1 - (1 - u2) * (1 - u2); p = [SWAT[0] + (KNOCK[0] - SWAT[0]) * e2, SWAT[1] + (KNOCK[1] - SWAT[1]) * e2 - Math.sin(Math.PI * u2) * 70]; rot2 = -720 * e2; wingOn = 1; flap = 1; sc2 = 0.75; }
        else if (t >= tKnock && t < tBack0) { p = [KNOCK[0] + Math.sin((t - tKnock) * 5) * 14, KNOCK[1] + Math.sin((t - tKnock) * 3.4) * 10]; wingOn = 1; flap = Math.sin(t * 22); rot2 = Math.sin(t * 4) * 12; sc2 = 0.75; }
        else if (t >= tBack0 && t < tBack1) { var u3 = (t - tBack0) / (tBack1 - tBack0); p = bez(BACK, KIT.smooth(u3)); wingOn = 1; flap = Math.sin(t * 10) * 0.4; rot2 = -10 * Math.sin(Math.PI * u3); sc2 = 0.75 + 0.25 * u3; }
        else if (t >= tBack1) { p = PEND; wingOn = 1 - KIT.smooth((t - tBack1 - 0.25) / 0.35); var lu = t - tBack1; sc2 = 1 + (lu < 0.3 ? 0.12 * Math.sin(lu / 0.3 * Math.PI) : 0); }
        pil.setAttribute("transform", "translate(" + f(p[0]) + "," + f(p[1]) + ")");
        pilIn.setAttribute("transform", "rotate(" + f(rot2) + ") scale(" + (sc2 * (t >= tBack1 && t < tBack1 + 0.3 ? 1.08 : 1)).toFixed(3) + "," + (sc2 * (t >= tBack1 && t < tBack1 + 0.3 ? 0.86 : 1)).toFixed(3) + ")");
        wings.forEach(function (w, s) {
          w.setAttribute("opacity", wingOn.toFixed(2));
          w.setAttribute("transform", "translate(" + (s ? 50 : -50) + ",0) scale(" + Math.max(0.01, wingOn).toFixed(2) + "," + (wingOn * (0.55 + 0.45 * flap)).toFixed(2) + ") translate(" + (s ? -50 : 50) + ",0)");
        });
      });
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
