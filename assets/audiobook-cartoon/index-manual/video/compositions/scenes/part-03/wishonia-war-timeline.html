<template id="wishonia-war-timeline-template">
  <!-- wishonia-war-timeline · Layer A (storyboards/part-03-gradual-irrationality-reduction.md): the office, cut from the
       title card. "We" → Wishonia's old, dusty copy of the manual (GRADUAL IRRATIONALITY REDUCTION PROGRAM) drops onto the
       desk; "ended" → it flops open by itself in a puff of dust; "program" → the wall screen clicks on: a timeline axis;
       "four thousand" → a short teal bar, "PEACE: 4,297 years", and on "years" Part 1's converter bell dings on it;
       "twelve thousand" → a red bar, "WAR: 12,000 years", grows left, hits the bezel and prints out through it as a red paper
       tape with a row of grinning antenna skulls (Wishonia's ancestors); "which now seems" → it spills down the wall and
       loops onto the floor; "quite a long time" → the loops pile up past the desk; "enjoyed." → the tape zips back into the
       screen like a tape measure, the last skull waving, the screen wobbles and settles; then it clicks over to Earth:
       nations-foam-bats' first frame (the drawing code is copied from there). -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #112845; }
    #wishonia-war-timeline-cam, #wishonia-war-timeline-bg, #wishonia-war-timeline-screen, #wishonia-war-timeline-tape, #wishonia-war-timeline-wish, #wishonia-war-timeline-front, #wishonia-war-timeline-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="wishonia-war-timeline" data-width="1920" data-height="1080" data-start="0" data-duration="15.38">
    <div id="wishonia-war-timeline-cam">
      <div id="wishonia-war-timeline-bg"></div>
      <div id="wishonia-war-timeline-screen"></div>
      <div id="wishonia-war-timeline-wish"></div>
      <div id="wishonia-war-timeline-tape"></div>
      <div id="wishonia-war-timeline-front"></div>
    </div>
    <div id="wishonia-war-timeline-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/places.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script>
    (function () {
      var ID = "wishonia-war-timeline";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, O = KIT.OFFICE, ink = C.line;

      // ── The two nations: the same drawing in wishonia-war-timeline (its wall screen after "enjoyed."), nations-foam-bats
      //    (the scene) and toddlers-take-nap (its skeleton panel from "refused"). Keep the three copies the same. ──
      // Two plain islands across a strait (no flags, no country outlines), a little capitol on each, a Politician on each
      // with a raised orange foam bat (left: tone 1, red tie; right: tone 3, blue tie), a tear-off calendar on a post in the
      // strait, six tiny mushroom clouds (hidden), and what the years do to it all: white hair, beards down to the shoes,
      // grinning skeletons (with the wide tie put back on), smoking craters, "YEAR 10,000", two "HE HIT ME LAST" bubbles.
      // nationsLayout(tall): the layout for a 9:16 (tall) or 16:9 frame. nationsArt(pid, L, state): { svg, geo }; every id
      // is pid + "-" + name. state "first" (alive, bats up, capitols, YEAR 1) or "last" (skeletons with beards, craters,
      // YEAR 10,000). Bat arms: #pid-A-alive .arm-r, #pid-A-bones .arm-r, #pid-A-bat, #pid-A-bbat (B: .arm-l); they all turn
      // about geo.A.sh (B: geo.B.sh) by geo.hit degrees (B: -geo.hit) to bonk the other's head, or by geo.poke to jab
      // the other one in the chest. The free arms (A: .arm-l, B: .arm-r) turn about geo.A.back (B: geo.B.back).
      // The person groups sit at (geo.XA or geo.XB, geo.Y0), scaled geo.s.
      function nationsLayout(tall) {
        return tall
          ? { W: 1080, H: 1920, s: 2.1, mid: 540, feet: 1185, isles: [[46, 424, 1191], [656, 1034, 1191]], sea: [1184, 1874],
              caps: [[132, 0.36], [948, 0.36]], cal: { x: 540, foot: 1440, post: 70, k: 1.38 }, bub: [[205, 640], [875, 640]], bubFs: 38,
              clouds: [[255, 1191], [835, 1191], [80, 1191], [1000, 1191], [180, 1191], [900, 1191]] }
          : { W: 1920, H: 1080, s: 1.9, mid: 860, feet: 790, isles: [[96, 728, 796], [992, 1590, 796]], sea: [788, 1034],
              caps: [[330, 0.5], [1390, 0.5]], cal: { x: 860, foot: 950, post: 84, k: 1.5 }, bub: [[400, 300], [1320, 300]], bubFs: 46,
              clouds: [[1222, 796], [498, 796], [1530, 796], [176, 796], [1330, 796], [392, 796]] };
      }
      function nationsArt(pid, L, state) {
        var ink = C.line, last = state === "last", s = L.s, HAIR = "#112846", WHITE_HAIR = "#ECE7DA";
        function P(x, y) { return x.toFixed(1) + "," + y.toFixed(1); }
        function polyD(pts) { return "M" + pts.map(function (p) { return P(p[0], p[1]); }).join(" L") + " Z"; }
        function solid(pts, col, w) {
          return '<path d="' + polyD(pts) + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="' + (w || 4.4) + '" stroke-linejoin="miter" stroke-miterlimit="8"/><path d="' + polyD(pts) + '" fill="' + col + '"/>';
        }
        function line(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linejoin="miter" stroke-linecap="round"/>'; }
        function hide(on) { return on ? ' opacity="0"' : ""; }
        var defs = KIT.paperDefs(pid + "-n");
        // The sea and the two islands.
        var sea = '<rect x="46" y="' + L.sea[0] + '" width="' + (L.W - 92) + '" height="' + (L.sea[1] - L.sea[0]) + '" fill="' + C.cyan + '"/>' +
          '<rect x="46" y="' + L.sea[0] + '" width="' + (L.W - 92) + '" height="' + (L.sea[1] - L.sea[0]) + '" fill="url(#' + pid + '-n-hteal)" opacity="0.25"/>' +
          '<path d="M46,' + L.sea[0] + " H" + (L.W - 46) + '" stroke="' + ink + '" stroke-width="4"/>';
        var rw = KIT.rng(L.W + 7);
        for (var k = 0; k < 16; k++) {
          var wx = 80 + rw() * (L.W - 220), wy = L.sea[0] + 40 + rw() * (L.sea[1] - L.sea[0] - 80);
          sea += line("M" + P(wx, wy) + " q12,-9 24,0 q12,9 24,0", ink, 2.4);
        }
        var isles = L.isles.map(function (is) {
          var x0 = is[0], x1 = is[1], t = is[2];
          var pts = [[x0, t + 16], [x0 + 26, t], [x1 - 30, t - 2], [x1, t + 14], [x1 - 16, t + 74], [x0 + 20, t + 80]];
          return solid(pts, C.tan) + '<path d="' + polyD(pts) + '" fill="url(#' + pid + '-n-hatch)" opacity="0.18"/>' +
            line("M" + P(x0 + 30, t + 3) + " L" + P(x1 - 34, t + 1), C.orange, 3) + line("M" + P(x0 + 22, t + 64) + " L" + P(x1 - 20, t + 58), ink, 1.6);
        }).join("");
        // The capitols, and the smoking craters they turn into.
        var caps = L.caps.map(function (c, i) {
          var t = L.isles[i][2], w = 449 * c[1];
          var rim = [[-w * 0.5, 4], [-w * 0.42, -14], [-w * 0.3, -6], [-w * 0.2, -24], [-w * 0.06, -12], [w * 0.06, -28], [w * 0.2, -10], [w * 0.3, -22], [w * 0.42, -8], [w * 0.5, 4]];
          var wisps = [-0.24, 0.02, 0.26].map(function (f, j) {
            return '<g transform="translate(' + P(c[0] + f * w, t - 20) + ')"><g class="' + pid + '-wisp" data-i="' + (i * 3 + j) + '">' +
              line("M0,0 q-10,-14 0,-28 q10,-14 0,-28 q-10,-14 0,-28", "#8C8782", 7) + "</g></g>";
          }).join("");
          return '<g id="' + pid + "-cap-" + i + '"' + hide(last) + '><g transform="translate(' + c[0] + "," + t + ") scale(" + c[1] + ')"><g id="' + pid + "-capb-" + i + '">' + KIT.props.capitol({}) + "</g></g></g>" +
            '<g id="' + pid + "-crater-" + i + '"' + hide(!last) + '><g transform="translate(' + c[0] + "," + t + ')">' +
            solid(rim, C.rust, 4) + '<path d="M' + P(-w * 0.34, 0) + " Q0," + (-w * 0.12).toFixed(1) + " " + P(w * 0.34, 0) + " Q0," + (w * 0.05).toFixed(1) + " " + P(-w * 0.34, 0) + ' Z" fill="#2A221C" stroke="' + ink + '" stroke-width="3"/>' +
            solid([[-w * 0.16, -18], [-w * 0.1, -34], [-w * 0.02, -22]], C.cream, 3) + solid([[w * 0.12, -14], [w * 0.2, -30], [w * 0.26, -12]], C.cream, 3) + "</g>" + wisps + "</g>";
        }).join("");
        // The calendar on its post: pages 1, 10, 100 ... 8,500 tear off; YEAR 10,000 is under them.
        var CL = L.cal, labels = ["1", "10", "100", "600", "1,500", "3,000", "6,000", "8,500", "10,000"];
        var cal = KIT.props.calendar({ month: "YEAR", day: 1, pages: 8 }).replace(/(<g class="cal-page(?:-under)?" data-day=")(\d+)("[\s\S]*?font-size=")(\d+)(" fill="#112845">)(\d+)(<\/text>)/g, function (m, a, d, b, fs, c2, d2, e) {
          var lab = labels[+d - 1], size = lab.length <= 2 ? 44 : lab.length <= 3 ? 34 : lab.length <= 5 ? 23 : 20;
          return a + d + b + size + c2 + lab + e;
        });
        if (last) cal = cal.replace(/<g class="cal-page" /g, '<g class="cal-page" opacity="0" ');
        var calTop = CL.foot - CL.post;
        var calSvg = '<ellipse cx="' + CL.x + '" cy="' + CL.foot + '" rx="30" ry="8" fill="none" stroke="' + ink + '" stroke-width="3"/>' +
          solid([[CL.x - 7, CL.foot], [CL.x - 7, calTop], [CL.x + 7, calTop], [CL.x + 7, CL.foot]], C.rust, 3.4) +
          '<g transform="translate(' + CL.x + "," + calTop + ") scale(" + CL.k + ')"><g id="' + pid + '-cal">' + cal + "</g></g>";
        // The Politicians: A on the left (looking right), B on the right (looking left), each with a foam bat in the front
        // hand. The geometry puts B where A's bat, turned by `hit` degrees about A's shoulder, lands on B's head (and back).
        var PA = KIT.castOpts("politician", { tone: 1, look: "right", tieColor: C.war, hairColor: HAIR, arms: [[-14, 16], [150, 200]] });
        var PB = KIT.castOpts("politician", { tone: 3, look: "left", tieColor: C.peri, hairColor: HAIR, arms: [[-150, -200], [14, -16]] });
        var RA = KIT.rig(PA), RB = KIT.rig(PB), BAT = 150, deg = 180 / Math.PI;
        function batGeo(R, i, arm) {
          var sh = R.shoulder[i], a1 = arm[0] / deg, el = [sh[0] + R.armLength * Math.sin(a1), sh[1] + R.armLength * Math.cos(a1)], hd = R.hand[i];
          var dx = hd[0] - el[0], dy = hd[1] - el[1], d = Math.sqrt(dx * dx + dy * dy), u = [dx / d, dy / d];
          return { sh: sh, hand: hd, u: u, head: [hd[0] + u[0] * (BAT - 14), hd[1] + u[1] * (BAT - 14)] };
        }
        var gA = batGeo(RA, 1, PA.arms[1]), gB = batGeo(RB, 0, PB.arms[0]);
        var r = Math.sqrt(Math.pow(gA.head[0] - gA.sh[0], 2) + Math.pow(gA.head[1] - gA.sh[1], 2));
        var tgt = [RB.top[0] + 3, RB.top[1] - 9], dy = tgt[1] - gA.sh[1], dx = Math.sqrt(r * r - dy * dy);
        var gap = dx + gA.sh[0] - tgt[0], hit = (Math.atan2(dy, dx) - Math.atan2(gA.head[1] - gA.sh[1], gA.head[0] - gA.sh[0])) * deg;
        var XA = L.mid - (gap * s) / 2, XB = L.mid + (gap * s) / 2, Y0 = L.feet - 100 * s;
        // the poke: the bat turned to jab the other one instead (A at B's face, B at A's belly, so the bats cross)
        var aim = function (x, y) { return (Math.atan2(y - gA.sh[1], gap + x - gA.sh[0]) - Math.atan2(gA.head[1] - gA.sh[1], gA.head[0] - gA.sh[0])) * deg; };
        var pokeA = aim(-10, -62), pokeB = aim(-8, -8);
        function bat(g, id) {
          var a = Math.atan2(g.u[1], g.u[0]) * deg, len = BAT;
          var body = [[18, -5], [len - 30, -17], [len - 7, -19], [len, -12], [len, 12], [len - 7, 19], [len - 30, 17], [18, 5]];
          var grip = [[-5, -3.8], [20, -4.8], [20, 4.8], [-5, 3.8]];
          return '<g id="' + id + '"><g transform="translate(' + P(g.hand[0], g.hand[1]) + ") rotate(" + a.toFixed(2) + ')">' +
            solid(body, C.orange, 3.6) + line("M28,-7 L" + (len - 22) + ",-13", C.cream, 3) + line("M" + (len - 5) + ",-12 V12", C.rust, 2.4) + line("M" + (len - 34) + ",7 L" + (len - 12) + ",8", C.rust, 1.6) +
            solid(grip, C.yellow, 3) + line("M3,-4.2 V4.2 M10,-4.5 V4.5", ink, 1.4) + solid([[-9, -5], [-4, -5], [-4, 5], [-9, 5]], C.rust, 2.6) + "</g></g>";
        }
        // a beard down to the shoes (face units: the face looks +x; the shoes are at person y 100)
        function beard(R, id, col) {
          var toe = (100 - R.hy) / R.hs - 4;
          return '<g class="' + pid + '-beard" id="' + id + '"' + hide(!last) + '>' + solid([[-8, 18], [2, 26], [12, 29], [20, 23], [22, 46], [16, 64], [19, 84], [12, 104], [14, 124], [8, toe], [4, toe - 14], [0, toe - 3], [-3, 122], [-7, 102], [-4, 82], [-9, 62], [-7, 46]], col, 2.6) +
            line("M6,40 L8,70 L5,96 M13,46 L12,76 L9,120 M0,44 L-1,66 L1,90 M4,104 L5,134", "#A9A49B", 1.5) + "</g>";
        }
        function tie(R) {
          var T = R.shoulder[0][1] - 3;
          return solid([[-3, T + 1], [3, T + 1], [12, T + 20], [0, T + 30], [-12, T + 20]], C.war, 2.4);
        }
        function pol(name, o, R, g, X) {
          var alive = KIT.person(o).replace('fill="' + HAIR + '"', 'class="' + pid + '-hair" fill="' + (last ? WHITE_HAIR : ink) + '"').replace("<!--face-end-->", beard(R, pid + "-" + name + "-beard", "#F4F1EA") + "<!--face-end-->");
          var bones = KIT.person(Object.assign({}, o, { skeleton: true })).replace("<!--face-end-->", beard(R, pid + "-" + name + "-bbeard", "#FBF8F0").replace(' opacity="0"', "") + "<!--face-end-->");
          var tieSvg = tie(R).replace(/#C8452E/g, o.tieColor);
          return '<g transform="translate(' + P(X, Y0) + ") scale(" + s + ')"><g id="' + pid + "-" + name + '">' +
            '<g id="' + pid + "-" + name + '-alive"' + hide(last) + ">" + alive + bat(g, pid + "-" + name + "-bat") + "</g>" +
            '<g id="' + pid + "-" + name + '-bones"' + hide(!last) + ">" + bones + tieSvg + bat(g, pid + "-" + name + "-bbat") + "</g></g></g>";
        }
        var pols = pol("A", PA, RA, gA, XA) + pol("B", PB, RB, gB, XB);
        // Six tiny mushroom clouds, hidden until they go off.
        var clouds = L.clouds.map(function (c, i) {
          return '<g transform="translate(' + c[0] + "," + c[1] + ') scale(0.2)"><g id="' + pid + "-cl-" + i + '" opacity="0">' + KIT.nuke() + "</g></g>";
        }).join("");
        // The two bubbles, hidden: tails to the skulls.
        function bubble(i, X, R) {
          var b = L.bub[i], fs = L.bubFs, w = fs * 7.1, h = fs * 1.75, x0 = b[0] - w / 2, y0 = b[1] - h / 2, c = 9;
          var hx = X + R.top[0] * s, hy = Y0 + R.top[1] * s - 14, tb = b[0] + (i ? -w * 0.28 : w * 0.28);
          var pts = [[x0 + c, y0], [x0 + w - c, y0], [x0 + w, y0 + c], [x0 + w, y0 + h - c], [x0 + w - c, y0 + h]].concat(
            i ? [[tb + 16, y0 + h], [hx, hy], [tb - 16, y0 + h]] : [[tb + 16, y0 + h], [hx, hy], [tb - 16, y0 + h]],
            [[x0 + c, y0 + h], [x0, y0 + h - c], [x0, y0 + c]]);
          return '<g id="' + pid + "-bub-" + i + '" opacity="0">' + solid(pts, "#FBF6E6", 5) +
            '<text x="' + b[0] + '" y="' + (b[1] + fs * 0.36).toFixed(1) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + fs + '" letter-spacing="1" fill="' + ink + '">HE HIT ME LAST</text></g>';
        }
        var bubs = bubble(0, XA, RA) + bubble(1, XB, RB);
        return {
          svg: defs + sea + isles + caps + calSvg + pols + clouds + bubs,
          geo: { s: s, feet: L.feet, Y0: Y0, XA: XA, XB: XB, hit: hit, pokeA: pokeA, pokeB: pokeB, RA: RA, RB: RB, A: { sh: gA.sh, head: gA.head, back: RA.shoulder[0], neck: RA.neck }, B: { sh: gB.sh, head: gB.head, back: RB.shoulder[1], neck: RB.neck },
            beardPivot: "2 18", cal: CL, caps: L.caps, clouds: L.clouds },
        };
      }
      // ── end of the nations drawing ──

      // ── The scene ──
      var S = O.screen, hole = [S[0] + 34, S[1] + 34, S[2] - 68, S[3] - 68], hx1 = hole[0] + hole[2];
      // Per shape: the timeline (axis y; the teal bar's ends; label sizes), the manual (x on the desk, scale), the mug,
      // and the tape's pile on the floor (rows of loops: center y, from x, to x; loop radius and advance).
      var L = V
        ? { ay: 520, teal: [690, 930], fs: 30, warFs: 36, man: [880, 1.45], mug: [952, 1173, 1.1],
            wallX: 30, rows: [[1203, 40, 288], [1140, 288, 46], [1077, 46, 288], [1014, 288, 52], [951, 52, 280]], loop: [40, 17], skullK: 1, gapU: 88 }
        : { ay: 510, teal: [592, 846], fs: 30, warFs: 36, man: [1196, 2], mug: [1775, 800, 1.5],
            wallX: 40, rows: [[958, 70, 900], [888, 900, 84], [818, 84, 820], [752, 820, 150]], loop: [52, 25], skullK: 1.15, gapU: 104 };
      var ay = L.ay, by = ay - 44, bh = 40, bc = by + bh / 2;

      q("bg").innerHTML = KIT.office(O.halo[0], O.halo[1]);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));
      function txt(x, y, size, fam, fill, text, extra) {
        return '<text x="' + x + '" y="' + y + '" font-family="' + fam + '" font-weight="' + (fam === "Fraunces" ? 900 : 600) + '" font-size="' + size + '" fill="' + fill + '" ' + (extra || "") + ">" + text + "</text>";
      }

      // ── The wall screen: off, then the timeline, then (after "enjoyed.") Earth: nations-foam-bats' first frame ──
      var ticks = "";
      for (var x = hole[0] + 60; x < hx1 - 40; x += 58) ticks += "M" + x + "," + (ay - 8) + " V" + (ay + 8) + " ";
      var axis = '<g id="' + ID + '-axis"><path id="' + ID + '-axl" d="M' + (hole[0] + 24) + "," + ay + " H" + (hx1 - 30) + '" stroke="' + ink + '" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>' +
        '<g id="' + ID + '-axd" opacity="0"><path d="' + ticks + '" stroke="' + ink + '" stroke-width="3"/><path d="M' + (hx1 - 34) + "," + (ay - 12) + " L" + (hx1 - 14) + "," + ay + " L" + (hx1 - 34) + "," + (ay + 12) + ' Z" fill="' + ink + '"/>' +
        txt(hx1 - 40, ay + 38, 24, "Oswald", ink, "NOW", 'text-anchor="end" letter-spacing="2"') + "</g></g>";
      var teal = '<rect id="' + ID + '-teal" x="' + L.teal[0] + '" y="' + by + '" width="0" height="' + bh + '" fill="' + C.med + '" stroke="' + ink + '" stroke-width="4"/>';
      var peace = '<g id="' + ID + '-peace" opacity="0">' + txt((L.teal[0] + L.teal[1]) / 2, by - 22, L.fs, "Oswald", "#1F6E68", "PEACE: 4,297 years", 'text-anchor="middle" letter-spacing="1"') + "</g>";
      var red = '<rect id="' + ID + '-red" x="' + L.teal[0] + '" y="' + by + '" width="0" height="' + bh + '" fill="' + C.war + '" stroke="' + ink + '" stroke-width="4"/>';
      var war = '<g id="' + ID + '-war" opacity="0">' + txt((hole[0] + L.teal[0]) / 2, by - 22, L.warFs, "Oswald", C.war, "WAR: 12,000 years", 'text-anchor="middle" letter-spacing="1"') + "</g>";
      // the converter's bell from meet-wishonia, standing on the PEACE label
      var bellAt = [L.teal[1] - 26, by - 22 - L.fs - 8];
      var bell = '<g transform="translate(' + bellAt[0] + "," + bellAt[1] + ')"><g id="' + ID + '-bell" opacity="0"><g transform="translate(-300,0)">' +
        '<rect x="296" y="-12" width="8" height="12" fill="' + C.ink + '"/><path d="M278,-12 A22,22 0 0 1 322,-12 Z" fill="' + C.yellow + '" stroke="' + C.ink + '" stroke-width="4"/><circle cx="300" cy="-36" r="5" fill="' + C.ink + '"/></g>' +
        '<path id="' + ID + '-ding" d="M0,-48 V-62 M-28,-36 L-40,-46 M28,-36 L40,-46" stroke="' + C.ink + '" stroke-width="4" stroke-linecap="round" opacity="0"/></g></g>';
