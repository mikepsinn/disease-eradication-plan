        '<g id="' + ID + '-puff" opacity="0">' + [[0, 0, 9], [-16, -8, 7], [-28, -20, 5]].map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="2"/>'; }).join("") + "</g>" ;
      KIT.studio(tl, ID, { cam: q("cam"), wall: q("wall"), wish: q("wish"), front: q("front") }, { front: front, push: [1.0, 1.05] });
      var dogEl = q("dog"), dogIn = q("dog-in"), chipEl = q("chip"), chipIn = q("chip-in"), puffEl = q("puff");
      var shown = function (n) { Object.keys(DRAW).forEach(function (m) { q("d-" + m).setAttribute("opacity", m === n ? 1 : 0); }); };
      var crossPupils = Array.prototype.slice.call(q("d-cross").querySelectorAll(".pupil"));
      var tails = Array.prototype.slice.call(dogEl.querySelectorAll(".dog-tail"));

      // ── Cues ──
      var tUntil = cue("until"), tPaint = cue("paint"), tEver = cue("ever"), tOpt = cue("option."), tEnd = KIT.cueEnd(ID, "option.");
      var IN0 = tUntil, IN1 = tUntil + 0.95, SIT = IN1 + 0.08, X0 = W + 220;
      var tFlick = tOpt + 0.06;

      // a point in the head's units to the canvas, for a drawing (the dog is mirrored to face her)
      var toCanvas = function (o, p, x, y) { var d = DOG.point(o, p); return [x - k * d[0], y + k * d[1]]; };

      KIT.onTime(tl, D, function (t) {
        // where the dog is: trotting in with a bob, then sitting with a little settle
        var u = clamp((t - IN0) / (IN1 - IN0)), x = X0 + (DOG_AT[0] - X0) * (1 - (1 - u) * (1 - u) * (1 - u)), y = DOG_AT[1];
        var trot = t < IN1, ph = (t - IN0) * 13, bob = 0;
        if (trot) bob = -Math.abs(Math.sin(ph)) * 7 * k;
        else if (t < SIT + 0.25) bob = Math.sin(clamp((t - IN1) / 0.25) * Math.PI) * 4 * k;
        var name = trot ? (Math.floor(ph / Math.PI) % 2 ? "trotB" : "trotA") : t < tPaint ? "sit" : t < tEver ? "teeter" : t < tOpt ? "cross" : "snub";
        shown(name);
        dogEl.setAttribute("transform", "translate(" + f(x) + "," + f(y + bob) + ") scale(" + (-k) + "," + k + ")");
        tails.forEach(function (tg) { tg.setAttribute("transform", "rotate(" + f(t > tOpt ? 0 : Math.sin(t * 22) * 16) + " " + tg.getAttribute("data-pivot") + ")"); });
        // the teeter: the chip rocks on its nose, and the dog steadies it, its head following the other way
        var wob = 0;
        if (t > tPaint && t < tEver) { var w = t - tPaint; wob = Math.sin(w * 15) * 20 * Math.exp(-w * 2.2); }
        var hd = q("d-teeter").querySelector(".dog-head");
        hd.setAttribute("transform", "rotate(" + f(-wob * 0.35) + " " + hd.getAttribute("data-pivot") + ")");
        // cross-eyed at the chip on the bridge of its nose
        crossPupils.forEach(function (p, i) { p.setAttribute("transform", "translate(" + (i ? -2.4 : 2.4) + ",1.4)"); });

        // the chip: on its nose until the flick, then up and away, tumbling
        var o = DRAW[name], cx, cy, r = -8;
        if (t < tFlick) {
          var rest = o.head === "front" ? REST_FRONT : REST_SIDE, p0 = toCanvas(o, rest, x, y + bob);
          if (name === "teeter") p0 = toCanvas({ pose: "sit", tilt: o.tilt - wob * 0.35 }, REST_SIDE, x, y + bob);
          cx = p0[0]; cy = p0[1]; r = (o.head === "front" ? 0 : 10) + wob + (trot ? Math.sin(ph * 2) * 8 : 0);
          // the chip bounces a little behind the dog while it trots
          if (trot) cy -= Math.abs(Math.cos(ph)) * 3 * k;
        } else {
          var a = toCanvas(DRAW.snub, REST_SIDE, x, y), fu = t - tFlick;
          cx = a[0] - 160 * fu; cy = a[1] - 1500 * fu + 900 * fu * fu;
          r = 10 + fu * 900;
        }
        chipEl.setAttribute("transform", "translate(" + f(cx) + "," + f(cy) + ")");
        chipIn.setAttribute("transform", "rotate(" + f(r) + ") scale(" + (CHIP_K * k * 1.22 * (name === "cross" ? 0.72 : 1)).toFixed(3) + ")");
        // the snort: a puff at its nostril as it flicks the chip off
        var pu = t - tOpt;
        puffEl.setAttribute("opacity", pu > 0 && pu < 0.6 ? f(1 - pu / 0.6) : 0);
        if (pu > 0) { var nz = toCanvas(DRAW.snub, [40, 2], x, y); puffEl.setAttribute("transform", "translate(" + f(nz[0] - 6 - pu * 50) + "," + f(nz[1] + 4 - pu * 30) + ") scale(" + f(k * (0.6 + pu)) + ")"); }
      });

      // ── The iris closes on her face after "option.", and the part ends on black.
      KIT.iris(tl, ID, q("iris"), S.face, "out", tEnd + 0.06, D - 0.06);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
