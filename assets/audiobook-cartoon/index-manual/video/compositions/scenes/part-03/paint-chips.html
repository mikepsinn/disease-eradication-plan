          out += '<path d="M' + f(face[0] + 30) + "," + f(face[1] + d[0] * 0.4) + " L" + f(CRACK[0] + d[1] * 0.6) + "," + f(CRACK[1] + d[0] * 0.5) + '" stroke="' + TEAR + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 14" stroke-dashoffset="' + f(-t * 400) + '"/>';
        });

      }

      KIT.onTime(tl, D, function (t) {
        camera.place(cam, camera.at(t));

        // the baby
        var bp = babyPose(t);
        Object.keys(BPOSE).forEach(function (n) { show(q("b-" + n), n === bp); });
        // chewing (after each crunch) and a little crunch jolt
        var lb = lastBite(t), chew = 0;
        if (lb && t - lb[0] < 0.55 && bp !== "wail" && bp !== "pout") chew = Math.sin((t - lb[0]) * 40) * 5 * (1 - (t - lb[0]) / 0.55);
        if (bp === "wail") chew = Math.sin(t * 46) * 3;

        bowlEl.setAttribute("transform", "translate(" + f(bp2[0]) + "," + f(bp2[1]) + ")");
        bowlIn.setAttribute("transform", "scale(" + (1 + sq).toFixed(3) + "," + (1 - sq).toFixed(3) + ")");

          var s = SWAPS[k], d = k < 3 ? 0.08 : 0.04, c = q("chip" + slot), p = q("pea" + slot);
          if (t < s) { show(c, 1); show(p, 0); c.removeAttribute("transform"); return; }
          if (t < s + d) { show(c, 1); show(p, 0); c.setAttribute("transform", "scale(" + (1 - (t - s) / d).toFixed(3) + ",1)"); return; }
          show(c, 0); show(p, 1);

          p.setAttribute("transform", "scale(" + pop.toFixed(3) + ")");
        });

        // the tear jets: out on "cry.", stopped dead when the bowl comes back
        var face = (function () { var e = mRig.hit.eyes; return rot([MX + e[0] * MK, MY + e[1] * MK], FEET, leanAt(t)); })();
        if (t > T.cry && t < T.slam) {
          var u2 = smooth((t - T.cry) / 0.16), u3 = smooth((t - T.cry) / 0.32), ph = t * 30;
          var L = jetPath(EYE_L, [SPLAT[0] + 30, SPLAT[1]], u3, ph, 7, 26, 40), R2 = jetPath(EYE_R, [face[0] + 18, face[1] + 2], u2, ph + 1, 7, 24, 26);
          jetL.setAttribute("d", L.d); jetR.setAttribute("d", R2.d); shineL.setAttribute("d", L.shine); shineR.setAttribute("d", R2.shine);
        } else { jetL.setAttribute("d", ""); jetR.setAttribute("d", ""); shineL.setAttribute("d", ""); shineR.setAttribute("d", ""); }
        var spraying = t > T.hit && t < T.slam;
        show(sprayEl, spraying);
        if (spraying) sprayEl.innerHTML = sprayAt(t, face);
        // the splat on the wall and the crack in the window stay
