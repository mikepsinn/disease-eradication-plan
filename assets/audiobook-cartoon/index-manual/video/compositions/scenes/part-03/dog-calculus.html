        Array.prototype.forEach.call(flamesA, function (fl) { fl.setAttribute("transform", "scale(" + (fu < 1 ? fu * 1.15 : 1).toFixed(3) + ")"); });

        // which dog drawing: writing, staring (learns), soaked and charred (the water hits), sitting (the plop), and a blink
        var di = t < tLearns ? 0 : t < tHit ? 1 : t < tPlop ? 2 : (t > tPlop + 0.36 && t < tPlop + 0.48) ? 4 : 3;
        dogs.forEach(function (d, i) { show(d, i === di); });
        // the plop: a stretch as it drops, a squash as it lands, then it settles
        var pu = t - tPlop, sx = 1, sy = 1;
        if (pu > -0.07 && pu < 0) { sx = 0.92; sy = 1.14; }
        else if (pu >= 0 && pu < 0.24) { var e = Math.exp(-pu * 16) * Math.cos(pu * 34); sx = 1 + 0.14 * e; sy = 1 - 0.2 * e; }
        sq.setAttribute("transform", "scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")");
        // the stub tail thumps once
        var th = clamp((t - tPlop - 0.22) / 0.2), ta = -24 * Math.sin(Math.PI * th);
        tails.forEach(function (e) { pivRot(e, ta); });
        show(smokeEl, t >= tPlop);
        smokeEl.setAttribute("transform", "translate(0," + f1(-3 * Math.sin((t - tPlop) * 9)) + ")");

        // the Scientist: raps the board twice on "teaching", goes worried and raises the flask when the fire starts,
        // steps in and upends it on "sit.", then steps back, smug
        var tap = TAPS.some(function (tt) { return t >= tt - 0.09 && t < tt; });
        var pose = t < tBefore + 0.1 ? (tap ? "tap" : "rest") : t < tSit ? "raise" : t < tHit + 0.3 ? "pour" : "smug";
        Object.keys(POSES).forEach(function (n, i) { show(sciPoses[i], n === pose); });
        var stepU = t < tSit - 0.12 ? 0 : t < tHit + 0.3 ? smooth((t - tSit + 0.12) / 0.14) : 1 - smooth((t - tHit - 0.3) / 0.25);
        sciEl.setAttribute("transform", "translate(" + f1(SX - STEP * stepU) + "," + f1(SY) + ")");
        Array.prototype.forEach.call(bubbles, function (b) { b.setAttribute("transform", "translate(0," + f1(-2.5 * Math.abs(Math.sin(t * 7))) + ")"); });

        // the pour: the water falls from the flask's mouth onto its head, a splash, a hiss of steam
        var wu2 = clamp((t - tSit - 0.02) / 0.12);
        show(streamEl, t > tSit && t < tHit + 0.24);
        streamEl.setAttribute("transform", "translate(" + f1(MOUTH[0]) + "," + f1(MOUTH[1]) + ") scale(1," + Math.max(0.01, wu2).toFixed(3) + ") translate(" + f1(-MOUTH[0]) + "," + f1(-MOUTH[1]) + ")");
        var spu = clamp((t - tHit) / 0.34);
        show(splashEl, spu > 0 && spu < 1);
        splashEl.setAttribute("transform", "scale(" + (0.3 + spu).toFixed(3) + ")");
        splashEl.setAttribute("opacity", spu > 0 && spu < 1 ? (1 - spu * spu).toFixed(2) : 0);
        var hu = clamp((t - tHit - 0.04) / 0.55);
        hissEl.setAttribute("opacity", hu > 0 && hu < 1 ? (1 - hu).toFixed(2) : 0);
        hissEl.setAttribute("transform", "translate(0," + f1(-50 * hu) + ")");
        // drips off the ears and chin, and a puddle
        dripEls.forEach(function (e, i) {
          var hp = DOG.point({ pose: "stand" }, [[-18, 8], [16, 10], [2, 16]][i]), u = clamp((t - tHit - 0.06 - i * 0.07) / (0.3 + i * 0.05));
          show(e, u > 0 && u < 1);
          e.setAttribute("transform", "translate(" + f1(hp[0]) + "," + f1(hp[1] + (-4 - hp[1]) * u * u) + ")");
        });
        var pdu = clamp((t - tHit - 0.08) / 0.25);
        show(puddleEl, pdu > 0);
        puddleEl.setAttribute("transform", "translate(4,1) scale(" + (0.3 + 0.7 * pdu).toFixed(3) + ",1) translate(-4,-1)");
      });

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
