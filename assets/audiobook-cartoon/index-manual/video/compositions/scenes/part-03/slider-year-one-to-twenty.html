  <!-- slider-year-one-to-twenty · Layer B (storyboards/part-03-gradual-irrationality-reduction.md). A clean copy of the
       manual drops and flops open; a pop-up slider rises out of its pages: MURDER MONEY (a pile of war money on the bar,
       the factory, the Weapons Maker at his bench) to MEDICINE MONEY (the hospital). The color-flip funnel drops onto
       the knob, the title card's snail climbs onto its rim, and each year war bills hop in and walk out as medicine
       money (Year 1's bill turns over beside the funnel, its red missile seal flipping to the teal cross) while the
       knob creeps right, the war pile melts and the human under it grows up: a baby (1%), a toddler (2%), a kid whose
       missile goes off in the Weapons Maker's arms, a teen who has never heard of war, and an adult whose eyes pop out

       its summit, filling the sky left of Wishonia's saucer, and the sign rides it down as it melts. -->

  </style>
  <div id="root" data-composition-id="slider-year-one-to-twenty" data-width="1920" data-height="1080" data-start="0" data-duration="28.64">

      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, WHITE = "#FBF6E6";
      var P = ID + "-";

      // ── Layout, per shape ─────────────────────────────────────────────

      var L = V

            bench: [262, 170, 1228], hospital: [906, 0.7], heap: [915, 1398, 0.5], tag: [16, 58, 88, 34, 21], manual: [540, 1420, 2.9], nuke: 0.62, snail: 1.3,
            gap: [100, 84, 136], smk: 34 }
        : { book: [70, 1590, 772, 1000, 830], back: 800, ground: 885, S: 2.0, bar: [96, 1574, 330, 44], track: [820, 1400],

            hospital: [1440, 0.95], heap: [1458, 872, 0.55], tag: [18, 62, 104, 36, 23], manual: [830, 925, 2.6], nuke: 0.6, snail: 1.2,
            gap: [110, 82, 128], smk: 62 };
      var S = L.S, BT = L.bar[2], BB = L.bar[2] + L.bar[3], GR = L.ground, BK = L.back, FS = L.fs;
      var KTOP = BT - 20;                       // the knob's top, where the funnel's feet stand

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // ── Helpers ───────────────────────────────────────────────────────
      function g(id, inner, attrs) { return '<g id="' + P + id + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
      function hid(id, inner) { return g(id, inner, 'opacity="0"'); }
      function at(x, y, s, inner) { return '<g transform="translate(' + (+x).toFixed(1) + "," + (+y).toFixed(1) + ")" + (s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; }
      function rect(x, y, w, h, fill, extra) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + fill + '" ' + (extra || "") + "/>"; }
      var st = function (w) { return 'stroke="' + ink + '" stroke-width="' + w + '" stroke-linejoin="miter"'; };

      }
      function pts(a) { return a.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
      function poly(a, fill, w) { return '<polygon points="' + pts(a) + '" fill="' + fill + '" ' + st(w || 3) + "/>"; }
      function ext(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      var show = function (id, t) { tl.set(q(id), { opacity: 1 }, t); };
      var hide = function (id, t) { tl.set(q(id), { opacity: 0 }, t); };
      // One drawing of a set at a time: [[t, id], ...]; the first shows at its time (or from the start at 0).
      function swaps(list) { list.forEach(function (s, i) { if (i) hide(list[i - 1][1], s[0]); if (i || s[0] > 0) show(s[1], s[0]); }); }

      // A flat bill (no legs), for the pile and the heap: money green, its seal saying what it buys.
      function flat(kind, s) {
        return '<g transform="scale(' + s + ')"><rect x="-48" y="-25" width="96" height="50" rx="3" fill="' + C.money + '" ' + st(4) + "/>" +
          '<rect x="-40" y="-18" width="80" height="36" fill="none" stroke="' + C.moneyDark + '" stroke-width="2"/>' +
          '<ellipse cx="0" cy="0" rx="12" ry="14" fill="' + C.paper + '" stroke="' + C.moneyDark + '" stroke-width="2"/>' + KIT.moneySeal(kind, 30, 0, 10) + "</g>";
      }
      // A heap of flat bills standing on (0, 0): rows from the bottom up.
      function heapArt(rows, s, seed, kind) {
        var r = KIT.rng(seed), bw = 96 * s * 0.74, bh = 50 * s * 0.6, out = "";
        rows.forEach(function (n, j) {
          for (var i = 0; i < n; i++) {
            var x = (i - (n - 1) / 2) * bw + (r() - 0.5) * bw * 0.3, y = -bh * 0.75 - j * bh + (r() - 0.5) * 4, a = (r() - 0.5) * 32;
            out += '<g transform="translate(' + x.toFixed(1) + "," + y.toFixed(1) + ") rotate(" + a.toFixed(1) + ')">' + flat(kind, s) + "</g>";
          }
        });
        return out;
      }
      // The small grinning missile the Weapons Maker cradles (the same drawing as the kit's held "missile").
      function cradleMissile() {
        var sol = function (p) { return poly(p, C.war, 2.6); };
        return '<g transform="translate(0,-6) rotate(-14)">' + sol([[-34, -7], [14, -7], [30, 0], [14, 7], [-34, 7]]) + sol([[-34, -7], [-44, -17], [-40, -7]]) + sol([[-34, 7], [-44, 17], [-40, 7]]) +
          '<path d="M14,-7 L30,0 L14,7 Z" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="2"/><path d="M-4,2 Q2,6 8,2" fill="none" stroke="' + ink + '" stroke-width="1.8"/>' +
          '<circle cx="-2" cy="-2.5" r="1.6" fill="' + ink + '"/><circle cx="6" cy="-2.5" r="1.6" fill="' + ink + '"/></g>';
      }
      // A cartoon puff (the aging poof); dark: a soot cloud.
      function poof(r, dark) {
        var fill = dark ? "#3A3430" : WHITE, cs = [[0, 0, 1], [-0.9, 0.3, 0.7], [0.9, 0.25, 0.75], [-0.45, -0.7, 0.62], [0.5, -0.65, 0.58], [0, 0.75, 0.62]];
        return cs.map(function (c) { return '<circle cx="' + (c[0] * r).toFixed(1) + '" cy="' + (c[1] * r).toFixed(1) + '" r="' + (c[2] * r).toFixed(1) + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="6"/>'; }).join("") +
          cs.map(function (c) { return '<circle cx="' + (c[0] * r).toFixed(1) + '" cy="' + (c[1] * r).toFixed(1) + '" r="' + (c[2] * r).toFixed(1) + '" fill="' + fill + '"/>'; }).join("") +
          '<circle cx="' + (-0.3 * r).toFixed(1) + '" cy="' + (-0.3 * r).toFixed(1) + '" r="' + (0.3 * r).toFixed(1) + '" fill="' + (dark ? "#6A625C" : C.cream) + '"/>';
      }
      // ── The snail (copied from irrationality-reduction-title, which owns the drawing: keep the copies the same) ──
      // About 70 long, drawn around the middle of its foot (0, 0), facing +x: a cream body, a mustard shell with a navy
      // spiral, two eye stalks with ball tips and navy pupils, thin navy miter outlines. pid prefixes the ids.
      // Parts (untransformed groups, pivots in snail units): #pid-body (stretch it about the tail (-32, 0)),
      // #pid-shell (rock it about its foot (-5, -6)), #pid-stalk-0 / -1 (the eye stalks, pivots (29, -25) and (34, -24)),
      // #pid-drop (a sweat drop by the head, hidden).
      function snail(pid) {
        function P(x, y) { return x.toFixed(1) + "," + y.toFixed(1); }
        function polyD(pts) { return "M" + pts.map(function (p) { return P(p[0], p[1]); }).join(" L") + " Z"; }
        function solid(pts, col, w) {
          return '<path d="' + polyD(pts) + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="' + (w || 3.2) + '" stroke-linejoin="miter" stroke-miterlimit="8"/><path d="' + polyD(pts) + '" fill="' + col + '"/>';
        }
        var body = [[-32, 0], [-29, -4], [-9, -7], [13, -8], [20, -12], [23, -21], [28, -26], [35, -26], [39, -20], [38, -11], [41, -3], [39, 0]];
        var shell = [], sp = [], i;
        for (i = 0; i < 12; i++) { var a = (i / 12) * Math.PI * 2; shell.push([-5 + 20 * Math.cos(a), -25 + 19 * Math.sin(a)]); }
        for (i = 0; i <= 26; i++) { var t = i / 26, b = Math.PI * 0.15 + t * Math.PI * 3.7, r = 16 * (1 - t) + 1.8; sp.push([-5 + r * Math.cos(b), -25 + r * 0.95 * Math.sin(b)]); }
        var stalk = function (k, x0, y0, x1, y1) {
          var dx = x1 - x0, dy = y1 - y0, L = Math.sqrt(dx * dx + dy * dy), nx = -dy / L, ny = dx / L;
          var q = [[x0 + nx * 2.4, y0 + ny * 2.4], [x1 + nx * 1.3, y1 + ny * 1.3], [x1 - nx * 1.3, y1 - ny * 1.3], [x0 - nx * 2.4, y0 - ny * 2.4]];
          return '<g id="' + pid + "-stalk-" + k + '">' + solid(q, C.cream, 2.6) +
            '<circle cx="' + x1 + '" cy="' + y1 + '" r="4.4" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="2.2"/>' +
            '<circle cx="' + (x1 + 1.2) + '" cy="' + y1 + '" r="1.9" fill="' + ink + '"/></g>';
        };
        var dotsId = pid + "-hd";
        return '<defs><pattern id="' + dotsId + '" width="3.6" height="3.6" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1" fill="' + ink + '"/></pattern></defs>' +
          stalk(0, 29, -25, 25, -45) +
          '<g id="' + pid + '-body">' + solid(body, C.cream) +
          '<path d="' + polyD(body) + '" fill="url(#' + dotsId + ')" opacity="0.25" clip-path="none"/>' +
          '<path d="M33,-15 L39,-14" fill="none" stroke="' + ink + '" stroke-width="1.8" stroke-linecap="round"/>' +
          '<path d="M-24,-3 L-14,-4 M2,-5 L10,-5.5" fill="none" stroke="' + ink + '" stroke-width="1.3" opacity="0.55"/></g>' +
          '<g id="' + pid + '-shell">' + solid(shell, C.yellow) +
          '<path d="M' + P(sp[0][0], sp[0][1]) + sp.slice(1).map(function (p) { return " L" + P(p[0], p[1]); }).join("") + '" fill="none" stroke="' + ink + '" stroke-width="2.4" stroke-linejoin="miter"/>' +
          '<path d="M5,-10 L12,-17 L14,-27" fill="none" stroke="' + C.orange + '" stroke-width="2.4" stroke-linejoin="miter"/></g>' +
          stalk(1, 34, -24, 40, -44) +
          '<g id="' + pid + '-drop" opacity="0"><path d="M44,-38 Q49,-31 46,-27 Q41,-25 41,-31 Q42,-35 44,-38 Z" fill="#FFFFFF" stroke="' + ink + '" stroke-width="1.6"/></g>';
      }

      // ── The open manual (the stage the pop-up stands on) ──────────────
      var bk = L.book, bx0 = bk[0], bx1 = bk[1], bF = bk[2], bN = bk[3], bG = bk[4];
      function pagePath(side, dy) {
        var xo = side < 0 ? bx0 : bx1, mx = (xo + bG) / 2;
        return "M" + (xo - side * 26) + "," + (bF + 12 + dy) + " Q" + mx + "," + (bF - 12 + dy) + " " + bG + "," + (bF + 4 + dy) + " L" + bG + "," + (bN - 12 + dy) +
          " Q" + mx + "," + (bN + 6 + dy) + " " + (xo + side * 2 * dy / 7) + "," + (bN + dy) + " Z";
      }
      var cover = "M" + (bx0 - 20) + "," + (bN + 26) + " L" + (bx0 + 8) + "," + (bF + 2) + " Q" + (bx0 + bG) / 2 + "," + (bF - 28) + " " + bG + "," + (bF - 10) +
        " Q" + (bx1 + bG) / 2 + "," + (bF - 28) + " " + (bx1 - 8) + "," + (bF + 2) + " L" + (bx1 + 20) + "," + (bN + 26) + " Q" + (bx1 + bG) / 2 + "," + (bN + 34) + " " + bG + "," + (bN + 14) +
        " Q" + (bx0 + bG) / 2 + "," + (bN + 34) + " " + (bx0 - 20) + "," + (bN + 26) + " Z";
      var lines = "", lr = KIT.rng(5);
      [-1, 1].forEach(function (side) {
        for (var r = 0; r < 7; r++) {
          var y = bF + 34 + r * ((bN - bF - 60) / 7), xa = side < 0 ? bx0 + 70 + r * 3 : bG + 46, xb = side < 0 ? bG - 46 : bx1 - 70 - r * 3, len = (xb - xa) * (0.55 + lr() * 0.4);
          lines += '<path d="M' + (side < 0 ? xa : xb - len).toFixed(1) + "," + y.toFixed(1) + " h" + len.toFixed(1) + '" stroke="' + ink + '" stroke-width="3" opacity="0.16"/>';
        }
      });
      var bookArt = '<defs><clipPath id="' + P + 'pages"><path d="' + pagePath(-1, 0) + " " + pagePath(1, 0) + '"/></clipPath></defs>' +
        '<path d="' + cover + '" fill="' + C.orange + '" ' + st(5) + "/>" + '<path d="' + cover + '" fill="url(#' + P + 'fine)" opacity="0.25"/>' +
        [14, 7].map(function (dy) { return '<path d="' + pagePath(-1, dy) + " " + pagePath(1, dy) + '" fill="' + C.cream + '" ' + st(3) + "/>"; }).join("") +
        '<path d="' + pagePath(-1, 0) + " " + pagePath(1, 0) + '" fill="' + WHITE + '" ' + st(4) + "/>" + lines +
        rect(bG - 44, bF - 20, 88, bN - bF + 30, "url(#" + P + "fine)", 'opacity="0.35" clip-path="url(#' + P + 'pages)"') +
        '<path d="M' + bG + "," + (bF + 4) + " L" + bG + "," + (bN - 12) + '" ' + st(4) + "/>";

      // The closed manual that drops in first: the theme song's book with this program's title on its cover.
      var manualSvg = KIT.props.manual({ size: L.manual[2] });
      var titles = [["GRADUAL", 19], ["IRRATIONALITY", 15], ["REDUCTION", 19], ["PROGRAM", 21]], ti = 0;
      manualSvg = manualSvg.replace(/<text([^>]*)font-size="[\d.]+"([^>]*)>[^<]*<\/text>/g, function (m, a, b) {
        var tt = titles[ti++] || ["", 10];
        return "<text" + a + 'font-size="' + tt[1] + '"' + b + ">" + tt[0] + "</text>";
      });

      // ── The pop-up: the slider bar, its signs and the war pile ────────
      var bar = L.bar, bw = bar[1] - bar[0];
      var slotY = BT + bar[3] / 2;
      var posts = [bar[0] + 30, bar[1] - 48].map(function (x) {
        return rect(x, BB - 4, 18, BK - BB + 4, C.tan, st(3)) + '<path d="M' + (x - 14) + "," + BK + " L" + (x + 32) + "," + BK + " L" + (x + 26) + "," + (BK + 10) + " L" + (x - 8) + "," + (BK + 10) + ' Z" fill="' + C.tan + '" ' + st(3) + "/>";
      }).join("");
      var ticks = "";
      for (var k = 0; k <= 10; k++) {
        var tx = trackX(k / 10);
        ticks += '<path d="M' + tx.toFixed(1) + "," + (slotY + 9) + " v" + (k % 5 ? 5 : 9) + '" stroke="' + ink + '" stroke-width="2.4"/>';
      }
      var barArt = posts +
        rect(bar[0], BT, bw, bar[3], WHITE, st(5) + ' rx="4"') + rect(bar[0], BT + bar[3] * 0.55, bw, bar[3] * 0.45, "url(#" + P + "fine)", 'opacity="0.3"') +
        rect(bar[0] + 7, BT + 6, bw - 14, bar[3] - 12, "none", 'stroke="' + C.orange + '" stroke-width="2"') +
        rect(L.track[0] - 18, slotY - 7, L.track[1] - L.track[0] + 36, 14, C.ink, 'rx="7"') + ticks +
        KIT.moneySeal("war", L.track[0] - 40, slotY, 11) + KIT.moneySeal("med", L.track[1] + 40, slotY, 11);
      // The pile's height (its top above the bar), so the bills hop from its top and the summit sign rides it down.
      var pileH = 50 * L.pile[1] * 0.6 * (L.pile[2].length + 0.25);
      var murderSign = KIT.props.sign({ text: "MURDER\nMONEY", color: C.war, height: L.summit ? 26 : 12, size: L.sign[2] });
      var signs = (L.summit ? "" : at(L.sign[0], BT, 1, murderSign)) +
        at(L.sign[1], BT, 1, KIT.props.sign({ text: "MEDICINE\nMONEY", color: "#1F6E68", height: 12, size: L.sign[2] }));
      var pile = at(L.pile[0], BT + 2, 1, g("pile", heapArt(L.pile[2], L.pile[1], 7, "war")));
      // (9:16) the sign planted on the summit, in front of the pile; it sinks as the pile melts
      var summit = L.summit ? at(L.pile[0] + 6, BT + 2 - pileH + 14, 1, g("summit", '<g transform="rotate(-4)">' + murderSign + "</g>")) : "";
      // the orange notch each year leaves on the bar, under its tag
      var YEARS = [{ n: 1, p: 0.01, len: L.tag[0] }, { n: 2, p: 0.02, len: L.tag[1] }, { n: 5, p: 0.25, len: L.tag[0] }, { n: 10, p: 0.5, len: L.tag[0] }, { n: 20, p: 0.88, len: L.tag[0] }];
      var notches = YEARS.map(function (y, i) { return hid("notch-" + i, '<path d="M' + trackX(y.p).toFixed(1) + "," + (BT + 4) + " V" + (BB - 4) + '" stroke="' + C.orange + '" stroke-width="4"/>'); }).join("");

      // The year tags hang under the bar (YEAR 2's longer string clears YEAR 1's tag).
      var tw = L.tag[2], th = L.tag[3];
      var tags = YEARS.map(function (y, i) { return { i: i, y: y }; }).reverse().map(function (o) {
        var x = trackX(o.y.p), top = BB + o.y.len;
        return hid("tag-" + o.i, '<path d="M' + x.toFixed(1) + "," + BB + " V" + top + '" stroke="' + ink + '" stroke-width="2.4"/>' +
          rect((x - tw / 2).toFixed(1), top, tw, th, WHITE, st(3) + ' rx="3"') + rect((x - tw / 2 + 4).toFixed(1), top + 4, tw - 8, th - 8, "none", 'stroke="' + C.orange + '" stroke-width="1.6"') +
          '<circle cx="' + x.toFixed(1) + '" cy="' + (top + 6) + '" r="2.4" fill="' + ink + '"/>' + text(x.toFixed(1), (top + th / 2 + L.tag[4] * 0.36 + 2).toFixed(1), L.tag[4], "YEAR " + o.y.n, ink, 'letter-spacing="1"'));
      }).join("");
