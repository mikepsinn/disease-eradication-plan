       skeleton's drops through its ribs. 2032: the trial window, a queue walking its diseases on leashes; the pill
       bottle shoots out to YOU; the wait sign rolls from 443 YEARS to NOW; the skeleton next in line hands his bottle
       back; the line moves; the Loud Human steps onto a soapbox to shout SLOW DOWN! and loses his place. 2035: the factory's
       missile climbs off the belt, the belt carries loaves, shoes, toasters and pills, scoops YOU up, and carries off
       the economist, still typing. -->

  <script>
    (function () {
      var ID = "future-b-2028", V = KIT.V, DUR = KIT.scene(ID).duration, G = 1000, SZ = KIT.collage.SIZES;
      var CUE = function (word, n) { return KIT.cue(ID, word, n); };
      // As in Future A: YOU stays at X0 and the world scrolls past, but here he stops at each year's stop to watch.
      var X0 = V ? 300 : 560, SP = V ? 170 : 260, KX = V ? 0.6 : 1, KP = V ? 0.8 : 1;

      var T1 = CUE("Treaty") + 0.35, T3 = CUE("reach") - 0.8, T4 = CUE("Turns") - 0.3, T5 = CUE("produced.") + 0.15;

      var S = function (t) { var d = 0; SEGS.forEach(function (g) { d += Math.max(0, Math.min(t, g[1]) - g[0]) * g[2]; }); return d; };
      var w = function (t, dx) { return X0 + dx * KX + S(t); };
      var YH = V ? 640 : 760, K_SUIT = YH / 562, WORLD = [], FAR = [], beats = [], cast = {}, i;

      add({ on: "You", n: 1, offset: -0.5, do: "move", who: "chute", by: [0, HAND[1] + 700], dur: 1.0 });
      add({ on: "Instructions.", offset: 0.3, do: "hide", who: "chute" });
      cast.book = { art: "manual-closed", x: HAND[0], y: HAND[1], scale: V ? 0.75 : 0.9, hidden: true, label: { text: "MANUAL", at: [110, 145], width: 165, size: 90 } };

      add({ on: "Instructions.", offset: 0.6, do: "hop", who: "book", height: 18 });

      // year signs spring up as he passes

      yearSign("y28", 2028, CUE("twenty-eight:"));

      // ── Stop 1 (2028): the treaty, the funnel, the fat cat ──

      stand("funnel", "funnel", FUX, V ? 0.9 : 1.1);
      var MOUTH = G - 381 * (V ? 0.9 : 1.1) + 40;
      add({ on: "Murder", offset: -0.4, do: "march", id: "warIn", art: "bill-war", count: 5, scale: 0.75 * KP, path: [[X0 - 600, G], [FUP - 260 * KP, G], [FUP - 30, MOUTH]], speed: 640, end: "hide" });
      add({ on: "becomes", offset: 0.1, do: "march", id: "medOut", art: "bill-med", count: 5, scale: 0.75 * KP, path: [[FUP + 20, G], [CATP - 120 * KP, G]], speed: 520, end: "hide" });

      add({ on: "typo.", do: "shiver", who: "stmt", dur: 0.7, amp: 8, rot: 2 });
      add({ on: "typo.", offset: 0.8, do: "hop", who: "stmt", height: 10 });

      // ── Stop 2: the weapons factory sells toasters ──
      var FAX = w(T1, 2350), FAP = FAX - S(T1);
      stand("fac", "factory-pay", FAX, hgt("factory-pay", V ? 520 : 640));

      add({ on: "alive", do: "pop", who: ["ts0", "ts1"], out: true });
      add({ on: "buy", do: "pop", who: "ts2", out: true });

      stand("waitNow", "counter-sign", SX, SGK, sOpt({ hidden: true, label: [{ text: "YEARS TO WAIT", at: [64, 52], width: 108, size: 40 }, { text: "NOW", at: [64, 128], width: 100, size: 70 }] }));

      add({ on: "centuries", do: "counter", id: "years", who: "wait", spot: [64, 128], to: 0, until: "now.", card: false, size: V ? 70 : 84, enter: "none", color: "#2A1C10" });
      add({ on: "now.", do: "hide", who: "years" });

      var slotX = function (k) { return X0 - SLOT * (k + 1) + S(T3); };
      Q.forEach(function (q, k) {
        var art = q[1], h = art === "loud-human" ? QH * 1.15 : QH;
        stand(q[0], art, slotX(k), hgt(art, h), { hidden: true, anchor: art === "loud-human" ? "bottom" : [200, SZ[art][1]] });
        // they line up behind him as he reaches the window
        add({ at: T3 - 0.1 + k * 0.08, do: "slideIn", who: q[0], from: "left", dist: (V ? 900 : 1600) + SLOT * k });

      // "reach": the bottle shoots out of the window to YOU

      var STEP = (V ? 1150 : 1250) * KX;

      add({ on: "Nobody", do: "move", who: "q0", by: [SLOT, 0], dur: 0.5 });
      put("pill2", { art: "pill-bottle", x: WX, y: G - 260 * WK, scale: V ? 0.42 : 0.5, hidden: true });

      add({ on: "everything,", do: "hop", who: "q0", height: 24 });
      add({ on: "but", do: "move", who: "pill2", by: [V ? 160 : 200, -120], dur: 0.25, arc: 40 });
      add({ on: "but", offset: 0.25, do: "hide", who: "pill2" });

      add({ on: "publish", n: 1, do: "move", who: "loud", by: [SLOT * 0.5, -SZ.soapbox[1] * CRK], dur: 0.3, arc: 60 });

      add({ on: "op-eds", do: "shiver", who: "loud", dur: 1.6, amp: 5, rot: 3 });

      stand("onbelt", "missile", F4 + 150 * KP, hgt("missile", V ? 280 : 340), { y: G - 138 * BK + 30 });
      add({ on: "destruction", do: "shiver", who: "onbelt", dur: 0.3, amp: 2, rot: 6 });
      add({ on: "destruction", offset: 0.3, do: "move", who: "onbelt", by: [V ? 220 : 300, 138 * BK - 30], dur: 0.35, arc: 80 });
      add({ on: "start", do: "move", who: "onbelt", by: [V ? 900 : 1200, 0], dur: 1.4 });
      add({ on: "start", do: "bob", who: "onbelt", y: 8, r: 3, speed: 3, until: ["start", 1, 1.4] });
      // clean smoke rings out of the chimneys; goods come out of the door along the belt
      for (i = 0; i < 3; i++) {
        put("puff" + i, { art: "cloud-puff", x: F4 - 300 * KP + (i - 1) * 80 * KP, y: G - (V ? 600 : 720), scale: 0.4, hidden: true });
        add({ on: "production,", offset: i * 0.25, do: "pop", who: "puff" + i });
        add({ on: "production,", offset: i * 0.25, do: "move", who: "puff" + i, by: [40, -400], dur: 2.2, scale: 0.9 });

      put("type", { art: "typewriter", x: EX + 20, y: G - EH * 0.6 + 10, anchor: "bottom", scale: hgt("typewriter", EH * 0.36) });

      add({ on: "publish", n: 2, do: "shiver", who: "type", dur: 2.2, amp: 2, rot: 1 });

      cast.yA = { art: "you-watch", clip: [[0, 340], [215, 340], [215, 562], [0, 562]], anchor: [110, 562], pivot: [110, 562], x: X0, y: G, scale: K_SUIT };
      cast.yB = { art: "you-walk", clip: [[70, 348], [205, 348], [292, 470], [292, 563], [0, 563], [0, 510], [45, 440]], anchor: [125, 562], pivot: [125, 562], x: X0, y: G, scale: K_SUIT, hidden: true };
      cast.yT = { art: "you-watch", clip: [[0, 0], [215, 0], [215, 352], [0, 352]], anchor: [110, 562], pivot: [110, 562], x: X0, y: G, scale: K_SUIT };
      var WALKS = SEGS.slice(0, 3).map(function (g) { return [g[0], g[1]]; }).concat([[CUE("patients.") + 0.5, CUE("patients.") + 1.1]]);
      WALKS.forEach(function (g) {
        for (var ts = g[0], leg = 1; ts < g[1]; ts += 0.22, leg++) {
          add({ at: ts, do: "show", who: leg % 2 ? "yB" : "yA" });

        add({ at: g[1], do: "show", who: "yA" });
        add({ at: g[1], do: "hide", who: "yB" });
        ["yT", "yA", "yB"].forEach(function (n) { add({ at: g[0], do: "bob", who: n, y: 7, r: 1.3, speed: 3.16, until: g[1] }); });

      // after the queue he walks back to his mark as the road starts again
      add({ at: SEGS[2][0], do: "move", who: ["yT", "yA", "yB", "pill"], by: [-STEP, 0], dur: SEGS[2][1] - SEGS[2][0] });
      // "produced.": the goods scoop him up; he rides along on top like a man on a parade float
      cast.float = { art: "goods", x: X0 - (V ? 700 : 1100), y: BELT_Y + 5, anchor: "bottom", scale: V ? 0.9 : 1.1, hidden: true };
      var RIDE = 417 * (V ? 0.9 : 1.1) * 0.72;
      add({ on: "produced.", offset: -0.25, do: "show", who: "float" });
      add({ on: "produced.", offset: -0.25, do: "move", who: "float", by: [V ? 700 : 1100, 0], dur: 0.25 });
      add({ on: "produced.", do: "move", who: ["yT", "yA", "pill"], by: [0, -RIDE], dur: 0.2, arc: 40 });
