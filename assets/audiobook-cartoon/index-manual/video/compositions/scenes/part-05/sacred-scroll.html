<template id="sacred-scroll-template">
  <!-- sacred-scroll · Layer A, the host (storyboards/part-05-sacred-order-of-paper-distribution.md). The shot irises in on
       Wishonia's face at her lectern. "decoded": a 1950s classroom pull-down chart drops from the top of the frame on
       the free wall to her right (a tan roller on two slate brackets, a cream chart with a navy border and an orange
       inner rule, a brass pull ring swinging on its cord) with one picture on it: a double helix whose rungs are plain
       green bills. She points at it. "precise": it keeps unrolling on its own, the helix scrolling past, down past the
       chair rail and out of the bottom of the frame (9:16: down to the floor, and the bottom roll trundles off out of
       the right edge). "order:" + 1.0 s: it snaps back up, the helix whipping into the roller, which spins so hard the
       pull ring wraps round it; on "Step" she raises one finger and the roller is still turning slowly behind her. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
    #sacred-scroll-weave, #sacred-scroll-cam, #sacred-scroll-wall, #sacred-scroll-chart, #sacred-scroll-wish, #sacred-scroll-front, #sacred-scroll-iris, #sacred-scroll-film { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="sacred-scroll" data-width="1920" data-height="1080" data-start="0" data-duration="8.6">
    <div id="sacred-scroll-weave">
      <div id="sacred-scroll-cam">
        <div id="sacred-scroll-wall"></div>
        <div id="sacred-scroll-chart"></div>
        <div id="sacred-scroll-wish"></div>
        <div id="sacred-scroll-front"></div>
      </div>
      <div id="sacred-scroll-iris"></div>
    </div>
    <div id="sacred-scroll-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "sacred-scroll";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line;
      var f = function (n) { return n.toFixed(1); };
      var clamp = function (u) { return Math.min(1, Math.max(0, u)); };
      var tl = gsap.timeline({ paused: true });

      // ── Period film (KIT.film): outside the camera, so it stays put.
      KIT.film(tl, ID, q("weave"), q("film"), 53);

      // ── The host's set: the wall, Wishonia at the lectern, and the slow push in on her face.
      var set = KIT.studio(tl, ID, { cam: q("cam"), wall: q("wall"), wish: q("wish"), front: q("front") }), S = set.S;

      // ── The pull-down chart, on the free wall right of the lectern (canvas px).
      // X0..X1: the chart; RY, R: the roller's center line and radius; TOP: where the paper leaves the roller;
      // L1: the length it drops to; FLOOR: the floor's y (9:16 only; in 16:9 the chart runs out of the frame).
      var G = V
        ? { X0: 724, X1: 1016, RY: 66, R: 16, L1: 860, A: 92, P: 220, sw: 8, bk: [26, 12], cord: 44, ring: 14, rung: 46 }
        : { X0: 1230, X1: 1730, RY: 34, R: 18, L1: 700, A: 150, P: 330, sw: 10, bk: [40, 22], cord: 50, ring: 16, rung: 55 };
      var X0 = G.X0, X1 = G.X1, CX = (X0 + X1) / 2, RY = G.RY, R = G.R, TOP = RY + R - 4, SLAT = 16;
      var FLOOR = V ? S.floor : null, LFLOOR = V ? FLOOR - TOP - SLAT : Infinity, LTOT = 3000;

      // the helix, drawn once from image y 0 to LTOT: two strands, every rung a plain bill stretched across
      var bill = KIT.money("plain").replace(/<path class="legs"[^>]*\/>/, "");
      var s1 = "", s2 = "", rungs = "";
      for (var y = 0; y <= LTOT; y += 8) {
        var a = (y / G.P) * Math.PI * 2;
        s1 += (y ? " L" : "M") + f(CX + G.A * Math.sin(a)) + "," + y;
        s2 += (y ? " L" : "M") + f(CX - G.A * Math.sin(a)) + "," + y;
      }
      for (var yr = G.rung * 0.45; yr <= LTOT; yr += G.rung) {
        var w = Math.abs(2 * G.A * Math.sin((yr / G.P) * Math.PI * 2));
        if (w < 34) continue;
        rungs += '<g transform="translate(' + f(CX) + "," + f(yr) + ") scale(" + (w / 96 * 0.92).toFixed(3) + ",0.5)" + '">' + bill + "</g>";
      }
      var helix = rungs + '<path d="' + s1 + '" fill="none" stroke="' + ink + '" stroke-width="' + G.sw + '" stroke-linecap="round"/>' +
        '<path d="' + s2 + '" fill="none" stroke="' + C.slate + '" stroke-width="' + G.sw + '" stroke-linecap="round"/>';

      // the pull ring on its cord (two copies: behind the roller and in front, for when it wraps round)
      var ringSvg = function (k) {
        return '<g id="' + ID + "-ring-" + k + '"><path class="cord" d="" stroke="' + ink + '" stroke-width="3.4" fill="none"/>' +
          '<circle class="ring" r="' + G.ring + '" fill="none" stroke="' + ink + '" stroke-width="' + (G.ring * 0.62).toFixed(1) + '"/>' +
          '<circle class="ring2" r="' + G.ring + '" fill="none" stroke="' + C.yellow + '" stroke-width="' + (G.ring * 0.34).toFixed(1) + '"/></g>';
      };
      var bx = G.bk[0], bw = G.bk[1];
      var roller = '<path d="M' + (X0 - bx) + "," + (RY - R) + " H" + (X1 + bx) + " V" + (RY + R) + " H" + (X0 - bx) + ' Z" fill="' + C.tan + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="round"/>' +
        '<g id="' + ID + '-grain"></g>' +
        '<path d="M' + (X0 - bx + 6) + "," + (RY - R * 0.45) + " H" + (X1 + bx - 6) + '" stroke="#D8A877" stroke-width="4" opacity="0.8"/>' +
        '<path d="M' + (X0 - bx - bw) + ",-40 H" + (X0 - bx) + " V" + (RY + R + 14) + " H" + (X0 - bx - bw) + ' Z" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<path d="M' + (X1 + bx) + ",-40 H" + (X1 + bx + bw) + " V" + (RY + R + 14) + " H" + (X1 + bx) + ' Z" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<circle cx="' + (X0 - bx - bw / 2) + '" cy="' + RY + '" r="' + (bw * 0.22).toFixed(1) + '" fill="' + C.yellow + '"/><circle cx="' + (X1 + bx + bw / 2) + '" cy="' + RY + '" r="' + (bw * 0.22).toFixed(1) + '" fill="' + C.yellow + '"/>';
      var grainLines = "";
      for (var g = 0; g < 4; g++) grainLines += '<path class="gl" d="" stroke="#8A5E38" stroke-width="3"/>';
      // speed lines beside the chart while it runs away and snaps back
      var speed = "";
      [[X0 - 34, 300, 120], [X0 - 34, 560, 150], [X1 + 34, 240, 150], [X1 + 34, 640, 130]].forEach(function (s) {
        speed += '<path d="M' + s[0] + "," + (V ? s[1] * 1.5 : s[1]) + " v" + s[2] + '" stroke="' + ink + '" stroke-width="5" stroke-linecap="round"/>';
      });

      q("chart").innerHTML = KIT.svg(W, H,
        '<defs><clipPath id="' + ID + '-clip"><rect id="' + ID + '-cliprect" x="' + (X0 + 3) + '" y="' + TOP + '" width="' + (X1 - X0 - 6) + '" height="0"/></clipPath></defs>' +
        '<g id="' + ID + '-rig">' +
        ringSvg("back") +
        '<rect id="' + ID + '-sheet" x="' + X0 + '" y="' + TOP + '" width="' + (X1 - X0) + '" height="0" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="5"/>' +
        '<g clip-path="url(#' + ID + '-clip)"><g id="' + ID + '-helix">' + helix + "</g></g>" +
        '<rect id="' + ID + '-rule" x="' + (X0 + 14) + '" y="' + (TOP + 14) + '" width="' + (X1 - X0 - 28) + '" height="0" fill="none" stroke="' + C.orange + '" stroke-width="3"/>' +
        // 9:16: the paper that has run out along the floor, and the bottom roll trundling off
        '<path id="' + ID + '-floorpaper" d="" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<g id="' + ID + '-slat"><rect x="' + (X0 - 10) + '" y="0" width="' + (X1 - X0 + 20) + '" height="' + SLAT + '" rx="4" fill="' + C.tan + '" stroke="' + ink + '" stroke-width="4"/></g>' +
        '<g id="' + ID + '-roll" opacity="0"><circle r="' + (SLAT * 0.9) + '" fill="' + C.tan + '" stroke="' + ink + '" stroke-width="4"/><path class="spoke" d="M0,-12 V12 M-12,0 H12" stroke="#8A5E38" stroke-width="3"/></g>' +
        '<g id="' + ID + '-roller">' + roller + "</g>" +
        ringSvg("front") +
        '<g id="' + ID + '-speed" opacity="0">' + speed + "</g>" +
        "</g>");
      q("grain").innerHTML = grainLines;

      var el = {
        rig: q("rig"), sheet: q("sheet"), rule: q("rule"), clip: q("cliprect"), helix: q("helix"), slat: q("slat"), roll: q("roll"), floor: q("floorpaper"),
        speed: q("speed"), gl: q("grain").querySelectorAll(".gl"), rings: [q("ring-back"), q("ring-front")],
      };

      // ── Timing (scene seconds).
      var tDec = cue("decoded"), tPre = cue("precise"), tSnap = cue("order:") + 1.0, SNAP = 0.26, tUp = tSnap + SNAP;
      var outBack = function (u) { u = clamp(u); var c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
      // how much paper is out
      var run = function (u) { return G.L1 + 520 * u + 260 * u * u; };
      var Lsnap = run(tSnap - tPre);
      function paper(t) {
        if (t < tDec + 0.16) return 0;
        if (t < tPre) return G.L1 * outBack((t - tDec - 0.16) / 0.45);
        if (t < tSnap) return run(t - tPre);
        return Lsnap * (1 - clamp((t - tSnap) / SNAP));
      }
      // how far the roller has turned after the snap (it keeps spinning, slowing to a slow turn)
      var spin = function (tau) { return tau <= 0 ? 0 : 1.3 * tau + (34 * (1 - Math.exp(-4 * tau))) / 4; };
      // the pull ring's swing (a damped pendulum, kicked when the chart lands and when it runs away)
      function swing(t) {
        var a = 0;
        if (t > tDec + 0.4) a += 0.5 * Math.sin((t - tDec - 0.4) * 7) * Math.exp(-(t - tDec - 0.4) * 1.3);
        if (t > tPre) a += 0.35 * Math.sin((t - tPre) * 9) * Math.exp(-(t - tPre) * 1.5);
        return a;
      }

      KIT.onTime(tl, D, function (t) {
        // the drop: the roller and its brackets come down from above the frame with a bounce
        var drop = t < tDec ? -(RY + R + 160) : -(RY + R + 160) * (1 - outBack((t - tDec) / 0.3));
        el.rig.setAttribute("transform", "translate(0," + f(drop) + ")");

        var L = Math.max(0, paper(t)), vert = Math.min(L, LFLOOR), horiz = Math.max(0, L - LFLOOR), bot = TOP + vert;
        var show = L > 1;
        el.sheet.setAttribute("height", f(vert));
        el.sheet.setAttribute("opacity", show ? 1 : 0);
        el.clip.setAttribute("height", f(Math.max(0, vert - 3)));
        el.rule.setAttribute("height", f(Math.max(0, vert - 28)));
        el.rule.setAttribute("opacity", vert > 40 ? 1 : 0);
        // the paper feeds out of the roller: the picture travels down with it
        el.helix.setAttribute("transform", "translate(0," + f(TOP + L - LTOT) + ")");

        // the bottom slat; in 9:16, once the paper reaches the floor, it becomes a roll trundling off to the right
        var onFloor = horiz > 0;
        el.slat.setAttribute("transform", "translate(0," + f(bot) + ")");
        el.slat.setAttribute("opacity", show && !onFloor ? 1 : 0);
        if (onFloor) {
          var rx = X1 + horiz, rr = SLAT * 0.9;
          el.floor.setAttribute("d", "M" + X0 + "," + f(FLOOR - 2) + " L" + X1 + "," + f(FLOOR - 2) + " L" + f(rx) + "," + f(FLOOR + 4) + " L" + f(rx) + "," + f(FLOOR + 22) + " L" + (X0 - 30) + "," + f(FLOOR + 22) + " Z");
          el.roll.setAttribute("opacity", 1);
          el.roll.setAttribute("transform", "translate(" + f(rx) + "," + f(FLOOR + 22 - rr) + ") rotate(" + f((horiz / rr) * 57.3) + ")");
        } else { el.floor.setAttribute("d", ""); el.roll.setAttribute("opacity", 0); }

        // the roller turns with the paper; after the snap it keeps spinning, slowing down
        var tau = t - tUp, phi = tau > 0 ? -spin(tau) : L / R;
        Array.prototype.forEach.call(el.gl, function (gl, k) {
          var p = phi + (k * Math.PI) / 2, yy = RY - R * 0.8 * Math.cos(p);
          gl.setAttribute("d", Math.sin(p) > 0 ? "M" + (X0 - G.bk[0] + 8) + "," + f(yy) + " H" + (X1 + G.bk[0] - 8) : "");
        });

        // the pull ring: hanging from the slat and swinging; after the snap it wraps round the roller
        var ring, cordFrom, front = true;
        if (tau <= 0) {
          var ang = swing(t);
          cordFrom = [CX, (onFloor ? FLOOR : bot + SLAT)];
          ring = [cordFrom[0] + G.cord * Math.sin(ang), cordFrom[1] + G.cord * Math.cos(ang)];
          if (onFloor) ring = [X1 + horiz, FLOOR + 22];
        } else {
          var th = spin(tau), rad = Math.max(R + G.ring * 0.7, G.cord + R - R * th);
          ring = [CX + 10 * Math.sin(th), RY + rad * Math.cos(th)];
          cordFrom = [CX, RY + R * Math.cos(th)];
          front = Math.sin(th) >= 0;
        }
        el.rings.forEach(function (rg, k) {
          var on = (k === 1) === front && show || (k === 1 && tau > 0 && front) || (k === 0 && tau > 0 && !front);
          if (tau <= 0) on = k === 1 && (show || t > tDec) && !onFloor;
          rg.setAttribute("opacity", on ? 1 : 0);
          rg.querySelector(".cord").setAttribute("d", "M" + f(cordFrom[0]) + "," + f(cordFrom[1]) + " L" + f(ring[0]) + "," + f(ring[1] - G.ring));
          rg.querySelector(".ring").setAttribute("transform", "translate(" + f(ring[0]) + "," + f(ring[1]) + ")");
          rg.querySelector(".ring2").setAttribute("transform", "translate(" + f(ring[0]) + "," + f(ring[1]) + ")");
        });

        // speed lines while it runs away (from "precise") and as it snaps back
        var sp = t > tPre + 0.15 && t < tUp + 0.08 ? 0.6 : 0;
        el.speed.setAttribute("opacity", sp);
        el.speed.setAttribute("transform", "translate(0," + f(t < tSnap ? ((t * 900) % 120) - 60 : 60 - ((t * 1400) % 120)) + ")");
      });

      // ── The iris opens on her face at the head of the shot.
      KIT.iris(tl, ID, q("iris"), S.face, "in", 0.04, 0.74);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
