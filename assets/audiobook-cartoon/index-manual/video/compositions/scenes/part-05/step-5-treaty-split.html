        var door = gid("lab-door", rect(dr.x, gy - dr.h, dr.w, dr.h, C.slate, 3.4) + rect(dr.x + 7, gy - dr.h + 10, dr.w - 14, dr.h * 0.38, C.cyan, 2.4) +

        // (drawn later, by pointArt, so the ledge posts do not cover its arrow)
        pointSvg = at(x + w * 0.42, y - 16, 1, gid("point", sign + arrow, 'opacity="0"'));
