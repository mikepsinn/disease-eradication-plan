<template id="step-1-dice-in-a-suit-template">
  <!-- step-1-dice-in-a-suit · Layer B (storyboards/part-05-sacred-order-of-paper-distribution.md): zoom into the wall
       screen. The step 1 card unrolls and rolls up into its tab. The swivel chair on the hill of papers spins round: the
       Rich Human. A billion papers slide off the hill (a latecomer hops on: 1,000,000,001); a dotted LATER stack floats
       out of reach and his eyes turn to dollars. A pair of dice in a pinstripe suit strolls in, trips, tumbles, lands on
       snake eyes, gets up and straightens its tie. A two-box form slides up; the Grim Reaper rises behind the hill and
       helpfully holds out a pencil at box 2; the Rich Human's arm stretches out like rubber, snatches it and ticks box 1;
       the Reaper sinks back, sulking, and adds a tally mark.
       This file owns the master drawings of the part's spine (the step card, the hill, the chair, the stacks, the form,
       the Reaper). sacred-scroll draws this scene's first frame on its wall screen and 2800-top-hats starts on its last
       frame: the block between the "Shared" markers is copied into both files. Keep the three copies the same. -->
  <!-- 2800-top-hats copies this code and its id starts with a digit (not a CSS selector): every element is reached
       with getElementById and styled inline, never through "#id" selectors. -->
  <style>

    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
  </style>
  <div id="root" data-composition-id="step-1-dice-in-a-suit" data-width="1920" data-height="1080" data-start="0" data-duration="22.6">
    <div id="step-1-dice-in-a-suit-cam" style="position: absolute; inset: 0;">
      <div id="step-1-dice-in-a-suit-bg" style="position: absolute; inset: 0;"></div>

  <script src="assets/vendor/gsap.min.js"></script>

  <script>
    (function () {
      var ID = "step-1-dice-in-a-suit";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;

      // ── Shared: copied in sacred-scroll.html and 2800-top-hats.html (keep the three copies the same) ──
      // The spine of Part 5 (storyboard "Shared drawings"), drawn in canvas px for each shape:
      // card: the step card [x, y, w, h] (a strip of the sacred scroll, rolls at both ends); tab: where it rolls up to.
      // hill: the Rich Human's hill [x0, x1, base, peak]; rich: the person origin of the Rich Human in his chair [x, y, scale].
      // later: the dotted LATER stack [center x, center y, scale]; stack: the billion bundle (base center, where it slides
      // from [x, y, scale]) and its label [x, baseline, size]; late: where the latecomer runs in from; form: [x, y, w];
      // reaper: [feet x, feet y, scale]; lean: his lean (deg) once risen.
      var S1L = V
        ? { card: [40, 70, 680, 260], tab: [40, 70, 220, 70], stepFs: 60, step: [76, 222], headFs: 42, head: [332, [150, 208, 266]],
            headLines: ["GET MANY PAPERS", "FROM RICH", "HUMANS"], tabFs: 38,
            hill: [360, 1010, 1420, 1150], rich: [685, 1150 - 138 * 2.5, 2.5], later: [885, 590, 0.85],
            stack: { to: [180, 1420], from: [560, 1260, 0.42], lab: [192, 1086, 40] }, late: -80,
            form: [40, 360, 450], formFs: [28, 28, 18], reaper: [445, 1400, 1.6], lean: 5, hide: 760 }
        : { card: [120, 40, 1380, 130], tab: [40, 30, 220, 70], stepFs: 84, step: [168, 134], headFs: 50, head: [482, [123]],
            headLines: ["GET MANY PAPERS FROM RICH HUMANS"], tabFs: 40,
            hill: [1000, 1520, 860, 640], rich: [1260, 640 - 138 * 2.05, 2.05], later: [1560, 240, 1.0],
            stack: { to: [255, 872], from: [1070, 760, 0.42], lab: [255, 542, 50] }, late: -90,
            form: [470, 330, 520], formFs: [32, 30, 20], reaper: [1068, 800, 1.35], lean: -8, hide: 640 };
      var WHITE = "#FBF6E6", NAVY = "#24304D", CHAIR = "#3A4766", ink = C.line;
      var s1f = function (n) { return (+n).toFixed(1); };
      function s1At(x, y, s, inner) { return '<g transform="translate(' + s1f(x) + "," + s1f(y) + ")" + (s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; }
      function s1Txt(x, y, size, fam, fill, text, extra) {
        return '<text x="' + s1f(x) + '" y="' + s1f(y) + '" font-family="' + fam + '" font-weight="' + (fam === "Fraunces" ? 900 : fam === "Inter" ? 600 : 600) + '" font-size="' + size + '" fill="' + fill + '" ' + (extra || "") + ">" + text + "</text>";
      }
      // Where the form's boxes are, and the Rich Human's left shoulder (canvas px).
      function s1Geo() {
        var F = S1L.form, x = F[0], y = F[1], w = F[2], R = S1L.rich;
        return { h: 400, box: [[x + w - 86, y + 128], [x + w - 86, y + 248]], bs: 50,
          shoulder: [R[0] - 32.4 * R[2], R[1] + 8.8 * R[2]], arm: 44 * R[2] };
      }
      // A walking-paper's static cousin: a plain bill (no legs).
      function s1Bill() { return KIT.money("plain").replace(/<path class="legs"[^>]*\/>/, ""); }

      // The step card: a cream strip with a roll at each end, "STEP N" in Fraunces and the heading in Oswald capitals.
      // #-card-reveal (its clip) and #-card-roll-r unroll it; #-tab is the small "STEP N" tab it rolls up into.
      function s1Roll(x, y, h) {
        return '<rect x="' + s1f(x - 15) + '" y="' + s1f(y - 9) + '" width="30" height="' + s1f(h + 18) + '" rx="7" fill="' + WHITE + '" stroke="' + ink + '" stroke-width="4"/>' +
          '<path d="M' + s1f(x + 7) + "," + s1f(y - 2) + " V" + s1f(y + h + 2) + '" stroke="' + C.orange + '" stroke-width="3"/>' +
          '<path d="M' + s1f(x - 7) + "," + s1f(y - 2) + " V" + s1f(y + h + 2) + '" stroke="' + ink + '" stroke-width="1.4" opacity="0.4"/>' +
          '<rect x="' + s1f(x - 9) + '" y="' + s1f(y - 17) + '" width="18" height="10" rx="3" fill="' + ink + '"/><rect x="' + s1f(x - 9) + '" y="' + s1f(y + h + 7) + '" width="18" height="10" rx="3" fill="' + ink + '"/>';
      }
      function s1Card(pid, n) {
        var c = S1L.card, x = c[0], y = c[1], w = c[2], h = c[3];
        var paper = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + WHITE + '" stroke="' + ink + '" stroke-width="4"/>' +
          '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="url(#' + pid + '-fine)" opacity="0.13"/>' +
          '<rect x="' + (x + 12) + '" y="' + (y + 10) + '" width="' + (w - 24) + '" height="' + (h - 20) + '" fill="none" stroke="' + C.orange + '" stroke-width="2.5"/>' +
          s1Txt(S1L.step[0] + 4, S1L.step[1] + 5, S1L.stepFs, "Fraunces", C.orange, "STEP " + n) + s1Txt(S1L.step[0], S1L.step[1], S1L.stepFs, "Fraunces", ink, "STEP " + n) +
          S1L.headLines.map(function (l, i) { return s1Txt(S1L.head[0], S1L.head[1][i], S1L.headFs, "Oswald", ink, l, 'letter-spacing="1.5"'); }).join("");
        var t = S1L.tab;
        var tabPaper = '<rect x="' + t[0] + '" y="' + t[1] + '" width="' + t[2] + '" height="' + t[3] + '" fill="' + WHITE + '" stroke="' + ink + '" stroke-width="4"/>' +
          '<rect x="' + (t[0] + 8) + '" y="' + (t[1] + 7) + '" width="' + (t[2] - 16) + '" height="' + (t[3] - 14) + '" fill="none" stroke="' + C.orange + '" stroke-width="2"/>' +
          s1Txt(t[0] + t[2] / 2 + 2, t[1] + t[3] / 2 + S1L.tabFs * 0.36 + 2, S1L.tabFs, "Fraunces", C.orange, "STEP " + n, 'text-anchor="middle"') +
          s1Txt(t[0] + t[2] / 2, t[1] + t[3] / 2 + S1L.tabFs * 0.36, S1L.tabFs, "Fraunces", ink, "STEP " + n, 'text-anchor="middle"');
        return '<g id="' + pid + '-card"><defs><clipPath id="' + pid + '-card-clip"><rect id="' + pid + '-card-reveal" x="' + x + '" y="' + (y - 20) + '" width="' + (w + 2) + '" height="' + (h + 40) + '"/></clipPath>' +
          '<clipPath id="' + pid + '-tab-clip"><rect id="' + pid + '-tab-reveal" x="' + t[0] + '" y="' + (t[1] - 20) + '" width="' + (t[2] + 2) + '" height="' + (t[3] + 40) + '"/></clipPath></defs>' +
          '<g clip-path="url(#' + pid + '-card-clip)">' + paper + "</g>" + s1Roll(x, y, h) + '<g id="' + pid + '-card-roll-r">' + s1Roll(x + w, y, h) + "</g></g>" +
          '<g id="' + pid + '-tab" opacity="0"><g clip-path="url(#' + pid + '-tab-clip)">' + tabPaper + "</g>" + s1Roll(t[0], t[1], t[3]) + '<g id="' + pid + '-tab-roll-r">' + s1Roll(t[0] + t[2], t[1], t[3]) + "</g></g>";
      }

      // The Rich Human's hill: a dome of plain bills packed in rows (lower rows in front), on a dark green mound.
      function s1HillTop(x) {
        var Hl = S1L.hill, cx = (Hl[0] + Hl[1]) / 2, half = (Hl[1] - Hl[0]) / 2, Ht = (Hl[2] - Hl[3]) * 1.15, u = Math.min(1, Math.abs(x - cx) / half);
        return Hl[2] - Math.min(Hl[2] - Hl[3], Ht * Math.sqrt(1 - u * u));
      }
      function s1Hill(pid) {
        var Hl = S1L.hill, x0 = Hl[0], x1 = Hl[1], base = Hl[2], peak = Hl[3], cx = (x0 + x1) / 2, half = (x1 - x0) / 2, Ht = (base - peak) * 1.15;
        var prof = function (h) { return half * Math.sqrt(Math.max(0, 1 - (h / Ht) * (h / Ht))); };
        var rnd = KIT.rng(5150), rh = 23, rows = Math.ceil((base - peak) / rh), pts = [], i, k;
        for (i = 0; i <= 30; i++) { var a = i / 30, hh = (base - peak) * (1 - Math.abs(2 * a - 1)); pts.push(s1f(cx + (2 * a - 1) * prof(hh) * 1.02) + "," + s1f(base - hh - 6)); }
        var mound = '<path d="M' + s1f(x0 - 8) + "," + base + " L" + pts.join(" L") + " L" + s1f(x1 + 8) + "," + base + ' Z" fill="' + C.moneyDark + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="round"/>';
        var bills = "", bill = s1Bill();
        for (i = rows - 1; i >= 0; i--) {
          var y = base - rh * (i + 0.55), hw = prof(rh * (i + 0.5)), n = Math.max(2, Math.round((2 * hw) / 44)), sp = (2 * hw - 30) / n;
          var row = "";
          for (k = 0; k < n; k++) {
            var bx = cx - hw + 15 + sp * (k + 0.5) + (i % 2 ? sp * 0.22 : -sp * 0.22) + (rnd() - 0.5) * 6;
            row += '<g transform="translate(' + s1f(bx) + "," + s1f(y + (rnd() - 0.5) * 5) + ") rotate(" + s1f((rnd() - 0.5) * 16) + ') scale(0.5)">' + bill + "</g>";
          }
          bills += row;
        }
        var lip = '<path d="M' + s1f(x0 - 14) + "," + (base + 2) + " H" + s1f(x1 + 14) + '" stroke="' + ink + '" stroke-width="5" stroke-linecap="round"/>';
        return '<g id="' + pid + '-hill">' + mound + bills + lip + "</g>";
      }

      // The swivel chair (Part 4's navy chair, the cream UNREALISTIC sticker on its back) and the Rich Human in it,
      // in person units (origin = his person origin, seat top at y 80, the base's casters on y 152).
      // #-spin turns the seat round: #-chair-back (turned away: only his hat and cigar smoke show) and #-chair-front.
      // In front: one person drawing per pose, swapped by opacity: #-rh-hug, -greedy, -reach, -eager (the tick, looking
      // at the form), -done. Their .arm-l (shoulder -32.4, 8.8) is the rubber arm.
      var S1P = {
        hug: KIT.castOpts("richHuman"),
        greedy: KIT.castOpts("richHuman", { mood: "greedy" }),
        reach: KIT.castOpts("richHuman", { mood: "greedy", arms: [[22, 72], [140, 155]], holdL: "cash" }),
        eager: KIT.castOpts("richHuman", { mood: "eager", look: "left", arms: [[-90, -90], [-22, -72]], holdR: "cash" }),
        done: KIT.castOpts("richHuman", { mood: "smug", look: "left", arms: [[-90, -90], [-22, -72]], holdR: "cash" }),
      };
      function s1Backrest(back) {
        var pts = "M-50,88 L-55,-20 L-46,-40 L46,-40 L55,-20 L50,88 Z";
        var tufts = "";
        if (!back) [[-36, -24], [36, -24], [-40, 0], [40, 0]].forEach(function (p) { tufts += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.4" fill="' + C.cream + '" opacity="0.8"/>'; });
        else [[-30, -22], [0, -22], [30, -22], [-15, -6], [15, -6], [-30, 10], [30, 10]].forEach(function (p) { tufts += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.4" fill="' + C.cream + '" opacity="0.7"/>'; });
        return '<path d="' + pts + '" fill="' + CHAIR + '" stroke="' + ink + '" stroke-width="4.4" stroke-linejoin="miter"/>' +
          '<path d="M-44,-34 L44,-34 L49,-20 L45,82 L-45,82 L-49,-20 Z" fill="none" stroke="' + C.cream + '" stroke-width="1.6" opacity="0.55"/>' +
          '<path d="M46,-36 L52,-20 L47,84" fill="none" stroke="' + C.orange + '" stroke-width="2.4"/>' + tufts;
      }
      function s1Rich(pid) {
        var base = '<path d="M0,111 L-56,124 M0,111 L56,124 M0,111 L-22,130 M0,111 L22,130" stroke="' + ink + '" stroke-width="9" stroke-linecap="round"/>' +
          '<path d="M0,111 L-56,124 M0,111 L56,124 M0,111 L-22,130 M0,111 L22,130" stroke="' + C.slate + '" stroke-width="4" stroke-linecap="round"/>' +
          [[-56, 132], [56, 132], [-22, 133], [22, 133]].map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5.5" fill="' + ink + '"/>'; }).join("") +
          '<rect x="-5.5" y="94" width="11" height="19" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="3"/>';
        var seat = '<path d="M-60,79 L60,79 L63,96 L-63,96 Z" fill="' + CHAIR + '" stroke="' + ink + '" stroke-width="4.4" stroke-linejoin="miter"/><path d="M-56,82 H56" stroke="' + C.orange + '" stroke-width="2.2"/>';
        var sticker = '<g transform="translate(2,40) rotate(-9)"><path d="M-44,-13 L38,-13 L44,-7 L44,13 L-44,13 Z" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="2.4" stroke-linejoin="miter"/>' +
          '<path d="M38,-13 L38,-7 L44,-7 Z" fill="#D8CFAF" stroke="' + ink + '" stroke-width="1.6"/>' +
          s1Txt(-1, 5, 13.5, "Oswald", C.war, "UNREALISTIC", 'text-anchor="middle" letter-spacing="0.8"') + "</g>";
        var smoke = '<g id="' + pid + '-smoke">' + [0, 1, 2].map(function (i) {
          return '<g transform="translate(' + (30 + i * 8) + "," + (-58 - i * 16) + ')"><g class="' + pid + '-wisp"><path d="M0,0 q-6,-8 0,-16 q6,-8 0,-16" fill="none" stroke="#8C8782" stroke-width="3.4" stroke-linecap="round" opacity="0.85"/></g></g>';
        }).join("") + "</g>";
        var back = '<g id="' + pid + '-chair-back">' + seat + KIT.person(S1P.hug) + s1Backrest(true) + sticker + smoke + "</g>";
        var arms = '<path d="M-63,47 L-46,47 L-46,57 L-63,57 Z M46,47 L63,47 L63,57 L46,57 Z" fill="' + CHAIR + '" stroke="' + ink + '" stroke-width="3.6"/>' +
          '<path d="M-56,57 V80 M56,57 V80" stroke="' + ink + '" stroke-width="5"/>';
        var people = ["hug", "greedy", "reach", "eager", "done"].map(function (k) {
          return '<g id="' + pid + "-rh-" + k + '"' + (k === "hug" ? "" : ' opacity="0"') + ">" + KIT.person(S1P[k]) + "</g>";
        }).join("");
        var front = '<g id="' + pid + '-chair-front" opacity="0">' + s1Backrest(false) + seat + people + arms + "</g>";
        var R = S1L.rich;
        return s1At(R[0], R[1], R[2], base + '<g id="' + pid + '-spin">' + back + front + "</g>");
      }

      // The billion bundle (bills seen edge-on, a bank strap round the middle), base center at (0,0); the latecomer
      // (one walking bill) on top; and the label, which clicks from ...000 to ...001.
      var S1N = 22, S1B = 12;
      function s1Stack(pid) {
        var rnd = KIT.rng(1000000001), w = 220, out = "";
        for (var i = 0; i < S1N; i++) {
          var j = Math.round((rnd() - 0.5) * 8), wj = Math.round((rnd() - 0.5) * 6), y = -(i + 1) * S1B;
          out += '<rect x="' + (-w / 2 + j) + '" y="' + y + '" width="' + (w + wj) + '" height="' + S1B + '" rx="2" fill="' + C.money + '" stroke="' + ink + '" stroke-width="2"/>' +
            '<path d="M' + (-w / 2 + j + 8) + "," + (y + 4) + " H" + (w / 2 + j + wj - 8) + '" stroke="#D4E4C6" stroke-width="1.4" opacity="0.7"/>';
        }
        var band = '<rect x="' + (-w / 2 - 4) + '" y="-150" width="' + (w + 8) + '" height="34" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="3.4"/>' +
          '<path d="M' + (-w / 2 + 4) + ',-142 H' + (w / 2 - 4) + '" stroke="' + C.orange + '" stroke-width="2"/>' + KIT.star(0, -133, 10, C.moneyDark);
        var late = s1At(0, -S1N * S1B - 46 * 0.8, 1, '<g id="' + pid + '-late"><g transform="scale(0.8)">' + KIT.money("plain", 0.5) + "</g></g>");
        var shade = '<rect x="' + (-w / 2 - 6) + '" y="' + -S1N * S1B + '" width="' + (w + 12) + '" height="' + S1N * S1B + '" fill="url(#' + pid + '-hatch)" opacity="0.12"/>';
        var T = S1L.stack.to, lab = S1L.stack.lab;
        var big = function (t, dx, dy, extra) { return '<text x="' + (lab[0] + dx) + '" y="' + (lab[1] + dy) + '" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="' + lab[2] + '" ' + extra + ">" + t + "</text>"; };
        var label = function (t) {
          return big(t, lab[2] * 0.05, lab[2] * 0.07, 'fill="' + C.ink + '"') + big(t, 0, 0, 'fill="' + C.ink + '" stroke="' + C.cream + '" stroke-width="' + (lab[2] * 0.09).toFixed(1) + '" stroke-linejoin="round" style="paint-order:stroke"');
        };
        return s1At(T[0], T[1], 1, '<g id="' + pid + '-stack"><g id="' + pid + '-stack-squash">' + out + shade + band + late + "</g></g>") +
          '<g id="' + pid + '-lab"><g id="' + pid + '-lab-a">' + label("1,000,000,000") + '</g><g id="' + pid + '-lab-b" opacity="0">' + label("1,000,000,001") + "</g></g>";
      }

      // The dotted LATER stack: a bundle bigger than the billion (300 x 260 against its 220 x 264), which does not exist
      // yet, drawn in dashes, with sparkles; centered on (0, 0).
      function s1Later(pid) {
        var w = 300, lh = 13, n = 20, out = "", rnd = KIT.rng(7);
        for (var i = 0; i < n; i++) {
          var y = n * lh * 0.5 - (i + 1) * lh, j = Math.round((rnd() - 0.5) * 10);
          out += '<rect x="' + (-w / 2 + j) + '" y="' + y + '" width="' + w + '" height="' + lh + '" rx="2" fill="' + C.money + '" fill-opacity="0.18" stroke="' + ink + '" stroke-width="2.4" stroke-dasharray="9 7"/>';
        }
        out += '<rect x="' + (-w / 2 - 6) + '" y="-24" width="' + (w + 12) + '" height="48" fill="' + C.cream + '" fill-opacity="0.92" stroke="' + ink + '" stroke-width="3" stroke-dasharray="10 6"/>' +
          s1Txt(0, 15, 42, "Oswald", ink, "LATER", 'text-anchor="middle" letter-spacing="7"');
        var sparks = [[-176, -116, 18, C.yellow], [176, -100, 13, C.orange], [166, 120, 15, C.yellow], [-170, 108, 11, C.orange]].map(function (s) {
          return '<g transform="translate(' + s[0] + "," + s[1] + ')"><g class="' + pid + '-spark">' + KIT.star(0, 0, s[2], s[3]) + "</g></g>";
        }).join("");
        var L0 = S1L.later;
        return s1At(L0[0], L0[1], L0[2], '<g id="' + pid + '-later" opacity="0"><g id="' + pid + '-later-bob">' + out + sparks + "</g></g>");
      }

      // The two-box form, in the look of Part 1's mail-in form. Its lines type on (each has a clip rect, #-type-k);
      // its ticks are #-tick-0 and #-tick-1 (KIT.tick paths, drawn with KIT.drawTick).
      function s1Form(pid) {
        var F = S1L.form, x = F[0], y = F[1], w = F[2], G = s1Geo(), h = G.h, fs = S1L.formFs;
        var clip = function (k, yy, ww) { return '<clipPath id="' + pid + "-tc-" + k + '"><rect id="' + pid + "-type-" + k + '" x="' + (x + 28 + fs[1]) + '" y="' + (yy - fs[1] - 6) + '" width="' + ww + '" height="' + (fs[1] * 1.5 + 12) + '"/></clipPath>'; };
        var line = function (k, yy, t) { return '<g clip-path="url(#' + pid + "-tc-" + k + ')">' + s1Txt(x + 30 + fs[1] * 1.1, yy, fs[1], "Inter", ink, t) + "</g>"; };

      function s1ReaperGeo() {

      var jacket = '<path d="M-31,-92 L31,-92 L31,-34 L-31,-34 Z" fill="' + NAVY + '" stroke="' + ink + '" stroke-width="4" stroke-linejoin="miter"/>' +

        '<path d="M-9,-92 L0,-70 L9,-92 Z" fill="' + WHITE + '" stroke="' + ink + '" stroke-width="2"/>' +

        return '<g id="' + ID + "-darm-" + (k < 0 ? "l" : "r") + '"><path d="M' + 30 * k + ",-86 L" + 40 * k + ",-62 L" + 38 * k + ',-44" fill="none" stroke="' + ink + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +

      var tl = gsap.timeline({ paused: true });
