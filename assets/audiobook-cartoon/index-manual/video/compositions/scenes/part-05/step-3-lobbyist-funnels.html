<template id="step-3-lobbyist-funnels-template">
  <!-- step-3-lobbyist-funnels · Layer B (storyboards/part-05-sacred-order-of-paper-distribution.md, Step 3): a paper the
       Politician will not touch goes the long way round. It offers itself ("take"), he jumps back ("directly"), an
       ILLEGAL sign drops on a rope and flattens it ("illegal"); it peels up, turns away and meets the masked Lobbyist,
       hops into the funnel on his briefcase, drops onto a conveyor, rides into a washing machine labeled CAMPAIGN and is
       spat into the Politician's breast pocket. He looks away, whistling. On "backwards" the whole route runs in
       rewind (the dotted route line winds back up, the sign rises up its rope), on "and" it runs forward again at
       speed, and on "legal." a rubber stamp slams LEGAL onto his forehead. The mark stays on him for the rest of the
       part. In 9:16 the route is a zigzag: the refusal on the upper shelf, a ladder down, the laundering below, and a
       fountain back up into the pocket.
       Everything on the paper's route is a function of "route time" (tau), which runs with the scene, then backwards
       and forwards again, so the rewind is exact and seek-safe; the Politician, the stamp and Wishonia run on scene time. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #step-3-lobbyist-funnels-cam, #step-3-lobbyist-funnels-bg, #step-3-lobbyist-funnels-art, #step-3-lobbyist-funnels-pip, #step-3-lobbyist-funnels-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="step-3-lobbyist-funnels" data-width="1920" data-height="1080" data-start="0" data-duration="20.18">
    <div id="step-3-lobbyist-funnels-cam">
      <div id="step-3-lobbyist-funnels-bg"></div>
      <div id="step-3-lobbyist-funnels-art"></div>

  </div>
  <script src="assets/vendor/gsap.min.js"></script>

  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "step-3-lobbyist-funnels";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var ink = C.line, CREAM = "#FBF6E6", NAVY = "#24304D", P = ID + "-";

      // Layout per canvas shape. UG: the upper ground (the stream, the Politician, the sign); LG: the lower ground (the
      // Lobbyist, the conveyor, the machine); in 16:9 they are one floor. pol: the Politician [x, scale]; front: where the
      // paper offers itself; queue: where the stream stops (the paper, then two followers); lob: the Lobbyist [x when he
      // clicks the case open, x at the conveyor, scale]; conv: the conveyor [center x, scale, length]; mach: the washing

      var L = V

            meet: 150, ladder: 110, shelf: [40, 840], sign: 1, bill: 1.2, spit: [[1000, 700], [870, 460]], stampFrom: [300, -170], lobOff: -360, hopLift: 300 }
        : { UG: 860, LG: 860, pol: [1510, 3.0], front: 1290, queue: [430, 270, 110], lob: [200, 360, 2.8], conv: [680, 1.5, 260], mach: [955, 1.35],
            meet: 560, ladder: null, sign: 1, bill: 1.45, spit: [[1130, 330], [1350, 300]], stampFrom: [1200, -220], lobOff: -480, hopLift: 150 };

      q("bg").innerHTML = KIT.paper(ID);

      function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

      function eOut(x) { x = clamp01(x); return 1 - (1 - x) * (1 - x); }
      function eIn(x) { x = clamp01(x); return x * x; }
      function lerp(a, b, k) { return a + (b - a) * k; }
      function span(t, t0, t1) { return clamp01((t - t0) / (t1 - t0)); }

      // ── The step card (storyboard "Shared drawings"), drawn as step-1-dice-in-a-suit's master copy: a cream strip with a

      var CP = V
        ? { card: [40, 70, 680, 260], tab: [40, 70, 220, 70], stepFs: 76, step: [72, 158], headFs: 36, head: [74, [214, 260, 306]], tabFs: 38,

          txt(CP.step[0] + 4, CP.step[1] + 5, CP.stepFs, "STEP " + n, C.orange, "Fraunces") + txt(CP.step[0], CP.step[1], CP.stepFs, "STEP " + n, ink, "Fraunces") +

        var tabPaper = '<rect x="' + t[0] + '" y="' + t[1] + '" width="' + t[2] + '" height="' + t[3] + '" fill="' + CREAM + '" stroke="' + ink + '" stroke-width="4"/>' +

          txt(t[0] + t[2] / 2, t[1] + t[3] / 2 + CP.tabFs * 0.36, CP.tabFs, "STEP " + n, ink, "Fraunces", 'text-anchor="middle"');

          '<clipPath id="' + P + 'tab-clip"><rect id="' + P + 'tab-reveal" x="' + t[0] + '" y="' + (t[1] - 20) + '" width="' + (t[2] + 2) + '" height="' + (t[3] + 40) + '"/></clipPath></defs>' +

          '<circle cx="-58" cy="-50" r="5.5" fill="' + C.paper + '" stroke="' + ink + '" stroke-width="3"/><circle cx="58" cy="-50" r="5.5" fill="' + C.paper + '" stroke="' + ink + '" stroke-width="3"/></g>' : "";

      }

      // ── The Politician (KIT.cast("politician")): four drawings swapped on the words. A: looking at the paper. B: jumped
      // back, palms up, still grinning, sweating. C: looking away, whistling. D: at the camera, hands on hips, with the

      function polO(extra) { return KIT.castOpts("politician", Object.assign({ look: "left", mood: "grin" }, extra)); }
      var oA = polO({ arms: [[-8, -3], [8, 3]] }), oB = polO({ arms: V ? [[-120, -175], [120, 175]] : [[-112, -168], [112, 168]] }),
        oC = polO({ look: "right", mood: "smug", arms: [[-8, -3], [8, 3]] }), oD = polO({ look: undefined, arms: [[-40, 40], [40, -40]] });
      // The LEGAL stamp mark on the Politician's forehead (storyboard "Shared drawings"; Steps 4 and 5 copy this):
      // KIT.props.stampMark({ text: "LEGAL", angle: -10 }) at scale 0.27, centered on the forehead, which is
      //   x = (rig.eyes.x + rig.head.x) / 2 + 2 * rig.facing,  y = 0.6 * rig.eyes.y + 0.4 * rig.top.y
      // of KIT.rig(KIT.castOpts("politician", the drawing's options)), inserted just before the person's <!--head-end-->
      // (person units: facing the camera that is (4.1, -71.5); looking left (-6.1, -71.5)). The mark's own center is

      function foreheadOf(o) {
        var r = KIT.rig(o);
        return [(r.eyes[0] + r.head[0]) / 2 + 2 * r.facing, 0.6 * r.eyes[1] + 0.4 * r.top[1]];

      function withLegal(svg, o) {
        var s = 0.27, m = KIT.props.stampMark({ text: "LEGAL", angle: -10 });
        var my = +m.match(/data-cy="([-\d.]+)"/)[1], f = foreheadOf(o), x = f[0], y = f[1];

      }
      function whistling(svg, o) {
        var my = 12 + 2.5 * (o.build.chin - 1) + 2;
        return svg.replace(/<path class="mouth"[^>]*\/>/, '<circle class="mouth" cx="7.5" cy="' + (my + 1).toFixed(1) + '" r="2.8" fill="' + ink + '"/>')
          .replace(/<circle class="pupil" cx="([-\d.]+)" cy="([-\d.]+)"/g, function (m, cx, cy) { return '<circle class="pupil" cx="' + (+cx + 0.8) + '" cy="' + (+cy - 1.4) + '"'; });
      }
      var rA = KIT.rig(oA), T0 = rA.shoulder[0][1] - 3; // the jacket's top edge (the vee body's T)
      var sweat = [[-30, -96, -20], [-40, -76, -35]].map(function (d) {

      var briefcase = '<g>' +

        '<g transform="translate(' + (FUN[0] - 17) + "," + (HY - 29) + ')"><g id="' + P + 'lid"><path d="M0,0 H34 L32,-6 H2 Z" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="2.6"/><rect x="14" y="-11" width="6" height="5" fill="' + ink + '"/></g></g>' +

      // and the paper when it is inside). Parts: -mach-body (wobbles), -drum (spins), -door (swings open), -suds, -minibill.
      var MX = L.mach[0], MS = L.mach[1], PC = [0, -116];
      var suds = [[-38, 26, 13], [-16, 34, 15], [10, 30, 14], [33, 22, 12], [-46, 8, 8], [44, 2, 8], [-4, 40, 11]].map(function (b) {
        return '<circle cx="' + b[0] + '" cy="' + b[1] + '" r="' + b[2] + '" fill="' + CREAM + '" stroke="' + ink + '" stroke-width="2"/>';
      }).join("");
      var washer = '<g id="' + P + 'mach-body">' +
        '<path d="M-96,-14 h24 v14 h-24 Z M72,-14 h24 v14 h-24 Z" fill="' + ink + '"/>' +
        '<path d="M-112,-214 L-102,-224 H102 L112,-214 V-24 L104,-14 H-104 L-112,-24 Z" fill="' + CREAM + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="miter"/>' +
        '<rect x="30" y="-222" width="80" height="206" fill="url(#' + ID + '-fine)" opacity="0.22"/>' +
        '<path d="M106,-212 V-26" stroke="' + C.orange + '" stroke-width="2.4"/>' +
        '<path d="M-112,-224 L-104,-278 H104 L112,-224 Z" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="miter"/>' +
        '<rect x="-92" y="-268" width="150" height="36" fill="' + CREAM + '" stroke="' + ink + '" stroke-width="3"/>' +
        txt(-17, -240, 25, "CAMPAIGN", ink, "Oswald", 'text-anchor="middle" letter-spacing="2"') +
        '<circle cx="84" cy="-250" r="13" fill="' + C.orange + '" stroke="' + ink + '" stroke-width="3"/><path d="M84,-250 L92,-258" stroke="' + ink + '" stroke-width="3" stroke-linecap="round"/>' +
        '<path d="M-90,-40 H90" stroke="' + ink + '" stroke-width="3"/><path d="M-60,-30 h30 M-15,-30 h30 M30,-30 h30" stroke="' + ink + '" stroke-width="3"/>' +
        '<g transform="translate(' + PC[0] + "," + PC[1] + ')">' +
        '<circle r="76" fill="' + ink + '"/><circle r="70" fill="' + C.slate + '"/>' +
        '<g id="' + P + 'drum"><circle r="64" fill="' + C.slate + '"/><path d="M-64,0 H64 M0,-64 V64" stroke="#3A4766" stroke-width="3"/>' +
        '<g id="' + P + 'minibill" opacity="0"><g transform="scale(0.42)">' + KIT.money("plain", 0.5) + "</g></g>" +
