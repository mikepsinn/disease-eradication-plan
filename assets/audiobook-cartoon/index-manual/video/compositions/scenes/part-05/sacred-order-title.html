<template id="sacred-order-title-template">
  <!-- sacred-order-title · the period title card (KIT.titleScene, look "atomic"): THE SACRED ORDER OF PAPER
       DISTRIBUTION on plain navy under the film's emblem. The gag: the atom's three electron papers are plain bills in
       brown monk cowls (the Sacred Order), the second swinging a brass censer. An upturned top hat stands on the
       baseline at the end of DISTRIBUTION like a full stop. From "Order" the monks leave their orbits one after
       another, hop down onto the heading, process in single file along the tops of the letters and dive headfirst
       into the hat; after "Distribution." the hat burps a puff and one empty cowl floats down onto its brim.
       The kit's own electrons (#sacred-order-title-e0..e2, war money) are hidden; the monks orbit on the same math. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="sacred-order-title" data-width="1920" data-height="1080" data-start="0" data-duration="3.76">
    <div id="sacred-order-title-cam">
      <div id="sacred-order-title-bg"></div>
      <div id="sacred-order-title-back"></div>
      <div id="sacred-order-title-words"></div>
      <div id="sacred-order-title-art"></div>
    </div>
    <div id="sacred-order-title-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/title.js"></script>
  <script>
    KIT.titleScene({
      id: "sacred-order-title",
      // the small line a little bigger than "small": Fraunces sets wider than its measured widths below about 70 px
      lines: [{ words: ["THE", "SACRED", "ORDER", "OF"], style: "small", scale: 0.6 }, ["PAPER", "DISTRIBUTION"]],
      linesTall: [{ words: ["THE", "SACRED", "ORDER", "OF"], style: "small", scale: 0.62 }, ["PAPER"], ["DISTRIBUTION"]],
      // narrower than the card, so the top hat fits at the end of DISTRIBUTION like a full stop (the gag below
      // slides the DISTRIBUTION line left so the line and its hat are centered together)
      width: KIT.V ? 787 : 1440,
      cy: KIT.V ? 1090 : 750,
      seed: 37,
      gag: function (c) {
        var C = c.C, ink = C.line, E = c.emblem, V = c.V;
        var f = function (n) { return n.toFixed(1); };
        var clamp = function (u) { return Math.min(1, Math.max(0, u)); };
        var sm = function (u) { u = clamp(u); return u * u * (3 - 2 * u); };

        // the kit's war-money electrons give way to the monks
        [0, 1, 2].forEach(function (i) { document.getElementById(c.id + "-e" + i).style.display = "none"; });

        // ── Where things stand (canvas px): the DISTRIBUTION line, its baseline, the hat at its end.
        var dw = c.word("DISTRIBUTION"), dis = dw.box, capTop = dis.y, base = dis.y + dis.h;
        var hk = dis.h / (0.7 * 128); // the hat's scale: the sketch's hat stood by 128 px capitals
        // Center the line and its hat together: slide the DISTRIBUTION line left by half the hat's width; lift the
        // lines above it, so the procession has a clear lane along the tops of the letters.
        var dx = (196 * hk) / 2, lift = V ? 70 : 80;
        c.words.forEach(function (w) {
          if (w.line === dw.line) { w.box.x -= dx; w.el.style.left = w.box.x.toFixed(1) + "px"; }
          else if (w.line < dw.line) { w.box.y -= lift; w.el.style.top = (parseFloat(w.el.style.top) - lift).toFixed(1) + "px"; }
        });
        // the small line's words spread out a little, since Fraunces at that size sets wider than its measured widths
        c.words.forEach(function (w) {
          if (w.line !== 0) return;
          var mid = w.box.x + w.box.w / 2, nx = c.W / 2 + (mid - c.W / 2) * 1.07 - w.box.w / 2;
          w.box.x = nx; w.el.style.left = nx.toFixed(1) + "px";
        });
        var hatX = dis.x + dis.w + 104 * hk, brimTop = base - 122 * hk, mouthY = base - 113 * hk;
        var S = V ? 0.78 : 0.82; // the monks' scale

        // ── A monk: a plain bill on its stick legs under a brown cowl; the censer on the second.
        var HOOD = '<path d="M-56,12 L-54,-18 Q-46,-48 -10,-54 L2,-70 L10,-54 Q46,-46 56,-18 L58,12 L42,12 L40,-10 Q22,-27 0,-27 Q-22,-27 -40,-10 L-42,12 Z" fill="#6B4A2F" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
          '<path d="M-30,-36 Q0,-46 30,-36" fill="none" stroke="#8C6440" stroke-width="3"/>';
        var CENSER = '<g class="censer"><path d="M46,8 L62,54" stroke="' + C.yellow + '" stroke-width="3.4"/>' +
          '<path d="M48,54 h28 l-4,20 h-20 Z" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="3" stroke-linejoin="round"/>' +
          '<path d="M54,54 q8,-11 16,0" fill="none" stroke="' + ink + '" stroke-width="2.4"/></g>';
        var monkSvg = function (i) {
          return '<g id="' + c.id + "-m" + i + '"><g class="body">' + KIT.money("plain", 0) + HOOD + (i === 1 ? CENSER : "") + "</g></g>";
        };
        // the censer's smoke: four little puffs that rise and fade on a loop
        var smoke = "";
        for (var p = 0; p < 4; p++) smoke += '<circle class="puff" r="7" fill="' + C.cream + '" opacity="0"/>';

        // ── The upturned top hat (hat units, its crown on the baseline at (0, 0)), with a cream outline for the navy.
        var hatBody = '<path d="M-52,0 H52 L56,-104 H92 L84,-122 H-84 L-92,-104 H-56 Z" fill="none" stroke="' + C.cream + '" stroke-width="12" stroke-linejoin="round"/>' +
          '<path d="M-52,0 H52 L56,-104 H-56 Z" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="round"/>' +
          '<rect x="-54" y="-34" width="108" height="15" fill="' + C.war + '"/>' +
          '<path d="M-92,-104 H92 L84,-122 H-84 Z" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="round"/>' +
          '<path d="M-60,-113 H60" stroke="#0B1220" stroke-width="10" stroke-linecap="round"/>';
        // the burp: three cream puffs over the mouth
        var burp = '<g id="' + c.id + '-burp" opacity="0"><circle cx="-26" cy="-150" r="26" fill="' + C.cream + '"/><circle cx="12" cy="-170" r="32" fill="' + C.cream + '"/><circle cx="40" cy="-146" r="22" fill="' + C.cream + '"/></g>';
        // the empty cowl that floats down onto the brim
        var cowl = '<g id="' + c.id + '-cowl" opacity="0"><g transform="scale(' + S + ')">' + HOOD + "</g></g>";

        // Nothing walks below the hat's crown: the monks are clipped out of the box under the hat's mouth.
        var clipId = c.id + "-clip", hx0 = hatX - 60 * hk, hx1 = hatX + 60 * hk;
        var clip = '<defs><clipPath id="' + clipId + '"><path clip-rule="evenodd" d="M-200,-200 H' + (c.W + 200) + " V" + (c.H + 200) + " H-200 Z M" + f(hx0) + "," + f(mouthY) +
          " H" + f(hx1) + " V" + f(base + 400) + " H" + f(hx0) + ' Z"/></clipPath></defs>';

        c.art.innerHTML = KIT.svg(c.W, c.H, clip + '<g clip-path="url(#' + clipId + ')">' + monkSvg(2) + monkSvg(1) + monkSvg(0) + smoke + "</g>" +
          '<g transform="translate(' + f(hatX) + "," + f(base) + ')"><g id="' + c.id + '-hat"><g transform="scale(' + hk.toFixed(3) + ')">' + hatBody + burp + "</g></g></g>" + cowl);
        var monks = [0, 1, 2].map(function (i) {
          var el = document.getElementById(c.id + "-m" + i);
          return { el: el, legs: el.querySelector(".legs"), censer: el.querySelector(".censer") };
        });
        var puffs = c.art.querySelectorAll(".puff"), hatEl = document.getElementById(c.id + "-hat");
        var burpEl = document.getElementById(c.id + "-burp"), cowlEl = document.getElementById(c.id + "-cowl");

        // ── Timing: they leave their orbits in order from "Order", hop down onto DISTRIBUTION, walk to the hat's lip
        // and dive, the last one in just before the burp (after "Distribution.").
        var TILT = [0, 60, -60];
        var tGo = c.cue("Order"), tBurp = c.after("Distribution."), HOP = 0.5, DIVE = 0.42;
        var leave = [tGo, tGo + 0.3, tGo + 0.6];
        var landX = dis.x + dis.w * (V ? 0.36 : 0.5), lipX = hatX - 96 * hk - 34 * S;
        var lastIn = tBurp - 0.06, v = (lipX - landX) / (lastIn - DIVE - (leave[2] + HOP));
        var feet = function (x) { return [x, capTop - 46 * S]; }; // a monk's center when its feet are on the capitals
        function orbit(i, t) {
          var a = (TILT[i] * Math.PI) / 180, th = i * 2.1 + t * 2.4, ex = E.rx * Math.cos(th), ey = E.ry * Math.sin(th);
          return [E.at[0] + ex * Math.cos(a) - ey * Math.sin(a), E.at[1] + ex * Math.sin(a) + ey * Math.cos(a) - 6];
        }
        function legs(m, ph) {
          var l = Math.floor(ph) % 2;
          m.legs.setAttribute("d", "M-16,24 l" + (-6 + l * 10) + ",22 h-8 M16,24 l" + (6 - l * 10) + ",22 h8");
        }
        KIT.onTime(c.tl, c.D, function (t) {
          monks.forEach(function (m, i) {
            var x, y, s = S, r = 0, op = 1, tLand = leave[i] + HOP, tDive = tLand + (lipX - landX) / v;
            if (t < leave[i]) {
              var o = orbit(i, t);
              x = o[0]; y = o[1]; s = E.k * 1.15;
              legs(m, t * 10 + i);
            } else if (t < tLand) {
              // the hop: an arc from the orbit down onto the capitals, growing to full size
              var o0 = orbit(i, leave[i]), u = sm((t - leave[i]) / HOP), p1 = feet(landX), cx = (o0[0] + p1[0]) / 2, cy = Math.min(o0[1], p1[1]) - 150;
              x = (1 - u) * (1 - u) * o0[0] + 2 * u * (1 - u) * cx + u * u * p1[0];
              y = (1 - u) * (1 - u) * o0[1] + 2 * u * (1 - u) * cy + u * u * p1[1];
              s = E.k * 1.15 + (S - E.k * 1.15) * u;
              legs(m, 0);
            } else if (t < tDive) {
              // the procession: slow, even steps along the tops of the letters, a solemn bob
              var ph = (t - tLand) * 5;
              x = landX + v * (t - tLand); y = feet(x)[1] - Math.abs(Math.sin(ph * Math.PI)) * 4;
              legs(m, ph);
            } else if (t < tDive + DIVE) {
              // the dive: up over the brim, turning headfirst, and down into the hat
              var w = (t - tDive) / DIVE, a = sm(w / 0.6), b = clamp((w - 0.6) / 0.4);
              var p0 = feet(lipX), top = [hatX, brimTop - 70 * S];
              x = p0[0] + (top[0] - p0[0]) * a; y = p0[1] + (top[1] - p0[1]) * a - Math.sin(Math.PI * a) * 50 + b * b * 150 * hk;
              r = 180 * sm(w / 0.75);
              legs(m, 1);
            } else { x = hatX; y = base; op = 0; }
            m.el.setAttribute("transform", "translate(" + f(x) + "," + f(y) + ") rotate(" + r.toFixed(1) + ") scale(" + s.toFixed(3) + ")");
            m.el.setAttribute("opacity", op);
            if (m.censer) {
              // the censer swings on its chain from the bill's front corner
              m.censer.setAttribute("transform", "rotate(" + (Math.sin(t * 7) * 24).toFixed(1) + " 46 8)");
              // and puffs: the smoke rises from wherever the censer is, in canvas px
              var sw = (Math.sin(t * 7) * 24 * Math.PI) / 180, cxp = 46 + (62 - 46) * Math.cos(sw) - (54 - 8) * Math.sin(sw), cyp = 8 + (62 - 46) * Math.sin(sw) + (54 - 8) * Math.cos(sw);
              var rr = (r * Math.PI) / 180, gx = x + s * (cxp * Math.cos(rr) - cyp * Math.sin(rr)), gy = y + s * (cxp * Math.sin(rr) + cyp * Math.cos(rr));
              Array.prototype.forEach.call(puffs, function (pf, k) {
                var age = (t * 1.6 + k / 4) % 1;
                pf.setAttribute("cx", f(gx + Math.sin((t + k) * 5) * 6 - age * 18));
                pf.setAttribute("cy", f(gy - 10 - age * 60));
                pf.setAttribute("r", f(5 + age * 9));
                pf.setAttribute("opacity", (op * 0.75 * (1 - age)).toFixed(2));
              });
            }
          });

          // ── The burp: the hat bulges, a cream puff rolls out of its mouth, and an empty cowl pops up and drifts
          // down onto the left of the brim.
          var bu = t - tBurp, sx = 1, sy = 1;
          if (bu > 0 && bu < 0.4) { var e = Math.sin((bu / 0.4) * Math.PI) * Math.exp(-bu * 3); sx = 1 - 0.1 * e; sy = 1 + 0.2 * e; }
          hatEl.setAttribute("transform", "scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")");
          var pu = clamp(bu / 0.5);
          burpEl.setAttribute("opacity", bu > 0 ? (0.95 * (1 - pu)).toFixed(2) : 0);
          burpEl.setAttribute("transform", "translate(0," + f(-40 * pu) + ") scale(" + (0.5 + pu * 0.8).toFixed(2) + ")");
          if (bu > 0) {
            var up = sm(bu / 0.18), dn = sm((bu - 0.18) / 0.4);
            var x0 = hatX, y0 = mouthY, ytop = mouthY - 120 * hk, xEnd = hatX - 78 * hk, yEnd = brimTop - 14 * S;
            var cxw = x0 + (xEnd - x0) * dn + Math.sin(dn * Math.PI * 2) * 26 * (1 - dn);
            var cyw = bu < 0.18 ? y0 + (ytop - y0) * up : ytop + (yEnd - ytop) * dn;
            var rot = bu < 0.18 ? 20 * up : 20 - 44 * dn + Math.sin(dn * Math.PI * 3) * 14 * (1 - dn);
            cowlEl.setAttribute("transform", "translate(" + f(cxw) + "," + f(cyw) + ") rotate(" + rot.toFixed(1) + ")");
            cowlEl.setAttribute("opacity", 1);
          } else cowlEl.setAttribute("opacity", 0);
        });
      },
    });
  </script>
</template>
