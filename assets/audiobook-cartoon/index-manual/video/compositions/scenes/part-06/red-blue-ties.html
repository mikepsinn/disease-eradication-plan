      tl.fromTo(anvilIn, { scale: 0 }, { scale: 1, duration: 0.12, ease: "back.out(3)" }, aT0 - 0.12);
      tl.fromTo(anvilIn, { scaleY: 1 }, { scaleY: 0.7, scaleX: 1.2, duration: 0.05, yoyo: true, repeat: 1, ease: "power1.out", immediateRender: false }, aT1);
      // the blue one squashes under it and does not notice
      tl.to(q("blue-poses"), { y: 4, duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out" }, aT1);
      tl.to(box, { scaleY: 0.92, scaleX: 1.05, duration: 0.05, yoyo: true, repeat: 1, ease: "power1.out" }, aT2);

      // ── "slaves": leashes snap tight from the ring to their wrists (clank); "structure,": the ring clicks a notch ──
      var ANCH = { red: [[-24, 0], [-12, 1]], blue: [[12, 0], [24, 1]] };
      ["red", "blue"].forEach(function (side, si) {
        ANCH[side].forEach(function (a, hi) {
          var el = q("str-" + (si * 2 + hi)), eye = q("eye-" + (si * 2 + hi));
          run(function (t) {
            var on = t >= tSlaves;
            show(el, on); show(eye, on);
            if (!on) return;
            var st = polState(side, t), name = polPose(side, t), hand = personPt(st, RIGS[side][name].hand[a[1]]);
            var A = loopAt(a[0] + notchAt(t), ROUT - 2), u = clamp01((t - tSlaves) / 0.08);
            eye.setAttribute("transform", "translate(" + P2(A) + ")");
            var end = [lerp(A[0], hand[0], u), lerp(A[1], hand[1], u)], mid = [(A[0] + end[0]) / 2, (A[1] + end[1]) / 2];
            // a twang: the string wobbles sideways and settles
            var dx = end[0] - A[0], dy = end[1] - A[1], len = Math.hypot(dx, dy) || 1, wob = 14 * Math.sin((t - tSlaves) * 50) * Math.exp(-(t - tSlaves) * 9);
            if (t >= tStruct) wob += 10 * Math.sin((t - tStruct) * 50) * Math.exp(-(t - tStruct) * 10);
            var c = [mid[0] - (dy / len) * wob, mid[1] + (dx / len) * wob];
            el.setAttribute("d", "M" + P2(A) + " Q" + P2(c) + " " + P2(end));
          });
        });
      });

      KIT.onTime(tl, D, function (t) { for (var n = 0; n < RUN.length; n++) RUN[n](t); });
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
