  <!-- politician-drinks-tea · collage (Part 6, scenes 3 to 5 as one plate, "the-loop"). The bit: what looks like a
       monster's choice is a ring road with four stations on it (the weapons factory at the top, the Politician's desk on
       the left, the ballot box at the bottom, the Capitol on the right), and the ring itself is the psychopath.
       "psychopath": close on the desk, the Politician in a devil's mask, horns and tail signs the budget, and the tail
       flicks. "six hundred and four": beside the desk the WEAPONS bar piles up out of war bills past the top of the
       frame and the camera climbs after it (a pigeon lands on it); "helping them": back on the floor, HELPING THEM is
       one medicine bill and a magnifying glass slides in over it. "monsters": the mask, the horns and the tail come off,
       one, two, three, and the horns float away; he has a cup of tea. "system": pull back, a dashed ring road joins
       the four stations. "rewards": a CAMPAIGN FUND brick lands on his desk and a rosette on his lapel.
       Scene 4, "Your civilization's incentive structure": wide; giant horns slide down round the factory, so the ring
       reads as a horned head. Each step inks its arrow and the papers ride it: the factory (LOCKHEED MARTIN) pays a
       CAMPAIGN FUND brick to the desk; it rides on to the ballot box, where the voters vote; the next arrow reaches the
       Capitol, its dome opens and a contract of war bills shoots back to the factory; a brick twice the size lands on
       the Politician, who hugs it. "circular": bills march round the ring. "dog": the Democracy Dog runs onto it,
       stops on "democracy", the camera pushes in on its tail of bills and skeletons, it bites it, yelps and runs faster.
       Scene 5, "No individual human": everyone hops; "The loop is evil": the ring grows an angry face. "Every
       politician": at the Capitol, the Politician takes the brick, hands it back and falls through the floor; another
       one pops up and takes it; the first climbs back and the second falls. "good intentions": the voters drop hearts
       in the box; "missiles": missiles pop out of the factory and roll off the left of the sheet. "runs
       automatically": every human walks off, the ring keeps turning, a flash and a mushroom cloud off the left edge,
       and nobody looks round. weapons-maker-gets-sick continues on the same plate. -->

    cast.mag = { art: "magnifier", x: HX, y: GD - (V ? 100 : 110), anchor: [129, 131], pivot: [129, 131], scale: V ? 0.95 : 1.1, hidden: true };

      }
    };

    var PF = [C[0], GF - SH / 2], PD = [POLX, GD - SH / 2], PB = [C[0], GB - 200], PC = [CAPX, GD - SH / 2];
    var DS = ring(DOGSTOP);
    var views = {
      desk: [V ? POLX + 30 : POLX + 120, cy(GD, CS), CS], chart: [V ? WX + 160 : WX + 260, cy(GD, CS), CS],
      barTop: [V ? WX + 160 : WX + 260, GD - (V ? 3300 : 3700), CS],

      factory: [C[0], cy(GF, CS), CS], capitol: [CAPX, cy(GD, CS), CS], ballot: [C[0], cy(GB, CS), CS],
