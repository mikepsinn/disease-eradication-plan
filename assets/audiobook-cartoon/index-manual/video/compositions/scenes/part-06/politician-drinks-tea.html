      var CROWD = [

            return poly([[x - 2, y0 + 4], [x + 2, y0 + 4], [x + 2.4, 99], [x - 2.4, 99]], C.tan, 1.4) + poly([[x - 7, y0], [x + 7, y0], [x + 6, y0 + 4], [x - 6, y0 + 4]], C.rust, 1.4) +
              poly([[x - 4, r.hand[0][1] - 1], [x + 4, r.hand[0][1] - 1], [x + 4, r.hand[0][1] + 2], [x - 4, r.hand[0][1] + 2]], C.rust, 1.2);

        low + gearsL + bigGear + bracket + house + rtSvg + slots + gearsM + gauge + chims + chute + cover +
        '<g id="' + ID + '-rig">' + chair + button + polSvg + desk + "</g>" + arms + big + pencil + "</svg>";

      // ── The timeline ───────────────────────────────────────────────────
      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "slide left");

      var T = {
        two: cue("two"), suff: cue("suffering"), dis: after("disease,"), psy: cue("psychopath"), spend: cue("spend"), six: cue("six"), four: cue("four"),
        weap: cue("weapons"), help: cue("helping"), them: cue("them."), mon: cue("monsters."), oper: cue("operating"), sys: cue("system"),
        rew: cue("rewards") + 0.25, wrong: cue("wrong"), boom: after("things."),
      };

      // "two": the sick crowd pops in, back row first, chest lights blinking red from "suffering".
      var members = CROWD.map(function (c, i) { return q("m" + i); });
      members.forEach(function (g, i) {
        pivot(g, 0, 100);
        tl.fromTo(g, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(2.2)" }, T.two + (i < 6 ? i : i - 6 + 0.5) * 0.09);
        var light = q("m" + i + "-a").querySelector(".chest-light"), d = 0.24 + (i % 3) * 0.05, t0 = T.suff + (i % 4) * 0.07;
        tl.fromTo(light, { opacity: 1 }, { opacity: 0.25, duration: d, repeat: rep(t0, d), yoyo: true, ease: "none" }, t0);
      });
      // From the zap after "disease,": the back row x-rays into grinning skeletons, one at a time, and stays in line.
      [T.dis, T.dis + 2.45, T.six + 1.3, T.weap + 0.25, T.mon - 1.15, T.oper - 0.55].forEach(function (t, k) {
        var i = [2, 4, 0, 5, 1, 3][k];
        KIT.xray(tl, q("m" + i + "-a"), q("m" + i + "-b"), t);
      });

      // "psychopath": the pencil scribbles the monster into the empty chair (scratch), then sketches the horns, the
      // fangs and the tail, and the red eyes light.
      var pen = q("pencil"), mon0 = wp([-40, -80]), mon1 = wp([66, 10]);
      tl.set(pen, { opacity: 1 }, T.psy - 0.12);
      tl.fromTo(pen, { x: mon1[0] + 300, y: mon0[1] - 200 }, { x: mon0[0], y: mon0[1], duration: 0.12, ease: "power2.out" }, T.psy - 0.12);
      var tz = T.psy;
      for (var z = 0; z < 9; z++) {
        var yy = mon0[1] + ((mon1[1] - mon0[1]) * (z + 1)) / 9;

      document.querySelectorAll("." + ID + "-scr").forEach(function (p, k) {

      });
      tl.fromTo(q("mfill"), { opacity: 0 }, { opacity: 0.85, duration: 0.3 }, T.psy + 0.3);
      var hornsG = q("c-horns"), fangsG = q("c-fangs"), tailG = q("c-tail");
      var hl = hornsG.querySelector(".horn-l"), hr = hornsG.querySelector(".horn-r");

      tl.to(tsw, { rotation: 14, duration: 0.45, repeat: Math.floor((T.mon - T.psy - 0.9) / 0.45) - 1, yoyo: true, ease: "sine.inOut" }, T.psy + 0.88);
      tl.to(pen, { x: W + 400, y: mon0[1] - 300, duration: 0.25, ease: "power2.in" }, T.psy + 0.76);
      tl.set(pen, { opacity: 0 }, T.psy + 1.02);

      tl.to(reyes, { opacity: 0.55, duration: 0.3, repeat: Math.floor((T.mon - T.psy - 1.2) / 0.3) - 1, yoyo: true, ease: "sine.inOut" }, T.psy + 0.9);

      // "spend": the monster leans on the big red button; on "six" the 604 bar shoots out of the top of the frame

      // "monsters.": the horns, the fangs and the tail pop off, one, two, three (pops), and float up out of the top

      var teaG = q("tea"), waveG = q("wave");
      tl.set(teaG, { opacity: 1 }, T.mon);
      tl.to(q("mon"), { opacity: 0, duration: 0.3, ease: "power1.in" }, T.mon);
      [[q("horns-in"), 0, -1], [q("fangs-in"), 0.18, 1], [q("tail-sw"), 0.36, -1]].forEach(function (c) {
        tl.to(c[0], { y: -40, rotation: c[2] * 25, duration: 0.18, ease: "power2.out" }, T.mon + c[1]);
        tl.to(c[0], { y: -(PY + 700) / PS, x: c[2] * 40, rotation: c[2] * 70, duration: 1.5, ease: "power1.in" }, T.mon + c[1] + 0.18);
      });
      // the sips: the cup tilts to his lips and his head tips back
      var cup = document.querySelector("." + ID + "-cup"), head = teaG.querySelector(".head");
      pivot(cup, 0, 0); pivot(head, R0.neck[0], R0.neck[1]);
      function sip(t, hold) {
        tl.to(cup, { rotation: -26, duration: 0.22, ease: "power2.out" }, t);

      sip(T.mon + 0.25, 0.45);
      // "operating": a friendly wave with the cup hand, grinning
      var waveArm = waveG.querySelector(".arm-r");
      pivot(waveArm, R0.shoulder[1][0], R0.shoulder[1][1]);
      tl.set(teaG, { opacity: 0 }, T.oper);
      tl.set(waveG, { opacity: 1 }, T.oper);
      tl.fromTo(waveArm, { rotation: 0 }, { rotation: -16, duration: 0.13, repeat: 3, yoyo: true, ease: "sine.inOut" }, T.oper + 0.02);
      tl.set(waveG, { opacity: 0 }, T.oper + 0.56);
      tl.set(teaG, { opacity: 1 }, T.oper + 0.56);
      sip(T.sys + 0.05, 0.3);
      // the steam curls up off his tea
      document.querySelectorAll("." + ID + "-steam").forEach(function (s) {
        tl.fromTo(s, { y: 0, opacity: 0.9 }, { y: -6, opacity: 0.2, duration: 0.6, repeat: rep(T.mon, 0.6), ease: "none" }, T.mon);
      });

      // "system": the camera pulls back (machine whirr). The conveyor runs out of the machine to the crowd, the gears

      var zoom = q("zoom");
      gsap.set(zoom, { transformOrigin: L.zoom[0] + "px " + L.zoom[1] + "px" });
      tl.fromTo(zoom, { scale: 1 }, { scale: L.s, duration: 0.8, ease: "power2.inOut", immediateRender: false }, T.sys);
      if (V) tl.fromTo(q("cover"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in" }, T.sys + 0.12);
      tl.fromTo(q("belt"), { x: -blen }, { x: 0, duration: 0.6, ease: "power2.out" }, T.sys + 0.15);
      KIT.props.conveyor.run(tl, q("belt"), T.sys + 0.75, D - 0.02 - (T.sys + 0.75), 160);
      KIT.props.gears.spin(tl, q("mgears"), T.sys, D - 0.02 - T.sys, 0, 150, "none");
      KIT.props.gears.spin(tl, q("lgears"), T.sys, D - 0.02 - T.sys, 0, -130, "none");
      if (RT) KIT.props.gears.spin(tl, q("rgears"), T.sys, D - 0.02 - T.sys, 0, -120, "none");
      var needle = q("gauge").querySelector(".gauge-needle");
      pivot(needle, +needle.getAttribute("data-cx"), +needle.getAttribute("data-cy"));
      tl.fromTo(needle, { rotation: -4 }, { rotation: 5, duration: 0.09, repeat: rep(T.sys, 0.09), yoyo: true, ease: "none" }, T.sys);
      document.querySelectorAll("." + ID + "-puff").forEach(function (p, k) {
        // the smoke blows off to the right, so it stays inside the frame after the pull-back
        var t0 = T.sys + 0.1 + (k % 3) * 0.3 + (+p.getAttribute("data-c")) * 0.15, c0 = p.querySelector("circle");
        pivot(p, 0, 0);
        tl.fromTo(p, { x: 0, y: 0, scale: 0.5 }, { x: 90, y: -60, scale: 1.5, duration: 0.9, repeat: rep(t0, 0.9), ease: "power1.out" }, t0);
        tl.fromTo(c0, { opacity: 0.95 }, { opacity: 0, duration: 0.9, repeat: rep(t0, 0.9), ease: "power1.in" }, t0);
      });

      // "rewards": the big gear clunks one notch (ding) and the desk bolted to it jolts; arm A sticks a gold star on
      // his forehead, arm B tucks a war paper into his breast pocket. He keeps sipping.
      KIT.props.gears.spin(tl, q("biggear"), T.rew, 0.22, 0, 18, "back.out(3)");
      var rig = q("rig");
      tl.fromTo(rig, { y: 0 }, { y: 7, duration: 0.05, ease: "power2.in", immediateRender: false }, T.rew);
      tl.to(rig, { y: 0, duration: 0.25, ease: "back.out(4)" }, T.rew + 0.05);
      var gstar = q("gstar");
      tl.set(gstar, { opacity: 1 }, T.rew);
      tl.fromTo(gstar, { scale: 1.8, rotation: -30, svgOrigin: "0 0" }, { scale: 1, rotation: 0, svgOrigin: "0 0", duration: 0.2, ease: "back.out(3)", immediateRender: false }, T.rew);
      tl.set(q("armA-held"), { opacity: 0 }, T.rew);
      tl.set(q("ppaper"), { opacity: 1 }, T.rew + 0.24);
      tl.set(q("armB-held"), { opacity: 0 }, T.rew + 0.24);
      sip(T.rew + 0.5, 0.35);
      // through the blast he takes another long sip, and the cut comes before he puts the cup down
      tl.to(cup, { rotation: -26, duration: 0.22, ease: "power2.out" }, T.boom + 0.05);
      tl.to(head, { rotation: -5, duration: 0.22, ease: "power2.out" }, T.boom + 0.05);

      function lerp(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
      function ease(k) { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); }
      // two-segment arm from base reaching p: [shoulder angle, elbow angle] in degrees (SVG, y down)
      function solve(base, tgt, len) {
        var dx = tgt[0] - base[0], dy = tgt[1] - base[1], d = Math.min(Math.sqrt(dx * dx + dy * dy), 2 * len - 0.5), phi = Math.atan2(dy, dx);
        var a = Math.acos(d / (2 * len)), t1 = phi + a, e = [base[0] + len * Math.cos(t1), base[1] + len * Math.sin(t1)];
        return [t1 / DEG, (Math.atan2(tgt[1] - e[1], tgt[0] - e[0]) - t1) / DEG];
      }
      var ARMS = [
        { k: "A", base: AR.A, tgt: [FOREHEAD[0] - 6 * AS, FOREHEAD[1]], go: T.rew - 0.38, hit: T.rew, back: T.rew + 0.14, home: T.rew + 0.55, dip: 0 },
        { k: "B", base: AR.B, tgt: [POCKET[0] - 4 * AS, POCKET[1] - 18], go: T.rew - 0.2, hit: T.rew + 0.16, back: T.rew + 0.34, home: T.rew + 0.78, dip: 16 },
      ];
      ARMS.forEach(function (a) {
        a.g0 = q("arm" + a.k); a.g1 = q("arm" + a.k + "-1"); a.g2 = q("arm" + a.k + "-2");
        a.rest = [a.base[0] - AS * (2 * AL - 30), a.base[1]]; // folded back inside the tower
        a.g0.setAttribute("transform", "translate(" + P(a.base[0], a.base[1]) + ")");
      });
      KIT.onTime(tl, D, function (t) {
        ARMS.forEach(function (a) {
          var p;
          if (t < a.go) p = a.rest;
          else if (t < a.hit) p = lerp(a.rest, a.tgt, ease((t - a.go) / (a.hit - a.go)));
          else if (t < a.back) p = [a.tgt[0], a.tgt[1] + a.dip * Math.sin(((t - a.hit) / (a.back - a.hit)) * Math.PI)];
          else p = lerp(a.tgt, a.rest, ease((t - a.back) / (a.home - a.back)));
          var s = solve(a.base, p, AL);
          a.g1.setAttribute("transform", "rotate(" + s[0].toFixed(2) + ")");
          a.g2.setAttribute("transform", "translate(" + AL + ",0) rotate(" + s[1].toFixed(2) + ")");
        });
      });

      // "wrong": a grinning missile drops out of the chute onto the belt (thunk) and trundles off to the crowd,
      // faster and faster.
      var mis = q("mis"), misSq = q("mis-sq"), bob = q("mis-bob");
      tl.set(mis, { opacity: 1 }, T.wrong - 0.17);
      tl.fromTo(mis, { x: CH[0], y: CH[1] - 12 }, { y: bsurf, duration: 0.17, ease: "power2.in" }, T.wrong - 0.17);
      pivot(misSq, 0, 0);
      tl.fromTo(misSq, { scaleY: 1, scaleX: 1 }, { scaleY: 0.72, scaleX: 1.18, duration: 0.05, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.wrong);
      tl.to(mis, { x: L.boomX, duration: T.boom - (T.wrong + 0.12), ease: "power2.in" }, T.wrong + 0.12);
      tl.fromTo(bob, { y: 0 }, { y: -6, duration: 0.09, repeat: Math.floor((T.boom - T.wrong - 0.12) / 0.09) - 1, yoyo: true, ease: "sine.inOut" }, T.wrong + 0.12);
      tl.fromTo(q("speed"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.boom - 0.45);
      tl.set(mis, { opacity: 0 }, T.boom);

      // after "things.": it goes off (boom). A white flash, a small mushroom cloud, and the front row stands there
      // charred black and smoking, hair straight up, only their eyes blinking. He sips.
      // KIT.boom's blast, played fast: the scene ends 0.37 s after the boom, so the flash is short and the cloud is
      // up before the cut.
      (function (t) {
        var nk = q("nuke"), part = function (c) { return nk.querySelector("." + c); };
        var base = part("nuke-base"), stem = part("nuke-stem"), ring = part("nuke-ring"), cap = part("nuke-cap");
        gsap.set(base, { svgOrigin: "0 0" }); gsap.set(stem, { svgOrigin: "0 -60" }); gsap.set(ring, { svgOrigin: "0 -258" }); gsap.set(cap, { svgOrigin: "0 -450" });
        tl.fromTo(base, { scaleX: 0.15, scaleY: 0.2, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.16, ease: "power3.out" }, t);
        tl.fromTo(stem, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.2, ease: "power2.out" }, t + 0.02);
        tl.fromTo(cap, { scale: 0.15, y: 330, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.24, ease: "power2.out" }, t + 0.03);
        tl.fromTo(ring, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "back.out(1.6)" }, t + 0.14);
        tl.to(cap, { y: -12, scale: 1.04, duration: D - 0.02 - (t + 0.27), ease: "sine.out" }, t + 0.27);
        tl.fromTo(q("flash"), { opacity: 0 }, { opacity: 0.9, duration: 0.02 }, t).to(q("flash"), { opacity: 0, duration: 0.08, ease: "power2.in" }, t + 0.03);
        tl.fromTo(q("world"), { x: 0 }, { x: 12, duration: 0.035, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, t);
      })(T.boom);
      [6, 7, 8, 9, 10].forEach(function (i, k) {
        var tc = T.boom + 0.05;
        tl.set(q("m" + i + "-a"), { opacity: 0 }, tc);
        tl.set(q("m" + i + "-p"), { opacity: 0 }, tc);
        tl.set(q("m" + i + "-c"), { opacity: 1 }, tc);
        var g = q("m" + i + "-c"), eyes = g.querySelector(".char-eyes"), smoke = g.querySelector(".smoke");
        var tb = tc + 0.12 + k * 0.03;
        pivot(eyes, 4, -4);
        tl.fromTo(eyes, { scaleY: 1 }, { scaleY: 0.1, duration: 0.04, yoyo: true, repeat: 1, ease: "none", immediateRender: false }, tb);

  </script>
