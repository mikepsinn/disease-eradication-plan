        VO.forEach(function (v, n) {
          var cheer = t >= tRe - 0.06 + n * 0.05;
          pose(v.el, cheer ? "cheer" : "base");
          var jmp = cheer ? Math.abs(Math.sin(Math.PI * 3.2 * (t - tRe - n * 0.05))) * 9 : 0;
          v.el.setAttribute("transform", "translate(0," + f1(-jmp) + ")");
        });
        CONF.forEach(function (p, n) {
          var el = q("cf-" + n), u = t - p.t0;
          if (u < 0) { el.setAttribute("opacity", 0); return; }
          var h = VO[p.v].hand[n % 2], sc3 = L.confetti, x = h[0] + p.vx * u * sc3, y = h[1] + (p.vy * u + 0.5 * 950 * u * u) * sc3;
          el.setAttribute("opacity", 1);
          el.setAttribute("transform", "translate(" + P2([x, y]) + ") rotate(" + f1(p.spin * u) + ") scale(" + (Math.cos(u * 9 + n) * 0.6 + 0.4).toFixed(2) + ",1)");
        });
      });

      KIT.onTime(tl, D, function (t) { for (var n = 0; n < RUN.length; n++) RUN[n](t); });
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
