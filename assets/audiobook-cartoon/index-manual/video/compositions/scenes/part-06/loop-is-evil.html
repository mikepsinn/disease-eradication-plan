<template id="loop-is-evil-template">

       missile too; the ring grows an angry face under its horns. A two-box card drops in front of the Politician: he
       ticks "Take the papers", peeks at the other box, and the trapdoor under him creaks open while his replacement
       leans in, hand out; it slams shut and the replacement steps back to wait. The voters drop red hearts into the
       ballot box, grinning missiles pop out of the factory chimneys like toast, and a voter pulls the ring's plug.
       It keeps turning, the missiles march off the paper, and far off a mushroom cloud goes up. Nobody looks round. -->

      var LOOP_G = V

        var t = (a * Math.PI) / 180;

      }

      }
      var LOOP_PEOPLE = {
        voters: [{ tone: 0, outfit: "shirt", color: 1 }, { tone: 2, hair: 1, outfit: "dress", color: 3 }, { tone: 3, outfit: "suit", color: 0 }],
      };
      function loopArt(id, state) {
        var G = LOOP_G, k = G.k, cx = G.cx, cy = G.cy, r = G.r, rin = r - G.w / 2, rout = r + G.w / 2, better = state === "better", empty = state === "empty";
        var P = function (x, y) { return x.toFixed(1) + "," + y.toFixed(1); };
        var poly = function (pts) { return "M" + pts.map(function (p) { return P(p[0], p[1]); }).join(" L") + " Z"; };
        var solid = function (d, fill, w) { return '<path d="' + d + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (w || 4) + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; };

        }).join("") + "</g>"; };

        var A = loopAt(G.cordA, rout - 2), S = G.socket;

          '<path d="M-5,-34 v9 M5,-34 v9" stroke="' + INK + '" stroke-width="3.4" stroke-linecap="butt"/><circle cx="0" cy="-17" r="2.6" fill="' + INK + '"/></g></g>';

        }
        for (var j = 0; j < 8; j++) {

            '<g transform="translate(0,-14)">' + KIT.money(better ? "med" : "war", 0.5) + "</g></g></g>";
        }
        out += '<g id="' + I("spin") + '">' + spin + "</g>";
        // the cut (state "cut"): the track snipped open at LOOP_G.cut, its two ends curled
        if (state === "cut") {
          var e1 = loopAt(G.cut - 7, rin), e2 = loopAt(G.cut - 7, rout), e3 = loopAt(G.cut + 7, rin), e4 = loopAt(G.cut + 7, rout);
          out += '<path d="M' + P(e1[0], e1[1]) + " L" + P(e2[0], e2[1]) + " M" + P(e3[0], e3[1]) + " L" + P(e4[0], e4[1]) + '" stroke="' + INK + '" stroke-width="4"/>';
        }

        var hornPts = [[-20, 0], [-31, -20], [-36, -44], [-33, -64], [-24, -84], [-21, -64], [-14, -46], [-1, -28], [20, 0]];
        var horn = function (sx) {
          var pts = hornPts.map(function (p) { return [p[0] * sx, p[1]]; });
          return solid(poly(pts), C.war, 4) + '<path d="M' + P(-12 * sx, -50) + " L" + P(-4 * sx, -32) + " L" + P(12 * sx, -8) + '" fill="none" stroke="' + C.orange + '" stroke-width="2.4"/>' +
            '<path d="M' + P(-28 * sx, -24) + " L" + P(-31 * sx, -46) + '" fill="none" stroke="#E9806A" stroke-width="3" opacity="0.8"/>';
        };
        out += '<g id="' + I("horns") + '"' + (empty || better ? ' opacity="0"' : "") + ">" + [["horn-l", -30, 1], ["horn-r", 30, -1]].map(function (h) {
          var p = loopAt(h[1], rout - 4);
          return '<g id="' + I(h[0]) + '" transform="translate(' + P(p[0], p[1]) + ") rotate(" + h[1] + ") scale(" + (G.horn * k).toFixed(3) + ')"><g id="' + I(h[0] + "-in") + '">' + horn(h[2]) + "</g></g>";
        }).join("") + "</g>";
        // the face in the ring's middle: angry brows, narrow eyes, a fanged grin on the inner bottom arc
        // ("better": friendly brows, round eyes, a smile)
        var fk = r / 260, eyeL = better ? "M-128,-52 Q-82,-92 -36,-52 Q-82,-20 -128,-52 Z" : "M-142,-66 L-30,-44 L-46,-24 L-126,-34 Z";
        var browL = better ? "M-138,-96 L-82,-112 L-28,-98 L-30,-88 L-82,-100 L-136,-86 Z" : "M-150,-98 L-22,-62 L-26,-46 L-150,-82 Z";
        var mirror = function (d) { return d.replace(/(-?\d+(\.\d+)?),/g, function (m, x) { return (-parseFloat(x)) + ","; }); };
        var eyes = [eyeL, mirror(eyeL)].map(function (d, n) {
          var px = n ? 86 : -86, cid = I("eye-clip-" + n);

        var lip = function (a) { var u = (a - a0) / (a1 - a0); return RA - 12 - deep * Math.sin(Math.PI * u); };
        var outerPts = [], innerPts = [];
        for (var g = 0; g <= 24; g++) {

        }

        } else {
          grin = solid(poly(outerPts.concat(innerPts.slice().reverse())), C.ink, 5);

            var aa = a0 + (a1 - a0) * f[0], rad = (aa * Math.PI) / 180, ri = lip(aa) - 1, half = (f[2] / ri) * (180 / Math.PI);

          G.voters.map(function (v, n) { return loopPerson(id, "voter-" + n, v, G.vs, LOOP_PEOPLE.voters[n]); }).join("") + "</g>";
        // right: the POWER tap (around its body; ballots in at the funnel at its foot, papers out of the spout)
        var T = G.tap, brass = C.yellow;
        var tap = solid("M-11,30 H11 V262 H-11 Z", brass, 4) + '<path d="M6,34 V258" stroke="' + C.orange + '" stroke-width="2.4"/>' +
          solid("M-20,24 H20 V36 H-20 Z", C.tan, 3) + solid("M-30,256 H30 V268 H-30 Z", C.slate, 3) +
          // the funnel at the foot, its mouth facing the ring
          solid("M-12,206 L-78,180 L-78,262 L-12,238 Z", C.tan, 4) + '<ellipse cx="-78" cy="221" rx="9" ry="41" fill="' + C.ink + '" stroke="' + INK + '" stroke-width="4"/>' +
          '<path d="M-20,212 L-70,192" stroke="' + C.cream + '" stroke-width="2.4" opacity="0.7"/>' +
          // the spout: a neck out of the body to the left, then down

          '<path d="M-120,-9 H-56 M-112,-6 V36" stroke="' + C.orange + '" stroke-width="2.4"/></g>' +
          // the body and its plate

          c.setAttribute("transform", "translate(" + (ph * 40).toFixed(1) + "," + (-ph * 14).toFixed(1) + ")");
          c.setAttribute("opacity", (1 - ph).toFixed(2));
        });
      });
      // the tail wags again once it is running round
      tl.to(dTail, { rotation: -6, duration: 0.16, repeat: Math.floor((D - lap0 - 0.2) / 0.16) - 1, yoyo: true, ease: "sine.inOut" }, lap0);

      // ── "individual": the camera pulls back from the dog to the whole loop (whoosh) ──
      var zoom = q("zoom"), indT = cue("individual");
      gsap.set(zoom, { transformOrigin: "0px 0px" });
      tl.fromTo(zoom, { x: ZOOM.to[0] - ZOOM.z * ZOOM.focus[0], y: ZOOM.to[1] - ZOOM.z * ZOOM.focus[1], scale: ZOOM.z }, { x: 0, y: 0, scale: 1, duration: 0.9, ease: "power2.inOut" }, indT);
      // the dog lets go of its tail as the camera pulls back: the tail springs out of its mouth and it chases again
      tl.fromTo(dTail, { rotation: -45 }, { rotation: 6, duration: 0.6, ease: "elastic.out(1.3, 0.3)", immediateRender: false }, indT + 0.1);
      tl.fromTo(dHead, { rotation: -35 }, { rotation: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, indT + 0.1);
      // the skeletons on it swing back the other way and keep dangling (they turned against the bite)
      var charmEls = dogEl.querySelectorAll(".tail-charm");
      tl.fromTo(charmEls, { rotation: 45 }, { rotation: 0, duration: 0.7, ease: "elastic.out(1.2, 0.35)", immediateRender: false }, indT + 0.1);

      // ── "evil." (1st): every human shrugs, the baby missile too (boing) ──
      var ev1 = cue("evil."), ev2 = cue("evil.", 2);
      ["pol", "voter-0", "voter-1", "voter-2"].forEach(function (key, n) {
        pose(key, "shrug", ev1 + n * 0.03);
        var el = q(key + "-in");
        pivot(el, "0 100");
        tl.to(el, { scaleY: 0.94, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.out" }, ev1 + n * 0.03);
        pose(key, key === "pol" ? "base" : "greedy", ev1 + 1.1);
      });
      // the Weapons Maker shrugs with the baby still in his arms: arms and baby up, the baby tilts, his head tilts
      var wmBase = q("wm-in").querySelector('[data-pose="base"] .person'), wmLean = wmBase.lastElementChild, held = wmLean.lastElementChild;
      var babyW = document.createElementNS("http://www.w3.org/2000/svg", "g");
      while (held.firstChild) babyW.appendChild(held.firstChild);
      held.appendChild(babyW);
      var wmParts = [wmLean.querySelector(".arm-l"), wmLean.querySelector(".arm-r"), held];
      var WMR = KIT.rig(WMO);
      tl.to(wmParts, { y: -9, duration: 0.12, yoyo: true, repeat: 1, repeatDelay: 0.6, ease: "power2.out" }, ev1);
      pivot(babyW, "0 0");
      tl.to(babyW, { rotation: -22, duration: 0.14, yoyo: true, repeat: 1, repeatDelay: 0.55, ease: "back.out(2)" }, ev1 + 0.04);
      var wmHead = wmLean.querySelector(".head");
      pivot(wmHead, WMR.neck.join(" "));
      tl.to(wmHead, { rotation: 14, duration: 0.14, yoyo: true, repeat: 1, repeatDelay: 0.55, ease: "power2.out" }, ev1);

      // ── "evil." (2nd): the ring grows a face under its horns (slam); the arrows glow ──
      var face = q("face");
      tl.set(face, { opacity: 1 }, ev2);
      [["eyes-in", 1.7], ["brows-in", 2.0]].forEach(function (e) {
        var el = q(e[0]);
        pivot(el, "0 -50");
        tl.fromTo(el, { scale: e[1], opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "power3.in" }, ev2 - 0.1);
      });
      var grinIn = q("grin-in");
      pivot(grinIn, "0 236");
      tl.fromTo(grinIn, { scaleY: 0, scaleX: 0.6 }, { scaleY: 1, scaleX: 1, duration: 0.18, ease: "back.out(2.4)" }, ev2);
      tl.fromTo(zoom, { x: 0 }, { x: 10, duration: 0.04, repeat: 7, yoyo: true, ease: "none", immediateRender: false }, ev2 + 0.04);
      for (var gi = 0; gi < 8; gi++) {
        var glow = q("arrow-glow-" + gi);
        tl.fromTo(glow, { opacity: 0 }, { opacity: 0.55, duration: 0.2 }, ev2 + gi * 0.02);
        tl.fromTo(glow, { opacity: 0.55 }, { opacity: 0.2, duration: 0.35, repeat: Math.floor((D - ev2 - 0.6) / 0.35) - 1, yoyo: true, ease: "sine.inOut", immediateRender: false }, ev2 + 0.25);
      }
      ["horn-l-in", "horn-r-in"].forEach(function (h, n) {
        pivot(q(h), "0 0");
        tl.to(q(h), { rotation: n ? 10 : -10, duration: 0.08, yoyo: true, repeat: 3, ease: "sine.inOut" }, ev2 + 0.05);
      });
      // the face watches: the Politician ("Every politician"), the box ("intentions"), the missiles ("missiles,")
      var pupils = q("eyes-in").querySelectorAll(".pupil");
      var look = function (t, dx, dy) { tl.to(pupils, { x: dx, y: dy, duration: 0.18, ease: "power2.out" }, t); };
      look(cue("politician"), -12, 3);
      look(cue("intentions") - 0.6, 0, 9);
      look(cue("missiles,"), 6, -9);
      look(cue("runs") + 0.4, 0, 0);

      // ── "locally rational choice:": the card drops on its strings in front of the Politician; he looks up ──
      var locT = cue("locally"), takeT = cue("take"), loseT = cue("lose"), someT = cue("someone"), willT = cue("will."), shutT = KIT.after(ID, "will.");
      var cardEl = q("card"), cardIn = q("card-in");
      tl.set(cardEl, { opacity: 1 }, locT);
      tl.fromTo(cardIn, { y: -(CD.y + cardH + 60) }, { y: 0, duration: 0.42, ease: "bounce.out" }, locT);
      var polIn = q("pol-in");
      var polHead = polIn.querySelector('[data-pose="base"] .head'), PR = KIT.rig(POL);
      pivot(polHead, PR.neck.join(" "));
      tl.to(polHead, { rotation: -14, duration: 0.2 }, locT + 0.3);
      // "take": he points at the first box, and the tick goes in (scratch)
      pose("pol", "point", takeT - 0.12);
      KIT.drawTick(tl, q("tick").querySelector(".tick"), takeT);
      // "lose": he peeks at the second box, worried; the trapdoor under him creaks open a crack (squeak)
      pose("pol", "peek", loseT - 0.05);
      var lid = q("lid"), pit = q("pit");
      pivot(lid, f1(TD.x0) + " " + f1(TD.y));
      tl.fromTo(pit, { opacity: 0 }, { opacity: 1, duration: 0.05 }, loseT);
      tl.fromTo(lid, { rotation: 0 }, { rotation: 22, duration: 0.3, ease: "power2.out" }, loseT);
      tl.to(lid, { rotation: 18, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, loseT + 0.3);
      pivot(polIn, "0 100");
      tl.fromTo(polIn, { rotation: 0 }, { rotation: -4, duration: 0.09, repeat: 15, yoyo: true, ease: "sine.inOut", immediateRender: false }, loseT + 0.05);
      // "someone who will.": his replacement leans in behind him, hand out
      var repIn = q("rep-in");
      pivot(repIn, "0 100");
      tl.fromTo(repIn, { x: RPL.out / ps, rotation: 0 }, { x: 0, rotation: 9, duration: 0.34, ease: "back.out(1.6)" }, someT - 0.12);
      // after "will.": the trapdoor snaps shut (slam), he grins again, the replacement steps back to wait
      tl.to(lid, { rotation: 0, duration: 0.07, ease: "power3.in" }, shutT - 0.07);
      tl.set(pit, { opacity: 0 }, shutT);
      tl.to(polIn, { rotation: 0, y: -14, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, shutT);
      pose("pol", "phew", shutT);
      tl.to(repIn, { x: (V ? -14 : -60) / ps, rotation: 0, duration: 0.4, ease: "power2.inOut" }, shutT + 0.15);
      pose("rep", "wait", shutT + 0.3);
      // the card goes back up
      tl.to(cardIn, { y: -(CD.y + cardH + 60), duration: 0.45, ease: "power2.in" }, cue("machine"));
      pose("pol", "base", cue("machine") + 0.2);

      // ── "good intentions": two voters drop red hearts into the ballot box (pop, pop) ──
      var intT = cue("intentions"), drops = [intT, intT + 0.2], slot = [G.box[0] + 4 * G.box[2], G.box[1] - 57 * G.box[2]];
      [0, 1].forEach(function (n) {
        var key = "voter-" + n, toBox = G.voters[n][0] < G.box[0], who = personAt(key, mix(VO[n], { look: toBox ? "right" : "left", arms: toBox ? [[-14, -6], [80, 100]] : [[-80, -100], [14, 6]] }));
        var hand = who.hand(toBox ? 1 : 0), el = q("heart-" + n), t0 = cue("good") - 0.4 + n * 0.15, t1 = drops[n] - 0.3;
        pose(key, "kind", t0);
        run(function (t) {
          var on = t >= t0 && t < drops[n] + 0.1;
          show(el, on);
          if (!on) return;
          if (t < t1) { var u = easeOut((t - t0) / 0.3); at2(el, hand[0], hand[1] - 16 * k - 20 * k * u, 0, 0.3 + 0.7 * u); }
          else if (t < drops[n]) { var v = (t - t1) / (drops[n] - t1), p = arcPt([hand[0], hand[1] - 36 * k], [slot[0], slot[1] - 8 * k], 50 * k, v); at2(el, p[0], p[1], v * 20); }
          else { var w = (t - drops[n]) / 0.1; at2(el, slot[0], slot[1] - 8 * k + 16 * k * w, 0, 1 - 0.7 * w); }
        });
        pose(key, "greedy", drops[n] + 0.5);
      });
      var boxIn = q("box-in");
      pivot(boxIn, "0 0");
      drops.forEach(function (t) { tl.to(boxIn, { scaleY: 0.88, scaleX: 1.08, duration: 0.05, yoyo: true, repeat: 1, ease: "power1.out" }, t + 0.02); });
      tl.to(grinIn, { scaleX: 1.08, scaleY: 1.12, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, drops[1] + 0.1);

      // ── "missiles,": three grinning missiles pop out of the chimneys like toast (toaster) and line up ──
      var misT = cue("missiles,"), runT = cue("runs"), F = G.factory, fs = F[2];
      var chim = [[-150, 108], [-62, 130], [26, 100]];
      var dir = V ? -1 : 1, line0 = V ? [F[0] - 470 * fs, F[1]] : [F[0] + 280 * fs, F[1]], gap = (V ? 66 : 56) * k;
      var facIn = q("factory-in");
      pivot(facIn, "0 0");
      tl.to(facIn, { scaleY: 0.9, scaleX: 1.06, duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out" }, misT);
      // the road draws itself on as they land
      tl.fromTo(q("road"), { attr: { "stroke-dasharray": "0 1" } }, { attr: { "stroke-dasharray": "1 0" }, duration: 0.5, ease: "power1.out" }, misT + 0.2);
      chim.forEach(function (c, n) {
        var el = q("mis-" + n), top = [F[0] + c[0] * fs, F[1] - (222 + c[1]) * fs], peak = [top[0], top[1] - (V ? 120 : 16) * k], land = [line0[0] + dir * n * gap, line0[1]];
        var t0 = misT + n * 0.06, tUp = t0 + 0.22, tLand = t0 + 0.75, tGo = runT + 0.1 + (2 - n) * 0.05, off = V ? -80 : W + 80;
        run(function (t) {
          var on = t >= t0;
          show(el, on);
          if (!on) return;
          var p, rot = 0;
          if (t < tUp) { var u = easeOut((t - t0) / (tUp - t0)); p = [top[0], lerp(top[1] + 30 * k, peak[1], u)]; }
          else if (t < tLand) { var v = (t - tUp) / (tLand - tUp); p = arcPt(peak, land, 40 * k, v); p[1] = lerp(peak[1], land[1], easeIn(v)); p[0] = lerp(peak[0], land[0], v); rot = dir * 360 * v; }
          else if (t < tGo) { p = land; }
          else { var w = t - tGo, x = land[0] + dir * w * (V ? 420 : 860) * k; p = [x, land[1] - Math.abs(Math.sin(w * 14)) * 10 * k]; rot = Math.sin(w * 14) * 10; if ((dir > 0 && x > off) || (dir < 0 && x < off)) { show(el, false); return; } }
          at2(el, p[0], p[1], rot);
        });
        var mi = q("mis-" + n + "-in");
        pivot(mi, "0 0");
        tl.fromTo(mi, { scaleY: 1 }, { scaleY: 0.75, scaleX: 1.15, duration: 0.05, yoyo: true, repeat: 1, ease: "power1.out", immediateRender: false }, t0 + 0.75);
      });

      // ── "runs": the humans step back, hands up; a voter pulls the plug and holds it up (click). It keeps running. ──
      ["pol", "wm", "voter-1", "voter-2"].forEach(function (key, n) {
        pose(key, "up", runT + n * 0.05);
        var el = q(key + "-in");
        tl.to(el, { x: key === "pol" ? -16 : key === "wm" ? 0 : 14, y: key === "wm" ? -8 : 0, duration: 0.25, ease: "power2.out" }, runT + n * 0.05);
      });
      var v0 = personAt("voter-0", mix(VO[0], { look: "right", arms: [[-170, -178], [-14, -6]] }));
      pose("voter-0", "plug", runT - 0.05);
      var plugHand = v0.hand(0), pullT = runT;
      run(function (t) {
        var p = cordPlug;
        if (t >= pullT) { var u = easeOut((t - pullT) / 0.22); p = [lerp(cordPlug[0], plugHand[0], u), lerp(cordPlug[1], plugHand[1] + 18 * k, u)]; }
        loopCord(ID, p);
      });
      var plugIn = q("plug-in");
      pivot(plugIn, "0 0");
      // the plug grows as it comes up, so the held-up plug reads; the empty socket sparks once (click)
      tl.fromTo(plugIn, { scale: 1 }, { scale: 2, duration: 0.24, ease: "back.out(2)", immediateRender: false }, pullT);
      tl.fromTo(plugIn, { rotation: 0 }, { rotation: 18, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, pullT + 0.25);
      var SKT = G.socket, sparkS = document.createElementNS("http://www.w3.org/2000/svg", "g");
      sparkS.setAttribute("transform", "translate(" + SKT[0] + "," + f1(SKT[1] - 30 * k) + ")");
      sparkS.innerHTML = '<g id="' + ID + '-zap" opacity="0">' + KIT.star(0, 0, 20 * k, C.yellow) + KIT.star(0, 0, 8 * k, "#FFF") + KIT.star(18 * k, -14 * k, 8 * k, C.orange) + "</g>";
      q("plugset").appendChild(sparkS);
      pivot(q("zap"), "0 0");
      tl.fromTo(q("zap"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.1, duration: 0.08, ease: "power2.out" }, pullT);
      tl.to(q("zap"), { opacity: 0, scale: 0.5, duration: 0.2 }, pullT + 0.14);

      // ── after "automatically.": far behind the loop, a white flash and a mushroom cloud (distant boom). Nobody looks. ──
      var boomT = KIT.after(ID, "automatically.");
      tl.set(q("far"), { opacity: 1 }, boomT);
      KIT.boom(tl, q("nuke"), boomT);
      // a distant blast: a short, thin flash (not a full white-out), so the shot of nobody looking round reads
      var flash = q("flash");
      tl.fromTo(flash, { opacity: 0 }, { opacity: 0.7, duration: 0.04 }, boomT);
      tl.to(flash, { opacity: 0, duration: 0.3, ease: "power2.out" }, boomT + 0.08);
      tl.fromTo(zoom, { y: 0 }, { y: 4, duration: 0.05, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, boomT + 0.05);

      KIT.onTime(tl, D, function (t) { for (var n = 0; n < RUN.length; n++) RUN[n](t); });
      // the cloud's slow billow (KIT.boom) would run past the scene: drop what starts in its last moment, trim the rest
      tl.getChildren(false, true, false).forEach(function (c) {
        if (c.startTime() + c.totalDuration() <= D + 0.001) return;
        if (c.startTime() > D - 0.2) c.kill();
        else c.totalDuration(D - c.startTime());
      });
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
