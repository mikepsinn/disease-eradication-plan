  <!-- weapons-maker-gets-sick · collage (Part 6, scenes 7 and 8 as one plate, "the-loop", back as
       politician-drinks-tea left it: the horned ring with its angry face, bills marching, the dog running, a mushroom
       cloud off the left edge). The bit: the loop's own people lose. The weapons factory walks up the lane to its house
       and its family (wife and two children) comes out to meet it, beside their portrait on the wall. "get diseases": a
       germ climbs onto the factory and it coughs; two more hop onto the children; "Everyone they love": the Reaper
       climbs out of the portrait, leaving a Reaper-shaped hole, and waits by the house. "same economy": pull back, the
       house stands on an inked chart, THE ECONOMY; "shrinking": missiles roll past and the house shrinks, the family
       squashed and the portrait knocked off the wall. Scene 8, "If the loop breaks": scissors snip a gap in the last arrow; the bills stop, the dog
       skids to a stop at the gap, and one bill walks through it and comes out with a cross for a seal. "one percent":
       the factory's stack of 100 bills loses its top one, which walks off; it sobs. "one point four three": a house
       1.43 times as tall pops up beside the shrunken one (×1.43), the family moves in and shoppers queue at its door.
       "invest in the biotech sector": across the lane the lab lights up; the factory pays in a bill and gets a share
       certificate back. "twenty-seven point two billion": the flipped bills march up the lane into the lab ($27.2 BILLION / YEAR).
       "not being dead": the germs fall off, and the Reaper sulks off the sheet. -->
