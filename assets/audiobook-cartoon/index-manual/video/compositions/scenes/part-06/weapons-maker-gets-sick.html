  <script>
    (function () {
      var ID = "weapons-maker-gets-sick";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, P = ID + "-";

      // ── Drawing helpers (the kit's print look: a navy pass under each fill, mitred corners) ──
      function n1(v) { var r = Math.round(v * 10) / 10; return String(r === 0 ? 0 : r); }
      function pt(x, y) { return n1(x) + "," + n1(y); }
      function polyD(pts) { return "M" + pts.map(function (p) { return pt(p[0], p[1]); }).join(" L") + " Z"; }
      function R(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
      function flip(pts) { return pts.map(function (p) { return [-p[0], p[1]]; }); }
      function solid(list, col, w) {
        w = w || 4.4;
        return list.map(function (p) { return '<path d="' + polyD(p) + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="' + w + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }).join("") +
          list.map(function (p) { return '<path d="' + polyD(p) + '" fill="' + col + '"/>'; }).join("");

      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }

      // ── HOUSE: copied in redirect-math; change both. ─────────────────────

      var HOUSE = {

        SIGN: [-90, 1],                         // the ECONOMY sign on the ridge: x, size

      };
      var FAMO = {
        wm: KIT.castOpts("weaponsMaker", { hat: null, cigar: false }),   // his hard hat and cigar are drawn apart (they move)
        wife: { tone: 3, hair: 1, outfit: "dress", color: 2, mood: "smile" },
        kid1: { tone: 3, outfit: "shirt", color: 0, hat: "hard", seed: 1, mood: "smile" },
        kid2: { tone: 3, hair: 1, outfit: "dress", color: 1, hat: "hard", seed: 2, mood: "smile" },

      // the portrait: a grandpa in a bowler, a grandma in curlers, an aunt, a cousin and an aunt (the Reaper rises

      var RELS = [
        { tone: 3, outfit: "suit", hat: "bowler", hair: 2, stache: true, mood: "smile", seed: 3 },

        { tone: 2, hair: 1, outfit: "dress", color: 0, mood: "smile", seed: 5 },
        { tone: 2, outfit: "shirt", color: 1, mood: "smile", seed: 6 },
        { tone: 3, hair: 1, outfit: "dress", color: 2, mood: "smile", seed: 7 },

      var BONE = "#F1EAD6", ROBE = "#141B2B", SKIN3 = "#6F4B33", SKIN3_LIT = "#A57B57", GLASS = "#B5D3CF";

      // Patterns, in hu: wallpaper (cyan with cream atomic stars), siding, brick, the cut edge's section hatch.
      function houseDefs() {
        return "<defs>" +
          '<pattern id="' + P + 'wallp" width="54" height="54" patternUnits="userSpaceOnUse">' + KIT.star(13, 13, 7, C.cream) + KIT.star(40, 40, 7, C.cream) +

          '<pattern id="' + P + 'sect" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0,0 V9" stroke="' + ink + '" stroke-width="1.6"/></pattern>' +
          '<pattern id="' + P + 'plank" width="46" height="24" patternUnits="userSpaceOnUse"><path d="M0.5,0 V24" stroke="' + ink + '" stroke-width="1.4" opacity="0.45"/></pattern>' +

      function hardHat() {

      function cigarSvg() {

      // A face squashed flat against a window from inside (front view, about 76 x 100): wide cheeks, the nose a

      function pressedFace(kind) {
        var hair = ink, out = "";
        out += solid([[[-37, -4], [-39, -30], [-25, -47], [0, -51], [25, -47], [39, -30], [37, -4], [31, 6], [-31, 6]]], hair, 3);

        var cheek = [[-35, -2], [-25, -9], [-14, -1], [-16, 14], [-29, 17]];
        out += fillP(cheek, SKIN3_LIT) + fillP(flip(cheek), SKIN3_LIT);

        var fingers = "M-48,4 l-5,-14 M-43,2 l-2,-15 M-37,3 l1,-15 M-32,8 l7,-10";

        if (kind === "kid") out += '<g transform="translate(0,-18) scale(1.45)">' + hardHat() + "</g>";

      // A window in the front wall: trim, glass, a face behind it (hidden until the squeeze; o.faces shows it), mullions

      function frontWindow(x, y, w, h, faceId, kind, fs, shown) {
        var cid = P + faceId + "-clip";
        return solid([R(x - 7, y - 7, w + 14, h + 14)], C.cream, 3.4) +
          '<defs><clipPath id="' + cid + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/></clipPath></defs>' +
          solid([R(x, y, w, h)], GLASS, 3) + fillP([[x, y + h * 0.55], [x + w, y + h * 0.3], [x + w, y + h], [x, y + h]], C.peri, 'opacity="0.35"') +
          '<g clip-path="url(#' + cid + ')">' + at(x + w / 2, y + h / 2 + 2, fs, g(faceId, pressedFace(kind), shown ? "" : 'opacity="0"')) +
          line("M" + pt(x + w * 0.15, y + h) + " L" + pt(x + w * 0.62, y), C.cream, 5, 'opacity="0.35"') + line("M" + pt(x + w * 0.45, y + h) + " L" + pt(x + w * 0.85, y), C.cream, 2.4, 'opacity="0.35"') + "</g>" +
          solid([R(x + w / 2 - 2.5, y, 5, h), R(x, y + h / 2 - 2.5, w, 5)], C.cream, 2);
      }

      // The room, the portrait and the hall (behind the family). o: { reaper (the Reaper in the portrait, hidden below
      // its bottom edge), bones (the relatives already skeletons) }.
      function houseBack(o) {
        o = o || {};
        var RM = HOUSE.ROOM, x0 = RM[0], rw = RM[1] - RM[0], rh = RM[2], out = "";
        // the hall behind the front wall, seen through the open front door
        out += '<rect x="' + HOUSE.WALL[0] + '" y="' + -rh + '" width="' + (HOUSE.WALL[1] - HOUSE.WALL[0] + 2) + '" height="' + rh + '" fill="' + C.slate + '"/>' +

        // wallpaper, crown rail, floor, rug
        out += '<rect x="' + x0 + '" y="' + -rh + '" width="' + rw + '" height="' + rh + '" fill="' + C.cyan + '"/>' +
          '<rect x="' + x0 + '" y="' + -rh + '" width="' + rw + '" height="' + rh + '" fill="url(#' + P + 'wallp)" opacity="0.75"/>' +
          '<rect x="' + x0 + '" y="' + -rh + '" width="' + rw + '" height="' + rh + '" fill="url(#' + P + 'fine)" opacity="0.12"/>' +
          solid([R(x0, -rh + 20, rw, 7)], C.cream, 2.4) +
          solid([R(x0, -30, rw, 30)], C.tan, 3) + '<rect x="' + x0 + '" y="-30" width="' + rw + '" height="30" fill="url(#' + P + 'plank)"/>' +
          solid([R(x0, -38, rw, 8)], C.cream, 2.4) +
          solid([[[-205, -16], [25, -16], [35, -2], [-215, -2]]], C.rust, 2.6) + line("M-196,-9 H24", C.yellow, 2.2, 'stroke-dasharray="8 6"');
        // a starburst wall clock
        var ck = [-112, -228], rays = "";
        for (var i = 0; i < 12; i++) { var a = (i / 12) * Math.PI * 2; rays += "M" + pt(ck[0] + Math.cos(a) * 19, ck[1] + Math.sin(a) * 19) + " L" + pt(ck[0] + Math.cos(a) * 31, ck[1] + Math.sin(a) * 31) + " "; }
        out += line(rays, ink, 5.4) + line(rays, C.yellow, 2.6) + '<circle cx="' + ck[0] + '" cy="' + ck[1] + '" r="17" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="3.4"/>' +
          line("M" + pt(ck[0], ck[1]) + " v-11 M" + pt(ck[0], ck[1]) + " l8,4", ink, 2.6);
        // the fireplace: a brick surround, the firebox with a small fire, the hearth and the mantel shelf
        out += solid([R(60, -140, 190, 110)], C.rust, 3.6) + '<rect x="60" y="-140" width="190" height="110" fill="url(#' + P + 'brick)"/>' +
          solid([[[110, -30], [110, -82], [125, -100], [185, -100], [200, -82], [200, -30]]], C.ink, 3) +
          at(155, -34, 0.34, KIT.flames(0, 0, 1)) + solid([R(125, -42, 60, 10)], "#6B4A2F", 2.4) +
          solid([R(50, -38, 210, 8)], C.slate, 2.6) + solid([R(46, -150, 218, 12)], C.cream, 3.4) + line("M54,-141 H258", C.tan, 2);
        // the family portrait on the mantel (Part 1's loved-ones portrait): each relative drawn twice, alive (rel-a) and

        var PT = HOUSE.PORTRAIT, f = PT.frame, inn = [f[0] + 9, f[1] + 9, f[2] - 18, f[3] - 18];
        var rels = RELS.map(function (r, i) {
          return at(PT.x0 + i * PT.dx, PT.y, PT.s, g("rel-a" + i, KIT.person(r), o.bones ? 'opacity="0"' : "") +
            g("rel-b" + i, KIT.person(mix(r, { skeleton: true })), o.bones ? "" : 'opacity="0"'));
        }).join("");
        var reaper = o.reaper ? at(PT.reaper[0], PT.reaper[1], PT.s, g("preaper", KIT.reaper())) : "";

          '<rect x="' + inn[0] + '" y="' + inn[1] + '" width="' + inn[2] + '" height="' + inn[3] + '" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="2.4"/>' +

      }
      // The front of the house (in front of the family). o: { sign: "up" (the ECONOMY sign already standing on the

      function houseFront(o) {
        o = o || {};
        var RM = HOUSE.ROOM, rh = RM[2], Wl = HOUSE.WALL, Dr = HOUSE.DOOR, Wn = HOUSE.WIN, out = "";

        out += solid([R(132, -500, 46, 120)], C.rust, 3.6) + '<rect x="132" y="-500" width="46" height="120" fill="url(#' + P + 'brick)"/>' + solid([R(126, -510, 58, 12)], C.slate, 3) +
          g("ant", line("M-300,-436 V-516", ink, 4) + line("M-326,-506 L-300,-510 L-274,-506 M-320,-492 L-300,-496 L-280,-492 M-314,-478 L-300,-482 L-286,-478", ink, 3) + line("M-300,-516 L-286,-528", ink, 2.6));
        // the hip roof, its shingles and the eave trim
        var roof = [[-500, HOUSE.EAVE + 4], [312, HOUSE.EAVE + 4], [250, HOUSE.RIDGE], [-438, HOUSE.RIDGE]];
        out += solid([roof], C.slate) + line("M-480,-340 H294 M-466,-372 H280 M-452,-404 H265", ink, 1.6, 'opacity="0.5"') + line("M-432,-432 H244", C.orange, 2.4) +

        // the front wall left of the room, with the door hole (the hall shows through it while the door is open)
        var wallD = "M" + Wl[0] + "," + -rh + " H" + Wl[1] + " V0 H" + Wl[0] + " Z M" + Dr[0] + "," + -Dr[2] + " V0 H" + Dr[1] + " V" + -Dr[2] + " Z";

          '<path d="M' + (Wl[0] + 60) + "," + -rh + " H" + Wl[1] + " V0 H" + (Dr[1] + 4) + " V" + -(Dr[2] + 8) + " H" + (Wl[0] + 60) + ' Z" fill="url(#' + P + 'fine)" opacity="0.22"/>';
