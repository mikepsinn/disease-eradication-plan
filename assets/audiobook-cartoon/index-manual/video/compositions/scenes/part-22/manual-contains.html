<template id="manual-contains-template">
  <!-- manual-contains · collage host shot (Part 22, scene 2). The iris opens on Wishonia at her console. The orange
       manual slams onto the ledge so hard Earth wobbles in the window. "contains:": its first page stands up out of it,
       riffling, about to pop. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="manual-contains" data-width="1920" data-height="1080" data-start="0" data-duration="1.68">
    <div id="manual-contains-weave"></div>
    <div id="manual-contains-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    (function () {
      var ID = "manual-contains", V = KIT.V, S = KIT.STUDIO, E = S.earth, SZ = KIT.collage.SIZES;
      var hs = function (art, h) { return h / SZ[art][1]; };
      var TOP = S.top + 6, BH = V ? 220 : 270, BX = V ? 615 : 1020, PH = V ? 160 : 190;   // on the ledge's right end
      var cast = {
        // the Earth in her window, as a cut-out laid over the painted one (hidden below), so it can wobble
        globe: { art: "earth-big", x: E[0], y: E[1], scale: (2.04 * E[2]) / SZ["earth-big"][0] },
        page: { art: "insert", x: BX, y: TOP - BH + 40, anchor: "bottom", pivot: "bottom", scale: hs("insert", PH), hidden: true },
        book: { art: "manual-closed", x: BX, y: TOP, anchor: "bottom", pivot: "bottom", scale: hs("manual-closed", BH), hidden: true,
          label: [{ text: "HOW TO END", at: [102, 105], width: 112, size: 34 }, { text: "WAR AND DISEASE", at: [102, 138], width: 112, size: 34 }] },
      };
      var beats = [
        // "This": it slams down on the ledge and Earth wobbles
        { at: 0.3, do: "stamp", who: "book", from: 2.2, shake: 14 },
        { at: 0.36, do: "shiver", who: "globe", dur: 0.6, amp: 7, rot: 7 },
        // "contains:": the first page stands up out of it and riffles
        { on: "contains:", do: "pop", who: "page", squash: true },
        { on: "contains:", do: "hop", who: "book", height: 10 },
        { on: "contains:", offset: 0.2, do: "shiver", who: "page", dur: 0.35, amp: 4, rot: 6 },
        { on: "contains:", offset: 0.6, do: "bob", who: "page", y: 5, r: 3, speed: 3 },
      ];
      KIT.collage({ id: ID, seed: 2202, host: { iris: ["in", 0.0, 0.3] }, cast: cast, beats: beats });
      document.querySelector("#" + ID + "-hwall .earth").style.visibility = "hidden";
    })();
  </script>
</template>
