<template id="human-economy-title-template">
  <!-- human-economy-title · style test "modern limited animation" (compositions/scenes/style-modern/STYLE.md).
       The period title card: cream paper, navy letters. THE HUMAN snaps in on "Human", ECONOMY on "Economy.". Its
       first O is a wheel, and a beat later it starts to turn, with one green paper running inside it, going nowhere. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #human-economy-title-weave, #human-economy-title-cam, #human-economy-title-art, #human-economy-title-film { position: absolute; inset: 0; }
    #human-economy-title-field { position: absolute; inset: -40px; }
    #human-economy-title-field { background: #F3ECD0; }
    #human-economy-title-words { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; color: #112845; }
    #human-economy-title-the { font-family: "Oswald"; font-weight: 600; font-size: 64px; letter-spacing: 0.42em; margin-left: 0.42em; }
    #human-economy-title-eco { display: flex; align-items: baseline; font-family: "Fraunces"; font-weight: 900; font-size: 270px; line-height: 1; letter-spacing: 0.01em; }
    #human-economy-title-ring { width: 0.74em; height: 0.74em; margin: 0 0.02em; position: relative; top: 0.015em; }
    #human-economy-title-ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .tall #human-economy-title-words { top: 640px; }
    .tall #human-economy-title-the { font-size: 52px; }
    .tall #human-economy-title-eco { font-size: 178px; }
  </style>
  <div id="root" data-composition-id="human-economy-title" data-width="1920" data-height="1080" data-start="0" data-duration="2.32">
    <div id="human-economy-title-weave">
      <div id="human-economy-title-cam">
        <div id="human-economy-title-field"></div>
        <div id="human-economy-title-words">
          <div id="human-economy-title-the">THE HUMAN</div>
          <div id="human-economy-title-eco"><span>EC</span><div id="human-economy-title-ring"></div><span>NOMY</span></div>
        </div>
      </div>
    </div>
    <div id="human-economy-title-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "human-economy-title";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      if (V) q("weave").parentNode.classList.add("tall");
      var tl = gsap.timeline({ paused: true });

      // ── The period film (the same block in every style-modern scene) ──────────
      // Over the picture and outside the camera: a cream wash (the faded print), a soft vignette the shape of the frame, the grain, a
      // frame-by-frame flicker and a few specks of dust. Under it, the gate weave: the picture drifts a pixel or two.
      function film() {
        var dust = [0, 1, 2].map(function (i) { return '<ellipse id="' + ID + "-dust" + i + '" rx="2" ry="1.4" fill="#1A1410" opacity="0"/>'; }).join("");
        q("film").innerHTML = KIT.svg(W, H,
          '<defs><radialGradient id="' + ID + '-vig" cx="0.5" cy="0.48" r="0.72"><stop offset="0.5" stop-color="#140F0A" stop-opacity="0"/><stop offset="0.8" stop-color="#140F0A" stop-opacity="0.12"/><stop offset="1" stop-color="#140F0A" stop-opacity="0.5"/></radialGradient></defs>' +
          '<rect width="' + W + '" height="' + H + '" fill="' + C.cream + '" opacity="0.07"/>' +
          '<rect width="' + W + '" height="' + H + '" fill="url(#' + ID + '-vig)"/>' + KIT.grain(ID) + dust +
          '<rect id="' + ID + '-flick" width="' + W + '" height="' + H + '" fill="#FFF6DD" opacity="0"/>');
        var flick = document.getElementById(ID + "-flick"), weave = q("weave");
        var specks = [0, 1, 2].map(function (i) { return document.getElementById(ID + "-dust" + i); });
        KIT.onTime(tl, D, function (t) {
          var f = Math.floor((sc.start + t) * 24), r = KIT.rng(f * 7919 + 17);
          r(); r();
          flick.setAttribute("opacity", (0.01 + r() * 0.035).toFixed(3));
          weave.style.transform = "translate(" + (Math.sin(f * 0.83) * 0.9 + (r() - 0.5) * 0.8).toFixed(2) + "px," + (Math.sin(f * 0.29) * 1.4 + (r() - 0.5) * 0.6).toFixed(2) + "px)";
          specks.forEach(function (s) {
            s.setAttribute("opacity", r() < 0.16 ? "0.45" : "0");
            s.setAttribute("cx", (r() * W).toFixed(0));
            s.setAttribute("cy", (r() * H).toFixed(0));
            s.setAttribute("rx", (1.4 + r() * 2.4).toFixed(1));
          });
        });
      }
      film();

      // The O of ECONOMY: a navy wheel with a cream tread and a cream hole, drawn in a 100 x 100 box (the O's size).
      // Inside, at the bottom of the hole, the paper in its two running drawings.
      var tread = "";
      for (var i = 0; i < 14; i++) {
        var a = (i / 14) * Math.PI * 2;
        tread += '<path d="M' + (50 + 34 * Math.cos(a)).toFixed(1) + "," + (50 + 34 * Math.sin(a)).toFixed(1) + " L" + (50 + 45 * Math.cos(a)).toFixed(1) + "," + (50 + 45 * Math.sin(a)).toFixed(1) + '" stroke="' + C.cream + '" stroke-width="2.6"/>';
      }
      q("ring").innerHTML = '<svg viewBox="0 0 100 100">' +
        '<circle cx="50" cy="50" r="49" fill="' + C.navy + '"/><g id="' + ID + '-tread">' + tread + "</g>" +
        '<circle cx="50" cy="50" r="31" fill="' + C.cream + '"/>' +
        '<g transform="translate(50,63) scale(0.36)"><g id="' + ID + '-pa">' + KIT.money("war", 0) + '</g><g id="' + ID + '-pb" opacity="0">' + KIT.money("war", 1) + "</g></g></svg>";

      var the = q("the"), eco = q("eco"), cam = q("cam");
      // Snaps, not slides: each line is off, then on, with a two-frame settle.
      tl.set(the, { opacity: 0 }, 0);
      tl.set(eco, { opacity: 0 }, 0);
      tl.fromTo(the, { opacity: 1, y: -14 }, { opacity: 1, y: 0, duration: 0.07, ease: "none", immediateRender: false }, cue("Human"));
      tl.fromTo(eco, { opacity: 1, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.08, ease: "none", immediateRender: false }, cue("Economy."));
      // a beat after "Economy." the wheel turns, faster and faster, and the paper runs inside it
      var spin = cue("Economy.") + 0.42, tr = document.getElementById(ID + "-tread");
      gsap.set(tr, { svgOrigin: "50 50" });
      tl.fromTo(tr, { rotation: 0 }, { rotation: -420, duration: D - spin, ease: "power2.in" }, spin);
      var pa = document.getElementById(ID + "-pa"), pb = document.getElementById(ID + "-pb");
      KIT.onTime(tl, D, function (t) {
        var run = t >= spin, k = run ? Math.floor((t - spin) / Math.max(0.05, 0.11 - (t - spin) * 0.04)) % 2 : 0;
        pa.setAttribute("opacity", k ? 0 : 1);
        pb.setAttribute("opacity", k ? 1 : 0);
      });
      // the camera creeps in
      tl.fromTo(cam, { scale: 1 }, { scale: 1.035, duration: D, ease: "none", transformOrigin: "50% 45%" }, 0);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
