<template id="magnificent-template">
  <!-- magnificent · style test "modern limited animation" (compositions/scenes/style-modern/STYLE.md).
       "Humanity has created something magnificent": a dark navy stage, a dim shape in the middle. On "magnificent:"
       a spotlight snaps on, and the magnificent creation is one green paper, chest out. A beat later it bows.
       The camera creeps in the whole time. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #magnificent-weave, #magnificent-cam, #magnificent-art, #magnificent-film { position: absolute; inset: 0; }
    #magnificent-field { position: absolute; inset: -40px; }
    #magnificent-field { background: #061D3E; }
  </style>
  <div id="root" data-composition-id="magnificent" data-width="1920" data-height="1080" data-start="0" data-duration="3.42">
    <div id="magnificent-weave">
      <div id="magnificent-cam">
        <div id="magnificent-field"></div>
        <div id="magnificent-art"></div>
      </div>
    </div>
    <div id="magnificent-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "magnificent";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      if (V) q("weave").parentNode.classList.add("tall");
      var tl = gsap.timeline({ paused: true });

      // ── The period film (the same block in every style-modern scene) ──────────
      // Over the picture and outside the camera: a cream wash (the faded print), a soft vignette the shape of the frame, the grain, a
      // frame-by-frame flicker and a few specks of dust. Under it, the gate weave: the picture drifts a pixel or two.
      function film() {
        var dust = [0, 1, 2].map(function (i) { return '<ellipse id="' + ID + "-dust" + i + '" rx="2" ry="1.4" fill="#1A1410" opacity="0"/>'; }).join("");
        q("film").innerHTML = KIT.svg(W, H,
          '<defs><radialGradient id="' + ID + '-vig" cx="0.5" cy="0.48" r="0.72"><stop offset="0.5" stop-color="#140F0A" stop-opacity="0"/><stop offset="0.8" stop-color="#140F0A" stop-opacity="0.12"/><stop offset="1" stop-color="#140F0A" stop-opacity="0.5"/></radialGradient></defs>' +
          '<rect width="' + W + '" height="' + H + '" fill="' + C.cream + '" opacity="0.07"/>' +
          '<rect width="' + W + '" height="' + H + '" fill="url(#' + ID + '-vig)"/>' + KIT.grain(ID) + dust +
          '<rect id="' + ID + '-flick" width="' + W + '" height="' + H + '" fill="#FFF6DD" opacity="0"/>');
        var flick = document.getElementById(ID + "-flick"), weave = q("weave");
        var specks = [0, 1, 2].map(function (i) { return document.getElementById(ID + "-dust" + i); });
        KIT.onTime(tl, D, function (t) {
          var f = Math.floor((sc.start + t) * 24), r = KIT.rng(f * 7919 + 17);
          r(); r();
          flick.setAttribute("opacity", (0.01 + r() * 0.035).toFixed(3));
          weave.style.transform = "translate(" + (Math.sin(f * 0.83) * 0.9 + (r() - 0.5) * 0.8).toFixed(2) + "px," + (Math.sin(f * 0.29) * 1.4 + (r() - 0.5) * 0.6).toFixed(2) + "px)";
          specks.forEach(function (s) {
            s.setAttribute("opacity", r() < 0.16 ? "0.45" : "0");
            s.setAttribute("cx", (r() * W).toFixed(0));
            s.setAttribute("cy", (r() * H).toFixed(0));
            s.setAttribute("rx", (1.4 + r() * 2.4).toFixed(1));
          });
        });
      }
      film();

      // The stage: the spotlight's cone and its pool on the floor (two flat shapes), and the paper standing in the pool.
      var L = V ? { x: 540, y: 1110, top: 70, half: 300, s: 2.9 } : { x: 960, y: 700, top: 66, half: 300, s: 2.8 };
      var feet = L.y + 46 * L.s;
      var cone = '<path d="M' + (L.x - L.top) + ",-40 L" + (L.x + L.top) + ",-40 L" + (L.x + L.half) + "," + feet + " L" + (L.x - L.half) + "," + feet + ' Z" fill="#26456F"/>' +
        '<ellipse cx="' + L.x + '" cy="' + feet + '" rx="' + L.half + '" ry="' + L.half * 0.16 + '" fill="' + C.yellow + '"/>';
      // In the dark, the paper is a shape a shade lighter than the stage (legs and all).
      var ghost = '<g fill="#0F2A4E"><rect x="-48" y="-25" width="96" height="50" rx="4"/>' +
        '<path d="M-16,24 l-6,22 h-8 M16,24 l6,22 h8" fill="none" stroke="#0F2A4E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>';
      q("art").innerHTML = KIT.svg(W, H,
        '<g id="' + ID + '-light" opacity="0">' + cone + "</g>" +
        '<g transform="translate(' + L.x + "," + L.y + ") scale(" + L.s + ')"><g id="' + ID + '-paper">' +
        '<g id="' + ID + '-ghost">' + ghost + '</g><g id="' + ID + '-lit" opacity="0">' + KIT.money("war", 0) + "</g></g></g>");

      var light = q("light"), paper = q("paper"), ghostG = q("ghost"), lit = q("lit"), cam = q("cam");
      var on = cue("magnificent:");
      tl.set(light, { opacity: 1 }, on);
      tl.set(ghostG, { opacity: 0 }, on);
      tl.set(lit, { opacity: 1 }, on);
      // chest out (held), then the bow, a beat after the word, pivoting on its feet
      gsap.set(paper, { svgOrigin: "0 46" });
      tl.set(paper, { scaleY: 1.07, rotation: -5 }, on);
      tl.set(paper, { scaleY: 1, rotation: 0 }, after("magnificent:") - 0.08);
      tl.set(paper, { rotation: 18, scaleY: 0.97 }, after("magnificent:"));
      // the camera creeps in on the paper
      var ox = (L.x / W) * 100, oy = (L.y / H) * 100;
      tl.fromTo(cam, { scale: 1 }, { scale: 1.12, duration: D, ease: "none", transformOrigin: ox + "% " + oy + "%" }, 0);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
