<template id="food-directly-template">
  <!-- food-directly · style test "modern limited animation" (compositions/scenes/style-modern/STYLE.md).
       "On my planet, we skip the mass murder step and just give people food directly, but that's probably too advanced
       for you.": the one shot with the narrator on camera. An iris opens on Wishonia, big, on a cream field with an
       orange disc behind her head; a hungry human with his pockets turned out stands across from her. On "just" she
       points; on "give" a sandwich pops out of her fingertip and flies straight to him in held steps, landing in
       his hands on "directly,". On "probably" he takes an enormous bite. On "you." she side-eyes the camera, and the
       iris closes on her face. (In 9:16 she stands behind a plain lectern, which hides where her body sprite ends.) -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #food-directly-weave, #food-directly-cam, #food-directly-art, #food-directly-film { position: absolute; inset: 0; }
    #food-directly-field { position: absolute; inset: -40px; }
    #food-directly-field { background: #F3ECD0; }
    #food-directly-back, #food-directly-wish, #food-directly-front, #food-directly-iris { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="food-directly" data-width="1920" data-height="1080" data-start="0" data-duration="7.36">
    <div id="food-directly-weave">
      <div id="food-directly-cam">
        <div id="food-directly-field"></div>
        <div id="food-directly-back"></div>
        <div id="food-directly-wish"></div>
        <div id="food-directly-front"></div>
      </div>
    </div>
    <div id="food-directly-iris"></div>
    <div id="food-directly-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "food-directly";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      if (V) q("weave").parentNode.classList.add("tall");
      var tl = gsap.timeline({ paused: true });

      // ── The period film (the same block in every style-modern scene) ──────────
      // Over the picture and outside the camera: a cream wash (the faded print), a soft vignette the shape of the frame, the grain, a
      // frame-by-frame flicker and a few specks of dust. Under it, the gate weave: the picture drifts a pixel or two.
      function film() {
        var dust = [0, 1, 2].map(function (i) { return '<ellipse id="' + ID + "-dust" + i + '" rx="2" ry="1.4" fill="#1A1410" opacity="0"/>'; }).join("");
        q("film").innerHTML = KIT.svg(W, H,
          '<defs><radialGradient id="' + ID + '-vig" cx="0.5" cy="0.48" r="0.72"><stop offset="0.5" stop-color="#140F0A" stop-opacity="0"/><stop offset="0.8" stop-color="#140F0A" stop-opacity="0.12"/><stop offset="1" stop-color="#140F0A" stop-opacity="0.5"/></radialGradient></defs>' +
          '<rect width="' + W + '" height="' + H + '" fill="' + C.cream + '" opacity="0.07"/>' +
          '<rect width="' + W + '" height="' + H + '" fill="url(#' + ID + '-vig)"/>' + KIT.grain(ID) + dust +
          '<rect id="' + ID + '-flick" width="' + W + '" height="' + H + '" fill="#FFF6DD" opacity="0"/>');
        var flick = document.getElementById(ID + "-flick"), weave = q("weave");
        var specks = [0, 1, 2].map(function (i) { return document.getElementById(ID + "-dust" + i); });
        KIT.onTime(tl, D, function (t) {
          var f = Math.floor((sc.start + t) * 24), r = KIT.rng(f * 7919 + 17);
          r(); r();
          flick.setAttribute("opacity", (0.01 + r() * 0.035).toFixed(3));
          weave.style.transform = "translate(" + (Math.sin(f * 0.83) * 0.9 + (r() - 0.5) * 0.8).toFixed(2) + "px," + (Math.sin(f * 0.29) * 1.4 + (r() - 0.5) * 0.6).toFixed(2) + "px)";
          specks.forEach(function (s) {
            s.setAttribute("opacity", r() < 0.16 ? "0.45" : "0");
            s.setAttribute("cx", (r() * W).toFixed(0));
            s.setAttribute("cy", (r() * H).toFixed(0));
            s.setAttribute("rx", (1.4 + r() * 2.4).toFixed(1));
          });
        });
      }
      film();

      // Wishonia's rig box (KIT.mountWishonia: the head 0.95 w square on top, the body sprite 0.572 w tall from
      // 0.864 w down), her pointing fingertip in the point-right body, the disc behind her head, the lectern (9:16
      // only: its center x, top, width, height) and the hungry human (feet at M.y).
      var L = V ? { wish: { x: 90, y: 330, w: 560 }, lectern: [370, 1000, 330, 440], man: { x: 860, y: 1405, s: 3 } }
        : { wish: { x: 150, y: 170, w: 640 }, lectern: null, man: { x: 1380, y: 885, s: 3.5 } };
      var w = L.wish.w, face = [L.wish.x + w / 2, L.wish.y + w * 0.5];
      var tip = [L.wish.x + 0.97 * w, L.wish.y + 0.864 * w + 0.17 * 0.572 * w];
      q("back").innerHTML = KIT.svg(W, H, '<circle cx="' + face[0] + '" cy="' + (face[1] - w * 0.02) + '" r="' + w * 0.53 + '" fill="' + C.orange + '"/>');
      KIT.mountWishonia(tl, q("wish"), { scene: ID, x: L.wish.x, y: L.wish.y, w: w });

      // The hungry human: pockets turned out (no papers, so never in the loop), then the sandwich, then the bite.
      var MAN = { tone: 2, outfit: "shirt", color: 2, look: "left" };
      function man(extra) { var o = {}, k; for (k in MAN) o[k] = MAN[k]; for (k in extra) o[k] = extra[k]; return o; }
      var mA = man({ mood: "sad", arms: [[-8, -3], [8, 3]] }), mB = man({ mood: "eager", arms: [[-50, -110], [20, -100]] }), mC = man({ mood: "smile", arms: [[-60, -150], [20, -100]] });
      var hip = KIT.rig(mA).hip[0][1];
      var pockets = [-1, 1].map(function (sx) { return '<path d="M' + (sx * 13 - 5) + "," + (hip - 2) + " h10 l-3,9 h-4 Z" + '" fill="' + C.cream + '" stroke="' + C.line + '" stroke-width="1.6" stroke-linejoin="round"/>'; }).join("");
      // A thick 1950s sandwich (person units, around its middle; about 50 wide): two slices of toast with lettuce,
      // tomato and cheese between, and a pick with an olive. bite: a round bite out of its top right corner, pick and
      // all (a clip, so whatever is behind shows through).
      var bites = 0;
      function sandwich(bite) {
        var id = ID + "-bite" + ++bites;
        var clip = bite ? '<defs><clipPath id="' + id + '"><path clip-rule="evenodd" d="M-40,-70 H40 V40 H-40 Z M4,-12 a21,21 0 1,0 42,0 a21,21 0 1,0 -42,0 Z"/></clipPath></defs>' : "";
        var toast = function (y) { return '<rect x="-25" y="' + y + '" width="50" height="11" rx="5" fill="#E2C08C" stroke="' + C.line + '" stroke-width="2.4"/>'; };
        return clip + "<g" + (bite ? ' clip-path="url(#' + id + ')"' : "") + ">" +
          '<path d="M0,-12 L0,-34" stroke="' + C.line + '" stroke-width="2.2"/><circle cx="0" cy="-36" r="4.5" fill="' + C.med + '" stroke="' + C.line + '" stroke-width="1.6"/>' +
          toast(8) +
          '<path d="M-26,7 Q-20,1 -14,7 Q-8,1 -2,7 Q4,1 10,7 Q16,1 22,7 L26,7 L26,9 L-26,9 Z" fill="' + C.med + '" stroke="' + C.line + '" stroke-width="1.8" stroke-linejoin="round"/>' +
          '<rect x="-23" y="-1" width="46" height="6" fill="' + C.war + '" stroke="' + C.line + '" stroke-width="1.8"/>' +
          '<path d="M-24,-6 H24 L20,-1 H-20 Z" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="1.8" stroke-linejoin="round"/>' +
          toast(-17) + "</g>";
      }
      var hB = KIT.rig(mB).hand, hC = KIT.rig(mC).hand;
      var held = function (h, bite, dy) { return '<g transform="translate(' + ((h[0][0] + h[1][0]) / 2).toFixed(1) + "," + ((h[0][1] + h[1][1]) / 2 + dy).toFixed(1) + ') scale(0.8)">' + sandwich(bite) + "</g>"; };
      var place = function (inner) { return '<g transform="translate(' + L.man.x + "," + (L.man.y - 100 * L.man.s) + ") scale(" + L.man.s + ')">' + inner + "</g>"; };
      var catchAt = [L.man.x + ((hB[0][0] + hB[1][0]) / 2) * L.man.s, L.man.y - 100 * L.man.s + ((hB[0][1] + hB[1][1]) / 2 - 6) * L.man.s];
      q("front").innerHTML = KIT.svg(W, H,
        (L.lectern ? '<path d="M' + (L.lectern[0] - L.lectern[2] / 2) + "," + L.lectern[1] + " h" + L.lectern[2] + " l-30," + L.lectern[3] + " h" + (60 - L.lectern[2]) + ' Z" fill="' + C.rust + '"/>' +
          '<rect x="' + (L.lectern[0] - L.lectern[2] / 2 - 22) + '" y="' + (L.lectern[1] - 22) + '" width="' + (L.lectern[2] + 44) + '" height="28" fill="' + C.navy + '"/>' : "") +
        place('<g id="' + ID + '-mA">' + KIT.person(mA) + pockets + '</g><g id="' + ID + '-mB" opacity="0">' + KIT.person(mB) + pockets + held(hB, false, -6) + "</g>" +
          '<g id="' + ID + '-mC" opacity="0">' + KIT.person(mC) + pockets + held(hC, true, -8) + "</g>") +
        '<g id="' + ID + '-fly" opacity="0"><g transform="scale(' + (0.8 * L.man.s) + ')">' + sandwich(false) + "</g></g>");

      // "give": the sandwich pops out of her fingertip and flies to his hands in held steps (twelve a second);
      // "directly,": caught; "probably": the bite.
      var fly = q("fly"), t0 = cue("give"), t1 = cue("directly,"), n = Math.max(2, Math.round((t1 - t0) * 12));
      var peak = [(tip[0] + catchAt[0]) / 2, Math.min(tip[1], catchAt[1]) - (V ? 200 : 160)];
      gsap.set(fly, { svgOrigin: "0 0" });
      for (var i = 0; i <= n; i++) {
        var u = i / n, x = (1 - u) * (1 - u) * tip[0] + 2 * (1 - u) * u * peak[0] + u * u * catchAt[0], y = (1 - u) * (1 - u) * tip[1] + 2 * (1 - u) * u * peak[1] + u * u * catchAt[1];
        tl.set(fly, { opacity: 1, x: x, y: y, rotation: -10 + 20 * u }, t0 + (u * (t1 - t0)));
      }
      tl.set(fly, { opacity: 0 }, t1);
      tl.set(q("mA"), { opacity: 0 }, t1).set(q("mB"), { opacity: 1 }, t1);
      tl.set(q("mB"), { opacity: 0 }, cue("probably")).set(q("mC"), { opacity: 1 }, cue("probably"));

      // The iris: opens on her at the start, closes on her face a beat after "you.".
      var irisR = Math.hypot(Math.max(face[0], W - face[0]), Math.max(face[1], H - face[1])) + 20;
      q("iris").innerHTML = KIT.svg(W, H, '<path id="' + ID + '-hole" fill="#0A0806" fill-rule="evenodd" d=""/>');
      var hole = q("hole"), open = 0.5, shut0 = after("you.") - 0.1, shut1 = Math.min(D, shut0 + 0.32);
      KIT.onTime(tl, D, function (t) {
        var r = t < open ? irisR * Math.pow(t / open, 1.6) : t < shut0 ? irisR : t < shut1 ? w * 0.42 + (irisR - w * 0.42) * Math.pow(1 - (t - shut0) / (shut1 - shut0), 2) : w * 0.42 * Math.max(0, 1 - (t - shut1) / 0.12);
        r = Math.max(0, r);
        hole.setAttribute("d", "M-10,-10 H" + (W + 10) + " V" + (H + 10) + " H-10 Z M" + (face[0] - r).toFixed(1) + "," + face[1] + " a" + r.toFixed(1) + "," + r.toFixed(1) + " 0 1,0 " + (2 * r).toFixed(1) + ",0 a" + r.toFixed(1) + "," + r.toFixed(1) + " 0 1,0 " + (-2 * r).toFixed(1) + ",0 Z");
      });
      // the camera creeps in on the pair
      tl.fromTo(q("cam"), { scale: 1 }, { scale: 1.04, duration: D, ease: "none", transformOrigin: "50% 45%" }, 0);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
