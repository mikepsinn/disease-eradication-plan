<template id="killed-template">
  <!-- killed · style test "modern limited animation" (compositions/scenes/style-modern/STYLE.md).
       "...killed three hundred and ten million of you in your assorted wars.": cut on "killed" close on the charred
       family on the cyan field, the father hugging his loaf. At once they x-ray into skeletons (still grinning, still
       in their hard hats, still holding the loaf) and the field drains to slate in three steps, with the headstones
       standing behind them. On "hundred" the camera pulls back: the rows of headstones run off both edges. On
       "million" 310,000,000 stamps in over the picture (it stays put; the camera creeps under it). Then the hold. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #killed-weave, #killed-cam, #killed-art, #killed-film { position: absolute; inset: 0; }
    #killed-field { position: absolute; inset: -40px; }
    #killed-field { background: #7FB5B0; }
    #killed-num { position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-family: "Fraunces"; font-weight: 900; font-size: 156px; line-height: 1; color: #F3ECD0; letter-spacing: 0.01em; opacity: 0; }
    .tall #killed-num { top: 440px; font-size: 128px; }
  </style>
  <div id="root" data-composition-id="killed" data-width="1920" data-height="1080" data-start="0" data-duration="4.54">
    <div id="killed-weave">
      <div id="killed-cam">
        <div id="killed-field"></div>
        <div id="killed-art"></div>
      </div>
      <div id="killed-num">310,000,000</div>
    </div>
    <div id="killed-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "killed";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      if (V) q("weave").parentNode.classList.add("tall");
      var tl = gsap.timeline({ paused: true });

      // ── The period film (the same block in every style-modern scene) ──────────
      // Over the picture and outside the camera: a cream wash (the faded print), a soft vignette the shape of the frame, the grain, a
      // frame-by-frame flicker and a few specks of dust. Under it, the gate weave: the picture drifts a pixel or two.
      function film() {
        var dust = [0, 1, 2].map(function (i) { return '<ellipse id="' + ID + "-dust" + i + '" rx="2" ry="1.4" fill="#1A1410" opacity="0"/>'; }).join("");
        q("film").innerHTML = KIT.svg(W, H,
          '<defs><radialGradient id="' + ID + '-vig" cx="0.5" cy="0.48" r="0.72"><stop offset="0.5" stop-color="#140F0A" stop-opacity="0"/><stop offset="0.8" stop-color="#140F0A" stop-opacity="0.12"/><stop offset="1" stop-color="#140F0A" stop-opacity="0.5"/></radialGradient></defs>' +
          '<rect width="' + W + '" height="' + H + '" fill="' + C.cream + '" opacity="0.07"/>' +
          '<rect width="' + W + '" height="' + H + '" fill="url(#' + ID + '-vig)"/>' + KIT.grain(ID) + dust +
          '<rect id="' + ID + '-flick" width="' + W + '" height="' + H + '" fill="#FFF6DD" opacity="0"/>');
        var flick = document.getElementById(ID + "-flick"), weave = q("weave");
        var specks = [0, 1, 2].map(function (i) { return document.getElementById(ID + "-dust" + i); });
        KIT.onTime(tl, D, function (t) {
          var f = Math.floor((sc.start + t) * 24), r = KIT.rng(f * 7919 + 17);
          r(); r();
          flick.setAttribute("opacity", (0.01 + r() * 0.035).toFixed(3));
          weave.style.transform = "translate(" + (Math.sin(f * 0.83) * 0.9 + (r() - 0.5) * 0.8).toFixed(2) + "px," + (Math.sin(f * 0.29) * 1.4 + (r() - 0.5) * 0.6).toFixed(2) + "px)";
          specks.forEach(function (s) {
            s.setAttribute("opacity", r() < 0.16 ? "0.45" : "0");
            s.setAttribute("cx", (r() * W).toFixed(0));
            s.setAttribute("cy", (r() * H).toFixed(0));
            s.setAttribute("rx", (1.4 + r() * 2.4).toFixed(1));
          });
        });
      }
      film();

      // ── The family (the same options in jobs, buy-food and killed) ──
      var FAMILY = {
        dad: { tone: 1, outfit: "shirt", color: 1 },
        mom: { tone: 1, hair: 1, outfit: "dress", color: 0 },
        kid: { tone: 1, outfit: "shirt", color: 3, seed: 2 },
      };
      function opts(who, extra) { var o = {}, k; for (k in FAMILY[who]) o[k] = FAMILY[who][k]; for (k in extra || {}) o[k] = extra[k]; return o; }
      function hardHat(o) {
        var r = KIT.rig(o), x = r.top[0], y = r.top[1] + 5 * r.hs, k = r.hs;
        return '<g transform="translate(' + x.toFixed(1) + "," + y.toFixed(1) + ") scale(" + k.toFixed(3) + ')">' +
          '<path d="M-21,0 Q-21,-24 0,-25 Q21,-24 21,0 Z" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="2.6"/>' +
          '<path d="M-28,0 H28 L26,5 H-26 Z" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="2.4" stroke-linejoin="round"/>' +
          '<path d="M0,-24 V-2" stroke="' + C.line + '" stroke-width="2"/></g>';
      }
      function loaf() {
        return '<path d="M-22,6 Q-24,-9 -8,-11 Q6,-13 18,-8 Q25,-4 22,7 Z" fill="' + C.tan + '" stroke="' + C.line + '" stroke-width="2.4" stroke-linejoin="round"/>' +
          '<path d="M-12,-6 l5,8 M-2,-8 l5,8 M8,-8 l5,8" stroke="' + C.cream + '" stroke-width="2.2" stroke-linecap="round"/>';
      }
      // A flat peri headstone standing on (0,0), w wide (a shade off the slate, so the skeletons stay in front).
      function stone(w) {
        var h = w * 1.25;
        return '<path d="M' + -w / 2 + ",0 V" + (-h + w / 2) + " A" + w / 2 + "," + w / 2 + " 0 0 1 " + w / 2 + "," + (-h + w / 2) + ' V0 Z" fill="' + C.peri + '"/>';
      }

      // Stage: where each one stands (feet at F.y), the rows of headstones behind (y of each row's base, stone
      // width, spacing), the back row on the horizon line, and the close shot the camera starts on (scale S, the
      // family's middle P at the screen point Q).
      var F = V ? { y: 1320, s: 3, at: { mom: 290, kid: 520, dad: 750 }, rows: [[930, 40, 78], [1010, 54, 104], [1110, 70, 140]], close: [1.4, [520, 1075], [540, 900]] }
        : { y: 860, s: 2.75, at: { mom: 745, kid: 955, dad: 1175 }, rows: [[500, 34, 74], [575, 48, 102], [670, 64, 138]], close: [1.4, [960, 572], [960, 500]] };
      var SIZE = { mom: 1, kid: 0.68, dad: 1 }, DOWN = [[-12, -4], [12, 4]], HUG = [[30, 100], [-30, -100]];
      var rows = F.rows.map(function (r, i) {
        var out = "", n = Math.ceil(W / r[2]) + 1, off = (i % 2) * r[2] * 0.5;
        for (var k = 0; k < n; k++) out += '<g transform="translate(' + (off + k * r[2] - r[2] * 0.25).toFixed(1) + "," + r[0] + ')">' + stone(r[1]) + "</g>";
        return '<g id="' + ID + "-row-" + i + '" opacity="0">' + out + "</g>";
      }).join("");
      var people = "";
      ["mom", "kid", "dad"].forEach(function (who) {
        var s = F.s * SIZE[who], arms = who === "dad" ? HUG : DOWN;
        var alive = opts(who, { charred: true, arms: arms }), bones = opts(who, { skeleton: true, arms: arms });
        var extra = hardHat(alive);
        if (who === "dad") { var h = KIT.rig(alive).hand; extra += '<g transform="translate(' + ((h[0][0] + h[1][0]) / 2).toFixed(1) + "," + ((h[0][1] + h[1][1]) / 2 - 4).toFixed(1) + ') scale(1.1)">' + loaf() + "</g>"; }
        people += '<g transform="translate(' + F.at[who] + "," + (F.y - 100 * s) + ") scale(" + s + ')">' +
          '<g class="' + ID + '-alive">' + KIT.person(alive) + "</g>" + '<g class="' + ID + '-bones">' + KIT.person(bones) + "</g>" + extra + "</g>";
      });
      q("art").innerHTML = KIT.svg(W, H, rows + people);

      // "killed": the x-ray, and the field drains in three steps; with the slate, the headstones are there
      var t0 = 0.1, alive = q("art").querySelectorAll("." + ID + "-alive"), bones = q("art").querySelectorAll("." + ID + "-bones");
      for (var i = 0; i < alive.length; i++) KIT.xray(tl, alive[i], bones[i], t0);
      tl.set(q("field"), { backgroundColor: "#55808A" }, t0 + 0.12).set(q("field"), { backgroundColor: "#3A5468" }, t0 + 0.24).set(q("field"), { backgroundColor: C.slate }, t0 + 0.36);
      F.rows.forEach(function (r, i) { tl.set(q("row-" + i), { opacity: 1 }, t0 + 0.36); });
      // The camera: close on the family, creeping in; on "hundred" it pulls back to the whole field of stones, then
      // creeps out a little more under the number. One origin serves every scale (at scale 1 the frame is the canvas).
      var cam = q("cam"), S0 = F.close[0], P = F.close[1], Q = F.close[2], hund = cue("hundred"), pull = 0.75;
      gsap.set(cam, { transformOrigin: ((S0 * P[0] - Q[0]) / (S0 - 1)).toFixed(1) + "px " + ((S0 * P[1] - Q[1]) / (S0 - 1)).toFixed(1) + "px" });
      tl.fromTo(cam, { scale: S0 }, { scale: S0 * 1.02, duration: hund, ease: "none" }, 0);
      tl.fromTo(cam, { scale: S0 * 1.02 }, { scale: 1.05, duration: pull, ease: "power2.inOut", immediateRender: false }, hund);
      tl.fromTo(cam, { scale: 1.05 }, { scale: 1, duration: D - hund - pull, ease: "none", immediateRender: false }, hund + pull);
      // "million": the number stamps in, and then the hold
      var num = q("num"), tm = cue("million");
      tl.set(num, { opacity: 1, scale: 1.3 }, tm).set(num, { scale: 0.96 }, tm + 0.04).set(num, { scale: 1 }, tm + 0.08);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
