<template id="print-template">
  <!-- print · style test "modern limited animation" (compositions/scenes/style-modern/STYLE.md).
       "You print papers from nothing (called "monetary policy")": the Politician as a stage magician on a mustard
       field, in four held poses that snap on the words. He shows his top hat; on "nothing" he holds it upside down and
       shakes it, and only a moth flutters out; on "monetary" he holds it out again and taps it twice with his wand, smug; on
       "policy" a green paper pops out of the empty hat and he throws his arms up: ta-da. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #print-weave, #print-cam, #print-art, #print-film { position: absolute; inset: 0; }
    #print-field { position: absolute; inset: -40px; }
    #print-field { background: #E8B04A; }
  </style>
  <div id="root" data-composition-id="print" data-width="1920" data-height="1080" data-start="0" data-duration="4.14">
    <div id="print-weave">
      <div id="print-cam">
        <div id="print-field"></div>
        <div id="print-art"></div>
      </div>
    </div>
    <div id="print-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "print";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      if (V) q("weave").parentNode.classList.add("tall");
      var tl = gsap.timeline({ paused: true });

      // ── The period film (the same block in every style-modern scene) ──────────
      // Over the picture and outside the camera: a cream wash (the faded print), a soft vignette the shape of the frame, the grain, a
      // frame-by-frame flicker and a few specks of dust. Under it, the gate weave: the picture drifts a pixel or two.
      function film() {
        var dust = [0, 1, 2].map(function (i) { return '<ellipse id="' + ID + "-dust" + i + '" rx="2" ry="1.4" fill="#1A1410" opacity="0"/>'; }).join("");
        q("film").innerHTML = KIT.svg(W, H,
          '<defs><radialGradient id="' + ID + '-vig" cx="0.5" cy="0.48" r="0.72"><stop offset="0.5" stop-color="#140F0A" stop-opacity="0"/><stop offset="0.8" stop-color="#140F0A" stop-opacity="0.12"/><stop offset="1" stop-color="#140F0A" stop-opacity="0.5"/></radialGradient></defs>' +
          '<rect width="' + W + '" height="' + H + '" fill="' + C.cream + '" opacity="0.07"/>' +
          '<rect width="' + W + '" height="' + H + '" fill="url(#' + ID + '-vig)"/>' + KIT.grain(ID) + dust +
          '<rect id="' + ID + '-flick" width="' + W + '" height="' + H + '" fill="#FFF6DD" opacity="0"/>');
        var flick = document.getElementById(ID + "-flick"), weave = q("weave");
        var specks = [0, 1, 2].map(function (i) { return document.getElementById(ID + "-dust" + i); });
        KIT.onTime(tl, D, function (t) {
          var f = Math.floor((sc.start + t) * 24), r = KIT.rng(f * 7919 + 17);
          r(); r();
          flick.setAttribute("opacity", (0.01 + r() * 0.035).toFixed(3));
          weave.style.transform = "translate(" + (Math.sin(f * 0.83) * 0.9 + (r() - 0.5) * 0.8).toFixed(2) + "px," + (Math.sin(f * 0.29) * 1.4 + (r() - 0.5) * 0.6).toFixed(2) + "px)";
          specks.forEach(function (s) {
            s.setAttribute("opacity", r() < 0.16 ? "0.45" : "0");
            s.setAttribute("cx", (r() * W).toFixed(0));
            s.setAttribute("cy", (r() * H).toFixed(0));
            s.setAttribute("rx", (1.4 + r() * 2.4).toFixed(1));
          });
        });
      }
      film();

      // The Politician, in person units at L (feet at y 100); everything he holds is drawn in the same units.
      var L = V ? { x: 460, y: 960, s: 3.6 } : { x: 850, y: 545, s: 3.1 };
      // A magician's top hat around the center of its opening (0, 0), opening up at rot 0 (crown down).
      function hat(rot) {
        return '<g transform="rotate(' + rot + ')">' +
          '<path d="M-17,0 L-15,36 L15,36 L17,0 Z" fill="' + C.ink + '" stroke="' + C.line + '" stroke-width="2"/>' +
          '<rect x="-16" y="22" width="32" height="6" fill="' + C.war + '"/>' +
          '<path d="M-27,-2 L27,-2 L24,4 L-24,4 Z" fill="' + C.ink + '" stroke="' + C.line + '" stroke-width="2"/>' +
          '<ellipse cx="0" cy="0" rx="17" ry="4" fill="#000"/></g>';
      }
      // A black wand with a white tip, from hand h toward the point `to`, len long.
      function wand(h, to, len) {
        var dx = to[0] - h[0], dy = to[1] - h[1], n = Math.hypot(dx, dy), ux = dx / n, uy = dy / n;
        var a = [h[0] - ux * 6, h[1] - uy * 6], b = [h[0] + ux * len, h[1] + uy * len], c = [h[0] + ux * (len - 9), h[1] + uy * (len - 9)];
        return '<path d="M' + a.join(",") + " L" + b.join(",") + '" stroke="' + C.line + '" stroke-width="5"/><path d="M' + c.join(",") + " L" + b.join(",") + '" stroke="' + C.cream + '" stroke-width="3"/>';
      }
      // The held poses (arms in degrees, 0 = down). hat: "side" (opening up, on his right hand) or "up" (held high,
      // upside down); wand: the wand tip's offset from the left hand, or tap: where it points, from the hat's center
      // (the wand arm reaches across him, so the hat and the wand stay out on the field, clear of his navy suit).
      var POSES = {
        show: { arms: [[-110, -165], [35, 95]], mood: "grin", hat: "side", wand: [0, -140] },
        empty: { arms: [[-110, -165], [100, 175]], mood: "grin", hat: "up", wand: [0, -140] },
        tapUp: { arms: [[38, 118], [35, 95]], mood: "smug", hat: "side", tap: [-4, -62] },
        tapDown: { arms: [[40, 100], [35, 95]], mood: "smug", hat: "side", tap: [2, -2] },
        tada: { arms: [[-165, -185], [35, 95]], mood: "grin", hat: "side", wand: [-40, -200] },
      };
      var hatAt = {};
      function pose(name) {
        var p = POSES[name], o = KIT.castOpts("politician", { arms: p.arms, mood: p.mood });
        var r = KIT.rig(o), hr = r.hand[1], hl = r.hand[0];
        var hx = p.hat === "up" ? [hr[0] + 2, hr[1] + 4] : [hr[0] + 2, hr[1] - 30];
        hatAt[name] = hx;
        var hatG = '<g transform="translate(' + hx[0] + "," + hx[1] + ')"><g class="' + ID + '-hat">' + hat(p.hat === "up" ? 180 : 0) + "</g></g>";
        // the paper hides behind the hat until it pops out of it (tada only)
        var paper = name === "tada" ? '<g transform="translate(' + hx[0] + "," + (hx[1] - 4) + ') scale(0.62)"><g id="' + ID + '-paper">' +
          '<g id="' + ID + '-pa">' + KIT.money("war", 0) + '</g><g id="' + ID + '-pb" opacity="0">' + KIT.money("war", 1) + "</g></g></g>" : "";
        return '<g id="' + ID + "-" + name + '" opacity="0">' + paper + KIT.person(o) + (p.wand ? wand(hl, [hl[0] + p.wand[0], hl[1] + p.wand[1]], 46) : "") + hatG + (p.tap ? wand(hl, [hx[0] + p.tap[0], hx[1] + p.tap[1]], 46) : "") + "</g>";
      }
      // The moth: two drawings, wings up and wings down.
      function moth(up) {
        var w = up ? "M0,0 L-14,-12 L-16,2 Z M0,0 L14,-12 L16,2 Z" : "M0,0 L-15,6 L-9,12 Z M0,0 L15,6 L9,12 Z";
        return '<path d="' + w + '" fill="' + C.cream + '" stroke="' + C.line + '" stroke-width="1.8" stroke-linejoin="round"/><path d="M0,-6 L0,8" stroke="' + C.line + '" stroke-width="3.4" stroke-linecap="round"/>';
      }
      q("art").innerHTML = KIT.svg(W, H,
        '<g transform="translate(' + L.x + "," + L.y + ") scale(" + L.s + ')">' + pose("show") + pose("empty") + pose("tapUp") + pose("tapDown") + pose("tada") +
        '<g transform="translate(' + hatAt.empty[0] + "," + hatAt.empty[1] + ') scale(1.5)"><g id="' + ID + '-moth" opacity="0"><g id="' + ID + '-mu">' + moth(true) + '</g><g id="' + ID + '-md" opacity="0">' + moth(false) + "</g></g></g></g>");

      // "monetary": two taps of the wand on the hat, on fours, then the pop on "policy"
      var tap0 = cue("monetary"), tapStep = Math.max(0.1, (cue("policy\").") - tap0) / 4);
      var keys = [["show", 0], ["empty", cue("nothing")], ["tapUp", tap0], ["tapDown", tap0 + tapStep], ["tapUp", tap0 + 2 * tapStep], ["tapDown", tap0 + 3 * tapStep], ["tada", cue("policy\").")]];
      keys.forEach(function (k, i) {
        tl.set(q(k[0]), { opacity: 1 }, k[1]);
        if (i > 0) tl.set(q(keys[i - 1][0]), { opacity: 0 }, k[1]);
      });
      // "nothing": the upside-down hat shakes; nothing falls out but a moth, a beat later. It drops out of the
      // opening and flutters off sideways in held steps, staying in the picture (the joke has to be seen), until
      // the next pose.
      var shook = q("empty").querySelector("." + ID + "-hat");
      gsap.set(shook, { svgOrigin: "0 -20" });
      tl.fromTo(shook, { rotation: -9 }, { rotation: 9, duration: 0.09, repeat: 5, yoyo: true, ease: "none" }, cue("nothing"));
      var mothG = q("moth"), mu = q("mu"), md = q("md"), m0 = cue("nothing") + 0.3, m1 = cue("monetary") + 0.3;
      var path = [[0, 10], [8, 22], [20, 18], [30, 8], [38, 14], [48, 4], [56, -6], [62, 0], [70, -10], [76, -20], [82, -14]], kx = V ? 0.4 : 1;
      tl.set(mothG, { opacity: 1 }, m0);
      path.forEach(function (p, i) { tl.set(mothG, { x: p[0] * kx, y: p[1] }, m0 + (i * (m1 - m0)) / path.length); });
      tl.set(mothG, { opacity: 0 }, m1);
      // "policy": the paper pops out of the empty hat in two snaps, then kicks its legs
      var paper = q("paper"), pa = q("pa"), pb = q("pb"), pop = cue("policy\").");
      tl.set(paper, { y: 30 }, 0);
      tl.set(paper, { y: -30 }, pop + 0.04);
      tl.set(paper, { y: -68 }, pop + 0.09);
      KIT.onTime(tl, D, function (t) {
        var k = t >= m0 ? Math.floor((t - m0) / 0.07) % 2 : 0;
        mu.setAttribute("opacity", k ? 0 : 1);
        md.setAttribute("opacity", k ? 1 : 0);
        var j = t >= pop + 0.1 ? Math.floor((t - pop) / 0.1) % 2 : 0;
        pa.setAttribute("opacity", j ? 0 : 1);
        pb.setAttribute("opacity", j ? 1 : 0);
      });
      // the camera creeps in on the hat
      var hx = L.x + hatAt.show[0] * L.s, hy = L.y + hatAt.show[1] * L.s;
      tl.fromTo(q("cam"), { scale: 1 }, { scale: 1.07, duration: D, ease: "none", transformOrigin: (hx / W) * 100 + "% " + (hy / H) * 100 + "%" }, 0);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
