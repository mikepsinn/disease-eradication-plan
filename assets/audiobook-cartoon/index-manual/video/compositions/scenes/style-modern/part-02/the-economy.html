<template id="the-economy-template">
  <!-- the-economy · style test "modern limited animation" (compositions/scenes/style-modern/STYLE.md).
       "This is called "the economy". One downside of this system is that it has...": on a cream field, close on the
       green paper running hard. On "the economy" the camera pulls back: it is running on top of a big wheel made of the
       four color fields it just ran through (mustard, rust, peri, cyan), and the wheel turns under it, so it goes
       nowhere. On "downside" everything freezes mid-stride with a jolt, and the camera pushes in on the frozen paper
       to the end. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #the-economy-weave, #the-economy-cam, #the-economy-art, #the-economy-film { position: absolute; inset: 0; }
    #the-economy-field { position: absolute; inset: -600px; }
    #the-economy-field { background: #F3ECD0; }
  </style>
  <div id="root" data-composition-id="the-economy" data-width="1920" data-height="1080" data-start="0" data-duration="4.74">
    <div id="the-economy-weave">
      <div id="the-economy-cam">
        <div id="the-economy-field"></div>
        <div id="the-economy-art"></div>
      </div>
    </div>
    <div id="the-economy-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "the-economy";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      if (V) q("weave").parentNode.classList.add("tall");
      var tl = gsap.timeline({ paused: true });

      // ── The period film (the same block in every style-modern scene) ──────────
      // Over the picture and outside the camera: a cream wash (the faded print), a soft vignette the shape of the frame, the grain, a
      // frame-by-frame flicker and a few specks of dust. Under it, the gate weave: the picture drifts a pixel or two.
      function film() {
        var dust = [0, 1, 2].map(function (i) { return '<ellipse id="' + ID + "-dust" + i + '" rx="2" ry="1.4" fill="#1A1410" opacity="0"/>'; }).join("");
        q("film").innerHTML = KIT.svg(W, H,
          '<defs><radialGradient id="' + ID + '-vig" cx="0.5" cy="0.48" r="0.72"><stop offset="0.5" stop-color="#140F0A" stop-opacity="0"/><stop offset="0.8" stop-color="#140F0A" stop-opacity="0.12"/><stop offset="1" stop-color="#140F0A" stop-opacity="0.5"/></radialGradient></defs>' +
          '<rect width="' + W + '" height="' + H + '" fill="' + C.cream + '" opacity="0.07"/>' +
          '<rect width="' + W + '" height="' + H + '" fill="url(#' + ID + '-vig)"/>' + KIT.grain(ID) + dust +
          '<rect id="' + ID + '-flick" width="' + W + '" height="' + H + '" fill="#FFF6DD" opacity="0"/>');
        var flick = document.getElementById(ID + "-flick"), weave = q("weave");
        var specks = [0, 1, 2].map(function (i) { return document.getElementById(ID + "-dust" + i); });
        KIT.onTime(tl, D, function (t) {
          var f = Math.floor((sc.start + t) * 24), r = KIT.rng(f * 7919 + 17);
          r(); r();
          flick.setAttribute("opacity", (0.01 + r() * 0.035).toFixed(3));
          weave.style.transform = "translate(" + (Math.sin(f * 0.83) * 0.9 + (r() - 0.5) * 0.8).toFixed(2) + "px," + (Math.sin(f * 0.29) * 1.4 + (r() - 0.5) * 0.6).toFixed(2) + "px)";
          specks.forEach(function (s) {
            s.setAttribute("opacity", r() < 0.16 ? "0.45" : "0");
            s.setAttribute("cx", (r() * W).toFixed(0));
            s.setAttribute("cy", (r() * H).toFixed(0));
            s.setAttribute("rx", (1.4 + r() * 2.4).toFixed(1));
          });
        });
      }
      film();

      // The wheel: four quarter wedges in the four fields' colors, a navy rim, a cream hub. The paper runs on its top.
      var R = V ? { x: 540, y: 1000, r: 390, s: 2.3 } : { x: 960, y: 650, r: 330, s: 2.2 };
      var cols = [C.yellow, C.rust, C.peri, C.cyan], wedges = "";
      cols.forEach(function (c, i) {
        var a0 = (i * Math.PI) / 2 - Math.PI / 2, a1 = a0 + Math.PI / 2;
        wedges += '<path d="M0,0 L' + (R.r * Math.cos(a0)).toFixed(1) + "," + (R.r * Math.sin(a0)).toFixed(1) + " A" + R.r + "," + R.r + " 0 0 1 " + (R.r * Math.cos(a1)).toFixed(1) + "," + (R.r * Math.sin(a1)).toFixed(1) + ' Z" fill="' + c + '"/>';
      });
      var wheel = '<g transform="translate(' + R.x + "," + R.y + ')"><g id="' + ID + '-wheel">' + wedges +
        '<circle r="' + R.r + '" fill="none" stroke="' + C.navy + '" stroke-width="12"/>' +
        '<circle r="' + R.r * 0.12 + '" fill="' + C.cream + '" stroke="' + C.ink + '" stroke-width="5"/><circle r="' + R.r * 0.04 + '" fill="' + C.ink + '"/></g></g>';
      var top = R.y - R.r - 9;
      q("art").innerHTML = KIT.svg(W, H, wheel +
        '<g transform="translate(' + R.x + "," + (top - 46 * R.s) + ") scale(" + R.s + ')"><g id="' + ID + '-runner">' +
        '<g id="' + ID + '-pa">' + KIT.money("war", 0) + '</g><g id="' + ID + '-pb" opacity="0" transform="translate(0,-2.5)">' + KIT.money("war", 1) + "</g></g></g>");

      var wh = q("wheel"), runner = q("runner"), pa = q("pa"), pb = q("pb"), stop = cue("downside");
      gsap.set(wh, { svgOrigin: "0 0" });
      gsap.set(runner, { svgOrigin: "0 46" });
      // the wheel turns under the paper (its top moving left) until "downside", then stops dead
      tl.fromTo(wh, { rotation: 0 }, { rotation: -(stop / 2.6) * 360, duration: stop, ease: "none" }, 0);
      // the run: two drawings swapped every 0.08 s (the second a little higher: a hop), leaning into it
      tl.set(runner, { rotation: 8 }, 0);
      KIT.onTime(tl, D, function (t) {
        var k = t < stop ? Math.floor(t / 0.08) % 2 : 1;
        pa.setAttribute("opacity", k ? 0 : 1);
        pb.setAttribute("opacity", k ? 1 : 0);
      });
      // "the economy": the camera pulls back from the paper to the whole wheel
      var cam = q("cam"), ox = (R.x / W) * 100 + "%", oy = ((top - 50 * R.s) / H) * 100 + "%";
      tl.fromTo(cam, { scale: 2.3, transformOrigin: ox + " " + oy }, { scale: 1, transformOrigin: ox + " " + oy, duration: 0.85, ease: "power2.inOut" }, cue("\"the"));
      // "downside": the freeze, with a two-frame jolt
      tl.set(cam, { x: 9, y: -5 }, stop).set(cam, { x: -6, y: 3 }, stop + 0.04).set(cam, { x: 0, y: 0 }, stop + 0.08);
      // "...this system is that it has": the camera pushes in on the frozen paper, slowly and then faster, bringing it
      // down to the middle of the frame, into the cut
      tl.fromTo(cam, { scale: 1, y: 0 }, { scale: 1.45, y: V ? 300 : 190, duration: D - stop - 0.1, ease: "power1.in", immediateRender: false }, stop + 0.1);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
