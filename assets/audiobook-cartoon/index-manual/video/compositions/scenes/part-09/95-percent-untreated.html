<template id="95-percent-untreated-template">
  <!-- 95-percent-untreated · Layer B (storyboards/part-09-unexplored-therapeutic-frontier.md). A 10 by 10 grid of disease
       blobs pops up row by row on "Ninety-five", all grinning; on "zero" a "0" tag clips onto 95 of them in a ripple;
       on "F.D.A.-approved" the last five each get a teal pill bottle and start to sweat and shake; after "treatments."
       the 95 do a smug bounce wave. Beside the grid a service booth drops in on "Food", its sign on "Administration"
       ("FOOD AND DRUG ADMINISTRATION", plain lettering), the shutter rattles down on "not" and slams on
       "administered", with a BACK SOON card swinging on it. On "drugs" a sick human (shirt, fedora, red chest light)
       shuffles up and knocks; on the second "ninety-five" the card's clock spins; on "percent" his hair goes white
       and a beard shoots down to the floor; on "food-and-drug-related" he knocks again, weaker, a cobweb spins from
       his knuckles to the shutter and a spider lowers onto his hat (Part 1's without-with-papers web and spider).
       Crickets on the counter. In: slide left from the title card. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    [id="95-percent-untreated-cam"], [id="95-percent-untreated-bg"], [id="95-percent-untreated-art"], [id="95-percent-untreated-pip"], [id="95-percent-untreated-grain"] { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="95-percent-untreated" data-width="1920" data-height="1080" data-start="0" data-duration="12.5">
    <div id="95-percent-untreated-cam">
      <div id="95-percent-untreated-bg"></div>
      <div id="95-percent-untreated-art"></div>
      <div id="95-percent-untreated-pip"></div>
    </div>
    <div id="95-percent-untreated-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/characters.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script>
    (function () {
      var ID = "95-percent-untreated";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      // (the id starts with a digit, so it is not a CSS selector: getElementById only)
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var ink = C.line, P = ID + "-", WHITE = "#FBF6E6";

      // The grid (column centers x0 + c*dx, row feet y0 + r*dy, blob scale s) and the booth (left x, width, the top
      // of its body and the ground it stands on), with the patient's scale. 9:16: the booth top left (clear of the
      // saucer), the grid below it (clear of the captions).
      var L = V
        ? { grid: { x0: 84, dx: 96, y0: 872, dy: 63, s: 0.42 }, booth: { x: 76, w: 400, top: 340, by: 792 }, ps: 1.62, tag: 16 }
        : { grid: { x0: 118, dx: 100, y0: 206, dy: 70, s: 0.42 }, booth: { x: 1126, w: 380, top: 352, by: 782 }, ps: 1.6, tag: 16 };

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      var f1 = function (n) { return (+n).toFixed(1); };
      function g(id, inner, attrs) { return '<g id="' + P + id + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
      function at(x, y, s, inner) { return '<g transform="translate(' + f1(x) + "," + f1(y) + ")" + (s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; }
      function poly(pts, fill, sw, extra) {
        return '<path d="M' + pts.map(function (p) { return f1(p[0]) + "," + f1(p[1]); }).join(" L") + ' Z" fill="' + fill + '" stroke="' + ink + '" stroke-width="' + (sw || 3) + '" stroke-linejoin="miter" stroke-miterlimit="8"' + (extra ? " " + extra : "") + "/>";
      }
      function rect(x, y, w, h, fill, sw, extra) { return poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, sw, extra); }
      function text(x, y, size, t, fill, extra) {
        return '<text x="' + f1(x) + '" y="' + f1(y) + '" font-family="Oswald" font-weight="600" font-size="' + size + '" fill="' + (fill || ink) + '" text-anchor="middle" ' + (extra || "") + ">" + t + "</text>";
      }

      // ── The grid of 100 diseases ─────────────────────────────────────
      // Eight drawings (four colors, smug or grinning), defined once and placed with <use>. Index i = r*10 + c; the
      // last five (the end of the bottom row) are the ones with a treatment.
      var G = L.grid, s = G.s, COLS = ["peri", "rust", "tan", "yellow"];
      var defs = "";
      for (var k = 0; k < 8; k++) defs += '<g id="' + P + "v" + k + '">' + KIT.props.diseaseBlob({ color: COLS[k % 4], mood: k < 4 ? "smug" : "grin", seed: k + 1 }) + "</g>";
      var vr = KIT.rng(95);
      var TREATED = [95, 96, 97, 98, 99];
      function cell(i) { var r = Math.floor(i / 10), c = i % 10; return { r: r, c: c, x: G.x0 + c * G.dx, y: G.y0 + r * G.dy }; }
      // The "0" tag on a string, tied to the blob's upper right (canvas px; it swings about the knot).
      function tag(i) {
        var t = L.tag, w = t * 1.45, h = t * 1.2;
        return '<g transform="translate(' + f1(30 * s / 0.42) + "," + f1(-92 * s) + ')"><g id="' + P + "tag-" + i + '">' +
          '<path d="M0,0 L5,9" stroke="' + ink + '" stroke-width="1.6"/>' +
          '<g transform="translate(3,8) rotate(12)">' + poly([[-2, 0], [w, 0], [w, h], [-2, h]], WHITE, 2) +
          '<circle cx="2.6" cy="' + f1(h / 2) + '" r="1.8" fill="' + C.paper + '" stroke="' + ink + '" stroke-width="1"/>' +
          text(w / 2 + 2.5, h / 2 + t * 0.36, t, "0", ink) + "</g></g></g>";
      }
      // A teal pill bottle (the prop is orange; medicine is teal) and the two faces of a treated disease.
      var bottle = KIT.props.pillBottle({ size: 0.34, label: "" }).replace(/#E5903B/g, C.med).replace(/#904B2E/g, "#1F6E68");
      var gridSvg = "";
      for (var i = 0; i < 100; i++) {
        var ce = cell(i), v = Math.floor(vr() * 8), treated = TREATED.indexOf(i) >= 0;
        var body = treated
          ? g("calm-" + i, '<use href="#' + P + "v" + (4 + (i % 4)) + '" transform="scale(' + s + ')"/>') +
            g("scared-" + i, at(0, 0, s, KIT.props.diseaseBlob({ color: COLS[i % 4], mood: "scared", seed: 5 + (i % 4) })), 'opacity="0"') +
            g("sweat-" + i, '<path d="M' + f1(-40 * s) + "," + f1(-120 * s) + ' q-5,8 0,11 q5,-3 0,-11 Z" fill="#DCEBF0" stroke="' + ink + '" stroke-width="1.6"/>', 'opacity="0"')
          : '<use href="#' + P + "v" + v + '" transform="scale(' + s + ')"/>' + tag(i);
        gridSvg += at(ce.x, ce.y, 1, g("b-" + i, g("shake-" + i, body)) +
          (treated ? at(46 * s / 0.42, 0, 1, g("bottle-" + i, bottle)) : ""));
      }

      // ── The booth ────────────────────────────────────────────────────
      var B = L.booth, bx = B.x, bw = B.w, top = B.top, by = B.by;
      var ox = bx + 36, ow = bw - 72, oy = top + 40, oh = V ? 244 : 236, ledge = oy + oh;
      var boothBody = rect(bx, top, bw, by - top, C.tan, 4) +
        rect(bx, top, bw, by - top, "url(#" + P + "fine)", 0, 'opacity="0.35" stroke="none"') +
        // the opening, dark inside, with a shelf and the roll housing at its top
        rect(ox, oy, ow, oh, C.slate, 4) + rect(ox + 14, oy + 120, ow - 28, 8, C.rust, 2) +
        rect(ox - 6, oy - 22, ow + 12, 24, C.navy, 3) + '<path d="M' + f1(ox) + "," + f1(oy - 10) + " H" + f1(ox + ow) + '" stroke="' + C.orange + '" stroke-width="2"/>' +
        // the counter ledge and the panel under it
        poly([[ox - 22, ledge], [ox + ow + 22, ledge], [ox + ow + 14, ledge + 16], [ox - 14, ledge + 16]], C.rust, 3) +
        rect(bx + 30, ledge + 34, bw - 60, by - ledge - 54, C.orange, 3) + '<path d="M' + f1(bx + 50) + "," + f1(ledge + 60) + " H" + f1(bx + bw - 50) + '" stroke="' + C.cream + '" stroke-width="5" opacity="0.6"/>';
      // The awning, out over the spot where the customers stand (to the right).
      var aw0 = bx - 18, aw1 = bx + bw + 170, ay = top - 30, stripes = "";
      for (var x = aw0, n = 0; x < aw1; x += 38, n++) {
        var x2 = Math.min(aw1, x + 38);
        stripes += poly([[x, ay], [x2, ay], [x2, ay + 30], [(x + x2) / 2, ay + 42], [x, ay + 30]], n % 2 ? C.cream : C.orange, 2.4);
      }
      var awning = rect(aw0 - 4, ay - 10, aw1 - aw0 + 8, 12, C.rust, 3) + stripes +
        '<path d="M' + f1(aw1 - 6) + "," + f1(ay + 30) + " L" + f1(aw1 - 6) + "," + f1(by - 300) + '" stroke="' + ink + '" stroke-width="0"/>';
      // The shutter: corrugated steel, clipped to the opening; drawn closed, it starts rolled up into the housing.
      var corr = "";
      for (var yy = oy + 12; yy < oy + oh; yy += 14) corr += '<path d="M' + f1(ox) + "," + f1(yy) + " H" + f1(ox + ow) + '" stroke="' + ink + '" stroke-width="1.6" opacity="0.55"/>';
      // The BACK SOON card, hanging on a nail at the shutter's top, with a little clock face.
      var cw = 170, chh = 100, ccx = ox + ow / 2, nailY = oy + 14, cy0 = nailY + 22;
      var clockC = [ccx, cy0 + 66], cr = 19;
      var card = g("card", '<path d="M' + f1(ccx) + "," + f1(nailY) + " L" + f1(ccx - 46) + "," + f1(cy0) + " M" + f1(ccx) + "," + f1(nailY) + " L" + f1(ccx + 46) + "," + f1(cy0) + '" stroke="' + ink + '" stroke-width="2"/>' +
        rect(ccx - cw / 2, cy0, cw, chh, WHITE, 3.4) + rect(ccx - cw / 2 + 6, cy0 + 6, cw - 12, chh - 12, "none", 1.6, 'stroke="' + C.orange + '"') +
        text(ccx, cy0 + 36, 28, "BACK SOON", C.war, 'letter-spacing="1.5"') +
        '<circle cx="' + f1(clockC[0]) + '" cy="' + f1(clockC[1]) + '" r="' + cr + '" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="3"/>' +
        [0, 1, 2, 3].map(function (k) { var a = (k * Math.PI) / 2; return '<path d="M' + f1(clockC[0] + Math.cos(a) * cr * 0.72) + "," + f1(clockC[1] + Math.sin(a) * cr * 0.72) + " L" + f1(clockC[0] + Math.cos(a) * cr * 0.88) + "," + f1(clockC[1] + Math.sin(a) * cr * 0.88) + '" stroke="' + ink + '" stroke-width="2"/>'; }).join("") +
        g("hand-h", '<path d="M' + f1(clockC[0]) + "," + f1(clockC[1]) + " L" + f1(clockC[0] + cr * 0.5) + "," + f1(clockC[1]) + '" stroke="' + ink + '" stroke-width="3.2" stroke-linecap="round"/>') +
        g("hand-m", '<path d="M' + f1(clockC[0]) + "," + f1(clockC[1]) + " L" + f1(clockC[0]) + "," + f1(clockC[1] - cr * 0.78) + '" stroke="' + C.war + '" stroke-width="2.4" stroke-linecap="round"/>') +
        '<circle cx="' + f1(clockC[0]) + '" cy="' + f1(clockC[1]) + '" r="2.6" fill="' + ink + '"/>') +
        '<circle cx="' + f1(ccx) + '" cy="' + f1(nailY) + '" r="3.4" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="1.6"/>';
      var shutter = '<defs><clipPath id="' + P + 'open"><rect x="' + f1(ox) + '" y="' + f1(oy) + '" width="' + f1(ow) + '" height="' + f1(oh + 2) + '"/></clipPath></defs>' +
        '<g clip-path="url(#' + P + 'open)">' + g("shutter", rect(ox, oy, ow, oh, "#9AA4B5", 3.4) + corr +
          rect(ox, oy + oh - 18, ow, 18, "#7D879A", 3) + rect(ccx - 22, oy + oh - 14, 44, 8, ink, 0) + card) + "</g>";
      // The cricket on the counter (Part 1's), and its chirps.
      var cricket = at(ox + 26, ledge, 1, '<path d="M-4,-4 l-7,-9 l-4,12 M2,-4 l3,4" fill="none" stroke="' + ink + '" stroke-width="2" stroke-linecap="round"/>' +
        '<ellipse cx="0" cy="-7" rx="10" ry="5" fill="' + ink + '"/><circle cx="10" cy="-9" r="4" fill="' + ink + '"/><path d="M12,-12 q6,-12 15,-9" fill="none" stroke="' + ink + '" stroke-width="1.6"/>' +
        g("chirp", '<path d="M24,-20 q5,4 0,9 M31,-24 q8,7 0,17" fill="none" stroke="' + ink + '" stroke-width="2.4" stroke-linecap="round"/>', 'opacity="0"'));
      var ground = g("ground", '<path d="M' + f1(V ? 56 : bx - 50) + "," + f1(by) + " H" + f1(V ? W - 60 : 1590) + '" stroke="' + ink + '" stroke-width="5"/>', 'opacity="0"');
      var sign = at(bx + bw / 2, ay - 10, 1, g("sign", KIT.props.sign({ text: "FOOD AND DRUG\nADMINISTRATION", fontSize: 30, height: 12 })));

      // ── The patient: young, then old (white hair), and his beard ─────
      var PO = { tone: 1, outfit: "shirt", color: 1, seed: 3, hat: "fedoraUp", light: "red", look: "left", arms: [[-84, -150], [14, 6]] };
      var young = Object.assign({ mood: "worried" }, PO), old = Object.assign({ mood: "sad", hairColor: "#EEE9DD" }, PO);
      var R = KIT.rig(young), ps = L.ps, fdir = -1;
      // Stand him so that his knuckles touch the shutter near its right edge.
      var fist = [ox + ow - 26, 0], px = fist[0] - ps * R.hand[0][0];
      fist[1] = by - 100 * ps + ps * R.hand[0][1];
      var m = R.mouth, my = m[1] - 2;
      // The beard (person units, dx forward from the mouth): a wedge from the jaw to the floor, wavy edges, a
      // zigzag hem, and the end piled on the floor in front of his shoes. Group 2's old humans copy this shape.
      var beardPts = [[-11, my - 2], [7, my + 1], [12, my + 12], [10, my + 30], [16, 30], [14, 60], [20, 88], [44, 92], [50, 100], [-24, 100], [-20, 92], [-25, 84], [-19, 60], [-22, 34], [-15, my + 22], [-17, my + 8]]
        .map(function (p) { return [m[0] + fdir * p[0], p[1]]; });
      var strands = [[[0, my + 12], [-2, 40], [2, 80]], [[-9, my + 22], [-12, 56], [-10, 90]], [[8, my + 30], [10, 64], [26, 94]]].map(function (st) {
        return "M" + st.map(function (p) { return f1(m[0] + fdir * p[0]) + "," + f1(p[1]); }).join(" L");
      }).join(" ");
      var beard = g("beard", poly(beardPts, WHITE, 2.2) + '<path d="' + strands + '" fill="none" stroke="' + ink + '" stroke-width="1.3" opacity="0.5"/>');
      var hatTop = [R.top[0], R.top[1] - 15 * R.build.hs];
      var patient = at(0, by - 100 * ps, 1, g("pat", g("pat-bob", at(0, 0, ps,
        g("young", KIT.person(young)) + g("old", KIT.person(old), 'opacity="0"') + beard)))) +
        g("knock", [0, 1, 2].map(function (k) { var a = -0.6 + k * 0.6; return '<path d="M' + f1(fist[0] + 14 * Math.cos(a) + 4) + "," + f1(fist[1] + 14 * Math.sin(a)) + " l" + f1(12 * Math.cos(a)) + "," + f1(12 * Math.sin(a)) + '" stroke="' + ink + '" stroke-width="3" stroke-linecap="round"/>'; }).join(""), 'opacity="0"');

      // The cobweb from his knuckles to the shutter (Part 1's web, drawn on), and the spider on its thread.
      var wc = [fist[0] - 2, fist[1] - 40], anchors = [[fist[0] + 6, fist[1] + 4], [fist[0] - 46, fist[1] - 8], [fist[0] - 36, fist[1] - 74], [fist[0] + 18, fist[1] - 86], [fist[0] + 40, fist[1] - 40]];
      var web = anchors.map(function (a) { return "M" + f1(wc[0]) + "," + f1(wc[1]) + " L" + f1(a[0]) + "," + f1(a[1]); }).join(" ");
      [0.35, 0.65, 0.92].forEach(function (f) {
        for (var i = 0; i < anchors.length - 1; i++) {
          var a = anchors[i], b = anchors[i + 1];
          var p = [wc[0] + (a[0] - wc[0]) * f, wc[1] + (a[1] - wc[1]) * f], r = [wc[0] + (b[0] - wc[0]) * f, wc[1] + (b[1] - wc[1]) * f];
          var mm = [(p[0] + r[0]) / 2 + (wc[0] - (p[0] + r[0]) / 2) * 0.2, (p[1] + r[1]) / 2 + (wc[1] - (p[1] + r[1]) / 2) * 0.2];
          web += " M" + f1(p[0]) + "," + f1(p[1]) + " Q" + f1(mm[0]) + "," + f1(mm[1]) + " " + f1(r[0]) + "," + f1(r[1]);
        }
      });
      var cobweb = g("web", '<path d="' + web + '" fill="none" stroke="' + ink + '" stroke-width="1.8" opacity="0.75" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>');
      var hat = [px + ps * hatTop[0], by - 100 * ps + ps * hatTop[1]], threadTop = ay + 34;
      var spider = '<line id="' + P + 'thread" x1="' + f1(hat[0]) + '" y1="' + f1(threadTop) + '" x2="' + f1(hat[0]) + '" y2="' + f1(threadTop) + '" stroke="' + ink + '" stroke-width="1.4"/>' +
        at(hat[0], threadTop, 1, g("spider", '<path d="M-7,-3 l-5,-4 M-7,0 h-7 M-7,3 l-5,5 M7,-3 l5,-4 M7,0 h7 M7,3 l5,5" stroke="' + ink + '" stroke-width="1.8" stroke-linecap="round"/><circle r="5" fill="' + ink + '"/>', 'opacity="0"'));

      q("art").innerHTML = KIT.svg(W, H, KIT.paperDefs(ID) + "<defs>" + defs + "</defs>" + gridSvg +
        ground + g("booth", boothBody + shutter + cricket + awning) + sign + patient + cobweb + spider);

      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "slide left");
      var set = function (id, v, t) { tl.set(q(id), { opacity: v }, t); };

      // "Ninety-five": the diseases pop up row by row (a pop per row), all grinning.
      var t95 = cue("Ninety-five");
      for (var i2 = 0; i2 < 100; i2++) {
        var c2 = cell(i2), b = q("b-" + i2);
        tl.fromTo(b, { scale: 0, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.22, ease: "back.out(2.6)" }, t95 + c2.r * 0.12 + c2.c * 0.006);
      }
      // "zero": a "0" tag clips onto 95 of them, in a ripple from the left (five clicks).
      var tZero = cue("zero");
      for (var i3 = 0; i3 < 100; i3++) {
        if (TREATED.indexOf(i3) >= 0) continue;
        var c3 = cell(i3), tg = q("tag-" + i3);
        tl.fromTo(tg, { scale: 0, rotation: -70, svgOrigin: "0 0" }, { scale: 1, rotation: 0, svgOrigin: "0 0", duration: 0.32, ease: "back.out(3)" }, tZero + Math.floor(c3.c / 2) * 0.08 + c3.r * 0.004);
      }
      // "F.D.A.-approved": the last five each get a teal bottle (a pop each), then sweat and shake.
      var tFda = cue("F.D.A.-approved");
      TREATED.forEach(function (i, k) {
        var t = tFda + k * 0.15;
        tl.fromTo(q("bottle-" + i), { scale: 0, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.24, ease: "back.out(3)" }, t);
        set("calm-" + i, 0, t + 0.1);
        set("scared-" + i, 1, t + 0.1);
        tl.fromTo(q("shake-" + i), { x: -2 }, { x: 2, duration: 0.045, repeat: Math.round((5.6 - (t + 0.15)) / 0.045), yoyo: true, ease: "none" }, t + 0.15);
        [0, 1, 2].forEach(function (d) {
          var td = t + 0.3 + d * 0.9 + k * 0.07;
          tl.fromTo(q("sweat-" + i), { opacity: 1, y: 0 }, { opacity: 0, y: 26 * s / 0.42, duration: 0.5, ease: "power1.in", immediateRender: false }, td);
        });
      });
      // after "treatments.": the 95 do a smug little bounce, a wave running across the grid (boing).
      var tSmug = KIT.after(ID, "treatments.");
      for (var i4 = 0; i4 < 100; i4++) {
        if (TREATED.indexOf(i4) >= 0) continue;
        var c4 = cell(i4), bb = q("b-" + i4), tb = tSmug + c4.c * 0.05 + c4.r * 0.012;
        tl.to(bb, { y: -16, duration: 0.13, ease: "power2.out" }, tb);
        tl.to(bb, { y: 0, duration: 0.2, ease: "bounce.out" }, tb + 0.13);
      }

      // "Food": the booth drops in and lands (clank). "Administration": its sign lands on the roof (thunk).
      var tFood = cue("Food"), booth = q("booth"), bcx = bx + bw / 2;
      set("ground", 1, tFood);
      tl.fromTo(booth, { y: -(by + 60) }, { y: 0, duration: 0.3, ease: "power3.in" }, tFood - 0.3);
      tl.fromTo(booth, { scaleY: 1, svgOrigin: bcx + " " + by }, { scaleY: 0.92, svgOrigin: bcx + " " + by, duration: 0.06, ease: "power2.out", immediateRender: false }, tFood);
      tl.to(booth, { scaleY: 1, svgOrigin: bcx + " " + by, duration: 0.3, ease: "back.out(3)" }, tFood + 0.06);
      var tAdm = cue("Administration"), signG = q("sign");
      tl.fromTo(signG, { y: -(ay + 140) }, { y: 0, duration: 0.24, ease: "power3.in" }, tAdm - 0.24);
      tl.fromTo(signG, { rotation: 0, svgOrigin: "0 0" }, { rotation: 4, svgOrigin: "0 0", duration: 0.08, repeat: 3, yoyo: true, ease: "sine.inOut", immediateRender: false }, tAdm);

      // "not": the shutter rattles down in jerks. "administered": it slams shut (slam), the booth shakes and the
      // BACK SOON card swings on its nail.
      var tNot = cue("not"), tSlam = cue("administered") + 0.55, sh = q("shutter");
      tl.fromTo(sh, { y: -oh - 4 }, { y: -oh * 0.72, duration: 0.14, ease: "power1.in" }, tNot);
      [[-0.68, 0.06], [-0.5, 0.14], [-0.47, 0.06], [-0.33, 0.14], [-0.31, 0.06]].reduce(function (t, k) {
        tl.to(sh, { y: oh * k[0], duration: k[1], ease: "power1.inOut" }, t);
        return t + k[1] + 0.04;
      }, tNot + 0.16);
      tl.to(sh, { y: 0, duration: 0.12, ease: "power3.in" }, tSlam - 0.12);
      tl.to(sh, { y: -9, duration: 0.06, ease: "power1.out" }, tSlam);
      tl.to(sh, { y: 0, duration: 0.07, ease: "power1.in" }, tSlam + 0.06);
      tl.fromTo(booth, { x: 0 }, { x: 5, duration: 0.03, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, tSlam);
      var cardG = q("card");
      gsap.set(cardG, { svgOrigin: f1(ccx) + " " + f1(nailY) });
      tl.fromTo(cardG, { rotation: 0 }, { rotation: 22, duration: 0.08, ease: "power2.out", immediateRender: false }, tSlam);
      tl.to(cardG, { rotation: 0, duration: 1.6, ease: "elastic.out(1.1, 0.25)" }, tSlam + 0.08);

      // The patient shuffles in from the right, chest light blinking, and knocks on "drugs" (pat).
      var tDrugs = cue("drugs"), tIn = tSlam - 0.5, pat = q("pat"), patBob = q("pat-bob");
      tl.fromTo(pat, { x: W + 140 }, { x: px, duration: tDrugs - 0.16 - tIn, ease: "power1.out" }, tIn);
      var steps = Math.floor((tDrugs - 0.16 - tIn) / 0.1);
      tl.fromTo(patBob, { y: 0 }, { y: -5, duration: 0.1, repeat: steps, yoyo: true, ease: "sine.inOut" }, tIn);
      ["young", "old"].forEach(function (who) {
        var person = q(who);
        [[".leg-l", 0, 9], [".leg-r", 1, -9]].forEach(function (lg) {
          var leg = person.querySelector(lg[0]);
          gsap.set(leg, { svgOrigin: R.hip[lg[1]].join(" ") });
          if (who !== "young") return;
          tl.fromTo(leg, { rotation: lg[2] }, { rotation: -lg[2], duration: 0.1, repeat: steps, yoyo: true, ease: "sine.inOut" }, tIn);
          tl.to(leg, { rotation: 0, duration: 0.08, ease: "power1.out" }, tDrugs - 0.16);
        });
        // the chest light blinks red until his last knock, then stays on
        var blinks = 2 * Math.floor((cue("food-and-drug-related") - tIn) / 0.36) - 1;
        tl.fromTo(person.querySelector(".chest-light"), { opacity: 1 }, { opacity: 0.25, duration: 0.18, repeat: blinks, yoyo: true, ease: "steps(1)" }, tIn);
      });
      var arms = ["young", "old"].map(function (who) { var a = q(who).querySelector(".arm-l"); gsap.set(a, { svgOrigin: R.shoulder[0].join(" ") }); return a; });
      var knock = q("knock");
      function rap(t, back, hard) {
        tl.to(arms, { rotation: back, duration: 0.09, ease: "power1.out" }, t - 0.14);
        tl.to(arms, { rotation: 0, duration: 0.05, ease: "power2.in" }, t - 0.05);
        tl.fromTo(knock, { opacity: hard, scale: 0.6, svgOrigin: f1(fist[0]) + " " + f1(fist[1]) }, { opacity: 0, scale: 1.2, svgOrigin: f1(fist[0]) + " " + f1(fist[1]), duration: 0.18, ease: "power1.out", immediateRender: false }, t);
      }
      rap(tDrugs, 18, 1);
      rap(tDrugs + 0.17, 14, 0.8);
      rap(tDrugs + 0.34, 14, 0.8);

      // second "ninety-five": the card's clock hands spin round and round (whirr).
      var t95b = cue("ninety-five", 2), cc = f1(clockC[0]) + " " + f1(clockC[1]);
      tl.fromTo(q("hand-m"), { rotation: 0, svgOrigin: cc }, { rotation: 360 * 9, svgOrigin: cc, duration: 1.2, ease: "power1.inOut" }, t95b);
      tl.fromTo(q("hand-h"), { rotation: 0, svgOrigin: cc }, { rotation: 270, svgOrigin: cc, duration: 1.2, ease: "power1.inOut" }, t95b);
      // second "percent": his hair goes white and a beard shoots down to the floor (whoosh).
      var tPct = cue("percent", 2), beardG = q("beard");
      set("beard", 0, 0);
      set("beard", 1, tPct);
      tl.fromTo(beardG, { scaleY: 0.05, svgOrigin: f1(m[0]) + " " + f1(my) }, { scaleY: 1, svgOrigin: f1(m[0]) + " " + f1(my), duration: 0.32, ease: "power3.out", immediateRender: false }, tPct);
      tl.to(q("young"), { opacity: 0, duration: 0.16 }, tPct);
      tl.to(q("old"), { opacity: 1, duration: 0.16 }, tPct);
      // "food-and-drug-related": one more knock, weaker (pat); a cobweb spins from his knuckles to the shutter and
      // a spider lowers itself onto his hat. Then crickets, and nothing else moves.
      var tRel = cue("food-and-drug-related");
      tl.to(arms, { rotation: 7, duration: 0.16, ease: "sine.out" }, tRel - 0.22);
      tl.to(arms, { rotation: 0, duration: 0.08, ease: "power1.in" }, tRel - 0.06);
      tl.fromTo(knock, { opacity: 0.45, scale: 0.5, svgOrigin: f1(fist[0]) + " " + f1(fist[1]) }, { opacity: 0, scale: 0.8, svgOrigin: f1(fist[0]) + " " + f1(fist[1]), duration: 0.15, immediateRender: false }, tRel + 0.02);
      tl.to(q("web").firstChild, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "none" }, tRel + 0.12);
      set("spider", 1, tRel + 0.3);
      var drop = hat[1] - threadTop - 6;
      tl.fromTo(q("spider"), { y: 0 }, { y: drop, duration: 0.7, ease: "power2.out", immediateRender: false }, tRel + 0.3);
      tl.fromTo(q("thread"), { attr: { y2: threadTop } }, { attr: { y2: threadTop + drop }, duration: 0.7, ease: "power2.out", immediateRender: false }, tRel + 0.3);
      tl.fromTo(q("chirp"), { opacity: 0 }, { opacity: 1, duration: 0.08, repeat: Math.floor((D - 0.1 - (tRel + 0.3)) / 0.08), yoyo: true, ease: "none" }, tRel + 0.3);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
