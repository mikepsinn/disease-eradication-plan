<template id="weirdly-calm-template">
  <!-- weirdly-calm · collage host shot (Part 9, scene 7). Wishonia at the console; a cream readout on the wall draws
       two bars: THE WAIT, 443 years, and YOU, 80 years, which ends in a little headstone. "rude": she lowers her palms,
       polite. "but because": the readout goes; in the window Earth, grinning, reads its newspaper with a cup of tea,
       and turns a page. Hold; iris out on her face. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="weirdly-calm" data-width="1920" data-height="1080" data-start="0" data-duration="8.98">
    <div id="weirdly-calm-weave"></div>
    <div id="weirdly-calm-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    var ID = "weirdly-calm", V = KIT.V, S = KIT.STUDIO, SZ = KIT.collage.SIZES, D = KIT.scene(ID).duration;
    var cue = function (w, n) { return KIT.cue(ID, w, n); };
    // The readout: a cream panel (the plate's wash) on the wall with the chart on it.
    var PANEL = V ? [40, 30, 1040, 450] : [1110, 110, 1880, 720];
    var ch = KIT.collage.axes(V ? { box: [210, 140, 900, 375], x: [0, 3, 1], y: [0, 500, 100], xLabels: 1000, yLabels: 250, title: "YEARS", size: 30 }
      : { box: [1290, 220, 1800, 610], x: [0, 3, 1], y: [0, 500, 100], xLabels: 1000, yLabels: 100, title: "YEARS", size: 32 });
    var WAIT = ch.pt(1, 0), YOU = ch.pt(2, 0), YOU_TOP = ch.pt(2, 80);
    var BW = V ? 150 : 120, NAME_Y = YOU[1] + (V ? 34 : 40);
    var E = S.earth, EK = 2 * E[2] / SZ["globe-happy"][1];
    KIT.collage({
      id: ID, seed: 907, plate: PANEL, host: { iris: ["out", D - 0.6, D - 0.05] },
      cast: {
        stone: { art: "headstone", x: YOU_TOP[0], y: YOU_TOP[1] - (V ? 46 : 50), anchor: "bottom", pivot: "bottom", scale: (V ? 80 : 95) / SZ["headstone"][1], hidden: true },
        earth: { art: "globe-happy", x: E[0], y: E[1], scale: EK, hidden: true },
        paper: { art: "insert", x: E[0] - E[2] * 0.25, y: E[1] + E[2] * 0.45, pivot: "left", scale: E[2] * 1.05 / SZ["insert"][1], hidden: true },
        paper2: { art: "insert", x: E[0] - E[2] * 0.25, y: E[1] + E[2] * 0.45, pivot: "left", scale: E[2] * 1.05 / SZ["insert"][1], hidden: true },
        tea: { art: "desk-mug", x: E[0] + E[2] * 0.85, y: E[1] + E[2] * 0.75, scale: E[2] * 0.45 / SZ["desk-mug"][1], hidden: true },
      },
      beats: [
        { at: 0, do: "wash", id: "panel", color: "#EFE3C4", blend: "normal", opacity: 1, dur: 0.2 },
        { at: 0, do: "chart", chart: ch },
        { on: "You", offset: 0.2, do: "bar", id: "wait", chart: ch, x: 1, to: 443, dur: 0.7, width: BW, text: "443", size: V ? 34 : 36 },
        { on: "dead", do: "bar", id: "you", chart: ch, x: 2, to: 80, dur: 0.4, width: BW, text: "80", size: V ? 34 : 36 },
        { on: "years,", do: "stamp", who: "stone", from: 2, shake: 4 },
        { on: "You", offset: 0.2, do: "stamp", id: "nwait", text: "THE WAIT", x: WAIT[0], y: NAME_Y, size: V ? 30 : 32, width: BW + 60, tilt: 0, from: 1.2 },
        { on: "dead", do: "stamp", id: "nyou", text: "YOU", x: YOU[0], y: NAME_Y, size: V ? 30 : 32, width: BW, tilt: 0, from: 1.2 },
        // "but because": the readout goes; Earth reads the paper over tea
        { on: "but", do: "hide", who: ["chart", "wait", "you", "stone", "nwait", "nyou"] },
        { on: "but", do: "wash", id: "panel", opacity: 0, dur: 0.15 },
        { on: "because", do: "pop", who: "earth" },
        { on: "seem", do: "pop", who: "paper", squash: true },
        { on: "weirdly", do: "pop", who: "tea" },
        { on: "calm", do: "bob", who: "earth", y: 3, r: 2, speed: 0.8 },
        { on: "calm", offset: 0.2, do: "move", who: "tea", by: [-E[2] * 0.45, -E[2] * 0.35], turn: -25, dur: 0.3, arc: 20 },
        { on: "calm", offset: 0.9, do: "move", who: "tea", by: [E[2] * 0.45, E[2] * 0.35], turn: 0, dur: 0.3, arc: 20 },
        { on: "this.", offset: 0.5, do: "swap", who: "paper", to: "paper2" },
      ],
    });
  </script>
</template>
