<template id="title-card-template">
  <!-- title-card · the period title card (KIT.titleScene, look "atomic"), with a gag in collage cut-outs: a small
       scientist explorer strolls along under FRONTIER and off the card's right edge. On "Frontier." she runs
       back flat out, the other way, and a grinning germ five times her size rises behind the heading and comes after
       her. Up from black, a slow push, then black. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="title-card" data-width="1920" data-height="1080" data-start="0" data-duration="3.613">
    <div id="title-card-cam">
      <div id="title-card-bg"></div>
      <div id="title-card-back"></div>
      <div id="title-card-words"></div>
      <div id="title-card-art"></div>
    </div>
    <div id="title-card-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/title.js"></script>
  <script>
    KIT.titleScene({
      id: "title-card",
      lines: [{ words: ["THE", "UNEXPLORED"], style: "small" }, ["THERAPEUTIC"], ["FRONTIER"]],
      linesTall: [{ words: ["THE", "UNEXPLORED"], style: "small" }, ["THERAPEUTIC"], ["FRONTIER"]],
      size: KIT.V ? 150 : 140,
      gag: function (c) {
        var tl = c.tl, W = c.W, H = c.H, V = c.V, D = c.D;
        var b = c.word("FRONTIER").box, T = c.cue("Frontier.");
        // A cut-out as an <img> in a positioned wrapper: GSAP moves the wrapper; a flip sits on the <img>.
        var cut = function (parent, art, w, h, flip) {
          var d = document.createElement("div");
          d.style.cssText = "position:absolute;left:0;top:0;width:" + w + "px;height:" + h + "px;visibility:hidden";
          d.innerHTML = '<img src="assets/art/collage/' + art + '.webp" style="width:100%;height:100%;display:block' + (flip ? ";transform:scaleX(-1)" : "") + '">';
          parent.appendChild(d);
          return d;
        };
        var EH = V ? 150 : 140, EW = EH * 271 / 688, RH = EH * 0.62, RW = RH * 363 / 397;
        var walker = cut(c.art, "scientist-wave", EW, EH, false);
        var runner = cut(c.art, "scientist-reach", RW, RH, true);
        var GH = V ? 620 : 640, GW = GH * 794 / 890;
        var germ = cut(c.back, "germ-giant", GW, GH, false);
        var base = b.y + b.h + 8;                                         // her feet just under FRONTIER's baseline
        // she strolls along FRONTIER, on twos, and off the right edge
        tl.set(walker, { visibility: "inherit", x: b.x + 10, y: base - EH }, 0.15);
        tl.to(walker, { x: W + 40, duration: T - 0.15, ease: "steps(" + Math.round((T - 0.15) * 12) + ")" }, 0.15);
        tl.fromTo(walker, { y: base - EH }, { y: base - EH - 8, duration: 0.17, repeat: Math.floor((T - 0.15) / 0.17) - 1, yoyo: true, ease: "steps(2)", immediateRender: false }, 0.15);
        // "Frontier.": the germ rises behind the heading; she comes back flat out, and it follows
        tl.fromTo(germ, { visibility: "inherit", x: b.x + b.w - GW * 0.55, y: H + 20 }, { y: b.y - GH * 0.55, duration: 0.35, ease: "back.out(1.6)" }, T + 0.25);
        tl.fromTo(runner, { visibility: "inherit", x: W + 20, y: base - RH }, { x: -RW - 60, duration: 0.8, ease: "steps(10)" }, T + 0.45);
        tl.fromTo(runner, { y: base - RH }, { y: base - RH - 26, duration: 0.08, repeat: 9, yoyo: true, ease: "steps(1)", immediateRender: false }, T + 0.45);
        tl.to(germ, { x: -GW * 0.4, duration: D - T - 0.75, ease: "power1.in" }, T + 0.75);
        tl.fromTo(germ, { rotation: 0 }, { rotation: -6, duration: 0.12, repeat: Math.floor((D - T - 0.75) / 0.12) - 2, yoyo: true, ease: "steps(1)", immediateRender: false }, T + 0.75);
      },
    });
  </script>
</template>
