      var INK = C.line, CARD = "#FBF5E4", WHITE = "#FBF6E6", GREY = "#B9B5AE", PLASTER = "#EADDBD", BRICK = "#B86A4B", BEARD = "#E4E0D8";

      function spMix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }

      // An old man's beard, from his chin to the floor (95-percent-untreated's shape), in person units.
      function spBeard(o) {

        return '<path d="M' + spF(x) + "," + spF(y) + " q" + spF(-2 * f) + ",-9 " + spF(-9 * f) + ",-7 M" + spF(x) + "," + spF(y) + " L" + spF(x + 5 * f) + ',100" fill="none" stroke="' + INK + '" stroke-width="5.4" stroke-linecap="round"/>' +

      // A sagging red velvet rope between two post tops (frame units; s: the people's scale).
      function spRope(a, b, s) {

      // ── The wait sign ───────────────────────────────────────────────────────────────────────────────────
      // An enamel plate on two chains: a red band (#<ID>-rate, "15 PER YEAR"), "WAIT TIME FROM HERE:" (#<ID>-label),

      var SG = SPN.sign, SGX = SG.cx - SG.w / 2, WH = V ? [88, 118] : [80, 108];

            '<path d="M' + (SGX + 14) + "," + spF((y0 + y1) / 2) + " H" + (SGX + w - 14) + '" stroke="' + INK + '" stroke-width="2" opacity="0.4"/></g>';
        };
        return '<g id="' + ID + '-sign">' +
          '<path d="M' + (SGX + 70) + ",-40 V" + t + " M" + (SGX + w - 70) + ",-40 V" + t + '" stroke="' + INK + '" stroke-width="5" stroke-dasharray="10 5"/>' +
          '<rect x="' + (SGX + 12) + '" y="' + (t + 14) + '" width="' + w + '" height="' + h + '" fill="' + C.ink + '" opacity="0.85"/>' +

      var SG_STRIPS = null, SG_BLUR = null;
      function spWheels(p, spin) {

        for (var i = 0; i < 3; i++) {

      // to a vanishing point, in the frame's own units (untested-warehouse shows it full frame; the other scenes,
      // inside the window). The rack on the near right has the rolling ladder; the front wall's inside face, with the
      // window, is on the right. 16:9: the four aisles are four bays deep; 9:16: four bands of shelves, top to bottom.
      var WH9 = V

        [0.1, 0.32, 0.55, 0.78, 0.92].forEach(function (f, k) {
          var bx = gx0 + (gx1 - gx0) * f;
          back += k % 2 ? cross(bx, by - 6, 0.9) : '<g transform="translate(' + spF(bx) + "," + spF(by) + ') scale(0.6) rotate(' + (k * 3 - 5) + ')">' + KIT.props.headstone({ text: "RIP" }) + "</g>";
        });
      } else {
        [6, 7].forEach(function (r) {
          var by = SPN.ground + 232 * r - 52;
          back += fence(r === 6 ? 560 : 70, 1010, by, 70);
          [0.2, 0.5, 0.8].forEach(function (f, k) { var bx = (r === 6 ? 600 : 100) + (r === 6 ? 380 : 880) * f; back += k % 2 ? cross(bx, by - 4, 0.6) : '<g transform="translate(' + spF(bx) + "," + spF(by) + ') scale(0.42)">' + KIT.props.headstone({ text: "RIP" }) + "</g>"; });
        });
        back += tree(1000, SPN.ground + 232 * 7 - 50, 0.8);
      }

      // ══ The posts and ropes in front of each row (and the turns between rows in 9:16) ═════════════════════
      function ropes(rowSlots, isRow0) {
        var pts = [], out = "", posts = "";
        for (var i = 0; i < rowSlots.length; i++) {
          if (i % 2 === 1 || i === rowSlots.length - 1) {
            var s = rowSlots[i], nx = i + 1 < rowSlots.length ? rowSlots[i + 1].x : s.x + (s.x - rowSlots[i - 1].x);
            var px = (s.x + nx) / 2;
            pts.push([px, (V ? s.y : hillY(px)) + 14 * S]);
          }
        }
        if (isRow0) pts.unshift([SPN.front + (V ? -1 : 1) * 70, SPN.ground + 14 * S]);
        pts.forEach(function (p, i) {
          posts += at(p[0], p[1], S, spPost());
          if (i) out += spRope([pts[i - 1][0], pts[i - 1][1] - 54 * S], [p[0], p[1] - 54 * S], S);
        });
        return { svg: posts + out, ends: pts };
      }

      // ══ Build the strip ═══════════════════════════════════════════════════════════════════════════════════
      var people = slots.map(function (s, i) { return i < 2 ? "" : slotSvg(s, i); });
      var strip = ground + back + spWall() +
        spWinBack('<g transform="translate(' + WN[0] + "," + WN[1] + ") scale(" + (WN[2] / W).toFixed(5) + ')">' + warehouse(ID + "-wh", { bottles: null }) + "</g>");
      var parkSvg = park();
      if (!V) {
        var rp = ropes(slots.filter(function (s, i) { return s.kind !== "end"; }), true);
        // back to front: the far slope and the park, the line (its back first), the ropes, the front two, the shutter
        strip += parkSvg + parkLine;
        for (var pi = slots.length - 1; pi >= 2; pi--) strip += people[pi];
        strip += rp.svg + front16 + front15;
      } else {
        var lastEnd = null;
        for (var r = 0; r <= 8; r++) {
          var rs = slots.filter(function (s) { return s.row === r && s.kind !== "end"; });
          var idx = slots.map(function (s, i) { return s.row === r ? i : -1; }).filter(function (i) { return i >= 0; });
          var rowSvg = "";
          idx.forEach(function (i) { rowSvg += people[i]; });
          if (r === 0) rowSvg += front16 + front15;
          var rr = ropes(rs, r === 0);
          // the turn from the last row's end post to this row's first
          var turn = lastEnd ? spRope([lastEnd[0], lastEnd[1] - 54 * S], [rr.ends[0][0], rr.ends[0][1] - 54 * S], S) : "";
          strip += rowSvg + rr.svg + turn;
          lastEnd = rr.ends[rr.ends.length - 1];
        }
        strip += parkSvg + parkLine;
      }
      strip += splat + spShutter() + clerk + spSign();
      q("pan").innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" style="position:absolute;left:0;top:0;overflow:visible">' + KIT.paperDefs(ID) + strip + "</svg>";

      // ══ Time ══════════════════════════════════════════════════════════════════════════════════════════════
      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "slide left");
      function pivot(el, o) { gsap.set(el, { svgOrigin: o }); }

      // "fifteen": the top line flips to 15 PER YEAR (two clicks: the flap folds in two steps).
      var flapR = q("flap-rate"), flapL = q("flap-low");
      var rateMid = SG.top + 14 + SG.h * 0.12, lowMid = SG.top + SG.h * 0.24 + 30 + (SG.h - SG.h * 0.24 - 46) / 2;
      pivot(flapR, SG.cx + " " + spF(rateMid));
      tl.fromTo(flapR, { scaleY: 1 }, { scaleY: 0.5, duration: 0.06, ease: "power2.in" }, T.fifteen);
      tl.to(flapR, { scaleY: 0, duration: 0.06, ease: "power2.in" }, T.fifteen + 0.08);
      // "diseases": the lower line flips to WAIT TIME FROM HERE: and the wheels start spinning (and never stop).
      pivot(flapL, SG.cx + " " + spF(lowMid));
      tl.fromTo(flapL, { scaleY: 1 }, { scaleY: 0, duration: 0.1, ease: "power2.in" }, T.diseases);
      var SPEED = [3.1, 7.3, 13.7];
      KIT.onTime(tl, D, function (t) {
        var run = Math.max(0, t - T.diseases), ramp = Math.min(1, run / 0.4), dist = run < 0.4 ? run * run / 0.8 : run - 0.2;
        spWheels(SPEED.map(function (v, i) { return 4 + i * 3 + v * dist; }), SPEED.map(function (v) { return ramp * v / 8; }));
      });

      // "first": the shutter rolls up. "year.": it slams down on ticket 16's nose.
      var shut = q("shutter");
      tl.fromTo(shut, { y: 0 }, { y: -WN[3], duration: 0.3, ease: "power2.inOut" }, T.first);
      tl.to(shut, { y: 0, duration: 0.07, ease: "power3.in" }, T.year - 0.07);
      tl.fromTo(shut, { y: 0 }, { y: -8, duration: 0.05, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.year);

      // "treatment": the clerk's arm hands ticket 15 the teal bottle (ding); a beat later her chest light goes out
      // (sparkle), she lifts the bottle and skips away.
      var arm = q("arm");
      tl.fromTo(arm, { x: -armLen - 20 }, { x: 0, duration: 0.24, ease: "back.out(1.4)" }, T.treatment - 0.24);
      tl.to(arm, { x: -armLen - 20, duration: 0.2, ease: "power2.in" }, T.sparkle);
      tl.set(q("bottle"), { opacity: 0 }, T.sparkle);
      tl.set(q("t15-a"), { opacity: 0 }, T.sparkle);
      tl.set(q("t15-b"), { opacity: 1 }, T.sparkle);
      var t15 = q("t15-j");
      tl.fromTo(t15, { y: 0 }, { y: -14, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.sparkle);
      var skipTo = SPF > 0 ? 980 : -700;
      tl.to(q("t15"), { x: frontX15 + skipTo, duration: 0.9, ease: "power1.in" }, T.sparkle + 0.2);
      tl.to(t15, { y: -26, duration: 0.11, yoyo: true, repeat: 7, ease: "sine.out" }, T.sparkle + 0.2);
      // the sparkle on her chest light
      // ticket 16 steps up to the window and leans in; the shutter flattens his nose: the splat, his nose flat, he
      // straightens up dazed, and stays put.
      var t16 = q("t16"), t16j = q("t16-j");
      tl.fromTo(t16, { x: X16 }, { x: X16b, duration: 0.32, ease: "power2.inOut" }, T.sparkle + 0.22);
      pivot(t16j, "0 100");
      tl.fromTo(t16j, { rotation: 0 }, { rotation: SPF * lean16, duration: 0.2, ease: "power2.out", immediateRender: false }, T.sparkle + 0.5);
      tl.set(q("t16-a"), { opacity: 0 }, T.year);
      tl.set(q("t16-b"), { opacity: 1 }, T.year);
      tl.to(t16j, { rotation: -SPF * 4, duration: 0.12, ease: "power3.out" }, T.year);
      tl.to(t16j, { rotation: 0, duration: 0.3, ease: "elastic.out(1.2, 0.4)" }, T.year + 0.12);
      tl.to(t16, { x: X16b - SPF * 14, duration: 0.12, ease: "power3.out" }, T.year);
      tl.fromTo(q("splat"), { opacity: 0, scale: 0.4, svgOrigin: "0 0" }, { opacity: 1, scale: 1.2, svgOrigin: "0 0", duration: 0.08, ease: "power2.out" }, T.year + 0.06);
      tl.to(q("splat"), { opacity: 0, duration: 0.25 }, T.year + 0.3);
      var stars = q("t16-stars");
      tl.set(stars, { opacity: 1 }, T.year + 0.1);
      pivot(stars, spF(R16.top[0]) + " " + spF(R16.top[1] - 12));
      tl.fromTo(stars, { rotation: 0 }, { rotation: 360, duration: 0.8, repeat: 2, ease: "none" }, T.year + 0.1);
      tl.set(stars, { opacity: 0 }, T.year + 2.5);

      // "Six thousand": the pan back along the line. The tickets 17 to 21 pop up one per tick.
      var pan = q("pan"), slotEls = slots.map(function (s, i) { return i < 2 ? null : q("s" + i); });
      [0, 1, 2, 3, 4].forEach(function (k) {
        var el = slotEls[2 + k].querySelector(".sp-tk"), hnd = KIT.rig(spLook(slots[2 + k].n, slots[2 + k].look)).hand[1];
        pivot(el, "0 0");
        tl.fromTo(el, { scale: 1 }, { scale: 1.9, duration: 0.09, ease: "back.out(3)", immediateRender: false }, T.thousand + 0.15 * k);
        tl.to(el, { scale: 1.3, duration: 0.4, ease: "power2.inOut" }, T.thousand + 0.15 * k + 0.12);
      });
      // Every sick chest light blinks red; the grey ones blink slower.
      var lights = [];
      slots.forEach(function (s, i) {
        if (i < 2 || s.kind === "stone" || s.kind === "bones" || s.kind === "end") return;
        var cl = slotEls[i].querySelector(".alive .chest-light");
        if (cl) lights.push({ el: cl, ph: (i * 0.37) % 1, per: s.old ? 1.1 : 0.6, on: true });
      });
      [q("t15-a"), q("t16-a"), q("t16-b")].forEach(function (el, k) { var cl = el.querySelector(".chest-light"); if (cl) lights.push({ el: cl, ph: k * 0.3, per: 0.6, on: true }); });
      KIT.onTime(tl, D, function (t) {
        var v = camAt(t);
        pan.style.transform = V ? "translate(0px," + v.toFixed(1) + "px)" : "translate(" + v.toFixed(1) + "px,0px)";
        // cull what is far off frame
        for (var i = 2; i < slotEls.length; i++) {
          var s = slots[i], p = V ? s.y + v : s.x + v, show = V ? p > -200 && p < H + 260 : p > -260 && p < W + 260;
          slotEls[i].style.display = show ? "" : "none";
        }
        for (var j = 0; j < lights.length; j++) {
          var L0 = lights[j], on = ((t / L0.per + L0.ph) % 1) < 0.55;
          if (on !== L0.on) { L0.el.setAttribute("fill", on ? C.war : "#E9E1CC"); L0.on = on; }
        }
      });

      // "queue", "not", "die,": the dominoes. On each zap a run of the old ones x-rays into skeletons one after
      // another, each tipping a little into the next, still in line, still holding their tickets.
      var ZAPS = [T.queue, T.not, T.die], per = Math.ceil(DOM.length / 3);
      DOM.forEach(function (si, k) {
        var run = Math.min(2, Math.floor(k / per)), j = k - run * per, t0 = ZAPS[run] + j * 0.07;
        var el = slotEls[si], al = el.querySelector(".alive"), bn = el.querySelector(".bones"), jj = q("s" + si + "-j");
        tl.set(bn, { opacity: 0 }, 0);
        for (var f = 0; f < 5; f++) { tl.set(al, { opacity: f % 2 ? 1 : 0 }, t0 + f * 0.05); tl.set(bn, { opacity: f % 2 ? 0 : 1 }, t0 + f * 0.05); }
        pivot(jj, "0 100");
        tl.fromTo(jj, { rotation: 0 }, { rotation: SPF * -7, duration: 0.08, ease: "power2.out", immediateRender: false }, t0);
        tl.to(jj, { rotation: 0, duration: 0.25, ease: "back.out(2)" }, t0 + 0.08);
      });

      // "stood": skeleton 6,650 at the end of the line waves, bones rattling, its ticket held high.
      var endI = slots.length - 1, endS = slots[endI], er = endS.rig;
      var endEl = q("s" + endI + "-j"), endArm = endEl.querySelector(".arm-r");
      pivot(endArm, spF(er.shoulder[1][0]) + " " + spF(er.shoulder[1][1]));
      tl.fromTo(endArm, { rotation: 0 }, { rotation: -32, duration: 0.18, yoyo: true, repeat: Math.floor((D - T.stood) / 0.18) - 1, ease: "sine.inOut" }, T.stood);
      pivot(endEl, "0 100");
      tl.fromTo(endEl, { x: -1.5 }, { x: 1.5, duration: 0.05, yoyo: true, repeat: 9, ease: "none", immediateRender: false }, T.stood);
      tl.fromTo(endEl, { y: 0 }, { y: -10, duration: 0.14, yoyo: true, repeat: 3, ease: "power2.out", immediateRender: false }, T.stood);
      pivot(q("end-ticket"), "0 0");
      tl.fromTo(q("end-ticket"), { rotation: -6 }, { rotation: 6, duration: 0.36, yoyo: true, repeat: Math.floor((D - T.stood) / 0.36) - 1, ease: "sine.inOut" }, T.stood);
      var skull = endEl.querySelector(".head");
      pivot(skull, spF(er.neck[0]) + " " + spF(er.neck[1]));
      tl.fromTo(skull, { rotation: -5 }, { rotation: 5, duration: 0.07, yoyo: true, repeat: 11, ease: "none", immediateRender: false }, T.stood);

      // "Disneyland.": (the whip pan lands on the park) the fat cat at its front taps his watch, goes red in the face
      // and steams (whistle); a beat after the word the steam jet blows his top hat off (pop).
      var cat = q("cat-j"), catLeg = cat.querySelector(".leg-l"), catArm = cat.querySelector(".arm-l"), catDir = PARK.look === "left" ? -1 : 1;
      var watchArm = catDir < 0 ? cat.querySelector(".arm-l") : cat.querySelector(".arm-r");
      var tapStart = T.invented;
      pivot(catLeg, spF(RC.hip[0][0]) + " " + spF(RC.hip[0][1]));
      tl.fromTo(catLeg, { rotation: 0 }, { rotation: catDir * 14, duration: 0.13, yoyo: true, repeat: Math.floor((D - tapStart) / 0.13) - 1, ease: "power1.inOut" }, tapStart);
      var sh = catDir < 0 ? RC.shoulder[0] : RC.shoulder[1];
      pivot(watchArm, spF(sh[0]) + " " + spF(sh[1]));
      var watchG = q("watch");
      tl.fromTo(watchG, { y: 0 }, { y: -4, duration: 0.11, yoyo: true, repeat: Math.floor((D - tapStart) / 0.11) - 1, ease: "power1.inOut" }, tapStart);
      tl.fromTo(q("redrect"), { attr: { y: hy + 26 * hs, height: 0 } }, { attr: { y: hy - 30 * hs, height: 56 * hs }, duration: 0.7, ease: "power1.in" }, T.disney);
      [0, 1].forEach(function (k) {
        var st = q("steam" + k), puffs = st.querySelectorAll(".qp-puff");
        tl.set(st, { opacity: 1 }, T.disney + 0.1);
        Array.prototype.forEach.call(puffs, function (p, j) {
          pivot(p, p.getAttribute("cx") + " " + p.getAttribute("cy"));
          tl.fromTo(p, { scale: 0.3, opacity: 1, y: 0 }, { scale: 1.4, opacity: 0.2, y: -18, duration: 0.3, repeat: Math.floor((D - T.disney) / 0.3) - 1, ease: "power1.out", immediateRender: false }, T.disney + 0.1 + j * 0.1 + k * 0.05);
        });
      });
      var catJ = q("cat-j");
      pivot(catJ, "0 100");
      tl.fromTo(catJ, { x: -1 }, { x: 1, duration: 0.04, yoyo: true, repeat: Math.floor((T.blowoff - T.disney) / 0.04), ease: "none", immediateRender: false }, T.disney + 0.2);
      var jet = q("jet"), hat = q("hat");
      pivot(jet, "0 0");
      tl.fromTo(jet, { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1.2, duration: 0.12, ease: "power3.out" }, T.blowoff - 0.05);
      tl.to(jet, { opacity: 0, duration: 0.4, ease: "power1.in" }, T.blowoff + 0.45);
      pivot(hat, "0 -20");
      tl.to(hat, { y: -420, x: catDir * -60, rotation: catDir * -540, duration: 1.1, ease: "power2.out" }, T.blowoff);

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
