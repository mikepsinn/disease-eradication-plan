<template id="rot-in-place-template">
  <!-- rot-in-place · collage (Part 25, Future A, 2040 to 2050: the rest of the road, as one plate). YOU's skeleton strolls
       on through the tar. The wrecking ball bounces off the Capitol, which rots standing, its organs not speaking. Refugees
       overtake him and walk off the end of the road, past the sign, NO COLOMBIA; he follows, hangs in the air a beat, drops.
       The camera gets to the bottom first. 2043: two survivors at a dry tap, mushroom clouds, charred; they argue over a
       spreadsheet and he lands between them, late, and is split into its two columns. His fedora rolls off along the empty
       road. 2045: a cockroach stands up and puts it on. 2050: the manual comes down on its parachute again, and it holds it
       upside down. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #E2CFA5; }
  </style>
  <div id="root" data-composition-id="rot-in-place" data-width="1920" data-height="1080" data-start="0" data-duration="38.136">
    <div id="rot-in-place-weave"></div>
    <div id="rot-in-place-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    var ID = "rot-in-place", V = KIT.V, DUR = KIT.scene(ID).duration, G = 1000, CUE = function (word, n) { return KIT.cue(ID, word, n); };
    // The walk, as in future-a-2027: YOU stays at X0 and the world scrolls past, slowly by the Capitol, until he steps off.
    var X0 = V ? 300 : 560, T_ROT = CUE("When", 1), T_EDGE = CUE("Colombia.", 2) + 0.15, T_DROP = T_EDGE + 0.5;
    var SEGS = [[0, T_ROT, V ? 90 : 120], [T_ROT, T_DROP, V ? 150 : 215]];
    var S = function (t) { var d = 0; SEGS.forEach(function (g) { d += Math.max(0, Math.min(t, g[1]) - g[0]) * g[2]; }); return d; };
    var w = function (t, a, b) { return X0 + (V && b !== undefined ? b : a) + S(t); };
    var YH = 850, K_BONE = YH / 640, LV = 450, WORLD = [], beats = [], cast = {}, i;
    var add = function (b) { beats.push(b); };
    var put = function (n, o) { cast[n] = o; WORLD.push(n); return n; };
    var stand = function (n, art, x, k, o) { var c = { art: art, x: x, y: G, anchor: "bottom", pivot: "bottom", scale: k }; for (var f in o || {}) c[f] = o[f]; return put(n, c); };

    // The floor: straight down from the end of the road. The bottom is plain ground, and nothing there scrolls.
    var EDGE_W = X0 + S(T_EDGE), CK = 3, CH = 986 * CK, G2 = G + CH - 60, FX = V ? X0 + 900 : X0 + 1300;
    var floorStand = function (n, art, x, k, o) { var c = { art: art, x: x, y: G2, anchor: "bottom", pivot: "bottom", scale: k }; for (var f in o || {}) c[f] = o[f]; cast[n] = c; return n; };

    // ── The sky, already rust; it goes slate at the cliff and navy at the bottom ──
    for (i = 0; i < 5; i++) put("cl" + i, { art: "cloud-puff", x: i * (V ? 620 : 900) + 200, y: (V ? -200 : 40) + (i % 3) * 80, scale: 1.2 + (i % 3) * 0.3 });
    add({ at: 0, do: "wash", id: "sky", color: "#B79468", blend: "multiply", above: "cl4", opacity: 0.85, dur: 0.01 });
    add({ at: 0, do: "wash", id: "burn", color: "#D5692C", blend: "multiply", above: "cl4", opacity: 0.8, dur: 0.01 });
    add({ at: 0, do: "wash", id: "dark", color: "#6A6470", blend: "multiply", above: "cl4", opacity: 0.6, dur: 0.01 });
    add({ on: "forty-three:", do: "wash", id: "burn", opacity: 0.15, dur: 1 });
    add({ on: "forty-three:", do: "wash", id: "dark", opacity: 1, dur: 1 });
    add({ on: "forty-five:", do: "wash", id: "navy", color: "#2C3A5C", blend: "multiply", above: "cl4", opacity: 0.9, dur: 1.2 });

    // ── The road, up to the brink ──
    var RN = Math.ceil((EDGE_W + 1400) / 990);
    for (i = 0; i < RN; i++) {
      var rx = -1400 + i * 990;
      if (rx + 200 < EDGE_W - 2000) put("rd" + i, { art: "road", x: rx, y: G - 70, anchor: "topleft", scale: 3 });
    }

    // ── The Capitol stands, and rots ──
    var CAPK = V ? 1.75 : 2.2, CAPX = w(5, 640, 390), CAPY = G - 50;
    var ROOF = CAPY - (533 - 282) * CAPK, ORK = V ? 1.5 : 2.0;
    stand("cap", "capitol", CAPX, CAPK, { y: CAPY, pieces: {
      body: { clip: [[0, 0], [86, 0], [86, 282], [262, 282], [262, 0], [346, 0], [346, 533], [0, 533]] },
      dome: { clip: [[86, 0], [262, 0], [262, 284], [86, 284]], pivot: [262, 284] } } });
    var ORG = [[0, 98], [98, 188], [188, 273], [273, 362]], ORGN = ["or0", "or1", "or2", "or3"];
    ORG.forEach(function (c, j) {
      put("or" + j, { art: "organs", clip: [[c[0], 0], [c[1], 0], [c[1], 160], [c[0], 160]], anchor: [181, 160], pivot: [(c[0] + c[1]) / 2, 160], x: CAPX, y: ROOF + 16, scale: ORK, hidden: true });
    });
    // the wrecking ball swings in from the left and bounces off the dome
    put("ball", { art: "wrecking-ball", x: CAPX - 110 * CAPK, y: G - 1500, anchor: "top", pivot: "top", scale: 1.3, hidden: true });
    add({ at: 0, do: "hinge", who: "ball", angle: -55, frames: 1 });
    add({ on: "fall;", offset: -0.42, do: "show", who: "ball" });
    add({ on: "fall;", offset: -0.42, do: "hinge", who: "ball", angle: 55, frames: 5 });
    add({ on: "fall;", do: "hinge", who: "ball", angle: -24, frames: 3 });
    add({ on: "fall;", do: "shiver", who: "cap", dur: 0.4, amp: 3, rot: 1 });
    add({ on: "fall;", offset: 0.25, do: "hinge", who: "ball", angle: 12, frames: 4 });
    add({ on: "rot", offset: -0.1, do: "slideOut", who: "ball", to: "top", dur: 0.5 });
    // "rot in place,": cobwebs, moss, the dome sags, a spider comes down
    put("web0", { art: "cobweb", x: CAPX - 210 * CAPK / 1.2, y: ROOF + 130, scale: 1.0, hidden: true });
    put("moss0", { art: "rock-gray-moss", x: CAPX - 250, y: G - 450, scale: 1.05, hidden: true });
    put("moss1", { art: "rock-rust-moss", x: CAPX + 270, y: G - 450, scale: 1.05, hidden: true });
    put("spider", { art: "spider", x: CAPX + 60, y: -660, anchor: "bottom", scale: 1.2, hidden: true });
    add({ on: "rot", do: "pop", who: "web0" });
    add({ on: "rot", offset: 0.2, do: "pop", who: "moss0", squash: true });
    add({ on: "in", n: 1, do: "pop", who: "moss1", squash: true });
    add({ on: "place,", do: "hinge", who: "cap.dome", angle: -6, frames: 5 });
    add({ on: "place,", do: "show", who: "spider" });
    add({ on: "place,", do: "move", who: "spider", by: [0, 620], dur: 1.2 });
    // "organs": the dome lifts like a lid; brain, heart, lungs and liver at their desks. "another.": it slams
    add({ on: "organs", offset: -0.1, do: "hinge", who: "cap.dome", angle: 85, frames: 4 });
    add({ on: "organs", do: "pop", who: ORGN, squash: true });
    // "longer speaking": they shuffle their desks apart, away from one another
    ORGN.forEach(function (n, j) { add({ on: "longer", offset: j * 0.12, do: "move", who: n, by: [(j - 1.5) * (V ? 40 : 60), 0], dur: 0.4 }); });
    add({ on: "another.", offset: 0.05, do: "hinge", who: "cap.dome", angle: -85, frames: 1 });
    add({ on: "another.", offset: 0.1, do: "hide", who: ORGN });
    add({ on: "another.", offset: 0.1, do: "shake", y: 9, frames: 3 });

    // ── The end of the road, the sign and the drop ──
    var SIGN = stand("sign", "tally-board", EDGE_W - (V ? 300 : 430), V ? 1.75 : 2.2, { label: { text: "COLOMBIA", at: [132, 82], width: 215, size: 120 } });
    add({ on: "no", n: 2, do: "stamp", who: SIGN, text: "NO", spot: [132, 36], size: 130, tilt: -7 });
    add({ on: "no", n: 2, do: "shake", y: 8, frames: 3 });

    // ── YOU's skeleton: the same two-drawing walk, on until the bottom ──
    cast.sA = { art: "you-skeleton-walk", clip: [[70, 350], [170, 350], [297, 500], [297, 640], [0, 640], [0, 550], [70, 430]], anchor: [125, 640], pivot: [125, 640], x: X0, y: G, scale: K_BONE, hidden: true };
    cast.sB = { art: "you-skeleton", clip: [[55, 366], [165, 366], [165, 654], [55, 654]], anchor: [100, 654], pivot: [100, 654], x: X0, y: G, scale: K_BONE, hidden: true };
    cast.sT = { art: "you-skeleton-walk", clip: [[0, 0], [297, 0], [297, 430], [215, 430], [170, 356], [80, 356], [62, 445], [0, 445]], anchor: [125, 640], pivot: [125, 640], x: X0, y: G, scale: K_BONE };
    var stride = 0.32, leg = 0;
    for (var ts = 0; ts < T_DROP; ts += stride, leg++) {
      add({ at: ts, do: "show", who: leg % 2 ? "sB" : "sA" });
      add({ at: ts, do: "hide", who: leg % 2 ? "sA" : "sB" });
    }
    ["sT", "sA", "sB"].forEach(function (n) {
      add({ at: 0, do: "bob", who: n, y: 7, r: 0, speed: 3.16, until: T_DROP });
      add({ at: 0, do: "bob", who: n, y: 0, r: 1.3, speed: 1.3, until: T_DROP });
      // over the edge: he walks on air for half a second, and drops out of the bottom of the frame, still in stride
      add({ at: T_DROP, do: "move", who: n, by: [0, 1600], dur: 0.8 });
      add({ at: T_DROP + 0.85, do: "hide", who: n });
    });

    // ── Refugees: they overtake him and go over one at a time ──
    var RK = V ? 1.9 : 2.6, RY = G - (V ? 240 : 280), R0 = V ? 120 : 180;
    var RCL = [[[[0, 0], [115, 0], [98, 50], [90, 130], [100, 190], [120, 219], [0, 219]], 55],
      [[[115, 0], [190, 0], [175, 80], [172, 130], [178, 190], [170, 219], [120, 219], [100, 190], [90, 130], [98, 50]], 145],
      [[[190, 0], [280, 0], [265, 70], [262, 130], [268, 219], [170, 219], [178, 190], [172, 130], [175, 80]], 225],
      [[[280, 0], [347, 0], [347, 219], [268, 219], [262, 130], [265, 70]], 310]];
    RCL.forEach(function (c, j) {
      var n = "ref" + j, dx = R0 + (c[1] - 55) * RK, xr = X0 + dx, tFall = T_EDGE - dx / SEGS[1][2] + 0.1;
      cast[n] = { art: "refugees", clip: c[0], anchor: [c[1], 219], pivot: [c[1], 219], x: xr - 2300, y: RY, scale: RK, hidden: true };
      add({ on: "When", n: 1, do: "show", who: n });
      add({ on: "When", n: 1, do: "move", who: n, to: [xr, RY], dur: 2.4 });
      add({ on: "When", n: 1, do: "bob", who: n, y: 10, r: 2, speed: 2.5, phase: j, until: tFall });
      add({ at: tFall, do: "drop", who: n, dist: 1800, dur: 1, spin: 25 });
    });

    // ── The tar stops where the road stops ──
    var TK = V ? 4.2 : 3, TW = 1453 * TK, TH = 240 * TK - 90, TOP = G + 380 - (LV + 480), TARS = [];
    for (i = 0; i < 6; i++) {
      var tx = EDGE_W - 70 - (i + 1) * (TW - 60);
      if (tx + TW < -2600) break;
      for (var row = 1; row >= 0; row--) { var tn = "tar" + i + (row ? "b" : "a"); put(tn, { art: i % 2 ? "tar-b" : "tar-a", x: tx - row * 300, y: TOP + row * TH, anchor: "topleft", scale: TK }); TARS.push(tn); }
    }
    TARS.forEach(function (n) { add({ at: 0, do: "bob", who: n, y: 7, r: 0, speed: 0.7 }); });

    stand("cliff", "cliff-face", EDGE_W - 1004 * CK, CK, { anchor: "topleft", pivot: "topleft", y: G - 60 + (V ? 1400 : 0) });
    if (V) add({ on: "When", n: 2, do: "move", who: "cliff", by: [0, -1400], dur: 0.8 });

    // ── The bottom: 2043. A sign, a dry tap, and whatever is left ──
    for (i = 0; i < 8; i++) {
      cast["fl" + i] = { art: "road", x: FX - 1800 + i * 990, y: G2 - 70, anchor: "topleft", scale: 3 };
    }
    floorStand("y43", "sign-board", FX - (V ? 400 : 860), V ? 1.6 : 1.9, { hidden: true, label: { text: "2043", at: [107, 70], width: 170, size: 200 } });
    add({ on: "forty-three:", do: "pop", who: "y43", squash: true });
    // mushroom clouds, far off: one on "nuclear.", and more behind them that they never notice
    var MU = [[FX + (V ? 180 : 500), 2.0, "nuclear."], [FX - (V ? 260 : 520), 1.5, "climate"], [FX + (V ? 330 : 780), 1.3, "military"], [FX - (V ? 80 : 120), 1.8, "spreadsheet"]];
    MU.forEach(function (m, j) {
      floorStand("mu" + j, "mushroom", m[0], m[1], { hidden: true });
      add({ on: m[2], do: "pop", who: "mu" + j });
      add({ on: m[2], do: "boom", shake: j ? 8 : 26, flash: j ? 0.1 : 0.25 });
    });
    var SK = V ? 1.7 : 2.25, SAX = FX - (V ? 260 : 400), SBX = FX + (V ? 260 : 400);
    floorStand("tap", "tap", FX, V ? 2 : 2.4);
    add({ on: "survivors", do: "hide", who: "tap" });
    // the spreadsheet, between them; the columns are the joke
    var LK = V ? 0.72 : 0.98;
    cast.sheet = { art: "ledger", x: FX, y: G2 - (V ? 620 : 590), scale: LK, hidden: true, label: [
      { text: "CLIMATE", at: [280, 42], width: 400, size: 76 }, { text: "MILITARY", at: [830, 42], width: 400, size: 76 } ] };
    add({ on: "survivors", do: "pop", who: "sheet", squash: true });
    floorStand("sa", "survivor-a", SAX, SK, { eyes: [[263, 82], [282, 82]], eyeSize: 28, smoke: [[220, 60], [130, 130]] });
    floorStand("sb", "survivor-b", SBX, SK, { eyes: [[62, 90], [82, 90]], eyeSize: 28, smoke: [[120, 60], [210, 130]] });
    // "wars": they lunge for the last drop and bonk heads
    add({ on: "wars", do: "move", who: "sa", by: [V ? 70 : 150, 0], dur: 0.25 });
    add({ on: "wars", do: "move", who: "sb", by: [V ? -70 : -150, 0], dur: 0.25 });
    add({ on: "go", do: "shake", y: 5, frames: 2 });
    add({ on: "nuclear.", do: "char", who: ["sa", "sb"] });
    add({ on: "nuclear.", offset: 0.9, do: "blink", who: ["sa", "sb"] });
    // "argue": they back off and square up; each jabs for his own column
    add({ on: "survivors", do: "move", who: "sa", by: [V ? -110 : -300, 0], dur: 0.3 });
    add({ on: "survivors", do: "move", who: "sb", by: [V ? 110 : 300, 0], dur: 0.3 });
    add({ on: "climate", do: "nudge", who: "sa", by: [50, 0] });
    add({ on: "death", n: 1, do: "nudge", who: "sa", by: [50, 0] });
    add({ on: "military", do: "nudge", who: "sb", by: [-50, 0] });
    add({ on: "death", n: 2, do: "nudge", who: "sb", by: [-50, 0] });
    add({ on: "because", do: "blink", who: ["sa", "sb"] });
    // he has been falling all this time; he lands between them, whole, on "argue"
    var BK = V ? 0.95 : 1.15, HALF = 212 / 4 * BK;
    cast.bones = { art: "skeleton", x: FX, y: G2, anchor: "bottom", pivot: "bottom", scale: BK, cut: "lr", hidden: true };
    cast.hat = { art: "fedora", x: FX + 6, y: G2 - 704 * BK + 16, scale: 1, pivot: "bottom", hidden: true };
    add({ on: "argue", do: "show", who: ["bones", "hat"] });
    add({ on: "argue", do: "stamp", who: ["bones", "hat"], from: 1.05, shake: 14 });
    // "separate": he comes apart in the middle, each half to its own column
    add({ on: "separate", do: "split", who: "bones", gap: V ? 170 : 270, spin: 10, shake: 10 });
    add({ on: "separate", do: "move", who: "hat", to: [FX + 40, G2 - 40], dur: 0.45, turn: 30 });
    add({ on: "columns.", do: "nudge", who: "sa", by: [40, 0] });
    add({ on: "columns.", offset: 0.25, do: "nudge", who: "sb", by: [-40, 0] });

    // ── The hat rolls off along the empty road. 2045, 2050 ──
    var CRX = FX + (V ? 1900 : 3000), HATSTOP = CRX + (V ? 110 : 90);
    add({ on: "Year", n: 2, offset: -0.7, do: "move", who: "hat", to: [HATSTOP, G2 - 40], dur: 2.0, turn: 1080 });
    floorStand("y45", "sign-board", CRX + (V ? 260 : 620), V ? 1.6 : 1.9, { hidden: true, label: { text: "2045", at: [107, 70], width: 170, size: 200 } });
    floorStand("y50", "sign-board", CRX + (V ? 260 : 620), V ? 1.6 : 1.9, { hidden: true, label: { text: "2050", at: [107, 70], width: 170, size: 200 } });
    floorStand("rubA", "rubble", CRX - (V ? 330 : 720), 1.3);
    add({ on: "forty-five:", do: "pop", who: "y45", squash: true });
    add({ on: "fifty:", do: "swap", who: "y45", to: "y50" });
    // "Cockroaches": out from under the rubble, on all sixes; "intelligence.": up on its hind legs, and the hat goes on
    var RK2 = V ? 2.1 : 2.45, ROACH = CRX - (V ? 60 : 120);
    cast.roach = { art: "cockroach", x: CRX - (V ? 700 : 900), y: G2, anchor: "bottom", pivot: "bottom", scale: V ? 1.7 : 2.1, hidden: true };
    floorStand("roachUp", "cockroach-up", ROACH, RK2, { hidden: true });
    add({ on: "Cockroaches", n: 1, do: "show", who: "roach" });
    add({ on: "Cockroaches", n: 1, do: "move", who: "roach", to: [ROACH, G2], dur: 0.7 });
    add({ on: "intelligence.", do: "swap", who: "roach", to: "roachUp" });
    add({ on: "intelligence.", do: "shake", y: 5, frames: 2 });
    var HEAD = [ROACH, G2 - (356 - 66) * RK2];
    add({ on: "intelligence.", offset: 0.55, do: "move", who: "hat", to: [HEAD[0], HEAD[1]], dur: 0.45, arc: 200, turn: 0, scale: V ? 1.3 : 1.55 });
    var hatCast = cast.hat; delete cast.hat; cast.hat = hatCast;
    // "find": the same parachute comes down, and it is handed the manual
    var BOOK = [ROACH + 10, G2 - 330];
    cast.chute2 = { art: "manual-chute", x: BOOK[0], y: G2 - 2400, anchor: "bottom", pivot: "bottom", scale: 1.25, hidden: true };
    add({ on: "fifty:", offset: 0.5, do: "show", who: "chute2" });
    add({ on: "fifty:", offset: 0.5, do: "move", who: "chute2", to: [BOOK[0], G2 - 220], dur: 1.1 });
    add({ on: "find", do: "hide", who: "chute2" });
    cast.book = { art: "manual-closed", x: BOOK[0], y: BOOK[1], scale: V ? 1.05 : 1.25, hidden: true,
      label: { text: "MANUAL", at: [110, 145], width: 165, size: 90 } };
    add({ on: "find", do: "show", who: "book" });
    add({ on: "manual,", do: "move", who: "book", by: [0, 0], turn: 180, dur: 0.2 });
    add({ on: "very", do: "move", who: "book", by: [0, 0], turn: 0, dur: 0.2 });
    add({ on: "confused.", offset: 0.25, do: "move", who: "book", by: [0, 0], turn: 180, dur: 0.2 });
    add({ on: "confused.", offset: 0.5, do: "shiver", who: "hat", dur: 0.4, amp: 3, rot: 8 });

    // ── The camera: walking, the wide reveal of the end of the road, straight down, then along the floor ──
    var views = V ? {
      walk: [540, G - 620, 1], wide: [-100, G + 200, 0.42],
      floor: [FX, G2 - 500, 0.9], roach: [CRX + 40, G2 - 500, 1.05],
    } : {
      walk: [960, 400, 1], wide: [200, 1050, 0.5],
      floor: [FX, G2 - 390, 0.82], roach: [CRX + 80, G2 - 400, 1],
    };
    add({ on: "global", do: "camera", view: "wide", dur: 1.1 });
    add({ at: T_DROP + 0.1, do: "camera", view: "floor", dur: 1.0 });
    add({ on: "Year", n: 2, offset: -0.6, do: "camera", view: "roach", dur: 1.6 });

    // A move always straightens to its turn, so the treadmill would undo every rotation: rotations go after it.
    var early = [], late = [];
    beats.forEach(function (b) {
      if (b.do === "bob" || b.do === "shiver" || b.do === "hinge") { late.push(b); return; }
      early.push(b);
      if (b.do === "move" && b.turn !== undefined) {
        var c = {}; for (var k in b) c[k] = b[k];
        delete c.to; delete c.arc; delete c.scale; c.by = [0, 0]; late.push(c); delete b.turn;
      }
    });
    beats = early;

    // The treadmill, after every move, so it adds to them
    SEGS.forEach(function (g) { add({ at: g[0], do: "move", who: WORLD, by: [-(g[1] - g[0]) * g[2], 0], dur: g[1] - g[0] }); });
    beats = beats.concat(late);

    KIT.collage({ id: ID, seed: 2528, plate: V ? [-3000, -3800, FX + 5000, G2 + 3000] : [-2400, -2000, FX + 5000, G2 + 1200], views: views, view: "walk", cast: cast, beats: beats });
  </script>
</template>
