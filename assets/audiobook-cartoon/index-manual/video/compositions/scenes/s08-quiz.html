<template id="s08-template">
  <!-- S08 · Layer B · Quiz questions 2 to 5 drop in one at a time; each gets a quick YES tick and a small drawing. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #s08-bg, #s08-pip { position: absolute; inset: 0; }
    #s08-sheet {
      position: absolute; left: 120px; top: 80px; width: 1440px; height: 800px;
      background: #FBF5E6; border: 5px solid #1B1B1B; box-shadow: 10px 12px 0 #1B1B1B;
    }
    #s08-head { position: absolute; left: 40px; top: 18px; font-size: 30px; color: #D7322B; }
    .s08-row { position: absolute; left: 30px; width: 1380px; height: 178px; border-top: 3px solid rgba(31, 163, 154, 0.45); }
    .s08-icon { position: absolute; left: 0; top: 4px; width: 260px; height: 170px; }
    .s08-q { position: absolute; left: 290px; top: 0; height: 178px; width: 760px; display: flex; align-items: center; font-size: 50px; line-height: 1.08; }
    .s08-q svg { margin: 0 12px; }
    .s08-opts { position: absolute; left: 1060px; top: 46px; width: 330px; height: 90px; }
  </style>
  <div id="root" data-composition-id="s08" data-width="1920" data-height="1080" data-start="0" data-duration="22.42">
    <div id="s08-bg" class="clip" data-start="0" data-duration="22.42" data-track-index="0"></div>
    <div id="s08-sheet">
      <div id="s08-head" class="kit-label">Questions 2 to 5</div>
    </div>
    <div id="s08-pip"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part-02.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "s08";
      var D = KIT.scene(ID).duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C;
      var ARROW = '<svg width="60" height="34" viewBox="0 0 60 34"><path d="M4,17 H50 M36,4 L52,17 L36,30" fill="none" stroke="#1B1B1B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      q("bg").innerHTML = KIT.paper(ID);

      // icons (each 260 x 170)
      var trial = '<g id="s08-line">' + [0, 1, 2].map(function (i) {
        return '<g transform="translate(' + (50 + i * 70) + ',92) scale(0.62)">' + KIT.bean({ tone: i + 1, arms: [[20, 10], [-20, -10]], mouth: "smile" }) + "</g>";
      }).join("") + "</g>" +
        '<g id="s08-speed" stroke="' + C.med + '" stroke-width="5" stroke-linecap="round"><path d="M4,70 h26 M0,100 h34 M8,130 h22"/></g>' +
        '<text x="250" y="40" text-anchor="end" font-family="Fraunces" font-weight="900" font-size="40" fill="#157F78">12.3&#215;</text>';
      var bill = '<path d="M40,150 H220" stroke="' + C.line + '" stroke-width="4"/>' +
        '<g id="s08-bill"><path d="M80,150 V10 h100 V150" fill="' + C.paper + '" stroke="' + C.line + '" stroke-width="4"/>' +
        '<path d="M80,10 l12,-8 l12,8 l12,-8 l12,8 l12,-8 l12,8 l12,-8 l12,8" fill="none" stroke="' + C.line + '" stroke-width="3"/>' +
        '<path d="M95,40 h70 M95,62 h70 M95,84 h50 M95,106 h70 M95,128 h40" stroke="' + C.war + '" stroke-width="6"/></g>' +
        '<text x="30" y="60" font-family="Oswald" font-weight="600" font-size="34" fill="' + C.line + '">$$$</text>';
      var worker = '<g transform="translate(110,96) scale(0.72)">' + KIT.bean({ tone: 2, light: "teal", arms: [[30, 20], [-160, -170]], mouth: "smile", hair: 2 }) + "</g>" +
        '<g id="s08-box"><rect x="150" y="104" width="78" height="56" fill="url(#s08i-hatch)" stroke="' + C.line + '" stroke-width="4"/></g>' +
        '<g id="s08-boxes"><rect x="180" y="48" width="60" height="44" fill="' + C.paper + '" stroke="' + C.line + '" stroke-width="4"/></g>';
      var coins = "";
      for (var k = 0; k < 9; k++) {
        coins += '<g class="s08-coin"><ellipse cx="' + (110 + (k % 2) * 6) + '" cy="' + (150 - k * 15) + '" rx="56" ry="13" fill="' + C.med + '" stroke="' + C.line + '" stroke-width="3.5"/></g>';
      }
      var icons = [trial, bill, worker, coins];
      var texts = [
        "12.3&#215; trial capacity " + ARROW + " faster treatments?",
        "Fewer sick humans " + ARROW + " lower healthcare costs?",
        "Healthy people produce more?",
        "It compounds?",
      ];
      var sheet = q("sheet");
      var rows = icons.map(function (icon, i) {
        var row = document.createElement("div");
        row.className = "s08-row";
        row.style.top = 70 + i * 180 + "px";
        row.innerHTML = '<div class="s08-icon">' + KIT.svg(260, 170, KIT.paperDefs("s08i") + icon) + "</div>" +
          '<div class="s08-q kit-label">' + texts[i] + "</div>" +
          '<div class="s08-opts">' + KIT.svg(330, 90, KIT.checkbox(0, 8, 70) + '<text x="86" y="66" font-family="Oswald" font-weight="600" font-size="48" fill="' + C.line + '">YES</text>' +
            KIT.checkbox(176, 8, 70) + '<text x="262" y="66" font-family="Oswald" font-weight="600" font-size="48" fill="' + C.line + '">NO</text>' + KIT.tick(0, 4, 74)) + "</div>";
        sheet.appendChild(row);
        return row;
      });

      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), { scene: ID, x: 1620, y: 590, w: 280, pip: { cx: 1760, cy: 740, r: 128 } });

      var starts = [cue("Would", 1), cue("Would", 2), cue("Do"), cue("Would", 3)];
      var ends = [cue("faster?"), cue("costs?"), cue("more?"), cue("time?")];
      rows.forEach(function (row, i) {
        tl.fromTo(row, { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: "bounce.out" }, starts[i] - 0.1);
        tl.fromTo(row.querySelector(".tick"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power1.in" }, ends[i] + 0.1);
      });
      // small drawings move while their question is read
      tl.fromTo("#s08-line", { x: -40 }, { x: 30, duration: ends[0] - starts[0], ease: "power1.inOut" }, starts[0]);
      tl.fromTo("#s08-bill", { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 0.3, transformOrigin: "50% 100%", duration: 1.4, ease: "power2.inOut" }, cue("reduced"));
      tl.fromTo("#s08-boxes", { y: 0 }, { y: -18, duration: 0.3, ease: "power2.out" }, cue("work"));
      tl.to("#s08-boxes", { y: 0, duration: 0.3, ease: "power2.in" }, cue("produce"));
      var coinEls = q("sheet").querySelectorAll(".s08-coin");
      coinEls.forEach(function (c, k) {
        tl.fromTo(c, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, cue("compound") + k * 0.28);
      });
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
