<template id="s11-template">
  <!-- S11 · Layer A · Confetti on "congratulations". Two arrows on the wall screen; one swings to line up with the other. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #s11-bg, #s11-set, #s11-cast, #s11-front, #s11-confetti { position: absolute; inset: 0; }
    #s11-screen { position: absolute; left: 154px; top: 134px; width: 832px; height: 532px; overflow: hidden; }
    .s11-lab { position: absolute; left: 40px; width: 760px; font-size: 40px; display: flex; align-items: center; gap: 14px; }
    #s11-lab1 { top: 28px; color: #157F78; }
    #s11-lab2 { top: 282px; color: #D7322B; }
  </style>
  <div id="root" data-composition-id="s11" data-width="1920" data-height="1080" data-start="0" data-duration="17.38">
    <div id="s11-bg" class="clip" data-start="0" data-duration="17.38" data-track-index="0"></div>
    <div id="s11-set"></div>
    <div id="s11-screen">
      <div id="s11-arrows"></div>
      <div class="s11-lab kit-label" id="s11-lab1">Your species' incentives: aligned <span id="s11-ck"></span></div>
      <div class="s11-lab kit-label" id="s11-lab2">Your political system: not yet</div>
    </div>
    <div id="s11-cast"></div>
    <div id="s11-front"></div>
    <div id="s11-confetti"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part-02.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "s11";
      var D = KIT.scene(ID).duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C;

      q("bg").innerHTML = KIT.office(1501);
      q("set").innerHTML = KIT.svg(1920, 1080, KIT.wallScreen(120, 100, 900, 600));
      q("ck").innerHTML = KIT.checkSvg(40);
      function arrow(id, color) {
        return '<g transform="translate(416,' + (id === 1 ? 170 : 420) + ')"><g id="s11-arrow' + id + '">' +
          '<path d="M-200,0 H110" stroke="' + C.line + '" stroke-width="30" stroke-linecap="round"/>' +
          '<path d="M-200,0 H110" stroke="' + color + '" stroke-width="18" stroke-linecap="round"/>' +
          '<path d="M90,-48 L180,0 L90,48 Z" fill="' + color + '" stroke="' + C.line + '" stroke-width="7" stroke-linejoin="round"/>' +
          "</g></g>";
      }
      q("arrows").innerHTML = KIT.svg(832, 532, arrow(1, C.med) + arrow(2, C.war));

      // the confetti cannon sits on the desk, in front of Wishonia
      var cannon = '<g transform="translate(1180,912)"><g id="s11-cannon"><path d="M-30,0 L-62,-118 L62,-118 L30,0 Z" fill="' + C.peri + '" stroke="' + C.ink + '" stroke-width="6" stroke-linejoin="round"/>' +
        '<path d="M-52,-80 L52,-80 M-42,-42 L42,-42" stroke="' + C.cream + '" stroke-width="8"/><ellipse cx="0" cy="-118" rx="62" ry="14" fill="' + C.ink + '"/></g></g>';
      q("front").innerHTML = KIT.svg(1920, 1080, KIT.desk(1060, 915, 840) + cannon + '<g transform="translate(1740,800) scale(1.5)">' + KIT.mug(0, 0) + "</g>");

      var tl = gsap.timeline({ paused: true });
      var wish = KIT.mountWishonia(tl, q("cast"), { scene: ID, x: 1220, y: 120, w: 600 });

      // confetti: ballistic paths from the cannon mouth, seeded, recomputed on every seek
      var rand = KIT.rng(847);
      var colors = [C.red, C.orange, C.yellow, C.peri, C.cyan, C.cream];
      var bits = [];
      var html = "";
      for (var i = 0; i < 90; i++) {
        var a = (-90 + (rand() - 0.5) * 80) * Math.PI / 180;
        var sp = 900 + rand() * 900;
        bits.push({ vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, spin: (rand() - 0.5) * 1440, delay: rand() * 0.12 });
        html += '<div style="position:absolute;left:0;top:0;width:' + (14 + rand() * 10).toFixed(0) + 'px;height:' + (8 + rand() * 6).toFixed(0) + 'px;background:' + colors[i % colors.length] + ';border:2px solid #1A1426;opacity:0"></div>';
      }
      q("confetti").innerHTML = html;
      var nodes = q("confetti").children;
      var boom = cue("congratulations,");
      KIT.onTime(tl, D, function (t) {
        for (var k = 0; k < bits.length; k++) {
          var b = bits[k];
          var s = t - boom - b.delay;
          var n = nodes[k];
          if (s < 0 || s > 3.2) { if (n.style.opacity !== "0") n.style.opacity = 0; continue; }
          var x = 1180 + b.vx * s * 0.55;
          var y = 795 + b.vy * s + 0.5 * 1500 * s * s;
          n.style.opacity = 1;
          n.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (b.spin * s).toFixed(1) + "deg)";
        }
      });
      tl.to("#s11-cannon", { scaleY: 0.8, transformOrigin: "50% 100%", duration: 0.08, ease: "power2.in" }, boom - 0.08);
      tl.to("#s11-cannon", { scaleY: 1, transformOrigin: "50% 100%", duration: 0.35, ease: "elastic.out(1, 0.4)" }, boom);

      // the arrows point in different directions; labels on "aligned" and "political system"
      tl.fromTo("#s11-arrow1", { rotation: -10, transformOrigin: "50% 50%", opacity: 0 }, { rotation: -10, opacity: 1, duration: 0.3 }, cue("species'") - 0.1);
      tl.fromTo("#s11-arrow2", { rotation: 165, transformOrigin: "50% 50%", opacity: 0 }, { rotation: 165, opacity: 1, duration: 0.3 }, cue("political"));
      tl.fromTo(q("lab1"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, cue("aligned."));
      tl.fromTo(q("lab2"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, cue("system"));
      // the manual will show how: the second arrow swings to line up with the first
      tl.to("#s11-arrow2", { rotation: -10, transformOrigin: "50% 50%", duration: 1.1, ease: "back.inOut(1.4)" }, cue("exactly"));
      tl.to(wish.rig, { x: -20, duration: 0.5, ease: "power2.inOut" }, cue("The"));
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
