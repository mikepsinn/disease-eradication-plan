<template id="the-twist-template">
  <!-- the-twist · collage host shot (Part 26). The iris opens on her face, one finger up: "you might do this anyway."
       "right": a halo lowers into the frame and settles on the two balls of her antennae; "is),": it glints. "because:"
       it slips off one antenna, drops onto the ledge on its edge and rolls away along it like a hoop, out of the frame.
       She keeps smirking at the camera and does not look round. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="the-twist" data-width="1920" data-height="1080" data-start="0" data-duration="6.38">
    <div id="the-twist-weave"></div>
    <div id="the-twist-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    var V = KIT.V, S = KIT.STUDIO, Z = KIT.collage.SIZES, ID = "the-twist";
    var cue = function (w, n) { return KIT.cue(ID, w, n); };
    // the halo rests across the two balls of her antennae (HALO: its middle, canvas px; HW: its width)
    var HALO = V ? [477, 398] : [798, 136], HW = V ? 330 : 330, HK = HW / Z.halo[0];
    var HH = Z.halo[1] * HK, LEDGE = S.top - 4;
    var cast = {
      halo: { art: "halo", x: HALO[0], y: HALO[1], scale: HK, hidden: true },
    };
    var tB = cue("because", 2), tL = tB + 0.42;
    var beats = [
      // "right": it lowers in and settles; a glint on "is),"
      { on: "right", do: "slideIn", who: "halo", from: "top", over: 16 },
      { on: "right", offset: 0.25, do: "glow", who: "halo", dur: 0.8, size: 190 },
      { on: "right", offset: 0.5, do: "bob", who: "halo", y: 3, r: 1.5, speed: 1.2, until: tB - 0.2, fade: 0.2 },
      { on: "is", do: "hop", who: "halo", height: 14 },
      // "but": it tips off one antenna
      { at: tB - 0.3, do: "move", who: "halo", by: [-HW * 0.12, HH * 0.25], turn: -24, dur: 0.17, ease: "smooth" },
      // "because:": it drops onto the ledge, lands on its edge, and rolls off along the ledge like a hoop
      { at: tB, do: "move", who: "halo", to: [HALO[0] - HW * 0.45, LEDGE - HW / 2], turn: -90, dur: 0.33, ease: "linear", arc: 40 },
      { at: tB + 0.33, do: "shake", y: 5, frames: 2 },
      { at: tB + 0.36, do: "hop", who: "halo", height: 26 },
      { at: tL, do: "move", who: "halo", to: [-HW * 1.2, LEDGE - HW / 2], turn: -90, dur: Math.max(0.5, KIT.scene(ID).duration - tL - 0.15), ease: "linear" },
      { at: tL, do: "shiver", who: "halo", dur: 0.6, amp: 3, rot: 4 },
    ];
    KIT.collage({ id: ID, seed: 2602, host: { iris: ["in", 0, 0.55] }, cast: cast, beats: beats });
  </script>
</template>
