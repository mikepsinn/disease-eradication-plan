<template id="humanity-has-no-choice-title-template">
  <!-- humanity-has-no-choice-title · the period title card (KIT.titleScene, look "atomic"): THE PART WHERE over
       HUMANITY HAS / NO CHOICE, up from black. Just before "No" an open brass padlock drops in and hooks over the top arm
       of the C of CHOICE. "Choice.": it snaps shut (clank). Then it tugs the C twice, hard, and the C does not move. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="humanity-has-no-choice-title" data-width="1920" data-height="1080" data-start="0" data-duration="3.381">
    <div id="humanity-has-no-choice-title-cam">
      <div id="humanity-has-no-choice-title-bg"></div>
      <div id="humanity-has-no-choice-title-back"></div>
      <div id="humanity-has-no-choice-title-words"></div>
      <div id="humanity-has-no-choice-title-art"></div>
    </div>
    <div id="humanity-has-no-choice-title-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/title.js"></script>
  <script>
    KIT.titleScene({
      id: "humanity-has-no-choice-title",
      lines: [{ words: ["THE", "PART", "WHERE"], style: "small" }, ["HUMANITY", "HAS"], ["NO", "CHOICE"]],
      linesTall: [{ words: ["THE", "PART", "WHERE"], style: "small" }, ["HUMANITY"], ["HAS", "NO"], ["CHOICE"]],
      gag: function (c) {
        var tl = c.tl, b = c.word("CHOICE").box, D = c.D;
        // The padlock cut-out (265 x 370 art px): its shackle is art y 0-155 (the hole between its legs y 45-150), the
        // body below. Drawn as two pieces so the shackle can stand open (raised) and snap down into the body. The top
        // arm of the C (the C is about a sixth of the word) runs through the hole at HOOK.
        var AW = 265, AH = 370, k = b.h * 0.9 / AW, w = AW * k, h = AH * k, SH = 155, OPEN = 55 * k;
        var cw = b.w * 0.18, armX = b.x + cw * 0.86, armY = b.y + b.h * 0.1, HOOK = [132 * k, 112 * k];
        var lock = document.createElement("div");
        lock.style.cssText = "position:absolute;left:" + (armX - HOOK[0]).toFixed(1) + "px;top:" + (armY - HOOK[1]).toFixed(1) + "px;width:" + w.toFixed(1) +
          "px;height:" + h.toFixed(1) + "px;visibility:hidden;filter:drop-shadow(4px 6px 3px rgba(0,0,0,0.55))";
        var img = '<img src="assets/art/collage/padlock.webp" style="position:absolute;inset:0;width:100%;height:100%">';
        lock.innerHTML = '<div class="shk" style="position:absolute;inset:0;clip-path:inset(0 0 ' + (h - SH * k).toFixed(1) + 'px 0)">' + img + "</div>" +
          '<div class="bod" style="position:absolute;inset:0;clip-path:inset(' + ((SH - 8) * k).toFixed(1) + 'px 0 0 0)">' + img + "</div>";
        c.art.appendChild(lock);
        var shk = lock.querySelector(".shk"), origin = HOOK[0].toFixed(1) + "px " + HOOK[1].toFixed(1) + "px";
        var tNo = c.cue("No"), tC = c.cue("Choice."), T0 = Math.max(0.6, tNo - 0.4);
        // it drops in open from above the frame, hooks onto the arm and swings
        tl.set(lock, { transformOrigin: origin }, 0);
        tl.set(shk, { y: -OPEN }, 0);
        tl.fromTo(lock, { visibility: "hidden" }, { visibility: "inherit", duration: 0.01 }, T0);
        tl.fromTo(lock, { y: -armY - h }, { y: 0, duration: 0.25, ease: "power2.in" }, T0);
        tl.fromTo(lock, { rotation: 0 }, { keyframes: [{ rotation: 16, duration: 0.12 }, { rotation: -10, duration: 0.16 }, { rotation: 6, duration: 0.16 }, { rotation: 0, duration: 0.2 }], ease: "sine.inOut" }, T0 + 0.25);
        // "Choice.": the shackle snaps shut, and the card jolts
        tl.to(shk, { y: 0, duration: 0.05, ease: "power3.in" }, tC);
        tl.fromTo(c.cam, { x: 0, y: 0 }, { keyframes: [{ x: 6, y: 5, duration: 0.04 }, { x: -5, y: -3, duration: 0.04 }, { x: 3, y: 2, duration: 0.04 }, { x: 0, y: 0, duration: 0.04 }], ease: "none" }, tC);
        // two hard tugs down; the C does not budge, the lock stretches and springs back
        [tC + 0.45, tC + 0.78].forEach(function (t) {
          if (t > D - 0.2) return;
          tl.to(lock, { scaleY: 1.12, rotation: -5, duration: 0.06, ease: "power3.in" }, t);
          tl.to(lock, { scaleY: 1, rotation: 0, duration: 0.14, ease: "back.out(2.5)" }, t + 0.08);
        });
      },
    });
  </script>
</template>
