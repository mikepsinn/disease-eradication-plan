  <!-- game-pool-rules · collage (Part 24, scenes 3 and 4 as one plate, game-board). The bit: the rules of the game,
       played out on a Victorian race-game board with a pool of medicine money in the middle. "Scoreboard:": its bulbs

       holders cannonball in, waist-deep in bills. "didn't,": the film rewinds (scratches), they fly back out, and the
       lines redraw flat. "pro rata": the pool tips and pours, a fire hose into the Fat Cat's piggy bank, a trickle into Grandma's;
       "retirement account": nothing, and YOU's skinny retirement piggy keels over, legs up. "You earn": YOU steps onto START and hauls
       two friends up over the edge; two chips land on his hat. "Nobody loses.": a bill hops to every player and the
       retirement account sits up. "not playing.": off the board, a smug man on his crate; a germ rises behind him and
       pounces, and he x-rays to a skeleton on his crate. The germ grins. -->

    // ── The board (plate px): a ring of numbered squares, START bottom left, WAR top left, DISEASES top right, the

    var B = { x0: 0, y0: 500, x1: 2600, y1: 1500, T: 240 };

      };

      s += '<rect x="' + B.x0 + '" y="' + B.y0 + '" width="' + W + '" height="' + H + '" fill="#E9D9AC" stroke="' + INK + '" stroke-width="6"/>';
      s += '<rect x="' + (B.x0 + T + 22) + '" y="' + (B.y0 + T + 22) + '" width="' + (W - 2 * T - 44) + '" height="' + (H - 2 * T - 44) + '" fill="none" stroke="' + INK + '" stroke-width="3"/>';
      // START, then the bottom row left to right, the right side up, DISEASES, the top row right to left, WAR, the left side down

    // The three point holders are one cut-out (point-holder) cut into three strips; each strip is the whole art clipped,

    var cast = {}, beats = [], add = function (b) { beats.push(b); };

    // behind the board's back edge: the Scoreboard, the calendar, the easel

    // "Nobody loses.": a bill for every player
