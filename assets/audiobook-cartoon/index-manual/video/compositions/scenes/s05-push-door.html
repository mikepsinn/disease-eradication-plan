<template id="s05-template">
  <!-- S05 · Layer B · A bean human pulls a door marked PUSH. The countdown board starts. HOLD on "permanently stop". -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #s05-bg, #s05-art, #s05-pip { position: absolute; inset: 0; }
    #s05-board-wrap { position: absolute; left: 1250px; top: 80px; }
    #s05-stat { position: absolute; left: 960px; top: 330px; width: 640px; }
    #s05-stat-1 { font-size: 46px; }
    #s05-stat-2 { font-size: 150px; line-height: 1; color: #D7322B; margin: 22px 0 6px; }
    #s05-stat-3 { font-size: 48px; }
    #s05-please { position: absolute; left: 960px; top: 680px; font-size: 50px; color: #1FA39A; }
  </style>
  <div id="root" data-composition-id="s05" data-width="1920" data-height="1080" data-start="0" data-duration="17.24">
    <div id="s05-bg" class="clip" data-start="0" data-duration="17.24" data-track-index="0"></div>
    <div id="s05-art"></div>
    <div id="s05-board-wrap"></div>
    <div id="s05-stat">
      <div id="s05-stat-1" class="kit-label">Every minute:</div>
      <div id="s05-stat-2" class="kit-big">104</div>
      <div id="s05-stat-3" class="kit-label">humans permanently stop.</div>
    </div>
    <div id="s05-please" class="kit-label">Please make a different face.</div>
    <div id="s05-pip"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part-02.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "s05";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C;

      q("bg").innerHTML = KIT.paper(ID);
      // door (hinge on the left), its frame and the PUSH plate; the human pulls the handle on the right
      q("art").innerHTML = KIT.svg(1920, 1080,
        KIT.paperDefs(ID + "a") +
        '<rect x="150" y="150" width="420" height="720" fill="url(#' + ID + 'a-cross)" stroke="' + C.line + '" stroke-width="6"/>' +
        '<path d="M90,880 H900" stroke="' + C.line + '" stroke-width="6"/>' +
        '<path d="M100,890 l40,30 M200,890 l40,30 M300,890 l40,30 M400,890 l40,30 M500,890 l40,30 M600,890 l40,30 M700,890 l40,30 M800,890 l40,30" stroke="' + C.line + '" stroke-width="2"/>' +
        '<g id="s05-door">' +
          '<rect x="176" y="176" width="370" height="694" fill="' + C.paper + '" stroke="' + C.line + '" stroke-width="6"/>' +
          '<rect x="216" y="220" width="290" height="250" fill="none" stroke="' + C.line + '" stroke-width="3"/>' +
          '<rect x="216" y="520" width="290" height="300" fill="url(#' + ID + 'a-fine)" stroke="' + C.line + '" stroke-width="3"/>' +
          '<rect x="246" y="300" width="230" height="96" rx="6" fill="' + C.paper + '" stroke="' + C.line + '" stroke-width="5"/>' +
          '<text x="361" y="371" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="70" fill="' + C.line + '">PUSH</text>' +
          '<rect x="500" y="575" width="22" height="90" rx="10" fill="' + C.line + '"/>' +
        "</g>" +
        '<g transform="translate(720,670)"><g id="s05-human"><g id="s05-human-in">' +
          '<g transform="scale(2.1)">' + KIT.bean({ tone: 1, arms: [[-100, -106], [25, 60]], hair: 1, brows: true, mouth: "flat" }) + "</g>" +
        "</g></g></g>" +
        '<g id="s05-lines" stroke="' + C.line + '" stroke-width="5" stroke-linecap="round" opacity="0">' +
          '<path d="M880,560 h70 M890,610 h90 M880,660 h70"/></g>'
      );
      q("board-wrap").innerHTML = KIT.countdownBoard();
      var board = q("board-wrap").firstChild;
      var art = q("art");
      var brows = art.querySelector(".brows");
      var mouth = art.querySelector(".mouth");

      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), { scene: ID, x: 1620, y: 590, w: 280, pip: { cx: 1760, cy: 740, r: 128 } });
      KIT.onTime(tl, D, function (t) { KIT.setBoard(board, sc.start + t); });

      var human = "#s05-human-in";
      var door = "#s05-door";
      gsap.set(brows, { opacity: 0 });
      tl.fromTo("#s05-human", { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);

      // pull, pull again, then harder
      function tug(t, lean, rattle) {
        tl.to(human, { rotation: lean, x: 18 + lean, transformOrigin: "50% 100%", duration: 0.18, ease: "power2.out" }, t);
        tl.to(door, { rotation: rattle, transformOrigin: "0% 100%", duration: 0.09, ease: "power1.inOut" }, t + 0.05);
        tl.to(door, { rotation: 0, transformOrigin: "0% 100%", duration: 0.12, ease: "power1.inOut" }, t + 0.16);
        tl.to(human, { rotation: 0, x: 0, transformOrigin: "50% 100%", duration: 0.22, ease: "power2.inOut" }, t + 0.22);
      }
      var p = cue("pulling");
      tug(p, 8, -0.6);
      tug(p + 0.6, 9, -0.7);
      tug(cue("pull"), 10, -0.8);
      var h = cue("harder,");
      tl.fromTo("#s05-lines", { opacity: 0 }, { opacity: 1, duration: 0.1 }, h);
      tug(h, 16, -1.4);
      tug(h + 0.5, 18, -1.6);
      tl.to("#s05-lines", { opacity: 0, duration: 0.2 }, h + 1);
      // glare at the door: it has made an error
      tl.to(brows, { opacity: 1, duration: 0.15 }, cue("error.") - 0.6);
      tl.to(human, { x: 26, rotation: -6, transformOrigin: "50% 100%", duration: 0.35, ease: "power2.out" }, cue("error.") - 0.6);

      // the countdown board, then the stat; HOLD (no motion) on "permanently stop"
      tl.fromTo(q("board-wrap"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, cue("Every"));
      tl.fromTo(q("stat-1"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, cue("minute"));
      tl.fromTo(q("stat-2"), { opacity: 0, scale: 0.7, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, cue("104"));
      tl.fromTo(q("stat-3"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, cue("humans"));
      // a different face
      tl.set(mouth, { attr: { d: "M-4,-24 a4,4 0 1 0 8,0 a4,4 0 1 0 -8,0" } }, cue("different"));
      tl.to(brows, { opacity: 0, duration: 0.1 }, cue("different"));
      tl.fromTo(q("please"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, cue("Please"));
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
