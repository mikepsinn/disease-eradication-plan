<template id="cancer-oil-reserves-template">

  </div>

      var L = V
        ? { G: 1380, blob: { x: 690, s: 1.75 }, tank: { x: 200, s: 0.7 }, sol: [[330, 1.25], [440, 1.25]], wm: { x: 1100, y: 940, s: 2.1, lean: -24 },
            plane: 540, nuke: 0.8, flagX: -0.42, cloth: 1 }

      // Burn a drawing's markup (as KIT's charred people are burnt): every color but the ink and the kept ones (the eye

      function burn(markup, keep) {
        var ink = C.line.toUpperCase();
        return markup.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g, function (m, a, col) {
          var u = col.toUpperCase();
          if (u === ink || keep.indexOf(u) >= 0) return m;
          var n = parseInt(col.slice(1), 16), l = (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255, v = Math.round(28 + l * 46);

      // ── The cancer blob, grumpy, in its sash; and its charred twin (eyes, sash and letters spared) ──

      var wisps = g("wisps", [-30, 10, 48].map(function (dx, i) {

        }
        var tower = '<path d="M' + l + "," + DY + " L" + tl + "," + ty + " M" + r + "," + DY + " L" + tr + "," + ty + '" stroke="' + C.line + '" stroke-width="5.5" stroke-linecap="square"/>' +
          '<path d="' + braces + '" stroke="' + C.line + '" stroke-width="2.4" fill="none"/>' +

          '<rect x="' + (DX - 11) + '" y="' + (ty - 8) + '" width="22" height="10" fill="' + C.slate + '" stroke="' + C.line + '" stroke-width="2.6"/>' +

        // the pump jack, left of the tower: an A-frame and a walking beam with a horse head, rocking about (PX, PY)
        var PX = DX - 52, PY = DY - 30;
        var frame = '<path d="M' + (PX - 12) + "," + DY + " L" + PX + "," + PY + " L" + (PX + 12) + "," + DY + '" fill="none" stroke="' + C.line + '" stroke-width="5"/>' +
          '<path d="M' + (PX - 12) + "," + DY + " L" + PX + "," + PY + " L" + (PX + 12) + "," + DY + '" fill="none" stroke="' + C.orange + '" stroke-width="2"/>';

          '<path d="M' + (PX - 36) + "," + (PY - 9) + " L" + (PX - 46) + "," + (PY - 2) + " L" + (PX - 44) + "," + (PY + 14) + " L" + (PX - 34) + "," + (PY + 6) + ' Z" fill="' + C.war + '" stroke="' + C.line + '" stroke-width="2.6" stroke-linejoin="miter"/>' +

      }
      var DR = derrick();

      // ── The gusher: a black column from the crown to above the frame, a splashing top and raining drops ──
      var crownY = G + B.s * DR.crown[1], crownX = B.x + B.s * DR.crown[0], topY = V ? 150 : 40;
      function gusher() {
        var h = crownY - topY, x = crownX;
        var col = '<path d="M' + (x - 8) + "," + crownY + " C" + (x - 14) + "," + f(crownY - h * 0.4) + " " + (x - 30) + "," + f(topY + 60) + " " + (x - 40) + "," + topY +
          " L" + (x + 40) + "," + topY + " C" + (x + 30) + "," + f(topY + 60) + " " + (x + 14) + "," + f(crownY - h * 0.4) + " " + (x + 8) + "," + crownY + ' Z" fill="' + OIL + '" stroke="' + C.line + '" stroke-width="4"/>' +

        var crown = [[-58, 0, 26], [-22, -18, 30], [20, -16, 32], [56, 2, 26], [0, 10, 30]].map(function (c) {

        return { col: g("gush-col", col + crown), x: x };
      }
      var GU = gusher();
      // Oil drops raining down around the blob, each on its own lane (they loop from the top of the gusher to the ground).
      var rnd = KIT.rng(2003), drops = "";
      for (var i = 0; i < 12; i++) {

        drops += '<g transform="translate(' + f(GU.x + dx) + "," + (topY + 20) + ')"><g class="drop" data-i="' + i + '"><path d="M0,' + (-r0 * 1.6) + " Q" + f(r0) + ",0 0," + f(r0) + " Q" + f(-r0) + ",0 0," + f(-r0 * 1.6) + ' Z" fill="' + OIL + '" stroke="' + C.line + '" stroke-width="2"/></g></g>';
      }
      drops = g("drops", drops, 'opacity="0"');

      // ── The weapons maker leans in from the right edge, his baby missile in his arms; his eyes turn to dollar signs ──
      var wmO = KIT.castOpts("weaponsMaker", { look: "left" });
      var wm = '<defs><clipPath id="' + P("edge") + '"><rect x="46" y="46" width="' + (W - 92) + '" height="' + (H - 92) + '"/></clipPath></defs><g clip-path="url(#' + P("edge") + ')">' +
        '<g transform="translate(' + L.wm.x + "," + L.wm.y + ')">' + g("wm", '<g transform="rotate(' + L.wm.lean + ") scale(" + L.wm.s + ') translate(0,-100)">' +
          g("wm-a", KIT.person(wmO)) + g("wm-b", KIT.person(KIT.castOpts("weaponsMaker", { look: "left", mood: "greedy" })), 'opacity="0"') + "</g>") +
        g("ding", [[-150, -330, 22], [-110, -400, 14], [-190, -380, 12]].map(function (s) { return KIT.star(s[0], s[1], s[2], C.yellow); }).join(""), 'opacity="0"') + "</g></g>";

      // ── The invasion force ──

      var HELMET = '<path d="M-21,-3 C-23,-26 -11,-37 2,-37 C15,-37 25,-26 23,-3 Z" fill="' + C.slate + '" stroke="' + C.line + '" stroke-width="2.6" stroke-linejoin="miter"/>' +

      // The tank (in its own units, standing on y 0, facing right): treads, a hull, a turret with an open hatch, a long barrel.
      function tankParts() {
        var tread = "M-176,-50 L-160,-62 L160,-62 L178,-48 L166,-4 L150,0 L-150,0 L-166,-6 Z", wheels = "";

        var teeth = "";

      var TK = tankParts(), ts = L.tank.s;

      var sciO = KIT.castOpts("scientist", { look: "right", mood: "eager", arms: [[-150, -172], [40, 70]] }), sciR = KIT.rig(sciO);

      var bayonet = '<g transform="translate(' + f(sh[0]) + "," + f(sh[1]) + ') rotate(28)">' +

      var soldiers = L.sol.map(function (s, i) {

          g("sol" + i + "-cheer", helmeted(KIT.person(mix(o, CHEER))), 'opacity="0"'))));
      }).join("");

      // ── The flag: a plain pennant on a pole, "CURED: 2003", thrown like a javelin by the front soldier ──
      var CL = 1 * L.cloth;
      var flagArt = '<path d="M-3,0 L-3,-200 L3,-200 L3,0 Z" fill="' + C.tan + '" stroke="' + C.line + '" stroke-width="2.6"/>' +
        '<path d="M-3,0 L0,14 L3,0 Z" fill="#D9D4C6" stroke="' + C.line + '" stroke-width="2"/><circle cx="0" cy="-204" r="6" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="2"/>' +
        '<g transform="scale(' + CL + ')">' + g("cloth", '<path d="M-3,-196 L-236,-190 L-224,-160 L-240,-130 L-3,-124 Z" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="3.4" stroke-linejoin="miter"/>' +
          '<path d="M-14,-188 L-222,-183 M-14,-132 L-224,-137" stroke="' + C.war + '" stroke-width="4"/>' +
          '<text x="-118" y="-148" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="31" letter-spacing="1.5" fill="' + C.line + '">CURED: 2003</text>') + "</g>";
      // where it sticks: on the blob's head, left of the derrick (in frame px)
      var flagAt = [B.x + B.s * 82 * L.flagX, G + B.s * (BLOB_TOP + 22)];
      var flag = '<g transform="translate(' + f(flagAt[0]) + "," + f(flagAt[1]) + ')">' + g("flag", g("flag-wob", flagArt)) + "</g>";

      // ── The plane and its grinning bombs ──
      var plane = '<g id="' + P("plane") + '"><g transform="scale(' + (V ? 1.05 : 1.25) + ')">' +
        '<path d="M-112,-12 h-46 M-104,8 h-34 M-96,26 h-22" stroke="' + C.line + '" stroke-width="4" stroke-linecap="round" opacity="0.55"/>' +
        '<path d="M-66,-4 L-86,-46 L-60,-46 L-38,-10 Z" fill="' + C.orange + '" stroke="' + C.line + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<path d="M-80,-4 Q-44,-24 28,-22 Q72,-20 80,0 Q72,18 28,18 L-58,12 Q-82,8 -80,-4 Z" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="4.5" stroke-linejoin="round"/>' +
        '<path d="M-66,4 H72" stroke="' + C.war + '" stroke-width="6"/>' +
        [-26, -6, 14].map(function (wx) { return '<circle cx="' + wx + '" cy="-8" r="5" fill="' + C.peri + '" stroke="' + C.line + '" stroke-width="2.5"/>'; }).join("") +
        '<ellipse cx="-8" cy="8" rx="36" ry="9" fill="' + C.slate + '" stroke="' + C.line + '" stroke-width="4"/>' +
        '<circle cx="80" cy="0" r="6" fill="' + C.line + '"/>' + g("prop", '<ellipse cx="86" cy="0" rx="4" ry="28" fill="' + C.line + '" opacity="0.75"/>') + "</g></g>";
