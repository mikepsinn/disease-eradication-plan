<template id="murder-shopping-cart-template">
  <!-- murder-shopping-cart · Layer B (storyboards/part-10-cost-of-war.md, scene 2). Slides in from the title card.
       "Humans" → the politician pushes a giant shopping cart into AISLE 1 (squeaky wheels), waving with his other hand;
       war papers trickle out between the basket's wires. "spend" → the baby missile in the child seat, in a bonnet,
       shakes its rattle. "trillion" → the cart's price tag swings up and flips to $2.72 TRILLION / YEAR (ding).
       "every year" → the politician pats the tag, proud. "stop being alive:" → the shopping list unrolls from the
       handle (whoosh), its roll hits the floor (boing) and bounces away down the aisle, off the frame; the list is
       blank under its heading. After "alive:" → he licks his pencil. The last frame is state A of the cart spine,
       where warheads-in-the-cart starts. -->
  <style>

    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #murder-shopping-cart-cam, #murder-shopping-cart-bg, #murder-shopping-cart-art, #murder-shopping-cart-pip, #murder-shopping-cart-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="murder-shopping-cart" data-width="1920" data-height="1080" data-start="0" data-duration="8.66">
    <div id="murder-shopping-cart-cam">
      <div id="murder-shopping-cart-bg"></div>
      <div id="murder-shopping-cart-art"></div>

  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>

  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "murder-shopping-cart";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var W = KIT.W, H = KIT.H, V = KIT.V;

      // ── THE CART SPINE ─────────────────────────────────────────────────────────────────────────────────────
      // One drawing, copied verbatim into murder-shopping-cart, warheads-in-the-cart and cart-gadgets (AGENTS.md
      // Continuity: change all three). The store aisle, the giant shopping cart, its $2.72 TRILLION / YEAR tag, the
      // baby missile in the child seat, the shopping list hanging from the handle (its trail runs off the frame),
      // the warhead heap, the 122-snowflake tag, the politician and the weapons maker, with their poses. Part 11's
      // official-murder-budget brings the cart back in its cart-gadgets final state: copy this block and
      // cart-gadgets' STATE C drawing (stateC()).
      function cartSpine(ID) {
        var C = KIT.C, ink = C.line, W = KIT.W, H = KIT.H, V = KIT.V, DEG = Math.PI / 180, WHITE = "#FBF6E6";
        var P = function (s) { return ID + "-" + s; };
        var n1 = function (v) { return (Math.round(v * 10) / 10).toFixed(1); };
        var at = function (x, y, sc, inner, rot) { return '<g transform="translate(' + n1(x) + "," + n1(y) + ")" + (rot ? " rotate(" + n1(rot) + ")" : "") + (sc !== 1 ? " scale(" + sc + ")" : "") + '">' + inner + "</g>"; };
        var g = function (id, inner, extra) { return '<g id="' + P(id) + '"' + (extra || "") + ">" + inner + "</g>"; };
        var line = function (d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linejoin="miter" stroke-linecap="round"/>'; };
        var poly = function (pts, col, w) {
          var d = "M" + pts.map(function (p) { return n1(p[0]) + "," + n1(p[1]); }).join(" L") + " Z";
          return '<path d="' + d + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="' + (w || 4) + '" stroke-linejoin="miter"/><path d="' + d + '" fill="' + col + '"/>';
        };
        var copy = function (a, b) { var o = {}, q; for (q in a) o[q] = a[q]; for (q in b || {}) o[q] = b[q]; return o; };

        // Layout. wj: the foot of the back wall; gy: the shoppers' feet; s: the humans' scale; k: the cart's (1.6 times
        // theirs: a giant cart); polX / wmX: the politician's and the weapons maker's feet; list: the shopping list's
        // scale and its center left of the grip; trail: where the list's trail leaves the frame; sign: the 122-flake
        // tag (box, grid step, flake radius); shelf: the back shelving (top, rows); plate: the AISLE 1 plate;
        // barrow: where the weapons maker sets his wheelbarrow down.
        var L = V
          ? { wj: 1190, gy: 1330, s: 2.0, k: 3.2, polX: 300, wmX: 925, list: { k: 1.6, hand: [-72, -72] }, trail: { fy: 1405, to: [-30, 1440], w: [30, 22] },
              sign: { x: 58, y: 150, w: 470, h: 520, step: [38, 31], r: 12.5, fs: 40 }, shelf: { top: 660, rows: [820, 1000], x0: 50, x1: 1030 },
              plate: { x: 560, y: 560, w: 300 }, barrow: [1010, 1330] }
          : { wj: 690, gy: 830, s: 2.3, k: 3.7, polX: 345, wmX: 1095, list: { k: 1.7, hand: [-72, -70] }, trail: { fy: 858, to: [1945, 688], w: [34, 12] },
              sign: { x: 880, y: 44, w: 384, h: 440, step: [30, 26], r: 10, fs: 34 }, shelf: { top: 170, rows: [330, 500], x0: 50, x1: 1870 },
              plate: { x: 70, y: 60, w: 300 }, barrow: [1290, 830] };
        var s = L.s, k = L.k;

        // ── Geometry: the politician's near hand is on the grip; the cart hangs off that. ──
        var POL0 = KIT.castOpts("politician", { look: "right" }), RP = KIT.rig(POL0), LEN = RP.armLength;
        var polY = L.gy - 100 * s;
        var GRIP_P = [55, -46];
        var grip = [L.polX + GRIP_P[0] * s, polY + GRIP_P[1] * s];
        var CX = grip[0] + 53 * k, CY = L.gy;
        var cp = function (x, y) { return [CX + x * k, CY + y * k]; };
        var pp = function (p) { return [L.polX + p[0] * s, polY + p[1] * s]; };
        var toPol = function (p) { return [(p[0] - L.polX) / s, (p[1] - polY) / s]; };
        function ik(sh, t, len, bend) {
          var dx = t[0] - sh[0], dy = t[1] - sh[1], d = Math.min(Math.sqrt(dx * dx + dy * dy), 2 * len * 0.999);
          var phi = Math.atan2(dx, dy) / DEG, al = Math.acos(d / (2 * len)) / DEG;
          return [phi + bend * al, phi - bend * al];
        }
        function handEnd(sh, a, len) {
          var e = [sh[0] + len * Math.sin(a[0] * DEG), sh[1] + len * Math.cos(a[0] * DEG)];
          return { elbow: e, hand: [e[0] + len * Math.sin(a[1] * DEG), e[1] + len * Math.cos(a[1] * DEG)], dir: [Math.sin(a[1] * DEG), Math.cos(a[1] * DEG)] };
        }
        // His far (left) hand holds the shopping list up beside him, the whole time.
        var SH = RP.shoulder, LIST_ARM = ik(SH[0], L.list.hand, LEN, 1), LHAND = pp(handEnd(SH[0], LIST_ARM, LEN).hand);

        // ── The shopping list (KIT.props.scroll), held up by its top roll: rolled up while he waves it, then it
        // unrolls, and its bottom roll drops to the floor and runs away (the trail). ──
        var LK = L.list.k, listX = LHAND[0], listTop = LHAND[1] - 4;
        var listY = listTop + 158 * LK; // the scroll's y 0 on the canvas
        var lp = function (x, y) { return [listX + x * LK, listY + y * LK]; };
        var LINES = ["12,241 NUCLEAR", "WARHEADS", "AI MURDER-BOT", "INVISIBLE JET", "SPACE FORCE", "EARTHQUAKE MACHINE", "(PROBABLY)"];
        var ITEMS = [[0, 1], [2], [3], [4], [5, 6]]; // the five things bought, by line
        var lineY = function (j) { return -104 + j * 14; };
        function listSvg() {
          var sc = KIT.props.scroll({ text: "SHOPPING LIST", lines: LINES, wax: false });
          var ticks = ITEMS.map(function (it, i) {
            var y = lineY(it[0]) - 4;
            return '<path class="' + P("tick") + '" data-i="' + i + '" d="M-55,' + (y - 1) + " L-50.5," + (y + 4) + " L-43," + (y - 8) + '" fill="none" stroke="' + C.war + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>';
          }).join("");
          return g("list-wave", at(listX, listY, LK, g("list", sc + ticks)));
        }
        // The list's text: [title, line 0, ... line 6]. Lines start hidden (the list is blank under its heading).
        function listTexts() { return document.querySelectorAll("#" + P("list") + " .scroll-paper text"); }
        // Write item i (its lines appear and its tick draws) at time t.
        function tickItem(tl, i, t) {
          var tx = listTexts();
          ITEMS[i].forEach(function (j, n) { tl.fromTo(tx[j + 1], { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "steps(4)" }, t + n * 0.12); });
          tl.fromTo(document.querySelector("#" + P("list") + " ." + P("tick") + '[data-i="' + i + '"]'), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power2.out" }, t + 0.2);
        }
        // Show items 0..n-1 written and ticked (a scene that starts with them done).
        function listDone(n) {
          var tx = listTexts();
          for (var j = 1; j < tx.length; j++) tx[j].setAttribute("opacity", "0");
          for (var i = 0; i < n; i++) {
            ITEMS[i].forEach(function (j) { tx[j + 1].setAttribute("opacity", "1"); });
            document.querySelector("#" + P("list") + " ." + P("tick") + '[data-i="' + i + '"]').setAttribute("stroke-dashoffset", "0");
          }
        }
        // The list unrolled (or rolled up in his hand).
        function listRolled(up) {
          var el = document.getElementById(P("list"));
          el.querySelector(".scroll-reveal").setAttribute("height", up ? "0" : "150");
          gsap.set(el.querySelector(".scroll-roll-bottom"), { y: up ? -150 : 0 });
        }

        // The trail: where the list ends, its paper keeps going: down to the floor (drop), then along the floor and
        // off the frame (run), narrowing as it goes away. The roll that ran away is at its far end.
        var foot = lp(0, -8), half = 56 * LK, FY = L.trail.fy, tr1 = L.trail.to, wA = L.trail.w[0], wB = L.trail.w[1];
        function trailSvg() {
          var x0 = foot[0] - half, x1 = foot[0] + half;
          var drop = [[x0 + 4, foot[1] - 6], [x1 - 4, foot[1] - 6], [x1 - 4, FY], [x0 + 4, FY]];
          var run = V ? [[x1 - 4, FY - wA / 2], [x1 - 4, FY + wA / 2], [tr1[0], tr1[1] + wB / 2], [tr1[0], tr1[1] - wB / 2]]
            : [[x0 + 4, FY - wA / 2], [tr1[0], tr1[1] - wB / 2], [tr1[0], tr1[1] + wB / 2], [x0 + 4, FY + wA / 2]];
          return '<defs><clipPath id="' + P("drop-clip") + '"><rect id="' + P("drop-reveal") + '" x="' + n1(x0 - 10) + '" y="' + n1(foot[1] - 8) + '" width="' + n1(2 * half + 20) + '" height="0"/></clipPath>' +
            '<clipPath id="' + P("run-clip") + '"><rect id="' + P("run-reveal") + '" x="' + n1(V ? x1 : x0) + '" y="0" width="0" height="' + H + '"/></clipPath></defs>' +
            '<g clip-path="url(#' + P("run-clip") + ')">' + poly(run, WHITE, 3) + line("M" + n1(V ? x1 : x0) + "," + n1(FY) + " L" + n1(tr1[0]) + "," + n1(tr1[1]), C.orange, 1.6) + "</g>" +
            '<g clip-path="url(#' + P("drop-clip") + ')">' + poly(drop, WHITE, 3.5) + line("M" + n1(x0 + 12) + "," + n1(foot[1]) + " V" + n1(FY) + " M" + n1(x1 - 12) + "," + n1(foot[1]) + " V" + n1(FY), C.orange, 1.6) + "</g>";
        }
        // The roll that runs away with the trail: the list's bottom roll seen end-on, a white disc with a spiral.
        var ROLL_R = 13 * LK, ROLL0 = [V ? foot[0] + half - ROLL_R : foot[0] - half + ROLL_R, FY - ROLL_R + 2];
        function rollSvg() {
          var r = ROLL_R;
          return at(ROLL0[0], ROLL0[1], 1, g("roll-hop", g("roll-spin", '<circle r="' + n1(r) + '" fill="' + WHITE + '" stroke="' + ink + '" stroke-width="4"/>' +
            line("M0,0 m" + n1(-r * 0.15) + ",0 a" + n1(r * 0.15) + "," + n1(r * 0.15) + " 0 1 1 " + n1(r * 0.3) + ",0 a" + n1(r * 0.35) + "," + n1(r * 0.35) + " 0 1 1 " + n1(-r * 0.7) + ",0 a" + n1(r * 0.6) + "," + n1(r * 0.6) + " 0 1 1 " + n1(r * 1.2) + ",0", C.orange, 2.4)), ' opacity="0"'));
        }
        // The roll drops from the list's foot to the floor (t0 .. t1), then hops away to the frame edge (t1 .. t1 + dur).
        function runTrail(tl, t0, t1, dur) {
          var hop = document.getElementById(P("roll-hop")), spin = document.getElementById(P("roll-spin"));
          var dx = tr1[0] - ROLL0[0], dy = tr1[1] - (ROLL0[1] + ROLL_R), hops = 3;
          gsap.set(hop, { svgOrigin: "0 0" });
          tl.set(hop, { opacity: 1 }, t0);
          tl.set(document.querySelector("#" + P("list") + " .scroll-roll-bottom"), { opacity: 0 }, t0);
          tl.fromTo(hop, { y: foot[1] - FY }, { y: 0, duration: t1 - t0, ease: "power2.in" }, t0);
          tl.fromTo(document.getElementById(P("drop-reveal")), { attr: { height: 0 } }, { attr: { height: FY - foot[1] + 10 } , duration: t1 - t0, ease: "power2.in" }, t0);
          tl.fromTo(hop, { x: 0 }, { x: dx * 1.1, duration: dur, ease: "none", immediateRender: false }, t1);
          for (var i = 0; i < hops; i++) {
            var ta = t1 + (dur / hops) * i, h = (V ? 80 : 70) * (1 - i * 0.3), yA = dy * (i / hops) * 1.1, yB = dy * ((i + 1) / hops) * 1.1;
            tl.fromTo(hop, { y: yA }, { y: (yA + yB) / 2 - h, duration: dur / hops / 2, ease: "power2.out", immediateRender: false }, ta);
            tl.to(hop, { y: yB, duration: dur / hops / 2, ease: "power2.in" }, ta + dur / hops / 2);
          }
          tl.fromTo(hop, { scale: 1 }, { scale: V ? 0.8 : 0.5, duration: dur, ease: "none", immediateRender: false }, t1);
          tl.fromTo(spin, { rotation: 0, svgOrigin: "0 0" }, { rotation: (V ? -1 : 1) * 1000, svgOrigin: "0 0", duration: dur, ease: "none" }, t1);
          var rv = document.getElementById(P("run-reveal")), x0 = +rv.getAttribute("x");
          if (V) tl.fromTo(rv, { attr: { x: x0, width: 0 } }, { attr: { x: tr1[0] - 40, width: x0 - tr1[0] + 40 }, duration: dur, ease: "none" }, t1);
          else tl.fromTo(rv, { attr: { width: 0 } }, { attr: { width: tr1[0] + 40 - x0 }, duration: dur, ease: "none" }, t1);
        }
        // The whole trail already run out (a scene that starts after it).
        function trailDone() {
          var rv = document.getElementById(P("run-reveal")), x0 = +rv.getAttribute("x");
          if (V) { rv.setAttribute("x", n1(tr1[0] - 40)); rv.setAttribute("width", n1(x0 - tr1[0] + 40)); } else rv.setAttribute("width", n1(tr1[0] + 40 - x0));
          document.getElementById(P("drop-reveal")).setAttribute("height", n1(FY - foot[1] + 10));
          document.querySelector("#" + P("list") + " .scroll-roll-bottom").setAttribute("opacity", "0");
        }

        // ── The store aisle: the back shelving of silly weapons with sale tags, the AISLE 1 plate, the floor. ──
        function aisleSvg() {
          var sh = L.shelf, out = "", r = KIT.rng(1913);
          // the floor (a shade darker than the paper), its back edge, and tile seams running toward the far end
          out += '<rect x="44" y="' + L.wj + '" width="' + (W - 88) + '" height="' + (H - 44 - L.wj) + '" fill="#E9DFBE"/>';
          var vx = V ? -600 : W + 900;
          for (var i = -6; i <= 14; i++) {
            var xb = (V ? W : 0) + (V ? -1 : 1) * i * 170;
            out += line("M" + n1(xb) + "," + (H - 44) + " L" + n1(xb + (vx - xb) * 0.42) + "," + n1(L.wj + (H - 44 - L.wj) * 0.0), "#D4C79D", 2);
          }
          [0.22, 0.5, 0.82].forEach(function (f) { out += line("M44," + n1(L.wj + (H - 44 - L.wj) * f * f) + " H" + (W - 44), "#D4C79D", 2); });
          out = '<g clip-path="url(#' + P("floor-clip") + ')">' + out + "</g>" + '<defs><clipPath id="' + P("floor-clip") + '"><rect x="44" y="' + L.wj + '" width="' + (W - 88) + '" height="' + (H - 88 - L.wj + 44) + '"/></clipPath></defs>';
          out += line("M44," + L.wj + " H" + (W - 44), ink, 3);
          // the shelving: uprights, shelves, and on each shelf a row of grumpy missiles and grinning bombs with tags
          var shelf = "";
          var xs = [];
          for (var x = sh.x0 + 40; x < sh.x1 - 20; x += V ? 245 : 300) xs.push(x);
          xs.concat([sh.x1 - 40]).forEach(function (x) { shelf += poly([[x - 7, sh.top], [x + 7, sh.top], [x + 7, L.wj], [x - 7, L.wj]], C.tan, 3); });
          sh.rows.forEach(function (y, ri) {
            var items = "";
            for (var x2 = sh.x0 + 90 + ri * 60; x2 < sh.x1 - 60; x2 += V ? 150 : 170) {
              var kind = (Math.floor(x2 / 10) + ri) % 3, sz = V ? 0.55 : 0.55;
              if (kind === 0) items += at(x2, y, sz, KIT.props.missile({ mood: ["grumpy", "smug", "cross"][ri % 3], arms: "crossed" }));
              else if (kind === 1) items += at(x2, y, sz * 0.95, KIT.props.bomb({ face: "grin", lit: false }));
              else items += at(x2, y, sz * 0.9, KIT.props.bomb({ face: "smug", lit: false }));
            }
            shelf += items + poly([[sh.x0 + 10, y], [sh.x1 - 10, y], [sh.x1 - 10, y + 14], [sh.x0 + 10, y + 14]], C.tan, 3) + line("M" + (sh.x0 + 14) + "," + (y + 11) + " H" + (sh.x1 - 14), C.rust, 2);
            // the shelf-edge price strips
            for (var x3 = sh.x0 + 140 + ri * 97; x3 < sh.x1 - 60; x3 += V ? 330 : 420) shelf += at(x3, y + 7, V ? 1.05 : 1, KIT.props.priceTag({ text: ri === 1 && x3 < sh.x0 + 400 ? "SALE" : "$$$", angle: 8 + (Math.floor(x3) % 3) * 6 }));
          });
          // a sale card on the middle shelf
          var sc = V ? [W - 300, sh.rows[1] - 76] : [1290, sh.rows[1] - 80];
          shelf += at(sc[0], sc[1], 1, poly([[0, 0], [230, 0], [230, 64], [0, 64]], C.yellow, 4) + '<text x="115" y="28" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="22" fill="' + C.war + '">NEW! IMPROVED!</text>' +
            '<text x="115" y="54" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="22" fill="' + ink + '">NOW 20% DEADLIER</text>');
          // the AISLE 1 plate on the shelving's top
          var pl = L.plate;
          var plate = at(pl.x, pl.y, 1, poly([[0, 0], [pl.w, 0], [pl.w, 84], [0, 84]], C.navy, 5) + '<rect x="7" y="7" width="' + (pl.w - 14) + '" height="70" fill="none" stroke="' + C.orange + '" stroke-width="2"/>' +
            '<text x="' + pl.w / 2 + '" y="42" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="34" letter-spacing="3" fill="' + C.cream + '">AISLE 1</text>' +
            '<text x="' + pl.w / 2 + '" y="68" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="19" letter-spacing="2" fill="' + C.yellow + '">MURDER SUPPLIES</text>');
          return out + '<g opacity="0.4">' + shelf + "</g>" + plate;
        }

        // ── The cart (KIT.props.shoppingCart at k), the war papers in it, the baby missile and the cart's tag. ──
        function cartSvg() { return at(CX, CY, k, g("cart", KIT.props.shoppingCart())); }
        function wheels() { return document.querySelectorAll("#" + P("cart") + " .cart-wheel"); }
        // War papers lying in the basket (behind the cart's wires).
        function basketMoney() {
          return [[-14, -70, -12], [10, -73, 8], [34, -70, -4], [-2, -66, 14], [22, -64, -10]].map(function (b) {
            var p = cp(b[0], b[1]);
            return at(p[0], p[1], 0.62, KIT.money("war", 0), b[2]);
          }).join("");
        }
        // The baby missile in the child seat: KIT.props.missile, grinning, arms up, a bonnet on its nose and a
        // rattle in its right hand. Its own parts: .missile-arm-l / .missile-arm-r (shoulders (+-27, -62)).
        var BABY = cp(-29, -56), BABY_S = 0.21 * k;
        function babySvg() {
          var m = KIT.props.missile({ mood: "grin", arms: "up" });
          var rattle = '<g transform="translate(51,-112) rotate(-18)">' + line("M0,0 L0,-26", ink, 7) + line("M0,0 L0,-26", C.tan, 3.5) +
            '<circle cx="0" cy="-36" r="13" fill="' + ink + '"/><circle cx="0" cy="-36" r="10" fill="' + C.yellow + '"/><circle cx="-3" cy="-39" r="3.4" fill="' + WHITE + '"/>' +
            '<circle cx="0" cy="-36" r="4" fill="none" stroke="' + C.war + '" stroke-width="2"/></g>';
          var i = m.indexOf('<g class="missile-arm-r">'), j = m.indexOf("</g>", i);
          m = m.slice(0, j) + rattle + m.slice(j);
          // the bonnet: a cream frilled cap over the nose cone, its ties knotted in a bow under the face
