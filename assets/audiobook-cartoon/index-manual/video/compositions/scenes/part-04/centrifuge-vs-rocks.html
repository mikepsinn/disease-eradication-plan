<template id="centrifuge-vs-rocks-template">
  <!-- centrifuge-vs-rocks · Layer B (storyboards/part-04-institutionalize.md): a blueprint unrolls, "NUCLEAR BOMB (some
       assembly required)", and the Weapons Maker strides in cradling his missile. A spectrometer types out a readout,
       a row of centrifuges spins up under branching pipes, and an engineer with a loupe and trembling tweezers sets a
       tiny dial; everything whines faster and the Weapons Maker kisses his missile. On "Not" it all stops dead; on
       "nothing." the whole cascade vanishes in one pop, then the Weapons Maker does too, and his hard hat rolls to a
       stop. A gray rock rolls in beside a DAYS OF PEACE counter; the sun crosses and the counter ticks; a rust rock
       joins it, a heart floats up, the days streak past by the thousand, moss, flowers and a nesting bird grow on
       them, until a human strolls in, picks up the rust rock and hurls it off the right edge. The counter goes to 0. -->
  <style>

    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #centrifuge-vs-rocks-cam, #centrifuge-vs-rocks-bg, #centrifuge-vs-rocks-art, #centrifuge-vs-rocks-pip, #centrifuge-vs-rocks-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="centrifuge-vs-rocks" data-width="1920" data-height="1080" data-start="0" data-duration="20.1">
    <div id="centrifuge-vs-rocks-cam">
      <div id="centrifuge-vs-rocks-bg"></div>
      <div id="centrifuge-vs-rocks-art"></div>
      <div id="centrifuge-vs-rocks-pip"></div>

  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "centrifuge-vs-rocks";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, INK = C.line, WHITE = "#FBF6E6";
      var P = function (s) { return ID + "-" + s; };
      var g = function (s) { return "#" + P(s); };
      var f = function (n) { return (+n).toFixed(1); };

      // ── Layout, per canvas shape ──
      // fy: the floor. bp: the blueprint [x, y, w, h], its title size and where its bomb drawing sits [fx, fy, scale].
      // spec: the spectrometer's base [x, y, scale]. cents: the centrifuges' centers, width, top and bottom (their
      // plinths stand on cby). pipe: the main pipe's path, the side branch, and the valve wheels.
      // eng / wm / human: [x, scale] standing on fy (wmFrom: where the Weapons Maker strides in from; human: from, to, scale).
      // gray / rust: where the rocks stop; rk: their scale. counter: [x, scale]. hat: where the hard hat stops rolling.
      // sun: the arc's radius and the sun's radius; sunX: the arc's center, on the floor.
      var L = V
        ? { fy: 1420, cby: 1110, bp: [70, 100, 640, 330], bpT: 50, bpBomb: [0.62, 0.68, 0.62],
            spec: [175, 1110, 0.9], cents: [330, 450, 570, 690, 810, 930], cw: 64, ct: 760, cb: 1085,
            pipe: "M175,842 V710 H990 V470 H1036", branch: "M330,710 V560 H44", valves: [[330, 610], [990, 560]],
            eng: [190, 2.0], wm: [860, 2.2], wmFrom: 1260, human: [-200, 232, 2.25],
            gray: 614, rust: 372, rk: 1.75, counter: [848, 1.05], cH: 450, hat: 984, arc: 330, sun: [660, 52], sunX: 540 }
        : { fy: 820, cby: 820, bp: [330, 70, 960, 300], bpT: 64, bpBomb: [0.75, 0.6, 0.95],
            spec: [560, 820, 1], cents: [730, 830, 930, 1030, 1130, 1230], cw: 70, ct: 480, cb: 790,
            pipe: "M560,490 V440 H1300 V170 H1876", branch: "M680,440 V405 H44", valves: [[1300, 300], [470, 405]],
            eng: [250, 2.15], wm: [1440, 2.4], wmFrom: 2120, human: [-200, 458, 2.5],
            gray: 880, rust: 615, rk: 1.85, counter: [1235, 1.35], cH: 330, hat: 1378, arc: 120, sun: [700, 56], sunX: 800 };
      var FY = L.fy, SUNX = L.sunX;

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // ── Drawing helpers (the kit's: a navy pass under each fill, so touching shapes share one outline) ──
      function pd(pts) { return "M" + pts.map(function (p) { return f(p[0]) + "," + f(p[1]); }).join(" L") + " Z"; }
      function solid(d, col, w) {
        return '<path d="' + d + '" fill="' + INK + '" stroke="' + INK + '" stroke-width="' + (w || 4.4) + '" stroke-linejoin="miter" stroke-miterlimit="8"/><path d="' + d + '" fill="' + col + '"/>';
      }
      function line(d, col, w, extra) { return '<path d="' + d + '" fill="none" stroke="' + (col || INK) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (extra || "") + "/>"; }
      function at(x, y, k, inner, id) { return '<g transform="translate(' + f(x) + "," + f(y) + ") scale(" + k + ')">' + (id ? '<g id="' + P(id) + '">' + inner + "</g>" : inner) + "</g>"; }
      function txt(x, y, s, size, col, extra) { return '<text x="' + f(x) + '" y="' + f(y) + '" font-family="Oswald" font-weight="600" font-size="' + size + '" fill="' + col + '"' + (extra || "") + ">" + s + "</text>"; }
      // Two-link arm angles (the kit's convention: angle a points along (sin a, cos a)) that put the wrist at T.
      function ik(S, T, len, bend) {
        var dx = T[0] - S[0], dy = T[1] - S[1], d = Math.min(Math.sqrt(dx * dx + dy * dy), 2 * len * 0.995);
        var th = Math.atan2(dx, dy), ph = Math.acos(d / (2 * len));
        return [((th + bend * ph) * 180) / Math.PI, ((th - bend * ph) * 180) / Math.PI];
      }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function wave(t, a, b) { return Math.sin(t * a + b); }

      // ── THE RUST ROCK (and the gray one): a faceted boulder 124 wide and 78 tall standing on y 0, its center at
      // (0, -39). The same code draws the rust rock in billionaire-pdf, where this throw lands. ──
      var ROCK = { body: [[-62, 0], [-64, -24], [-50, -56], [-20, -76], [20, -78], [50, -62], [63, -32], [58, 0]],
        top: [[-50, -56], [-20, -76], [20, -78], [50, -62], [18, -52], [-22, -50]],
        side: [[50, -62], [63, -32], [58, 0], [30, 0], [34, -32], [18, -52]] };
      function rock(col, lit, shade, cid) {
        return '<defs><clipPath id="' + cid + '"><path d="' + pd(ROCK.body) + '"/></clipPath></defs>' + solid(pd(ROCK.body), col) +
          '<path d="' + pd(ROCK.top) + '" fill="' + lit + '"/><path d="' + pd(ROCK.side) + '" fill="' + shade + '"/>' +
          '<rect x="-10" y="-80" width="80" height="82" fill="url(#' + P("cross") + ')" opacity="0.2" clip-path="url(#' + cid + ')"/>' +
          line("M-22,-50 L-30,-28 L-18,-12 M18,-52 L34,-32", INK, 2.2) + line("M-42,-38 L-36,-30", INK, 1.8) +
          '<path d="' + pd(ROCK.body) + '" fill="none" stroke="' + INK + '" stroke-width="4.4" stroke-linejoin="miter"/>';
      }
      var GRAY = ["#8E8A84", "#B9B4AB", "#6C6863"], RUST = [C.rust, C.tan, "#6A3420"];

      // ── The blueprint: slate with cream lines, unrolling from the left ──
      function blueprint() {
        var b = L.bp, x = b[0], y = b[1], w = b[2], h = b[3], ts = L.bpT, grid = "";
        for (var gx = x + 32; gx < x + w - 10; gx += 32) grid += "M" + gx + "," + (y + 10) + " V" + (y + h - 10) + " ";
        for (var gy = y + 32; gy < y + h - 10; gy += 32) grid += "M" + (x + 10) + "," + gy + " H" + (x + w - 10) + " ";
        var bx = x + w * L.bpBomb[0], by = y + h * L.bpBomb[1], k = L.bpBomb[2], cr = C.cream;
        var bomb = '<g transform="translate(' + f(bx) + "," + f(by) + ") scale(" + k + ')" fill="none" stroke="' + cr + '" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">' +
          '<ellipse cx="-30" cy="0" rx="112" ry="64"/><path d="M78,-28 L150,-62 L150,62 L78,28"/><path d="M150,-62 H176 V62 H150"/>' +
          '<path d="M-130,0 H66" stroke-dasharray="10 8" opacity="0.6"/><path d="M-142,92 H176 M-142,82 V102 M176,82 V102"/>' +
          '<path d="M-96,-50 L-112,-84"/><path d="M126,-48 L140,-86"/>' +
          '<path d="M-96,-100 C-36,-150 56,-150 118,-104" stroke-dasharray="9 7"/><path d="M104,-114 L120,-102 L102,-94"/>' +
          '<circle cx="-30" cy="0" r="22" stroke-dasharray="4 5"/></g>' +
          txt(bx + k * -150, by + k * -94, "TAB A", Math.round(22 * k + 4), cr, ' text-anchor="middle"') +
          txt(bx + k * 146, by + k * -96, "SLOT B", Math.round(22 * k + 4), cr, ' text-anchor="middle"');
        var notes = [0.42, 0.36, 0.28].map(function (fr, i) {
          return '<rect x="' + (x + 36) + '" y="' + f(y + ts * 2.25 + 18 + i * 22) + '" width="' + f(w * fr * (V ? 0.9 : 0.62)) + '" height="7" fill="' + cr + '" opacity="0.4"/>';
        }).join("");
        var sheet = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + C.slate + '" stroke="' + INK + '" stroke-width="5"/>' +
          '<path d="' + grid + '" stroke="' + cr + '" stroke-width="1.2" opacity="0.16"/>' +
          '<rect x="' + (x + 12) + '" y="' + (y + 12) + '" width="' + (w - 24) + '" height="' + (h - 24) + '" fill="none" stroke="' + cr + '" stroke-width="2.4" opacity="0.8"/>' +
          txt(x + 36, y + 22 + ts, "NUCLEAR BOMB", ts, cr, ' letter-spacing="3"') +
          '<text x="' + (x + 38) + '" y="' + f(y + 34 + ts * 1.62) + '" font-family="Inter" font-style="italic" font-weight="600" font-size="' + Math.round(ts * 0.47) + '" fill="' + C.yellow + '">(some assembly required)</text>' +
          notes + bomb;
        var roll = '<g id="' + P("bp-roll") + '"><rect x="' + (x - 13) + '" y="' + (y - 8) + '" width="26" height="' + (h + 16) + '" fill="' + C.peri + '" stroke="' + INK + '" stroke-width="4"/>' +
          '<rect x="' + (x - 4) + '" y="' + (y - 8) + '" width="6" height="' + (h + 16) + '" fill="' + C.cream + '" opacity="0.5"/>' +
          '<ellipse cx="' + x + '" cy="' + (y - 8) + '" rx="13" ry="5" fill="' + C.cream + '" stroke="' + INK + '" stroke-width="3"/></g>';
        var tacks = [x + 14, x + w - 14].map(function (tx) { return '<circle cx="' + tx + '" cy="' + (y + 14) + '" r="9" fill="' + C.war + '" stroke="' + INK + '" stroke-width="3"/>'; }).join("");
        return '<g id="' + P("bp") + '"><defs><clipPath id="' + P("bp-clip") + '"><rect id="' + P("bp-reveal") + '" x="' + (x - 6) + '" y="' + (y - 10) + '" width="0" height="' + (h + 20) + '"/></clipPath></defs>' +
          '<g clip-path="url(#' + P("bp-clip") + ')">' + sheet + "</g>" + roll + '<g id="' + P("bp-tacks") + '" opacity="0">' + tacks + "</g></g>";
      }

      // ── The spectrometer: a slate cabinet of dials (KIT.props.gauge) and lamps that types out a paper readout ──
      var DIALS = [[-54, 0.25], [0, 0.6], [54, 0.82]];
      function spectrometer() {
        var cab = [[-100, 0], [100, 0], [100, -300], [84, -330], [-84, -330], [-100, -300]];
        var dials = DIALS.map(function (d, i) {
          return '<g transform="translate(' + d[0] + ',-236) scale(0.46)"><g class="spec-dial" data-i="' + i + '">' + KIT.props.gauge({ mount: "dial", value: d[1], zones: [[0.78, 1, C.war]] }) + "</g></g>";
        }).join("");
        var lamps = [[-60, C.war], [-20, C.yellow], [20, C.med], [60, C.orange]].map(function (l, i) {
          return '<circle cx="' + l[0] + '" cy="-196" r="10" fill="#5A5248" stroke="' + INK + '" stroke-width="3"/>' +
            '<g class="spec-lamp" data-i="' + i + '" opacity="0"><circle cx="' + l[0] + '" cy="-196" r="17" fill="' + l[1] + '" opacity="0.3"/><circle cx="' + l[0] + '" cy="-196" r="10" fill="' + l[1] + '" stroke="' + INK + '" stroke-width="3"/></g>';
        }).join("");
        var plot = "M-40,-128";
        for (var i = 1; i <= 26; i++) plot += " L" + f(-40 + ((i % 2) ? 26 : 54) * 0.5 + (i % 3) * 14 - 8) + "," + f(-128 + i * 4.6);
        var strip = '<g clip-path="url(#' + P("strip-clip") + ')"><rect x="-50" y="-150" width="100" height="148" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3"/>' +
          '<path d="' + plot + '" fill="none" stroke="' + C.war + '" stroke-width="2.4" stroke-linejoin="round"/>' +
          [-134, -104, -74, -44, -14].map(function (yy) { return line("M-44," + yy + " H44", INK, 1, ' opacity="0.25"'); }).join("") + "</g>";
        return '<defs><clipPath id="' + P("strip-clip") + '"><rect id="' + P("strip-reveal") + '" x="-60" y="-152" width="120" height="0"/></clipPath></defs>' +
          solid(pd(cab), C.slate) + line("M97,-4 V-298 L82,-326", C.orange, 2.4) +
          solid(pd([[-86, -318], [86, -318], [86, -206 - 12], [-86, -218]]), C.cream, 3) + '<rect x="-86" y="-318" width="172" height="100" fill="url(#' + P("fine") + ')" opacity="0.12"/>' +
          dials + lamps +
          '<rect x="-62" y="-158" width="124" height="10" rx="2" fill="' + INK + '"/>' + strip +
          [[-70, -60], [70, -60]].map(function (k) { return '<circle cx="' + k[0] + '" cy="' + k[1] + '" r="11" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="3"/>' + line("M" + k[0] + "," + k[1] + " l6,-7", INK, 2.4); }).join("") +
          solid(pd([[-108, 0], [108, 0], [104, -10], [-104, -10]]), C.rust, 3);
      }

      // ── A centrifuge: a tall navy drum with orange edge shading and cream stripes that turn when it spins ──
      function centrifuge(i, cx) {
        var hw = L.cw / 2, t = L.ct, b = L.cb, stripes = "";
        for (var y = t - 80; y < b + 40; y += 30) stripes += "M" + (cx - hw - 6) + "," + y + " L" + (cx + hw + 6) + "," + (y + 26) + " ";
        var cap = [[cx - hw, t], [cx - hw + 9, t - 16], [cx + hw - 9, t - 16], [cx + hw, t]];
        return '<g id="' + P("cent-" + i) + '"><g class="drum-v"><defs><clipPath id="' + P("cclip-" + i) + '"><rect x="' + (cx - hw) + '" y="' + t + '" width="' + L.cw + '" height="' + (b - t) + '"/></clipPath></defs>' +
          solid(pd([[cx - hw - 10, b], [cx + hw + 10, b], [cx + hw + 10, L.cby], [cx - hw - 10, L.cby]]), C.slate, 3.6) +
          solid(pd([[cx - hw, t], [cx + hw, t], [cx + hw, b], [cx - hw, b]]), C.navy) +
          '<g clip-path="url(#' + P("cclip-" + i) + ')"><g class="stripes" data-i="' + i + '"><path d="' + stripes + '" stroke="' + C.cream + '" stroke-width="6" opacity="0.32"/></g></g>' +
          line("M" + (cx + hw - 6) + "," + (t + 6) + " V" + (b - 6), C.orange, 3) +
          '<rect x="' + (cx - hw) + '" y="' + f(t + (b - t) * 0.3) + '" width="' + L.cw + '" height="9" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="2.4"/>' +
          '<rect x="' + (cx - hw) + '" y="' + f(t + (b - t) * 0.72) + '" width="' + L.cw + '" height="9" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="2.4"/>' +
          solid(pd(cap), C.peri, 3.6) + line("M" + (cx - hw + 12) + "," + (t - 10) + " H" + (cx + hw - 14), C.cream, 2.4, ' opacity="0.7"') +
          '<path d="' + pd([[cx - hw, t], [cx + hw, t], [cx + hw, b], [cx - hw, b]]) + '" fill="none" stroke="' + INK + '" stroke-width="4.4"/></g></g>';
      }

      // ── The pipes, drawn on: a navy outline, a slate-blue body and a sheen; valve wheels turn with the drums ──
      function pipe(d) {
        var p = function (col, w, op) { return '<path class="pipe" d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linejoin="miter" opacity="' + (op || 1) + '" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>'; };
        return p(INK, 25) + p(C.peri, 15) + p(C.cream, 3, 0.55);
      }
      function drops() {
        var hy = +L.pipe.split("V")[1].split(" ")[0];
        return L.cents.map(function (cx) { return "M" + cx + "," + hy + " V" + (L.ct - 14); }).join(" ");
      }
      function valve(x, y, i) {
        var spokes = "";
        for (var k = 0; k < 4; k++) { var a = (k * Math.PI) / 4; spokes += "M" + f(x - 19 * Math.cos(a)) + "," + f(y - 19 * Math.sin(a)) + " L" + f(x + 19 * Math.cos(a)) + "," + f(y + 19 * Math.sin(a)) + " "; }
        return '<g class="valve-wrap" opacity="0"><circle cx="' + x + '" cy="' + y + '" r="9" fill="' + INK + '"/><g class="valve" data-x="' + x + '" data-y="' + y + '">' +
          '<circle cx="' + x + '" cy="' + y + '" r="22" fill="none" stroke="' + INK + '" stroke-width="10"/><circle cx="' + x + '" cy="' + y + '" r="22" fill="none" stroke="' + C.war + '" stroke-width="5"/>' +
          '<path d="' + spokes + '" stroke="' + INK + '" stroke-width="4"/><circle cx="' + x + '" cy="' + y + '" r="6" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="2.4"/></g></g>';
      }

      // ── The engineer: lab coat, glasses with a flip-down loupe over the far eye (the near eye squeezed shut),
      // hunched over a tiny dial on a console, his tweezers trembling; sweat flies off his head. ──
      var ENG = { tone: 0, outfit: "labcoat", color: 3, glasses: true, look: "right", mood: "flat", build: { hunch: 16 } };
      var er = KIT.rig(ENG), es = L.eng[1], lean = (er.lean * Math.PI) / 180;
      var leanPt = function (p, k) { var x = p[0], y = p[1] - er.hipY, c = Math.cos(k * lean), s = Math.sin(k * lean); return [x * c - y * s, er.hipY + x * s + y * c]; };
      var EH = [50, 6]; // the tweezers hand, in the (leaned) person units
      ENG.arms = [[-25, 25], ik(er.shoulder[1], leanPt(EH, -1), er.armLength, 1)];
      er = KIT.rig(ENG);
      var TIP = [er.hand[1][0] + 30, er.hand[1][1] + 4]; // the tweezers' tip: on the tiny dial
      var dialW = [L.eng[0] + es * TIP[0], FY - 100 * es + es * TIP[1]];
      function engineer() {
        var body = KIT.person(ENG), n = 0;
        body = body.replace(/<g class="eye">[\s\S]*?<\/g>/g, function () { n++; return ""; });
        if (n !== 2) throw new Error("engineer: expected 2 eyes, found " + n);
        var loupe = '<circle cx="10.8" cy="-4" r="8.2" fill="#FFFFFF" stroke="' + INK + '" stroke-width="3.4"/>' +
          '<g class="eng-eye"><circle cx="11.4" cy="-4" r="4.6" fill="' + INK + '"/><circle cx="12.8" cy="-5.6" r="1.4" fill="#FFFFFF"/></g>' +
          '<path d="M3,-8 L1,-12 M18,-9 L21,-12" stroke="' + INK + '" stroke-width="2"/>';
        var squint = '<path d="M-7,-4 Q-2.5,-6.5 2,-3.6 M-7.5,-1.5 L-6,-3.5 M1.5,-0.8 L0.5,-3" fill="none" stroke="' + INK + '" stroke-width="2.2" stroke-linecap="round"/>';
        body = body.replace("<!--face-end-->", squint + loupe + "<!--face-end-->");
        // the tweezers, from the hand to the tip (in leaned person units)
        var hx = er.hand[1][0] + 4, hy = er.hand[1][1] + 6;
        var tweezers = '<g id="' + P("tweez") + '">' + line("M" + f(hx) + "," + f(hy - 2) + " L" + f(TIP[0]) + "," + f(TIP[1]), INK, 4.2) + line("M" + f(hx) + "," + f(hy - 2) + " L" + f(TIP[0]) + "," + f(TIP[1]), "#C9CBD0", 2) +
          line("M" + f(hx) + "," + f(hy + 3) + " L" + f(TIP[0]) + "," + f(TIP[1] + 1.5), INK, 4.2) + line("M" + f(hx) + "," + f(hy + 3) + " L" + f(TIP[0]) + "," + f(TIP[1] + 1.5), "#C9CBD0", 2) + "</g>";
        var sweat = [0, 1, 2, 3].map(function (i) {
          return '<g class="sweat" data-i="' + i + '" opacity="0"><path d="M0,-6 Q5,1 0,5 Q-5,1 0,-6 Z" fill="#DDEEF5" stroke="' + INK + '" stroke-width="1.6"/></g>';
        }).join("");
        return body.replace('<g class="arm-r">', '<g class="arm-r" id="' + P("eng-arm") + '">') + tweezers + '<g transform="translate(' + f(er.top[0] - 6) + "," + f(er.top[1] + 6) + ')">' + sweat + "</g>";
      }
      // The console: a slate pedestal with a sloped panel, the tiny dial on it (under the tweezers' tip).
      function consoleArt() {
        var x = dialW[0], y = dialW[1] + 18, k = V ? 0.3 : 0.32;

      var stripes = all("#" + P("art") + " .stripes"), valves = all("#" + P("art") + " .valve"), lamps = all(g("spec") + " .spec-lamp");
