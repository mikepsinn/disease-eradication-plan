<template id="centrifuge-vs-rocks-template">
  <!-- centrifuge-vs-rocks · style "atomic" (cartoon-style-bible.md), plate rock-field: one open field under a big cream
       sky, drawn once, and the camera travels over it. "Building": a wide look at a whole centrifuge cascade standing
       on the field while the Weapons Maker strides in with his baby missile. "spectrometers,": close on the cabinet of
       dials as it prints its paper readout. "cascades,": the two rows of slate drums spin up under their pipes.
       "precise": close on the engineer, loupe in, tweezers trembling, sweat flying. "attempted.": the dial clicks, the
       camera pulls back, every drum whines up and the Weapons Maker kisses his missile. "Not": everything stops dead,
       a drop of sweat hanging in the air. "nothing.": the whole cascade vanishes in one pop, engineer and all; the
       Weapons Maker looks left, looks right and pops too; his hard hat drops and rolls to a stop. "Rocks": a gray rock
       rolls in beside a DAYS OF PEACE counter at 0; "day.": the sun arcs over once and it reads 1; the days pass;
       "colored": a rust rock rolls up and a heart floats between them; "thousands": the sun streaks over and over, the
       counter spins into the hundreds of thousands, moss and flowers grow, a bird nests on the gray rock; "years.": a
       human strolls in, picks up the rust rock and hurls it off the right edge (it lands in billionaire-pdf), the heart
       pops, and the counter clicks back to 0. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #C8B07B; }
    #centrifuge-vs-rocks-weave, #centrifuge-vs-rocks-plate, #centrifuge-vs-rocks-film { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="centrifuge-vs-rocks" data-width="1920" data-height="1080" data-start="0" data-duration="20.1">
    <div id="centrifuge-vs-rocks-weave">
      <div id="centrifuge-vs-rocks-plate"></div>
    </div>
    <div id="centrifuge-vs-rocks-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "centrifuge-vs-rocks";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var cueEnd = function (w, n) { return KIT.cueEnd(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, WHITE = "#FBF6E6";
      var f = function (n) { return (+n).toFixed(1); };
      var smooth = KIT.smooth, clamp = function (u) { return Math.min(1, Math.max(0, u)); };
      var tl = gsap.timeline({ paused: true });

      // ── Period film (KIT.film): outside the camera, so it stays put.
      KIT.film(tl, ID, q("weave"), q("film"), 404);

      // ── The plate, in plate units: the feet of everything stand on y 0, the horizon is at y -220, and the key view
      // (the rocks, as the sketch draws them) puts plate (0, -280) mid-screen at scale 1. The cascade stands where
      // the rocks will be: the engineer at the far left, then the spectrometer, two rows of drums, and the Weapons
      // Maker at the right; the DAYS OF PEACE counter springs up where he stood.
      var HZ = -220, SKY = "#EFE3C4", FIELD = "#C8B07B", S = 1.5;
      var ENGX = -930, SPEC = [-620, 1.25], CW = 76, CT = -430, CB = -34;
      var CENTS = [-420, -300, -180, -60, 60, 180], BACK = [-360, -240, -120, 0, 120, 240];
      var WMX = 470, WMFROM = 1250, WS = 1.6, HATX = V ? -310 : -500;
      var GRAYX = -120, RUSTX = 220, GK = 2.4, RK = 2.1, COUNTX = 632, MANX = 410;
      // (in 9:16 the counter stands nearer the rocks and higher, so the tall frame holds the rocks and the count)
      var CDX = V ? -132 : 0, CDY = V ? -360 : 0;
      var SUN = { rx: 780, ry: 470, r: 44 };

      // ── Drawing helpers (the kit's way: a navy pass under each fill, so touching shapes share one outline) ──
      function pd(pts) { return "M" + pts.map(function (p) { return f(p[0]) + "," + f(p[1]); }).join(" L") + " Z"; }
      function solid(d, col, w) {
        return '<path d="' + d + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="' + (w || 4.4) + '" stroke-linejoin="miter" stroke-miterlimit="8"/><path d="' + d + '" fill="' + col + '"/>';
      }
      function line(d, col, w, extra) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (extra || "") + "/>"; }
      function at(x, y, k, inner, attrs) { return '<g transform="translate(' + f(x) + "," + f(y) + ") scale(" + k + ')"' + (attrs || "") + ">" + inner + "</g>"; }
      function copy(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function wave(t, a, b) { return Math.sin(t * a + b); }
      // Two-link arm angles (the kit's convention: angle a points along (sin a, cos a)) that put the wrist at T.
      function ik(Sh, T, len, bend) {
        var dx = T[0] - Sh[0], dy = T[1] - Sh[1], d = Math.min(Math.sqrt(dx * dx + dy * dy), 2 * len * 0.995);
        var th = Math.atan2(dx, dy), ph = Math.acos(d / (2 * len));
        return [((th + bend * ph) * 180) / Math.PI, ((th - bend * ph) * 180) / Math.PI];
      }

      // ── The rocks: a faceted boulder 124 wide and 78 tall standing on y 0 (center (0, -39)). The same drawing flies
      // into billionaire-pdf, where this throw lands.
      var ROCK = { body: [[-62, 0], [-64, -24], [-50, -56], [-20, -76], [20, -78], [50, -62], [63, -32], [58, 0]],
        top: [[-50, -56], [-20, -76], [20, -78], [50, -62], [18, -52], [-22, -50]],
        side: [[50, -62], [63, -32], [58, 0], [30, 0], [34, -32], [18, -52]] };
      function rock(col, lit, shade) {
        return solid(pd(ROCK.body), col) + '<path d="' + pd(ROCK.top) + '" fill="' + lit + '"/><path d="' + pd(ROCK.side) + '" fill="' + shade + '"/>' +
          line("M-22,-50 L-30,-28 L-18,-12 M18,-52 L34,-32", ink, 2.2) + line("M-42,-38 L-36,-30", ink, 1.8) +
          '<path d="' + pd(ROCK.body) + '" fill="none" stroke="' + ink + '" stroke-width="4.4" stroke-linejoin="miter"/>';
      }
      var GRAY = ["#8E8A84", "#B9B4AB", "#6C6863"], RUST = [C.rust, C.tan, "#6A3420"];
      // moss on a rock's top (rock units), a flower on a stem (feet at 0), the bird, its nest and the heart
      function moss() {
        var cap = [[-48, -58], [-22, -78], [20, -80], [52, -64], [40, -54], [24, -60], [6, -54], [-14, -60], [-30, -52]];
        return solid(pd(cap), "#7E9A48", 3) + [[-34, -52], [-6, -50], [30, -54]].map(function (p) { return '<path d="M' + p[0] + "," + p[1] + ' l3,9 l3,-8" fill="#7E9A48" stroke="' + ink + '" stroke-width="2"/>'; }).join("");
      }
      function flower(col) {
        var petals = "";
        for (var i = 0; i < 5; i++) { var a = (i * 2 * Math.PI) / 5 - Math.PI / 2; petals += '<circle cx="' + f(7 * Math.cos(a)) + '" cy="' + f(-34 + 7 * Math.sin(a)) + '" r="6" fill="' + col + '" stroke="' + ink + '" stroke-width="2"/>'; }
        return line("M0,0 Q-3,-16 0,-30", ink, 3.4) + '<path d="M-1,-14 Q-12,-20 -14,-12 Q-6,-8 -1,-14 Z" fill="#7E9A48" stroke="' + ink + '" stroke-width="1.8"/>' + petals +
          '<circle cx="0" cy="-34" r="4.6" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2"/>';
      }
      function bird() {
        var body = [[-20, 4], [-30, -4], [-16, -12], [4, -14], [14, -24], [26, -22], [32, -16], [22, -12], [20, 2], [6, 10], [-10, 10]];
        return '<g class="bird-bob">' + solid(pd(body), C.cyan, 3) + '<path d="M-4,8 Q8,10 18,0 L6,-2 Z" fill="' + C.cream + '"/>' +
          solid(pd([[31, -19], [42, -16], [31, -13]]), C.orange, 2) + '<circle cx="24" cy="-18" r="2.4" fill="' + ink + '"/>' +
          '<g class="bird-wing">' + solid(pd([[-12, -8], [10, -10], [-2, -34], [-22, -26]]), C.peri, 2.6) + "</g>" + line("M-2,10 l-3,8 M6,10 l2,8", ink, 2.4) + "</g>";
      }
      function nest() {
        var tw = "";
        for (var i = 0; i < 7; i++) tw += "M" + (-34 + i * 4) + "," + (-2 - (i % 3) * 3) + " Q0," + (10 + (i % 2) * 4) + " " + (34 - i * 3) + "," + (-3 - (i % 2) * 4) + " ";
        return '<ellipse cx="0" cy="0" rx="36" ry="12" fill="#8C6440" stroke="' + ink + '" stroke-width="3"/><path d="' + tw + '" fill="none" stroke="' + C.rust + '" stroke-width="2.2"/>';
      }
      var HEART = '<path d="M0,10 C-22,-6 -14,-24 0,-12 C14,-24 22,-6 0,10 Z" fill="' + C.war + '" stroke="' + ink + '" stroke-width="3"/><path d="M-9,-10 Q-12,-4 -8,0" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>';

      // ── The spectrometer: a slate cabinet of dials (KIT.props.gauge) and lamps that prints a paper readout from a
      // slot, standing on y 0, 200 wide and 330 tall in its own units.
      var DIALS = [[-54, 0.25], [0, 0.6], [54, 0.82]];
      function spectrometer() {
        var cab = [[-100, 0], [100, 0], [100, -300], [84, -330], [-84, -330], [-100, -300]];
        var dials = DIALS.map(function (d, i) { return '<g transform="translate(' + d[0] + ',-262) scale(0.46)"><g class="spec-dial">' + KIT.props.gauge({ mount: "dial", value: d[1], zones: [[0.78, 1, C.war]] }) + "</g></g>"; }).join("");
        var lamps = [[-60, C.war], [-20, C.yellow], [20, C.cyan], [60, C.orange]].map(function (l) {
          return '<circle cx="' + l[0] + '" cy="-196" r="10" fill="#5A5248" stroke="' + ink + '" stroke-width="3"/>' +
            '<g class="spec-lamp" opacity="0"><circle cx="' + l[0] + '" cy="-196" r="17" fill="' + l[1] + '" opacity="0.3"/><circle cx="' + l[0] + '" cy="-196" r="10" fill="' + l[1] + '" stroke="' + ink + '" stroke-width="3"/></g>';
        }).join("");
        // the readout: a paper strip that feeds down out of the slot (its clip grows), a jagged trace on it
        var plot = "M-34,-150";
        for (var i = 1; i <= 30; i++) plot += " L" + f(((i * 37) % 60) - 30) + "," + f(-150 + i * 7);
        var strip = '<g clip-path="url(#' + ID + '-strip-clip)"><g class="spec-paper"><path d="M-48,-152 H48 V62 L38,70 L28,62 L18,70 L8,62 L-2,70 L-12,62 L-22,70 L-32,62 L-42,70 L-48,62 Z" fill="' + WHITE + '" stroke="' + ink + '" stroke-width="3"/>' +
          '<path d="' + plot + '" fill="none" stroke="' + C.war + '" stroke-width="2.6" stroke-linejoin="round"/>' +
          [-130, -100, -70, -40, -10, 20, 50].map(function (yy) { return line("M-42," + yy + " H42", ink, 1, ' opacity="0.25"'); }).join("") + "</g></g>";
        return '<defs><clipPath id="' + ID + '-strip-clip" clipPathUnits="userSpaceOnUse"><rect id="' + ID + '-strip-reveal" x="-60" y="-152" width="120" height="0"/></clipPath></defs>' +
          solid(pd(cab), C.slate) + line("M97,-4 V-298 L82,-326", C.orange, 2.4) +
          solid(pd([[-86, -318], [86, -318], [86, -218], [-86, -218]]), C.cream, 3) + dials + lamps +
          [[-70, -60], [70, -60]].map(function (k) { return '<circle cx="' + k[0] + '" cy="' + k[1] + '" r="11" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="3"/>' + line("M" + k[0] + "," + k[1] + " l6,-7", ink, 2.4); }).join("") +
          solid(pd([[-108, 0], [108, 0], [104, -10], [-104, -10]]), C.rust, 3) + strip + '<rect x="-62" y="-160" width="124" height="10" rx="2" fill="' + ink + '"/>';
      }

      // ── A centrifuge: a tall slate drum with an orange edge and two mustard bands; its cream stripes slide when it
      // spins. x: its middle; k: 1 front row, smaller and higher for the back row.
      function centrifuge(i, cx, k, back) {
        var hw = (CW * k) / 2, t = back ? CT * k - 50 : CT, b = back ? -70 : CB, base = back ? -60 : 0, stripes = "";
        for (var y = t - 80; y < b + 40; y += 30) stripes += "M" + f(cx - hw - 6) + "," + y + " L" + f(cx + hw + 6) + "," + (y + 26) + " ";
        var body = [[cx - hw, t], [cx + hw, t], [cx + hw, b], [cx - hw, b]];
        var cap = [[cx - hw, t], [cx - hw + 9, t - 16], [cx + hw - 9, t - 16], [cx + hw, t]];
        var cid = ID + "-cclip-" + i;
        return '<g class="drum" data-x="' + cx + '"><defs><clipPath id="' + cid + '" clipPathUnits="userSpaceOnUse"><path d="' + pd(body) + '"/></clipPath></defs>' +
          solid(pd([[cx - hw - 10, b], [cx + hw + 10, b], [cx + hw + 10, base], [cx - hw - 10, base]]), back ? "#3A4766" : C.slate, 3.6) +
          solid(pd(body), back ? "#3A4766" : C.slate) +
          '<g clip-path="url(#' + cid + ')"><g class="stripes"><path d="' + stripes + '" stroke="' + C.cream + '" stroke-width="6" opacity="0.28"/></g></g>' +
          line("M" + f(cx + hw - 6) + "," + (t + 6) + " V" + (b - 6), C.orange, 4) +
          '<rect x="' + f(cx - hw) + '" y="' + f(t + (b - t) * 0.3) + '" width="' + f(2 * hw) + '" height="10" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2.4"/>' +
          '<rect x="' + f(cx - hw) + '" y="' + f(t + (b - t) * 0.72) + '" width="' + f(2 * hw) + '" height="10" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2.4"/>' +
          solid(pd(cap), C.peri, 3.6) + '<path d="' + pd(body) + '" fill="none" stroke="' + ink + '" stroke-width="4.4"/></g>';
      }
      function pipe(d, w) { return line(d, ink, w + 10) + line(d, C.peri, w) + line(d, C.cream, 3, ' opacity="0.55"'); }
      function valve(x, y) {
        var spokes = "";
        for (var k = 0; k < 4; k++) { var a = (k * Math.PI) / 4; spokes += "M" + f(-19 * Math.cos(a)) + "," + f(-19 * Math.sin(a)) + " L" + f(19 * Math.cos(a)) + "," + f(19 * Math.sin(a)) + " "; }
        return '<g transform="translate(' + x + "," + y + ')"><circle r="9" fill="' + ink + '"/><g class="valve"><circle r="22" fill="none" stroke="' + ink + '" stroke-width="10"/><circle r="22" fill="none" stroke="' + C.war + '" stroke-width="5"/>' +
          '<path d="' + spokes + '" stroke="' + ink + '" stroke-width="4"/><circle r="6" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2.4"/></g></g>';
      }

      // ── The engineer: an everyday human in a lab coat, a loupe over his near eye (the other squeezed shut), hunched
      // over a tiny dial on a console, tweezers in his hand; sweat flies off his head.
      var ENG = { tone: 0, outfit: "labcoat", color: 3, glasses: true, look: "right", mood: "flat", build: { hunch: 16 } };
      var er = KIT.rig(ENG), lean = (er.lean * Math.PI) / 180;
      var leanPt = function (p, k) { var x = p[0], y = p[1] - er.hipY, c = Math.cos(k * lean), s = Math.sin(k * lean); return [x * c - y * s, er.hipY + x * s + y * c]; };
      ENG.arms = [[-25, 25], ik(er.shoulder[1], leanPt([50, 6], -1), er.armLength, 1)];
      er = KIT.rig(ENG);
      var TIP = [er.hand[1][0] + 30, er.hand[1][1] + 4];
      var DIAL = [ENGX + S * TIP[0], -100 * S + S * TIP[1]];
      function engineer() {
        var body = KIT.person(ENG), n = 0;
        body = body.replace(/<g class="eye">[\s\S]*?<\/g>/g, function () { n++; return ""; });
        if (n !== 2) throw new Error("engineer: expected 2 eyes, found " + n);
        var loupe = '<circle cx="10.8" cy="-4" r="8.2" fill="#FFFFFF" stroke="' + ink + '" stroke-width="3.4"/><circle cx="11.4" cy="-4" r="4.6" fill="' + ink + '"/><circle cx="12.8" cy="-5.6" r="1.4" fill="#FFFFFF"/>' +
          '<path d="M3,-8 L1,-12 M18,-9 L21,-12" stroke="' + ink + '" stroke-width="2"/>';
        var squint = '<path d="M-7,-4 Q-2.5,-6.5 2,-3.6 M-7.5,-1.5 L-6,-3.5 M1.5,-0.8 L0.5,-3" fill="none" stroke="' + ink + '" stroke-width="2.2" stroke-linecap="round"/>';
        body = body.replace("<!--face-end-->", squint + loupe + "<!--face-end-->");
        var hx = er.hand[1][0] + 4, hy = er.hand[1][1] + 6;
        var tw = function (dy, dt) { return line("M" + f(hx) + "," + f(hy + dy) + " L" + f(TIP[0]) + "," + f(TIP[1] + dt), ink, 4.2) + line("M" + f(hx) + "," + f(hy + dy) + " L" + f(TIP[0]) + "," + f(TIP[1] + dt), "#C9CBD0", 2); };
        var sweat = [0, 1, 2, 3].map(function () { return '<g class="sweat" opacity="0"><path d="M0,-6 Q5,1 0,5 Q-5,1 0,-6 Z" fill="#DDEEF5" stroke="' + ink + '" stroke-width="1.6"/></g>'; }).join("");
        return body.replace('<g class="arm-r">', '<g class="arm-r" id="' + ID + '-eng-arm">') + '<g id="' + ID + '-tweez">' + tw(-2, 0) + tw(3, 1.5) + "</g>" +
          '<g transform="translate(' + f(er.top[0] - 6) + "," + f(er.top[1] + 6) + ')">' + sweat + "</g>";
      }
      // The console: a slate pedestal with a sloped panel, and the tiny dial under the tweezers' tip.
      function consoleArt() {
        var x = DIAL[0], y = DIAL[1] + 18;
        return solid(pd([[x - 34, 0], [x + 34, 0], [x + 34, y + 40], [x + 46, y + 6], [x - 46, y - 2], [x - 34, y + 40]]), C.slate, 3.6) +
          line("M" + (x + 31) + ",-4 V" + (y + 40), C.orange, 2.2) +
          '<g transform="translate(' + f(x) + "," + f(y + 2) + ') scale(0.32)"><g id="' + ID + '-tiny">' + KIT.props.gauge({ mount: "dial", value: 0.2, zones: [], marks: [[0.62, "", C.med]] }) + "</g></g>";
      }

      // ── The Weapons Maker (KIT.cast), facing left at his cascade: grinning, then looking left and right, worried. His
      // hard hat is drawn on its own, so it stays behind when he pops.
      var WM = KIT.castOpts("weaponsMaker", { look: "left", hat: null }), wr = KIT.rig(WM);
      var HATY = wr.head[1] + wr.hs * -22;
      var hardHat = '<path d="M-23,5 L-18,-13 L0,-20 L18,-13 L23,5 Z" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2.6" stroke-linejoin="miter"/>' +
        '<path d="M-30,8 L-26,3 H26 L30,8 Z" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2.2" stroke-linejoin="miter"/><path d="M-2,-19 V2" stroke="' + C.orange + '" stroke-width="2.6"/>';
      var wmSvg = '<g class="wm-pose" data-p="a">' + KIT.person(WM) + "</g>" + '<g class="wm-pose" data-p="l" opacity="0">' + KIT.person(copy(WM, { mood: "worried" })) + "</g>" +
        '<g class="wm-pose" data-p="r" opacity="0">' + KIT.person(copy(WM, { look: "right", mood: "worried" })) + "</g>" +
        '<g id="' + ID + '-smooch" opacity="0"><path d="M0,6 C-14,-4 -9,-15 0,-8 C9,-15 14,-4 0,6 Z" fill="' + C.war + '" stroke="' + ink + '" stroke-width="2"/></g>';

      // ── A poof: cream puffs and stars, for things that vanish (around (0, 0), about 200 across).
      function poof() {
        var c = [[0, -34, 36], [36, -12, 30], [-36, -10, 32], [20, 20, 32], [-22, 22, 30], [0, 0, 40], [46, 22, 20], [-48, 24, 20]];
        return c.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="9"/>'; }).join("") +
          c.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" fill="' + WHITE + '"/>'; }).join("") +
          [[-70, -50, 16, C.yellow], [72, -44, 13, C.orange], [64, 50, 11, C.yellow], [-64, 46, 12, C.orange]].map(function (s) { return KIT.star(s[0], s[1], s[2], s[3]); }).join("");
      }

      // ── The counter: a factory-floor sign on a post, DAYS OF PEACE in Oswald over seven flip tiles in Fraunces (the
      // card spans x 424..840, y -624..-414, as the sketch draws it). The number sits right-aligned in the tiles.
      var TILES = 7, TX0 = 449, TP = 52, TW = 48;
      function counter() {
        var fs = KIT.fitText("DAYS OF PEACE", 50, 352, "Oswald", 600, 3);
        var tiles = "";
        for (var i = 0; i < TILES; i++) tiles += '<g class="tile" data-x="' + (TX0 + i * TP + TW / 2) + '"><rect x="' + (TX0 + i * TP) + '" y="-520" width="' + TW + '" height="70" rx="4" fill="#1E1B24"/>' +
          '<path d="M' + (TX0 + i * TP) + ",-485 h" + TW + '" stroke="#3A3542" stroke-width="2"/><text x="' + (TX0 + i * TP + TW / 2) + '" y="-466" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="50" fill="' + C.yellow + '"></text></g>';

        var u = sunU(t);
        show(sunEl, u >= 0);
        if (u >= 0) { var sp2 = sunPt(u); sunEl.setAttribute("transform", "translate(" + f(sp2[0]) + "," + f(sp2[1]) + ")"); }
        var lapse = t >= tThou && t < NOON[0] + 0.15;
        arcEl.setAttribute("opacity", lapse ? 0.6 : 0);
        ghostEls.forEach(function (g, i) {
          show(g, lapse);
          if (lapse) { var gp = sunPt(0.1 + i * 0.115); g.setAttribute("transform", "translate(" + f(gp[0]) + "," + f(gp[1]) + ")"); g.setAttribute("opacity", (0.15 + i * 0.06).toFixed(2)); }
        });

        // ── the rocks: gray rolls in on "Rocks", rust on "different" (stopping on "colored"); moss on "thousands"
        show(grayEl, t > tRocks);
        rollRock(grayEl, -1250, GRAYX, tRocks, tRocks + 0.4, GK, t);
        var thrownNow = t >= tUp;
        show(rustEl, t > tDiff && !thrownNow);
        rollRock(rustEl, V ? 1200 : 1350, RUSTX, tDiff, tCol, RK, t);
        mossEls.forEach(function (m, i) { var mu = clamp((t - tThou - 0.06 - i * 0.08) / 0.4); show(m, mu > 0); m.setAttribute("transform", "translate(0,-60) scale(" + mu.toFixed(3) + ") translate(0,60)"); });
        flowerEls.forEach(function (fl, i) {
          var u2 = clamp((t - FLOWERS[i][3]) / 0.25), b2 = u2 < 1 ? 1 + 2.4 * Math.pow(u2 - 1, 3) + 1.4 * Math.pow(u2 - 1, 2) : 1;
          fl.setAttribute("transform", "scale(" + (u2 > 0 ? b2 : 0).toFixed(3) + ")");
        });
        // the bird flies in from the top left, flapping, and settles into its nest on the gray rock
        var bu2 = clamp((t - tThou - 0.12) / 0.45), nu = clamp((t - tThou - 0.5) / 0.2);
        show(nestEl, nu > 0); nestEl.setAttribute("transform", "scale(" + (1 + 2.4 * Math.pow(nu - 1, 3) + 1.4 * Math.pow(nu - 1, 2)).toFixed(3) + ")");
        show(birdEl, bu2 > 0);
        var bx = NEST[0] + 4 - 420 * (1 - bu2), by = NEST[1] - 18 - 380 * (1 - bu2) * (1 - bu2);
        var startle = t > tThrow ? -Math.sin(clamp((t - tThrow) / 0.3) * Math.PI) * 30 : 0;
        birdEl.setAttribute("transform", "translate(" + f(bx) + "," + f(by + startle) + ")");
        birdWing.setAttribute("transform", (bu2 > 0 && bu2 < 1) || (startle < -2) ? "translate(0,-10) scale(1," + (Math.floor(t * 16) % 2 ? -0.7 : 1) + ") translate(0,10)" : "");
        // the heart floats up between the rocks after "colored", bobs, and pops when the rust rock is picked up
        var hu = clamp((t - tCol - 0.2) / 0.35), hb = hu < 1 ? 1 + 2.4 * Math.pow(hu - 1, 3) + 1.4 * Math.pow(hu - 1, 2) : 1;
        var HX = (GRAYX + RUSTX) / 2 + 10, HY = -250 - 30 * smooth(hu) + Math.sin((t - tCol) * 4) * 8;
        show(heartEl, hu > 0 && t < tThrow + 0.06);
        heartEl.setAttribute("transform", "translate(" + HX + "," + f(HY) + ") scale(" + (hu > 0 ? hb : 0).toFixed(3) + ")");
        var pu = (t - tThrow - 0.06) / 0.25;
        show(heartPopEl, pu > 0 && pu < 1);
        heartPopEl.setAttribute("transform", "translate(" + HX + "," + f(HY) + ") scale(" + (0.5 + 0.9 * clamp(pu)).toFixed(3) + ")");

        // ── the human: strolls in from the right during the streaking days, bends to the rust rock, swings it
        // overhead and hurls it off the right edge
        var HFROM = (V ? camera.views.key[0] + 540 / camera.views.key[2] : 960) + 160, hx = MANX, hp = "walk";
        if (t < tBend) { var hwu = clamp((t - tWalk0) / (tBend - tWalk0)); hx = HFROM + (MANX - HFROM) * (1 - (1 - hwu) * (1 - hwu)); }
        if (t >= tBend) hp = "bend";
        if (t >= tUp) hp = "up";
        if (t >= tThrow) hp = "throw";
        show(humEl, t > tWalk0);
        var hwalk = t > tWalk0 && t < tBend, hbob = hwalk ? -Math.abs(Math.sin((t - tWalk0) * 12)) * 7 : 0;
        humEl.setAttribute("transform", "translate(" + f(hx) + "," + f(-100 * HS + hbob) + ") scale(" + HS + ")");
        humPoses.forEach(function (g) { show(g, g.getAttribute("data-p") === hp); });
        humLegs.forEach(function (lg, i) { var a = hwalk ? Math.sin((t - tWalk0) * 12) * 20 * (i ? -1 : 1) : 0, hip = hRig.walk.hip[i]; lg.setAttribute("transform", "rotate(" + f(a) + " " + f(hip[0]) + " " + f(hip[1]) + ")"); });
        // the rock in his hands, then in flight (center of the rock, plate units)
        show(thrownEl, thrownNow && t < tThrow + 0.6);
        if (thrownNow) {
          var ov = [MANX + HS * OVER[0], -100 * HS + HS * OVER[1]], rp, rr = 0;
          if (t < tThrow) { var lu = smooth((t - tUp) / 0.1); rp = [RUSTX + (ov[0] - RUSTX) * lu, -39 * RK + (ov[1] + 39 * RK) * lu]; }
          else { var fu2 = (t - tThrow) / 0.42, outX = (V ? camera.views.key[0] + 540 / camera.views.key[2] : 960) + 300; rp = [ov[0] + (outX - ov[0]) * fu2, ov[1] - 420 * Math.sin(Math.min(1, fu2) * Math.PI * 0.6)]; rr = 540 * fu2; }
          thrownEl.setAttribute("transform", "translate(" + f(rp[0]) + "," + f(rp[1]) + ")");
          thrownSpin.setAttribute("transform", "rotate(" + f(rr) + ")");
        }
      });

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
