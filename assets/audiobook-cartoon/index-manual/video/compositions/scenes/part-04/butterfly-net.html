<template id="butterfly-net-template">
  <!-- butterfly-net · Layer B (storyboards/part-04-institutionalize.md). A street corner and a cut-away living room.
       The patient (the part's spine: a mustard shirt, slick hair) pops up his 1% sign: a war bill hops into the little
       seal-flip funnel and comes out a medicine bill. On "committed." the Orderly's head rises over the hedge behind him
       on a neck that will not stop, like a periscope, with a butterfly net. On "programmed" wires spring out of the
       back of the TV and plug into the backs of the sofa crowd's heads; their eyes go flat. On "news" the TV comes on
       and the camera pushes in on it (the plugged heads stay in the frame): the Weapons Maker reads the news in a
       necktie, cradling his missile. Then the chart, LAWS OF NATURE: WAR (a
       missile hangs over a tiny human), GRAVITY (an apple), WEATHER (a rain cloud). After "weather." the war missile
       drops and goes off: the tiny human stands there charred, blinking, and the crowd nods along, satisfied. On
       "assume" the camera pulls back out and every head turns, wires and all, to the patient (in 9:16 they look up
       at him); his chest light blinks red on "brain"; on
       "malfunctioning." the crowd points, the Orderly rises up behind the hedge and nets him, and carries him off
       kicking like a prize butterfly, the 1% sign sticking out of the mesh.
       In 9:16 the street corner sits on top (the periscope gets the whole sky) and the living room below it. -->

    #butterfly-net-art { position: absolute; }
  </style>

            crowd: { S: 1.75, xs: [122, 232, 342, 452], sofa: [66, 508] }, tv: { cx: 772, y: 1440, s: 3.1 },
            lift: [-110, -95], walk: 520, tilt: -24, point: null, zoom: { z: 1.25, at: [623, 1242] } }

            crowd: { S: 1.45, xs: [752, 852, 952, 1052], sofa: [702, 1104] }, tv: { cx: 1356, y: 860, s: 2.95 },
            lift: [-130, -250], walk: 400, tilt: 0, point: [[-108, -112], [-12, -75]], zoom: { z: 1.65, at: [1030, 440] } };

      // ── Drawing helpers (the HUMANS technique from kit.js) ─────────────
      function f1(v) { return String(Math.round(v * 10) / 10); }

      // a shape drawn twice, a navy pass under the fill, so it gets a hard navy outline

          '<clipPath id="' + id + 'c"><path d="' + d + '"/></clipPath></defs>' +
          '<rect x="' + f1(x0) + '" y="' + f1(y0) + '" width="' + f1(x1 - x0) + '" height="' + f1(y1 - y0) + '" fill="url(#' + id + 'p)" opacity="' + (op || 0.25) + '" clip-path="url(#' + id + 'c)"/>';
      }
      function clamp(u) { return u < 0 ? 0 : u > 1 ? 1 : u; }
      function ss(u) { u = clamp(u); return u * u * (3 - 2 * u); }
      function backOut(u) { u = clamp(u); var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
      function lerp(a, b, u) { return a + (b - a) * u; }
      // a head turning (scaleX 1 -> -1) never goes thinner than about half: it flips across the middle instead
      function turn(s) { return (s >= 0 ? 1 : -1) * (0.45 + 0.55 * Math.abs(s)); }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      // Two-segment arm from shoulder s to hand target t (person units), segments len long; bend (+1/-1) picks the
      // elbow's side. Returns the kit's angles [a1, a2] (deg, 0 = down, + toward +x).
      function ik(s, t, len, bend) {
        var dx = t[0] - s[0], dy = t[1] - s[1], d = Math.min(Math.sqrt(dx * dx + dy * dy), 2 * len - 0.01);
        var base = Math.atan2(dy, dx), al = Math.acos(d / (2 * len)) * bend;
        var ex = s[0] + len * Math.cos(base + al), ey = s[1] + len * Math.sin(base + al);
        var hx = s[0] + d * Math.cos(base), hy = s[1] + d * Math.sin(base);
        var deg = function (x, y) { return (Math.atan2(x, y) * 180) / Math.PI; };
        return [deg(ex - s[0], ey - s[1]), deg(hx - ex, hy - ey)];
      }
      // A person standing on y with its feet: the group transform that puts person units on the canvas.
      function feet(x, y, S) { return [x, y - 100 * S, S]; }
      function toScene(T, p) { return [T[0] + p[0] * T[2], T[1] + p[1] * T[2]]; }

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));
      // The camera window: the paper's inner frame, so the push-in on the TV stays inside the border.
      q("view").style.cssText = "position:absolute;overflow:hidden;left:46px;top:46px;width:" + (W - 92) + "px;height:" + (H - 92) + "px;";
      q("art").style.cssText = "position:absolute;left:-46px;top:-46px;width:" + W + "px;height:" + H + "px;";

      // ── The street corner: sidewalk, lamppost, hedge ───────────────────
      var hx0 = L.hedge.x0, hx1 = L.hedge.x1, ht = L.hedge.top;
      var street = solid(polyD([[44, G], [V ? 1036 : L.room.x0, G], [V ? 1036 : L.room.x0, G + 26], [44, G + 26]]), "#E4D6B4", 3) +
        line("M44," + (G + 9) + " H" + (V ? 1036 : L.room.x0), C.tan, 2, ' stroke-dasharray="26 18" opacity="0.7"');
      var lx = L.lamp.x, lt = L.lamp.top;
      var lamp = solid(polyD([[lx - 16, G], [lx + 16, G], [lx + 11, G - 22], [lx - 11, G - 22]]), C.slate, 3) +
        solid(polyD([[lx - 6, G - 20], [lx + 6, G - 20], [lx + 5, lt + 30], [lx - 5, lt + 30]]), C.navy, 3) + line("M" + (lx + 2.5) + "," + (G - 24) + " V" + (lt + 34), C.orange, 1.6) +
        solid(polyD([[lx - 22, lt + 30], [lx + 22, lt + 30], [lx + 14, lt + 18], [lx - 14, lt + 18]]), C.slate, 3) +
        solid(polyD([[lx - 18, lt + 18], [lx + 18, lt + 18], [lx + 13, lt - 22], [lx - 13, lt - 22]]), C.yellow, 3) +
        line("M" + (lx - 8) + "," + (lt + 12) + " L" + (lx - 5) + "," + (lt - 15), "#FFFFFF", 3, ' opacity="0.7"') +

      // the hedge: a faceted green wall with a bumpy top
      var bumps = [], n = Math.round((hx1 - hx0) / 44), rh = KIT.rng(41);

      // ── The living room (a cut-away box) ───────────────────────────────
      var R = L.room;

      var stripes = "";
      for (var sx = R.x0 + 24; sx < R.x1; sx += 36) stripes += '<rect x="' + sx + '" y="' + R.y0 + '" width="12" height="' + (R.y1 - R.y0) + '" fill="' + C.tan + '" opacity="0.16"/>';
      var pic = L.pic;
      var picture = solid(polyD([[pic.x, pic.y], [pic.x + pic.w, pic.y], [pic.x + pic.w, pic.y + pic.h], [pic.x, pic.y + pic.h]]), "#6B4A2F", 4) +
        '<rect x="' + (pic.x + 12) + '" y="' + (pic.y + 12) + '" width="' + (pic.w - 24) + '" height="' + (pic.h - 24) + '" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="2.5"/>' +
        '<rect x="' + (pic.x + 12) + '" y="' + (pic.y + pic.h - 40) + '" width="' + (pic.w - 24) + '" height="28" fill="' + C.tan + '"/>' +
        at(pic.x + pic.w / 2, pic.y + pic.h - 34, 0.16, KIT.nuke()) +
        '<path d="M' + (pic.x + pic.w / 2) + "," + (pic.y - 4) + " L" + (pic.x + pic.w / 2 - 34) + "," + (pic.y + 2) + " M" + (pic.x + pic.w / 2) + "," + (pic.y - 4) + " L" + (pic.x + pic.w / 2 + 34) + "," + (pic.y + 2) + '" stroke="' + ink + '" stroke-width="2"/>' +
        '<circle cx="' + (pic.x + pic.w / 2) + '" cy="' + (pic.y - 6) + '" r="4" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2"/>';
      var room = solid(wallD, C.cream, 6) + stripes + dots(wallD, R.x0 + (R.x1 - R.x0) * 0.6, R.y0, R.x1, R.y1, 0.12, 5) +
        '<rect x="' + R.x0 + '" y="' + (R.y1 - 22) + '" width="' + (R.x1 - R.x0) + '" height="22" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="3"/>' +
        line("M" + R.x0 + "," + (R.y1 - 20) + " H" + R.x1, C.orange, 1.6) + picture +
        '<rect x="' + R.x0 + '" y="' + R.y0 + '" width="' + (R.x1 - R.x0) + '" height="' + (R.y1 - R.y0) + '" fill="none" stroke="' + ink + '" stroke-width="6"/>';

      // ── The patient ────────────────────────────────────────────────────
      // One hand up on the sign's pole, which stands just in front of him (to his right); the other on his hip, so

      var PAT = { tone: 1, outfit: "shirt", color: 3, look: "right" };

      var poleBot = gLo[1] + 22, cardBot = pr.top[1] - 18, SK = L.sign;

      // The sign: "1%" over a little war bill, the seal-flip funnel and an empty spot (sign units; the card is 310 x 174).
      var FS = 44, CARD_H = 174;
      function signArt(ids, final) {
        var bottom = -signH, yb = bottom - 14, I = function (s) { return ids ? ' id="' + PX + s + '"' : ""; };
        var base = KIT.props.sign({ text: "1%\n          \n ", fontSize: FS, posts: 1, height: signH });

      }
      var signAt = function (inner) { return at(gxP, poleBot, SK, inner); };
      // the patient's poses, stacked (eager, proud, worried; then netted, in the bundle)
      var pT = feet(L.pat.x, G, L.pat.S);
      var patient = at(pT[0], pT[1], pT[2], g("p-jump",
        signAt(g("sign-pop", signArt(true, false))) +
        g("pa", KIT.person(mix(PAT, { mood: "eager" }))) +
        g("pb", KIT.person(mix(PAT, { mood: "smile" })), 'opacity="0"') +
        g("pc", KIT.person(mix(PAT, { mood: "worried" })), 'opacity="0"')));

      // The bundle: the patient caught in the net (the mesh over him to the knees, the hoop round his knees, the sign
      // poking out of the top), legs dangling below. Placed by onTime.
      var HOOP = [4, 56, 44, 10]; // hoop center x, y, rx, ry (person units)
      var meshTop = pr.top[1] - 14;
      var meshD = "M" + pt(HOOP[0] - HOOP[2], HOOP[1]) + " C" + pt(-50, -10) + " " + pt(-34, meshTop - 6) + " " + pt(8, meshTop) +
        " C" + pt(44, meshTop - 4) + " " + pt(58, -12) + " " + pt(HOOP[0] + HOOP[2], HOOP[1]) + " Z";
      var meshDefs = '<defs><pattern id="' + PX + 'mesh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
        '<path d="M0,0 H7 M0,0 V7" stroke="' + ink + '" stroke-width="1" fill="none"/></pattern>' +
        '<pattern id="' + PX + 'mesh2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
        '<path d="M0,0 H9 M0,0 V9" stroke="' + ink + '" stroke-width="1.6" fill="none"/></pattern></defs>';
      var PD = mix(PAT, { mood: "eager", light: "red" });
      var bundle = g("bundle-pos", g("bundle-in",
        signAt(signArt(false, true)) + g("pd", KIT.person(PD)) +
        '<path d="' + meshD + '" fill="' + C.cream + '" fill-opacity="0.22" stroke="none"/>' +
        '<path d="' + meshD + '" fill="url(#' + PX + 'mesh)" opacity="0.75" stroke="' + ink + '" stroke-width="2.4"/>' +
        '<ellipse cx="' + HOOP[0] + '" cy="' + HOOP[1] + '" rx="' + HOOP[2] + '" ry="' + HOOP[3] + '" fill="none" stroke="' + ink + '" stroke-width="5"/>' +
        '<ellipse cx="' + HOOP[0] + '" cy="' + HOOP[1] + '" rx="' + HOOP[2] + '" ry="' + HOOP[3] + '" fill="none" stroke="' + C.slate + '" stroke-width="2"/>'), 'opacity="0"');

      // ── The Orderly, behind the hedge ──────────────────────────────────
      var ORD = function (extra) { return KIT.castOpts("orderly", extra); };
      var oS = L.ord.S, orr = KIT.rig(ORD({ look: "right", arms: [[0, 0], [0, 0]] })), osh = orr.shoulder, olen = orr.armLength;
      var NR = 34; // the net's hoop radius (orderly units)
      // A: both hands on an upright handle in front of him. B: the swing's end, the handle aimed at the patient.
      // C: facing left, carrying the net back over his shoulder.
      var gA1 = [osh[1][0] + 16, osh[1][1] + 26], gA2 = [osh[1][0] + 16, osh[1][1] - 2];
      var thUp = (V ? -76 : -82) * Math.PI / 180;
      var gA2b = [gA1[0] + Math.cos(thUp) * 28, gA1[1] + Math.sin(thUp) * 28];
      var armsA = [ik(osh[0], gA1, olen, 1), ik(osh[1], gA2b, olen, 1)];
      var standTop = G + (orr.top[1] - 100) * oS;
      var sink = Math.max(0, ht + 28 - standTop);
      var oT0 = feet(L.ord.x, G, oS); // standing; the body offset (sink, rise) is added in onTime
      var gripA_s = function (oy, dx) { return [oT0[0] + dx + gA1[0] * oS, oT0[1] + oy + gA1[1] * oS]; };
      // The swing ends with the hoop over the patient's chest; the Orderly has risen so his hands clear the hedge.
      var gB1 = [osh[1][0] + 10, osh[1][1] + 4];
      var riseUp = Math.max(0, (oT0[1] + gB1[1] * oS) - (ht - 26));
      var target = toScene(pT, [6, -8]);
      var gripB0 = [oT0[0] + gB1[0] * oS, oT0[1] - riseUp + gB1[1] * oS];
      var thHit = Math.atan2(target[1] - gripB0[1], target[0] - gripB0[0]);
      var LhHit = Math.sqrt(Math.pow(target[0] - gripB0[0], 2) + Math.pow(target[1] - gripB0[1], 2)) / oS - NR;
      var gB2 = [gB1[0] + Math.cos(thHit) * 26, gB1[1] + Math.sin(thHit) * 26];
      var armsB = [ik(osh[0], gB1, olen, 1), ik(osh[1], gB2, olen, 1)];
      var thC = -38 * Math.PI / 180, gC1 = [osh[1][0] + 2, osh[1][1] + 2], gC2 = [gC1[0] - Math.cos(thC) * 24, gC1[1] - Math.sin(thC) * 24];
      var armsC = [ik(osh[0], gC2, olen, -1), ik(osh[1], gC1, olen, -1)];
      // The periscope: the hoop peeks over the hedge, leaning toward the patient.

      tl.set(q("pb"), { opacity: 0 }, tAss + 0.45);
      tl.set(q("pc"), { opacity: 1 }, tAss + 0.45);
      var light = q("pc").querySelector(".chest-light"), lx0 = +light.getAttribute("cx"), ly0 = +light.getAttribute("cy");
      // a red glow round the light while it is on (it is small at this size)
      var glow = document.createElementNS("http://www.w3.org/2000/svg", "g");
      glow.setAttribute("opacity", "0");
      glow.innerHTML = '<circle cx="' + lx0 + '" cy="' + ly0 + '" r="9" fill="' + C.war + '" opacity="0.35"/>' +
        [0, 60, 120, 180, 240, 300].map(function (a) {
          var r = (a * Math.PI) / 180;
          return line("M" + pt(lx0 + Math.cos(r) * 9, ly0 + Math.sin(r) * 9) + " L" + pt(lx0 + Math.cos(r) * 15, ly0 + Math.sin(r) * 15), C.war, 2.2);
        }).join("");
      q("pc").appendChild(glow);
      [0, 0.14, 0.28, 0.42, 0.56].forEach(function (d, k) {
        tl.set(light, { attr: { fill: k % 2 ? "#E9E1CC" : C.war } }, tBrain + d);
        tl.set(glow, { opacity: k % 2 ? 0 : 1 }, tBrain + d);
      });
      // "malfunctioning.": the whole crowd points.
      var tMal = cue("malfunctioning."), tHit = tMal + 0.3, tLift = after("malfunctioning.");
      CROWD.forEach(function (c, i) {
        tl.set(q("c" + i + "b"), { opacity: 0 }, tMal + i * 0.03);
        tl.set(q("c" + i + "c"), { opacity: 1 }, tMal + i * 0.03);
      });
      // the net lands (pop): the patient is in the bundle now, kicking
      tl.set(q("p-jump"), { opacity: 0 }, tHit);
      var pd = q("pd"), pdr = KIT.rig(PD);
      [".leg-l", ".leg-r"].forEach(function (s, k) {
        var leg = pd.querySelector(s);
        gsap.set(leg, { svgOrigin: pdr.hip[k].join(" ") });
        tl.fromTo(leg, { rotation: k ? 18 : -18 }, { rotation: k ? -22 : 22, duration: 0.11, repeat: Math.floor((D - tHit - 0.05) / 0.11) - 1, yoyo: true, ease: "sine.inOut", immediateRender: false }, tHit + 0.05);
      });

      // ── Everything that hangs together, drawn on every seek ────────────
      // The Orderly (rise, neck, head, pose, walk), the net (behind or in front of the hedge), the bundle and the
      // crowd's heads with their wires.
      var tCom = cue("committed."), tScan = tCom + 0.62, tDuck = tAss + 0.05, tRise0 = tBrain + 0.1, tRise1 = tMal - 0.06;
      var tTurn = tLift + 0.1, tWalk = tLift + 0.22;
      var EmaxU = L.Emax / oS;
      var ordPos = q("ord-pos"), ordV = { A: q("oA"), B: q("oB"), C: q("oC") };
      var ordParts = {};
      Object.keys(ordV).forEach(function (k) {
        var e = ordV[k], ext = e.querySelector(".bn-neck-ext").children;
        ordParts[k] = { head: e.querySelector(".head"), fill: ext[0], side: ext[1] };
      });
      var nets = { back: q("net-back"), front: q("net-front") };
      Object.keys(nets).forEach(function (k) {
        var e = nets[k];
        nets[k] = { el: e, bag: e.querySelector(".bn-bag"), bag2: e.querySelector(".bn-bag2"), h1: e.querySelector(".bn-h1"), h2: e.querySelector(".bn-h2"), hoop: e.querySelector(".bn-hoop"), hoop2: e.querySelector(".bn-hoop2") };
      });
      var bPos = q("bundle-pos"), bIn = q("bundle-in");
      var nods = [cue("law") + 0.15, tGra + 0.42, tWea + 0.45, tBoom + 0.15, tBoom + 0.47];
      var crowdHeads = CROWD.map(function (c, i) {
        return { b: q("c" + i + "b").querySelector(".head"), c: q("c" + i + "c").querySelector(".head"), wire: q("wire" + i) };
      });

      function ordState(t) {
        var oy = sink;
        if (t > tRise0) oy = lerp(sink, -riseUp, ss((t - tRise0) / (tRise1 - tRise0)));
        // a tiptoe bob once he is up, and while he scurries off
        if (t > tRise1) oy += -4 * Math.abs(Math.sin((t - tRise1) * 11));
        var ext = 0;
        if (t >= tCom && t < tDuck) ext = EmaxU * backOut((t - tCom) / 0.42);
        else if (t >= tDuck && t < tRise0) ext = EmaxU * (1 - 0.82 * ss((t - tDuck) / 0.13));
        else if (t >= tRise0) ext = EmaxU * 0.18 * (1 - ss((t - tRise0) / (tRise1 - tRise0)));
        // the periscope comes up looking the wrong way, then swivels to the patient
        var s = turn(t < tScan ? -1 : -1 + 2 * ss((t - tScan) / 0.16));
        var dx = t < tWalk ? 0 : -L.walk * Math.pow(clamp((t - tWalk) / (D - tWalk)), 1.6);
        var pose = t < tMal ? "A" : t < tTurn ? "B" : "C";
        return { oy: oy, ext: ext, s: s, dx: dx, pose: pose };
      }
      function ordToScene(o, p) { return [oT0[0] + o.dx + p[0] * oS, oT0[1] + o.oy + p[1] * oS]; }
      function bundleState(t) {
        var x = pT[0], y = pT[1], rot = 0;
        if (t >= tLift) {
          var u = ss((t - tLift) / 0.3);
          x += L.lift[0] * u; y += L.lift[1] * u; rot = -10 * u;
        }
        if (t >= tWalk) {
          var o = ordState(t);
          x += o.dx; y += -6 * Math.abs(Math.sin((t - tWalk) * 11)); rot = -10 + 7 * Math.sin((t - tWalk) * 14);
        }
        return { x: x, y: y, rot: rot };
      }
      function bundlePoint(b, p) {
        var r = (b.rot * Math.PI) / 180, px = (p[0] - 4) * oSafe, py = (p[1] - 20) * oSafe;
        return [b.x + 4 * oSafe + px * Math.cos(r) - py * Math.sin(r), b.y + 20 * oSafe + px * Math.sin(r) + py * Math.cos(r)];
      }
      var oSafe = pT[2];
      function setNet(N, grip, th, Lh, show, R0, tip) {
        N.el.setAttribute("opacity", show ? 1 : 0);
        if (!show) return;
        var ux = Math.cos(th), uy = Math.sin(th), Rp = R0 * oS, end = [grip[0] + ux * Lh * oS, grip[1] + uy * Lh * oS], hc = [end[0] + ux * Rp, end[1] + uy * Rp];
        var hd = "M" + pt(grip[0] - ux * 10, grip[1] - uy * 10) + " L" + pt(end[0], end[1]);
        N.h1.setAttribute("d", hd); N.h2.setAttribute("d", hd);
        [N.hoop, N.hoop2].forEach(function (e) { e.setAttribute("cx", f1(hc[0])); e.setAttribute("cy", f1(hc[1])); e.setAttribute("rx", f1(Rp)); e.setAttribute("ry", f1(Rp)); });
        // the bag hangs off the hoop toward tip (a unit vector), 1.6 hoop radii long
        var px = -tip[1], py = tip[0], a = [hc[0] + px * Rp, hc[1] + py * Rp], b = [hc[0] - px * Rp, hc[1] - py * Rp], e = [hc[0] + tip[0] * Rp * 1.7, hc[1] + tip[1] * Rp * 1.7];
        var bd = "M" + pt(a[0], a[1]) + " Q" + pt(a[0] + tip[0] * Rp * 1.3, a[1] + tip[1] * Rp * 1.3) + " " + pt(e[0], e[1]) + " Q" + pt(b[0] + tip[0] * Rp * 1.3, b[1] + tip[1] * Rp * 1.3) + " " + pt(b[0], b[1]) + " Z";
        N.bag.setAttribute("d", bd); N.bag2.setAttribute("d", bd);
      }
      function hideNetHoop(N) { [N.hoop, N.hoop2, N.bag, N.bag2].forEach(function (e) { e.setAttribute("d", ""); e.setAttribute("rx", 0); e.setAttribute("ry", 0); }); }
      function netAt(t) {
        // the hoop end of the handle and the angle, before the catch
        var o = ordState(t);
        if (t < tMal) {
          var lift = t < tCom + 0.06 ? netDown : netDown * (1 - backOut((t - tCom - 0.06) / 0.42));
          var gp = ordToScene(o, gA1);
          return { grip: [gp[0], gp[1] + lift], th: thUp, Lh: LhUp };
        }
        var u = clamp((t - tMal) / (tHit - tMal));
        return { grip: ordToScene(o, gB1), th: lerp(thUp, thHit, u * u), Lh: lerp(LhUp, LhHit, u) };
      }

      KIT.onTime(tl, D, function (t) {
        var o = ordState(t);
        ordPos.setAttribute("transform", "translate(" + f1(oT0[0] + o.dx) + "," + f1(oT0[1] + o.oy) + ") scale(" + oS + ")");
        Object.keys(ordV).forEach(function (k) {
          var on = k === o.pose, P = ordParts[k];
          ordV[k].setAttribute("opacity", on ? 1 : 0);
          if (!on) return;
          var s = k === "C" ? 1 : o.s, e = o.ext;
          P.head.setAttribute("transform", "translate(0," + f1(-e) + ") scale(" + s.toFixed(3) + ",1)");
          var y0 = neckTop - e, y1 = neckTop + 3;
          P.fill.setAttribute("d", e > 0.5 ? polyD([[-3.6, y0], [3.6, y0], [3.6, y1], [-3.6, y1]]) : "");
          P.side.setAttribute("d", e > 0.5 ? "M-3.6," + f1(y0) + " V" + f1(y1) + " M3.6," + f1(y0) + " V" + f1(y1) : "");
        });
        // the net
        if (t < tHit) {
          var n0 = netAt(t), n1 = netAt(Math.max(0, t - 0.04));
          var hcx = n0.grip[0] + Math.cos(n0.th) * (n0.Lh + NR) * oS, hcy = n0.grip[1] + Math.sin(n0.th) * (n0.Lh + NR) * oS;
          var pcx0 = n1.grip[0] + Math.cos(n1.th) * (n1.Lh + NR) * oS, pcy0 = n1.grip[1] + Math.sin(n1.th) * (n1.Lh + NR) * oS;
          // the bag droops back and down, and trails behind the hoop when it moves
          var vx = hcx - pcx0, vy = hcy - pcy0, tx = -0.55 - vx * 0.08, ty = 1 - vy * 0.08, tn = Math.sqrt(tx * tx + ty * ty);
          var front = t >= tMal;
          setNet(nets.back, n0.grip, n0.th, n0.Lh, !front, NR, [tx / tn, ty / tn]);
          setNet(nets.front, n0.grip, n0.th, n0.Lh, front, NR, [tx / tn, ty / tn]);
          bPos.setAttribute("opacity", 0);
        } else {
          // caught: the handle runs from his hands to the hoop round the patient's knees
          var b = bundleState(t);
          bPos.setAttribute("opacity", 1);
          bIn.setAttribute("transform", "translate(" + f1(b.x) + "," + f1(b.y) + ") rotate(" + f1(b.rot) + " " + f1(4 * oSafe) + "," + f1(20 * oSafe) + ") scale(" + oSafe + ")");
          var grip = ordToScene(o, o.pose === "C" ? gC1 : gB1), hp = bundlePoint(b, [HOOP[0] - HOOP[2] + 2, HOOP[1]]);
          nets.back.el.setAttribute("opacity", 0);
          var N = nets.front;
          N.el.setAttribute("opacity", 1);
          var hd = "M" + pt(grip[0], grip[1]) + " L" + pt(hp[0], hp[1]);
          N.h1.setAttribute("d", hd); N.h2.setAttribute("d", hd);
          hideNetHoop(N);
        }
        // the crowd's heads: nods, then the slow turn to the patient (staggered), with the wires following the plugs
        var nod = 0;
        nods.forEach(function (tn) { var u = (t - tn) / 0.34; if (u > 0 && u < 1) nod += 9 * Math.sin(Math.PI * u); });
        crowdHeads.forEach(function (hh, i) {
          var rb = crowdR[i].b, rc = crowdR[i].c, T = crowdT[i];
          var u = ss((t - (tAss + 0.08 * i)) / 0.75), s = V ? 1 : turn(1 - 2 * u), tilt = L.tilt * u;
          var useC = t >= tMal + i * 0.03, ang, p, ny;
          if (!useC) {
            ny = rb.neck[1];
            ang = nod * s + tilt;
            hh.b.setAttribute("transform", "rotate(" + ang.toFixed(2) + " 0 " + f1(ny) + ") scale(" + s.toFixed(3) + ",1)");
            p = [s * (2 - 31 * rb.hs), rb.hy - 3 * rb.hs];
          } else {
            ny = rc.neck[1];
            ang = L.tilt;
            hh.c.setAttribute("transform", "rotate(" + ang.toFixed(2) + " 0 " + f1(ny) + ")");
            p = [V ? 2 - 31 * rc.hs : -2 + 31 * rc.hs, rc.hy - 3 * rc.hs];
          }
          var r = (ang * Math.PI) / 180, dy = p[1] - ny;
          var q2 = [p[0] * Math.cos(r) - dy * Math.sin(r), ny + p[0] * Math.sin(r) + dy * Math.cos(r)];
          var pp = toScene(T, q2), face = useC ? (V ? 1 : -1) : s;
          var c1 = [tvTb[0] - 50, tvTb[1] - (V ? 120 : 190) - i * 24], c2 = [pp[0] - 95 * (face >= 0 ? 1 : -1) * Math.max(0.35, Math.abs(face)), pp[1] - (V ? 120 : 140)];
          hh.wire.setAttribute("d", "M" + pt(tvTb[0], tvTb[1]) + " C" + pt(c1[0], c1[1]) + " " + pt(c2[0], c2[1]) + " " + pt(pp[0], pp[1]));
        });
      });

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
