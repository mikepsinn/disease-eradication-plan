        '<g id="' + ID + '-sign" transform="translate(' + PX + "," + (GY - 100 * PK) + ')"><g id="' + ID + '-signin">' + placard + "</g></g>";
      var win = '<defs><clipPath id="' + ID + '-winclip"><rect x="' + WIN[0] + '" y="' + WIN[1] + '" width="' + WIN[2] + '" height="' + WIN[3] + '"/></clipPath></defs>' +
        '<g clip-path="url(#' + ID + '-winclip)">' + outside + "</g>" +
        '<rect x="' + WIN[0] + '" y="' + WIN[1] + '" width="' + WIN[2] + '" height="' + WIN[3] + '" fill="none" stroke="' + C.cream + '" stroke-width="16"/>' +
        '<rect x="' + (WIN[0] - 8) + '" y="' + (WIN[1] - 8) + '" width="' + (WIN[2] + 16) + '" height="' + (WIN[3] + 16) + '" fill="none" stroke="' + ink + '" stroke-width="4"/>' +

      var room = '<rect x="-600" y="-600" width="3200" height="' + (FY + 600) + '" fill="' + WALL + '"/><rect x="-600" y="-600" width="3200" height="670" fill="#D8B978"/>' +
        '<rect x="-600" y="' + (FY - 6) + '" width="3200" height="900" fill="' + FLOOR + '"/><rect x="-600" y="' + (FY - 8) + '" width="3200" height="10" fill="' + C.rust + '"/>';
      q("plate").innerHTML = KIT.svg(W, H, '<g id="' + ID + '-cam">' + room + win + tv + wires + sofa + crowd + plugs + "</g>");

      // ── Elements ──
      var cam = q("cam"), onEl = q("on"), onIn = q("onin"), crt = q("crt"), wmPoses = Array.prototype.slice.call(q("wm").querySelectorAll(".wm-pose"));
      var msl = q("msl"), apple = q("apple"), stars = q("stars"), dropsEl = q("drops"), dropEls = Array.prototype.slice.call(dropsEl.querySelectorAll(".drop"));
      var vEls = VIEWERS.map(function (v, i) { return { g: q("v" + i), poses: Array.prototype.slice.call(q("v" + i).querySelectorAll(".vpose")), wire: q("wire" + i), plug: q("plug" + i) }; });
      var ordEl = q("ord"), ordPoses = Array.prototype.slice.call(ordEl.querySelectorAll(".opose")), ordHead = ordPoses[0].querySelector(".head"), ordNeck = ordPoses[0].querySelector(".xneck path");

      var patLight = patIn.querySelector(".chest-light");
      patLight.insertAdjacentHTML("beforebegin", '<circle class="light-glow" cx="' + patLight.getAttribute("cx") + '" cy="' + patLight.getAttribute("cy") + '" r="11" fill="' + C.war + '" opacity="0"/>');
      var patGlow = patIn.querySelector(".light-glow"), patLegs = Array.prototype.slice.call(patIn.querySelectorAll(".leg-l, .leg-r"));

      // ── Cues ──
      var tProg = cue("programmed"), tNews = cue("news"), tWar = cue("war"), tGrav = cue("gravity"), tWeather = cue("weather.");
      var tBoom = KIT.after(ID, "weather."), tAssume = cue("assume"), tBrain = cue("brain"), tMal = cue("malfunctioning."), tCarry = KIT.after(ID, "malfunctioning.");
      var tWire = [tProg, tProg + 0.2, tProg + 0.36, tProg + 0.5], tDrop0 = tBoom - 0.26, tBonk = tGrav + 0.3;
      var tNet = tMal + 0.12, tCatch = tMal + 0.35;

      // ── The camera: the crowd; in on the TV as it switches on; back out under the flash to the charred crowd; past
      // their heads onto the window.
      var KEYS = [[0, "sofa", 1], [tNews - 0.1, "sofa", 1.04], [tNews + 0.4, "tv", 1], [tBoom, "tv", 1.05], [tBoom + 0.3, "room", 1], [tAssume + 0.35, "room", 1.02], [tBrain + 0.3, "win", 1], [D, "win", 1.05]];
      var camera = KIT.camera(VIEW, KEYS, A);

      // ── The bomb inside the TV: the cloud grows over the map's town; the room flashes white and shakes.
      KIT.boom(tl, q("nuke"), tBoom, { shake: q("shake") });
      tl.fromTo(q("flash"), { opacity: 0 }, { opacity: 1, duration: 0.04 }, tBoom).to(q("flash"), { opacity: 0, duration: 0.32, ease: "power1.out" }, tBoom + 0.08);

      var WMHOME = [WM_AT[0], WM_AT[1] - 100 * WMK];
      KIT.onTime(tl, D, function (t) {

        show(onEl, on);
        onIn.setAttribute("transform", on ? "scale(1," + Math.max(0.02, ou).toFixed(3) + ")" : "");
        crt.setAttribute("opacity", on && ou < 1 ? 1 - ou * 0.6 : 0);

        // the anchor: cradling his missile; on "war" he steps to the map and slaps it on; then he gestures at it
        var pose = t < tWar ? "cradle" : t < tWar + 0.45 ? "slap" : "point";
        wmPoses.forEach(function (p) { show(p, p.getAttribute("data-pose") === pose); });
        var step = 90 * smooth((t - tWar + 0.15) / 0.3), bob = t < tWar ? -Math.abs(Math.sin(t * 3)) * 6 : 0;
        q("wm").setAttribute("transform", "translate(" + f(WMHOME[0] + step) + "," + f(WMHOME[1] + bob) + ") scale(" + WMK + ")");
        // the missile: in his arms (drawn with him) until "war", then flies onto the map beside the sun and sticks,
        // nose down; after "weather." it drops onto the town
        if (t < tWar + 0.05) show(msl, 0);
        else {
          var from = [cradleAt[0] + 90, cradleAt[1] - 40], mp, rot, sc2 = 1;
          var u = clamp((t - tWar - 0.05) / 0.22);
          if (u < 1) { mp = [from[0] + (MPIN[0] - from[0]) * u, from[1] + (MPIN[1] - from[1]) * u - Math.sin(Math.PI * u) * 120]; rot = -20 + 110 * u; }
          else if (t < tDrop0) { mp = MPIN.slice(); rot = 90; var sq = clamp((t - tWar - 0.27) / 0.18); sc2 = 1 + 0.25 * Math.sin(Math.PI * sq); }
          else { var du = clamp((t - tDrop0) / (tBoom - tDrop0)); du = du * du; mp = [MPIN[0] + (TOWN[0] - MPIN[0]) * du, MPIN[1] + (TOWN[1] - 30 - MPIN[1]) * du]; rot = 90 - 20 * Math.sin(Math.PI * du); }
          show(msl, t < tBoom);
          msl.setAttribute("transform", "translate(" + f(mp[0]) + "," + f(mp[1]) + ") rotate(" + f(rot) + ") scale(" + (0.6 * sc2).toFixed(3) + ")");
        }
        // the town goes flat under the cloud
        show(q("town"), t < tBoom + 0.1); show(q("rubble"), t >= tBoom + 0.1);
        // "gravity": an apple drops onto his hard hat and bounces off; stars circle his head
        var hx = hatTop[0] + 90, hy = hatTop[1];
        if (t < tGrav || t > tBonk + 0.7) show(apple, 0);
        else {
          var ap;
          if (t < tBonk) { var fu = (t - tGrav) / (tBonk - tGrav); ap = [hx, -470 + (hy - 30 + 470) * fu * fu]; }
          else { var bu = (t - tBonk) / 0.7; ap = [hx + 260 * bu, hy - 30 - 260 * bu + 700 * bu * bu]; }
          show(apple, 1);
          apple.setAttribute("transform", "translate(" + f(ap[0]) + "," + f(ap[1]) + ") rotate(" + f(t > tBonk ? (t - tBonk) * 500 : 0) + ")");
        }
        var su = t - tBonk;
        show(stars, su > 0 && su < 1.1);
        if (su > 0) stars.setAttribute("transform", "translate(" + f(hx) + "," + f(hy - 40) + ") rotate(" + f(su * 300) + ") scale(1,0.5)");
        // "weather.": the cloud rains
        show(dropsEl, t >= tWeather);
        dropEls.forEach(function (dEl, i) {
          var ph = ((t - tWeather) * 2.2 + i * 0.37) % 1, x = CLOUD[0] - 50 + (i % 5) * 26 + (i > 4 ? 12 : 0);
          dEl.setAttribute("transform", "translate(" + f(x - ph * 12) + "," + f(CLOUD[1] + 40 + ph * 150) + ")");
        });

        // the crowd
        vEls.forEach(function (ve, i) {
          var v = VIEWERS[i], R = v.R;
          var wired = t >= tWire[i] + 0.22, charred = t >= tBoom + 0.12;
          var pose = charred ? (t >= tMal ? "point" : "char") : wired ? "flat" : "watch";
          // the heads: nod along once charred; turn slowly to the window on "assume" (a squash through the middle)
          var turn = 1 - 2 * smooth((t - tAssume - i * 0.08) / 0.5), nod = charred && t < tAssume + 0.3 ? 5 * Math.sin((t - tBoom) * 7 + i * 0.9) : 0;
          ve.poses.forEach(function (pg) {
            var onp = pg.getAttribute("data-pose") === pose;
            show(pg, onp);
            if (!onp) return;
            var head = pg.querySelector(".head");
            head.setAttribute("transform", "rotate(" + f(nod) + " " + f(R.neck[0]) + " " + f(R.neck[1]) + ") translate(" + f(R.neck[0]) + ",0) scale(" + turn.toFixed(3) + ",1) translate(" + f(-R.neck[0]) + ",0)");
            var eyes = pg.querySelector(".char-eyes");
            if (eyes) {
              var bl = [0.55, 1.4, 2.3].some(function (b) { var tb = tBoom + b + i * 0.07; return t > tb && t < tb + 0.1; });
              eyes.setAttribute("transform", bl ? "translate(0,-4) scale(1,0.12) translate(0,4)" : "");
            }
            var smoke = pg.querySelector(".smoke");
            if (smoke) smoke.setAttribute("transform", "translate(0," + f(-Math.abs(Math.sin(t * 3 + i)) * 5) + ")");
          });
          // the wire: springs out of the TV's back into the back of the head, then bobs with it
          var back = 16 * R.hs * turn, nr = (nod * Math.PI) / 180;
          var bx = R.neck[0] + (R.head[0] + back - R.neck[0]) * Math.cos(nr) - (R.head[1] - 2 - R.neck[1]) * Math.sin(nr);
          var by = R.neck[1] + (R.head[0] + back - R.neck[0]) * Math.sin(nr) + (R.head[1] - 2 - R.neck[1]) * Math.cos(nr);
          var ex = v.x + bx * VK, ey = v.y + by * VK, sx0 = 628, sy0 = FY - 300 + i * 24;
          var sway = charred ? Math.sin(t * 4 + i) * 18 : 0;
          ve.wire.setAttribute("d", "M" + sx0 + "," + sy0 + " C" + f(780 + i * 40) + "," + f(FY + 40) + " " + f(ex + 110 + sway) + "," + f(ey + 240) + " " + f(ex) + "," + f(ey));
          var wu = clamp((t - tWire[i]) / 0.22), wob = wu >= 1 ? 0 : 0;
          ve.wire.setAttribute("stroke-dashoffset", (1 - (1 - Math.pow(1 - wu, 3)) - wob).toFixed(3));
          var pu = clamp((t - tWire[i] - 0.2) / 0.12);
          ve.plug.setAttribute("opacity", pu > 0 ? 1 : 0);
          ve.plug.setAttribute("transform", "translate(" + f(ex) + "," + f(ey) + ") scale(" + (pu > 0 ? 1 + 0.5 * Math.sin(Math.PI * pu) : 0).toFixed(3) + ")");
        });

        // the patient: beaming, sign up, bouncing it a little; on "brain" his chest light blinks red
        var pBob = -Math.abs(Math.sin(t * 5)) * 3;
        var blink = t >= tBrain && Math.floor((t - tBrain) * 6) % 2 === 0;
        patLight.setAttribute("fill", blink ? C.war : "#E9E1CC");
        patGlow.setAttribute("opacity", blink ? 0.35 : 0);
        // the Orderly: hidden in the hedge; on "malfunctioning." his head rises on his long neck like a periscope;
        // the net swings down over the patient; after it he stands and carries him off, the sign out of the mesh
        var rise = 175 * smooth((t - tMal) / 0.2) * (1 - smooth((t - tCarry) / 0.25));
        var stand = (OHID - OUP) * smooth((t - tCarry) / 0.25), walk = 210 * smooth((t - tCarry - 0.2) / 0.8);
        var oy = OHID - stand, ox = OX + walk, carry = t >= tCarry + 0.15;
        ordEl.setAttribute("transform", "translate(" + f(ox) + "," + f(oy - 100) + ")");
        ordPoses.forEach(function (p) { show(p, p.getAttribute("data-pose") === (carry ? "carry" : "peek")); });
        ordHead.setAttribute("transform", "translate(0," + f(-rise) + ")");
        ordNeck.setAttribute("d", rise > 1 ? "M" + f(RO.neck[0] - 4) + "," + f(RO.neck[1] + 6) + " V" + f(RO.neck[1] - rise + 2) + " H" + f(RO.neck[0] + 4) + " V" + f(RO.neck[1] + 6) + " Z" : "");
        if (carry) Array.prototype.forEach.call(ordPoses[1].querySelectorAll(".leg-l, .leg-r"), function (lg, j) {
          lg.setAttribute("transform", "rotate(" + f(Math.sin((t - tCarry) * 14) * 20 * (j ? -1 : 1)) + " " + f(RO2.hip[j][0]) + " " + f(RO2.hip[j][1]) + ")");
        });

        // the net: out of the hedge on "malfunctioning.", over the patient (a dome, the sign out of its top), then

        var R2 = carry ? RO2 : RO, hand = carry ? R2.hand[0] : [(R2.hand[0][0] + R2.hand[1][0]) / 2, (R2.hand[0][1] + R2.hand[1][1]) / 2];
        var end = [ox + hand[0], oy - 100 + hand[1] - (carry ? 0 : 0)], hc = null;
