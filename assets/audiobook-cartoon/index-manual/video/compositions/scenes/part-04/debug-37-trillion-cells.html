        spikeEl.setAttribute("transform", "translate(18,-30) scale(" + f3(clamp((t - tEvolve - 0.05) / 0.15, 0, 1) * sg) + ") translate(-18,30)");
        // the disease: the lead germ swells into it on "treatments.", grins, and burps the cap back after the word
        show(blobEl, t > tTreat + 0.3);
        var bsq = t > tBurp && t < tBurp + 0.3 ? Math.sin(((t - tBurp) / 0.3) * Math.PI) : 0;
        blobEl.setAttribute("transform", "translate(" + HIT + "," + (VY + VR) + ") scale(" + f3(1.45 * clamp((t - tTreat - 0.3) / 0.15 + 0.7, 0, 1)) + ")");
        blobIn.setAttribute("transform", "scale(" + f3(1 + 0.12 * bsq) + "," + f3(1 - 0.1 * bsq + 0.03 * Math.sin(t * 5)) + ")");

        // ── the pills
        var pill = function (k, t0, t1, eaten) {
          var e = pillEls[k];
          if (t < t0) { show(e, 0); return; }
          var tgt = [GERM_C[0] + 40, GERM_C[1] - 36];
          if (t < t1) { var pp = lerp2(MOUTH, tgt, (t - t0) / (t1 - t0), 40); show(e, 1); e.setAttribute("transform", "translate(" + f(pp[0]) + "," + f(pp[1]) + ") rotate(" + f(-8 + (t - t0) * 60) + ")"); return; }
          if (eaten) { show(e, 0); return; }
          // bounces off the spike: back up and away to the upper right, spinning
          var a = t - t1;
          if (a > 1.2) { show(e, 0); return; }
          e.setAttribute("transform", "translate(" + f(tgt[0] + a * 380) + "," + f(tgt[1] - a * 900 + a * a * 900) + ") rotate(" + f(a * 900) + ")");
        };
        pill(0, P1[0], P1[1], false);
        pill(1, P2[0], P2[1], true);
        // the cap: off the bottle with the second pill, eaten with it, burped back out
        var capOff = t > P2[0] - 0.05;
        if (bottleCap) bottleCap.setAttribute("opacity", capOff ? 0 : 1);
        if (t > P2[0] - 0.05 && t < P2[1]) { var cp2 = lerp2([MOUTH[0] - 10, MOUTH[1]], [GERM_C[0] + 50, GERM_C[1] - 30], (t - P2[0] + 0.05) / (P2[1] - P2[0] + 0.05), 60); show(capEl, 1); capEl.setAttribute("transform", "translate(" + f(cp2[0]) + "," + f(cp2[1]) + ") rotate(" + f(-90 - (t - P2[0]) * 500) + ")"); }
        else if (t > tBurp) {
          var ba = t - tBurp, mouth = [HIT + 10, VY + VR - 120 * 1.45];
          if (ba < 1.1) { show(capEl, 1); capEl.setAttribute("transform", "translate(" + f(mouth[0] + ba * 260) + "," + f(mouth[1] - ba * 520 + ba * ba * 380) + ") rotate(" + f(ba * 720) + ")"); } else show(capEl, 0);
        } else show(capEl, 0);

        // ── the Scientist: drops in on her rope on "debug" (with a bounce), the list unrolls on "all"
        var sAt = null, sRot = 0, spin = 1, spose = "drop";
        if (t >= tDebug - 0.05) {
          var du = (t - tDebug + 0.05) / 0.35, drop = du < 1 ? -900 * (1 - du) * (1 - du) : 14 * Math.exp(-(t - tDebug - 0.3) * 6) * Math.sin((t - tDebug - 0.3) * 18);
          sAt = [SCI[0], SCI[1] + drop + Math.sin(t * 2.2) * 1.5];
          if (t >= tOnce) { spose = "up"; spin = Math.cos((t - tOnce) * 13); }
          if (t >= tWhile) {
            // THUMP: she drops off the rope and lands flat on her back on the cell below
            var fu = clamp((t - tWhile) / 0.28, 0, 1);
            spose = fu < 0.5 ? "up" : "flat"; spin = 1;
            sAt = [SCI[0] + (LAND[0] - SCI[0]) * fu, SCI[1] + (LAND[1] - 6 - SCI[1]) * fu * fu];
            sRot = -90 * smooth(fu * 1.6);
          }
        }
        show(sciEl, !!sAt);
        if (sAt) {
          sciEl.setAttribute("transform", "translate(" + f(sAt[0]) + "," + f(sAt[1]) + ") rotate(" + f(sRot) + ")");
          sciSpin.setAttribute("transform", "scale(" + f3(Math.abs(spin) < 0.08 ? 0.08 * (spin < 0 ? -1 : 1) : spin) + ",1)");
          sposes.forEach(function (sp2) { show(sp2, sp2.getAttribute("data-pose") === spose); });
          // the rope: from far above down to her hand; slack and swinging once she drops off it
          show(ropeEl, 1);
          var rEnd = t < tWhile ? sAt : [SCI[0] + Math.sin((t - tWhile) * 7) * 14, SCI[1] - 10];
          var rd = "M" + f(SCI[0]) + "," + f(ROPE_TOP) + " L" + f(rEnd[0]) + "," + f(rEnd[1]);
          ropeEl.firstChild.setAttribute("d", rd); ropeEl.lastChild.setAttribute("d", rd);
        } else show(ropeEl, 0);
        // the spin lines while she spins
        show(spinL, t > tOnce + 0.05 && t < tWhile);
        if (sAt) spinL.setAttribute("transform", "translate(" + f(sAt[0]) + "," + f(sAt[1]) + ")");
        // the list hangs from her clipboard (just under her rope hand) and unrolls off the bottom of the frame
        var lu = smooth((t - tAll) / 0.8), lH = lu * (V ? 210 : 170);
        show(listEl, sAt && t > tAll - 0.02 && t < tWhile + 0.15);
        if (sAt) {
          var lx = sAt[0] + (spin < 0 ? -1 : 1) * 1.5, ly2 = sAt[1] + 6;
          listEl.setAttribute("transform", "translate(" + f(lx) + "," + f(ly2 + (t > tWhile ? (t - tWhile) * 300 : 0)) + ")");
          listClip.setAttribute("height", f(lH));
          listEl.querySelector(".list-roll").setAttribute("transform", "translate(0," + f(lH) + ")");
        }
      });

      // ── THUMP on "While": the footstep shakes everything
      tl.fromTo(q("shake"), { y: 0 }, { y: 26, duration: 0.06, ease: "power2.out", immediateRender: false }, tWhile);
      tl.to(q("shake"), { y: -14, duration: 0.09, ease: "sine.inOut" }, tWhile + 0.06);
      tl.to(q("shake"), { y: 6, duration: 0.08, ease: "sine.inOut" }, tWhile + 0.15);
      tl.to(q("shake"), { y: 0, duration: 0.1, ease: "sine.out" }, tWhile + 0.23);
      // the laptop's flames dance from the moment they catch
      KIT.flicker(tl, lapFire, tFire, D - 0.2);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
