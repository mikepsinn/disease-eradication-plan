        for (var n = 0; n < b[1]; n++) CONF.push({ burst: b[0], x: b[2] + crng() * (b[3] - b[2]), y: -60 - crng() * 520, v: 240 + crng() * 200, sw: 18 + crng() * 30, ph: crng() * 6.28, rot: crng() * 360, spin: (crng() - 0.5) * 900, col: [C.yellow, C.cream, C.orange, C.cyan][n % 4], w: 14 + crng() * 6 });
      });
      var confSvg = CONF.map(function (p, i) { return '<rect class="conf" data-i="' + i + '" x="' + f(-p.w / 2) + '" y="-4" width="' + f(p.w) + '" height="8" fill="' + p.col + '" stroke="' + ink + '" stroke-width="1" opacity="0"/>'; }).join("");

      q("plate").innerHTML = KIT.svg(W, H, '<rect x="-100" y="-100" width="' + (W + 200) + '" height="' + (H + 200) + '" fill="#0C2240"/>' + clips +
        '<g id="' + ID + '-cam">' + curtain + floor + marquee + lamps + cards + polSvg + desk + buzzer + palm + lid + hole + hangLines + patSvg + flap + podium + crowd + wmSvg +
        '<g id="' + ID + '-conf">' + confSvg + "</g></g>");

      // ── Elements ──
      var cam = q("cam"), pat = q("pat"), tip = q("tip"), flapEl = q("flap"), dome = q("dome"), wmIn = q("wm-in");
      var bulbEls = Array.prototype.slice.call(cam.querySelectorAll(".bulb"));
      var lampEl = { sane: q("sane"), insane: q("insane") };
      var cardEls = [q("card0"), q("card1")];
      var aud = Array.prototype.slice.call(cam.querySelectorAll(".aud"));
      var sweat = Array.prototype.slice.call(q("wm").querySelectorAll(".sweat"));
      var confEls = Array.prototype.slice.call(cam.querySelectorAll(".conf"));
      var patHead = q("pat-worried").querySelector(".head"), patPupils = Array.prototype.slice.call(q("pat-worried").querySelectorAll(".pupil"));
      var tipLegs = tip.querySelector(".legs");

      // ── Cues ──
      var tThat = cue("That:"), tSane = cue("sane."), tGive = cue("\"Give"), tMurder = cue("murder"), tMach = KIT.cueEnd(ID, "machines\":"), tIns = cue("insane."), tAfter = KIT.after(ID, "insane.");
      var tSlap = tIns, tOpen = tIns + 0.3, tFall = tIns + 0.72;

      // ── The camera: one framing per phrase. 16:9: host and card 1, the patient and card 2, the front row, then wide
      // on the host and the trapdoor. 9:16: the same, but the verdict is the slap on the host, then a whip pan to the
      // trapdoor as it opens.
      var VIEW = V
        ? { card1: [530, 713, 1.55], card2: [1320, 665, 1.7], wm: [960, 1060, 3.2], slap: [400, 690, 1.7], trap: [1385, 690, 1.55] }
        : { card1: [620, 470, 1.3], card2: [1250, 470, 1.3], wm: [960, 1080, 2.6], wide: [960, 540, 1.0] };
      var KEYS = V
        ? [[0, "card1", 1], [tGive - 0.2, "card1", 1.03], [tGive + 0.22, "card2", 1], [tMurder - 0.1, "card2", 1.04], [tMurder + 0.3, "wm", 1], [tMach + 0.1, "wm", 1.05],
           [tIns - 0.18, "slap", 1], [tOpen - 0.12, "slap", 1.02], [tOpen + 0.08, "trap", 1], [D, "trap", 1.06]]
        : [[0, "card1", 1], [tGive - 0.2, "card1", 1.03], [tGive + 0.22, "card2", 1], [tMurder - 0.1, "card2", 1.04], [tMurder + 0.3, "wm", 1], [tMach + 0.1, "wm", 1.05],
           [tIns - 0.1, "wide", 1], [D, "wide", 1.04]];
      var camera = KIT.camera(VIEW, KEYS);

      // a card flips: the back squeezes to nothing, the front opens out
      function flip(el, t0, t) {
        var u = (t - t0) / 0.38, back = el.querySelector(".card-back"), front = el.querySelector(".card-front");
        if (u <= 0) { show(back, 1); show(front, 0); el.setAttribute("transform", ""); return; }
        if (u >= 1) { show(back, 0); show(front, 1); el.setAttribute("transform", ""); return; }
        var sx = u < 0.5 ? 1 - smooth(u / 0.5) : smooth((u - 0.5) / 0.5);
        show(back, u < 0.5); show(front, u >= 0.5);
        el.setAttribute("transform", "scale(" + Math.max(0.02, sx).toFixed(3) + "," + (1 + 0.06 * Math.sin(Math.PI * u)).toFixed(3) + ")");
      }
      function setLamp(el, on, t, t0) {
        show(el.querySelector(".lamp-off"), !on); show(el.querySelector(".lamp-on"), on);
        var rays = el.querySelector(".lamp-rays"), rin = el.querySelector(".rays-in");
        show(rays, on);
        if (on) { var p = 1 + 0.08 * Math.sin((t - t0) * 18); rin.setAttribute("transform", "scale(" + (Math.min(1, (t - t0) / 0.12) * p).toFixed(3) + ")"); }
      }

      KIT.onTime(tl, D, function (t) {
        camera.place(cam, camera.at(t));

        // the marquee bulbs chase; on a verdict they all flash together
        var flashing = (t > tSane && t < tGive) || t > tSlap;
        bulbEls.forEach(function (b, i) {
          var on = flashing ? Math.floor(t * 8) % 2 === 0 : (Math.floor(t * 7) + Math.floor(i / 2)) % 3 === 0;
          b.setAttribute("fill", on ? "#FFF6C8" : C.cream);
          b.setAttribute("stroke", on ? C.orange : ink);
        });

        // the cards; the bill on card 2 tiptoes off its stack in high slow steps
        flip(cardEls[0], tThat + 0.02, t);
        flip(cardEls[1], tGive - 0.04, t);
        var tu = Math.min(1, Math.max(0, (t - tGive - 0.3) / 3.4)), step = Math.floor(tu * 7), su = tu * 7 - step;
        var tx = -10 + 92 * smooth(tu), ty = 52 - Math.sin(Math.PI * su) * 16 - 40 * Math.max(0, 1 - tu * 6);
        tip.setAttribute("transform", "translate(" + f(tx) + "," + f(ty) + ") rotate(" + f(Math.sin(Math.PI * su) * 6 - 4) + ")");
        tipLegs.setAttribute("d", step % 2 ? "M-16,24 l-14,12 h-6 M16,24 l2,22 h6" : "M-16,24 l-2,22 h-6 M16,24 l14,12 h6");

        // the lamps: SANE from "sane." until card 2; INSANE on the buzzer, to the end
        setLamp(lampEl.sane, t > tSane && t < tGive, t, tSane);
        setLamp(lampEl.insane, t > tSlap, t, tSlap);
        q("flash").style.opacity = t > tSlap && t < tSlap + 0.16 ? (0.5 * (1 - (t - tSlap) / 0.16)).toFixed(3) : 0;

        // the host points at the cards, winds up on "machines", and slaps the buzzer on "insane."
        var pp = t < tMach + 0.15 ? "point" : t < tSlap ? "raise" : "slap";
        ["point", "raise", "slap"].forEach(function (n) { show(q("pol-" + n), n === pp); });
        show(q("palm"), pp === "slap");
        var du = (t - tSlap) / 0.25, squash = du > 0 && du < 1 ? 1 - 0.45 * Math.sin(Math.PI * du) : 1;
        dome.setAttribute("transform", "translate(0," + (DT - 48) + ") scale(1," + squash.toFixed(3) + ") translate(0," + -(DT - 48) + ")");
        show(q("zap"), t > tSlap && t < tSlap + 0.5 && Math.floor(t * 16) % 2 === 0);

        // the trapdoor drops open: the lid is gone, the flap swings down from the near edge with a bounce
        var opened = t >= tOpen;
        show(q("lid"), !opened); show(q("hole"), opened); show(flapEl, opened);
        if (opened) {
          var fu = Math.min(1, (t - tOpen) / 0.22), sw = fu < 1 ? fu : 1 + 0.08 * Math.sin((t - tOpen - 0.22) * 22) * Math.exp(-(t - tOpen - 0.22) * 6);
          var lerp = function (a, b) { return a + (b - a) * sw; };
          flapEl.setAttribute("d", "M1330," + (FY + 74) + " L" + f(lerp(1300, 1336)) + "," + f(lerp(FY + 14, FY + 230)) + " H" + f(lerp(1640, 1604)) + " L1610," + (FY + 74) + " Z");
        }

        // the patient: waiting, beaming on "Give", worried when the floor goes; he hangs a beat, looks down, falls
        var pose = t < tGive + 0.1 ? "wait" : t < tOpen ? "beam" : "worried";
        Object.keys(PPOSE).forEach(function (n) { show(q("pat-" + n), n === pose); });
        var hop = t > tGive + 0.1 && t < tGive + 0.5 ? -Math.sin(Math.PI * (t - tGive - 0.1) / 0.4) * 22 : 0;
        var fall = t > tFall ? 1600 * Math.pow(t - tFall, 2) + 140 * (t - tFall) : 0;
        pat.setAttribute("transform", "translate(" + PAT[0] + "," + f(PAT[1] - 100 * PATK + hop + fall) + ")");
        var look = smooth((t - tOpen - 0.12) / 0.2);
        patHead.setAttribute("transform", "rotate(" + f(-24 * look) + " " + f(RPAT.neck[0]) + " " + f(RPAT.neck[1]) + ")");
        patPupils.forEach(function (p) { p.setAttribute("transform", "translate(0," + f(1.6 * look) + ")"); });
        show(q("hang"), t > tOpen + 0.05 && t < tFall);

        // the Weapons Maker: grinning; on "murder" he clutches his missile, shivering and sweating; relief after
        var clutch = t > tMurder && t < tAfter;
        show(q("wm-calm"), !clutch); show(q("wm-clutch"), clutch);
        var shiver = clutch ? Math.sin(t * 70) * 1.6 : 0;
        wmIn.setAttribute("transform", "translate(" + f(shiver * WMK) + ",0)");
        sweat.forEach(function (s, i) {
          var su2 = ((t - tMurder) * 1.4 + i * 0.25) % 1, side = i % 2 ? 1 : -1;
          if (!clutch || t < tMurder + i * 0.1) { show(s, 0); return; }
          var hx = RWM.top[0] + side * (16 + su2 * 22), hy = RWM.top[1] + 14 - Math.sin(Math.PI * su2) * 14 + su2 * 24;
          s.setAttribute("opacity", (1 - su2 * 0.7).toFixed(2));
          s.setAttribute("transform", "translate(" + f(hx) + "," + f(hy) + ") scale(1.4)");
        });

        // the audience cheers on "sane." and again after the patient drops
        var cheer = (t > tSane + 0.1 && t < tGive + 0.3) || t > tFall + 0.1;
        aud.forEach(function (g, i) {
          var ax = parseFloat(g.getAttribute("transform").match(/translate\(([-\d.]+)/)[1]);
          var bob = cheer ? -Math.abs(Math.sin(t * 9 + i * 1.7)) * 18 : 0;
          g.setAttribute("transform", "translate(" + ax + "," + f(1086 + bob) + ")");
          show(g.querySelector(".aud-arms"), cheer);
        });

        // confetti
        confEls.forEach(function (e, i) {
          var p = CONF[i], t0 = p.burst ? tSlap + 0.05 : tSane + 0.05, age = t - t0;
          if (age < 0) { show(e, 0); return; }
          var y = p.y + p.v * age, xx = p.x + Math.sin(age * 3 + p.ph) * p.sw;
          if (y > LIP + 40) { show(e, 0); return; }
          show(e, 1);
          e.setAttribute("transform", "translate(" + f(xx) + "," + f(y) + ") rotate(" + f(p.rot + p.spin * age) + ") scale(1," + Math.cos(age * 7 + p.ph).toFixed(2) + ")");
        });
      });

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
