<template id="sane-insane-buzzer-template">
  <!-- sane-insane-buzzer · Layer B (storyboards/part-04-institutionalize.md): the 1950s game show "SANE OR INSANE?".
       "That:" → the grinning host (the Politician) taps card 1 with his star pointer: DEBUG ALL OF HUMAN BIOLOGY AT ONCE;
       "sane." → the teal SANE lamp, confetti, APPLAUSE, the crowd's arms go up. "Give" → card 2: GIVE 1% FEWER PAPERS TO
       MURDER-MACHINE BUILDERS, one war bill walks off its pile, and the patient (already in his straitjacket) beams: it is
       his idea. "murder" → the Weapons Maker in the front row clutches his missile, sweating. "insane." → the host slaps
       the buzzer (zap), INSANE flashes red, the lid of the contestant's pedestal drops open (clank), the patient hangs in
       the air a beat and falls through (slide whistle), leaving his eyes behind for a blink; confetti, APPLAUSE, a wink. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #sane-insane-buzzer-cam, #sane-insane-buzzer-bg, #sane-insane-buzzer-art, #sane-insane-buzzer-pip, #sane-insane-buzzer-grain { position: absolute; inset: 0; }
    #sane-insane-buzzer-flash { position: absolute; inset: -40px; background: #C8452E; opacity: 0; }
  </style>
  <div id="root" data-composition-id="sane-insane-buzzer" data-width="1920" data-height="1080" data-start="0" data-duration="7.74">
    <div id="sane-insane-buzzer-cam">
      <div id="sane-insane-buzzer-bg"></div>
      <div id="sane-insane-buzzer-art"></div>
      <!-- the INSANE verdict's red flash: over the set, under Wishonia's corner -->
      <div id="sane-insane-buzzer-flash"></div>
      <div id="sane-insane-buzzer-pip"></div>
    </div>
    <div id="sane-insane-buzzer-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "sane-insane-buzzer";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;

      // ── The game show set. Copied into diagnostic-criteria.html, whose wall screen starts on this scene's last frame:
      // keep the two copies the same. gsArt(pid) draws the set over the paper, every moving part with the id pid-<name>;
      // gsEnd(pid) sets the last frame (both cards up, INSANE lit, the lid hanging open under the empty pedestal, the
      // host's hand on the buzzer, the crowd's arms up). People are KIT.person units (feet at y 100), placed with scale s.
      // Per shape: the floor line (feet), the stage top's band, the marquee [x, y, w, h, font size], the APPLAUSE sign
      // [x, y, w, h, font size], the board [x, y, w, h], the two cards' top-left corners and scale (drawn 330 x 210), the
      // lamps' top-left corners and [w, h, font size], the host [x, s], the patient [x, s] on his pedestal [cx, lid y, rx,
      // ry], the confetti's x range, the spotlight can and the TV camera (16:9), and the audience: tiers of seats [x, FOLKS
      // index or "wm"] behind a rail.
      var GS = V
        ? { floor: 1330, strip: [1317, 1346], marq: [60, 70, 660, 236, 96], sign: [80, 336, 300, 58, 36],
            board: [50, 440, 980, 392], cards: [[75, 458], [565, 458]], ck: 4 / 3, lamps: [[150, 754], [640, 754]], lamp: [290, 56, 42],
            host: [540, 2.5], pat: [230, 2.4], ped: [230, 1262, 100, 20], conf: [70, 1010],
            tiers: [{ rail: 1458, s: 1.9, front: true, seats: [[408, 0], [556, 1], [708, "wm"], [858, 2], [990, 3]] }] }
        : { floor: 862, strip: [849, 878], marq: [690, 34, 860, 128, 78], sign: [96, 318, 300, 60, 38], spot: [520, 58], cam: [1736, 352],
            board: [716, 172, 820, 318], cards: [[742, 188], [1164, 188]], ck: 1.06, lamps: [[782, 428], [1204, 428]], lamp: [270, 52, 40],
            host: [1140, 2.35], pat: [600, 2.35], ped: [600, 800, 98, 19], conf: [70, 1580],
            tiers: [{ rail: 612, s: 1.35, seats: [[105, 4], [225, 5], [345, 6]] }, { rail: 782, s: 1.55, seats: [[115, 0], [240, 1], [372, "wm"]] }] };
      var FOLKS = [{ tone: 1, outfit: "dress", hair: 1, color: 3 }, { tone: 3, outfit: "suit", color: 0 }, { tone: 0, outfit: "suit", color: 2 },
        { tone: 2, outfit: "dress", hair: 1, color: 0 }, { tone: 2, outfit: "dress", hair: 1, color: 1 }, { tone: 0, outfit: "suit", color: 1 }, { tone: 3, outfit: "shirt", color: 2 }];
      // THE PATIENT (the part's spine), looking at the host.
      var PAT = { tone: 1, outfit: "shirt", color: 3, look: "right" };
      var CAN = "#FBF6E6", INK = C.line;
      function cp(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function n1(v) { return (Math.round(v * 10) / 10).toString(); }
      function pd(pts) { return "M" + pts.map(function (p) { return n1(p[0]) + "," + n1(p[1]); }).join(" L") + " Z"; }
      // Shapes drawn twice, a navy pass under the fill (KIT's humans' technique): touching shapes share one outline.
      function sol(ds, fill, sw) {
        return ds.map(function (d) { return '<path d="' + d + '" fill="' + INK + '" stroke="' + INK + '" stroke-width="' + (sw || 4.4) + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }).join("") +
          ds.map(function (d) { return '<path d="' + d + '" fill="' + fill + '"/>'; }).join("");
      }
      function at(x, y, s, inner) { return '<g transform="translate(' + n1(x) + "," + n1(y) + ")" + (s === 1 ? "" : " scale(" + s + ")") + '">' + inner + "</g>"; }
      function txt(x, y, size, fam, fill, t, extra) {
        return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-family="' + fam + '" font-weight="' + (fam === "Fraunces" ? 900 : 600) + '" font-size="' + size + '" fill="' + fill + '"' + (extra ? " " + extra : "") + ">" + t + "</text>";
      }
      function rays(x, y, w, h, gap, len, col) {
        var d = "", i;
        for (i = 0; i < 5; i++) {
          var fx = x + (w * (i + 0.5)) / 5;
          d += "M" + n1(fx) + "," + n1(y - gap) + " l0," + -len + " M" + n1(fx) + "," + n1(y + h + gap) + " l0," + len + " ";
        }
        d += "M" + n1(x - gap) + "," + n1(y + h / 2) + " l" + -len + ",0 M" + n1(x + w + gap) + "," + n1(y + h / 2) + " l" + len + ",0";
        return '<path d="' + d + '" stroke="' + col + '" stroke-width="5" stroke-linecap="round"/>';
      }
      // A two-segment limb as one polygon with a mitred elbow (as KIT's humans' limbs).
      function nrm(a, b) { var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.sqrt(dx * dx + dy * dy) || 1; return [-dy / L, dx / L]; }
      function limbPts(p0, p1, p2, w0, w1, w2) {
        var nA = nrm(p0, p1), nB = nrm(p1, p2), sx = nA[0] + nB[0], sy = nA[1] + nB[1], qq = sx * sx + sy * sy;
        function side(k) {
          var mid = qq > 0.6 ? [[p1[0] + (k * sx * w1) / qq, p1[1] + (k * sy * w1) / qq]]
            : [[p1[0] + (k * nA[0] * w1) / 2, p1[1] + (k * nA[1] * w1) / 2], [p1[0] + (k * nB[0] * w1) / 2, p1[1] + (k * nB[1] * w1) / 2]];
          return [[p0[0] + (k * nA[0] * w0) / 2, p0[1] + (k * nA[1] * w0) / 2]].concat(mid, [[p2[0] + (k * nB[0] * w2) / 2, p2[1] + (k * nB[1] * w2) / 2]]);
        }
        return side(1).concat(side(-1).reverse());
      }
      function bar(a, b, w) { var n = nrm(a, b), h = w / 2; return [[a[0] + n[0] * h, a[1] + n[1] * h], [b[0] + n[0] * h, b[1] + n[1] * h], [b[0] - n[0] * h, b[1] - n[1] * h], [a[0] - n[0] * h, a[1] - n[1] * h]]; }

      // The straitjacket (shared spec with orderly-door-slot): the arms crossed over the chest in long cream canvas
      // sleeves, a canvas body over the shirt, two navy straps with mustard buckles, halftone dots on the right third.
      // Drawn in the person's units for options o, between the body and the chest light (the arms are taken out).
      function jacket(o, jid) {
        var R = KIT.rig(o), T = R.shoulder[0][1] - 4, hy = R.hipY, w = 24 * R.build.tw;
        var body = [[-w - 1.5, T + 1], [-w + 4, T - 3.5], [-6, T - 4.5], [6, T - 4.5], [w - 4, T - 3.5], [w + 1.5, T + 1], [w + 0.5, T + 30], [16, hy - 2], [16.5, hy + 3.5], [-16.5, hy + 3.5], [-16, hy - 2], [-w - 0.5, T + 30]];
        var sl = limbPts([-w + 3, T + 2], [-w - 1.5, T + 30], [w + 2.5, T + 13], 11, 10.5, 9);
        var sr = limbPts([w - 3, T + 2], [w + 1.5, T + 26], [-w - 2.5, T + 12], 11, 10.5, 9);
        var cuffL = bar([w - 2, T + 14.6], [w + 2.5, T + 13], 9.4), cuffR = bar([-w + 2, T + 13.4], [-w - 2.5, T + 12], 9.4);
        var strap = function (y, x0, x1) { return '<rect x="' + n1(x0) + '" y="' + n1(y) + '" width="' + n1(x1 - x0) + '" height="4.6" fill="' + INK + '"/>'; };
        var buckle = function (x, y) { return '<rect x="' + n1(x) + '" y="' + n1(y - 1.4) + '" width="7" height="7.4" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="1.4"/><path d="M' + n1(x + 3.5) + "," + n1(y - 0.4) + " v5.4" + '" stroke="' + INK + '" stroke-width="1.2"/>'; };
        var collar = [[-7.5, T - 5.5], [7.5, T - 5.5], [6.5, T - 1], [-6.5, T - 1]];
        var all = [pd(body), pd(sl), pd(sr)];
        var shade = '<defs><pattern id="' + jid + 'd" width="3.6" height="3.6" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1" fill="' + INK + '"/></pattern>' +
          '<clipPath id="' + jid + 'c">' + all.map(function (d) { return '<path d="' + d + '"/>'; }).join("") + "</clipPath></defs>" +
          '<rect x="' + n1(w / 3) + '" y="' + n1(T - 8) + '" width="40" height="80" fill="url(#' + jid + 'd)" opacity="0.28" clip-path="url(#' + jid + 'c)"/>';
        return '<g class="jacket">' + sol([pd(body)], CAN) + sol([pd(collar)], "#E9E1CC", 3) + strap(T + 4.5, -w - 3, w + 3) + buckle(-3, T + 4.5) +
          sol([pd(sl)], CAN) + sol([pd(cuffL)], INK, 2) + sol([pd(sr)], CAN) + sol([pd(cuffR)], INK, 2) + shade +
          strap(hy - 9, -17.5, 17.5) + buckle(3, hy - 9) + "</g>";
      }
      // The patient in a mood: no arms (the jacket holds them), the jacket on; worried also looks down.
      function patient(mood, jid) {
        var o = cp(PAT, { mood: mood }), m = KIT.person(o).replace(/<g class="arm-[lr]">[\s\S]*?<\/g><\/g>/g, "");
        m = m.replace('<circle class="chest-light"', jacket(o, jid) + '<circle class="chest-light"');
        if (mood === "worried") m = m.replace(/(<circle class="pupil" cx="[-\d.]+" cy=")([-\d.]+)/g, function (x, a, b) { return a + (+b + 1.4).toFixed(1); });
        return m;
      }

      // The host: the Politician, grinning, a star-tipped pointer in his left hand, his right hand by the buzzer. His
      // arms only turn about the shoulders, so every pose is a rotation of the rest pose (ROT, in degrees).
      var HS = GS.host[1], HX = GS.host[0], HY = GS.floor - 100 * HS;
      var HOST = KIT.castOpts("politician", { arms: [[-14, -4], [-8, 22]], mood: "grin" }), HR = KIT.rig(HOST);
      var SL = HR.shoulder[0], SR = HR.shoulder[1], HAND = HR.hand[0];
      function units(p) { return [(p[0] - HX) / HS, (p[1] - HY) / HS]; }
      function deg(v) { return (Math.atan2(v[1], v[0]) * 180) / Math.PI; }
      function wrap180(a) { while (a > 180) a -= 360; while (a <= -180) a += 360; return a; }
      // The pointer runs on from the forearm (4 degrees left of down); its tip touches each card's lower inside corner
      // area, at one distance R from the shoulder (card 2's contact sets R, card 1's mirrors it about the shoulder).
      var CK = GS.ck, cardY = GS.cards[0][1] + 184 * CK;
      var c2 = units([GS.cards[1][0] + 46 * CK, cardY]), c1 = [2 * SL[0] - c2[0], c2[1]];
      var R2 = Math.hypot(c2[0] - SL[0], c2[1] - SL[1]), dirS = [Math.sin((-4 * Math.PI) / 180), Math.cos((-4 * Math.PI) / 180)];
      var hv = [HAND[0] - SL[0], HAND[1] - SL[1]], bq = dirS[0] * hv[0] + dirS[1] * hv[1], cq = hv[0] * hv[0] + hv[1] * hv[1] - R2 * R2;
      var LS = -bq + Math.sqrt(bq * bq - cq), TIP = [HAND[0] + dirS[0] * LS, HAND[1] + dirS[1] * LS];
      var rest = deg([TIP[0] - SL[0], TIP[1] - SL[1]]);
      // The buzzer's dome top sits where the right hand lands when the arm turns 32 degrees from rest.
      var SLAP = -32, rr = (SLAP * Math.PI) / 180, hr0 = [HR.hand[1][0] - SR[0], HR.hand[1][1] - SR[1]];
      var BZ = [SR[0] + hr0[0] * Math.cos(rr) - hr0[1] * Math.sin(rr), SR[1] + hr0[0] * Math.sin(rr) + hr0[1] * Math.cos(rr)];
      var ROT = { tap1: wrap180(deg([c1[0] - SL[0], c1[1] - SL[1]]) - rest), tap2: wrap180(deg([c2[0] - SL[0], c2[1] - SL[1]]) - rest), raise: -150, slap: SLAP };
      var BUZZ = [HX + BZ[0] * HS, HY + BZ[1] * HS + 6 * HS];  // the dome's top (canvas), a hand's depth under the palm
      // Walker: the war bill that walks off card 2's pile (its own units, half a card unit each): from the pile's top
      // down to the card's bottom edge and along it to the right corner.
      var WALK = [329, 96];
      var FLAP = -3.2;

      function card(pid, i, x, y) {
        var base = '<rect x="0" y="0" width="330" height="210" rx="8" fill="' + CAN + '" stroke="' + INK + '" stroke-width="5"/>' +
          '<rect x="10" y="10" width="310" height="190" rx="4" fill="none" stroke="' + C.orange + '" stroke-width="2.4"/>';
        var back = '<rect x="0" y="0" width="330" height="210" rx="8" fill="' + C.orange + '" stroke="' + INK + '" stroke-width="5"/>' +
          '<rect x="12" y="12" width="306" height="186" rx="5" fill="none" stroke="' + C.cream + '" stroke-width="3"/>' +
          KIT.star(46, 44, 15, C.yellow) + KIT.star(286, 168, 13, C.yellow) + KIT.star(290, 42, 8, C.cream) + KIT.star(42, 170, 8, C.cream) +
          txt(165, 160, 150, "Fraunces", INK, "?", 'text-anchor="middle"') +
          '<circle cx="268" cy="104" r="22" fill="' + C.cream + '" stroke="' + INK + '" stroke-width="3"/>' + txt(268, 116, 32, "Fraunces", INK, String(i + 1), 'text-anchor="middle"');
        var line = function (yy, size, t) { return txt(22, yy, size, "Oswald", INK, t, 'letter-spacing="0.5"'); };
        var face;
        if (i === 0) {
          // a little human with a warning light on every part (biology, all of it, broken at once)
          var lights = [[2, -64], [-9, -22], [11, -12], [-3, 2], [-14, 20], [9, 26], [-6, 58], [9, 74], [-20, -6], [21, 4]].map(function (p) {
            return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="6" fill="' + C.war + '" stroke="' + INK + '" stroke-width="2.4"/>';
          }).join("");
          face = base + line(56, 30, "DEBUG ALL OF") + line(96, 30, "HUMAN BIOLOGY") + line(136, 30, "AT ONCE") +
            at(266, 121, 0.75, KIT.person({ tone: 0, outfit: "shirt", color: 1, plain: true, mood: "worried", arms: [[-40, -30], [40, 30]] }) + '<g id="' + pid + '-lights">' + lights + "</g>");
        } else {
          var flat = function (bx, by) {
            return at(bx, by, 0.62, '<rect x="-48" y="-25" width="96" height="50" rx="4" fill="' + C.money + '" stroke="' + INK + '" stroke-width="4"/>' +
              '<rect x="-41" y="-18" width="82" height="36" rx="2" fill="none" stroke="' + C.moneyDark + '" stroke-width="2"/>' +
              '<ellipse cx="0" cy="0" rx="13" ry="15" fill="' + C.paper + '" stroke="' + C.moneyDark + '" stroke-width="2"/>' + KIT.moneySeal("war", 31, 0, 10));
          };
          var pile = flat(78, 190) + flat(73, 178) + flat(80, 166) + flat(76, 154);
          // the walker: two drawings (legs apart, legs crossed) swapped as it steps
          var walker = at(76, 124, 0.62, '<g id="' + pid + '-walker"><g id="' + pid + '-walk-a">' + KIT.money("war", 0) + '</g><g id="' + pid + '-walk-b" opacity="0">' + KIT.money("war", 1) + "</g></g>");
          face = base + line(44, 25, "GIVE 1% FEWER PAPERS") + line(74, 25, "TO MURDER-MACHINE") + line(104, 25, "BUILDERS") + pile + walker;
        }
        return at(x, y, CK, '<g id="' + pid + "-card" + i + '"><g id="' + pid + "-card" + i + '-back">' + back + '</g><g id="' + pid + "-card" + i + '-face" opacity="0">' + face + "</g></g>");
      }
      function lamp(pid, i, x, y) {
        var L = GS.lamp, w = L[0], h = L[1], t = i ? "INSANE" : "SANE", col = i ? C.war : C.med;
        var box = function (fill, tc, rule) {
          return '<rect x="0" y="0" width="' + w + '" height="' + h + '" rx="12" fill="' + fill + '" stroke="' + INK + '" stroke-width="5"/>' +
            '<rect x="7" y="7" width="' + (w - 14) + '" height="' + (h - 14) + '" rx="7" fill="none" stroke="' + rule + '" stroke-width="2"/>' +
            txt(w / 2, h / 2 + L[2] * 0.36, L[2], "Fraunces", tc, t, 'text-anchor="middle" letter-spacing="2"');
        };
        return at(x, y, 1, box(C.navy, "#3E4A68", "#3E4A68") + '<g id="' + pid + "-lamp" + i + '-on" opacity="0">' + rays(0, 0, w, h, 10, 16, C.yellow) + box(col, C.cream, C.cream) + "</g>");
      }
      function marquee(pid) {
        var M = GS.marq, x = M[0], y = M[1], w = M[2], h = M[3], fs = M[4], i, n;
        var bulbsOff = "", bulbsA = "", bulbsB = "", pts = [], step = V ? 44 : 42, inset = 15;
        var nx = Math.round((w - 2 * inset) / step), ny = Math.round((h - 2 * inset) / step);
        for (i = 0; i < nx; i++) pts.push([x + inset + ((w - 2 * inset) * i) / nx, y + inset]);
        for (i = 0; i < ny; i++) pts.push([x + w - inset, y + inset + ((h - 2 * inset) * i) / ny]);
        for (i = nx; i > 0; i--) pts.push([x + inset + ((w - 2 * inset) * i) / nx, y + h - inset]);
        for (i = ny; i > 0; i--) pts.push([x + inset, y + inset + ((h - 2 * inset) * i) / ny]);
        pts.forEach(function (p, k) {
          bulbsOff += '<circle cx="' + n1(p[0]) + '" cy="' + n1(p[1]) + '" r="7.5" fill="' + C.tan + '" stroke="' + INK + '" stroke-width="2.5"/>';
          var lit = '<circle cx="' + n1(p[0]) + '" cy="' + n1(p[1]) + '" r="11" fill="' + C.yellow + '" opacity="0.45"/><circle cx="' + n1(p[0]) + '" cy="' + n1(p[1]) + '" r="7.5" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="2.5"/>';
          if (k % 2) bulbsB += lit; else bulbsA += lit;
        });
        var span = function (t, col) { return '<tspan fill="' + col + '">' + t + "</tspan>"; };
        var words = V ? [span("SANE", "#1F6E68") + span(" OR", INK), span("INSANE", C.war) + span("?", INK)]
          : [span("SANE", "#1F6E68") + span(" OR ", INK) + span("INSANE", C.war) + span("?", INK)];
        n = words.length;
        var lines = words.map(function (t, k) {
          var by = y + h / 2 + fs * 0.34 + (k - (n - 1) / 2) * fs * 1.0;
          return '<text x="' + n1(x + w / 2) + '" y="' + n1(by) + '" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="' + fs + '">' + t + "</text>";
        }).join("");
        return '<rect x="' + (x + 8) + '" y="' + (y + 10) + '" width="' + w + '" height="' + h + '" rx="16" fill="' + INK + '" opacity="0.85"/>' +
          '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="16" fill="' + CAN + '" stroke="' + INK + '" stroke-width="7"/>' +
          '<rect x="' + (x + 30) + '" y="' + (y + 30) + '" width="' + (w - 60) + '" height="' + (h - 60) + '" rx="8" fill="none" stroke="' + C.war + '" stroke-width="2.5"/>' +
          bulbsOff + '<g id="' + pid + '-bulbs-a">' + bulbsA + '</g><g id="' + pid + '-bulbs-b" opacity="0">' + bulbsB + "</g>" + lines;
      }
      function applause(pid) {
        var S = GS.sign, x = S[0], y = S[1], w = S[2], h = S[3];

        tl.set(g("bulbs-a"), { opacity: n % 2 ? 1 : 0 }, tb);
        tl.set(g("bulbs-b"), { opacity: n % 2 ? 0 : 1 }, tb);
      }
      tl.set(g("bulbs-a"), { opacity: 1 }, D - 0.02);
      tl.set(g("bulbs-b"), { opacity: 0 }, D - 0.02);

      // A card flip: it narrows to its edge, turns over, and opens on its face (a small overshoot).
      function flip(i, t) {
        var c = g("card" + i);
        tl.fromTo(c, { scaleX: 1 }, { scaleX: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, t);
        swap(g("card" + i + "-back"), g("card" + i + "-face"), t + 0.12);
        tl.to(c, { scaleX: 1, duration: 0.2, ease: "back.out(2.2)" }, t + 0.12);
      }
      // "That:": the host swings his pointer up to card 1 (the whoosh) and taps it over; then back to rest.
      var t0 = cue("That:");
      tl.fromTo(armL, { rotation: 0 }, { rotation: ROT.tap1, duration: 0.2, ease: "power2.out" }, t0 + 0.02);
      tl.to(armL, { rotation: ROT.tap1 - 5, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut" }, t0 + 0.22);
      flip(0, t0 + 0.26);
      tl.to(armL, { rotation: 0, duration: 0.3, ease: "power2.inOut" }, t0 + 0.6);

      // "sane.": the teal SANE lamp (the ding), confetti, the APPLAUSE sign, and the crowd throws its arms up.
      var tS = cue("sane.");
      [[0, 1], [0.1, 0], [0.16, 1], [0.24, 0], [0.3, 1]].forEach(function (k) { tl.set(g("lamp0-on"), { opacity: k[1] }, tS + k[0]); });
      tl.set(g("lamp0-on"), { opacity: 0 }, cue("Give") - 0.1);
      function applaud(t, t1) {
        for (var a = 0; t + a < t1; a += 0.3) {
          tl.set(g("applause-on"), { opacity: 1 }, t + a);
          if (t + a + 0.18 < t1) tl.set(g("applause-on"), { opacity: 0 }, t + a + 0.18);
        }
      }
      applaud(tS + 0.05, cue("Give") + 0.6);
      tl.set(g("applause-on"), { opacity: 0 }, cue("Give") + 0.62);
      function confetti(b, t, fall, spread) {
        var pcs = document.querySelectorAll("." + ID + "-conf" + b), floor = GS.floor - 20;
        Array.prototype.forEach.call(pcs, function (el, k) {
          var y0 = +el.parentNode.getAttribute("transform").match(/,([-\d.]+)\)/)[1], dt = (+el.getAttribute("data-r") / 4) * spread, dur = fall * (0.85 + ((k * 37) % 11) / 30);
          var dx = ((k * 53) % 21) - 10, spin = (((k * 29) % 13) - 6) * 70;
          tl.fromTo(el, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: dx * 4, y: floor - y0, rotation: spin, duration: dur, ease: "power1.in", immediateRender: false }, t + dt);
          tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t + dt + dur - 0.2);
        });
        gsap.set(pcs, { opacity: 0 });
      }
      confetti(0, tS + 0.02, 1.7, 0.6);

      // The crowd: arms up a beat after a verdict, then (after "sane.") back to clapping. The Weapons Maker keeps
      // cradling his missile; on "murder" he clutches it, sweating, until the patient is gone.
      var folks = [], j = 0;
      GS.tiers.forEach(function (tier) { tier.seats.forEach(function (seat) { folks.push({ j: j, wm: seat[1] === "wm", o: seat[1] }); j++; }); });
      folks.forEach(function (f) {
        var a = g("folk" + f.j + "-a"), b = g("folk" + f.j + "-b"), w = g("folk" + f.j);
        if (f.wm) return;
        swap(a, b, tS + 0.12);
        swap(b, a, cue("Give") - 0.05);
        swap(a, b, cue("insane.") + 0.5);
        tl.fromTo(w, { y: 0 }, { y: -8, duration: 0.14, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, tS + 0.12 + f.j * 0.03);
        tl.fromTo(w, { y: 0 }, { y: -8, duration: 0.14, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, cue("insane.") + 0.5 + f.j * 0.03);
        // clapping: the hands come apart and back together
        var arms = a.querySelectorAll(".arm-l, .arm-r"), r = KIT.rig(cp(FOLKS[f.o], { arms: [[30, 145], [-30, -145]] }));
        gsap.set(arms[0], { svgOrigin: r.shoulder[0][0] + " " + r.shoulder[0][1] });
        gsap.set(arms[1], { svgOrigin: r.shoulder[1][0] + " " + r.shoulder[1][1] });
        var tc = cue("Give");
        tl.fromTo(arms[0], { rotation: 0 }, { rotation: 14, duration: 0.11, yoyo: true, repeat: 7, ease: "sine.inOut", immediateRender: false }, tc + f.j * 0.02);
        tl.fromTo(arms[1], { rotation: 0 }, { rotation: -14, duration: 0.11, yoyo: true, repeat: 7, ease: "sine.inOut", immediateRender: false }, tc + f.j * 0.02);
      });

      // "Give": the pointer swings up to card 2 and taps it over (the whoosh); the patient beams and bounces: his idea.
      var tG = cue("Give");
      tl.to(armL, { rotation: ROT.tap2, duration: 0.24, ease: "power2.out" }, tG - 0.28);
      tl.to(armL, { rotation: ROT.tap2 + 5, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut" }, tG - 0.04);
      flip(1, tG);
      tl.to(armL, { rotation: 0, duration: 0.32, ease: "power2.inOut" }, tG + 0.45);
      swap(g("pat-a"), g("pat-b"), tG + 0.3);
      tl.fromTo(g("pat-bob"), { y: 0 }, { y: -9, duration: 0.13, yoyo: true, repeat: 7, ease: "sine.out", immediateRender: false }, tG + 0.32);
      // "one percent fewer papers": the top war bill hops off its pile and walks away along the card, step by step.
      var tw = cue("one");
      tl.fromTo(g("walker"), { x: 0, y: 0 }, { x: 34, y: -40, duration: 0.18, ease: "power2.out", immediateRender: false }, tw + 0.1);
      tl.to(g("walker"), { x: 74, y: WALK[1], duration: 0.22, ease: "power2.in" }, tw + 0.28);
      for (var st = 0; st < 8; st++) {
        var ts = tw + 0.5 + st * 0.16;
        tl.to(g("walker"), { x: 74 + ((WALK[0] - 74) * (st + 1)) / 8, duration: 0.16, ease: "none" }, ts);
        tl.set(g("walk-a"), { opacity: st % 2 ? 1 : 0 }, ts);
        tl.set(g("walk-b"), { opacity: st % 2 ? 0 : 1 }, ts);
      }
      tl.set(g("walk-a"), { opacity: 1 }, tw + 0.5 + 8 * 0.16);
      tl.set(g("walk-b"), { opacity: 0 }, tw + 0.5 + 8 * 0.16);

      // "murder": in the front row the Weapons Maker clutches his missile tighter, sweating, until the patient drops.
      var wm = folks.filter(function (f) { return f.wm; })[0], tM = cue("murder"), tI = cue("insane.");
      var wmA = g("folk" + wm.j + "-a"), wmB = g("folk" + wm.j + "-b");
      swap(wmA, wmB, tM);
      tl.fromTo(g("folk" + wm.j), { x: 0 }, { x: 3, duration: 0.05, yoyo: true, repeat: 11, ease: "none", immediateRender: false }, tM);
      show(g("sweat"), tM + 0.15);
      [0, 1].forEach(function (k) {
        tl.fromTo(g("drop" + k), { x: 0, y: 0, opacity: 1 }, { x: k ? 16 : -16, y: 22, opacity: 0, duration: 0.5, ease: "power1.in", immediateRender: false }, tM + 0.15 + k * 0.35);
        tl.fromTo(g("drop" + k), { x: 0, y: 0, opacity: 1 }, { x: k ? 16 : -16, y: 22, opacity: 0, duration: 0.5, ease: "power1.in", immediateRender: false }, tM + 0.95 + k * 0.3);
      });
      hide(g("sweat"), tI + 0.5);
      swap(wmB, wmA, tI + 0.5);

      // "insane.": the host's hand goes up (before the word), then slaps the buzzer on it (the zap): the dome squashes,
      // sparks fly, INSANE flashes red and stays lit, the frame flashes red.
      tl.to(armR, { rotation: ROT.raise, duration: 0.3, ease: "back.out(1.6)" }, tI - 0.62);
      tl.to(armR, { rotation: ROT.slap, duration: 0.11, ease: "power3.in" }, tI - 0.11);
      tl.fromTo(g("dome"), { scaleY: 1, scaleX: 1 }, { scaleY: 0.55, scaleX: 1.15, duration: 0.05, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, tI);
      tl.fromTo(g("host"), { y: 0 }, { y: 4, duration: 0.05, yoyo: true, repeat: 1, ease: "power1.out", immediateRender: false }, tI);
      [[0, 1], [0.06, 0], [0.12, 1], [0.18, 0], [0.24, 1]].forEach(function (k) { tl.set(g("zap"), { opacity: k[1] }, tI + k[0]); });
      tl.set(g("zap"), { opacity: 0 }, tI + 0.36);
      [[0, 1], [0.08, 0], [0.16, 1], [0.24, 0], [0.32, 1]].forEach(function (k) { tl.set(g("lamp1-on"), { opacity: k[1] }, tI + k[0]); });
      tl.fromTo(q("flash"), { opacity: 0 }, { opacity: 0.24, duration: 0.03, immediateRender: false }, tI);
      tl.to(q("flash"), { opacity: 0, duration: 0.22, ease: "power1.in" }, tI + 0.05);
      // The patient startles (worried), then the lid drops open under him (the clank): he hangs in the air a beat,
      // looking down, and falls (the slide whistle). His eyes stay up for a blink, then follow him down.
      swap(g("pat-b"), g("pat-c"), tI + 0.04);
      tl.fromTo(g("pat-bob"), { y: 0 }, { y: -16, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, tI + 0.04);
      var tL = tI + 0.3, tF = tI + 0.45;
      hide(g("lid"), tL);
      show(g("hole"), tL);
      show(g("flapw"), tL);
      tl.fromTo(g("flap"), { scaleY: 1 }, { scaleY: FLAP, duration: 0.12, ease: "power2.in", immediateRender: false }, tL);
      tl.to(g("flap"), { keyframes: [{ scaleY: FLAP * 0.86, duration: 0.1 }, { scaleY: FLAP * 1.05, duration: 0.1 }, { scaleY: FLAP * 0.96, duration: 0.1 }, { scaleY: FLAP, duration: 0.12 }] }, tL + 0.12);
      tl.fromTo(g("pat"), { y: 0 }, { y: 420, duration: 0.3, ease: "power2.in", immediateRender: false }, tF);
      hide(g("pat"), tF + 0.3);
      var pupils = g("pat-c").querySelectorAll(".eye");
      tl.set(pupils, { opacity: 0 }, tF);
      show(g("eyes"), tF);
      var PRg = KIT.rig(PAT);
      gsap.set(g("eyes"), { svgOrigin: n1(PRg.head[0] + 4 * PRg.hs) + " " + n1(PRg.head[1] - 4 * PRg.hs) });
      tl.fromTo(g("eyes"), { scaleY: 1 }, { scaleY: 0.1, duration: 0.05, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, tF + 0.18);
      tl.fromTo(g("eyes"), { y: 0 }, { y: 360, duration: 0.14, ease: "power2.in", immediateRender: false }, tF + 0.34);
      hide(g("eyes"), tF + 0.48);
      show(g("speed"), tF + 0.17);
      hide(g("speed"), tF + 0.42);
      // dust puffs out of the hole
      tl.fromTo(g("puff"), { opacity: 0, scale: 0.3, y: 0 }, { opacity: 1, scale: 1, y: -18, duration: 0.2, ease: "power2.out", immediateRender: false }, tF + 0.42);
      tl.to(g("puff"), { opacity: 0, scale: 1.3, y: -40, duration: 0.35, ease: "power1.in" }, tF + 0.66);

      // The show celebrates this one too: confetti, APPLAUSE, the crowd's arms up; the host winks at the camera.
      confetti(1, tI + 0.48, 0.75, 0.15);
      applaud(tI + 0.5, D - 0.3);
      tl.set(g("applause-on"), { opacity: 1 }, D - 0.3);
      var wink = g("host").querySelectorAll(".eye")[1];
      gsap.set(wink, { svgOrigin: "10.8 -4" });
      tl.fromTo(wink, { scaleY: 1 }, { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, D - 0.62);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
