       "last" → the page turns: LAST HUMAN TO SUGGEST UNIVERSAL LOVE AND PEACE:. "nailed" → the answer types itself in
       and the file closes slowly; HOLD (nothing else moves, no sound) until "So" → the mug floats up for a long sip.
       "light-years" → the mug comes down (thunk), she points at the DISTANCE FROM EARTH gauge on SEVERAL (tick).
       after "away." → the office lurches: the needle swings to MORE, the mug skids, the sun sinks, the screen goes to

  </style>
  <div id="root" data-composition-id="diagnostic-criteria" data-width="1920" data-height="1080" data-start="0" data-duration="15.76">
    <div id="diagnostic-criteria-cam">

  <script>
    (function () {
      var ID = "diagnostic-criteria";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, O = KIT.OFFICE;

      // ── The game show set. Copied into diagnostic-criteria.html, whose wall screen starts on this scene's last frame:
      // keep the two copies the same. gsArt(pid) draws the set over the paper, every moving part with the id pid-<name>;
      // gsEnd(pid) sets the last frame (both cards up, INSANE lit, the lid hanging open under the empty pedestal, the

      var GS = V
        ? { floor: 1330, strip: [1317, 1346], marq: [60, 70, 660, 236, 96], sign: [80, 336, 300, 58, 36],

            board: [716, 172, 820, 318], cards: [[742, 188], [1164, 188]], ck: 1.06, lamps: [[782, 428], [1204, 428]], lamp: [270, 52, 40],
            host: [1140, 2.35], pat: [600, 2.35], ped: [600, 800, 98, 19], conf: [70, 1580],
            tiers: [{ rail: 612, s: 1.35, seats: [[105, 4], [225, 5], [345, 6]] }, { rail: 782, s: 1.55, seats: [[115, 0], [240, 1], [372, "wm"]] }] };

      // THE PATIENT (the part's spine), looking at the host.
      var PAT = { tone: 1, outfit: "shirt", color: 3, look: "right" };
      var CAN = "#FBF6E6", INK = C.line;
      function cp(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }

      function sol(ds, fill, sw) {
        return ds.map(function (d) { return '<path d="' + d + '" fill="' + INK + '" stroke="' + INK + '" stroke-width="' + (sw || 4.4) + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }).join("") +

      }

          var fx = x + (w * (i + 0.5)) / 5;

        return '<path d="' + d + '" stroke="' + col + '" stroke-width="5" stroke-linecap="round"/>';
      }
      // A two-segment limb as one polygon with a mitred elbow (as KIT's humans' limbs).
      function nrm(a, b) { var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.sqrt(dx * dx + dy * dy) || 1; return [-dy / L, dx / L]; }
      function limbPts(p0, p1, p2, w0, w1, w2) {
        var nA = nrm(p0, p1), nB = nrm(p1, p2), sx = nA[0] + nB[0], sy = nA[1] + nB[1], qq = sx * sx + sy * sy;
        function side(k) {
          var mid = qq > 0.6 ? [[p1[0] + (k * sx * w1) / qq, p1[1] + (k * sy * w1) / qq]]
            : [[p1[0] + (k * nA[0] * w1) / 2, p1[1] + (k * nA[1] * w1) / 2], [p1[0] + (k * nB[0] * w1) / 2, p1[1] + (k * nB[1] * w1) / 2]];
          return [[p0[0] + (k * nA[0] * w0) / 2, p0[1] + (k * nA[1] * w0) / 2]].concat(mid, [[p2[0] + (k * nB[0] * w2) / 2, p2[1] + (k * nB[1] * w2) / 2]]);
        }
        return side(1).concat(side(-1).reverse());
      }
      function bar(a, b, w) { var n = nrm(a, b), h = w / 2; return [[a[0] + n[0] * h, a[1] + n[1] * h], [b[0] + n[0] * h, b[1] + n[1] * h], [b[0] - n[0] * h, b[1] - n[1] * h], [a[0] - n[0] * h, a[1] - n[1] * h]]; }

      // The straitjacket (shared spec with orderly-door-slot): the arms crossed over the chest in long cream canvas
      // sleeves, a canvas body over the shirt, two navy straps with mustard buckles, halftone dots on the right third.
      // Drawn in the person's units for options o, between the body and the chest light (the arms are taken out).
      function jacket(o, jid) {
        var R = KIT.rig(o), T = R.shoulder[0][1] - 4, hy = R.hipY, w = 24 * R.build.tw;
        var body = [[-w - 1.5, T + 1], [-w + 4, T - 3.5], [-6, T - 4.5], [6, T - 4.5], [w - 4, T - 3.5], [w + 1.5, T + 1], [w + 0.5, T + 30], [16, hy - 2], [16.5, hy + 3.5], [-16.5, hy + 3.5], [-16, hy - 2], [-w - 0.5, T + 30]];
        var sl = limbPts([-w + 3, T + 2], [-w - 1.5, T + 30], [w + 2.5, T + 13], 11, 10.5, 9);
        var sr = limbPts([w - 3, T + 2], [w + 1.5, T + 26], [-w - 2.5, T + 12], 11, 10.5, 9);
        var cuffL = bar([w - 2, T + 14.6], [w + 2.5, T + 13], 9.4), cuffR = bar([-w + 2, T + 13.4], [-w - 2.5, T + 12], 9.4);
        var strap = function (y, x0, x1) { return '<rect x="' + n1(x0) + '" y="' + n1(y) + '" width="' + n1(x1 - x0) + '" height="4.6" fill="' + INK + '"/>'; };
        var buckle = function (x, y) { return '<rect x="' + n1(x) + '" y="' + n1(y - 1.4) + '" width="7" height="7.4" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="1.4"/><path d="M' + n1(x + 3.5) + "," + n1(y - 0.4) + " v5.4" + '" stroke="' + INK + '" stroke-width="1.2"/>'; };
        var collar = [[-7.5, T - 5.5], [7.5, T - 5.5], [6.5, T - 1], [-6.5, T - 1]];
        var all = [pd(body), pd(sl), pd(sr)];
        var shade = '<defs><pattern id="' + jid + 'd" width="3.6" height="3.6" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1" fill="' + INK + '"/></pattern>' +

          '<rect x="' + n1(w / 3) + '" y="' + n1(T - 8) + '" width="40" height="80" fill="url(#' + jid + 'd)" opacity="0.28" clip-path="url(#' + jid + 'c)"/>';
        return '<g class="jacket">' + sol([pd(body)], CAN) + sol([pd(collar)], "#E9E1CC", 3) + strap(T + 4.5, -w - 3, w + 3) + buckle(-3, T + 4.5) +

          strap(hy - 9, -17.5, 17.5) + buckle(3, hy - 9) + "</g>";
      }
      // The patient in a mood: no arms (the jacket holds them), the jacket on; worried also looks down.
      function patient(mood, jid) {
        var o = cp(PAT, { mood: mood }), m = KIT.person(o).replace(/<g class="arm-[lr]">[\s\S]*?<\/g><\/g>/g, "");

        return m;
      }

      // The host: the Politician, grinning, a star-tipped pointer in his left hand, his right hand by the buzzer. His
      // arms only turn about the shoulders, so every pose is a rotation of the rest pose (ROT, in degrees).
      var HS = GS.host[1], HX = GS.host[0], HY = GS.floor - 100 * HS;
      var HOST = KIT.castOpts("politician", { arms: [[-14, -4], [-8, 22]], mood: "grin" }), HR = KIT.rig(HOST);
      var SL = HR.shoulder[0], SR = HR.shoulder[1], HAND = HR.hand[0];
      function units(p) { return [(p[0] - HX) / HS, (p[1] - HY) / HS]; }
      function deg(v) { return (Math.atan2(v[1], v[0]) * 180) / Math.PI; }
      function wrap180(a) { while (a > 180) a -= 360; while (a <= -180) a += 360; return a; }
      // The pointer runs on from the forearm (4 degrees left of down); its tip touches each card's lower inside corner
      // area, at one distance R from the shoulder (card 2's contact sets R, card 1's mirrors it about the shoulder).
      var CK = GS.ck, cardY = GS.cards[0][1] + 184 * CK;
      var c2 = units([GS.cards[1][0] + 46 * CK, cardY]), c1 = [2 * SL[0] - c2[0], c2[1]];
      var R2 = Math.hypot(c2[0] - SL[0], c2[1] - SL[1]), dirS = [Math.sin((-4 * Math.PI) / 180), Math.cos((-4 * Math.PI) / 180)];
      var hv = [HAND[0] - SL[0], HAND[1] - SL[1]], bq = dirS[0] * hv[0] + dirS[1] * hv[1], cq = hv[0] * hv[0] + hv[1] * hv[1] - R2 * R2;
      var LS = -bq + Math.sqrt(bq * bq - cq), TIP = [HAND[0] + dirS[0] * LS, HAND[1] + dirS[1] * LS];
      var rest = deg([TIP[0] - SL[0], TIP[1] - SL[1]]);
      // The buzzer's dome top sits where the right hand lands when the arm turns 32 degrees from rest.
      var SLAP = -32, rr = (SLAP * Math.PI) / 180, hr0 = [HR.hand[1][0] - SR[0], HR.hand[1][1] - SR[1]];
      var BZ = [SR[0] + hr0[0] * Math.cos(rr) - hr0[1] * Math.sin(rr), SR[1] + hr0[0] * Math.sin(rr) + hr0[1] * Math.cos(rr)];
      var ROT = { tap1: wrap180(deg([c1[0] - SL[0], c1[1] - SL[1]]) - rest), tap2: wrap180(deg([c2[0] - SL[0], c2[1] - SL[1]]) - rest), raise: -150, slap: SLAP };
      var BUZZ = [HX + BZ[0] * HS, HY + BZ[1] * HS + 6 * HS];  // the dome's top (canvas), a hand's depth under the palm
      // Walker: the war bill that walks off card 2's pile (its own units, half a card unit each): from the pile's top
      // down to the card's bottom edge and along it to the right corner.
      var WALK = [329, 96];
      var FLAP = -3.2;

      function card(pid, i, x, y) {
        var base = '<rect x="0" y="0" width="330" height="210" rx="8" fill="' + CAN + '" stroke="' + INK + '" stroke-width="5"/>' +
          '<rect x="10" y="10" width="310" height="190" rx="4" fill="none" stroke="' + C.orange + '" stroke-width="2.4"/>';
        var back = '<rect x="0" y="0" width="330" height="210" rx="8" fill="' + C.orange + '" stroke="' + INK + '" stroke-width="5"/>' +

          KIT.star(46, 44, 15, C.yellow) + KIT.star(286, 168, 13, C.yellow) + KIT.star(290, 42, 8, C.cream) + KIT.star(42, 170, 8, C.cream) +

        var line = function (yy, size, t) { return txt(22, yy, size, "Oswald", INK, t, 'letter-spacing="0.5"'); };
        var face;
        if (i === 0) {
          // a little human with a warning light on every part (biology, all of it, broken at once)
          var lights = [[2, -64], [-9, -22], [11, -12], [-3, 2], [-14, 20], [9, 26], [-6, 58], [9, 74], [-20, -6], [21, 4]].map(function (p) {
            return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="6" fill="' + C.war + '" stroke="' + INK + '" stroke-width="2.4"/>';
          }).join("");
          face = base + line(56, 30, "DEBUG ALL OF") + line(96, 30, "HUMAN BIOLOGY") + line(136, 30, "AT ONCE") +
            at(266, 121, 0.75, KIT.person({ tone: 0, outfit: "shirt", color: 1, plain: true, mood: "worried", arms: [[-40, -30], [40, 30]] }) + '<g id="' + pid + '-lights">' + lights + "</g>");

              '<ellipse cx="0" cy="0" rx="13" ry="15" fill="' + C.paper + '" stroke="' + C.moneyDark + '" stroke-width="2"/>' + KIT.moneySeal("war", 31, 0, 10));

      function lamp(pid, i, x, y) {

      }
      function marquee(pid) {
        var M = GS.marq, x = M[0], y = M[1], w = M[2], h = M[3], fs = M[4], i, n;
        var bulbsOff = "", bulbsA = "", bulbsB = "", pts = [], step = V ? 44 : 42, inset = 15;
        var nx = Math.round((w - 2 * inset) / step), ny = Math.round((h - 2 * inset) / step);
        for (i = 0; i < nx; i++) pts.push([x + inset + ((w - 2 * inset) * i) / nx, y + inset]);
        for (i = 0; i < ny; i++) pts.push([x + w - inset, y + inset + ((h - 2 * inset) * i) / ny]);
        for (i = nx; i > 0; i--) pts.push([x + inset + ((w - 2 * inset) * i) / nx, y + h - inset]);
        for (i = ny; i > 0; i--) pts.push([x + inset, y + inset + ((h - 2 * inset) * i) / ny]);

        return '<rect x="' + (x + 8) + '" y="' + (y + 10) + '" width="' + w + '" height="' + h + '" rx="16" fill="' + INK + '" opacity="0.85"/>' +
          '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="16" fill="' + CAN + '" stroke="' + INK + '" stroke-width="7"/>' +
          '<rect x="' + (x + 30) + '" y="' + (y + 30) + '" width="' + (w - 60) + '" height="' + (h - 60) + '" rx="8" fill="none" stroke="' + C.war + '" stroke-width="2.5"/>' +
          bulbsOff + '<g id="' + pid + '-bulbs-a">' + bulbsA + '</g><g id="' + pid + '-bulbs-b" opacity="0">' + bulbsB + "</g>" + lines;
      }
      function applause(pid) {
