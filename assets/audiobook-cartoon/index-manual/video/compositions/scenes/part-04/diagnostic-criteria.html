<template id="diagnostic-criteria-template">
  <!-- diagnostic-criteria · collage host shot (Part 4, scene 7). "This": the man in the straitjacket plummets past the
       window behind her, still falling from the game show's trapdoor; she does not look. "criteria.": the case file on
       her ledge, DIRT: CASE #847. "universal love and peace.": an old woodcut of Jesus, arms open, rises out of it, the
       last human who said so. "nailed": the woodcut sinks slowly back into the file. HOLD: nothing moves until "So". "So":
       her coffee mug rises for a long sip; "light-years": down it comes. After "away.": the view slams back out into
       space: a giant brass telescope, the Earth a speck light-years off, and from the speck a butterfly net pokes up at
       it, stops short and droops. (Not drawn yet: the case file opening to its page; the woodcut rises out of the closed
       file instead.) -->

  <script src="assets/js/collage.js"></script>
  <script>
    var V = KIT.V, ID = "diagnostic-criteria", S = KIT.STUDIO, SZ = KIT.collage.SIZES;
    var cue = function (w, n) { return KIT.cue(ID, w, n); };
    var E = S.earth, FC = S.face, TOP = S.top;
    var L = V ? { fall: 930, fk: 0.9, file: [880, 0.5], mug: [600, 0.42], sip: [FC[0] + 170, FC[1] + 120] }
      : { fall: 1760, fk: 1.0, file: [1330, 0.58], mug: [1020, 0.45], sip: [FC[0] + 205, FC[1] + 110] };
    var FILE_H = 515 * L.file[1], ABOVE = [L.file[0], TOP - FILE_H - (V ? 110 : 120)];
    // the pull-back: the giant telescope (its objective lens at art [412, 44]) and the real Earth, a speck far off;
    // from the speck a butterfly net (its foot art [24.5, 365], its pole at -79.7 degrees in the art) pokes at it
    var TS = V ? { x: 540, y: 1000, k: 1.6 } : { x: 800, y: 600, k: 1.5 }, SPECK = V ? [960, 210] : [1750, 140];
    var LENS = [TS.x + (412 - 210.5) * TS.k, TS.y + (44 - 263.5) * TS.k];
    var ANG = Math.atan2(LENS[1] - SPECK[1], LENS[0] - SPECK[0]) * 180 / Math.PI, NK = V ? 0.75 : 0.8;
    var tN = cue("nailed"), tSo = cue("So"), tL = cue("light-years"), tA = cue("away.") + 0.3;
    KIT.collage({
      id: ID, seed: 417, host: true,
      cast: {
        faller: { art: "inmate-jacket", x: L.fall, y: -300, scale: L.fk, hidden: true },
        // the woodcut sits behind the file, so it sinks back into it
        jesus: { art: "jesus-woodcut", x: ABOVE[0], y: ABOVE[1], scale: V ? 0.45 : 0.55, hidden: true },
        file: { art: "case-file", x: L.file[0], y: TOP + 6, anchor: "bottom", pivot: "bottom", scale: L.file[1], hidden: true,
          label: [{ text: "DIRT", at: [186, 72], width: 190, size: 40 }, { text: "CASE #847", at: [186, 112], width: 190, size: 32 }] },

        scope: { art: "telescope", x: TS.x, y: TS.y, scale: TS.k, hidden: true },

      },
      beats: [
        // the contestant, still falling
        { on: "This", offset: 0.02, do: "show", who: "faller" },
        { on: "This", offset: 0.02, do: "drop", who: "faller", dur: 1.1, dist: V ? 2600 : 1800, spin: 300 },
        // the case file; the last one who suggested love and peace
        { on: "criteria.", do: "pop", who: "file", squash: true },
        { on: "universal", do: "pop", who: "jesus", squash: true },

        { at: tA, do: "wash", id: "space", color: "#0B0D1C", blend: "normal", opacity: 1, dur: 0.08, above: "mug" },
        { at: tA, do: "stamp", who: "scope", from: 2.6, shake: 5 },
        { at: tA + 0.12, do: "pop", who: "speck" },
        { at: -1, do: "move", who: "net", turn: ANG + 79.7, scale: 0.04, dur: 0.001 },
        { at: tA + 0.2, do: "show", who: "net" },
        { at: tA + 0.2, do: "move", who: "net", turn: ANG + 79.7, scale: 1, dur: 0.3, ease: "smooth" },
        { at: tA + 0.5, do: "move", who: "net", turn: ANG + 79.7 + (V ? -5 : 5), dur: 2 / 12 },
        { at: tA + 0.5 + 2 / 12, do: "move", who: "net", turn: ANG + 79.7 + (V ? 30 : -30), dur: 3 / 12, ease: "smooth" },
      ],
    });
  </script>
