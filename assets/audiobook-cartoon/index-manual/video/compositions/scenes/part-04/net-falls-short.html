<template id="net-falls-short-template">
  <!-- net-falls-short · host shot (KIT.studio), storyboards/part-04-institutionalize.md: the iris opens on Wishonia's
       face at her lectern (mug and case file on its top) and the camera pushes in slowly. On "committed." a butterfly
       net on a long tan pole swings in from the right edge, aimed at her; the pole runs out a few feet short, the hoop
       stops in the air, wobbles and droops (boing), and hangs there trembling. She does not look at it. After
       "committed." it slides slowly back out the way it came. The net is drawn by netParts() and placed by
       placeNet(); butterfly-net and diagnostic-criteria copy both. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
    #net-falls-short-weave, #net-falls-short-cam, #net-falls-short-wall, #net-falls-short-wish, #net-falls-short-front, #net-falls-short-iris, #net-falls-short-film { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="net-falls-short" data-width="1920" data-height="1080" data-start="0" data-duration="7.4">
    <div id="net-falls-short-weave">
      <div id="net-falls-short-cam">
        <div id="net-falls-short-wall"></div>
        <div id="net-falls-short-wish"></div>
        <div id="net-falls-short-front"></div>
      </div>
      <div id="net-falls-short-iris"></div>
    </div>
    <div id="net-falls-short-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "net-falls-short";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line;
      var f = function (n) { return n.toFixed(1); };
      var tl = gsap.timeline({ paused: true });

      // ── Period film (KIT.film): outside the camera, so it stays put.
      KIT.film(tl, ID, q("weave"), q("film"), 47);

      // ── The lectern's props, as every host shot in this part has them (storyboards/part-04-institutionalize.sketch.mjs):
      // the case file lying on the reading top at its left, the steaming rust mug at its right.
      function mug(x, y) {
        return '<g transform="translate(' + x + "," + y + ')"><path d="M18,-44 q16,0 16,14 q0,14 -16,14" fill="none" stroke="' + ink + '" stroke-width="7"/><path d="M18,-44 q16,0 16,14 q0,14 -16,14" fill="none" stroke="' + C.cream + '" stroke-width="3"/>' +
          '<path d="M-20,-54 H22 L18,0 H-16 Z" fill="' + C.rust + '" stroke="' + ink + '" stroke-width="4.4" stroke-linejoin="miter"/><path d="M-19,-44 H21" stroke="' + C.cream + '" stroke-width="5"/>' +
          '<path d="M-6,-62 q-6,-10 0,-18 q6,-8 0,-18 M8,-62 q-6,-10 0,-18" fill="none" stroke="' + C.cream + '" stroke-width="3" opacity="0.8"/></g>';
      }
      function caseFile(x, y) {
        return '<g transform="translate(' + x + "," + y + ')"><path d="M-92,0 L-84,-16 H76 L88,0 Z" fill="#D9B46A" stroke="' + ink + '" stroke-width="4" stroke-linejoin="miter"/>' +
          '<path d="M-62,-16 L-58,-24 H-22 L-18,-16 Z" fill="#D9B46A" stroke="' + ink + '" stroke-width="3"/><path d="M-70,-8 H40" stroke="' + ink + '" stroke-width="2" opacity="0.6"/></g>';
      }
      var S = KIT.STUDIO, LX = S.lect[0], LT = S.top;
      var props = caseFile(LX - 120, LT + 10) + mug(LX + 160, LT + 8);

      // ── The butterfly net (copied by butterfly-net and diagnostic-criteria). netParts(id, r): the hoop and its bag
      // around the hoop's center, its rim in local x (radius r) and the bag hanging in local +y; parts .net-bag (sag it
      // with scaleY about "0 0"). The pole is a path set each frame by placeNet. NET_POLE: [ink width, wood width].
      var NET_POLE = [16, 10];
      function netParts(id, r) {
        var sag = 1.5, bag = "M" + f(-r) + ",0 Q" + f(-r * 0.8) + "," + f(r * sag) + " 0," + f(r * sag * 1.25) + " Q" + f(r * 0.8) + "," + f(r * sag) + " " + f(r) + ",0", mesh = "";
        for (var i = -3; i <= 3; i++) mesh += "M" + f(i * r * 0.26) + "," + f(-r * 0.05) + " Q" + f(i * r * 0.18) + "," + f(r * sag * 0.8) + " 0," + f(r * sag * 1.2) + " ";
        for (var j = 1; j <= 4; j++) { var yy = r * sag * j * 0.25, ww = r * (1 - j * 0.18); mesh += "M" + f(-ww) + "," + f(yy) + " Q0," + f(yy + r * 0.12) + " " + f(ww) + "," + f(yy) + " "; }
        var ring = function (half) {
          var d = half ? "M" + f(-r) + ",0 A" + f(r) + "," + f(r * 0.22) + " 0 0,1 " + f(r) + ",0" : "M" + f(-r) + ",0 A" + f(r) + "," + f(r * 0.22) + " 0 0,0 " + f(r) + ",0";
          return '<path d="' + d + '" fill="none" stroke="' + ink + '" stroke-width="9"/><path d="' + d + '" fill="none" stroke="' + C.yellow + '" stroke-width="4"/>';
        };
        return '<g id="' + id + '-pole"><path class="net-pole-ink" d="" fill="none" stroke="' + ink + '" stroke-width="' + NET_POLE[0] + '" stroke-linecap="round"/>' +
          '<path class="net-pole-wood" d="" fill="none" stroke="' + C.tan + '" stroke-width="' + NET_POLE[1] + '" stroke-linecap="round"/></g>' +
          '<g id="' + id + '-hoop">' + ring(false) + '<g class="net-bag"><path d="' + bag + '" fill="#F7F1E0" fill-opacity="0.55" stroke="' + ink + '" stroke-width="3.4"/>' +
          '<path d="' + mesh + '" fill="none" stroke="' + ink + '" stroke-width="1.6" opacity="0.7"/></g>' + ring(true) + "</g>";
      }
      // Place the net: the pole from `end` (its far end, usually off the frame) along angle th (deg, screen) for len px
      // to the hoop's rim; the hoop tilted hs (deg); bend sags the pole's middle (px, down); sag stretches the bag.
      function placeNet(id, end, th, len, r, hs, bend, sag) {
        var a = (th * Math.PI) / 180, ax = end[0] + len * Math.cos(a), ay = end[1] + len * Math.sin(a);
        var mx = (end[0] + ax) / 2, my = (end[1] + ay) / 2 + bend, hr = (hs * Math.PI) / 180;
        var d = "M" + f(end[0]) + "," + f(end[1]) + " Q" + f(mx) + "," + f(my) + " " + f(ax) + "," + f(ay);
        var pole = document.getElementById(id + "-pole");
        pole.querySelector(".net-pole-ink").setAttribute("d", d);
        pole.querySelector(".net-pole-wood").setAttribute("d", d);
        var hx = ax - r * Math.cos(hr), hy = ay - r * Math.sin(hr), hoop = document.getElementById(id + "-hoop");
        hoop.setAttribute("transform", "translate(" + f(hx) + "," + f(hy) + ") rotate(" + f(hs) + ")");
        hoop.querySelector(".net-bag").setAttribute("transform", "scale(1," + (sag || 1).toFixed(3) + ")");
      }

      // ── The set, Wishonia (her states come from the part file), the props and the net in front; a slow push.
      var NID = ID + "-net";
      KIT.studio(tl, ID, { cam: q("cam"), wall: q("wall"), wish: q("wish"), front: q("front") }, { front: props + '<g id="' + NID + '">' + netParts(NID, V ? 70 : 80) + "</g>", push: [1, 1.08] });
      KIT.iris(tl, ID, q("iris"), S.face, "in", 0.04, 0.74);

      // ── The net's swing. AIM: the pole's far end, its length, its resting angle, the hoop's tilt and radius. It
      // stops short of her: in 16:9 the hoop hangs at about (1215, 545), right of her hair; in 9:16 over the free wall
      // at her shoulder height.
      // from: where the swing starts (deg from th), over: how far it swings past the aim on the way. In 9:16 the pole
      // hangs from high above the frame and swings in from the right like a pendulum, so it never crosses her face.
      var AIM = V ? { end: [1250, -300], len: 1384, th: 104.4, hs: 60, r: 70, from: -36, over: -2.5 } : { end: [2250, 180], len: 1088, th: 156.4, hs: 62, r: 80, from: 52, over: 7 };
      var tIn = cue("committed."), tDroop = tIn + 0.55, tOut = KIT.after(ID, "committed.") + 0.05;
      var smooth = KIT.smooth;
      var net = q("net");
      KIT.onTime(tl, D, function (t) {
        if (t < tIn) { net.setAttribute("opacity", 0); return; }
        net.setAttribute("opacity", 1);
        // swing in from above the frame, overshoot down past the aim, wobble back and settle
        var u = (t - tIn) / 0.3, th;
        var sd = AIM.from > 0 ? 1 : -1;
        if (u < 1) th = AIM.th + AIM.from * Math.pow(1 - u, 2.4) - AIM.over * Math.sin(Math.PI * u);
        else { var w = t - tIn - 0.3; th = AIM.th - sd * 4 * Math.exp(-w * 7) * Math.sin(w * 26); }
        // the droop: the pole's tip sags, the hoop tips down, the bag stretches; then it hangs there, trembling
        var dr = smooth((t - tDroop) / 0.22), tremble = t > tDroop + 0.2 ? Math.sin(t * 61) * 0.9 : 0;
        var bend = 26 * dr + 6 * Math.max(0, Math.sin((t - tDroop) * 20)) * Math.exp(-Math.max(0, t - tDroop) * 6);
        var hs = AIM.hs + 30 * dr + tremble * 2, sag = 1 + 0.32 * dr;
        th -= sd * (3 * dr - tremble * 0.3);
        // after "committed." it slides slowly back out along its own pole
        var end = AIM.end.slice(), out = Math.max(0, t - tOut), a = (th * Math.PI) / 180, back = 380 * out * out + 120 * out;
        end[0] -= Math.cos(a) * back; end[1] -= Math.sin(a) * back;
        placeNet(NID, end, th, AIM.len, AIM.r, hs, bend, sag);
      });

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
