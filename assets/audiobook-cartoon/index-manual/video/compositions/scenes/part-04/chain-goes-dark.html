       copied from war-supply-chain (change them together). Cut to centrifuge-vs-rocks. -->
  <style>

    #chain-goes-dark-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="chain-goes-dark" data-width="1920" data-height="1080" data-start="0" data-duration="4.46">
    <div id="chain-goes-dark-weave">
      <div id="chain-goes-dark-shake"><div id="chain-goes-dark-plate"></div></div>

  <script src="assets/js/props/places.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "chain-goes-dark";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line;
      var tl = gsap.timeline({ paused: true });

      // ── Period film (KIT.film): outside the camera, so it stays put.
      KIT.film(tl, ID, q("weave"), q("film"), 411);

      // ════════════════════════════════════════════════════════════════════════════════════════════════════════════
      // PLATE padded-cell: shared by orderly-door-slot, war-supply-chain and chain-goes-dark. Copy this whole block
      // (down to "END PLATE padded-cell") and change all three files together (AGENTS.md, Continuity).
      // Plate units: the floor line is y 0 (people stand on it at scale S, so KIT.person's feet at y 100 land on 0),
      // the floor's padding runs toward the viewer below it, the ceiling's underside is y -1150.
      //   the door: doorway x 0..300, top y -620 (frame 18 wider); window x 84..216, y -530..-410; slot x 75..225,
      //     y -290..-260 with a flap hinged at its top
      //   the ceiling hatch: x 1380..1620, its flap hinged at (1380, -1150)
      //   the crayon drawings (y -380..-120, on the ground line y -148): the little human, the birdhouse (x 470..580)
      //     and the toolbox (x 600..660); the carrier x 820..1300; the bomb x 1316..1504; the X spans 800..1520
      //   x 1650 onward is blank wall: the switch goes at (1720, -400), the war wheel's hub at (2400, -580), rim 440
      // ════════════════════════════════════════════════════════════════════════════════════════════════════════════
      var S = 2.4, CEIL = -1150, DOOR = [0, 300, -620], WIN = [84, -530, 216, -410], SLOT = [75, -290, 225, -260], HATCH = [1380, 1620];
      var GL = -148; // the crayon drawings' ground line
      var PATIENT = { tone: 1, outfit: "shirt", color: 3 };
      var CANVAS = "#E9DFC6", STRAP = "#B9935E", WINDOW_DARK = "#1D2338", SKIN_O = "#A87B57";
      var FOLDED = [[52, 104], [-52, -104]], FREE_ARMS = [[-100, -100], [-52, -104]];
      var f = function (n) { return (+n).toFixed(1); };
      var copy = function (a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; };
      var at = function (x, y, k, inner, attrs) { return '<g transform="translate(' + f(x) + "," + f(y) + ") scale(" + k + ')"' + (attrs || "") + ">" + inner + "</g>"; };
      // A person (or any person-unit drawing) standing with its feet on plate y gy.
      var standAt = function (x, gy, inner, attrs) { return at(x, gy - 100 * S, S, inner, attrs); };
      // A crayon line: two passes of a waxy round-capped stroke, slightly apart. pathLength 1, so setting
      // stroke-dasharray "1 2" and stroke-dashoffset 1 → 0 on the group draws it on (crayonDraw).
      function crayon(d, col, w, attrs) {
        w = w || 7;
        return "<g" + (attrs || "") + '><path d="' + d + '" pathLength="1" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>' +
          '<path d="' + d + '" pathLength="1" transform="translate(1.6,1.2)" fill="none" stroke="' + col + '" stroke-width="' + f(w * 0.45) + '" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></g>';
      }
      function crayonDraw(g, u) {
        u = Math.max(0, Math.min(1, u));
        g.setAttribute("opacity", u > 0 ? 1 : 0);
        if (u >= 1) { g.removeAttribute("stroke-dasharray"); g.removeAttribute("stroke-dashoffset"); return; }
        g.setAttribute("stroke-dasharray", "1 2"); g.setAttribute("stroke-dashoffset", (1 - u).toFixed(4));
      }
      // The little crayon human, feet at (0, 0), h tall: "walk", "joy" (arms up, a smile) or "shrug".
      function crayonGuy(h, col, pose) {
        var hr = h * 0.13, hy = -h + hr, ny = hy + hr, hip = -h * 0.42, w = h * 0.045;
        var head = "M" + f(-hr) + "," + f(hy) + " a" + f(hr) + "," + f(hr) + " 0 1,0 " + f(2 * hr) + ",0 a" + f(hr) + "," + f(hr) + " 0 1,0 " + f(-2 * hr) + ",0";
        var legs = pose === "walk" ? "M" + f(-h * 0.22) + ",0 L0," + f(hip) + " L" + f(h * 0.24) + ",0" : "M" + f(-h * 0.18) + ",0 L0," + f(hip) + " L" + f(h * 0.18) + ",0";
        var arms = pose === "shrug" ? "M" + f(-h * 0.28) + "," + f(ny + h * 0.02) + " L" + f(-h * 0.16) + "," + f(ny + h * 0.16) + " L0," + f(ny + h * 0.12) + " L" + f(h * 0.16) + "," + f(ny + h * 0.16) + " L" + f(h * 0.28) + "," + f(ny + h * 0.02)
          : pose === "joy" ? "M" + f(-h * 0.26) + "," + f(ny - h * 0.16) + " L0," + f(ny + h * 0.1) + " L" + f(h * 0.26) + "," + f(ny - h * 0.16)
          : "M" + f(-h * 0.2) + "," + f(ny + h * 0.3) + " L0," + f(ny + h * 0.1) + " L" + f(h * 0.24) + "," + f(ny + h * 0.24);
        var smile = pose === "joy" ? " M" + f(-hr * 0.5) + "," + f(hy + hr * 0.25) + " q" + f(hr * 0.5) + "," + f(hr * 0.45) + " " + f(hr) + ",0" : pose === "shrug" ? " M" + f(-hr * 0.45) + "," + f(hy + hr * 0.35) + " h" + f(hr * 0.9) : "";
        return crayon(head + " M0," + f(ny) + " L0," + f(hip) + " " + legs + " " + arms + smile, col, w);
      }
      // The patient in his straitjacket (person units): canvas over the mustard shirt, folded arms, two tan straps.
      function jacketed(o) {
        var p = copy(PATIENT, copy({ colorHex: CANVAS, arms: FOLDED }, o)), R = KIT.rig(p);
        var sx = R.shoulder[1][0] + 4, y1 = R.shoulder[0][1] + 22, y2 = R.hipY - 12;
        var strap = function (y) {
          return '<path d="M' + f(-sx) + "," + f(y) + " L" + f(sx) + "," + f(y - 2) + " L" + f(sx) + "," + f(y + 7) + " L" + f(-sx) + "," + f(y + 9) + ' Z" fill="' + STRAP + '" stroke="' + ink + '" stroke-width="2.2"/>' +
            '<rect x="' + f(sx * 0.35) + '" y="' + f(y - 1) + '" width="9" height="10" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2"/>';
        };
        return KIT.person(p) + strap(y1) + strap(y2);
      }
      // The patient with his near arm (arm-l) out of the jacket: hide the jacket's .arm-l after inserting (patientFree
      // returns markup; freeArm(g) does the DOM part). The bare arm is the mustard shirt's, holding a fat crayon.
      var RFREE = KIT.rig(copy(PATIENT, { look: "left", arms: FREE_ARMS }));
      var SH0 = RFREE.shoulder[0], HAND0 = RFREE.hand[0];
      var CRAYON_ANG = (Math.atan2(HAND0[1] - (SH0[1] + 0), HAND0[0] - SH0[0]) * 180) / Math.PI;
      function patientFree(o) {
        var sleeve = '<g class="pt-sleeve"><path d="M' + f(SH0[0] - 6) + "," + f(SH0[1] + 1) + " q-9,20 0,42 l9,-1 q-6,-18 3,-38 Z" + '" fill="' + CANVAS + '" stroke="' + ink + '" stroke-width="2.2" stroke-linejoin="round"/></g>';
        var crayonStick = '<g transform="translate(' + f(HAND0[0]) + "," + f(HAND0[1]) + ") rotate(" + f(CRAYON_ANG) + ')"><g class="pt-crayon">' +
          '<rect x="-4" y="-5" width="20" height="10" rx="1" fill="' + C.navy + '" stroke="' + ink + '" stroke-width="1.8"/><path d="M16,-5 L24,0 L16,5 Z" fill="' + C.navy + '" stroke="' + ink + '" stroke-width="1.6" stroke-linejoin="round"/>' +
          '<rect x="2" y="-5" width="7" height="10" fill="' + C.cream + '" opacity="0.55"/></g></g>';
        return '<g class="pt-jacket">' + jacketed(copy({ look: "left" }, o)) + "</g>" + sleeve +
          '<g class="pt-arm"><g class="pt-armsrc">' + KIT.person(copy(PATIENT, { look: "left", arms: FREE_ARMS })) + "</g>" + crayonStick + "</g>";
      }
      function freeArm(g) {
        g.querySelector(".pt-jacket .arm-l").setAttribute("opacity", 0);
        var src = g.querySelector(".pt-armsrc"), arm = src.querySelector(".arm-l");
        while (src.firstChild) src.removeChild(src.firstChild);
        src.appendChild(arm);
      }
      // The Orderly behind the door (KIT.cast("orderly")), standing on the floor at x OX: the window shows his head.
      // His neck stretches: move his .head up by ext person units and draw neck under it (orderlyNeck).
      var OE = KIT.castOpts("orderly", { look: "right" }), RO = KIT.rig(OE), OX = 150 - RO.eyes[0] * S;
      function orderlyNeck(g, ext) {
        g.querySelector(".head").setAttribute("transform", "translate(0," + f(-ext) + ")");
        var n = g.querySelector(".neck-ext"), y0 = RO.neck[1] - 3 - ext;
        n.setAttribute("d", "M" + f(RO.neck[0] - 4.6) + "," + f(y0) + " H" + f(RO.neck[0] + 5.4) + " V" + f(RO.neck[1] + 2) + " H" + f(RO.neck[0] - 4.6) + " Z");
        n.setAttribute("opacity", ext > 0.5 ? 1 : 0);
      }
      function orderly() {
        return KIT.person(OE).replace('<g class="head">', '<path class="neck-ext" d="" fill="' + SKIN_O + '" stroke="' + ink + '" stroke-width="3.2" opacity="0"/><g class="head">');
      }
      // The wall, the floor and the shaft over the hatch (drawn first).
      function cellBack() {
        return "<defs>" +
          '<pattern id="' + ID + '-quilt" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="96" height="96" fill="#EFE4C6"/>' +
          '<path d="M0,48 L48,0 L96,48 L48,96 Z" fill="none" stroke="#D5C397" stroke-width="3"/><circle cx="48" cy="0" r="5" fill="#C9B07E"/><circle cx="0" cy="48" r="5" fill="#C9B07E"/><circle cx="96" cy="48" r="5" fill="#C9B07E"/><circle cx="48" cy="96" r="5" fill="#C9B07E"/>' +
          '<path d="M48,8 L88,48" stroke="#FFF8E6" stroke-width="3" opacity="0.7"/></pattern>' +
          '<pattern id="' + ID + '-pad" width="120" height="40" patternUnits="userSpaceOnUse"><rect width="120" height="40" fill="#DCCB9E"/><path d="M0,20 H120 M60,0 V20 M0,20 V40" stroke="#C4AF7E" stroke-width="3"/></pattern>' +
          '<clipPath id="' + ID + '-win"><rect x="' + WIN[0] + '" y="' + WIN[1] + '" width="' + (WIN[2] - WIN[0]) + '" height="' + (WIN[3] - WIN[1]) + '"/></clipPath></defs>' +
          '<rect x="-1200" y="-2000" width="5200" height="2000" fill="url(#' + ID + '-quilt)"/>' +
          '<rect x="-1200" y="0" width="5200" height="1400" fill="url(#' + ID + '-pad)"/><rect x="-1200" y="-6" width="5200" height="10" fill="#B99D68"/>' +
          '<rect x="' + HATCH[0] + '" y="-2000" width="' + (HATCH[1] - HATCH[0]) + '" height="' + (2000 + CEIL) + '" fill="' + WINDOW_DARK + '"/>';
      }
      // The ceiling (drawn over the patient, so he drops out of the shaft): a padded slab with a gap for the hatch, and
      // the hatch's flap (class "hatch-flap", hinged at (HATCH[0], CEIL); rotate it about that point to open it).
      function cellCeiling() {
        var slab = function (x0, x1) {
          return '<rect x="' + x0 + '" y="-2000" width="' + (x1 - x0) + '" height="' + (2000 + CEIL) + '" fill="#D8C596"/>' +
            '<rect x="' + x0 + '" y="' + (CEIL - 16) + '" width="' + (x1 - x0) + '" height="16" fill="#B99D68"/>';
        };
        var seams = "";
        for (var x = -1200; x < 4000; x += 120) if (x < HATCH[0] - 10 || x > HATCH[1] + 10) seams += "M" + x + "," + (CEIL - 16) + " V-2000 ";
        return slab(-1200, HATCH[0]) + slab(HATCH[1], 4000) + '<path d="' + seams + '" stroke="#C4AF7E" stroke-width="3"/>' +
          '<path d="M' + HATCH[0] + ',-2000 V' + CEIL + " M" + HATCH[1] + ",-2000 V" + CEIL + '" stroke="' + ink + '" stroke-width="5"/>' +
          '<g class="hatch-flap"><rect x="' + HATCH[0] + '" y="' + (CEIL - 20) + '" width="' + (HATCH[1] - HATCH[0]) + '" height="20" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="4"/>' +
          '<circle cx="' + (HATCH[0] + 10) + '" cy="' + (CEIL - 10) + '" r="5" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="2"/></g>';
      }
      // The steel door, its window (holding `inWindow`, clipped) and its slot (class "slot-flap", hinged at the top).
      function cellDoor(inWindow) {
        var x0 = DOOR[0], x1 = DOOR[1], top = DOOR[2], w = x1 - x0, ww = WIN[2] - WIN[0], wh = WIN[3] - WIN[1];
        return '<rect x="' + (x0 - 18) + '" y="' + (top - 18) + '" width="' + (w + 36) + '" height="' + (18 - top) + '" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="5"/>' +
          '<rect x="' + x0 + '" y="' + top + '" width="' + w + '" height="' + -top + '" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="5"/>' +
          '<path d="M' + (x1 - 8) + "," + (top + 8) + " V-8" + '" stroke="' + C.orange + '" stroke-width="4"/>' +
          [0.1, 0.9].map(function (u) { return '<circle cx="' + (x0 + w * u) + '" cy="' + f(top - top * 0.06) + '" r="5" fill="' + ink + '"/><circle cx="' + (x0 + w * u) + '" cy="' + f(top * 0.06) + '" r="5" fill="' + ink + '"/>'; }).join("") +
          '<rect x="' + WIN[0] + '" y="' + WIN[1] + '" width="' + ww + '" height="' + wh + '" fill="' + WINDOW_DARK + '"/>' +
          '<g clip-path="url(#' + ID + '-win)">' + (inWindow || "") + "</g>" +
          [1, 2, 3].map(function (i) { return '<path d="M' + f(WIN[0] + (ww * i) / 4) + "," + WIN[1] + " V" + WIN[3] + '" stroke="' + C.slate + '" stroke-width="6"/>'; }).join("") +
          '<rect x="' + WIN[0] + '" y="' + WIN[1] + '" width="' + ww + '" height="' + wh + '" fill="none" stroke="' + ink + '" stroke-width="5"/>' +
          '<rect x="' + SLOT[0] + '" y="' + SLOT[1] + '" width="' + (SLOT[2] - SLOT[0]) + '" height="' + (SLOT[3] - SLOT[1]) + '" fill="' + WINDOW_DARK + '" stroke="' + ink + '" stroke-width="4"/>' +
          '<g class="slot-flap"><rect x="' + (SLOT[0] - 6) + '" y="' + (SLOT[1] - 4) + '" width="' + (SLOT[2] - SLOT[0] + 12) + '" height="' + (SLOT[3] - SLOT[1] + 8) + '" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="4"/>' +
          '<path d="M' + (SLOT[0] + 20) + "," + (SLOT[1] + 7) + " H" + (SLOT[2] - 20) + '" stroke="' + C.peri + '" stroke-width="3"/></g>';
      }
      // A paper pill cup with two pills (class "cup-pills"), standing on (0, 0), plate units.
      function pillCup() {
        return '<path d="M-24,-46 H24 L17,0 H-17 Z" fill="#FBF6E6" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
          '<path d="M-12,-44 L-9,-2 M0,-44 V-2 M12,-44 L9,-2" stroke="#D9CFB5" stroke-width="2.4"/>' +
          '<g class="cup-pills"><circle cx="-7" cy="-50" r="8" fill="' + C.war + '" stroke="' + ink + '" stroke-width="2.4"/><circle cx="8" cy="-52" r="8" fill="' + C.med + '" stroke="' + ink + '" stroke-width="2.4"/></g>' +
          '<path d="M-25,-46 H25" stroke="' + ink + '" stroke-width="5" stroke-linecap="round"/>';
      }
      // The crayon drawings in their final state (the key frame of orderly-door-slot), as the next scenes see them.
      var BIRD = { cx: 525, tilt: 5 };
      // the birdhouse's pieces: [path around its own center, final center x, y, final rotation, color]
      var BIRD_PIECES = [
        ["M0,-26 V26", 525, GL - 26, 2, C.rust],                // the post
        ["M-40,0 H40", 525, GL - 52, -3, C.rust],               // the floor
        ["M0,-40 V40", 487, GL - 92, 4, C.rust],                // the left wall
        ["M0,-40 V40", 565, GL - 94, -2, C.rust],               // the right wall
        ["M-34,0 H34", 497, GL - 158, -40, C.rust],             // the roof, left
        ["M-34,0 H34", 551, GL - 160, 44, C.rust],              // the roof, right
        ["M-12,0 a12,12 0 1,0 24,0 a12,12 0 1,0 -24,0", 526, GL - 100, 0, C.rust], // the hole
        ["M-60,0 H60", 520, GL - 134, -7, C.navy],              // the plank that landed askew across it
      ];
      var TOOLBOX = "M-30,0 h60 v-28 h-60 z M-15,-28 v-10 h30 v10", TOOLBOX_AT = [630, GL];
      var CARRIER = "M820,-220 L860,-160 H1260 L1300,-220 Z M1040,-220 V-280 H1100 V-220 M1060,-280 V-310 M880,-228 l40,-10 l-6,12 M960,-230 l40,-10 l-6,12 M1150,-232 l40,-10 l-6,12";
      var BOMB = "M1340,-220 a70,62 0 1,0 140,0 a70,62 0 1,0 -140,0 M1410,-282 V-316 M1400,-316 h20 M1420,-316 q20,-20 40,-6 M1352,-220 L1316,-250 M1468,-220 L1504,-250";
      var XMARK = ["M800,-340 L1520,-120", "M1520,-340 L800,-120"];
      var GUY_END = [740, GL]; // where the little human stands up, pleased, then shrugs
      function drawingsDone() {
        var bird = BIRD_PIECES.map(function (p) { return '<g transform="translate(' + p[1] + "," + p[2] + ") rotate(" + p[3] + ')">' + crayon(p[0], p[4], 7) + "</g>"; }).join("");
        return '<g transform="translate(' + GUY_END[0] + "," + GUY_END[1] + ')">' + crayonGuy(120, C.navy, "shrug") + "</g>" + bird +
          '<g transform="translate(' + TOOLBOX_AT[0] + "," + TOOLBOX_AT[1] + ')">' + crayon(TOOLBOX.replace("M-15,-28 v-10 h30 v10", "M-30,-28 l-18,-30"), C.navy, 5) + "</g>" +
          crayon(CARRIER, C.navy, 7) + crayon(BOMB, C.navy, 7) + crayon(XMARK[0], C.war, 12) + crayon(XMARK[1], C.war, 12);
      }
      // END PLATE padded-cell ═════════════════════════════════════════════════════════════════════════════════════

      // ════════════════════════════════════════════════════════════════════════════════════════════════════════════
      // WHEEL war-wheel: shared by war-supply-chain and chain-goes-dark. Copy this whole block (down to "END WHEEL")
      // and change both files together. The patient's crayon Ferris wheel on the blank wall, in plate units.
      // Every state is a function of T, war-supply-chain's local time, so chain-goes-dark draws T = war's duration
      // plus its own time, and holds T still from "NOT".
      //   hub (2400, -580), rim 440: a crayon circle with 44 paper dolls standing on it (heads out), 8 spokes
      //   8 gondolas hang from the rim at 0, 45 ... 315 degrees (clockwise from the right): 1 the miner, 2 the
      //     furnace, 3 the factory, 4 the salute, 5 soup and uniforms, 6 the village, 7 the poster, 8 the ballot box.
      //     A gondola is drawn in its own units (floor y 0, x -150..150, roof -232, hanger (0, -262)) at GS 0.5: its
      //     box runs from 17 to 133 below its rim point, 160 wide. Crayon until its cue, then its colors wipe in.
      //   the crayon calendar at (3000, -760); war bills run on the inside of the rim; the 1ST rosette on the hub
      // ════════════════════════════════════════════════════════════════════════════════════════════════════════════
      var WID = "war-supply-chain", HUB = [2400, -580], RIM = 440, GS = 0.5, NDOLL = 44, CAL = [3000, -760], CR = C.navy;
      var GA = [0, 45, 90, 135, 180, 225, 270, 315];
      var wc = function (w, n) { return KIT.cue(WID, w, n); };
      var WT = {
        millions: wc("millions"), together: wc("together"), mine: wc("mine"), refine: wc("refine"), alloys: wc("alloys,"),
        factories: wc("factories"), weapons: wc("weapons,"), train: wc("train"), operate: wc("operate"), feed: wc("feed"),
