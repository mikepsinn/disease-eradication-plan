<template id="orderly-door-slot-template">

       his arm, which keeps coming, snaking across the whole floor (the camera pulls back) to the patient's feet;
       "medication": the pills rattle; after it the arm zips back out. The patient hops up and wriggles; "Nobody": one arm
       pops out of the straitjacket (the empty sleeve flaps), he kicks the cup aside, a fat crayon in his hand, and hops to
       the wall. "accidentally": a little crayon human walks, trips over a crayon toolbox; the tools fly up and come down,
       by accident, as a lopsided birdhouse ("builds"), and the little human jumps for joy. "carrier": a huge crayon
       aircraft carrier; "bomb.": a nuclear bomb; after "bomb." one big red crayon X over both, and the little human shrugs.
       The camera ends on the key frame, which war-supply-chain starts on. -->

  </style>

  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "orderly-door-slot";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line;
      var tl = gsap.timeline({ paused: true });

      KIT.film(tl, ID, q("weave"), q("film"), 404);

      // ════════════════════════════════════════════════════════════════════════════════════════════════════════════
      // PLATE padded-cell: shared by orderly-door-slot, war-supply-chain and chain-goes-dark. Copy this whole block
      // (down to "END PLATE padded-cell") and change all three files together (AGENTS.md, Continuity).
      // Plate units: the floor line is y 0 (people stand on it at scale S, so KIT.person's feet at y 100 land on 0),
      // the floor's padding runs toward the viewer below it, the ceiling's underside is y -1150.
      //   the door: doorway x 0..300, top y -620 (frame 18 wider); window x 84..216, y -530..-410; slot x 75..225,
      //     y -290..-260 with a flap hinged at its top
      //   the ceiling hatch: x 1380..1620, its flap hinged at (1380, -1150)

      // ════════════════════════════════════════════════════════════════════════════════════════════════════════════

      var FOLDED = [[52, 104], [-52, -104]], FREE_ARMS = [[-100, -100], [-52, -104]];

      var copy = function (a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; };
      var at = function (x, y, k, inner, attrs) { return '<g transform="translate(' + f(x) + "," + f(y) + ") scale(" + k + ')"' + (attrs || "") + ">" + inner + "</g>"; };

      // stroke-dasharray "1 2" and stroke-dashoffset 1 → 0 on the group draws it on (crayonDraw).
      function crayon(d, col, w, attrs) {

      }

      // The little crayon human, feet at (0, 0), h tall: "walk", "joy" (arms up, a smile) or "shrug".
      function crayonGuy(h, col, pose) {

          : "M" + f(-h * 0.2) + "," + f(ny + h * 0.3) + " L0," + f(ny + h * 0.1) + " L" + f(h * 0.24) + "," + f(ny + h * 0.24);

        return crayon(head + " M0," + f(ny) + " L0," + f(hip) + " " + legs + " " + arms + smile, col, w);
      }
      // The patient in his straitjacket (person units): canvas over the mustard shirt, folded arms, two tan straps.
      function jacketed(o) {
        var p = copy(PATIENT, copy({ colorHex: CANVAS, arms: FOLDED }, o)), R = KIT.rig(p);

        };

      // The patient with his near arm (arm-l) out of the jacket: hide the jacket's .arm-l after inserting (patientFree

      var RFREE = KIT.rig(copy(PATIENT, { look: "left", arms: FREE_ARMS }));
      var SH0 = RFREE.shoulder[0], HAND0 = RFREE.hand[0];

        var crayonStick = '<g transform="translate(' + f(HAND0[0]) + "," + f(HAND0[1]) + ") rotate(" + f(CRAYON_ANG) + ')"><g class="pt-crayon">' +
          '<rect x="-4" y="-5" width="20" height="10" rx="1" fill="' + C.navy + '" stroke="' + ink + '" stroke-width="1.8"/><path d="M16,-5 L24,0 L16,5 Z" fill="' + C.navy + '" stroke="' + ink + '" stroke-width="1.6" stroke-linejoin="round"/>' +
          '<rect x="2" y="-5" width="7" height="10" fill="' + C.cream + '" opacity="0.55"/></g></g>';

          '<g class="pt-arm"><g class="pt-armsrc">' + KIT.person(copy(PATIENT, { look: "left", arms: FREE_ARMS })) + "</g>" + crayonStick + "</g>";
      }

        var src = g.querySelector(".pt-armsrc"), arm = src.querySelector(".arm-l");
        while (src.firstChild) src.removeChild(src.firstChild);
        src.appendChild(arm);

      // The Orderly behind the door (KIT.cast("orderly")), standing on the floor at x OX: the window shows his head.
      // His neck stretches: move his .head up by ext person units and draw neck under it (orderlyNeck).
      var OE = KIT.castOpts("orderly", { look: "right" }), RO = KIT.rig(OE), OX = 150 - RO.eyes[0] * S;
      function orderlyNeck(g, ext) {

      }

      function cellBack() {
        return "<defs>" +
          '<pattern id="' + ID + '-quilt" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="96" height="96" fill="#EFE4C6"/>' +
          '<path d="M0,48 L48,0 L96,48 L48,96 Z" fill="none" stroke="#D5C397" stroke-width="3"/><circle cx="48" cy="0" r="5" fill="#C9B07E"/><circle cx="0" cy="48" r="5" fill="#C9B07E"/><circle cx="96" cy="48" r="5" fill="#C9B07E"/><circle cx="48" cy="96" r="5" fill="#C9B07E"/>' +
          '<path d="M48,8 L88,48" stroke="#FFF8E6" stroke-width="3" opacity="0.7"/></pattern>' +
          '<pattern id="' + ID + '-pad" width="120" height="40" patternUnits="userSpaceOnUse"><rect width="120" height="40" fill="#DCCB9E"/><path d="M0,20 H120 M60,0 V20 M0,20 V40" stroke="#C4AF7E" stroke-width="3"/></pattern>' +

      // the hatch's flap (class "hatch-flap", hinged at (HATCH[0], CEIL); rotate it about that point to open it).
      function cellCeiling() {
        var slab = function (x0, x1) {
          return '<rect x="' + x0 + '" y="-2000" width="' + (x1 - x0) + '" height="' + (2000 + CEIL) + '" fill="#D8C596"/>' +
            '<rect x="' + x0 + '" y="' + (CEIL - 16) + '" width="' + (x1 - x0) + '" height="16" fill="#B99D68"/>';

        return slab(-1200, HATCH[0]) + slab(HATCH[1], 4000) + '<path d="' + seams + '" stroke="#C4AF7E" stroke-width="3"/>' +

      }
      // The steel door, its window (holding `inWindow`, clipped) and its slot (class "slot-flap", hinged at the top).
      function cellDoor(inWindow) {
        var x0 = DOOR[0], x1 = DOOR[1], top = DOOR[2], w = x1 - x0, ww = WIN[2] - WIN[0], wh = WIN[3] - WIN[1];
        return '<rect x="' + (x0 - 18) + '" y="' + (top - 18) + '" width="' + (w + 36) + '" height="' + (18 - top) + '" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="5"/>' +
          '<rect x="' + x0 + '" y="' + top + '" width="' + w + '" height="' + -top + '" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="5"/>' +
          '<path d="M' + (x1 - 8) + "," + (top + 8) + " V-8" + '" stroke="' + C.orange + '" stroke-width="4"/>' +
          [0.1, 0.9].map(function (u) { return '<circle cx="' + (x0 + w * u) + '" cy="' + f(top - top * 0.06) + '" r="5" fill="' + ink + '"/><circle cx="' + (x0 + w * u) + '" cy="' + f(top * 0.06) + '" r="5" fill="' + ink + '"/>'; }).join("") +
          '<rect x="' + WIN[0] + '" y="' + WIN[1] + '" width="' + ww + '" height="' + wh + '" fill="' + WINDOW_DARK + '"/>' +
          '<g clip-path="url(#' + ID + '-win)">' + (inWindow || "") + "</g>" +
          [1, 2, 3].map(function (i) { return '<path d="M' + f(WIN[0] + (ww * i) / 4) + "," + WIN[1] + " V" + WIN[3] + '" stroke="' + C.slate + '" stroke-width="6"/>'; }).join("") +
          '<rect x="' + WIN[0] + '" y="' + WIN[1] + '" width="' + ww + '" height="' + wh + '" fill="none" stroke="' + ink + '" stroke-width="5"/>' +
          '<rect x="' + SLOT[0] + '" y="' + SLOT[1] + '" width="' + (SLOT[2] - SLOT[0]) + '" height="' + (SLOT[3] - SLOT[1]) + '" fill="' + WINDOW_DARK + '" stroke="' + ink + '" stroke-width="4"/>' +
          '<g class="slot-flap"><rect x="' + (SLOT[0] - 6) + '" y="' + (SLOT[1] - 4) + '" width="' + (SLOT[2] - SLOT[0] + 12) + '" height="' + (SLOT[3] - SLOT[1] + 8) + '" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="4"/>' +

      var BOMB = "M1340,-220 a70,62 0 1,0 140,0 a70,62 0 1,0 -140,0 M1410,-282 V-316 M1400,-316 h20 M1420,-316 q20,-20 40,-6 M1352,-220 L1316,-250 M1468,-220 L1504,-250";
      var XMARK = ["M800,-340 L1520,-120", "M1520,-340 L800,-120"];

      // END PLATE padded-cell ═════════════════════════════════════════════════════════════════════════════════════

      var tNobody = cue("Nobody"), tAcc = cue("accidentally"), tBuilds = cue("builds"), tCarrier = cue("carrier"), tBomb = cue("bomb."), tX = KIT.after(ID, "bomb.");
      // The sounds (parts/part-04.json) land on: the two bounces at 0.75 and 1.05, the squeak on "orderly", the click on
