<template id="orderly-door-slot-template">
  <!-- orderly-door-slot · Layer B (storyboards/part-04-institutionalize.md): out of the static, a padded cell. The patient
       drops through a hatch in his straitjacket and bounces twice; the Orderly's eyes rise into the door window on his long
       neck; the door slot clicks open and his arm slides a pill cup in, snaking across the whole floor to the patient's feet,
       then zips back out. On "Nobody" one arm pops free; the patient swats the cup away, takes a fat pencil and bounces up
       the padded wall to draw: a little human trips over a toolbox, the tools fly up and come down as a lopsided birdhouse,
       BUILT BY ACCIDENT; then an aircraft carrier and a nuclear bomb, crossed out with one big red X; the little human
       shrugs. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #orderly-door-slot-cam, #orderly-door-slot-view, #orderly-door-slot-art, #orderly-door-slot-static, #orderly-door-slot-pip, #orderly-door-slot-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="orderly-door-slot" data-width="1920" data-height="1080" data-start="0" data-duration="11.68">
    <div id="orderly-door-slot-cam">
      <!-- the camera: close on the door and the patient, pulling back on "Nobody" to show the whole padded wall -->
      <div id="orderly-door-slot-view"><div id="orderly-door-slot-art"></div></div>
      <!-- the TV static the wall screen ended on (diagnostic-criteria), for the first frames of the zoom -->
      <div id="orderly-door-slot-static"></div>
      <div id="orderly-door-slot-pip"></div>
    </div>
    <div id="orderly-door-slot-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "orderly-door-slot";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var P = function (s) { return ID + "-" + s; };
      var g = function (s) { return "#" + P(s); };
      var f = function (n) { return (+n).toFixed(1); };

      // ════ THE PADDED CELL (the same code in orderly-door-slot, war-supply-chain and chain-goes-dark: change all three) ════
      // s: the people's and the door's scale; feet: where the patient and the cup stand; wall: the wall/floor line (the door
      // stands on it); door: the door's center x; hatch: [x, y, w] of the hatch in the top of the wall; doodle: [x, y, k] of
      // the wall doodles (drawn in a 380 x 390 box); land: where the patient drops in; end: where orderly-door-slot leaves
      // him; home: where he stands to draw the war wheel; arm: the Orderly's arm from the slot along the floor to the
      // patient's feet. The war wheel (war-supply-chain, chain-goes-dark): hub, r (the rim's radius), gk (the gondolas'
      // scale); cal: [x, base y, scale, which way its pages fly] of the wall calendar; sw: [x, y, scale, which way the
      // patient faces to flick it, where his feet stand] of the light switch; hout: where the Orderly's head ends up on
      // "largest" (door units from the window); cupTo: where the patient swats the pill cup to. The camera (shots are
      // [art x, art y at the frame's top left, scale]): shotDoor, close on the door and the patient; shotDoodle, up on the
      // wall doodles (orderly-door-slot ends on it, war-supply-chain starts on it; in 9:16 the whole wall, so he never
      // stands in the captions); boxZ and boxAt: each gondola's close-up (its scale, and the frame point its middle goes to).
      var L = V
        ? { s: 1.9, feet: 1440, wall: 1402, door: 165, hatch: [560, 50, 160], doodle: [70, 100, 1.15], land: 650, end: 350, home: 380,
            hub: [620, 760], r: 280, gk: 0.88, cal: [120, 720, 1.1, -1], sw: [545, 1292, 1.25, 1, 380], hout: [-10, -150], cupTo: 268,
            shotDoor: [0, 568, 1.42], shotDoodle: [0, 0, 1], boxZ: 1.55, boxAt: [540, 900],
            arm: "M165,1263 C190,1295 160,1360 210,1410 C262,1466 330,1392 395,1430 C460,1468 520,1404 590,1444" }
        : { s: 2.5, feet: 880, wall: 842, door: 205, hatch: [900, 46, 160], doodle: [370, 50, 1.05], land: 985, end: 690, home: 740,
            hub: [1225, 430], r: 290, gk: 1, cal: [1540, 215, 1.2, 1], sw: [515, 682, 1.3, -1, 620], hout: [130, 32], cupTo: 430,
            shotDoor: [0, 249, 1.3], shotDoodle: [100, 44, 1.6], boxZ: 1.9, boxAt: [900, 500],
            arm: "M205,659 C232,690 200,770 258,840 C330,920 420,836 520,872 C620,908 700,846 800,880 C850,898 890,890 935,890" };
      var S = L.s, PAPER = C.paper, WHITE = "#FBF6E6", SKIN2 = "#A87B57";

      function at(x, y, k, inner) { return '<g transform="translate(' + f(x) + "," + f(y) + ")" + (k === 1 ? "" : " scale(" + k + ")") + '">' + inner + "</g>"; }
      // A person's (0,0) for feet on the ground at (x, y), at scale k.
      function stand(x, y, k, inner) { return at(x, y - 100 * k, k, inner); }
      // A drawing on the padded wall in pencil: every color but the navy line turns to paper (text and outlines stay navy).
      function pencilify(m) {
        var ink = C.line.toUpperCase(), ink2 = C.ink.toUpperCase();
        return m.replace(/fill="url\([^)]*\)"/g, 'fill="none"').replace(/(fill|stroke)="(#[0-9A-Fa-f]{3,6})"/g, function (all, a, col) {
          var u = col.toUpperCase();
          if (u === ink || u === ink2) return all;
          return a === "fill" ? 'fill="' + PAPER + '"' : 'stroke="' + C.line + '"';
        }).replace(/<text([^>]*)fill="[^"]*"/g, '<text$1fill="' + C.line + '"');
      }
      // The quilted wall: cream diamond tufts (110 across) with halftone shading and navy buttons; the padded floor below
      // with seams running to the camera; a padded skirting roll; the hatch; the paper border on top (drawn by frame()).
      function cell() {
        var T = V ? 104 : 110, h = T / 2, dots = P("qdots");
        var defs = "<defs>" +
          '<pattern id="' + dots + '" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="2.5" cy="2.5" r="1.15" fill="' + C.line + '"/></pattern>' +
          '<pattern id="' + P("quilt") + '" width="' + T + '" height="' + T + '" patternUnits="userSpaceOnUse" x="' + (L.door % T) + '" y="0">' +
          '<rect width="' + T + '" height="' + T + '" fill="' + C.cream + '"/>' +
          '<path d="M' + h + "," + h + " L" + T + "," + h + " L" + h + "," + T + ' Z M0,0 L' + h + ",0 L0," + h + ' Z" fill="url(#' + dots + ')" opacity="0.2"/>' +
          '<path d="M0,' + h + " L" + h + ",0 L" + T + "," + h + " L" + h + "," + T + ' Z" fill="none" stroke="' + C.line + '" stroke-width="1.8" opacity="0.5"/>' +
          [[h, 0], [T, h], [h, T], [0, h]].map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.2" fill="' + C.line + '"/>'; }).join("") +
          "</pattern></defs>";
        var y0 = L.wall, floor = '<rect x="0" y="' + y0 + '" width="' + W + '" height="' + (H - y0) + '" fill="' + C.cream + '"/>' +
          '<rect x="0" y="' + y0 + '" width="' + W + '" height="' + (H - y0) + '" fill="url(#' + dots + ')" opacity="0.16"/>';
        var vx = W / 2, vy = y0 - (V ? 900 : 700), seams = "";
        for (var i = -14; i <= 14; i++) {
          var xb = vx + i * (V ? 190 : 230), xt = vx + (xb - vx) * ((y0 - vy) / (H + 400 - vy));
          seams += "M" + f(xt) + "," + y0 + " L" + f(xb + (xb - vx) * 0.6) + "," + (H + 400) + " ";
        }
        for (var k = 1; k <= 5; k++) { var yy = y0 + (H - y0) * Math.pow(k / 5.5, 1.6); seams += "M0," + f(yy) + " H" + W + " "; }
        floor += '<path d="' + seams + '" stroke="' + C.line + '" stroke-width="1.6" opacity="0.32" fill="none"/>';
        // the skirting roll where the padded wall meets the padded floor
        floor += '<rect x="0" y="' + (y0 - 14) + '" width="' + W + '" height="18" fill="' + WHITE + '" stroke="' + C.line + '" stroke-width="3"/>' +
          '<rect x="0" y="' + (y0 - 4) + '" width="' + W + '" height="8" fill="url(#' + dots + ')" opacity="0.3"/>';
        return defs + '<rect width="' + W + '" height="' + y0 + '" fill="url(#' + P("quilt") + ')"/>' + floor;
      }
      // The hatch in the top of the wall: a dark square chute with a steel flap hinged on its top edge (.flap: swing it up
      // with scaleY about its top).
      function hatch() {
        var x = L.hatch[0], y = L.hatch[1], w = L.hatch[2], hh = w * 0.5;
        return '<rect x="' + (x - 10) + '" y="' + y + '" width="' + (w + 20) + '" height="' + (hh + 12) + '" fill="' + C.peri + '" stroke="' + C.line + '" stroke-width="4"/>' +
          '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hh + '" fill="' + C.deep + '"/>' +
          '<g id="' + P("flap") + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hh + '" fill="' + C.slate + '" stroke="' + C.line + '" stroke-width="3"/>' +
          '<path d="M' + (x + 10) + "," + (y + hh * 0.35) + " H" + (x + w - 10) + " M" + (x + 10) + "," + (y + hh * 0.65) + " H" + (x + w - 10) + '" stroke="' + C.orange + '" stroke-width="2"/></g>';
      }
      // The paper border of every Layer B frame (KIT.paper's double rule), over the cell's edges.
      function frame() {
        return '<path d="M0,0 H' + W + " V" + H + " H0 Z M30,30 V" + (H - 30) + " H" + (W - 30) + ' V30 Z" fill="' + C.paper + '" fill-rule="evenodd"/>' +
          '<rect x="30" y="30" width="' + (W - 60) + '" height="' + (H - 60) + '" fill="none" stroke="' + C.line + '" stroke-width="5"/>' +
          '<rect x="44" y="44" width="' + (W - 88) + '" height="' + (H - 88) + '" fill="none" stroke="' + C.orange + '" stroke-width="2"/>';
      }
      // The camera on the art's HTML wrapper. shotOn: the shot that puts the art point (x, y) at the frame point (fx, fy) at
      // scale s, kept inside the art. camera(tl, view, first): starts on `first` and returns cam(t, dur, shot, ease), which
      // eases from the last shot to the next.
      function shotOn(x, y, s, fx, fy) {
        return [Math.min(Math.max(x - fx / s, 0), W - W / s), Math.min(Math.max(y - fy / s, 0), H - H / s), s];
      }
      function camera(tl, view, first) {
        var cur = first, css = function (s) { return { x: -s[0] * s[2], y: -s[1] * s[2], scale: s[2] }; };
        gsap.set(view, { transformOrigin: "0px 0px" });
        gsap.set(view, css(first));
        return function (t, dur, shot, ease) {
          var to = css(shot); to.duration = dur; to.ease = ease || "power2.inOut"; to.immediateRender = false;
          tl.fromTo(view, css(cur), to, t);
          cur = shot;
        };
      }

      // The steel door (KIT.props.door, its leaf in steel, with the slot), and over its leaf the wired window the Orderly
      // looks through: the dark corridor, his head on its long neck (#head-lift moves it up and down), the glass and its
      // wire mesh (#glass). Door units: the doorway is x -48..48, y -202..0; the window is x -22..22, y -186..-122.
      var WIN = [-28, -192, 56, 80], SLOT = [0, -73];
      var OHO = KIT.castOpts("orderly", { look: "right" }), OHR = KIT.rig(OHO);
      function headOf(o) { return KIT.person(o).match(/<g class="head">[\s\S]*?<!--head-end--><\/g>/)[0]; }
      // the Orderly's head with its center at (0,0) and his neck running far down from it
      function orderlyHead(o, neckLen) {
        return '<path d="M-4,8 L-5,' + neckLen + " L5," + neckLen + ' L5,8 Z" fill="' + SKIN2 + '" stroke="' + C.line + '" stroke-width="2.6"/>' +
          '<g transform="translate(' + f(-OHR.head[0]) + "," + f(-OHR.head[1]) + ')">' + headOf(o) + "</g>";
      }
      function door() {
        var d = KIT.props.door({ color: C.peri, slot: true });
        var wx = WIN[0], wy = WIN[1], ww = WIN[2], wh = WIN[3], mesh = "";
        for (var i = -4; i <= 8; i++) mesh += "M" + (wx + i * 11) + "," + wy + " l" + wh * 0.6 + "," + wh + " M" + (wx + ww - i * 11) + "," + wy + " l" + -wh * 0.6 + "," + wh + " ";
        var win = '<g id="' + P("win") + '"><rect x="' + (wx - 5) + '" y="' + (wy - 5) + '" width="' + (ww + 10) + '" height="' + (wh + 10) + '" fill="' + C.slate + '" stroke="' + C.line + '" stroke-width="3"/>' +
          '<defs><clipPath id="' + P("winclip") + '"><rect x="' + wx + '" y="' + wy + '" width="' + ww + '" height="' + wh + '"/></clipPath></defs>' +
          '<rect x="' + wx + '" y="' + wy + '" width="' + ww + '" height="' + wh + '" fill="' + C.deep + '"/>' +
          '<g clip-path="url(#' + P("winclip") + ')"><g transform="translate(0,' + (wy + wh) + ')"><g id="' + P("head-lift") + '"><g id="' + P("head-win") + '">' + orderlyHead(OHO, 160) + "</g></g></g></g>" +
          '<g id="' + P("glass") + '"><rect x="' + wx + '" y="' + wy + '" width="' + ww + '" height="' + wh + '" fill="' + C.cyan + '" opacity="0.22"/>' +
          '<g clip-path="url(#' + P("winclip") + ')"><path d="' + mesh + '" stroke="' + C.line + '" stroke-width="0.9" opacity="0.55" fill="none"/></g>' +
          '<path d="M' + (wx + 6) + "," + (wy + wh - 10) + " L" + (wx + 16) + "," + (wy + 8) + '" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/></g></g>';
        // the slot's flap (over the prop's dark slit), hinged on its top edge
        var flap = '<g id="' + P("slotflap") + '"><rect x="-21" y="-76" width="42" height="7" fill="' + C.peri + '" stroke="' + C.line + '" stroke-width="2"/></g>';
        return { door: d, win: win, flap: flap };
      }

      // ── The patient (the same human all part long), in his straitjacket, drawn facing right (flip the whole group to face
      // left). jacket: both arms crossed in the long canvas sleeves. free: the right arm out, holding a fat pencil (.pat-arm,
      // pivot the shoulder), its empty sleeve hanging (.pat-sleeve, pivot the shoulder).
      var PO = { tone: 1, outfit: "shirt", color: 3, look: "right" }, PR = KIT.rig(PO);
      var ARMS_FREE = [[10, 100], [115, 140]], PRF = KIT.rig({ tone: 1, outfit: "shirt", color: 3, look: "right", arms: ARMS_FREE });
      var SHR = PRF.shoulder[1], HAND = PRF.hand[1];
      // the pencil: KIT.pencil (tip at 0,0, the eraser up and to the right) turned to point along the forearm, held 42% along
      var PS = 0.42, PROT = 130 + 26.3, GRIP = [66, -33];
      var TIP = (function () { var r = (PROT * Math.PI) / 180, x = -GRIP[0], y = -GRIP[1]; return [HAND[0] + PS * (x * Math.cos(r) - y * Math.sin(r)), HAND[1] + PS * (x * Math.sin(r) + y * Math.cos(r))]; })();
      function strip(m) { return m.replace(/<g class="arm-l">[\s\S]*?<\/g><\/g>/, "").replace(/<g class="arm-r">[\s\S]*?<\/g><\/g>/, ""); }
      function poly(pts, fill, sw) { return '<path d="M' + pts.map(function (p) { return f(p[0]) + "," + f(p[1]); }).join(" L") + ' Z" fill="' + fill + '" stroke="' + C.line + '" stroke-width="' + (sw || 2.6) + '" stroke-linejoin="miter"/>'; }
      var JD = P("jdots");
      function jacketBody() {
        var body = [[-24, -25.5], [-19, -30], [-6, -31], [0, -23], [6, -31], [19, -30], [24, -25.5], [19, 4], [16.5, 30], [-16.5, 30], [-19, 4]];
        return '<defs><pattern id="' + JD + '" width="3.6" height="3.6" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1" fill="' + C.line + '"/></pattern>' +
          '<clipPath id="' + P("jclip") + '"><path d="M' + body.map(function (p) { return p.join(","); }).join(" L") + ' Z"/></clipPath></defs>' +
          poly(body, WHITE, 3) + '<rect x="8" y="-32" width="20" height="64" fill="url(#' + JD + ')" opacity="0.3" clip-path="url(#' + P("jclip") + ')"/>' +
          '<path d="M-6,-31 L0,-23 L6,-31" fill="none" stroke="' + C.line + '" stroke-width="2"/>';
      }
      // one crossed sleeve: down the left side from the shoulder, then across the chest, its end strapped round the back
      var SLEEVE = [[-24.5, -27], [-11, -25], [-12.5, -9], [23, -14], [31, -10], [31, -1], [-19, 6], [-27, 2]];
      function sleeveL() { return poly(SLEEVE, WHITE, 2.8) + '<path d="M28,-12 L33,-11 L33,-1 L28,-1" fill="' + C.line + '"/>' + '<rect x="-27" y="-6" width="9" height="3" fill="' + C.line + '"/>'; }
      function sleeveR() { return poly(SLEEVE.map(function (p) { return [-p[0], p[1] + 8]; }), WHITE, 2.8) + '<path d="M-28,-4 L-33,-3 L-33,7 L-28,7" fill="' + C.line + '"/>'; }
      function straps() {
        return [-15, 15].map(function (y) {
          return '<rect x="-23" y="' + (y - 2.5) + '" width="46" height="5" fill="' + C.line + '"/><rect x="7" y="' + (y - 4) + '" width="7" height="8" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="1.6"/>';
        }).join("");
      }
      // the empty right sleeve, hanging long from the shoulder, its strap and buckle dangling
      var EMPTY = [[10.5, -27], [24.5, -28], [26.5, 2], [25, 34], [17, 46], [12.5, 40], [13.5, 4]];
      function emptySleeve() {
        return '<g class="pat-sleeve">' + poly(EMPTY, WHITE, 2.8) + '<path d="M14,40 L12,58" stroke="' + C.line + '" stroke-width="3.5"/><rect x="9" y="55" width="6" height="7" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="1.4"/></g>';
      }
      function pencilIn() {
        return '<g class="pat-pencil" transform="translate(' + f(HAND[0]) + "," + f(HAND[1]) + ") rotate(" + PROT.toFixed(1) + ") scale(" + PS + ") translate(" + -GRIP[0] + "," + -GRIP[1] + ')">' + KIT.pencil() + "</g>";
      }
      function patient(kind, mood) {
        var o = { tone: 1, outfit: "shirt", color: 3, look: "right", mood: mood || "flat" };
        var base = strip(KIT.person(o));
        // the base person ends with its arms and "</g></g>": put the jacket over the body, before the end
        var end = base.lastIndexOf("</g></g>");
        if (kind === "jacket") return base.slice(0, end) + jacketBody() + sleeveL() + sleeveR() + straps() + base.slice(end);
        var arm = KIT.person({ tone: 1, outfit: "shirt", color: 3, look: "right", arms: ARMS_FREE }).match(/<g class="arm-r">[\s\S]*?<\/g><\/g>/)[0];
        arm = arm.replace('<g class="arm-r">', '<g class="pat-arm">' + '<g class="pat-pencil-pop">').replace(/<\/g>$/, "</g>" + pencilIn() + "</g>");
        return base.slice(0, end) + jacketBody() + sleeveL() + straps() + emptySleeve() + arm + base.slice(end);
      }

      // ── The doodles on the wall (orderly-door-slot draws them; war-supply-chain and chain-goes-dark show them finished) ──
      // In a 380 x 390 box: the little human and the toolbox he trips over, the tools, the lopsided birdhouse they become,
      // BUILT BY ACCIDENT, the aircraft carrier, the bomb and the big red X.
      var DG = 205; // the doodles' ground line
      var LH = { tone: 0, outfit: "shirt", color: 1, hair: 0, plain: true, look: "right" }, LK = 0.6;
      function littleHuman(extra) { var o = {}, k; for (k in LH) o[k] = LH[k]; for (k in extra || {}) o[k] = extra[k]; return pencilify(KIT.person(o)); }
      function toolbox() {
        return poly([[62, DG - 30], [128, DG - 30], [128, DG], [62, DG]], PAPER, 3) + '<path d="M62,' + (DG - 18) + " H128 M85," + (DG - 30) + " V" + (DG - 40) + " H105 V" + (DG - 30) + '" fill="none" stroke="' + C.line + '" stroke-width="3"/>';
      }
      var TOOLS = [
        // hammer, saw, wrench, three planks, nails: [drawing, x, y (start, in the box), fly-to dx, dy, spin]
        ['<path d="M-3,-22 V20" stroke="' + C.line + '" stroke-width="4"/>' + poly([[-12, -28], [12, -28], [12, -18], [-12, -18]], PAPER, 2.6), 78, DG - 40, -40, -110, 300],
        [poly([[-26, -6], [20, -10], [22, 2], [-26, 6]], PAPER, 2.4) + '<path d="M-24,6 l3,4 l3,-4 l3,4 l3,-4 l3,4 l3,-4 l3,4 l3,-4 l3,4 l3,-4 l3,4 l3,-4 l3,4 l3,-4" fill="none" stroke="' + C.line + '" stroke-width="1.4"/>', 112, DG - 42, 60, -130, -260],
        ['<path d="M-18,0 H14" stroke="' + C.line + '" stroke-width="4"/><path d="M14,-6 l8,0 l4,6 l-4,6 l-8,0" fill="none" stroke="' + C.line + '" stroke-width="3"/>', 96, DG - 36, 10, -150, 400],
        [poly([[-30, -4], [30, -4], [30, 4], [-30, 4]], PAPER, 2.4), 95, DG - 30, -80, -90, 200],
        [poly([[-26, -4], [26, -4], [26, 4], [-26, 4]], PAPER, 2.4), 95, DG - 30, 90, -80, -220],
        [poly([[-22, -4], [22, -4], [22, 4], [-22, 4]], PAPER, 2.4), 95, DG - 30, -10, -170, 160],
        ['<path d="M-6,-6 V6 M0,-8 V6 M6,-6 V6 M-9,-6 H-3 M-3,-8 H3 M3,-6 H9" stroke="' + C.line + '" stroke-width="2"/>', 100, DG - 34, 40, -70, 120],
      ];
      // The birdhouse, standing on the ground line at x 100: a post, a lopsided box, a crooked roof, the hole and a perch,
      // one nail sticking out. Three pieces (post, box, roof) that bang into place.
      var BH = [
