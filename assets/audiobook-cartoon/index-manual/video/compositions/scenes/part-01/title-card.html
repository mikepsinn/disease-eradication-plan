<template id="title-card-template">
  <!-- title-card · the period title card (KIT.titleScene, look "atomic"): the book's title on the plain navy card
       under the film's emblem, the heading words coming in on the spoken words. "(for": "(for Busy People)" slides in
       under them. "Busy": a busy man in a suit and bowler sprints left to right along the bottom of the card, legs
       scissoring, his forearm up in front of his face so he can read his wristwatch. "A": the subtitle pill.
       "Step-by-Step": his skeleton, in the same bowler, strolls slowly back the other way, still checking the watch,
       until the card goes to black. These options are YOU, the viewer, from Part 10 on. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="title-card" data-width="1920" data-height="1080" data-start="0" data-duration="8.52">
    <div id="title-card-cam">
      <div id="title-card-bg"></div>
      <div id="title-card-back"></div>
      <div id="title-card-words"></div>
      <div id="title-card-art"></div>
    </div>
    <div id="title-card-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/title.js"></script>
  <script>
    KIT.titleScene({
      id: "title-card",
      seed: 101,
      lines: [["HOW", "TO", "END"], ["WAR", "AND", "DISEASE"], { words: ["(for", "Busy", "People)"], style: "label", cue: "(for" }],
      linesTall: [["HOW", "TO", "END"], ["WAR", "AND"], ["DISEASE"], { words: ["(for", "Busy", "People)"], style: "label", cue: "(for" }],
      spoken: ["How", "to", "End", "War", "and", "Disease"],
      sub: { text: "A Step-by-Step Guide to Optimizing Your Terrible Civilization", cue: "A" },
      // Three heading lines and a pill: the emblem shrinks up out of their way (the sketch's layout), so the
      // heading and the pill sit high and the busy man has the bottom of the card to himself.
      size: KIT.V ? 170 : 124,
      cy: KIT.V ? 880 : 470,
      minTop: KIT.V ? 700 : 300,
      maxH: KIT.V ? 520 : 330,
      // The busy man, then his skeleton (YOU, from Part 10 on).
      gag: function (c) {
        var C = c.C, W = c.W, V = c.V, D = c.D, f = function (n) { return n.toFixed(1); };
        // the emblem, smaller and higher (the navy card behind it is the camera's own background)
        var E = c.emblem, ES = V ? 0.8 : 0.58, EY = V ? 400 : 150;
        c.cam.style.background = C.navy;
        c.bg.style.transformOrigin = E.at[0] + "px " + E.at[1] + "px";
        c.bg.style.transform = "translateY(" + (EY - E.at[1]) + "px) scale(" + ES + ")";
        var copy = function (a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; };
        var YOU = { tone: 2, outfit: "suit", hat: "bowler", mood: "eager" };
        // running right: the right arm folded up in front of his face (the watch), the left arm pumping
        var RUN = copy(YOU, { look: "right", arms: [[-40, -80], [70, 172]] });
        // strolling left: the left arm (now the near one, in front) folded up to the watch, the right hanging
        var BONES = copy(YOU, { skeleton: true, look: "left", arms: [[-70, -172], [8, 4]] });
        var RR = KIT.rig(RUN), RB = KIT.rig(BONES);
        var watch = function (h) {
          return '<circle cx="' + f(h[0]) + '" cy="' + f(h[1] - 3) + '" r="6.5" fill="' + C.cream + '" stroke="' + C.line + '" stroke-width="2.4"/>' +
            '<path d="M' + f(h[0]) + "," + f(h[1] - 3) + " v-4 M" + f(h[0]) + "," + f(h[1] - 3) + ' h3" stroke="' + C.line + '" stroke-width="1.4"/>';
        };
        // where he runs: under the pill, feet a little above the bottom (16:9: as high as the room allows)
        // (the pill is one line in 16:9, two in 9:16)
        var pillBottom = c.layout.pillTop + (V ? 140 : 90), headTop = RR.top[1] - 24;
        var K = V ? 1.9 : 0.84, FEET = V ? Math.min(1880, pillBottom + 50 + K * (100 - headTop)) : 955;
        // A cream rim round a drawing (the same drawing, every color cream and every line thicker, under it), so the
        // navy suit and the bowler read on the navy card. Its ids are renamed, so the real drawing keeps its own.
        // lines: false leaves out the stroked lines (a skeleton's bones are cream already; only its skull, feet and
        // bowler get the rim).
        var rim = function (m, lines) {
          return '<g class="rim">' + m.replace(/<(path|rect|circle|ellipse|polygon)\b([^>]*?)(\/?)>/g, function (x, tag, a, sl) {
            var none = /fill="none"/.test(a), sw = /stroke-width="([\d.]+)"/.exec(a);
            if (none && !lines) return "";
            a = a.replace(/\s(fill|stroke|stroke-width|stroke-linejoin|stroke-miterlimit|stroke-linecap|opacity|fill-opacity)="[^"]*"/g, "");
            return "<" + tag + a + ' fill="' + (none ? "none" : C.cream) + '" stroke="' + C.cream + '" stroke-width="' + ((sw ? +sw[1] : 0) + 7) + '" stroke-linejoin="round" stroke-linecap="round"' + sl + ">";
          }).replace(/id="([^"]+)"/g, 'id="rim-$1"').replace(/url\(#([^)]+)\)/g, "url(#rim-$1)") + "</g>";
        };
        var runArt = KIT.person(RUN) + watch(RR.hand[1]), boneArt = KIT.person(BONES) + watch(RB.hand[0]);
        var runSvg = '<g id="title-card-run" opacity="0"><g transform="scale(' + K + ')"><g id="title-card-run-lean">' + rim(runArt, true) + runArt + "</g></g></g>";
        var boneSvg = '<g id="title-card-bones" opacity="0"><g transform="scale(' + K + ')"><g id="title-card-bones-bob">' + rim(boneArt, false) + boneArt + "</g></g></g>";
        var lines = '<g id="title-card-speed" opacity="0">' + [0, 1, 2].map(function (i) {
          return '<path d="M0,' + f((-120 + i * 34) * K) + " H" + f(-(110 + i * 40) * K) + '" stroke="' + C.cream + '" stroke-width="' + f(5 * K / 1.05) + '" stroke-linecap="round" opacity="0.6"/>';
        }).join("") + "</g>";
        c.art.innerHTML = KIT.svg(W, c.H, lines + runSvg + boneSvg);
        var run = document.getElementById("title-card-run"), lean = document.getElementById("title-card-run-lean");
        var speed = document.getElementById("title-card-speed"), bones = document.getElementById("title-card-bones"), bob = document.getElementById("title-card-bones-bob");
        // (each limb twice: the rim's and the drawing's)
        var all = function (g, sel) { return Array.prototype.slice.call(g.querySelectorAll(sel)); };
        var rl = [all(lean, ".leg-l"), all(lean, ".leg-r")], ra = all(lean, ".arm-l");
        var bl = [all(bob, ".leg-l"), all(bob, ".leg-r")];
        var turn = function (els, deg, p) { els.forEach(function (e) { e.setAttribute("transform", "rotate(" + f(deg) + " " + f(p[0]) + " " + f(p[1]) + ")"); }); };
        lean.setAttribute("transform", "rotate(10 0 100)");

        var tRun = c.cue("Busy"), RUN_T = 1.4, x0 = -140, x1 = W + 160;
        var tWalk = c.cue("Step-by-Step"), bx0 = W + 130, bx1 = W * (V ? 0.42 : 0.5);
        KIT.onTime(c.tl, D, function (t) {
          // the sprint
          var u = (t - tRun) / RUN_T;
          if (u > 0 && u < 1) {
            var x = x0 + (x1 - x0) * u, ph = Math.sin((t - tRun) * 26), hop = Math.abs(Math.cos((t - tRun) * 26)) * 6 * K;
            run.setAttribute("opacity", 1);
            run.setAttribute("transform", "translate(" + f(x) + "," + f(FEET - 100 * K - hop) + ")");
            turn(rl[0], 38 * ph, RR.hip[0]); turn(rl[1], -38 * ph, RR.hip[1]); turn(ra, -34 * ph, RR.shoulder[0]);
            speed.setAttribute("opacity", 1);
            speed.setAttribute("transform", "translate(" + f(x - 30 * K) + "," + f(FEET) + ")");
          } else { run.setAttribute("opacity", 0); speed.setAttribute("opacity", 0); }
          // the stroll back, slow and steady, still checking the watch
          var w = (t - tWalk) / (D - tWalk);
          if (w > 0) {
            var bx = bx0 + (bx1 - bx0) * w, s = Math.sin((t - tWalk) * 5.2);
            bones.setAttribute("opacity", 1);
            bones.setAttribute("transform", "translate(" + f(bx) + "," + f(FEET - 100 * K) + ")");
            bob.setAttribute("transform", "translate(0," + f(-Math.abs(s) * 2.5) + ")");
            turn(bl[0], 16 * s, RB.hip[0]); turn(bl[1], -16 * s, RB.hip[1]);
          } else bones.setAttribute("opacity", 0);
        });
      },
    });
  </script>
</template>
