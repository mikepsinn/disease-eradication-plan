<template id="604-papers-template">
  <!-- 604-papers · Layer B (storyboards/part-01-opening.md): the 604 bar. On "six" the red stack shoots past the top of
       the frame and the camera rides it up until an airplane swerves around it ("four"); on "one" the camera drops back
       to the one teal paper, which waves; then "604 : 1" and the labels land and the teal paper looks up. One red
       paper slides off the top of the stack, drifts down and flattens it (splat); its little arm waves weakly. -->
  <!-- The scene id starts with a digit, which is not a valid CSS #id selector: every element is reached by reference
       (q()) and styled inline, never by "#604-papers-..." selectors. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="604-papers" data-width="1920" data-height="1080" data-start="0" data-duration="9.856">
    <div id="604-papers-cam" style="position: absolute; inset: 0;">
      <div id="604-papers-bg" style="position: absolute; inset: 0;"></div>
      <div id="604-papers-view" style="position: absolute; overflow: hidden;"><div id="604-papers-world" style="position: absolute;"></div></div>
      <div id="604-papers-type" style="position: absolute; inset: 0;"></div>
      <div id="604-papers-pip" style="position: absolute; inset: 0;"></div>
      <div id="604-papers-grain" style="position: absolute; inset: 0;"></div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "604-papers";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;

      // Per canvas shape: ground y, the stack (center x, width, full height: a whole number of 24 px bills), the teal
      // paper (x, scale), where the stack's top sits on screen when the camera is up, the ratio, the labels and the cloud lanes.
      var L = V
        ? { G: 1290, sx: 330, sw: 200, sh: 24 * 150, tx: 740, ts: 1.7, topAt: 760, big: [740, 880, 150],
            weapons: [330, 1366, 52], testing: [["TESTING WHICH", 740, 1352], ["MEDICINES WORK", 740, 1400]], tsize: 40,
            lanes: [[90, 170], [540, 960]] }
        : { G: 790, sx: 800, sw: 200, sh: 24 * 142, tx: 1200, ts: 1.7, topAt: 420, big: [1310, 520, 170],
            weapons: [800, 864, 52], testing: [["TESTING WHICH MEDICINES WORK", 1200, 860]], tsize: 36,
            lanes: [[160, 560], [1040, 1520]] };
      var TOP = L.sh + 500;                  // sky drawn above the ground
      var top = L.G - L.sh;                  // world y of the stack's top once it has risen
      var H0 = 72;                           // the stack before "six": three papers
      var CAM = L.topAt - top;               // camera tilt (the world moves down by this much)

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));
      // The camera window: the paper's inner frame. The world inside it is the frame plus TOP px of sky above.
      q("view").style.cssText = "position:absolute;overflow:hidden;left:46px;top:46px;width:" + (W - 92) + "px;height:" + (H - 92) + "px;";
      q("world").style.cssText = "position:absolute;left:-46px;top:" + (-46 - TOP) + "px;width:" + W + "px;height:" + (H + TOP) + "px;";

      var rnd = KIT.rng(604);
      function cloud(x, y, s) {
        return '<g transform="translate(' + x.toFixed(0) + "," + y.toFixed(0) + ") scale(" + s.toFixed(2) + ')">' +
          '<path d="M-70,20 C-98,20 -98,-14 -64,-10 C-60,-44 -12,-50 -2,-22 C12,-48 58,-42 54,-8 C84,-10 88,20 62,20 Z" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="4.5" stroke-linejoin="round"/>' +
          '<path d="M-58,12 H48" stroke="' + C.line + '" stroke-width="2" opacity="0.35"/></g>';
      }
      function bird(x, y) {
        return '<path d="M' + (x - 14) + "," + y + " q7,-9 14,0 q7,-9 14,0" + '" fill="none" stroke="' + C.line + '" stroke-width="3.5" stroke-linecap="round"/>';
      }
      // Clouds and birds stream past during the climb; two clouds and some stars wait at the top.
      var sky = "";
      [0.1, 0.17, 0.26, 0.34, 0.43, 0.51, 0.6, 0.68, 0.77, 0.85].forEach(function (a, i) {
        var lane = L.lanes[i % 2];
        sky += cloud(lane[0] + rnd() * (lane[1] - lane[0]), L.G - a * L.sh, 0.8 + rnd() * 0.5);
      });
      [0.3, 0.5, 0.66].forEach(function (a, i) {
        var bx = L.lanes[(i + 1) % 2][0] + rnd() * (L.lanes[(i + 1) % 2][1] - L.lanes[(i + 1) % 2][0]);
        sky += bird(bx, L.G - a * L.sh) + bird(bx + 40, L.G - a * L.sh + 18) + bird(bx + 18, L.G - a * L.sh - 22);
      });
      sky += cloud(L.lanes[0][0] + 40, top + (V ? 330 : 150), 1.1) + cloud(L.lanes[1][1] - 80, top + (V ? 250 : 120), 1.25);
      sky += KIT.star(L.lanes[1][0] + 60, top - (V ? 330 : 280), 18, C.orange) + KIT.star(L.lanes[0][1] - 40, top - (V ? 200 : 300), 12, C.yellow) +
        KIT.star(L.lanes[1][1] - 160, top - (V ? 120 : 330), 10, C.yellow);

      // The stack: thin bills seen edge-on, each nudged a little so it reads as a pile of paper, not a bar.
      var x0 = L.sx - L.sw / 2, bills = "";
      for (var y = L.G - 12; y >= top - 0.5; y -= 12) {
        var j = Math.round((rnd() - 0.5) * 9), wj = Math.round((rnd() - 0.5) * 6);
        bills += '<rect x="' + (x0 + j) + '" y="' + y + '" width="' + (L.sw + wj) + '" height="12" rx="2" fill="' + C.money + '" stroke="' + C.line + '" stroke-width="2"/>' +
          '<path d="M' + (x0 + j + 8) + "," + (y + 4) + " H" + (x0 + j + L.sw + wj - 8) + '" stroke="#D4E4C6" stroke-width="1.4" opacity="0.7"/>';
      }
      bills += '<rect x="' + (x0 - 6) + '" y="' + top + '" width="' + (L.sw + 12) + '" height="' + L.sh + '" fill="url(#' + ID + '-hatch)" opacity="0.12"/>';
      var bs = 2.08;
      var topBill = '<g transform="translate(' + L.sx + "," + (top - 48 * bs) + ") scale(" + bs + ')"><g id="' + ID + '-topbill">' + KIT.money("war", 0.5) + "</g></g>";
      var stack = '<defs><clipPath id="' + ID + '-above"><rect x="0" y="' + (-TOP) + '" width="' + W + '" height="' + (TOP + L.G) + '"/></clipPath></defs>' +
        '<g clip-path="url(#' + ID + '-above)"><g id="' + ID + '-sway"><g id="' + ID + '-rise">' + bills + topBill + "</g></g></g>";

      // The one teal paper, with eyes (the portrait's) and a stick arm for waving.
      var eyes = '<circle cx="-5" cy="-3" r="4.4" fill="#FFF" stroke="' + C.line + '" stroke-width="1.5"/><circle cx="5" cy="-3" r="4.4" fill="#FFF" stroke="' + C.line + '" stroke-width="1.5"/>' +
        '<g id="' + ID + '-pupils"><circle cx="-5" cy="-3" r="2.3" fill="' + C.line + '"/><circle cx="5" cy="-3" r="2.3" fill="' + C.line + '"/></g>';
      var waveArm = '<g id="' + ID + '-wave"><path d="M46,-8 L62,-28 L66,-50" fill="none" stroke="' + C.line + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="66" cy="-50" r="5.5" fill="' + C.paper + '" stroke="' + C.line + '" stroke-width="3"/></g>';
      var teal = '<g transform="translate(' + L.tx + "," + (L.G - 48 * L.ts) + ") scale(" + L.ts + ')"><g id="' + ID + '-teal">' +
        KIT.money("med", 0.5) + eyes + waveArm + "</g></g>";

      var ground = '<path d="M60,' + L.G + " H" + (W - 60) + '" stroke="' + C.line + '" stroke-width="5"/>' +
        [0.08, 0.22, 0.4, 0.7, 0.86].map(function (f) {
          var gx = 60 + f * (W - 120);
          return '<path d="M' + gx + "," + L.G + " l-6,-14 M" + (gx + 6) + "," + L.G + " l2,-18 M" + (gx + 12) + "," + L.G + ' l8,-12" stroke="' + C.line + '" stroke-width="3" stroke-linecap="round"/>';
        }).join("");

      // The airplane, drawn around (0, 0) facing right.
      var plane = '<g id="' + ID + '-plane"><g id="' + ID + '-plane-rot"><g transform="scale(1.35)">' +
        '<path d="M-112,-12 h-46 M-104,8 h-34 M-96,26 h-22" stroke="' + C.line + '" stroke-width="4" stroke-linecap="round" opacity="0.55"/>' +
        '<path d="M-66,-4 L-86,-46 L-60,-46 L-38,-10 Z" fill="' + C.orange + '" stroke="' + C.line + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<path d="M-80,-4 Q-44,-24 28,-22 Q72,-20 80,0 Q72,18 28,18 L-58,12 Q-82,8 -80,-4 Z" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="4.5" stroke-linejoin="round"/>' +
        '<path d="M-66,4 H72" stroke="' + C.orange + '" stroke-width="6"/>' +
        [-26, -6, 14].map(function (wx) { return '<circle cx="' + wx + '" cy="-8" r="5" fill="' + C.peri + '" stroke="' + C.line + '" stroke-width="2.5"/>'; }).join("") +
        '<path d="M40,-20 Q56,-34 66,-12" fill="' + C.peri + '" stroke="' + C.line + '" stroke-width="3"/>' +
        '<ellipse cx="-8" cy="8" rx="36" ry="9" fill="' + C.tan + '" stroke="' + C.line + '" stroke-width="4"/>' +
        '<circle cx="80" cy="0" r="6" fill="' + C.line + '"/><ellipse id="' + ID + '-prop" cx="86" cy="0" rx="4" ry="28" fill="' + C.line + '" opacity="0.75"/></g></g></g>';

      // The button: one red paper slides off the top of the stack, drifts down and lands on the teal paper. Drawn
      // in world units, which equal frame units once the camera is back down. RS: its scale; it stands on the
      // flattened teal paper (PAN px tall) with its feet. The teal paper's arm then pokes out from under it.
      var RS = 2, PAN = 28, landY = L.G - PAN - 48 * RS;
      var redDrop = '<g id="' + ID + '-drop" opacity="0"><g transform="scale(' + RS + ')"><g id="' + ID + '-drop-sq">' + KIT.money("war", 0.5) + "</g></g></g>";
      var weakArm = '<g transform="translate(' + (L.tx + 90) + "," + (L.G - 12) + ") scale(" + L.ts + ')"><g id="' + ID + '-weak" opacity="0">' +
        '<path d="M0,0 L14,-18 L18,-40" fill="none" stroke="' + C.line + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="18" cy="-40" r="5.5" fill="' + C.paper + '" stroke="' + C.line + '" stroke-width="3"/></g></g>';
      var splatLines = '<g id="' + ID + '-splat" opacity="0">' + [[-1, -14], [-1, -40], [1, -14], [1, -40]].map(function (s) {
        var x = L.tx + s[0] * 128, y = L.G + s[1];
        return '<path d="M' + x + "," + y + " l" + s[0] * 34 + "," + (s[1] < -20 ? -18 : -2) + '" stroke="' + C.line + '" stroke-width="5" stroke-linecap="round"/>';
      }).join("") + "</g>";

      q("world").innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + (H + TOP) + '" viewBox="0 ' + (-TOP) + " " + W + " " + (H + TOP) + '">' +
        KIT.paperDefs(ID) + sky + ground + stack + teal + weakArm + redDrop + splatLines + plane + "</svg>";

      // The ratio and the labels, fixed to the frame (they arrive when the camera is back down).
      var b = L.big;
      var big = function (dx, dy, extra) {
        return '<text x="' + (b[0] + dx) + '" y="' + (b[1] + dy) + '" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="' + b[2] + '" ' + extra + ">604 : 1</text>";
      };
      var label = function (x, y, size, text, fill) {
        return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + size + '" letter-spacing="' + (size * 0.04).toFixed(1) + '" fill="' + fill + '">' + text + "</text>";
      };
      q("type").innerHTML = KIT.svg(W, H,
        '<g id="' + ID + '-big">' + big(b[2] * 0.05, b[2] * 0.07, 'fill="' + C.ink + '"') + big(0, 0, 'fill="' + C.ink + '" stroke="' + C.cream + '" stroke-width="' + (b[2] * 0.09).toFixed(1) + '" stroke-linejoin="round" style="paint-order:stroke"') + "</g>" +
        '<g id="' + ID + '-lab-w">' + label(L.weapons[0], L.weapons[1], L.weapons[2], "WEAPONS", C.war) + "</g>" +
        '<g id="' + ID + '-lab-t">' + L.testing.map(function (t) { return label(t[1], t[2], L.tsize, t[0], "#1D6E67"); }).join("") + "</g>");


      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "slide left");

      var six = cue("six"), four = cue("four"), one = cue("one");
      var world = q("world");
      // "six": the stack shoots up past the top of the frame (rising whistle), and the camera tilts up after it.
      tl.fromTo(q("rise"), { y: L.sh - H0 }, { y: 0, duration: 0.86, ease: "power2.out" }, six);
      tl.fromTo(world, { y: 0 }, { y: CAM, duration: 0.78, ease: "power2.inOut" }, six + 0.16);
      // "four": an airplane cruising at the top paper's height has to hop over it (whoosh); the top paper ducks.
      var py = top - 48 * bs, pl = q("plane"), pr = q("plane-rot");
      tl.fromTo(pl, { x: -260, y: py }, { x: L.sx - 330, y: py, duration: 0.3, ease: "none" }, four - 0.22);
      tl.to(pl, { x: L.sx - 110, y: py - 150, duration: 0.2, ease: "power1.out" }, four + 0.08);
      tl.to(pl, { x: L.sx + 130, y: py - 160, duration: 0.2, ease: "none" }, four + 0.28);
      tl.to(pl, { x: L.sx + 380, y: py - 40, duration: 0.24, ease: "power1.in" }, four + 0.48);
      tl.to(pl, { x: W + 260, y: py - 70, duration: 0.8, ease: "none" }, four + 0.72);
      tl.fromTo(pr, { rotation: 0, svgOrigin: "0 0" }, { rotation: -32, svgOrigin: "0 0", duration: 0.14, ease: "power2.out" }, four + 0.08);
      tl.to(pr, { rotation: 0, svgOrigin: "0 0", duration: 0.2 }, four + 0.24);
      tl.to(pr, { rotation: 24, svgOrigin: "0 0", duration: 0.16 }, four + 0.46);
      tl.to(pr, { rotation: -6, svgOrigin: "0 0", duration: 0.24 }, four + 0.66);
      tl.to(pr, { rotation: 0, svgOrigin: "0 0", duration: 0.3 }, four + 0.9);
      tl.fromTo(q("prop"), { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0.15, transformOrigin: "50% 50%", duration: 0.05, repeat: 39, yoyo: true, ease: "none" }, four - 0.22);
      tl.to(q("topbill"), { scaleY: 0.7, scaleX: 1.1, svgOrigin: "0 46", duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out" }, four + 0.2);
      // the near miss sets the stack creaking
      var so = L.sx + " " + L.G;
      [[-0.7, 0.35], [0.5, 0.45], [-0.3, 0.45], [0.12, 0.4], [0, 0.4]].reduce(function (t, k) {
        tl.to(q("sway"), { rotation: k[0], svgOrigin: so, duration: k[1], ease: "sine.inOut" }, t);
        return t + k[1];
      }, four + 0.35);
      // "one": the camera drops all the way back down (falling whistle) and lands with a bump.
      tl.to(world, { y: 0, duration: 0.62, ease: "power2.in" }, one);
      tl.to(world, { y: -26, duration: 0.07, ease: "power1.out" }, one + 0.62);
      tl.to(world, { y: 0, duration: 0.3, ease: "power2.out" }, one + 0.69);
      // the one teal paper raises its arm and waves
      var wave = q("wave");
      tl.fromTo(wave, { rotation: 150, svgOrigin: "46 -8" }, { rotation: -16, svgOrigin: "46 -8", duration: 0.16, ease: "back.out(2)" }, one + 0.78);
      tl.to(wave, { rotation: 20, svgOrigin: "46 -8", duration: 0.18, repeat: 5, yoyo: true, ease: "sine.inOut" }, one + 0.94);
      tl.to(wave, { rotation: 150, svgOrigin: "46 -8", duration: 0.22, ease: "power2.in" }, one + 2.1);
      // after "work.": "604 : 1" and the labels land; a beat later the teal paper leans back and looks up
      var lab = KIT.cueEnd(ID, "work."), look = KIT.after(ID, "work.");
      tl.fromTo(q("big"), { opacity: 0, scale: 2.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.24, ease: "back.out(2)" }, lab);
      tl.fromTo(q("lab-w"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, lab + 0.1);
      tl.fromTo(q("lab-t"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, lab + 0.18);
      var teal = q("teal");
      gsap.set(teal, { svgOrigin: "0 46" });
      tl.to(teal, { rotation: -15, duration: 0.3, ease: "back.out(2)" }, look);
      tl.to(q("pupils"), { x: -1.6, y: -2, duration: 0.12 }, look);
      // then one red paper slides off the top of the stack and drifts down, rocking like a leaf, until it drops
      // like an anvil and flattens the teal paper (splat). Its little arm pokes out and waves, weakly (squeak).
      var dr = q("drop"), sq = q("drop-sq"), sx = L.sx + L.sw / 2;
      var path = V
        ? [[sx + 40, -110, 14], [sx + 180, 200, -20], [sx + 90, 420, 16]]
        : [[sx + 70, -110, 14], [sx + 240, 130, -20], [sx + 160, 300, 16]];
      gsap.set(dr, { svgOrigin: "0 0" });
      gsap.set(sq, { svgOrigin: "0 48" });
      var t0 = look + 0.05, hit = look + 0.6;
      tl.set(dr, { opacity: 1 }, t0);
      tl.fromTo(dr, { x: path[0][0], y: path[0][1], rotation: path[0][2] }, { x: path[1][0], y: path[1][1], rotation: path[1][2], duration: 0.22, ease: "sine.inOut", immediateRender: false }, t0);
      tl.to(dr, { x: path[2][0], y: path[2][1], rotation: path[2][2], duration: 0.2, ease: "sine.inOut" }, t0 + 0.22);
      tl.to(dr, { x: L.tx, y: landY, rotation: 0, duration: hit - (t0 + 0.42), ease: "power3.in" }, t0 + 0.42);
      tl.to(teal, { rotation: 0, scaleY: 0.2, scaleX: 1.3, duration: 0.05, ease: "power2.out" }, hit - 0.04);
      tl.set(q("wave"), { opacity: 0 }, hit);
      tl.fromTo(sq, { scaleY: 1, scaleX: 1 }, { scaleY: 0.74, scaleX: 1.16, duration: 0.06, ease: "power2.out", immediateRender: false }, hit);
      tl.to(sq, { scaleY: 1, scaleX: 1, duration: 0.24, ease: "back.out(3)" }, hit + 0.06);
      tl.set(q("splat"), { opacity: 1 }, hit);
      tl.set(q("splat"), { opacity: 0 }, hit + 0.26);
      var weak = q("weak");
      gsap.set(weak, { svgOrigin: "0 0" });
      tl.set(weak, { opacity: 1 }, hit + 0.1);
      tl.fromTo(weak, { rotation: 70, scaleY: 0.3 }, { rotation: -10, scaleY: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, hit + 0.1);
      [[12, 0.12], [-4, 0.12], [6, 0.14]].reduce(function (t, k) {
        tl.to(weak, { rotation: k[0], duration: k[1], ease: "sine.inOut" }, t);
        return t + k[1];
      }, hit + 0.24);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
