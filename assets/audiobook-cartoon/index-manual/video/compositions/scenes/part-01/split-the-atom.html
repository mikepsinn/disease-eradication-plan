<template id="split-the-atom-template">

       TO BE CUT is stamped on it; "naturally,": the Scientist slides in, shears open round the atom; "cut": SNIP, the

  <div id="root" data-composition-id="split-the-atom" data-width="1920" data-height="1080" data-start="0" data-duration="16.08">

  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>

  <script src="assets/js/collage.js"></script>

</template>
