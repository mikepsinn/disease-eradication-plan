<template id="split-the-atom-template">
  <!-- split-the-atom · Layer B (storyboards/part-01-opening.md): "1945" stamps on; the ATOM card is snipped in half;
       a proud human powers bulbs and a toaster with an atom; then two humans aim their atoms at each other in the dark,
       fire them, and the bomb goes off: a white flash, a mushroom cloud, then both standing there charred, blinking, and the
       charred toaster pops up two slices of black toast. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #split-the-atom-cam, #split-the-atom-bg, #split-the-atom-art, #split-the-atom-pip, #split-the-atom-grain { position: absolute; inset: 0; }
    #split-the-atom-flash { position: absolute; inset: -40px; background: #FFFFFF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="split-the-atom" data-width="1920" data-height="1080" data-start="0" data-duration="25.24">
    <div id="split-the-atom-cam">
      <div id="split-the-atom-bg"></div>
      <div id="split-the-atom-art"></div>
      <!-- the blast's white flash: over the Earth art, under Wishonia's corner frame (her reaction stays visible) -->
      <div id="split-the-atom-flash"></div>
      <div id="split-the-atom-pip"></div>
    </div>
    <!-- outside the zoom, so the board stays in its corner as in the office scene before -->
    <div id="split-the-atom-board"><div id="split-the-atom-board-in"></div></div>
    <div id="split-the-atom-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "split-the-atom";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var P = function (s) { return ID + "-" + s; };
      var f = function (n) { return n.toFixed(1); };

      // stamp: center x, y, scale. card: top-left x, y, scale (drawn 680 x 250, cut at x 490); split: how far the halves part.
      // A and B stand at ax and bx (feet at y + 104 s) from "I assumed" on; A first pops up at the cut.
      // The workbench is drawn in its own units (u px each), with A's outstretched hand at its origin.
      // nuke: the mushroom cloud's scale (KIT.nuke is about 520 wide and 560 tall), standing on the floor between them.
      var L = V
        ? { stamp: [400, 600, 0.85], card: [115, 880, 1.25], split: [-50, 60], s: 2.0, ax: 200, bx: 910, y: 1192, bulbs: 3, gap: 60, popY: 520, floor: [60, 1020], nuke: 1.15 }
        : { stamp: [1420, 220, 0.9], card: [300, 380, 1.25], split: [-80, 90], s: 2.3, ax: 480, bx: 1460, y: 621, bulbs: 4, gap: 70, popY: 380, floor: [90, 1600], nuke: 1.1 };
      var s = L.s, u = s / 1.8, CUT = 490;
      var cutX = L.card[0] + CUT * L.card[2];
      // In person units: A's raised left hand and the atom floating above it, A's right hand held out (the plug), B's mirror image.
      var HAND_A = [-30.4, -76], ATOM_A = [-32.4, -98], HAND_OUT = [61.35, -0.4], ATOM_B = [32.4, -98];
      var hx = L.ax + s * HAND_OUT[0], hy = L.y + s * HAND_OUT[1];
      var T = 55, F = 188, TOAST_X = 100, TOAST_W = 130, TOAST_TOP = T - 86, BULB0 = 290;
      var tableR = BULB0 + (L.bulbs - 1) * L.gap + 40;
      var floorY = L.y + 104 * s;

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // ── Drawings ──
      function stamp() {
        return '<g transform="translate(' + L.stamp[0] + "," + L.stamp[1] + ") scale(" + L.stamp[2] + ') rotate(-6)"><g id="' + P("stamp") + '">' +
          '<rect x="-220" y="-110" width="440" height="190" rx="14" fill="none" stroke="' + C.war + '" stroke-width="9"/>' +
          '<rect x="-204" y="-94" width="408" height="158" rx="8" fill="none" stroke="' + C.war + '" stroke-width="3"/>' +
          '<text x="0" y="40" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="150" fill="' + C.war + '">1945</text>' +
          '<rect x="-220" y="-110" width="440" height="190" fill="url(#' + P("hatch") + ')" opacity="0.12"/></g></g>';
      }
      var CARD = '<rect x="10" y="12" width="680" height="250" fill="' + C.ink + '" opacity="0.85"/>' +
        '<rect x="0" y="0" width="680" height="250" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="5"/>' +
        '<rect x="0" y="0" width="680" height="250" fill="url(#' + P("fine") + ')" opacity="0.16"/>' +
        '<text x="48" y="100" fill="' + C.line + '"><tspan font-family="Fraunces" font-weight="900" font-size="84">ATOM</tspan>' +
        '<tspan dx="14" font-family="Inter" font-style="italic" font-weight="600" font-size="36">(Greek):</tspan></text>' +
        '<path d="M48,128 H632" stroke="' + C.orange + '" stroke-width="4"/>' +
        '<text x="48" y="206" font-family="Inter" font-weight="600" font-size="62" fill="' + C.line + '">unable to be</text>' +
        '<text x="' + (CUT + 22) + '" y="206" font-family="Inter" font-weight="600" font-size="62" fill="' + C.line + '">cut</text>';
      var jag = [];
      for (var j = 0; j <= 12; j++) jag.push(CUT + (j % 2 ? 9 : -9) + "," + (-20 + j * 25));
      // Scissors: pivot at (0,0), blades up, handles down; k scales them. Each half opens by rotating.
      function half(k, id) {
        return '<g' + (id ? ' id="' + id + '"' : "") + '><path d="M' + -6 * k + "," + 8 * k + " L" + 6 * k + "," + 8 * k + " L" + k + "," + -100 * k + ' Z" fill="#E6E2D6" stroke="' + C.line + '" stroke-width="' + 3 * k + '" stroke-linejoin="round"/>' +
          '<path d="M0,' + 6 * k + " L0," + 34 * k + '" stroke="' + C.line + '" stroke-width="' + 6 * k + '"/>' +
          '<ellipse cx="0" cy="' + 52 * k + '" rx="' + 12 * k + '" ry="' + 17 * k + '" fill="none" stroke="' + C.orange + '" stroke-width="' + 6 * k + '"/>' +
          '<ellipse cx="0" cy="' + 52 * k + '" rx="' + 12 * k + '" ry="' + 17 * k + '" fill="none" stroke="' + C.line + '" stroke-width="' + 1.6 * k + '"/></g>';
      }
      function scissors(k, ids, open) {
        var a = open || 0;
        return '<g transform="rotate(' + a + ')">' + half(k, ids && ids[0]) + '</g><g transform="rotate(' + -a + ')">' + half(k, ids && ids[1]) + "</g>" +
          '<circle cx="0" cy="0" r="' + 4 * k + '" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="' + 1.6 * k + '"/>';
      }
      // A glowing atom in person units at (x, y).
      function atom(x, y) {
        var orbit = function (a) { return '<ellipse cx="' + x + '" cy="' + y + '" rx="25" ry="8.5" fill="none" stroke="' + C.line + '" stroke-width="2.6" transform="rotate(' + a + " " + x + " " + y + ')"/>'; };
        return '<circle class="glow" cx="' + x + '" cy="' + y + '" r="31" fill="' + C.war + '" opacity="0.24"/>' +
          '<circle class="glow" cx="' + x + '" cy="' + y + '" r="20" fill="' + C.yellow + '" opacity="0.5"/>' +
          orbit(0) + orbit(60) + orbit(120) +
          '<circle cx="' + x + '" cy="' + y + '" r="8" fill="' + C.war + '" stroke="' + C.line + '" stroke-width="2.6"/>' +
          '<circle cx="' + (x + 25) + '" cy="' + y + '" r="3.4" fill="' + C.line + '"/><circle cx="' + (x - 12) + '" cy="' + (y - 19) + '" r="3.4" fill="' + C.line + '"/>';
      }
      function at(x, y, k, inner) {
        return '<g transform="translate(' + f(x) + "," + f(y) + ") scale(" + k + ')">' + inner + "</g>";
      }
      // Workbench parts, in bench units (A's outstretched hand at 0,0; the table top at y T).
      function bulb(i, x, pre) {
        var r = 26, cy = T - 50, rays = "";
        for (var k = 0; k < 8; k++) {
          var a = (k * Math.PI) / 4;
          rays += '<path d="M' + f(x + (r + 9) * Math.cos(a)) + "," + f(cy + (r + 9) * Math.sin(a)) + " L" + f(x + (r + 20) * Math.cos(a)) + "," + f(cy + (r + 20) * Math.sin(a)) + '" stroke="' + C.orange + '" stroke-width="5" stroke-linecap="round"/>';
        }
        return '<circle cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="4"/>' +
          '<circle cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="url(#' + P("cross") + ')" opacity="0.35"/>' +
          '<g id="' + P(pre + "lit-" + i) + '" opacity="0">' + rays + '<circle cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="4"/></g>' +
          '<path d="M' + (x - 9) + "," + (cy + 8) + " l4.5,-12 l4.5,12 l4.5,-12 l4.5,12" + '" fill="none" stroke="' + C.line + '" stroke-width="2.6" stroke-linejoin="round"/>' +
          '<rect x="' + (x - 12) + '" y="' + (T - 28) + '" width="24" height="28" fill="' + C.tan + '" stroke="' + C.line + '" stroke-width="3"/>' +
          '<path d="M' + (x - 12) + "," + (T - 19) + " h24 M" + (x - 12) + "," + (T - 10) + ' h24" stroke="' + C.line + '" stroke-width="2"/>';
      }
      function toaster(pre) {
        var x = TOAST_X, w = TOAST_W, t = TOAST_TOP, sw = w / 2 - 26;
        return '<g id="' + P(pre + "toaster") + '"><rect x="' + x + '" y="' + t + '" width="' + w + '" height="86" rx="20" fill="#E4E0D2" stroke="' + C.line + '" stroke-width="5"/>' +
          '<rect x="' + x + '" y="' + t + '" width="' + w + '" height="86" rx="20" fill="url(#' + P("fine") + ')" opacity="0.3"/>' +
          '<rect x="' + (x + 18) + '" y="' + (t + 7) + '" width="' + sw + '" height="9" rx="4" fill="' + C.line + '"/><rect x="' + (x + w / 2 + 8) + '" y="' + (t + 7) + '" width="' + sw + '" height="9" rx="4" fill="' + C.line + '"/>' +
          '<g id="' + P(pre + "toaster-glow") + '" opacity="0"><rect x="' + (x + 20) + '" y="' + (t + 9) + '" width="' + (sw - 4) + '" height="5" rx="2" fill="' + C.orange + '"/><rect x="' + (x + w / 2 + 10) + '" y="' + (t + 9) + '" width="' + (sw - 4) + '" height="5" rx="2" fill="' + C.orange + '"/></g>' +
          '<rect x="' + (x + w - 4) + '" y="' + (t + 26) + '" width="16" height="10" rx="3" fill="' + C.rust + '" stroke="' + C.line + '" stroke-width="2.5"/>' +
          '<circle cx="' + (x + w - 28) + '" cy="' + (t + 60) + '" r="8" fill="' + C.cream + '" stroke="' + C.line + '" stroke-width="2.5"/>' +
          '<path d="M' + (x + 20) + "," + (t + 40) + " h" + (w - 70) + '" stroke="' + C.line + '" stroke-width="2" opacity="0.4"/></g>';
      }
      // A slice of toast, burnt black (it pops out of the burnt toaster after the blast).
      function toast(i) {
        var sw = TOAST_W / 2 - 26, x = i ? TOAST_X + TOAST_W / 2 + 10 : TOAST_X + 20, w = sw - 4, t = TOAST_TOP + 6;
        return '<g id="' + P("toast-" + i) + '"><path d="M' + x + "," + (t + 64) + " V" + (t + 10) + " q0,-10 " + w / 2 + ",-10 q" + w / 2 + ",0 " + w / 2 + ",10 V" + (t + 64) + ' Z" fill="#2A221C" stroke="' + C.line + '" stroke-width="4"/>' +
          '<rect x="' + (x + 5) + '" y="' + (t + 8) + '" width="' + (w - 10) + '" height="56" rx="4" fill="#3B312A"/>' +
          '<circle cx="' + (x + w * 0.35) + '" cy="' + (t + 26) + '" r="2.4" fill="#5A4C40"/><circle cx="' + (x + w * 0.62) + '" cy="' + (t + 44) + '" r="2" fill="#5A4C40"/></g>';
      }
      // Burn a drawing's markup (as KIT's charred people are burnt): every color but the ink turns a dark brown of the same lightness.
      function burn(markup) {
        var ink = C.line.toUpperCase();
        return markup.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g, function (m, a, col) {
          if (col.toUpperCase() === ink) return m;
          var n = parseInt(col.slice(1), 16), l = (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255, v = Math.round(28 + l * 46);
          return a + '="rgb(' + (v + 8) + "," + v + "," + Math.max(0, v - 6) + ')"';
        });
      }
      // A cloud of soot in KIT.nuke's style (navy outline, a body, highlights on every other puff), around (0,0).
      function soot(circles) {
        var outline = circles.map(function (c) { return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + c[2] + '" fill="' + C.line + '" stroke="' + C.line + '" stroke-width="10"/>'; }).join("");
        var body = circles.map(function (c) { return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + c[2] + '" fill="#8E8780"/>'; }).join("");
        var hi = circles.filter(function (c, i) { return i % 2 === 0; }).map(function (c) {
          return '<circle cx="' + (c[0] - c[2] * 0.25) + '" cy="' + (c[1] - c[2] * 0.3) + '" r="' + c[2] * 0.42 + '" fill="#C9C2B8" opacity="0.85"/>';
        }).join("");
        return outline + body + hi;
      }

      // ── Assemble ──
      var A1 = KIT.person({ tone: 1, outfit: "shirt", color: 0, hair: 0, mood: "smile", arms: [[200, 190], [50, 70]] });
      var A2 = KIT.person({ tone: 1, outfit: "shirt", color: 0, hair: 0, mood: "flat", brows: true, look: "right", arms: [[200, 190], [20, 10]] });
      var B1 = KIT.person({ tone: 3, outfit: "dress", color: 3, hair: 1, mood: "smile", arms: [[-20, -10], [160, 170]] });
      var B2 = KIT.person({ tone: 3, outfit: "dress", color: 3, hair: 1, mood: "flat", brows: true, look: "left", arms: [[-20, -10], [160, 170]] });
      // After the blast: the same two, charred, frozen in the aim (the arm turned AIM degrees about its shoulder).
      var AIM = 95;
      var A3 = KIT.person({ tone: 1, outfit: "shirt", color: 0, hair: 0, look: "right", charred: true, arms: [[200 - AIM, 190 - AIM], [20, 10]] });
      var B3 = KIT.person({ tone: 3, outfit: "dress", color: 3, hair: 1, look: "left", charred: true, arms: [[-20, -10], [160 + AIM, 170 + AIM]] });
      // Where the aimed atoms are (world), and the middle, where they meet.
      function turn(p, o, deg) {
        var r = (deg * Math.PI) / 180, dx = p[0] - o[0], dy = p[1] - o[1];
        return [o[0] + dx * Math.cos(r) - dy * Math.sin(r), o[1] + dx * Math.sin(r) + dy * Math.cos(r)];
      }
      var aimA = turn(ATOM_A, [-17, -26], AIM), aimB = turn(ATOM_B, [17, -26], -AIM);
      var aimAw = [L.ax + s * aimA[0], L.y + s * aimA[1]], aimBw = [L.bx + s * aimB[0], L.y + s * aimB[1]];
      var MID = [(aimAw[0] + aimBw[0]) / 2, (aimAw[1] + aimBw[1]) / 2];
      var aAtom = [L.ax + s * ATOM_A[0], L.y + s * ATOM_A[1]];
      var boxIn = [hx + u * 30, hy + u * (T - 12)];
      var cord = '<path id="' + P("cord") + '" d="M' + f(aAtom[0]) + "," + f(aAtom[1] + 26 * s) + " C" + f(aAtom[0] - 30 * s) + "," + f(L.y + 40 * s) + " " + f(hx - 20 * s) + "," + f(L.y + 70 * s) + " " + f(boxIn[0]) + "," + f(boxIn[1]) +
        '" fill="none" stroke="' + C.line + '" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>';
      var A = at(L.ax, L.y, s, '<g id="' + P("A-move") + '"><g id="' + P("A-pop") + '"><g id="' + P("A-d1") + '">' + A1 + '</g><g id="' + P("A-d2") + '" opacity="0">' + A2 + "</g>" +
        '<g id="' + P("A-d3") + '" opacity="0">' + A3 + "</g>" +
        '<g transform="translate(' + HAND_A[0] + "," + (HAND_A[1] - 22) + ')"><g id="' + P("A-scis") + '">' + scissors(0.45, null, 14) + "</g></g></g></g>");
      var B = at(L.bx, L.y, s, '<g id="' + P("B-pop") + '"><g id="' + P("B-d1") + '">' + B1 + '</g><g id="' + P("B-d2") + '" opacity="0">' + B2 + "</g>" +
        '<g id="' + P("B-d3") + '" opacity="0">' + B3 + "</g></g>");
      var card = '<g transform="translate(' + L.card[0] + "," + L.card[1] + ") scale(" + L.card[2] + ')"><g id="' + P("card") + '">' +
        '<defs><clipPath id="' + P("clip-l") + '"><polygon points="-30,-30 ' + jag.join(" ") + ' -30,300"/></clipPath>' +
        '<clipPath id="' + P("clip-r") + '"><polygon points="720,-30 ' + jag.join(" ") + ' 720,300"/></clipPath></defs>' +
        '<g id="' + P("half-l") + '"><g clip-path="url(#' + P("clip-l") + ')">' + CARD + "</g></g>" +
        '<g id="' + P("half-r") + '"><g clip-path="url(#' + P("clip-r") + ')">' + CARD + "</g></g>" +
        '<path id="' + P("dash") + '" d="M' + CUT + ",-14 V264" + '" stroke="' + C.line + '" stroke-width="3" stroke-dasharray="12 9" opacity="0"/></g>' +
        '<g transform="translate(' + CUT + ',-30) rotate(180)"><g id="' + P("scis") + '">' + scissors(3.2, [P("sc1"), P("sc2")]) + "</g></g></g>";
      // The workbench; pre "b-" is its burnt copy, which takes over in the flash.
      function benchSvg(pre) {
        var bulbs = "";
        for (var b = 0; b < L.bulbs; b++) bulbs += bulb(b, BULB0 + b * L.gap, pre);
        var plug = '<g id="' + P(pre + "plug") + '"><rect x="-7" y="-9" width="22" height="18" rx="4" fill="' + C.slate + '" stroke="' + C.line + '" stroke-width="3"/>' +
          '<path d="M15,-4 h12 M15,4 h12" stroke="' + C.line + '" stroke-width="3.5"/></g>';
        return '<g id="' + P(pre + "table") + '"' + (pre ? ' opacity="0"' : "") + ">" +
          '<path d="M' + (TOAST_X + 4) + "," + (T - 14) + " C" + (TOAST_X - 30) + "," + (T - 4) + " -30,60 0,0" + '" fill="none" stroke="' + C.line + '" stroke-width="4"/>' + plug +
          '<rect x="30" y="-30" width="40" height="' + (T + 30) + '" rx="4" fill="' + C.cream + '" stroke="' + C.line + '" stroke-width="4"/>' +
          '<rect x="38" y="-9" width="24" height="18" rx="3" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="2.5"/><rect x="38" y="20" width="24" height="18" rx="3" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="2.5"/>' +
          '<path d="M70,' + (T - 4) + " H" + (tableR - 30) + '" stroke="' + C.line + '" stroke-width="4"/>' +
          toaster(pre) + bulbs +
          '<rect x="-10" y="' + T + '" width="' + (tableR + 10) + '" height="16" fill="' + C.tan + '" stroke="' + C.line + '" stroke-width="4"/>' +
          '<path d="M10,' + (T + 16) + " V" + F + " M" + (tableR - 20) + "," + (T + 16) + " V" + F + '" stroke="' + C.line + '" stroke-width="8" stroke-linecap="round"/></g>';
      }
      var bench = at(hx, hy, u, benchSvg("") + burn(benchSvg("b-")));
      var floor = '<path id="' + P("floor") + '" d="M' + L.floor[0] + "," + f(floorY) + " H" + L.floor[1] + '" stroke="' + C.line + '" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>';
      var dark = '<rect id="' + P("dark") + '" width="' + W + '" height="' + H + '" fill="' + C.deep + '" opacity="0"/>';
      // Above the dark: the two atoms (rotating with their arms, then fired across), and the toast.
      var atomA = at(L.ax, L.y, s, '<g id="' + P("atomA-fly") + '"><g id="' + P("atomA-rot") + '"><g id="' + P("atomA-pop") + '">' + atom(ATOM_A[0], ATOM_A[1]) + "</g></g></g>");
      var atomB = at(L.bx, L.y, s, '<g id="' + P("atomB-fly") + '"><g id="' + P("atomB-up") + '"><g id="' + P("atomB-rot") + '">' + atom(ATOM_B[0], ATOM_B[1]) + "</g></g></g>");
      // The atoms' streaks to the middle, the scorch on the floor, the mushroom cloud, and the soot around each human.
      var streak = function (id, p) {
        var d = "M" + f(p[0]) + "," + f(p[1]) + " L" + f(MID[0]) + "," + f(MID[1]);
        return '<g id="' + P(id) + '"><path class="streak" d="' + d + '" stroke="' + C.war + '" stroke-width="' + 7 * s + '" stroke-linecap="round" opacity="0.75" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>' +
          '<path class="streak" d="' + d + '" stroke="' + C.yellow + '" stroke-width="' + 3 * s + '" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>';
      };
      var scorch = '<ellipse id="' + P("scorch") + '" cx="' + f(MID[0]) + '" cy="' + f(floorY + 2) + '" rx="' + 300 * L.nuke + '" ry="' + 14 * L.nuke + '" fill="#2A221C" opacity="0"/>';
      var cloud = '<g transform="translate(' + f(MID[0]) + "," + f(floorY) + ") scale(" + L.nuke + ')"><g id="' + P("nuke") + '">' + KIT.nuke() + "</g></g>";
