<template id="pentagon-template">
  <!-- pentagon · Layer B, plate four-buildings (storyboards/part-01-opening.md): a plain field under a cream sky,
       four lots in a row. Close on the bare first lot; "war": an honest sign springs up out of the ground, WAR
       BUILDING. "Pentagon": a plain five-sided building draws itself on round the sign's posts, and a paint roller
       slaps onto the sign and rolls THE PENTAGON over the old words; the fresh paint drips red. "five sides": its
       five sides flash one after another. After "sides" the camera pushes into the courtyard, where a grumpy missile
       pokes up, looks left, right and at us, scowls, and ducks back down on "a", leaving a puff of smoke.
       "Rectangle": the camera travels right as a hospital drops onto the next lot, RECTANGLE on its cornice.
       "Square": a square school with a bell drops in, SQUARE. After "Square" the camera pulls back on the row and a
       fourth building nobody mentioned drops in, a triangle doghouse, TRIANGLE, and the Democracy Dog pokes its head
       out (in 9:16 the pull back frames the school and the doghouse). -->
  <style>
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #EFE3C4; }
    #pentagon-weave, #pentagon-plate, #pentagon-film { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="pentagon" data-width="1920" data-height="1080" data-start="0" data-duration="11.4">
    <div id="pentagon-weave">
      <div id="pentagon-plate"></div>
    </div>
    <div id="pentagon-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/places.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="assets/js/props/characters.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "pentagon";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line;
      var f = function (n) { return n.toFixed(1); };
      var smooth = KIT.smooth;
      var tl = gsap.timeline({ paused: true });

      // ── Period film (KIT.film): outside the camera, so it stays put.
      KIT.film(tl, ID, q("weave"), q("film"), 71);

      // ── The plate, in plate units: the lots stand on the horizon (y 0), the sky above it, the ground below. The
      // signs stand in front of their buildings, their posts in the ground at y SIGNY. Lots from left to right: the
      // Pentagon (x 0), the hospital (900), the school (1600), the doghouse (2250).
      var SKY = "#EFE3C4", GROUND = "#C8B07B", EDGE = "#B09363", SIGNY = 92, SIGNK = 1.6;
      var LOT = [0, 900, 1600, 2250];
      var A = V ? [540, 740] : [960, 540];
      var VIEW = V
        ? { start: [0, -150, 1.42], pent: [0, -140, 1.6], court: [0, -385, 4.2], hosp: [900, -250, 1.85], school: [1600, -200, 1.85], wide: [1945, -300, 1.0] }
        : { start: [0, -150, 1.12], pent: [0, -140, 1.35], court: [0, -292, 2.95], hosp: [900, -240, 1.3], school: [1600, -200, 1.3], wide: [1075, -260, 0.68] };

      var at = function (x, y, k, inner, attrs) { return '<g transform="translate(' + f(x) + "," + f(y) + ") scale(" + k + ')"' + (attrs || "") + ">" + inner + "</g>"; };
      var P = function (pts) { return pts.map(function (p) { return f(p[0]) + "," + f(p[1]); }).join(" "); };
      var esc = function (s) { return String(s).replace(/&/g, "&amp;"); };
      var oswald = function (x, y, size, s, col, spacing) {
        return '<text x="' + f(x) + '" y="' + f(y) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + size.toFixed(1) + '" letter-spacing="' + (spacing || 0).toFixed(1) + '" fill="' + col + '">' + esc(s) + "</text>";
      };

      // ── Lot 1: the five-sided building, seen from a little above. Its roof is an outer pentagon (O) over a
      // courtyard (I); the three front walls drop WH from the roof's front edges to the ground.
      var RX = 300, RY = 140, WH = 110, CY = -(WH + RY * Math.cos(Math.PI / 5));
      var pent = function (rx, ry) { return [0, 1, 2, 3, 4].map(function (i) { var a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return [rx * Math.cos(a), CY + ry * Math.sin(a)]; }); };
      var O = pent(RX, RY), I = pent(120, 56);
      var ROOF = "#CBD0D6", WALL1 = "#9AA2AE", WALL2 = "#838C9A", YARD = "#6E8E5A";
      var wall = function (a, b, col) { return '<polygon points="' + P([a, b, [b[0], b[1] + WH], [a[0], a[1] + WH]]) + '" fill="' + col + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="round"/>'; };
      // the windows: a row along each front wall
      var windows = "";
      [[3, 2, 9], [2, 1, 5], [4, 3, 5]].forEach(function (w) {
        var a = O[w[0]], b = O[w[1]], n = w[2];
        for (var k = 0; k < n; k++) {
          var u = (k + 0.7) / (n + 0.4), x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u + WH * 0.36;
          windows += '<rect x="' + f(x - 8) + '" y="' + f(y) + '" width="16" height="24" fill="' + C.slate + '"/>';
        }
      });
      var bldFill = wall(O[1], O[2], WALL2) + wall(O[3], O[4], WALL2) + wall(O[2], O[3], WALL1) + windows +
        '<polygon points="' + P(O) + '" fill="' + ROOF + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="round"/>' +
        '<polygon points="' + P(I) + '" fill="' + YARD + '" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
        // a roof ring line between the two pentagons
        '<polygon points="' + P(pent(210, 98)) + '" fill="none" stroke="#AEB4BC" stroke-width="3"/>';
      // the outline that draws itself on first (pathLength 1)
      var outlineD = "M" + P(O).replace(/ /g, " L") + " Z M" + P(I).replace(/ /g, " L") + " Z" +
        [1, 2, 3, 4].map(function (i) { return " M" + f(O[i][0]) + "," + f(O[i][1]) + " v" + WH; }).join("") +
        " M" + f(O[1][0]) + "," + f(O[1][1] + WH) + " L" + f(O[2][0]) + "," + f(O[2][1] + WH) + " L" + f(O[3][0]) + "," + f(O[3][1] + WH) + " L" + f(O[4][0]) + "," + f(O[4][1] + WH);
      // the five sides, each a thick mustard stroke that flashes on "five sides"
      var sides = [0, 1, 2, 3, 4].map(function (i) {
        var a = O[i], b = O[(i + 1) % 5];
        return '<path class="side" d="M' + f(a[0]) + "," + f(a[1]) + " L" + f(b[0]) + "," + f(b[1]) + '" stroke="' + C.yellow + '" stroke-width="16" stroke-linecap="round" opacity="0"/>';
      }).join("");
      // the grumpy missile in the courtyard (three heads: looking left, right, and at us), clipped by the courtyard's
      // front edges so it comes up out of the hole
      var MK = 1.2, MBASE = I[2][1] + 4;
      var missiles = ["left", "right", null].map(function (lk, i) {
        return '<g class="msl" data-i="' + i + '"' + (i ? ' opacity="0"' : "") + ">" + KIT.props.missile({ mood: "grumpy", look: lk || undefined, arms: "crossed" }) + "</g>";
      }).join("");
      var clip = "M" + P([I[1], I[2], I[3], I[4]]).replace(/ /g, " L") + " L" + f(I[4][0] - 40) + ",-2000 L" + f(I[1][0] + 40) + ",-2000 Z";
      var missileSvg = '<defs><clipPath id="' + ID + '-yard"><path d="' + clip + '"/></clipPath></defs>' +
        '<g clip-path="url(#' + ID + '-yard)"><g transform="translate(0,' + f(MBASE) + ')"><g id="' + ID + '-msl" transform="translate(0,200)"><g transform="scale(' + MK + ')">' + missiles + "</g></g></g></g>";
      var puff = [[-26, -10, 22], [0, -24, 28], [26, -8, 20], [8, 4, 18]].map(function (c) {
        return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + c[2] + '" fill="#E9E1CF" stroke="' + ink + '" stroke-width="3.5"/>';
      }).join("");
      var puffSvg = '<g transform="translate(0,' + f(CY) + ')"><g id="' + ID + '-puff" opacity="0">' + puff + "</g></g>";
      var building = '<g id="' + ID + '-bld-fill" opacity="0">' + bldFill + "</g>" + missileSvg + puffSvg +
        '<path id="' + ID + '-bld-line" d="' + outlineD + '" fill="none" stroke="' + ink + '" stroke-width="5" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>' +
        '<g id="' + ID + '-sides">' + sides + "</g>";

      // the honest sign, painted over: the card is KIT.props.sign's; a fresh coat of paint (clipped as the roller
      // goes) covers it with THE PENTAGON, fitted to the coat, and red drips run off the card's bottom edge
      var SFONT = 34, SH = 60;
      var signW = Math.round(KIT.textWidth("WAR BUILDING", SFONT, "Oswald", 600, SFONT * 0.05) + 64), signHt = Math.round(SFONT * 1.75);
      var cTop = -SH - signHt, cBot = -SH, cx0 = -signW / 2 + 5, cx1 = signW / 2 - 5;
      var paintSize = KIT.fitText("THE PENTAGON", SFONT, cx1 - cx0 - 30, "Oswald", 600, SFONT * 0.05);
      var streaks = [0.3, 0.55, 0.78].map(function (u) { return '<path d="M' + f(cx0 + 6) + "," + f(cTop + 5 + (signHt - 10) * u) + " H" + f(cx1 - 6) + '" stroke="#ECE6D6" stroke-width="2"/>'; }).join("");
      var coat = '<g id="' + ID + '-coat" opacity="0"><defs><clipPath id="' + ID + '-roll"><rect id="' + ID + '-roll-r" x="' + f(cx0 - 4) + '" y="' + f(cTop - 6) + '" width="0" height="' + f(signHt + 12) + '"/></clipPath></defs>' +
        '<g clip-path="url(#' + ID + '-roll)"><rect x="' + f(cx0) + '" y="' + f(cTop + 4) + '" width="' + f(cx1 - cx0) + '" height="' + f(signHt - 8) + '" fill="#FFFFFF"/>' + streaks +
        oswald(0, (cTop + cBot) / 2 + paintSize * 0.37, paintSize, "THE PENTAGON", ink, paintSize * 0.05) + "</g></g>";
      var DRIPS = [[-0.36, 30], [-0.12, 46], [0.1, 22], [0.3, 56]];
      var drips = DRIPS.map(function (d, i) {
        var x = d[0] * signW;
        return '<g class="drip" data-i="' + i + '" transform="translate(' + f(x) + "," + f(cBot - 3) + ') scale(1,0)"><path d="M-5,0 V' + (d[1] - 6) + ' A5,6 0 0,0 5,' + (d[1] - 6) + ' V0 Z" fill="' + C.war + '" stroke="' + ink + '" stroke-width="2"/></g>';
      }).join("");
      // the paint roller: a handle and a white roller as tall as the card (pointing up and to the right)
      var roller = '<g id="' + ID + '-roller" opacity="0"><path d="M14,' + f(cTop - 8) + " l26,-44 l60,-8" + '" fill="none" stroke="' + ink + '" stroke-width="6" stroke-linejoin="round"/>' +
        '<rect x="94" y="' + f(cTop - 72) + '" width="58" height="18" rx="5" fill="' + C.rust + '" stroke="' + ink + '" stroke-width="4"/>' +
        '<path d="M14,' + f(cTop - 8) + " V" + f(cTop - 2) + '" stroke="' + ink + '" stroke-width="5"/>' +
        '<rect x="-2" y="' + f(cTop - 4) + '" width="30" height="' + f(signHt + 8) + '" rx="8" fill="#FFFFFF" stroke="' + ink + '" stroke-width="4"/>' +
        '<path d="M6,' + f(cTop + 6) + " V" + f(cBot - 6) + '" stroke="#E6E0D2" stroke-width="4"/></g>';
      var sign1 = '<g id="' + ID + '-sign1"><g transform="scale(' + SIGNK + ')">' + KIT.props.sign({ text: "WAR BUILDING", height: SH, fontSize: SFONT }) + coat + drips +
        '<g id="' + ID + '-roller-at">' + roller + "</g></g></g>";

      // ── Lot 2: the hospital, RECTANGLE on its cornice.
      var HK = 1.45;
      var hospital = '<g id="' + ID + '-drop1"><g transform="scale(' + HK + ')">' + KIT.props.hospital({ label: "RECTANGLE" }) + "</g></g>";
      // ── Lot 3: the square school: mustard walls, a window grid, a door, a rust cupola with a bell.
      var SW = 360, SCH = C.yellow;
      var school = '<rect x="' + -SW / 2 + '" y="' + -SW + '" width="' + SW + '" height="' + SW + '" fill="' + SCH + '" stroke="' + ink + '" stroke-width="5"/>' +
        '<path d="M' + (-SW / 2 - 16) + "," + -SW + " H" + (SW / 2 + 16) + '" stroke="' + ink + '" stroke-width="12"/>' +
        '<path d="M-40,' + (-SW - 6) + " V" + (-SW - 80) + " H40 V" + (-SW - 6) + ' Z" fill="' + C.rust + '" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<path d="M-54,' + (-SW - 80) + " L0," + (-SW - 126) + " L54," + (-SW - 80) + ' Z" fill="' + C.rust + '" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<path d="M-24,' + (-SW - 12) + " V" + (-SW - 60) + " H24 V" + (-SW - 12) + ' Z" fill="' + C.slate + '"/>' +
        '<g id="' + ID + '-bell"><path d="M-14,' + (-SW - 22) + " Q-14," + (-SW - 56) + " 0," + (-SW - 56) + " Q14," + (-SW - 56) + " 14," + (-SW - 22) + ' Z" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="3"/></g>' +
        '<rect x="-36" y="-130" width="72" height="130" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="5"/><path d="M0,-130 V0" stroke="' + ink + '" stroke-width="3"/>';
      for (var r0 = 0; r0 < 2; r0++) for (var c0 = 0; c0 < 4; c0++) {
        if (r0 === 1 && (c0 === 1 || c0 === 2)) continue;
        var wx = -138 + c0 * 76, wy = -318 + r0 * 110;
        school += '<rect x="' + wx + '" y="' + wy + '" width="54" height="66" fill="#8FB3B0" stroke="' + ink + '" stroke-width="4"/><path d="M' + (wx + 27) + "," + wy + " v66 M" + wx + "," + (wy + 33) + ' h54" stroke="' + ink + '" stroke-width="2.4"/>';
      }
      var schoolSvg = '<g id="' + ID + '-drop2">' + school + "</g>";
      // ── Lot 4: the triangle doghouse, a red A-frame with a round door, and the Democracy Dog inside it.
      var DW = 190, DHT = 350, DK = 1.25, DOORK = 1.25;
      var doorD = "M-56,0 V-72 A56,56 0 0,1 56,-72 V0 Z";
      var dogIn = '<defs><clipPath id="' + ID + '-door"><path d="' + doorD + '"/></clipPath></defs>' +
        '<g clip-path="url(#' + ID + '-door)"><g id="' + ID + '-dog" transform="translate(0,160)"><g transform="translate(-4,6) scale(' + DK + ')">' +
        KIT.props.democracyDog({ face: "front", tail: "plain", mood: "smile" }) + "</g></g></g>";
      var dogHouse = '<polygon points="' + P([[-DW, 0], [0, -DHT], [DW, 0]]) + '" fill="' + C.war + '" stroke="' + ink + '" stroke-width="6" stroke-linejoin="round"/>' +
        '<path d="M' + (-DW - 14) + "," + 14 + " L0," + (-DHT - 14) + " L" + (DW + 14) + ',14" fill="none" stroke="' + ink + '" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>' +
        '<path d="M' + f(-DW * 0.55) + "," + f(-DHT * 0.45) + " L" + f(-DW * 0.25) + "," + f(-DHT * 0.75) + '" stroke="#E07A62" stroke-width="5" stroke-linecap="round"/>' +
        '<g transform="scale(' + DOORK + ')"><path d="' + doorD + '" fill="#2A2420" stroke="' + ink + '" stroke-width="4"/>' + dogIn + "</g>";
      var dogSvg = '<g id="' + ID + '-drop3">' + dogHouse + "</g>";
      // the signs of lots 3 and 4, each springing up as its building lands
      var sign = function (n, text, k, h) { return '<g id="' + ID + "-sign" + n + '"><g transform="scale(' + k + ')">' + KIT.props.sign({ text: text, height: h, fontSize: SFONT }) + "</g></g>"; };
      // a dust puff under each building as it lands
      var dust = function (n, w) {
        return '<g id="' + ID + "-dust" + n + '" opacity="0">' + [-1, -0.5, 0.5, 1].map(function (k) { return '<circle cx="' + f(k * w) + '" cy="-8" r="' + (Math.abs(k) > 0.7 ? 22 : 28) + '" fill="#E9E1CF" stroke="' + ink + '" stroke-width="3.5"/>'; }).join("") + "</g>";
      };

      var field = '<rect x="-4000" y="-4000" width="9000" height="4000" fill="' + SKY + '"/><rect x="-4000" y="0" width="9000" height="4000" fill="' + GROUND + '"/>' +
        '<path d="M-4000,0 H5000" stroke="' + EDGE + '" stroke-width="5"/>';
      var plate = field +
        at(LOT[0], 0, 1, building) + at(LOT[0], SIGNY, 1, sign1) +
        at(LOT[1], 0, 1, dust(1, 200) + hospital) +
        at(LOT[2], 0, 1, dust(2, 170) + schoolSvg) + at(LOT[2], SIGNY, 1, sign(2, "SQUARE", SIGNK, SH)) +
        at(LOT[3], 0, 1, dust(3, 150) + dogSvg) + at(LOT[3], SIGNY, 1, sign(3, "TRIANGLE", 1.4, 22));
      q("plate").innerHTML = KIT.svg(W, H, '<rect width="' + W + '" height="' + H + '" fill="' + SKY + '"/><g id="' + ID + '-cam">' + plate + "</g>");

      var cam = q("cam"), msl = q("msl"), mslHeads = Array.prototype.slice.call(cam.querySelectorAll(".msl")), puffEl = q("puff");
      var sideEls = Array.prototype.slice.call(cam.querySelectorAll(".side")), dripEls = Array.prototype.slice.call(cam.querySelectorAll(".drip"));
      var rollR = q("roll-r"), rollerAt = q("roller-at"), dogEl = q("dog"), dogHead = dogEl.querySelector(".dog-head");
      var earL = dogEl.querySelector(".dog-ear-l"), earR = dogEl.querySelector(".dog-ear-r");

      // ── Cues ──
      var tWar = cue("war"), tPent = cue("Pentagon"), tFive = cue("five"), tSides = KIT.after(ID, "sides"), tA = cue("a");
      var tRect = cue("Rectangle"), tSq = cue("Square"), tAfterSq = KIT.after(ID, "Square");
      var tRoll0 = tPent + 0.5, tRoll1 = tRoll0 + 0.55;

      // ── The camera: keys [time, view, extra scale]
      var KEYS = [[0, "start", 1], [tWar - 0.1, "start", 1.03], [tWar + 0.45, "pent", 1], [tSides - 0.3, "pent", 1.04], [tSides + 0.05, "court", 1],
        [tA + 0.02, "court", 1.04], [tRect - 0.22, "hosp", 1], [tSq - 0.75, "hosp", 1.03], [tSq - 0.25, "school", 1], [tSq + 0.38, "school", 1.02],
        [tAfterSq - 0.02, "wide", 1], [D, "wide", 0.98]];
      var camera = KIT.camera(VIEW, KEYS, A);

      // a building or sign dropping in from above, landing at tl with a squash; returns [dy, squash]
      function drop(t, tLand, h) {
        var d0 = 0.22, u = (t - (tLand - d0)) / d0;
        if (u < 0) return null;
        if (u < 1) return [-h * (1 - u * u), 1];
        var a = t - tLand;
        return [0, a < 0.22 ? 1 - 0.14 * Math.sin((Math.PI * a) / 0.22) : 1];
      }
      function place(el, t, tLand, h) {
        var d = drop(t, tLand, h);
        el.setAttribute("opacity", d ? 1 : 0);
        if (d) el.setAttribute("transform", "translate(0," + f(d[0]) + ") scale(" + (2 - d[1]).toFixed(3) + "," + d[1].toFixed(3) + ")");
      }
      function dustAt(el, t, tLand) {
        var a = t - tLand;
        if (a < 0 || a > 0.7) { el.setAttribute("opacity", 0); return; }
        el.setAttribute("opacity", (1 - a / 0.7).toFixed(2));
        el.setAttribute("transform", "scale(" + (1 + a * 1.2).toFixed(2) + "," + (1 + a * 0.6).toFixed(2) + ")");
      }
      // a sign springing up out of the ground from its base (overshoot, then settle)
      function spring(el, t, t0) {
        var a = t - t0;
        if (a < 0) { el.setAttribute("opacity", 0); return; }
        var k = a < 0.16 ? (a / 0.16) * 1.18 : 1 + 0.18 * Math.exp(-(a - 0.16) * 9) * Math.cos((a - 0.16) * 26);
        el.setAttribute("opacity", 1);
        el.setAttribute("transform", "scale(" + (1 / Math.max(0.6, Math.sqrt(k))).toFixed(3) + "," + k.toFixed(3) + ")");
      }

      KIT.onTime(tl, D, function (t) {
        camera.place(cam, camera.at(t));

        // "war": the honest sign springs up
        spring(q("sign1"), t, tWar);
        // "Pentagon": the outline draws itself on, then the walls fill in
        var lu = Math.min(1, Math.max(0, (t - tPent) / 0.45));
        q("bld-line").setAttribute("stroke-dashoffset", (1 - smooth(lu)).toFixed(3));
        q("bld-line").setAttribute("opacity", t >= tPent ? 1 : 0);
        q("bld-fill").setAttribute("opacity", smooth((t - tPent - 0.3) / 0.25).toFixed(2));
        // the roller slaps on and rolls the new name over the old one; the paint drips
        var ru = (t - tRoll0) / (tRoll1 - tRoll0), rx = cx0 - 2 + (cx1 - cx0) * smooth(Math.min(1, Math.max(0, ru)));
        q("coat").setAttribute("opacity", t >= tRoll0 ? 1 : 0);
        rollR.setAttribute("width", f(Math.max(0, rx - cx0 + 20)));
        var rOn = t >= tRoll0 - 0.12 && t < tRoll1 + 0.35;
        q("roller").setAttribute("opacity", rOn ? 1 : 0);
        var rIn = t < tRoll0 ? (t - tRoll0) * 900 : t > tRoll1 ? (t - tRoll1) * 600 : 0;
        rollerAt.setAttribute("transform", "translate(" + f(rx - 12 + Math.max(0, rIn)) + "," + f(Math.min(0, rIn)) + ")");
        dripEls.forEach(function (d, i) {
          var du = smooth((t - tRoll1 - 0.1 - i * 0.12) / 0.7);
          var x = DRIPS[i][0] * signW;
          d.setAttribute("transform", "translate(" + f(x) + "," + f(cBot - 3) + ") scale(1," + du.toFixed(3) + ")");
        });
        // "five sides": the five sides flash one after another
        sideEls.forEach(function (s, i) {
          var a = t - (tFive + i * 0.14);
          s.setAttribute("opacity", a >= 0 && a < 0.2 ? 1 : a >= 0.2 && a < 0.4 ? (1 - (a - 0.2) / 0.2).toFixed(2) : 0);
        });
