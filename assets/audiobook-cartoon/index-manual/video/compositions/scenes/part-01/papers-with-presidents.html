<template id="papers-with-presidents-template">
  <!-- papers-with-presidents · Layer B (storyboards/part-01-opening.md): a bored crowd stands still; one plain paper
       walks in on stick legs and its president winks from a close-up; every head snaps to it on "money," but one,
       and the crowd follows it off in a conga line, around the planet and back in from the left, where the paper
       flattens the human left behind and the whole line walks over him; he peels himself off the floor and limps
       after them. On "pretends hard enough." they squeeze their eyes shut, the paper glows, and the front human
       pretends so hard her head pops off and lands back upside down. -->
  <style>

    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #papers-with-presidents-cam, #papers-with-presidents-bg, #papers-with-presidents-art, #papers-with-presidents-pip, #papers-with-presidents-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="papers-with-presidents" data-width="1920" data-height="1080" data-start="0" data-duration="17.78">
    <div id="papers-with-presidents-cam">

      <div id="papers-with-presidents-art"></div>
      <div id="papers-with-presidents-pip"></div>
      <div id="papers-with-presidents-grain"></div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "papers-with-presidents";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var INK = C.line, CARD = "#FBF5E4", BILL = C.money;

      // Layout for each canvas shape. crowd: each conga human's feet; s: their scale; bs: the paper's scale; feet:
      // the conga line's ground; stop/end: where the paper stands after walking in, and at the end; m: how far off
      // screen the line wraps around; callout: [x, y, r] of the portrait close-up; banner: [x, y, w, h].
      // The slow human stands on the conga ground at the far left, where the returning paper hits him on the splat
      // (his x is worked out from that); the line ends to his right with room for his limp. 9:16's longer
      // wrap (m) brings its paper back at the same moment as 16:9's, so one splat sound fits both.
      var L = V
        ? { s: 1.15, bs: 1.7, feet: 1320, stop: 860, end: 905, m: 193,
            crowd: [[170, 1090], [325, 1090], [480, 1090], [250, 1205], [405, 1205], [325, 1320]],
            callout: [860, 990, 150], banner: [60, 600, 960, 220] }
        : { s: 1.5, bs: 2.4, feet: 845, stop: 1250, end: 1420, m: 150,
            crowd: [[260, 640], [425, 640], [590, 640], [340, 750], [505, 750], [670, 750], [260, 860], [425, 860]],
            callout: [1250, 400, 165], banner: [470, 62, 1320, 180] };

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // The president on every paper (style bible section 3): a generic, unnamed old man in a powdered wig, in an
      // oval, drawn around (0,0), 52 x 60. Parts: .pwp-eye-r (open) and .pwp-wink (closed), for the wink.
      function president(clip) {
        var face = "#FBF6E6", sw = 1.6;
        var curl = function (x, y) {
          return '<circle cx="' + x + '" cy="' + y + '" r="3.9" fill="' + face + '" stroke="' + INK + '" stroke-width="' + sw + '"/>' +
            '<path d="M' + (x - 1.6) + "," + y + ' a1.6,1.6 0 1 1 3.2,0" fill="none" stroke="' + INK + '" stroke-width="1"/>';
        };
        return '<defs><clipPath id="' + clip + '"><ellipse rx="25" ry="29"/></clipPath></defs>' +
          '<ellipse rx="26" ry="30" fill="' + face + '" stroke="' + INK + '" stroke-width="2.4"/>' +
          '<g clip-path="url(#' + clip + ')"><ellipse rx="26" ry="30" fill="url(#' + ID + '-fine)" opacity="0.22"/>' +
          '<path d="M-5,3 V13 H5 V3 Z" fill="' + face + '"/>' +
          '<path d="M-32,34 L-29,22 Q-21,12 -8,11 L0,20 L8,11 Q21,12 29,22 L32,34 Z" fill="url(#' + ID + '-cross)" stroke="' + INK + '" stroke-width="' + sw + '" stroke-linejoin="round"/>' +
          '<path d="M-6,10.5 L0,25 L6,10.5 Q3,13.5 0,12.5 Q-3,13.5 -6,10.5 Z" fill="' + face + '" stroke="' + INK + '" stroke-width="1.3" stroke-linejoin="round"/></g>' +
          '<circle cx="0" cy="-3" r="10.5" fill="' + face + '" stroke="' + INK + '" stroke-width="' + sw + '"/>' +
          '<path d="M-11.5,-5 C-13,-20 13,-20 11.5,-5 C8,-12.5 -8,-12.5 -11.5,-5 Z" fill="' + face + '" stroke="' + INK + '" stroke-width="' + sw + '" stroke-linejoin="round"/>' +
          '<path d="M-6,-14 q2,-2 4,0 M2,-14.5 q2,-2 4,0" fill="none" stroke="' + INK + '" stroke-width="0.9"/>' +
          curl(-12.5, -3.5) + curl(-13, 4) + curl(12.5, -3.5) + curl(13, 4) +
          '<path d="M-6.2,-7.6 q2.2,-1.6 4.4,0 M1.8,-7.6 q2.2,-1.6 4.4,0" fill="none" stroke="' + INK + '" stroke-width="1.2" stroke-linecap="round"/>' +
          '<circle cx="-4" cy="-4.6" r="1.6" fill="' + INK + '"/><circle class="pwp-eye-r" cx="4" cy="-4.6" r="1.6" fill="' + INK + '"/>' +
          '<path class="pwp-wink" d="M1.6,-4.2 q2.4,-2.6 4.8,0" fill="none" stroke="' + INK + '" stroke-width="1.5" stroke-linecap="round" opacity="0"/>' +
          '<path d="M0.4,-3.6 q2,3.6 -1,4.6" fill="none" stroke="' + INK + '" stroke-width="1.1" stroke-linecap="round"/>' +
          '<path d="M-3.4,3 q3.4,2.6 6.8,0" fill="none" stroke="' + INK + '" stroke-width="1.3" stroke-linecap="round"/>';
      }
      // A plain paper (no war red, no medicine teal yet) on stick legs, around (0,0), 96 x 50, feet at y 46,
      // with a glow behind it and sparkles for the end. Parts: .pwp-bill-leg-l/-r (hips (-18,24), (18,24)),
      // .pwp-bill-face, .pwp-glow, .pwp-spark.
      function bill() {
        var leg = function (k, cls) {
          return '<g class="' + cls + '"><path d="M' + 18 * k + ",24 L" + 20 * k + ',43" fill="none" stroke="' + INK + '" stroke-width="4.5" stroke-linecap="round"/>' +
            '<ellipse cx="' + 21 * k + '" cy="45" rx="7" ry="3.6" fill="' + INK + '"/></g>';
        };
        var rays = "";
        for (var i = 0; i < 12; i++) {
          var a = (i * Math.PI) / 6;
          rays += '<path d="M' + (56 * Math.cos(a)).toFixed(1) + "," + (56 * Math.sin(a)).toFixed(1) + " L" + (72 * Math.cos(a)).toFixed(1) + "," + (72 * Math.sin(a)).toFixed(1) + '"/>';
        }
        var sparks = [[-30, -58, 11, C.orange], [52, -52, 14, C.yellow], [76, -14, 10, C.orange], [14, -70, 9, C.yellow], [64, 32, 8, C.yellow]].map(function (s) {
          return '<g transform="translate(' + s[0] + "," + s[1] + ')"><g class="pwp-spark">' + KIT.star(0, 0, s[2], s[3]) + "</g></g>";
        }).join("");
        return '<g class="pwp-glow" opacity="0"><circle r="66" fill="' + C.yellow + '" opacity="0.25"/><circle r="50" fill="' + C.yellow + '" opacity="0.4"/>' +
          '<g stroke="' + C.yellow + '" stroke-width="5" stroke-linecap="round">' + rays + "</g></g>" +
          '<ellipse cx="0" cy="47" rx="34" ry="5" fill="url(#' + ID + '-fine)" opacity="0.7"/>' +
          leg(-1, "pwp-bill-leg-l") + leg(1, "pwp-bill-leg-r") +
          '<rect class="pwp-bill-face" x="-48" y="-25" width="96" height="50" rx="4" fill="' + BILL + '" stroke="' + INK + '" stroke-width="4"/>' +
          '<rect x="-41" y="-18" width="82" height="36" rx="2" fill="none" stroke="' + INK + '" stroke-width="1.6" opacity="0.6"/>' +
          '<circle cx="-32" cy="0" r="6" fill="none" stroke="' + INK + '" stroke-width="1.8" opacity="0.7"/><circle cx="32" cy="0" r="6" fill="none" stroke="' + INK + '" stroke-width="1.8" opacity="0.7"/>' +
          '<g transform="scale(0.5)">' + president(ID + "-clip-bill") + "</g>" + sparks;
      }

      // The crowd: varied clothes, hats and tones. Each human has four drawings, swapped on the words:
      // bored (facing out), looking at the paper, in the conga line, and squeezing its eyes shut.
      var LOOKS = [
        { tone: 1, outfit: "shirt", color: 1, hair: 0 }, { tone: 2, outfit: "dress", color: 0, hair: 1 },
        { tone: 3, outfit: "suit", hair: 2 }, { tone: 0, outfit: "shirt", color: 2, hat: "bowler" },
        { tone: 2, outfit: "overalls", color: 3, hair: 0 }, { tone: 1, outfit: "dress", color: 3, hair: 1, hat: "curlers" },
        { tone: 0, outfit: "labcoat", hair: 0 }, { tone: 3, outfit: "shirt", color: 0, hair: 1 },
        { tone: 2, outfit: "suit", hair: 0, stache: true }, { tone: 1, outfit: "scrubs", hair: 2 },
      ];
      var ARMS = [[35, 70], [75, 95]]; // the right hand reaches the shoulder of the human in front
      function mix(a, b) {
        var o = {}, k;
        for (k in a) o[k] = a[k];
        for (k in b) o[k] = b[k];
        return o;
      }
      // Eyes squeezed shut: drop person()'s two .eye groups for > < (in the face's own units, where the eyes sit at
      // x -2.5 and 10.8, y -4), so they go with the head if it pops off.
      function squint(svg) {
        var n = 0;
        var out = svg.replace(/<g class="eye">[\s\S]*?<\/g>/g, function () { n++; return ""; });
        if (n !== 2) throw new Error("squint: expected 2 eyes, found " + n);
        var e = function (x, k) { return "M" + (x - 4.5 * k) + ",-7.5 l" + 4.5 * k + ",3.5 l" + -4.5 * k + ",3.5"; };
        return out.replace("<!--face-end-->", '<path d="' + e(-2.5, 1) + " " + e(10.8, -1) + '" fill="none" stroke="' + INK + '" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><!--face-end-->');
      }
      // The slow human: bored, then looking right (too late), surprised (the drawing that gets flattened), limping
      // after the line (sad, arms out) and squeezing his eyes shut at the back of it. #<id>-slow is placed every
      // frame; inside it, -peel (the peel and the limp tilt), -sq (the squash) and -j (sag and tremble).
      var SLOW = { tone: 2, outfit: "overalls", color: 1, hair: 2 };
      var puffs = [-1, 1].map(function (k) {
        return '<circle class="pwp-puff" cx="' + k * 52 + '" cy="90" r="15" fill="' + CARD + '" stroke="' + INK + '" stroke-width="3"/>';
      }).join("");
      // while he is flat, his eyes stay round on top of the pancake and blink
      var flatEyes = '<g class="pwp-flat-eyes" opacity="0">' + [-9, 9].map(function (x) {
        return '<circle cx="' + x + '" cy="0" r="6.5" fill="#FFF" stroke="' + INK + '" stroke-width="2.2"/><circle cx="' + (x - 2) + '" cy="0.5" r="2.6" fill="' + INK + '"/>';
      }).join("") + "</g>";
      var dizzy = [0, 1, 2].map(function (i) { return '<g class="pwp-dizzy" opacity="0">' + KIT.star(0, 0, 9, i % 2 ? C.orange : C.yellow) + "</g>"; }).join("");
      var slow = '<g id="' + ID + '-slow"><ellipse cx="0" cy="101" rx="30" ry="6" fill="url(#' + ID + '-fine)" opacity="0.7"/>' +
        '<g id="' + ID + '-slow-peel"><g id="' + ID + '-slow-sq"><g id="' + ID + '-slow-j">' +
        '<g class="pwp-bored">' + KIT.person(mix(SLOW, { mood: "flat" })) + "</g>" +
        '<g class="pwp-late" opacity="0">' + KIT.person(mix(SLOW, { mood: "flat", look: "right" })) + "</g>" +
        '<g class="pwp-flat" opacity="0">' + KIT.person(mix(SLOW, { mood: "eager", look: "left", arms: [[-150, -165], [150, 165]] })) + "</g>" +
        '<g class="pwp-limp" opacity="0">' + KIT.person(mix(SLOW, { mood: "sad", look: "right", arms: ARMS })) + "</g>" +
        '<g class="pwp-strain" opacity="0">' + squint(KIT.person(mix(SLOW, { mood: "flat", brows: true, look: "right", arms: ARMS }))) + "</g>" +
        "</g></g>" + flatEyes + dizzy + "</g>" + puffs + "</g>";
      var crowd = L.crowd.map(function (c, i) {
        var o = LOOKS[i];
        return '<g id="' + ID + "-h" + i + '"><ellipse cx="0" cy="101" rx="30" ry="6" fill="url(#' + ID + '-fine)" opacity="0.7"/><g id="' + ID + "-h" + i + '-j">' +
          '<g class="pwp-bored">' + KIT.person(mix(o, { mood: "flat" })) + "</g>" +
          '<g class="pwp-look" opacity="0">' + KIT.person(mix(o, { mood: "eager", look: "right" })) + "</g>" +
          '<g class="pwp-conga" opacity="0">' + KIT.person(mix(o, { mood: "eager", look: "right", arms: ARMS })) + "</g>" +
          '<g class="pwp-strain" opacity="0">' + squint(KIT.person(mix(o, { mood: "flat", brows: true, look: "right", arms: ARMS }))) + "</g>" +
          '<g transform="translate(2,-40)"><g class="pwp-burst" opacity="0">' + KIT.star(0, 0, 26, C.yellow) + KIT.star(0, 0, 13, "#FFF") + "</g></g>" +
          "</g></g>";
      }).join("");

      // The close-up: a ring on the paper's portrait, a cone, and a big circle with the president in it.
      var CO = L.callout, px = L.stop, py = L.feet - 48 * L.bs, ring = 15 * L.bs + 8;
      var callout = '<g id="' + ID + '-callout">' +
        '<path d="M' + (px - ring) + "," + py + " L" + (CO[0] - CO[2]) + "," + CO[1] + " M" + (px + ring) + "," + py + " L" + (CO[0] + CO[2]) + "," + CO[1] + '" stroke="' + INK + '" stroke-width="3" stroke-dasharray="10 7"/>' +
        '<circle cx="' + px + '" cy="' + py + '" r="' + ring + '" fill="none" stroke="' + INK + '" stroke-width="4"/>' +
        '<circle cx="' + (CO[0] + 10) + '" cy="' + (CO[1] + 12) + '" r="' + CO[2] + '" fill="' + C.ink + '" opacity="0.85"/>' +
        '<circle cx="' + CO[0] + '" cy="' + CO[1] + '" r="' + CO[2] + '" fill="' + CARD + '" stroke="' + INK + '" stroke-width="6"/>' +
        '<circle cx="' + CO[0] + '" cy="' + CO[1] + '" r="' + (CO[2] - 12) + '" fill="none" stroke="' + C.orange + '" stroke-width="2.5"/>' +
        '<g transform="translate(' + CO[0] + "," + CO[1] + ") scale(" + ((CO[2] * 0.82) / 30).toFixed(3) + ')">' + president(ID + "-clip-big") + "</g></g>";

      // The banner: "MONEY: pretend value that becomes real value if everyone pretends hard enough".
      var B = L.banner, nt = 36;
      var ribbon = function (dx, dy, fill, extra) {
        return '<path d="M' + (B[0] + dx) + "," + (B[1] + dy) + " H" + (B[0] + B[2] + dx) + " l" + -nt + "," + B[3] / 2 + " l" + nt + "," + B[3] / 2 + " H" + (B[0] + dx) + " l" + nt + "," + -B[3] / 2 + ' Z" fill="' + fill + '" ' + (extra || "") + "/>";
      };
      var def = function (id, x, y, size, anchor, text) {
        return '<text id="' + ID + "-" + id + '" x="' + x + '" y="' + y + '" text-anchor="' + anchor + '" font-family="Inter" font-weight="600" font-size="' + size + '" fill="' + INK + '">' + text + "</text>";
      };
      var T1 = "pretend value that becomes real value", T2 = "if everyone pretends hard enough";
      var words = V
        ? '<text x="540" y="' + (B[1] + 82) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="64" letter-spacing="3" fill="' + INK + '">MONEY:</text>' +
          def("def1", 540, B[1] + 140, 36, "middle", T1) + def("def2", 540, B[1] + 190, 36, "middle", T2)
        : '<text x="' + (B[0] + nt + 40) + '" y="' + (B[1] + B[3] / 2 + 25) + '" font-family="Oswald" font-weight="600" font-size="72" letter-spacing="3" fill="' + INK + '">MONEY:</text>' +
          def("def1", B[0] + 345, B[1] + B[3] / 2 - 8, 42, "start", T1) + def("def2", B[0] + 345, B[1] + B[3] / 2 + 46, 42, "start", T2);
      var banner = '<g id="' + ID + '-banner">' + ribbon(10, 10, C.ink, 'opacity="0.85"') + ribbon(0, 0, CARD, 'stroke="' + INK + '" stroke-width="5" stroke-linejoin="round"') +
        '<rect x="' + (B[0] + nt + 14) + '" y="' + (B[1] + 12) + '" width="' + (B[2] - 2 * nt - 28) + '" height="' + (B[3] - 24) + '" fill="none" stroke="' + C.orange + '" stroke-width="2"/>' + words + "</g>";

      // The paper is drawn under the crowd, so the front human's hand rests on it and its glow stays behind them;
      // the slow human under both, so the line walks over him.
      q("art").innerHTML = KIT.svg(W, H, KIT.paperDefs(ID) + slow + '<g id="' + ID + '-bill">' + bill() + "</g>" + crowd + callout + banner);


      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "slide left");

      var T = {
        only: cue("only"), walk: cue("paper"), call: cue("presidents"), wink: cue("them."), money: cue("money,"),
        conga: KIT.after(ID, "money,"), pretend: cue("pretend"), ifw: cue("if"), hard: cue("pretends"), enough: cue("enough."),
        // the slow human looks up long after the line has gone, is flattened by the returning paper (splat), peels
        // himself up (boing, just after "everyone"), limps to the back of the line and joins it
        late: KIT.after(ID, "money,") + 0.55, splat: cue("value") + 0.16, peel: cue("everyone") - 0.15, pop: cue("everyone") + 0.1,
        // the front human pretends so hard his head pops off on "hard" (pop); it lands upside down after "enough." (thunk)
        head: cue("hard"), land: KIT.after(ID, "enough."),
      };
      T.limp0 = T.pop + 0.15; T.limp1 = T.limp0 + 0.66;
      var WALK = 0.7;

      // Where everyone stands, every frame. The paper walks in and stops; after "money," it leads the line off the
      // right edge, and the line comes back in on the left (around the planet), stopping on "pretends".
      var P = W + 2 * L.m, S = L.end - L.stop + P;
      var gap0 = 48 * L.bs + 68 * L.s - 10, gap = 80 * L.s;
      var A = 0.12, Bd = 0.2, VMAX = 1 / (1 - A / 2 - Bd / 2);
      function wrap(x) { return (((x + L.m) % P) + P) % P - L.m; }
      function clamp(x) { return Math.max(0, Math.min(1, x)); }
      function smooth(x) { x = clamp(x); return x * x * (3 - 2 * x); }
      // distance along the line (0..1): speed up, run, slow down
      function trap(p) {
        p = clamp(p);
        if (p < A) return (VMAX * p * p) / (2 * A);
        if (p <= 1 - Bd) return VMAX * (A / 2 + p - A);
        return 1 - (VMAX * (1 - p) * (1 - p)) / (2 * Bd);
      }
      function speed(p) { return p <= 0 || p >= 1 ? 0 : p < A ? p / A : p > 1 - Bd ? (1 - p) / Bd : 1; }
      function bounce(dist, stride, amp) { return -Math.abs(Math.sin((dist / stride) * Math.PI)) * amp; }
      // the rightmost humans take the front of the line
      var slot = [];
      L.crowd.map(function (c, i) { return i; })
        .sort(function (a, b) { return L.crowd[b][0] - L.crowd[a][0] || L.crowd[b][1] - L.crowd[a][1]; })
        .forEach(function (i, j) { slot[i] = j; });
      var billG = q("bill");
      var humans = L.crowd.map(function (c, i) { return q("h" + i); });
      function billAt(t) {
        var bx = L.stop, bob = 0, pc = (t - T.conga) / (T.hard - T.conga), dist = 0, v = 0;
        if (t < T.walk) bx = W + 300;
        else if (t < T.walk + WALK) {
          var pw = (t - T.walk) / WALK, from = W + 50 * L.bs;
          bx = from + (L.stop - from) * (1 - (1 - pw) * (1 - pw));
          bob = bounce(from - bx, 46 * L.bs, 6) * (1 - pw);
        } else if (t >= T.conga) {
          dist = S * trap(pc);
          v = speed(pc);
          bx = wrap(L.stop + dist);
          bob = bounce(dist, 46 * L.bs, 6) * v;
        }
        return { x: bx, bob: bob, dist: dist, v: v };
      }
      // The slow human stands where the returning paper's front edge meets his back on the splat, and joins one
      // place behind the last human of the stopped line.
      var SX = billAt(T.splat).x + 48 * L.bs + 24 * L.s, JX = L.end - gap0 - L.crowd.length * gap;
      var slowG = q("slow"), slowPeel = q("slow-peel"), slowSq = q("slow-sq"), dizzy = slowG.querySelectorAll(".pwp-dizzy"), flatEyes = slowG.querySelector(".pwp-flat-eyes");
      // where he is, how squashed, and how tilted, at time t; march: the x of everyone walking on the ground
      function slowAt(t, march) {
        var x = SX, y = 0, sx = 1, sy = 1, rot = 0, rx = 0;
        if (t >= T.splat && t < T.pop) {
          var e = Math.exp(-14 * (t - T.splat));
          sy = 0.15 - 0.07 * e; sx = 1.4 + 0.15 * e;
          // flattened again under every foot that walks over him
          if (march.some(function (m) { return Math.abs(m - SX) < 40 * L.s; })) sy *= 0.6;
          // he peels up from the floor like a sticker, his right end first
          if (t >= T.peel) { rot = -32 * smooth((t - T.peel) / (T.pop - T.peel)); rx = -42 * sx; }
        } else if (t >= T.pop) {
          // he springs back up, but never quite to his full height
          var d = Math.exp(-5 * (t - T.pop)) * Math.cos(17 * (t - T.pop));
          sy = 0.9 - 0.75 * d; sx = 1.06 + 0.34 * d;
