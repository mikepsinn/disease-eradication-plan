      function pick(list, name) { list.forEach(function (p) { show(p, p.getAttribute("data-pose") === name); }); }

          // he peels up, springs back a little shorter, then limps to the back of the line
          var pa = t - tPeel;
          bp = t < tPret ? "limp" : "strain";
          sy = pa < 0.18 ? 0.07 + (1.0 - 0.07) * (pa / 0.18) : 0.86 + 0.14 * Math.exp(-(pa - 0.18) * 7) * Math.cos((pa - 0.18) * 22);
          sx = pa < 0.18 ? 1.55 - 0.55 * (pa / 0.18) : 1 + (0.86 - sy) * 0.6;
          var lu = smooth((pa - 0.2) / 0.5);
          bxp = XB + (400 - GAP - XB) * lu;
          if (pa > 0.2 && pa < 0.7) tilt = Math.sin((pa - 0.2) * 22) * 7;
        }
        if (t >= tSplat - 0.06 && t < tSplat) { sy = 1 - (1 - 0.07) * ((t - tSplat + 0.06) / 0.06); sx = 1 + 0.55 * ((t - tSplat + 0.06) / 0.06); }
        boredEl.setAttribute("transform", "translate(" + f(bxp) + ",0) rotate(" + f(tilt) + ")");
        boredEl.querySelector(".sq").setAttribute("transform", "scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")");
        pick(boredPoses, bp);
        // he stares at the ground: his head bowed
        var bh = boredPoses[0].querySelector(".head");
        bh.setAttribute("transform", "rotate(-14 " + f(RB.neck[0]) + " " + f(RB.neck[1]) + ")");
        if (bp === "strain") { boredEl.setAttribute("transform", "translate(" + f(bxp + Math.sin(t * 60) * 2.2) + ",0)"); }
        // his eyes on the pancake, blinking
        var flat = t >= tSplat && t < tPeel;
        show(flatEl, flat);
        if (flat) {
          flatEl.setAttribute("transform", "translate(" + f(XB) + "," + f(-K * 100 * sy - 6) + ")");
          var since = t - tSplat, bl = [0.5, 0.75, 1.6, 2.2].some(function (b) { return since > b && since < b + 0.1; });
          lids.forEach(function (l) { l.setAttribute("transform", bl ? "scale(1,0.12)" : ""); });
        }
        // stars circle his head once he is up
        var up = t >= tPeel + 0.18;
        var headY = -K * (100 - RL.head[1]) * sy - 40;
        starEls.forEach(function (s, i) {
          show(s, up);
          if (!up) return;
          var a = (t - tPeel) * 7 + (i * 2 * Math.PI) / 3;
          s.setAttribute("transform", "translate(" + f(bxp + Math.cos(a) * 70) + "," + f(headY + Math.sin(a) * 14) + ") scale(" + (1.9 + 0.5 * Math.sin(a)).toFixed(2) + ")");
        });

        // "hard": the front woman's head pops off and spins up; after "enough." it lands back on upside down
        var hx = RF.head[0], hy = RF.head[1];
        if (t < tHard) frontHead.setAttribute("transform", "");
        else if (t < tLand) {
          var hu = (t - tHard) / (tLand - tHard), lift = 4 * 95 * hu * (1 - hu) + 6, spin = 720 * hu + 180 * smooth(hu);
          frontHead.setAttribute("transform", "translate(0," + f(-lift) + ") rotate(" + f(spin) + " " + f(hx) + " " + f(hy) + ")");
        } else {
          var la = t - tLand, bounce = la < 0.2 ? -6 * Math.sin((Math.PI * la) / 0.2) : 0;
          frontHead.setAttribute("transform", "translate(0," + f(bounce - 3) + ") rotate(180 " + f(hx) + " " + f(hy) + ")");
        }
      });
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
