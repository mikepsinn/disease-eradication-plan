<template id="loved-ones-template">
  <!-- loved-ones · collage (Part 1, scene 3, plate family-portrait). The bit: a family sits for its portrait, grinning
       and holding perfectly still, while everything that will kill them climbs in. "currently": three germs crawl in
       from the edges and climb into a collar, an ear and a collar; the family holds still for the exposure (one small
       twitch). "brutally": the Grim Reaper rises behind them, hand up: hold still. "diseases?": the flash powder goes
       off, a puff of smoke, and the plate is the same pose as skeletons, still grinning, still holding the bread. The
       Reaper is the only one unchanged. Then nothing moves until nuclear-winters. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #E2CFA5; }
  </style>
  <div id="root" data-composition-id="loved-ones" data-width="1920" data-height="1080" data-start="0" data-duration="9.16">
    <div id="loved-ones-weave"></div>
    <div id="loved-ones-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    var V = KIT.V, SZ = KIT.collage.SIZES;
    // The family stands on G, big; the Reaper stands behind them, his skull just above their heads, between father and mother.
    var G = V ? 1440 : 1000, FX = V ? 540 : 820, FH = V ? 880 : 780, FK = FH / SZ.family[1];
    var famPt = function (p) { return [FX + (p[0] - SZ.family[0] / 2) * FK, G - (SZ.family[1] - p[1]) * FK]; };
    var RH = FH * 1.32, RK = RH / SZ["reaper-stop"][1], SKULL = [210, 150];
    var head = famPt([158, 30]);
    var RX = head[0] - (SKULL[0] - SZ["reaper-stop"][0] / 2) * RK;
    // where each germ climbs in: the father's collar, the mother's ear, the boy's collar
    var IN = [famPt([110, 100]), famPt([215, 58]), famPt([140, 245])];
    var GH = V ? 200 : 230;
    var germ = function (art, x, y) { return { art: art, x: x, y: y, anchor: "bottom", scale: GH / SZ[art][1], hidden: true }; };
    // the photographer under his black cloth, at the right edge, the flash-powder tray (art 210, 15) held up
    var PH = V ? 480 : 640, PK = PH / SZ.photographer[1], PX = V ? 960 : 1640;
    var TRAY = [PX + (210 - SZ.photographer[0] / 2) * PK, G - (SZ.photographer[1] - 15) * PK];
    var views = V ? { a: [540, 960, 1], b: [540, 960, 1.05] } : { a: [960, 540, 1], b: [900, 540, 1.07] };
    KIT.collage({
      id: "loved-ones", seed: 103, views: views, view: "a",
      cast: {
        reaper: { art: "reaper-stop", x: RX, y: G, anchor: "bottom", pivot: "bottom", scale: RK, hidden: true },
        fam: { art: "family", x: FX, y: G, anchor: "bottom", pivot: "bottom", scale: FK },
        g0: germ("germ-grin", V ? 120 : 300, G),
        g1: germ("germ", V ? 980 : 1500, G),
        g2: germ("germ-giant", V ? 150 : 420, G),
        photo: { art: "photographer", x: PX, y: G, anchor: "bottom", pivot: "bottom", scale: PK },
        puff: { art: "cloud-puff", x: TRAY[0], y: TRAY[1] - 40, scale: V ? 0.9 : 1.2, hidden: true },
      },
      beats: [
        { at: 0.1, do: "camera", view: "b", dur: 7.4 },
        // "currently being slowly tortured": the germs crawl in from the edges and climb in, one each
        { on: "currently", do: "slideIn", who: "g0", from: "left", over: 16 },
        { on: "being", do: "slideIn", who: "g1", from: "right", over: 16 },
        { on: "slowly", do: "slideIn", who: "g2", from: "bottom", over: 16 },
        { on: "currently", offset: 0.4, do: "bob", who: ["g0", "g1", "g2"], y: 8, r: 6, speed: 4, until: "tortured" },
        { on: "tortured", do: "move", who: "g0", to: IN[0], dur: 0.45, arc: 160, scale: 0.35 * GH / SZ["germ-grin"][1] },
        { on: "tortured", offset: 0.1, do: "move", who: "g1", to: IN[1], dur: 0.45, arc: 160, scale: 0.3 * GH / SZ.germ[1] },
        { on: "tortured", offset: 0.2, do: "move", who: "g2", to: IN[2], dur: 0.45, arc: 160, scale: 0.35 * GH / SZ["germ-giant"][1] },
        { on: "tortured", offset: 0.55, do: "pop", who: ["g0", "g1", "g2"], out: true },
        // nobody moves; one twitch
        { on: "and", offset: 0.2, do: "shiver", who: "fam", dur: 0.17, amp: 3, rot: 0.6 },
        // "brutally murdered": the Reaper rises behind them, hand up: hold still
        { on: "brutally", do: "slideIn", who: "reaper", from: "bottom", over: 18 },
        { on: "horrible", do: "shiver", who: "fam", dur: 0.5, amp: 2, rot: 0.4 },
        // after "diseases?": the flash powder goes off, and they are skeletons in the same pose
        { on: "diseases?", offset: 0.68, do: "boom", shake: 6, flash: 0.35 },
        { on: "diseases?", offset: 0.68, do: "hop", who: "photo", height: 16 },
        { on: "diseases?", offset: 0.68, do: "pop", who: "puff", squash: true },
        { on: "diseases?", offset: 0.75, do: "move", who: "puff", by: [V ? -30 : -60, -200], dur: 0.9, ease: "smooth" },
        { on: "diseases?", offset: 1.55, do: "pop", who: "puff", out: true },
        { on: "diseases?", offset: 0.7, do: "xray", who: "fam", flash: 0, frames: 4 },
      ],
    });
  </script>
</template>
