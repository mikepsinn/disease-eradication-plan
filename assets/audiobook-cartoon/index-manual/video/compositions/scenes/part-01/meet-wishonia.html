        '<circle cx="170" cy="92" r="44" fill="none" stroke="' + C.tan + '" stroke-width="4"/>' +

      var soot = "#2B2420", soot2 = "#3D332C", soot3 = "#5E4E42";

      // ── The nameplate ──
