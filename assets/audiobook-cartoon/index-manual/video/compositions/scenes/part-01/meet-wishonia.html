      var DIRT_AT = [TAB_X0 + EARTH_W / 2, -8], DIRT_FS = 44, DIRT_W = KIT.textWidth("DIRT", DIRT_FS, "Fraunces", 900);

        var dx0 = DIRT_AT[0] - DIRT_W / 2 - 8;
        out += '<g transform="rotate(-6 ' + f(DIRT_AT[0]) + " " + DIRT_AT[1] + ')"><defs><clipPath id="' + ID + '-dirtc"><rect id="' + ID + '-dirtclip" x="' + f(dx0) + '" y="-70" width="' + (o.dirt === "drawn" ? f(DIRT_W + 16) : 0) + '" height="80"/></clipPath></defs>' +

      }
      // A pose of the file: its bottom center (x, y) in canvas px, its scale k and its turn r (degrees).
      var EASEL = { x: LAY.easel[0] + (FILE_W / 2) * LAY.easel[2], y: LAY.easel[1] + FILE_H * LAY.easel[2], k: LAY.easel[2], r: -3 };

      var poseStr = function (p) { return "translate(" + f(p.x) + "," + f(p.y) + ") rotate(" + p.r.toFixed(2) + ") scale(" + p.k.toFixed(4) + ") translate(" + -FILE_W / 2 + "," + -FILE_H + ")"; };
      // a pose between a and b, u of the way, lifted on an arc `lift` px high and turned `spin` degrees at the middle

        return { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e - Math.sin(Math.PI * e) * lift, k: Math.exp(Math.log(a.k) + (Math.log(b.k) - Math.log(a.k)) * e), r: a.r + (b.r - a.r) * e + Math.sin(Math.PI * e) * spin };

      // ── As eligible left it: the file stamped and in the tray, the stamp on the easel's ledge.

      // ── The nameplate: brass, on the lectern's front edge. NP: [top y, height, right end x, the left end before it

      var NP = V ? [1050, 84, 669, 350] : [742, 84, 1000, 600], XL = -80, EXT = NP[3] - XL;
      var T1 = "WISHONIA LOVE", T2 = "C.E.O. AND PRESIDENT", T3 = "UNIVERSE OPTIMIZATION SERVICES";
      var fs1 = fit(T1, 38, NP[2] - NP[3] - 44, 1), fs2 = fit(T2, 21, NP[2] - NP[3] - 44, 1.5), SP3 = V ? 1.5 : 3, fs3 = Math.min(24, ((NP[3] - 30) * 0.9 - SP3 * (T3.length - 1)) / tw(T3, 1));

        '<rect x="' + (CARD[0] + 14) + '" y="' + (CARD[1] + 14) + '" width="' + (CARD[2] - 28) + '" height="' + (CARD[3] - 28) + '" fill="none" stroke="' + C.orange + '" stroke-width="3"/>' +
        '<text x="' + (CARD[0] + CARD[2] / 2) + '" y="' + f(CARD[1] + CARD[3] / 2 + cfs * 0.36) + '" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="' + cfs.toFixed(1) + '" fill="' + C.navy + '">4,297 YEARS</text></g>';

        return s + '<circle r="' + r * 0.35 + '" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="3"/>';

      function converter(wreck) {
        var s = "";

        s += '<rect x="-150" y="-16" width="42" height="16" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="4"/><rect x="108" y="-16" width="42" height="16" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="4"/>';

        // the cabinet
        s += '<rect id="' + ID + (wreck ? "-wcab" : "-cab") + '" x="-170" y="-330" width="340" height="316" rx="12" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="6"/>';
        s += '<path d="M162,-318 V-28" stroke="' + C.orange + '" stroke-width="4"/><path d="M-170,-286 H170" stroke="' + ink + '" stroke-width="3"/>';
        // the dials (in the wreck, eyes go on top instead)
        DIALS.forEach(function (d, i) {
          s += '<circle cx="' + d[0] + '" cy="' + d[1] + '" r="' + DIAL_R + '" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="5"/>';
          if (!wreck) {
            for (var k = 0; k < 9; k++) { var a = (-135 + k * 33.75) * Math.PI / 180; s += '<path d="M' + f(d[0] + Math.sin(a) * 36) + "," + f(d[1] - Math.cos(a) * 36) + " L" + f(d[0] + Math.sin(a) * 43) + "," + f(d[1] - Math.cos(a) * 43) + '" stroke="' + ink + '" stroke-width="3"/>'; }
            s += '<g transform="translate(' + d[0] + "," + d[1] + ')"><g id="' + ID + "-needle" + i + '"><path d="M0,6 L-4,0 L0,-38 L4,0 Z" fill="' + C.war + '" stroke="' + ink + '" stroke-width="2"/></g><circle r="6" fill="' + ink + '"/></g>';
          }
        });
        // the card slot, the gear in its porthole, the grille
        s += '<rect x="-92" y="-168" width="184" height="20" rx="5" fill="' + ink + '"/>';
        s += '<circle cx="' + GEAR[0] + '" cy="' + GEAR[1] + '" r="42" fill="' + C.deep + '" stroke="' + ink + '" stroke-width="5"/>';
        if (!wreck) s += '<g transform="translate(' + GEAR[0] + "," + GEAR[1] + ')"><g id="' + ID + '-gear">' + gearShape(22, 8, C.tan) + "</g></g>";
        s += [0, 1, 2].map(function (i) { return '<rect x="20" y="' + (-110 + i * 26) + '" width="120" height="12" rx="6" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="3"/>'; }).join("");
        // the crank: a turning arm and handle; in the wreck, hanging limp
        if (!wreck) s += '<g transform="translate(' + CRANK[0] + "," + CRANK[1] + ')"><g id="' + ID + '-crank"><path d="M0,0 L0,-62" stroke="' + ink + '" stroke-width="12" stroke-linecap="round"/><path d="M0,0 L0,-62" stroke="' + C.slate + '" stroke-width="6" stroke-linecap="round"/><rect x="-4" y="-76" width="34" height="18" rx="8" fill="' + C.rust + '" stroke="' + ink + '" stroke-width="4"/></g><circle r="9" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="4"/></g>';
        else s += '<path d="M170,-190 q30,10 34,40 q2,30 -8,62" fill="none" stroke="' + ink + '" stroke-width="10" stroke-linecap="round"/><rect x="180" y="-96" width="18" height="34" rx="8" fill="' + C.rust + '" stroke="' + ink + '" stroke-width="4" transform="rotate(14 189 -79)"/>';
        if (wreck) {
          // dents and cracks, and the gear sprung out of its porthole on a spring
          s += '<path d="M-170,-210 l26,8 l-10,16 l22,10 M120,-330 l-8,26 l18,6 l-6,22 M-40,-14 l10,-24 l-16,-8 l12,-22" fill="none" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>';
          s += '<path d="M' + GEAR[0] + "," + GEAR[1] + ' q-60,-10 -40,-50 q20,-40 -30,-60 q-50,-20 -20,-70" fill="none" stroke="' + ink + '" stroke-width="4"/>';
          s += '<g transform="translate(-186,-262) rotate(17)">' + gearShape(22, 8, C.tan) + "</g>";
        }
        return s;
      }
      // the wreck: the converter charred (KIT.burn), bent and dented, with two white eyes where its dials were
      var EYES = DIALS.map(function (d) { return '<g transform="translate(' + d[0] + "," + d[1] + ')"><ellipse rx="34" ry="26" fill="#FFFFFF" stroke="' + ink + '" stroke-width="4"/><circle cx="7" cy="3" r="11" fill="' + ink + '"/><circle cx="3" cy="-2" r="3.5" fill="#FFFFFF"/></g>'; }).join("");
      // the singed card it spits out of its slot (clipped at the slot, so it comes out of the machine)
      var SC_FS = fit("4,297 YEARS", 34, 196, 1);
      var singed = '<defs><clipPath id="' + ID + '-slotclip"><rect x="-300" y="-700" width="600" height="' + (700 - 158) + '"/></clipPath></defs><g clip-path="url(#' + ID + '-slotclip)"><g id="' + ID + '-scard">' +
        '<path d="M-118,-222 L-108,-232 L-96,-222 L-80,-234 L-64,-222 L-46,-234 L-28,-222 L-10,-234 L8,-222 L26,-234 L44,-222 L62,-234 L80,-222 L98,-232 L118,-222 V-150 H-118 Z" fill="#E6D3A8" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<path d="M-118,-222 L-108,-232 L-96,-222 L-80,-234 L-64,-222 L-46,-234 L-28,-222 L-10,-234 L8,-222 L26,-234 L44,-222 L62,-234 L80,-222 L98,-232 L118,-222" fill="none" stroke="#3A2A1A" stroke-width="7" opacity="0.55"/>' +
        label(0, -176, SC_FS, "4,297 YEARS", "middle", ink, ' letter-spacing="1"') + "</g></g>";
      var wisp = function (x) { return '<path class="wisp" d="M' + x + ',0 q-12,-18 0,-36 q12,-18 0,-36 q-12,-18 0,-36" fill="none" stroke="#7E776B" stroke-width="7" stroke-linecap="round"/>'; };
      var NUKE_K = V ? 0.6 : 0.85;
      var conv = '<g transform="translate(' + CONV[0] + "," + CONV[1] + ") scale(" + CONV[2] + ')">' +
        '<g id="' + ID + '-conv">' + converter(false) + puffs("steam") + "</g>" +
        '<g id="' + ID + '-wreck" opacity="0"><g transform="rotate(4 0 0) skewX(-6)">' + KIT.burn(converter(true)) + '<g id="' + ID + '-eyes">' + EYES + "</g>" + singed + "</g>" +
        '<g id="' + ID + '-smoke"><g transform="translate(-60,-360)">' + wisp(0) + "</g><g transform=\"translate(70,-350)\">" + wisp(0) + "</g><g transform=\"translate(-150,-300)\">" + wisp(0) + "</g></g></g>" +
        '<g transform="scale(' + NUKE_K / CONV[2] + ')"><g id="' + ID + '-nuke">' + KIT.nuke() + "</g></g></g>";

      var front = '<g id="' + ID + '-easel" transform="' + easelStr(0) + '">' + easel() + "</g>" + fileWrap() + tray("back") + tray("front") +
        '<g id="' + ID + '-stamp">' + stamp() + "</g>" + card + conv + plate;

      // ── The host's set (KIT.studio), the push carrying on from where eligible's stopped.
      KIT.studio(tl, ID, { cam: q("cam"), wall: q("wall"), wish: q("wish"), front: q("front") }, { front: front, push: V ? [1.015, 1.04] : [1.025, 1.06] });
      q("file").setAttribute("transform", poseStr(IN_TRAY));

      // ── The times
      var tIm = cue("I'm"), tName = cue("Wishonia"), tCeo = cue("C.E.O."), tUni = cue("Universe"), tFour = cue("four");
      var tWhich = cue("which"), tEarth = cue("Earth"), tBoom = tEarth + 1.1, tBell = KIT.after(ID, "years.", 2);
      var tGrow = [tUni, tUni + 0.5];

      // the plate's outline for a growth `ext` (px past its left end) and a sag `drop` (px at its tip)
      var np = q("np"), nphi = q("nphi"), np3path = q("np3path"), np2 = q("np2"), np3 = q("np3"), plateEl = q("plate");
      var bez = function (p0, p1, p2, p3, u) { var v = 1 - u; return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]; };
      function platePath(ext, drop) {
        var y0 = NP[0], hh = NP[1], R = NP[2], L0 = NP[3], xL = L0 - ext, h2 = hh - 10 * (ext / EXT);
        var top = function (dy) { return [[L0, y0 + dy], [L0 - 0.4 * ext, y0 + dy], [L0 - 0.7 * ext, y0 + 0.35 * drop + dy], [xL, y0 + drop + dy]]; };
        var c = function (pts) { return " C" + pts.slice(1).map(function (p) { return f(p[0]) + "," + f(p[1]); }).join(" "); };
        var T = top(0);
        var d = "M" + R + "," + y0 + " H" + L0 + (ext > 0.5 ? c(T) + " V" + f(y0 + drop + h2) + " C" + f(L0 - 0.7 * ext) + "," + f(y0 + hh + 0.35 * drop) + " " + f(L0 - 0.4 * ext) + "," + f(y0 + hh) + " " + L0 + "," + (y0 + hh) : "") + " V" + (y0 + hh) + " H" + R + " Z";
        np.setAttribute("d", d);
        var hi = top(8);
        nphi.setAttribute("d", "M" + (R - 8) + "," + (y0 + 8) + " H" + L0 + (ext > 0.5 ? c(hi) : ""));
        // the third line's path: the middle of the grown part, from x 40 to the old left end
        if (ext > 0.5) {
          var mid = [[L0, y0 + hh / 2], [L0 - 0.4 * ext, y0 + hh / 2], [L0 - 0.7 * ext, y0 + 0.35 * drop + hh / 2], [xL, y0 + drop + h2 / 2]], pts = [];
          for (var i = 40; i >= 0; i--) { var p = bez(mid[0], mid[1], mid[2], mid[3], i / 40); if (p[0] >= 26 && p[0] <= L0 - 10) pts.push(p); }
          if (pts.length > 1) np3path.setAttribute("d", "M" + pts.map(function (p) { return f(p[0]) + "," + f(p[1] + fs3 * 0.36); }).join(" L"));
        }
      }
      var DROP = V ? 70 : 64;

      // the converter's parts
      var convEl = q("conv"), cab = q("cab"), needles = [q("needle0"), q("needle1")], gear = q("gear"), crank = q("crank");
      var wreckEl = q("wreck"), eyes = q("eyes"), scard = q("scard"), wbell = q("wbell"), smoke = q("smoke").querySelectorAll(".wisp");
      var nukeEl = q("nuke"), easelEl = q("easel"), stampEl = q("stamp"), cardEl = q("card");
      var REST = easelAt(0, STAMP_REST[0], STAMP_REST[1]);

      // ── The blast (KIT.boom): the cloud grows over the converter, the white flash, and then it clears
      KIT.boom(tl, nukeEl, tBoom, { flash: q("flash") });
      tl.fromTo(nukeEl, { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power1.in", immediateRender: false }, tBoom + 1.05);
      tl.set(np2, { opacity: 1 }, tCeo);
      tl.set(np3, { opacity: 1 }, tGrow[1] + 0.04);

      KIT.onTime(tl, D, function (t) {
        // the empty easel (the stamp still on its ledge) slides off to the right on "I'm"
        var ex = EASEL_OFF * easeIn(span(t, tIm, tIm + 0.55));
        easelEl.setAttribute("transform", easelStr(ex));
        stampEl.setAttribute("transform", stampStr([REST[0] + ex, REST[1]]));

        // the nameplate slides in from the right on "Wishonia"; the second line clicks in (a little hop); on
        // "Universe" it grows out past the lectern's end and off the left of the frame, and then bounces like a diving board
        var sx = (W + 60 - NP[3]) * (1 - backOut(span(t, tName, tName + 0.42), 1.2));
        var hop = t >= tCeo ? -6 * Math.sin(Math.PI * span(t, tCeo, tCeo + 0.16)) : 0;
        plateEl.setAttribute("transform", "translate(" + f(sx) + "," + f(hop) + ")");
        var g = easeOut(span(t, tGrow[0], tGrow[1])), ext = EXT * g, drop = DROP * Math.pow(g, 1.5);
        if (t > tGrow[1]) { var w = t - tGrow[1]; drop = DROP * (1 + 0.35 * Math.exp(-2.2 * w) * Math.sin(w * 11)); }
        platePath(ext, drop);

        // the studio card drops in on its strings on "four", with a bounce and a little swing
        var cu = span(t, tFour, tFour + 0.5), cy = -(CARD[1] + CARD[3] + 40) * (1 - backOut(cu, 2.2));
        var sw = t > tFour + 0.5 ? 1.6 * Math.exp(-2.5 * (t - tFour - 0.5)) * Math.sin((t - tFour) * 7) : 0;
        cardEl.setAttribute("transform", "translate(0," + f(cy) + ") rotate(" + sw.toFixed(2) + " " + (CARD[0] + CARD[2] / 2) + " 0)");

        // the converter rises in on "which", then cranks: dials spin, the gear whirrs, it shakes, glows red and steams
        var ru = span(t, tWhich, tWhich + 0.4), rise = RISE * (1 - backOut(ru, 1.4));
        var run = Math.max(0, t - tEarth), heat = clamp01(run / (tBoom - tEarth));
        var amp = t > tEarth ? 1.5 + 9 * heat * heat : 0;
        var jx = amp * Math.sin(t * 71), jy = amp * 0.6 * Math.sin(t * 53 + 1), jr = amp * 0.25 * Math.sin(t * 41);
        convEl.setAttribute("transform", "translate(" + f(jx) + "," + f(rise + jy) + ") rotate(" + jr.toFixed(2) + " 0 -160)");
        needles[0].setAttribute("transform", "rotate(" + (-40 + 420 * run * run).toFixed(1) + ")");
        needles[1].setAttribute("transform", "rotate(" + (30 - 520 * run * run).toFixed(1) + ")");
        gear.setAttribute("transform", "rotate(" + (300 * run * run).toFixed(1) + ")");
        crank.setAttribute("transform", "rotate(" + (260 * run * run).toFixed(1) + ")");
        cab.setAttribute("fill", KIT.mix(C.peri, C.war, 0.85 * heat));
        // steam from the chimney, a puff every 0.3 s while it runs
        var sk = Math.floor(run / 0.3), st0 = tEarth + sk * 0.3;
        puffsAt("steam", t > tEarth && t < tBoom ? t : -1, st0, 0.55, [-112, -410], [-150 + (sk % 2) * 50, -520], 26);

        // the blast swaps it for the wreck under the flash; the picture shakes
        var boomed = t >= tBoom + 0.08;
        convEl.setAttribute("opacity", boomed ? 0 : 1);
        wreckEl.setAttribute("opacity", boomed ? 1 : 0);
        var k = span(t, tBoom, tBoom + 0.9), shake = t >= tBoom ? 16 * Math.exp(-4 * k) : 0;
        zoomTo(1, S.face, shake * Math.sin(t * 83), shake * 0.7 * Math.sin(t * 61 + 2));
        // the wreck smokes; its eyes open in the soot as the cloud clears, and blink
        Array.prototype.forEach.call(smoke, function (s, i) {
          var u = ((t - tBoom) * 0.7 + i / 3) % 1;
          s.setAttribute("transform", "translate(0," + f(-u * 60) + ")");
          s.setAttribute("opacity", boomed ? (0.8 * Math.sin(Math.PI * u)).toFixed(2) : 0);
        });
        var open = span(t, tBoom + 1.3, tBoom + 1.45), blink = 1;
        [tBoom + 2.0, tBell + 0.45].forEach(function (b) { if (t > b && t < b + 0.14) blink = Math.abs(Math.cos(Math.PI * (t - b) / 0.14)); });
        var lid = Math.max(0.06, open * blink).toFixed(3);
        Array.prototype.forEach.call(eyes.children, function (e, i) { e.setAttribute("transform", "translate(" + DIALS[i][0] + "," + DIALS[i][1] + ") scale(1," + lid + ")"); });
        // after "years." its bell still dings, and it spits out the singed card
        var bu = t - tBell, ding = bu > 0 ? 16 * Math.exp(-5 * bu) * Math.sin(bu * 40) : 0;
        wbell.setAttribute("transform", "rotate(" + ding.toFixed(1) + " 130 -326)");
        scard.setAttribute("transform", "translate(0," + f(80 * (1 - backOut(span(t, tBell, tBell + 0.25), 2))) + ")");
      });
      // KIT.boom's cap drift runs 3.25 s past the blast; the cloud has faded by then, so end it with the scene.
      tl.getChildren(false, true, false).forEach(function (c) { if (c.endTime() > D) c.duration(Math.max(0.01, D - c.startTime())); });
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
