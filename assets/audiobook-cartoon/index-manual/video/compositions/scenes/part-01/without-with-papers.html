<template id="without-with-papers-template">
  <!-- without-with-papers · style "atomic" (cartoon-style-bible.md): ONE long street on a plain field, and the camera
       travels along it left to right, one station per line, then whips back to the start.
       The left half has no papers. "Without": a patient in a dressing gown sits on the bench outside the hospital, a
       thermometer in his mouth, his chest light blinking red; "Save lives": he looks hopefully at the door; "many": the
       door sign flips to CLOSED; after "papers).": he x-rays into a skeleton, still sitting, grinning, thermometer in
       his teeth. "Cure": the lab, the Scientist by her bubbling flask; "very many papers": a cobweb grows between her
       and the flask, a spider lowers on its thread, the bubbling stops; after "papers).": she x-rays, clipboard and all.
       "Feed": a thin hungry human on a bare field, belly growling; "grows": a wheat stalk shoots up by itself in front
       of him; "free).": he looks into his wallet and a moth flies out; after it he x-rays, wallet still open.
       "WITH": a flood of war papers runs in from the right and the camera travels with them into the busy half. The
       Weapons Maker hammers a bomb on his workbench; "giving papers": two papers hop into its slot and it swells; after
       "this).": it goes off in his face; he stands charred, hard hat on, grinning, and keeps hammering a new bomb.
       "Start wars": two generals rake toy missiles across a map table at each other; after "wars": tiny mushroom clouds;
       "more papers": a paper pops out of each cloud like popcorn into their hands. "Destroy": a sweating digger shovels
       into a hill; after "planet": the dirt cracks and falls off both sides: it is the Earth, with a bite out of its
       top, molten inside; "profitable": papers sprout from the bite like wheat and the digger grins. After the last
       "papers).": the camera whips back to the start: three skeletons still grinning, and the wheat (it never stopped
       growing) is taller than the hospital. -->

    #without-with-papers-weave, #without-with-papers-shake, #without-with-papers-plate, #without-with-papers-film { position: absolute; inset: 0; }
    #without-with-papers-flash { position: absolute; inset: -40px; background: #FFFBEF; opacity: 0; }
  </style>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "without-with-papers";

      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };

      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line;

      // ── The plate, in plate units: feet and bases on y 0, the horizon at y HZ, the sky above it. Stations left to

      var S = 1.8, HZ = -250, BND = 2180;

      // a person-unit point of a person standing at plate x, scale k, as plate units
      var toPlate = function (x, k, p) { return [x + k * p[0], -100 * k + k * p[1]]; };

      }

      function stalk(h, lean) {
        var head = "";

          var y = -h + 10 + k * 11;
          head += '<ellipse cx="' + f(lean - 7) + '" cy="' + f(y) + '" rx="6" ry="9" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2" transform="rotate(-24 ' + f(lean - 7) + " " + f(y) + ')"/>' +
            '<ellipse cx="' + f(lean + 7) + '" cy="' + f(y) + '" rx="6" ry="9" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="2" transform="rotate(24 ' + f(lean + 7) + " " + f(y) + ')"/>';
        }
        return '<path d="M0,0 Q' + f(lean * 0.2) + "," + f(-h * 0.5) + " " + f(lean) + "," + f(-h + 70) + '" fill="none" stroke="#9E7A3C" stroke-width="5" stroke-linecap="round"/>' +
          '<path d="M0,-40 q-24,-14 -30,-40 q16,10 30,26 M0,-90 q22,-14 26,-40 q-14,12 -26,26" fill="#B89A52" stroke="' + ink + '" stroke-width="2"/>' + head +
          '<path d="M' + f(lean) + "," + f(-h + 8) + " l-2,-26 M" + f(lean - 4) + "," + f(-h + 16) + " l-10,-22 M" + f(lean + 4) + "," + f(-h + 16) + ' l10,-22" stroke="#9E7A3C" stroke-width="1.8"/>';
      }
      // A clipboard held in a hand at (0, 0), in person units (the cast's, for the skeleton, which drops held props).
      function clipboard() {
        return '<path d="M-4,-26 H18 V6 H-4 Z" fill="#B98A55" stroke="' + ink + '" stroke-width="2.2"/><rect x="0" y="-22" width="14" height="24" fill="' + C.paper + '"/>' +
          '<path d="M2,-16 H12 M2,-11 H12 M2,-6 H9" stroke="' + ink + '" stroke-width="1.2"/>';
      }
      // A wallet held in both hands, centered on (0, 0), person units: shut, or open with its empty inside showing.
      function wallet(open) {
        if (!open) return '<path d="M-14,-9 H14 V9 H-14 Z" fill="#7A4A2A" stroke="' + ink + '" stroke-width="2.2"/><path d="M-11,-5 H11" stroke="#A86B42" stroke-width="1.4"/>';
        return '<path d="M0,-9 L-22,-12 L-22,8 L0,9 Z" fill="#7A4A2A" stroke="' + ink + '" stroke-width="2.2" stroke-linejoin="round"/>' +
          '<path d="M0,-9 L22,-12 L22,8 L0,9 Z" fill="#7A4A2A" stroke="' + ink + '" stroke-width="2.2" stroke-linejoin="round"/>' +
          '<path d="M-3,-7 L-19,-9 L-19,5 L-3,6 Z M3,-7 L19,-9 L19,5 L3,6 Z" fill="#2A1A10"/>';
      }
      // The thermometer, in the face's units (facing +x): from the mouth out and up, a red bulb at the tip.
      var THERMO = '<path d="M7,13 L29,5" stroke="' + ink + '" stroke-width="5.4" stroke-linecap="round"/><path d="M7,13 L29,5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>' +
        '<path d="M8,12.6 L15,10.1" stroke="' + C.war + '" stroke-width="1.6" stroke-linecap="round"/>';
      var THERMO_BONES = '<g transform="translate(-2,1)">' + THERMO + "</g>";
      // A plain wooden bench, its seat top at y SEAT, centered on x 0, in plate units: the back (behind the sitter)

      function benchBack() {

      }
      function benchSeat() {
        return '<path d="M-118,' + (SEAT + 12) + " V0 M118," + (SEAT + 12) + ' V0" stroke="' + ink + '" stroke-width="16"/><path d="M-118,' + (SEAT + 12) + " V0 M118," + (SEAT + 12) + ' V0" stroke="' + C.rust + '" stroke-width="9"/>' +
          '<rect x="-148" y="' + SEAT + '" width="296" height="18" fill="' + C.tan + '" stroke="' + ink + '" stroke-width="5"/>';
      }
      // A general's peaked cap (face units, facing +x) and a row of medals (person units, around (0, 0)).
      var CAP = '<path d="M-18,-16 L-16,-31 L-4,-37 L15,-35 L20,-19 Z" fill="#6E7045" stroke="' + ink + '" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<path d="M-18,-21 L20,-23 L20,-17 L-18,-15 Z" fill="' + ink + '"/><path d="M12,-18 L31,-14 L28,-11 L12,-14 Z" fill="' + ink + '"/><circle cx="7" cy="-29" r="3.2" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="1.2"/>';
      function medals() {
        return [[-6, C.war], [1, C.yellow], [8, C.med]].map(function (m) {
          return '<path d="M' + (m[0] - 2.5) + ',-6 h5 v5 h-5 Z" fill="' + m[1] + '" stroke="' + ink + '" stroke-width="0.8"/><circle cx="' + m[0] + '" cy="2" r="2.6" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="0.9"/>';
        }).join("");
      }
      // The toy missile on the map (the Weapons Maker's baby missile, small), pointing +x, around (0, 0).
      function missile() {
        return '<g transform="translate(-2,0)"><path d="M-34,-7 L14,-7 L30,0 L14,7 L-34,7 Z" fill="' + C.war + '" stroke="' + ink + '" stroke-width="2.6" stroke-linejoin="round"/>' +
          '<path d="M-34,-7 L-44,-17 L-40,-7 Z M-34,7 L-44,17 L-40,7 Z" fill="' + C.war + '" stroke="' + ink + '" stroke-width="2.4" stroke-linejoin="round"/>' +
          '<path d="M14,-7 L30,0 L14,7 Z" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="2"/>' +
          '<path d="M-4,2 Q2,6 8,2" fill="none" stroke="' + ink + '" stroke-width="1.8" stroke-linecap="round"/><circle cx="-2" cy="-2.5" r="1.6" fill="' + ink + '"/><circle cx="6" cy="-2.5" r="1.6" fill="' + ink + '"/></g>';
      }
      // A white grin over a charred face, in person units at the rig's mouth, facing dir.
      function charGrin(R, dir) {
        var m = R.mouth, x0 = m[0] + 4 * dir * -1, x1 = m[0] + 13 * dir, y = m[1];
        return '<path d="M' + f(x0) + "," + f(y - 1.5) + " Q" + f((x0 + x1) / 2) + "," + f(y + 9) + " " + f(x1) + "," + f(y - 3) + ' Z" fill="#FFFFFF" stroke="' + ink + '" stroke-width="1.3" stroke-linejoin="round"/>' +
          '<path d="M' + f(x0 + (x1 - x0) * 0.08) + "," + f(y + 0.8) + " L" + f(x1 - (x1 - x0) * 0.08) + "," + f(y + 0.2) + '" stroke="' + ink + '" stroke-width="0.9"/>';
      }

      // ── The left half: positions ──
      var HX = 0, HS = 1.55, PX = -430, BX = PX - 20;
      var PAT = { plain: true, tone: 2, outfit: "shirt", colorHex: C.cyan, hair: 2, look: "right", mood: "sad", light: "red",
        arms: [[38, 84], [28, 78]], build: { legPose: [[86, 8], [92, 12]] } };
      var LX = 1010, LS = 1.7, SX = 640;
      var SCI = KIT.castOpts("scientist", { look: "right", mood: "eager", arms: [[-12, -4], [32, 128]], holdR: "clipboard" });
      var FX = 1600, WX = 1760;
      var HUN = { tone: 0, outfit: "shirt", color: 2, kind: "twig", hair: 0, look: "right", mood: "sad", arms: [[22, 62], [14, 52]], build: { legs: 1.12, neck: 1.5, tw: 0.78, hs: 0.95 } };
      var RP = KIT.rig(PAT), RS = KIT.rig(SCI), RH = KIT.rig(HUN);

      // ── The right half: positions. The workbench and the bomb are placed where the hammer comes down. ──
      var WMX = 3100;
      var WMO = KIT.castOpts("weaponsMaker", { look: "left", mood: "grin", arms: [[-96, -166], [-34, -70]] });
      var RW = KIT.rig(WMO), SH = RW.shoulder[0], HD = RW.hand[0];
      // the hammer in his fist (person units, drawn into the .arm-l group, so it turns with the arm): the handle runs

      var HAM_L = 46, HAM = '<g class="hammer"><path d="M' + f(HD[0] + 6) + "," + f(HD[1] + 2) + " H" + f(HD[0] - HAM_L) + '" stroke="' + ink + '" stroke-width="8" stroke-linecap="round"/>' +
        '<path d="M' + f(HD[0] + 6) + "," + f(HD[1] + 2) + " H" + f(HD[0] - HAM_L) + '" stroke="' + C.tan + '" stroke-width="4.4" stroke-linecap="round"/>' +
        '<rect x="' + f(HD[0] - HAM_L - 9) + '" y="' + f(HD[1] - 13) + '" width="18" height="30" rx="2" fill="' + C.slate + '" stroke="' + ink + '" stroke-width="2.6"/>' +
        '<path d="M' + f(HD[0] - HAM_L - 5) + "," + f(HD[1] - 9) + " V" + f(HD[1] + 12) + '" stroke="' + C.peri + '" stroke-width="2"/></g>';
      var HIT = [HD[0] - HAM_L, HD[1] + 17]; // the hammer face (person units, arm at rest = the strike)
      var hitP = toPlate(WMX, S, HIT), BK = 1.35;
      var BOMB = [hitP[0], hitP[1] + 84 * BK]; // the bomb's base (its ball's top meets the hammer's face)
      var BENCH_Y = BOMB[1], BENCH = [BOMB[0] - 270, BOMB[0] + 190];

      var RGL = KIT.rig(GEN_L), RGR = KIT.rig(GEN_R);
      var EX = 5500, GR = 230, HW = 520, PEAK = 545, DIGX = EX + 150;
      var hillY = function (x) { var u = (x - EX) / HW; return u <= -1 || u >= 1 ? 0 : -PEAK * Math.pow(1 - u * u, 0.75); };
      var globeY = function (x) { var d = x - EX; return -GR - Math.sqrt(Math.max(0, GR * GR - d * d)); };
      var DIG = { tone: 3, outfit: "overalls", colorHex: "#4F6A8A", hair: 0, seed: 21, look: "left", mood: "worried", arms: [[-34, -64], [-14, -46]] };
      var RD = KIT.rig(DIG);

      // ── The camera's views: [plate x, plate y, scale] (KIT.camera). Close views keep the feet above y 900 (16:9) and

      var VIEW = V
        ? { hosp: [-170, -430, 0.95], door: [-215, -250, 1.85], lab: [800, -260, 1.7], field: [1675, -265, 1.9], bench: [BOMB[0] + 135, -250, 1.75],
            boom: [BOMB[0] + 110, -330, 1.4], table: [TX, -300, 1.15], dig: [EX + 70, -650, 1.45], earth: [EX, -420, 1.0], end: [665, -600, 0.4] }
        : { hosp: [-130, -300, 1.0], door: [-215, -205, 1.75], lab: [840, -225, 1.55], field: [1660, -205, 1.7], bench: [BOMB[0] + 140, -210, 1.6],
            boom: [BOMB[0] + 110, -270, 1.3], table: [TX, -250, 1.4], dig: [EX + 70, -560, 1.4], earth: [EX, -330, 1.05], end: [665, -340, 0.74] };

      // ── Assemble the plate ──
      var span = [-2600, 7600];
      var field = '<rect x="' + span[0] + '" y="-3200" width="' + (span[1] - span[0]) + '" height="' + (3200 + HZ) + '" fill="' + SKY + '"/>' +

        '<path d="M' + span[0] + ",-14 H" + span[1] + " M" + span[0] + ",60 H" + span[1] + '" stroke="' + WALK_EDGE + '" stroke-width="5"/>' +
        '<path d="M' + span[0] + ",23 H" + span[1] + '" stroke="#CDB98A" stroke-width="4" stroke-dasharray="40 60"/>';

      // the hospital and the patient on his bench
      var patSad = KIT.person(PAT).replace("<!--face-end-->", THERMO + "<!--face-end-->");

      var hosp = at(HX, 0, HS, KIT.props.hospital({}), ' id="' + ID + '-hosp"') +
        at(BX, 0, 1, benchBack()) + at(BX, 0, 1, benchSeat()) +
        place(PX, S, '<g id="' + ID + '-pat-alive"><g id="' + ID + '-pat-sad">' + patSad + '</g><g id="' + ID + '-pat-eager" opacity="0">' + patEager + "</g></g>" +
          '<g id="' + ID + '-pat-bones" opacity="0">' + patBones + "</g>");

      // the lab and the Scientist; the cobweb between her and the flask, and the spider on its thread
      var sciBones = KIT.person(copy(SCI, { skeleton: true })) + '<g transform="translate(' + f(RS.hand[1][0] + 2) + "," + f(RS.hand[1][1] + 6) + ')">' + clipboard() + "</g>";
      var lab = at(LX, 0, LS, KIT.props.lab({}), ' id="' + ID + '-lab"') +
        place(SX, S, '<g id="' + ID + '-sci-alive">' + KIT.person(SCI) + '</g><g id="' + ID + '-sci-bones" opacity="0">' + sciBones + "</g>");
      var FLASK_TOP = [LX + LS * -40, -LS * 193], FLASK_MID = [LX + LS * -40, -LS * 140];
      var sciHead = toPlate(SX, S, RS.top), sciHand = toPlate(SX, S, RS.hand[1]);
      var WEBC = [(sciHead[0] + FLASK_TOP[0]) / 2 + 10, (sciHead[1] + FLASK_TOP[1]) / 2 + 30];
      var WEBA = [[sciHead[0] + 18, sciHead[1] + 10], [FLASK_TOP[0] - 6, FLASK_TOP[1] + 4], [FLASK_MID[0] - 30, FLASK_MID[1] + 20], [sciHand[0] + 14, sciHand[1] - 10], [WEBC[0] - 10, -560]];
      var web = "";
      WEBA.forEach(function (a) { web += "M" + f(WEBC[0]) + "," + f(WEBC[1]) + " L" + f(a[0]) + "," + f(a[1]) + " "; });
      [0.28, 0.52, 0.76].forEach(function (r) {
        web += "M" + WEBA.map(function (a) { return f(WEBC[0] + (a[0] - WEBC[0]) * r) + "," + f(WEBC[1] + (a[1] - WEBC[1]) * r); }).join(" L") + " ";
      });
      var webSvg = '<g id="' + ID + '-web" opacity="0"><path d="' + web + '" fill="none" stroke="' + ink + '" stroke-width="6" opacity="0.4"/><path d="' + web + '" fill="none" stroke="#FBF8EE" stroke-width="3.4"/></g>';
