<template id="killed-310-million-template">
  <!-- killed-310-million · Part 2, "Classroom film" style (compositions/scenes/style-classroom/STYLE.md). "One downside of this
       system is that it has killed three hundred and ten million of you in your assorted wars." A cut to the family from
       the money loop, charred, posing for a portrait (the father in his hard hat with his loaf); they blink. "killed":
       they x-ray into grinning skeletons, one after another, and the hard hat drops onto the father's skull. "three
       hundred": the camera pulls back, the sky goes to dusk and rows of headstones rise behind them to the horizon.
       "million": 310,000,000, hand lettered, lands in the sky. Then HOLD (nothing moves) until the iris closes on the
       father's grin. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0806; }
    #killed-310-million-gate, #killed-310-million-shake, #killed-310-million-cam, #killed-310-million-flash, #killed-310-million-iris, #killed-310-million-fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #killed-310-million-flash { background: #FFFDF4; opacity: 0; }
    #killed-310-million-cam .cf-layer { position: absolute; left: 0; top: 0; }
    #killed-310-million-cam .cf-cut { filter: drop-shadow(5px 8px 3px rgba(40, 24, 8, 0.32)); }
    #killed-310-million-fx > * { position: absolute; pointer-events: none; }
    #killed-310-million-fx .cf-wash, #killed-310-million-fx .cf-flick, #killed-310-million-fx .cf-vig { inset: 0; }
    #killed-310-million-fx .cf-wash { background: rgba(240, 226, 192, 0.12); }
    #killed-310-million-fx .cf-flick { background: #FFF3D6; }
    #killed-310-million-fx .cf-vig { background: radial-gradient(ellipse 72% 72% at 50% 50%, rgba(0, 0, 0, 0) 58%, rgba(24, 13, 4, 0.5) 100%); }
    #killed-310-million-fx .cf-grain, #killed-310-million-fx .cf-dust { left: 0; top: 0; }
  </style>
  <div id="root" data-composition-id="killed-310-million" data-width="1920" data-height="1080" data-start="0" data-duration="6.56">
    <div id="killed-310-million-gate">
      <div id="killed-310-million-shake">
        <div id="killed-310-million-cam"></div>
      </div>
      <div id="killed-310-million-flash"></div>
    </div>
    <div id="killed-310-million-iris"></div>
    <div id="killed-310-million-fx"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "killed-310-million";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var tl = gsap.timeline({ paused: true });
      var cam = q("cam");

      // ── The camera (the same block in every shot of this variant) ─────────────────────────────────────────
      // The world is drawn in two layers inside the camera: the flat backdrop, and the paper cut-outs with their soft
      // shadow. view(cx, cy, z) puts world point (cx, cy) in the middle of the frame at zoom z; the camera pushes in,
      // pulls back, pans or cuts, and does most of the work.
      function layers(box, back, cut) {
        var s = function (inner, cls) {
          return '<svg class="cf-layer ' + cls + '" width="' + box[2] + '" height="' + box[3] + '" viewBox="' + box.join(" ") + '" style="left:' + box[0] + "px;top:" + box[1] + 'px;overflow:visible">' + inner + "</svg>";
        };
        cam.innerHTML = s(back, "cf-back") + '<div class="cf-layer cf-cut">' + s(cut, "cf-cutsvg") + "</div>";
      }
      function view(cx, cy, z) { return { x: W / 2 - z * cx, y: H / 2 - z * cy, scale: z }; }
      function camAt(t, cx, cy, z) {
        var v = view(cx, cy, z);
        v.transformOrigin = "0 0";
        tl.set(cam, v, t);
      }
      function camTo(t, dur, cx, cy, z, ease) {
        var v = view(cx, cy, z);
        v.duration = dur; v.ease = ease || "sine.inOut";
        tl.to(cam, v, t);
      }
      // A world point's place on screen at a given view.
      function onScreen(p, cx, cy, z) { return [W / 2 + z * (p[0] - cx), H / 2 + z * (p[1] - cy)]; }
      // The iris (the period transition): a black card with a round hole at (cx, cy) in screen pixels, over the
      // picture and under the film. irisOpen runs it from shut to open, irisClose from open to shut.
      var irises = 0;
      function iris(cx, cy) {
        var R = Math.ceil(Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy))) + 30, big = ' x="-20" y="-20" width="' + (W + 40) + '" height="' + (H + 40) + '"', k = ++irises;
        q("iris").insertAdjacentHTML("beforeend", '<svg width="' + W + '" height="' + H + '" style="position:absolute;left:0;top:0;overflow:visible"><defs><mask id="' + ID + "-im" + k + '" maskUnits="userSpaceOnUse"' + big + ">" +
          "<rect" + big + ' fill="#fff"/><circle id="' + ID + "-ic" + k + '" cx="' + cx.toFixed(0) + '" cy="' + cy.toFixed(0) + '" r="' + R + '" fill="#000"/></mask></defs>' +
          "<rect" + big + ' fill="#0B0806" mask="url(#' + ID + "-im" + k + ')"/></svg>');
        return { el: q("ic" + k), R: R };
      }
      function irisOpen(cx, cy, t, dur) { var i = iris(cx, cy); tl.fromTo(i.el, { attr: { r: 0 } }, { attr: { r: i.R }, duration: dur, ease: "power2.in" }, t); }
      function irisClose(cx, cy, t, dur) { var i = iris(cx, cy); tl.fromTo(i.el, { attr: { r: i.R } }, { attr: { r: 0 }, duration: dur, ease: "power2.out", immediateRender: false }, t); }

      // ── The film (the same block in every shot of this variant) ─────────────────────────────────────────
      // The picture weaves a little in the gate; over it, outside the camera, a faded warm wash, grain that boils,
      // a few dust specks and a rare scratch, a soft flicker and the vignette. Everything comes from the part's
      // frame number through KIT.rng, so every seek draws the same frame.
      function film() {
        var fx = q("fx"), gate = q("gate"), m = 96, r0 = KIT.rng(4242), dots = "";
        // one 96 px tile of random specks (no visible lattice), shifted to a new place every frame
        for (var k = 0; k < 110; k++) {
          dots += '<circle cx="' + (r0() * m).toFixed(1) + '" cy="' + (r0() * m).toFixed(1) + '" r="' + (0.5 + r0() * 1.1).toFixed(2) + '" fill="' + (r0() < 0.62 ? "#000" : "#FFF") + '" opacity="' + (0.07 + r0() * 0.13).toFixed(2) + '"/>';
        }
        fx.innerHTML = '<div class="cf-wash"></div>' +
          '<svg class="cf-grain" width="' + (W + m) + '" height="' + (H + m) + '"><defs><pattern id="' + ID + '-fg" width="' + m + '" height="' + m + '" patternUnits="userSpaceOnUse">' + dots + "</pattern></defs>" +
          '<rect width="' + (W + m) + '" height="' + (H + m) + '" fill="url(#' + ID + '-fg)"/></svg>' +
          '<svg class="cf-dust" width="' + W + '" height="' + H + '"><circle class="cf-sp" r="0"/><circle class="cf-sp" r="0"/><circle class="cf-sp" r="0"/>' +
          '<path class="cf-hair" d="M0,0" fill="none" stroke="#1A120A" stroke-width="1.6"/><line class="cf-scratch" y1="0" y2="' + H + '" stroke="#FFF6E2" stroke-width="2"/></svg>' +
          '<div class="cf-flick"></div><div class="cf-vig"></div>';
        var grain = fx.querySelector(".cf-grain"), flick = fx.querySelector(".cf-flick"), sp = fx.querySelectorAll(".cf-sp");
        var hair = fx.querySelector(".cf-hair"), scratch = fx.querySelector(".cf-scratch");
        KIT.onTime(tl, D, function (t) {
          var T = sc.start + t, f = Math.floor(T * 24), r = KIT.rng(f * 7919 + 101);
          gate.style.transform = "translate(" + (Math.sin(T * 1.3) * 1.1 + Math.sin(T * 5.3) * 0.4).toFixed(2) + "px," + (Math.sin(T * 0.9 + 1) * 1.5 + (r() - 0.5) * 0.8).toFixed(2) + "px)";
          grain.style.transform = "translate(" + -Math.floor(r() * m) + "px," + -Math.floor(r() * m) + "px)";
          flick.style.opacity = (r() * 0.05).toFixed(3);
          for (var i = 0; i < sp.length; i++) {
            var on = r() < 0.16, rad = 1 + r() * 2.4, x = r() * W, y = r() * H, light = r() < 0.3;
            sp[i].setAttribute("r", on ? rad.toFixed(1) : 0);
            sp[i].setAttribute("cx", x.toFixed(0)); sp[i].setAttribute("cy", y.toFixed(0));
            sp[i].setAttribute("fill", light ? "#FFF6E2" : "#1A120A");
          }
          var hx = r() * W, hy = r() * H, hon = r() < 0.03;
          hair.setAttribute("d", hon ? "M" + hx.toFixed(0) + "," + hy.toFixed(0) + " q14,-10 22,6 t20,-4" : "M0,0");
          var sx = r() * W, son = r() < 0.04;
          scratch.setAttribute("x1", sx.toFixed(0)); scratch.setAttribute("x2", (sx + 6).toFixed(0));
          scratch.setAttribute("opacity", son ? 0.3 : 0);
        });
      }

      // ── Layout ───────────────────────────────────────────────────────────────────────────────────────────────
      // One idea: the family from the money loop (charred, the father in his hard hat with his loaf) posing for a
      // classroom-film portrait. They become skeletons, the camera pulls back, and the plain behind them fills with
      // headstones to the horizon. Three things: the family, the headstones, the number.
      var L = V
        ? { FY: 1400, HZ: 1000, k: 2.3, fam: [370, 540, 690], start: [540, 1170, 1.65], num: [560, 116], front: 1.75 }
        : { FY: 872, HZ: 610, k: 1.75, fam: [790, 955, 1095], start: [950, 705, 1.8], num: [300, 170], front: 1.5 };
      var FY = L.FY, k = L.k, ink = C.line;
      var box = [-500, -500, W + 1000, H + 1000];
      function f1(n) { return n.toFixed(1); }
      function g(id, inner, hidden) { return '<g id="' + ID + "-" + id + '"' + (hidden ? ' opacity="0"' : "") + ">" + inner + "</g>"; }
      function fig(o, x, s) { return '<g transform="translate(' + f1(x) + "," + f1(FY - 100 * s) + ") scale(" + s + ')">' + KIT.person(o) + "</g>"; }
      function wp(x, s, p) { return [x + p[0] * s, FY - 100 * s + p[1] * s]; }
      
      // The sky (cream, then dusk) and the plain.
      var back = '<rect x="' + box[0] + '" y="' + box[1] + '" width="' + box[2] + '" height="' + (L.HZ - box[1]) + '" fill="' + C.cream + '"/>' +
        '<rect id="' + ID + '-dusk" x="' + box[0] + '" y="' + box[1] + '" width="' + box[2] + '" height="' + (L.HZ - box[1]) + '" fill="' + C.peri + '" opacity="0"/>' +
        '<rect x="' + box[0] + '" y="' + L.HZ + '" width="' + box[2] + '" height="' + (box[1] + box[3] - L.HZ) + '" fill="' + C.tan + '"/>' +
        '<path d="M' + box[0] + "," + L.HZ + " H" + (box[0] + box[2]) + '" stroke="' + ink + '" stroke-width="3"/>';
      
      // The headstones: rows from just behind the family back to the horizon, each row one path (slabs) and one path
      // (mounds), so a field of hundreds stays light. Rows shrink toward the horizon and alternate their spacing.
      var rows = "", R = 10, qr = 0.7, y0 = FY - 34 * k / 1.75;
      for (var r = R - 1; r >= 0; r--) {
        var s = L.front * Math.pow(qr, r), y = L.HZ + (y0 - L.HZ) * Math.pow(qr, r), step = 62 * s, slabs = "", mounds = "";
        for (var x = box[0] + (r % 2 ? step / 2 : 0); x < box[0] + box[2]; x += step) {
          slabs += "M" + f1(x - 18 * s) + "," + f1(y) + " V" + f1(y - 34 * s) + " Q" + f1(x - 18 * s) + "," + f1(y - 52 * s) + " " + f1(x) + "," + f1(y - 52 * s) +
            " Q" + f1(x + 18 * s) + "," + f1(y - 52 * s) + " " + f1(x + 18 * s) + "," + f1(y - 34 * s) + " V" + f1(y) + " Z ";
          mounds += "M" + f1(x - 26 * s) + "," + f1(y + 2 * s) + " Q" + f1(x) + "," + f1(y - 9 * s) + " " + f1(x + 26 * s) + "," + f1(y + 2 * s) + " Z ";
        }
        rows += '<g class="cf-row" data-y="' + f1(y) + '"><path d="' + mounds + '" fill="' + C.rust + '" stroke="' + ink + '" stroke-width="' + f1(Math.max(0.5, 2.4 * s)) + '"/>' +
          '<path d="' + slabs + '" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="' + f1(Math.max(0.6, 3.2 * s)) + '"/></g>';
      }
      
      // The family, charred (as the bomb left them), and as skeletons in the same poses. The father holds up his loaf;
      // his hard hat sits on his hair, and drops onto his skull when the hair goes.
      var FAM = [
        { tone: 1, outfit: "shirt", color: 1, seed: 3, s: 1, arms: [[-12, -4], [38, 128]] },
        { tone: 1, outfit: "dress", hair: 1, color: 0, seed: 3, s: 1, arms: [[-14, -6], [14, 6]] },
        { tone: 1, outfit: "shirt", color: 3, seed: 5, s: 0.74, arms: [[-16, -8], [16, 8]], build: { hs: 1.28, legs: 0.8, th: 0.82, nose: 0.85, neck: 0.5 } },
      ];
      function opts(i, extra) {
        var o = {}, key;
        for (key in FAM[i]) if (key !== "s") o[key] = FAM[i][key];
        for (key in extra) o[key] = extra[key];
        return o;
      }
      var family = FAM.map(function (f, i) {
        var s = k * f.s;
        return g("c" + i, fig(opts(i, { charred: true }), L.fam[i], s)) + g("b" + i, fig(opts(i, { skeleton: true }), L.fam[i], s), true);
      }).join("");
      var fr = KIT.rig(opts(0, {})), fx = L.fam[0];
      var loafAt = wp(fx, k, fr.hand[1]);
      var loaf = '<g transform="translate(' + f1(loafAt[0]) + "," + f1(loafAt[1] + 6 * k / 1.5) + ") scale(" + (k / 1.5) + ')"><path d="M-27,0 C-29,-17 -14,-25 0,-25 C14,-25 29,-17 27,0 Z" fill="#D9A55A" stroke="' + ink + '" stroke-width="3"/>' +
        '<path d="M-13,-19 l6,8 M-1,-21 l6,8 M11,-19 l6,8" stroke="#8E5A2A" stroke-width="2.6" fill="none"/></g>';
      var hatY = wp(fx, k, [0, fr.head[1] - 44 * fr.hs])[1], skullDrop = (44 - 21) * fr.hs * k;
      var hat = g("hat", '<g transform="translate(' + f1(fx) + "," + f1(hatY) + ") scale(" + f1(fr.hs * k * 1.05) + ')" stroke="' + ink + '" stroke-linejoin="miter">' +
        '<path d="M-23,-5 L-18,-23 L0,-30 L18,-23 L23,-5 Z" fill="' + C.yellow + '" stroke-width="2.6"/><path d="M-32,0 L-27,-6 H27 L32,0 Z" fill="' + C.yellow + '" stroke-width="2.4"/>' +
        '<path d="M-3,-29 V-6" stroke-width="1.6" opacity="0.5"/></g>');
      
      layers(box, back, rows + family + loaf + hat);
      
      // The number, hand lettered like the title card, in the sky (outside the camera, so it lands still).
      var num = document.createElement("div"), nr = KIT.rng(310), digits = "310,000,000", spans = "";
      for (var d = 0; d < digits.length; d++) {
        spans += '<span style="display:inline-block;transform:translateY(' + ((nr() - 0.5) * L.num[1] * 0.04).toFixed(1) + "px) rotate(" + ((nr() - 0.5) * 3.6).toFixed(2) + 'deg)">' + digits[d] + "</span>";
      }
      num.style.cssText = "position:absolute;left:0;width:100%;top:" + (L.num[0] - L.num[1] / 2) + "px;text-align:center;font-family:Fraunces;font-weight:900;font-size:" + L.num[1] +
        "px;line-height:1;color:" + C.cream + ";text-shadow:" + (L.num[1] * 0.03).toFixed(1) + "px " + (L.num[1] * 0.035).toFixed(1) + "px 0 " + C.rust + ";opacity:0;";
      num.innerHTML = spans;
      q("gate").insertBefore(num, q("flash"));
      
      // ── Time ─────────────────────────────────────────────────────────────────────────────────────────────────
      var tKilled = cue("killed"), tThree = cue("three"), tMillion = cue("million");
      // "One downside of this system": the portrait, held close. They blink in their smoke.
      camAt(0, L.start[0], L.start[1], L.start[2]);
      camTo(0.1, tThree - 0.2, L.start[0], L.start[1] - 12, L.start[2] * 1.03, "none");
      [0, 1, 2].forEach(function (i) {
        var c = q("c" + i), eyes = c.querySelector(".char-eyes"), smoke = c.querySelector(".smoke");
        gsap.set(eyes, { svgOrigin: KIT.rig({}).faceEyes.join(" ") });
        [0.7 + i * 0.12, 1.55 + i * 0.07].forEach(function (b) {
          tl.to(eyes, { scaleY: 0.1, duration: 0.05 }, b);
          tl.to(eyes, { scaleY: 1, duration: 0.07 }, b + 0.1);
        });
        tl.fromTo(smoke, { y: 0, opacity: 1 }, { y: -7, opacity: 0.45, duration: 0.45, repeat: 3, yoyo: true, ease: "sine.inOut" }, 0);
        // "killed": x-ray, one after another, into skeletons that keep their poses and their grins (the zap).
        KIT.xray(tl, c, q("b" + i), tKilled + i * 0.12);
      });
      // The hard hat, with no hair left to sit on, drops onto the skull.
      tl.to(q("hat"), { y: skullDrop, duration: 0.16, ease: "bounce.out" }, tKilled + 0.42);
      // "three hundred": the camera pulls back, the sky goes to dusk and the headstones rise row by row, front to back,
      // all the way to the horizon.
      camTo(tThree, tMillion - tThree + 0.12, W / 2, H / 2, 1, "power2.inOut");
      tl.fromTo(q("dusk"), { opacity: 0 }, { opacity: 1, duration: 1.3, ease: "sine.inOut" }, tThree);
      Array.prototype.forEach.call(document.querySelectorAll("#" + ID + "-cam .cf-row"), function (row, i, all) {
        var n = all.length - 1 - i;
        gsap.set(row, { svgOrigin: "0 " + row.getAttribute("data-y") });
        tl.fromTo(row, { scaleY: 0 }, { scaleY: 1, duration: 0.26, ease: "back.out(1.4)" }, tThree + 0.12 + n * 0.11);
      });
      // "million": the number lands (the thunk). Then HOLD: nothing moves until the iris closes on the father's grin.
      tl.fromTo(num, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out" }, tMillion);
      var skull = [fx, wp(fx, k, fr.head)[1]];
      irisClose(skull[0], skull[1], D - 0.5, 0.5);

      film();
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
