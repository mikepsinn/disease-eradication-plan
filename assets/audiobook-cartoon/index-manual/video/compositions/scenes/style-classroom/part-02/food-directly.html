<template id="food-directly-template">
  <!-- food-directly · Part 2, "Classroom film" style (compositions/scenes/style-classroom/STYLE.md): the one shot with the host on
       camera. "On my planet, we skip the mass murder step and just give people food directly, but that's probably too
       advanced for you." Iris in on Wishonia against a plain wall; a hungry human stands across from her with his pockets
       turned out (no papers, so never in the loop). "just": she points at him. "give": a sandwich appears at her fingertip
       and flies to him in one straight line, landing in his hands on "directly," (the pop). He turns it over looking for
       the price tag; there isn't one. "advanced": an enormous bite (the snip). "you.": she side-eyes the camera. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0806; }
    #food-directly-gate, #food-directly-shake, #food-directly-cam, #food-directly-flash, #food-directly-iris, #food-directly-fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #food-directly-flash { background: #FFFDF4; opacity: 0; }
    #food-directly-cam .cf-layer { position: absolute; left: 0; top: 0; }
    #food-directly-cam .cf-cut { filter: drop-shadow(5px 8px 3px rgba(40, 24, 8, 0.32)); }
    #food-directly-fx > * { position: absolute; pointer-events: none; }
    #food-directly-fx .cf-wash, #food-directly-fx .cf-flick, #food-directly-fx .cf-vig { inset: 0; }
    #food-directly-fx .cf-wash { background: rgba(240, 226, 192, 0.12); }
    #food-directly-fx .cf-flick { background: #FFF3D6; }
    #food-directly-fx .cf-vig { background: radial-gradient(ellipse 72% 72% at 50% 50%, rgba(0, 0, 0, 0) 58%, rgba(24, 13, 4, 0.5) 100%); }
    #food-directly-fx .cf-grain, #food-directly-fx .cf-dust { left: 0; top: 0; }
  </style>
  <div id="root" data-composition-id="food-directly" data-width="1920" data-height="1080" data-start="0" data-duration="7.36">
    <div id="food-directly-gate">
      <div id="food-directly-shake">
        <div id="food-directly-cam"></div>
      </div>
      <div id="food-directly-flash"></div>
    </div>
    <div id="food-directly-iris"></div>
    <div id="food-directly-fx"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "food-directly";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var tl = gsap.timeline({ paused: true });
      var cam = q("cam");

      // ── The camera (the same block in every shot of this variant) ─────────────────────────────────────────
      // The world is drawn in two layers inside the camera: the flat backdrop, and the paper cut-outs with their soft
      // shadow. view(cx, cy, z) puts world point (cx, cy) in the middle of the frame at zoom z; the camera pushes in,
      // pulls back, pans or cuts, and does most of the work.
      function layers(box, back, cut) {
        var s = function (inner, cls) {
          return '<svg class="cf-layer ' + cls + '" width="' + box[2] + '" height="' + box[3] + '" viewBox="' + box.join(" ") + '" style="left:' + box[0] + "px;top:" + box[1] + 'px;overflow:visible">' + inner + "</svg>";
        };
        cam.innerHTML = s(back, "cf-back") + '<div class="cf-layer cf-cut">' + s(cut, "cf-cutsvg") + "</div>";
      }
      function view(cx, cy, z) { return { x: W / 2 - z * cx, y: H / 2 - z * cy, scale: z }; }
      function camAt(t, cx, cy, z) {
        var v = view(cx, cy, z);
        v.transformOrigin = "0 0";
        tl.set(cam, v, t);
      }
      function camTo(t, dur, cx, cy, z, ease) {
        var v = view(cx, cy, z);
        v.duration = dur; v.ease = ease || "sine.inOut";
        tl.to(cam, v, t);
      }
      // A world point's place on screen at a given view.
      function onScreen(p, cx, cy, z) { return [W / 2 + z * (p[0] - cx), H / 2 + z * (p[1] - cy)]; }
      // The iris (the period transition): a black card with a round hole at (cx, cy) in screen pixels, over the
      // picture and under the film. irisOpen runs it from shut to open, irisClose from open to shut.
      var irises = 0;
      function iris(cx, cy) {
        var R = Math.ceil(Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy))) + 30, big = ' x="-20" y="-20" width="' + (W + 40) + '" height="' + (H + 40) + '"', k = ++irises;
        q("iris").insertAdjacentHTML("beforeend", '<svg width="' + W + '" height="' + H + '" style="position:absolute;left:0;top:0;overflow:visible"><defs><mask id="' + ID + "-im" + k + '" maskUnits="userSpaceOnUse"' + big + ">" +
          "<rect" + big + ' fill="#fff"/><circle id="' + ID + "-ic" + k + '" cx="' + cx.toFixed(0) + '" cy="' + cy.toFixed(0) + '" r="' + R + '" fill="#000"/></mask></defs>' +
          "<rect" + big + ' fill="#0B0806" mask="url(#' + ID + "-im" + k + ')"/></svg>');
        return { el: q("ic" + k), R: R };
      }
      function irisOpen(cx, cy, t, dur) { var i = iris(cx, cy); tl.fromTo(i.el, { attr: { r: 0 } }, { attr: { r: i.R }, duration: dur, ease: "power2.in" }, t); }
      function irisClose(cx, cy, t, dur) { var i = iris(cx, cy); tl.fromTo(i.el, { attr: { r: i.R } }, { attr: { r: 0 }, duration: dur, ease: "power2.out", immediateRender: false }, t); }

      // ── The film (the same block in every shot of this variant) ─────────────────────────────────────────
      // The picture weaves a little in the gate; over it, outside the camera, a faded warm wash, grain that boils,
      // a few dust specks and a rare scratch, a soft flicker and the vignette. Everything comes from the part's
      // frame number through KIT.rng, so every seek draws the same frame.
      function film() {
        var fx = q("fx"), gate = q("gate"), m = 96, r0 = KIT.rng(4242), dots = "";
        // one 96 px tile of random specks (no visible lattice), shifted to a new place every frame
        for (var k = 0; k < 110; k++) {
          dots += '<circle cx="' + (r0() * m).toFixed(1) + '" cy="' + (r0() * m).toFixed(1) + '" r="' + (0.5 + r0() * 1.1).toFixed(2) + '" fill="' + (r0() < 0.62 ? "#000" : "#FFF") + '" opacity="' + (0.07 + r0() * 0.13).toFixed(2) + '"/>';
        }
        fx.innerHTML = '<div class="cf-wash"></div>' +
          '<svg class="cf-grain" width="' + (W + m) + '" height="' + (H + m) + '"><defs><pattern id="' + ID + '-fg" width="' + m + '" height="' + m + '" patternUnits="userSpaceOnUse">' + dots + "</pattern></defs>" +
          '<rect width="' + (W + m) + '" height="' + (H + m) + '" fill="url(#' + ID + '-fg)"/></svg>' +
          '<svg class="cf-dust" width="' + W + '" height="' + H + '"><circle class="cf-sp" r="0"/><circle class="cf-sp" r="0"/><circle class="cf-sp" r="0"/>' +
          '<path class="cf-hair" d="M0,0" fill="none" stroke="#1A120A" stroke-width="1.6"/><line class="cf-scratch" y1="0" y2="' + H + '" stroke="#FFF6E2" stroke-width="2"/></svg>' +
          '<div class="cf-flick"></div><div class="cf-vig"></div>';
        var grain = fx.querySelector(".cf-grain"), flick = fx.querySelector(".cf-flick"), sp = fx.querySelectorAll(".cf-sp");
        var hair = fx.querySelector(".cf-hair"), scratch = fx.querySelector(".cf-scratch");
        KIT.onTime(tl, D, function (t) {
          var T = sc.start + t, f = Math.floor(T * 24), r = KIT.rng(f * 7919 + 101);
          gate.style.transform = "translate(" + (Math.sin(T * 1.3) * 1.1 + Math.sin(T * 5.3) * 0.4).toFixed(2) + "px," + (Math.sin(T * 0.9 + 1) * 1.5 + (r() - 0.5) * 0.8).toFixed(2) + "px)";
          grain.style.transform = "translate(" + -Math.floor(r() * m) + "px," + -Math.floor(r() * m) + "px)";
          flick.style.opacity = (r() * 0.05).toFixed(3);
          for (var i = 0; i < sp.length; i++) {
            var on = r() < 0.16, rad = 1 + r() * 2.4, x = r() * W, y = r() * H, light = r() < 0.3;
            sp[i].setAttribute("r", on ? rad.toFixed(1) : 0);
            sp[i].setAttribute("cx", x.toFixed(0)); sp[i].setAttribute("cy", y.toFixed(0));
            sp[i].setAttribute("fill", light ? "#FFF6E2" : "#1A120A");
          }
          var hx = r() * W, hy = r() * H, hon = r() < 0.03;
          hair.setAttribute("d", hon ? "M" + hx.toFixed(0) + "," + hy.toFixed(0) + " q14,-10 22,6 t20,-4" : "M0,0");
          var sx = r() * W, son = r() < 0.04;
          scratch.setAttribute("x1", sx.toFixed(0)); scratch.setAttribute("x2", (sx + 6).toFixed(0));
          scratch.setAttribute("opacity", son ? 0.3 : 0);
        });
      }

      // ── Layout ───────────────────────────────────────────────────────────────────────────────────────────────
      // The one shot with the host on camera: Wishonia on a plain wall, a hungry human with his pockets turned out (no
      // papers, so never in the loop), and a sandwich. Three things. The tall frame is too narrow to stand them side by
      // side, so in 9:16 she hosts from the back of the stage, top left, and he stands in the foreground, bottom right:
      // the sandwich crosses the frame on the diagonal.
      var L = V
        ? { FL: 800, wish: { x: 40, y: 120, w: 510 }, hx: 880, hy: 1400, k: 2.9, tip: [0.985, 0.2] }
        : { FL: 900, wish: { x: 130, y: 100, w: 620 }, hx: 1430, hy: 905, k: 2.75, tip: [0.985, 0.2] };
      var k = L.k, ink = C.line, u = k / 2.75;
      var box = [-300, -300, W + 600, H + 600];
      function f1(n) { return n.toFixed(1); }
      function g(id, inner, hidden) { return '<g id="' + ID + "-" + id + '"' + (hidden ? ' opacity="0"' : "") + ">" + inner + "</g>"; }
      function wp(p) { return [L.hx + p[0] * k, L.hy - 100 * k + p[1] * k]; }
      var back = '<rect x="' + box[0] + '" y="' + box[1] + '" width="' + box[2] + '" height="' + (L.FL - box[1]) + '" fill="' + C.cream + '"/>' +
        '<rect x="' + box[0] + '" y="' + L.FL + '" width="' + box[2] + '" height="' + (box[1] + box[3] - L.FL) + '" fill="' + C.tan + '"/>' +
        '<path d="M' + box[0] + "," + L.FL + " H" + (box[0] + box[2]) + '" stroke="' + ink + '" stroke-width="4"/>';
      
      // The hungry human: thin, facing her, pockets turned out. Poses (held drawings): hungry, reaching, holding it
      // (looking it over for a price tag), biting, chewing.
      var BASE = { tone: 2, outfit: "shirt", color: 2, seed: 11, look: "left", build: { tw: 0.8, legs: 1.15, neck: 1.3, nose: 1.5 } };
      function pose(mood, arms) { var o = {}, key; for (key in BASE) o[key] = BASE[key]; o.mood = mood; o.arms = arms; return o; }
      function reach(o, i, target) {
        var r = KIT.rig(o), sh = r.shoulder[i], len = r.armLength, dx = target[0] - sh[0], dy = target[1] - sh[1];
        var d = Math.min(Math.hypot(dx, dy), 2 * len * 0.995), phi = Math.atan2(dx, dy), al = Math.acos(d / (2 * len));
        var a1 = phi + (dx > 0 ? -al : al), ex = sh[0] + len * Math.sin(a1), ey = sh[1] + len * Math.cos(a1), deg = 180 / Math.PI;
        return [a1 * deg, Math.atan2(target[0] - ex, target[1] - ey) * deg];
      }
      var r0 = KIT.rig(pose("sad", [[-8, -3], [8, 3]]));
      // where he holds it (in front of his chest) and where he bites it (at his mouth), in person units
      var hold = [r0.shoulder[0][0] - 34, r0.shoulder[0][1] + 40], bite = [r0.mouth[0] - 18, r0.mouth[1] + 12];
      function both(mood, p) { var o = pose(mood, [[0, 0], [0, 0]]); o.arms = [reach(o, 0, [p[0] + 6, p[1]]), reach(o, 1, [p[0] - 2, p[1] + 4])]; return o; }
      var P = {
        hungry: pose("sad", [[-8, -3], [8, 3]]),
        reach: both("eager", [r0.shoulder[0][0] - 44, r0.shoulder[0][1] + 6]),
        hold: both("worried", hold),
        bite: both("eager", bite),
        chew: both("smile", hold),
      };
      function pockets(o) {
        var r = KIT.rig(o), y = r.hipY + 2;
        return [-1, 1].map(function (s) {
          return '<path d="M' + f1(s * 13) + "," + f1(y) + " l" + s * 8 + ",1 l" + -s * 2 + ",11 l" + -s * 7 + ',-2 Z" fill="#FBF6E6" stroke="' + ink + '" stroke-width="2" stroke-linejoin="miter"/>';
        }).join("");
      }
      var human = Object.keys(P).map(function (n, i) {
        return g("h-" + n, '<g transform="translate(' + L.hx + "," + f1(L.hy - 100 * k) + ") scale(" + k + ')">' + KIT.person(P[n]) + pockets(P[n]) + "</g>", i > 0);
      }).join("");
      
      // The sandwich: a tall deli stack with a toothpick and an olive; a bitten copy has a bite out of its top corner.
      function sandwich(bitten) {
        var bread = "#E8C98A";
        // the top of the bun, whole, or with three scallops bitten out of its right side
        var top = bitten ? "M-32,-16 H31 L30,-19 Q23,-16 21,-23 Q14,-19 12,-27 Q6,-23 3,-31 Q-14,-35 -30,-26 Z" : "M-32,-16 L32,-16 L30,-26 Q0,-36 -30,-26 Z";
        return '<g stroke="' + ink + '" stroke-width="2.6" stroke-linejoin="round">' +
          '<path d="M-32,10 L32,10 L30,22 L-30,22 Z" fill="' + bread + '"/>' +
          '<path d="M-35,8 q4,-8 9,-1 q4,-8 9,-1 q4,-8 9,-1 q4,-8 9,-1 q4,-8 9,-1 q4,-8 9,-1 q4,-8 9,-1 L33,11 L-33,11 Z" fill="' + C.money + '"/>' +
          '<rect x="-31" y="-3" width="62" height="7" fill="' + C.war + '"/>' +
          '<path d="M-31,-8 H31 V-3 L24,-3 L22,4 L19,-3 H-12 L-15,5 L-18,-3 H-31 Z" fill="' + C.yellow + '"/>' +
          '<rect x="-31" y="-16" width="62" height="8" fill="' + bread + '"/>' +
          '<path d="' + top + '" fill="' + bread + '"/>' +
          '<path d="M-14,-24 l3,-2 M' + (bitten ? "-4,-28" : "2,-27") + ' l3,-2' + (bitten ? "" : " M16,-24 l3,-2") + '" stroke-width="1.6"/></g>' +
          '<path d="M-4,-30 V-52" stroke="' + C.tan + '" stroke-width="3"/><circle cx="-4" cy="-55" r="6" fill="' + C.moneyDark + '" stroke="' + ink + '" stroke-width="2"/><circle cx="-2" cy="-56" r="2" fill="' + C.war + '"/>';
      }
      // Where it starts (her fingertip, on the point-right body) and where it lands (between his hands).
      var bt = L.wish.y + 0.95 * L.wish.w - (12 * L.wish.w) / 140, bh = (L.wish.w * 768) / 1343;
      var tip = [L.wish.x + L.tip[0] * L.wish.w, bt + L.tip[1] * bh], land = wp(hold), mouthAt = wp(bite);
      var ss = 1.9 * u;
      // sw moves (x, y in world units); inside it, swGrow scales and swFlip turns it over, both about its middle.
      var sw = g("sw", '<g transform="translate(' + f1(land[0]) + "," + f1(land[1] - 6 * ss) + ')"><g id="' + ID + '-swGrow"><g id="' + ID + '-swFlip"><g transform="scale(' + ss + ')">' +
        g("swWhole", sandwich(false)) + g("swBitten", sandwich(true), true) + "</g></g></g></g>", true);
      
      layers(box, back, human + sw);
      // Wishonia, the host, between the wall and the cut-outs (with their paper shadow).
      var wish = document.createElement("div");
      wish.className = "cf-layer cf-cut";
      wish.style.cssText = "width:" + W + "px;height:" + H + "px;";
      cam.insertBefore(wish, cam.querySelector(".cf-cut"));
      KIT.mountWishonia(tl, wish, { scene: ID, x: L.wish.x, y: L.wish.y, w: L.wish.w });
      
      // ── Time ─────────────────────────────────────────────────────────────────────────────────────────────────
      var tGive = cue("give"), tDirectly = cue("directly,"), tAdvanced = cue("advanced");
      // Iris in on her face; the camera eases in a little over the whole shot.
      irisOpen(L.wish.x + L.wish.w / 2, L.wish.y + L.wish.w * 0.45, 0, 0.6);
      camAt(0, W / 2, H / 2, 1);
      camTo(0.2, D - 0.4, W / 2 + (V ? 20 : 30), H / 2 - (V ? 20 : 10), 1.04, "sine.inOut");
      function show(t, name) { ["hungry", "reach", "hold", "bite", "chew"].forEach(function (n) { tl.set(q("h-" + n), { opacity: n === name ? 1 : 0 }, t); }); }
      // "give": the sandwich appears at her fingertip and flies in one straight line, past every station there would
      // have been, into his hands on "directly," (the pop).
      var swEl = q("sw"), grow = q("swGrow"), from = [tip[0] - land[0], tip[1] - (land[1] - 6 * ss)];
      gsap.set(grow, { svgOrigin: "0 0" });
      tl.set(swEl, { opacity: 1 }, tGive - 0.04);
      tl.fromTo(swEl, { x: from[0], y: from[1] }, { x: 0, y: 0, duration: tDirectly - tGive - 0.04, ease: "none" }, tGive + 0.04);
      tl.fromTo(grow, { scale: 0.2 }, { scale: 0.75, duration: 0.12, ease: "back.out(2)" }, tGive - 0.04);
      tl.to(grow, { scale: 1, duration: tDirectly - tGive - 0.1, ease: "none" }, tGive + 0.1);
      show(tGive + 0.1, "reach");
      show(tDirectly, "hold");
      // He turns it over, looking for the price tag. There isn't one.
      var flip = q("swFlip");
      gsap.set(flip, { svgOrigin: "0 0" });
      tl.to(flip, { scaleX: -1, duration: 0.14, ease: "power1.inOut" }, tDirectly + 0.45);
      tl.to(flip, { scaleX: 1, duration: 0.14, ease: "power1.inOut" }, tDirectly + 0.85);
      // "advanced": he takes an enormous bite (the snip), and chews, delighted.
      var toMouth = [mouthAt[0] - land[0], mouthAt[1] - land[1]];
      show(tAdvanced - 0.08, "bite");
      tl.to(swEl, { x: toMouth[0], y: toMouth[1], duration: 0.1, ease: "power2.out" }, tAdvanced - 0.08);
      swap2(tAdvanced + 0.02);
      function swap2(t) { tl.set(q("swWhole"), { opacity: 0 }, t); tl.set(q("swBitten"), { opacity: 1 }, t); }
      tl.to(swEl, { x: 0, y: 0, duration: 0.18, ease: "power2.inOut" }, tAdvanced + 0.22);
      show(tAdvanced + 0.22, "chew");

      film();
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
