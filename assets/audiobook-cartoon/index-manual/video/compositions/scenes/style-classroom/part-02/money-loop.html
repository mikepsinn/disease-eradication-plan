<template id="money-loop-template">
  <!-- money-loop · Part 2, "Classroom film" style (compositions/scenes/style-classroom/STYLE.md): the money loop as five
       tableaux on one long flat landscape, joined by the camera. Iris in on the printing press: the Politician turns its
       wheel, a paper pops out each turn; "nothing": push in on the empty tray, a moth flies out; "monetary policy": he
       turns to us with a showman's flourish. "You give": the papers run right to the factory and the camera pans with them
       into the open door; "makers.": push in, the Weapons Maker's eyes ring up. "They make things": a chimney is a missile
       and takes off. Cut on "destroy": a house, the family waving; the missile comes down; "everything.": the bomb (flash,
       shake, mushroom cloud), then the family charred, still waving, blinking. "jobs": push in, a hard hat drops onto the
       father's hair; an arm with a missile tattoo hands him one paper. "People": he walks to the farm stand (pan); "food":
       paper over the counter, loaf back; "grows": the wheat shoots up; after "free).": the farmer slaps a price tag on it.
       "This is called the economy": the paper scurries home and the camera pans back onto the press, where the Politician
       turns to us and grins again. The two presses are one drawing (pressTableau). -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0806; }
    #money-loop-gate, #money-loop-shake, #money-loop-cam, #money-loop-flash, #money-loop-iris, #money-loop-fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #money-loop-flash { background: #FFFDF4; opacity: 0; }
    #money-loop-cam .cf-layer { position: absolute; left: 0; top: 0; }
    #money-loop-cam .cf-cut { filter: drop-shadow(5px 8px 3px rgba(40, 24, 8, 0.32)); }
    #money-loop-fx > * { position: absolute; pointer-events: none; }
    #money-loop-fx .cf-wash, #money-loop-fx .cf-flick, #money-loop-fx .cf-vig { inset: 0; }
    #money-loop-fx .cf-wash { background: rgba(240, 226, 192, 0.12); }
    #money-loop-fx .cf-flick { background: #FFF3D6; }
    #money-loop-fx .cf-vig { background: radial-gradient(ellipse 72% 72% at 50% 50%, rgba(0, 0, 0, 0) 58%, rgba(24, 13, 4, 0.5) 100%); }
    #money-loop-fx .cf-grain, #money-loop-fx .cf-dust { left: 0; top: 0; }
  </style>
  <div id="root" data-composition-id="money-loop" data-width="1920" data-height="1080" data-start="0" data-duration="20.06">
    <div id="money-loop-gate">
      <div id="money-loop-shake">
        <div id="money-loop-cam"></div>
      </div>
      <div id="money-loop-flash"></div>
    </div>
    <div id="money-loop-iris"></div>
    <div id="money-loop-fx"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/places.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script>
    (function () {
      var ID = "money-loop";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var after = function (w, n) { return KIT.after(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var tl = gsap.timeline({ paused: true });
      var cam = q("cam");

      // ── The camera (the same block in every shot of this variant) ─────────────────────────────────────────
      // The world is drawn in two layers inside the camera: the flat backdrop, and the paper cut-outs with their soft
      // shadow. view(cx, cy, z) puts world point (cx, cy) in the middle of the frame at zoom z; the camera pushes in,
      // pulls back, pans or cuts, and does most of the work.
      function layers(box, back, cut) {
        var s = function (inner, cls) {
          return '<svg class="cf-layer ' + cls + '" width="' + box[2] + '" height="' + box[3] + '" viewBox="' + box.join(" ") + '" style="left:' + box[0] + "px;top:" + box[1] + 'px;overflow:visible">' + inner + "</svg>";
        };
        cam.innerHTML = s(back, "cf-back") + '<div class="cf-layer cf-cut">' + s(cut, "cf-cutsvg") + "</div>";
      }
      function view(cx, cy, z) { return { x: W / 2 - z * cx, y: H / 2 - z * cy, scale: z }; }
      function camAt(t, cx, cy, z) {
        var v = view(cx, cy, z);
        v.transformOrigin = "0 0";
        tl.set(cam, v, t);
      }
      function camTo(t, dur, cx, cy, z, ease) {
        var v = view(cx, cy, z);
        v.duration = dur; v.ease = ease || "sine.inOut";
        tl.to(cam, v, t);
      }
      // A world point's place on screen at a given view.
      function onScreen(p, cx, cy, z) { return [W / 2 + z * (p[0] - cx), H / 2 + z * (p[1] - cy)]; }
      // The iris (the period transition): a black card with a round hole at (cx, cy) in screen pixels, over the
      // picture and under the film. irisOpen runs it from shut to open, irisClose from open to shut.
      var irises = 0;
      function iris(cx, cy) {
        var R = Math.ceil(Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy))) + 30, big = ' x="-20" y="-20" width="' + (W + 40) + '" height="' + (H + 40) + '"', k = ++irises;
        q("iris").insertAdjacentHTML("beforeend", '<svg width="' + W + '" height="' + H + '" style="position:absolute;left:0;top:0;overflow:visible"><defs><mask id="' + ID + "-im" + k + '" maskUnits="userSpaceOnUse"' + big + ">" +
          "<rect" + big + ' fill="#fff"/><circle id="' + ID + "-ic" + k + '" cx="' + cx.toFixed(0) + '" cy="' + cy.toFixed(0) + '" r="' + R + '" fill="#000"/></mask></defs>' +
          "<rect" + big + ' fill="#0B0806" mask="url(#' + ID + "-im" + k + ')"/></svg>');
        return { el: q("ic" + k), R: R };
      }
      function irisOpen(cx, cy, t, dur) { var i = iris(cx, cy); tl.fromTo(i.el, { attr: { r: 0 } }, { attr: { r: i.R }, duration: dur, ease: "power2.in" }, t); }
      function irisClose(cx, cy, t, dur) { var i = iris(cx, cy); tl.fromTo(i.el, { attr: { r: i.R } }, { attr: { r: 0 }, duration: dur, ease: "power2.out", immediateRender: false }, t); }

      // ── The film (the same block in every shot of this variant) ─────────────────────────────────────────
      // The picture weaves a little in the gate; over it, outside the camera, a faded warm wash, grain that boils,
      // a few dust specks and a rare scratch, a soft flicker and the vignette. Everything comes from the part's
      // frame number through KIT.rng, so every seek draws the same frame.
      function film() {
        var fx = q("fx"), gate = q("gate"), m = 96, r0 = KIT.rng(4242), dots = "";
        // one 96 px tile of random specks (no visible lattice), shifted to a new place every frame
        for (var k = 0; k < 110; k++) {
          dots += '<circle cx="' + (r0() * m).toFixed(1) + '" cy="' + (r0() * m).toFixed(1) + '" r="' + (0.5 + r0() * 1.1).toFixed(2) + '" fill="' + (r0() < 0.62 ? "#000" : "#FFF") + '" opacity="' + (0.07 + r0() * 0.13).toFixed(2) + '"/>';
        }
        fx.innerHTML = '<div class="cf-wash"></div>' +
          '<svg class="cf-grain" width="' + (W + m) + '" height="' + (H + m) + '"><defs><pattern id="' + ID + '-fg" width="' + m + '" height="' + m + '" patternUnits="userSpaceOnUse">' + dots + "</pattern></defs>" +
          '<rect width="' + (W + m) + '" height="' + (H + m) + '" fill="url(#' + ID + '-fg)"/></svg>' +
          '<svg class="cf-dust" width="' + W + '" height="' + H + '"><circle class="cf-sp" r="0"/><circle class="cf-sp" r="0"/><circle class="cf-sp" r="0"/>' +
          '<path class="cf-hair" d="M0,0" fill="none" stroke="#1A120A" stroke-width="1.6"/><line class="cf-scratch" y1="0" y2="' + H + '" stroke="#FFF6E2" stroke-width="2"/></svg>' +
          '<div class="cf-flick"></div><div class="cf-vig"></div>';
        var grain = fx.querySelector(".cf-grain"), flick = fx.querySelector(".cf-flick"), sp = fx.querySelectorAll(".cf-sp");
        var hair = fx.querySelector(".cf-hair"), scratch = fx.querySelector(".cf-scratch");
        KIT.onTime(tl, D, function (t) {
          var T = sc.start + t, f = Math.floor(T * 24), r = KIT.rng(f * 7919 + 101);
          gate.style.transform = "translate(" + (Math.sin(T * 1.3) * 1.1 + Math.sin(T * 5.3) * 0.4).toFixed(2) + "px," + (Math.sin(T * 0.9 + 1) * 1.5 + (r() - 0.5) * 0.8).toFixed(2) + "px)";
          grain.style.transform = "translate(" + -Math.floor(r() * m) + "px," + -Math.floor(r() * m) + "px)";
          flick.style.opacity = (r() * 0.05).toFixed(3);
          for (var i = 0; i < sp.length; i++) {
            var on = r() < 0.16, rad = 1 + r() * 2.4, x = r() * W, y = r() * H, light = r() < 0.3;
            sp[i].setAttribute("r", on ? rad.toFixed(1) : 0);
            sp[i].setAttribute("cx", x.toFixed(0)); sp[i].setAttribute("cy", y.toFixed(0));
            sp[i].setAttribute("fill", light ? "#FFF6E2" : "#1A120A");
          }
          var hx = r() * W, hy = r() * H, hon = r() < 0.03;
          hair.setAttribute("d", hon ? "M" + hx.toFixed(0) + "," + hy.toFixed(0) + " q14,-10 22,6 t20,-4" : "M0,0");
          var sx = r() * W, son = r() < 0.04;
          scratch.setAttribute("x1", sx.toFixed(0)); scratch.setAttribute("x2", (sx + 6).toFixed(0));
          scratch.setAttribute("opacity", son ? 0.3 : 0);
        });
      }

      // ── Layout ───────────────────────────────────────────────────────────────────────────────────────────────
      // One long flat landscape (cream sky, tan ground) with five tableaux on it, left to right: the press, the factory,
      // the town (reached by a cut), the farm stand, and the press again (the loop closes by panning back onto it).
      // Scales: k for people, kp the press, kq the papers, kf the factory, kh the house, kn the cloud, ks the stand.
      // The papers queue to the right of the press in 16:9; the tall frame has no room there, so in 9:16 they line up
      // in front of it (front: how far below the ground line they stand) and the horizon sits higher (gs).
      // push: the slow push-in on the farmer and his wheat ([dx, dy] from the stand's foot, zoom).
      var L = V
        ? { GY: 1260, Z0: 1.15, gs: 1200, zT: 1.02, k: 2.1, kp: 1.55, kq: 1.3, kf: 1.75, kh: 1.3, kn: 1.45, ks: 1.55,
            S: [540, 2600, 5200, 6450, 7950], pressDx: 110, camDx: 45, q0: -230, dq: 160, front: 150,
            fac: 0, wm: 235, house: 210, fam: [-380, -225, -95], stand: -10, arrive: -230,
            tray: [200, 2.2], wmZ: 1.7, jobs: [-57, -190, 2.0], push: [235, -185, 1.7] }
        : { GY: 860, Z0: 1.3, gs: 880, zT: 1.3, k: 1.5, kp: 1.15, kq: 1.0, kf: 1.3, kh: 1.25, kn: 1.0, ks: 1.5,
            S: [960, 3100, 5700, 7150, 8800], pressDx: -110, camDx: 60, q0: 290, dq: 120, front: 0,
            fac: 40, wm: 218, house: 230, fam: [-480, -305, -150], stand: 20, arrive: -300,
            tray: [150, 2.7], wmZ: 2.0, jobs: [-120, -175, 2.5], push: [225, -125, 2.6] };
      var GY = L.GY, k = L.k, S = L.S, ink = C.line, u = k / 1.5, Z0 = L.Z0, cy0 = GY - (L.gs - H / 2) / Z0;
      var box = [-600, -1400, S[4] + 1700, GY + 2400];
      
      function f1(n) { return n.toFixed(1); }
      function g(id, inner, hidden) { return '<g id="' + ID + "-" + id + '"' + (hidden ? ' opacity="0"' : "") + ">" + inner + "</g>"; }
      // A person standing on the ground at x, scale s; a person-unit point in the world.
      function fig(o, x, s) { return '<g transform="translate(' + f1(x) + "," + f1(GY - 100 * s) + ") scale(" + s + ')">' + KIT.person(o) + "</g>"; }
      function wp(x, s, p) { return [x + p[0] * s, GY - 100 * s + p[1] * s]; }
      // Pose swaps (held drawings, limited animation): hide some groups and show others at time t.
      function swap(t, offs, ons) {
        [].concat(offs).forEach(function (n) { tl.set(q(n), { opacity: 0 }, t); });
        [].concat(ons).forEach(function (n) { tl.set(q(n), { opacity: 1 }, t); });
      }
      // Two-link reach: the arm angles (KIT.person arms, degrees, 0 = down) that put a person's hand on a target,
      // elbow down. o: the person's options; i: which arm; target in person units.
      function reach(o, i, target) {
        var r = KIT.rig(o), sh = r.shoulder[i], len = r.armLength, dx = target[0] - sh[0], dy = target[1] - sh[1];
        var d = Math.min(Math.hypot(dx, dy), 2 * len * 0.995), phi = Math.atan2(dx, dy), al = Math.acos(d / (2 * len));
        var a1 = phi + (dx > 0 ? -al : al), ex = sh[0] + len * Math.sin(a1), ey = sh[1] + len * Math.cos(a1);
        var a2 = Math.atan2(target[0] - ex, target[1] - ey), deg = 180 / Math.PI;
        return [a1 * deg, a2 * deg];
      }
      
      // ── Walking papers ───────────────────────────────────────────────────────────────────────────────────────
      // A war-seal paper standing on the ground at x (its mover group takes the tweens, in world units). Two leg
      // drawings, swapped eight times a second while it walks (limited animation).
      var walkers = [];
      function paper(id, x, gy, s, hidden) {
        return g(id, '<g transform="translate(' + f1(x) + "," + f1(gy - 47 * s) + ')"><g class="cf-hop"><g transform="scale(' + s + ')">' +
          '<g class="cf-f0">' + KIT.money("war", 0) + '</g><g class="cf-f1" style="display:none">' + KIT.money("war", 1) + "</g></g></g></g>", hidden);
      }
      function walks(id, spans) {
        var el = q(id);
        walkers.push({ f0: el.querySelector(".cf-f0"), f1: el.querySelector(".cf-f1"), spans: spans });
      }
      
      // ── The press tableau (twice: here, and at the end of the loop) ──────────────────────────────────────────
      // The press is flipped, so its crank wheel is on the left, where the Politician turns it by the rim, and its
      // empty paper tray is on the right. Papers pop out of its bed and queue up on the right.
      var POL = { look: "right", mood: "grin" };
      function pressTableau(tag, S0) {
        var px = S0 + L.pressDx, kp = L.kp;
        var axle = [px - 136 * kp, GY - 150 * kp], grip = [axle[0] - 40 * kp, axle[1] - 9 * kp];
        var o = KIT.castOpts("politician", { look: "right", mood: "grin", arms: [[-10, -4], [60, 60]] });
        var sh = KIT.rig(o).shoulder[1], polX = grip[0] - (sh[0] + 43) * k;
        var top = GY - 100 * k;
        o.arms = [[-10, -4], reach(o, 1, [(grip[0] - polX) / k, (grip[1] - top) / k])];
        var tada = KIT.castOpts("politician", { mood: "grin", arms: [[-14, -6], [128, 152]] });
        var press = '<g transform="translate(' + f1(px) + "," + GY + ") scale(" + -kp + "," + kp + ')">' + KIT.props.printingPress({ seal: "war", tray: 0 }) + "</g>";
        return {
          px: px, polX: polX, shoulder: [polX + sh[0] * k, top + sh[1] * k], shUnits: sh,
          svg: g(tag + "-press", press) + g(tag + "-polA", fig(o, polX, k)) + g(tag + "-polB", fig(tada, polX, k), true),
          queue: function (i) { return px + L.q0 + i * L.dq; },
          bed: [px, GY - 97 * kp],
          tray: [px + 148 * kp, GY - 214 * kp],
        };
      }
      var T0 = pressTableau("s0", S[0]), T4 = pressTableau("s4", S[4]);
      
      // ── The factory ──────────────────────────────────────────────────────────────────────────────────────────
      var fac = S[1] + L.fac, kf = L.kf;
      var factory = '<g transform="translate(' + f1(fac) + "," + GY + ") scale(" + kf + ')">' + KIT.props.factory({ label: "" }) + "</g>";
      var wmX = fac + L.wm;
      var wmRig = KIT.rig(KIT.castOpts("weaponsMaker", {})), wmHead = wp(wmX, k, wmRig.head);
      
      // ── The town ─────────────────────────────────────────────────────────────────────────────────────────────
      var hx = S[2] + L.house, kh = L.kh;
      var house = '<g transform="translate(' + f1(hx) + "," + GY + ") scale(" + kh + ')">' + KIT.props.house({ variant: 0 }) + "</g>";
      // What is left of it: a low heap of boards and bricks under a slab of roof, the chimney stub still standing.
      function rubble() {
        var heap = [[-236, 0], [-214, -26], [-170, -40], [-120, -58], [-60, -50], [0, -72], [60, -54], [120, -62], [176, -34], [214, -18], [236, 0]];
        return '<g transform="translate(' + f1(hx) + "," + GY + ") scale(" + kh + ')" stroke="' + ink + '" stroke-width="4" stroke-linejoin="miter">' +
          '<path d="M-176,0 V-120 H-142 V-96 L-150,-84 V0 Z" fill="#5A3326"/>' +
          '<path d="M' + heap.map(function (p) { return p.join(","); }).join(" L") + ' Z" fill="#3E322A"/>' +
          '<path d="M-150,-30 L40,-96 L64,-74 L-136,-8 Z" fill="#2A3040"/>' +
          '<path d="M70,-60 L150,-110 M110,-40 L190,-70 M-60,-44 L-110,-96" stroke="#6E5236" stroke-width="10" stroke-linecap="butt"/>' +
          '<path d="M150,-28 L196,-46 L206,-24 L160,-8 Z" fill="#6A2A1E"/>' +
          "</g>";
      }
      // The family on the lawn: father (left), mother, kid. Alive and waving, then charred (the same pose).
      var FAM = [
        { tone: 1, outfit: "shirt", color: 1, seed: 3, s: 1 },
        { tone: 1, outfit: "dress", hair: 1, color: 0, seed: 3, s: 1 },
        { tone: 1, outfit: "shirt", color: 3, seed: 5, s: 0.74, build: { hs: 1.28, legs: 0.8, th: 0.82, nose: 0.85, neck: 0.5 } },
      ];
      var WAVE = [[-158, -172], [158, 172]];
      function famOpts(i, extra) {
        var o = {}, src = FAM[i], key;
        for (key in src) if (key !== "s") o[key] = src[key];
        for (key in extra || {}) o[key] = extra[key];
        return o;
      }
      var famX = L.fam.map(function (dx) { return S[2] + dx; });
      var family = FAM.map(function (f, i) {
        var s = k * f.s;
        return g("alive" + i, fig(famOpts(i, { mood: "smile", arms: WAVE }), famX[i], s)) +
          g("char" + i, fig(famOpts(i, { charred: true, arms: WAVE }), famX[i], s), true);
      }).join("");
      // The father's poses after the bomb (all charred): B takes the paper from the left; W0 and W1 walk right holding it;
      // D holds it out at the stand. His hard hat is its own piece (it lands on his hair).
      var fx = famX[0];
      var fB = famOpts(0, { charred: true, look: "left", arms: [[-96, -76], [-12, -4]] });
      var fW0 = famOpts(0, { charred: true, look: "right", arms: [[-24, -8], [64, 88]], build: { legPose: [[-16, -6], [14, 4]] } });
      var fW1 = famOpts(0, { charred: true, look: "right", arms: [[-10, -2], [64, 88]], build: { legPose: [[12, 4], [-14, -6]] } });
      var fD = famOpts(0, { charred: true, look: "right", arms: [[-12, -4], [86, 96]] });
      var handB = wp(fx, k, KIT.rig(fB).hand[0]), handW = wp(fx, k, KIT.rig(fW0).hand[1]);
      var fRig = KIT.rig(famOpts(0, {})), hatY = wp(fx, k, [0, fRig.head[1] - 44 * fRig.hs])[1];
      function hardHat(x, y, s) {
        return '<g transform="translate(' + f1(x) + "," + f1(y) + ") scale(" + s + ')" stroke="' + ink + '" stroke-linejoin="miter">' +
          '<path d="M-23,-5 L-18,-23 L0,-30 L18,-23 L23,-5 Z" fill="' + C.yellow + '" stroke-width="2.6"/>' +
          '<path d="M-32,0 L-27,-6 H27 L32,0 Z" fill="' + C.yellow + '" stroke-width="2.4"/><path d="M-3,-29 V-6" stroke-width="1.6" opacity="0.5"/></g>';
      }
      var smallPaper = function (p, s) { return '<g transform="translate(' + f1(p[0]) + "," + f1(p[1] - 14 * s) + ") scale(" + s + ')">' + KIT.money("war", 0) + "</g>"; };
      var pk = L.kq * 0.62;
      var father = g("fB", fig(fB, fx, k), true) +
        g("fW", g("fW0", fig(fW0, fx, k) + smallPaper(handW, pk)) + g("fW1", fig(fW1, fx, k) + smallPaper(handW, pk), true), true) +
        g("fD", fig(fD, fx, k), true) +
        g("hat", g("hatDrop", hardHat(fx, hatY, fRig.hs * k * 1.05)), true);
      // The arm that hands out the pay: a hairy forearm with a missile tattoo, from off the left edge of the frame.
      function bigArm(p, s) {
        var skin = "#6F4B33";
        var hairs = "";
        for (var i = 0; i < 9; i++) hairs += "M" + (-250 + i * 24) + "," + (-6 + (i % 3) * 7) + " l7,-5 ";
        return '<g transform="translate(' + f1(p[0]) + "," + f1(p[1]) + ") scale(" + s + ')" stroke="' + ink + '" stroke-linejoin="miter">' +
          '<path d="M-340,-22 L-16,-9 L-16,10 L-340,38 Z" fill="' + skin + '" stroke-width="3"/>' +
          '<path d="' + hairs + '" fill="none" stroke-width="1.6" opacity="0.6"/>' +
          '<g transform="translate(-170,8) rotate(-3)"><path d="M-24,-6 L12,-6 L24,0 L12,6 L-24,6 Z" fill="' + C.war + '" stroke-width="2"/><path d="M-24,-6 L-31,-13 L-28,-5 Z M-24,6 L-31,13 L-28,5 Z" fill="' + ink + '" stroke-width="1.5"/></g>' +
