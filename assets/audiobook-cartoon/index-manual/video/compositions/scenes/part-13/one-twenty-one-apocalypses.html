<template id="one-twenty-one-apocalypses-template">
  <!-- one-twenty-one-apocalypses · Layer B (storyboards/part-13-one-percent-treaty.md): the scene slides in on the empty
       paper. "war,": nuclear-winters' grid of 122 red snowflakes slides in with its counter on 122 (the bolted-on third
       wheel still there). "minus": the lone 122nd flake lifts off, opens two eyes and hovers beside the grid, whistling.
       "warheads": a stack of 100 grumpy missiles drops in beside a tiny Earth with one waving human on top; "threshold":
       a ruled "ENDS CIVILIZATION" line across its top; "civilization": the 100 lean at the Earth, a white flash, a small
       mushroom cloud, and the human stands there charred, hair up, blinking. "twelve": the real stack shoots up behind
       it out of the top of the frame, a ruled line whizzing past every 100, while a counter rolls to 12,241 and the
       charred human looks up, and up. "twenty-one": the grid counter flips 122 to 121, one wheel. "civilizational":
       the 121 go off row by row, faster and faster, each a flash and a little mushroom cloud; "collapses": the last row
       and a big shake. "instead": the clouds clear on 121 smoking scorch marks. "twenty-two." (second): the stray
       flake looks back and gulps. "sufficient.": a stamp slams MORE THAN SUFFICIENT across the scorched grid; the
       thump knocks the stray flake off its spot and it drifts off the edge of the frame. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }

    #one-twenty-one-apocalypses-cam, #one-twenty-one-apocalypses-bg, #one-twenty-one-apocalypses-art, #one-twenty-one-apocalypses-pip, #one-twenty-one-apocalypses-grain { position: absolute; inset: 0; }
    #one-twenty-one-apocalypses-flash { position: absolute; inset: -40px; background: #FFFFFF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="one-twenty-one-apocalypses" data-width="1920" data-height="1080" data-start="0" data-duration="22.02">
    <div id="one-twenty-one-apocalypses-cam">
      <div id="one-twenty-one-apocalypses-bg"></div>
      <div id="one-twenty-one-apocalypses-art"></div>

      <div id="one-twenty-one-apocalypses-flash"></div>
      <div id="one-twenty-one-apocalypses-pip"></div>
    </div>
    <div id="one-twenty-one-apocalypses-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/places.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script>
    (function () {
      var ID = "one-twenty-one-apocalypses";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, P = ID + "-";
      var f1 = function (n) { return String(Math.round(n * 10) / 10); };
      var at = function (x, y, inner, s) { return '<g transform="translate(' + f1(x) + "," + f1(y) + ")" + (s && s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; };
      var all = function (cls) { return document.querySelectorAll("." + P + cls); };

      // Per canvas shape. grid: nuclear-winters' 11 x 11 + 1 grid (top-left flake, spacing, flake radius); winX, labY:
      // the grid counter's middle and label line. hover: where the stray flake hovers (and its scale there); exit: the
      // point off the frame it drifts to. ground: the line the tiny Earth and the stacks stand on. stack: the left
      // missile's x, the spacing across and up, the missile size; side: 1 when the stack stands right of the Earth
      // (the missiles lean left and the human looks right), -1 when it stands left of it. wc: the 12,241 counter
      // (middle x, top y). mark: the MORE THAN SUFFICIENT stamp's middle and font size; stampS: the rubber stamp's size.
      // In 9:16 the tall stack runs up the left edge, clear of the saucer (x 740 to 1040, y 60 to 430); the grid fills
      // the middle under the saucer, its counter and the hovering stray between the stack and the saucer.
      var L = V
        ? { grid: { x: 318, y: 492, dx: 63, dy: 54, r: 21 }, winX: 548, labY: 336, hover: [520, 196], hs: 2.1, exit: [660, -150],
            ground: 1400, groundX: [70, 610], globe: { x: 432, r: 48 }, guy: 0.8, stack: { x: 92, dx: 18, dy: 23, s: 0.2 }, side: -1, nukeS: 0.4,
            wc: { x: 790, y: 1180 }, mark: { x: 633, y: 762, fs: 84 }, stampS: 4.6 }
        : { grid: { x: 160, y: 262, dx: 52, dy: 48, r: 17 }, winX: 450, labY: 104, hover: [840, 310], hs: 2.6, exit: [1010, -130],
            ground: 840, groundX: [860, 1340], globe: { x: 968, r: 42 }, guy: 0.64, stack: { x: 1110, dx: 20, dy: 23, s: 0.2 }, side: 1, nukeS: 0.32,
            wc: { x: 1462, y: 330 }, mark: { x: 420, y: 505, fs: 80 }, stampS: 4.4 };
      var SD = L.side;
      var G = L.grid, S = L.stack, WHL = { lab: 34, w: 50, h: 70, gap: 6, fs: 56, pad: 8 };
      var BLOCK = 10 * S.dy, MH = 160 * S.s; // one block of 100 warheads in the stack; one missile's height
      // The ruled line on top of block k: the nose tips of row 10k - 1 (row 0 stands on the ground).
      var lineY = function (k) { return L.ground - BLOCK * k - (MH - S.dy); };
      var colL = S.x - 22, colR = S.x + 9 * S.dx + 22, colMid = (colL + colR) / 2;

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // ── From nuclear-winters.html (nwArt): the red six-armed snowflake, the grid and the counter. ──
      function flake(r) {
        var d = "", k, a;
        for (k = 0; k < 3; k++) {
          a = (k * Math.PI) / 3;
          d += "M" + (-r * Math.cos(a)).toFixed(1) + "," + (-r * Math.sin(a)).toFixed(1) + " L" + (r * Math.cos(a)).toFixed(1) + "," + (r * Math.sin(a)).toFixed(1) + " ";
        }
        for (k = 0; k < 6; k++) {
          a = (k * Math.PI) / 3;
          var px = 0.58 * r * Math.cos(a), py = 0.58 * r * Math.sin(a);
          [-1, 1].forEach(function (s) {
            var b = a + (s * Math.PI) / 4;
            d += "M" + px.toFixed(1) + "," + py.toFixed(1) + " l" + (0.36 * r * Math.cos(b)).toFixed(1) + "," + (0.36 * r * Math.sin(b)).toFixed(1) + " ";
          });
        }
        return '<path d="' + d + '" fill="none" stroke="' + C.war + '" stroke-width="' + (r * 0.25).toFixed(1) + '" stroke-linecap="round"/>';
      }
      function wheel(x, y, digits, ids, S2) {
        S2 = S2 || WHL;
        var tx = f1(+x + S2.w / 2), ty = (+y + S2.h / 2 + S2.fs * 0.36).toFixed(1);
        return '<rect x="' + x + '" y="' + y + '" width="' + S2.w + '" height="' + S2.h + '" rx="6" fill="' + C.slate + '"/>' +
          digits.map(function (d, i) {
            return "<text" + (ids && ids[i] ? ' id="' + P + ids[i] + '"' : "") + ' x="' + tx + '" y="' + ty + '" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="' + S2.fs + '" fill="' + C.yellow + '">' + d + "</text>";
          }).join("") +
          '<path d="M' + x + "," + (y + S2.h / 2) + " h" + S2.w + '" stroke="' + C.ink + '" stroke-width="2.5"/>';
      }
      // The grid counter on 122: two wheels in the housing, the third wheel on its mismatched plate, bolted on. The
      // ones wheel holds a "2" and a "1" (the flip on "twenty-one").
      function counterArt() {
        var top = L.labY + Math.round(WHL.lab * 0.42), hh = WHL.h + 2 * WHL.pad;
        var mw = 2 * WHL.w + WHL.gap + 2 * WHL.pad, mx = L.winX - mw / 2, ax = mx + WHL.pad - WHL.gap - WHL.w;
        var bolt = function (bx, by) {
          return '<g transform="translate(' + bx + "," + by + ')"><g class="' + P + 'bolt"><circle r="6" fill="' + C.cream + '" stroke="' + C.ink + '" stroke-width="2.5"/><path d="M-3.5,0 h7" stroke="' + C.ink + '" stroke-width="2.2"/></g></g>';
        };
        var ones = [mx + WHL.pad + WHL.w + WHL.gap, top + WHL.pad];
        return {
          svg: '<g id="' + P + 'winters"><text x="' + L.winX + '" y="' + L.labY + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + WHL.lab + '" letter-spacing="1" fill="' + C.war + '">NUCLEAR WINTERS:</text>' +
            '<g id="' + P + 'main"><rect x="' + mx + '" y="' + top + '" width="' + mw + '" height="' + hh + '" rx="10" fill="' + C.navy + '" stroke="' + C.ink + '" stroke-width="4"/>' +
            wheel(mx + WHL.pad, top + WHL.pad, ["2"]) + wheel(ones[0], ones[1], ["2", "1"], ["d0a", "d0b"]) + "</g>" +
            '<g id="' + P + 'addon"><rect x="' + (ax - WHL.pad) + '" y="' + (top - 5) + '" width="' + (mx + 4 - ax + WHL.pad) + '" height="' + (hh + 10) + '" rx="4" fill="' + C.tan + '" stroke="' + C.ink + '" stroke-width="4"/>' +
            wheel(ax, top + WHL.pad, ["1"]) + bolt(mx + 1, top + 4) + bolt(mx + 1, top + hh - 4) + "</g></g>",
          onesMid: [ones[0] + WHL.w / 2, ones[1] + WHL.h / 2],
        };
      }
      // ── end of the nuclear-winters copy ──

      // The 12,241 counter: five wheels with a comma, under "WARHEADS:".
      var WC = { w: 44, h: 62, fs: 50, gap: 4, cg: 18, pad: 8, lab: 30 };
      function warheadCounter() {
        var tw = 5 * WC.w + 3 * WC.gap + WC.cg + 2 * WC.pad, x0 = L.wc.x - tw / 2, y0 = L.wc.y, xs = [], x = x0 + WC.pad;
        for (var i = 0; i < 5; i++) { xs.push(x); x += WC.w + (i === 1 ? WC.cg : WC.gap); }
        return '<g id="' + P + 'wc"><text x="' + L.wc.x + '" y="' + (y0 - 12) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + WC.lab + '" letter-spacing="1" fill="' + ink + '">WARHEADS:</text>' +
          '<rect x="' + f1(x0) + '" y="' + y0 + '" width="' + f1(tw) + '" height="' + (WC.h + 2 * WC.pad) + '" rx="10" fill="' + C.navy + '" stroke="' + C.ink + '" stroke-width="4"/>' +
          xs.map(function (wx, i) { return wheel(f1(wx), y0 + WC.pad, ["0"], ["wd" + i], WC); }).join("") +
          '<text x="' + f1(xs[1] + WC.w + WC.cg / 2) + '" y="' + (y0 + WC.pad + WC.h - 6) + '" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="' + WC.fs + '" fill="' + C.yellow + '">,</text></g>';
      }
      // A ruled line across the stack with its "ENDS CIVILIZATION" tag in the middle.
      function ruled(y, fs, id) {
        var tw = 17 * fs * 0.52 + 18, th = fs + 10;
        return '<g' + (id ? ' id="' + P + id + '"' : "") + '><path' + (id ? ' id="' + P + id + '-line"' : "") + ' d="M' + colL + "," + f1(y) + " H" + colR + '" stroke="' + C.war + '" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>' +
          '<g transform="translate(' + f1(colMid) + "," + f1(y) + ')"><g' + (id ? ' id="' + P + id + '-tag"' : "") + '><rect x="' + f1(-tw / 2) + '" y="' + f1(-th / 2) + '" width="' + f1(tw) + '" height="' + th + '" fill="#FBF6E6" stroke="' + C.war + '" stroke-width="2.5"/>' +
          '<text x="0" y="' + f1(fs * 0.36) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + fs + '" letter-spacing="0.5" fill="' + C.war + '">ENDS CIVILIZATION</text></g></g></g>';
      }
      // Burn a drawing (as KIT's charred people are burnt): every color but the ink turns a dark brown of the same lightness.
      function burn(markup) {
        var inkU = ink.toUpperCase();
        return markup.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g, function (m, a, col) {
          if (col.toUpperCase() === inkU) return m;
          var n = parseInt(col.slice(1), 16), l = (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255, v = Math.round(28 + l * 46);
          return a + '="rgb(' + (v + 8) + "," + v + "," + Math.max(0, v - 6) + ')"';
        });
      }
      // A scorch mark where a flake was: a jagged black splat with an ember.
      function splat(rnd) {
        var pts = [], n = 12;
        for (var k = 0; k < n; k++) {
          var a = (k / n) * Math.PI * 2 + rnd() * 0.3, rr = G.r * (k % 2 ? 0.55 + rnd() * 0.25 : 1.0 + rnd() * 0.4);
          pts.push(f1(rr * Math.cos(a)) + "," + f1(rr * Math.sin(a)));
        }
        return '<path d="M' + pts.join(" L") + ' Z" fill="#2A221C" stroke="' + ink + '" stroke-width="1.6" stroke-linejoin="miter"/><circle r="' + f1(G.r * 0.3) + '" fill="#5A4636"/>';
      }
      var wispD = "M0,0 l" + f1(-0.22 * G.r) + "," + f1(-0.36 * G.r) + " l" + f1(0.22 * G.r) + "," + f1(-0.36 * G.r) + " l" + f1(-0.22 * G.r) + "," + f1(-0.36 * G.r);

      // ── The grid: 121 flakes (rows 0 to 10), each with its flash, its little mushroom cloud, its scorch and its smoke. ──
      var MS = (G.dx * 1.02) / 520; // the little mushroom clouds, about one grid step wide
      var sr = KIT.rng(121), flakes = "", scorch = "", wisps = "", minis = "", bursts = "";
      for (var i = 0; i < 121; i++) {
        var row = Math.floor(i / 11), col = i % 11, x = G.x + col * G.dx, y = G.y + row * G.dy, dr = ' data-row="' + row + '" data-col="' + col + '"';
        flakes += at(x, y, '<g class="' + P + 'flake"' + dr + ">" + flake(G.r) + "</g>");
        scorch += at(x, y, '<g class="' + P + 'scorch"' + dr + ' opacity="0">' + splat(sr) + "</g>");
        wisps += at(x + (sr() - 0.5) * 6, y - G.r * 0.3, '<g class="' + P + 'wisp"' + dr + ' opacity="0"><path d="' + wispD + '" fill="none" stroke="#8C8782" stroke-width="' + f1(G.r * 0.16) + '" stroke-linecap="round" stroke-linejoin="round"/></g>');
        minis += at(x, y + G.r * 0.75, '<g class="' + P + 'mn"' + dr + ' opacity="0"><g transform="scale(' + MS.toFixed(4) + ')"><use href="#' + P + 'mini"/></g></g>');
        bursts += at(x, y, '<g class="' + P + 'burst"' + dr + ' opacity="0">' + KIT.star(0, 0, G.r * 2.3, C.yellow, 8) + KIT.star(0, 0, G.r * 1.6, "#FFFFFF", 8) + "</g>");
      }
      var counter = counterArt();
      var grid = '<g id="' + P + 'grid">' + scorch + flakes + wisps + minis + bursts + "</g>";

      // ── The stray: the lone 122nd flake (row 11), with the only face in the grid. Nested: lift (fly to the hover spot),
      // knock (the stamp's thump and the drift off), bob (hovering), body (looks and gulps). ──
      var r = G.r, lone = [G.x, G.y + 11 * G.dy];
      var eye = function (ex) {
        return '<ellipse cx="' + f1(ex) + '" cy="' + f1(-0.06 * r) + '" rx="' + f1(0.21 * r) + '" ry="' + f1(0.17 * r) + '" fill="#FBF6E6" stroke="' + ink + '" stroke-width="' + f1(0.06 * r) + '"/>' +
          '<path d="M' + f1(ex - 0.25 * r) + "," + f1(-0.04 * r) + " Q" + f1(ex) + "," + f1(-0.34 * r) + " " + f1(ex + 0.24 * r) + "," + f1(-0.08 * r) + '" fill="none" stroke="' + ink + '" stroke-width="' + f1(0.1 * r) + '" stroke-linecap="round"/>';
      };
      var face = '<g id="' + P + 'face" opacity="0"><circle r="' + f1(0.68 * r) + '" fill="#FBF6E6" stroke="' + C.war + '" stroke-width="' + f1(0.1 * r) + '"/>' +
        '<g id="' + P + 'eyes">' + eye(-0.27 * r) + eye(0.27 * r) +
        '<g id="' + P + 'pupils"><circle cx="' + f1(-0.27 * r) + '" cy="' + f1(-0.04 * r) + '" r="' + f1(0.095 * r) + '" fill="' + ink + '"/><circle cx="' + f1(0.27 * r) + '" cy="' + f1(-0.04 * r) + '" r="' + f1(0.095 * r) + '" fill="' + ink + '"/></g></g>' +
        // the mouths: whistling (an o), flat, and the gulp (a wobble)
        '<ellipse id="' + P + 'm-o" cx="0" cy="' + f1(0.36 * r) + '" rx="' + f1(0.08 * r) + '" ry="' + f1(0.1 * r) + '" fill="' + ink + '"/>' +
        '<path id="' + P + 'm-flat" d="M' + f1(-0.14 * r) + "," + f1(0.36 * r) + " H" + f1(0.14 * r) + '" stroke="' + ink + '" stroke-width="' + f1(0.07 * r) + '" stroke-linecap="round" opacity="0"/>' +
        '<path id="' + P + 'm-wavy" d="M' + f1(-0.2 * r) + "," + f1(0.38 * r) + " l" + f1(0.1 * r) + "," + f1(-0.07 * r) + " l" + f1(0.1 * r) + "," + f1(0.07 * r) + " l" + f1(0.1 * r) + "," + f1(-0.07 * r) + " l" + f1(0.1 * r) + "," + f1(0.07 * r) + '" fill="none" stroke="' + ink + '" stroke-width="' + f1(0.07 * r) + '" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>' +
        '<g transform="translate(' + f1(0.62 * r) + "," + f1(-0.5 * r) + ')"><g id="' + P + 'sweat" opacity="0"><path d="M0,' + f1(-0.2 * r) + " Q" + f1(0.13 * r) + "," + f1(0.02 * r) + " 0," + f1(0.12 * r) + " Q" + f1(-0.13 * r) + "," + f1(0.02 * r) + " 0," + f1(-0.2 * r) + ' Z" fill="' + C.cyan + '" stroke="' + ink + '" stroke-width="' + f1(0.05 * r) + '"/></g></g></g>';
      var stray = '<g id="' + P + 'stray-slide">' + at(lone[0], lone[1], '<g id="' + P + 'stray"><g id="' + P + 'stray-knock"><g id="' + P + 'stray-bob"><g id="' + P + 'stray-body">' + flake(r) + face + "</g></g></g></g>") + "</g>";
      // Two music notes for the whistle, rising from the hover spot.
      var note = function (i) {
        return at(L.hover[0] + r * L.hs * 0.9, L.hover[1] - r * L.hs * 0.55, '<g class="' + P + 'note" opacity="0"><g transform="scale(' + (i ? 1.15 : 0.95) + ')"><ellipse cx="0" cy="0" rx="7" ry="5" transform="rotate(-22)" fill="' + ink + '"/>' +
          '<path d="M6,-2 V-28 q9,4 10,13" fill="none" stroke="' + ink + '" stroke-width="2.8" stroke-linecap="round"/></g></g>');
      };

      // ── The right side: the tiny Earth and its human, the stack of 100, the real stack behind it, the 12,241 counter. ──
      var defs = '<defs><g id="' + P + 'msl">' + KIT.props.missile({ size: S.s }) + '</g><g id="' + P + 'mini">' + KIT.nuke() + "</g></defs>";
      var mr = KIT.rng(100), stack = "";
      for (var j = 0; j < 10; j++) for (var c2 = 0; c2 < 10; c2++) {
        stack += at(S.x + c2 * S.dx + (mr() - 0.5) * 2, L.ground - j * S.dy, '<g transform="rotate(' + ((mr() - 0.5) * 5).toFixed(1) + ')"><g class="' + P + 'wh"><use href="#' + P + 'msl"/></g></g>');
      }
      // The real stack: rows from below the ground (hidden by the clip) to above the frame top, one ruled line per
      // block of 100; it streams up by moving its rows up modulo one block.
      var jTop = Math.ceil((L.ground + 10) / S.dy), colRows = "", colLines = "";
      for (j = -10; j <= jTop; j++) for (c2 = 0; c2 < 10; c2++) colRows += '<use href="#' + P + 'msl" x="' + (S.x + c2 * S.dx) + '" y="' + (L.ground - j * S.dy) + '"/>';
      for (var k = 0; k <= Math.ceil(jTop / 10) + 1; k++) colLines += ruled(lineY(k), 15);
      var column = '<defs><clipPath id="' + P + 'colclip"><rect id="' + P + 'colrect" x="' + (colL - 4) + '" y="' + f1(lineY(1)) + '" width="' + (colR - colL + 8) + '" height="' + f1(L.ground + 4 - lineY(1)) + '"/></clipPath></defs>' +
        '<g id="' + P + 'column" opacity="0" clip-path="url(#' + P + 'colclip)"><g id="' + P + 'colshift">' + colRows + colLines + "</g></g>";
      // The tiny Earth (and its burnt copy), the human on top (waving, then charred and looking up), the cloud.
      var gx = L.globe.x, gr = L.globe.r, gs = L.guy;
      var guyA = { tone: 1, outfit: "shirt", color: 2, hair: 0, mood: "smile", arms: [[18, 6], [150, 172]] };
      var guyB = { tone: 1, outfit: "shirt", color: 2, hair: 0, charred: true, look: SD > 0 ? "right" : "left", arms: [[18, 6], [150, 172]] };
      var RA = KIT.rig(guyA), RB = KIT.rig(guyB);
      var guy = at(0, -2 * gr - 100 * gs, '<g id="' + P + 'guy-lean"><g id="' + P + 'guy-a">' + KIT.person(guyA) + '</g><g id="' + P + 'guy-b" opacity="0">' + KIT.person(guyB) + "</g></g>", gs);
      var earth = at(gx, L.ground, '<g id="' + P + 'earth"><g id="' + P + 'globe">' + KIT.props.earthGlobe({ r: gr }) + '</g><g id="' + P + 'globe-b" opacity="0">' + burn(KIT.props.earthGlobe({ r: gr })) + "</g>" + guy + "</g>");
      var gnuke = at(gx, L.ground - 2 * gr + 8, '<g id="' + P + 'gnuke">' + KIT.nuke() + "</g>", L.nukeS);
      var ground = '<path id="' + P + 'ground" d="M' + L.groundX[0] + "," + L.ground + " H" + L.groundX[1] + '" stroke="' + ink + '" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>';
