       bread-mold's cave and its heap of moldy bread, onto the standard office. "two": she counts. "internet": the screen
       clicks off and on to a buzzing knot of cables, "1. THE INTERNET" (the zap). "instrument": a fancy bond certificate
       slides on, "2. A NEW FINANCIAL INSTRUMENT", and glints. "powerful": she sips her coffee. "universe:": the screen
       pulls back to a power plant, "POWER SOURCE: HUMAN GREED", where the fat cat (dollar-sign eyes) runs in a giant
       hamster wheel after a paper on a stick (the hum and the whirr). after "universe:": a fat cable drops out of the
       bottom of the screen to the desk, its plug dangling over a socket. "greed.": her fist; the plug slams in, the sun,

  </style>

  <script>
    (function () {
      var ID = "human-greed";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, O = KIT.OFFICE, INK = C.line;
      var n1 = function (v) { return (Math.round(v * 10) / 10).toString(); };
      var P = function (s) { return ID + "-" + s; };
      function pd(pts) { return "M" + pts.map(function (p) { return n1(p[0]) + "," + n1(p[1]); }).join(" L") + " Z"; }
      function solid(pts, fill, w) {
        var d = typeof pts === "string" ? pts : pd(pts);
        return '<path d="' + d + '" fill="' + INK + '" stroke="' + INK + '" stroke-width="' + (w || 4) + '" stroke-linejoin="miter" stroke-miterlimit="8"/><path d="' + d + '" fill="' + fill + '"/>';
      }
      function txt(x, y, s, size, col, extra) {
        return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + size + '" fill="' + col + '"' + (extra || "") + ">" + s + "</text>";
      }

      // ── bmArt: the cave, copied to human-greed.html (keep the copies the same) ──
      // Draws the scene's art inside one SVG, with ids prefixed pid. fin true draws the last frame (the skeletons, the
      // calendar on 200,000), which human-greed shows on its wall screen; fin false draws the first poses. Everything
      // that moves is drawn where it ends (the mold on the pile, the heap at full height, the last slice on the heap),
      // and the scene's timeline starts it elsewhere. Returns { svg, L, geo }.
      function bmArt(pid, fin) {
        var C = KIT.C, V = KIT.V, INK = C.line, WHITE = "#FBF6E6", CRUMB = "#F6E7C8", MOLD_INK = "#1F6E68";
        var P = function (s) { return pid + "-" + s; };
        var n1 = function (v) { return (Math.round(v * 10) / 10).toString(); };
        function pd(pts) { return "M" + pts.map(function (p) { return n1(p[0]) + "," + n1(p[1]); }).join(" L") + " Z"; }
        function solid(pts, fill, w) {
          var d = pd(pts);
          return '<path d="' + d + '" fill="' + INK + '" stroke="' + INK + '" stroke-width="' + (w || 3) + '" stroke-linejoin="miter" stroke-miterlimit="8"/><path d="' + d + '" fill="' + fill + '"/>';
        }
        function copy(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
        function vis(on) { return on ? "" : ' opacity="0"'; }

        // fire-on-fire's cave table (outer and inner arch, ground line, drips), and where this scene puts things:
        // the calendar on its rock (in 9:16 it stands on the cave's roof), the fire, B and A (x, scale), the mold pile,
        // the sick line ([x, scale], on sickGy), the heap of moldy crusts behind ([x0, x1, base, height]), where the last
        // slice lands, the push-in [cx, cy, k], and in 9:16 the rock shelf at the back that the sick line stands on.
        var L = V
          ? { outer: "M44,1876 V900 Q60,520 380,480 H720 Q1020,520 1036,900 V1876 Z", inner: "M90,1876 V1000 Q120,700 400,670 H700 Q960,700 990,1000 V1876 Z",
              ground: [90, 990, 1400], drips: [[255, 712], [470, 670], [640, 670]], gy: 1400,
              rock: null, cal: [470, 482, 2.3], fire: [215, 0.85], B: [405, 2.3], A: [800, 2.3], pile: 600,
              sick: [[562, 1.65], [702, 1.65], [842, 1.65]], sickGy: 1010, shelf: [92, 988, 1010, 1052],
              heap: [100, 980, 1010, 290], land: [870, 808, -24], push: [540, 1150, 1.9] }
          : { outer: "M44,1036 V420 Q200,130 520,100 H1400 Q1720,130 1876,420 V1036 Z", inner: "M240,1036 V520 Q360,250 640,230 H1280 Q1560,250 1680,520 V1036 Z",
              ground: [240, 1680, 820], drips: [[560, 250], [780, 230], [1010, 230], [1420, 262]], gy: 820,
              rock: [250, 452, 758], cal: [351, 760, 2.0], fire: [566, 1.0], B: [768, 2.4], A: [1112, 2.4], pile: 940,
              sick: [[1300, 2.05], [1410, 2.05], [1520, 2.05]], sickGy: 820, shelf: null,
              heap: [262, 1662, 820, 470], land: [1238, 404, -18], push: [960, 650, 1.9] };
        var gy = L.gy;

        var drips = L.drips.map(function (d, i) {
          var w = 26 + (i % 2) * 14, h = 50 + (i % 3) * 22;
          return '<path d="M' + (d[0] - w / 2) + "," + (d[1] - 4) + " L" + d[0] + "," + (d[1] + h) + " L" + (d[0] + w / 2) + "," + (d[1] - 4) + ' Z" fill="url(#' + P("hatch") + ')" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/>';
        }).join("");
        var cave = '<path d="' + L.outer + " " + L.inner + '" fill="#E4D9B8" fill-rule="evenodd" stroke="' + INK + '" stroke-width="5"/>' +
          '<path d="' + L.outer + " " + L.inner + '" fill="url(#' + P("cross") + ')" fill-rule="evenodd" opacity="0.55"/>' + drips +
          '<path d="M' + L.ground[0] + "," + L.ground[2] + " H" + L.ground[1] + '" stroke="' + INK + '" stroke-width="5"/>';

        // fire-on-fire's campfire (stage units, ground at y 0), each flame in its own group.
        var FIRE = 0.8, FLAME = "M0,0 C-34,-10 -30,-60 -8,-96 C-6,-70 10,-62 14,-84 C34,-56 40,-14 0,0 Z";
        function flame(id, k, fill, pattern) {
          return '<g id="' + P(id) + '"><path transform="translate(0,-14) scale(' + k + ')" d="' + FLAME + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (4 / k).toFixed(2) + '" stroke-linejoin="round"/>' +
            (pattern ? '<path transform="translate(0,-14) scale(' + k + ')" d="' + FLAME + '" fill="url(#' + P(pattern) + ')" opacity="0.6"/>' : "") + "</g>";
        }
        var logs = '<g stroke="' + INK + '" stroke-width="5"><rect x="-120" y="-36" width="240" height="32" rx="16" fill="' + C.tan + '" transform="rotate(12 0 -20)"/>' +
          '<rect x="-120" y="-36" width="240" height="32" rx="16" fill="' + C.rust + '" transform="rotate(-12 0 -20)"/></g>' +
          [-130, -90, 90, 130].map(function (x) { return '<ellipse cx="' + x + '" cy="-12" rx="26" ry="14" fill="#D8CDB0" stroke="' + INK + '" stroke-width="4"/>'; }).join("");
        var fire = '<g transform="translate(' + L.fire[0] + "," + gy + ") scale(" + L.fire[1] + ')"><g transform="scale(' + FIRE + ')"><circle cx="0" cy="-110" r="230" fill="' + C.orange + '" opacity="0.2"/>' + logs +
          '<g id="' + P("flames") + '">' + flame("f-out", 2.6, C.war, "hred") + flame("f-mid", 1.8, C.orange) + flame("f-in", 1.05, C.yellow) + "</g></g></g>";

        // ── The bread (person units) ──
        // A slice: a tan crust, a cream crumb, and the mold, medicine teal (never money green). The bitten one has a notch.
        var CRUST = [[-11, 12], [-11, -3], [-14, -8], [-12, -13], [-6, -16], [0, -15], [6, -16], [12, -13], [14, -8], [11, -3], [11, 12]];
        var BITTEN = [[-11, 12], [-11, -1], [-7, -2], [-4, -6], [-5, -10], [-1, -13], [1, -15], [6, -16], [12, -13], [14, -8], [11, -3], [11, 12]];
        var MOLD = [[1, -11], [6, -13.5], [10, -10], [9, -4], [4, -2], [0, -5]];
        var MOLD_AT = [5, -8];
        function shrink(pts, k, cy) { return pts.map(function (p) { return [p[0] * k, cy + (p[1] - cy) * k]; }); }
        function moldSvg(dx, dy) {
          var m = MOLD.map(function (p) { return [p[0] + dx, p[1] + dy]; });
          return solid(m, C.med, 2.2) + '<path d="' + pd(m) + '" fill="url(#' + P("hteal") + ')" opacity="0.7"/>' +
            '<circle cx="' + n1(dx + 3) + '" cy="' + n1(dy - 9) + '" r="1.3" fill="#BFE3DC"/><circle cx="' + n1(dx + 7) + '" cy="' + n1(dy - 6) + '" r="1" fill="#BFE3DC"/>';
        }
        function slice(kind) {
          var crust = kind === "bitten" ? BITTEN : CRUST;
          return solid(crust, C.tan) + solid(shrink(crust, 0.74, 0), CRUMB, 1.6) +
            '<path d="M-5,4 l2,-1 M3,7 l2,-1 M-2,-5 l2,1" stroke="' + C.tan + '" stroke-width="1.4"/>' + (kind === "mold" ? moldSvg(0, 0) : "");
        }
        // a lone bit of flicked-off mold, centered
        function bit() { return moldSvg(-MOLD_AT[0], -MOLD_AT[1]); }

        // ── The cavemen, from fire-on-fire.html (the same options and hide spots) ──
        var CAVEMEN = {
          A: { tone: 2, outfit: "shirt", color: 2, hair: 0, look: "left", plain: true, spots: [[-9, -8], [8, 2], [-6, 17], [9, 22], [-1, 28]] },
          B: { tone: 0, outfit: "dress", color: 3, hair: 1, hairColor: "#5A3A22", look: "left", plain: true, spots: [[-6, -10], [7, 0], [-14, 26], [12, 32], [-2, 42], [22, 46], [-24, 46]] },
        };
        var SKIN = ["#F4E3CC", "#D9B48F", "#A87B57", "#6F4B33"], BONE = "#F1EAD6";
        // Two segments of length len from shoulder S reaching T; bend picks the side the elbow goes.
        function ik(S, T, len, bend) {
          var vx = T[0] - S[0], vy = T[1] - S[1], d = Math.min(Math.hypot(vx, vy), 2 * len * 0.985);
          var ang = (Math.atan2(vx, vy) * 180) / Math.PI, al = (Math.acos(d / (2 * len)) * 180) / Math.PI;
          return [ang + bend * al, ang - bend * al];
        }
        // Poses (each caveman faces left in its own units; B's group is mirrored): where the near hand is (the slice
        // rides on it), what the far hand does, the slice, the mood.
        var DOWN = [15, 5];
        var POSES = {
          look: { near: [-38, -30], far: "down", slice: "mold", mood: "flat" },
          flick: { near: [-38, -30], far: "flick", slice: "clean", mood: "cross" },
          bite: { near: "mouth", far: "down", slice: "bitten", mood: "eager" },
          chew: { near: [-27, -14], far: "down", slice: "bitten", mood: "smile" },
          toss: { near: [14, -88], far: "down", slice: null, mood: "eager" },
        };
        var ORDER = ["look", "flick", "bite", "chew", "toss"];
        var geo = { slice: {}, hand: {} };
        function poseOpts(who, name, bones) {
          var base = CAVEMEN[who], sp = POSES[name], o = {}, k;
          for (k in base) if (k !== "spots") o[k] = base[k];
          var r = KIT.rig(o), mouth = r.mouth;
          var near = sp.near === "mouth" ? [mouth[0] + 2, mouth[1] + 12] : sp.near;
          var a0 = ik(r.shoulder[0], near, r.armLength, 1);
          var sl = sp.near === "mouth" ? [mouth[0] - 5, mouth[1] - 3] : [near[0] - 2, near[1] - 13];
          var a1 = sp.far === "flick" ? ik(r.shoulder[1], [sl[0] + 10, sl[1] - 2], r.armLength, 1) : DOWN;
          o.arms = [a0, a1]; o.mood = sp.mood;
          if (bones) o.skeleton = true;
          return { o: o, sl: sl };
        }
        function poseSvg(who, name, bones) {
          var sp = POSES[name], po = poseOpts(who, name, bones), m = KIT.person(po.o), r = KIT.rig(po.o);
          if (!bones) {
            var spots = CAVEMEN[who].spots.map(function (s) { return '<ellipse cx="' + s[0] + '" cy="' + s[1] + '" rx="3.6" ry="2.6" fill="' + C.rust + '" opacity="0.85"/>'; }).join("");
            m = m.replace('<g class="arm-l">', spots + '<g class="arm-l">');
          }
          geo.slice[who + name] = po.sl; geo.hand[who + name] = r.hand[0];
          var extra = sp.slice ? '<g transform="translate(' + n1(po.sl[0]) + "," + n1(po.sl[1]) + ')">' + slice(sp.slice) + "</g>" : "";
          if (sp.far === "flick") {
            // the flicking finger, pointing from the far hand at where the mold was
            var h = r.hand[1], tx = po.sl[0] + MOLD_AT[0], ty = po.sl[1] + MOLD_AT[1], dx = tx - h[0], dy = ty - h[1], dl = Math.hypot(dx, dy) || 1, ux = dx / dl, uy = dy / dl;
            var tip = [h[0] + ux * 8, h[1] + uy * 8];
            extra += solid([[h[0] - uy * 1.8, h[1] + ux * 1.8], [tip[0] - uy * 1.1, tip[1] + ux * 1.1], [tip[0] + uy * 1.1, tip[1] - ux * 1.1], [h[0] + uy * 1.8, h[1] - ux * 1.8]], bones ? BONE : SKIN[CAVEMEN[who].tone], 1.8);
          }
          return m + extra;
        }
        // Where each caveman stands: his x, feet on the ground, and his mirror (A faces left, B is mirrored to face right).
        function placeOf(who) {
          var p = L[who], s = p[1];
          return "translate(" + p[0] + "," + n1(gy - 100 * s) + ") scale(" + (who === "A" ? s : -s) + "," + s + ")";
        }
        // A point in a caveman's units, in the frame.
        geo.at = function (who, pt) { var p = L[who], s = p[1]; return [p[0] + (who === "A" ? s : -s) * pt[0], gy - 100 * s + s * pt[1]]; };
        var FIN = { A: "look", B: "chew" };
        function caveman(who) {
          var sets = [["alive", false], ["bones", true]].map(function (st) {
            var on = fin ? st[1] : !st[1];
            var poses = ORDER.filter(function (n) { return n !== "toss" || who === "A"; }).map(function (name) {
              var shown = fin ? name === FIN[who] : name === "look";
              return '<g id="' + P(who + "-" + st[0] + "-" + name) + '"' + vis(shown) + ">" + poseSvg(who, name, st[1]) + "</g>";
            }).join("");
            return '<g id="' + P(who + "-" + st[0]) + '"' + vis(on) + ">" + poses + "</g>";
          }).join("");
          return '<g transform="' + placeOf(who) + '"><g id="' + P(who) + '">' + sets + "</g></g>";
        }

        // ── The sick line: everyday cavemen with red chest lights, coughing into a fist; each has its skeleton. ──
        var SICK = [
          { tone: 1, outfit: "shirt", color: 1, hair: 2, hat: null, look: "left", light: "red", mood: "worried", spots: [[-8, -6], [7, 6], [-4, 18]] },
          { tone: 3, outfit: "dress", color: 0, hair: 1, look: "left", light: "red", mood: "sad", spots: [[-6, -8], [8, 4], [-12, 26], [10, 34]] },
          { tone: 0, outfit: "shirt", color: 3, hair: 0, hat: null, hairColor: "#5A3A22", look: "left", light: "red", mood: "worried", spots: [[-9, -4], [6, 8], [-2, 22]] },
        ];
        geo.sick = [];
        function sickman(i) {
          var base = copy(SICK[i]); delete base.spots;
          var r = KIT.rig(base), m = r.mouth;
          base.arms = [ik(r.shoulder[0], [m[0] + 3, m[1] + 6], r.armLength, 1), [12, 4]];
          var alive = KIT.person(base).replace('<g class="arm-l">', SICK[i].spots.map(function (s) { return '<ellipse cx="' + s[0] + '" cy="' + s[1] + '" rx="3.4" ry="2.4" fill="' + C.rust + '" opacity="0.85"/>'; }).join("") + '<g class="arm-l">');
          var bones = KIT.person(copy(base, { skeleton: true }));
          var p = L.sick[i], s = p[1];
          geo.sick.push({ mouth: [p[0] + s * m[0], L.sickGy - 100 * s + s * m[1]], feet: [p[0], L.sickGy] });
          return '<g transform="translate(' + p[0] + "," + n1(L.sickGy - 100 * s) + ") scale(" + s + ')"><g id="' + P("s" + i) + '">' +
            '<g id="' + P("s" + i + "-alive") + '"' + vis(!fin) + ">" + alive + '</g><g id="' + P("s" + i + "-bones") + '"' + vis(fin) + ">" + bones + "</g></g></g>";
        }
        var shelf = L.shelf ? '<path d="' + pd([[L.shelf[0], L.shelf[2]], [L.shelf[1], L.shelf[2]], [L.shelf[1], L.shelf[3]], [L.shelf[0] + 30, L.shelf[3]]]) + '" fill="#D6C9A4" stroke="' + INK + '" stroke-width="5" stroke-linejoin="miter"/>' +
          '<path d="' + pd([[L.shelf[0], L.shelf[2]], [L.shelf[1], L.shelf[2]], [L.shelf[1], L.shelf[3]], [L.shelf[0] + 30, L.shelf[3]]]) + '" fill="url(#' + P("cross") + ')" opacity="0.4"/>' : "";

        // ── The heap of moldy crusts behind them, at full height (the scene grows it from its base). ──
        var hp = L.heap, hx0 = hp[0], hx1 = hp[1], hb = hp[2], hh = hp[3], hcx = (hx0 + hx1) / 2, hw = (hx1 - hx0) / 2, rnd = KIT.rng(847);
        var top = function (x) { var u = (x - hcx) / hw; return hb - hh * Math.sqrt(Math.max(0, 1 - u * u)) * (0.92 + 0.08 * Math.cos(u * 9)); };
        var outline = [];
        for (var k = 0; k <= 32; k++) { var x = hx0 + (2 * hw * k) / 32; outline.push([x, top(x)]); }
        var heapIn = solid([[hx0, hb]].concat(outline, [[hx1, hb]]), "#C9A06E", 4) + '<path d="' + pd([[hx0, hb]].concat(outline, [[hx1, hb]])) + '" fill="url(#' + P("hatch") + ')" opacity="0.25"/>';
        var crumbs = [];
        for (k = 0; k < 76; k++) {
          var xx = hx0 + 40 + rnd() * (2 * hw - 80), tY = top(xx), yy = tY + 20 + rnd() * Math.max(10, hb - tY - 34);
          crumbs.push([xx, yy, (rnd() - 0.5) * 120, (V ? 1.6 : 1.9) + rnd() * 0.5, rnd() < 0.55]);
        }
        crumbs.sort(function (a, b) { return a[1] - b[1]; });
        heapIn += crumbs.map(function (c) {
          return '<g transform="translate(' + n1(c[0]) + "," + n1(c[1]) + ") rotate(" + n1(c[2]) + ") scale(" + n1(c[3]) + ')">' + slice(c[4] ? "mold" : "bitten") + "</g>";
        }).join("");
        var heap = '<g id="' + P("heap") + '">' + heapIn + "</g>";
        geo.heapBase = [hcx, hb];

        // ── The rock, and the desk calendar on it: "YEAR", the pages tearing off toward 200,000 ──
        var YEARS = ["1", "10", "100", "1,000", "5,000", "10,000", "20,000", "40,000", "70,000", "100,000", "140,000", "180,000", "200,000"];
        var cal = KIT.props.calendar({ month: "YEAR", day: 1, pages: YEARS.length - 1, color: C.war });
        cal = cal.replace(/(<g class="(?:cal-page|cal-page-under)" data-day=")(\d+)("[\s\S]*?font-size=")(\d+)("[^>]*>)\d+(<\/text>)/g, function (m, a, day, b, fs, c, d) {
          var t = YEARS[+day - 1], size = t.length <= 2 ? 44 : t.length <= 3 ? 34 : t.length <= 5 ? 23 : t.length <= 6 ? 19.5 : 16.5;
          return a + t + b + size + c + t + d;
        });
        // the tear-off pages: the last frame has torn them all off, leaving 200,000
        var pageN = 0;
        cal = cal.replace(/<g class="cal-page" /g, function () { return '<g id="' + P("cal-p" + pageN++) + '"' + vis(!fin) + ' class="cal-page" '; });
        geo.calPages = pageN;
