<template id="enemies-will-invade-template">

       mustard sash, left; L3, tan sash, right) face each other over a cream picket fence, each behind a ramp-shaped heap
       of fifteen grumpy price-tagged missiles laid on their sides and aimed across it. "craziness": each pats his top
       missile like a pet. "second": a sign "OBJECTION 2" springs up on the fence post. "cut": both clutch their heaps.
       "enemies": both rise on tiptoe, peek over and narrow their eyes. "invade": a thought bubble puffs up over each: in
       it, the other one stands on the fence with an armful of missiles and hops down; "us!": in both bubbles a white
       flash and a little mushroom cloud, and when it clears the thinker (and the invader) stand there charred, hair up,
       smoking, blinking, while the real two hug their heaps and shake. "Everyone": the bubbles pop and both reach for
       the top missile; "one percent": the missiles wiggle loose; "same time.": both lift it at once (the clank) and
       smile awkwardly at each other. "security": a SECURITY gauge with a hundred fine marks springs up on each side as
       the sign drops away; "increases": each needle ticks up one mark, and after it both hoist their missile like a
       trophy and cheer as if they had won the war. "fewer": they toss the missiles onto the fence top (the thunk), each

      // ── Missiles ──
      // A missile lying on its side (dir 1: nose to the right), drawn around its center.
      var lying = function (o, dir) { return at(0, 0, at(0, 80 * (o.size || 1), KIT.props.missile(o)), 1, dir * 90); };
      var standing = function (o) { return at(0, 80 * (o.size || 1), KIT.props.missile(o)); };
      // The heap: rows of 5, 4, 3, 2, 1, every row starting at the leader's end (a ramp that slopes down toward the fence),
      // drawn back to front so each nose sits on the next one's tail. The top missile (row 4) is left out: it is the

            '<path d="M' + f1(x + 3.5 * k) + ',' + f1(gy - 4 * k) + ' V' + f1(gy - h + 13 * k) + '" stroke="' + ink + '" stroke-width="' + f1(1.2 * k) + '" opacity="0.35"/>';

      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));

      var tCraz = cue("craziness"), tSecond = cue("second"), tCut = cue("cut"), tEnem = cue("enemies"), tInv = cue("invade"), tUs = cue("us!\"."), tEvery = cue("Everyone");
      var tOne = cue("one"), tSame = cue("same"), tTime = cue("time."), tSec = cue("security"), tInc = cue("increases"), tIncA = KIT.after(ID, "increases");
