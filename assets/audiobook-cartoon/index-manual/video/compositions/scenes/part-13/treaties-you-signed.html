  <!-- treaties-you-signed · Layer B (storyboards/part-13-one-percent-treaty.md): slides in on a long signing table under
       plain bunting, a landmine already sitting on it. "never": the leader (L0, orange sash) folds his arms and shakes his
       head, grinning. "already": three rolled treaties pop up at his elbow and he looks down at them. A grumpy gas canister
       tiptoes in; "chemical": he hurls scroll 1, CHEMICAL WEAPONS BAN, which slams flat on it; "weapons": it lets out a
       mustard puff and he coughs. A scared germ scuttles the other way; "biological": scroll 2 splats it. "landmines":
       scroll 3 slams on the landmine: a white flash, a boom, a mushroom cloud, and the leader stands there charred, hair
       up, still grinning, only his eyes blinking, scroll 3 singed. "signed": his teeth twinkle. "like": the weapons maker
       rises behind the table cradling his baby missile, a price tag on its fin; "using.": he sniffles into a hanky.
       "fewer": the one-line 1% treaty slides in at the end of the row and a pencil rolls onto its empty signature line
       ("them."); after "them.": the charred leader looks at the pencil and blinks, and the weapons maker hugs his baby
       tighter. tsArt() draws that last frame; 847-civilizations shows it on its wall screen. -->
