      // "data.": the clipboard flips up in the drawer (click).
      gsap.set(g("clip"), { svgOrigin: "0 0" });
      tl.fromTo(g("clip"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.25, ease: "back.out(2.2)" }, T.data);

      // "redirected": one teal folder springs out of the drawer and open (boing); its planet's war papers march into the
      // funnel. "resources": the lever drops (ding), medicine papers walk out, the planet glows, its aliens wave.
      function popOpen(key, i, t, dur, ease) {
        var all = g("pop" + key + "-all"), pop = g("pop" + key), sp = g("pop" + key + "-spring");
        gsap.set(pop, { svgOrigin: "0 0" });
        tl.set(g("f" + i), { opacity: 0 }, t);
        tl.set(all, { opacity: 1 }, t);
        tl.fromTo(pop, { scale: 0.18, x: (popX(i) - popAt(i)) / DR.popS, y: (DR.top - DR.popY) / DR.popS }, { scale: 1, x: 0, y: 0, duration: dur, ease: ease }, t);
        gsap.set(sp, { svgOrigin: f1(popX(i)) + " " + f1(DR.top - DR.tab) });
        tl.fromTo(sp, { scaleY: 0 }, { scaleY: 1, duration: dur, ease: ease }, t);
      }
      popOpen("T", iT, T.redirected, 0.5, "back.out(2.2)");
      tl.fromTo(g("popT-tab"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, T.resources);
      var lever = g("popT-funnel").querySelector(".funnel-lever");
      gsap.set(lever, { svgOrigin: "80 -112" });
      tl.fromTo(lever, { rotation: 0 }, { rotation: 50, duration: 0.12, ease: "power2.in" }, T.resources - 0.06);
      tl.fromTo(g("popT-glow"), { opacity: 0 }, { opacity: 0.35, duration: 0.3 }, T.resources);
      tl.to(g("popT-glow"), { opacity: 0.18, duration: 0.6, yoyo: true, repeat: Math.floor((T.hold - T.resources - 0.3) / 0.6) - 1, ease: "sine.inOut" }, T.resources + 0.3);
      var waves = g("popT-aliens").querySelectorAll(".wave");
      Array.prototype.forEach.call(waves, function (w, j) {
        gsap.set(w, { svgOrigin: w.getAttribute("data-o") });
        var d0 = 0.17 + j * 0.02;
        tl.fromTo(w, { rotation: 0 }, { rotation: -32, duration: d0, yoyo: true, repeat: 2 * Math.floor((T.hold - T.resources - 0.1) / (2 * d0)) - 1, ease: "sine.inOut", immediateRender: false }, T.resources + j * 0.05);
      });
      // "alive": the aliens jump for joy.
      var aliens = g("popT-aliens");
      tl.to(aliens, { y: -14, duration: 0.14, yoyo: true, repeat: 3, ease: "power1.out" }, T.alive);
      // The papers: war papers walk in from the left and hop into the funnel's mouth; medicine papers walk out of its spout.
      var ins = [0, 1, 2, 3].map(function (j) { return g("popT-in" + j); }), outs = [0, 1, 2, 3].map(function (j) { return g("popT-out" + j); });
      var PER = 2.2;
      KIT.onTime(tl, D, function (t) {
        var tt = Math.min(t, T.hold) - T.redirected;
        ins.forEach(function (el, j) {
          var ph = tt / PER + j / 4, f = ph - Math.floor(ph), x, y, s = 1, o = tt >= 0 ? 1 : 0;
          if (f < 0.6) { x = -175 + (f / 0.6) * 115; y = -85 - Math.abs(Math.sin(f * 40)) * 3; }
          else { var h = (f - 0.6) / 0.4; x = -60 + h * 52; y = -85 - Math.sin(h * Math.PI * 0.75) * 150 + h * 20; s = 1 - Math.max(0, h - 0.7) * 3; }
          el.setAttribute("transform", "translate(" + f1(x) + "," + f1(y) + ") scale(" + f1(Math.max(0.01, s)) + ")");
          el.setAttribute("opacity", o);
        });
        var t2 = Math.min(t, T.hold) - T.resources;
        outs.forEach(function (el, j) {
          var ph = t2 / PER - j / 4, f = ph - Math.floor(ph), on = t2 >= 0 && ph >= 0;
          el.setAttribute("transform", "translate(" + f1(8 + f * 175) + "," + f1(-84 - Math.abs(Math.sin(f * 40)) * 3) + ")");
          el.setAttribute("opacity", on ? 1 : 0);
        });
      });

      // "didn't" (second): a burnt folder creaks open (squeak): two grinning skeletons still aim glowing atoms at each
      // other, the mushroom cloud still rising between them. "extincted": it crumbles to ash in the drawer.
      popOpen("B", iB, T.didnt2, 0.55, "steps(5)");
      var glows = g("popB").querySelectorAll(".glow");
      tl.fromTo(glows, { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.25, transformOrigin: "50% 50%", duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, T.didnt2);
      gsap.set(g("popB-nuke"), { svgOrigin: "0 0" });
      tl.fromTo(g("popB-nuke"), { y: 0, scale: 0.85 }, { y: -40, scale: 1, duration: T.extincted - T.didnt2, ease: "sine.out" }, T.didnt2);
      tl.fromTo(g("popB-ash"), { opacity: 0 }, { opacity: 0.9, duration: 0.12 }, T.extincted);
      tl.fromTo(g("popB-ash2"), { opacity: 0 }, { opacity: 0.85, duration: 0.12 }, T.extincted + 0.06);
      var tc = T.extincted + 0.14;
      tl.to(g("popB"), { scaleY: 0.02, scaleX: 1.08, duration: 0.3, ease: "power2.in" }, tc);
      tl.to(g("popB-spring"), { scaleY: 0, duration: 0.25, ease: "power2.in" }, tc);
      tl.set(g("popB-all"), { opacity: 0 }, tc + 0.3);
      tl.fromTo(g("ashfall"), { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.05 }, tc);
      tl.to(g("ashfall"), { y: DR.panel - DR.popY + 140, duration: 0.36, ease: "power2.in" }, tc + 0.05);
      tl.to(g("ashfall"), { opacity: 0, duration: 0.06 }, tc + 0.4);
      gsap.set(g("ashheap"), { svgOrigin: f1(ashX) + " " + f1(DR.panel) });
      tl.fromTo(g("ashheap"), { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.14, ease: "power2.out" }, tc + 0.3);
      // "themselves.": HOLD. Nothing moves to the end but Wishonia, and there is no sound.
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
