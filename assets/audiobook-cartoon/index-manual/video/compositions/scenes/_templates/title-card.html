<template id="part-nn-title-template">
  <!-- part-nn-title · the period title card, built by KIT.titleScene (assets/js/props/title.js, look "atomic"):
       the heading in the cover font on a plain navy card under the film's emblem (an atom whose electrons are
       running papers), up from black, a slow push, down to black, under the period film (assets/js/film.js).

       To make a part's title card:
       1. Copy this file to compositions/scenes/part-NN/<scene-id>.html.
       2. Replace every "part-nn-title" with the scene id (the template id, data-composition-id, the element ids
          and opts.id below).
       3. Edit the KIT.titleScene call: lines, linesTall, and if the storyboard asks for them, sub and gag.
       4. In parts/part-NN.json: add the scene (layer "A", cue = the first heading word), put its id in
          "noCaptions" (the heading is the caption), and put a projector whirr on the first heading word:
          { "scene": "<scene-id>", "cue": "Human", "sfx": "whirr", "volume": 0.25 }.
       5. Check it on its own: node tools/build-part.mjs parts/part-NN.json --data-only, then
          node tools/scene-check.mjs part-NN <scene-id> --at 0.1,0.5,1,2 (and again with --aspect 9x16).

       The options (full list at the top of KIT.titleScene in assets/js/props/title.js):
       - lines: the 16:9 line breaks. linesTall: the 9:16 ones (the same words in the same order).
         A word can be { text: "1%", color: "teal" }. A line can be an object with a style:
           { words: ["The", "Daily", "Deletion", "Event"], style: "small" }
         styles: "big" (default), "small" (a lead-in line such as "THE"), "label", "italic", "stamp".
       - The whole heading is on the card as it comes up from black. To bring words in on the narration instead,
         give spoken: the cue word for each heading word, in reading order ({ show: "1%", cue: "one" } for a word
         said differently); they fade in on their words.
       - sub: a pill under the heading, "text" or { text: "...", cue: "Step-by-Step" }.
       - gag: function (c) { ... } for the storyboard's small gag. c.tl, c.art (in front of the words), c.back
         (behind them), c.emblem (the atom: at, rx, ry), c.words[k].box (canvas px), c.pin(k, "right", svg) (art
         that moves with word k), c.cue / c.after / c.before (word → scene seconds), c.D, c.W, c.H, c.V.
         No Math.random or Date (KIT.rng). Every gag pays off on screen. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="part-nn-title" data-width="1920" data-height="1080" data-start="0" data-duration="3">
    <div id="part-nn-title-cam">
      <div id="part-nn-title-bg"></div>
      <div id="part-nn-title-back"></div>
      <div id="part-nn-title-words"></div>
      <div id="part-nn-title-art"></div>
    </div>
    <div id="part-nn-title-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/title.js"></script>
  <script>
    KIT.titleScene({
      id: "part-nn-title",
      // CHANGE: the heading, as the 16:9 card breaks it, and as the 9:16 card breaks it.
      lines: [{ words: ["THE", "HUMAN"], style: "small" }, ["ECONOMY"]],
      linesTall: [{ words: ["THE", "HUMAN"], style: "small" }, ["ECONOMY"]],
      // OPTIONAL: a pill under the heading, and the storyboard's gag:
      // sub: "A Step-by-Step Guide",
      // gag: function (c) { ... },
    });
  </script>
</template>
