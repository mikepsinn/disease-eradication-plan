<template id="s10-template">
  <!-- S10 · Layer B · A grid of 2,782 top hats; one lights up. On "playing Legos", cut to a human in a playpen with plain toy bricks. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #s10-bg, #s10-hats, #s10-plan, #s10-pen, #s10-pip { position: absolute; inset: 0; }
    #s10-cost { position: absolute; left: 130px; top: 84px; font-size: 52px; }
    #s10-cost b { font-family: "Fraunces"; font-weight: 900; color: #157F78; font-size: 1.25em; }
    #s10-count { position: absolute; right: 130px; top: 84px; font-size: 52px; text-align: right; }
    #s10-count b { font-family: "Fraunces"; font-weight: 900; color: #D7322B; font-size: 1.25em; }
  </style>
  <div id="root" data-composition-id="s10" data-width="1920" data-height="1080" data-start="0" data-duration="19.04">
    <div id="s10-bg" class="clip" data-start="0" data-duration="19.04" data-track-index="0"></div>
    <div id="s10-hats"></div>
    <div id="s10-plan"></div>
    <div id="s10-cost" class="kit-label">Cost: <b>$1 billion</b></div>
    <div id="s10-count" class="kit-label">Billionaires on Earth: <b>2,782</b></div>
    <div id="s10-pen"></div>
    <div id="s10-pip"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part-02.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "s10";
      var D = KIT.scene(ID).duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C;

      q("bg").innerHTML = KIT.paper(ID);
      // 2,782 hats: 71 columns x 40 rows minus the last 58 (one <use> each)
      var COLS = 71, N = 2782, X0 = 170, Y0 = 230, DX = 20.3, DY = 16;
      var cols = [];
      for (var c = 0; c < COLS; c++) cols.push("");
      var lit = 1434;
      for (var i = 0; i < N; i++) {
        if (i === lit) continue;
        var col = i % COLS, row = Math.floor(i / COLS);
        cols[col] += '<use href="#s10-hat" x="' + (X0 + col * DX).toFixed(1) + '" y="' + (Y0 + row * DY) + '"/>';
      }
      var lx = X0 + (lit % COLS) * DX, ly = Y0 + Math.floor(lit / COLS) * DY;
      q("hats").innerHTML = KIT.svg(1920, 1080,
        '<defs><g id="s10-hat"><rect x="-5" y="-11" width="10" height="10" fill="' + C.line + '"/><rect x="-5" y="-4" width="10" height="2" fill="' + C.war + '"/><rect x="-8" y="-1.5" width="16" height="3" rx="1.5" fill="' + C.line + '"/></g></defs>' +
        cols.map(function (s, k) { return '<g class="s10-col">' + s + "</g>"; }).join("") +
        '<g id="s10-dim"><rect x="140" y="200" width="1470" height="660" fill="' + C.paper + '" opacity="0.7"/></g>' +
        '<g transform="translate(' + lx.toFixed(1) + "," + ly + ')"><g id="s10-lit">' +
          '<circle r="26" fill="' + C.med + '" opacity="0.35"/><circle r="15" fill="' + C.med + '" opacity="0.6"/>' +
          '<g transform="scale(1.4)"><rect x="-5" y="-11" width="10" height="10" fill="' + C.line + '"/><rect x="-5" y="-4" width="10" height="2" fill="' + C.med + '"/><rect x="-8" y="-1.5" width="16" height="3" rx="1.5" fill="' + C.line + '"/></g>' +
        "</g></g>"
      );
      // the plan: one document with a price tag
      q("plan").innerHTML = KIT.svg(1920, 1080,
        '<g transform="translate(860,560)"><g id="s10-doc">' +
        '<path d="M-170,-250 H120 L170,-200 V250 H-170 Z" fill="#FBF5E6" stroke="' + C.line + '" stroke-width="6" stroke-linejoin="round"/>' +
        '<path d="M120,-250 V-200 H170" fill="none" stroke="' + C.line + '" stroke-width="5"/>' +
        '<text x="0" y="-150" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="52" fill="' + C.line + '">THE PLAN</text>' +
        [0, 1, 2, 3, 4].map(function (k) { return '<path d="M-110,' + (-70 + k * 60) + ' h' + (k % 2 ? 180 : 220) + '" stroke="' + C.line + '" stroke-width="10" stroke-linecap="round"/>'; }).join("") +
        '<g transform="translate(150,140) rotate(-14)"><path d="M-30,-56 H120 V56 H-30 L-80,0 Z" fill="' + C.med + '" stroke="' + C.line + '" stroke-width="6" stroke-linejoin="round"/>' +
        '<circle cx="-42" cy="0" r="10" fill="' + C.paper + '" stroke="' + C.line + '" stroke-width="4"/>' +
        '<text x="44" y="16" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="46" fill="' + C.paper + '">$1B</text></g>' +
        "</g></g>"
      );
      // the playpen: a human with plain toy bricks (no brand marks)
      function brick(x, y, fill, w) {
        var ww = w || 80;
        var studs = "";
        for (var k = 0; k < ww / 40; k++) studs += '<rect x="' + (x + 10 + k * 40) + '" y="' + (y - 12) + '" width="20" height="12" rx="2" fill="' + fill + '" stroke="' + C.line + '" stroke-width="3"/>';
        return studs + '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="44" rx="3" fill="' + fill + '" stroke="' + C.line + '" stroke-width="4"/>';
      }
      var bars = "";
      for (var b = 0; b < 19; b++) bars += '<path d="M' + (420 + b * 50) + ',430 V800" stroke="' + C.line + '" stroke-width="7" stroke-linecap="round"/>';
      q("pen").innerHTML = KIT.svg(1920, 1080,
        '<rect width="1920" height="1080" fill="' + C.paper + '"/>' + KIT.paperDefs(ID + "p") +
        '<rect x="30" y="30" width="1860" height="1020" fill="none" stroke="' + C.line + '" stroke-width="5"/>' +
        '<path d="M300,830 L1460,830" stroke="' + C.line + '" stroke-width="6"/>' +
        '<rect x="380" y="780" width="980" height="44" fill="url(#' + ID + 'p-hatch)" stroke="' + C.line + '" stroke-width="5"/>' +
        brick(560, 736, C.war) + brick(1140, 736, C.med) + brick(1180, 692, C.paper) +
        '<g transform="translate(860,690)"><g id="s10-kid"><g transform="scale(1.5)">' + KIT.bean({ tone: 3, arms: [[-150, -170], [150, 170]], mouth: "smile", hair: 1 }) + "</g></g></g>" +
        '<g transform="translate(600,470)"><g id="s10-brick">' + brick(-40, 0, C.paper) + "</g></g>" +
        bars +
        '<path d="M380,430 H1360 M380,800 H1360" stroke="' + C.line + '" stroke-width="10" stroke-linecap="round"/>'
      );

      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), { scene: ID, x: 1620, y: 590, w: 280, pip: { cx: 1760, cy: 740, r: 128 } });

      tl.fromTo("#s10-doc", { y: 700, rotation: 8 }, { y: 0, rotation: -3, duration: 0.6, ease: "power3.out" }, cue("plan") - 0.3);
      tl.to("#s10-doc", { scale: 0.15, x: -560, y: -460, opacity: 0, duration: 0.5, ease: "power3.in" }, cue("possible") - 0.2);
      tl.fromTo(q("cost"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, cue("$1"));
      tl.fromTo(q("count"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, cue("2,782") - 0.1);
      // the hats fill in, column by column, while "2,782 billionaires" is said
      var colEls = q("hats").querySelectorAll(".s10-col");
      var h0 = cue("your") - 0.1;
      colEls.forEach(function (g, k) {
        tl.fromTo(g, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, h0 + k * 0.022);
      });
      tl.fromTo("#s10-dim", { opacity: 0 }, { opacity: 1, duration: 0.5 }, cue("might"));
      tl.fromTo("#s10-lit", { scale: 0, transformOrigin: "50% 50%" }, { scale: 2.2, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2.5)" }, cue("might"));
      // "stop reading now": the lit hat goes out
      tl.to("#s10-lit", { scale: 0, duration: 0.3, ease: "power2.in" }, cue("no") );
      // hard cut to the playpen on "playing"
      var cut = cue("playing") - 0.15;
      tl.fromTo(q("pen"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, cut);
      tl.fromTo("#s10-brick", { y: -60 }, { y: 222, duration: 0.5, ease: "bounce.out" }, cut + 0.4);
      tl.fromTo("#s10-kid", { rotation: -4, transformOrigin: "50% 100%" }, { rotation: 4, transformOrigin: "50% 100%", duration: 0.6, ease: "sine.inOut" }, cut);
      tl.to("#s10-kid", { rotation: -3, transformOrigin: "50% 100%", duration: 0.6, ease: "sine.inOut" }, cut + 0.6);
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
