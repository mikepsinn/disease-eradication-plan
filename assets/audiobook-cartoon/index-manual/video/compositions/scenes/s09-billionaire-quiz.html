<template id="s09-template">
  <!-- S09 · Layer B · The Rich Human in a top hat nods at each question; then a crowd of humans gets "better off" badges. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #s09-bg, #s09-art, #s09-pip { position: absolute; inset: 0; }
    #s09-list {
      position: absolute; left: 820px; top: 96px; width: 760px; padding: 26px 36px 18px;
      background: #FBF5E6; border: 5px solid #1B1B1B; box-shadow: 10px 12px 0 #1B1B1B;
    }
    #s09-list-head { font-size: 30px; color: #D7322B; margin-bottom: 8px; }
    .s09-item { display: flex; align-items: center; gap: 18px; font-size: 44px; line-height: 1.1; padding: 10px 0; border-top: 3px solid rgba(31, 163, 154, 0.45); }
    .s09-box { flex: 0 0 auto; width: 56px; height: 56px; }
  </style>
  <div id="root" data-composition-id="s09" data-width="1920" data-height="1080" data-start="0" data-duration="18.28">
    <div id="s09-bg" class="clip" data-start="0" data-duration="18.28" data-track-index="0"></div>
    <div id="s09-art"></div>
    <div id="s09-list">
      <div id="s09-list-head" class="kit-label">Billionaire exam</div>
    </div>
    <div id="s09-pip"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part-02.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "s09";
      var D = KIT.scene(ID).duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C;

      q("bg").innerHTML = KIT.paper(ID);
      // the exam chair (a school desk-chair) and the Rich Human in it
      var chair = '<g stroke="' + C.line + '" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">' +
        '<path d="M330,560 V430 M330,560 h170 M500,560 V700 M330,560 V700 M300,700 h240" fill="none"/>' +
        '<path d="M500,500 h170 l-12,26 h-158 Z" fill="url(#s09a-hatch)"/>' +
        '<path d="M640,526 V700" fill="none"/></g>';
      var rich = '<g transform="translate(415,470)"><g id="s09-rich"><g transform="scale(1.7)">' +
        KIT.bean({ tone: 0, arms: [[30, 70], [-50, -80]], mouth: "smile" }) +
        '<g transform="translate(0,-62) scale(1.5)">' + KIT.tophat() + "</g></g></g></g>";
      var crowd = "";
      for (var i = 0; i < 10; i++) {
        crowd += '<g transform="translate(' + (110 + i * 112) + "," + (790 + (i % 2) * 12) + ')"><g class="s09-human"><g transform="scale(0.78)">' +
          KIT.bean({ tone: i, hair: i % 3, arms: [[15, 5], [-15, -5]], mouth: i % 2 ? "smile" : "flat" }) +
          '<g class="s09-badge" transform="translate(0,6)"><circle r="17" fill="' + C.med + '" stroke="' + C.line + '" stroke-width="3"/>' +
          '<path d="M-8,0 l6,6 l11,-12" fill="none" stroke="' + C.paper + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>' +
          "</g></g></g>";
      }
      q("art").innerHTML = KIT.svg(1920, 1080,
        KIT.paperDefs(ID + "a") + '<path d="M90,702 H760" stroke="' + C.line + '" stroke-width="6"/>' + chair + rich +
        '<g id="s09-crowd">' + crowd + "</g>" +
        '<g id="s09-banner" transform="translate(1290,792)"><rect x="-170" y="-40" width="340" height="80" rx="10" fill="' + C.med + '" stroke="' + C.line + '" stroke-width="5"/>' +
        '<text y="16" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="44" fill="' + C.paper + '">BETTER OFF</text></g>'
      );

      var items = ["Like money?", "Prefer not dying?", "Can make politicians do things?", "Better off with less war and disease?"];
      var list = q("list");
      var rows = items.map(function (text) {
        var row = document.createElement("div");
        row.className = "s09-item kit-label";
        row.innerHTML = '<div class="s09-box">' + KIT.svg(56, 56, KIT.checkbox(2, 2, 52) + KIT.tick(2, -4, 58)) + "</div><div>" + text + "</div>";
        list.appendChild(row);
        return row;
      });

      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), { scene: ID, x: 1620, y: 590, w: 280, pip: { cx: 1760, cy: 740, r: 128 } });

      tl.fromTo("#s09-rich", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(list, { x: 900 }, { x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      var asks = [cue("like"), cue("prefer"), cue("Can"), cue("Would")];
      var answers = [cue("money?"), cue("diseases?"), cue("things?"), cue("disease?")];
      rows.forEach(function (row, i) {
        tl.fromTo(row, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, asks[i] - 0.1);
        tl.fromTo(row.querySelector(".tick"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3 }, answers[i] + 0.15);
        if (i < 3) {
          // a nod for each answer
          tl.to("#s09-rich", { rotation: 7, transformOrigin: "50% 100%", duration: 0.16, ease: "power2.out" }, answers[i] + 0.05);
          tl.to("#s09-rich", { rotation: -2, transformOrigin: "50% 100%", duration: 0.16, ease: "power2.inOut" }, answers[i] + 0.21);
          tl.to("#s09-rich", { rotation: 0, transformOrigin: "50% 100%", duration: 0.14, ease: "power2.in" }, answers[i] + 0.37);
        }
      });
      // the crowd, then everyone's badge
      var humans = q("art").querySelectorAll(".s09-human");
      humans.forEach(function (h, i) {
        tl.fromTo(h, { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, cue("nearly") + i * 0.07);
      });
      var badges = q("art").querySelectorAll(".s09-badge");
      badges.forEach(function (b, i) {
        tl.fromTo(b, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)" }, cue("better", 2) + i * 0.06);
      });
      tl.fromTo("#s09-banner", { scale: 0, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, opacity: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2)" }, cue("off?", 2));
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
