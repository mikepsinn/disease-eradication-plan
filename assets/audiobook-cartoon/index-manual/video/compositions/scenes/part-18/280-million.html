<template id="280-million-template">
  <!-- 280-million · collage, a plain field. "two hundred and eighty million": a block of 28 little voters fills in row
       by row, one figure for 10 million; 280,000,000 stamps over them. "ten": the camera pulls back, and beside them a
       block of 400 twerkers draws in at the same scale (Victorian ladies in bustles at their wall telephones), DOWNLOADED
       TIKTOK. "twerk.": all 400 twerk in step, flipping between the two frames of the dance (the telephone is in the
       first), the ground quakes, and the 28 voters bounce in place. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #E2CFA5; }
  </style>
  <div id="root" data-composition-id="280-million" data-width="1920" data-height="1080" data-start="0" data-duration="11.02">
    <div id="280-million-weave"></div>
    <div id="280-million-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    (function () {
      // the scene id starts with a digit: no CSS selectors on it
      var ID = "280-million", V = KIT.V, D = KIT.scene(ID).duration;
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      // one figure for 10 million, the same cell in both blocks (71.4 px)
      var VOTERS = [200, 420, 700, 840], TWERK = [900, -620, 2330, 810];
      var views = V ? { close: [450, 600, 1.5], wide: [1215, 200, 0.49] } : { close: [450, 640, 1.5], wide: [1265, 230, 0.58] };
      var beats = [
        { on: "two", do: "pictogram", id: "voters", art: "citizen-5", count: 28, cols: 7, box: VOTERS, dur: 1.4 },
        { on: "humans.", do: "stamp", id: "n280", text: "280,000,000", x: 450, y: 380, size: 110, width: 600, tilt: -4 },
        { on: "ten", do: "camera", view: "wide", dur: 1.2 },
        { on: "ten", offset: 0.3, do: "pictogram", id: "tw", art: "twerker", count: 400, cols: 20, box: TWERK, dur: 1.6, accel: 0.8 },
        { on: "TikTok", do: "stamp", id: "tiktok", text: "DOWNLOADED TIKTOK", x: 1615, y: -600, size: 150, width: 1500, tilt: 3 },
        { on: "twerk.", do: "pictogram", id: "tw2", art: "twerker-2", count: 400, cols: 20, box: TWERK, dur: 0 },
        { on: "twerk.", do: "hide", who: "tw" },
        { on: "twerk.", do: "bob", who: ["tw", "tw2"], y: 8, r: 3, speed: 4, fade: 0.1 },
        { on: "twerk.", do: "shake", y: 14, frames: 6 },
        { on: "twerk.", offset: 0.05, do: "hop", who: "voters", height: 30 },
        { on: "twerk.", offset: 0.5, do: "hop", who: "voters", height: 22 },
        { on: "twerk.", offset: 0.5, do: "shake", y: 10, frames: 4 },
      ];
      // the two frames of the twerk, in step, three drawings each, to the end
      for (var t = cue("twerk.") + 0.25, k = 1; t < D; t += 0.25, k++) {
        beats.push({ at: t, do: "hide", who: k % 2 ? "tw2" : "tw" }, { at: t, do: "show", who: k % 2 ? "tw" : "tw2" });
      }
      KIT.collage({ id: ID, seed: 1811, plate: [-1500, -2200, 3800, 2700], views: views, view: "close", beats: beats });
    })();
  </script>
</template>
