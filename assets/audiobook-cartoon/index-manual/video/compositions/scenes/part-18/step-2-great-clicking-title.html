<template id="step-2-great-clicking-title-template">
  <!-- step-2-great-clicking-title · the period title card (KIT.titleScene, look "atomic"): STEP 2: under the emblem,
       THE GREAT CLICKING reads in. "The": a Gilliam hand comes down from the top edge over the atom; "Clicking.": it
       presses the nucleus like a bell push, which clicks in and out. The bill passing the top of its orbit right then
       skids to a stop, its missile seal flips to a cross, it stands there a beat, and runs on. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="step-2-great-clicking-title" data-width="1920" data-height="1080" data-start="0" data-duration="3.388">
    <div id="step-2-great-clicking-title-cam">
      <div id="step-2-great-clicking-title-bg"></div>
      <div id="step-2-great-clicking-title-back"></div>
      <div id="step-2-great-clicking-title-words"></div>
      <div id="step-2-great-clicking-title-art"></div>
    </div>
    <div id="step-2-great-clicking-title-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/title.js"></script>
  <script>
    (function () {
      var V = KIT.V, C = KIT.C;
      KIT.titleScene({
        id: "step-2-great-clicking-title",
        lines: [{ words: ["STEP", "2:"], style: "small" }, ["THE", "GREAT", "CLICKING"]],
        linesTall: [{ words: ["STEP", "2:"], style: "small" }, ["THE", "GREAT"], ["CLICKING"]],
        spoken: ["Step", "2:", "The", "Great", "Clicking."],
        gag: function (c) {
          var tl = c.tl, E = c.emblem, D = c.D, ID = c.id;
          // The hand: pointing-hand.webp (174 x 288), its fingertip at art (58, 282).
          var HK = V ? 1.9 : 1.25, HW = 174 * HK, HH = 288 * HK, TIP = [58 * HK, 282 * HK];
          var hand = document.createElement("div");
          hand.style.cssText = "position:absolute;left:0;top:0;width:" + HW.toFixed(1) + "px;height:" + HH.toFixed(1) + "px;visibility:hidden";
          hand.innerHTML = '<img src="assets/art/collage/pointing-hand.webp" style="position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(6px 8px 3px rgba(0,0,0,0.5))">';
          c.art.appendChild(hand);
          var REST = E.at[1] - 34, PRESS = E.at[1] - 14;              // fingertip y: just over the nucleus, and in
          var IN = c.cue("The"), CLICK = c.cue("Clicking."), OUT = D - 0.35;
          var nuc = c.bg.querySelectorAll("circle");
          // The bill on the flat orbit (TILT 0) passes the top of it (sin th = -1) at t = (3pi/2) / 2.4 = 1.96 s, just
          // after "Clicking.", under the finger; it skids just past it, flips its seal and runs on.
          var e0 = document.getElementById(ID + "-e0"), legs0 = e0.querySelector(".legs"), money0 = e0.querySelector(".money");
          var cross = document.createElementNS("http://www.w3.org/2000/svg", "g");
          cross.innerHTML = '<circle cx="31" cy="0" r="10" fill="' + C.moneyDark + '" stroke="' + C.line + '" stroke-width="2"/>' +
            '<path d="M31,-5.5 V5.5 M25.5,0 H36.5" stroke="' + C.cream + '" stroke-width="3.4" stroke-linecap="round"/>';
          cross.style.visibility = "hidden";
          money0.appendChild(cross);
          var SKID = (1.5 * Math.PI + 0.7) / 2.4, GO = SKID + 0.6, FLIP = SKID + 0.12;
          KIT.onTime(tl, D, function (t0) {
            var t = Math.floor(t0 * 12) / 12;
            // the hand comes down, presses on "Clicking.", lifts, and goes back up off the card
            var y;
            if (t < IN) y = -HH - 40;
            else if (t < IN + 0.25) y = -HH - 40 + (REST - TIP[1] + HH + 40) * KIT.smooth((t - IN) / 0.25);
            else y = REST - TIP[1];
            var pr = t >= CLICK && t < CLICK + 0.17;
            if (pr) y = PRESS - TIP[1];
            if (t >= OUT) y = REST - TIP[1] - (HH + 200) * KIT.smooth((t - OUT) / 0.3);
            hand.style.visibility = t >= IN ? "inherit" : "hidden";
            hand.style.transform = "translate(" + (E.at[0] - TIP[0]).toFixed(1) + "px," + y.toFixed(1) + "px)";
            // the nucleus clicks in (squashed) while pressed
            var s = pr ? 0.72 : 1;
            Array.prototype.forEach.call(nuc, function (n) {
              n.setAttribute("transform", "translate(" + E.at[0] + "," + E.at[1] + ") scale(" + (2 - s).toFixed(2) + "," + s.toFixed(2) + ") translate(" + -E.at[0] + "," + -E.at[1] + ")");
            });
            // the skidding bill: its orbit clock stops from SKID to GO, then runs on
            var tc = t < SKID ? t0 : t < GO ? SKID : t0 - (GO - SKID);
            var th = tc * 2.4, x = E.at[0] + E.rx * Math.cos(th), yy = E.at[1] + E.ry * Math.sin(th);
            var lean = t >= SKID && t < SKID + 0.17 ? -14 : 0, hop = t >= FLIP && t < FLIP + 0.17 ? -16 : 0;
            e0.setAttribute("transform", "translate(" + x.toFixed(1) + "," + (yy - 6 + hop).toFixed(1) + ") rotate(" + lean + ")");
            if (t >= SKID && t < GO) legs0.setAttribute("d", "M-16,24 l-2,22 h-8 M16,24 l2,22 h8");
            cross.style.visibility = t >= FLIP ? "inherit" : "hidden";
          });
        },
      });
    })();
  </script>
</template>
