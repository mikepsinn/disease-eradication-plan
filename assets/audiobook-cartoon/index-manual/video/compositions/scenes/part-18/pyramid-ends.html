<template id="pyramid-ends-template">
  <!-- pyramid-ends · collage host shot. Wishonia at the console. The Reaper, blown off the top of the referral
       pyramid, sails past behind her out in space, tumbling, and his clipboard drops onto the console in front of her on
       "diseases.". She smirks at us; the iris closes on her. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="pyramid-ends" data-width="1920" data-height="1080" data-start="0" data-duration="2.05">
    <div id="pyramid-ends-weave"></div>
    <div id="pyramid-ends-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    (function () {
      var ID = "pyramid-ends", V = KIT.V, S = KIT.STUDIO, SZ = KIT.collage.SIZES, D = KIT.scene(ID).duration;
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      // Earth as click-to-not-die draws it (bigger than the deck's own, over it), with its 3.5% wedge lit.
      var E = V ? [860, 560, 200] : [1450, 520, 260];
      var EK = 2.04 * E[2] / SZ["earth-big"][0], R = E[2] * 0.97;
      var rim = function (th, out) { var a = th * Math.PI / 180, r = R + (out || 0); return [E[0] + r * Math.sin(a), E[1] - r * Math.cos(a)]; };
      var WA = -42, HALF = 3.5 * 3.6 / 2;
      var cast = { earth: { art: "earth-big", x: E[0], y: E[1], scale: EK } }, beats = [], add = function (b) { beats.push(b); };
      // the question mark on its coil spring, standing out of the wedge (its base at the rim, leaning with it)
      var SPR = rim(WA, -6), SPH = V ? 150 : 190;
      var spring = function (mark, hidden) {
        return { art: "jack-spring", x: SPR[0], y: SPR[1], anchor: "bottom", pivot: "bottom", scale: SPH / SZ["jack-spring"][1], hidden: hidden,
          label: { text: mark, at: [67, 40], width: 120, size: V ? 70 : 90, plaque: true } };
      };
      var RH = V ? 260 : 300;
      cast.reaper = { art: "reaper-stop", x: V ? 1250 : 2150, y: V ? 140 : 130, scale: RH / SZ["reaper-stop"][1] };
      var LAND = [V ? 560 : 1000, S.top + 6];
      cast.clip = { art: "plan-clipboard", x: LAND[0], y: -300, anchor: "bottom", pivot: "bottom", scale: V ? 0.42 : 0.5,
        label: [{ text: "IIII IIII", at: [171, 230], width: 250, size: 90 }, { text: "IIII II", at: [171, 340], width: 250, size: 90 }] };
      add({ at: 0, do: "move", who: "reaper", to: [V ? -250 : -300, V ? 90 : 60], turn: -540, dur: 1.5 });
      add({ on: "diseases.", offset: -0.25, do: "move", who: "clip", to: [LAND[0], LAND[1] - 500 * (V ? 0.42 : 0.5) * 492 / 1000], dur: 0.25, turn: 8 });
      add({ on: "diseases.", do: "shiver", who: "clip", dur: 0.25, amp: 3, rot: 3 });
      var tl = KIT.collage({ id: ID, seed: 1814, host: { iris: ["out", D - 0.55, D - 0.05] }, cast: cast, beats: beats });
      document.querySelector("#" + ID + "-hwall .earth").style.visibility = "hidden";
      // the wedge, over Earth
      var p0 = rim(WA - HALF), p1 = rim(WA + HALF), wedge = document.createElement("div");
      wedge.style.cssText = "position:absolute;left:0;top:0;width:0;height:0";
      wedge.innerHTML = '<svg width="1" height="1" style="position:absolute;left:0;top:0;overflow:visible"><path d="M' + E[0] + "," + E[1] + " L" + p0[0].toFixed(1) + "," + p0[1].toFixed(1) +
        " A" + R + "," + R + " 0 0 1 " + p1[0].toFixed(1) + "," + p1[1].toFixed(1) + ' Z" fill="#FFE27A" fill-opacity="0.85" stroke="#2B2033" stroke-width="3" stroke-linejoin="round"/></svg>';
      var earthEl = document.getElementById(ID + "-earth");
      earthEl.parentNode.insertBefore(wedge, earthEl.nextSibling);
    })();
  </script>
</template>
