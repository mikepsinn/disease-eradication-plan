<template id="host-closes-template">
  <!-- host-closes · style "atomic" (cartoon-style-bible.md): back on the host's set (the same code as
       host-opens). A skinny hungry human with his pockets turned out walks in on "skip"; on "give" a club sandwich
       appears on Wishonia's palm like a conjuring trick and hops straight into his hands on "directly"; he turns it
       over looking for the price tag, finds none, shrugs, and takes an enormous bite. On "you" she side-eyes the camera
       and the film irises out on her face. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
    #host-closes-weave, #host-closes-cam, #host-closes-wall, #host-closes-wish, #host-closes-front, #host-closes-iris, #host-closes-film { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="host-closes" data-width="1920" data-height="1080" data-start="0" data-duration="7.36">
    <div id="host-closes-weave">
      <div id="host-closes-cam">
        <div id="host-closes-wall"></div>
        <div id="host-closes-wish"></div>
        <div id="host-closes-front"></div>
      </div>
      <div id="host-closes-iris"></div>
    </div>
    <div id="host-closes-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "host-closes";
      var sc = KIT.scene(ID), D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var f = function (n) { return n.toFixed(1); };
      var tl = gsap.timeline({ paused: true });

      // ── Period film (KIT.film): outside the camera, so it stays put.
      KIT.film(tl, ID, q("weave"), q("film"), 61);

      // ── The host's set (KIT.STUDIO; KIT.studio draws it below, with the human in front). MAN_AT: where the hungry
      // human stops (x, feet y) and his scale.
      var S = KIT.STUDIO, MAN_AT = V ? [880, 1576, 2.7] : [1390, 1066, 3.3];

      // ── The hungry human: skinny, pockets turned out (no papers, so never in the loop). Facing her (left).
      // His drawings, one shown at a time: walking in, hands at his empty pockets, hands out, holding the sandwich
      // up, looking at us (the price-tag check), and chewing.
      var MAN = { kind: "shirt", head: "long", hairStyle: "short", tone: 2, color: 2, look: "left", build: { tw: 0.72, legs: 1.18, th: 1.12, neck: 1.6, hs: 0.95, nose: 1.5 } };
      var copy = function (a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b) o[k] = b[k]; return o; };
      var POSES = {
        walk: { mood: "worried", arms: [[8, 4], [-8, -4]] },
        pockets: { mood: "worried", arms: [[24, -6], [-24, 6]] },
        out: { mood: "eager", arms: [[-62, -92], [-44, -84]] },
        hold: { mood: "eager", arms: [[-20, -110], [-8, -104]] },
        check: { mood: "flat", brows: true, arms: [[-20, -110], [-8, -104]] },
        chew: { mood: "smile", arms: [[-30, -160], [-14, -158]] },
      };
      var k = MAN_AT[2], mx = MAN_AT[0], my = MAN_AT[1] - 100 * k;
      var manSvg = "", rigs = {};
      Object.keys(POSES).forEach(function (n) {
        var o = copy(MAN, POSES[n]);
        rigs[n] = KIT.rig(o);
        manSvg += '<g id="' + ID + "-p-" + n + '" opacity="' + (n === "walk" ? 1 : 0) + '">' + KIT.person(o) + "</g>";
      });
      var R0 = rigs.walk;
      // the turned-out pockets: two white flaps at his hips
      var pocket = function (x, s) { return '<path d="M' + f(x) + "," + f(R0.hipY - 4) + " l" + 13 * s + ",0 l" + -3 * s + ",15 l" + -9 * s + ",-3 Z" + '" fill="#FBF6E6" stroke="' + C.line + '" stroke-width="2.2" stroke-linejoin="round"/>'; };
      manSvg += pocket(R0.hip[0][0] - 9, -1) + pocket(R0.hip[1][0] + 9, 1);
      // The 1950s club sandwich, about 64 x 52 in its own units, around its middle. After the bite its clip
      // path swaps to one with a scalloped notch out of the side nearest his mouth.
      function sandwich() {
        var bread = function (y, h) { return '<rect x="-32" y="' + y + '" width="64" height="' + h + '" rx="7" fill="#E9C07A" stroke="' + C.line + '" stroke-width="2.6"/>'; };
        var body = bread(10, 11) + '<path d="M-33,8 q6,-6 11,0 q6,-6 11,0 q6,-6 11,0 q6,-6 11,0 q6,-6 11,0 q6,-6 11,0 v4 h-66 Z" fill="#9DB25A" stroke="' + C.line + '" stroke-width="2"/>' +
          '<rect x="-31" y="0" width="62" height="7" fill="' + C.war + '" stroke="' + C.line + '" stroke-width="2"/>' + bread(-10, 10) +
          '<rect x="-31" y="-17" width="62" height="7" fill="#D99A8F" stroke="' + C.line + '" stroke-width="2"/><path d="M-31,-11 H31 V-8 l-5,7 l-4,-7 H-31 Z" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="1.6"/>' + bread(-29, 12);
        var pick = '<path d="M4,-29 L1,-50" stroke="' + C.tan + '" stroke-width="2.4"/><circle cx="1" cy="-52" r="5.5" fill="#7E8C3A" stroke="' + C.line + '" stroke-width="2"/><circle cx="1" cy="-52" r="2" fill="' + C.war + '"/>';
        var c = ID + "-bite";
        return '<defs><clipPath id="' + c + '"><path d="M-60,-80 H6 V-31 Q16,-31 18,-22 Q7,-19 11,-10 Q3,-5 10,3 Q4,9 13,15 Q22,17 26,22 H60 V60 H-60 Z"/></clipPath></defs>' +
          '<g class="sandwich-body">' + body + pick + "</g>";
      }
      var ks = k * 0.74;
      var sand = '<g id="' + ID + '-sand"><g id="' + ID + '-sand-in"><g transform="scale(' + ks + ')">' + sandwich() + "</g></g></g>";
      // the set, Wishonia, and the same slow push on her face as the opening; the human and the sandwich in front
      KIT.studio(tl, ID, { cam: q("cam"), wall: q("wall"), wish: q("wish"), front: q("front") },
        { front: '<g id="' + ID + '-man"><g transform="scale(' + k + ')">' + manSvg + "</g></g>" + sand, push: [1.02, 1.08] });
      var manEl = q("man"), sandEl = q("sand"), sandIn = q("sand-in"), sandBody = q("front").querySelector(".sandwich-body");
      var pose = function (n) { Object.keys(POSES).forEach(function (p) { q("p-" + p).setAttribute("opacity", p === n ? 1 : 0); }); };

      // Her right palm in the "presenting" body (the sprite's hand, measured: 0.826 w across, 0.976 w down the rig).
      var palm = [S.wish.x + 0.87 * S.wish.w, S.wish.y + 0.97 * S.wish.w - 22 * ks];
      var handAt = function (n) { var h = rigs[n].hand; return [mx + k * (h[0][0] + h[1][0]) / 2, my + k * (h[0][1] + h[1][1]) / 2 - 14 * ks]; };
      var tSkip = cue("skip"), tGive = cue("give"), tFood = cue("food"), tDir = cue("directly,"), tBut = cue("but"), tProb = cue("probably"), tYou = cue("you.");
      var walk0 = tSkip, walk1 = tSkip + 0.95, x0 = W + 140;
      var ease = function (u) { u = Math.min(1, Math.max(0, u)); return u * u * (3 - 2 * u); };
      var hop0 = tDir - 0.32, hop1 = tDir + 0.02;
      KIT.onTime(tl, D, function (t) {
        // walk in, then stand: the legs swing and the body bobs while he walks
        var u = Math.min(1, Math.max(0, (t - walk0) / (walk1 - walk0))), x = x0 + (mx - x0) * (1 - (1 - u) * (1 - u));
        var walking = t > walk0 && t < walk1, ph = (t - walk0) * 9;
        var bob = walking ? -Math.abs(Math.sin(ph)) * 6 * k : 0;
        // after the bite he chews: the whole man bobs a little
        if (t > tProb + 0.4) bob = -Math.abs(Math.sin((t - tProb) * 11)) * 2.2 * k;
        manEl.setAttribute("transform", "translate(" + f(x) + "," + f(my + bob) + ")");
        var legs = q("p-walk").querySelectorAll(".leg-l, .leg-r");
        Array.prototype.forEach.call(legs, function (lg, i) {
          var a = walking ? Math.sin(ph) * 22 * (i ? -1 : 1) : 0, hip = R0.hip[i];
          lg.setAttribute("transform", "rotate(" + a.toFixed(1) + " " + f(hip[0]) + " " + f(hip[1]) + ")");
        });
        // the poses
        var p = t < walk1 ? "walk" : t < tGive + 0.35 ? "pockets" : t < hop1 ? "out" : t < tBut + 0.05 ? "hold" : t < tProb + 0.35 ? "check" : "chew";
        pose(p);
        // the sandwich: appears on her palm on "give", hops straight into his hands on "directly", is turned over
        // (no price tag), then bitten
        var sx, sy, rot = 0, sclY = 1, vis = t >= tGive + 0.1;
        if (t < hop0) { sx = palm[0]; sy = palm[1]; }
        else if (t < hop1) {
          var v = ease((t - hop0) / (hop1 - hop0)), b = handAt("out");
          sx = palm[0] + (b[0] - palm[0]) * v; sy = palm[1] + (b[1] - palm[1]) * v - Math.sin(Math.PI * v) * 120;
          rot = -360 * v;
        } else {
          var hn = t < tBut + 0.05 ? (t < hop1 + 0.12 ? "out" : "hold") : t < tProb + 0.35 ? "check" : "chew";
          var hh = handAt(hn); sx = hh[0]; sy = hh[1];
          if (t > tBut && t < tProb + 0.2) { var w = (t - tBut) / (tProb + 0.2 - tBut); sclY = Math.cos(w * Math.PI * 2); rot = Math.sin(w * Math.PI * 2) * 10; }
        }
        sandEl.setAttribute("transform", "translate(" + f(sx) + "," + f(sy) + ")");
        // it pops into being on her palm, a conjuring trick (a back-out scale)
        var pu = Math.min(1, Math.max(0, (t - tGive - 0.1) / 0.3)), c1 = 2.2, pop = 1 + (c1 + 1) * Math.pow(pu - 1, 3) + c1 * Math.pow(pu - 1, 2);
        sandIn.setAttribute("transform", "rotate(" + rot.toFixed(1) + ") scale(" + pop.toFixed(3) + "," + (pop * sclY).toFixed(3) + ")");
        sandEl.setAttribute("opacity", vis ? 1 : 0);
        if (t > tProb + 0.38) sandBody.setAttribute("clip-path", "url(#" + ID + "-bite)"); else sandBody.removeAttribute("clip-path");
      });

      // ── The iris closes on her face after "you.", and the film ends on black.
      KIT.iris(tl, ID, q("iris"), S.face, "out", KIT.cueEnd(ID, "you.") + 0.06, D - 0.06);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
