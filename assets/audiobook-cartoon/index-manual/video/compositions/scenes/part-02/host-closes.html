<template id="host-closes-template">
  <!-- host-closes · collage host shot (Part 2, scene 5), no seam from the-toll: the same plate, on paper over her deck.
       "On": back to the whole machine. "skip": the weapons factory, the JOBS factory and the number drop out of it, the
       bones sink and the city of tomorrow rises in their place: everyone you killed built it. The rubble is gone and the
       stand is a market of tomorrow; the bills' missile seals turn to crosses. "mass": they go straight from the press to
       the family; "step,": they buy food and stand there with their arms full. 23.2x RICHER is the book's number for never
       having paid for the murder (war_counterfactual_income_multiple). The Fed keeps cranking. "too": cut to her at the
       console; she side-eyes the camera once she has finished speaking. Iris out.
       The plate (the Fed, the weapons factory, the house, the JOBS window, the farm stand, the hill of bones and the
       city of tomorrow) is shared word for word by money-loop.html, the-toll.html and host-closes.html, in plate time
       from "You": change all three together. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="host-closes" data-width="1920" data-height="1080" data-start="0" data-duration="5.752">
    <div id="host-closes-weave"></div>
    <div id="host-closes-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    (function () {
    var ID = "host-closes", SEED = 232;
    // the aged paper (collage.js's PAPER), for the host shot's paper over the deck
    var PAPER = "radial-gradient(circle at 17% 80%, rgba(140,96,40,0.16) 0, rgba(140,96,40,0) 8%)," +
      "radial-gradient(circle at 86% 18%, rgba(140,96,40,0.13) 0, rgba(140,96,40,0) 6%)," +
      "radial-gradient(ellipse 30% 22% at 70% 86%, rgba(120,80,30,0.10) 0, rgba(120,80,30,0) 100%)," +
      "radial-gradient(ellipse 62% 58% at 50% 44%, #F3E7C8 0%, #E8D7AF 55%, #CDB283 100%)";
    (function () {
      var V = KIT.V, HOST = ID === "host-closes";
      // Plate time: every beat is written in seconds from "You" (money-loop's start) or on a word counted from there, as in
      // the short, and each scene plays its own stretch of the one plate, so they cut with no seam.
      var L0 = KIT.scene("money-loop").start, T0 = KIT.scene(ID).start, D = KIT.scene(ID).duration;
      var TOO = KIT.scene("host-closes").start + KIT.cue("host-closes", "too");
      var norm = function (s) { return s.toLowerCase().replace(/[^a-z0-9%$]/g, ""); };
      var wordAt = function (text, n) {
        var want = norm(text), c = n || 1, ws = window.HF_PART.words;
        for (var i = 0; i < ws.length; i++) if (ws[i].s >= L0 - 0.05 && ws[i].s < TOO && norm(ws[i].w) === want && --c === 0) return ws[i].s;
        throw new Error("Part 2 plate: no word '" + text + "' (" + (n || 1) + ")");
      };

      // The machine, left to right on the ground line G (plate px): the Fed, the weapons factory, house, JOBS window, farm stand.
      var G = 1000;
      var X = { pol: 300, press: 950, wm: 1950, house: 2650, fam: 3000, factory: 3750, stand: 4450, farmer: 4850 };
      var FK = 2.0, WK = 1.63;                                           // the Fed's and the weapons factory's scales
      var TRAY = [X.press + 240 * FK, G - 95 * FK];                    // the Fed's tray end (art 489, 287)
      var HANDS = [X.wm, G - 300 * WK];                                // in front of the weapons factory's door
      var WINDOW = [X.factory - 78, G - 139];                          // the pay window (art 100, 450)
      // Close views fill the frame with one stop and keep the ground above the captions (16:9: y 890; the house pulls back for
      // the whole mushroom cloud).
      var cy = function (s) { return V ? G - 420 / s : 620; };
      var views = V ? {
        press: [760, cy(0.75), 0.75], wm: [1950, cy(0.95), 0.95], house: [2830, cy(0.95), 0.95], jobs: [3520, cy(0.95), 0.95],
        farm: [4400, cy(0.82), 0.82], wide: [2750, 900, 0.186], toll: [2750, 1500, 0.15], utopia: [3700, 200, 0.38],
      } : {
        press: [760, 650, 1], wm: [1950, 650, 1], house: [2850, 610, 0.85], jobs: [3500, 650, 1], farm: [4500, 650, 1],
        wide: [2720, 180, 0.37], toll: [2750, 1450, 0.19], utopia: [2750, 130, 0.33],
      };
      views.host = [KIT.W / 2, KIT.H / 2, 1];                          // the plain frame: her console, after the cut
      var famEyes = [[109, 36], [126, 38], [169, 63], [187, 66], [133, 167], [150, 167]];
      var S = KIT.collage.SIZES, CITY_W = 6100;
      var FAMG = 1100 / S["family-groceries"][1], MARKET = V ? 4560 : 4620;
      var beats = [];
      var add = function (b) { beats.push(b); };

      // The Fed never stops cranking: arm up, arm down, every 0.3 s, until the cut to her.
      for (var t = 0.15, up = true; L0 + t < TOO; t += 0.3, up = !up) { add({ at: t, do: "hide", who: up ? "fedUp" : "fedDn" }); add({ at: t, do: "show", who: up ? "fedDn" : "fedUp" }); }
      // Four bills shoot out of the empty tray, one a pump, and land in a queue.
      ["b0", "b1", "b2", "b3"].forEach(function (b, i) {
        add({ at: 0.2 + i * 0.6, do: "pop", who: b });
        add({ at: 0.28 + i * 0.6, do: "move", who: b, to: [TRAY[0] + 120 + i * 125, G - 110], dur: 0.33, arc: 90 });
        // "nothing-papers": they march into the weapons factory's door and vanish there
        add({ on: "nothing-papers", offset: i * 0.3, do: "move", who: b, to: HANDS, dur: 0.75, arc: 30 });
        add({ on: "nothing-papers", offset: 0.75 + i * 0.3, do: "pop", who: b, out: true });
      });

      beats = beats.concat([
        { on: "(called", do: "stamp", id: "policy", text: "MONETARY POLICY", x: X.press + 20, y: G - 382 * FK - 70, size: 80, width: 700, tilt: -3 },
        { on: "give", n: 1, do: "camera", view: "wm", dur: 1.1 },
        { on: "makers.", do: "swap", who: "wm", to: "wmPay" },
        { on: "They", do: "swap", who: "wmPay", to: "wmKiss" },
        // "destroy": the missile flies; the camera whips with it to the waving family
        { on: "destroy", do: "swap", who: "wmKiss", to: "wmPay2" },
        { on: "destroy", do: "pop", who: "missile" },
        { on: "destroy", do: "move", who: "missile", to: [X.house, G - 380], dur: 0.38, arc: 120, turn: 20 },
        { on: "destroy", do: "camera", view: "house", dur: 0.38 },
        { on: "everything.", do: "hide", who: "missile" },
        { on: "everything.", do: "boom", shake: 22, flash: 0.2 },
        { on: "everything.", do: "pop", who: "m1" },
        { on: "everything.", do: "swap", who: "house", to: "rubble" },
        { on: "everything.", do: "char", who: "fam" },
        { on: "everything.", offset: 0.9, do: "blink", who: "fam" },
        { on: "everything.", offset: 1.4, do: "pop", who: "m1", out: true },
        // "jobs": the charred family walks to the pay window; a tattooed arm hands out the bills
        { on: "This", n: 1, do: "camera", view: "jobs", dur: 0.9 },
        { on: "This", n: 1, do: "move", who: "fam", to: [3300, G - 329], dur: 1.0 },
        { on: "This", n: 1, offset: 0.6, do: "banner", id: "jobs", text: "JOBS", x: WINDOW[0], y: WINDOW[1] - 290, size: 90, width: 320, pad: 50, color: "ink", tilt: -3 },
        { on: "which", n: 1, do: "slideIn", who: "arm", from: "right", dist: 220, over: 10 },
        { on: "papers.", n: 2, do: "pop", who: "c0" }, { on: "papers.", n: 2, offset: 0.15, do: "pop", who: "c1" }, { on: "papers.", n: 2, offset: 0.3, do: "pop", who: "c2" },
        { on: "papers.", n: 2, offset: 0.6, do: "slideOut", who: "arm", to: "right", dist: 300 },
        // "buy food": to the farm stand; three bills for one loaf
        { on: "People", n: 2, do: "camera", view: "farm", dur: 0.9 },
        { on: "People", n: 2, do: "move", who: "fam", to: [3950, G - 329], dur: 1.0 },
        { on: "People", n: 2, do: "move", who: ["c0", "c1", "c2"], by: [650, 0], dur: 1.0 },
        { on: "buy", do: "move", who: "c0", to: [X.farmer + 90, G - 470], dur: 0.35, arc: 50 },
        { on: "buy", offset: 0.12, do: "move", who: "c1", to: [X.farmer + 110, G - 450], dur: 0.35, arc: 50 },
        { on: "buy", offset: 0.24, do: "move", who: "c2", to: [X.farmer + 130, G - 430], dur: 0.35, arc: 50 },
        { on: "food.", offset: 0.1, do: "pop", who: "loaf", squash: true },
        { on: "food.", offset: 0.3, do: "bob", who: "fam", y: 4, r: 1, speed: 3 },
        // "This is called the economy": the whole machine at once, and it runs another lap, faster
        { on: "called", n: 2, offset: -0.2, do: "camera", view: "wide", dur: 1.3 },
        { on: "called", n: 2, offset: 0.6, do: "banner", id: "economy", text: "THE ECONOMY", x: 2750, y: V ? -700 : -250, size: V ? 520 : 400, width: V ? 5200 : 3400, pad: 160, color: "ink", tilt: -2 },
        { on: "called", n: 2, offset: 0.5, do: "move", who: ["c0", "c1", "c2"], to: [TRAY[0] + 150, G + 70], dur: 2.4 },
        { on: "called", n: 2, offset: 1.0, do: "swap", who: "rubble", to: "house2" },
        { on: "called", n: 2, offset: 1.3, do: "swap", who: "wmPay2", to: "wmKiss2" },
        { on: "called", n: 2, offset: 1.7, do: "swap", who: "wmKiss2", to: "wmPay3" },
        { on: "called", n: 2, offset: 1.7, do: "pop", who: "missile2" },
        { on: "called", n: 2, offset: 1.75, do: "move", who: "missile2", to: [X.house, G - 380], dur: 0.3, arc: 120, turn: 20 },
        { on: "called", n: 2, offset: 2.05, do: "hide", who: "missile2" },
        { on: "called", n: 2, offset: 2.05, do: "boom", shake: 12, flash: 0.12 },
        { on: "called", n: 2, offset: 2.05, do: "pop", who: "m2" },
        { on: "called", n: 2, offset: 2.05, do: "swap", who: "house2", to: "rubble2" },
        { on: "called", n: 2, offset: 3.0, do: "pop", who: "m2", out: true },
        // "killed": the hill of bones rises under the machine; 310,000,000
        { on: "that", n: 2, do: "camera", view: "toll", dur: 1.4 },
        { on: "that", n: 2, do: "slideIn", who: "hill", from: "bottom", dist: 2600, over: 40 },
        { on: "killed", do: "shake", y: 6, frames: 3 },
        { on: "million", do: "stamp", id: "toll", text: "310,000,000", x: 2750, y: 1850, size: V ? 950 : 900, width: 7000, tilt: -4 },
        // "skip the mass murder step": the same machine, without the murder, and everyone you didn't kill built a city
        { on: "On", do: "camera", view: "wide", dur: 0.7 },
        { on: "skip", do: "drop", who: ["wmPay3", "factory"], dist: V ? 5600 : 2600, spin: 10, dur: 0.55 },
        { on: "skip", do: "slideOut", who: "hill", to: "bottom", dist: V ? 6000 : 2600, dur: 0.55 },
        { on: "skip", do: "hide", who: ["toll", "jobs", "loaf"] },
        { on: "skip", offset: 0.1, do: "slideIn", who: "city", from: "bottom", dist: V ? 3400 : 2500, over: 14 },
        { on: "skip", offset: 0.25, do: "camera", view: "utopia", dur: 0.6 },
        { on: "skip", offset: 0.2, do: "hide", who: "rubble2" },
        { on: "skip", offset: 0.2, do: "swap", who: "stand", to: "marketT" },
        { on: "skip", offset: 0.2, do: "swap", who: "fam", to: "fam2" },
        { on: "skip", offset: 0.4, do: "show", who: "car" },
        { on: "skip", offset: 0.4, do: "move", who: "car", to: [6500, -470], dur: 2.8 },
        { on: "mass", offset: -0.2, do: "hide", who: "economy" },
        { on: "mass", offset: -0.2, do: "banner", id: "richer", text: "23.2× RICHER", x: V ? 3700 : 2750, y: V ? -1330 : -900, size: V ? 340 : 400, width: V ? 2500 : 3400, pad: 160, color: "ink", tilt: -2 },
        { on: "skip", offset: 0.35, do: "swap", who: "c0", to: "d0" }, { on: "skip", offset: 0.45, do: "swap", who: "c1", to: "d1" }, { on: "skip", offset: 0.55, do: "swap", who: "c2", to: "d2" },
        { on: "mass", offset: -0.15, do: "move", who: "d0", to: [3550, G - 1250], dur: 0.42, arc: 160 },
        { on: "mass", offset: -0.05, do: "move", who: "d1", to: [3800, G - 1320], dur: 0.42, arc: 160 },
        { on: "mass", offset: 0.05, do: "move", who: "d2", to: [4050, G - 1250], dur: 0.42, arc: 160 },
        { on: "step,", offset: -0.1, do: "move", who: "d0", to: [MARKET - 90, G - 700], dur: 0.28, arc: 50 },
        { on: "step,", do: "move", who: "d1", to: [MARKET, G - 680], dur: 0.28, arc: 50 },
        { on: "step,", offset: 0.1, do: "move", who: "d2", to: [MARKET + 90, G - 700], dur: 0.28, arc: 50 },
        { on: "step,", offset: 0.38, do: "hide", who: ["d0", "d1", "d2"] },
        { on: "step,", offset: 0.3, do: "swap", who: "fam2", to: "famG" },
        { on: "step,", offset: 0.5, do: "bob", who: "famG", y: 6, r: 1.2, speed: 3 },
      ]);

      var bill = function (x, y) { return { art: "bill-war", x: x, y: y, scale: 0.85, hidden: true }; };
      var med = function (x, y) { return { art: "bill-med", x: x, y: y, scale: 0.85, hidden: true }; };
      var cast = {
        hill: { art: "bone-hill", x: 2750, y: G - 20, anchor: "top", scale: 9350 / S["bone-hill"][0], hidden: true },
        city: { art: "city-of-tomorrow", x: 2750, y: G + 40, anchor: "bottom", scale: CITY_W / S["city-of-tomorrow"][0], hidden: true },
        fedUp: { art: "fed-crank-up", x: X.press, y: G, anchor: "bottom", scale: FK },
        fedDn: { art: "fed-crank-down", x: X.press - 3, y: G, anchor: "bottom", scale: FK, hidden: true },
        b0: bill(TRAY[0], TRAY[1]), b1: bill(TRAY[0], TRAY[1]), b2: bill(TRAY[0], TRAY[1]), b3: bill(TRAY[0], TRAY[1]),
        wm: { art: "factory-proud", x: X.wm, y: G, anchor: "bottom", scale: WK },
        wmPay: { art: "factory-pay", x: X.wm, y: G, anchor: "bottom", scale: WK, hidden: true },
        wmKiss: { art: "factory-kiss", x: X.wm, y: G, anchor: "bottom", scale: WK, hidden: true },
        wmPay2: { art: "factory-pay", x: X.wm, y: G, anchor: "bottom", scale: WK, hidden: true },
        wmKiss2: { art: "factory-kiss", x: X.wm, y: G, anchor: "bottom", scale: WK, hidden: true },
        wmPay3: { art: "factory-pay", x: X.wm, y: G, anchor: "bottom", scale: WK, hidden: true },
        house: { art: "house", x: X.house, y: G, anchor: "bottom", scale: 1.6 },
        rubble: { art: "rubble", x: X.house, y: G, anchor: "bottom", scale: 1.0, hidden: true },
        house2: { art: "house", x: X.house, y: G, anchor: "bottom", scale: 1.6, hidden: true },
        rubble2: { art: "rubble", x: X.house, y: G, anchor: "bottom", scale: 1.0, hidden: true },
        factory: { art: "factory", x: X.factory, y: G, anchor: "bottom", scale: 1.4 },
        arm: { art: "tattoo-arm", x: WINDOW[0] - 110, y: WINDOW[1] + 10, scale: 1.2, hidden: true },
        stand: { art: "farm-stand", x: X.stand, y: G, anchor: "bottom", scale: 1.7 },
        farmer: { art: "farmer", x: X.farmer, y: G, anchor: "bottom", scale: 1.6 },
        fam: { art: "family-wave", x: X.fam, y: G - 329, scale: 1.5, eyes: famEyes, eyeSize: 22, smoke: [[100, 20], [190, 34]] },
        loaf: { art: "loaf", x: 3825, y: G - 360, scale: 1.3, hidden: true },
        fam2: { art: "family-wave", x: 3950, y: G - 329, scale: 1.5, hidden: true },
        famG: { art: "family-groceries", x: 3800, y: G + 10, anchor: "bottom", scale: FAMG, hidden: true },
        marketT: { art: "market-of-tomorrow", x: MARKET, y: G + 10, anchor: "bottom", scale: 2.5, hidden: true },
        car: { art: "flying-car", x: -500, y: -470, scale: 1.7, hidden: true },
        c0: bill(3170, G - 760), c1: bill(3310, G - 790), c2: bill(3450, G - 760),
        // the same bills with the cross seal, where the second lap leaves them at the press
        d0: med(TRAY[0] + 150, G + 70), d1: med(TRAY[0] + 150, G + 70), d2: med(TRAY[0] + 150, G + 70),
        missile: { art: "missile-fly", x: X.wm, y: G - 478 * WK, scale: 1.3, hidden: true },
        missile2: { art: "missile-fly", x: X.wm, y: G - 478 * WK, scale: 1.3, hidden: true },
        m1: { art: "mushroom", x: X.house, y: G, anchor: "bottom", scale: 1.6, hidden: true },
        m2: { art: "mushroom", x: X.house, y: G, anchor: "bottom", scale: 1.6, hidden: true },
      };

      // host-closes: the plate is drawn on paper laid over her deck; "too" takes the paper away and the console is there.
      if (HOST) {
        beats.unshift({ at: -1, do: "wash", id: "paper", color: PAPER, blend: "normal", opacity: 1, dur: 0.01 });
        beats.push({ on: "too", do: "hide", who: Object.keys(cast).concat(["policy", "economy", "richer"]) });
        beats.push({ on: "too", do: "wash", id: "paper", opacity: 0, dur: 0.01 });
        beats.push({ on: "too", do: "camera", view: "host", dur: 0.01 });
      }
      // Plate time to this scene's time.
      beats.forEach(function (b) {
        b.at = (b.on !== undefined ? wordAt(b.on, b.n) : L0 + b.at) - T0;
        delete b.on; delete b.n;
      });

      KIT.collage({
        id: ID, seed: SEED, plate: V ? [-4500, -5500, 10000, 8600] : [-2600, -2200, 8100, 4600], views: views, view: "press", cast: cast, beats: beats,
        host: HOST ? { push: [1, 1.04], iris: ["out", D - 0.55, D - 0.05] } : undefined,
      });
    })();
    })();
  </script>
</template>
