<template id="food-directly-template">
  <!-- food-directly · Layer A (storyboards/part-02-the-human-economy.md): the camera pulls out of the wall screen, which
       still shows economy-310-million's held frame (the gray circle, its headstones and grinning skeletons, the green
       papers, the hanging missile, 310,000,000), and the picture closes in on the circle. "skip" → a hungry human in
       full color walks in front of the circle, his pockets turned out, his belly growling. "give" → Wishonia flings a
       tall club sandwich up from behind the desk into the screen; it flies in a straight line across the middle of the
       circle, over the number, and lands in his hands on "directly,". He turns it over looking for the price tag and
       pats his empty pockets. "but" → her mug floats up and she sips. "probably" → every skeleton in the circle turns
       its skull, two at a time, to stare at the sandwich. "advanced" → he shrugs and takes an enormous bite, and
       chews, delighted. "you." → the mug goes down slowly (the thunk); her side-eye is in the part file.

       The hungry human comes back in Part 4 (debug-37-trillion-cells), eating this sandwich. Draw him with:
         KIT.person({ tone: 1, outfit: "shirt", color: 2, plain: true, mood: "worried", look: "right",
                      build: { tw: 0.72, legs: 1.2, neck: 1.5, hs: 0.86 } })
       (a skinny everyday human in a short-sleeved tan shirt; kind "twig" would put him in the Orderly's scrubs)
       plus his two white turned-out pocket flaps at the hips (pockets() below), at about 1.3 (16:9) / 1.25 (9:16)
       Earth scale. The sandwich is sandwich() below: toast, roast beef, cheese, toast, tomato, lettuce, toast, a

       The circle's drawing (ecoCircle) is copied verbatim from economy-circle.html: change all three copies together. -->
  <style>

  <script>
    (function () {
      var ID = "food-directly";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;

      // ══ The economy circle (storyboards/part-02-the-human-economy.md, "Spine"). This function is copied verbatim
      // into economy-circle.html, economy-310-million.html and food-directly.html: change all three together. ══
      // ecoCircle(pid) draws the circle as economy-circle leaves it (state b): the ring track, five stations on their
      // plaques (1 the printing press and the Politician at its crank, 2 the WEAPONS factory with the Weapons Maker in
      // its door and its conveyor, 3 the town bombed flat, 4 the JOBS pay window, 5 the farm stand with its farmer and
      // its priced wheat), the charred family in hard hats at the farm stand with their loaves, the banner, a closed
      // ring of 18 walking war-seal papers led by the 1ST PRIZE paper, and the next missile in the air.
      // Hidden in the same picture: the drained copy of every station (each fill a gray between navy and paper, each
      // human a grinning skeleton in the same pose), the 32 headstones and the death toll (economy-310-million).
      // Returns { L, svg, pose(T), ... }: pose(T) puts the moving parts (the papers, the crank, the press plate, the
      // Politician's arm, the Weapons Maker's eyes, the flying missile) where they are at part time T.
      function ecoCircle(pid) {
        var C = KIT.C, V = KIT.V, ink = C.line, WHITE = "#FBF6E6";
        var Q = function (s) { return pid + "-" + s; };
        var f = function (n) { return (+n).toFixed(1); };
        var EC = "economy-circle", CS = KIT.scene(EC).start;
        var at = function (w, n) { return CS + KIT.cue(EC, w, n); }, after = function (w, n) { return CS + KIT.after(EC, w, n); };
        var FREEZE = KIT.scene("economy-310-million").start + KIT.cue("economy-310-million", "downside");

        // ── Layout, per shape ──
        // c, R: the ring (the papers' feet walk on R); ang: where each station meets the ring (degrees clockwise from
        // the top); ps: the papers' scale. Stations: [x, y (ground), scale]. plaques: [x, y, rx] (the ground spots).
        var L = V
          ? { c: [540, 905], R: 268, ps: 0.52, ang: { press: 318, fac: 45, town: 100, farm: 222 },
              press: [250, 560, 0.62], pol: 1.0, fac: [812, 622, 0.52], wm: [812, 617, 0.6], conv: [978, 622, 0.48, 200],
              houses: [[874, 975], [966, 975], [920, 1030]], hs: 0.21,
              fam: { s: 0.6, kid: 0.74, lawn: [[856, 1100], [918, 1103], [974, 1105]], queue: [[880, 1372], [935, 1375], [985, 1377]], stand: [[430, 1382], [492, 1384], [548, 1386]] },
              jobs: [790, 1362, 0.66], farm: [300, 1362, 0.7], wheat: [80, 178, 280], tagAt: [140, 1100],
              banner: [330, 820, 420, 74, 40], num: [540, 1010, 62], stone: 0.28,
              plaques: [[262, 566, 175], [812, 628, 150], [920, 1042, 108], [790, 1368, 100], [238, 1370, 182]],
              missile: { from: [1003, 570], peak: [660, 470], to: [330, 1110] } }
          : { c: [810, 455], R: 262, ps: 0.58, ang: { press: 300, fac: 55, town: 100, farm: 228 },
              press: [400, 325, 0.54], pol: 0.88, fac: [1150, 292, 0.55], wm: [1150, 287, 0.62], conv: [1342, 292, 0.5, 240],
              houses: [[1235, 615], [1390, 615], [1545, 615]], hs: 0.34,
              fam: { s: 0.62, kid: 0.74, lawn: [[1300, 700], [1375, 703], [1440, 705]], queue: [[1150, 832], [1215, 835], [1275, 837]], stand: [[565, 818], [630, 821], [690, 823]] },
              jobs: [1070, 822, 0.72], farm: [455, 795, 0.72], wheat: [95, 235, 300], tagAt: [190, 565],
              banner: [600, 375, 420, 82, 46], num: [810, 548, 64], stone: 0.3,
              plaques: [[410, 331, 175], [1150, 298, 180], [1390, 622, 230], [1070, 828, 105], [330, 801, 260]],
              missile: { from: [1405, 230], peak: [900, 70], to: [470, 525] } };
        var cx = L.c[0], cy = L.c[1], R = L.R;
        function pt(th, r) { var a = (th * Math.PI) / 180; return [cx + (r || R) * Math.sin(a), cy - (r || R) * Math.cos(a)]; }
        function g(id, inner, attrs) { return '<g id="' + Q(id) + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
        function place(x, y, s, inner, flip) { return '<g transform="translate(' + f(x) + "," + f(y) + ") scale(" + (flip ? -s : s) + "," + s + ')">' + inner + "</g>"; }
        // a person stands with its feet at (x, y)
        function stand(x, y, s, inner) { return place(x, y - 100 * s, s, inner); }
        function poly(pts) { return "M" + pts.map(function (p) { return f(p[0]) + "," + f(p[1]); }).join(" L") + " Z"; }
        function solid(d, fill, w) { return '<path d="' + d + '" fill="' + fill + '" stroke="' + ink + '" stroke-width="' + (w || 3) + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }
        function line(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
        function text(x, y, size, t, fill, fam, extra) {
          return '<text x="' + f(x) + '" y="' + f(y) + '" text-anchor="middle" font-family="' + (fam || "Oswald") + '" font-weight="' + (fam === "Fraunces" ? 900 : 600) + '" font-size="' + f(size) + '" fill="' + (fill || ink) + '"' + (extra ? " " + extra : "") + ">" + t + "</text>";
        }
        function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }

        // ── The drain (economy-310-million): every color but the navy ink becomes a gray of the same lightness, mixed
        // from the navy and the paper; ids get a suffix so the copy does not clash with the original. ──
        var LINE = [17, 40, 69], PAPER = [243, 236, 208];
        function lum(r, gg, b) { return (0.3 * r + 0.59 * gg + 0.11 * b) / 255; }
        var L0 = lum(LINE[0], LINE[1], LINE[2]), L1 = lum(PAPER[0], PAPER[1], PAPER[2]);
        function grayOf(r, gg, b) {
          var k = Math.max(0, Math.min(1, (lum(r, gg, b) - L0) / (L1 - L0)));
          return "rgb(" + [0, 1, 2].map(function (i) { return Math.round(LINE[i] + (PAPER[i] - LINE[i]) * k); }).join(",") + ")";
        }
        function drain(markup) {
          var inkU = ink.toUpperCase();
          return markup.replace(/(fill|stroke)="(#[0-9A-Fa-f]{3,6})"/g, function (m, attr, col) {
            if (col.length === 4) col = "#" + col[1] + col[1] + col[2] + col[2] + col[3] + col[3];
            if (col.toUpperCase() === inkU) return m;
            var n = parseInt(col.slice(1), 16);
            return attr + '="' + grayOf(n >> 16, (n >> 8) & 255, n & 255) + '"';
          }).replace(/(fill|stroke)="rgb\((\d+),(\d+),(\d+)\)"/g, function (m, attr, r, gg, b) {
            return attr + '="' + grayOf(+r, +gg, +b) + '"';
          }).replace(/id="([^"]+)"/g, 'id="$1-x"').replace(/url\(#([^)]+)\)/g, "url(#$1-x)");
        }

        // ── Small drawings ──
        // A blank plaque: an engraved plinth whose top face is the ground spot (x, y).
        function plaque(x, y, rx) {
          var ry = rx * 0.15, h = 12;
          return solid("M" + f(x - rx) + "," + f(y) + " V" + f(y + h) + " A" + f(rx) + "," + f(ry) + " 0 0 0 " + f(x + rx) + "," + f(y + h) + " V" + f(y) + " Z", C.tan, 3) +
            '<ellipse cx="' + f(x) + '" cy="' + f(y) + '" rx="' + f(rx) + '" ry="' + f(ry) + '" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="3"/>' +
            '<ellipse cx="' + f(x) + '" cy="' + f(y) + '" rx="' + f(rx - 10) + '" ry="' + f(ry - 4) + '" fill="none" stroke="' + C.orange + '" stroke-width="1.6"/>';
        }
        // A bread loaf, about 40 x 22, standing on (0, 0). (The stand's top three loaves, 6 to 8, are the family's, so they
        // start hidden: economy-circle shows them until "buy".) bite: a bite out of its right end.
        function loaf(bite) {
          var pts = [[-20, 0], [-21, -8], [-15, -17], [-4, -21], [8, -20], [17, -15], [21, -6], [20, 0]];
          var out = solid(poly(pts), C.tan, 2.4) + '<path d="M-17,-3 Q0,1 17,-3" fill="none" stroke="' + C.rust + '" stroke-width="2"/>' +
            line("M-11,-15 l5,8 M-2,-18 l5,9 M7,-17 l5,8", C.cream, 2.2);
          if (bite) out += '<circle cx="22" cy="-13" r="6" fill="' + C.paper + '"/><circle cx="19" cy="-6" r="5" fill="' + C.paper + '"/>' +
            '<path d="M17.5,-19 A6,6 0 0 0 16.2,-9.6 A5,5 0 0 0 17,-1.2" fill="none" stroke="' + ink + '" stroke-width="2"/>';
          return out;
        }
        // A yellow hard hat whose brim sits on (0, 0), w wide.
        function hardHat(w) {
          var k = w / 60;
          return '<g transform="scale(' + f(k) + ')">' + solid(poly([[-23, 0], [-18, -18], [0, -25], [18, -18], [23, 0]]), C.yellow, 2.6) +
            solid(poly([[-30, 3], [-26, -2], [26, -2], [30, 3]]), C.yellow, 2.2) + line("M0,-24 V-3", C.orange, 2) + "</g>";
        }
        // A war-seal paper without legs, w wide (held in a hand).
        function heldBill(w) {
          return '<g transform="scale(' + f(w / 96) + ')"><rect x="-48" y="-25" width="96" height="50" rx="4" fill="' + C.money + '" stroke="' + ink + '" stroke-width="5"/>' +
            '<ellipse cx="0" cy="0" rx="13" ry="15" fill="' + C.paper + '" stroke="' + C.moneyDark + '" stroke-width="3"/>' + KIT.moneySeal("war", 31, 0, 11) + "</g>";
        }
        // The Weapons Maker's cradled missile (kit.js draws it in his arms; the skeleton needs its own copy).
        function babyMissile() {
          var s = function (pts, col) { return solid(poly(pts), col, 2.6); };
          return '<g transform="translate(0,-6) rotate(-14)">' + s([[-34, -7], [14, -7], [30, 0], [14, 7], [-34, 7]], C.war) + s([[-34, -7], [-44, -17], [-40, -7]], C.war) + s([[-34, 7], [-44, 17], [-40, 7]], C.war) +
            '<path d="M14,-7 L30,0 L14,7 Z" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="2"/>' + line("M-4,2 Q2,6 8,2", ink, 1.8) +
            '<circle cx="-2" cy="-2.5" r="1.6" fill="' + ink + '"/><circle cx="6" cy="-2.5" r="1.6" fill="' + ink + '"/></g>';
        }
        // The moth from Part 1's empty wallet (without-with-papers).
        var moth = '<g id="' + Q("moth") + '" opacity="0"><g id="' + Q("moth-w") + '"><path d="M0,0 l-10,-7 l2,10 Z M0,0 l10,-7 l-2,10 Z" fill="#E9E1CC" stroke="' + ink + '" stroke-width="1.8" stroke-linejoin="round"/></g>' +
          '<ellipse rx="1.8" ry="4.5" fill="' + ink + '"/></g>';
        // The self-growing wheat from Part 1 (without-with-papers): one stalk, hf tall, at x.
        function stalk(x, hf) {
          var st = 'stroke="' + ink + '" stroke-width="2" stroke-linejoin="round"';
          var out = '<path d="M' + f(x) + ",0 V" + f(-hf) + '" stroke="' + ink + '" stroke-width="3.5" stroke-linecap="round"/>';
          [[0.42, 1], [0.64, -1]].forEach(function (lf) {
            var ly = -hf * lf[0];
            out += '<path d="M' + f(x) + "," + f(ly) + " q" + 14 * lf[1] + ",-6 " + 20 * lf[1] + ",-24 q" + -14 * lf[1] + ",4 " + -20 * lf[1] + ',24 Z" fill="' + C.tan + '" ' + st + "/>";
          });
          for (var k = 0; k < 5; k++) {
            var ky = -hf - 6 - k * 9, side = k % 2 ? 1 : -1;
            out += '<ellipse cx="' + f(x + side * 5) + '" cy="' + f(ky) + '" rx="6" ry="9" fill="' + C.yellow + '" ' + st + ' transform="rotate(' + side * 24 + " " + f(x + side * 5) + " " + f(ky) + ')"/>' +
              '<path d="M' + f(x + side * 8) + "," + f(ky - 6) + " l" + side * 6 + ',-10" stroke="' + ink + '" stroke-width="1.5"/>';
          }
          return out + '<ellipse cx="' + f(x) + '" cy="' + f(-hf - 52) + '" rx="4.5" ry="7" fill="' + C.yellow + '" ' + st + "/>";
        }
        // Cut one <g class="cls"> (with everything nested in it) out of a person's markup: [before, group, after].
        function cutGroup(svg, cls) {
          var start = svg.indexOf('<g class="' + cls + '"'), i = start, depth = 0;
          if (start < 0) throw new Error("cutGroup: no " + cls);
          var re = /<g[\s>]|<\/g>/g;
          re.lastIndex = start;
          var m;
          while ((m = re.exec(svg))) {
            depth += m[0] === "</g>" ? -1 : 1;
            if (depth === 0) { i = m.index + 4; break; }
          }
          return [svg.slice(0, start), svg.slice(start, i), svg.slice(i)];
        }
        // An arm reaching from the shoulder S to the point H (person units), elbow down: [upper, fore] angles.
        function reach(S, H, len) {
          var dx = H[0] - S[0], dy = H[1] - S[1], d = Math.min(Math.hypot(dx, dy), 2 * len * 0.995);
          var base = (Math.atan2(dx, dy) * 180) / Math.PI, al = (Math.acos(d / (2 * len)) * 180) / Math.PI;
          var elbowY = function (a1) { return Math.cos((a1 * Math.PI) / 180); };
          return elbowY(base - al) >= elbowY(base + al) ? [base - al, base + al] : [base + al, base - al];
        }

        // ── 1. The printing press (mirrored, its crank on the left) and the Politician at the crank ──
        var PR = L.press, ps = PR[2], CP = 0.575, PRINT0 = at("papers");
        var axle = [PR[0] - 136 * ps, PR[1] - 150 * ps];
        var polO = KIT.castOpts("politician", { look: "right", arms: [[-40, 40], [60, 120]] }), polR = KIT.rig(polO), sp = L.pol;
        // he stands where the crank's axle is just in front of his right shoulder (his feet below the plaque)
        var SH = polR.shoulder[1], polAt = [axle[0] - sp * (SH[0] + 15), axle[1] + 100 * sp - sp * (SH[1] + 5)];
        function knob(phi) {
          var a = (phi * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a);
          return [PR[0] - ps * (136 + 42 * c + 33 * s), PR[1] + ps * (-150 + 42 * s - 33 * c)];
        }
        function polArms(phi) {
          var k = knob(phi), H = [(k[0] - polAt[0]) / sp, (k[1] - (polAt[1] - 100 * sp)) / sp];
          return [[-40, 40], reach(SH, H, polR.armLength)];
        }
        // eight drawings of his crank arm, one per 45 degrees of the crank
        function polDraw(o, dead) {
          var base = cutGroup(KIT.person(mix(o, dead ? { skeleton: true } : {})), "arm-r"), arms = "";
          for (var i = 0; i < 8; i++) arms += '<g class="pol-arm" data-i="' + i + '" opacity="0">' + cutGroup(KIT.person(mix(o, { arms: polArms(i * 45), skeleton: !!dead })), "arm-r")[1] + "</g>";
          return base[0] + arms + base[2];
        }
        var press = KIT.props.printingPress({ seal: "war", tray: 0 });
        // the MONETARY POLICY plaque, screwed on over the empty tray (on the right, the press being mirrored)
        var MP = [PR[0] + 92 * ps, PR[1] - 190 * ps], mpW = V ? 128 : 150, mpH = V ? 50 : 56;
        var screws = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(function (s, i) {
          var x = s[0] * (mpW / 2 - 9), y = s[1] * (mpH / 2 - 9);
          return '<g transform="translate(' + f(x) + "," + f(y) + ')"><g class="eco-screw"><circle r="4" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="1.6"/>' + line("M-2.6,0 H2.6", ink, 1.4) + "</g></g>";
        }).join("");
        var mpArt = '<g transform="translate(' + f(MP[0]) + "," + f(MP[1]) + ')">' + g("mp", '<g transform="rotate(-4)">' +
          '<rect x="' + f(-mpW / 2 + 5) + '" y="' + f(-mpH / 2 + 6) + '" width="' + mpW + '" height="' + mpH + '" fill="' + C.ink + '" opacity="0.8"/>' +
          '<rect x="' + f(-mpW / 2) + '" y="' + f(-mpH / 2) + '" width="' + mpW + '" height="' + mpH + '" rx="3" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="3"/>' +
          '<rect x="' + f(-mpW / 2 + 5) + '" y="' + f(-mpH / 2 + 5) + '" width="' + (mpW - 10) + '" height="' + (mpH - 10) + '" fill="none" stroke="' + C.rust + '" stroke-width="1.4"/>' +
          text(0, -mpH * 0.06, mpH * 0.36, "MONETARY", ink, "Oswald", 'letter-spacing="1.5"') + text(0, mpH * 0.34, mpH * 0.36, "POLICY", ink, "Oswald", 'letter-spacing="1.5"') + screws + "</g>") + "</g>";
        function station1(dead) {
          var p = place(PR[0], PR[1], ps, press, true) + mpArt;
          var pol = stand(polAt[0], polAt[1], sp, polDraw(polO, dead));
          var out = g("press", p) + g("pol", pol);
          return dead ? out : out + '<g transform="translate(' + f(PR[0] + 148 * ps) + "," + f(PR[1] - 210 * ps) + ')">' + moth + "</g>";
        }

        // ── 2. The factory, the Weapons Maker in its door, the conveyor and its smiling missiles ──
        var FA = L.fac, fs = FA[2], WM = L.wm, CV = L.conv;
        var factory = KIT.props.factory({}).replace('<g class="factory-door" data-ox="0" data-oy="-172">', '<g class="factory-door" data-ox="0" data-oy="-172" transform="translate(0,-172) scale(1,0.06) translate(0,172)">');
        var wmO = KIT.castOpts("weaponsMaker", {}), conveyor = KIT.props.conveyor({ w: CV[3] });
        var cmS = V ? 0.3 : 0.36, beltTop = CV[1] - 66 * CV[2];
        // a smiling missile with a price tag swinging from its nose, standing on (0, 0)
        function tagMissile(arms) {
          return KIT.props.missile({ size: cmS, mood: "smile", arms: arms }) + '<g transform="translate(0,' + f(-158 * cmS) + ") scale(" + f(cmS * 1.25) + ')">' + KIT.props.priceTag({ text: "$9,999,999", angle: 70 }) + "</g>";
        }
        var CM = [0, 1, 2].map(function (i) { return [CV[0] + (i - 1) * (CV[3] * CV[2] * 0.36), beltTop]; });
        function station2(dead) {
          var wr2 = KIT.rig(wmO).handLocal, wm = dead ? '<g class="wm-dead">' + KIT.person(mix(wmO, { skeleton: true })) +
            '<g transform="translate(' + f((wr2[0][0] + wr2[1][0]) / 2) + "," + f((wr2[0][1] + wr2[1][1]) / 2 + 2) + ')">' + babyMissile() + "</g></g>"
            : '<g class="wm-grin">' + KIT.person(mix(wmO, { mood: "grin" })) + '</g><g class="wm-greedy" opacity="0">' + KIT.person(mix(wmO, { mood: "greedy" })) + "</g>";

      // ── "On": the pull-out of the wall screen (the whoosh), then the picture closes in on the circle ──
      KIT.mountWishonia(tl, q("wish"), { scene: ID, x: L.wish.x, y: L.wish.y, w: L.wish.w });
      KIT.enter(tl, q("cam"), "zoom out of the wall screen", zv);
      tl.to(q("mini"), { x: (b[0] - a0[0]) / m, y: (b[1] - a0[1]) / m, scale: kz / m, svgOrigin: "0 0", duration: 0.35, ease: "power2.inOut" }, 0.6);

      // ── "skip": the hungry human walks in from the left (the footsteps), legs swinging, and stops in front of the
      // circle; his belly growls twice ──
      var visL = toEarth([hole[0], 0])[0], x0 = visL - 40 * HS, walk0 = T.skip, walk1 = T.skip + 0.85;
      set(q("man-pos"), 0, 0);
      set(q("man-pos"), 1, walk0);
      // (his position is a function of time, set with the sandwich's below)
      gsap.set(q("man"), { svgOrigin: "0 100" });
      var stand = hp("stand"), nSteps = 6;
      [[".leg-l", HR.hip[0], 24], [".leg-r", HR.hip[1], -24], [".arm-l", SH[0], -18], [".arm-r", SH[1], 18]].forEach(function (p) {
        var el = stand.querySelector(p[0]);
        gsap.set(el, { svgOrigin: p[1].join(" ") });
        tl.fromTo(el, { rotation: -p[2] }, { rotation: p[2], duration: (walk1 - walk0) / nSteps, repeat: nSteps - 1, yoyo: true, ease: "sine.inOut" }, walk0);
        tl.to(el, { rotation: 0, duration: 0.1, ease: "power1.out" }, walk1);
      });
      tl.fromTo(q("man"), { y: 0 }, { y: -4, duration: (walk1 - walk0) / nSteps, repeat: nSteps - 1, yoyo: true, ease: "sine.inOut" }, walk0);
      tl.to(q("man"), { y: 0, duration: 0.1 }, walk1);
      var gr = stand.querySelector(".hd-growl");
      [walk1 + 0.15, walk1 + 0.6].forEach(function (t) {
        set(gr, 1, t);
        tl.fromTo(gr, { x: -2 }, { x: 2, duration: 0.05, repeat: 5, yoyo: true, ease: "none" }, t);
        set(gr, 0, t + 0.3);
        tl.fromTo(q("man"), { x: 0 }, { x: 1.5, duration: 0.05, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, t);
      });

      // ── "give": the sandwich pops up from behind the desk at Wishonia's side, swings into the screen (the whoosh) and
      // flies in a straight line across the middle of the circle into his hands, landing on "directly," (the pop).
      // Its office copy shows only outside the screen's hole and the Earth copy only inside, along the same line. ──
      var P0 = L.rise, R0 = [P0[0], P0[1] - L.lift], tUp = T.give + 0.16, tX = T.give + 0.48, tC = T.directly;
      var span = Math.hypot(XS[0] - R0[0], XS[1] - R0[1]), P1 = [XS[0] + dir[0] * span * L.bend, XS[1] + dir[1] * span * L.bend];
      var sOff = L.big, sEnd = SS * kz;
      var so = q("sand-o"), fly = q("fly"), flyPos = q("fly-pos"), trailEl = q("trail");
      set(so, 0, 0);
      set(so, 1, T.give);
      set(fly, 1, tX);
      set(fly, 0, tC);
      set(trailEl, 1, tX);
      var manPos = q("man-pos");
      KIT.onTime(tl, D, function (t) {
        var wu = Math.max(0, Math.min(1, (t - walk0) / (walk1 - walk0)));
        manPos.setAttribute("transform", manAt(x0 + (M.feet[0] - x0) * (1 - (1 - wu) * (1 - wu))));
        var p, s, r = 0;
        if (t < tUp) { var u = Math.max(0, (t - T.give) / (tUp - T.give)), ue = 1 - (1 - u) * (1 - u); p = [P0[0], P0[1] + (R0[1] - P0[1]) * ue]; s = sOff; r = -8 * ue; }
        else if (t < tX) {
          var v = (t - tUp) / (tX - tUp), w = v * v * (3 - 2 * v) * 0.4 + v * v * 0.6;
          p = [(1 - w) * (1 - w) * R0[0] + 2 * (1 - w) * w * P1[0] + w * w * XS[0], (1 - w) * (1 - w) * R0[1] + 2 * (1 - w) * w * P1[1] + w * w * XS[1]];
          s = sOff + (sEnd - sOff) * w; r = -8 + 8 * w;
        } else { var z = Math.min(1, (t - tX) / (tC - tX)); p = [XS[0] + (CO[0] - XS[0]) * z, XS[1] + (CO[1] - XS[1]) * z]; s = sEnd; }
        so.setAttribute("transform", "translate(" + f(p[0]) + "," + f(p[1]) + ") scale(" + s.toFixed(3) + ") rotate(" + r.toFixed(1) + ")");
        var pe = toEarth(p);
        flyPos.setAttribute("transform", "translate(" + f(pe[0]) + "," + f(pe[1]) + ") scale(" + SS.toFixed(3) + ")");
        // the dashed chord it leaves across the circle, from the screen's edge to wherever the sandwich is
        var zz = t < tX ? 0 : Math.min(1, (t - tX) / (tC - tX)), te = toEarth([XS[0] + (CO[0] - XS[0]) * zz, XS[1] + (CO[1] - XS[1]) * zz]);
        trailEl.setAttribute("d", "M" + f(XE[0]) + "," + f(XE[1]) + " L" + f(te[0]) + "," + f(te[1] - 20 * SS));
      });
      set(so, 0, tC);
      tl.to(trailEl, { opacity: 0.45, duration: 0.5, ease: "power1.inOut" }, tC + 0.6);
      // he puts his hands up for it just before it lands; on "directly," it is in them, and he gives a little hop
      show("hold", tC - 0.16);
      document.querySelectorAll("#" + ID + "-hp-hold .hd-sand").forEach(function (s) { set(s, 0, 0); set(s, 1, tC); });
      tl.fromTo(q("man"), { y: 0 }, { y: -7, duration: 0.08, repeat: 1, yoyo: true, ease: "power2.out", immediateRender: false }, tC);

      // ── He turns it over, looking for the price tag (there is none), then pats his empty pockets ──
      var hold = hp("hold"), hsand = hold.querySelector(".hd-sand");
      gsap.set(hsand, { svgOrigin: "0 -20" });
      tl.to(hsand, { rotation: 180, duration: 0.14, ease: "power2.inOut" }, tC + 0.1);
      tl.to(hsand, { rotation: 360, duration: 0.14, ease: "power2.inOut" }, tC + 0.36);
      tl.set(hsand, { rotation: 0 }, tC + 0.52);
      var pat0 = tC + 0.52;
      ["patA", "patB", "patA", "patB", "patA"].forEach(function (k, j) { show(k, pat0 + j * 0.09); });
      show("hold", pat0 + 0.45);

      // ── "but": the mug floats up to Wishonia's mouth and she sips (the huff); it waits under her chin through the
      // line, then on "you." it goes down slowly and lands (the thunk) ──
      var hw = L.wish.w * 0.95, mouth = [L.wish.x + L.wish.w * 0.025 + 0.605 * hw, L.wish.y + 0.81 * hw];
      var mug = q("mug"), mk = function (p) { return { x: (p[0] - L.mug[0]) / mugK, y: (p[1] - L.mug[1]) / mugK }; };
      var lip = mk([mouth[0] + 6, mouth[1] - 6]), chin = mk([mouth[0] + 30, mouth[1] + (V ? 60 : 70)]);
      gsap.set(mug, { svgOrigin: "0 0" });
      tl.to(mug, { x: lip.x, y: lip.y, rotation: -22, duration: 0.3, ease: "power2.out" }, T.but);
      tl.to(mug, { rotation: -40, duration: 0.16, ease: "sine.inOut" }, T.but + 0.3);
      tl.to(mug, { rotation: -30, duration: 0.14, ease: "sine.inOut" }, T.but + 0.46);
      tl.to(mug, { x: chin.x, y: chin.y, rotation: -6, duration: 0.25, ease: "power1.inOut" }, T.but + 0.62);
      tl.to(mug, { x: 0, y: 0, rotation: 0, duration: T.thunk - T.you, ease: "sine.inOut" }, T.you);
      tl.to(mug, { y: -5, duration: 0.07, repeat: 1, yoyo: true, ease: "power1.out" }, T.thunk);

      // ── "probably": the skeletons turn their skulls to stare at the sandwich, two at a time (the bone clicks):
      // the Politician and the Weapons Maker, the farmer and the father, the mother and the kid ──
      var mini = q("mini"), Mm = mini.getCTM(), svgEl = mini.ownerSVGElement;
      var heads = [
        [e("s1-x").querySelector(".head"), E.rig.pol.neck], [e("s2-x").querySelector(".head"), E.rig.wm.neck],
        [e("s5-x").querySelector(".head"), KIT.rig({ tone: 1, outfit: "overalls", color: 2, hair: 0, look: "left", plain: true }).neck],
      ];
      e("fam-x").querySelectorAll(".head").forEach(function (h, j) { heads.push([h, KIT.rig(mix(E.FAM[j], { look: "left" })).neck]); });
      heads.forEach(function (hn, j) {
        var h = hn[0], nk = hn[1], pt = svgEl.createSVGPoint();
        pt.x = stare[0]; pt.y = stare[1];
        var lp = pt.matrixTransform(h.parentNode.getCTM().inverse().multiply(Mm));
        var face = h.firstElementChild.transform.baseVal.consolidate().matrix.a < 0 ? -1 : 1;
        var vx = lp.x - nk[0], vy = lp.y - nk[1], flip = vx * face < 0, f2 = flip ? -face : face;
        var ang = (Math.atan2(vy, vx) * 180) / Math.PI;
        if (f2 < 0) ang -= 180;
        ang = ((ang + 540) % 360) - 180;
        ang = Math.max(-35, Math.min(35, ang));
        gsap.set(h, { svgOrigin: nk[0] + " " + nk[1] });
        var t = T.probably + Math.floor(j / 2) * 0.12;
        tl.to(h, { rotation: ang, scaleX: flip ? -1 : 1, duration: 0.09, ease: "back.out(2.5)" }, t);
      });

      // ── "advanced": he shrugs, then takes an enormous bite (the crunch), crumbs fly, and he chews, delighted ──
      var tShrug = T.probably + 0.12, tBite = T.advanced;
      show("shrug", tShrug);
      var sh = hp("shrug").querySelector(".head");
      gsap.set(sh, { svgOrigin: HR.neck.join(" ") });
      tl.fromTo(sh, { rotation: 0 }, { rotation: -10, duration: 0.14, ease: "power2.out" }, tShrug);
      tl.fromTo(q("man"), { scaleY: 1 }, { scaleY: 0.96, duration: 0.12, repeat: 1, yoyo: true, ease: "power1.out", immediateRender: false }, tShrug);
      show("bite", tBite - 0.1);
      var bite = hp("bite");
      set(bite.querySelector(".hd-whole"), 0, tBite);
      set(bite.querySelector(".hd-bitten"), 1, tBite);
      tl.fromTo(bite.querySelector(".hd-sand"), { x: 0 }, { x: -3, duration: 0.05, repeat: 1, yoyo: true, ease: "power2.out", immediateRender: false }, tBite);
      document.querySelectorAll("#" + ID + "-mini .hd-crumb").forEach(function (c, j) {
        var dx = -14 - j * 6, top = -14 - (j % 3) * 7;
        set(c, 1, tBite);
        tl.fromTo(c, { x: 0, y: 0 }, { keyframes: [{ x: dx * 0.5, y: top, duration: 0.16, ease: "power2.out" }, { x: dx, y: 70, duration: 0.4, ease: "power2.in" }] }, tBite);
        set(c, 0, tBite + 0.56);
      });
      show("chew", tBite + 0.22);
      var ch = hp("chew").querySelector(".head");
      gsap.set(ch, { svgOrigin: HR.neck.join(" ") });
      tl.fromTo(ch, { rotation: 0 }, { rotation: 5, duration: 0.13, repeat: 7, yoyo: true, ease: "sine.inOut" }, tBite + 0.3);

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
