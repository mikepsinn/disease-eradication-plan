<template id="human-economy-title-template">
  <!-- human-economy-title · Layer A title card (storyboards/part-02-the-human-economy.md), built by KIT.titleScene:
       THE and HUMAN slam in on "Human" (the "The" falls in the cut), ECONOMY on "Economy.". The O of ECONOMY is not
       a letter but a hamster wheel: a cream rim with 32 navy rungs round a hole of cream Earth paper. 0.4 s after
       "Economy." the wheel starts to turn and a tiny war-seal paper runs inside it on its stick legs, going nowhere,
       faster and faster. The wheel is the economy circle of the next scene: economy-circle zooms into its hole, so
       its numbers are copied there (ECO_O in economy-circle.html): keep the two the same. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="human-economy-title" data-width="1920" data-height="1080" data-start="0" data-duration="2.32">
    <div id="human-economy-title-cam">
      <div id="human-economy-title-bg"></div>
      <div id="human-economy-title-sun"></div>
      <div id="human-economy-title-back"></div>
      <div id="human-economy-title-words"></div>
      <div id="human-economy-title-art"></div>
    </div>
    <div id="human-economy-title-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/title.js"></script>
  <script>
    (function () {
      var ID = "human-economy-title";
      var C = KIT.C;
      // The wheel, in units of the heading size s: rim radii, the rungs, and the paper (its scale and where its feet
      // touch the rim). economy-circle.html copies these as ECO_O.
      var O = { ro: 0.355, ri: 0.24, rungs: 32, paper: 0.3 };
      // The O's center inside ECONOMY: E and C, then half the O (Fraunces Black advances, from title.js).
      var O_AT = 0.639 + 0.669 + 0.758 / 2;

      KIT.titleScene({
        id: ID,
        lines: [["THE", "HUMAN"], ["ECONOMY"]],
        // "The" is lost in the cut, so THE and HUMAN both land on "Human", a beat apart.
        spoken: [{ cue: "Human" }, { cue: "Human", n: 1, offset: 0.2 }, "Economy."],
        gag: function (c) {
          var wd = c.word("ECONOMY"), s = wd.size, ox = O_AT * s, ro = O.ro * s, ri = O.ri * s, ink = C.line;
          // Hide the letter O (it keeps its width), so the wheel takes its place.
          wd.el.innerHTML = 'EC<span style="color:transparent;text-shadow:none">O</span>NOMY';
          var f = function (n) { return n.toFixed(2); };
          var ring = function (r1, r2, dx, dy) {
            return "M" + f(ox + dx - r1) + "," + f(dy) + " a" + f(r1) + "," + f(r1) + " 0 1 0 " + f(2 * r1) + ",0 a" + f(r1) + "," + f(r1) + " 0 1 0 " + f(-2 * r1) + ",0 Z " +
              "M" + f(ox + dx - r2) + "," + f(dy) + " a" + f(r2) + "," + f(r2) + " 0 1 0 " + f(2 * r2) + ",0 a" + f(r2) + "," + f(r2) + " 0 1 0 " + f(-2 * r2) + ",0 Z";
          };
          var rungs = "";
          for (var i = 0; i < O.rungs; i++) {
            var a = (i * 2 * Math.PI) / O.rungs, sa = Math.sin(a), ca = -Math.cos(a);
            rungs += "M" + f(ox + (ri + 1.5) * sa) + "," + f((ri + 1.5) * ca) + " L" + f(ox + (ro - 1.5) * sa) + "," + f((ro - 1.5) * ca) + " ";
          }
          // The letters' print: a navy drop shadow, then the cream rim (with the letters' cream outline), the paper in
          // the hole with a thin navy edge, and the rungs (they turn).
          var sh = [0.04 * s, 0.053 * s], out = 0.022 * s;
          var paper = function (legs, cls) {
            return '<g class="' + cls + '"' + (legs ? ' opacity="0"' : "") + ">" + KIT.money("war", legs ? 0.95 : 0.05) + "</g>";
          };
          var art = '<path d="' + ring(ro, ri, sh[0], sh[1]) + '" fill="' + C.ink + '" fill-rule="evenodd"/>' +
            '<path d="' + ring(ro + out, ri - out, 0, 0) + '" fill="' + C.cream + '" fill-rule="evenodd"/>' +
            '<circle cx="' + f(ox) + '" cy="0" r="' + f(ri - out) + '" fill="' + C.paper + '" stroke="' + ink + '" stroke-width="2"/>' +
            '<circle cx="' + f(ox) + '" cy="0" r="' + f(ro + out) + '" fill="none" stroke="' + ink + '" stroke-width="2"/>' +
            '<g id="' + ID + '-rungs"><path d="' + rungs + '" stroke="' + ink + '" stroke-width="' + f(0.016 * s) + '" stroke-linecap="butt"/></g>' +
            // the paper stands on the bottom of the hole, facing left (the way it will walk in the next scene)
            '<g id="' + ID + '-runner" transform="translate(' + f(ox) + "," + f(ri - out - 46 * O.paper) + ") scale(" + O.paper + ')">' +
            '<g id="' + ID + '-bob">' + paper(0, ID + "-leg-a") + paper(1, ID + "-leg-b") + "</g></g>";
          c.pin(wd.text, "left", art);

          // 0.4 s after "Economy." the wheel turns, counterclockwise (the paper runs left, its floor goes right),
          // faster and faster: a half turn by the end, so its 32 rungs land where the next scene's ties are.
          var T0 = c.cue("Economy.") + 0.4, A = 180 / ((c.D - T0) * (c.D - T0));
          var rungEl = document.getElementById(ID + "-rungs"), bob = document.getElementById(ID + "-bob");
          var legA = bob.querySelector("." + ID + "-leg-a"), legB = bob.querySelector("." + ID + "-leg-b");
          KIT.onTime(c.tl, c.D, function (t) {
            var u = Math.max(0, t - T0), a = -A * u * u;
            rungEl.setAttribute("transform", "rotate(" + a.toFixed(3) + " " + f(ox) + " 0)");
            // a leg swap every 15 degrees of wheel (every second rung), and a hop on each step
            var step = u > 0 ? Math.floor(-a / 15) : 0, k = step % 2;
            legA.setAttribute("opacity", k ? "0" : "1");
            legB.setAttribute("opacity", k ? "1" : "0");
            var hop = u > 0 ? Math.abs(Math.sin(((-a / 15) % 1) * Math.PI)) * 7 : 0;
            bob.setAttribute("transform", "translate(0," + (-hop).toFixed(2) + ") rotate(" + (u > 0 ? -6 : 0) + " 0 46)");
          });
        },
      });
    })();
  </script>
</template>
