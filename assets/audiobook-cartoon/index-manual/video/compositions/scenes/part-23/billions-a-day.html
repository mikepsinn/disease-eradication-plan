<template id="billions-a-day-template">
  <!-- billions-a-day · collage host shot (Part 23, scene 8). YOU stands on top of Earth reading his paper. "billions":
       the day's goods start dropping onto Earth round him, a few, then a rain, and the heap climbs past his knees, his
       chest, his chin. "noticing.": it buries him; then the paper pokes up out of the top, still being read, and turns a page. She rolls
       her eyes at us. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="billions-a-day" data-width="1920" data-height="1080" data-start="0" data-duration="4.8">
    <div id="billions-a-day-weave"></div>
    <div id="billions-a-day-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    (function () {
      var ID = "billions-a-day", V = KIT.V, Z = KIT.collage.SIZES;
      // Earth as a cut-out of the deck's own (the deck's copy is hidden below), lower and bigger, so YOU fits on top.
      var EARTH = "../deck/earth"; Z[EARTH] = [667, 651];
      var E = V ? [850, 800, 200] : [1490, 740, 300], EK = 2 * E[2] / 667, TOPE = E[1] - E[2] * 0.93;
      var YH = V ? 190 : 260, YK = YH / Z["newspaper-man"][1];
      // the heap: ROWS rows, HEAP copies in the bottom one; it tops out above his hat
      var GH = V ? 52 : 70, ROWS = 6, HEAP = V ? 8 : 9, TALL = (ROWS - 1) * GH * 0.6 + GH;
      // afterwards he is lifted so the paper (the top 44% of the cut-out) pokes out of the top of the heap
      var LIFT = TALL + 0.6 * GH - 0.56 * YH;
      KIT.collage({
        id: ID, seed: 2308, host: true,
        cast: {
          earth: { art: EARTH, x: E[0], y: E[1], scale: EK },
          you: { art: "newspaper-man", x: E[0], y: TOPE + 4, anchor: "bottom", pivot: "bottom", scale: YK },
        },
        beats: [
          { on: "species", do: "bob", who: "you", y: 1, r: 0.6, speed: 0.6, until: "billions" },
          // "billions": a few goods, then a rain, heaping round him and over him
          { on: "billions", do: "pile", id: "few", art: ["pill-bottle", "loaf", "goods"], height: GH * 0.8, count: 4, heap: 4, spread: GH * 0.9, x: E[0], y: TOPE + 8, dist: 700, until: "times", accel: 1, tilt: 30 },
          { on: "times", do: "pile", id: "rain", art: ["goods", "loaf", "pill-bottle", "goods", "medicine-bottle", "loaf"], height: GH, sizes: { goods: 1.3 }, count: 39 - (V ? 6 : 0), heap: HEAP, spread: GH * 0.75, x: E[0], y: TOPE + 8, dist: 800, until: ["noticing.", 1, -0.05], accel: 0.7, tilt: 40, jitter: 10 },
          { on: "noticing.", do: "shake", y: 5, frames: 3 },
          // the paper pokes up out of the top, still reading, and turns a page
          { on: "noticing.", offset: 0.25, do: "move", who: "you", by: [0, -LIFT], dur: 0.25 },
          { on: "noticing.", offset: 0.75, do: "shiver", who: "you", dur: 0.2, amp: 2, rot: 3 },
          { on: "noticing.", offset: 0.8, do: "hop", who: "you", height: 6 },
        ],
      });
      document.getElementById(ID + "-hwall").querySelector(".earth").style.visibility = "hidden";
    })();
  </script>
</template>
