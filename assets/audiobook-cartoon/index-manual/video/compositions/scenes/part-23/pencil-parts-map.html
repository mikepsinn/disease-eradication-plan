  <!-- pencil-parts-map · collage (Part 23, scenes 4 to 7 as one plate: the pencil). The bit: the world, a big engraved
       world map hung on the back wall of an empty office, and a pencil that nobody makes. The camera lives on the map.
       "wood": the pencil comes apart over the middle of the Atlantic; the wood flies to Washington and a tree pops up
       where it lands (the lumberjack scratches his head); the lead dives down a mine shaft in South America and a miner
       pops out black with graphite, blinking; the eraser bounces east to Malaya and lands in a rubber tapper's cup; the
       brass band floats about, gives up on "from." and plops into the sea, where the map's sea serpent surfaces and
       sniffs it. "Literally thousands": pull back; strangers pop up shoulder to shoulder along
       dashed routes, and the parts pass back to the middle and snap together. Speech balloons in different languages;
       on "religions," everyone hops. "met.": two strangers over the eraser vanish into a cartoon brawl, and the eraser
       shoots out of it onto the end of the pencil. "No one sitting": the camera pulls out of the map into the empty
       office: a door lettered CENTRAL OFFICE, an MP helmet and nightstick on a hook, a swivel chair, a desk with a telephone that
       rings itself; a tumbleweed rolls through. The nightstick slips off and bonks the empty chair; a spider lowers itself into the chair. "A pencil
       costs": back to the pencil, 25¢. More strangers on more routes. "planned": THE PLAN, blank, on the desk.
       "runs": the spider rolls past in the chair. "money,": a coin over the pencil shatters into coins, one to every
       stranger. "pencils.": the cash register, nobody at it, rings itself and spills pencils over the spider. -->

        cast["c" + i] = { art: "coin", x: SEA[0], y: SEA[1] - 420, scale: hk("coin", 120), hidden: true };
        add({ on: "money,", offset: 0.25, do: "show", who: "c" + i });
        add({ on: "money,", offset: 0.25 + i * 0.03, do: "move", who: "c" + i, to: [p[0], p[1] - 360], arc: 200, dur: 0.45 });
        add({ on: "and", n: 1, offset: 0.1, do: "hop", who: "c" + i, height: 30 });
      });
      // "pencils.": the till rings itself and spills pencils over the spider
      add({ on: "price", do: "camera", view: "desk", dur: 0.5 });
      add({ on: "selfishness", do: "shiver", who: "till", dur: T("pencils.") - T("selfishness"), amp: 6, rot: 3 });
      add({ on: "pencils.", do: "pop", who: "drawer" });
      add({ on: "pencils.", do: "move", who: "drawer", by: [0, 160], dur: 0.12 });
      add({ on: "pencils.", offset: 0.05, do: "pile", id: "spill", art: "pencil", height: 120, count: 36, heap: 8, spread: 300, x: CHAIR[0] + 1700, y: G, dist: 1600, dur: 1.0, accel: 0.8, tilt: 40, jitter: 90 });
      add({ on: "pencils.", offset: 0.6, do: "hide", who: "spider" });

      KIT.collage({ id: ID, seed: 2304, plate: [-9000, -6000, 11000, 9000], views: views, view: "sea", cast: cast, beats: beats });
    })();
