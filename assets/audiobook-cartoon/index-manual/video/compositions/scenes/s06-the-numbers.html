<template id="s06-template">
  <!-- S06 · Layer A · Wishonia with the clipboard; two big numbers count up on the wall screen. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #s06-bg, #s06-set, #s06-cast, #s06-front { position: absolute; inset: 0; }
    #s06-screen { position: absolute; left: 154px; top: 134px; width: 832px; height: 532px; overflow: hidden; }
    .s06-row { position: absolute; left: 50px; width: 740px; }
    #s06-row1 { top: 40px; }
    #s06-row2 { top: 270px; }
    .s06-num { font-size: 118px; }
    .s06-num small { font-size: 0.5em; }
    .s06-cap { font-size: 38px; margin-top: 8px; }
    #s06-row1 .s06-num { color: #157F78; }
    #s06-quiz {
      position: absolute; left: 240px; top: 170px; width: 660px; padding: 40px 0 46px; text-align: center;
      background: #F6EBD2; border: 8px solid #D7322B; border-radius: 18px;
    }
    #s06-quiz div { font-size: 120px; color: #D7322B; text-shadow: none; }
  </style>
  <div id="root" data-composition-id="s06" data-width="1920" data-height="1080" data-start="0" data-duration="17.2">
    <div id="s06-bg" class="clip" data-start="0" data-duration="17.2" data-track-index="0"></div>
    <div id="s06-set"></div>
    <div id="s06-screen">
      <div class="s06-row" id="s06-row1">
        <div class="s06-num kit-big"><span id="s06-n1">0.0</span> <small>billion</small></div>
        <div class="s06-cap kit-label">deaths prevented</div>
      </div>
      <div class="s06-row" id="s06-row2" data-layout-allow-overlap>
        <div class="s06-num kit-big"><span id="s06-n2">0.00</span> <small>quadrillion</small></div>
        <div class="s06-cap kit-label">hours of suffering prevented</div>
      </div>
      <div id="s06-quiz" data-layout-allow-overlap><div class="kit-big">POP QUIZ</div></div>
    </div>
    <div id="s06-cast"></div>
    <div id="s06-front"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part-02.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "s06";
      var D = KIT.scene(ID).duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C;

      q("bg").innerHTML = KIT.office(1500);
      q("set").innerHTML = KIT.svg(1920, 1080, KIT.wallScreen(120, 100, 900, 600) + '<g transform="translate(1000,520)">' + KIT.cabinet(0, 0) + "</g>");
      // clipboard leaning on the desk, then the desk in front of Wishonia
      var clip = '<g transform="translate(1110,770)"><g id="s06-clip">' +
        '<rect x="0" y="0" width="150" height="196" rx="10" fill="#B65A2B" stroke="' + C.ink + '" stroke-width="5"/>' +
        '<rect x="14" y="26" width="122" height="156" fill="' + C.cream + '" stroke="' + C.ink + '" stroke-width="3"/>' +
        '<rect x="45" y="-8" width="60" height="26" rx="6" fill="#9AA3DE" stroke="' + C.ink + '" stroke-width="4"/>' +
        '<path d="M30,60 h90 M30,90 h90 M30,120 h70 M30,150 h80" stroke="' + C.ink + '" stroke-width="5"/></g></g>';
      q("front").innerHTML = KIT.svg(1920, 1080, clip + KIT.desk(1060, 915, 840) + '<g transform="translate(1740,800) scale(1.5)">' + KIT.mug(0, 0) + "</g>");

      var tl = gsap.timeline({ paused: true });
      var wish = KIT.mountWishonia(tl, q("cast"), { scene: ID, x: 1200, y: 120, w: 620 });

      tl.fromTo(wish.rig, { x: 80 }, { x: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#s06-clip", { y: 40, rotation: -12, transformOrigin: "50% 100%" }, { y: -30, rotation: -4, transformOrigin: "50% 100%", duration: 0.5, ease: "back.out(2)" }, cue("complete") - 0.2);

      // count-ups, value-scaled: each runs while its number is spoken
      function countUp(el, to, digits, t0, t1) {
        var o = { v: 0 };
        tl.fromTo(o, { v: 0 }, {
          v: to, duration: t1 - t0, ease: "power2.out",
          onUpdate: function () { el.textContent = o.v.toFixed(digits); },
        }, t0);
      }
      tl.fromTo(q("row1"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, cue("prevented") );
      countUp(q("n1"), 10.7, 1, cue("10.7") - 0.1, KIT.cueEnd(ID, "deaths"));
      tl.fromTo(q("row2"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, cue("and") - 0.2);
      countUp(q("n2"), 1.93, 2, cue("1.93") - 0.1, KIT.cueEnd(ID, "hours"));
      tl.fromTo(q("quiz"), { opacity: 0, scale: 1.6, rotation: -4 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.35, ease: "power4.in" }, cue("questions."));
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
