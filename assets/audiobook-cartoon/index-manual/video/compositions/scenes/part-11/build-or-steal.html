<template id="build-or-steal-template">
  <!-- build-or-steal · Layer B (storyboards/part-11-civilization-countdown.md): zoom into the wall screen onto a seesaw,
       BUILD THINGS on one end and STEAL THINGS on the other. The Masked Crook sits on STEAL, grinning, while war papers
       land in a heap beside him ("parasitic", pops); two plain papers sit on BUILD ("productive one,"), weighing nothing.
       The Builder ("individual,"), a little factory ("company,") and a little capitol ("nation") hop onto BUILD, a boing
       each, and tip it down. "flips": a brick of war papers drops onto STEAL, the plank slams down (slam) and catapults
       all three off the top of the frame (slide-up whistle). "building": the Builder drops back onto his stool, stars
       circling his head (thunk), the factory and the capitol land upside down behind him; "product": he starts a chair,
       one hammer blow per piece. "ransom": the Crook flicks a padlock onto a hospital's door (clank), a RANSOM note goes
       up and medicine papers squeeze out under the door into his briefcase. "afternoon?": the wall clock jumps from 12
       to 5 (ding); the chair has two legs. After "afternoon?": the Builder sits on it to rest and it tips him over
       backwards (thunk). The fuse burns in the top-left corner (inside the camera in this one scene, so it zooms in
       with the paper). -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #build-or-steal-cam, #build-or-steal-bg, #build-or-steal-art, #build-or-steal-fuse, #build-or-steal-pip, #build-or-steal-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="build-or-steal" data-width="1920" data-height="1080" data-start="0" data-duration="15">
    <div id="build-or-steal-cam">
      <div id="build-or-steal-bg"></div>
      <div id="build-or-steal-art"></div>
      <!-- the fuse: inside the camera in this scene only (the zoom into the wall screen grows it with the paper) -->
      <div id="build-or-steal-fuse"></div>
      <div id="build-or-steal-pip"></div>
    </div>
    <div id="build-or-steal-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/places.js"></script>
  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "build-or-steal";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, P = ID + "-";
      var RAD = Math.PI / 180;

      // ── Drawing helpers (the kit's print look: a navy pass under each fill, mitred corners) ──
      function n1(v) { var r = Math.round(v * 10) / 10; return String(r === 0 ? 0 : r); }
      function pt(x, y) { return n1(x) + "," + n1(y); }
      function polyD(pts) { return "M" + pts.map(function (p) { return pt(p[0], p[1]); }).join(" L") + " Z"; }
      function pg(pts) { return 'path d="' + polyD(pts) + '"'; }
      function ci(cx, cy, r) { return 'circle cx="' + n1(cx) + '" cy="' + n1(cy) + '" r="' + n1(r) + '"'; }
      function R(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
      function S(tags, col, w) {
        w = w || 4.4;
        return tags.map(function (t) { return "<" + t + ' fill="' + ink + '" stroke="' + ink + '" stroke-width="' + w + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }).join("") +
          tags.map(function (t) { return "<" + t + ' fill="' + col + '"/>'; }).join("");
      }
      function F(tag, col, extra) { return "<" + tag + ' fill="' + col + '"' + (extra ? " " + extra : "") + "/>"; }
      function line(d, col, w, extra) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linejoin="miter" stroke-linecap="round"' + (extra ? " " + extra : "") + "/>"; }
      function g(id, inner, attrs) { return '<g id="' + P + id + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
      function at(x, y, s, inner, rot) { return '<g transform="translate(' + n1(x) + "," + n1(y) + ")" + (rot ? " rotate(" + rot + ")" : "") + (s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function txt(x, y, size, s, col, extra) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + size + '" fill="' + (col || ink) + '"' + (extra ? " " + extra : "") + ">" + s + "</text>"; }

      // ── THE FUSE (storyboard, Running gag: the fuse): the same in every Part 11 scene (copied from war-through-wifi). ──
      // The civilization is a cartoon bomb: a small Earth with a navy screw collar and a lit fuse that burns by part
      // time (L = L0 - k t), so it is continuous across scenes. Returns the spark's flare group (scale it to flare).
      function fuse(layer, tl) {
        var Fz = V ? { cx: 110, cy: 150, r: 56, collar: [94, 80, 32, 14], d: "M110,86 Q116,64 148,66 L690,66", L0: 560, k: 2.2 }
          : { cx: 112, cy: 116, r: 58, collar: [96, 46, 32, 14], d: "M112,52 Q118,30 150,32 L780,32", L0: 640, k: 2.6 };
        var c = Fz.collar, t0 = sc.start;
        var cords = '<path id="' + P + "cord-a" + '" d="' + Fz.d + '" fill="none" stroke="' + ink + '" stroke-width="9" stroke-linecap="round"/>' +
          '<path id="' + P + "cord-b" + '" d="' + Fz.d + '" fill="none" stroke="' + C.tan + '" stroke-width="5" stroke-linecap="round"/>';
        var spark = '<g id="' + P + 'spark"><g id="' + P + 'spark-flare"><g id="' + P + 'spark-flick">' +
          KIT.star(0, 0, 14, C.yellow) + '<g transform="rotate(45)">' + KIT.star(0, 0, 10, C.yellow) + "</g>" + KIT.star(0, 0, 8, C.orange) + "</g></g>" +
          '<g id="' + P + 'spark-smoke">' + line("M2,-12 q-7,-8 0,-15 q7,-8 0,-15", "#8C8782", 2.6) + "</g></g>";
        layer.innerHTML = KIT.svg(W, H, cords +
          at(Fz.cx, Fz.cy + Fz.r, 1, KIT.props.earthGlobe({ r: Fz.r })) +
          S([pg(R(c[0], c[1], c[2], c[3]))], C.navy, 3) + line("M" + (c[0] + 3) + "," + (c[1] + 3) + " H" + (c[0] + c[2] - 3), C.orange, 1.6) +
          line("M" + (c[0] + 2) + "," + (c[1] + 8) + " H" + (c[0] + c[2] - 2), C.peri, 1.4) + spark);
        var a = document.getElementById(P + "cord-a"), b = document.getElementById(P + "cord-b"), sp = document.getElementById(P + "spark");
        KIT.onTime(tl, D, function (lt) {
          var Lc = Math.max(0, Fz.L0 - Fz.k * (t0 + lt)), p = a.getPointAtLength(Lc);
          a.setAttribute("stroke-dasharray", Lc.toFixed(1) + " 3000");
          b.setAttribute("stroke-dasharray", Lc.toFixed(1) + " 3000");
          sp.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")");
        });
        var fl = document.getElementById(P + "spark-flick"), sm = document.getElementById(P + "spark-smoke");
        gsap.set(fl, { svgOrigin: "0 0" });
        tl.fromTo(fl, { scale: 0.8 }, { scale: 1.2, duration: 0.09, repeat: Math.floor(D / 0.09) - 1, yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo(sm, { x: -2, opacity: 0.9 }, { x: 2, opacity: 0.6, duration: 0.4, repeat: Math.floor(D / 0.4) - 1, yoyo: true, ease: "sine.inOut" }, 0);
        return document.getElementById(P + "spark-flare");
      }

      // ── THE WALL CLOCK (as crypto-afternoon draws it): a cream face r 70 (in 16:9), a navy rim 8 px, 12 ticks, orange
      // hands and a mustard hub. Drawn around its center (0,0) at radius r; the hands are untransformed groups pointing
      // at 12 (rotate them about "0 0"). ──
      function clock(r) {
        var ticks = "";
        for (var i = 0; i < 12; i++) {
          var a = i * 30 * RAD, r0 = r - (i % 3 ? 11 : 18), r1 = r - 5;
          ticks += "M" + pt(r0 * Math.sin(a), -r0 * Math.cos(a)) + " L" + pt(r1 * Math.sin(a), -r1 * Math.cos(a)) + " ";
        }
        var nums = [[0, "12"], [3, "3"], [6, "6"], [9, "9"]].map(function (n) {
          var a = n[0] * 30 * RAD, rr = r - 33;
          return txt(rr * Math.sin(a), -rr * Math.cos(a) + r * 0.11, Math.round(r * 0.3), n[1]);
        }).join("");
        var hand = function (len, w) { return S([pg([[-w, 9], [w, 9], [w * 0.7, -len + 8], [0, -len], [-w * 0.7, -len + 8]])], C.orange, 3.4); };
        return F(ci(6, 8, r + 4), ink, 'opacity="0.85"') + '<circle cx="0" cy="0" r="' + r + '" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="8"/>' +
          '<circle cx="0" cy="0" r="' + (r - 9) + '" fill="none" stroke="' + C.orange + '" stroke-width="2"/>' + line(ticks, ink, 3.4) + nums +
          g("hand-h", hand(r * 0.48, 6)) + g("hand-m", hand(r * 0.76, 4.4)) + S([ci(0, 0, 7)], C.yellow, 3);
      }

      // ── A stack of war papers seen edge-on (as war-through-wifi draws it): thin green bills, each with its red seal at
      // one end; w wide, n bills, standing on y 0 around x 0. ──
      function billStack(w, n, seed) {
        var r = KIT.rng(seed), out = "";
        for (var i = 0; i < n; i++) {
          var y = -12 * (i + 1), j = Math.round((r() - 0.5) * 10), wj = Math.round((r() - 0.5) * 8), x0 = -w / 2 + j, ww = w + wj;
          out += '<rect x="' + x0 + '" y="' + y + '" width="' + ww + '" height="12" rx="2" fill="' + C.money + '" stroke="' + ink + '" stroke-width="2"/>' +
            '<path d="M' + (x0 + 8) + "," + (y + 4) + " H" + (x0 + ww - 22) + '" stroke="#D4E4C6" stroke-width="1.4" opacity="0.7"/>' +
            '<circle cx="' + (i % 2 ? x0 + ww - 9 : x0 + 9) + '" cy="' + (y + 6) + '" r="3.6" fill="' + C.war + '" stroke="' + ink + '" stroke-width="1.2"/>';
        }
        return out;
      }

      // ── Layout, per canvas shape ──────────────────────────────────────────────────────────────────
      // G: the ground under the seesaw and the hospital; G1: the ground of the Builder's corner (a shelf above in 9:16).
      // apex: the fulcrum's top (the plank's pivot); half, thick: the plank; tilt: how far it tips (degrees, + = STEAL down).
      // s: the humans' scale; fs, cs: the little factory's and capitol's; bs: the war papers' in the heap.
      // ride: where each rider stands on the plank (plank units from the pivot); crook: where the Crook sits.
      // heap: [x, y, rotation] of each war paper landing on STEAL; stack: [x, width, bills] of the brick that lands on "flips".
      // bench: the workbench [x0, x1]; stool, chair: their x (the chair's front feet); home: where the Builder, the
      // factory and the capitol stand at first; flat: where the factory and the capitol land upside down.
      // hosp: [x, scale]; clock: [x, y, r].
      var L = V
        ? { G: 1420, G1: 960, apex: [430, 1320], half: 385, thick: 46, tilt: 13.5, s: 1.45, fs: 0.3, cs: 0.25, bs: 0.6, lab: 27,
            ride: { b: -285, f: -172, c: -58, p: [-370, -340] }, crook: 300,
            heap: [[80, -16, -6], [145, -16, 7], [210, -15, -4], [110, -44, 5], [178, -44, -8], [94, -72, -3], [158, -72, 6], [128, -100, -5]],
            stack: [140, 132, 11], drop: 1500,
            bench: [60, 170], stool: 222, chair: 476, home: { b: 330, f: 525, c: 680 }, flat: { f: 606, c: 734 },
            hosp: [952, 0.48], clock: [560, 590, 95], shelf: [56, 792] }
        : { G: 860, G1: 860, apex: [930, 750], half: 440, thick: 50, tilt: 13.5, s: 1.7, fs: 0.36, cs: 0.3, bs: 0.7, lab: 30,
            ride: { b: -335, f: -210, c: -68, p: [-424, -392] }, crook: 335,
            heap: [[95, -18, -6], [165, -18, 7], [235, -17, -4], [130, -50, 5], [200, -50, -8], [112, -82, -3], [180, -82, 6], [148, -114, -5]],
            stack: [165, 160, 12], drop: 1000,
            bench: [64, 176], stool: 222, chair: 492, home: { b: 345, f: 475, c: 625 }, flat: { f: 612, c: 748 },
            hosp: [1497, 0.66], clock: [1480, 250, 70], shelf: null };
      var G = L.G, G1 = L.G1, AX = L.apex[0], AY = L.apex[1], HALF = L.half, TH = L.thick, s = L.s;
      // the Builder's furniture is drawn for a human at scale 1.45, and scaled with the humans
      var k = s / 1.45;
      // A point on the plank (plank units: x along it from the pivot, y down as in SVG, so its top is at -thick) in the
      // frame, with the plank at angle th.
      function onPlank(lx, ly, th) {
        var c = Math.cos(th * RAD), n = Math.sin(th * RAD);
        return [AX + lx * c - ly * n, AY + lx * n + ly * c];
      }

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // ── The humans ──
      // The Builder (storyboard Cast): an orange barrel in overalls, a hammer in his right hand.
      var BUILDER = { tone: 1, outfit: "overalls", color: 0, seed: 7, mood: "eager" };
      var SEATED = { legPose: [[85, 10], [95, 15]] };
      var oStand = mix(BUILDER, { arms: [[20, 10], [-30, 60]] });
      var oFly = mix(BUILDER, { mood: "worried", arms: [[-150, -170], [150, 170]] });
      var oSit = mix(BUILDER, { build: SEATED, arms: [[30, 80], [60, 95]] });
      var rStand = KIT.rig(oStand), rSit = KIT.rig(oSit), rFly = KIT.rig(oFly);
      // A hammer in the right hand, held across the forearm, its head up (in the person's units: it goes inside .arm-r,
      // so it swings with the arm).
      function hammer(o, r) {
        var h = r.hand[1], a2 = o.arms[1][1] * RAD, d = [Math.sin(a2), Math.cos(a2)], nn = [Math.cos(a2), -Math.sin(a2)];
        var e = [h[0] + nn[0] * 34, h[1] + nn[1] * 34], s0 = [h[0] - nn[0] * 6, h[1] - nn[1] * 6];
        var hd = [[-12, -4], [10, -4], [10, 6], [-12, 6]].map(function (p) { return [e[0] + d[0] * p[0] + nn[0] * p[1], e[1] + d[1] * p[0] + nn[1] * p[1]]; });
        return line("M" + pt(s0[0], s0[1]) + " L" + pt(e[0], e[1]), ink, 7) + line("M" + pt(s0[0], s0[1]) + " L" + pt(e[0], e[1]), C.tan, 3.6) + S([pg(hd)], C.slate, 2.6);
      }
      // A person's markup with the hammer added inside the right arm (the arm group is the last one in a person).
      function withHammer(o, r) { return KIT.person(o).replace(/<\/g><\/g><\/g>$/, hammer(o, r) + "</g></g></g>"); }
      // The Masked Crook, sitting on the plank, grinning: briefcase on his lap, a fistful of cash up.
      var crookO = KIT.castOpts("lobbyist", { look: "right", mood: "grin", build: mix(KIT.CAST.lobbyist.build, { legPose: [[85, 15], [95, 25]] }), arms: [[30, 70], [40, 150]], holdL: "briefcase", holdR: "cash" });
      var crR = KIT.rig(crookO);

      // ── Props drawn in the scene ──
      // The seesaw's fulcrum: a slate triangle from the apex to the ground, with a bolt at the top.
      var fulcrum = S([pg([[AX, AY - 4], [AX + 74, G], [AX - 74, G]])], C.slate) + line("M" + pt(AX + 8, AY + 10) + " L" + pt(AX + 66, G - 4), C.orange, 2) +
        S([ci(AX, AY + 6, 9)], C.yellow, 3) + S([pg(R(AX - 90, G - 10, 180, 10))], C.navy, 3);
      // The plank (plank units: the pivot at the middle of its underside), painted BUILD THINGS and STEAL THINGS.
      function plankArt() {
        var grain = "", r = KIT.rng(5);
        for (var i = 0; i < 9; i++) { var x0 = -HALF + 20 + r() * (2 * HALF - 160); grain += "M" + pt(x0, -TH * (0.25 + 0.5 * r())) + " h" + n1(50 + r() * 90) + " "; }
        var panel = function (x, word, col) {
          var w = word.length * L.lab * 0.5 + 36;
          return S([pg(R(x - w / 2, -TH + 7, w, TH - 14))], C.cream, 3) + g("lab-" + (x < 0 ? "b" : "s"), txt(x, -TH / 2 + L.lab * 0.36, L.lab, word, col, 'letter-spacing="1.5"'), 'data-x="' + n1(x) + '"');
        };
        return S([pg(R(-HALF, -TH, 2 * HALF, TH))], C.tan) + line(grain, C.rust, 2, 'opacity="0.55"') + line("M" + (-HALF + 4) + "," + (-TH + 4) + " H" + (HALF - 4), C.cream, 2.2, 'opacity="0.7"') +
          line("M" + (-HALF + 4) + ",-4 H" + (HALF - 4), C.rust, 2.4) +
          [-HALF + 16, -HALF / 2, HALF / 2, HALF - 16].map(function (x) { return F(ci(x, -TH / 2, 3), ink); }).join("") +
          panel(-HALF * 0.4, "BUILD THINGS", ink) + panel(HALF * 0.4, "STEAL THINGS", C.war);
      }
      // The workbench (the Builder's corner): a tan top on navy legs, a shelf of planks, a saw hanging off the front.
      function workbench(x0, x1, G0) {
        var top = G0 - 92, out = S([pg(R(x0 + 8, top + 12, 10, G0 - top - 12)), pg(R(x1 - 18, top + 12, 10, G0 - top - 12))], C.navy, 3);
        out += S([pg(R(x0 + 10, G0 - 34, x1 - x0 - 20, 8))], C.rust, 3) + S([pg(R(x0 + 18, G0 - 46, x1 - x0 - 44, 10)), pg(R(x0 + 24, G0 - 56, x1 - x0 - 60, 10))], C.tan, 2.4);
        out += S([pg(R(x0, top, x1 - x0, 14))], C.tan) + line("M" + (x0 + 4) + "," + (top + 4) + " H" + (x1 - 4), C.cream, 2, 'opacity="0.7"');
        // a saw hanging from the front edge, and a jar of nails on top
        var sx = x0 + (x1 - x0) * 0.62;
        out += S([pg([[sx - 4, top + 14], [sx + 30, top + 14], [sx + 30, top + 60], [sx - 4, top + 34]])], "#C9C2B5", 2.6) + line("M" + (sx + 2) + "," + (top + 32) + " L" + (sx + 28) + "," + (top + 58), ink, 1.2, 'stroke-dasharray="3 3"') +
          S([pg(R(sx + 22, top + 8, 18, 12))], C.rust, 2.4);
        out += S([pg(R(x0 + 14, top - 22, 22, 22))], "#FFFFFF", 2.4) + line("M" + (x0 + 18) + "," + (top - 14) + " h14 M" + (x0 + 18) + "," + (top - 8) + " h14", "#8C8782", 1.6);
        return out;
      }
      // A little stool, its seat seatH above the ground at x (stool units: k = 1 at a human scale of 1.45).
      function stool(x, G0, seatH) { return at(x, G0, k, stoolArt(seatH / k)); }
      function stoolArt(seatH) {
        var x = 0, G0 = 0, y = G0 - seatH;
        return S([pg([[x - 18, y + 6], [x - 12, y + 6], [x - 20, G0], [x - 27, G0]]), pg([[x + 12, y + 6], [x + 18, y + 6], [x + 27, G0], [x + 20, G0]]), pg([[x - 3, y + 6], [x + 3, y + 6], [x + 3, G0 - 4], [x - 3, G0 - 4]])], C.navy, 3) +
          S([pg([[x - 30, y], [x + 30, y], [x + 26, y + 9], [x - 26, y + 9]])], C.tan, 3.4);
      }
      // The chair the Builder makes (3/4 view, facing right), in chair units: its front feet on y 0, the near one at x 0.
      // Each piece is its own group, so it can go on with a hammer blow: .seat, .back, .leg0, .leg1. It never gets its
      // back legs (there are only nail holes where they go), so it tips over backwards when someone sits on it.
      function chairArt(h) {
        var seatTop = [[-74, -h], [0, -h], [14, -h - 12], [-60, -h - 12]];
        var seat = S([pg(seatTop)], C.tan, 3.4) + S([pg(R(-74, -h, 74, 9))], C.rust, 3) + F(ci(-66, -h + 5, 2.2), ink) + F(ci(-8, -h + 5, 2.2), ink);
        var back = S([pg(R(-74, -h - 112, 9, 106)), pg(R(-60, -h - 124, 9, 114))], C.tan, 3) + S([pg([[-78, -h - 116], [-56, -h - 128], [-50, -h - 110], [-72, -h - 98]])], C.rust, 3) +
          S([pg([[-74, -h - 72], [-55, -h - 82], [-55, -h - 72], [-74, -h - 62]])], C.tan, 2.4);
        var leg0 = S([pg(R(-8, -h + 9, 8, h - 9))], C.tan, 3), leg1 = S([pg(R(7, -h - 4, 7, h - 9))], C.tan, 3);
        return g("chair-leg1", leg1, 'opacity="0"') + g("chair-back", back, 'opacity="0"') + g("chair-seat", seat, 'opacity="0"') + g("chair-leg0", leg0, 'opacity="0"');
      }

      // ── Assemble ──
      // Seat heights: the Builder sits with his feet on the ground (stool and chair).
      var seatH = s * (100 - rSit.hipY) - 2;
      var pr = function (o, sc2) { return at(0, -100 * sc2, sc2, o); }; // a person drawn with its feet at (0,0)
      var factoryUp = function (k, smoke) { return at(0, 0, k, KIT.props.factory({ label: "", smoke: smoke })); };
      var capitolUp = function (k) { return at(0, 0, k, KIT.props.capitol({})); };

      var factoryDown = function (k) { return at(0, -351 * k, 1, at(0, 0, k, KIT.props.factory({ label: "", smoke: false })), 180); };
