<template id="thats-homework-template">
  <!-- thats-homework · Layer B (storyboards/part-11-civilization-countdown.md). The world map: "nation", three cartoon
       bombs whistle down onto it (slide-down); "bombed", they go off as three tiny mushroom clouds (pop, pop, pop);
       "sanctioned", a giant rubber stamp thumps SANCTIONED across a country (stamp). "parasitizing": the map shrinks
       onto a classroom wall, the flattened toy tank from war-through-wifi slides in on the floor and a laptop drops
       beside it. "cheaper": a little HACK: $ tag flutters down onto the laptop, and the FIGHT: $$$$$ tag floats down on a
       parachute over the tank; "conventionally.": the parachute gives, the tag drops like an anvil and squashes the tank
       flatter (splat). "crime.": a CRIME card slides in, and a red marker crosses it out (marker). "homework.": a school
       desk drops in (thunk) with the Kid in his tiny domino mask at it; the laptop hops onto the desk and he opens it,
       next to a HOMEWORK worksheet. "built": the Politician, as the teacher, pops up on a soapbox at the chalkboard and
       chalks FIGHT: $$$$$ / HACK: $. "did the math.": the Kid writes HACK < FIGHT (scratch). After "math.": the
       Politician flicks a gold star onto the worksheet, grinning (sparkle), and the Kid beams. The fuse burns on.
       The Kid (storyboard Cast options) is drawn at 0.7 of this scene's human scale: 1.26 in 16:9 and 1.08 in 9:16
       (the Politician is 1.8 and 1.55); defund-the-loop brings him and his laptop back. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #thats-homework-cam, #thats-homework-bg, #thats-homework-art, #thats-homework-pip, #thats-homework-fuse, #thats-homework-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="thats-homework" data-width="1920" data-height="1080" data-start="0" data-duration="13.84">
    <div id="thats-homework-cam">
      <div id="thats-homework-bg"></div>
      <div id="thats-homework-art"></div>
      <div id="thats-homework-pip"></div>
    </div>
    <!-- the fuse burns in its own layer, above the camera (the slide does not move it) and under the grain -->
    <div id="thats-homework-fuse"></div>
    <div id="thats-homework-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>

  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/places.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "thats-homework";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, P = ID + "-";

      // ── Drawing helpers (the kit's print look: a navy pass under each fill, mitred corners) ──
      function n1(v) { var r = Math.round(v * 10) / 10; return String(r === 0 ? 0 : r); }
      function pt(x, y) { return n1(x) + "," + n1(y); }
      function polyD(pts) { return "M" + pts.map(function (p) { return pt(p[0], p[1]); }).join(" L") + " Z"; }
      function pg(pts) { return 'path d="' + polyD(pts) + '"'; }
      function ci(cx, cy, r) { return 'circle cx="' + n1(cx) + '" cy="' + n1(cy) + '" r="' + n1(r) + '"'; }
      function el(cx, cy, rx, ry) { return 'ellipse cx="' + n1(cx) + '" cy="' + n1(cy) + '" rx="' + n1(rx) + '" ry="' + n1(ry) + '"'; }
      function R(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
      function S(tags, col, w) {
        w = w || 4.4;
        return tags.map(function (t) { return "<" + t + ' fill="' + ink + '" stroke="' + ink + '" stroke-width="' + w + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }).join("") +
          tags.map(function (t) { return "<" + t + ' fill="' + col + '"/>'; }).join("");
      }
      function F(tag, col, extra) { return "<" + tag + ' fill="' + col + '"' + (extra ? " " + extra : "") + "/>"; }
      function line(d, col, w, extra) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linejoin="miter" stroke-linecap="round"' + (extra ? " " + extra : "") + "/>"; }
      function g(id, inner, attrs) { return '<g id="' + P + id + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
      function at(x, y, s, inner, rot) { return '<g transform="translate(' + n1(x) + "," + n1(y) + ")" + (rot ? " rotate(" + rot + ")" : "") + (s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function text(x, y, size, t, fill, extra) {
        return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-family="Oswald" font-weight="600" font-size="' + size + '" fill="' + (fill || ink) + '"' + (extra ? " " + extra : "") + ">" + t + "</text>";
      }
      function reps(span, dur) { return Math.max(1, Math.floor(span / dur) - 1); }
      // Two-link arm IK: the angles (deg, 0 = down, + toward +x) that put a hand of segment length len at target.
      function ik(sh, target, len, bend) {
        var dx = target[0] - sh[0], dy = target[1] - sh[1], d = Math.min(Math.sqrt(dx * dx + dy * dy), 2 * len - 0.5);
        var base = (Math.atan2(dx, dy) * 180) / Math.PI, off = (Math.acos(d / (2 * len)) * 180) / Math.PI;
        return [base + bend * off, base - bend * off];
      }
      // Put a prop in a person's hand (it then swings with the arm): the prop is drawn around (0,0) at the hand.
      function inHand(svg, prop, o, side) {
        var h = KIT.rig(o).handLocal[side], cls = side ? "arm-r" : "arm-l";
        return svg.replace('<g class="' + cls + '">', '<g class="' + cls + '"><g transform="translate(' + n1(h[0]) + "," + n1(h[1]) + ')">' + prop + "</g>");
      }

      // ── THE FUSE (storyboard, Running gag: the fuse): the same in every Part 11 scene (copied from war-through-wifi). ──
      function fuse(layer, tl) {
        var Fz = V ? { cx: 110, cy: 150, r: 56, collar: [94, 80, 32, 14], d: "M110,86 Q116,64 148,66 L690,66", L0: 560, k: 2.2 }
          : { cx: 112, cy: 116, r: 58, collar: [96, 46, 32, 14], d: "M112,52 Q118,30 150,32 L780,32", L0: 640, k: 2.6 };
        var c = Fz.collar, t0 = sc.start;
        var cords = '<path id="' + P + "cord-a" + '" d="' + Fz.d + '" fill="none" stroke="' + ink + '" stroke-width="9" stroke-linecap="round"/>' +
          '<path id="' + P + "cord-b" + '" d="' + Fz.d + '" fill="none" stroke="' + C.tan + '" stroke-width="5" stroke-linecap="round"/>';
        var spark = '<g id="' + P + 'spark"><g id="' + P + 'spark-flare"><g id="' + P + 'spark-flick">' +
          KIT.star(0, 0, 14, C.yellow) + '<g transform="rotate(45)">' + KIT.star(0, 0, 10, C.yellow) + "</g>" + KIT.star(0, 0, 8, C.orange) + "</g></g>" +
          '<g id="' + P + 'spark-smoke">' + line("M2,-12 q-7,-8 0,-15 q7,-8 0,-15", "#8C8782", 2.6) + "</g></g>";
        layer.innerHTML = KIT.svg(W, H, cords +
          at(Fz.cx, Fz.cy + Fz.r, 1, KIT.props.earthGlobe({ r: Fz.r })) +
          S([pg(R(c[0], c[1], c[2], c[3]))], C.navy, 3) + line("M" + (c[0] + 3) + "," + (c[1] + 3) + " H" + (c[0] + c[2] - 3), C.orange, 1.6) +
          line("M" + (c[0] + 2) + "," + (c[1] + 8) + " H" + (c[0] + c[2] - 2), C.peri, 1.4) + spark);
        var a = document.getElementById(P + "cord-a"), b = document.getElementById(P + "cord-b"), sp = document.getElementById(P + "spark");
        KIT.onTime(tl, D, function (lt) {
          var Lc = Math.max(0, Fz.L0 - Fz.k * (t0 + lt)), p = a.getPointAtLength(Lc);
          a.setAttribute("stroke-dasharray", Lc.toFixed(1) + " 3000");
          b.setAttribute("stroke-dasharray", Lc.toFixed(1) + " 3000");
          sp.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")");
        });
        var fl = document.getElementById(P + "spark-flick"), sm = document.getElementById(P + "spark-smoke");
        gsap.set(fl, { svgOrigin: "0 0" });
        tl.fromTo(fl, { scale: 0.8 }, { scale: 1.2, duration: 0.09, repeat: Math.floor(D / 0.09) - 1, yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo(sm, { x: -2, opacity: 0.9 }, { x: 2, opacity: 0.6, duration: 0.4, repeat: Math.floor(D / 0.4) - 1, yoyo: true, ease: "sine.inOut" }, 0);
        return document.getElementById(P + "spark-flare");
      }

      // ── TANK: copied from war-through-wifi (which defines it); this scene uses only the flat one. Change both. ──
      // A toy tank facing right, drawn around (0,0) with its treads on y 0, in tank units: about 360 x 150.
      // o.flat: flattened like a pancake: squashed to 18% height on the tread line (8% wider), the turret squeezed
      //   forward, the barrel bent down to the ground, the hatch lid sprung up on a coil spring, and two eyes in the
      //   hatch slot (the Weapons Maker, still in there). Parts (flat): .tank-eyes (blink them: scaleY 1 -> 0.1 about
      //   data-cx, data-cy), .tank-lid-flat (wobble the sprung lid about data-cx, data-cy).
      var TANK_FLAT_HATCH = [40, -24];
      function tankFlat() {
        var sx = 1.08, sy = 0.18, T = function (pts, dx) { return pts.map(function (p) { return [p[0] * sx + (dx || 0), p[1] * sy]; }); };
        var tread = [[-178, -40], [-164, -52], [164, -52], [178, -40], [174, -10], [162, 0], [-162, 0], [-174, -10]];
        var hull = [[-186, -50], [186, -50], [180, -62], [152, -90], [-154, -90], [-182, -64]];
        var tur = [[-76, -90], [70, -90], [54, -126], [-62, -126]];
        var out = S([pg(T(tread))], C.navy, 3.4);
        [-125, -75, -25, 25, 75, 125].forEach(function (wx) { out += S([el(wx * sx, -4.5, 17, 3.2)], C.tan, 2.2); });
        out += S([pg(T(hull))], C.slate, 3.4) + line("M-162,-15.8 H160", C.orange, 1.4);
        var bd = "M80,-19 L170,-21 L204,-3 L238,-2";
        out += line(bd, ink, 15) + line(bd, C.slate, 8.5) + S([pg([[234, -9], [258, -10], [260, 3], [234, 4]])], C.slate, 3);
        out += S([pg(T(tur, 40))], C.slate, 3.4) + line("M-20,-22.4 H95", C.orange, 1.4);
        var h = TANK_FLAT_HATCH, spring = "";
        for (var i = 0; i < 6; i++) spring += (i ? " L" : "M") + pt(h[0] - 18 + (i % 2 ? 7 : -7) - i * 1.5, h[1] - 6 - i * 7);
        out += '<g class="tank-lid-flat" data-cx="' + (h[0] - 18) + '" data-cy="' + (h[1] - 3) + '">' + line(spring, ink, 2.6) +
          '<g transform="translate(' + pt(h[0] - 27, h[1] - 48) + ') rotate(-24)">' + S([pg([[-24, -5], [24, -5], [22, 4], [-22, 4]])], C.slate, 3) + line("M-20,-3 H20", C.orange, 1.4) + "</g></g>";
        out += S([el(h[0], h[1], 26, 6)], C.ink, 3) +
          '<g class="tank-eyes" data-cx="' + h[0] + '" data-cy="' + (h[1] - 5) + '">' + [-8, 8].map(function (dx) {
            return S([el(h[0] + dx, h[1] - 5, 7, 8)], "#FFFFFF", 2) + F(ci(h[0] + dx - 1.5, h[1] - 7, 2.8), ink);
          }).join("") + "</g>";
        return out;
      }

      // ── Layout, per canvas shape ──────────────────────────────────────────────────────────────────
      // Two panels on one long classroom wall: the first (the map, then the tank and the laptop) and, one frame to
      // the right, the second (the chalkboard, the Politician, the desk); the camera pans across on "homework.".
      // Panel 1: map: [center x, base y, width] of the big map, and wall: [center x, center y, scale] it shrinks to;
      // floor: the floor line; tank: [x, scale]; lapFloor: the laptop's [x, size] on the floor; hack: the HACK tag's
      // size (laptop units); fight: the FIGHT tag's size; chute: how high its parachute hangs before it gives;
      // crime: the CRIME card's center. Panel 2 (in that panel's own screen px): board: [x0, y0, x1, y1, text size];
      // box: the soapbox [x, height]; pol: the Politician's scale; desk: [center x, top y, width]; kid: x;
      // lapDesk: the laptop's x on the desk; sheet: the worksheet's [center x, width, height].
      var L = V
        ? { map: [540, 1250, 940], wall: [295, 400, 0.46], floor: 1330, tank: [420, 1.3], lapFloor: [840, 2.2], hack: 0.55, fight: 2.6, chute: 240, crime: [760, 600],
            board: [320, 620, 1010, 900, 52], box: [230, 300], pol: 2.0, desk: [720, 1190, 460], kid: 660, lapDesk: 560, sheet: [850, 170, 150] }
        : { map: [860, 860, 1000], wall: [1300, 330, 0.5], floor: 860, tank: [600, 1.9], lapFloor: [1240, 3.0], hack: 0.75, fight: 3.2, chute: 210, crime: [900, 280],
            board: [380, 230, 960, 530, 58], box: [330, 150], pol: 2.2, desk: [1180, 690, 480], kid: 1110, lapDesk: 1000, sheet: [1300, 210, 170] };
      // panel 2 sits one frame to the right
      L.board[0] += W; L.board[2] += W; L.box[0] += W; L.desk[0] += W; L.kid += W; L.lapDesk += W; L.sheet[0] += W;
      var FL = L.floor, PS = L.pol, KS = 0.7 * PS;

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // ── The world map (the same framing as failed-states' first shot), its bombs and the sanction stamp ──
      function mapGeo(w, mx, my) {
        var h = Math.round(w * 0.62), m = Math.round(w * 0.055), iw = w - 2 * m, ih = h - 2 * m;
        var ix = mx - w / 2 + m, iy = my - h - 9 + m;
        return { h: h, at: function (p) { return [ix + (p[0] * iw) / 400, iy + (p[1] * ih) / 220]; } };
      }
      var MW = L.map[2], geo = mapGeo(MW, L.map[0], L.map[1]), mapCy = L.map[1] - 9 - geo.h / 2;
      var BOMBS = [[226, 96], [266, 88], [302, 62]], SANCT = [330, 44];
      var bombs = BOMBS.map(function (b, i) {
        var p = geo.at(b);
        return at(p[0], p[1], 1, g("bomb" + i, g("bomb" + i + "-in", KIT.props.bomb({ size: 0.9 })), 'opacity="0"') + at(0, 2, 0.13, g("cloud" + i, KIT.nuke())));
      }).join("");
      var sp = geo.at(SANCT);
      var sanction = at(sp[0], sp[1] + 30, 1, g("smark", KIT.props.stampMark({ text: "SANCTIONED", size: V ? 1.05 : 1.15, angle: -7 }), 'opacity="0"')) +
        at(sp[0], sp[1] + 30, 1, g("stamp", KIT.props.stamp({ text: "SANCTIONED", size: 2.6, color: C.war }), 'opacity="0"'));
      var world = g("world", at(L.map[0], L.map[1], 1, KIT.props.worldMap({ w: MW })) + bombs + sanction);

      // ── The classroom: a floor line, the chalkboard on the wall, a soapbox ──
      var floor = g("floor", '<path d="M44,' + FL + " H" + (2 * W - 44) + '" stroke="' + ink + '" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>');
      var B = L.board, bw = B[2] - B[0], bh = B[3] - B[1], TSZ = B[4];
      var line1 = "FIGHT: $$$$$", line2 = "HACK: $";
      var chalkY1 = B[1] + bh * 0.38, chalkY2 = B[1] + bh * 0.74, chalkX = B[0] + 74;
      var chalkClip = '<defs><clipPath id="' + P + 'ch1"><rect id="' + P + 'ch1-r" x="' + chalkX + '" y="' + (chalkY1 - TSZ) + '" width="0" height="' + (TSZ * 1.3) + '"/></clipPath>' +
        '<clipPath id="' + P + 'ch2"><rect id="' + P + 'ch2-r" x="' + chalkX + '" y="' + (chalkY2 - TSZ) + '" width="0" height="' + (TSZ * 1.3) + '"/></clipPath></defs>';
      var board = g("board", chalkClip + S([pg(R(B[0] - 14, B[1] - 14, bw + 28, bh + 28))], C.tan, 4) + S([pg(R(B[0], B[1], bw, bh))], C.slate, 3) +
        line("M" + (B[0] + 30) + "," + (B[1] + 24) + " L" + (B[0] + 90) + "," + (B[1] + 20) + " M" + (B[2] - 140) + "," + (B[3] - 30) + " L" + (B[2] - 60) + "," + (B[3] - 36), "#5C6F8E", 4, 'opacity="0.5"') +
        S([pg(R(B[0] + 20, B[3] + 14, bw - 40, 12))], C.tan, 3) + S([pg(R(B[0] + 60, B[3] + 6, 26, 8))], "#FBF6E6", 1.6) +
        '<g clip-path="url(#' + P + 'ch1)">' + text(chalkX, chalkY1, TSZ, line1, "#F3ECD0", 'letter-spacing="3"') + "</g>" +
        '<g clip-path="url(#' + P + 'ch2)">' + text(chalkX, chalkY2, TSZ, line2, "#F3ECD0", 'letter-spacing="3"') + "</g>", 'opacity="0"');
      // the soapbox: wooden crates, stacked when he needs to be taller (9:16)
      var BX = L.box, soapbox = "", nCr = Math.ceil(BX[1] / 155), crH = BX[1] / nCr;
      for (var cr = 0; cr < nCr; cr++) {
        var cy0 = -crH * (cr + 1), cx0 = cr % 2 ? -56 : -62;
        soapbox += S([pg(R(cx0, cy0, 124, crH))], "#C99A63", 4) + line("M" + cx0 + "," + (cy0 + crH * 0.5) + " H" + (cx0 + 124) + " M" + (cx0 + 32) + "," + cy0 + " V" + (cy0 + crH) + " M" + (cx0 + 92) + "," + cy0 + " V" + (cy0 + crH), ink, 2, 'opacity="0.5"') +
          line("M" + (cx0 + 120) + "," + (cy0 + 4) + " V" + (cy0 + crH - 4), C.orange, 1.8);
      }

      // ── The tank (flat, from war-through-wifi) and the laptop on the floor ──
      var TK = L.tank;
      var tankArt = at(TK[0], FL, TK[1], g("tank", g("tank-sq", tankFlat())));
      var tankTop = FL - 22 * TK[1];
      var dust = at(TK[0], FL, 1, g("dust", [[-260, -12, 22], [-200, -20, 30], [220, -18, 28], [290, -10, 20]].map(function (d) { return S([ci(d[0], d[1], d[2])], "#C9C2B5", 3); }).join(""), 'opacity="0"'));
      // the laptop: the war seal on its screen, the HACK: $ tag tied to its lid corner
      var screen = '<rect x="-24" y="-42" width="48" height="31" fill="' + C.cyan + '" opacity="0.35"/>' + '<g transform="translate(0,-27)">' + KIT.moneySeal("war", 0, 0, 8.5) + "</g>";
      var lap = KIT.props.laptop({}).replace("<!--laptop-screen-->", screen);
      var hackTag = g("hack", g("hack-in", KIT.props.priceTag({ text: "HACK: $", size: L.hack, angle: 26 })), 'opacity="0"');
      var LF = L.lapFloor;
      var laptop = at(LF[0], FL, 1, g("lap", g("lap-s", '<g transform="scale(' + LF[1] + ')">' + lap + at(27, -44, 1, hackTag) + "</g>"), 'opacity="0"'));

      // ── The price tags: FIGHT: $$$$$ under a little parachute (it hangs from its knot at (0,0)) ──
      var fightTag = KIT.props.priceTag({ text: "FIGHT: $$$$$", size: L.fight, angle: 0 });
      var canopy = g("canopy", line("M0,0 L-70,-104 M0,0 L-24,-118 M0,0 L24,-118 M0,0 L70,-104", ink, 2) +
        S([pg([[-84, -100], [-70, -132], [-40, -152], [0, -160], [40, -152], [70, -132], [84, -100], [56, -106], [28, -110], [0, -112], [-28, -110], [-56, -106]])], "#FBF6E6", 3.4) +
        F(pg([[-70, -132], [-40, -152], [-28, -110], [-56, -106]]), C.war) + F(pg([[40, -152], [70, -132], [56, -106], [28, -110]]), C.war) +
        F(pg([[-6, -160], [6, -160], [8, -112], [-8, -112]]), C.war));
      var tagW = (12 * 18 * 0.5 + 30) * L.fight;
      var fight = at(TK[0] - tagW * 0.47, 0, 1, g("fight", g("canopy-s", '<g transform="scale(' + n1(Math.max(1, L.fight / 2.3)) + ')">' + canopy + "</g>") + g("fight-tag", fightTag), 'opacity="0"'));

      // ── The CRIME card and its red cross-out ──
      var CR = L.crime, cw = V ? 230 : 250, chh = V ? 84 : 92;
      var crime = at(CR[0], CR[1], 1, g("crime", F(pg(R(-cw / 2 + 6, -chh / 2 + 7, cw, chh)), ink) + S([pg(R(-cw / 2, -chh / 2, cw, chh))], "#FBF6E6", 4) +
        F(pg(R(-cw / 2 + 8, -chh / 2 + 8, cw - 16, chh - 16)), "none", 'stroke="' + C.orange + '" stroke-width="2"') +
        text(0, chh * 0.24, chh * 0.62, "CRIME", ink, 'text-anchor="middle" letter-spacing="5"') +
        '<path id="' + P + 'xout" d="M' + (-cw / 2 - 16) + "," + (chh * 0.18) + " L" + (cw / 2 + 16) + "," + (-chh * 0.22) + '" stroke="' + C.war + '" stroke-width="12" stroke-linecap="round" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>', 'opacity="0"'));
