    (function () {

      function dbm(pid) {

        })();
        var stack = at(ST[0], G, 1, g("stk-rot",

          '<g clip-path="url(#' + P + 'stk-clip)">' + at(SW / 2, 0, 1, billStack(SW, nMax, 41)) + "</g>" +
          at(SW / 2, -ST[5], 1, g("dtag", g("dtag-in", tag(V ? ["THINGS THAT", "DESTROY"] : ["THINGS THAT", "DESTROY"], V ? 23 : 28, V ? 160 : 190)), 'opacity="0"')) +
          at(SW * 0.72, -ST[6], 1, g("ros", g("ros-in", rosette), 'opacity="0"'))));

        // ── The crates (one group: squashed flat by the stack), the spare pile, the MAKE tag ──

        var skin = "#D9B48F", hx = L.bld + 16, hy0 = G - SW, armLen = V ? 62 : 72;

        var E = L.earth, er = E[2], a0 = -46, a1 = a0 + 41.4, am = (a0 + a1) / 2, ecy = -er, rad = Math.PI / 180;
        var restPts = [[0, ecy]].concat(arcPts(0, ecy, er + 9, a1, a0 + 360, 40));

          '<defs><clipPath id="' + P + 'rest-clip"><' + pg(restPts) + "/></clipPath></defs>" +

        var sliceSurf = '<defs><clipPath id="' + P + 'sl-clip"><' + pg(wedge(er + 9)) + '/></clipPath></defs><g clip-path="url(#' + P + 'sl-clip)">' + at(0, er, 1, KIT.props.earthGlobe({ r: er })) + "</g>";
