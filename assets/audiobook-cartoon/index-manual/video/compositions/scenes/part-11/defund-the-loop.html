<template id="defund-the-loop-template">
  <!-- defund-the-loop · Layer B (storyboards/part-11-civilization-countdown.md): the ledger loop as loop-not-line-item
       left it, war papers racing round it. "treaty": a 1% TREATY scroll unrolls in the ring (whoosh) and folds itself into
       a railroad switch; "breaks": it slams into the ring at the bottom and tears it open (clank); every war paper that
       reaches the gap drops out into the color-flip funnel. "Redirect": the funnel's lever pulls and it rattles;
       "medical": they come out with the teal cross seal (ding) and walk into the lab, where the Scientist holds the door.
       "rewarding": the factory's bullseye flips back to SUCCESS (cash register) and papers walk in. "crime": the Builder
       pulls off his mask and walks to the factory; "irrational,": the Kid shuts his laptop (click), unmasks and follows
       the papers to the lab. "defund": the press runs dry (a moth flies out), the factory's missile chimneys go out one by
       one (sizzle), the lamps go dark, the THINGS THAT DESTROY stack drains and lowers the Weapons Maker; "cycle." he
       finds no papers and lays his missile down asleep. "outlaw": the Politician hammers an ILLEGAL sign onto the ring
       (hammer); the last war paper runs straight past it; "defund" (2): it drops through the gap and comes out teal
       (ding). After "it.": the empty loop wobbles and falls flat (clank), and the fuse sputters out (sizzle). -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #defund-the-loop-cam, #defund-the-loop-bg, #defund-the-loop-art, #defund-the-loop-pip, #defund-the-loop-fuse, #defund-the-loop-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="defund-the-loop" data-width="1920" data-height="1080" data-start="0" data-duration="17.78">
    <div id="defund-the-loop-cam">
      <div id="defund-the-loop-bg"></div>
      <div id="defund-the-loop-art"></div>
      <div id="defund-the-loop-pip"></div>

  </div>
  <script src="assets/vendor/gsap.min.js"></script>

  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "defund-the-loop";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, P = ID + "-";

      // ── Drawing helpers (the kit's print look: a navy pass under each fill, mitred corners) ──
      function n1(v) { var r = Math.round(v * 10) / 10; return String(r === 0 ? 0 : r); }
      function pt(x, y) { return n1(x) + "," + n1(y); }
      function polyD(pts) { return "M" + pts.map(function (p) { return pt(p[0], p[1]); }).join(" L") + " Z"; }
      function pg(pts) { return 'path d="' + polyD(pts) + '"'; }
      function ci(cx, cy, r) { return 'circle cx="' + n1(cx) + '" cy="' + n1(cy) + '" r="' + n1(r) + '"'; }
      function el(cx, cy, rx, ry) { return 'ellipse cx="' + n1(cx) + '" cy="' + n1(cy) + '" rx="' + n1(rx) + '" ry="' + n1(ry) + '"'; }
      function R(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
      function S(tags, col, w) {
        w = w || 4.4;
        return tags.map(function (t) { return "<" + t + ' fill="' + ink + '" stroke="' + ink + '" stroke-width="' + w + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }).join("") +
          tags.map(function (t) { return "<" + t + ' fill="' + col + '"/>'; }).join("");
      }
      function F(tag, col, extra) { return "<" + tag + ' fill="' + col + '"' + (extra ? " " + extra : "") + "/>"; }
      function line(d, col, w, extra) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linejoin="miter" stroke-linecap="round"' + (extra ? " " + extra : "") + "/>"; }
      function g(id, inner, attrs) { return '<g id="' + P + id + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
      function at(x, y, s, inner, rot) { return '<g transform="translate(' + n1(x) + "," + n1(y) + ")" + (rot ? " rotate(" + rot + ")" : "") + (s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function txt(x, y, size, s, col, extra) {
        return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-family="Oswald" font-weight="600" font-size="' + size + '" text-anchor="middle" fill="' + (col || ink) + '"' + (extra ? " " + extra : "") + ">" + s + "</text>";
      }
      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
      function backOut(k) { var c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }
      // a yoyo repeat count that ends by the scene's end: whole half-cycles of dur that fit in the time left after t0
      function reps(t0, dur, t1) { return Math.max(1, Math.floor(((t1 === undefined ? D - 0.05 : t1) - t0) / dur) - 1); }

      // ── THE FUSE (storyboard, Running gag: the fuse): the same in every Part 11 scene, and here it goes out. ──
      // The civilization is a cartoon bomb: a small Earth with a navy screw collar and a lit fuse that burns by part
      // time (L = L0 - k t), so it is continuous across scenes. At tOut it stops burning: the spark sputters twice and
      // goes out in a grey puff, the stub droops, and the Earth lets out one smoke ring.
      function fuse(layer, tl, tOut) {
        var Fz = V ? { cx: 110, cy: 150, r: 56, collar: [94, 80, 32, 14], d: "M110,86 Q116,64 148,66 L690,66", L0: 560, k: 2.2, o: [110, 86], h: 66 }
          : { cx: 112, cy: 116, r: 58, collar: [96, 46, 32, 14], d: "M112,52 Q118,30 150,32 L780,32", L0: 640, k: 2.6, o: [112, 52], h: 32 };
        var c = Fz.collar, t0 = sc.start;
        var cords = '<path id="' + P + "cord-a" + '" d="' + Fz.d + '" fill="none" stroke="' + ink + '" stroke-width="9" stroke-linecap="round"/>' +
          '<path id="' + P + "cord-b" + '" d="' + Fz.d + '" fill="none" stroke="' + C.tan + '" stroke-width="5" stroke-linecap="round"/>';
        var spark = '<g id="' + P + 'spark"><g id="' + P + 'spark-flare"><g id="' + P + 'spark-flick">' +
          KIT.star(0, 0, 14, C.yellow) + '<g transform="rotate(45)">' + KIT.star(0, 0, 10, C.yellow) + "</g>" + KIT.star(0, 0, 8, C.orange) + "</g></g>" +
          '<g id="' + P + 'spark-smoke">' + line("M2,-12 q-7,-8 0,-15 q7,-8 0,-15", "#8C8782", 2.6) + "</g></g>";
        var puff = g("puff", S([ci(-10, 0, 12), ci(8, -6, 14), ci(4, 9, 10)], "#C9C2B5", 2.6), 'opacity="0"');
        var ring = g("smoke-ring", '<ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#8C8782" stroke-width="5"/>', 'opacity="0"');
        layer.innerHTML = KIT.svg(W, H, cords +
          at(Fz.cx, Fz.cy + Fz.r, 1, KIT.props.earthGlobe({ r: Fz.r })) +
          S([pg(R(c[0], c[1], c[2], c[3]))], C.navy, 3) + line("M" + (c[0] + 3) + "," + (c[1] + 3) + " H" + (c[0] + c[2] - 3), C.orange, 1.6) +
          line("M" + (c[0] + 2) + "," + (c[1] + 8) + " H" + (c[0] + c[2] - 2), C.peri, 1.4) + spark + puff +
          at(c[0] + c[2] / 2, c[1] - 6, 1, ring));
        var a = document.getElementById(P + "cord-a"), b = document.getElementById(P + "cord-b"), sp = document.getElementById(P + "spark");
        var Lout = Fz.L0 - Fz.k * (t0 + tOut), pOut = a.getPointAtLength(Lout);
        // the drooping stub: the same start, then hanging down from about where the fuse ran flat
        function droop(k) {
          var x1 = Fz.o[0] + 38, y1 = Fz.h + 6 * k, x2 = Fz.o[0] + 38 + (Lout - 50) * (1 - 0.45 * k), y2 = Fz.h + 70 * k;
          return "M" + Fz.o[0] + "," + Fz.o[1] + " Q" + (Fz.o[0] + 6) + "," + (Fz.o[1] - 22) + " " + x1 + "," + y1 + " Q" + n1((x1 + x2) / 2 + 10) + "," + n1(Fz.h + 4 * k) + " " + n1(x2) + "," + n1(y2);
        }
        KIT.onTime(tl, D, function (lt) {
          var Lc = Math.max(0, Fz.L0 - Fz.k * (t0 + Math.min(lt, tOut))), p;
          if (lt < tOut + 0.3) {
            a.setAttribute("d", Fz.d); b.setAttribute("d", Fz.d);
            p = a.getPointAtLength(Lc);
          } else {
            var k = smooth((lt - tOut - 0.3) / 0.35), d = droop(k);
            a.setAttribute("d", d); b.setAttribute("d", d);
            p = pOut;
          }
          a.setAttribute("stroke-dasharray", Lc.toFixed(1) + " 3000");
          b.setAttribute("stroke-dasharray", Lc.toFixed(1) + " 3000");
          sp.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")");
        });
        var fl = document.getElementById(P + "spark-flick"), sm = document.getElementById(P + "spark-smoke"), flare = document.getElementById(P + "spark-flare");
        gsap.set(fl, { svgOrigin: "0 0" });
        gsap.set(flare, { svgOrigin: "0 0" });
        tl.fromTo(fl, { scale: 0.8 }, { scale: 1.2, duration: 0.09, repeat: reps(0, 0.09, tOut), yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo(sm, { x: -2, opacity: 0.9 }, { x: 2, opacity: 0.6, duration: 0.4, repeat: reps(0, 0.4, tOut), yoyo: true, ease: "sine.inOut" }, 0);
        // sputter, sputter, out
        tl.to(flare, { scale: 0.35, duration: 0.06 }, tOut);
        tl.to(flare, { scale: 1.3, duration: 0.07 }, tOut + 0.08);
        tl.to(flare, { scale: 0.3, duration: 0.06 }, tOut + 0.17);
        tl.to(flare, { scale: 1, duration: 0.06 }, tOut + 0.24);
        tl.to(flare, { scale: 0, duration: 0.08 }, tOut + 0.31);
        tl.to(sm, { opacity: 0, duration: 0.1 }, tOut + 0.3);
        var pf = document.getElementById(P + "puff");
        tl.set(pf, { attr: { transform: "translate(" + n1(pOut.x) + "," + n1(pOut.y) + ")" } }, 0);
        var pfIn = document.createElementNS("http://www.w3.org/2000/svg", "g");
        while (pf.firstChild) pfIn.appendChild(pf.firstChild);
        pf.appendChild(pfIn);
        gsap.set(pfIn, { svgOrigin: "0 0" });
        tl.fromTo(pf, { opacity: 0 }, { opacity: 1, duration: 0.05, immediateRender: false }, tOut + 0.3);
        tl.fromTo(pfIn, { scale: 0.3, y: 0 }, { scale: 1.4, y: -16, duration: Math.min(0.45, D - 0.02 - tOut - 0.3), ease: "power2.out", immediateRender: false }, tOut + 0.3);
        tl.to(pf, { opacity: 0, duration: 0.25 }, tOut + 0.55 > D - 0.27 ? D - 0.27 : tOut + 0.55);
        var sr = document.getElementById(P + "smoke-ring");
        gsap.set(sr, { svgOrigin: "0 0" });
        tl.fromTo(sr, { opacity: 0, scale: 0.4, y: 0 }, { opacity: 1, scale: 1.3, y: -22, duration: Math.max(0.12, D - 0.02 - tOut - 0.36), ease: "power1.out", immediateRender: false }, tOut + 0.34);
      }

      // ── THE LEDGER LOOP: copied from loop-not-line-item (this scene starts on its last frame); change both. ──────
      // One MILITARY line of a ledger page, a strip of cream ledger paper 52 wide (navy edges, two blue rules, the red
      // margin rule at its seam), bent into a big upright ring. RING: its centerline ellipse. The war papers run
      // clockwise round the inside of it like a loop-the-loop, feet on the strip. Six station lamps sit on the strip at
      // ST (degrees, 0 = 3 o'clock, -90 = the top, clockwise), each with its label tag inside the ring at TAG.
      var LAY = V
        ? { ring: { cx: 540, cy: 880, rx: 320, ry: 350, w: 52 }, G: 1430, bs: 0.54,
            st: [-90, -40, 35, 100, 150, 210], tagSize: 25,
            tag: [[540, 650], [677, 768], [681, 975], [540, 1104], [399, 975], [403, 768]] }
        : { ring: { cx: 870, cy: 450, rx: 390, ry: 205, w: 52 }, G: 880, bs: 0.5,
            st: [-90, -40, 38, 112, 152, 208], tagSize: 22,
            tag: [[870, 352], [1050, 398], [1050, 503], [880, 548], [668, 488], [668, 394]] };
      var RG = LAY.ring, HW = RG.w / 2;
      var TAGS = ["PRINT MONEY", "INFLATION", "WORK PAYS LESS", V ? "TALENT TO\nCYBERCRIME" : "TALENT TO CYBERCRIME", "DESTRUCTIVE\nECONOMY GROWS", "MORE MILITARY\nSPENDING"];

      // The ring's centerline by arc length: s = 0 at the top, increasing clockwise. at(s): the point, the unit
      // tangent (the way the papers run) and the outward normal.
      function track(E) {
        var N = 1440, th = [], s = [0], px = [], py = [];
        for (var i = 0; i <= N; i++) {
          var a = -Math.PI / 2 + (2 * Math.PI * i) / N;
          th.push(a); px.push(E.cx + E.rx * Math.cos(a)); py.push(E.cy + E.ry * Math.sin(a));
          if (i) s.push(s[i - 1] + Math.hypot(px[i] - px[i - 1], py[i] - py[i - 1]));
        }
        var L = s[N];
        function thAt(sv) {
          sv = ((sv % L) + L) % L;
          var lo = 0, hi = N;
          while (hi - lo > 1) { var m = (lo + hi) >> 1; if (s[m] <= sv) lo = m; else hi = m; }
          return th[lo] + (th[hi] - th[lo]) * ((sv - s[lo]) / (s[hi] - s[lo] || 1));
        }
        function pointAt(a) {
          var tx = -E.rx * Math.sin(a), ty = E.ry * Math.cos(a), tl2 = Math.hypot(tx, ty);
          var nx = E.ry * Math.cos(a), ny = E.rx * Math.sin(a), nl = Math.hypot(nx, ny);
          return { x: E.cx + E.rx * Math.cos(a), y: E.cy + E.ry * Math.sin(a), tx: tx / tl2, ty: ty / tl2, nx: nx / nl, ny: ny / nl, th: a };
        }
        return {
          L: L, at: function (sv) { return pointAt(thAt(sv)); }, pointAt: pointAt,
          sAt: function (deg) {
            var a = (deg * Math.PI) / 180, k = ((a + Math.PI / 2) / (2 * Math.PI)) % 1;
            var i = Math.round(((k + 1) % 1) * N);
            return s[i];
          },
        };
      }
      var T = track(RG);
      // The strip's centerline as points: u 0..1 runs from the seam at the bottom clockwise round to the seam.
      function ringPts(n, E) {
        var out = [];
        for (var i = 0; i <= n; i++) { var a = Math.PI / 2 + (2 * Math.PI * i) / n; out.push([E.cx + E.rx * Math.cos(a), E.cy + E.ry * Math.sin(a)]); }
        return out;
      }
      function ptsD(pts) { return "M" + pts.map(function (p) { return pt(p[0], p[1]); }).join(" L"); }
      // The strip: navy edges, cream paper, two blue rules, MILITARY lettered along it (two textPaths on the
      // centerline, so the page shows one line item and the ring two), and the red margin rule at the seam.
      var TXT_A = "MILITARY . . . . . . . . . . . . . . . . $$$$$$$$$$$$$$$$$$$$$$$$$$$$$$";
      var TXT_B = "MILITARY . . . . . . . . . . $$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$";
      function stripSvg(pre, d, lenA, offB, lenB) {
        return '<path id="' + pre + 'strip-sh" d="' + d + '" fill="none" stroke="' + ink + '" stroke-width="' + (RG.w + 6) + '" opacity="0.18" transform="translate(6,8)"/>' +
          '<path id="' + pre + 'strip-a" d="' + d + '" fill="none" stroke="' + ink + '" stroke-width="' + (RG.w + 5) + '"/>' +
          '<path id="' + pre + 'strip-b" d="' + d + '" fill="none" stroke="#FBF6E6" stroke-width="' + (RG.w - 1) + '"/>' +
          '<path id="' + pre + 'strip-c" d="' + d + '" fill="none" stroke="#8FA7C4" stroke-width="' + (RG.w - 12) + '"/>' +
          '<path id="' + pre + 'strip-d" d="' + d + '" fill="none" stroke="#FBF6E6" stroke-width="' + (RG.w - 15) + '"/>' +
          '<path id="' + pre + 'strip-path" d="' + d + '" fill="none" stroke="none"/>' +
          '<text font-family="Oswald" font-weight="600" font-size="22" fill="' + ink + '" dominant-baseline="central">' +
          '<textPath href="#' + pre + 'strip-path" startOffset="16" textLength="' + lenA + '" lengthAdjust="spacing">' + TXT_A + "</textPath></text>" +
          '<text font-family="Oswald" font-weight="600" font-size="22" fill="' + ink + '" dominant-baseline="central">' +
          '<textPath href="#' + pre + 'strip-path" startOffset="' + offB + '" textLength="' + lenB + '" lengthAdjust="spacing">' + TXT_B + "</textPath></text>" +
          '<path id="' + pre + 'strip-m" d="M0,0" fill="none" stroke="' + C.war + '" stroke-width="3"/>';
      }
      function setStrip(pre, pts) {
        var d = ptsD(pts);
        ["strip-sh", "strip-a", "strip-b", "strip-c", "strip-d", "strip-path"].forEach(function (k) { document.getElementById(pre + k).setAttribute("d", d); });
        // the red margin rule across the strip, a little way in from its start
        var a = pts[2], b = pts[3], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
        document.getElementById(pre + "strip-m").setAttribute("d", "M" + pt(a[0] + nx * HW, a[1] + ny * HW) + " L" + pt(a[0] - nx * HW, a[1] - ny * HW));
      }
      // A station lamp on the strip: number k, unlit (cream) with a lit face on top (here lit from the start).
      function lamp(k) {
        var p = T.at(T.sAt(LAY.st[k]));
        return at(p.x, p.y, 1, g("lamp" + k, S([ci(0, 0, 17)], C.cream, 3.4) + txt(0, 7.5, 19, String(k + 1), ink) +
          g("lamp-on" + k, S([ci(0, 0, 17)], C.yellow, 3.4) + F(ci(0, 0, 10), C.orange) + txt(0, 7.5, 19, String(k + 1), ink))));
      }
      // A label tag inside the ring (the world map's label style: Oswald navy on cream, navy outline).
      function tag(k) {
        var lines = TAGS[k].split("\n"), fs = LAY.tagSize, w = Math.max.apply(null, lines.map(function (l) { return l.length; })) * fs * 0.5 + 30, h = lines.length * fs * 1.15 + 16;
        var c = LAY.tag[k], body = S([pg(R(-w / 2, -h / 2, w, h))], "#FBF6E6", 3.4) + line("M" + n1(-w / 2 + 6) + "," + n1(-h / 2 + 6) + " H" + n1(w / 2 - 6), C.orange, 1.6);
        lines.forEach(function (l, i) { body += txt(0, -h / 2 + 8 + fs * 0.95 + i * fs * 1.15, fs, l, ink, 'letter-spacing="0.8"'); });
        return at(c[0], c[1], 1, g("tag" + k, body));
      }
      // A walking paper bill (KIT.money) with its two strides, for flipping between them as it runs.
      function bill(id, kind, attrs) {
        return g(id, '<g class="st0">' + KIT.money(kind, 0) + '</g><g class="st1" opacity="0">' + KIT.money(kind, 1) + "</g>" +
          '<g class="trail" opacity="0">' + line("M58,-14 H104 M62,2 H122 M58,18 H98", ink, 5) + "</g>", attrs);
      }
      // Place a bill at arc s of the ring, feet on the strip's inner edge, the right way up for a loop-the-loop.
      function onRing(elm, s, k, legs, trail) {
        var p = T.at(s), bs = LAY.bs * (k === undefined ? 1 : k), off = HW + 46 * bs;
        var x = p.x - p.nx * off, y = p.y - p.ny * off, rot = (Math.atan2(-p.nx, p.ny) * 180) / Math.PI;
        elm.setAttribute("transform", "translate(" + n1(x) + "," + n1(y) + ") rotate(" + rot.toFixed(1) + ") scale(" + bs.toFixed(3) + ")");
        if (legs !== undefined) { elm.children[0].setAttribute("opacity", legs ? 0 : 1); elm.children[1].setAttribute("opacity", legs ? 1 : 0); }
        elm.children[2].setAttribute("opacity", trail || 0);
      }

      // ── THE PEOPLE (storyboard Cast; the Builder's and the Kid's options are fixed so they match every scene) ──
      var BUILDER = { tone: 1, outfit: "overalls", color: 0, seed: 7, mood: "eager" };
      var KID = { tone: 2, outfit: "shirt", color: 3, seed: 11, mood: "eager", mask: true, build: { hs: 1.3, legs: 0.6, th: 0.75, neck: 0.5 } };
      // the Builder's hammer, hanging head-down from a hand at (x, y), in person units
      function hammer(h) {
        return '<g transform="translate(' + pt(h[0], h[1] + 4) + ') rotate(8)">' + S([pg(R(-2.4, -4, 4.8, 30))], C.tan, 2.4) + S([pg(R(-9, 24, 18, 9))], C.slate, 2.4) + line("M-7,27 H7", C.orange, 1.2) + "</g>";
      }
      // the baby missile the Weapons Maker cradles (kit.js's held "missile", copied); asleep: eyes shut, lying flat
