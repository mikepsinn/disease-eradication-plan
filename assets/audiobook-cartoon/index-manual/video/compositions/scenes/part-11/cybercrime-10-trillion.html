       budget's last frame (no seam). "Cybercrime": the Masked Crook pops up in the big cart's back end and opens a laptop
       on its rim (click). "ten point five trillion": a bank stands up on a hill at the right with a WiFi symbol on a pole
       beside it; its vault swings open and plain papers walk out in single file, hop into the WiFi and pop out of the
       laptop with the red missile seal on (pops), arcing into the big cart, whose tag drops on: CYBERCRIME: $10.5
       TRILLION / YEAR. "fifteen percent": the line goes two abreast, then three; a second tag, +15% / YEAR, clips onto
       the first. "annually.": the big cart sags, its wheels splaying out under the weight. "This is not a": the Weapons
       Maker and the Crook look at each other across the gap; "separate": they lean over and shake hands (pat).
       "problem.": a chain snaps the two carts together, right across the Weapons Maker's middle (clank). after
       "problem.": both turn to us and grin, and his cigar perks up. The fuse burns in the top-left corner.

       FOR destroy-beats-make (which rolls these two chained carts in), the carts as this scene leaves them. Cart units are
       KIT.props.shoppingCart's (facing right, the floor at y 0, the basket x -40..54, y -74..-38, the grip at (-53,-91));

         9:16: G 1380. Small cart [210, 2.0, -1]; the Weapons Maker at x 440, scale 2.0; big cart [775, 3.8, 1], sagged
               the same 6 units (23 px); the chain from (290, 1232) to (661, 1259).
       The big cart holds a heap of 37 war papers (KIT.money("war"), scale 0.6 in 16:9, 0.5 in 9:16) and the Masked Crook
       (scale 1.9 / 1.6) with his laptop on its back rim; the small cart holds Part 10's warheads (in tiny tags, one
