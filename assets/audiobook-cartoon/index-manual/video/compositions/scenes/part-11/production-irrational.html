<template id="production-irrational-template">
  <!-- production-irrational · Layer B (storyboards/part-11-civilization-countdown.md): slide left onto a little factory
       with a SUCCESS sign on its roof. The Builder loads crates onto a conveyor that carries them off the paper
       ("manufacture", thunk); on "exports" every crate gets its EXPORTS stencil. Next door, behind a desk, the Masked
       Crook types ("hacking", typewriter) and his laptop spits war papers onto a pile ("banks", cash register) that grows
       past the factory roof by "extraction,". "producing anything": the SUCCESS sign lights up like a marquee. "target":
       it flips over to a bullseye (switch); "rather": a grinning missile pokes in at the top of the frame and whistles
       down (slide-down); "success." +0.1: it hits. A white flash, a boom, a mushroom cloud, the frame shakes. The Crook
       keeps typing. "irrational.": the smoke clears (sizzle) on the factory charred and bent and the Builder charred
       black, hair straight up, smoking, still holding a crate, blinking. "Parasitism": he drops the crate and his hammer
       (thunk), zips over, sits down at the desk next to the Crook and opens the spare laptop (click). After "survival.":
       the Crook hands him a domino mask and he puts it on (pop). The fuse burns in the top-left corner. -->
  <style>

    #production-irrational-cam, #production-irrational-bg, #production-irrational-art, #production-irrational-pip, #production-irrational-fuse, #production-irrational-grain { position: absolute; inset: 0; }
    #production-irrational-flash { position: absolute; inset: -40px; background: #FFFFFF; opacity: 0; }
  </style>
  <div id="root" data-composition-id="production-irrational" data-width="1920" data-height="1080" data-start="0" data-duration="17.06">
    <div id="production-irrational-cam">
      <div id="production-irrational-bg"></div>
      <div id="production-irrational-art"></div>
      <!-- the blast's white flash: over the Earth art, under Wishonia's corner frame (her reaction stays visible) -->
      <div id="production-irrational-flash"></div>

    </div>
    <!-- the fuse burns in its own layer, above the camera (the slide does not move it) and under the grain -->

    <div id="production-irrational-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/places.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "production-irrational";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, P = ID + "-";

      // ── Drawing helpers (the kit's print look: a navy pass under each fill, mitred corners) ──
      function n1(v) { var r = Math.round(v * 10) / 10; return String(r === 0 ? 0 : r); }
      function pt(x, y) { return n1(x) + "," + n1(y); }
      function polyD(pts) { return "M" + pts.map(function (p) { return pt(p[0], p[1]); }).join(" L") + " Z"; }
      function pg(pts) { return 'path d="' + polyD(pts) + '"'; }
      function ci(cx, cy, r) { return 'circle cx="' + n1(cx) + '" cy="' + n1(cy) + '" r="' + n1(r) + '"'; }
      function R(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
      function S(tags, col, w) {
        w = w || 4.4;
        return tags.map(function (t) { return "<" + t + ' fill="' + ink + '" stroke="' + ink + '" stroke-width="' + w + '" stroke-linejoin="miter" stroke-miterlimit="8"/>'; }).join("") +
          tags.map(function (t) { return "<" + t + ' fill="' + col + '"/>'; }).join("");
      }
      function F(tag, col, extra) { return "<" + tag + ' fill="' + col + '"' + (extra ? " " + extra : "") + "/>"; }
      function line(d, col, w, extra) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linejoin="miter" stroke-linecap="round"' + (extra ? " " + extra : "") + "/>"; }
      function g(id, inner, attrs) { return '<g id="' + P + id + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
      function at(x, y, s, inner, rot) { return '<g transform="translate(' + n1(x) + "," + n1(y) + ")" + (rot ? " rotate(" + rot + ")" : "") + (s !== 1 ? " scale(" + s + ")" : "") + '">' + inner + "</g>"; }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function txt(x, y, size, s, col, extra) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + size + '" fill="' + (col || ink) + '"' + (extra ? " " + extra : "") + ">" + s + "</text>"; }
      // Burn a drawing's markup (as KIT's charred people are burnt): every color but the ink turns a dark brown of the same lightness.
      function burn(markup) {
        var inkU = ink.toUpperCase();
        return markup.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g, function (m, a, col) {
          if (col.toUpperCase() === inkU) return m;
          var n = parseInt(col.slice(1), 16), l = (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255, v = Math.round(28 + l * 46);
          return a + '="rgb(' + (v + 8) + "," + v + "," + Math.max(0, v - 6) + ')"';
        });
      }
      // Singe a drawing (the crates, which must still read as crates in a charred human's arms): every color but the ink
      // goes darker, keeping its hue.
      function singe(markup) {
        var inkU = ink.toUpperCase();
        return markup.replace(/(fill|stroke)="(#[0-9A-Fa-f]{6})"/g, function (m, a, col) {
          if (col.toUpperCase() === inkU) return m;
          var n = parseInt(col.slice(1), 16), k = 0.55;
          return a + '="rgb(' + Math.round((n >> 16) * k) + "," + Math.round(((n >> 8) & 255) * k) + "," + Math.round((n & 255) * k) + ')"';
        });
      }
      // A cloud of soot in KIT.nuke's style (navy outline, a body, highlights on every other puff), around (0,0).
      function soot(circles) {
        var outline = circles.map(function (c) { return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + c[2] + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="10"/>'; }).join("");
        var body = circles.map(function (c) { return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + c[2] + '" fill="#8E8780"/>'; }).join("");
        var hi = circles.filter(function (c, i) { return i % 2 === 0; }).map(function (c) {
          return '<circle cx="' + (c[0] - c[2] * 0.25) + '" cy="' + (c[1] - c[2] * 0.3) + '" r="' + c[2] * 0.42 + '" fill="#C9C2B8" opacity="0.85"/>';
        }).join("");
        return outline + body + hi;
      }

      // ── THE FUSE (storyboard, Running gag: the fuse): the same in every Part 11 scene (copied from war-through-wifi). ──
      // The civilization is a cartoon bomb: a small Earth with a navy screw collar and a lit fuse that burns by part
      // time (L = L0 - k t), so it is continuous across scenes. Returns the spark's flare group (scale it to flare).
      function fuse(layer, tl) {
        var Fz = V ? { cx: 110, cy: 150, r: 56, collar: [94, 80, 32, 14], d: "M110,86 Q116,64 148,66 L690,66", L0: 560, k: 2.2 }
          : { cx: 112, cy: 116, r: 58, collar: [96, 46, 32, 14], d: "M112,52 Q118,30 150,32 L780,32", L0: 640, k: 2.6 };
        var c = Fz.collar, t0 = sc.start;
        var cords = '<path id="' + P + "cord-a" + '" d="' + Fz.d + '" fill="none" stroke="' + ink + '" stroke-width="9" stroke-linecap="round"/>' +
          '<path id="' + P + "cord-b" + '" d="' + Fz.d + '" fill="none" stroke="' + C.tan + '" stroke-width="5" stroke-linecap="round"/>';
        var spark = '<g id="' + P + 'spark"><g id="' + P + 'spark-flare"><g id="' + P + 'spark-flick">' +
          KIT.star(0, 0, 14, C.yellow) + '<g transform="rotate(45)">' + KIT.star(0, 0, 10, C.yellow) + "</g>" + KIT.star(0, 0, 8, C.orange) + "</g></g>" +
          '<g id="' + P + 'spark-smoke">' + line("M2,-12 q-7,-8 0,-15 q7,-8 0,-15", "#8C8782", 2.6) + "</g></g>";
        layer.innerHTML = KIT.svg(W, H, cords +
          at(Fz.cx, Fz.cy + Fz.r, 1, KIT.props.earthGlobe({ r: Fz.r })) +
          S([pg(R(c[0], c[1], c[2], c[3]))], C.navy, 3) + line("M" + (c[0] + 3) + "," + (c[1] + 3) + " H" + (c[0] + c[2] - 3), C.orange, 1.6) +
          line("M" + (c[0] + 2) + "," + (c[1] + 8) + " H" + (c[0] + c[2] - 2), C.peri, 1.4) + spark);
        var a = document.getElementById(P + "cord-a"), b = document.getElementById(P + "cord-b"), sp = document.getElementById(P + "spark");
        KIT.onTime(tl, D, function (lt) {
          var Lc = Math.max(0, Fz.L0 - Fz.k * (t0 + lt)), p = a.getPointAtLength(Lc);
          a.setAttribute("stroke-dasharray", Lc.toFixed(1) + " 3000");
          b.setAttribute("stroke-dasharray", Lc.toFixed(1) + " 3000");
          sp.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")");
        });
        var fl = document.getElementById(P + "spark-flick"), sm = document.getElementById(P + "spark-smoke");
        gsap.set(fl, { svgOrigin: "0 0" });
        tl.fromTo(fl, { scale: 0.8 }, { scale: 1.2, duration: 0.09, repeat: Math.floor(D / 0.09) - 1, yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo(sm, { x: -2, opacity: 0.9 }, { x: 2, opacity: 0.6, duration: 0.4, repeat: Math.floor(D / 0.4) - 1, yoyo: true, ease: "sine.inOut" }, 0);
        return document.getElementById(P + "spark-flare");
      }

      // ── A stack of war papers seen edge-on (as war-through-wifi draws it), one group per bill (so the pile can grow
      // bill by bill): thin green bills, each with its red seal at one end; w wide, standing on y 0 around x 0. ──
      function billAt(i, w, r) {
        var y = -12 * (i + 1), j = Math.round((r() - 0.5) * 10), wj = Math.round((r() - 0.5) * 8), x0 = -w / 2 + j, ww = w + wj;
        return '<rect x="' + x0 + '" y="' + y + '" width="' + ww + '" height="12" rx="2" fill="' + C.money + '" stroke="' + ink + '" stroke-width="2"/>' +
          '<path d="M' + (x0 + 8) + "," + (y + 4) + " H" + (x0 + ww - 22) + '" stroke="#D4E4C6" stroke-width="1.4" opacity="0.7"/>' +
          '<circle cx="' + (i % 2 ? x0 + ww - 9 : x0 + 9) + '" cy="' + (y + 6) + '" r="3.6" fill="' + C.war + '" stroke="' + ink + '" stroke-width="1.2"/>';
      }

      // ── Layout, per canvas shape ──────────────────────────────────────────────────────────────────
      // G: the front ground (the conveyor, the Builder, the desk, the pile); GF: the factory's ground (behind, in 9:16).
      // conv: [center x, belt length, scale]; bx: where the Builder stands; s: the humans' scale.
      // fac: [center x, scale]; sign: [x of its center over the roof, font size]; desk: [x0, x1]; crook, seat: the Crook's
      // and the Builder's x behind the desk; pile: [x, width, scale, bills by "extraction,", bills at the end].
      // nuke: the mushroom cloud's scale; crate: [w, h, font size].
      var L = V
        ? { G: 1420, GF: 1060, conv: [192, 250, 1.0], bx: 410, s: 1.45, fac: [460, 1.3], sign: [650, 34], desk: [540, 922], crook: 796, seat: 616,
            pile: [978, 70, 1.3, 44, 52], nuke: 1.08, crate: [74, 56, 15] }
        : { G: 840, GF: 840, conv: [250, 300, 1.25], bx: 545, s: 1.7, fac: [880, 1.05], sign: [1050, 38], desk: [1110, 1482], crook: 1336, seat: 1166,
            pile: [1545, 100, 1, 21, 34], nuke: 1.0, crate: [88, 64, 17] };
      var G = L.G, GF = L.GF, s = L.s;

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // ── The Builder (storyboard Cast) and his crates ──
      var BUILDER = { tone: 1, outfit: "overalls", color: 0, seed: 7, mood: "eager" };
      var CW = L.crate[0] / s, CH = L.crate[1] / s; // a crate in person units
      // A crate: tan boards with navy slats; o.stencil: EXPORTS stenciled on its side (in its own group, .stencil).
      function crate(w, h, fs, stencil) {
        var out = S([pg(R(-w / 2, -h, w, h))], C.tan, 3.4) + line("M" + n1(-w / 2 + 3) + "," + n1(-h * 0.5) + " H" + n1(w / 2 - 3), C.rust, 2, 'opacity="0.6"') +
          S([pg(R(-w / 2, -h, w, h * 0.16)), pg(R(-w / 2, -h * 0.16, w, h * 0.16))], C.rust, 2.4) +
          S([pg(R(-w / 2, -h, w * 0.12, h)), pg(R(w / 2 - w * 0.12, -h, w * 0.12, h))], C.rust, 2.4) + line("M" + n1(-w / 2 + w * 0.12) + "," + n1(-h * 0.84) + " L" + n1(w / 2 - w * 0.12) + "," + n1(-h * 0.16), C.rust, 2.6);
        if (stencil !== undefined) out += '<g class="stencil"' + (stencil ? "" : ' opacity="0"') + ">" + F(pg(R(-w * 0.36, -h * 0.66, w * 0.72, h * 0.36)), C.cream, 'opacity="0.85"') +
          txt(0, -h * 0.38, fs, "EXPORTS", ink, 'letter-spacing="0.5"') + "</g>";
        return out;
      }
      // The Builder carrying a crate in both arms (it goes in before his arms, so his hands are in front), a hammer
      // hanging at his hip; he faces left, toward the conveyor. charred: the same, burnt black after the blast.
      var oLoad = mix(BUILDER, { look: "left", arms: [[10, 40], [-10, -40]] }), rLoad = KIT.rig(oLoad);
      var oEmpty = mix(BUILDER, { look: "left", charred: true, arms: [[16, 8], [-16, -8]] }), rEmpty = KIT.rig(oEmpty);
      var cAt = [(rLoad.hand[0][0] + rLoad.hand[1][0]) / 2, (rLoad.hand[0][1] + rLoad.hand[1][1]) / 2 + CH * 0.12];
      function hipHammer(r) {
        var x = 26, y = r.hipY - 6;
        return '<g class="hip-hammer">' + line("M" + pt(x, y - 4) + " L" + pt(x + 4, y + 30), ink, 6) + line("M" + pt(x, y - 4) + " L" + pt(x + 4, y + 30), C.tan, 3) +
          S([pg([[x - 9, y - 10], [x + 10, y - 12], [x + 11, y - 4], [x - 8, y - 2]])], C.slate, 2.4) + "</g>";
      }
      function carrying(o, r, burnt) {
        var c = at(cAt[0], cAt[1], 1, crate(CW, CH, L.crate[2] / s, !!burnt)), hm = hipHammer(r);
        if (burnt) { c = singe(c); hm = burn(hm); }
        return KIT.person(o).replace('<g class="arm-l">', hm + '<g class="held">' + c + '</g><g class="arm-l">');
      }
      // At the desk: sitting behind it, typing (charred), and the same with the Crook's domino mask on. On a charred face
      // the kit's navy mask hardly shows, so the mask is drawn here with a cream edge, in the face's own units.
      var SEATED = { legPose: [[85, 10], [95, 15]] }, TYPE = [[25, 80], [15, 80]];
      var oDesk = mix(BUILDER, { look: "right", charred: true, build: SEATED, arms: TYPE }), rDesk = KIT.rig(oDesk);
      var MASK = '<path d="M-17,-6 L-27,-11 M-17,-3 L-26,1" stroke="' + ink + '" stroke-width="2.2"/>' +
        '<path d="M-17,-11 L18,-12 L19,-1 L13,1 L9,-3 L4,1 L-4,-2 L-10,1 L-17,-1 Z" fill="' + ink + '" stroke="' + C.cream + '" stroke-width="1.6" stroke-linejoin="miter"/>';
      var maskedDesk = KIT.person(oDesk).replace('<g class="char-eyes">', MASK + '<g class="char-eyes">');
      // The Crook behind his desk, typing; and turning to hand over a mask.
      var crO = KIT.castOpts("lobbyist", { arms: TYPE, look: "right" }), crR = KIT.rig(crO);
      var crO2 = KIT.castOpts("lobbyist", { arms: [[-72, -100], TYPE[1]], look: "left", mood: "grin" }), crR2 = KIT.rig(crO2);

      // ── Where things are ──
      var CV = L.conv, convTop = G - 66 * CV[2], convL = CV[0] - CV[1] * CV[2] / 2, convR = CV[0] + CV[1] * CV[2] / 2;
      var crHands = crR.hand.map(function (h) { return [L.crook + s * h[0], 0 + s * h[1]]; });
      // the Crook's feet are on the ground; the desk top sits just under his hands
      var crY = G - 100 * s, deskTop = crY + Math.max(crHands[0][1], crHands[1][1]) + 6;
      var lapX = (crHands[0][0] + crHands[1][0]) / 2 + 8 * s, lapK = s;
      // the Builder at the desk: his hands on the desk top too
      var bdHandY = Math.max(rDesk.hand[0][1], rDesk.hand[1][1]), bdY = deskTop - 6 - s * bdHandY;
      var bdLap = L.seat + s * ((rDesk.hand[0][0] + rDesk.hand[1][0]) / 2 + 8);

      // ── The factory with its SUCCESS sign (the sign's back is a bullseye), and its burnt copy ──
      var FC = L.fac, fk = FC[1], signY = GF - 250 * fk, SG = L.sign, sf = SG[1];
      var sw = Math.round(7 * sf * 0.56 + 64), sh = Math.round(sf * 1.75), sTop = signY - 26 - sh, sCy = sTop + sh / 2;
      var bulbs = "", nb = 0;
      for (var bx = -sw / 2 + 10; bx <= sw / 2 - 9; bx += 22) { bulbs += g("bulb-" + nb++, S([ci(bx, sTop + 2, 6.5)], C.yellow, 2.6)); bulbs += g("bulb-" + nb++, S([ci(bx + 11, sTop + sh - 2, 6.5)], C.yellow, 2.6)); }
      var front = at(SG[0], signY, 1, KIT.props.sign({ text: "SUCCESS", fontSize: sf, height: 26 }));
      var bullR = sh * 0.95;
      var bull = [1, 0.75, 0.5, 0.25].map(function (f, i) { return S([ci(0, 0, bullR * f)], i % 2 ? C.cream : C.war, i ? 3 : 4.4); }).join("");
      // (the glow behind the card, while it is lit)
      var signArt = at(SG[0], 0, 1, g("glow", F(pg(R(-sw / 2 - 16, sTop - 16, sw + 32, sh + 32)), C.yellow, 'opacity="0.55"') + F(pg(R(-sw / 2 - 8, sTop - 8, sw + 16, sh + 16)), C.yellow, 'opacity="0.7"'), 'opacity="0"')) + g("sign-front", front) +
        at(SG[0], sCy, 1, g("sign-back", line("M" + n1(-sw / 2 + 30) + "," + n1(signY - sCy) + " V0", ink, 7) + line("M" + n1(sw / 2 - 30) + "," + n1(signY - sCy) + " V0", ink, 7) + bull, 'opacity="0"')) +
        at(SG[0], 0, 1, g("bulbs", bulbs, 'opacity="0"'));
      var factory = at(FC[0], GF, fk, g("factory", KIT.props.factory({ label: "", smoke: true })));
      // burnt: no smoke, the middle chimney bent over, the bullseye scorched black in the middle
      var factoryB = at(FC[0], GF, fk, g("factory-b", burn(KIT.props.factory({ label: "", smoke: false }))));
      var bullB = at(SG[0], sCy, 1, g("bull-b", line("M" + n1(-sw / 2 + 30) + "," + n1(signY - sCy) + " L" + n1(-sw / 2 + 40) + ",14", ink, 7) + line("M" + n1(sw / 2 - 30) + "," + n1(signY - sCy) + " L" + n1(sw / 2 - 42) + ",-4", ink, 7) +
        at(0, 8, 1, bull + S([pg([[-14, -6], [-4, -16], [8, -12], [16, 2], [6, 14], [-10, 12]])], "#1B1714", 2.4) + line("M-4,-24 q-7,-8 0,-15 q7,-8 0,-15 M10,-22 q-6,-8 0,-14", "#8C8782", 3), -14), 'opacity="0"'));

      // ── The conveyor and its crates (clipped at the paper's left edge, where they leave) ──
      var conv = at(CV[0], G, CV[2], g("conv", KIT.props.conveyor({ w: CV[1] })));
      var convB = at(CV[0], G, CV[2], g("conv-b", burn(KIT.props.conveyor({ w: CV[1] }))));
      // a crate is loaded every 1.4 s from "manufacture" until the missile shows up; one is already on the belt
      var tM = cue("manufacture"), tBoom = cue("success.") + 0.1, SPEED = 125 * (V ? 0.8 : 1);
      var loads = [];
      for (var lt = tM; lt < cue("target") - 0.4; lt += 1.4) loads.push(lt);
      var crX0 = convR - L.crate[0] * 0.62;
      var crates = [{ t: 0, x0: crX0 - SPEED * 1.6 }].concat(loads.map(function (t) { return { t: t, x0: crX0 }; }));
      var cratesArt = crates.map(function (c, i) {
        // (the stencil goes on at "exports": crates loaded before it start without one)
        return g("crate-" + i, g("crate-n-" + i, crate(L.crate[0], L.crate[1], L.crate[2], !(i === 0 || c.t < cue("exports")))) + g("crate-b-" + i, singe(crate(L.crate[0], L.crate[1], L.crate[2], true)), 'opacity="0"'));
      }).join("");
      var clip = '<defs><clipPath id="' + P + 'clip"><rect x="48" y="0" width="' + (W - 48) + '" height="' + H + '"/></clipPath></defs>';

      // ── The Crook's desk, laptops and pile ──
      var DK = L.desk, deskArt = S([pg(R(DK[0] + 10, deskTop + 12, DK[1] - DK[0] - 20, G - deskTop - 12))], C.rust) +
