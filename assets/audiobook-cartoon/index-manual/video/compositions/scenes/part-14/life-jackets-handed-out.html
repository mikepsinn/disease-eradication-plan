        if (ry !== null) stampEl.setAttribute("transform", "translate(" + f(SX) + "," + f(ry) + ") scale(" + L.stampS + ")");
        // the lifeguard: squashed, then peeled up like a sticker, then springing back up to blow his whistle
        var sy = squashAt(t), sx = 1 + (1 - sy) * 0.42, rot = 0, rx = -22 * sx;
        if (t >= tPeel && t < tPop) rot = -34 * smooth((t - tPeel) / (tPop - tPeel));
        if (t >= tPop) {
          var dd = Math.exp(-5 * (t - tPop)) * Math.cos(16 * (t - tPop));
          sy = 1 - 0.8 * dd; sx = 1 + 0.3 * dd;
          if (t < tPop + 0.1) rot = -34 * (1 - (t - tPop) / 0.1);
        }
        sq.setAttribute("transform", "translate(0," + f(SEAT) + ") scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ") translate(0," + f(-SEAT) + ")");
        peel.setAttribute("transform", "rotate(" + rot.toFixed(2) + " " + f(rx) + " " + f(SEAT) + ")");
        var flat = t >= tSplat && t < tPop, bl = blinks.some(function (b) { return t > b && t < b + 0.11; }) ? 0.12 : 1;
        eyes.setAttribute("opacity", flat ? "1" : "0");
        eyes.setAttribute("transform", "translate(" + f(LGr.head[0] * sx + 3) + "," + f(SEAT - (SEAT - HEADY) * sy - 2) + ") scale(" + f(sx * 0.9) + "," + bl + ")");
        markEl.setAttribute("opacity", t >= tLift && t < tPop ? "1" : t >= tPop && t < tPop + 0.15 ? f(1 - (t - tPop) / 0.15) : "0");
        readEl.setAttribute("opacity", t < tPop ? "1" : "0");
        blowEl.setAttribute("opacity", t < tPop ? "0" : "1");
        if (shadesIn) shadesIn.setAttribute("opacity", t < tHit + 0.02 ? "1" : "0");
        // his sunglasses fly off onto the sand
        var sp = (t - tHit) / 0.55;
        shadesFly.setAttribute("opacity", t >= tHit ? "1" : "0");
        if (t >= tHit) {
          var e = clamp(sp, 0, 1), sxF = lerp(shadeFrom[0], shadeTo[0], e), syF = lerp(shadeFrom[1], shadeTo[1], e) - 260 * e * (1 - e) * 2;
          shadesFly.setAttribute("transform", "translate(" + f(sxF) + "," + f(syF) + ") rotate(" + f(e * 520) + ")");
        }
      });
      // after he springs up: the whistle's blast
      tl.fromTo(g("tweet"), { opacity: 0 }, { opacity: 1, duration: 0.05 }, T.whistle);
      tl.to(g("tweet"), { opacity: 0.25, duration: 0.09, repeat: Math.floor((D - T.whistle - 0.12) / 0.09) - 1, yoyo: true, ease: "none" }, T.whistle + 0.1);

      // ── "forty-four": the $41,000 tag deflates, wobbling and puffing air, to a tiny $929.
      var tagBig = g("tag-big"), tagSmall = g("tag-small"), td = T.forty, tdEnd = td + 0.8;
      gsap.set([tagBig, tagSmall], { svgOrigin: "0 0" });
      tl.fromTo(tagBig, { scale: 1 }, { scale: 0.4, duration: tdEnd - td, ease: "power1.in" }, td);
      tl.fromTo(tagBig, { rotation: 0 }, { rotation: 9, duration: 0.1, repeat: 7, yoyo: true, ease: "sine.inOut" }, td);
      tl.set(tagBig, { opacity: 0 }, tdEnd);
      tl.set(tagSmall, { opacity: 1 }, tdEnd);
      tl.fromTo(tagSmall, { rotation: -14 }, { rotation: 0, duration: 0.9, ease: "elastic.out(1, 0.35)" }, tdEnd);
      var tipX = Math.cos((L.tagA * PI) / 180) * 170 * L.tagS[0], tipY = Math.sin((L.tagA * PI) / 180) * 170 * L.tagS[0] + 30;
      Array.prototype.forEach.call(document.querySelectorAll("#" + P + "world .lj-puff"), function (pf, i) {
        var t0 = td + 0.08 + i * 0.22, k = 1 - i * 0.28;
        tl.fromTo(pf, { attr: { cx: tipX * k, cy: tipY * k, r: 4 }, opacity: 1 }, { attr: { cx: tipX * k + 60, cy: tipY * k + 10, r: 14 }, opacity: 0, duration: 0.4, ease: "power2.out" }, t0);
      });

      // ── "twenty-three": the conveyor rolls out from the hook (whirr) and its counter rolls up to 23.4, landing on
      // "million"; "one" (one point nine): the TODAY: 1.9 MILLION sign shrinks (tick) and droops.
      var roll = g("conv-roll"), convEl = g("conv"), count = g("count");
      tl.fromTo(roll, { x: -(CW * CV.s + 30) }, { x: 0, duration: 0.85, ease: "power2.out" }, T.conv);
      KIT.props.conveyor.run(tl, convEl, T.conv, 0.85, 110);
      var c0 = T.conv + 0.45, c1 = T.mil1;
      KIT.onTime(tl, D, function (t) {
        var v = t < c0 ? 0 : t >= c1 ? 23.4 : 23.4 * Math.pow((t - c0) / (c1 - c0), 0.6);
        count.textContent = v.toFixed(1);
      });
      var pan = g("panel");
      gsap.set(pan, { svgOrigin: "0 " + (panelY + 20) });
      tl.fromTo(pan, { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, c1);
      var plq = g("plaque");
      gsap.set(plq, { svgOrigin: "0 0" });
      tl.fromTo(plq, { scale: 1 }, { scale: 1.08, duration: 0.08, ease: "power2.out" }, T.old);
      tl.to(plq, { scale: 0.38, duration: 0.32, ease: "back.in(1.6)" }, T.old + 0.08);
      tl.to(plq, { rotation: -10, duration: 0.5, ease: "power2.out" }, T.old + 0.42);

      // ── The swimmers, every frame: idle bobbing and waving; "drowning": three dunks down the line (the pops);
      // "jackets?": the first in line strains for the hook; then each one's jacket flies in and it pops up like a cork.
      var dunks = [T.drown, T.drown + 0.2, T.drown + 0.4];
      var SW = swimmers.map(function (s, i) {
        var root = document.getElementById(P + "sw" + i), o = { s: s, bob: g("sw" + i + "-bob"), fj: g("fj" + i) };
        if (s.kind === "dot") { o.ring = g("sw" + i + "-ring"); return o; }
        o.d0 = root.querySelector(".lj-d0"); o.d1 = root.querySelector(".lj-d1"); o.d2 = root.querySelector(".lj-d2");
        o.bub = root.querySelectorAll(".lj-bub");
        if (s.kind === "human") {
          var r = KIT.rig(mix(s.o, { look: "left", arms: ARMS_UP }));
          o.armL = o.d0.querySelector(".arm-l"); o.armR = o.d0.querySelector(".arm-r"); o.shL = r.shoulder[0]; o.shR = r.shoulder[1];
          if (o.d1) { var r1 = KIT.rig(s.reach); o.reachArm = o.d1.querySelector(".arm-l"); o.shReach = r1.shoulder[0]; }
          var rs = KIT.rig(mix(s.o, { look: "left", arms: ARMS_JOY }));
          o.joyL = o.d2.querySelector(".arm-l"); o.joyR = o.d2.querySelector(".arm-r"); o.shJL = rs.shoulder[0]; o.shJR = rs.shoulder[1];
        }
        return o;
      });
      var group = function (d) { return d < 5 ? 0 : d < 10 ? 1 : 2; };
      // a dunk: under in 0.12 s, a moment down there, and back up with a bounce
      function dunk(tau) {
        if (tau < 0 || tau > 0.7) return 0;
        if (tau < 0.12) return 80 * smooth(tau / 0.12);
        if (tau < 0.32) return 80;
        return 80 * Math.exp(-7 * (tau - 0.32)) * Math.cos(9 * (tau - 0.32));
      }
      var RISE = 26;
      function cork(tau) { return -RISE * (1 - Math.exp(-5 * tau) * Math.cos(13 * tau)); }
      var CATCH = 0.34; // the patient holds her jacket up this long before she puts it on
      KIT.onTime(tl, D, function (t) {
        SW.forEach(function (o) {
          var s = o.s, idle = 2.4 * Math.sin(t * s.rate + s.ph), on = s.land + (s.patient ? CATCH : 0);
          var y = idle, saved = t >= on, rot = 0;
          if (s.kind !== "skull" && !saved) y += dunk(t - dunks[group(s.d)]);
          if (s.kind === "skull" && !saved) y = 1.6 * Math.sin(t * 1.3 + s.ph);
          if (saved) y = cork(t - on) + 1.8 * Math.sin(t * 2.4 + s.ph);
          // the first in line leans toward the hook from "jackets?" until his jacket lands
          var reaching = o.d1 && t >= T.reach && !saved;
          if (reaching) { rot = -9 * smooth((t - T.reach) / 0.25) - 2 * smooth((t - T.reach - 0.3) / 2.5); y -= 6 * smooth((t - T.reach) / 0.25); }
          if (s.kind === "dot") {
            o.bob.setAttribute("transform", "translate(0," + f(saved ? cork(t - on) * 0.25 + 1.2 * Math.sin(t * 2 + s.ph) : 1.2 * Math.sin(t * s.rate + s.ph) + dunk(t - dunks[2]) * 0.4) + ")");
            o.ring.setAttribute("opacity", saved ? "1" : "0");
          } else {
            o.bob.setAttribute("transform", "translate(0," + f(y) + ")" + (rot ? " rotate(" + f(rot) + ")" : ""));
            o.d0.setAttribute("opacity", !saved && !reaching ? "1" : "0");
            if (o.d1) o.d1.setAttribute("opacity", reaching ? "1" : "0");
            o.d2.setAttribute("opacity", saved ? "1" : "0");
            if (o.armL) {
              var wv = Math.sin(t * 7.5 + s.ph) * 14;
              o.armL.setAttribute("transform", "rotate(" + f(wv) + " " + f(o.shL[0]) + " " + f(o.shL[1]) + ")");
              o.armR.setAttribute("transform", "rotate(" + f(-Math.sin(t * 7.5 + s.ph + 1.3) * 14) + " " + f(o.shR[0]) + " " + f(o.shR[1]) + ")");
              var jv = saved ? Math.sin((t - on) * 9) * 10 * Math.exp(-0.6 * (t - on)) + 4 * Math.sin(t * 3 + s.ph) : 0;
              o.joyL.setAttribute("transform", "rotate(" + f(jv) + " " + f(o.shJL[0]) + " " + f(o.shJL[1]) + ")");
              o.joyR.setAttribute("transform", "rotate(" + f(-jv) + " " + f(o.shJR[0]) + " " + f(o.shJR[1]) + ")");
            }
            if (o.reachArm) o.reachArm.setAttribute("transform", "rotate(" + f(reaching ? Math.sin(t * 40) * 2.5 : 0) + " " + f(o.shReach[0]) + " " + f(o.shReach[1]) + ")");
            // bubbles while under
            var tau = s.kind === "skull" ? -1 : t - dunks[group(s.d)];
            Array.prototype.forEach.call(o.bub, function (b, k) {
              var bt = tau - 0.1 - k * 0.07, vis = bt > 0 && bt < 0.4;
              b.setAttribute("opacity", vis ? "1" : "0");
              if (vis) b.setAttribute("cy", f(-6 - bt * 90));
            });
          }
          // its jacket in flight
          var fl = s.fly, ft = (t - fl.t0) / fl.dur, show = ft >= 0 && t < on;
          o.fj.setAttribute("opacity", show ? "1" : "0");
          if (show) {
            var e = Math.min(ft, 1), jx = lerp(fl.lx, fl.tx, e), jy = lerp(fl.ly, fl.ty, e) - fl.h * 4 * e * (1 - e), js = lerp(fl.s0, fl.s1, e), jr = fl.spin * Math.min(e, 1);
            if (ft >= 1) { jx = fl.tx + Math.sin(t * 30) * 2; jy = fl.ty + (y - 4) * s.s; jr = Math.sin(t * 22) * 6; } // held up in her hands
            o.fj.setAttribute("transform", "translate(" + f(jx) + "," + f(jy) + ") rotate(" + f(jr) + ") scale(" + js.toFixed(3) + ")");
          }
        });
      });

      // ── "hand": the conveyor runs (whirr) to the end, its jacket rows sliding along under the launches.
      KIT.props.conveyor.run(tl, convEl, T.hand, D - T.hand - 0.02, 150);
      var rowEls = g("piles").querySelectorAll(".lj-row");
      KIT.onTime(tl, D, function (t) {
        var run = t >= T.hand, off = run ? ((t - T.hand) * 150) % PITCH : 0, jig = run ? -Math.abs(Math.sin(t * 28)) * 2 : 0;
        Array.prototype.forEach.call(rowEls, function (r) { r.setAttribute("transform", "translate(" + f(off) + "," + f(jig) + ")"); });
      });

      // ── Sky and sea: the gulls drift and flap, the waves roll.
      var gulls = L.gulls.map(function (gl, i) { return g("gull" + i); });
      var waveEls = document.querySelectorAll("#" + P + "world .lj-wave");
      KIT.onTime(tl, D, function (t) {
        gulls.forEach(function (gu, i) {
          var gl = L.gulls[i];
          gu.setAttribute("transform", "translate(" + f(gl[0] + gl[2] * t) + "," + f(gl[1] + 6 * Math.sin(t * 1.1 + i)) + ") scale(1," + f(0.7 + 0.45 * Math.abs(Math.sin(t * 4 + i))) + ")");
        });
        Array.prototype.forEach.call(waveEls, function (w, i) { w.setAttribute("transform", "translate(" + f(Math.sin(t * 0.8 + i * 1.7) * (10 + i * 3)) + ",0)"); });
      });

      // ── "Remember": the camera pushes in on the near swimmers (whoosh), holds there for the first dunk, drifts along
      // the line to the far end for the last one, and pulls back out before "jackets?".
      var world = g("world"), CAM = L.cam;
      var k1 = T.rem + 0.8, k1b = dunks[0] + 0.3, k2 = T.reach - 0.75, k3 = T.reach - 0.1;
      KIT.onTime(tl, D, function (t) {
        var c = CAM[0];
        if (t >= T.rem && t < k1) { var e1 = smooth((t - T.rem) / (k1 - T.rem)); c = [lerp(CAM[0][0], CAM[1][0], e1), lerp(CAM[0][1], CAM[1][1], e1), lerp(CAM[0][2], CAM[1][2], e1)]; }
        else if (t >= k1 && t < k1b) c = CAM[1];
        else if (t >= k1b && t < k2) { var e2 = smooth((t - k1b) / (k2 - k1b)); c = [lerp(CAM[1][0], CAM[2][0], e2), lerp(CAM[1][1], CAM[2][1], e2), lerp(CAM[1][2], CAM[2][2], e2)]; }
        else if (t >= k2 && t < k3) { var e3 = smooth((t - k2) / (k3 - k2)); c = [lerp(CAM[2][0], CAM[0][0], e3), lerp(CAM[2][1], CAM[0][1], e3), lerp(CAM[2][2], CAM[0][2], e3)]; }
        world.setAttribute("transform", "translate(" + f(W / 2 - c[0] * c[1]) + "," + f(H / 2 - c[0] * c[2]) + ") scale(" + c[0].toFixed(4) + ")");
      });

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
