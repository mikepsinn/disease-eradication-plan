       by the block copied from meadow-ad.html (marked "shared"; change both). "individual": click, the TV cuts to the ad's
       end card, INDIVIDUAL RESULTS MAY VARY, and the camera pushes into the screen. Its dial's needle wanders until
       "cured" (it swings to CURED, which gets a tick) and "deceased" (it swings to DECEASED: a tick too). "qualifying).":
       QUALIFIES thumps onto both, and the ad's skeleton skips back in, gives a bony thumbs-up and skips off. "ask": the
       camera pulls out of the TV, which now hangs on the wall of a hospital hallway, the patient waiting under it in a
       plastic chair. "seven": the sign APPOINTMENT: 7 MIN drops in and the doctor zips past on roller skates with a
       stopwatch. "Googled": he skids back to a stop and types on a rotary phone with a little screen, its cord trailing;
       a close-up bubble shows a plain search box: RED CHEST LIGHT. "hallway.": the result is a grinning skull; he goes
