<template id="subsidy-follows-patient-template">
  <!-- subsidy-follows-patient · Layer B (storyboards/part-14-decentralized-fda.md): zoom into the wall screen, on the
       hallway of trial doors (a doctor in each doorway, the scientist in the patient's door, a germ on every door's
       sign), every head still turned up to the top right; they turn back. "Eighty": a mountain of medicine money
       slides in; "percent": 80% of it sprouts legs. "directly": the herd stampedes at the patient, over the grants
       officer who rolled in to stop it (flattened, footprints, blinking), and on down the hallway. "subsidizing": one
       paper sits at her feet like a puppy; "nine": its collar tag. "forty-one": a bloated $41,000 bag waddles in and
       pops into 44 puppies that scamper off to 44 more patients. "choose": she walks to the scientist's door;
       "follow": the puppy trots at her heel; "paid": it jumps into the scientist's hand (ding); "participant.": the
       tallies tick, she goes in, the door shuts. In the top-left corner the bearded grant committee turns pages; "No":
       a giant red X falls on them; "fashionable": a flattened arm pokes up with a germ for a handbag, which blows a
       kiss after "year.". -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #F3ECD0; }
    #subsidy-follows-patient-cam { position: absolute; inset: 0; overflow: hidden; }
    #subsidy-follows-patient-view, #subsidy-follows-patient-art, #subsidy-follows-patient-inset, #subsidy-follows-patient-pip, #subsidy-follows-patient-grain { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="subsidy-follows-patient" data-width="1920" data-height="1080" data-start="0" data-duration="26.68">
    <div id="subsidy-follows-patient-cam">
      <!-- the camera: pushes in on the patient's door from "Treatment" -->
      <div id="subsidy-follows-patient-view"><div id="subsidy-follows-patient-art"></div></div>
      <!-- the grant committee's corner, outside the push -->
      <div id="subsidy-follows-patient-inset"></div>
      <div id="subsidy-follows-patient-pip"></div>
    </div>
    <div id="subsidy-follows-patient-grain"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/props/characters.js"></script>
  <script src="assets/js/props/objects-a.js"></script>
  <script src="assets/js/props/objects-b.js"></script>
  <script>
    (function () {
      var ID = "subsidy-follows-patient";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var P = function (s) { return ID + "-" + s; };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, INK = C.line, WHITE = "#FBF6E6";
      var f1 = function (n) { return (+n).toFixed(1); };
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function at(x, y, k, inner) { return '<g transform="translate(' + f1(x) + "," + f1(y) + ")" + (k === 1 ? "" : " scale(" + (+k).toFixed(3) + ")") + '">' + inner + "</g>"; }
      function poly(pts, fill, sw, extra) { return '<path d="M' + pts.map(function (p) { return f1(p[0]) + "," + f1(p[1]); }).join(" L") + ' Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw || 3) + '" stroke-linejoin="miter"' + (extra || "") + "/>"; }
      function clamp(x) { return Math.max(0, Math.min(1, x)); }
      function smooth(x) { x = clamp(x); return x * x * (3 - 2 * x); }
      function easeOut(x) { x = clamp(x); return 1 - (1 - x) * (1 - x); }
      function easeIn(x) { x = clamp(x); return x * x; }
      function backOut(x, s) { x = clamp(x); s = s || 1.7; var y = x - 1; return 1 + (s + 1) * y * y * y + s * y * y; }
      function seg(t, t0, t1) { return clamp((t - t0) / (t1 - t0)); }
      function lerp(a, b, k) { return a + (b - a) * k; }
      function vis(el, on) { el.setAttribute("opacity", on ? "1" : "0"); }
      function setT(el, s) { el.setAttribute("transform", s); }

      // ════ THE TRIAL HALLWAY (home-planet-board draws this frame on its wall screen: change both) ════
      // A hospital corridor in one-point perspective toward (vx, vy). A floor point at lateral u (-1 left wall, 1 right
      // wall) and depth p (1 at the hallway's mouth, smaller farther in) is at (X(u, p), Y(p)); a person there is drawn
      // at scale S(p). Doors stand on both walls (KIT.props.door, turned onto the wall plane by an affine matrix), each
      // with a doctor in the doorway and a sign facing down the hall: a germ and a tally. pE: the end wall's depth.
      var G = V ? { vx: 540, vy: 600, wd: 640, fl: 840, cz: 360, s0: 2.0, pE: 0.17 }
                : { vx: 1000, vy: 360, wd: 1000, fl: 540, cz: 160, s0: 1.75, pE: 0.17 };
      function X(u, p) { return G.vx + u * G.wd * p; }
      function Y(p) { return G.vy + G.fl * p; }
      function CY(p) { return G.vy - G.cz * p; }
      function S(p) { return G.s0 * p; }
      function depthAt(y) { return (y - G.vy) / G.fl; }
      // side 1 = right wall, -1 = left wall; p: the door's middle; hers: the scientist's door (the patient's pick).
      var DOORS = (V ? [[1, 0.62], [1, 0.45, 1], [1, 0.33], [1, 0.25], [-1, 0.72], [-1, 0.52], [-1, 0.37], [-1, 0.27]]
                     : [[1, 0.58], [1, 0.42, 1], [1, 0.31], [1, 0.24], [-1, 0.7], [-1, 0.5], [-1, 0.37], [-1, 0.28]]).map(function (d, i) {
        var germs = [["yellow", "grin"], ["med", "smug"], ["red", "cross"], ["peri", "grin"], ["orange", "smug"], ["rust", "cross"], ["cyan", "grin"], ["tan", "smug"]];
        var docs = [{ tone: 0, color: 2, hair: 1 }, null, { tone: 2, color: 0, hair: 0 }, { tone: 3, color: 3, hair: 1 }, { tone: 3, color: 0, hair: 2 }, { tone: 0, color: 3, hair: 0, glasses: true }, { tone: 2, color: 2, hair: 1 }, { tone: 1, color: 0, hair: 0 }];
        return { side: d[0], p: d[1], hers: !!d[2], germ: germs[i], doc: docs[i], n: d[2] ? 0 : [3, 0, 5, 2, 4, 6, 1, 7][i] };
      }).sort(function (a, b) { return a.p - b.p; });
      var HER = DOORS.filter(function (d) { return d.hers; })[0];

      // The walls, floor, ceiling and end wall. Floor: checker tiles; walls: a teal wainscot under a chair rail.
      function hallway() {
        var pN = 1.5, pE = G.pE, out = "", tiles = "";
        var floor = [[X(-1, pN), Y(pN)], [X(-1, pE), Y(pE)], [X(1, pE), Y(pE)], [X(1, pN), Y(pN)]];
        var ceil = [[X(-1, pN), CY(pN)], [X(-1, pE), CY(pE)], [X(1, pE), CY(pE)], [X(1, pN), CY(pN)]];
        out += poly(floor, C.cream, 0) + poly(ceil, "#EAE2C2", 0);
        // checker tiles: depth lines evenly spaced in world depth, eight across
        var ps = [], k = 0;
        for (var d = 1 / pN; d < 1 / pE; d += 0.42) ps.push(1 / d);
        ps.push(pE);
        for (k = 0; k + 1 < ps.length; k++) {
          for (var j = 0; j < 8; j++) {
            if ((j + k) % 2) continue;
            var u0 = -1 + j / 4, u1 = u0 + 0.25;
            tiles += '<path d="M' + f1(X(u0, ps[k])) + "," + f1(Y(ps[k])) + " L" + f1(X(u1, ps[k])) + "," + f1(Y(ps[k])) + " L" + f1(X(u1, ps[k + 1])) + "," + f1(Y(ps[k + 1])) + " L" + f1(X(u0, ps[k + 1])) + "," + f1(Y(ps[k + 1])) + ' Z"/>';
          }
        }
        out += '<g fill="url(#' + ID + '-hatch)" opacity="0.32">' + tiles + "</g>";
        var grid = "";
        for (k = 0; k < ps.length; k++) grid += "M" + f1(X(-1, ps[k])) + "," + f1(Y(ps[k])) + " H" + f1(X(1, ps[k])) + " ";
        for (j = 0; j <= 8; j++) { var u = -1 + j / 4; grid += "M" + f1(X(u, pN)) + "," + f1(Y(pN)) + " L" + f1(X(u, pE)) + "," + f1(Y(pE)) + " "; }
        out += '<path d="' + grid + '" stroke="' + INK + '" stroke-width="1.6" opacity="0.4" fill="none"/>';
        // ceiling lights down the middle
        [0.92, 0.6, 0.42, 0.31, 0.24].forEach(function (p) {
          var w = 0.22, dp = 0.35 * p * p * 0.5;
          out += poly([[X(-w, p + dp), CY(p + dp)], [X(w, p + dp), CY(p + dp)], [X(w, p - dp), CY(p - dp)], [X(-w, p - dp), CY(p - dp)]], "#FFF8DC", 2);
        });
        // the side walls: cream above, the teal wainscot below the chair rail (0.36 of the way up a 400-unit wall)
        [-1, 1].forEach(function (s) {
          var top = function (p) { return CY(p); }, rail = function (p) { return Y(p) - 105 * S(p); };
          out += poly([[X(s, pN), top(pN)], [X(s, pE), top(pE)], [X(s, pE), Y(pE)], [X(s, pN), Y(pN)]], "#F7F0D8", 0);
          out += poly([[X(s, pN), rail(pN)], [X(s, pE), rail(pE)], [X(s, pE), Y(pE)], [X(s, pN), Y(pN)]], "#BFD9D3", 0);
          out += '<path d="M' + f1(X(s, pN)) + "," + f1(rail(pN)) + " L" + f1(X(s, pE)) + "," + f1(rail(pE)) + '" stroke="' + INK + '" stroke-width="3"/>' +
            '<path d="M' + f1(X(s, pN)) + "," + f1(rail(pN) - 12) + " L" + f1(X(s, pE)) + "," + f1(rail(pE) - 12 * pE) + '" stroke="' + C.orange + '" stroke-width="1.8"/>';
          // the corner lines
          out += '<path d="M' + f1(X(s, pN)) + "," + f1(Y(pN)) + " L" + f1(X(s, pE)) + "," + f1(Y(pE)) + " M" + f1(X(s, pN)) + "," + f1(CY(pN)) + " L" + f1(X(s, pE)) + "," + f1(CY(pE)) + '" stroke="' + INK + '" stroke-width="4"/>';
        });
        // the end wall, with its double door (the herd runs out through it)
        out += poly([[X(-1, pE), CY(pE)], [X(1, pE), CY(pE)], [X(1, pE), Y(pE)], [X(-1, pE), Y(pE)]], "#F7F0D8", 3) +
          poly([[X(-1, pE), Y(pE) - 105 * S(pE)], [X(1, pE), Y(pE) - 105 * S(pE)], [X(1, pE), Y(pE)], [X(-1, pE), Y(pE)]], "#BFD9D3", 2);
        return out;
      }
      // A door on a side wall, on the floor at depth p: its local x (-64..64, near to far) runs along the wall.
      function wallMatrix(side, p) {
        var dp = 0.4 * p * p, k = dp / 128;
        return "matrix(" + [-side * G.wd * k, -G.fl * k, 0, S(p), X(side, p), Y(p)].map(function (v) { return v.toFixed(4); }).join(",") + ")";
      }
      function doorSvg(d, i) {
        // the leaf opens with scaleX about its hinge (-48): #door-leaf-<i> holds the prop's leaf at its scale
        var m = KIT.props.door({ color: d.hers ? C.med : [C.rust, C.peri, C.tan, C.rust, C.peri, C.tan, C.rust, C.peri][i] })
          .replace('<g class="door-leaf"', '<g id="' + P("leaf-" + i) + '" transform="translate(-48,0) scale(0.16,1) translate(48,0)"><g class="door-leaf"')
          .replace(/(<g class="door-leaf"[\s\S]*?)(<path d="M-51)/, "$1</g>$2");
        return '<g transform="' + wallMatrix(d.side, d.p) + '">' + m + "</g>";
      }
      // The sign over each door, facing down the hall: a germ on the left, a tally counter on the right. 120 x 74,
      // hanging from a bracket on the wall. #tally-<i> is the counter's number.
      function signSvg(d, i) {
        var p = d.p, s = S(p), sx = X(d.side * 0.84, p), sy = Y(p) - 262 * s;
        var wallX = X(d.side, p), wallY = Y(p) - 300 * s;
        var plate = '<rect x="-62" y="-6" width="124" height="76" rx="4" fill="' + INK + '" opacity="0.85"/>' +
          '<rect x="-64" y="-10" width="124" height="76" rx="4" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="5"/>' +
          '<rect x="-57" y="-3" width="110" height="62" rx="2" fill="none" stroke="' + C.orange + '" stroke-width="2"/>' +
          at(-26, 52, 0.95, KIT.props.germ({ color: d.germ[0], mood: d.germ[1] })) +
          '<rect x="6" y="6" width="44" height="44" rx="3" fill="' + C.slate + '" stroke="' + INK + '" stroke-width="3"/>' +
          '<text id="' + P("tally-" + i) + '" x="28" y="42" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="34" fill="' + C.cream + '">' + d.n + "</text>";
        var bracket = '<path d="M' + f1(wallX) + "," + f1(wallY) + " L" + f1(sx) + "," + f1(sy - 4 * s) + '" stroke="' + INK + '" stroke-width="' + f1(5 * s + 1) + '"/>';
        return bracket + '<g id="' + P("sign-" + i) + '">' + at(sx, sy, s * 0.9, '<path d="M-40,-10 L-40,-24 M38,-10 L38,-24" stroke="' + INK + '" stroke-width="3"/>' + plate) + "</g>";
      }
      // The doctor in each doorway (everyday humans in lab coats) and the scientist in hers, facing into the hall;
      // in the first frame they all look up to the top right (at Wishonia's paper), so each has a look-right drawing.
      function doctorOpts(d) { return d.hers ? KIT.castOpts("scientist", { look: d.side > 0 ? "left" : "right" }) : mix(d.doc, { outfit: "labcoat", look: d.side > 0 ? "left" : "right", mood: "flat" }); }
      function doctorSvg(d, i) {
        var o = doctorOpts(d), p = d.p + 0.012, s = S(p), x = X(d.side * 0.93, p);
        var up = d.side > 0 ? (d.hers ? KIT.castOpts("scientist", { look: "right" }) : mix(o, { look: "right" })) : o;
        var hand = d.hers ? '<g id="' + P("sci-hand") + '" opacity="0">' + KIT.cast("scientist", { look: "left", mood: "eager", arms: [[-40, -100], [-10, -4]], holdR: "clipboard" }) + "</g>" : "";
        return '<g id="' + P("doc-" + i) + '" transform="translate(' + f1(x) + "," + f1(Y(p) - 100 * s) + ") scale(" + s.toFixed(3) + ')">' +
          '<g id="' + P("docj-" + i) + '">' +
          '<g class="doc-up">' + KIT.person(up) + "</g>" +
          '<g class="doc-on" opacity="0">' + KIT.person(o) + "</g>" + hand + "</g></g>";
      }

      // ── The patient (the spine): the same options in every scene of the part, and her mustard-and-orange scarf ──
      var PAT = { tone: 2, outfit: "dress", hair: 1, color: 1, light: "red", mood: "worried" };
      function scarf(o) {
        var n = KIT.rig(o).neck, x = n[0], y = n[1] + 1, stripe = function (pts) { return poly(pts, C.orange, 1.4); };
        var wrapPts = [[x - 9, y - 4], [x + 9, y - 5], [x + 10, y + 3], [x - 10, y + 4]];
        var tail = [[x + 3, y + 1], [x + 9, y + 1], [x + 12, y + 24], [x + 5, y + 25]];
        return '<g class="scarf">' + '<g class="scarf-tail" data-ox="' + (x + 6) + '" data-oy="' + (y + 1) + '">' + poly(tail, C.yellow, 2.2) +
          stripe([[x + 4.5, y + 8], [x + 10, y + 8], [x + 10.5, y + 12], [x + 5, y + 12]]) + stripe([[x + 5.3, y + 16], [x + 11, y + 16], [x + 11.5, y + 20], [x + 5.7, y + 20]]) +
          '<path d="M' + (x + 5) + "," + (y + 25) + " l-1,4 M" + (x + 8) + "," + (y + 25) + " l0,4 M" + (x + 11) + "," + (y + 24.5) + ' l1,4" stroke="' + C.orange + '" stroke-width="1.5"/></g>' +
          poly(wrapPts, C.yellow, 2.4) + stripe([[x - 4, y - 4.5], [x, y - 4.7], [x, y + 3.6], [x - 4, y + 3.8]]) + stripe([[x + 4, y - 4.8], [x + 7, y - 4.9], [x + 7.4, y + 3.2], [x + 4, y + 3.4]]) + "</g>";
      }
      function patient(extra) {
        var o = mix(PAT, extra);
        return KIT.person(o).replace('<g class="head">', scarf(o) + '<g class="head">');
      }

      // ── The money ──
      // A walking medicine paper (KIT.money("med")): its legs are redrawn every frame (legsD) for the gait.
      function legsD(a, b) { return "M-16,24 l" + f1(-6 + a * 10) + ",22 h-8 M16,24 l" + f1(6 - b * 10) + ",22 h8"; }
      function bill(id, extra) { return '<g id="' + id + '">' + KIT.money("med", 0.5) + (extra || "") + "</g>"; }
      var MS = 0.6; // a paper is drawn at 0.6 of a person's scale at its depth

      // ── Layout for each canvas shape ──
      // mound: the money mountain [x, floor y, w, h]; officer: his feet [x, y] (his desk is on his left) and where he
      // rolls in from; pat: the patient's start [u, p]; sit: where the puppy sits [u, p]; bag: [from x, to x, floor y];
      // walk: her path [u, p] to her door; door: where she goes in [u, p]; crowd: the depth range of the 44 patients;
      // push: the camera's push-in [x, y, scale]; inset: the committee's corner [x, y, w, h]; tag: the big price tag's
      // knot [x, y] and string top.
      var L = V
        ? { mound: [200, 1420, 340, 260], officer: [560, 1356], from: 1300, pat: [0.32, 0.82], sit: [0.18, 0.86], bag: [-260, 300, 1420], bk: 1.2,
            walk: [[0.32, 0.82], [0.44, 0.7], [0.56, 0.57], [0.6, 0.48]], door: [0.96, 0.455], queues: [[-0.84, 0.42], [-0.64, 0.4], [0.64, 0.37], [0.84, 0.36]],
            push: [1080, 787, 1.9], inset: [50, 64, 640, 330], grow: 1.08, tag: [40, 880, 600, 1.6] }
        : { mound: [270, 852, 420, 300], officer: [800, 846], from: 2200, pat: [0, 0.84], sit: [-0.14, 0.82], bag: [-300, 450, 852], bk: 1.7,
            walk: [[0, 0.84], [0.24, 0.71], [0.46, 0.58], [0.6, 0.47]], door: [0.95, 0.435], queues: [[-0.84, 0.44], [-0.64, 0.42], [0.64, 0.37], [0.84, 0.36]],
            push: [1920, 585, 1.8], inset: [56, 56, 500, 286], grow: 1.3, tag: [80, 430, 30, 2.0] };

      var T = {
        turn: 0.25, eighty: 0, percent: cue("percent"), t27: cue("twenty-seven"), directly: cue("directly"), splat: cue("directly") + 0.4,
        subs: cue("subsidizing"), nine: cue("nine"), f41: cue("forty-one"), pop: cue("dollars.", 3), choose: cue("choose"), follow: cue("follow"),
        treat: cue("Treatment"), providers: cue("providers"), paid: cue("paid"), part: cue("participant."), no: cue("No"), comm: cue("committees"),
        fash: cue("fashionable"), kiss: KIT.after(ID, "year.")
      };
      T.roll0 = 1.45; T.roll1 = 2.05; T.stop = 2.5;              // the grants officer rolls in and puts his palm up
      T.inset = 6.0;                                              // the committee's corner slides in
      T.walk1 = T.treat - 0.25;                                   // she reaches her door
      T.goIn = T.part + 0.32; T.inside = T.goIn + 0.55; T.shut = T.inside + 0.1;

      // ════ BUILD ════
      var art = "";
      art += KIT.paperDefs(ID) + hallway();
      // the end double door
      var pE = G.pE;
      art += '<g transform="translate(' + f1(X(-0.25, pE)) + "," + f1(Y(pE)) + ") scale(" + (S(pE) * 1.05).toFixed(3) + ')">' +
        KIT.props.door({ color: C.slate }).replace('<g class="door-leaf"', '<g id="' + P("end-l") + '"><g class="door-leaf"').replace(/(<g class="door-leaf"[\s\S]*?)(<path d="M-51)/, "$1</g>$2") + "</g>" +
        '<g transform="translate(' + f1(X(0.25, pE)) + "," + f1(Y(pE)) + ") scale(" + (-S(pE) * 1.05).toFixed(3) + "," + (S(pE) * 1.05).toFixed(3) + ')">' +
        KIT.props.door({ color: C.slate }).replace('<g class="door-leaf"', '<g id="' + P("end-r") + '"><g class="door-leaf"').replace(/(<g class="door-leaf"[\s\S]*?)(<path d="M-51)/, "$1</g>$2") + "</g>";
      // doors, signs and doctors, far to near
      DOORS.forEach(function (d, i) { art += doorSvg(d, i) + doctorSvg(d, i) + signSvg(d, i); });

      // the 44 patients the bag pays for: a loose crowd far down the hall (KIT.rng), far to near; each pops in when its
      // puppy arrives. Everyday humans with their chest lights red.
      var rnd = KIT.rng(1404), CROWD = [];
      var OUTFITS = ["shirt", "dress", "suit", "overalls", "shirt", "dress", "scrubs", "suit"];
      for (var i = 0; i < 44; i++) {
        // four queues along the walls (the middle of the hall stays clear): eleven in each, evenly spaced in depth
        var line = L.queues[i % 4], row = Math.floor(i / 4), p = 1 / lerp(1 / line[1], 1 / 0.19, (row + (rnd() - 0.5) * 0.4) / 10), u = line[0] + (rnd() - 0.5) * 0.08;
        var outfit = OUTFITS[(i * 3 + row) % OUTFITS.length];
        CROWD.push({ u: u, p: p, o: { tone: (i * 5) % 4, outfit: outfit, color: (i * 3) % 4, hair: outfit === "dress" ? 1 : i % 3 === 0 ? 2 : 0, light: "red", mood: i % 3 ? "eager" : "smile", seed: i } });
      }
      CROWD.sort(function (a, b) { return a.p - b.p; });
