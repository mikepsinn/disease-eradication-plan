  <script>
    (function () {

      var sc = KIT.scene(ID);
      var D = sc.duration;

      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var INK = C.line, CARD = "#FBF5E4", WHITE = "#FBF6E6", GREY = "#B9B5AE";

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));

      // ══ The queue (the same drawing opens two-hundred-twelve-years-sooner; change both) ══════════════════
      // AX: where the front of the line stands, at the window; K: how far the accordion squeezes the line toward it.
      // rows: the serpentine, front row first: feet y, scale s, u0/du: the first human's x and the step to the next

      // [x, y, w, h]; sign: the wait sign (center x, top, w, h, chain top). grey/bones: the first grey-bearded and

      var L = V

              { y: 1170, s: 0.86, u0: 760, du: -140, n: 5, look: "right" }, { y: 1050, s: 0.77, u0: 170, du: 135, n: 5, look: "left" },
              { y: 940, s: 0.69, u0: 740, du: -125, n: 26, look: "right" }],
            lanes: [{ row: 0, y: 1452, from: 840, to: 110, step: 300 }, { row: 1, y: 1312, from: 840, to: 300, step: 270 }, { row: 2, y: 1182, from: 620, to: 120, step: 250 },
              { row: 3, y: 1061, from: 770, to: 320, step: 225 }, { row: 4, y: 950, from: 560, to: -2450, step: 215 }],
            booth: [840, 770, 200, 685], win: [858, 1196, 140, 130], tag: [856, 880],
            sign: { cx: 370, top: 452, w: 640, h: 290, chain: 44, fs: 46, wheel: [92, 136], yfs: 92 } }

            rows: [{ y: 880, s: 1.1, u0: 1230, du: -150, n: 8, look: "right" }, { y: 745, s: 0.94, u0: 130, du: 148, n: 8, look: "left" },

            booth: [1290, 400, 310, 505], win: [1312, 640, 172, 130], tag: [1306, 448],

      var ROWS = L.rows, NQ = 0;

      function rowOf(rank) { for (var i = ROWS.length - 1; i >= 0; i--) if (rank >= ROWS[i].first) return i; return 0; }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }

      // The humans in line: every build and tone; the patient (the part's spine) at L.patient.
      var LOOKS = [

        { tone: 2, outfit: "overalls", color: 1 }, { tone: 0, outfit: "dress", hair: 1, color: 0 }, { tone: 3, outfit: "shirt", color: 2 },
        { tone: 1, outfit: "suit", color: 3 }, { tone: 2, outfit: "shirt", color: 3 }, { tone: 0, outfit: "dress", hair: 1, color: 2 },
        { tone: 3, outfit: "suit", color: 0 }, { tone: 1, outfit: "overalls", color: 2 }, { tone: 2, outfit: "dress", hair: 1, color: 1, seed: 3 },
        { tone: 0, outfit: "shirt", color: 1 }, { tone: 1, outfit: "suit", color: 1 }, { tone: 3, outfit: "dress", hair: 1, color: 0 },

      var PATIENT = { tone: 2, outfit: "dress", hair: 1, color: 1, light: "red", mood: "worried" };
      // Hats the near row throws at the end of two-hundred-twelve-years-sooner (drawn apart from the head).
      var HATS = V ? { 1: "pillbox", 2: "porkpie", 3: "boater" } : { 1: "pillbox", 2: "boater", 3: "porkpie", 4: "pillbox", 5: "boater", 6: "porkpie" };
      function lookOf(rank) {
        if (rank === L.patient) return mix(PATIENT, { look: ROWS[rowOf(rank)].look });
        var o = mix(LOOKS[rank % LOOKS.length], { seed: (LOOKS[rank % LOOKS.length].seed || 0) + Math.floor(rank / LOOKS.length) * 7, look: ROWS[rowOf(rank)].look, light: "red", mood: "flat" });
        if (rowOf(rank) === 0) o.hat = null;
        if (rank >= L.grey) { o.hairColor = GREY; o.build = { hunch: 10 }; o.mood = "sad"; }

      }
      function isMan(o) { return o.hair !== 1; }

      // A paper ticket printed with a germ and a number, around (0,0), in person units.
      var GERMS = ["yellow", "orange", "peri", "rust"];
      function ticket(n) {
        return '<g transform="rotate(-12)"><rect x="-19" y="-12" width="38" height="24" fill="' + CARD + '" stroke="' + INK + '" stroke-width="2.4"/>' +
          '<path d="M-19,-4 a4,4 0 0 1 0,8 M19,-4 a4,4 0 0 0 0,8" fill="' + C.paper + '" stroke="' + INK + '" stroke-width="1.6"/>' +
          '<g transform="translate(-8,7) scale(0.27)">' + KIT.props.germ({ color: GERMS[n % 4] }) + "</g>" +
          '<text x="9" y="5" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="12" fill="' + INK + '">' + n + "</text></g>";
      }
      // The patient's mustard-and-orange striped scarf, at her neck.
      function scarf(o) {
        var n = KIT.rig(o).neck, x = n[0], y = n[1] + 2;
        var band = [[x - 9, y - 4], [x + 9, y - 5], [x + 10, y + 4], [x - 10, y + 5]];
        var tail = [[x + 2, y + 2], [x + 9, y + 1], [x + 12, y + 24], [x + 5, y + 26]];
        var pts = function (p) { return p.map(function (a) { return a[0].toFixed(1) + "," + a[1].toFixed(1); }).join(" "); };

          '<path d="M' + (x + 3.5) + "," + (y + 9) + " L" + (x + 10.5) + "," + (y + 8) + " M" + (x + 4.5) + "," + (y + 17) + " L" + (x + 11.5) + "," + (y + 16) + '" stroke="' + C.orange + '" stroke-width="3"/>' +
          '<polygon points="' + pts(band) + '" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="2" stroke-linejoin="miter"/>' +
          '<path d="M' + (x - 4) + "," + (y - 4.5) + " L" + (x - 5) + "," + (y + 4.6) + " M" + (x + 3) + "," + (y - 4.8) + " L" + (x + 3.5) + "," + (y + 4.4) + '" stroke="' + C.orange + '" stroke-width="3"/>';
      }
      // A long grey beard from the chin to the shoes (Part 9: waiting ages you); it zips back up on the squeeze.
      function beard(o) {

        return { origin: x + " " + y, svg: '<path d="M' + pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" L") + ' Z" fill="#E4E0D8" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="miter"/>' +
          '<path d="M' + (x - 2 * f) + "," + (y + 8) + " L" + (x + 1 * f) + "," + (y + 50) + " M" + (x + 3 * f) + "," + (y + 12) + " L" + (x + 5 * f) + "," + (y + 70) + '" stroke="' + GREY + '" stroke-width="1.6" fill="none"/>' };

      function cane(o) {
        var h = KIT.rig(o).hand[0];
        return '<path d="M' + h[0].toFixed(1) + "," + (h[1] - 4).toFixed(1) + " q-1,-9 -8,-7 M" + h[0].toFixed(1) + "," + (h[1] - 4).toFixed(1) + " L" + (h[0] - 3).toFixed(1) + ',100" fill="none" stroke="' + INK + '" stroke-width="5" stroke-linecap="round"/>' +
          '<path d="M' + h[0].toFixed(1) + "," + (h[1] - 4).toFixed(1) + " L" + (h[0] - 3).toFixed(1) + ',100" stroke="' + C.rust + '" stroke-width="2.4"/>';
      }
      // Hats, sitting on (0,0) at the top of a head, in the head's size.
      function hat(kind, k) {
        var s = function (d, fill) { return '<path d="' + d + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="miter"/>'; };
        var art = kind === "pillbox" ? s("M-11,3 L-10,-8 H10 L11,3 Z", C.rust) + '<path d="M-10,-2 H10" stroke="' + C.yellow + '" stroke-width="2.2"/>'

      }
      // A teal medicine bottle (the library bottle, recolored), on y 0.
      function tealBottle(size, face) {
        return KIT.props.pillBottle({ size: size, face: face || "smile", label: "", pills: false }).split(C.orange).join(C.med);
      }
      // One human's drawings: the base (in line, ticket in hand) and the variants this scene swaps to.
      var ARMS_UP_R = [[20, 10], [160, 176]], CHEER = [[-148, -166], [148, 166]];
      function human(rank) {
        var o = lookOf(rank), r = rowOf(rank), skel = rank >= L.bones, extra = "";
        var base = KIT.person(mix(o, { skeleton: skel }));

        var g = '<g class="v-base">' + base + tk + (rank === L.patient ? scarf(o) : "") + (rank >= L.grey && !skel && !isMan(o) ? cane(o) : "") + "</g>";
        if (rank === L.patient) g += '<g class="v-eager" opacity="0">' + KIT.person(mix(o, { mood: "eager" })) + tk + scarf(o) + "</g>";
        if (rank < 3) {
          // served: the bottle held up overhead, its base in the raised hand
          var so = mix(o, { arms: ARMS_UP_R, mood: "grin", light: "teal" }), sh = KIT.rig(so).hand[1];

      }

      // Brass posts and red velvet ropes: one post around (0,0), 60 tall; the rope ties on at (0,-54).
      function post() {
        return '<ellipse cx="0" cy="0" rx="12" ry="4" fill="' + C.yellow + '" stroke="' + INK + '" stroke-width="2.4"/>' +

      }
      var LANES = L.lanes.map(function (ln, li) {
        var us = [];
        for (var u = ln.from; u >= ln.to - 1; u -= ln.step) us.push(u);
        ln.us = us; ln.s = ROWS[ln.row].s;
        return ln;
      });
      function laneSvg(li) {
        var ln = LANES[li], ropes = "", posts = "";
        for (var i = 0; i < ln.us.length - 1; i++) ropes += '<path class="rope-o" fill="none" stroke="' + INK + '" stroke-width="' + (9 * ln.s).toFixed(1) + '" stroke-linecap="round"/><path class="rope" fill="none" stroke="' + C.war + '" stroke-width="' + (5.4 * ln.s).toFixed(1) + '" stroke-linecap="round"/>';

      }

      // The ticket booth: a clapboard booth with a scalloped awning, the window (its shutter rolls) and the counter.
      var B = L.booth, WN = L.win;
      function booth() {
        var x = B[0], y = B[1], w = B[2], h = B[3], boards = "";
        for (var yy = y + 40; yy < y + h; yy += 26) boards += '<path d="M' + x + "," + yy + " H" + (x + w) + '" stroke="' + INK + '" stroke-width="1.4" opacity="0.35"/>';
        var scallops = "";
        for (var i = 0; i < 7; i++) { var sx = x - 14 + i * ((w + 28) / 7), sw = (w + 28) / 7; scallops += '<path d="M' + sx.toFixed(1) + "," + (y + 18) + " a" + (sw / 2).toFixed(1) + "," + (sw / 2.4).toFixed(1) + ' 0 0 0 ' + sw.toFixed(1) + ',0 Z" fill="' + (i % 2 ? CARD : C.war) + '" stroke="' + INK + '" stroke-width="3"/>'; }
        return '<rect x="' + (x + 10) + '" y="' + (y + 12) + '" width="' + w + '" height="' + h + '" fill="' + C.ink + '" opacity="0.85"/>' +
          '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + C.tan + '" stroke="' + INK + '" stroke-width="5"/>' +
          '<rect x="' + (x + w * 0.62) + '" y="' + y + '" width="' + w * 0.38 + '" height="' + h + '" fill="url(#' + ID + '-hatch)" opacity="0.25"/>' + boards +
          '<path d="M' + (x - 14) + "," + (y + 18) + " L" + (x + 6) + "," + (y - 22) + " H" + (x + w - 6) + " L" + (x + w + 14) + "," + (y + 18) + ' Z" fill="' + C.war + '" stroke="' + INK + '" stroke-width="4" stroke-linejoin="miter"/>' + scallops +
          '<rect x="' + (WN[0] - 10) + '" y="' + (WN[1] - 10) + '" width="' + (WN[2] + 20) + '" height="' + (WN[3] + 10) + '" fill="' + C.rust + '" stroke="' + INK + '" stroke-width="4"/>' +
          '<rect x="' + WN[0] + '" y="' + WN[1] + '" width="' + WN[2] + '" height="' + WN[3] + '" fill="' + C.deep + '"/>' +
          '<rect x="' + (WN[0] + 8) + '" y="' + (WN[1] + 10) + '" width="' + (WN[2] - 16) + '" height="' + (WN[3] - 10) + '" fill="url(#' + ID + '-fine)" opacity="0.3"/>';
      }
      function shutter() {
        var lines = "";
        for (var yy = 12; yy < WN[3]; yy += 12) lines += '<path d="M' + WN[0] + "," + (WN[1] + yy) + " H" + (WN[0] + WN[2]) + '" stroke="' + INK + '" stroke-width="2"/>';

          '<g id="' + ID + '-blur" opacity="0">' + [0.2, 0.45, 0.7].map(function (f) { return '<path d="M' + (WN[0] + 6) + "," + (WN[1] + WN[3] * f) + " H" + (WN[0] + WN[2] - 6) + '" stroke="' + CARD + '" stroke-width="5" opacity="0.7"/>'; }).join("") + "</g></g>" +
          '<rect x="' + (WN[0] - 26) + '" y="' + (WN[1] + WN[3]) + '" width="' + (WN[2] + 44) + '" height="16" fill="' + C.rust + '" stroke="' + INK + '" stroke-width="3.4"/>';
      }

      // The wait sign, hanging on two chains: "WAIT TIME FROM HERE:" over three digit wheels and "YEARS".
      var S = L.sign, SX0 = S.cx - S.w / 2, WH = S.wheel;
      var WHEEL_X = [], wheels = "";
      var wy = S.top + S.h * 0.38, wtot = 3 * (WH[0] + 10) + 18 + S.yfs * 2.7, wx0 = S.cx - wtot / 2;
      function strip(i) {
        // hundreds: a blank then 0..9 three times; tens and units: 0..9 three times
        var out = "", n = i === 0 ? 31 : 30;
        for (var c = 0; c < n; c++) {
          var d = i === 0 ? (c === 0 ? "" : String((c - 1) % 10)) : String(c % 10);
          out += '<text x="' + (WH[0] / 2) + '" y="' + (c * WH[1] + WH[1] * 0.78).toFixed(1) + '" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="' + (WH[1] * 0.8).toFixed(0) + '" fill="' + CARD + '">' + d + "</text>";
        }

      }
      for (var wi = 0; wi < 3; wi++) {
        var x = wx0 + wi * (WH[0] + 10);
        WHEEL_X.push(x);
        wheels += '<defs><clipPath id="' + ID + "-wc" + wi + '"><rect x="0" y="0" width="' + WH[0] + '" height="' + WH[1] + '"/></clipPath></defs>' +
          '<g transform="translate(' + x.toFixed(1) + "," + wy.toFixed(1) + ')"><rect x="-4" y="-4" width="' + (WH[0] + 8) + '" height="' + (WH[1] + 8) + '" fill="' + C.slate + '" stroke="' + INK + '" stroke-width="4"/>' +
          '<g clip-path="url(#' + ID + "-wc" + wi + ')"><g id="' + ID + "-strip" + wi + '">' + strip(wi) + "</g></g>" +
          '<path d="M0,' + (WH[1] / 2) + " H" + WH[0] + '" stroke="' + INK + '" stroke-width="1.4" opacity="0.5"/><rect x="0" y="0" width="' + WH[0] + '" height="' + (WH[1] * 0.22) + '" fill="' + INK + '" opacity="0.35"/></g>';
      }
      var sign = '<g id="' + ID + '-sign">' +
        '<path d="M' + (SX0 + 60) + "," + S.chain + " V" + S.top + " M" + (SX0 + S.w - 60) + "," + S.chain + " V" + S.top + '" stroke="' + INK + '" stroke-width="5" stroke-dasharray="9 5"/>' +
        '<rect x="' + (SX0 + 10) + '" y="' + (S.top + 12) + '" width="' + S.w + '" height="' + S.h + '" fill="' + C.ink + '" opacity="0.85"/>' +
        '<rect x="' + SX0 + '" y="' + S.top + '" width="' + S.w + '" height="' + S.h + '" rx="6" fill="' + CARD + '" stroke="' + INK + '" stroke-width="6"/>' +
        '<rect x="' + (SX0 + 12) + '" y="' + (S.top + 12) + '" width="' + (S.w - 24) + '" height="' + (S.h - 24) + '" fill="none" stroke="' + C.orange + '" stroke-width="2.5"/>' +
        '<text x="' + S.cx + '" y="' + (S.top + S.h * 0.27).toFixed(1) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + S.fs + '" letter-spacing="2" fill="' + INK + '">WAIT TIME FROM HERE:</text>' +
        wheels + '<text x="' + (wx0 + 3 * (WH[0] + 10) + 14).toFixed(1) + '" y="' + (wy + WH[1] * 0.8).toFixed(1) + '" font-family="Oswald" font-weight="600" font-size="' + S.yfs + '" letter-spacing="3" fill="' + INK + '">YEARS</text></g>';
      // which strip cell shows each wheel's digit (443 at the start, then 36 with the hundreds blank)
      var CELL0 = [25, 24, 23], CELL1 = [0, 3, 6];

      // The "12.3x" tag hanging at the window's corner (two faces, swapped mid-spin).
      var TAGP = L.tag, TAGO = { angle: V ? 62 : 20, size: V ? 2 : 2.2 };
      var tag = '<g transform="translate(' + TAGP[0] + "," + TAGP[1] + ')"><circle r="5" fill="' + INK + '"/><g id="' + ID + '-tag">' +
        '<g class="tag-a">' + KIT.props.priceTag(mix(TAGO, { text: "1×" })) + "</g>" +
        '<g class="tag-b" opacity="0">' + KIT.props.priceTag(mix(TAGO, { text: "12.3×" })) + "</g></g></g>";

      // ══ Build ══════════════════════════════════════════════════════════════════════════
      var people = [];
      for (var rk = 0; rk < NQ; rk++) people.push(human(rk));
      var byRow = ROWS.map(function (r, i) { var s = ""; for (var k = r.first + r.n - 1; k >= r.first; k--) s += people[k]; return s; });
      // back to front: row 2, its lane, row 1, its lane, the booth, row 0 (the front of the line last, so the
      // people further back overlap the ones ahead), the front lane, the flying bottles, the sign.
      var row0 = "", back = "";
      for (var k0 = 0; k0 < ROWS[0].n; k0++) row0 += people[k0];
      for (var rr = ROWS.length - 1; rr >= 1; rr--) back += byRow[rr] + laneSvg(rr);
      var flyers = [0, 1, 2].map(function (i) { return '<g id="' + ID + "-fly" + i + '" opacity="0"><g transform="translate(0,53)">' + tealBottle(1) + "</g></g>"; }).join("");
      q("art").innerHTML = KIT.svg(W, H, KIT.paperDefs(ID) + back + booth() + shutter() + tag + row0 + laneSvg(0) + flyers + sign);

      // ══ Time ═══════════════════════════════════════════════════════════════════════════
      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "slide left");
      var T = {
        twelve: cue("twelve"), comp: cue("compressing"), fortyThree: cue("forty-three"), thirtySix: cue("thirty-six"), years: cue("years.", 2),
        after: KIT.after(ID, "years.", 2),
      };
      T.bottles = [T.twelve + 0.3, T.twelve + 0.5, T.twelve + 0.7];
      var FLY = 0.32;
      function pivot(el, o) { gsap.set(el, { svgOrigin: o }); }
      function clamp(x) { return Math.max(0, Math.min(1, x)); }
      // The accordion: each row squeezes a beat after the one in front of it, slams past and springs back.
      function squeeze(row, t) {
        var p = clamp((t - T.comp - row * 0.08) / 0.7);
        // (lands exactly on 1, so the last frame is two-hundred-twelve-years-sooner's first)
        return p <= 0 ? 0 : 1 - Math.exp(-6.5 * p) * Math.cos(8.5 * p) * (1 - p);
      }
      function kOf(row, t) { return 1 - (1 - L.K) * squeeze(row, t); }
      function xOf(u, row, t) { return L.AX - (L.AX - u) * kOf(row, t); }

      var pg = [], pj = [];
      for (var i = 0; i < NQ; i++) { pg.push(q("p" + i)); pj.push(q("p" + i + "-j")); }
      var laneEls = LANES.map(function (ln, li) {
        var g = q("lane" + li);
        return { posts: g.querySelectorAll(".post"), ropes: g.querySelectorAll(".rope"), outs: g.querySelectorAll(".rope-o") };
      });
      var fly = [0, 1, 2].map(function (i) { return q("fly" + i); });
      // where each served human's raised hand holds its bottle (before the squeeze)
      var catchAt = [0, 1, 2].map(function (i) {
        // (the bottle's center, 26.5 units above its base in the hand)
        var r = ROWS[0], so = mix(lookOf(i), { arms: ARMS_UP_R }), h = KIT.rig(so).hand[1], u = r.u0 + i * r.du;
        return [u + h[0] * r.s, r.y - 100 * r.s + (h[1] + 10 - 26.5) * r.s];
      });
      var winOut = [WN[0] + WN[2] * 0.3, WN[1] + WN[3] * 0.7];

      KIT.onTime(tl, D, function (t) {
        for (var i = 0; i < NQ; i++) {
          var r = rowOf(i), R = ROWS[r], u = R.u0 + (i - R.first) * R.du, x = xOf(u, r, t), sq = squeeze(r, t);
          // squashed sideways as the posts slam together, and a little hop on the slam
          var sx = 1 - 0.12 * Math.min(1, sq), hop = sq > 0 && sq < 1 ? -Math.sin(Math.PI * clamp((t - T.comp - r * 0.08) / 0.35)) * 10 : 0;
          pg[i].setAttribute("transform", "translate(" + x.toFixed(1) + "," + (R.y - 100 * R.s + hop).toFixed(1) + ") scale(" + (R.s * sx).toFixed(4) + "," + R.s + ")");
        }
        LANES.forEach(function (ln, li) {
          var E = laneEls[li], s = ln.s, top = 54 * s, xs = ln.us.map(function (u) { return xOf(u, ln.row, t); });
          Array.prototype.forEach.call(E.posts, function (p, j) { p.setAttribute("transform", "translate(" + xs[j].toFixed(1) + "," + ln.y + ") scale(" + s + ")"); });
          for (var j = 0; j < xs.length - 1; j++) {
            var d0 = Math.abs(ln.us[j + 1] - ln.us[j]), d = Math.abs(xs[j + 1] - xs[j]), L0 = d0 * 1.03;
            var sag = Math.min(top - 6 * s, 0.5 * Math.sqrt(Math.max(0, L0 * L0 - d * d)) + 4 * s), y = ln.y - top;
            var dd = "M" + xs[j].toFixed(1) + "," + y.toFixed(1) + " Q" + ((xs[j] + xs[j + 1]) / 2).toFixed(1) + "," + (y + 2 * sag).toFixed(1) + " " + xs[j + 1].toFixed(1) + "," + y.toFixed(1);
            E.ropes[j].setAttribute("d", dd); E.outs[j].setAttribute("d", dd);
          }
        });
        // the three bottles arc out of the window into the first three hands
        fly.forEach(function (g, i) {
          var p = (t - T.bottles[i]) / FLY;
          if (p < 0 || p >= 1) { g.setAttribute("opacity", "0"); return; }
          var a = winOut, b = catchAt[i], x = a[0] + (b[0] - a[0]) * p, y = a[1] + (b[1] - a[1]) * p - Math.sin(Math.PI * p) * (V ? 150 : 130);
          var s = ROWS[0].s * 0.5;
          g.setAttribute("opacity", "1");
          g.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ") rotate(" + (p * 360 - 360).toFixed(1) + ") scale(" + s.toFixed(3) + ")");
        });
      });

      // "twelve": the shutter flies up and down so fast it blurs (whirr), then rests up; the tag flips to 12.3x.
      var shut = q("shutter"), blur = q("blur");
      gsap.set(shut, { y: -WN[3] * 0.45 });
      tl.to(shut, { y: -WN[3] * 0.98, duration: 0.05, ease: "none" }, T.twelve);
      tl.fromTo(shut, { y: -WN[3] * 0.98 }, { y: -WN[3] * 0.1, duration: 0.045, repeat: 25, yoyo: true, ease: "none", immediateRender: false }, T.twelve + 0.05);
      tl.to(shut, { y: -WN[3] * 0.98, duration: 0.08, ease: "power2.out" }, T.twelve + 0.05 + 0.045 * 26);
      tl.set(blur, { opacity: 1 }, T.twelve + 0.05);
      tl.set(blur, { opacity: 0 }, T.twelve + 0.05 + 0.045 * 26);
      var tagEl = q("tag");
      pivot(tagEl, "0 0");
      tl.to(tagEl, { scaleX: -1, duration: 0.12, repeat: 5, yoyo: true, ease: "sine.inOut" }, T.twelve);
      tl.to(tagEl, { scaleX: 1, duration: 0.12, ease: "sine.out" }, T.twelve + 0.72);
      tl.set(tagEl.querySelector(".tag-a"), { opacity: 0 }, T.twelve + 0.42);
      tl.set(tagEl.querySelector(".tag-b"), { opacity: 1 }, T.twelve + 0.42);
      tl.fromTo(tagEl, { rotation: 0 }, { rotation: 14, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, T.twelve + 0.84);

      // The three bottles land in the first three hands: arm up, chest light teal, a grin.
      [0, 1, 2].forEach(function (i) {
        var land = T.bottles[i] + FLY, g = pg[i];
        tl.set(g.querySelector(".v-base"), { opacity: 0 }, land);
        tl.set(g.querySelector(".v-served"), { opacity: 1 }, land);
        pivot(pj[i], "0 100");
        tl.fromTo(pj[i], { scaleY: 1 }, { scaleY: 0.9, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, land);
      });

      // "compressing": the beards zip back up into the chins like tape measures (squeak); the skeletons rattle forward.
      var beards = document.querySelectorAll("#" + ID + "-art .beard");
      Array.prototype.forEach.call(beards, function (b, i) {
        pivot(b, b.getAttribute("data-o"));
        tl.fromTo(b, { scaleY: 1 }, { scaleY: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, T.comp + 0.3 + (i % 4) * 0.04);
      });
      for (var bi = L.bones; bi < NQ; bi++) {
        pivot(pj[bi], "0 100");
        tl.fromTo(pj[bi], { rotation: 0 }, { rotation: 4, duration: 0.06, repeat: 11, yoyo: true, ease: "none", immediateRender: false }, T.comp + 0.05 + (bi % 3) * 0.02);
        tl.to(pj[bi], { rotation: 0, duration: 0.08 }, T.comp + 0.05 + (bi % 3) * 0.02 + 0.72);
      }
      // the grey heads straighten up a little as the years come off
      for (var gi = L.grey; gi < L.bones; gi++) {
        pivot(pj[gi], "0 100");
        tl.fromTo(pj[gi], { rotation: 0 }, { rotation: (ROWS[rowOf(gi)].look === "left" ? 1 : -1) * 6, duration: 0.2, ease: "back.out(3)", immediateRender: false }, T.comp + 0.5);
      }

      // "forty-three": the sign shakes on its chains (clank).
      var signEl = q("sign");
      pivot(signEl, S.cx + " " + S.chain);
      tl.fromTo(signEl, { rotation: 0 }, { rotation: 2.4, duration: 0.07, repeat: 7, yoyo: true, ease: "sine.inOut", immediateRender: false }, T.fortyThree);
      tl.to(signEl, { rotation: 0, duration: 0.12 }, T.fortyThree + 0.56);
      // "thirty-six": the wheels spin down (ticks) and clank on "36 YEARS" on "years.".
      [0, 1, 2].forEach(function (i) {
        var st = q("strip" + i);
        gsap.set(st, { y: -CELL0[i] * WH[1] });
        tl.to(st, { y: -CELL1[i] * WH[1] - WH[1] * 0.12, duration: T.years - T.thirtySix, ease: "power1.in" }, T.thirtySix);
        tl.to(st, { y: -CELL1[i] * WH[1], duration: 0.18, ease: "back.out(3)" }, T.years);
      });
      tl.fromTo(signEl, { y: 0 }, { y: 6, duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.years);

      // after "years.": the patient, near the front now, looks up wide-eyed.
      var pat = pg[L.patient];
      tl.set(pat.querySelector(".v-base"), { opacity: 0 }, T.after);
      tl.set(pat.querySelector(".v-eager"), { opacity: 1 }, T.after);
      pivot(pj[L.patient], "0 100");
      tl.fromTo(pj[L.patient], { y: 0 }, { y: -8, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.after);

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
