<template id="accordion-timeline-template">
  <!-- accordion-timeline · collage (Part 14, scenes 9 and 10 as one plate). The bit: the queue for a first treatment,
       laid on a ruler of years, folds up like an accordion. The FDA's window at the right under NOW SERVING 15 PER YEAR;
       the queue, each human walking a disease on a leash, runs left from it along the ruler. "twelve point three": 185 PER YEAR, 12.3×,
       and bottles spit out to the front of the line. "shrinking that 443 year wait": pull back to the far end, 2469,
       where the line goes grey and then dead: 443 YEARS. "to thirty-six": the whole queue squeezes up the ruler to end at
       2062, 36 YEARS, and the dead at the back come back to life. "The average disease": a never-tested bottle on a
       plinth, in a cobweb under a spider with a long beard, with a band of dust two centuries long; "arrives": the dust snaps back to a
       stub and the first arrow sign springs up, 204 YEARS SOONER. "Keep the safety test": at the stub stands the
       approval cabinet, 8.2 YEARS, YOU's skeleton slumped against it; "drop": the Gilliam foot. The SAFE bottle hops out
       to the front of the queue, the second sign springs up, 8.2 YEARS SOONER, and on "twelve" the two slam together:
       212 YEARS SOONER. Everybody jumps. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #E2CFA5; }
  </style>
  <div id="root" data-composition-id="accordion-timeline" data-width="1920" data-height="1080" data-start="0" data-duration="24.54">
    <div id="accordion-timeline-weave"></div>
    <div id="accordion-timeline-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    var ID = "accordion-timeline", V = KIT.V, G = 980, Z = KIT.collage.SIZES, cue = function (w, n) { return KIT.cue(ID, w, n); };
    var hs = function (art, h) { return h / Z[art][1]; };
    // The ruler: 14 px a year from 2026 at X0. The FDA's window stands at its start.
    var X0 = 700, PY = 14, yr = function (y) { return X0 + (y - 2026) * PY; }, END = yr(2469), SQ = 36 / 443;
    var FX = 330;
    var cy = function (s, d) { return V ? G - 420 / s : 540 + (d || 0); };
    var views = V ? {
      win: [760, cy(0.72), 0.72], long: [3780, cy(0.165), 0.165], mid: [1450, cy(0.5), 0.5], shelf: [2700, cy(0.47), 0.47], cab: [2200, cy(0.55), 0.55],
    } : {
      win: [880, 640, 1], long: [3780, 330, 0.3], mid: [1600, 600, 0.68], shelf: [2800, 520, 0.55], cab: [2100, 560, 0.85],
    };
    var cast = {}, beats = [], add = function (b) { beats.push(b); };

    // the FDA's window in its brick wall, its shutter, and the NOW SERVING board over it
    var WK = hs("fda-window", 620);
    cast.board = { art: "now-serving", x: FX - 60, y: G - 610, anchor: "bottom", scale: 0.9 };
    cast.fda = { art: "fda-window", x: FX, y: G, anchor: "bottom", pivot: "bottom", scale: WK, label: { text: "F.D.A.", at: [190, 40], width: 150, size: 46, plaque: true } };
    cast.shut = { art: "fda-window-shut", x: FX, y: G, anchor: "bottom", pivot: "bottom", scale: WK, hidden: true, label: { text: "F.D.A.", at: [190, 40], width: 150, size: 46, plaque: true } };
    for (var b = 0; b < 3; b++) cast["sp" + b] = { art: "pill-bottle", x: FX + 30, y: G - 120, scale: 0.45, hidden: true, label: { text: "SAFE", at: [78, 300], width: 120, size: 60 } };

    // the queue: the sick at the front, grey further back, the dead at the far end; each with its disease at heel
    var N = 24, STEP = (END - (X0 + 120)) / (N - 1), H = 420;
    var PEOPLE = [], BACK = [], ALIVE = [];
    for (var i = 0; i < N; i++) {
      var x = X0 + 120 + i * STEP, name = "p" + i, art = i < 13 ? "leash-human" : i < 19 ? "leash-human-old" : "leash-human-skeleton";
      cast[name] = { art: art, x: x, y: G, anchor: "bottom", pivot: "bottom", scale: hs(art, H) };
      PEOPLE.push({ name: name, x: x });
      if (i >= 19) {
        cast["l" + i] = { art: "leash-human", x: x, y: G, anchor: "bottom", pivot: "bottom", scale: hs("leash-human", H), hidden: true };
        BACK.push(name); ALIVE.push("l" + i);
      }
    }
    // the dusty bottle on its plinth, the cobweb and the spider; the cabinet; YOU's skeleton
    var SH = 1950, BAND = 10;                                         // the band of dust: 10 px a year from the bottle
    cast.plinth = { art: "plinth", x: SH, y: G, anchor: "bottom", pivot: "bottom", scale: 1.1, hidden: true };
    var PT = G - Z.plinth[1] * 1.1;
    cast.dusty = { art: "medicine-bottle", x: SH, y: PT, anchor: "bottom", pivot: "bottom", scale: 0.95, hidden: true,
      label: [{ text: "NEVER TESTED", at: [72, 190], width: 100, size: 40 }, { text: "FOR THIS", at: [72, 230], width: 90, size: 40 }] };
    cast.torch = { art: "flashlight", x: SH + 380, y: PT - 150, scale: 0.9, hidden: true };
    cast.web = { art: "cobweb", x: SH + 40, y: PT - 230, scale: 0.9, hidden: true };
    cast.spider = { art: "spider", x: SH + 115, y: PT - 260, anchor: "bottom", scale: 0.9, hidden: true, points: { chin: [64, 600] } };
    // its long beard, hanging from its chin, clear of the label
    var BDK = 0.3;
    cast.beard = { art: "beard", x: SH + 115, y: PT - 330, anchor: "top", pivot: "top", scale: BDK, hidden: true };
    var CABX = SH + 300 + 8.2 * BAND + 80;
    cast.cab = { art: "approval-cabinet-full", x: CABX, y: G, anchor: "bottom", pivot: "bottom", scale: 1.35, hidden: true };
    cast.skel = { art: "you-skeleton", x: CABX + 210, y: G, anchor: "bottom", pivot: "bottom", scale: hs("you-skeleton", 520), hidden: true };
    cast.safe = { art: "pill-bottle", x: CABX, y: G - 330, scale: 0.6, hidden: true, label: { text: "SAFE", at: [78, 300], width: 120, size: 60 } };
    cast.crack = { art: "glass-crack", x: CABX, y: G - 380, scale: 1.1, hidden: true };
    cast.boot = { art: "boot", x: CABX, y: G, anchor: "bottom", pivot: "bottom", scale: 1.7, hidden: true };
    // the arrow signs
    var sign = function (x, years) { return { art: "arrow-sign", x: x, y: G, anchor: "bottom", pivot: "bottom", scale: 1.7, hidden: true,
      label: [{ text: years, at: [180, 78], width: 270, size: 120 }, { text: "SOONER", at: [180, 128], width: 200, size: 80 }] }; };
    cast.sign1 = sign(2950, "204 YEARS");
    cast.sign2 = sign(3750, "8.2 YEARS");
    cast.sign3 = sign(3350, "212 YEARS");

    // ── the ruler on the ground: a line, ticks and years (bare counters as labels) ──
    add({ at: 0, do: "line", id: "ruler", points: [[X0 - 40, G + 30], [END + 200, G + 30]], color: "ink", width: 8, dur: 0.01 });
    [2026, 2100, 2200, 2300, 2400, 2469].forEach(function (y, k) {
      add({ at: 0, do: "line", id: "tick" + k, points: [[yr(y), G + 10], [yr(y), G + 60]], color: "ink", width: 8, dur: 0.01 });
      add({ at: 0, do: "counter", id: "yr" + k, from: y, to: y, dur: 0.01, commas: false, card: false, enter: "none", x: yr(y), y: G + 120, size: k ? 110 : 80 });
    });
    add({ at: 0, do: "bob", who: PEOPLE.map(function (p) { return p.name; }), y: 5, r: 2, speed: 1.4, until: "thirty-six." });
    // ── "twelve point three": 15 a year becomes 185, and bottles shoot to the front ──
    add({ at: 0.05, do: "counter", id: "rate", who: "board", spot: [300, 362], from: 185, to: 15, dur: 0.01, suffix: "\u00a0PER YEAR", size: 34, card: false, color: "#F2E6C6", enter: "none" });
    add({ on: "twelve", n: 1, do: "counter", id: "rate", to: 185, dur: 0.9, ease: "smooth" });
    add({ on: "times,", offset: -0.1, do: "stamp", id: "x123", text: "12.3×", x: FX + 380, y: G - 650, size: 110, width: 300, tilt: -6 });
    [0, 1, 2].forEach(function (k) {
      add({ on: "times,", offset: 0.1 + k * 0.15, do: "pop", who: "sp" + k });
      add({ on: "times,", offset: 0.15 + k * 0.15, do: "move", who: "sp" + k, to: [PEOPLE[k].x + 30, G - 290], dur: 0.3, arc: 200, turn: 360 });
    });
    // the shutter blurs up and down
    for (var sh = 0; sh < 4; sh++) {
      add({ on: "times,", offset: sh * 0.16, do: "hide", who: "fda" }); add({ on: "times,", offset: sh * 0.16, do: "show", who: "shut" });
      add({ on: "times,", offset: sh * 0.16 + 0.08, do: "hide", who: "shut" }); add({ on: "times,", offset: sh * 0.16 + 0.08, do: "show", who: "fda" });
    }
    // ── "443 year wait": the far end, grey and dead ──
    add({ on: "shrinking", offset: -0.2, do: "camera", view: "long", dur: 1.3 });
    add({ on: "forty-three", offset: 0.1, do: "stamp", id: "w443", text: "443 YEARS", x: END - 1000, y: G - 900, size: 360, width: 1700, tilt: -4 });
    // ── "to thirty-six": the accordion; the queue ends at 2062 and the dead come back ──
    var SQT = cue("to", 1) - 0.1;
    PEOPLE.forEach(function (p) {
      var nx = X0 + (p.x - X0) * SQ;
      add({ at: SQT, do: "move", who: [p.name].concat(BACK.indexOf(p.name) >= 0 ? ["l" + p.name.slice(1)] : []), by: [nx - p.x, 0], dur: 0.45, ease: "smooth" });
    });
    add({ at: SQT + 0.42, do: "shake", x: 16, frames: 4 });
    add({ at: SQT + 0.2, do: "hide", who: "w443" });
    add({ on: "thirty-six.", offset: 0.05, do: "camera", view: "mid", dur: 0.7 });
    add({ on: "thirty-six.", offset: 0.2, do: "stamp", id: "w36", text: "36 YEARS · 2062", x: yr(2062) + 250, y: G - 640, size: 150, width: 980, tilt: -4 });
    add({ on: "thirty-six.", offset: 0.5, do: "xray", who: BACK, to: ALIVE, stagger: 0.05, follow: false });

    // ── "The average disease": a bottle nobody tested, under two centuries of dust ──
    add({ on: "average", offset: -0.1, do: "hide", who: ["w36", "x123", "rate"] });
    add({ on: "average", do: "camera", view: "shelf", dur: 0.9 });
    add({ on: "disease", n: 1, do: "pop", who: ["plinth", "dusty", "web"], squash: true });
    add({ on: "sits", do: "slideIn", who: "spider", from: "top", dist: 900, over: 30 });
    add({ on: "sits", do: "move", who: "beard", to: "spider.chin", by: [0, Z.beard[1] * BDK / 2 - 12], dur: 0.01 });
    add({ on: "halfway", do: "pop", who: "beard", squash: true });
    add({ on: "halfway", do: "line", id: "dust", points: [[SH + 120, G - 70], [SH + 120 + 204 * BAND, G - 70]], color: "#9C9280", width: 70, dur: 1.2 });
    add({ on: "queue,", do: "bob", who: "spider", y: 10, r: 3, speed: 0.7, until: "arrives" });
    // "arrives": the dust snaps back to a stub, the spider with it, and the first sign springs up
    add({ on: "arrives", offset: -0.3, do: "pop", who: "torch", squash: true });
    add({ on: "arrives", offset: -0.1, do: "glow", who: "dusty", size: 500, dur: 0.5 });
    add({ on: "Keep", offset: -0.2, do: "pop", who: "torch", out: true });
    add({ on: "arrives", do: "hide", who: "dust" });
    add({ on: "arrives", do: "line", id: "stub", points: [[SH + 120, G - 70], [SH + 120 + 8.2 * BAND + 60, G - 70]], color: "#9C9280", width: 70, dur: 0.05 });
    add({ on: "arrives", do: "move", who: "spider", by: [40, 40], dur: 0.15 });
    add({ on: "arrives", offset: 0.15, do: "shiver", who: "spider", dur: 0.5, amp: 8, rot: 10 });
    add({ on: "arrives", offset: 0.15, do: "shiver", who: "beard", dur: 0.6, amp: 6, rot: 16 });
    add({ on: "two", n: 1, do: "slideIn", who: "sign1", from: "bottom", dist: 1200, over: 40 });
    // ── "Keep the safety test, drop the 8.2 year wait": the cabinet, and the foot ──
    add({ on: "Keep", offset: -0.1, do: "camera", view: "cab", dur: 0.7 });
    add({ on: "Keep", do: "pop", who: ["cab", "skel"], squash: true });
    add({ on: "safety", do: "show", who: "safe" });
    add({ on: "test,", do: "tag", id: "t82", who: "cab", text: "8.2 YEARS", x: CABX - 300, y: G - 760, w: 360, h: 150, knot: [100, 40] });
    add({ on: "drop", offset: -0.2, do: "stamp", who: "boot", from: 2.4, shake: 18 });
    add({ on: "drop", offset: -0.05, do: "hide", who: ["cab", "t82"] });
    add({ on: "drop", offset: -0.05, do: "pop", who: "crack", squash: true });
    add({ on: "wait,", offset: 0.1, do: "slideOut", who: "boot", to: "top", dist: 6000, dur: 0.4 });
    add({ on: "wait,", offset: 0.3, do: "pop", who: "crack", out: true });
    // the SAFE bottle hops out to the front of the queue; YOU's skeleton reaches for it, eight years late
    add({ on: "find", do: "camera", view: "mid", dur: 0.8 });
    add({ on: "find", do: "move", who: "safe", to: [X0 + 120, G - 300], turn: 720, dur: 0.9, arc: 420 });
    add({ on: "works", do: "hop", who: PEOPLE[0].name, height: 50 });
    add({ on: "normal", do: "nudge", who: "skel", by: [-40, -10] });
    add({ on: "care.", offset: -0.2, do: "camera", view: "shelf", dur: 0.7 });
    add({ on: "care.", do: "slideIn", who: "sign2", from: "bottom", dist: 1200, over: 40 });
    // "twelve": the two signs slam together into one
    add({ on: "two", n: 2, do: "move", who: "sign1", to: [3350, G], dur: 0.35 });
    add({ on: "two", n: 2, do: "move", who: "sign2", to: [3350, G], dur: 0.35 });
    add({ on: "twelve", n: 2, offset: -0.1, do: "hide", who: ["sign1", "sign2"] });
    add({ on: "twelve", n: 2, offset: -0.1, do: "stamp", who: "sign3", from: 1.8, shake: 16 });
    var HAPPY = PEOPLE.map(function (p) { return p.name; }).filter(function (n) { return BACK.indexOf(n) < 0; }).concat(ALIVE);
    add({ on: "sooner.", n: 2, offset: 0.1, do: "hop", who: HAPPY, height: 60 });
    add({ on: "sooner.", n: 2, offset: 0.55, do: "hop", who: HAPPY, height: 40 });

    // The queue's cut-outs walk right, so the plate is drawn mirrored: everything laid out above with the window on
    // the left is flipped, and the window stands at the right with the years running away from it to the left.
    var MX = 7700, M = function (x) { return MX - x; };
    Object.keys(cast).forEach(function (n) { cast[n].x = M(cast[n].x); });
    Object.keys(views).forEach(function (n) { views[n] = [M(views[n][0]), views[n][1], views[n][2]]; });
    beats.forEach(function (b) {
      if (Array.isArray(b.to) && typeof b.to[0] === "number") b.to = [M(b.to[0]), b.to[1]];
      if (Array.isArray(b.by)) b.by = [-b.by[0], b.by[1]];
      if (b.points) b.points = b.points.map(function (q) { return [M(q[0]), q[1]]; });
      if (typeof b.x === "number") b.x = M(b.x);
      if (typeof b.turn === "number") b.turn = -b.turn;
    });
    KIT.collage({ id: ID, seed: 1408, plate: V ? [-2900, -8200, 10900, 6400] : [-1300, -1600, 9100, 2700], views: views, view: "win", cast: cast, beats: beats });
  </script>
</template>
