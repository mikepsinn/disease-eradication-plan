      // ════════════════ (a) The live board ════════════════
      var hdrH = Math.round(HH * 0.17), fsHdr = Math.round(hdrH * 0.46);
      var rowsTop = HY + hdrH + 44, rowGap = 8, rowH = (HY + HH - 12 - rowsTop - 3 * rowGap) / 4;

      var OLD = "WISHONIA · 3,000 YEARS", NEW = "DECENTRALIZED FDA (your word)";
      var fsRow = rowH * 0.42, fsCol = Math.round(HH * 0.036);
      var board = rect(HX, HY, HW, HH, C.navy) + rect(HX, HY, HW, hdrH, C.deep) +
        '<path d="M' + HX + "," + (HY + hdrH) + " H" + (HX + HW) + '" stroke="' + C.yellow + '" stroke-width="4"/>' +
        txt(HX + 24, HY + hdrH * 0.68, fsHdr, "Oswald", C.yellow, OLD, 'id="' + ID + '-hdr" letter-spacing="1.5"') +
        '<circle id="' + ID + '-live" cx="' + n1(HX + HW - 92) + '" cy="' + n1(HY + hdrH * 0.5) + '" r="' + n1(hdrH * 0.13) + '" fill="' + C.war + '" stroke="' + C.cream + '" stroke-width="2"/>' +
        txt(HX + HW - 76, HY + hdrH * 0.5 + fsHdr * 0.3, fsHdr * 0.75, "Oswald", C.cream, "LIVE", 'letter-spacing="2"') +
        txt(col.name, HY + hdrH + 30, fsCol, "Oswald", C.peri, "TREATMENT", 'letter-spacing="1.5"') +
        txt((col.pc[0] + col.pc[1]) / 2, HY + hdrH + 30, fsCol, "Oswald", C.peri, "PATIENTS", 'text-anchor="middle" letter-spacing="1.5"') +
        txt((col.wk[0] + col.wk[1]) / 2, HY + hdrH + 30, fsCol, "Oswald", C.peri, "WORKED", 'text-anchor="middle" letter-spacing="1.5"') +
        txt((col.tk[0] + col.tk[1]) / 2, HY + hdrH + 30, fsCol, "Oswald", C.peri, "PUBLISHED", 'text-anchor="middle" letter-spacing="1"');
      function rowY(i) { return rowsTop + i * (rowH + rowGap); }
      ROWS.forEach(function (r, i) {
        var y = rowY(i), cy = y + rowH / 2, cellH = rowH - 16, tb = Math.min(cellH, col.tk[1] - col.tk[0]) * 0.86;
        var cell = function (x0, x1) {
          return rect(x0, y + 8, x1 - x0, cellH, C.deep, 'stroke="' + C.ink + '" stroke-width="2"') + '<path d="M' + n1(x0 + 2) + "," + n1(cy) + " H" + n1(x1 - 2) + '" stroke="' + C.slate + '" stroke-width="2"/>';
        };
        board += rect(col.name - 12, y, col.tk[1] - col.name + 22, rowH, C.slate, 'stroke="' + C.ink + '" stroke-width="3"') +
          txt(col.name, cy + fsRow * 0.36, fsRow, "Oswald", C.cream, r.name, 'letter-spacing="1"') +
          cell(col.pc[0], col.pc[1]) + txt((col.pc[0] + col.pc[1]) / 2, cy + fsRow * 0.36, fsRow, "Oswald", C.yellow, fmt(r.n), 'id="' + ID + "-pc" + i + '" text-anchor="middle" letter-spacing="1"') +
          cell(col.wk[0], col.wk[1]) + txt((col.wk[0] + col.wk[1]) / 2, cy + fsRow * 0.36, fsRow, "Oswald", C.cream, r.worked, 'text-anchor="middle"') +
          rect((col.tk[0] + col.tk[1]) / 2 - tb / 2, cy - tb / 2, tb, tb, WHITE, 'stroke="' + C.ink + '" stroke-width="3" rx="3"') +
          '<g id="' + ID + "-tick" + i + '">' + KIT.tick((col.tk[0] + col.tk[1]) / 2 - tb / 2 - 2, cy - tb / 2 - 6, tb * 1.15, C.med) + "</g>" +
          at(col.wish, y + rowH - 3, rowH / 66, wishonian(), "wn" + i);
      });
      function fmt(n) { return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
      // A little Wishonian, feet at (0, 0), about 62 tall: blue skin, the black bob, two ball-tipped antennae, the orange
      // dress. Its right arm (.wn-wave, shoulder at (6, -30)) waves.
      function wishonian() {
        var sk = C.cyan, l = 'stroke="' + C.ink + '" stroke-width="2.4" stroke-linejoin="round"';
        return '<path d="M-5,-2 V-16 M5,-2 V-16" stroke="' + C.ink + '" stroke-width="6" stroke-linecap="round"/><path d="M-5,-2 V-16 M5,-2 V-16" stroke="' + sk + '" stroke-width="3" stroke-linecap="round"/>' +
          '<path d="M-9,-3 H-2 M2,-3 H9" stroke="' + C.ink + '" stroke-width="3.5" stroke-linecap="round"/>' +
          '<path d="M-6,-31 L-14,-17 M-14,-17 L-12,-14" stroke="' + C.ink + '" stroke-width="5" stroke-linecap="round"/><path d="M-6,-31 L-14,-17" stroke="' + sk + '" stroke-width="2.4" stroke-linecap="round"/>' +
          '<path d="M-7,-33 H7 L13,-14 H-13 Z" fill="' + C.orange + '" ' + l + "/>" +
          '<path d="M-3,-27 q4,-3 7,1 q-2,5 -6,3 M-8,-19 q5,-3 8,1" fill="none" stroke="' + C.rust + '" stroke-width="1.8"/>' +
          '<g class="wn-wave"><path d="M6,-30 L15,-44" stroke="' + C.ink + '" stroke-width="5" stroke-linecap="round"/><path d="M6,-30 L15,-44" stroke="' + sk + '" stroke-width="2.4" stroke-linecap="round"/><circle cx="15.5" cy="-45" r="3" fill="' + sk + '" ' + l + "/></g>" +
          '<path d="M-3,-49 L-7,-61 M3,-49 L7,-61" stroke="' + C.ink + '" stroke-width="4"/><path d="M-3,-49 L-7,-61 M3,-49 L7,-61" stroke="' + sk + '" stroke-width="1.8"/>' +

          '<path d="M-10,-38 Q-11,-52 0,-52 Q11,-52 10,-38 L11,-33 H-11 Z" fill="' + C.ink + '"/>' +

      // ════════════════ (c) Earth: the hallway of trial doors ════════════════
      // subsidy-follows-patient's first frame (that scene zooms into this screen), drawn in its own frame (W x H) and
      // shown here through KIT.zoomView().mini, so the zoom starts on it. Everything between the COPY markers is copied
      // verbatim from subsidy-follows-patient.html (its ids get this scene's "-hw" prefix): change both. Left out: the
      // money mountain and the price tags, which arrive in that scene.
      var HWY = (function () {
        var ID = "home-planet-board-hw";
        var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, INK = C.line, WHITE = "#FBF6E6";
        var P = function (s) { return ID + "-" + s; };
        // ── COPY from subsidy-follows-patient.html (helpers) ──
      var f1 = function (n) { return (+n).toFixed(1); };
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function at(x, y, k, inner) { return '<g transform="translate(' + f1(x) + "," + f1(y) + ")" + (k === 1 ? "" : " scale(" + (+k).toFixed(3) + ")") + '">' + inner + "</g>"; }
      function poly(pts, fill, sw, extra) { return '<path d="M' + pts.map(function (p) { return f1(p[0]) + "," + f1(p[1]); }).join(" L") + ' Z" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw || 3) + '" stroke-linejoin="miter"' + (extra || "") + "/>"; }
        // ── COPY from subsidy-follows-patient.html (the hallway, the doors, the doctors, the patient) ──
      // ════ THE TRIAL HALLWAY (home-planet-board draws this frame on its wall screen: change both) ════
      // A hospital corridor in one-point perspective toward (vx, vy). A floor point at lateral u (-1 left wall, 1 right
      // wall) and depth p (1 at the hallway's mouth, smaller farther in) is at (X(u, p), Y(p)); a person there is drawn
      // at scale S(p). Doors stand on both walls (KIT.props.door, turned onto the wall plane by an affine matrix), each
      // with a doctor in the doorway and a sign facing down the hall: a germ and a tally. pE: the end wall's depth.
      var G = V ? { vx: 540, vy: 600, wd: 640, fl: 840, cz: 360, s0: 2.0, pE: 0.17 }
                : { vx: 1000, vy: 360, wd: 1000, fl: 540, cz: 160, s0: 1.75, pE: 0.17 };
      function X(u, p) { return G.vx + u * G.wd * p; }
      function Y(p) { return G.vy + G.fl * p; }
      function CY(p) { return G.vy - G.cz * p; }
      function S(p) { return G.s0 * p; }
      function depthAt(y) { return (y - G.vy) / G.fl; }
      // side 1 = right wall, -1 = left wall; p: the door's middle; hers: the scientist's door (the patient's pick).
      var DOORS = (V ? [[1, 0.62], [1, 0.45, 1], [1, 0.33], [1, 0.25], [-1, 0.72], [-1, 0.52], [-1, 0.37], [-1, 0.27]]
                     : [[1, 0.58], [1, 0.42, 1], [1, 0.31], [1, 0.24], [-1, 0.7], [-1, 0.5], [-1, 0.37], [-1, 0.28]]).map(function (d, i) {
        var germs = [["yellow", "grin"], ["med", "smug"], ["red", "cross"], ["peri", "grin"], ["orange", "smug"], ["rust", "cross"], ["cyan", "grin"], ["tan", "smug"]];
        var docs = [{ tone: 0, color: 2, hair: 1 }, null, { tone: 2, color: 0, hair: 0 }, { tone: 3, color: 3, hair: 1 }, { tone: 3, color: 0, hair: 2 }, { tone: 0, color: 3, hair: 0, glasses: true }, { tone: 2, color: 2, hair: 1 }, { tone: 1, color: 0, hair: 0 }];
        return { side: d[0], p: d[1], hers: !!d[2], germ: germs[i], doc: docs[i], n: d[2] ? 0 : [3, 0, 5, 2, 4, 6, 1, 7][i] };
      }).sort(function (a, b) { return a.p - b.p; });
      var HER = DOORS.filter(function (d) { return d.hers; })[0];

      // The walls, floor, ceiling and end wall. Floor: checker tiles; walls: a teal wainscot under a chair rail.
      function hallway() {
        var pN = 1.5, pE = G.pE, out = "", tiles = "";
        var floor = [[X(-1, pN), Y(pN)], [X(-1, pE), Y(pE)], [X(1, pE), Y(pE)], [X(1, pN), Y(pN)]];
        var ceil = [[X(-1, pN), CY(pN)], [X(-1, pE), CY(pE)], [X(1, pE), CY(pE)], [X(1, pN), CY(pN)]];
        out += poly(floor, C.cream, 0) + poly(ceil, "#EAE2C2", 0);
        // checker tiles: depth lines evenly spaced in world depth, eight across
        var ps = [], k = 0;
        for (var d = 1 / pN; d < 1 / pE; d += 0.42) ps.push(1 / d);
        ps.push(pE);
        for (k = 0; k + 1 < ps.length; k++) {
          for (var j = 0; j < 8; j++) {
            if ((j + k) % 2) continue;
            var u0 = -1 + j / 4, u1 = u0 + 0.25;
            tiles += '<path d="M' + f1(X(u0, ps[k])) + "," + f1(Y(ps[k])) + " L" + f1(X(u1, ps[k])) + "," + f1(Y(ps[k])) + " L" + f1(X(u1, ps[k + 1])) + "," + f1(Y(ps[k + 1])) + " L" + f1(X(u0, ps[k + 1])) + "," + f1(Y(ps[k + 1])) + ' Z"/>';
          }
        }
        out += '<g fill="url(#' + ID + '-hatch)" opacity="0.32">' + tiles + "</g>";
        var grid = "";
        for (k = 0; k < ps.length; k++) grid += "M" + f1(X(-1, ps[k])) + "," + f1(Y(ps[k])) + " H" + f1(X(1, ps[k])) + " ";
        for (j = 0; j <= 8; j++) { var u = -1 + j / 4; grid += "M" + f1(X(u, pN)) + "," + f1(Y(pN)) + " L" + f1(X(u, pE)) + "," + f1(Y(pE)) + " "; }
        out += '<path d="' + grid + '" stroke="' + INK + '" stroke-width="1.6" opacity="0.4" fill="none"/>';
        // ceiling lights down the middle
        [0.92, 0.6, 0.42, 0.31, 0.24].forEach(function (p) {
          var w = 0.22, dp = 0.35 * p * p * 0.5;
          out += poly([[X(-w, p + dp), CY(p + dp)], [X(w, p + dp), CY(p + dp)], [X(w, p - dp), CY(p - dp)], [X(-w, p - dp), CY(p - dp)]], "#FFF8DC", 2);
        });
        // the side walls: cream above, the teal wainscot below the chair rail (0.36 of the way up a 400-unit wall)
        [-1, 1].forEach(function (s) {
          var top = function (p) { return CY(p); }, rail = function (p) { return Y(p) - 105 * S(p); };
          out += poly([[X(s, pN), top(pN)], [X(s, pE), top(pE)], [X(s, pE), Y(pE)], [X(s, pN), Y(pN)]], "#F7F0D8", 0);
          out += poly([[X(s, pN), rail(pN)], [X(s, pE), rail(pE)], [X(s, pE), Y(pE)], [X(s, pN), Y(pN)]], "#BFD9D3", 0);
          out += '<path d="M' + f1(X(s, pN)) + "," + f1(rail(pN)) + " L" + f1(X(s, pE)) + "," + f1(rail(pE)) + '" stroke="' + INK + '" stroke-width="3"/>' +
            '<path d="M' + f1(X(s, pN)) + "," + f1(rail(pN) - 12) + " L" + f1(X(s, pE)) + "," + f1(rail(pE) - 12 * pE) + '" stroke="' + C.orange + '" stroke-width="1.8"/>';
          // the corner lines
          out += '<path d="M' + f1(X(s, pN)) + "," + f1(Y(pN)) + " L" + f1(X(s, pE)) + "," + f1(Y(pE)) + " M" + f1(X(s, pN)) + "," + f1(CY(pN)) + " L" + f1(X(s, pE)) + "," + f1(CY(pE)) + '" stroke="' + INK + '" stroke-width="4"/>';
        });
        // the end wall, with its double door (the herd runs out through it)
        out += poly([[X(-1, pE), CY(pE)], [X(1, pE), CY(pE)], [X(1, pE), Y(pE)], [X(-1, pE), Y(pE)]], "#F7F0D8", 3) +
          poly([[X(-1, pE), Y(pE) - 105 * S(pE)], [X(1, pE), Y(pE) - 105 * S(pE)], [X(1, pE), Y(pE)], [X(-1, pE), Y(pE)]], "#BFD9D3", 2);
        return out;
      }
      // A door on a side wall, on the floor at depth p: its local x (-64..64, near to far) runs along the wall.
      function wallMatrix(side, p) {
        var dp = 0.4 * p * p, k = dp / 128;
        return "matrix(" + [-side * G.wd * k, -G.fl * k, 0, S(p), X(side, p), Y(p)].map(function (v) { return v.toFixed(4); }).join(",") + ")";
      }
      function doorSvg(d, i) {

        '<g id="' + ID + '-uL">' + hilite + uL + cricket + "</g>" + '<g id="' + ID + '-bL" opacity="0">' + bL + "</g></g>" +
        '<g id="' + ID + '-bEng" opacity="0">' + bEng + "</g>" +
        '<path d="M0,' + (-bh - 2) + ' V2" stroke="' + ink + '" stroke-width="3"/>' +
        [0, 1, 2, 3].map(function (i) { return '<g id="' + ID + "-bk-flip" + i + '" opacity="0">' + rect(0, -bh + 2 + i, pw - 2 - i, bh - 2 - i, WHITE, 'stroke="' + ink + '" stroke-width="2.4"') + squig(16, -bh * 0.6, pw * 0.5) + "</g>"; }).join("") +
        '<g id="' + ID + '-bk-front">' + coverPts(0) + rect(10, -bh + 4, pw - 12, bh - 8, "none", 'stroke="' + C.rust + '" stroke-width="3" rx="3"') +
        KIT.star(pw / 2 + 4, -bh * 0.56, bh * 0.2, C.cream) + KIT.star(pw / 2 + 4, -bh * 0.56, bh * 0.09, C.orange) +
        rect(pw * 0.16, -bh * 0.27, pw * 0.76, fs * 1.15, C.cream, 'stroke="' + ink + '" stroke-width="2.4"') +
        txt(pw / 2 + 4, -bh * 0.27 + fs * 0.85, fs * 0.72, "Oswald", ink, "WISHONIAN DICTIONARY", 'text-anchor="middle" letter-spacing="1"') + "</g>";
      var dust = [-1, 1].map(function (sd) {
        return '<g transform="translate(' + n1(sd * pw * 0.9) + ',0)"><g class="hpb-dust" data-sd="' + sd + '" opacity="0">' +
          [[0, 0, 16], [sd * 18, 4, 11], [-sd * 6, -12, 10]].map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="3"/>'; }).join("") + "</g></g>";
      }).join("");

      // ── The paper at Wishonia's fingers: held by its top-left corner, hanging like a dead mouse; three drawings of
      // its legs (still, and two wriggle poses). ──
      var hang = function (legs, cls) { return '<g class="' + cls + '"' + (cls === "hpb-still" ? "" : ' opacity="0"') + '><g transform="rotate(-152) translate(' + n1(-(25 - 10 * legs)) + ',-47)">' + KIT.money("plain", legs) + "</g></g>"; };
      var bill = '<g transform="translate(' + n1(L.pinch[0]) + "," + n1(L.pinch[1]) + ") scale(" + L.bill + ')"><g id="' + ID + '-bill" opacity="0">' +
        hang(0, "hpb-still") + hang(-0.9, "hpb-wa") + hang(0.9, "hpb-wb") + "</g></g>";
      q("hand").innerHTML = KIT.svg(W, H, '<g transform="translate(' + L.book.x + "," + L.book.y + ')"><g id="' + ID + '-book" opacity="0">' + bookArt + dust + "</g></g>" + bill);

      var mug = '<g transform="translate(' + L.mug[0] + "," + L.mug[1] + ") scale(" + L.mug[2] + ')">' + KIT.mug(0, 0) + "</g>";
      q("front").innerHTML = KIT.svg(W, H, KIT.desk.apply(null, O.desk) + mug);

      // ════════════════ The timeline ════════════════
      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("wish"), { scene: ID, x: O.wish.x, y: O.wish.y, w: O.wish.w });

      // "three": the screen switches on (the switch): a CRT line opens into the board.
      gsap.set(q("crt"), { svgOrigin: HCX + " " + HCY });
      tl.fromTo(q("crt"), { opacity: 0, scaleY: 1 }, { opacity: 1, duration: 0.04 }, tThree);
      tl.to(q("crt"), { scaleY: HH / 6, opacity: 0, duration: 0.22, ease: "power2.out" }, tThree + 0.06);
      tl.set(q("off"), { opacity: 0 }, tThree + 0.1);
      tl.fromTo(q("board"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, tThree + 0.08);
      // "published.": the ticks type in, row by row (the typewriter)
      ROWS.forEach(function (r, i) { KIT.drawTick(tl, q("tick" + i).querySelector(".tick"), tPub + i * 0.14); });
      // "participate.": a little Wishonian hops onto each row (the pops: rows 1 to 3; the fourth is a beat late) and waves
      ROWS.forEach(function (r, i) {
        var el = q("wn" + i), tLand = tPart + i * 0.2, up = 0.34;
        tl.fromTo(el, { x: 70, y: 90 }, { x: 0, duration: up, ease: "none" }, tLand - up);
        tl.fromTo(el, { y: 90 }, { keyframes: [{ y: -38, duration: up * 0.55, ease: "power2.out" }, { y: 0, duration: up * 0.45, ease: "power2.in" }] }, tLand - up);
        gsap.set(el, { svgOrigin: "0 0" });
        tl.fromTo(el, { scaleY: 1, scaleX: 1 }, { scaleY: 0.78, scaleX: 1.15, duration: 0.06, repeat: 1, yoyo: true, ease: "power1.out", immediateRender: false }, tLand);
        var wave = el.querySelector(".wn-wave");
        gsap.set(wave, { svgOrigin: "6 -30" });
        tl.fromTo(wave, { rotation: -10 }, { rotation: 30, duration: 0.22, repeat: 9, yoyo: true, ease: "sine.inOut" }, tLand + 0.1);
      });

      // ── "unapproved": the dictionary pops up at her pointing hand and flips open; the camera pushes in on it. ──
      var book = q("book"), front = q("bk-front"), left = q("bk-left");
      gsap.set([front, left], { svgOrigin: "0 0" });
      gsap.set(book, { svgOrigin: "0 0" });
      tl.fromTo(book, { opacity: 0, y: 60, scale: 0.5 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "back.out(1.8)" }, tUnap);
      tl.fromTo(front, { scaleX: 1 }, { scaleX: 0, duration: 0.12, ease: "power1.in" }, tUnap + 0.22);
      tl.fromTo(left, { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power1.out" }, tUnap + 0.34);
      tl.fromTo(book, { y: 0 }, { y: -6, duration: 0.7, repeat: 6, yoyo: true, ease: "sine.inOut", immediateRender: false }, tUnap + 0.3);
      var cam = q("cam"), org = L.push.at[0] + "px " + L.push.at[1] + "px";
      tl.fromTo(cam, { scale: 1, transformOrigin: org }, { scale: L.push.s, transformOrigin: org, duration: 0.7, ease: "power2.inOut" }, tUnap);
      // her search: the highlighter runs down the entries, past the gap, and comes back to the gap, blinking
      var hi = q("hi");
      tl.fromTo(hi, { opacity: 0, attr: { y: hiY(0) } }, { opacity: 0.55, duration: 0.08 }, tUnap + 0.55);
      tl.to(hi, { keyframes: [{ attr: { y: hiY(1) }, duration: 0.2 }, { attr: { y: hiY(2) }, duration: 0.2 }, { attr: { y: hiY(3) }, duration: 0.2 }, { attr: { y: hiY(4) }, duration: 0.18 }, { attr: { y: hiY(2) }, duration: 0.3, ease: "power2.inOut" }] }, tUnap + 0.65);
      tl.to(hi, { opacity: 0.2, duration: 0.18, repeat: 5, yoyo: true, ease: "none" }, tUnap + 1.75);
      // after "medicine": a cricket in the gap (the crickets), sawing its leg
      var cricket = q("cricket"), saw = cricket.querySelector(".hpb-saw"), chirp = cricket.querySelector(".hpb-chirp");
      tl.fromTo(cricket, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.15, ease: "back.out(2)" }, tCrick - 0.05);
      gsap.set(saw, { svgOrigin: "-4 -4" });
      tl.fromTo(saw, { rotation: -14 }, { rotation: 10, duration: 0.07, repeat: 15, yoyo: true, ease: "none" }, tCrick);

      // ── "bureaucracy": the pages riffle to B; the ding: "see EARTH". ──
      [0, 1, 2, 3].forEach(function (i) {
        var p = q("bk-flip" + i), t = tBur + i * 0.07;
        gsap.set(p, { svgOrigin: "0 0" });
        tl.set(p, { opacity: 1 }, t);
        tl.fromTo(p, { scaleX: 1 }, { scaleX: -1, duration: 0.16, ease: "power1.inOut" }, t);
        tl.set(p, { opacity: 0 }, t + 0.17);
      });
      tl.set([q("uL"), q("uR"), hi], { opacity: 0 }, tBur + 0.1);
      tl.set([q("bL"), q("bEng")], { opacity: 1 }, tBur + 0.32);
      var see = q("see");
      gsap.set(see, { svgOrigin: n1(pw * 0.4) + " " + n1(-bh + fs * 0.9) });
      tl.set(q("bR"), { opacity: 1 }, tDing);
      tl.fromTo(see, { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "power3.in" }, tDing);
      // "sits": the committee member settles onto his bottles like a hen, wings fluffing
      var mem = q("member"), wings = mem.querySelectorAll(".arm-l, .arm-r");
      gsap.set(mem, { svgOrigin: "0 " + n1(mr.hipY) });
      tl.fromTo(mem, { y: 0 }, { keyframes: [{ y: -10, duration: 0.1 }, { y: 4, duration: 0.12, ease: "power2.in" }, { y: 0, duration: 0.1 }] }, tSits);
      tl.fromTo(mem, { rotation: 0 }, { rotation: 4, duration: 0.07, repeat: 5, yoyo: true, ease: "sine.inOut", immediateRender: false }, tSits + 0.1);
      Array.prototype.forEach.call(wings, function (w, i) {
        var sh = mr.shoulder[i];
        gsap.set(w, { svgOrigin: n1(sh[0]) + " " + n1(sh[1]) });
        tl.fromTo(w, { rotation: 0 }, { rotation: i ? -16 : 16, duration: 0.08, repeat: 5, yoyo: true, ease: "sine.inOut" }, tSits);
      });
      qa("#" + ID + "-bEng .hpb-feather").forEach(function (fe, i) {
        gsap.set(fe, { svgOrigin: "0 0" });
        tl.fromTo(fe, { opacity: 0, x: 0, y: 0, rotation: 0 }, { opacity: 1, x: (i ? 10 : -10), y: -16, rotation: i ? 40 : -40, duration: 0.25, ease: "power2.out" }, tSits + 0.1);
        tl.to(fe, { y: 10, x: (i ? 22 : -22), rotation: i ? -20 : 20, opacity: 0, duration: 1.1, ease: "sine.inOut" }, tSits + 0.35);
      });
      // "die.": the patients in line x-ray into grinning skeletons (the zap)
      LINE.forEach(function (o, i) {
        var g = q("pt" + i);
        KIT.xray(tl, g.querySelector(".hpb-alive"), g.querySelector(".hpb-bones"), tDie + i * 0.04);
      });
      // after "die.": the book slams shut (the slam), puffs dust, hops and zips off right; the camera pulls back
      tl.fromTo(left, { scaleX: 1 }, { scaleX: 0, duration: 0.07, ease: "power2.in", immediateRender: false }, tShut - 0.12);
      tl.set(q("bEng"), { opacity: 0 }, tShut - 0.12);
      tl.fromTo(front, { scaleX: 0 }, { scaleX: 1, duration: 0.07, ease: "power2.out", immediateRender: false }, tShut - 0.05);
      tl.fromTo(book, { scaleY: 1 }, { scaleY: 0.82, duration: 0.05, repeat: 1, yoyo: true, ease: "power1.out", immediateRender: false }, tShut);
      qa("#" + ID + "-book .hpb-dust").forEach(function (d) {
        var sd = +d.getAttribute("data-sd");
        gsap.set(d, { svgOrigin: "0 0" });
        tl.fromTo(d, { opacity: 0, scale: 0.3, x: 0 }, { opacity: 1, scale: 1, x: sd * 26, duration: 0.12, ease: "power2.out" }, tShut);
        tl.to(d, { opacity: 0, x: sd * 60, y: -14, duration: 0.22, ease: "power1.in" }, tShut + 0.13);
      });
      tl.to(book, { keyframes: [{ y: -40, duration: 0.14, ease: "power2.out" }, { x: W, y: -260, rotation: 25, duration: 0.3, ease: "power2.in" }] }, tShut + 0.2);
      tl.set(book, { opacity: 0 }, tShut + 0.66);
      tl.to(cam, { scale: 1, transformOrigin: org, duration: 0.7, ease: "power2.inOut" }, tShut + 0.3);

      // ── "decentralized": the header retypes itself (the typewriter). The text is set on every seek (below). ──
      var hdr = q("hdr"), DEL = 0.28, TYPE = 0.85;
      function header(t) {
        if (t < tDec) return OLD;
        if (t < tDec + DEL) return OLD.slice(0, Math.max(0, Math.round(OLD.length * (1 - (t - tDec) / DEL))));
        var n = Math.min(NEW.length, Math.floor(NEW.length * (t - tDec - DEL) / TYPE));
        return NEW.slice(0, n) + (n < NEW.length || Math.floor(t * 3) % 2 === 0 ? "_" : " ");
      }

      // ── "Here's": the screen flips from the board to Earth's paper (the whoosh). ──
      var boardEl = q("board"), earth = q("earth");
      gsap.set([boardEl, earth], { svgOrigin: HCX + " " + HCY });
      tl.to(boardEl, { scaleY: 0, duration: 0.14, ease: "power2.in" }, tHere);
      tl.set(boardEl, { opacity: 0 }, tHere + 0.14);
      tl.fromTo(earth, { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.16, ease: "power2.out" }, tHere + 0.14);
      // the patient looks lost: her question mark pops up and she looks left and right (the two drawings swap)
      var patJ = hq("patj"), patR = patJ.querySelector(".pat-r"), patL = patJ.querySelector(".pat-l"), what = hq("what");
      gsap.set(what, { svgOrigin: "0 0" });
      tl.fromTo(what, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.5)" }, tHere + 0.6);
      tl.fromTo(what, { rotation: -10 }, { rotation: 10, duration: 0.4, repeat: 7, yoyo: true, ease: "sine.inOut", immediateRender: false }, tHere + 0.8);
      [0.9, 1.7, 2.5, 3.3].forEach(function (dt, k) {
        tl.set(patR, { opacity: k % 2 ? 1 : 0 }, tHere + dt);
        tl.set(patL, { opacity: k % 2 ? 0 : 1 }, tHere + dt);
      });

      // ── "small": the paper dangles from Wishonia's fingers; "paper": its legs wriggle (the squeak). ──
      var billEl = q("bill");
      gsap.set(billEl, { svgOrigin: "0 0" });
      tl.fromTo(billEl, { opacity: 0, y: -30, rotation: -20 }, { opacity: 1, y: 0, rotation: 0, duration: 0.25, ease: "back.out(2)" }, tSmall + 0.05);
      tl.to(billEl, { rotation: 7, duration: 0.5, repeat: 1, yoyo: true, ease: "sine.inOut" }, tSmall + 0.3);
      tl.fromTo(billEl, { rotation: 0 }, { rotation: -9, duration: 0.09, repeat: 5, yoyo: true, ease: "sine.inOut", immediateRender: false }, tPaper);
      tl.fromTo(billEl, { rotation: 0 }, { rotation: 6, duration: 0.6, repeat: 3, yoyo: true, ease: "sine.inOut", immediateRender: false }, tPaper + 0.6);
      // the splat startles it
      tl.fromTo(billEl, { y: 0 }, { y: -14, duration: 0.07, repeat: 1, yoyo: true, ease: "power2.out", immediateRender: false }, tSplat);

      // ── "anything.": every head on the screen snaps up to the paper (the whoosh): each doctor swaps to the drawing
      // that looks right and tips its head up, as subsidy-follows-patient's first frame has them; the patient too. ──
      HWY.DOORS.forEach(function (d, i) {
        var g = hq("doc-" + i), up = g.querySelector(".doc-up"), on = g.querySelector(".doc-on"), nk = KIT.rig(HWY.doctorOpts(d)).neck, head = up.querySelector(".head");
        tl.set(up, { opacity: 0 }, 0);
        tl.set(on, { opacity: 1 }, 0);
        tl.set(up, { opacity: 1 }, tAny);
        tl.set(on, { opacity: 0 }, tAny);
        gsap.set(head, { svgOrigin: n1(nk[0]) + " " + n1(nk[1]) });
        tl.fromTo(head, { rotation: 0 }, { rotation: -16, duration: 0.08, ease: "back.out(3)" }, tAny);
      });
      var patHead = patR.querySelector(".head"), nk = HWY.pat.rig.neck;
      gsap.set(patHead, { svgOrigin: n1(nk[0]) + " " + n1(nk[1]) });
      tl.set(patR, { opacity: 1 }, tAny);
      tl.set(patL, { opacity: 0 }, tAny);
      tl.fromTo(patHead, { rotation: 0 }, { rotation: -14, duration: 0.08, ease: "back.out(3)" }, tAny);
      tl.to(what, { opacity: 0, duration: 0.06 }, tAny);
      // the patient and two doctors run at the glass, growing as they come (in hallway units, through the mini)
      RUN.forEach(function (p) {
        var orig = hq(p.key), el = q("rc" + p.run), ps = p.s, head = el.querySelector(".head"), nk = KIT.rig(p.o).neck;
        tl.set(orig, { opacity: 0 }, tAny);
        tl.set(el, { opacity: 1 }, tAny);
        gsap.set(head, { svgOrigin: n1(nk[0]) + " " + n1(nk[1]) });
        tl.fromTo(head, { rotation: 0 }, { rotation: p.d ? -16 : -14, duration: 0.08, ease: "back.out(3)" }, tAny);
        var m = SP.s / (ZI * ps), dx = ((p.glass.x - ZA[0]) / ZI - p.x) / ps, dy = ((p.glass.y - ZA[1]) / ZI - p.y) / ps;
        gsap.set(el, { svgOrigin: "0 0" });
        tl.fromTo(el, { x: 0, y: 0, scale: 1 }, { keyframes: [{ x: -8, y: 4, scale: 0.96, duration: 0.07, ease: "power1.out" }, { x: dx, y: dy, scale: m, duration: 0.23, ease: "power2.in" }] }, tAny + 0.01);
        tl.set(el, { opacity: 0 }, tSplat);
        // the splat (the splat): flattened on the glass, with a fogged ring and bang lines
        var sp = q("sp" + p.run), spi = q("spi" + p.run), r = p.glass.rig;
        gsap.set(spi, { svgOrigin: n1(r.head[0]) + " " + n1(r.head[1]) });
        tl.set(sp, { opacity: 1 }, tSplat);
        tl.fromTo(spi, { scaleX: 1.15, scaleY: 0.9 }, { scaleX: 1.32, scaleY: 0.8, duration: 0.05, ease: "power2.out" }, tSplat);
        tl.fromTo(spi.querySelector(".hpb-bang"), { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in" }, tSplat + 0.05);
        // after "anything.": they slide down the glass (the slide whistle), squeaking in stops, leaving streaks
        var t0 = tSlide + p.run * 0.05, fall = HH + 120;
        tl.to(sp, { keyframes: [{ y: 24, duration: 0.16, ease: "power1.out" }, { y: 30, duration: 0.14, ease: "none" }, { y: 104, duration: 0.24, ease: "power1.in" }, { y: fall, duration: 0.3, ease: "power2.in" }] }, t0);
        tl.fromTo(q("streak" + p.run), { attr: { height: 0 } }, { keyframes: [{ attr: { height: 24 }, duration: 0.16 }, { attr: { height: 30 }, duration: 0.14 }, { attr: { height: 104 }, duration: 0.24 }, { attr: { height: fall }, duration: 0.3 }] }, t0);
        tl.to(q("streak" + p.run), { opacity: 0, duration: 0.3 }, D - 0.4);
        // and drop back into their places in the hallway, heads still turned up to the paper
        tl.set(el, { x: 0, y: -700 / ps, scale: 1, opacity: 1 }, t0 + 0.72);
        tl.to(el, { y: 0, duration: 0.42, ease: "bounce.out" }, t0 + 0.72);
        // landed: the original takes over again (the frame subsidy-follows-patient starts on)
        tl.set(orig, { opacity: 1 }, t0 + 1.16);
        tl.set(el, { opacity: 0 }, t0 + 1.16);
      });

      // ── Every seek: the rolling counters, the LIVE lamp, the header, the patient's blinking light, the paper's legs,
      // the cricket's chirp. ──
      var pcs = ROWS.map(function (r, i) { return q("pc" + i); }), live = q("live");
      var patLights = patJ.querySelectorAll(".chest-light");
      var still = billEl.querySelector(".hpb-still"), wa = billEl.querySelector(".hpb-wa"), wb = billEl.querySelector(".hpb-wb");
      KIT.onTime(tl, D, function (t) {
        ROWS.forEach(function (r, i) {
          var t0 = tTracked + i * 0.15;
          pcs[i].textContent = fmt(t < t0 ? r.n : r.n + r.rate * (t - t0) * (1 + 0.15 * Math.sin(t * 7 + i)));
        });
        live.setAttribute("opacity", Math.floor(t * 2) % 2 ? "0.3" : "1");
        hdr.textContent = header(t);
        // her light blinks red while she is lost, and stays red from "anything." on
        Array.prototype.forEach.call(patLights, function (l) { l.setAttribute("fill", t < tAny && Math.floor(t / 0.35) % 2 ? C.rust : C.war); });
        var w = t >= tPaper ? (Math.floor((t - tPaper) / (t < tPaper + 1 ? 0.06 : 0.12)) % 2 ? 2 : 1) : 0;
        still.setAttribute("opacity", w === 0 ? "1" : "0");
        wa.setAttribute("opacity", w === 1 ? "1" : "0");
        wb.setAttribute("opacity", w === 2 ? "1" : "0");
        chirp.setAttribute("opacity", t >= tCrick && Math.floor((t - tCrick) / 0.16) % 2 === 0 ? "1" : "0");
      });
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
