          leg(x0 + 40, -1) + leg(x1 - 40, 1);
      }
      function lamp(x, fl) {
        if (x === null) return "";
        var top = fl - 500;
        return '<path d="M' + x + "," + fl + " L" + x + "," + top + '" stroke="' + ink + '" stroke-width="6"/>' +
          poly([[x - 22, top - 50], [x + 22, top - 50], [x + 40, top + 20], [x - 40, top + 20]], C.yellow, 4) +
          '<path d="M' + (x - 30) + "," + (top - 10) + " H" + (x + 30) + '" stroke="' + C.orange + '" stroke-width="5"/>';
      }
      function clock(x, y, r) {
        var rays = "";
        for (var k = 0; k < 12; k++) {
          var a = (k * Math.PI) / 6, rr = k % 2 ? r * 1.45 : r * 1.75;
          rays += '<path d="M' + f1(x + r * 0.9 * Math.cos(a)) + "," + f1(y + r * 0.9 * Math.sin(a)) + " L" + f1(x + rr * Math.cos(a)) + "," + f1(y + rr * Math.sin(a)) + '" stroke="' + ink + '" stroke-width="5" stroke-linecap="round"/>' +
            '<circle cx="' + f1(x + rr * Math.cos(a)) + '" cy="' + f1(y + rr * Math.sin(a)) + '" r="' + (k % 2 ? 6 : 8) + '" fill="' + (k % 2 ? C.orange : C.yellow) + '" stroke="' + ink + '" stroke-width="2.4"/>';
        }
        return rays + '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#FBF6E6" stroke="' + ink + '" stroke-width="5"/>' +
          '<path d="M' + x + "," + y + " L" + x + "," + (y - r * 0.62) + " M" + x + "," + y + " L" + f1(x + r * 0.45) + "," + f1(y + r * 0.2) + '" stroke="' + ink + '" stroke-width="5" stroke-linecap="round"/>' +
          '<circle cx="' + x + '" cy="' + y + '" r="5" fill="' + C.war + '"/>';
      }
      // The room, cropped by the paper's inner border.
      function livingRoom() {
        var c = LR.seat, t = LR.tvFloor, r = LR.rug;
        // (9:16: the floor from the TV's floor line down, in boards, so the bottom of the frame is floor, not paper)
        var boards = "";
        if (t) for (var by = t[1] + 46, k = 1; by < H - 44; by += 40 + k * 14, k++) boards += '<path d="M44,' + by + " H" + (W - 44) + '" stroke="' + ink + '" stroke-width="2.5" opacity="0.5"/>';
        var floor = (t ? '<rect x="44" y="' + t[1] + '" width="' + (W - 88) + '" height="' + (H - 44 - t[1]) + '" fill="' + C.tan + '" opacity="0.35"/>' + boards +
          '<path d="M44,' + t[1] + " H" + (W - 44) + '" stroke="' + ink + '" stroke-width="5"/>' : "") +
          (r ? '<ellipse cx="' + r[0] + '" cy="' + r[1] + '" rx="' + r[2] + '" ry="' + r[3] + '" fill="' + C.yellow + '" stroke="' + ink + '" stroke-width="4"/>' +
            '<ellipse cx="' + r[0] + '" cy="' + r[1] + '" rx="' + (r[2] - 26) + '" ry="' + (r[3] - 10) + '" fill="none" stroke="' + C.orange + '" stroke-width="4"/>' : "");
        var pat = at(LR.pat[0], HIPS - LR.pat[1] * KIT.rig(PATO).hipY, LR.pat[1], g("pat", patient(PATO)));
        return '<defs><clipPath id="' + P + 'frame"><rect x="44" y="44" width="' + (W - 88) + '" height="' + (H - 88) + '"/></clipPath></defs><g clip-path="url(#' + P + 'frame)">' +
          clock(LR.clock[0], LR.clock[1], LR.clock[2]) + floor + at(LR.tv[0], LR.tv[1], LR.tv[2], g("tv", tv())) +
          lamp(LR.lamp, LR.floor - 40) + couchBack(c) + pat + couchFront(c) + "</g>";
      }
      // Pose everything that moves continuously, at time T on meadow-ad's clock.
      var AE = {};
      function adBind() {
        var hop = q("ad-hop"), who = function (s) { return hop.querySelectorAll(s); };
        AE = { hop: hop, meadow: q("ad-meadow"), hills: q("ad-hills"), clouds: q("ad-clouds"), crawl: q("ad-crawl"), g1: q("ad-ghost1"), g2: q("ad-ghost2"), streaks: q("ad-streaks"),
          text: q("ad-text"), boneA: q("ad-boneA"), boneB: q("ad-boneB"), legL: who(".leg-l"), legR: who(".leg-r"),
          armL: [q("ad-alive").querySelector(".arm-l"), q("ad-boneA").querySelector(".arm-l")], armR: [q("ad-alive").querySelector(".arm-r"), q("ad-boneA").querySelector(".arm-r"), q("ad-boneB").querySelector(".arm-r")],
          scrub: q("ad-boneB").querySelector(".arm-l"), light: q("pat").querySelector(".chest-light") };
      }
      function rot(el, a, o) { el.setAttribute("transform", "rotate(" + a.toFixed(2) + " " + f1(o[0]) + " " + f1(o[1]) + ")"); }
      function adAt(T) {
        var run = Math.max(0, T - AT.hop0), n = 0, p = 0, y = 0;
        AE.meadow.setAttribute("transform", "translate(" + (-((run * 14) % 40)).toFixed(2) + ",0)");
        AE.hills.setAttribute("transform", "translate(" + (-((run * 4) % 60)).toFixed(2) + ",0)");
        AE.clouds.setAttribute("transform", "translate(" + (-((T * 1.5) % 30)).toFixed(2) + ",0)");
        if (T >= AT.hop0) { var k = run / AD.period; n = Math.floor(k); p = k - n; y = -AD.hop * 4 * p * (1 - p); }
        AE.hop.setAttribute("transform", tr(AD.x, AD.feet - 100 * AD.s + y, AD.s));
        var s = Math.sin(Math.PI * p), lead = n % 2 === 0, sway = T < AT.hop0 ? Math.sin(T * 5) * 5 : 0;
        Array.prototype.forEach.call(AE.legL, function (el) { rot(el, lead ? -34 * s : 16 * s, MR.hip[0]); });
        Array.prototype.forEach.call(AE.legR, function (el) { rot(el, lead ? 16 * s : -34 * s, MR.hip[1]); });
        AE.armL.forEach(function (el) { rot(el, (lead ? 22 : -22) * s, MR.shoulder[0]); });
        AE.armR.forEach(function (el) { rot(el, -8 * s + sway, MR.shoulder[1]); });
        // the elbow scratch: from "dry" to just after "skin.", the free hand scrubs the raised elbow
        var scratching = T >= AT.dry && T < AT.skinEnd + 0.3;
        AE.boneA.setAttribute("opacity", scratching ? 0 : 1);
        AE.boneB.setAttribute("opacity", scratching ? 1 : 0);
        rot(AE.scrub, scratching ? 5 * Math.sin((T - AT.dry) * Math.PI * 2 * 7) : 0, MR.shoulder[0]);
        // the crawl, its blur, and the chest light blinking red
        AE.crawl.setAttribute("transform", "translate(" + (SCR.x1 - crawl.dist(T)).toFixed(2) + ",0)");
        var b = Math.min(1, Math.max(0, (crawl.speed(T) - 40) / 150));
        AE.g1.setAttribute("opacity", (0.4 * b).toFixed(3));
        AE.g2.setAttribute("opacity", (0.22 * b).toFixed(3));
        AE.text.setAttribute("opacity", (1 - 0.45 * b).toFixed(3));
        AE.streaks.setAttribute("opacity", (0.7 * b).toFixed(3));
        AE.light.setAttribute("fill", T % 0.9 < 0.5 ? C.war : "#E9E1CC");
      }
      // The rabbit ears at rest, splayed (their pivot set once), and the patient's head and eyes: looking at the TV
      // (LOOK), or turned to the camera (FACING) after "skin.". Pass a time to put that pose there.
      var PR = KIT.rig(PATO), NECK = PR.neck.map(f1).join(" ");
      var LOOK = { head: -5 * PR.facing, eyes: 1.6 }, FACING = { head: 2 * PR.facing, eyes: -1.6 };
      function earsAt(tl) {
        var ears = [q("tv").querySelector(".tv-antenna-l"), q("tv").querySelector(".tv-antenna-r")];
        gsap.set(ears, { svgOrigin: "0 -156" });
        tl.fromTo(ears[0], { rotation: LR.splay[0] }, { rotation: LR.splay[0], duration: 0.01 }, 0);
        tl.fromTo(ears[1], { rotation: LR.splay[1] }, { rotation: LR.splay[1], duration: 0.01 }, 0);
        return ears;
      }
      function patientPose(tl, pose) {
        var pat = q("pat"), head = pat.querySelector(".head"), pupils = pat.querySelectorAll(".pupil");
        gsap.set(head, { svgOrigin: NECK });
        tl.fromTo(head, { rotation: pose.head }, { rotation: pose.head, duration: 0.01 }, 0);
        tl.fromTo(pupils, { x: pose.eyes }, { x: pose.eyes, duration: 0.01 }, 0);
        return { head: head, pupils: pupils, eyes: pat.querySelectorAll(".eye") };
      }
      // ═══ end of the shared block ═══

      q("bg").innerHTML = KIT.paper(ID);
      q("grain").innerHTML = KIT.svg(W, H, KIT.grain(ID));
      q("art").innerHTML = KIT.svg(W, H, KIT.paperDefs(ID) + livingRoom());
      adBind();

      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "slide left");
      KIT.onTime(tl, D, adAt);

      // "smiling": a sparkle pings off her teeth.
      gsap.set(q("sparkle"), { svgOrigin: "0 0" });
      tl.fromTo(q("sparkle"), { scale: 0, rotation: 0 }, { scale: 1.2, rotation: 45, duration: 0.18, ease: "back.out(3)" }, AT.smile + 0.1);
      tl.to(q("sparkle"), { scale: 0, rotation: 90, duration: 0.2, ease: "power2.in" }, AT.smile + 0.45);
      // "voiceover": the crawl band rises into the bottom of the screen.
      tl.fromTo(q("ad-band"), { y: 13 }, { y: 0, duration: 0.25, ease: "power2.out" }, AT.voice);
      // "auctioneer": the rabbit ears wiggle while the crawl blurs.
      var ears = earsAt(tl);
      tl.fromTo(ears[0], { rotation: LR.splay[0] }, { rotation: LR.splay[0] - 16, duration: 0.09, repeat: 23, yoyo: true, ease: "sine.inOut" }, AT.auct);
      tl.fromTo(ears[1], { rotation: LR.splay[1] }, { rotation: LR.splay[1] + 14, duration: 0.11, repeat: 19, yoyo: true, ease: "sine.inOut" }, AT.auct + 0.04);
      tl.to(q("tv"), { y: -1.5, duration: 0.05, repeat: 9, yoyo: true, ease: "none" }, AT.auct);
      // after "stroke.": nothing; a cricket on the TV chirps.
      tl.fromTo(q("chirp"), { opacity: 0 }, { opacity: 1, duration: 0.08, repeat: 15, yoyo: true, ease: "none" }, KIT.after(ID, "stroke"));
      // "death,": she x-rays into a skeleton mid-skip and keeps skipping.
      KIT.xray(tl, q("ad-alive"), q("ad-bones"), AT.death);
      // "mild": the rash pops out in three bursts.
      var rash = [1, 2, 3].map(function (i) { return q("ad-hop").querySelectorAll(".rash-" + i); });
      rash.forEach(function (els, i) {
        tl.fromTo(els, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.12, ease: "back.out(3)" }, cue("mild") + i * 0.1);
      });
      // The patient watches and blinks now and then; after "skin." she turns her head slowly to the camera.
      var pp = patientPose(tl, LOOK);
      [AT.auct - 1.2, cue("listed") + 0.3].forEach(function (t) {
        tl.to(pp.eyes, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06, repeat: 1, yoyo: true, ease: "power1.inOut" }, t);
      });
      var turn = KIT.after(ID, "skin") - 0.25;
      tl.to(pp.head, { rotation: FACING.head, duration: 0.75, ease: "sine.inOut" }, turn);
      tl.to(pp.pupils, { x: FACING.eyes, duration: 0.6, ease: "sine.inOut" }, turn + 0.1);
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
