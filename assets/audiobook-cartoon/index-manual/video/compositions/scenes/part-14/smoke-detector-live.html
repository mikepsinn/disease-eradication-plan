<template id="smoke-detector-live-template">
  <!-- smoke-detector-live · Layer B (storyboards/part-14-decentralized-fda.md): the patient's kitchen. The charred smoke
       detector from Part 12 still holds up its singed "RE: SMOKE" letter and starts writing another; its mailbox flag
       pops up on "mail?". On "automatically" a live detector slams onto it and flattens it into a pancake, leaving only
       the flag sticking out, which droops; the letter flutters to the floor. On "real" its screen blinks on and readings
       scroll. The patient holds up her SAFE bottle; a side panel flips out and lights "HEADACHES 12%" and "SEVERE 3%";
       she reads it with the cap on, rubs her temple, nods and sets it down. The lawyer rushes in with $ eyes and an
       "INJURED?" sign, finds nobody, opens his briefcase (a moth), and slinks off. The FDA's own bottle pops up and its
       panel flips out blank; she flips a coin over it, and it lands on its edge on the FDA bottle's cap. -->

  <script>
    (function () {
      var ID = "smoke-detector-live";
      var sc = KIT.scene(ID);

      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V;
      var P = ID + "-", INK = C.line, WHITE = "#FBF6E6", CARD = "#FBF5E4", CHAR = "#3A302A";

      // counter: [x0, x1] (its top is where her hand sets the bottle down, with the arm pointing adn degrees);

      // right edge of its blank panel (bottle units); BS: the bottles' size; toaster: its x on the counter (16:9).
      var L = V

      // ── The kitchen (shared with outcome-label) ───────────────────────────

            poly([[w[0] + w[2] + 6, w[1] - 8], [w[0] + w[2] * 0.7, w[1] - 8], [w[0] + w[2] * 0.8, w[1] + w[3] * 0.62], [w[0] + w[2] + 6, w[1] + w[3] * 0.72]], C.orange, 4) +
            '<rect x="' + (w[0] - 16) + '" y="' + (w[1] - 16) + '" width="' + (w[2] + 32) + '" height="12" fill="' + C.rust + '" stroke="' + INK + '" stroke-width="4"/>';
        }

        for (x = x0; x < x1; x += ts) out += '<path d="M' + x + "," + (top - sh) + " V" + top + '" stroke="' + INK + '" stroke-width="1.6" opacity="0.5"/>';
        for (y = top - sh; y < top; y += ts) out += '<path d="M' + x0 + "," + y + " H" + x1 + '" stroke="' + INK + '" stroke-width="1.6" opacity="0.5"/>';

        for (x = x0; x < x1 - ts; x += ts) for (y = top - sh; y < top - ts + 1; y += ts) if (tr() < 0.12) out += '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="' + (ts - 4) + '" height="' + (ts - 4) + '" fill="' + C.orange + '" opacity="0.8"/>';

      // ── The patient (the same woman in every Part 14 scene) ───────────────

        var r = KIT.rig(o), n = r.neck, f = r.facing, x = n[0], y = n[1] + 1, cid = P + "scarf" + ++uid;

        var t1 = [[x + 3 * f, y + 3], [x + 9 * f, y + 2], [x + 15 * f, y + 19], [x + 9 * f, y + 21]];
        var t2 = [[x + 2 * f, y + 4], [x + 7 * f, y + 5], [x + 6 * f, y + 25], [x + 0 * f, y + 23]];

          poly([[x + 1 * f, y + 1], [x + 7 * f, y], [x + 8 * f, y + 6], [x + 2 * f, y + 7]], C.yellow, 2) + "</g>";
      }
      // A person with a second left arm drawing (class alt-b, hidden) to swap to: both arm-l drawings in one figure.
      function twoLeftArms(o, armsB) {

        var x0 = 36, y0 = -82, y1 = -22;

      function briefcase(open) {

        return open

            poly(body, "#6B4A2F", 2.6) + '<path d="M-18,12 H18" stroke="' + INK + '" stroke-width="1.6"/>'

      // ── The two smoke detectors ──────────────────────────────────────────

      var eyes = [-18, 18].map(function (x) {
        return '<g class="od-eye"><ellipse cx="' + x + '" cy="-12" rx="10" ry="12" fill="#FFF" stroke="' + INK + '" stroke-width="2.4"/><circle class="od-pupil" cx="' + (x + 2) + '" cy="-11" r="4.2" fill="' + INK + '"/></g>';
      }).join("");
      function singed(w, h) {
        var e = [], r = KIT.rng(7), i;

        e.push([w / 2, h / 2 - 6]);
        for (i = 10; i >= 0; i--) e.push([-w / 2 + (w * i) / 10, h / 2 - (i % 2 ? 5 : 0) - r() * 3]);

      }
      var letter = poly(singed(96, 60), "#E9DFC2", 2.6) + '<path d="M-46,-28 L0,4 L46,-28" fill="none" stroke="' + INK + '" stroke-width="2"/>' +

      var clip = poly([[72, -8], [118, -8], [118, 54], [72, 54]], "#B98A55", 2.4) + '<rect x="77" y="-2" width="36" height="52" fill="' + CARD + '"/>' +
        '<path d="M82,8 H107 M82,18 H107 M82,28 H100" stroke="' + INK + '" stroke-width="1.6" opacity="0.35"/>' +
        g("od-scrib", '<path d="M81,9 l3,-3 l3,3 l3,-3 l3,3 l3,-3 l3,3 l3,-3 l3,3 M81,19 l3,-3 l3,3 l3,-3 l3,3 l3,-3 l3,3 l3,-3 M81,29 l3,-3 l3,3 l3,-3 l3,3 l3,-3" fill="none" stroke="' + INK + '" stroke-width="1.8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>');
      var smoke = [-14, 4, 20].map(function (dx, i) { return '<path class="od-smoke" d="M' + dx + "," + (-66 - i * 3) + ' l-7,-10 l7,-10 l-7,-10" fill="none" stroke="#8C8782" stroke-width="4" stroke-linecap="round"/>'; }).join("");
      var oldDet = g("od-sq",
        '<path d="M-48,-30 L-74,-58 L-100,-62" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle r="60" fill="' + CHAR + '" stroke="' + INK + '" stroke-width="5"/><circle r="40" fill="none" stroke="#241C17" stroke-width="3"/>' +
        '<path d="M-14,30 H14 M-10,40 H10" stroke="#241C17" stroke-width="3"/>' + '<path d="M18,-50 Q40,-44 50,-20" fill="none" stroke="#5B4C40" stroke-width="4"/>' +
        eyes + '<path d="M-10,12 Q0,8 10,12" fill="none" stroke="#FFF" stroke-width="2.4"/>' + clip +
        '<path d="M50,20 L66,32" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>' +

        g("od-smoke", smoke));
      // flattened: a crinkled charred pancake under the new detector's rim, its two eyes still blinking
      var pk = [], pr = KIT.rng(12);
      for (var pi = 0; pi <= 16; pi++) pk.push([-116 + pi * 14.5, 84 - pr() * 5 - (pi > 3 && pi < 13 ? 0 : 0)]);
      for (pi = 16; pi >= 0; pi--) pk.push([-116 + pi * 14.5, 104 + pr() * 6]);
      var pancake = poly(pk, CHAR, 4) + [-30, 30].map(function (x) { return '<g class="pk-eye"><ellipse cx="' + x + '" cy="95" rx="9" ry="6" fill="#FFF" stroke="' + INK + '" stroke-width="2"/><circle cx="' + (x + 1) + '" cy="96" r="3" fill="' + INK + '"/></g>'; }).join("");
      // the mailbox flag: a post and a little flag, pivot (0,0); rotation 0 = up (raised), 150 = lowered
      var flag = '<path d="M0,0 V-40" stroke="' + INK + '" stroke-width="5" stroke-linecap="round"/>' + poly([[0, -40], [22, -40], [22, -26], [0, -26]], "#6E2C20", 2.6) + '<circle r="4" fill="' + CHAR + '" stroke="' + INK + '" stroke-width="2"/>';

      // The live one: cream, an orange ring, a slate screen with scrolling readings and a red LIVE lamp. r 88.
      var wave = "", wx;
      for (wx = -70; wx < 760; wx += 60) wave += " L" + (wx + 14) + ",6 L" + (wx + 20) + ",-14 L" + (wx + 26) + ",14 L" + (wx + 31) + ",2 L" + (wx + 60) + ",2";
      var bars = "";
