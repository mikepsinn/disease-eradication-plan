<template id="smoke-detector-live-template">
  <!-- smoke-detector-live · collage (Part 14, scene 12). The bit: today's alarm reports a fire by post; the new one is a
       live screen wired to everyone taking the pill. A kitchen counter with a VIOXX bottle on it; flames lick up the
       wall while Part 12's smoke detector slowly posts a letter: RE: FIRE. "Your new system": a TV with a live screen slams
       down on top of it and flattens it; only the letter sticks out, and droops. A zap runs from each person
       taking the pill to the screen as their side effects happen, and the bars fill: 12% HEADACHES, 3% SEVERE. The
       patient reads it BEFORE she takes the pill, rubs her head and nods. "not after the class action lawsuit": the
       lawyer bursts in with INJURED?; nobody is, and his sign wilts. He swallows a pill out of spite and gets zapped. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #E2CFA5; }
  </style>
  <div id="root" data-composition-id="smoke-detector-live" data-width="1920" data-height="1080" data-start="0" data-duration="19.26">
    <div id="smoke-detector-live-weave"></div>
    <div id="smoke-detector-live-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    var ID = "smoke-detector-live", V = KIT.V, G = 980, Z = KIT.collage.SIZES, cue = function (w, n) { return KIT.cue(ID, w, n); };
    var hs = function (art, h) { return h / Z[art][1]; };
    // Left to right: the counter with the Vioxx, the old alarm (where the TV lands), the people taking the pill.
    var CX = 380, AX = 960, TK = 1.75;
    var TL = AX - Z["tv-set"][0] * TK / 2, TT = G - Z["tv-set"][1] * TK;
    var SCR = [TL + 15 * TK, TT + 150 * TK, TL + 215 * TK, TT + 325 * TK];       // the screen, in canvas px
    var cy = function (s) { return V ? G - 420 / s : 540; };
    var views = V ? { left: [760, cy(0.74), 0.74], room: [1250, cy(0.62), 0.62] } : { left: [960, 540, 1], room: [1200, 540, 1] };
    var cast = {};
    cast.flame1 = { art: "flames", x: CX + 160, y: G - 330, anchor: "bottom", pivot: "bottom", scale: 0.75, hidden: true };
    cast.flame2 = { art: "flames", x: CX + 290, y: G - 250, anchor: "bottom", pivot: "bottom", scale: 0.95, hidden: true };
    cast.table = { art: "side-table", x: CX, y: G, anchor: "bottom", scale: 1.6 };
    cast.vioxx = { art: "pill-bottle", x: CX - 40, y: G - 300, anchor: "bottom", pivot: "bottom", scale: 0.75,
      label: [{ text: "VIOXX", at: [78, 285], width: 120, size: 60 }, { text: "MERCK", at: [78, 325], width: 90, size: 36 }] };
    // the old alarm on the wall, posting its letter
    // Part 12's smoke detector, with its little mailbox; the letter comes out of the mailbox (art 380, 120)
    var DK = 1.3, DL = AX - Z["smoke-detector"][0] * DK / 2, DT = G - Z["smoke-detector"][1] * DK;
    cast.letter = { art: "pdf", x: DL + 380 * DK, y: DT + 120 * DK, scale: 0.55, pivot: "left", hidden: true, label: { text: "RE: FIRE", at: [106, 210], width: 170, size: 46 } };
    cast.alarm = { art: "smoke-detector", x: AX, y: G, anchor: "bottom", scale: DK, pivot: "bottom" };
    cast.tv = { art: "tv-set", x: AX, y: G, anchor: "bottom", pivot: "bottom", scale: TK, hidden: true };
    // the live screen's two bars (the rank bars, cut to length: 12% and 3% of a screen that reads to 14%)
    var BW = SCR[2] - SCR[0] - 50, BK = BW / Z["rank-bar-red"][0];
    var bar = function (pct, y) { var w = Z["rank-bar-red"][0] * pct / 14; return { art: "rank-bar-red", x: SCR[0] + 30, y: y, anchor: [0, 18], scale: BK * 1.6, hidden: true, clip: [[0, 0], [w / 1.6, 0], [w / 1.6, 36], [0, 36]] }; };
    cast.bar1 = bar(12, TT + 212 * TK);
    cast.bar2 = bar(3, TT + 292 * TK);
    // the people taking the pill, and the patient who reads first
    var PP = [["sick-5", 1500], ["sick-3", 1700], ["sick-2", 1900]];
    PP.forEach(function (p, i) { cast["p" + i] = { art: p[0], x: p[1], y: G, anchor: "bottom", pivot: "bottom", scale: hs(p[0], 470) }; });
    cast.pat = { art: "sick-6", x: 1330, y: G, anchor: "bottom", pivot: "bottom", scale: hs("sick-6", 500), hidden: true };
    cast.law = { art: "lawyer", x: 1700, y: G, anchor: "bottom", pivot: "bottom", scale: hs("lawyer", 520), faces: "left", hidden: true };

    var LET = cue("mail?");
    var beats = [
      // Vioxx; the fire; the alarm writes a letter about it
      { on: "Vioxx", do: "hop", who: "vioxx", height: 30 },
      { on: "smoke", offset: -0.4, do: "pop", who: ["flame1", "flame2"], squash: true, swell: 0.4 },
      { on: "smoke", do: "shiver", who: ["flame1", "flame2"], dur: 3.0, amp: 4, rot: 5 },
      { on: "detector", do: "show", who: "letter" },
      { on: "detector", do: "move", who: "letter", by: [120, -60], turn: -8, dur: LET - cue("detector") + 0.3, ease: "smooth" },
      { on: "mail?", offset: 0.3, do: "nudge", who: "alarm", by: [0, -10] },
      // the live screen slams down over it; the letter's corner droops
      { on: "Your", do: "camera", view: "room", dur: 0.6 },
      { on: "automatically", offset: -0.25, do: "stamp", who: "tv", from: 2.0, shake: 18 },
      { on: "automatically", offset: -0.1, do: "flatten", who: "alarm" },
      { on: "automatically", offset: -0.1, do: "hide", who: ["flame1", "flame2"] },
      { on: "automatically", offset: 0.5, do: "move", who: "letter", by: [20, 120], turn: 70, dur: 0.5, ease: "smooth" },
      // every side effect, from every person, straight to the screen
      { on: "every", do: "sparks", who: ["p0", "tv"], until: "side" },
      { on: "effect", do: "sparks", who: ["p2", "tv"], until: "automatically" },
      { on: "real", do: "sparks", who: ["p1", "tv"], until: "time." },
      { on: "every", do: "shiver", who: "p0", dur: 0.4, amp: 4, rot: 3 },
      { on: "effect", do: "shiver", who: "p2", dur: 0.4, amp: 4, rot: 3 },
      { on: "real", do: "shiver", who: "p1", dur: 0.4, amp: 4, rot: 3 },
      // the numbers, live
      { on: "\"twelve", do: "counter", id: "head", who: "tv", spot: [112, 182], from: 0, to: 12, dur: 0.7, prefix: "HEADACHES ", suffix: "%", size: 34, card: false, font: "oswald" },
      { on: "\"twelve", offset: 0.05, do: "pop", who: "bar1", squash: true },
      { on: "three", do: "counter", id: "sev", who: "tv", spot: [112, 262], from: 0, to: 3, dur: 0.4, prefix: "SEVERE ", suffix: "%", size: 34, card: false, font: "oswald" },
      { on: "three", offset: 0.05, do: "pop", who: "bar2", squash: true },
      // she reads it before she takes it
      { on: "You'll", offset: -0.3, do: "slideIn", who: "pat", from: "bottom", dist: 900, over: 20 },
      { on: "headaches,", do: "nudge", who: "pat", by: [0, -12] },
      { on: "BEFORE", do: "hop", who: "pat", height: 26 },
      { on: "pill,", do: "hop", who: "pat", height: 16 },
      // the lawyer: INJURED? Nobody is.
      { on: "not", do: "slideIn", who: "law", from: "right", over: 40, tilt: -4 },
      { on: "not", offset: 0.1, do: "tag", id: "injured", who: "law", text: "INJURED?", x: 1700, y: G - 640, w: 360, h: 150, knot: [60, 30], swing: 6 },
      { on: "lawsuit.", offset: -0.2, do: "move", who: "injured", by: [-30, 130], turn: -60, dur: 0.45, ease: "smooth" },
      { on: "lawsuit.", offset: 0.45, do: "sparks", who: ["law", "tv"], until: 19.2 },
      { on: "lawsuit.", offset: 0.45, do: "shiver", who: "law", dur: 0.6, amp: 7, rot: 5 },
    ];
    KIT.collage({ id: ID, seed: 1410, plate: V ? [-1200, -1400, 3400, 2600] : [-300, -300, 2600, 1500], views: views, view: "left", cast: cast, beats: beats });
  </script>
</template>
