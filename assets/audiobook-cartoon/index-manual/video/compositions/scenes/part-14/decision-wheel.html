<template id="decision-wheel-template">

       TREATMENT RANKINGS. A doctor's office: the patient waits on the exam table in a paper gown, scarf on, chest
       light blinking red; "Currently," → the doctor (head mirror, stethoscope) steps up to a carnival prize wheel
       whose four slices are dark. "drug rep" → the lobbyist tiptoes in behind him; "donuts" → slice 1 lights,
       DONUTS (2003), and he slips a box of donuts under the doctor's arm and tiptoes out. "half-remember" → slice 2,
       HALF-REMEMBERED LECTURE; a thought bubble over the scratching doctor shows a chalkboard, FIRST, DO NO HARM;
       "medical" → an eraser wipes HARM. "insurance" → slice 3, WHAT INSURANCE ALLOWS; the fat cat rises in the
       window, winds up and thumps DENIED onto the patient's chart on "company" (she jumps). "vibes." → slice 4,

  <script>
    (function () {

            pat: [140, 2.5], doc: [320, 427, 420, 2.8], wheel: [780, 880, 250, 25], lob: 2.5, bubble: [410, 425, 255, 148] }
        : { F: 865, banner: [540, 56, 840, 128, 62], win: [270, 230, 290, 250], cat: [350, 425, 2.0], table: [90, 600, 640], chart: [445, 0.8],

      var INK = C.line, WHITE = "#FBF6E6", GOWN = "#DDE9E6", PINK = "#E9B4C1", UNLIT = "#DCD3B6";

      var LOB_IN = KIT.castOpts("lobbyist", { arms: [[62, 100], [58, 96]] }), LOB_OUT = KIT.castOpts("lobbyist", { look: "left" });

      // Oswald SemiBold widths in em (title.js measured them), for fitting text.

      var OADV = [0.25, 0.538, 0.574, 0.553, 0.573, 0.438, 0.425, 0.572, 0.6, 0.29, 0.339, 0.552, 0.433, 0.695, 0.554, 0.576, 0.552, 0.576, 0.583, 0.505, 0.438, 0.578, 0.522, 0.704, 0.508, 0.49, 0.43,
        0.543, 0.384, 0.506, 0.506, 0.515, 0.502, 0.531, 0.428, 0.516, 0.53, 0.982, 0.486, 0.232, 0.227, 0.261, 0.27, 0.161, 0.247, 0.483, 0.578, 0.32, 0.329, 0.314];
      function ow(s, size, track) { var w = 0; for (var i = 0; i < s.length; i++) { var k = OCH.indexOf(s[i]); w += k < 0 ? 0.55 : OADV[k]; } return (w + (track || 0) * s.length) * size; }
      function f1(v) { return (+v).toFixed(1); }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
      function tr(x, y, s) { return 'transform="translate(' + f1(x) + "," + f1(y) + ")" + (s ? " scale(" + s + ")" : "") + '"'; }
      function rectD(x, y, w, h) { return "M" + f1(x) + "," + f1(y) + " h" + f1(w) + " v" + f1(h) + " h" + f1(-w) + " Z"; }
      function shape(d, fill, sw, extra) { return '<path d="' + d + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw || 4) + '" stroke-linejoin="miter"' + (extra || "") + "/>"; }
      function txt(x, y, s, size, fill, extra) { return '<text x="' + f1(x) + '" y="' + f1(y) + '" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="' + f1(size) + '" fill="' + fill + '"' + (extra || "") + ">" + s + "</text>"; }
      // A donut in person units around (0,0), 22 across: pink frosting and sprinkles.
      function donut() {
        var sp = [[-5, -4, 30, C.cream], [3, -6, -20, C.yellow], [6, 1, 60, C.cream], [-6, 3, -50, C.yellow], [1, 6, 10, C.peri], [-1, -7, 80, C.peri]].map(function (s) {
          return '<rect x="-1.8" y="-0.7" width="3.6" height="1.4" fill="' + s[3] + '" transform="translate(' + s[0] + "," + s[1] + ") rotate(" + s[2] + ')"/>';
        }).join("");
        return '<path d="M-11,0 a11,10 0 1 0 22,0 a11,10 0 1 0 -22,0 Z M-3.6,0 a3.6,3.2 0 1 1 7.2,0 a3.6,3.2 0 1 1 -7.2,0 Z" fill="' + C.tan + '" fill-rule="evenodd" stroke="' + INK + '" stroke-width="2"/>' +
          '<path d="M-9.4,-1 Q-10,-8 -3,-8.8 Q3,-10 8,-6 Q11,-2 9,2 Q7,5 9,7 Q4,8 1,6 Q-2,9 -6,6 Q-10,4 -9.4,-1 Z M-3.6,0 a3.6,3.2 0 1 1 7.2,0 a3.6,3.2 0 1 1 -7.2,0 Z" fill="' + PINK + '" fill-rule="evenodd" stroke="' + INK + '" stroke-width="1.4"/>' + sp;
      }
      // The donut box in person units around (0,0), 34 x 24: a striped lid and DONUTS on the front.
      function donutBox() {
        var stripes = [-12, -6, 0, 6, 12].map(function (x) { return '<path d="M' + x + ',-11 l-3,7" stroke="' + C.cream + '" stroke-width="2.2"/>'; }).join("");
        return shape(rectD(-17, -12, 34, 24), C.cream, 2.4) + '<path d="M-17,-12 h34 v8 h-34 Z" fill="' + C.orange + '"/>' + stripes + shape(rectD(-17, -12, 34, 24), "none", 2.4) +
          '<path d="M-17,-4 H17" stroke="' + INK + '" stroke-width="1.8"/>' + txt(0, 7.5, "DONUTS", 8.5, INK, ' letter-spacing="0.6"');
      }
      function officeArt(pid, st) {
        st = st || {};
        var id = function (s) { return pid + "-" + s; };
        var F = OL.F, lit = !st.unlit;
        // The patient: the gown over her dress, the striped scarf at her neck. extra: options for KIT.person; holdR:
        // something in her right hand.
        function patient(name, extra, holdR) {
          var o = mix(PAT, extra), r = KIT.rig(o), T = r.shoulder[0][1] - 3, hy = r.hipY, nx = r.neck[0];
          var gd = "M-15," + (T + 1) + " L-6," + (T - 2) + " L6," + (T - 2) + " L15," + (T + 1) + " L26," + (hy + 24) + " L-26," + (hy + 24) + " Z";
          var gown = shape(gd, GOWN, 3) + '<path d="M2,' + (T - 2) + " L6," + (T - 2) + " L15," + (T + 1) + " L26," + (hy + 24) + " L2," + (hy + 24) + ' Z" fill="url(#' + id("fine") + ')" opacity="0.22"/>' +
            '<path d="M-20,' + (hy + 6) + ' l6,3 M-21,' + (hy + 13) + ' l6,3" stroke="' + INK + '" stroke-width="1.4" opacity="0.7"/>';
          var scarf = shape("M" + (nx - 9) + "," + (T - 6) + " L" + (nx + 9) + "," + (T - 8) + " L" + (nx + 10) + "," + T + " L" + (nx - 9) + "," + (T + 1) + " Z", C.yellow, 2.2) +
            '<path d="M' + (nx - 5) + "," + (T - 6.5) + " l-1,7 M" + nx + "," + (T - 7) + " l-1,7.5 M" + (nx + 5) + "," + (T - 7.5) + ' l-1,7.5" stroke="' + C.orange + '" stroke-width="2.4"/>' +
            shape("M" + (nx + 3) + "," + (T - 1) + " L" + (nx + 9) + "," + (T - 2) + " L" + (nx + 13) + "," + (T + 17) + " L" + (nx + 6) + "," + (T + 18) + " Z", C.yellow, 2.2) +
            '<path d="M' + (nx + 4.3) + "," + (T + 5) + " l6.5,-1.2 M" + (nx + 5.5) + "," + (T + 11) + ' l6.7,-1.2" stroke="' + C.orange + '" stroke-width="2.6"/>' +
            '<path d="M' + (nx + 7) + "," + (T + 18) + " v3 M" + (nx + 9.5) + "," + (T + 17.7) + " v3 M" + (nx + 12) + "," + (T + 17.4) + ' v3" stroke="' + INK + '" stroke-width="1.4" stroke-linecap="round"/>';

        }
        // The doctor: head mirror and stethoscope; box "L" (facing right) or "R" (facing left) tucks the donut box at
        // that hip; items: [[hand 0|1, svg, dx, dy]] held in a hand.
        function doctor(name, extra, box, items) {
          var o = mix(DOC, extra), r = KIT.rig(o), T = r.shoulder[0][1] - 3;
          var steth = '<path d="M-8,' + (T - 3) + " Q-12," + (T + 12) + " -2," + (T + 20) + " M8," + (T - 3) + " Q12," + (T + 12) + " 2," + (T + 20) + " M-2," + (T + 20) + " Q0," + (T + 22) + " 2," + (T + 20) +
            " M0," + (T + 21) + " Q1," + (T + 28) + " 5," + (T + 30) + '" fill="none" stroke="' + INK + '" stroke-width="2.4" stroke-linecap="round"/>' +

          return '<g data-d="' + name + '"' + (name === (st.doc || "box") ? "" : ' opacity="0"') + ">" + out + held + "</g>";
        }
        var pad = shape(rectD(-7, -10, 14, 18), WHITE, 1.8) + txt(-2, -3, "Rx", 5.5, INK) + '<path d="M-4,1 h8 M-4,4 h6" stroke="' + INK + '" stroke-width="1"/>';

        // The floor and the wall's baseboard.
        var floor = '<path d="M46,' + F + " H" + (W - 46) + '" stroke="' + INK + '" stroke-width="5"/><path d="M46,' + (F - 12) + " H" + (W - 46) + '" stroke="' + C.orange + '" stroke-width="2"/>';

        // The window: outside (slate blue sky, a cloud), the fat cat behind it (clipped to the opening), the frame, the

        var Wn = OL.win, wx = Wn[0], wy = Wn[1], ww = Wn[2], wh = Wn[3], fr = 16, sash = wh * 0.2;
        var outside = '<rect x="' + wx + '" y="' + wy + '" width="' + ww + '" height="' + wh + '" fill="' + C.peri + '"/>' +

        var Ct = OL.cat, cs = Ct[2], cr = KIT.rig(CAT), catBody = KIT.person(CAT);

        var catA = catClip + '<g clip-path="url(#' + id("cat-clip") + ')"><g ' + tr(Ct[0], Ct[1], cs) + '><g id="' + id("cat-a") + '" opacity="0">' + catBody + "</g></g></g>";
        var frame = '<path d="' + rectD(wx - fr, wy - fr, ww + 2 * fr, wh + 2 * fr) + " " + rectD(wx, wy, ww, wh) + '" fill="' + C.tan + '" fill-rule="evenodd" stroke="' + INK + '" stroke-width="4"/>' +
          '<rect x="' + wx + '" y="' + wy + '" width="' + ww + '" height="' + f1(sash) + '" fill="#FFFFFF" opacity="0.28"/>' +
          '<path d="M' + f1(wx + ww / 2) + "," + wy + " v" + f1(sash) + '" stroke="' + C.tan + '" stroke-width="9"/><path d="M' + f1(wx + ww / 2) + "," + wy + " v" + f1(sash) + '" stroke="' + INK + '" stroke-width="2" opacity="0.5"/>' +
          '<path d="M' + (wx + 14) + "," + (wy + 12) + " l30,30 M" + (wx + 30) + "," + (wy + 12) + ' l18,18" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>' +

        var catB = "<g " + tr(Ct[0], Ct[1], cs) + '><g id="' + id("cat-b") + '" opacity="0">' + catBody + "</g></g>";

        // The prize wheel on its stand, in wheel units around its hub: the stand (legs to the floor, the post up to

        var Wh = OL.wheel, R = Wh[2], fs = Wh[3], down = F - Wh[1];
        var pt = function (a, rr) { var t = (a * Math.PI) / 180; return f1(rr * Math.sin(t)) + "," + f1(-rr * Math.cos(t)); };
        var leg = function (k) { return shape("M" + k * 6 + ",0 L" + k * (0.62 * R + 10) + "," + down + " L" + k * (0.62 * R - 10) + "," + down + " L" + -k * 6 + ",0 Z", C.tan, 4); };
        var stand = leg(-1) + leg(1) + shape(rectD(-0.4 * R, down * 0.62 - 6, 0.8 * R, 12), C.tan, 3) + shape(rectD(-9, -(R + 52), 18, R + 52), C.tan, 4) +

        var wheel = "<g " + tr(Wh[0], Wh[1]) + '><g id="' + id("wheel-sq") + '">' + stand + '<circle r="' + (R + 20) + '" fill="' + C.navy + '" stroke="' + INK + '" stroke-width="4"/>' +
          '<g id="' + id("wheel-rot") + '">' + slices + pegs + labels + bulbs + hub + "</g>" + pointer + speed + "</g></g>";

        var Tb = OL.table, x0 = Tb[0], x1 = Tb[1], tt = Tb[2];
        var base = shape(rectD(x0 + 26, tt + 24, x1 - x0 - 52, F - tt - 24), C.tan, 4) + '<rect x="' + f1(x0 + 26 + (x1 - x0 - 52) * 0.6) + '" y="' + (tt + 24) + '" width="' + f1((x1 - x0 - 52) * 0.4) + '" height="' + (F - tt - 24) + '" fill="url(#' + id("fine") + ')" opacity="0.22"/>' +
