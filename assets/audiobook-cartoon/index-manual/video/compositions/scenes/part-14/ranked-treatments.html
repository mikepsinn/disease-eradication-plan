        txt(0, -sr * 0.62, "DONUTS", Wh[3] * 0.62, INK) + txt(0, -sr * 0.62 + Wh[3] * 0.7, "(2003)", Wh[3] * 0.62, INK);
      var sliceStart = [BL.x + 30, F - sr * 0.75], sliceEnd = V ? [310, F - 0.14 * sr - 2] : [760, F - 0.14 * sr - 2];
      var loose = "<g " + tr(sliceStart[0], sliceStart[1]) + '><g id="' + ID + '-slice" opacity="0"><g transform="translate(0,' + f1(sr * 0.4) + ')">' + slice + "</g></g></g>";
      var dust = [-1, 1].map(function (k, i) {
        return "<g " + tr(k < 0 ? BL.x : BL.x + BL.w, F - 14) + '><g id="' + ID + "-dust-" + i + '" opacity="0">' +
          [[0, 0, 26], [k * 30, -10, 20], [k * 52, 2, 16]].map(function (c) { return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + c[2] + '" fill="' + C.cream + '" stroke="' + INK + '" stroke-width="3"/>'; }).join("") + "</g></g>";
      }).join("");
      // her dropped donut: where her hand holds it in the "donut" drawing
      var Pt = OL.pat, ps = Pt[1], pr = KIT.rig(mix(PAT, { arms: [[20, 10], [48, -163]] })), py0 = OL.table[2] - 3 - KIT.rig(PAT).hipY * ps;
      var dn = [Pt[0] + (pr.hand[1][0] + 2) * ps, py0 + (pr.hand[1][1] - 5) * ps];
      var dropDonut = "<g " + tr(dn[0], dn[1], ps) + '><g id="' + ID + '-donut" opacity="0">' + donut() + "</g></g>";
      var spark = '<g id="' + ID + '-spark" opacity="0">' + KIT.star(0, 0, 26, C.yellow) + KIT.star(0, 0, 13, "#FFFFFF") + "</g>";
      var sparkAt = [BL.x + 14 + BL.t.row.px + 30, board.rows[0] + BL.t.row.py - 100 * BL.t.row.bs];
      q("art").innerHTML = KIT.svg(W, H, art.svg + pancake + loose + '<g id="' + ID + '-board"><g id="' + ID + '-board-sq">' + board.svg + "</g></g>" + dust + dropDonut +
        "<g " + tr(sparkAt[0], sparkAt[1]) + ">" + spark + "</g>");
      art.fix();
      var g = function (s) { return document.getElementById(ID + "-" + s); };
      var draw = function (who, name) { return g(who + "-j").querySelector('[data-d="' + name + '"]'); };
      var swap = function (a, b, t) { tl.set(a, { opacity: 0 }, t); tl.set(b, { opacity: 1 }, t); };

      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "zoom into the wall screen", KIT.OFFICE.screen);

      var T = { rank: cue("rank"), happened: cue("happened"), humans: cue("humans"), it: cue("it:") };
      // The board falls (accelerating) and lands on the word (the slam); its bottom edge crushes the wheel on the way.
      var fall0 = T.rank - 0.3, L = BL.y + BL.h + 60;
      var fallAt = function (t) { var p = Math.max(0, Math.min(1, (t - fall0) / (T.rank - fall0))); return -L + L * p * p; };
      var wheelTop = Wh[1] - Wh[2] - 62, Bn = OL.banner, knock = fall0 + (T.rank - fall0) * Math.sqrt(Math.max(0, (Bn[1] + 20 - BL.y - BL.h + L) / L));
      var boardEl = g("board"), sq = g("wheel-sq");
      gsap.set(g("board-sq"), { svgOrigin: f1(BL.x + BL.w / 2) + " " + (BL.y + BL.h) });

      // the banner is swatted off its nails and drops away, spinning
      gsap.set(g("banner"), { svgOrigin: Bn[0] + " " + (Bn[1] + Bn[3] / 2) });
      tl.to(g("banner"), { rotation: 28, duration: 0.12, ease: "power2.out" }, knock);
      tl.to(g("banner"), { y: H, rotation: 75, duration: 0.6, ease: "power2.in" }, knock + 0.12);

      // the impact: the wheel is a pancake, the board squashes and settles, the room shakes, dust puffs out (the
      // splat), and the DONUTS slice skids away across the floor, spinning, and falls flat.
      tl.set(g("pancake"), { opacity: 1 }, T.rank);
      tl.fromTo(g("board-sq"), { scaleY: 1 }, { scaleY: 0.94, duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.rank);
      tl.fromTo(q("cam"), { y: 0 }, { y: 10, duration: 0.04, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, T.rank);
      [0, 1].forEach(function (i) {
        var d = g("dust-" + i);
        gsap.set(d, { svgOrigin: "0 0" });
        tl.set(d, { opacity: 1 }, T.rank + 0.12);
        tl.fromTo(d, { scale: 0.4, x: 0 }, { scale: 1.5, x: (i ? 1 : -1) * 40, duration: 0.45, ease: "power2.out", immediateRender: false }, T.rank + 0.12);
        tl.to(d, { opacity: 0, duration: 0.25 }, T.rank + 0.4);
      });
      var sl = g("slice"), slide = 1.0;
      tl.set(sl, { opacity: 1 }, T.rank + 0.05);
      tl.fromTo(sl, { x: 0 }, { x: sliceEnd[0] - sliceStart[0], duration: slide, ease: "power2.out" }, T.rank + 0.05);
      gsap.set(sl, { svgOrigin: "0 0" });
      tl.fromTo(sl, { rotation: 0 }, { rotation: -720, duration: slide, ease: "power2.out" }, T.rank + 0.05);
      tl.fromTo(sl, { y: 0 }, { y: -36, duration: 0.14, yoyo: true, repeat: 3, ease: "power1.out" }, T.rank + 0.05);
      tl.to(sl, { y: sliceEnd[1] - sliceStart[1], scaleY: 0.35, duration: 0.12, ease: "power2.in" }, T.rank + 0.05 + slide);
      // the doctor spins round at the slam and jumps; he jumps again as the slice whizzes past his feet
      var dL = draw("doc", "boxL"), dR = draw("doc", "box");
      swap(dL, dR, T.rank + 0.04);
      tl.fromTo(g("doc-j"), { y: 0 }, { y: -26, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.rank + 0.04);
      tl.to(g("doc-j"), { y: -18, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, T.rank + 0.45);
      // the patient flinches at the slam
      tl.fromTo(g("pat-j"), { y: 0 }, { y: -10, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.rank + 0.04);

      // The flaps clack (the typewriter): the header settles left to right, then each row's TREATMENT letters as the
      // bottles shuffle into order (from C, A, B to A, B, C).
      var nTiles = board.tiles, nHead = BL.t.head.join("").replace(/ /g, "").length, perRow = "TREATMENTA".length;
      var settle = [];
      for (var i = 0; i < nTiles; i++) {
        if (i < nHead) settle.push(T.rank + 0.15 + (i / nHead) * 0.4);
        else { var rr = Math.floor((i - nHead) / perRow), cc = (i - nHead) % perRow; settle.push(T.rank + 0.75 + rr * 0.22 + cc * 0.03); }
      }
      var tileEls = [], CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      for (var j = 0; j < nTiles; j++) tileEls.push(g("tile-" + j));
      var rh = board.rows[1], shuf = T.rank + 0.75;
      // scrambled slots: C in row 1, A in row 2, B in row 3
      var from = { A: rh, B: rh, C: -2 * rh };
      ["A", "B", "C"].forEach(function (k, r) {
        var mv = g("bottle-" + k + "-mv");
        tl.fromTo(mv, { y: from[k], x: 0 }, { y: 0, duration: 0.42, ease: "back.inOut(1.4)" }, shuf + r * 0.08);
        tl.to(mv, { x: k === "C" ? 44 : -10, duration: 0.21, yoyo: true, repeat: 1, ease: "sine.out" }, shuf + r * 0.08);
      });

      // "happened": row by row (the ticks), the tiny humans pop up and the GOT BETTER bar fills.
      for (var r = 0; r < 3; r++) {
        var tr0 = T.happened + r * 0.15;
        for (var k = 0; k < 6; k++) {
          var tn = g("tiny-" + r + "-" + k);
          gsap.set(tn, { svgOrigin: "0 100" });
          tl.fromTo(tn, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2.4)" }, tr0 + k * 0.025);
        }
        var bar = g("bar-" + r);
        tl.fromTo(bar, { attr: { width: 0 } }, { attr: { width: +bar.getAttribute("data-w") }, duration: 0.4, ease: "power2.out" }, tr0);
      }
      // "humans": they hop, the grinning skeletons too
      for (var r2 = 0; r2 < 3; r2++) for (var k2 = 0; k2 < 6; k2++) {
        tl.to(g("tiny-" + r2 + "-" + k2), { y: -16, duration: 0.12, yoyo: true, repeat: 3, ease: "power1.out" }, T.humans + (k2 % 2) * 0.06 + r2 * 0.04);
      }

      // "it:": the patient drops the donut (it bounces and rolls off), looks up and points at row 1 (the ding); row 1
      // lights up teal and its bottle twinkles.
      var pDonut = draw("pat", "donut"), pPoint = draw("pat", "point");
      swap(pDonut, pPoint, T.it);
      var dd = g("donut"), fallY = (F - 10 - dn[1]) / ps;
      gsap.set(dd, { svgOrigin: "0 0" });
      tl.set(dd, { opacity: 1 }, T.it);
      tl.fromTo(dd, { y: 0 }, { y: fallY, duration: 0.3, ease: "power2.in" }, T.it);
      tl.to(dd, { y: fallY - 14, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.out" }, T.it + 0.3);
      tl.fromTo(dd, { x: 0, rotation: 0 }, { x: -40, rotation: -200, duration: 0.6, ease: "power1.out" }, T.it + 0.05);
      tl.fromTo(g("hi"), { opacity: 0 }, { opacity: 1, duration: 0.08, repeat: 3, yoyo: true }, T.it);
      tl.set(g("hi"), { opacity: 1 }, T.it + 0.33);
      var sp = g("spark");
      gsap.set(sp, { svgOrigin: "0 0" });
      tl.fromTo(sp, { opacity: 0, scale: 0, rotation: 0 }, { opacity: 1, scale: 1, rotation: 90, duration: 0.25, ease: "back.out(2)" }, T.it + 0.05);
      tl.to(sp, { scale: 0.6, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, T.it + 0.3);

      var lights = document.querySelectorAll("#" + ID + "-pat-j .chest-light"), lastBlink = -1, lastKey = -1;
      KIT.onTime(tl, D, function (t) {
        var y = fallAt(t), bottom = BL.y + BL.h + y;
        boardEl.setAttribute("transform", "translate(0," + f1(y) + ")");
        // the wheel squashes under the board's bottom edge, and is gone (a pancake) from the slam on
        var k = bottom <= wheelTop ? 1 : Math.max(0.03, (F - bottom) / (F - wheelTop));
        sq.setAttribute("opacity", t >= T.rank ? "0" : "1");
        sq.setAttribute("transform", "translate(0," + f1((F - Wh[1]) * (1 - k)) + ") scale(1," + k.toFixed(3) + ")");
        // the flaps: random letters until each one settles
        var key = Math.floor(t * 22);
        if (key !== lastKey) {
          lastKey = key;
          tileEls.forEach(function (el, i) { el.textContent = t >= settle[i] ? el.getAttribute("data-ch") : CH[(i * 13 + key * 7) % CH.length]; });
        }
        var bl = Math.floor(t / 0.45) % 2;
        if (bl !== lastBlink) { lastBlink = bl; Array.prototype.forEach.call(lights, function (l) { l.setAttribute("fill", bl ? "#7A2A1C" : C.war); }); }
      });
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
