      }
      var dotsSvg = L.dots.map(function (y, r) {
        var s = sAt(y), step = 70 * s, n = Math.floor((L.span[1] - L.span[0]) / step), off = (r % 2) * step * 0.5, g = "";
        for (var i = 0; i < n; i++) {
          var x = L.span[0] + step * (i + 0.5) + off + (rnd() - 0.5) * step * 0.4;
          g += '<g transform="translate(' + x.toFixed(1) + "," + (y - 100 * s).toFixed(1) + ") scale(" + s.toFixed(3) + ')">' + dot(i + r * 7, s) + "</g>";
        }
        return '<g class="dotrow" data-y="' + y + '">' + g + "</g>";
      });

      // back to front: the board (and its key), the far rows, the near rows, the four in front
      var crowd = '<g id="' + ID + '-dots">' + dotsSvg.slice().reverse().join("") + "</g>" + board + '<g id="' + ID + '-crowd">' + rowsSvg.slice().reverse().map(function (r, i) { return '<g class="row" data-y="' + r.y + '">' + r.svg + "</g>"; }).join("") + "</g>";
      q("art").innerHTML = KIT.svg(W, H, KIT.paperDefs(ID) + crowd + front.join(""));

      // ══ Time ═══════════════════════════════════════════════════════════════════════════
      var tl = gsap.timeline({ paused: true });
      KIT.mountWishonia(tl, q("pip"), KIT.cornerOpts(ID));
      KIT.enter(tl, q("cam"), "slide left");
      var T = { prevent: cue("prevent"), ten: cue("ten"), billion: cue("billion"), deaths: cue("deaths."), indiv: cue("individual"), plans: cue("plans"), tue: cue("Tuesday."), after: KIT.after(ID, "Tuesday.") };
      function pivot(el, o) { gsap.set(el, { svgOrigin: o }); }
      function clamp(x) { return Math.max(0, Math.min(1, x)); }

      // "prevent": the key turns; "ten": the wheels roll up (ticks) and land on 10.7 on "billion" (ding).
      var bow = q("keybow");
      pivot(bow, "0 -44");
      var turns = Math.round((T.billion - T.prevent) / 0.2);
      tl.to(bow, { scaleX: -1, duration: 0.1, ease: "sine.inOut" }, T.prevent);
      tl.fromTo(bow, { scaleX: -1 }, { scaleX: 1, duration: 0.2, repeat: turns - 2, yoyo: true, ease: "sine.inOut", immediateRender: false }, T.prevent + 0.1);
      tl.to(bow, { scaleX: 1, duration: 0.1 }, T.prevent + 0.1 + 0.2 * (turns - 1));
      [0, 1, 2].forEach(function (i) {
        var st = q("strip" + i);
        tl.to(st, { y: -CELL[i] * WL.h - WL.h * 0.1, duration: T.billion - T.ten, ease: "power1.inOut" }, T.ten);
        tl.to(st, { y: -CELL[i] * WL.h, duration: 0.2, ease: "back.out(3)" }, T.billion);
      });
      tl.fromTo(q("board"), { y: 0 }, { y: 5, duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.billion);
      // "deaths.": HOLD. Nothing moves until "individual".

      // "individual": the board cracks four times (the live board swaps for its pieces); out of each crack steps one
      // of the four (pops) and hops down to the front; then the pieces fall away behind the crowd.
      var CR = [0, 1, 2, 3].map(function (k) { return T.indiv + k * 0.15; });
      tl.set(q("board"), { opacity: 0 }, CR[0]);
      var pieceEls = q("pieces").querySelectorAll(".piece");
      Array.prototype.forEach.call(pieceEls, function (p, j) {
        tl.set(p, { opacity: 1 }, CR[0]);
        CR.forEach(function (t, k) {
          var off = 0;
          for (var kk = 0; kk <= k; kk++) off += j <= kk ? -10 : 10;
          tl.to(p, { x: off, duration: 0.06, ease: "power2.out" }, t);
        });
        var cx = j === 0 ? (BD[0] + L.cracks[0]) / 2 : j === 4 ? (L.cracks[3] + BD[0] + BD[2]) / 2 : (L.cracks[j - 1] + L.cracks[j]) / 2;
        pivot(p, cx + " " + (BD[1] + BD[3] / 2));
        tl.to(p, { y: 6 + (j % 2) * 8, rotation: (j % 2 ? 1 : -1) * (2 + j % 3), duration: 0.35, ease: "back.out(2)" }, T.indiv + 0.62 + j * 0.03);
      });
      q("cracks").querySelectorAll(".crack").forEach(function (c, k) {
        tl.fromTo(c, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.07, ease: "none", immediateRender: false }, CR[k]);
      });
      // the crowd fills in, row after row, out to the horizon
      var rowEls = q("crowd").querySelectorAll(".row"), dotEls = q("dots").querySelectorAll(".dotrow");
      Array.prototype.forEach.call(rowEls, function (row) {
        var y = +row.getAttribute("data-y"), ri = L.rows.indexOf(y), t0 = T.indiv + 0.55 + ri * 0.12;
        row.querySelectorAll(".pop").forEach(function (p, i) {
          pivot(p, "0 100");
          tl.fromTo(p, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t0 + (i % 5) * 0.03);
        });
      });
      Array.prototype.forEach.call(dotEls, function (row) {
        var y = +row.getAttribute("data-y"), di = L.dots.indexOf(y);
        pivot(row, (W / 2) + " " + y);
        tl.fromTo(row, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" }, T.indiv + 1.0 + di * 0.06);
      });
      // the four: each pops out of its crack, small, and hops down to its place at the front
      var fg = L.front.map(function (f, i) { return q("f" + i); }), fj = L.front.map(function (f, i) { return q("f" + i + "-j"); });
      var crackMid = BD[1] + BD[3] * 0.5, HOP = 0.5;
      // which crack each of the four comes out of: the nearest one, left to right
      var order = L.front.map(function (f, i) { return i; }).sort(function (a, b) { return L.front[a].x - L.front[b].x; });
      KIT.onTime(tl, D, function (t) {
        L.front.forEach(function (f, i) {
          var k = order.indexOf(i), t0 = CR[k], p = (t - t0) / HOP, x, y, s;
          if (p < 0) { fg[i].setAttribute("opacity", "0"); return; }
          fg[i].setAttribute("opacity", "1");
          var e = clamp(p), ee = 1 - (1 - e) * (1 - e);
          x = L.cracks[k] + (f.x - L.cracks[k]) * ee;
          s = f.s * (0.3 + 0.7 * ee);
          var feet = crackMid + 100 * f.s * 0.3 + (f.y - crackMid - 100 * f.s * 0.3) * e - Math.sin(Math.PI * e) * (V ? 160 : 120);
          y = feet - 100 * s;
          fg[i].setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ") scale(" + s.toFixed(4) + ")");
        });
      });
      fj.forEach(function (j) { pivot(j, "0 100"); });
      L.front.forEach(function (f, i) {
        tl.fromTo(fj[i], { scaleY: 1 }, { scaleY: 0.86, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, CR[order.indexOf(i)] + HOP);
      });

      // "plans": a note lands on every calendar (pat).
      var art = q("art");
      art.querySelectorAll(".note").forEach(function (n) {
        var g = n.closest(".row"), d = g ? 0.04 + L.rows.indexOf(+g.getAttribute("data-y")) * 0.04 : 0;
        pivot(n, "0 0");
        tl.fromTo(n, { opacity: 0, scale: 1.8, rotation: -14 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.12, ease: "power3.in", immediateRender: false }, T.plans + d);
      });
      Array.prototype.forEach.call(dotEls, function (row) { tl.set(row.querySelectorAll(".dn"), { opacity: 1 }, T.plans + 0.12 + L.dots.indexOf(+row.getAttribute("data-y")) * 0.015); });
      // "Tuesday.": a teal tick on every note (sparkle) and everyone beams; the dentist looks up at his note.
      art.querySelectorAll(".tickg .tick").forEach(function (tk, i) {
        var g = tk.closest(".row"), d = g ? 0.05 + (i % 7) * 0.02 : 0;
        KIT.drawTick(tl, tk, T.tue + d);
      });
      art.querySelectorAll(".row .m-b").forEach(function (b, i) {
        var a = b.parentNode.querySelector(".m-a"), t = T.tue + 0.1 + (i % 6) * 0.03;
        tl.set(a, { opacity: 0 }, t); tl.set(b, { opacity: 1 }, t);
      });
      var di = L.front.map(function (f) { return f.who; }).indexOf("dentist");
      L.front.forEach(function (f, i) {
        var va = fg[i].querySelector(".v-a"), vb = fg[i].querySelector(".v-b");
        tl.set(va, { opacity: 0 }, T.tue + 0.12);
        tl.set(vb, { opacity: 1 }, T.tue + 0.12);
        if (i !== di) tl.fromTo(fj[i], { y: 0 }, { y: -14, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.tue + 0.12 + i * 0.04);
      });
      var dHead = fg[di].querySelector(".v-b .head");
      pivot(dHead, KIT.rig(mix(DENTIST, { arms: UP })).neck.join(" "));
      tl.to(dHead, { rotation: -14, duration: 0.3, ease: "power2.out" }, T.tue + 0.3);
      // after "Tuesday.": the dentist reads his note and groans (huff): he sags, the calendar droops, a puff of breath.
      var dent = fg[di], dvc = dent.querySelector(".v-c"), dvb = dent.querySelector(".v-b"), groan = dent.querySelector(".groan");
      tl.set(dvb, { opacity: 0 }, T.after);
      tl.set(dvc, { opacity: 1 }, T.after);
      tl.to(fj[di], { scaleY: 0.92, duration: 0.18, ease: "power2.out" }, T.after);
      pivot(groan, "0 0");
      tl.fromTo(groan, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, x: 10, y: -8, duration: 0.22, ease: "power2.out", immediateRender: false }, T.after);

      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
