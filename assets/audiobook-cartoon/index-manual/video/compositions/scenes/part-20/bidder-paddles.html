<template id="bidder-paddles-template">
  <!-- bidder-paddles · collage (Part 20, scene 4; plate auction-hall, no seam). It starts on democracy-auction's last
       frame: that file's hall() is copied below (keep the two the same) and drawn in its end state (hall(ID, true)).
       The bit: the bids as towers of money on the hall floor. "one hundred and ninety-eight million": the factory,
       behind its headstone, stacks one year of war-money bundles, $198 MILLION A YEAR, and a ribbon of its bills walks
       into the Politician's belly. "one billion dollars": YOU's tower of cross-sealed bundles rises beside it, $1
       BILLION, ONCE, five times as tall. "five times their annual spend": the factory stacks year on year to match it;
       on "spend." the stack topples onto the factory, which pops up out of the money, and the lot is SOLD. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #E2CFA5; }
  </style>
  <div id="root" data-composition-id="bidder-paddles" data-width="1920" data-height="1080" data-start="0" data-duration="11.98">
    <div id="bidder-paddles-weave"></div>
    <div id="bidder-paddles-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    // ── hall(ID, E): the auction-hall plate. E false: this scene's beats. E true: its end state at time 0 (for
    //    bidder-paddles, which copies this function). Returns { cast, beats, views, P }. ──
    function hall(ID, E) {
      var V = KIT.V, SZ = KIT.collage.SIZES, G = 1000;
      // Left to right on the floor G (plate px): the two money towers (bidder-paddles), the factory, the block and the
      // Politician, the rostrum and the Lobbyist under the clock, three bidders, YOU, the Reaper.
      var X = { tyou: -430, tfac: -80, fac: 400, block: 960, pod: 1480, c1: 1820, c2: 2010, c3: 2200, you: 2430, reaper: 2660 };
      var FK = 1.3, BK = 1.4, PK = 1.5, YH = 660;
      var FTOP = G - SZ["factory-pay"][1] * FK;
      var STAND = G - SZ["prize-stand"][1] * BK + 45 * BK;            // the cushion's top
      var PW = SZ["politician-red"][0], PH = SZ["politician-red"][1], PTOP = STAND - PH * PK;
      var pp = function (ax, ay) { return [X.block - PW * PK / 2 + ax * PK, PTOP + ay * PK]; };   // a point on the Politician
      var BELLY = pp(128, 222), NOSE = pp(143, 50), RHAND = [X.fac - 484 * FK / 2 + 420 * FK, FTOP + 210 * FK];
      var YK = YH / SZ.you[1], UK = YH / SZ["you-slap"][1];
      var UHAND = [X.you - SZ["you-slap"][0] * UK / 2 + 60 * UK, G - YH + 30 * UK];
      var cy = function (s) { return V ? G - 420 / s : 560; };
      var views = V ? {
        block: [690, cy(0.95), 0.95], wide: [1650, cy(0.58), 0.58], fac: [560, cy(0.9), 0.9], clock: [1480, 520, 1.1], towers: [-150, cy(0.62), 0.62],
      } : {
        block: [700, 560, 1], wide: [1200, 330, 0.62], fac: [600, 470, 1.0], clock: [1480, 330, 1.25], towers: [-100, 250, 0.66],
      };
      var T = function (w, n, off) { return E ? -2 : KIT.cue(ID, w, n) + (off || 0); };
      var cast = {}, beats = [];
      var add = function (b) { beats.push(b); };

      // The set, back to front.
      cast.sign = { art: "sign-board", x: X.fac, y: FTOP + 90, anchor: "bottom", pivot: "bottom", scale: 1.25, hidden: !E,
        label: [{ text: "NOT THE", at: [107, 52], width: 170, size: 40 }, { text: "ENEMY", at: [107, 96], width: 170, size: 46 }] };
      cast.clock = { art: "wall-clock", x: X.pod, y: 230, pivot: "bottom", scale: 0.62 };
      cast.lob = { art: "lobbyist", x: X.pod - 10, y: G - 10, anchor: "bottom", pivot: "bottom", scale: 1.25 };
      cast.pod = { art: "podium", x: X.pod, y: G, anchor: "bottom", scale: 1.1 };
      cast.fac = { art: "factory-pay", x: X.fac, y: G, anchor: "bottom", pivot: "bottom", scale: FK, hidden: E };
      cast.facK = { art: "factory-kiss", x: X.fac + 40, y: G, anchor: "bottom", pivot: "bottom", scale: FK, hidden: !E };
      cast.stone = { art: "headstone", x: X.fac + 20, y: G + 12, anchor: "bottom", pivot: "bottom", scale: 0.95, hidden: !E,
        label: { text: "R.I.P.", at: [179, 170], width: 230, size: 64 } };
      cast.puff = { art: "cloud-puff", x: X.fac + 150, y: FTOP + 300, scale: 0.55, hidden: true };
      cast.stand = { art: "prize-stand", x: X.block, y: G, anchor: "bottom", scale: BK };
      cast.pol = { art: "politician-red", x: X.block, y: STAND, anchor: "bottom", pivot: "bottom", scale: PK,
        pieces: {
          legs: { clip: [[0, 234], [PW, 234], [PW, PH], [0, PH]] },
          top: { clip: [[0, 0], [PW, 0], [PW, 240], [0, 240]], pivot: [132, 238] },
        } };
      cast.bill = { art: "bill-war", x: RHAND[0], y: RHAND[1], scale: 0.42, hidden: true };
      cast.vote = { art: "ballot", x: RHAND[0], y: RHAND[1] + 30, scale: 0.28, hidden: true, label: { text: "VOTE", at: [118, 160], width: 170, size: 60 } };
      cast.missile = { art: "missile", x: BELLY[0], y: BELLY[1] + 40, scale: 0.42, hidden: true };
      var cit = [["citizen-1", X.c1], ["citizen-4", X.c2], ["citizen-7", X.c3]];
      cit.forEach(function (c, i) { cast["c" + i] = { art: c[0], x: c[1], y: G, anchor: "bottom", pivot: "bottom", scale: 560 / SZ[c[0]][1] }; });
      cast.you = { art: "you", x: X.you, y: G, anchor: "bottom", pivot: "bottom", scale: YK, hidden: E };
      cast.youUp = { art: "you-slap", x: X.you, y: G, anchor: "bottom", pivot: "bottom", scale: UK, hidden: !E };
      cast.reaper = { art: "reaper-stop", x: X.reaper, y: G, anchor: "bottom", pivot: "bottom", scale: 0.9 };
      // The pointing hand on its telescoping handle, mirrored to point left (the img is flipped after the build).
      var HK = 0.8, TIPOFF = [(231 - 12) * HK, (161 - 55) * HK], CUFF = [(442 - 12) * HK, (100 - 55) * HK];
      cast.hand = { art: "greed-hand", x: UHAND[0] + TIPOFF[0], y: UHAND[1] + TIPOFF[1], scale: HK, faces: "left", hidden: true };

      if (!E) {
        // He starts slumped on the block, still flying the empty tags from the host shot.
        add({ at: 0, do: "hinge", who: "pol.top", angle: -30, frames: 1 });
        var tg = V ? [X.block, -170, -10] : [X.block + 380, 470, 620];
        add({ at: 0, do: "tag", id: "t1", who: "pol", text: "PAPERS: EMPTY", knot: [128, 222], x: tg[0], y: tg[1], w: 440, h: 130, swing: 4 });
        add({ at: 0, do: "tag", id: "t2", who: "pol", text: "VOTES: EMPTY", knot: [138, 234], x: tg[0], y: tg[2], w: 440, h: 130, swing: 4 });
        // "weapons manufacturers": the factory walks up with its hands full
        add({ on: "weapons", do: "slideIn", who: "fac", from: "left", dist: 1100, over: 18 });
        // "provide both.": a war bill into his belly, then a VOTE; he springs upright, grin on full
        add({ on: "provide", offset: -0.2, do: "show", who: "bill" });
        add({ on: "provide", offset: -0.2, do: "move", who: "bill", to: BELLY, dur: 0.22, arc: 40 });
        add({ on: "provide", offset: 0.02, do: "hide", who: "bill" });
        add({ on: "provide", offset: 0.12, do: "show", who: "vote" });
        add({ on: "provide", offset: 0.12, do: "move", who: "vote", to: BELLY, dur: 0.18, arc: 40 });
        add({ on: "provide", offset: 0.3, do: "hide", who: "vote" });
        add({ on: "both.", do: "hide", who: ["t1", "t2"] });
        add({ on: "both.", do: "hinge", who: "pol.top", angle: 30, frames: 1 });
        add({ on: "both.", do: "hop", who: "pol", height: 60 });
        add({ on: "both.", offset: 0.25, do: "bob", who: "pol", y: 4, r: 1, speed: 2, until: "Not" });
        // the vending thunk: a missile drops out of him into the factory's arms
        add({ on: "both.", offset: 0.68, do: "pop", who: "missile" });
        add({ on: "both.", offset: 0.75, do: "move", who: "missile", to: [X.fac + 150, FTOP + 380], scale: 1.6, dur: 0.22, arc: 80, turn: -12 });
        add({ on: "both.", offset: 0.97, do: "hide", who: ["missile", "fac"] });
        add({ on: "both.", offset: 0.97, do: "show", who: "facK" });
        add({ on: "both.", offset: 1.0, do: "hop", who: "facK", height: 20 });
        // "You're going to outbid them.": YOU's hand goes up at the back, and every head in the hall hops round
        add({ on: "You're", do: "camera", view: "wide", dur: 0.6 });
        add({ on: "outbid", do: "hide", who: "you" });
        add({ on: "outbid", do: "show", who: "youUp" });
        add({ on: "outbid", do: "hop", who: "youUp", height: 24 });
        ["c0", "c1", "c2", "reaper", "lob", "pol", "facK"].forEach(function (n, i) { add({ on: "outbid", offset: 0.15 + 0.05 * i, do: "hop", who: n, height: 26 }); });
        // "Not because they're the enemy": the sign goes up over the factory
        add({ on: "Not", do: "camera", view: "fac", dur: 0.5 });
        add({ on: "enemy", do: "pop", who: "sign", squash: true });
        add({ on: "enemy", offset: 0.15, do: "nudge", who: "facK", by: [0, -14] });
        // "(they die of the same diseases you do)": a cough, the whole hall coughs, and the headstone slams down
        add({ on: "die", do: "shiver", who: "facK", dur: 0.5, amp: 9, rot: 4 });
        add({ on: "die", do: "pop", who: "puff", squash: true });
        add({ on: "die", offset: 0.5, do: "pop", who: "puff", out: true });
        add({ on: "same", do: "shiver", who: ["c0", "c1", "c2", "youUp", "lob", "pol"], dur: 0.5, amp: 6, rot: 3 });
        add({ on: "do),", offset: 0.79, do: "boom", shake: 12, flash: 0.15 });
        add({ on: "do),", offset: 0.79, do: "stamp", who: "stone", from: 1.8, shake: 10 });
        // "politicians do not do things for free": the hand telescopes over every head and presses his nose
        add({ on: "but", do: "camera", view: "wide", dur: 0.5 });
        var tGo = T("politicians", 1, 0.05), tHit = T("not", 2);
        add({ at: tGo, do: "show", who: "hand" });
        add({ at: tGo, do: "move", who: "hand", to: [NOSE[0] + TIPOFF[0], NOSE[1] + TIPOFF[1]], dur: tHit - tGo });
        add({ at: tGo, do: "line", id: "pole", points: [UHAND, [NOSE[0] + CUFF[0], NOSE[1] + CUFF[1]]], dur: tHit - tGo, ease: "linear", color: "#6E4A28", width: 16 });
        add({ at: tHit, do: "nudge", who: "hand", by: [30, 8] });
        add({ at: tHit, do: "nudge", who: "pol", by: [-14, 0] });
        add({ on: "things", do: "shiver", who: "pol", dur: 0.3, amp: 3, rot: 2 });
        add({ on: "free,", do: "tag", id: "change", who: "pol", text: "EXACT CHANGE ONLY", knot: [101, 46], x: X.block + (V ? 220 : 60), y: PTOP - (V ? 160 : 110), w: 560, h: 150, swing: 5 });
        add({ on: "and", do: "hide", who: ["hand", "pole", "change"] });
        // "and the clock is running.": the clock over the rostrum runs on the spot
        add({ on: "and", do: "camera", view: "clock", dur: 0.4 });
        add({ on: "running.", do: "shiver", who: "clock", dur: 0.6, amp: 12, rot: 10 });
        add({ on: "running.", do: "bob", who: "clock", y: 18, r: 6, speed: 9, fade: 0.05 });
        add({ on: "running.", do: "bob", who: "lob", y: 4, r: 1, speed: 4, fade: 0.1 });
      }
      return { cast: cast, beats: beats, views: views, P: { G: G, X: X, FK: FK, FTOP: FTOP, BELLY: BELLY } };
    }
    // ── end hall ──

    (function () {
      var ID = "bidder-paddles", h = hall(ID, true), P = h.P, G = P.G, X = P.X;
      var cue = function (w, n) { return KIT.cue(ID, w, n); };
      // One year of their lobbying is two bundles; five years is ten, as tall as YOU's one billion.
      var BK = 1, GAP = 131 * BK, YEAR = 2 * GAP, TOP = G - 10 * GAP;
      var beats = h.beats;
      var add = function (b) { beats.push(b); };
      h.cast.hill = { art: "money-hill", x: X.fac + 30, y: G + 20, anchor: "bottom", pivot: "bottom", scale: 1.1, hidden: true };
      // "Your explosion manufacturers spend $198 million a year": one year of bundles beside the factory
      add({ on: "explosion", do: "camera", view: "towers", dur: 0.7 });
      add({ at: cue("explosion") - 0.14, do: "pile", id: "y1", art: "bundle-war", x: X.tfac, y: G, count: 2, scale: BK, gap: GAP, until: cue("explosion") + 0.25, fall: 0.2, jitter: 4, tilt: 2 });
      add({ on: "million", do: "tag", id: "tagF", who: "y1.1", text: "$198 MILLION A YEAR", knot: [30, 40], x: X.tfac + 90, y: G - YEAR - 210, w: 620, h: 170, swing: 3 });
      // "buying politicians.": a ribbon of its bills walks off the tower into the Politician's belly
      add({ on: "buying", offset: -0.3, do: "march", id: "ribbon", art: "bill-war", count: 5, height: 110, path: [[X.tfac + 60, G - YEAR - 30], [520, 220], [P.BELLY[0], P.BELLY[1]]], speed: 1600, end: "hide" });
      add({ on: "politicians.", offset: 0.5, do: "hop", who: "pol", height: 40 });
      // "Your one-time bribery budget is one billion dollars,": YOU's tower, five times as tall
      add({ on: "Your", n: 2, do: "pile", id: "yt", art: "bundle-med", x: X.tyou, y: G, count: 10, scale: BK, gap: GAP, until: cue("billion"), accel: 0.6, fall: 0.22, jitter: 4, tilt: 2 });
      add({ on: "billion", offset: 0.1, do: "tag", id: "tagY", who: "yt.9", text: "$1 BILLION, ONCE", knot: [30, 40], x: X.tyou - 40, y: TOP - 180, w: 620, h: 170, swing: 3 });
      // "which is five times their annual spend.": the factory stacks year on year to match it
      add({ on: "five", offset: -0.12, do: "hide", who: "tagF" });
      [-0.1, 0.1, 0.3, 0.5].forEach(function (o, i) {
        add({ at: cue("five") + o - 0.14, do: "pile", id: "y" + (i + 2), art: "bundle-war", x: X.tfac, y: G - (i + 1) * YEAR, count: 2, scale: BK, gap: GAP, until: cue("five") + o, fall: 0.14, jitter: 4, tilt: 2 });
      });
      add({ on: "annual", do: "shiver", who: ["y1", "y2", "y3", "y4", "y5"], dur: 0.5, amp: 6, rot: 2 });
      // "spend.": the stack topples onto the factory; it pops up out of the money; SOLD to YOU
      [1, 2, 3, 4, 5].forEach(function (j) { add({ on: "spend.", n: 2, do: "drop", who: "y" + j, dur: 0.42, dist: 260 + 160 * j, drift: 230 + 110 * j, spin: 40 + 18 * j }); });
      add({ on: "spend.", n: 2, offset: 0.35, do: "boom", shake: 16, flash: 0.1 });
      add({ on: "spend.", n: 2, offset: 0.35, do: "stamp", who: "hill", from: 1.4, shake: 6 });
      add({ on: "spend.", n: 2, offset: 0.6, do: "hop", who: ["facK", "stone"], height: 90 });
      add({ on: "spend.", n: 2, offset: 0.79, do: "stamp", id: "sold", text: "SOLD", x: X.tyou, y: G - 5 * GAP, size: 200, width: 520, tilt: -10, shake: 10 });
      KIT.collage({ id: ID, seed: 2004, plate: KIT.V ? [-2600, -2600, 4600, 3000] : [-2000, -1200, 4200, 2600], views: h.views, view: "clock", cast: h.cast, beats: beats });
      document.getElementById(ID + "-hand").querySelector("img").style.transform = "scaleX(-1)";
    })();
  </script>
</template>
