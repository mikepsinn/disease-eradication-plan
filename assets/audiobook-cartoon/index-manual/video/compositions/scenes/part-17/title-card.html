<template id="title-card-template">
  <!-- title-card · the period title card (KIT.titleScene, look "atomic"): THE FIVE-STEP PLAN under the emblem. On
       "Obscenely" more war bills crowd onto the atom's orbits, nose to tail; on "Wealthy" they jam solid and squeeze the
       nucleus out of round, then the jam bursts and the bills tumble down the card and heap on the italic line.
       STEP 1 stamps on at "One:"; SELL INCENTIVE ALIGNMENT BONDS reads in; down to black. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="title-card" data-width="1920" data-height="1080" data-start="0" data-duration="9.84">
    <div id="title-card-cam"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/props/title.js"></script>
  <script>
    (function () {
      var V = KIT.V, SZ = window.KIT_ART_SIZES || { "bill-war": [226, 229] };
      KIT.titleScene({
        id: "title-card",
        lines: [["THE", "FIVE-STEP", "PLAN"],
          { words: ["Saving Humanity While Making Everyone Obscenely Wealthy"], style: "italic", cue: "Saving" },
          { words: ["STEP 1"], style: "stamp", cue: "One:", tilt: -4 },
          { words: ["SELL INCENTIVE ALIGNMENT BONDS"], style: "small", cue: "Sell" }],
        linesTall: [["THE", "FIVE-STEP"], ["PLAN"],
          { words: ["Saving Humanity While Making Everyone Obscenely Wealthy"], style: "italic", cue: "Saving" },
          { words: ["STEP 1"], style: "stamp", cue: "One:", tilt: -4 },
          { words: ["SELL INCENTIVE"], style: "small", cue: "Sell" }, { words: ["ALIGNMENT BONDS"], style: "small", cue: "Alignment" }],
        spoken: ["The", "Five-Step", "Plan."],
        maxH: V ? 640 : 380, minTop: V ? 860 : 480, cy: V ? 1150 : 690,
        gag: function (c) {
          var tl = c.tl, E = c.emblem, D = c.D, TILT = [0, 60, -60].map(function (a) { return a * Math.PI / 180; });
          // The italic line, where the heap lands.
          var it = c.layout.lines[V ? 2 : 1];
          var N = 12, BW = V ? 104 : 88, BH = BW * 229 / 226, rng = KIT.rng(1717);
          var CROWD = c.cue("Obscenely"), JAM = CROWD + 0.33, BURST = Math.min(D - 1.2, c.after("Wealthy*") + 0.05);
          var bills = [];
          for (var i = 0; i < N; i++) {
            var el = document.createElement("div");
            el.style.cssText = "position:absolute;left:0;top:0;width:" + BW + "px;height:" + BH.toFixed(1) + "px;visibility:hidden";
            el.innerHTML = '<img src="assets/art/collage/bill-war.webp" style="position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(3px 4px 2px rgba(0,0,0,0.45))">';
            c.art.appendChild(el);
            var o = i % 3;
            bills.push({ el: el, orbit: o, ph: 0.6 + Math.floor(i / 3) * 0.55 + o * 2.1, born: CROWD + (i / N) * 0.3,
              hx: it.x + it.w * (0.08 + 0.84 * rng()), hy: it.y + it.h * (0.35 + 0.5 * rng()), spin: (rng() - 0.5) * 140, rot: (rng() - 0.5) * 60, delay: rng() * 0.18 });
          }
          var nuc = c.bg.querySelectorAll("circle");
          var at = function (b, t) {
            var th = b.ph + Math.min(t, JAM) * 2.4, ex = E.rx * Math.cos(th), ey = E.ry * Math.sin(th), a = TILT[b.orbit];
            return [E.at[0] + ex * Math.cos(a) - ey * Math.sin(a), E.at[1] + ex * Math.sin(a) + ey * Math.cos(a)];
          };
          KIT.onTime(tl, D, function (t0) {
            var t = Math.floor(t0 * 12) / 12;
            // the jam squeezes the nucleus, and it shivers until the burst
            var sq = t < JAM ? 0 : t < BURST ? Math.min(1, (t - JAM) / 0.25) : Math.max(0, 1 - (t - BURST) / 0.2);
            var jit = t >= JAM && t < BURST ? (Math.round(t * 12) % 2 ? 3 : -3) : 0;
            var sx = 1 + 0.45 * sq, sy = 1 - 0.38 * sq;
            Array.prototype.forEach.call(nuc, function (n) {
              n.setAttribute("transform", "translate(" + (E.at[0] + jit) + "," + E.at[1] + ") scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ") translate(" + -E.at[0] + "," + -E.at[1] + ")");
            });
            bills.forEach(function (b) {
              var on = t >= b.born;
              b.el.style.visibility = on ? "inherit" : "hidden";
              if (!on) return;
              var p = at(b, t), x = p[0], y = p[1], r = 0, s = Math.min(1, (t - b.born) / 0.12);
              if (t >= JAM && t < BURST) { x += Math.round(t * 12 + b.ph * 5) % 2 ? 2 : -2; r = b.rot * 0.2; }
              var tb = BURST + b.delay;
              if (t >= tb) {
                var u = Math.min(1, (t - tb) / 0.55), j = at(b, JAM);
                x = j[0] + (b.hx - j[0]) * u; y = j[1] + (b.hy - j[1]) * u * u - Math.sin(Math.PI * u) * 90;
                r = b.rot * 0.2 + b.spin * u;
                if (u >= 1) { var land = Math.min(1, (t - tb - 0.55) / 0.17); r = b.rot * (1 - land) + b.spin * (1 - land); }
              }
              b.el.style.transform = "translate(" + (x - BW / 2).toFixed(1) + "px," + (y - BH / 2).toFixed(1) + "px) rotate(" + r.toFixed(1) + "deg) scale(" + s.toFixed(2) + ")";
            });
          });
        },
      });
    })();
  </script>
</template>
