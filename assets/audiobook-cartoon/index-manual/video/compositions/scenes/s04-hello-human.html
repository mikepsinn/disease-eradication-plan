<template id="s04-template">
  <!-- S04 · Layer A · "Hello, human." First close-up of Wishonia; she leans in and squints on "expression". -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #s04-bg, #s04-cast, #s04-front { position: absolute; inset: 0; }
    #s04-camera { position: absolute; inset: 0; transform-origin: 1300px 500px; }
    #s04-card {
      position: absolute; left: 110px; top: 140px; width: 860px; padding: 40px 48px 46px;
      background: #F6EBD2; border: 7px solid #1A1426; border-radius: 26px; box-shadow: 12px 14px 0 #1A1426;
    }
    #s04-you { font-size: 150px; line-height: 1; }
    .s04-line { font-family: "Oswald"; font-size: 54px; line-height: 1.12; color: #1A1426; text-transform: uppercase; margin-top: 22px; }
    .s04-hi { color: #C2361F; }
  </style>
  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080" data-start="0" data-duration="15.58">
    <div id="s04-camera" class="clip" data-start="0" data-duration="15.58" data-track-index="0">
      <div id="s04-bg"></div>
      <div id="s04-cast"></div>
      <div id="s04-front"></div>
      <div id="s04-card">
        <div id="s04-you" class="kit-big">YOU:</div>
        <div class="s04-line" id="s04-l1"><span class="s04-hi">quantifiably</span> the most</div>
        <div class="s04-line" id="s04-l2">important person in the</div>
        <div class="s04-line" id="s04-l3">history of your civilization</div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part-02.js"></script>
  <script src="assets/js/kit.js"></script>
  <script>
    (function () {
      var ID = "s04";
      var D = KIT.scene(ID).duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var cue = function (w, n) { return KIT.cue(ID, w, n); };

      q("bg").innerHTML = KIT.office(1420);
      q("front").innerHTML = KIT.svg(1920, 1080, KIT.desk(1000, 915, 880) + '<g transform="translate(1690,800) scale(1.5)">' + KIT.mug(0, 0) + "</g>");

      var tl = gsap.timeline({ paused: true });
      var wish = KIT.mountWishonia(tl, q("cast"), { scene: ID, x: 1060, y: 50, w: 720 });
      wish.rig.style.transformOrigin = "50% 95%";

      // slow push-in under everything
      tl.fromTo(q("camera"), { scale: 1 }, { scale: 1.04, duration: D, ease: "none" }, 0);

      // no title card in Part 2 (style bible, section 1)
      tl.fromTo(q("card"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, cue("you", 2) - 0.2);
      tl.fromTo(q("you"), { scale: 0.6, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, cue("you", 2) - 0.1);
      tl.fromTo(q("l1"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, cue("quantifiably,"));
      tl.fromTo(q("l2"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, cue("important"));
      tl.fromTo(q("l3"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, cue("history"));

      // Wishonia arrives, then leans toward the camera on "expression"
      tl.fromTo(wish.rig, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.to(wish.rig, { scale: 1.12, x: -60, duration: 0.7, ease: "power2.inOut" }, cue("expression,") - 0.1);
      tl.to(q("card"), { x: -1000, rotation: -8, duration: 0.6, ease: "power3.in" }, cue("expression,") - 0.1);
      tl.to(wish.rig, { scale: 1.04, x: -20, duration: 0.6, ease: "power2.inOut" }, cue("skeptical."));
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
