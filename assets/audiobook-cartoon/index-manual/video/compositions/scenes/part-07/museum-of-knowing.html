       a lanyard) who agrees with every exhibit and is wrecked by each one's opposite:
       entrance: he pushes through the turnstile, taps his temple and winks (he knows);
       1, the film: a TV plays WAR IS BAD; he sobs, while through the window behind him a missile streaks past and a
       mushroom cloud goes up, and he pulls the curtain shut without looking;
       2, the book: he buys PEACE; his plain paper goes into the TAX funnel and comes out war money (the seal flip, run
       backwards), hops into a bomb, the bomb rolls to his feet and goes off: charred, he turns a page and it crumbles;
       3, the prize: the winner rises with her medal, the curtain drops on the weapons maker with a giant check
       "PAY TO: PEACE", which he hoists and lets fall on her (a little hand and a dove wave from under it);
       4, the department: the Pentagon model's courtyard missile peeks out, ducks, and five tiny missiles punch holes in
       the gallery walls; the DEFENSE paint peels off the sign and it says WAR;
       5, the other department: the scientist in her glass case shakes her flask, the bubbles are grinning germs that
       bounce all over the gallery; one sits on his shoulder, his check-engine light blinks, he taps the OBSERVABLE
