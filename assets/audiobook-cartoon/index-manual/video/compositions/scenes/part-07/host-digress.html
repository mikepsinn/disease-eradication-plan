<template id="host-digress-template">
  <!-- host-digress · collage host shot (Part 7, scene 5). Wishonia at the console, proud of her Earth word, her mug on
       the ledge. "continuing": an inked line starts climbing across the wall toward a STOP sign and runs straight
       through it (the sign dents). "stopped.": she lifts her mug and sips. "Like your military spending.": the line
       keeps going, loops back over the window and down through the mug she has just put down (splat), then climbs
       into the closing iris, which jams open a crack on her side-eye. -->
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Black-Soft.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B0805; }
  </style>
  <div id="root" data-composition-id="host-digress" data-width="1920" data-height="1080" data-start="0" data-duration="5.637">
    <div id="host-digress-weave"></div>
    <div id="host-digress-film"></div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="data/part.js"></script>
  <script src="data/aspect.js"></script>
  <script src="assets/js/kit.js"></script>
  <script src="assets/js/film.js"></script>
  <script src="assets/js/art-sizes.js"></script>
  <script src="assets/js/collage.js"></script>
  <script>
    var ID = "host-digress", V = KIT.V, SZ = KIT.collage.SIZES, D = KIT.scene(ID).duration, ST = KIT.STUDIO;
    var cue = function (w, n) { return KIT.cue(ID, w, n); };
    var MOUTH = V ? [ST.face[0] + 40, ST.face[1] + 150] : [ST.face[0] + 20, ST.face[1] + 130];
    var MUG = V ? [560, ST.top] : [950, ST.top], MK = 112 / SZ["desk-mug"][1];
    var SIGN = V ? { x: 930, y: 1460, h: 380 } : { x: 1650, y: 1000, h: 360 }, SK = SIGN.h / SZ["stop-sign"][1];
    // The line: up the wall and through the STOP sign, then (line 2) round over the window, down through the mug and
    // into her face, where the iris jams on it.
    var L1 = V ? [[700, 1330], [820, 1240], [930, 1150], [1040, 1060]] : [[1130, 830], [1400, 770], [1650, 705], [1880, 560]];
    var L2 = V ? [[1040, 1060], [1000, 600], [780, 380], [620, 700], [MUG[0], MUG[1] - 40], [520, 900], [MOUTH[0], MOUTH[1] - 10]]
      : [[1880, 560], [1760, 300], [1350, 200], [1080, 420], [MUG[0], MUG[1] - 45], [900, 560], [MOUTH[0] + 50, MOUTH[1] - 20]];
    var SPLAT = cue("spending.") + 0.45;
    var beats = [
      { on: "continuing", do: "line", id: "spend1", points: L1, dur: V ? 2.23 : 2.4, width: 16, color: "red", front: true },
      { on: "stopped.", offset: 0.05, do: "swap", who: "stop", to: "dented" },
      { on: "stopped.", offset: 0.05, do: "shiver", who: "dented", dur: 0.5, amp: 6, rot: 8 },
      // the sip
      { on: "stopped.", do: "move", who: "mug", to: MOUTH, dur: 0.3, arc: 30, turn: -25, ease: "smooth" },
      { on: "spending.", do: "move", who: "mug", to: [MUG[0], MUG[1] - SZ["desk-mug"][1] * MK / 2], dur: 0.36, ease: "smooth" },
      { on: "Like", do: "line", id: "spend2", points: L2, dur: 1.11, width: 16, color: "red", front: true },
      { at: SPLAT, do: "shiver", who: "mug", dur: 0.4, amp: 7, rot: 10 },
    ];
    var cast = {
      stop: { art: "stop-sign", x: SIGN.x, y: SIGN.y, anchor: "bottom", pivot: "bottom", scale: SK },
      dented: { art: "stop-sign-dented", x: SIGN.x, y: SIGN.y, anchor: "bottom", pivot: "bottom", scale: SK * SZ["stop-sign"][1] / SZ["stop-sign-dented"][1], hidden: true },
      mug: { art: "desk-mug", x: MUG[0], y: MUG[1], anchor: "bottom", scale: MK },
    };
    // the iris closes toward her face but is still a crack open when the shot ends: the line has jammed it
    KIT.collage({ id: ID, seed: 705, host: { iris: ["out", D - 0.7, D + 0.35] }, cast: cast, beats: beats });
  </script>
</template>
