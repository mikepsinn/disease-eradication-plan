      var LE = KIT.V

        out += leSolid([lePoly(leRect(MB.x0, MB.top, MB.x1 - MB.x0, SH.y - MB.top))], C.yellow, 3) +
          '<rect x="' + (TR.dir > 0 ? MB.x0 : MB.x1 - 6) + '" y="' + (MB.top + 4) + '" width="6" height="' + (SH.y - MB.top - 8) + '" fill="' + C.rust + '"/>' +
