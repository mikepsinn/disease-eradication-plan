        A.fromTo(mis, { y: M.cradle[1] - 22 * s }, { y: M.cradle[1], duration: 0.3, ease: "back.out(1.6)" }, 0.2);

        // "game": the politician lifts the lid; the board flips out of the box and flops open on the table (the thunk);
        // the tiny Earth hops onto START.
        var tg = cue("game"), bd = LE.board, bcy = (bd.by + bd.fy) / 2;
        swap("pol-rest", "pol-lift", tg - 0.2);
        A.to(lidEl, leCopy(lidAt(L.lift), { duration: 0.18, ease: "power2.out" }), tg - 0.2);
        var bx = LE.box.cx - bd.cx, by = G.boxTop - 10 - bcy;
        A.set(g("board"), { opacity: 1 }, tg - 0.16);
        A.fromTo(g("board"), { x: bx, scale: 0.4, rotation: -30 }, { x: 0, scale: 1, rotation: 0, duration: 0.18, ease: "none" }, tg - 0.16);
        A.fromTo(g("board"), { y: by }, { y: by - 70 * s / 2.3, duration: 0.08, ease: "power2.out" }, tg - 0.16);

        A.fromTo(earth, { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.6)" }, tg + 0.18);
        A.fromTo(earth, { y: LE.earth.y - 40 }, { y: LE.earth.y, duration: 0.22, ease: "bounce.out" }, tg + 0.18);

        // "objective": he holds up the lid (OBJECTIVE: LOSE) under his eyes and nods, grinning.
        var to = cue("objective");

        // "trying": the weapons maker kisses his baby missile (a heart) and tosses it onto the hook over the tiny Earth

        var tt = cue("trying"), tk = tt - 0.6, tth = tt - 0.34;

        A.to(mis, { y: apex, duration: (tt - tth) * 0.62, ease: "power2.out" }, tth);
        A.to(mis, { y: M.hang[1], duration: (tt - tth) * 0.38, ease: "power2.in" }, tth + (tt - tth) * 0.62);
        A.to(mis, { rotation: 450, duration: tt - tth, ease: "power1.out" }, tth);
        swap("wm-toss", "wm-rest", tt + 0.18);
        [[7, 0.16], [-5, 0.28], [3, 0.28], [-1.5, 0.26], [0, 0.26]].reduce(function (t, k2) {
          A.to(g("swing"), { rotation: k2[0], duration: k2[1], ease: "sine.inOut" }, t);

        }, tt);
        swap("earth-smile", "earth-worry", tt + 0.25);

        // "lose" (second): the skeleton tips the first domino (a tick per domino); all three cheer the chain on.
        var tdm = cue("lose", 2);
        swap("sk-rest", "sk-tip", tdm - 0.14);
        for (var d = 0; d < 5; d++) A.to(g("dom" + d), { rotation: d < 4 ? 62 : 92, duration: 0.11, ease: "power2.in" }, tdm + d * 0.09);
        swap("sk-tip", "sk-cheer", tdm + 0.24);

        A.to([g("pol-seat"), g("wm-seat"), g("sk-seat")], { y: -5, duration: 0.13, repeat: 9, yoyo: true, ease: "sine.inOut" }, tdm + 0.3);
        A.to(lidEl, { y: L.aloft[1] - 5 * s, duration: 0.13, repeat: 9, yoyo: true, ease: "sine.inOut" }, tdm + 0.3);

        // "elaborately": the last domino knocks the marble down the ramp onto the seesaw (the boing), which flips the

        // up the fuse to the string.
        var te = cue("elaborately"), tm = tdm + 0.42, rEnd = G.onRamp(G.rl - 6);
        A.to(g("marble"), { x: rEnd[0], y: rEnd[1], duration: te - 0.03 - tm, ease: "power1.in" }, tm);
        A.to(g("marble"), { x: G.marbleHit[0], y: G.marbleHit[1], duration: 0.03, ease: "none" }, te - 0.03);
        A.to(g("plank"), { rotation: -G.a0, duration: 0.07, ease: "power3.out" }, te);
        A.to(g("marble"), { x: G.marbleOn[0], y: G.marbleOn[1], duration: 0.07, ease: "power3.out" }, te);
        var tsn = te + 0.35, tl0 = te + 0.02, b0 = G.ball0, b1 = G.ballLand;
        var ya = Math.min(b0[1], b1[1]) - LE.apex, up = Math.sqrt(b0[1] - ya), dn = Math.sqrt(b1[1] - ya), tA = tl0 + ((tsn - tl0) * up) / (up + dn);
        A.to(g("ball"), { x: b1[0], duration: tsn - tl0, ease: "none" }, tl0);
        A.to(g("ball"), { y: ya, duration: tA - tl0, ease: "power2.out" }, tl0);
        A.to(g("ball"), { y: b1[1], duration: tsn - tA, ease: "power2.in" }, tA);
        A.to(g("ball"), { rotation: -LE.trap.dir * 540, duration: tsn - tl0, ease: "none" }, tl0);
        A.to(g("cheese"), { scaleY: 0.35, duration: 0.04, ease: "power2.in" }, tsn);
        A.to(g("bar"), { rotation: LE.trap.dir * 180, duration: 0.08, ease: "power4.in" }, tsn);
        A.set(g("snap"), { opacity: 1 }, tsn + 0.05);
        A.set(g("snap"), { opacity: 0 }, tsn + 0.2);
        A.fromTo(g("spark"), { opacity: 1, scale: 0.3 }, { scale: 1.3, duration: 0.08, ease: "power2.out" }, tsn + 0.08);
        A.set(g("spark"), { opacity: 0 }, tsn + 0.18);
        var tf = te + 0.55, tb = cue("as", 2);
        A.fromTo(g("mflame"), { opacity: 1, scale: 0.2 }, { scale: 1, duration: 0.08, ease: "back.out(2)" }, tf - 0.06);
        A.to(g("mflame"), { opacity: 0, duration: 0.2 }, tb);
        A.flicker(g("mflame"), tf, tb);
        // the fuse burns from the match up to the cleat, the flame on its burning end
        var fz = G.fuse, l1 = Math.hypot(fz[1][0] - fz[0][0], fz[1][1] - fz[0][1]), l2 = Math.hypot(fz[2][0] - fz[1][0], fz[2][1] - fz[1][1]), f1 = l1 / (l1 + l2);
        A.set(g("fflame"), { opacity: 1 }, tf);
        A.to(g("fflame"), { x: fz[1][0], y: fz[1][1], duration: (tb - tf) * f1, ease: "none" }, tf);
        A.to(g("fflame"), { x: fz[2][0], y: fz[2][1], duration: (tb - tf) * (1 - f1), ease: "none" }, tf + (tb - tf) * f1);

        // "as" (second): the string burns through (a burst at the cleat) and whips back to the lamp; the missile hangs

        A.set(g("burst"), { opacity: 0 }, tb + 0.16);

        A.to(mis, { rotation: 442, duration: 0.05, ease: "sine.inOut" }, tb + 0.07);
        A.to(mis, { rotation: 450, duration: 0.04, ease: "sine.inOut" }, tb + 0.12);

        A.to(g("drop"), { y: G.drop, duration: thit - (tb + 0.16), ease: "power2.in" }, tb + 0.16);
        A.to(earth, { scaleY: 0.7, scaleX: 1.15, duration: 0.04, ease: "power2.in" }, thit);

        // The bomb (the boom): a white flash and a shake; under the flash the missile is gone, the table scorched, the

        A.fromTo(g("flash"), { opacity: 0 }, { opacity: 1, duration: 0.03 }, tboom);

        swap("earth-worry", "earth-c", tc);
        A.set(earth, { x: G.knock[0], rotation: 78, scaleX: 1, scaleY: 1 }, tc);

      window.__timelines[ID] = tl;
    })();
  </script>
