<template id="deletion-board-template">
  <!-- deletion-board · Layer B (storyboards/part-08-daily-deletion-event.md). The NOW SERVING sign fills the frame, its
       flip digits clattering to a stop on 150,000 ("thousand", clank). On "humans" the camera pulls back: the sign hangs
       by its chains over a 1950s deli counter run by the Grim Reaper in a paper deli cap (his scythe leans on the wall),
       with a TAKE A NUMBER dispenser, a till, a counter bell, a DELETED door on the left and a queue of ticket-holders
       running back to the horizon. "permanently": the fat cat at the front slides a wad of cash across; the Reaper rings
       it into the till (ding). "stop": the Reaper slaps the bell anyway; the fat cat x-rays into a grinning skeleton (top
       hat and monocle still on) and strolls out through the DELETED door with his ticket; the line shuffles up.
       "hours": the sign's bottom strip flips to EVERY 24 HOURS. HOLD (silent) until "bugs": the next in line, a barrel
       of a man in overalls, blinks red and a hatch on his chest springs open; a callout shows the printout inside,
       MEAT SOFTWARE, with a fat beetle chewing line 30 (COPY CELLS). "meat": chomp. "software.": it swallows the line and
       burps; he x-rays; the Reaper dings the bell and the sign clicks to 150,001. After "software." the sign swings up
       into the top-left corner, still counting at the true rate (one every 0.576 s), and the line shuffles up again. -->

      function fillP(pts, col, extra) { return '<path d="' + polyD(pts) + '" fill="' + col + '"' + (extra ? " " + extra : "") + "/>"; }

      var SIGN = {

      function signCount(pt) { return pt < SIGN.T1 ? 150000 : 150001 + Math.floor((pt - SIGN.T1) / SIGN.rate); }

      // ── The Reaper's scythe, leaning on the wall (the kit's scythe, out of his hand) ──

          solid([R(bx - 3, by - 38, 6, 9)], C.slate, 2.4) + '<circle cx="' + bx + '" cy="' + (by - 40) + '" r="4.5" fill="' + C.peri + '" stroke="' + ink + '" stroke-width="2.4"/></g>' +
          '<g id="' + P + 'ding" opacity="0">' + line("M" + pt(bx - 30, by - 40) + " l-16,-12 M" + pt(bx, by - 52) + " v-18 M" + pt(bx + 30, by - 40) + " l16,-12", ink, 3.4) + "</g>";
      }
      function till() {
        var bx = L.till[0], by = L.till[1];
        var body = [[bx - 58, by - 18], [bx + 58, by - 18], [bx + 54, by - 50], [bx - 54, by - 50]], keys = [[bx - 50, by - 50], [bx + 50, by - 50], [bx + 40, by - 70], [bx - 40, by - 70]];

        for (var r = 0; r < 2; r++) for (var c = 0; c < 6; c++) k += '<circle cx="' + n1(bx - 32 + c * 13 - r * 3) + '" cy="' + n1(by - 55 - r * 8) + '" r="4" fill="' + C.cream + '" stroke="' + ink + '" stroke-width="1.6"/>';

        }

      var CO = L.callout, ck = CO[2] / 170, s1 = L.Q[0][2], hatchW = [L.Q[0][0] + HT[0] * s1, L.Q[0][1] + (HT[1] - 100) * s1];
