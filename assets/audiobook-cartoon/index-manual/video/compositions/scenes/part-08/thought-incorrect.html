      [0, 1, 2, 3].forEach(function (i) {
        var sp = q("sp" + i);
        gsap.set(sp, { svgOrigin: "0 0", scale: 0, rotation: 0 });
        tl.to(sp, { keyframes: [{ scale: 1.2, rotation: 45, duration: 0.16, ease: "back.out(2)" }, { scale: 0, rotation: 90, duration: 0.22, ease: "power1.in" }] }, tProb + 0.05 + i * 0.07);

      });

      var pencil = q("pencil"), up = L.rise;
      gsap.set(pencil, { svgOrigin: "0 0" });
      var p0 = pencilPose([up[0] - 30, up[1] + 150], [up[0] + 30, up[1] + 330]), p1 = pencilPose([up[0] - 30, up[1] - 150], [up[0] + 30, up[1] + 30]);
      tl.fromTo(pencil, { x: p0.x, y: p0.y, rotation: p0.rotation, scale: p0.scale },
        { x: p1.x, y: p1.y, rotation: p1.rotation, scale: p1.scale, duration: 0.24, ease: "back.out(1.8)" }, tThought);

      // "incorrect.": her body turns to point (mirrored, so she points at the bubble) and the pencil is in that hand;
      // it jabs, the bubble pops (pop), the letters scatter, the shards fly, and the wrench drops onto the desk (clank).
      var bodyBox = wish.rig.children[0];
      tl.set(bodyBox, { scaleX: -1 }, tInc);
      var hitA = 0.9, tip = [L.bc[0] + Math.cos(hitA) * L.rx * SW * 0.98, L.bc[1] + Math.sin(hitA) * L.ry * SW * 0.98];
      var back = [tip[0] + (L.grip[0] - tip[0]) * 0.16, tip[1] + (L.grip[1] - tip[1]) * 0.16];
      var pBack = pencilPose(back, [L.grip[0] + (L.grip[0] - tip[0]) * 0.12, L.grip[1] + (L.grip[1] - tip[1]) * 0.12]), pHit = pencilPose(tip, L.grip);
      tl.set(pencil, { x: pBack.x, y: pBack.y, rotation: pBack.rotation, scale: pBack.scale }, tInc);
      var tPop = tInc + 0.05;
      tl.to(pencil, { x: pHit.x, y: pHit.y, duration: tPop - tInc, ease: "power2.in" }, tInc);
      tl.to(pencil, { x: pBack.x * 0.3 + pHit.x * 0.7, y: pBack.y * 0.3 + pHit.y * 0.7, duration: 0.12, ease: "power2.out" }, tPop);
      // the pop
      tl.to(q("cloud"), { opacity: 0, duration: 0.03 }, tPop);
      // the trail pops too, from the bubble back to the screen
      [3, 2, 1, 0].forEach(function (i, k) { tl.to(q("t" + i), { scale: 0, duration: 0.06, ease: "power2.in" }, tPop + 0.03 + k * 0.04); });
      tl.set(q("inwr"), { opacity: 0 }, tPop);
      tl.set(q("under"), { opacity: 0 }, tPop);
      var burstEl = q("burst");
      gsap.set(burstEl, { svgOrigin: "0 0" });
      tl.fromTo(burstEl, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.05, ease: "power2.out", immediateRender: false }, tPop);
      tl.to(burstEl, { opacity: 0, scale: 1.25, duration: 0.25, ease: "power1.in" }, tPop + 0.07);
      for (var m = 0; m < 9; m++) {
        var sh = q("sh" + m), a = +sh.getAttribute("data-a");
        gsap.set(sh, { svgOrigin: "0 0", x: 0, y: 0, rotation: 0 });
        tl.set(sh, { opacity: 1 }, tPop);
        tl.to(sh, { keyframes: [{ x: Math.cos(a) * 90, y: Math.sin(a) * 60 - 40, rotation: 160, duration: 0.2, ease: "power2.out" }, { x: Math.cos(a) * 130, y: Math.sin(a) * 60 + 160, rotation: 300, opacity: 0, duration: 0.35, ease: "power2.in" }] }, tPop);
      }
      // PRIORITY 1 scatters into loose letters that tumble down and away
      var lr = KIT.rng(1), ln = 0;
      for (var c = 0; c < word.length; c++) {
        if (word[c] === " ") continue;
        var le = q("l" + c), sx = lx[c] * 1.6 + (lr() - 0.5) * 70, spin = (lr() < 0.5 ? -1 : 1) * (120 + lr() * 260);
        gsap.set(le, { svgOrigin: lx[c].toFixed(1) + " " + (ty - L.fs * 0.35).toFixed(1) });
        tl.to(le, { keyframes: [{ x: sx * 0.6, y: -40 - lr() * 50, rotation: spin * 0.35, duration: 0.18, ease: "power2.out" }, { x: sx, y: 260 + lr() * 120, rotation: spin, opacity: 0, duration: 0.42, ease: "power2.in" }] }, tPop + ln * 0.01);
        ln++;
      }
      // the wrench drops, tumbling, lands on the desk (clank at "incorrect." + 0.35), bounces once and lies still
      var drop = q("drop"), tLand = tInc + 0.35;
      var jaw0 = [L.bc[0] + SW * (WOFF[0]), L.bc[1] + SW * WOFF[1]];
      gsap.set(drop, { svgOrigin: "0 0" });
      gsap.set(drop, { x: jaw0[0], y: jaw0[1], rotation: WROT, scale: SW });
      tl.set(drop, { opacity: 1 }, tPop);
      tl.fromTo(drop, { x: jaw0[0], y: jaw0[1], rotation: WROT, scale: SW },
        { x: L.land[0], y: L.land[1], rotation: 364, scale: SW * 0.92, duration: tLand - tPop, ease: "power2.in", immediateRender: false }, tPop);
      tl.to(drop, { keyframes: [{ y: L.land[1] - 46, rotation: 352, duration: 0.13, ease: "power2.out" }, { y: L.land[1], rotation: 362, duration: 0.13, ease: "power2.in" }, { y: L.land[1] - 7, duration: 0.06, ease: "power1.out" }, { y: L.land[1], duration: 0.06, ease: "power1.in" }] }, tLand + 0.02);
      tl.fromTo(q("cam"), { y: 0 }, { y: 5, duration: 0.04, repeat: 3, yoyo: true, ease: "none", immediateRender: false }, tLand);
      // then nothing moves
      tl.set({}, {}, D);
      window.__timelines[ID] = tl;
    })();
  </script>
