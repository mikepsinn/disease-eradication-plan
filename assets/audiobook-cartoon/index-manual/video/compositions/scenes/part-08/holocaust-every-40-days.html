       shelf sheds its pages, one a day, faster and faster, onto a pile ("Holocaust"); page 40 lands and the pile gets
       its tag, 40 DAYS ("days,"). HOLD: only the NOW SERVING sign's digits move, in the corner, outside the camera.
       "insurance": a CLAIMS booth slams down beside the calendar, a clerk in a green eyeshade inside, and a patient
       hops in, her chest light blinking red. "paperwork": he tosses a ream of INSURANCE CLAIM forms onto the ledge.
       "(though": she fills in a form; each one she hands in, he tosses two more reams ("argue", "paperwork"), and the
       stack passes the top of the calendar. "worse;": she x-rays into a skeleton and keeps writing. "straightforward":
       he stamps her form DENIED and dollar signs ring up in his eyes. After "part).": the stack topples onto her; a bony
       hand pokes out of the heap, still signing. No Nazi imagery: the calendar carries the number.
       fifty-nine-elevens starts on this scene's last frame and copies claimsSet() (change both). -->

  <script>
    (function () {
      var ID = "holocaust-every-40-days";
      var sc = KIT.scene(ID);
      var D = sc.duration;
      var q = function (s) { return document.getElementById(ID + "-" + s); };
      var C = KIT.C, W = KIT.W, H = KIT.H, V = KIT.V, ink = C.line, P = ID + "-";

      // ── Drawing helpers (the kit's print look: a navy pass under each fill, mitred corners) ──
      function n1(v) { var r = Math.round(v * 10) / 10; return String(r === 0 ? 0 : r); }
      function pt(x, y) { return n1(x) + "," + n1(y); }
      function polyD(pts) { return "M" + pts.map(function (p) { return pt(p[0], p[1]); }).join(" L") + " Z"; }
      function R(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
      function solid(list, col, w) {
        w = w || 4.4;

          list.map(function (p) { return '<path d="' + polyD(p) + '" fill="' + col + '"/>'; }).join("");
      }
      function line(d, col, w, extra) { return '<path d="' + d + '" fill="none" stroke="' + (col || ink) + '" stroke-width="' + (w || 2) + '" stroke-linejoin="miter" stroke-linecap="round"' + (extra ? " " + extra : "") + "/>"; }

      function txt(x, y, s, size, col, extra, font) {
        return '<text x="' + n1(x) + '" y="' + n1(y) + '" text-anchor="middle" font-family="' + (font || "Oswald") + '" font-weight="' + (font === "Fraunces" ? 900 : font === "Inter" ? 700 : 600) + '" font-size="' + size + '" fill="' + col + '"' + (extra ? " " + extra : "") + ">" + s + "</text>";
      }
      function mix(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }

      function dotsOver(pid, pts, x0, op) {

      }

        l: function (x) { return x; }, i: function (x) { return x * x; }, o: function (x) { return 1 - (1 - x) * (1 - x); },

      }
      // A two-segment arm from shoulder S to hand Hn (segments la each; it stretches straight when out of reach), the
      // elbow on the side `bend` picks (+1 / -1): returns its polygons and the forearm's angle.
      function ikArm(S, Hn, la, bend, w) {
        var dx = Hn[0] - S[0], dy = Hn[1] - S[1], d = Math.sqrt(dx * dx + dy * dy) || 1, L2 = Math.max(la, d / 2 * 1.0001);
        var a = Math.acos(Math.min(1, d / (2 * L2))), th = Math.atan2(dy, dx), E = [S[0] + L2 * Math.cos(th + bend * a), S[1] + L2 * Math.sin(th + bend * a)];
        function quad(a0, b0, w0, w1) {
          var ux = b0[0] - a0[0], uy = b0[1] - a0[1], l = Math.sqrt(ux * ux + uy * uy) || 1, nx = -uy / l, ny = ux / l;
          return [[a0[0] + nx * w0, a0[1] + ny * w0], [b0[0] + nx * w1, b0[1] + ny * w1], [b0[0] - nx * w1, b0[1] - ny * w1], [a0[0] - nx * w0, a0[1] - ny * w0]];
        }
        return { E: E, upper: quad(S, E, w[0], w[1]), fore: quad(E, Hn, w[1], w[2]), fa: Math.atan2(Hn[1] - E[1], Hn[0] - E[0]) };
      }

      // ── NOW SERVING SIGN: the part's spine (part notes). deletion-board, holocaust-every-40-days and fifty-nine-elevens
      // draw it with this block (copied: change all three); falling-apart's signFront draws the same picture at rest, so
      // the cut into it has no seam. Sign units 600 x 280, top-left (0, 0): a cream board, a red band with NOW SERVING,
      // seven ink flip tiles 70 x 110 at x 31 + 78 i (six digits and the comma), a mustard strip with EVERY 24 HOURS,
      // and two chains rising from (90, 0) and (510, 0). Its corner box (outside the camera after deletion-board):
      // 16:9 translate(40,30) scale 0.6, 9:16 translate(40,70) scale 0.62. The count at part time pt: 150,000 until the
      // bell a beat after "software." (+0.3 s), then one more every 0.576 s (86,400 s a day / 150,000).
      var SIGN = {
        corner: V ? [40, 70, 0.62] : [40, 30, 0.6], rate: 0.576,
        T1: KIT.scene("deletion-board").start + KIT.cue("deletion-board", "software.") + 0.3,
      };
      function signCount(pt) { return pt < SIGN.T1 ? 150000 : 150001 + Math.floor((pt - SIGN.T1) / SIGN.rate); }
      function signDigits(n) { var s = String(n); return [s[0], s[1], s[2], ",", s[3], s[4], s[5]]; }
      function signChain(x, len) {
        var out = "";
        for (var y = -6, i = 0; y > -len; y -= 15, i++) {
          var lk = polyD([[x, y - 10], [x + 6, y - 6], [x + 6, y + 6], [x, y + 10], [x - 6, y + 6], [x - 6, y - 6]]);

            : '<path d="' + lk + '" fill="none" stroke="' + ink + '" stroke-width="5"/><path d="' + lk + '" fill="none" stroke="' + C.peri + '" stroke-width="2"/>';
        }
        return out;
      }
      function signBody(fill) { return '<path d="' + polyD(R(0, 0, 600, 280)) + '" fill="' + fill + '" stroke="' + ink + '" stroke-width="5" stroke-linejoin="miter"/>'; }
      // pfx: the id prefix of its parts: <pfx>dg0..6 (the digit texts), <pfx>fl0..6 (each tile's top flap, hidden at
      // rest), <pfx>strip-text, and with o.blank a blank mustard flap over the strip (<pfx>strip-blank) and the
      // strip's text hidden. o.chain: chain length (420).
      function signFront(pfx, o) {
        o = o || {};
        var tiles = "", chain = o.chain || 420;
        for (var i = 0; i < 7; i++) {
          var x = 31 + i * 78;
          tiles += '<path d="' + polyD(R(x, 89, 70, 110)) + '" fill="' + ink + '" stroke="' + ink + '" stroke-width="3" stroke-linejoin="miter"/>' +
            '<path d="M' + (x + 4) + ",92 H" + (x + 66) + '" stroke="' + C.orange + '" stroke-width="2"/>' +
            '<text id="' + pfx + "dg" + i + '" x="' + (x + 35) + '" y="177" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="92" fill="' + C.cream + '">' + (i === 3 ? "," : "0") + "</text>" +
            '<path d="M' + x + ",144 H" + (x + 70) + '" stroke="#000" stroke-width="2.4" opacity="0.7"/>' +
            '<g id="' + pfx + "fl" + i + '" opacity="0"><path d="' + polyD(R(x, 89, 70, 55)) + '" fill="#22385A" stroke="' + ink + '" stroke-width="3" stroke-linejoin="miter"/>' +
            '<path d="M' + (x + 4) + ",92 H" + (x + 66) + '" stroke="' + C.orange + '" stroke-width="2"/></g>';
        }
        return signChain(90, chain) + signChain(510, chain) + signBody(C.cream) +
          '<path d="' + polyD(R(2.5, 2.5, 595, 67.5)) + '" fill="' + C.war + '"/><path d="M2.5,70 H597.5" stroke="' + ink + '" stroke-width="4"/>' +
          '<text x="300" y="54" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="52" letter-spacing="5" fill="' + C.cream + '">NOW SERVING</text>' +
          tiles + '<path d="' + polyD(R(2.5, 216, 595, 56)) + '" fill="' + C.yellow + '"/><path d="M2.5,216 H597.5" stroke="' + ink + '" stroke-width="4"/>' +
          '<g id="' + pfx + 'strip-text"' + (o.blank ? ' opacity="0"' : "") + '><text x="300" y="259" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="40" letter-spacing="3" fill="' + ink + '">EVERY 24 HOURS</text></g>' +
          (o.blank ? '<g id="' + pfx + 'strip-blank"><path d="' + polyD(R(8, 221, 584, 46)) + '" fill="#D9A23F" stroke="' + ink + '" stroke-width="2"/>' + line("M18,244 H582", ink, 1.4, 'opacity="0.35"') + "</g>" : "") +
          line("M591,76 V210 M591,277 V274", C.orange, 3) + line("M10,277.5 H590", C.orange, 2, 'opacity="0.7"') + signBody("none");
      }
      // Show n: each tile's digit; a tile that changed from n - 1 shows its top flap folding down (flap 1 -> 0).
      function signShow(pfx, n, flap) {
        var d = signDigits(n), prev = signDigits(n - 1);

          var el = document.getElementById(pfx + "dg" + k), f = document.getElementById(pfx + "fl" + k), on = flap > 0 && n > 150000 && prev[k] !== d[k];
          if (el.textContent !== d[k]) el.textContent = d[k];
          f.setAttribute("opacity", on ? 1 : 0);

        }
      }
      // The count at part time pt (each new number's flaps fold for 0.1 s).
      function signTick(pfx, pt) {
        var ph = pt < SIGN.T1 ? 9 : (pt - SIGN.T1) % SIGN.rate;
        signShow(pfx, signCount(pt), ph < 0.1 ? 1 - ph / 0.1 : 0);
      }
      // ── end NOW SERVING SIGN ──

      // ── THE CLAIMS SET (this scene). fifty-nine-elevens copies this function and seeks it to this scene's end, so its
      // first frame is this scene's last (change both). PX: the id prefix; HID: the scene whose words time it; host: the
      // world <div>; tl: the timeline it adds its moves to. Returns { cal: [x, y, size] } (the calendar's stand). ──
      function claimsSet(PX, HID, host, tl) {

        var $ = function (s) { return document.getElementById(PX + s); };
        function gi(name, inner, attrs) { return '<g id="' + PX + name + '"' + (attrs ? " " + attrs : "") + ">" + inner + "</g>"; }
        // Layout per shape. FL: the floor; shelf [x0, x1, top]; cal [x, y, size]; pile [x, y]; booth [x0, x1, roof top,
        // window top, ledge y, ledge's left end]; clerk [x, scale]; pat [x, scale]; stack [center x, width, ream height];
        // wform: the form in the window [center x, bottom]; sliver: page-pile step.
        var L = V
          ? { FL: 1430, shelf: [50, 600, 860], cal: [210, 860, 3.0], pile: [462, 860], booth: [700, 1040, 830, 905, 1150, 560], clerk: [900, 1.9],
              pat: [420, 2.0], stack: [640, 140, 132], wform: [808, 1146], sliver: 3.4, claims: [870, 0.95], knot: [-62, -46], tag: 1.5 }
          : { FL: 868, shelf: [140, 800, 600], cal: [330, 600, 3.0], pile: [650, 600], booth: [1060, 1560, 285, 330, 600, 940], clerk: [1232, 2.2],
              pat: [850, 2.1], stack: [1022, 150, 72], wform: [1165, 596], sliver: 3.6, claims: [1310, 1.15], knot: [60, -56], tag: 2 };
        var FL = L.FL, CAL = L.cal, BO = L.booth, LEDGE = BO[4];

        // ── the room: a cream wall with a red chair rail, a floor in perspective ──
        var WS = FL - (V ? 230 : 200);
        var room = '<rect width="' + W + '" height="' + H + '" fill="' + C.paper + '"/>' + '<rect x="0" y="' + WS + '" width="' + W + '" height="' + (FL - WS) + '" fill="#E8DCBC"/>' +
          dotsOver(PX, R(0, WS, W, FL - WS), 0, 0.12) + solid([R(-10, WS - 6, W + 20, 12)], C.war, 3);
        var fl = "", vx = W * 0.55;
        for (var k = -16; k <= 16; k++) fl += "M" + n1(vx + k * 40) + "," + FL + " L" + n1(vx + k * 220) + "," + H + " ";
        for (var j = 1; j <= 4; j++) { var yy = FL + (H - FL) * Math.pow(j / 4, 1.8); fl += "M0," + n1(yy) + " H" + W + " "; }
        room += '<rect x="0" y="' + FL + '" width="' + W + '" height="' + (H - FL) + '" fill="#E9DFC4"/>' + line(fl, ink, 1.3, 'opacity="0.25"') + line("M0," + FL + " H" + W, ink, 3);

        // ── the shelf, on two brackets ──
        var SH = L.shelf, shelf = solid([R(SH[0], SH[2], SH[1] - SH[0], 16)], C.tan, 3.6) + line("M" + (SH[0] + 4) + "," + (SH[2] + 12) + " H" + (SH[1] - 4), C.rust, 2) +
          [SH[0] + 60, SH[1] - 60].map(function (x) { return solid([[[x - 8, SH[2] + 16], [x + 8, SH[2] + 16], [x + 8, SH[2] + 30], [x - 30, SH[2] + 90], [x - 40, SH[2] + 84]]], C.slate, 3); }).join("");

        // ── the calendar: the props tear-off calendar, its pages counting the days (DAY 1, 2, ... 41) ──
        var calSvg = at(CAL[0], CAL[1], 1, '<g id="' + PX + 'cal">' + KIT.props.calendar({ month: "DAY", day: 1, pages: 1, size: CAL[2] }) + "</g>");
        // a page in calendar units (the props page: x -40..40, y -98..-16), for the ones that fly off
        function page(dd) {
          var pg = R(-40, -98, 80, 82);
          return solid([pg], "#FBF6E6", 3.6) + solid([R(-40, -98, 80, 19)], C.war, 3.6) + txt(0, -84, "DAY", 13, "#FBF6E6", 'letter-spacing="1.5"') +
            '<text x="0" y="-31" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="44" fill="' + ink + '">' + dd + "</text>" + line("M-20,-23 H20", C.orange, 1.6);
        }
        // the torn pages: 40 tears from "Holocaust", faster and faster, the last landing on "days," (thunk)
        var NT = 40, tA = cue("Holocaust"), tLand = cue("days,"), FLY = 0.3, tB = tLand - FLY;
        var tears = [];
        for (var i = 0; i < NT; i++) tears.push(tA + (tB - tA) * Math.sqrt(i / (NT - 1)));
        var rnd = KIT.rng(4040), PW = 80 * CAL[2], pileTop = L.pile[1] - NT * L.sliver;
        var slivers = "", flyers = "";
        for (i = 0; i < NT; i++) {
          var sy = L.pile[1] - (i + 1) * L.sliver, jx = (rnd() - 0.5) * 18, ra = (rnd() - 0.5) * 3;
          var sl = [[-PW / 2, 0], [PW / 2, 0], [PW / 2 - 6, L.sliver + 2], [-PW / 2 + 6, L.sliver + 2]];
          slivers += '<g id="' + PX + "sl" + i + '" opacity="0">' + at(L.pile[0] + jx, sy, 1, solid([sl], "#FBF6E6", 2.2) + '<path d="M' + n1(-PW / 2 + 2) + ",1 H" + n1(-PW / 2 + 40) + '" stroke="' + C.war + '" stroke-width="2.4"/>', ra) + "</g>";
          flyers += '<g id="' + PX + "fp" + i + '" opacity="0">' + page(i + 1) + "</g>";
        }
        // the tag: a price tag on a pin stuck in the pile ("40 DAYS"), swinging in when page 40 lands
        var knot = [L.pile[0] + L.knot[0], pileTop + L.knot[1]];
        var tag = line("M" + pt(knot[0] - 6, pileTop + 6) + " L" + pt(knot[0], knot[1]), ink, 3.4) + '<circle cx="' + n1(knot[0]) + '" cy="' + n1(knot[1]) + '" r="5" fill="' + C.war + '" stroke="' + ink + '" stroke-width="2"/>' +
          at(knot[0], knot[1], 1, gi("tag", KIT.props.priceTag({ text: "40 DAYS", size: L.tag, angle: 28 }), 'opacity="0"'));

        // ── the booth: back wall, the clerk (two moods), his arms, the front frame and the ledge ──
        var CLERK = { tone: 0, outfit: "suit", color: 1, look: "left", mood: "flat" };
        var cr = KIT.rig(CLERK), CS = L.clerk[1], cFeet = LEDGE + (100 - (cr.hipY - 4)) * CS, CX = L.clerk[0];
        function cw(p) { return [CX + p[0] * CS, cFeet + (p[1] - 100) * CS]; }

          '<path d="M10,-16 L38,-13 L33,-5 L12,-9 Z" fill="' + C.med + '" fill-opacity="0.85" stroke="' + ink + '" stroke-width="1.6" stroke-linejoin="miter"/>' + line("M14,-13 L34,-11", "#BFE3DC", 1.2);
        function clerkSvg(mood) { return KIT.person(mix(CLERK, { mood: mood })).replace("<!--face-end-->", eyeshade + "<!--face-end-->"); }
        var bx0 = BO[0], bx1 = BO[1], win = [bx0 + (V ? 26 : 40), BO[3], bx1 - bx0 - (V ? 52 : 80), LEDGE - BO[3]];
        var back = solid([R(bx0, BO[3] - 10, bx1 - bx0, LEDGE - BO[3] + 10)], "#E4D6B4", 3) + dotsOver(PX, R(bx0, BO[3], bx1 - bx0, LEDGE - BO[3]), bx0, 0.16);
        // a filing cabinet behind him: every drawer says DENIED

        back += solid([R(fc[0], fc[1], fc[2], fc[3])], C.peri, 3) + [0, 1, 2].map(function (d) {
          var dy = fc[1] + 8 + d * (fc[3] - 16) / 3, dh = (fc[3] - 16) / 3 - 6;
          return solid([R(fc[0] + 6, dy, fc[2] - 12, dh)], "#7486A3", 2.4) + solid([R(fc[0] + 12, dy + 6, fc[2] - 24, V ? 16 : 20)], "#FBF6E6", 1.6) +
            txt(fc[0] + fc[2] / 2, dy + (V ? 19 : 22), "DENIED", V ? 12 : 15, C.war, 'letter-spacing="1"');
        }).join("");
        var clerkG = at(CX, cFeet, CS, '<g transform="translate(0,-100)">' + gi("clerk-a", clerkSvg("flat")) + gi("clerk-g", clerkSvg("greedy"), 'opacity="0"') + "</g>");
        // the window form (lands on the ledge inside the window) and its DENIED mark
