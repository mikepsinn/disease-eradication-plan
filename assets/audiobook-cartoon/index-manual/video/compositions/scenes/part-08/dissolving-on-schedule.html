       to the wall, YOUR SCHEDULE chalked on its back; its chains shiver on each tick (one every 0.576 s). He turns a

      var READER = { tone: 3, outfit: "shirt", color: 3, mood: "flat" };

      function ik(s, h, len, pref) {
        var dx = h[0] - s[0], dy = h[1] - s[1], d = Math.min(Math.sqrt(dx * dx + dy * dy), 2 * len - 0.05), ux = dx / d, uy = dy / d;

          if (!best || e[0] * pref[0] + e[1] * pref[1] > best[0] * pref[0] + best[1] * pref[1]) best = e;

      // The open manual, in book units: the spine at x 0, the front cover (the prop) to the right, the back cover to the

      var BOOK = { x: 35, y: 63, rot: -8 };
      function bookPt(p) {

      function signBack() {
