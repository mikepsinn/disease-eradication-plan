<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alien Character Test</title>
  <style>
    body { background: #0d0d0d; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; gap: 60px; }
    .label { color: #888; font-family: sans-serif; font-size: 12px; text-align: center; margin-top: 10px; }
    .stage { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <div class="stage">
    <div id="idle" style="position:relative;"></div>
    <div class="label">Idle</div>
  </div>
  <div class="stage">
    <div id="speaking" style="position:relative;"></div>
    <div class="label">Speaking</div>
  </div>
  <div class="stage">
    <div id="listening" style="position:relative;"></div>
    <div class="label">Listening</div>
  </div>

  <script src="/assets/js/characters.js"></script>
  <script>
    // Wait for characters.js to init, then clone alien into our test stages
    // characters.js creates its own container in #main-area, but we don't have that.
    // So we'll manually build the alien character for testing.
  </script>
  <script>
    (function() {
      // Grab the alien CSS and SVG from characters.js by re-defining inline
      // Actually, characters.js won't init without #main-area. Let's just inline the alien for testing.

      var alienCSS = document.createElement('style');
      alienCSS.textContent = '\
        .alien-char { position: relative; width: 110px; height: 130px; }\
        .alien .antennae { position: absolute; top: 0; left: 50%; width: 60px; margin-left: -30px; height: 30px; }\
        .alien .antenna { position: absolute; bottom: 0; width: 3px; height: 28px; background: linear-gradient(to top, #2a2a2a, #555); border-radius: 3px; }\
        .alien .antenna::after { content: ""; position: absolute; top: -8px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7dfff0, #36e2f8 50%, #1a8a9e); box-shadow: 0 0 8px rgba(54,226,248,0.6), 0 0 16px rgba(54,226,248,0.3); animation: alien-glow 2s ease-in-out infinite alternate; }\
        .alien .antenna_left { left: 8px; transform: rotate(-15deg); transform-origin: bottom center; animation: alien-sway-left 3s ease-in-out infinite alternate; }\
        .alien .antenna_right { right: 8px; transform: rotate(15deg); transform-origin: bottom center; animation: alien-sway-right 3s ease-in-out infinite alternate; }\
        .alien .head { position: absolute; top: 18px; left: 10px; width: 90px; height: 75px; border-radius: 50% 50% 48% 48%; background: linear-gradient(to right, #e8d5c4 0%, #f5e6d3 35%, #f5e6d3 65%, #e0cfc0 100%); transform-origin: 50% 100%; animation: alien-bob 7000ms ease-in-out alternate infinite -500ms; overflow: visible; }\
        .alien .hair { position: absolute; top: -4px; left: -8px; right: -8px; height: 55px; background: #1a1a1a; border-radius: 52px 52px 6px 6px; z-index: 1; }\
        .alien .hair::before { content: ""; position: absolute; bottom: -18px; left: -2px; width: 28px; height: 30px; background: #1a1a1a; border-radius: 0 0 0 16px; }\
        .alien .hair::after { content: ""; position: absolute; bottom: -18px; right: -2px; width: 28px; height: 30px; background: #1a1a1a; border-radius: 0 0 16px 0; }\
        .alien .fringe { position: absolute; top: 14px; left: 4px; right: 30px; height: 18px; background: #1a1a1a; border-radius: 0 0 20px 4px; z-index: 3; }\
        .alien .face { position: absolute; inset: 0; z-index: 2; }\
        .alien .eyes { position: absolute; top: 32px; left: 14px; right: 14px; height: 20px; animation: alien-blink 8000ms linear forwards infinite; z-index: 4; }\
        .alien .eyeball { position: absolute; width: 22px; height: 20px; background: radial-gradient(ellipse at 45% 40%, #fff 0%, #fff 30%, #e8b4d9 55%, #d17fb8 70%) no-repeat center; background-size: 100%; border-radius: 50%; border: 1.5px solid #333; }\
        .alien .eyeball::after { content: ""; position: absolute; top: 5px; left: 7px; width: 9px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #6a2c91 0%, #4a1a6b 60%, #2d0f42 100%); }\
        .alien .eyeball::before { content: ""; position: absolute; top: 6px; left: 9px; width: 3px; height: 3px; border-radius: 50%; background: #fff; z-index: 1; }\
        .alien .eyeball_left { left: 0; }\
        .alien .eyeball_right { right: 0; }\
        .alien .eyelash { position: absolute; top: -3px; width: 22px; height: 4px; border-top: 2px solid #1a1a1a; border-radius: 50% 50% 0 0; }\
        .alien .eyelash_left { left: 0; }\
        .alien .eyelash_right { right: 0; }\
        .alien .mouth { position: absolute; bottom: 14px; left: 35px; width: 18px; height: 4px; background-color: #c47070; overflow: hidden; border-radius: 6px; transition: height 100ms cubic-bezier(0.455,0.03,0.515,0.955); z-index: 4; }\
        .alien .mouth-container { position: absolute; inset: 0; }\
        .alien .mouth-container-line { position: absolute; top: 30%; height: 0; background-color: #e8a0a0; width: 100%; margin-top: -1px; }\
        .alien.char_speaking .mouth { height: 10px; }\
        .alien.char_speaking .mouth-container { animation: alien-speakingAnim 0.3s infinite; }\
        .alien.char_speaking .mouth-container-line { height: 3px; }\
        .alien.char_listening .mouth { height: 5px; }\
        .alien.char_listening .mouth-container { animation: alien-listeningAnim 0.5s infinite; }\
        .alien.char_listening .mouth-container-line { height: 2px; }\
        .alien .cheeks { position: absolute; bottom: 20px; left: 8px; right: 8px; height: 10px; z-index: 3; pointer-events: none; }\
        .alien .cheek { position: absolute; width: 14px; height: 8px; border-radius: 50%; background: rgba(230,140,140,0.35); }\
        .alien .cheek_left { left: 2px; }\
        .alien .cheek_right { right: 2px; }\
        @keyframes alien-bob { 0% { transform: rotate(-2deg) translateY(0); } 40% { transform: rotate(-2deg) translateY(0); animation-timing-function: cubic-bezier(1,0,0,1); } 60% { transform: rotate(2deg) translateY(-2px); } 100% { transform: rotate(2deg) translateY(-2px); } }\
        @keyframes alien-blink { 48% { transform: scale(1,1); } 49% { transform: scale(1,0.05); } 50% { transform: scale(1,1); } }\
        @keyframes alien-sway-left { 0% { transform: rotate(-15deg); } 100% { transform: rotate(-10deg); } }\
        @keyframes alien-sway-right { 0% { transform: rotate(15deg); } 100% { transform: rotate(10deg); } }\
        @keyframes alien-glow { 0% { box-shadow: 0 0 6px rgba(54,226,248,0.4), 0 0 12px rgba(54,226,248,0.2); } 100% { box-shadow: 0 0 12px rgba(54,226,248,0.8), 0 0 24px rgba(54,226,248,0.4); } }\
        @keyframes alien-speakingAnim { 0% { filter: url("#alien-speaking-0"); } 25% { filter: url("#alien-speaking-1"); } 50% { filter: url("#alien-speaking-2"); } 75% { filter: url("#alien-speaking-3"); } 100% { filter: url("#alien-speaking-4"); } }\
        @keyframes alien-listeningAnim { 0% { filter: url("#alien-listening-0"); } 25% { filter: url("#alien-listening-1"); } 50% { filter: url("#alien-listening-2"); } 75% { filter: url("#alien-listening-3"); } 100% { filter: url("#alien-listening-4"); } }\
      ';
      document.head.appendChild(alienCSS);

      // SVG filters
      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('style', 'display:none');
      svg.innerHTML = '<defs>\
        <filter id="alien-speaking-0"><feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="0"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="10"/></filter>\
        <filter id="alien-speaking-1"><feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="30"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="11"/></filter>\
        <filter id="alien-speaking-2"><feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="2"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="10"/></filter>\
        <filter id="alien-speaking-3"><feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="30"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="11"/></filter>\
        <filter id="alien-speaking-4"><feTurbulence baseFrequency="0.1" numOctaves="3" result="noise" seed="4"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/></filter>\
        <filter id="alien-listening-0"><feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="0"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/></filter>\
        <filter id="alien-listening-1"><feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="30"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/></filter>\
        <filter id="alien-listening-2"><feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="2"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/></filter>\
        <filter id="alien-listening-3"><feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="30"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/></filter>\
        <filter id="alien-listening-4"><feTurbulence baseFrequency="0.1" numOctaves="3" result="noise" seed="4"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1"/></filter>\
      </defs>';
      document.body.appendChild(svg);

      var alienHTML = '\
        <div class="alien-char">\
          <div class="alien" data-char-el>\
            <div class="antennae">\
              <div class="antenna antenna_left"></div>\
              <div class="antenna antenna_right"></div>\
            </div>\
            <div class="head">\
              <div class="hair"></div>\
              <div class="fringe"></div>\
              <div class="face">\
                <div class="eyes">\
                  <div class="eyelash eyelash_left"></div>\
                  <div class="eyelash eyelash_right"></div>\
                  <div class="eyeball eyeball_left"></div>\
                  <div class="eyeball eyeball_right"></div>\
                </div>\
                <div class="cheeks"><div class="cheek cheek_left"></div><div class="cheek cheek_right"></div></div>\
                <div class="mouth"><div class="mouth-container"><div class="mouth-container-line"></div></div></div>\
              </div>\
            </div>\
          </div>\
        </div>';

      // Idle
      document.getElementById('idle').innerHTML = alienHTML;

      // Speaking
      document.getElementById('speaking').innerHTML = alienHTML;
      document.getElementById('speaking').querySelector('.alien').classList.add('char_speaking');

      // Listening
      document.getElementById('listening').innerHTML = alienHTML;
      document.getElementById('listening').querySelector('.alien').classList.add('char_listening');
    })();
  </script>
</body>
</html>
