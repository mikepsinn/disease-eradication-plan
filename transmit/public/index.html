<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argue With Wishonia</title>
  <meta name="description" content="I've been watching your planet since 1945. Your species spends 604x more on weapons than testing which medicines work. I would like to help you stop doing that.">
  <meta property="og:description" content="I've been watching your planet since 1945. Your species spends 604x more on weapons than testing which medicines work. I would like to help you stop doing that.">
  <meta property="og:title" content="Argue With Wishonia">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/icons/h2ewd-og-1200x630.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="/assets/icons/h2ewd-og-1200x630.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/book-favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/book-favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/book-apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css?family=Orbitron:400,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/chat-widget.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d; color: #ececec;
      display: flex;
    }

    /* === Sidebar === */
    .sidebar {
      width: 260px; background: #111;
      border-right: 1px solid rgba(54,226,248,0.1);
      display: flex; flex-direction: column; flex-shrink: 0;
      z-index: 20; transition: transform 0.2s;
    }
    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(54,226,248,0.1);
    }
    .new-chat-btn {
      width: 100%; padding: 10px 16px;
      background: rgba(209,0,177,0.15); color: #C6CBF5;
      border: 1px solid rgba(209,0,177,0.3); border-radius: 8px;
      cursor: pointer; font-size: 14px;
      font-family: 'Orbitron', sans-serif; letter-spacing: 0.05em;
      transition: all 0.2s;
    }
    .new-chat-btn:hover {
      background: rgba(209,0,177,0.25); border-color: rgba(209,0,177,0.5);
    }
    .chat-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .chat-list-item {
      display: flex; align-items: center;
      padding: 10px 16px; cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s; font-size: 13px; color: #999;
    }
    .chat-list-item:hover { background: rgba(255,255,255,0.04); color: #ccc; }
    .chat-list-item.active {
      background: rgba(209,0,177,0.08);
      border-left-color: #d100b1; color: #ececec;
    }
    .chat-list-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-list-delete {
      opacity: 0; color: #666; background: none; border: none;
      cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1;
      transition: opacity 0.15s;
    }
    .chat-list-item:hover .chat-list-delete { opacity: 1; }
    .chat-list-delete:hover { color: #ff4444; }

    /* Sidebar toggle (all screen sizes) */
    .sidebar-toggle {
      position: absolute; top: 12px; left: 12px; z-index: 30;
      background: rgba(20,10,30,0.8); border: 1px solid rgba(54,226,248,0.2);
      color: #C6CBF5; font-size: 18px; padding: 5px 9px; border-radius: 6px; cursor: pointer;
      transition: all 0.2s; line-height: 1;
    }
    .sidebar-toggle:hover { background: rgba(209,0,177,0.2); border-color: rgba(209,0,177,0.4); }

    /* Sidebar collapse (desktop: starts collapsed) */
    .sidebar { transition: width 0.2s, transform 0.2s; overflow: hidden; }
    .sidebar:not(.open) { width: 0; min-width: 0; border-right: none; }
    .sidebar.open { width: 260px; }

    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 15;
    }
    .hamburger { display: none; }
    @media (max-width: 800px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 260px !important; }
      .sidebar:not(.open) { transform: translateX(-100%); width: 260px !important; }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.show { display: block; }
    }

    /* === Main area === */
    .main-area { flex: 1; position: relative; min-width: 0; }
    .bg-grid {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at center bottom, rgba(127,0,173,0.15) 0%, transparent 60%);
    }

    /* === Chat widget overrides === */
    .chat-fab { display: none !important; }
    .chat-panel, .chat-panel.chat-visible {
      position: absolute !important; inset: 0 !important;
      width: 100% !important; height: 100% !important; max-height: 100% !important;
      border-radius: 0 !important; border: none !important; box-shadow: none !important;
      display: flex !important; flex-direction: column !important;
      z-index: 5 !important; background: #0d0d0d !important;
      animation: none !important;
    }
    .chat-header {
      background: rgba(20,10,30,0.95) !important;
      padding: 10px 20px !important; border-bottom: 1px solid rgba(54,226,248,0.15);
      flex-shrink: 0 !important; position: relative;
    }
    .chat-header-title {
      font-family: 'Orbitron', sans-serif !important; font-size: 13px !important;
      letter-spacing: 0.1em !important; text-transform: uppercase;
      background: linear-gradient(90deg, #C6CBF5, #d100b1);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .chat-fullscreen-btn, .chat-close-btn { display: none !important; }
    .chat-newchat-btn {
      display: flex !important; position: absolute; right: 16px; top: 50%;
      transform: translateY(-50%); font-size: 16px; opacity: 0.7;
    }
    .chat-share-btn {
      display: flex !important; position: absolute; right: 48px; top: 50%;
      transform: translateY(-50%); font-size: 16px; opacity: 0.7;
      background: none; border: none; cursor: pointer; color: #C6CBF5;
    }
    .chat-share-btn:hover { opacity: 1; }
    .chat-shared-header {
      text-align: center; padding: 8px; margin-bottom: 12px;
      color: #888; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      border-bottom: 1px solid rgba(54,226,248,0.1);
    }
    .chat-messages {
      flex: 1 1 0 !important; min-height: 0 !important;
      overflow-y: auto !important; background: transparent !important;
      padding: 24px 16px !important; width: 100%;
    }
    .chat-msg {
      max-width: 100% !important; border-radius: 8px !important;
      font-size: 18px !important; line-height: 1.7 !important;
      padding: 14px 16px !important; background: transparent !important;
    }
    .chat-msg-user {
      background: rgba(54,226,248,0.08) !important; color: #ececec !important;
      border: 1px solid rgba(54,226,248,0.15); border-radius: 12px !important;
      align-self: flex-end !important; max-width: 80% !important;
    }
    .chat-msg-assistant {
      background: rgba(209,0,177,0.07) !important; color: #d1d1d1 !important;
      border: 1px solid rgba(209,0,177,0.15); border-radius: 12px !important;
      align-self: flex-start !important; max-width: 80% !important;
    }
    .chat-welcome { color: #888 !important; padding: 60px 20px !important; }
    .chat-welcome p { font-size: 16px !important; color: #aaa; }
    .chat-hints { max-width: 500px; margin: 16px auto 0; }
    .chat-hint-btn {
      background: rgba(20,10,40,0.6) !important; color: #C6CBF5 !important;
      border: 1px solid rgba(54,226,248,0.2) !important; border-radius: 8px !important;
      font-size: 14px !important; transition: all 0.2s !important;
    }
    .chat-hint-btn:hover {
      border-color: #d100b1 !important; background: rgba(209,0,177,0.08) !important;
    }
    .chat-input-area {
      background: rgba(20,10,30,0.95) !important;
      border-top: 1px solid rgba(54,226,248,0.15) !important;
      padding: 12px 20px !important; flex-shrink: 0 !important;
      width: 100%; position: relative; z-index: 25;
    }
    .chat-input {
      background: rgba(255,255,255,0.06) !important; color: #ececec !important;
      border: 1px solid rgba(255,255,255,0.12) !important; border-radius: 12px !important;
      font-size: 15px !important; padding: 12px 16px !important;
    }
    .chat-input:focus {
      border-color: rgba(209,0,177,0.5) !important;
      box-shadow: 0 0 0 2px rgba(209,0,177,0.15) !important;
    }
    .chat-input::placeholder { color: #666; }
    .chat-send-btn { background: #d100b1 !important; }
    .chat-send-btn:hover { filter: brightness(1.2); }
    .chat-voicechat-btn {
      background: rgba(255,255,255,0.06) !important; color: #C6CBF5 !important;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .chat-voicechat-btn.voice-active {
      background: #28a745 !important; color: #fff !important;
      border-color: #28a745 !important;
    }
    .chat-msg a { color: #36E2F8 !important; }
    .chat-typing { color: #888; }
    .chat-thinking-quip { color: #888 !important; }
    .chat-waveform-bar { background: #d100b1 !important; }
    .chat-listening-ring { border-color: #d100b1 !important; }
    .chat-voice-loading span, .chat-listening-indicator span { color: #888; }
    .chat-tts-btn { color: #888 !important; }
    .chat-tts-btn:hover { color: #d100b1 !important; }
    .chat-voice-card { background: rgba(255,255,255,0.04) !important; }
    .chat-thinking summary { color: #666 !important; }
    .chat-thinking-text {
      background: rgba(0,0,0,0.3) !important; color: #888 !important;
      border-color: rgba(255,255,255,0.08) !important;
    }
    .chat-voice-note { color: #666 !important; }
    .chat-codeblock { background: rgba(255,255,255,0.06) !important; color: #ccc !important; }
    .chat-inline-code { background: rgba(255,255,255,0.08) !important; color: #ddd !important; }
    .chat-blockquote { border-left-color: #d100b1 !important; color: #999 !important; }
    .chat-source-pill {
      background: rgba(209,0,177,0.1) !important; color: #C6CBF5 !important;
      border-color: rgba(209,0,177,0.3) !important;
    }
    .chat-source-pill:hover {
      background: rgba(209,0,177,0.2) !important; border-color: #d100b1 !important;
    }
    .chat-image-thumb { border: 1px solid rgba(255,255,255,0.08); }
    .chat-latex-pending { color: #888 !important; }
    .chat-stop-btn {
      background: rgba(255,255,255,0.06) !important; color: #C6CBF5 !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
    }
    .chat-stop-btn:hover { background: #d9534f !important; color: #fff !important; }
    .chat-copy-btn { color: #888 !important; }
    .chat-copy-btn:hover { color: #d100b1 !important; }
    .chat-scroll-bottom {
      background: rgba(20,10,30,0.9) !important; color: #C6CBF5 !important;
      border: 1px solid rgba(54,226,248,0.2) !important;
    }
    .chat-scroll-bottom:hover { background: rgba(209,0,177,0.2) !important; }

    /* Share dialog */
    .chat-share-overlay {
      position: absolute; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
    }
    .chat-share-dialog {
      background: #1a1a2e; border: 1px solid rgba(209,0,177,0.3); border-radius: 12px;
      padding: 24px; max-width: 400px; width: 90%; color: #ececec;
    }
    .chat-share-dialog-title {
      font-family: 'Orbitron', sans-serif; font-size: 16px; margin-bottom: 12px;
      background: linear-gradient(90deg, #C6CBF5, #d100b1);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .chat-share-dialog p { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 16px; }
    .chat-share-dialog strong { color: #ff6b6b; }
    .chat-share-confirm-label {
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ccc;
      cursor: pointer; margin-bottom: 20px;
    }
    .chat-share-confirm-check { accent-color: #d100b1; width: 16px; height: 16px; cursor: pointer; }
    .chat-share-dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .chat-share-cancel-btn {
      padding: 8px 16px; background: rgba(255,255,255,0.06); color: #aaa;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .chat-share-cancel-btn:hover { background: rgba(255,255,255,0.1); }
    .chat-share-go-btn {
      padding: 8px 16px; background: #d100b1; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .chat-share-go-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-share-go-btn:not(:disabled):hover { filter: brightness(1.2); }

    /* Characters injected by characters.js */
  </style>
</head>
<body>
  <!-- Mobile hamburger -->
  <button class="hamburger" id="hamburger-btn">&#9776;</button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar: chat history -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
    </div>
    <div class="chat-list" id="chat-list"></div>
  </div>

  <!-- Main chat area -->
  <div class="main-area" id="main-area">
    <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
    <div class="bg-grid"></div>

    <!-- Characters injected by characters.js -->
  </div>

  <script src="/assets/js/characters.js" defer></script>
  <script src="/assets/js/gemini-live-client.js" defer></script>
  <script src="/assets/js/audio-utils.js" defer></script>
  <script src="/assets/js/chat-storage.js" defer></script>
  <script src="/assets/js/chat-widget.js" defer></script>
  <script>
  (function () {
    var STORE_KEY = 'wishonia-chats';

    function loadStore() {
      try {
        var raw = localStorage.getItem(STORE_KEY);
        if (raw) { var p = JSON.parse(raw); if (p && p.chats) return p; }
      } catch (_) {}
      return { current: null, chats: {} };
    }

    function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

    function genId() { return 'chat-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9); }

    function chatTitle(chat) {
      if (chat.title) return chat.title;
      for (var i = 0; i < (chat.messages || []).length; i++) {
        if (chat.messages[i].role === 'user') return chat.messages[i].content.substring(0, 50);
      }
      return 'New chat';
    }

    var store = loadStore();

    // Ensure at least one chat exists
    if (Object.keys(store.chats).length === 0) {
      var id = genId();
      store.chats[id] = { id: id, title: '', created: new Date().toISOString(), messages: [] };
      store.current = id;
      saveStore();
    }

    // Load current chat into sessionStorage so the widget picks it up
    var cur = store.chats[store.current];
    if (cur && cur.messages && cur.messages.length > 0) {
      sessionStorage.setItem('wishonia-chat', JSON.stringify(cur.messages));
    } else {
      sessionStorage.removeItem('wishonia-chat');
    }

    function renderSidebar() {
      var list = document.getElementById('chat-list');
      if (!list) return;
      list.innerHTML = '';
      var ids = Object.keys(store.chats).sort(function (a, b) {
        return new Date(store.chats[b].created).getTime() - new Date(store.chats[a].created).getTime();
      });
      ids.forEach(function (cid) {
        var chat = store.chats[cid];
        var item = document.createElement('div');
        item.className = 'chat-list-item' + (cid === store.current ? ' active' : '');

        var title = document.createElement('span');
        title.className = 'chat-list-title';
        title.textContent = chatTitle(chat);

        var del = document.createElement('button');
        del.className = 'chat-list-delete';
        del.innerHTML = '&times;';
        del.title = 'Delete chat';
        del.addEventListener('click', function (e) { e.stopPropagation(); deleteChat(cid); });

        item.appendChild(title);
        item.appendChild(del);
        item.addEventListener('click', function () { switchChat(cid); });
        list.appendChild(item);
      });
    }

    function saveCurrent() {
      if (!store.current || !window.wishoniaChatWidget) return;
      var msgs = window.wishoniaChatWidget.getMessages();
      if (!store.chats[store.current]) return;
      store.chats[store.current].messages = msgs;
      if (!store.chats[store.current].title) {
        for (var i = 0; i < msgs.length; i++) {
          if (msgs[i].role === 'user') {
            store.chats[store.current].title = msgs[i].content.substring(0, 50);
            break;
          }
        }
      }
      saveStore();
      renderSidebar();
    }

    function createNewChat() {
      saveCurrent();
      var id = genId();
      store.chats[id] = { id: id, title: '', created: new Date().toISOString(), messages: [] };
      store.current = id;
      saveStore();
      if (window.wishoniaChatWidget) window.wishoniaChatWidget.startNewChat();
      renderSidebar();
      closeMobile();
    }

    function switchChat(cid) {
      if (cid === store.current) { closeMobile(); return; }
      saveCurrent();
      store.current = cid;
      saveStore();
      var chat = store.chats[cid];
      if (window.wishoniaChatWidget) window.wishoniaChatWidget.loadChat(chat ? chat.messages : []);
      renderSidebar();
      closeMobile();
    }

    function deleteChat(cid) {
      delete store.chats[cid];
      if (store.current === cid) {
        var remaining = Object.keys(store.chats);
        if (remaining.length > 0) {
          store.current = remaining[0];
          var chat = store.chats[store.current];
          if (window.wishoniaChatWidget) window.wishoniaChatWidget.loadChat(chat ? chat.messages : []);
        } else {
          createNewChat();
          return;
        }
      }
      saveStore();
      renderSidebar();
    }

    function closeMobile() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('show');
    }

    // --- DOM ready ---
    document.addEventListener('DOMContentLoaded', function () {
      // Sidebar toggle (works on all screen sizes)
      document.getElementById('sidebar-toggle').addEventListener('click', function () {
        var sb = document.getElementById('sidebar');
        sb.classList.toggle('open');
        // On mobile, also toggle overlay
        if (window.innerWidth <= 800) {
          document.getElementById('sidebar-overlay').classList.toggle('show');
        }
      });
      document.getElementById('hamburger-btn').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('show');
      });
      document.getElementById('sidebar-overlay').addEventListener('click', closeMobile);

      // New chat button
      document.getElementById('new-chat-btn').addEventListener('click', createNewChat);

      renderSidebar();

      // Auto-open widget panel and move into main area
      setTimeout(function () {
        var fab = document.querySelector('.chat-fab');
        if (fab) fab.click();
        // Reparent panel into main-area so sidebar doesn't cover it
        var chatPanel = document.querySelector('.chat-panel');
        var mainArea = document.getElementById('main-area');
        if (chatPanel && mainArea) mainArea.appendChild(chatPanel);
        if (window.positionCharacters) window.positionCharacters();
      }, 150);

      // Periodic sync to localStorage
      setInterval(saveCurrent, 3000);
    });
  })();
  </script>
</body>
</html>
