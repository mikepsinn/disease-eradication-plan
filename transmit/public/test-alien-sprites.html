<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alien Sprite Test</title>
  <style>
    body { background: #0d0d0d; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; gap: 80px; flex-direction: column; }
    .label { color: #888; font-family: sans-serif; font-size: 13px; text-align: center; margin-top: 8px; }
    .stages { display: flex; gap: 80px; align-items: flex-end; }

    .alien-sprite {
      position: relative;
      width: 150px;
      height: 330px;
    }
    .alien-sprite .head-group {
      position: relative;
      width: 150px;
      height: 188px;
      animation: bob 7s ease-in-out alternate infinite;
    }
    .alien-sprite .head-group img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .alien-sprite .body-img {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 160px;
      object-fit: contain;
    }
    /* All variants stacked, only active one visible */
    .alien-sprite .head-group .head-idle    { opacity: 1; }
    .alien-sprite .head-group .head-blink   { opacity: 0; }
    .alien-sprite .head-group .head-speaking { opacity: 0; }
    .alien-sprite .head-group .head-listening { opacity: 0; }

    /* Blink: briefly show blink frame */
    @keyframes do-blink {
      0%, 96%  { opacity: 0; }
      97%, 99% { opacity: 1; }
      100%     { opacity: 0; }
    }
    .alien-sprite .head-group .head-blink { animation: do-blink 6s linear infinite; }
    @keyframes hide-for-blink {
      0%, 96%  { opacity: 1; }
      97%, 99% { opacity: 0; }
      100%     { opacity: 1; }
    }

    /* Speaking state */
    .alien-sprite.speaking .head-group .head-idle { animation: none; opacity: 0; }
    .alien-sprite.speaking .head-group .head-blink { animation: none; opacity: 0; }
    .alien-sprite.speaking .head-group .head-speaking { opacity: 1; }

    /* Listening state */
    .alien-sprite.listening .head-group .head-idle { animation: none; opacity: 0; }
    .alien-sprite.listening .head-group .head-blink { animation: none; opacity: 0; }
    .alien-sprite.listening .head-group .head-listening { opacity: 1; }

    /* Idle blink */
    .alien-sprite:not(.speaking):not(.listening) .head-group .head-idle {
      animation: hide-for-blink 6s linear infinite;
    }

    @keyframes bob {
      0%   { transform: rotate(-2deg) translateY(0); }
      40%  { transform: rotate(-2deg) translateY(0); }
      60%  { transform: rotate(2deg) translateY(-3px); }
      100% { transform: rotate(2deg) translateY(-3px); }
    }
  </style>
</head>
<body>
  <h2 style="color:#666; font-family:sans-serif; font-size:14px;">Alien Head Sprites</h2>
  <div class="stages">
    <div>
      <div class="alien-sprite">
        <div class="head-group">
          <img class="head-idle" src="/assets/sprites/alien/head-idle.png">
          <img class="head-blink" src="/assets/sprites/alien/head-blink.png" onerror="this.style.display='none'">
          <img class="head-speaking" src="/assets/sprites/alien/head-speaking.png">
          <img class="head-listening" src="/assets/sprites/alien/head-listening.png" onerror="this.style.display='none'">
        </div>
        <img class="body-img" src="/assets/sprites/alien/body.png" onerror="this.style.display='none'">
      </div>
      <div class="label">Idle (blinks)</div>
    </div>
    <div>
      <div class="alien-sprite speaking">
        <div class="head-group">
          <img class="head-idle" src="/assets/sprites/alien/head-idle.png">
          <img class="head-blink" src="/assets/sprites/alien/head-blink.png" onerror="this.style.display='none'">
          <img class="head-speaking" src="/assets/sprites/alien/head-speaking.png">
          <img class="head-listening" src="/assets/sprites/alien/head-listening.png" onerror="this.style.display='none'">
        </div>
        <img class="body-img" src="/assets/sprites/alien/body.png" onerror="this.style.display='none'">
      </div>
      <div class="label">Speaking</div>
    </div>
    <div>
      <div class="alien-sprite listening">
        <div class="head-group">
          <img class="head-idle" src="/assets/sprites/alien/head-idle.png">
          <img class="head-blink" src="/assets/sprites/alien/head-blink.png" onerror="this.style.display='none'">
          <img class="head-speaking" src="/assets/sprites/alien/head-speaking.png">
          <img class="head-listening" src="/assets/sprites/alien/head-listening.png" onerror="this.style.display='none'">
        </div>
        <img class="body-img" src="/assets/sprites/alien/body.png" onerror="this.style.display='none'">
      </div>
      <div class="label">Listening</div>
    </div>
  </div>
</body>
</html>
