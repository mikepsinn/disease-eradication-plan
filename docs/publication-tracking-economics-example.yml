  # Publication tracking (ADD THIS SECTION)
  publishing:
    own-site:
      url: "https://impact.warondisease.org"
      status: deployed
      deploy-trigger: push-to-main
      last-deployed: "2025-01-19"

    preprints:
      - platform: zenodo
        category: archive
        status: auto-uploaded
        url: ""  # Check https://zenodo.org/me/uploads for draft
        doi: ""  # Will be assigned when published
        version-doi: ""
        upload-date: ""
        notes: "CI auto-uploads draft on every push to master"

      - platform: ssrn
        category: preprint
        status: pending
        url: ""
        target-collection: "Health Economics"
        notes: "Manual upload - good for economics papers"

      - platform: arxiv
        category: preprint
        status: pending
        url: ""
        category-code: "econ.GN"  # General Economics
        endorsement: required
        notes: "Requires endorsement for first submission"

      - platform: osf-preprints
        category: preprint
        status: pending
        url: ""
        doi: ""
        notes: "Open Science Framework - can automate via API"

    academic-networks:
      - platform: researchgate
        status: pending
        url: ""
        profile: "https://www.researchgate.net/profile/Mike-Sinn"

      - platform: academia-edu
        status: pending
        url: ""

      - platform: google-scholar
        status: pending
        url: ""
        notes: "Will auto-index after preprints published"

    journals:
      # Tier 1: High-impact health policy journals
      - name: "Health Affairs"
        tier: 1
        category: health-policy
        impact-factor: 7.5
        status: target
        article-type: "research-article"
        url: ""
        submission-date: ""
        notes: "Premier health policy journal - perfect fit for treaty analysis"

      - name: "The Lancet"
        tier: 1
        category: medical-journal
        impact-factor: 202.7
        status: target
        article-type: commentary
        word-limit: 1200
        url: ""
        notes: "Could submit condensed version as commentary/viewpoint"

      - name: "JAMA Health Forum"
        tier: 1
        category: health-policy
        status: target
        url: ""
        notes: "JAMA's health policy journal"

      # Tier 2: Health economics journals
      - name: "Value in Health"
        tier: 2
        category: health-economics
        impact-factor: 5.9
        status: target
        url: ""
        notes: "ISPOR journal - health economics and outcomes research"

      - name: "Journal of Health Economics"
        tier: 2
        category: health-economics
        impact-factor: 3.4
        status: target
        url: ""

      - name: "PharmacoEconomics"
        tier: 2
        category: health-economics
        impact-factor: 4.4
        status: target
        url: ""

      # Tier 2: Open access medical journals
      - name: "PLOS Medicine"
        tier: 2
        category: medical-journal
        impact-factor: 10.5
        open-access: true
        apc: "$3000"  # Article Processing Charge
        status: target
        url: ""

      - name: "BMJ Open"
        tier: 2
        category: medical-journal
        impact-factor: 3.0
        open-access: true
        apc: "£2300"
        status: target
        url: ""

      # Tier 3: Economics journals (if positioning as economics paper)
      - name: "NBER Working Paper Series"
        tier: 2
        category: economics
        status: target
        url: ""
        notes: "National Bureau of Economic Research - prestigious working papers"

      - name: "American Economic Review"
        tier: 1
        category: economics
        impact-factor: 10.7
        status: long-shot
        url: ""
        notes: "Top economics journal - very competitive"

    social-media:
      - platform: twitter
        account: "@warondisease"
        status: pending
        post-url: ""
        post-date: ""
        thread: true

      - platform: twitter
        account: "@thinkbynumbers"
        status: pending
        post-url: ""

      - platform: linkedin
        status: pending
        post-url: ""
        post-type: article  # Article vs regular post

    outreach:
      - type: press-release
        status: pending
        target-outlets: ["Health Affairs Blog", "STAT News"]
        url: ""

      - type: blog-post
        title: "How a 1% Military Budget Shift Could Transform Global Health"
        status: pending
        platform: medium
        url: ""

      - type: newsletter
        platform: substack
        status: pending
        url: ""

# Submission priority order:
# 1. Zenodo (automated) ✓ Already happening via CI
# 2. SSRN (manual) - Target date: Week 1
# 3. OSF Preprints (can automate) - Target date: Week 1
# 4. ResearchGate + Academia.edu - Target date: Week 2
# 5. Submit to Health Affairs (peer review) - Target date: Week 3
# 6. Alternative journals if rejected - Ongoing

# Notes:
# - Start with preprints to establish priority and get DOI
# - Use preprint DOI when submitting to journals
# - Some journals require preprints be disclosed; others prohibit them
# - Health Affairs allows preprints: https://www.healthaffairs.org/journal/hlthaff/authors-guide
