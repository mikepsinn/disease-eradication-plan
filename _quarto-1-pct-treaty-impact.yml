book:
  title: "The 1% Treaty: Harnessing Greed to Eradicate Disease"
  author:
    - name: Mike P. Sinn
      email: feedback@dih.earth
      orcid: 0009-0006-0212-1094
      affiliations:
        - name: "Decentralized Institutes of Health (DIH)"
          url: https://dih.earth
  # description: Removed to allow page-level descriptions to override for og:description
  # Original: "Quantitative analysis showing how redirecting 1% of global military spending ($27.2B/year) to pragmatic clinical trials could advance treatment access by 207 years, save 10.5 billion life-years, and generate $30 quadrillion in long-run economic value."
  abstract: "6.65k diseases (95% CI: 5.70k diseases-8.24k diseases) diseases have 0 FDA-approved treatments. At current trial capacity (15 diseases/year (95% CI: 8 diseases/year-30 diseases/year) new first treatments/year), exploring the therapeutic search space takes ~443 years (95% CI: 324 years-712 years). Redirect 1% of military spending ($27.2B/year) to pragmatic clinical trials. Trial capacity jumps 12.3x (95% CI: 4.19x-61.3x). Search space explored in ~36 years (95% CI: 11.6 years-77.2 years) instead of centuries. Average treatment reaches patients 212 years (95% CI: 135 years-355 years) sooner. Timeline shift saves 10.7B deaths (95% CI: 7.39B deaths-16.2B deaths), valued at $84.8 quadrillion (95% CI: $62.4 quadrillion-$97.3 quadrillion). Cost-effectiveness: $0.0018 (95% CI: $0.0007-$0.0041)/DALY, 50.3kx (95% CI: 23.7kx-111.7kx) better than bed nets. Even at 1% (95% CI: 0.1%-10%) probability of treaty adoption, risk-adjusted cost-effectiveness remains superior to the best existing global health interventions. Incentive Alignment Bonds address political feasibility by tying legislators' career incentives to a public voting scorecard."
  site-url: https://impact.warondisease.org
  favicon: assets/icons/economics-favicon.png
  page-navigation: true
  chapters:
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd
    - knowledge/references.qmd
  navbar:
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /1-percent-treaty-impact.pdf
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "References"
        href: knowledge/references.qmd
      - text: "VOTE"
        href: https://warondisease.org
  sidebar:
    collapse-level: 1
    style: "floating"
    search: true
    contents:
      - section: "Academic Paper"
        contents:
          - href: index.html
            text: "The 1% Treaty: Economic Analysis"
          - href: knowledge/references.qmd
            text: "References & Citations"

      - section: "Appendices"
        contents:
          - href: knowledge/appendix/parameters-and-calculations.qmd
            text: "Parameters & Calculations"

      - section: "Related Materials"
        contents:
          - href: https://invisible-graveyard.warondisease.org
            text: "Invisible Graveyard Paper →"
          - href: https://iab.warondisease.org
            text: "IAB Working Paper →"
          - href: https://paper.wishocracy.org
            text: "Wishocracy Working Paper →"

