project:
  type: website
  output-dir: _site/algorithmic-public-administration
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "⚡"
  index-source: knowledge/appendix/algorithmic-public-administration.qmd
  redirect-from: https://apa.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: ""  # TODO: Create Netlify site and add ID
  netlify-cname: "apa-warondisease-org.netlify.app"
  show-confidence-intervals: true  # Show 95% CI ranges for calculated values in academic papers
  concept-terms:
    - term: "Algorithmic Public Administration"
      manual-target: knowledge/futures/wishonia.qmd
      aliases:
        - "APA Protocol"
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A minimalist circuit board pattern forming interconnected nodes, clean lines, technical blueprint style."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "Algorithmic Public Administration: A Protocol for Replacing Government Intermediaries with Deterministic Functions"
  description: 'A protocol combining five primitives (transparent ledger, preference aggregation, evidence engine, identity verification, automated monetary policy) to replace mechanical government agency functions, eliminating administrative intermediation costs while preserving democratic control.'
  site-url: https://manual.warondisease.org/knowledge/appendix/algorithmic-public-administration.html
  favicon: assets/icons/algorithmic-public-administration-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/algorithmic-public-administration.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

