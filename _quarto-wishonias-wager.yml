project:
  type: website
  output-dir: _site/wishonias-wager
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "♾️"
  index-source: knowledge/proof/wishonias-wager.qmd
  redirect-from: https://wager.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  pdf-output-file: wishonias-wager.pdf
  # TODO: create a dedicated Netlify site and replace this ID before first deploy.
  # Until then this points at the shared manual site app so local renders succeed.
  netlify-site-id: "REPLACE_WITH_NEW_NETLIFY_SITE_ID"
  netlify-cname: "manual-warondisease-org.netlify.app"
  show-confidence-intervals: true  # Show 95% CI ranges for calculated values in academic papers
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "An infinity symbol balanced on a coin, black outline on white."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "International Campaign to End War and Disease"
        url: https://warondisease.org

website:
  title: "Wishonia's Wager: Any Finite Action Is Rational When the Stakes Are Infinite"
  description: "A reconstruction of Pascal's Wager with its defects removed. Two propositions cannot be disproven: that a conscious being may suffer without end, and that it may flourish without end. Both carry nonzero probability and infinite magnitude, so any finite action that shifts probability from the first toward the second has unbounded expected value. Unlike Pascal's, the wagered action is empirical, not theological: funding the clinical trials that extend healthy lifespan and modify conscious experience."
  site-url: https://manual.warondisease.org/knowledge/proof/wishonias-wager.html
  favicon: assets/icons/wishonias-wager-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [International Campaign to End War and Disease](https://warondisease.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/wishonias-wager.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "The 1% Treaty"
        href: https://manual.warondisease.org/knowledge/solution/1-percent-treaty.html
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

