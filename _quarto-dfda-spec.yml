project:
  type: website
  output-dir: _site/dfda-spec
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "🔬"
  index-source: knowledge/appendix/dfda-spec-paper.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  pdf-output-file: dfda-spec-paper.pdf
  netlify-site-id: "01e9af64-b6d0-48ee-8c3d-43994745ac3f"
  netlify-cname: "dfda-spec-warondisease-org.netlify.app"
  show-confidence-intervals: true  # Show 95% CI ranges for calculated values in academic papers
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "Pill/capsule inside a magnifying glass."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The Decentralized FDA Protocol: Two-Stage Validation (RWE → Pragmatic Trials)"
  description: 'We present the Predictor Impact Score (PIS), a novel composite metric operationalizing Bradford Hill causality criteria for automated signal detection from aggregated N-of-1 observational studies. Combined with pragmatic trial confirmation (based on evidence from 108+ embedded trials), this two-stage framework would generate validated outcome labels at 44.1x lower cost than traditional Phase III trials. This enables continuous, population-scale pharmacovigilance and precision dosing recommendations.'
  site-url: https://dfda-spec.warondisease.org
  favicon: assets/icons/dfda-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/dfda-spec-paper.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Prototype"
        href: https://dfda.earth
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

