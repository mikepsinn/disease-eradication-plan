project:
  type: website
  output-dir: _site/humanity-v-government
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "⚖️"
  index-source: knowledge/appendix/humanity-v-government.qmd
  redirect-from: https://humanity-v-government.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  netlify-site-id: ""  # TODO: create Netlify site and add ID
  netlify-cname: "humanity-v-government-warondisease-org.netlify.app"
  show-confidence-intervals: true
  concept-terms:
    - term: "Negligent Mass Homicide"
      manual-target: knowledge/appendix/humanity-v-government.qmd
  favicon-prompt: "A scales-of-justice icon with one side weighted down by skulls and the other holding a single pill, in stark black and white retro-academic style"

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The People of Earth v. Their Governments"
  description: "An indictment for negligent mass homicide separating historical body counts from forward-looking treaty-settlement exposure, with a 1% military reallocation as the only remedy commensurate with the offense."
  site-url: https://manual.warondisease.org/knowledge/appendix/humanity-v-government.html
  favicon: assets/icons/humanity-v-government-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/humanity-v-government.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

