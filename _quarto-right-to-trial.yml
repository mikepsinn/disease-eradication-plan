project:
  type: website
  output-dir: _site/right-to-trial
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "⚖️"
  index-source: knowledge/appendix/right-to-trial-fda-upgrade-act.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  pdf-output-file: right-to-trial-fda-upgrade-act.pdf
  netlify-site-id: "f0cfd162-dc07-474f-9b19-367ce1c1616f"
  netlify-cname: "right-to-trial-warondisease-org.netlify.app"
  show-confidence-intervals: false  # Legislative text, not academic paper
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A gavel with a medical cross/caduceus symbol."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "Right to Trial & FDA Upgrade Act"
  description: 'Act to modernize medical research and treatment access through an open-source FDA.gov v2, giving patients the right to participate in trials.'
  site-url: https://right-to-trial.warondisease.org
  favicon: assets/icons/dih-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/right-to-trial-fda-upgrade-act.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "dFDA Protocol"
        href: https://dfda-spec.warondisease.org
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

