project:
  type: website
  output-dir: _site/survey-to-end-war-and-disease
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "🗳️"
  index-source: knowledge/strategy/survey-to-end-war-and-disease.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  show-confidence-intervals: true
  favicon-prompt: "A ballot box icon with a ballot slip shaped like a pill entering the slot, in stark black and white retro-academic style"

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "International Campaign to End War and Disease"
        url: https://warondisease.org

website:
  title: "The Survey to End War and Disease"
  description: "Five questions that, if a majority of humans answered them, could put humanity on a trajectory to end war and disease."
  site-url: https://manual.warondisease.org/knowledge/strategy/survey-to-end-war-and-disease.html
  favicon: favicon.ico
  page-navigation: true
  page-footer:
    left: "© 2026 [International Campaign to End War and Disease](https://warondisease.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/survey-to-end-war-and-disease.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

