# 100-word executive summary
foundation_summary_100_words: "The Decentralized Institutes of Health proposes a campaign to pass an international treaty redirecting 1% of global military spending ($27.2B annually) to pragmatic clinical trials and decentralized drug assessment. Campaign budget of $1.02B (structured as success-contingent VICTORY Bonds) will fund lobbying exceeding pharmaceutical industry spend and a global referendum reaching 208M verified voters. The intervention achieves exceptional cost-effectiveness at $0.84 per DALY - 105× better than bed nets. Projected impact: 184.6M lives saved, 4.83B DALYs averted, and $11 trillion in economic value over 13 years. The model is proven by the RECOVERY trial (15,000 patients, $500/patient, 1M lives saved)."

# 250-word executive summary
foundation_summary_250_words: "The Decentralized Institutes of Health seeks funding to establish a global treaty redirecting 1% of military spending ($27.2B/year) to pragmatic clinical trials, achieving exceptional cost-effectiveness of $0.84 per DALY - 105× better than insecticide-treated bed nets ($89/DALY), the gold standard for global health interventions.\n\n**The Problem:** Current regulatory barriers and clinical trial inefficiencies cause 184.6M preventable deaths over 13 years, 4.83B DALYs lost, and $11 trillion in economic losses. Traditional clinical trials cost $41K per patient - 82× higher than necessary, limiting treatment access for billions.\n\n**The Solution:** A treaty-funded system redirecting $27.2B annually from military to medical research. Pragmatic trials reduce costs 82× (to $500/patient) while maintaining scientific rigor. The Decentralized FDA (dFDA) automates trial enrollment from electronic health records, eliminating the 13-year efficacy lag that currently costs 7.94B DALYs.\n\n**Funding Request:** $1.02B campaign budget to achieve treaty ratification, structured as success-contingent VICTORY Bonds (paid only upon treaty passage). Includes $650M for lobbying (exceeding pharmaceutical industry's $300M/year) and $288M for global referendum reaching 208M verified voters.\n\n**Proven Model:** The RECOVERY trial demonstrated this approach works - 15,000 COVID patients enrolled at $500/patient (82× cheaper), discovering dexamethasone treatment that saved 1M lives globally.\n\n**Impact:** 184.6M lives saved, 4.83B DALYs averted, $11 trillion economic value generated over 13 years. Each $1 invested generates $2,659 annually in perpetual health funding - a 2,659× annual leverage ratio unprecedented in global health."

