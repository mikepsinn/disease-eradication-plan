# Historical precedent - RECOVERY trial
foundation_evidence_recovery: "**RECOVERY Trial (2020-2021):** Pragmatic trial enrolled 15,000 COVID patients at $500/patient (82× cheaper than traditional $41K/patient cost), discovered dexamethasone treatment saving 1M lives globally. Proves pragmatic trial model works at scale with dramatic cost reduction and life-saving outcomes."

# Historical precedent - Smallpox eradication
foundation_evidence_smallpox: "**Smallpox Eradication (1967-1980):** International cooperation eradicated disease killing 300M+ people in 20th century. Demonstrates possibility of global coordination on health emergencies and massive returns from public health investment ($300M campaign preventing $1B+ annual costs)."

