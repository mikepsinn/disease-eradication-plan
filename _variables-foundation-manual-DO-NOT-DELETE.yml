# One-sentence pitch for grant proposal cover letters
foundation_pitch: "The Decentralized Institutes of Health seeks funding to establish a global treaty redirecting 1% of military spending ($27.2B/year) to pragmatic clinical trials, achieving cost-effectiveness of $0.84 per DALY - 105× better than bed nets."

# Problem statement - disease burden
foundation_problem_statement: "Current regulatory barriers and clinical trial inefficiencies cause 184.6M preventable deaths over 13 years, 4.83B DALYs lost, and $11 trillion in economic losses. The cost to conduct clinical trials is 82× higher than necessary, limiting treatment access for billions."

# Solution statement
foundation_solution_statement: "The 1% Treaty redirects $27.2B annually from military to medical research, funding pragmatic trials that reduce costs by 82× (from $41K to $500 per patient). The Decentralized FDA (dFDA) automates trial enrollment from electronic health records, eliminating efficacy lags that cost 7.94B DALYs."

# Funding request
foundation_funding_request: "$1.02B campaign funding to achieve treaty ratification, unlocking $27.2B annually in perpetuity. Campaign budget includes $650M for lobbying (exceeding pharmaceutical industry spend of $300M/year) and $288M for global public referendum reaching 208M verified voters."

# Primary impact metric for foundations
foundation_primary_impact: "**Cost per DALY: $0.84** (105× more cost-effective than bed nets at $89/DALY, the gold standard for global health interventions)"

