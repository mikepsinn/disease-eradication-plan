project:
  type: website
  output-dir: _site/1-percent-treaty
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "📜"
  index-source: knowledge/solution/1-percent-treaty.qmd
  redirect-from: https://1-percent-treaty.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  netlify-site-id: ""  # TODO: create Netlify site and add ID
  netlify-cname: "1-percent-treaty-warondisease-org.netlify.app"
  show-confidence-intervals: true
  concept-terms:
    - term: "1% Treaty"
      manual-target: knowledge/solution/1-percent-treaty.qmd
    - term: "1 Percent Treaty"
      manual-target: knowledge/solution/1-percent-treaty.qmd
  favicon-prompt: "A scroll of parchment bearing a single bold 1% mark, sealed with a wax stamp depicting a dove, in stark black and white retro-academic style"

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "International Campaign to End War and Disease"
        url: https://warondisease.org

website:
  title: "The 1% Treaty"
  description: "Your governments possess nuclear weapons sufficient to end civilization 122 times but have not cured Alzheimer's once. This treaty asks them to be 1% more rational."
  site-url: https://manual.warondisease.org/knowledge/solution/1-percent-treaty.html
  favicon: assets/icons/1-percent-treaty-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [International Campaign to End War and Disease](https://warondisease.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/1-percent-treaty.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

