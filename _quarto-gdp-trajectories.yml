project:
  type: website
  output-dir: _site/gdp-trajectories
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "📉"
  index-source: knowledge/economics/gdp-trajectories.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  pdf-output-file: gdp-trajectories-paper.pdf
  netlify-site-id: "7459777b-36c9-45ef-9307-f47434d0acc2"
  netlify-cname: "gdp-trajectories-warondisease-org.netlify.app"
  show-confidence-intervals: true
  concept-terms:
    - term: "Destructive Economy"
      manual-target: knowledge/economics/gdp-trajectories.qmd
      aliases:
        - "Parasitic Economy"
        - "GDP Trajectories"
  favicon-prompt: "A fork in a road, one path ascending to stars, the other descending into flames."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "Choose Your Own Earth: A World Without the Political Dysfunction Tax, or Terminal Parasitic Load in 15 Years"
  description: "Your destructive economy (military spending plus cybercrime) is already 11.5% of GDP and growing faster than your productive economy. At current rates, it reaches the Soviet collapse threshold in 8 years and exceeds productive output in 15. This paper models two GDP trajectories: the optimized path under military-to-medical reallocation, and the default path to civilizational collapse."
  site-url: https://gdp-trajectories.warondisease.org
  favicon: assets/icons/gdp-trajectories-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/gdp-trajectories-paper.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "1% Treaty"
        href: https://1-pct-treaty-impact.warondisease.org
      - text: "Peace Dividend"
        href: https://manual.warondisease.org/knowledge/economics/peace-dividend.html
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

