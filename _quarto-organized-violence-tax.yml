project:
  type: website
  output-dir: _site/organized-violence-tax
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "💣"
  index-source: knowledge/problem/cost-of-war.qmd
  redirect-from: https://organized-violence-tax.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org
  netlify-site-id: ""
  netlify-cname: ""
  show-confidence-intervals: true
  concept-terms:
    - term: "Organized Violence Tax"
      manual-target: knowledge/problem/cost-of-war.qmd
  favicon-prompt: "Organized violence tax"

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The Organized Violence Tax"
  description: 'Quantifying the compound cost of war since 1900: 310 million dead, $1.48 quadrillion in historical costs, and a 23x income multiple lost to eight compounding channels of destruction.'
  site-url: https://manual.warondisease.org/knowledge/problem/cost-of-war.html
  favicon: assets/icons/organized-violence-tax-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/organized-violence-tax.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

