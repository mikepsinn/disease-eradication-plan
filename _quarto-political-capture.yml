project:
  type: website
  output-dir: _site/political-capture
  execute-dir: project
  resources:
    - assets/
    - _redirects
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  netlify-site-id: "7daf95c9-506f-4cb9-99e3-2f0f9477f816"
  index-source: knowledge/appendix/political-capture-cost-analysis.qmd
  target-url: https://manual.WarOnDisease.org  # For cross-site link rewriting

profiles:
  default:
    dotenv:
      allowEmptyValues: true

website:
  title: "The Price of Political Change: A Cost-Benefit Framework for Policy Incentivization"
  description: "When critics dismiss policy proposals as \"politically impossible,\" they implicitly claim the cost of achieving political change exceeds its benefits. This paper develops a framework for quantifying political reform investment costs and comparing them to policy benefits, demonstrating that for high-value reforms, even maximum engagement scenarios yield positive expected value."
  site-url: https://political-capture.warondisease.org
  favicon: assets/icons/favicon.png  # TODO: Create political-capture-favicon.png
  page-navigation: true
  navbar:
    left:
      - text: "Paper"
        href: /
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /political-capture-cost-analysis.pdf
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "References"
        href: /#references
      - text: "DIH"
        href: https://dih.earth
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

