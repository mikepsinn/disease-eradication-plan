project:
  type: website
  output-dir: _site/us-efficiency-audit
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations-us-efficiency-audit.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "📊"
  index-source: knowledge/appendix/us-efficiency-audit.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "9a8ec013-54cd-4b7a-9364-fa13dc46bd92"
  netlify-cname: "us-efficiency-audit-warondisease-org.netlify.app"
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "Bar chart with efficiency arrow trending upward, minimalist government building silhouette."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "United States Efficiency Audit"
  description: 'Systems audit estimating an annual U.S. efficiency gap of $4.90T, with $2.45T recoverable at OECD-median performance across direct spending waste, compliance burden, policy-induced GDP loss, and system inefficiency.'
  site-url: https://us-efficiency-audit.warondisease.org
  favicon: assets/icons/us-efficiency-audit-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/us-efficiency-audit.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations-us-efficiency-audit.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

