project:
  type: book
  output-dir: _manual-paperback/warondisease
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/

# Custom fields for render-quarto.py
dih-render:
  index-source: index-manual.qmd
  show-confidence-intervals: false
  docx-output-file: "How-to-End-War-and-Disease-Paperback.docx"
  favicon-prompt: "A white SKULL with a prohibition sign (red circle with diagonal line) through it and black outlines"
  strip-bib-fields: [abstract, note]

# Podcast-specific overrides (used by generate_audiobook.py RSS generation)
dih-podcast:
  author: "WISHONIA"
  podcast-description: |
    Get 443 Years of Clinical Research Done in 36, Avoid the Apocalypse, and Make Humanity Filthy Rich Through the Magic of Legal Bribery.
    Your choice to listen is the highest-value decision any human has ever made.
    You are about to prevent 10.7 billion deaths, eliminate 1.93 quadrillion hours
    of human suffering, and prevent the apocalypse as a bonus.

    I started watching your planet in 1945 when you split the atom. "Atom" comes
    from your Greek word meaning "unable to be cut," so naturally, you cut it. I
    assumed you were trying to unlock unlimited free energy. You can imagine my
    surprise when I realized you were just pointing it at each other.

    150,000 of you permanently stop every 24 hours from diseases that are basically
    just bugs in your meat software. Your chance of dying from terrorism: 1 in 30
    million. Your chance of dying from disease: 100%. If cancer had oil reserves,
    you would have cured it by 2003.

    This book teaches humanity to redirect 1% of the murder budget to medicine.
    It's like weaning a baby off eating paint chips. You can't just take away all
    the paint chips at once. They'll cry. You have to gradually replace paint chips
    with food until they forget paint chips were ever an option. Nobody has to
    become a better person. You just point everyone's greed at diseases instead of
    each other.
  description-suffix: "Click a glowing rectangle. 15 seconds. 38 lives saved + 2,018 years of suffering prevented \U0001F449\U0001F3FF https://warondisease.org"

book:
  title: 'How to End War and Disease'
  subtitle: "The Complete Idiot's Guide to Legally Bribing Your Way to Utopia"
  author:
    - name: Mike P. Sinn
      email: m@warondisease.org
      orcid: 0009-0006-0212-1094
      affiliations:
        - name: "Institute for Accelerated Medicine"
          url: https://acceleratedmedicine.org
  description: 'Get 443 Years of Clinical Research Done in 36, Avoid the Apocalypse, and Make Humanity Filthy Rich Through the Magic of Legal Bribery'
  site-url: https://manual.WarOnDisease.org
  chapters:
    - text: "How to End War and Disease (for Busy People)"
      href: index.qmd

    - part: "The Problem"
      chapters:
        # CUT: problem.qmd - overview chapter that previews all sub-chapters; redundant in sequential reading
        # CUT: cost-of-war.qmd - key stats already in peace-dividend.qmd (itemized table, multipliers) and 1-percent-treaty.qmd; "war is expensive" is not a non-obvious argument
        # CUT: cost-of-disease.qmd - "disease kills people" is not news; $397T DALY argument moved to health-dividend.qmd
        - knowledge/problem/nih-fails-2-institute-health.qmd
        - knowledge/problem/untapped-therapeutic-frontier.qmd
        - knowledge/problem/fda-is-unsafe-and-ineffective.qmd
        - knowledge/problem/unrepresentative-democracy.qmd
        - knowledge/economics/central-banks.qmd
        - knowledge/problem/genetic-slavery.qmd

    - part: "The Solution"
      chapters:
        # CUT: solution.qmd - overview that previews all solution sub-chapters; redundant in sequential reading
        - knowledge/solution/1-percent-treaty.qmd
        - knowledge/solution/dih.qmd
        - knowledge/solution/wishocracy.qmd
        - knowledge/solution/dfda.qmd
        - knowledge/solution/aligning-incentives.qmd
        - knowledge/solution/incentive-alignment-bonds.qmd

    - part: "For Skeptics"
      chapters:
        # CUT: proof.qmd - overview that previews proof sub-chapters; redundant in sequential reading
        - knowledge/proof/body-as-repairable-machine.qmd
        # CUT: futures.qmd - 37-line intro to moronia/wishonia; those chapters stand alone
        - knowledge/futures/moronia.qmd
        - knowledge/futures/wishonia.qmd
        - knowledge/appendix/faq.qmd

    - part: "The Plan"
      chapters:
        - knowledge/strategy/roadmap.qmd
        # CUT: election-law.qmd - operational detail for campaign staff
        # REMOVED: Merged into knowledge/solution/incentive-alignment-bonds.qmd
        # - knowledge/economics/victory-bonds.qmd
        # CUT: legislation-package.qmd - draft bill text, nobody reads recreationally
        - knowledge/strategy/global-referendum.qmd
        # CUT: ai-coordination-army.qmd - technical AI deployment instructions, not essential for core argument
        # REMOVED: Merged into knowledge/solution/aligning-incentives.qmd defense section
        # - knowledge/strategy/co-opting-defense-contractors.qmd
        - knowledge/appendix/treaty-feasibility.qmd

    - part: "Economics & Finance"
      chapters:
        - knowledge/economics/peace-dividend.qmd
        - knowledge/economics/health-dividend.qmd
        - knowledge/economics/financial-plan.qmd
        # CUT: campaign-budget.qmd - granular budget line items
        # CUT: investor-risk-analysis.qmd - only relevant to actual investors

    - part: "Operations Manual"
      chapters:
        - knowledge/strategy/nonprofit-coalition-strategy.qmd
        - knowledge/legal/legal-framework.qmd
        - knowledge/appendix/recruitment-and-propaganda-plan.qmd

    - knowledge/appendix/conclusion.qmd

    - part: "References"
      chapters:
        # CUT: recovery-trial.qmd - key stats already in FDA, dFDA, proof, and health-dividend chapters
        # CUT: real-world-evidence-historical-success.qmd - pre-1962 data already covered in FDA chapter
        # CUT: papers.qmd - just links to websites, useless in print
        - knowledge/references.qmd
        - knowledge/appendix/copyright.qmd
        # - knowledge/appendix/back-cover.qmd

# Remove "Appendix" prefix
language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

profiles:
  default:
    dotenv:
      allowEmptyValues: true

execute:
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  fig-path: "knowledge/figures/"
  echo: false

jupyter: dih-project-kernel

