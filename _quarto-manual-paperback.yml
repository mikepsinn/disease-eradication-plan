format:
  epub:
    # EPUB/Kindle format - same trimmed chapter list as paperback
    filters:
      - scripts/filters/epub-transforms.lua
    output-file: "How-to-End-War-and-Disease.epub"
    epub-cover-image: assets/cover/book-cover-3.jpg
    html-math-method:
      method: webtex
      url: "https://latex.codecogs.com/svg.latex?"
    css: epub-math.css
    toc: false
    epub-chapter-level: 2
    echo: false
    number-sections: false
    keep-ipynb: false
  docx:
    output-file: "How-to-End-War-and-Disease-Paperback.docx"
    author:
      - "By Wishonia"
      - "Translated by Mike P. Sinn"
    fig-format: png
    toc: true
    toc-depth: 1
    number-sections: false
  pdf:
    output-file: "How-to-End-War-and-Disease-Paperback.pdf"
    documentclass: report
    classoption: [twoside]
    institute: "Institute for Accelerated Medicine"
    echo: false
    fig-format: png
    toc: false
    number-sections: false
    colorlinks: false  # Print-friendly: no colored links
    link-citations: true
    date: ""
    author: "Wishonia (translated by Mike P. Sinn)"
    include-in-header:
      - callout-bw.tex
      - institute-header.tex
      - text: |
          % Suppress default title page (we use a custom cover image instead)
          \renewcommand{\maketitle}{}
      - text: |
          % Align page content to top instead of vertically justifying
          % (prevents big gaps between sections when images float to next page)
          \raggedbottom
      - text: |
          \paperurl{https://manual.WarOnDisease.org}
      - text: |
          % Use Arabic numerals for appendix chapters
          \usepackage{etoolbox}
          \patchcmd{\appendix}{\@Alph}{\@arabic}{}{}
      - text: |
          % KDP 7x10 trim size
          % Note: actual trim is set via geometry below
          % Add "For appendices, detailed calculations, and full references visit manual.WarOnDisease.org" note
    geometry:
      - paperwidth=7in
      - paperheight=10in
      - top=0.5in
      - bottom=0.75in
      - inner=0.875in  # KDP minimum gutter for 700+ pages
      - outer=0.5in
    filters: [assets/filters/live-version-note.lua]
