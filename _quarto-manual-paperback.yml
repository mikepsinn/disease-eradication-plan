format:
  pdf:
    output-file: "How-to-End-War-and-Disease-Paperback.pdf"
    documentclass: report
    institute: "Institute for Accelerated Medicine"
    echo: false
    toc: true
    toc-depth: 2
    number-sections: false
    colorlinks: false  # Print-friendly: no colored links
    link-citations: true
    date: ""
    author: "WISHONIA (translated by Mike P. Sinn)"
    include-in-header:
      - callout-bw.tex
      - institute-header.tex
      - text: |
          \paperurl{https://manual.WarOnDisease.org}
      - text: |
          % Use Arabic numerals for appendix chapters
          \usepackage{etoolbox}
          \patchcmd{\appendix}{\@Alph}{\@arabic}{}{}
      - text: |
          % KDP 7x10 trim size
          % Note: actual trim is set via geometry below
          % Add "For appendices, detailed calculations, and full references visit manual.WarOnDisease.org" note
    geometry:
      - paperwidth=7in
      - paperheight=10in
      - top=0.75in
      - bottom=0.75in
      - left=0.75in
      - right=0.75in
    include-before-body:
      - text: |
          \thispagestyle{empty}
          \newgeometry{margin=0pt}
          \noindent\includegraphics[width=\paperwidth,height=\paperheight]{assets/cover/book-cover-3.jpg}
          \restoregeometry
          \newpage
