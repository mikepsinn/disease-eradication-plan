project:
  type: website
  output-dir: _site/political-dysfunction-tax
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "💸"
  index-source: knowledge/appendix/political-dysfunction-tax.qmd
  redirect-from: https://political-dysfunction-tax.warondisease.org
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "1c74b376-7837-436e-b57b-8579b7a1939e"
  netlify-cname: "political-dysfunction-tax-warondisease-org.netlify.app"
  show-confidence-intervals: true  # Show 95% CI ranges for calculated values in academic papers
  concept-terms:
    - term: "Political Dysfunction Tax"
      manual-target: knowledge/problem/unrepresentative-democracy.qmd
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "Political dysfunction tax"

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The Political Dysfunction Tax"
  description: 'Quantifying the gap between current global governance and theoretical maximum welfare, estimating a 31-53% efficiency score and $97 trillion in annual opportunity costs.'
  site-url: https://manual.warondisease.org/knowledge/appendix/political-dysfunction-tax.html
  favicon: assets/icons/political-dysfunction-tax-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/political-dysfunction-tax.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

