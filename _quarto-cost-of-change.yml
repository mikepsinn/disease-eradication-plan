project:
  type: website
  output-dir: _site/cost-of-change
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "💵"
  index-source: knowledge/appendix/cost-of-change-analysis.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "7daf95c9-506f-4cb9-99e3-2f0f9477f816"
  netlify-cname: "cost-of-change-warondisease-org.netlify.app"
  show-confidence-intervals: true  # Show 95% CI ranges for calculated values in academic papers
  concept-terms:
    - term: "Price of Political Change"
      manual-target: knowledge/solution/incentive-alignment-bonds.qmd
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A dollar sign with a change/transformation arrow."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The Price of Political Change: A Cost-Benefit Framework for Policy Incentivization"
  description: "What's the maximum cost to achieve any policy change through legal democratic channels? $25B for the US, $200B globally. For high-value reforms like military-to-health reallocation, this yields ROI exceeding 400,000:1."
  site-url: https://manual.warondisease.org/knowledge/appendix/cost-of-change-analysis.html
  favicon: assets/icons/favicon.png  # TODO: Create cost-of-change-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](https://manual.warondisease.org/knowledge/appendix/cost-of-change-analysis.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

