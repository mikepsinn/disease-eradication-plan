language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

bibliography: references.bib
csl: nature-annotated.csl

jupyter: dih-project-kernel

format:
  html:
    lightbox: auto
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: false
    toc: true
    toc-depth: 3
    css:
      - styles.css
      - economics-overrides.css
    citation-hover: true
    code-fold: true
    link-citations: true
    smooth-scroll: true
    code-tools: false
    filters: [assets/filters/live-version-note.lua, scripts/filters/strip-snippet-markers.lua]
  pdf:
    output-file: "i-am-retarded.pdf"
    documentclass: article
    institute: "International Campaign to End War and Disease"
    echo: false
    toc: true
    toc-depth: 3
    number-sections: false
    colorlinks: true
    link-citations: true
    include-in-header:
      - callout-bw.tex
      - institute-header.tex
      - text: |
          \paperurl{https://manual.warondisease.org/knowledge/problem/i-am-retarded.html}
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    date: ""
    filters: [assets/filters/live-version-note.lua]
