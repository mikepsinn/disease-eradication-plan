project:
  type: website
  output-dir: _site/i-am-retarded
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - robots.txt
    - llms.txt
  render:
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "🧠"
  index-source: knowledge/problem/i-am-retarded.qmd
  # No subdomain: the paper lives at manual.warondisease.org/knowledge/problem/i-am-retarded.html
  # This YAML exists for standalone PDF/EPUB generation for Zenodo distribution only.
  show-confidence-intervals: true
  favicon-prompt: "A simple black and white icon of a human brain with a question mark overlaid, minimalist line art."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "International Campaign to End War and Disease"
        url: https://warondisease.org

website:
  title: "I Am Retarded"
  description: "There is no line between smart people and the other kind. There is a ladder, from snails up to perfect logic, and every human who ever lived is bunched together near the bottom. A large fraction of what you believe, voted for, and are angry about is probably wrong. This chapter proves it, kindly, before the book asks you to change your mind."
  favicon: assets/icons/book-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2026 [International Campaign to End War and Disease](https://warondisease.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/i-am-retarded.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "The 1% Treaty"
        href: https://manual.warondisease.org/knowledge/solution/1-percent-treaty.html
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

