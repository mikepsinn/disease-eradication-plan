jupyter: dih-project-kernel

format:
  html:
    lightbox: auto
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: true
    toc: true
    toc-depth: 3
    # Grid layout for proper sidebar positioning
    # See: https://quarto.org/docs/output-formats/page-layout.html#grid-customization
    grid:
      body-width: 800px
      sidebar-width: 0px
      margin-width: 250px
      gutter-width: 1.5rem
    css:
      - styles.css
      - economics-overrides.css
    include-before-body:
      - file: assets/html/page-loader.html
    include-after-body:
      - file: assets/html/site-enhancements-loader.html
    include-in-footer:
      - file: assets/html/generated-footer.html
      - text: |
          <p style="text-align: center; margin: 0.5rem 0; font-size: 0.85rem; color: #8b7355;">
            <strong>Download:</strong>
            <a href="/obg-framework-paper.pdf" style="color: #8b7355;">PDF</a>
          </p>
    include-in-header:
      - text: |
          <!-- Icons (project-specific) -->
          <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/dih-favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/dih-favicon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/dih-apple-touch-icon.png">
          <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/dih-android-chrome-192x192.png">
          <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/dih-android-chrome-512x512.png">
      - file: assets/html/google-analytics.html
      - file: assets/html/hypothesis.html
      - file: assets/html/fonts-preload.html
    citation-hover: true
    code-fold: true
    link-citations: true
    smooth-scroll: true
    code-tools: false
  pdf:
    output-file: "obg-framework-paper.pdf"
    documentclass: article
    institute: "Institute for Accelerated Medicine"
    echo: false
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    link-citations: true
    include-in-header:
      - callout-bw.tex
      - institute-header.tex
      - text: |
          \paperurl{https://obg.warondisease.org}
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    date: ""
