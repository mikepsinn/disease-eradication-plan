      url: "https://paper.obg.dih.earth"
      status: pending
    preprints:
      - platform: zenodo
        status: pending
        url: ""
        doi: ""
      - platform: ssrn
        status: pending
        url: ""
    journals:
      - name: "Journal of Public Economics"
        tier: 1
        status: target
        url: ""
      - name: "Journal of Policy Analysis and Management"
        tier: 2
        status: target
        url: ""

# Remove "Appendix" prefix
language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

# Bibliography: .bib generated from knowledge/references.qmd (source data)
# Regenerate: python scripts/generate-everything-parameters-variables-calculations-references.py
bibliography: references-obg.bib
csl: nature-annotated.csl  # Renders 'abstract' field (quotes) in bibliography

jupyter: dih-project-kernel

format:
  html:
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: true
    toc: true
    toc-depth: 3
    # Grid layout for proper sidebar positioning
    # See: https://quarto.org/docs/output-formats/page-layout.html#grid-customization
    grid:
      body-width: 800px
      sidebar-width: 0px
      margin-width: 250px
      gutter-width: 1.5rem
    css:
      - styles.css
      - economics-overrides.css
    include-before-body:
      - file: assets/html/page-loader.html
    include-after-body:
      - text: |
          <script>
            (function() {
              var offset = document.querySelector('meta[name="quarto:offset"]')?.getAttribute('content') || '';
              var script = document.createElement('script');
              script.src = (offset ? offset : '') + 'assets/js/site-enhancements.js';
              document.body.appendChild(script);
            })();
          </script>
    page-footer:
      left: "© 2025 [Mike P. Sinn](https://mikesinn.com) and Contributors | Working Draft v0.9"
      center: "[CC BY-NC 4.0 license](https://creativecommons.org/licenses/by-nc/4.0/)"
      right: "[DIH.earth](https://dih.earth)"
    include-in-footer:
      - text: |
          <div style="text-align: center; padding: 1rem; border-top: 1px solid #d4c5b9; margin-top: 3rem; color: #8b7355; font-size: 0.9rem;">
            <p style="margin: 0.5rem 0;">
              © 2025 <a href="https://mikesinn.com" style="color: #8b7355;">Mike P. Sinn</a> |
              <a href="https://creativecommons.org/licenses/by-nc/4.0/" style="color: #8b7355;">CC BY-NC 4.0 license</a> |
              <a href="https://dih.earth" style="color: #8b7355;">DIH.earth</a>
            </p>
            <p style="margin: 0.5rem 0; font-size: 0.85rem;">
              <a href="https://dih.earth" style="color: #8b7355;">Decentralized Institutes of Health</a>
            </p>
            <p style="margin: 0.5rem 0; font-size: 0.85rem;">
              <strong>Download:</strong>
              <a href="/obg-framework-paper.pdf" style="color: #8b7355;">📕 PDF</a>
            </p>
          </div>
    include-in-header:
      - text: |
          <!-- Icons -->
          <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/dih-favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/dih-favicon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/dih-apple-touch-icon.png">
          <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/dih-android-chrome-192x192.png">
          <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/dih-android-chrome-512x512.png">

          <!-- Google Analytics -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-8PZYCKQBTY"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-8PZYCKQBTY');
          </script>

          <!-- Hypothesis for inline comments -->
          <script src="https://hypothes.is/embed.js" async></script>

          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  pdf:
    output-file: "obg-framework-paper.pdf"
    documentclass: article
    echo: false
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    date: ""
    variables:
      author: "Mike P. Sinn"
      affiliation: "Decentralized Institutes of Health"
