project:
  type: website
  output-dir: _site/obg
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations-obg.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "📊"
  index-source: knowledge/appendix/optimal-budget-generator-spec.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "123f44a0-d5b6-4ff3-9375-1f7e47fca053"
  netlify-cname: "obg-warondisease-org.netlify.app"
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A pie chart with optimization arrows pointing upward."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "The Optimal Budget Generator: A Causal Inference Protocol for Maximizing Median Health and Wealth Through Public Goods Funding"
  description: "The Optimal Budget Generator (OBG) uses causal inference, diminishing returns modeling, and cost-effectiveness evidence to determine optimal public goods funding levels that maximize two welfare metrics: real after-tax median income growth and median healthy life years. For each spending category, OBG estimates an Optimal Spending Level (OSL) and produces a gap analysis showing where current government budgets are over- or underfunded relative to evidence-based benchmarks. The Budget Impact Score (BIS) measures confidence in each recommendation based on the quality of causal evidence."
  site-url: https://obg.warondisease.org
  favicon: assets/icons/dih-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2025 [Institute for Accelerated Medicine](https://acceleratedmedicine.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/obg-framework-paper.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations-obg.qmd
      - text: "Optimocracy"
        href: https://optimocracy.warondisease.org
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

