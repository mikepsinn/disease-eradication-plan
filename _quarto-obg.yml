project:
  type: website
  output-dir: _site/obg
  execute-dir: project
  resources:
    - assets/
    - _redirects
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "📊"
  index-source: knowledge/appendix/optimal-budget-generator-spec.qmd
  fallback-404-redirect-domain: https://manual.WarOnDisease.org  # Redirects here if path doesn't exist on this site
  netlify-site-id: "123f44a0-d5b6-4ff3-9375-1f7e47fca053"
  netlify-cname: "obg-warondisease.netlify.app"  # DNS: obg.warondisease.org -> this
  # Image generation prompts (used by scripts/images/generate-project-branding-images.ts)
  favicon-prompt: "A pie chart with optimization arrows pointing upward."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "Institute for Accelerated Medicine"
        url: https://acceleratedmedicine.org

website:
  title: "Optimal Budget Generator: Evidence-Based Budget Allocation Framework"
  description: "The Optimal Budget Generator (OBG) answers: 'How should we allocate the budget to maximize welfare?' using two metrics: real after-tax median income growth and median healthy life years. Unlike isolated spending targets, OBG generates integrated budget recommendations that account for tradeoffs between categories. The Budget Impact Score (BIS) measures confidence in each category's target."
  site-url: https://obg.warondisease.org
  favicon: assets/icons/dih-favicon.png
  page-navigation: true
  navbar:
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /obg-framework-paper.pdf
      - text: "References"
        href: /#references
      - text: "Optimocracy"
        href: https://optimocracy.warondisease.org
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

