project:
  type: website
  output-dir: _site/obg
  execute-dir: project
  resources:
    - assets/
    - _redirects
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd

# Custom fields for render-quarto.py
dih-render:
  index-source: knowledge/appendix/optimal-budget-generator-spec.qmd
  target-url: https://manual.WarOnDisease.org  # For cross-site link rewriting

profiles:
  default:
    dotenv:
      allowEmptyValues: true

website:
  title: "Optimal Budget Generator: Evidence-Based Budget Allocation Framework"
  description: "The Optimal Budget Generator (OBG) answers: 'How should we allocate the budget to maximize welfare?' Unlike isolated spending targets, OBG generates integrated budget recommendations that account for tradeoffs between categories. The Budget Impact Score (BIS) measures confidence in each category's target."
  site-url: https://paper.obg.dih.earth
  favicon: assets/icons/dih-favicon.png
  page-navigation: true
  navbar:
    left:
      - text: "Paper"
        href: /
      - text: "DIH"
        href: https://dih.earth
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /obg-framework-paper.pdf
      - text: "References"
        href: /#references
      - text: "Optimocracy"
        href: https://paper.optimocracy.org
      - text: "War on Disease"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

metadata:
  creator: "Mike P. Sinn"
  orcid: "0009-0006-0212-1094"
  primary-author: "Mike P. Sinn"
  byline: "Mike P. Sinn"
  human-author: "Mike P. Sinn"
  author-email: "mike@warondisease.org"
  author-url: "https://mikesinn.com"
  author-website: "https://mikesinn.com"
