project:
  type: website
  output-dir: _site/economics
  execute-dir: project
  resources:
    - assets/
  render:
    # Economics Analysis
    - knowledge/economics/economics.qmd # Primary economic analysis (serves as index via copy)
    - knowledge/economics/health-dividend.qmd # dFDA cost-benefit analysis
    # Essential Problem Analysis
    - knowledge/problem/nih-spent-1-trillion-eradicating-0-diseases.qmd # Budget allocation analysis (84.9% vs 3.3%)
    - knowledge/problem/untapped-therapeutic-frontier.qmd # Unexplored therapeutic space economic analysis
    # Economic Mechanism Design
    - knowledge/solution/aligning-incentives.qmd # Stakeholder economic incentive analysis
    - knowledge/solution/incentive-alignment-bonds.qmd # Financial instrument mechanism design
    # Academic Working Papers
    - knowledge/appendix/incentive-alignment-bonds-paper.qmd # IAB working paper
    - knowledge/appendix/wishocracy-paper.qmd # Wishocracy working paper
    # Feasibility Analysis
    - knowledge/appendix/treaty-feasibility.qmd # Empirical cost analysis
    # Treaty Structure
    - knowledge/legal/treaty-framework.qmd # Treaty framework with economic enforcement
    # Essential Data Sources
    - knowledge/appendix/global-government-medical-research-spending.qmd # Research vs trials spending distinction
    - knowledge/appendix/military-vs-clinical-trials-funding-imbalance.qmd # 604:1 ratio derivation
    - knowledge/appendix/global-clinical-trial-spending-by-phase.qmd # Baseline spending data
    - knowledge/appendix/clinical-trial-participants.qmd # Trial capacity baseline
    - knowledge/appendix/regulatory-mortality-analysis.qmd # Primary mortality/DALY source
    - knowledge/appendix/drug-development-cost-analysis.qmd # 105× cost increase proof
    - knowledge/appendix/real-world-evidence-historical-success.qmd # Historical validation (1883-1962)
    - knowledge/appendix/recovery-trial.qmd # Oxford RECOVERY trial cost benchmarks (82× cost reduction proof)
    # Core Economic Calculations
    - knowledge/appendix/parameters-and-calculations.qmd # ✅ AUTO-GENERATED comprehensive parameter reference
    - knowledge/appendix/peace-dividend-calculations.qmd # Peace dividend methodology breakdown
    - knowledge/appendix/dfda-cost-benefit-analysis.qmd # NPV methodology, ICER analysis
    - knowledge/appendix/economic-value-of-accelerated-treatments.qmd # Trial capacity multiplier
    # References
    - knowledge/references.qmd

profiles:
  default:
    dotenv:
      allowEmptyValues: true
  # pre-render:
  #   - python scripts/pre-render-validation.py
  # post-render:
  #   - python scripts/post-render-validation.py

website:
  title: "The 1% Treaty: Health and Economic Impact of Redirecting 1% of Global Military Spending to Pragmatic Clinical Trials"
