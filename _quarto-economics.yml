  pdf:
    output-file: "dih-economic-models.pdf"
    documentclass: report
    echo: false
    toc: true
    toc-depth: 3
    number-sections: false
    colorlinks: true
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    variables:
      title: "The 1\\% Treaty: Health and Economic Impact of Redirecting 1\\% of Global Military Spending to Pragmatic Clinical Trials"
      description: "Redirecting 1\\% of global military spending (\\$27.2B/yr) to pragmatic clinical trials advances treatment access 207 years saving 10.5B lives at \\$0.0050 per DALY and generating \\$30 quadrillion in long-run value."
