            text: "Incentive Alignment Bonds Paper"
          - href: knowledge/appendix/wishocracy-paper.qmd
            text: "Wishocracy Paper"
          - href: knowledge/references.qmd
            text: "References & Citations"
      - section: "Problem Analysis"
        contents:
          - href: knowledge/problem/nih-spent-1-trillion-eradicating-0-diseases.qmd
            text: "NIH Budget Allocation Analysis"
