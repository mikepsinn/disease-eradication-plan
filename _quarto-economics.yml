project:
  type: book
  output-dir: _site/economics
  execute-dir: project
  resources:
    - assets/

# Custom fields for render-quarto.py
dih-render:
  index-source: knowledge/economics/economics.qmd
  target-url: https://manual.WarOnDisease.org  # For cross-site link rewriting
  pdf-output-file: dih-economic-models.pdf

profiles:
  default:
    dotenv:
      allowEmptyValues: true
  # pre-render:
  #   - python scripts/pre-render-validation.py
  # post-render:
  #   - python scripts/post-render-validation.py

book:
  title: "The 1% Treaty: Health and Economic Impact of Redirecting 1% of Global Military Spending to Pragmatic Clinical Trials"
  # description: Removed to allow page-level descriptions to override for og:description
  site-url: https://impact.warondisease.org
  favicon: assets/icons/economics-favicon.png
  page-navigation: true
  chapters:
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd
    - knowledge/appendix/regulatory-mortality-analysis.qmd
    - knowledge/references.qmd
  navbar:
    right:
      - icon: file-pdf
        text: "Download PDF"
        href: /dih-economic-models.pdf
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "References"
        href: knowledge/references.qmd
      - text: "VOTE"
        href: https://warondisease.org
  sidebar:
    collapse-level: 1
    style: "floating"
    search: true
    contents:
      - section: "Academic Paper"
        contents:
          - href: index.html
            text: "The 1% Treaty: Economic Analysis"
          - href: knowledge/references.qmd
            text: "References & Citations"

      - section: "Appendices"
        contents:
          - href: knowledge/appendix/parameters-and-calculations.qmd
            text: "Parameters & Calculations"
          - href: knowledge/appendix/regulatory-mortality-analysis.qmd
            text: "Regulatory Mortality Analysis"

      - section: "Related Materials"
        contents:
          - href: https://iab.warondisease.org
            text: "IAB Working Paper →"
          - href: https://paper.wishocracy.org
            text: "Wishocracy Working Paper →"

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto  # Only re-run cells when content changes
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

metadata:
  creator: "Mike P. Sinn"
  primary-author: "Mike P. Sinn, Decentralized Institutes of Health"
  byline: "Mike P. Sinn, Decentralized Institutes of Health"
  human-author: "Mike P. Sinn"
  author-email: "mike@warondisease.org"
  author-url: "https://WarOnDisease.org"
  author-website: "https://WarOnDisease.org"
  contact: "mike@warondisease.org"
  # title: Removed - each page defines its own title in frontmatter
  # description: Removed from metadata section to allow page-level descriptions to override for og:description
  # (Book-level description is already set in the 'book' section above)
  # abstract: Removed - pages can define their own abstract in frontmatter if needed
  language: "en-US"
  subject: "Public Health, Medical Research, Peace Economics, Health Economics, Policy Reform"
  category: "Non-fiction, Public Policy, Health Economics, Peace Studies"
  keywords:
    - war-on-disease
    - 1-percent-treaty
    - medical-research
    - public-health
    - peace-dividend
    - decentralized-trials
    - dfda
    - dih
    - victory-bonds
    - health-economics
    - cost-benefit-analysis
    - clinical-trials
    - drug-development
    - regulatory-reform
    - military-spending
    - peace-economics
    - decentralized-governance
    - wishocracy
    - blockchain-governance
    - impact-investing
  version: "1.0.0"
  edition: "First Edition"
  copyright: "© 2025 Mike P. Sinn"
  copyright-year: "2025"
  license: "CC BY-NC 4.0"
  license-url: "https://creativecommons.org/licenses/by-nc/4.0/"
  rights: "Creative Commons Attribution-NonCommercial 4.0 International License"
  publisher: "WarOnDisease.org"
  publisher-url: "https://WarOnDisease.org"
  publisher-name: "Mike P. Sinn"
  publisher-email: "mike@warondisease.org"
  repo-url: "https://github.com/mikepsinn"
  issue-url: "https://github.com/mikepsinn"
  source-url: "https://github.com/mikepsinn"
  geographic-coverage: "Global"
  audience: "Policy Makers, Investors, Healthcare Professionals, Researchers"
  format: "Website"
  type: "Economic Analysis"
  genre: "Public Policy, Health Economics, Peace Studies"
  medium: "Digital"

  # Open Graph metadata (enables per-page custom OG images)
  open-graph: true
  image: "https://impact.warondisease.org/assets/icons/war-on-disease-og-1200x630.png"

# Remove "Appendix" prefix from appendix chapters
language:
  crossref-apx-prefix: ""
  section-title-appendices: ""

jupyter: dih-project-kernel

format:
  html:
    theme:
      - cosmo
    mermaid:
      theme: neutral
    echo: false
    number-sections: false
    toc: true
    toc-depth: 3
    css:
      - styles.css
      - economics-overrides.css
    page-footer:
