              <a href="https://WarOnDisease.org" style="color: #8b7355;">WarOnDisease.org</a>
            </p>
            <p style="margin: 0.5rem 0; font-size: 0.85rem;">
              <a href="https://dih.earth" style="color: #8b7355;">Decentralized Institutes of Health</a>
            </p>
            <p style="margin: 0.5rem 0; font-size: 0.85rem; border-top: 1px solid #d4c5b9; padding-top: 0.5rem; margin-top: 0.5rem;">
              <a href="/" style="color: #8b7355;">Economics</a> |
              <a href="/knowledge/appendix/parameters-and-calculations.html" style="color: #8b7355;">Calculations</a> |
