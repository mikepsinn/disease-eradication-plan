          </footer>
          <!-- Quarto Sidebar Horizontal Overlap Fix -->
          <script>
            (function() {
              // Get the Quarto offset to build correct path
              var offset = document.querySelector('meta[name="quarto:offset"]')?.getAttribute('content') || '';
              var script = document.createElement('script');
              script.src = (offset ? offset : '') + 'assets/js/quarto-sidebar-fix.js';
              document.body.appendChild(script);
            })();
          </script>
    include-in-header:
      - text: |
          <!-- Icons -->
          <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/economics-favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/economics-favicon-16x16.png">
