project:
  type: website
  output-dir: _site/joke
  execute-dir: project
  resources:
    - knowledge/data/
    - assets/
    - robots.txt
    - llms.txt
  render:
    # Paper is copied to index.qmd by render script
    - index.qmd
    - knowledge/appendix/parameters-and-calculations.qmd

# Custom fields for render-quarto.py
dih-render:
  emoji: "👕"
  index-source: knowledge/appendix/joke.qmd
  # No subdomain: the paper lives at manual.warondisease.org/knowledge/appendix/joke.html
  # This YAML exists for standalone PDF/EPUB generation for Zenodo distribution only.
  show-confidence-intervals: true
  concept-terms:
    - term: "Shirt Seed Program"
      aliases:
        - "shirt seed campaign"
        - "shirt campaign"
        - "wearable referral campaign"
        - "joke seed program"
      manual-target: knowledge/appendix/joke.qmd
  favicon-prompt: "A simple black and white icon of a T-shirt with the text 'END WAR & DISEASE' visible across the chest, in a bold sans-serif font."

profiles:
  default:
    dotenv:
      allowEmptyValues: true

author:
  - name: Mike P. Sinn
    email: m@warondisease.org
    orcid: 0009-0006-0212-1094
    affiliations:
      - name: "International Campaign to End War and Disease"
        url: https://warondisease.org

website:
  title: "On the Funniest Joke in the History of the Universe"
  description: "The funniest joke in universe history has been discovered. It takes the form of a t-shirt."
  favicon: assets/icons/joke-favicon.png
  page-navigation: true
  page-footer:
    left: "© 2026 [International Campaign to End War and Disease](https://warondisease.org) | [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    center: "[PDF](/joke-paper.pdf) | [All Papers](https://manual.warondisease.org/knowledge/papers.html)"
    right: "[VOTE](https://WarOnDisease.org)"
  navbar:
    right:
      - text: "Calculations"
        href: knowledge/appendix/parameters-and-calculations.qmd
      - text: "VOTE"
        href: https://WarOnDisease.org

execute:
  fig-path: "knowledge/figures/"
  cache: false
  freeze: auto
  daemon: 300
  daemon-restart: false
  env:
    PYTHONPATH: "."

